<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="description" content="Blended Zebra Remix — the endless black/white/red deckbuilder, retuned for the deep climb. Blend cards. Climb forever. The savanna keeps score.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e8232a'/%3E%3Cpath d='M4 6 l6 20 M11 4 l6 24 M18 4 l6 24 M25 6 l4 20' stroke='%23fff' stroke-width='3' fill='none'/%3E%3Ccircle cx='24' cy='8' r='5' fill='%23000'/%3E%3C/svg%3E">
<title>Blended Zebra Remix</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zebra Remix">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --k:#000; --w:#fff; --r:#e8232a;
  --disp:'Sora',-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  font-family:var(--disp);color:var(--w);background:var(--k)}
#app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.page{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:100%}
.hide{display:none!important}
.kick{font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.24em;color:var(--r);text-transform:uppercase}
h1{font-weight:900;font-size:clamp(34px,10vw,58px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
h1 .z{color:var(--r)}
.stripes{height:10px;background:repeating-linear-gradient(-55deg,var(--w) 0 14px,var(--k) 14px 28px);
  background-size:200% 100%;animation:stripeMove 14s linear infinite}
@keyframes stripeMove{to{background-position:-80px 0}}
.page{animation:pageIn .28s cubic-bezier(.2,.9,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}}
.btn{display:block;width:100%;padding:15px 20px;border:2px solid var(--w);background:var(--w);color:var(--k);
  font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;min-height:54px}
.btn{box-shadow:3px 3px 0 #ffffff22}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #ffffff22}
:focus-visible{outline:3px solid var(--r);outline-offset:2px}
.btn.red{background:var(--r);border-color:var(--r);color:var(--w)}
.btn.ghost{background:none;color:var(--w)}
.btn:disabled{opacity:.35}

#hud{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid #ffffff55;padding:.35em .7em;font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.06em;white-space:nowrap}
.pill b{color:var(--r)}
#hpbar{height:14px;border:2px solid var(--w);position:relative;overflow:hidden}
#hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.1em;z-index:2}

#foe{border:2px solid var(--w);padding:14px;display:flex;gap:14px;align-items:center;position:relative}
#foeArt{width:92px;height:92px;flex-shrink:0;border:2px solid var(--w);overflow:hidden;position:relative}
#foeArt .jtm{position:absolute;inset:0;background-size:cover;background-position:center}
#foeName{font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:.02em}
#foeHp{height:10px;border:1.5px solid var(--w);margin-top:6px;overflow:hidden}
#intent{font-family:var(--mono);font-weight:800;font-size:12px;margin-top:7px;color:var(--w)}
#intent b{color:var(--r)}
#foeStats{font-family:var(--mono);font-size:10px;color:#ffffff88;margin-top:4px;letter-spacing:.06em}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hitflash::after{content:'';position:absolute;inset:0;background:var(--r);animation:hflash .28s;pointer-events:none}
@keyframes hflash{0%{opacity:.55}100%{opacity:0}}
.card.played{transform:translateY(-72px) translateX(26px) rotate(9deg) scale(.65);opacity:0;transition:transform .3s cubic-bezier(.4,0,.85,.4),opacity .3s}
.card.aiPick{border-color:var(--r)!important;box-shadow:0 0 0 3px #e8232a66;animation:aiPick .32s ease-out}
@keyframes aiPick{50%{transform:translateY(-9px) scale(1.05)}}
#foe{position:relative}
.stunOrbit{position:absolute;left:14px;top:10px;width:110px;height:110px;pointer-events:none;z-index:3}
.stunOrbit i{position:absolute;left:50%;top:12%;font-size:15px;font-style:normal;animation:orbitStar 1.7s linear infinite}
.stunOrbit i:nth-child(2){animation-delay:-.85s;font-size:11px}
@keyframes orbitStar{0%{transform:translateX(-27px) scale(.8);opacity:.95}25%{transform:translateX(0) translateY(-8px) scale(1.15)}
  50%{transform:translateX(27px) scale(.8);opacity:.6}75%{transform:translateX(0) translateY(6px) scale(.55);opacity:.4}100%{transform:translateX(-27px) scale(.8);opacity:.95}}
#energy.eBump{animation:eBump .32s}
@keyframes eBump{45%{transform:scale(1.2)}}
.chip.popIn{animation:chipPop .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes chipPop{from{transform:scale(.2)}60%{transform:scale(1.3)}}
#intent.intPop{animation:chipPop .38s cubic-bezier(.2,1.6,.4,1)}
#coinFx{position:fixed;left:50%;top:36%;font-size:52px;z-index:66;pointer-events:none;animation:coinFlip .8s ease-in-out forwards}
@keyframes coinFlip{0%{transform:translate(-50%,-50%) rotateX(0) translateY(0)}
  50%{transform:translate(-50%,-50%) rotateX(900deg) translateY(-70px)}
  100%{transform:translate(-50%,-50%) rotateX(1800deg) translateY(0);opacity:0}}
.fnum{position:fixed;z-index:50;font-family:var(--mono);font-weight:800;font-size:22px;pointer-events:none;
  text-shadow:2px 2px 0 #000;animation:fnum .8s forwards}
@keyframes fnum{from{transform:translateY(0);opacity:1}to{transform:translateY(-56px);opacity:0}}
#pflash{position:fixed;inset:0;z-index:45;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,var(--r));
  opacity:0}
#pflash.on{animation:pfl .4s}
@keyframes pfl{0%{opacity:.7}100%{opacity:0}}
#turnBanner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scaleX(0);z-index:44;pointer-events:none;
  background:repeating-linear-gradient(-55deg,var(--r) 0 18px,#b5121b 18px 36px);color:var(--w);font-family:var(--mono);font-weight:800;letter-spacing:.3em;font-size:14px;
  padding:.6em 2em;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis}
#turnBanner.on{animation:tb .8s}
@keyframes tb{0%{transform:translate(-50%,-50%) scaleX(0)}18%{transform:translate(-50%,-50%) scaleX(1)}
  82%{transform:translate(-50%,-50%) scaleX(1)}100%{transform:translate(-50%,-50%) scaleX(0)}}
.cerSkip{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%);
  width:auto;min-height:38px;padding:8px 18px;font-size:11px;opacity:.5;z-index:3}
.ceremony{position:fixed;inset:0;z-index:60;background:#000000e8;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px}
.ceremony .duo{display:flex;gap:10px;align-items:center}
.ceremony .duo .card{width:110px;min-height:150px;animation:slamIn .5s cubic-bezier(.6,0,.4,1) forwards}
.ceremony .duo .card:last-child{animation-name:slamIn2}
@keyframes slamIn{60%{transform:translateX(56px) rotate(-6deg)}
  75%{transform:translateX(53px) rotate(-4deg)}90%{transform:translateX(58px) rotate(-7deg)}to{transform:translateX(56px) rotate(-6deg)}}
@keyframes slamIn2{60%{transform:translateX(-56px) rotate(6deg)}
  75%{transform:translateX(-53px) rotate(4deg)}90%{transform:translateX(-58px) rotate(7deg)}to{transform:translateX(-56px) rotate(6deg)}}
.ceremony.suck .duo .card{animation:suckL .45s cubic-bezier(.7,-.3,1,.6) forwards}
.ceremony.suck .duo .card:last-child{animation-name:suckR}
@keyframes suckL{to{transform:translateX(64px) rotate(-560deg) scale(.02);opacity:.3;filter:blur(1.5px)}}
@keyframes suckR{to{transform:translateX(-64px) rotate(560deg) scale(.02);opacity:.3;filter:blur(1.5px)}}
.ceremony .result{width:140px;animation:resultPop .5s cubic-bezier(.2,1.7,.35,1)}
@keyframes resultPop{from{transform:scale(0) rotate(-24deg)}60%{transform:scale(1.12) rotate(3deg)}}
.ceremony .zap{font-weight:900;font-size:44px;color:var(--r);animation:zapPulse .5s infinite alternate}
@keyframes zapPulse{to{transform:scale(1.25)}}
.ceremony .flashX{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
.ceremony.boom .flashX{animation:hflash .45s ease-out}
.ceremony .shock{position:fixed;left:50%;top:50%;width:12px;height:12px;border:3px solid var(--w);border-radius:50%;
  transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.ceremony.boom .shock{animation:shockOut .55s ease-out}
@keyframes shockOut{0%{opacity:1;width:12px;height:12px;border-width:6px}100%{opacity:0;width:76vw;height:76vw;border-width:1px}}
.ceremony .resultWrap{position:relative;display:flex;align-items:center;justify-content:center}
.ceremony .rays{position:absolute;width:330px;height:330px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(#ffffff12 0 7deg,transparent 7deg 20deg);animation:raySpin 9s linear infinite;
  -webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%);mask-image:radial-gradient(circle,#000 30%,transparent 70%)}
.ceremony .rays.hotR{background:repeating-conic-gradient(#e8232a26 0 7deg,transparent 7deg 20deg)}
@keyframes raySpin{to{transform:rotate(360deg)}}
.ledger,.blBar{width:100%;max-width:420px;text-align:left;font-family:var(--mono);letter-spacing:.06em;align-self:center}
.ledger{border:1.5px solid #ffffff44;padding:8px 10px;font-size:10.5px}
.ledger .lr{display:flex;justify-content:space-between;gap:8px;padding:2px 0} .ledger .lr i{font-style:normal;opacity:.5}
.ledger .lr b{color:var(--r)} .ledger .tot{border-top:1.5px solid #ffffff44;margin-top:4px;padding-top:5px;font-weight:800}
.blBar{display:flex;flex-direction:column;gap:5px} .blBar .row{display:flex;justify-content:space-between;font-weight:800;font-size:11px;letter-spacing:.12em}
.blBar .track{height:10px;border:2px solid var(--w);overflow:hidden}
.blBar .fill{height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--r) 0 6px,#b51b21 6px 12px)}
.blBar .parts,.blBar .next{font-size:9.5px;color:#ffffff88}
.giftDraft{position:fixed;inset:0;z-index:38;background:#000000ee;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;overflow-y:auto;text-align:center}
.giftDraft>:first-child{margin-top:auto} .giftDraft>:last-child{margin-bottom:auto}
.gift{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:12px 14px;border:2px solid var(--w);background:#000;color:var(--w);font:inherit;cursor:pointer;animation:giftIn .4s cubic-bezier(.2,1.6,.4,1) both}
.gift:nth-of-type(2){animation-delay:.07s} .gift:nth-of-type(3){animation-delay:.14s}
.gift.r1{border-color:var(--r)} .gift.r2{background:var(--r);border-color:var(--r);color:#000}
.gift .rt{font-family:var(--mono);font-weight:800;font-size:9px;letter-spacing:.2em} .gift .gn{font-weight:900;font-size:18px;text-transform:uppercase}
.gift .gd{font-size:12px;opacity:.85} .gift .pips{font-family:var(--mono);font-size:10px;white-space:nowrap}
@keyframes giftIn{from{transform:translateY(16px) scale(.94);opacity:0}}
#stampV{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-8deg) scale(0);z-index:55;pointer-events:none;
  border:4px solid var(--r);color:var(--r);font-weight:900;font-size:clamp(30px,9.5vw,52px);letter-spacing:.05em;
  padding:.15em .5em;text-transform:uppercase;background:#000000cc}
#stampV.on{animation:stampIn .9s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stampIn{0%{transform:translate(-50%,-50%) rotate(-6deg) scale(1.7);opacity:0}
  35%{transform:translate(-50%,-50%) rotate(-6deg) scale(1);opacity:.94}
  100%{transform:translate(-50%,-50%) rotate(-6deg) scale(1);opacity:.94}}
.ovlDeck{position:fixed;inset:0;z-index:58;background:#000000f0;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
.hoardOvl{background:#000;z-index:60}
.ovlDeck .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-width:640px;margin:0 auto}
.cinspect{display:flex;align-items:center;justify-content:center;z-index:70}
.cinspect .card{width:100%;min-height:0}
.cinspect .card .art{height:112px}
.cinspect .card .fx{font-size:13px;-webkit-line-clamp:unset;line-height:1.55;flex:none;padding-bottom:14px}
.cinspect .card .nm{font-size:15px}
.cinspect .card .stripeTag{font-size:9px}

#wipe{position:fixed;inset:0;z-index:80;pointer-events:none;transform:translateX(-102%);
  background:repeating-linear-gradient(-55deg,var(--w) 0 22px,var(--k) 22px 44px)}
#wipe.go{animation:wipeX .52s cubic-bezier(.6,0,.4,1) forwards}
@keyframes wipeX{0%{transform:translateX(-102%)}45%{transform:translateX(0)}55%{transform:translateX(0)}100%{transform:translateX(102%)}}
#foeArt .jtm{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035) translateY(-1px)}}
.quip{position:absolute;right:6px;top:-14px;z-index:5;background:var(--w);color:var(--k);border:2px solid var(--k);
  font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.04em;padding:4px 8px;white-space:nowrap;
  animation:quipIn 2.2s forwards;pointer-events:none}
@keyframes quipIn{0%{transform:scale(0) rotate(4deg)}12%{transform:scale(1) rotate(-2deg)}
  80%{opacity:1;transform:translateY(0) rotate(-2deg)}100%{opacity:0;transform:translateY(-14px) rotate(-2deg)}}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.bcell{position:relative;border:2px solid #ffffff44;height:158px;overflow:hidden}
.bcell.locked .bart{filter:brightness(.14)}
.bcell .bart{position:absolute;inset:0 0 34px 0}
.bcell .bname{position:absolute;left:0;right:0;bottom:0;height:34px;padding:3px 5px;border-top:1.5px solid #ffffff33;
  font-family:var(--mono);font-weight:800;font-size:8.5px;letter-spacing:.04em;line-height:1.4}
.bcell .bname b{color:var(--r)}
.card.recHint{box-shadow:0 0 0 2px #e8232a44;animation:recShimmer 1.6s ease-in-out infinite}

.card.pairable{outline:1px dashed #e8232a99;outline-offset:-5px}
.card.pairable .nm::before{content:'⚗ ';color:var(--r)}
.radar{font-family:var(--mono);font-weight:800;font-size:9px;letter-spacing:.1em;color:var(--r);
  border:1px solid #e8232a4d;padding:6px 8px;width:100%;max-width:640px;line-height:1.5}
.radar b{font-size:11px}
.radar.dry{color:#ffffff66;border-color:#ffffff26}
@keyframes recShimmer{0%,100%{box-shadow:0 0 0 2px #e8232a33}50%{box-shadow:0 0 0 3px #e8232a66}}
.foeHit{animation:foeHit .28s ease}
@keyframes foeHit{0%{transform:translateX(0)}18%{transform:translateX(-7px) rotate(-1.6deg) scale(1.07,.9)}
  50%{transform:translateX(4px) rotate(1.2deg) scale(.97,1.04)}100%{transform:translateX(0) scale(1)}}
.foeDie{animation:foeDie .55s cubic-bezier(.6,0,.8,.4) forwards!important}
@keyframes foeDie{to{transform:rotate(14deg) translateY(30px) scale(.8);opacity:0;filter:contrast(2)}}
.foeDie2{animation:foeDie2 .6s ease forwards!important}
@keyframes foeDie2{40%{transform:scaleY(.6) scaleX(1.15)}to{transform:scaleY(.05) scaleX(1.5) translateY(42px);opacity:0}}
.foeDie3{animation:foeDie3 .75s cubic-bezier(.5,-.3,.8,.6) forwards!important}
@keyframes foeDie3{30%{transform:translateY(-48px) rotate(-15deg)}to{transform:translateY(95px) rotate(30deg);opacity:0}}
.foeDie4{animation:foeDie4 .9s ease-in forwards!important}
@keyframes foeDie4{
  20%{transform:translate(-34px,-26px) rotate(-28deg) scale(.92)}
  40%{transform:translate(30px,-44px) rotate(24deg) scale(.8)}
  60%{transform:translate(-18px,-30px) rotate(-40deg) scale(.62)}
  to{transform:translate(6px,80px) rotate(120deg) scale(.2);opacity:0}}
.foeDie5{animation:foeDie5 1s cubic-bezier(.4,0,.7,1) forwards!important}
@keyframes foeDie5{
  30%{transform:rotate(-8deg) translateY(-6px)}
  55%{transform:rotate(74deg) translateY(34px)}
  68%{transform:rotate(66deg) translateY(26px)}
  to{transform:rotate(84deg) translateY(58px) scale(.9);opacity:0}}
.foeIn1{animation:foeIn1 .5s ease both}
@keyframes foeIn1{from{transform:translateX(70px);opacity:0}60%{transform:translateX(-6px)}to{transform:none;opacity:1}}
.foeIn2{animation:foeIn2 .55s ease both}
@keyframes foeIn2{from{transform:translateY(-70px);opacity:0}55%{transform:translateY(7px)}75%{transform:translateY(-4px)}to{transform:none;opacity:1}}
.foeIn3{animation:foeIn3 .45s ease both}
@keyframes foeIn3{from{transform:scale(.2) rotate(-14deg);opacity:0}70%{transform:scale(1.08)}to{transform:none;opacity:1}}
.lunge{animation:lunge .42s cubic-bezier(.3,.1,.3,1)}
@keyframes lunge{16%{transform:translateX(-9px) rotate(3deg) scale(.97,.94)}
  44%{transform:translateX(30px) rotate(-5deg) scale(1.04,1)}66%{transform:translateX(20px) rotate(-2deg)}100%{transform:none}}
.impact{pointer-events:none;z-index:45;animation:impactPop .4s ease forwards}
@keyframes impactPop{0%{opacity:0;transform:scale(.5) rotate(-8deg)}25%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.3) rotate(4deg)}}
.fnum.crit{font-size:30px;font-weight:900;text-shadow:0 0 10px #e8232a}
.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.motes i{position:absolute;width:3px;height:3px;background:#ffffff2b;border-radius:50%;animation:mote linear infinite}
@keyframes mote{from{transform:translateY(102vh)}to{transform:translateY(-4vh)}}
.intIc{display:inline-block;animation:intBob 1.1s ease-in-out infinite}
@keyframes intBob{50%{transform:translateY(-3px)}}
.chip{display:inline-block;border:1.5px solid #ffffff44;padding:.2em .5em;font-family:var(--mono);
  font-weight:800;font-size:10px;letter-spacing:.06em;margin-right:5px}
.chip.hot{border-color:var(--r);color:var(--r)}
.hot{color:var(--r)}
.gwrap{position:relative}
.gwrap .ghost{position:absolute;left:0;top:0;bottom:0;background:#ffffff55;transition:width .8s .3s}
.gwrap .real{position:absolute;left:0;top:0;bottom:0;background:var(--r);transition:width .25s}
#bEnd.pulse{animation:endPulse 1s infinite}
#bDo.pulse,.door.pulse{animation:endPulse 1.2s infinite}
.twist{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center;padding:22px;animation:pageIn .5s}
.twist .tw{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:460px}
.twist .twk{font-family:var(--mono);font-weight:800;font-size:9.5px;letter-spacing:.3em;color:var(--r)}
.twist .twt{font-weight:900;font-size:clamp(30px,9vw,52px);letter-spacing:-.02em;line-height:1;text-transform:uppercase}
.twist .twl p{font-family:var(--mono);font-size:12.5px;line-height:1.85;letter-spacing:.03em;color:#ffffffcc;margin:0 0 8px;animation:pageIn .5s}
.twist .twtag{font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.14em;color:var(--r);
  border:2px solid var(--r);padding:.6em .9em;opacity:0;transition:opacity .5s}
.twist .twtag.on{opacity:1}

const JTM = {
  version: 1,
  base: 'art/',
  exts: ['png', 'jpg', 'webp'],
  manifest: {},            
  cache: {},               
  resolve(key, cb){
    if (key in this.cache) return cb(this.cache[key]);
    const entry = this.manifest[key] || {};
    const tries = entry.src ? [entry.src] : this.exts.map(e => this.base + key + '.' + e);
    const next = i => {
      if (i >= tries.length){ this.cache[key] = null; cb(null); return; }
      const img = new Image();
      img.onload = () => { this.cache[key] = tries[i]; cb(tries[i]); };
      img.onerror = () => next(i + 1);
      img.src = tries[i];
    };
    next(0);
  },
  css(key, el){
    this.resolve(key, url => {
      if (!url || !el.isConnected) return;
      const m = this.manifest[key] || {};
      const d = document.createElement('div');
      d.className = 'jtm';
      d.style.backgroundImage = `url(${url})`;
      d.style.backgroundSize = m.fit === 'contain' ? 'contain' : 'cover';
      d.style.backgroundRepeat = 'no-repeat';
      d.style.backgroundPosition = `${(m.px ?? .5) * 100}% ${(m.py ?? .5) * 100}%`;
      if (m.mono === false) d.style.filter = 'none';
      el.prepend(d);
    });
  },
};

let ACTX = null, AMASTER = null, AOUT = null;
function audio(){
  if (ACTX) return ACTX;
  ACTX = new (window.AudioContext || window.webkitAudioContext)();
  AMASTER = ACTX.createGain(); AMASTER.gain.value = .12;
  
  const air = ACTX.createBiquadFilter(); air.type = 'lowpass'; air.frequency.value = 4200; air.Q.value = .4;
  const tame = ACTX.createBiquadFilter(); tame.type = 'peaking'; tame.frequency.value = 2600; tame.Q.value = 1; tame.gain.value = -5;
  const dc = ACTX.createDynamicsCompressor();
  dc.threshold.value = -26; dc.knee.value = 30; dc.ratio.value = 4; dc.attack.value = .012; dc.release.value = .28;
  
  const dly = ACTX.createDelay(.9); dly.delayTime.value = .21;
  const fb = ACTX.createGain(); fb.gain.value = .24;
  const wet = ACTX.createGain(); wet.gain.value = .16;
  const wlp = ACTX.createBiquadFilter(); wlp.type = 'lowpass'; wlp.frequency.value = 2000;
  AMASTER.connect(air); air.connect(tame); tame.connect(dc); dc.connect(ACTX.destination); AOUT = dc;
  tame.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wlp); wlp.connect(wet); wet.connect(dc);
  return ACTX;
}
const SOFT = { sawtooth: 'triangle', square: 'triangle' };   
function tone(type, f0, f1, dur, vol, delay = 0){
  audio();
  const t = ACTX.currentTime + delay;
  const o = ACTX.createOscillator(), g = ACTX.createGain();
  o.type = SOFT[type] || type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur * 1.15);
  
  const v = vol * .72;
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + Math.min(.018, dur * .3));
  g.gain.exponentialRampToValueAtTime(.0001, t + dur * 1.25);
  o.connect(g); g.connect(AMASTER); o.start(t); o.stop(t + dur * 1.3 + .04);
}
function nzz(dur, vol, hp, delay = 0){
  audio();
  const t = ACTX.currentTime + delay;
  const len = Math.ceil(ACTX.sampleRate * dur);
  const buf = ACTX.createBuffer(1, len, ACTX.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ACTX.createBufferSource(); src.buffer = buf;
  const f = ACTX.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = Math.min(hp, 2400); f.Q.value = .7;
  const g = ACTX.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002, vol * .5), t + Math.min(.02, dur * .4));
  g.gain.exponentialRampToValueAtTime(.0001, t + dur * 1.2);
  src.connect(f); f.connect(g); g.connect(AMASTER); src.start(t);
}

const SBUF = {};
let samplesRequested = false;
function loadSamples(){
  if (samplesRequested) return;
  samplesRequested = true;
  audio();
 Object.entries(SAMPLES).forEach(([k, f]) =>
    fetch('snd/' + f).then(r => r.ok ? r.arrayBuffer() : Promise.reject())
      .then(b => ACTX.decodeAudioData(b))
      .then(buf => { SBUF[k] = buf; })
      .catch(() => {}));
}
function smp(k, vol = .5, rate = 1, jitter = .12){
  const b = SBUF[k];
  if (!b) return false;
  const s = ACTX.createBufferSource();
  s.buffer = b;
  s.playbackRate.value = rate * (1 - jitter / 2 + Math.random() * jitter);
  const g = ACTX.createGain(); g.gain.value = vol;
  s.connect(g); g.connect(AMASTER); s.start();
  return true;
}

function zart(seed, accent = false){
  let s = 0; for (const c of seed) s = (s * 31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => (s = (s * 1103515245 + 12345) >>> 0) / 4294967296;
  let stripes = '';
  for (let i = 0; i < 7; i++){
    const x = i * 16 + rnd() * 8, w = 5 + rnd() * 8, k = rnd() * 30 - 15;
    stripes += `<path d="M${x} -10 q ${k} 40 ${k * .4} 80" stroke="${accent && i === 3 ? 'var(--r)' : '#fff'}" stroke-width="${w}" fill="none"/>`;
  }
  const eye = rnd() > .5 ? `<circle cx="${20 + rnd() * 60}" cy="${14 + rnd() * 24}" r="4" fill="var(--r)"/>` : '';
  return `<svg viewBox="0 0 110 60" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0">${stripes}${eye}</svg>`;
}

function stripeName(c){
  const m = motifsOf(c).slice(0, 2).map(x => STRIPE_NM[x] || x.toUpperCase());
  return (m.length > 1 ? m.join('/') : m[0]) || 'BARS';
}

function herdMotifs(c){ return motifsOf(c).slice(0, 2); }

function herdRow(){
  if (!tierOn('mult')) return '';
  const counts = {};
  Object.entries(B.motifCnt || {}).forEach(([m, n]) => counts[m] = n);
  B.hand.forEach(c => herdMotifs(c).forEach(m => { if (!(m in counts)) counts[m] = 0; }));
  
  const inHand = {};
  B.hand.forEach(c => herdMotifs(c).forEach(m => inHand[m] = (inHand[m] || 0) + 1));
  const rows = Object.entries(counts)
    .sort((a, b) => (b[1] - a[1]) || ((inHand[b[0]] || 0) - (inHand[a[0]] || 0)) || a[0].localeCompare(b[0]))
    .slice(0, 4);
  if (!rows.length) return '';
  return `<div class="herdRow"><span class="hk">◧ HERD</span>${rows.map(([m, n]) => {
    const cls = n >= 3 ? 'full' : n === 2 ? 'close' : '';
    const dots = '●'.repeat(Math.min(n, 3)) + '○'.repeat(Math.max(0, 3 - n)) + (n >= 4 ? '+' + (n - 3) : '');
    return `<span class="herd ${cls}" title="three ${STRIPE_NM[m] || m} cards in one turn = +1 herd">
      <b>${STRIPE_NM[m] || m.toUpperCase()}</b> ${dots}</span>`;
  }).join('')}${multNow() > 1 ? `<span class="herd full" id="herdChip">HERD ×${multNow().toFixed(1).replace('.0', '')}</span>` : ''}</div>`;
}

function livePairs(){
  const found = new Set(META.recipes || []);
  const d = (R && R.deck || []).filter(c => c.type !== 'pow' && !c.cursed);
  const outs = new Set(), uids = new Set();
  for (let i = 0; i < d.length; i++)
    for (let j = i + 1; j < d.length; j++){
      const r = findRecipe(d[i], d[j]);
      if (r && !found.has(r.out)){ outs.add(r.out); uids.add(d[i].uid); uids.add(d[j].uid); }
    }
  
  const dense = d.length > 0 && uids.size / d.length > .6;
  return { n: outs.size, uids: dense ? new Set() : uids, dense };
}
function motifsOf(c){
  if (c.motifs && c.motifs.length) return c.motifs;
  const m = MOTIF_MAP[c.id];
  return m ? [m] : ['bars'];
}
let MUID = 0;
function motifArt(c, hot){
  const forms = motifsOf(c).slice(0, 4);
  let s = 0; for (const ch of (c.name + c.id)) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (s = (s * 1103515245 + 12345) >>> 0) / 4294967296;
  const uid = 'm' + (MUID++);
  const clips = {
    1: [''],
    2: [`<polygon points="0,0 110,0 0,60"/>`, `<polygon points="110,0 110,60 0,60"/>`],
    3: [`<rect x="0" y="0" width="37" height="60"/>`, `<rect x="37" y="0" width="37" height="60"/>`, `<rect x="74" y="0" width="36" height="60"/>`],
    4: [`<rect x="0" y="0" width="55" height="30"/>`, `<rect x="55" y="0" width="55" height="30"/>`,
        `<rect x="0" y="30" width="55" height="30"/>`, `<rect x="55" y="30" width="55" height="30"/>`],
  }[forms.length];
  let body = '';
  forms.forEach((f, i) => {
    const draw = (MOTIF_FORMS[f] || MOTIF_FORMS.bars)(rnd, hot && i === 0);
    if (forms.length === 1){ body += draw; return; }
    const sc = forms.length === 2 ? .8 : .62;
    const cx = forms.length === 2 ? (i === 0 ? 30 : 80) : 0;
    body += `<clipPath id="${uid}c${i}">${clips[i]}</clipPath>
      <g clip-path="url(#${uid}c${i})"><g transform="translate(${forms.length === 2 ? (i === 0 ? -8 : 14) : (i % 2) * 50 * (forms.length === 4 ? 1 : 0)} ${forms.length === 4 ? Math.floor(i / 2) * 26 - 4 : 0}) scale(${sc})" transform-origin="55 30">${draw}</g></g>`;
  });
  if (forms.length > 1) body += `<path d="${forms.length === 2 ? 'M110 0 L0 60' : forms.length === 3 ? 'M37 0 v60 M74 0 v60' : 'M55 0 v60 M0 30 h110'}" stroke="var(--r)" stroke-width="2" opacity=".55"/>`;
  return `<svg viewBox="0 0 110 60" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0">${body}</svg>`;
}

function blendName(a, b){
  const A = (a || 'Blend').split(' ')[0], B = (b || 'Ling').split(' ').pop();
  let n = A.slice(0, Math.ceil(A.length / 2)) + B.slice(Math.floor(B.length / 2)).toLowerCase();
  n = n.replace(/[^A-Za-z?!\-']/g, '') || 'Blendling';
  if (n.length < 3) n = 'Blendling';
  return n.slice(0, 16);
}

    str: num('str'), autoblk: num('autoblk'), self: num('self'),
    energy: num('energy'), stripegen: num('stripegen'),

function findRecipe(x, y){
  return RECIPES.find(r => (r.a === x.id && r.b === y.id) || (r.a === y.id && r.b === x.id));
}

function primeCard(id){
  const c = mkCard(id);
  ['dmg', 'blk', 'heal', 'autoblk', 'str'].forEach(k => {
    if (c[k]) c[k] = Math.min(CAPS[k] || 999, Math.round(c[k] * 1.3));
  });
  c.prime = true;
  if (c.bleed) c.bleed = Math.min(CAPS.bleed || 99, Math.round(c.bleed * 1.3));
  if (c.riposte) c.riposte = Math.min(CAPS.riposte || 99, Math.round(c.riposte * 1.3));
  if (c.harvest) c.harvest = Math.min(CAPS.harvest || 99, Math.round(c.harvest * 1.3));
  c.blend = true;
  c.gen = BLEND_MAX;
  markSeen('prime:' + id);
  c.name = c.name + ' ★';
  c.rar = Math.min(3, (c.rar || 0) + 1);
  descFor(c);
  return c;
}

function genRelic(n){    
  const kinds = [
    f => ({ name: `Stripe Totem ${roman(f)}`, desc: `+${4 + f * 2} max HP`, hp: 4 + f * 2 }),
    f => ({ name: `War Paint ${roman(f)}`, desc: `+${f} damage on all attacks`, str: f }),
    f => ({ name: `Dazzle Sigil ${roman(f)}`, desc: `+${f * 2} block every turn`, autoblk: f * 2 }),
    f => ({ name: `Grass Charm ${roman(f)}`, desc: `Heal ${2 + f * 2} after battle`, healAfter: 2 + f * 2 }),
  ];
  const k = kinds[n % kinds.length](Math.floor(n / kinds.length) + 1);
  return { id: 'gen' + n, ...k };
}
function roman(n){ const R = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X']; return n <= 10 ? R[n] : 'X' + roman(n - 10); }

const POWERUPS = [
  () => ({ name: 'Sharp Hoof', ic: '', desc: '+1 damage on all attacks', str: 1 }),
  () => ({ name: 'Tough Skin', ic: '♥', desc: '+4 max HP', hp: 4 }),
  () => ({ name: 'Dust Cloak', ic: '▣', desc: '+1 block every turn', autoblk: 1 }),

  () => ({ name: 'Shiny Pebble', ic: '◆', desc: '+10% stripes from battles', goldMul: .1 }),
  () => ({ name: 'War Snort', ic: '☄', desc: 'First attack each battle +3', firstHit: 3 }),
  () => ({ name: 'Quick Sip', ic: '♥', desc: 'Heal 10 HP right now', now: r => r.hp = Math.min(r.mhp, r.hp + 10) }),
  () => ({ name: 'Stripe Dividend', ic: '◆', desc: `+${20 + (typeof R === 'object' && R ? R.floor * 2 : 0)} stripes right now`, now: r => { const g = 20 + r.floor * 2; r.stripes += g; toast('◆ +' + g + ' STRIPES', 1200); } }),
];
function rollPowerups(n = 2){
  const gm = (typeof R === 'object' && R && R.relics) ? R.relics.filter(r => r.goldMul).length : 0;
  const out = [];
  let guard = 0;
  while (out.length < Math.min(n, POWERUPS.length) && guard++ < 60){
    const p = pick(POWERUPS)();
    if (gm >= 3 && p.goldMul) continue;
    if (!out.some(x => x.name === p.name)) out.push(p);
  }
  return out;
}
function applyPowerup(p){
  if (p.now){ p.now(R); }
  else {
 R.relics.push({ name: p.name, desc: p.desc, pw: true,
      ...['str', 'hp', 'autoblk', 'healAfter', 'goldMul', 'firstHit'].reduce((o, k) => (p[k] != null && (o[k] = p[k]), o), {}) });
    if (p.hp){ R.mhp += p.hp; R.hp += p.hp; }
  }
 SFX.ach();
  saveRun();
}

function bossById(id){ return BOSSES.find(b => b.id === id) || BOSSES2.find(b => b.id === id) || null; }
function bossRoster(){ return BOSS_TIERS.flat().map(bossById).filter(Boolean); }
function bossPick(bi, w){
  const tier = bi % BOSS_TIERS.length, cycles = Math.floor(bi / BOSS_TIERS.length);
  const anchor = BOSSES[tier];
  const pool = BOSS_TIERS[tier].filter(id => bossById(id));
  if (BOSS_ORIG_FIRST && !((typeof META === 'object' && META && META.bestiary) || {})[anchor.id])
    return { b: anchor, tier, cycles, anchor };
  const rnd = srng(((w != null ? w : typeof R === 'object' && R && R.world) || 20260810) * 7919 + tier * 104729 + 4241);
  rnd(); rnd();
  const order = pool.slice();
  for (let i = order.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  return { b: bossById(order[cycles % order.length]) || anchor, tier, cycles, anchor };
}
function bossFor(f, w){
  if (f >= SUMMIT_FLOOR && f % SUMMIT_FLOOR === 0) return { name: SUMMIT.name, id: SUMMIT.id };
  const { b } = bossPick(Math.max(0, Math.floor(f / 5) - 1), w);
  return { name: b.name, id: b.id };
}

function foeFlavor(foe){
  if (BOSS_PATS[foe.id]) foe.pat = BOSS_PATS[foe.id];
  else if (FOE_PATS[foe.id]) foe.pat = FOE_PATS[foe.id];
  foe.trait = FOE_TRAITS[foe.id] || null;
  return foe;
}
function makeFoe(floor, kind){
  if (kind === 'boss' && floor >= SUMMIT_FLOOR && floor % SUMMIT_FLOOR === 0){
    const foe = scaleFoe(SUMMIT, 12 + Math.max(0, floor - SUMMIT_FLOOR) + 8 * Math.min(2, (META.stats && META.stats.wins) || 0), 1);
    foe.boss = 1; foe.summit = 1; foe.ep = SUMMIT.ep;
    foe.rule = 'dull'; foe.ruleTxt = 'GOD DOES NOT ROUND UP. THE HERD SCATTERS.';
    foe.pat = SUMMIT.pat;
    return foe;
  }
  if (kind === 'boss'){
    const bi = Math.max(0, Math.floor(floor / 5) - 1);
    const { b: pick0, cycles, anchor } = bossPick(bi);
    const b = pick0 === anchor ? pick0 : { ...pick0,
      hp: Math.round(clamp(pick0.hp, anchor.hp * .85, anchor.hp * 1.15)),
      atk: Math.round(clamp(pick0.atk, anchor.atk * .85, anchor.atk * 1.15)) };
    
    const foe = scaleFoe(b, Math.max(0, floor - (bi === 0 ? HARD.bossLag0 : HARD.bossLag)), 1);
    if (cycles > 0){
      foe.mhp = foe.hp = Math.round(foe.hp * (1 + cycles * .5));
      foe.atk = Math.round(foe.atk * (1 + cycles * .2));
    }
    
    if (floor >= 10){   
      foe.rule = BOSS_RULES[bi % BOSS_RULES.length].id;
      foe.ruleTxt = BOSS_RULES[bi % BOSS_RULES.length].txt;
    }
    foe.boss = 1;
    const bout = foeFlavor(foe);
    if (cycles > 0 && !bout.trait) bout.trait = pick(['thorns', 'armored', 'regen', 'dodgy']);
    return bout;
  }
  if (kind === 'elite'){
    
    if (META.ghost && floor >= 5 && Math.random() < .25){
      const mir = { id: 'mirage', name: 'MIRAGE', ep: 'IT KNOWS YOUR DECK', hp: 36, atk: 9, pat: ['atk', 'blk', 'atk', 'buff'] };
      const foe = scaleFoe(mir, floor, 1.35);
      foe.vill = true;
      foe.gdeck = META.ghost.deck;
      foe.gname = META.ghost.name;
      foe.name = 'MIRAGE OF ' + (META.ghost.name || 'YOU').toUpperCase().slice(0, 10);
      return foe;
    }
    
    if (floor >= 6 && Math.random() < .25){
      const a = pick(FOES), b = pick(FOES.filter(f => f.id !== a.id));
      const foe = scaleFoe({ id: a.id, name: blendName(a.name, b.name).toUpperCase(),
        hp: Math.round((a.hp + b.hp) * .85), atk: Math.max(a.atk, b.atk) + 1,
        pat: [...a.pat, ...b.pat] }, floor, 1.2);
      foe.vill = true; foe.fused = 1; foe.ep = 'TWO OF THEM. IN ONE. BUREAUCRATICALLY.';
      foe.trait = pick(['thorns', 'dodgy', 'armored', 'regen', 'volatile']);
      return foe;
    }
    
    const v = pick(VILLAINS);
    const foe = scaleFoe(v, floor, HARD.eliteMul);
    foe.vill = true;
    
    foe.trait = pick(['thorns', 'dodgy', 'armored', 'regen', 'volatile', 'coward']);
    if (!FOE_PATS[v.id] && Math.random() < .6) foe.pat = pick([['steal','atk','atk'],['enrage','atk','blk'],['curse','atk','atk'],['multi','blk','atk'],['heal','atk','atk']]);
    return foe;
  }
  const f = pick(FOES.slice(0, clamp(5 + floor, 5, FOES.length)));   
  const nfoe = foeFlavor(scaleFoe(f, floor, 1));
  if (floor > 50 && !nfoe.trait && Math.random() < Math.min(.6, (floor - 50) * .02))
    nfoe.trait = pick(['thorns', 'dodgy', 'armored', 'regen', 'volatile', 'coward']);
  return nfoe;
}

      { kind: 'rest', nm: 'Oasis', dd: 'heal up — or BLEND / UPGRADE · the only blender', ic: '' },

    extras.forEach(e => {

    let pool = f < HARD.eliteFrom ? extras.filter(e => e.kind !== 'elite') : extras;
    if (law.noElite || narrows) pool = pool.filter(e => e.kind !== 'elite');
    if (law.w){
      const weighted = [];

function suggestedStart(){
  
  const climb = META.stats.climb != null ? META.stats.climb : Math.floor((META.stats.floors || 1) * .6);
  return Math.max(1, Math.floor(climb / 3));
}
function dropKit(N){
  
 R.mhp += Math.round(N * .8); R.hp = R.mhp;
 R.stripes += N * 3; R.seed = (R.seed || 0) + N * 3;
  for (let i = 0; i < Math.floor(N / 8); i++){
    const m = rollPowerups(1)[0];
    if (!m.now) applyMutationSilent(m);
  }
  for (let i = 0; i < Math.floor(N / 15); i++){
    const r = pick(RELICS);
 R.relics.push(r);
    if (r.hp){ R.mhp += r.hp; R.hp += r.hp; }
  }
  for (let i = 0; i < Math.floor(N / 20); i++) R.deck.push(blendCards(mkCard(pick(BASE_CARDS.filter(c => !c.secret)).id), mkCard(pick(BASE_CARDS.filter(c => !c.secret)).id)));
  saveRun();
}
function applyMutationSilent(m){
 R.relics.push({ name: m.name, desc: m.desc,
    ...['str', 'hp', 'autoblk', 'healAfter', 'goldMul', 'firstHit'].reduce((o, k) => (m[k] != null && (o[k] = m[k]), o), {}) });
  if (m.hp){ R.mhp += m.hp; R.hp += m.hp; }
}

function canPlayAuto(c){
  
  if (c.cursed) return false;
  if (B.foe.rule === 'lock' && c.uid === B.lockUid) return false;
  const taxed = B.foe.rule === 'tax' && c.type === 'atk' ? 1 : 0;
  return costOf(c) + taxed <= B.energy;
}
function goatGhost(){ return !!(B && B.foe && B.foe.clipped); }
function autoDmg(c){ return liveDmg(c); }   
function singleKill(){
  return B.hand.findIndex(c => canPlayAuto(c) && c.dmg &&
    autoDmg(c) >= B.foe.hp + (B.foe.blk || 0));   
}
function pairLethal(){
  
  const h = B.hand, need = B.foe.hp + (B.foe.blk || 0);
  const tax = c => B.foe.rule === 'tax' && c.type === 'atk' ? 1 : 0;
  for (let a = 0; a < h.length; a++) for (let b = 0; b < h.length; b++){
    if (a === b) continue;
    const ca = h[a], cb = h[b];
    if (!canPlayAuto(ca) || !ca.dmg || !cb.dmg || cb.cursed) continue;
    if (costOf(ca) + tax(ca) + costOf(cb) + tax(cb) > B.energy) continue;
    if (autoDmg(ca) + autoDmg(cb) + (B.firstHit || 0) >= need) return a;
  }
  return -1;
}

function aiPlay(i, note){
  const cardEl = document.querySelectorAll('#hand .card')[i];
  if (cardEl) cardEl.classList.add('aiPick');
  if (note && Math.random() < .4) toast('§ ' + note, 950);
 B.aiPending = true;
  const ot = OT.on;
  setTimeout(() => { B.aiPending = false; if (ot && !OT.on){ if (cardEl) cardEl.classList.remove('aiPick'); return; } if (B && !B.over) playCard(i); }, 320);
}
function helperNudge(){
  if (!B || B.over || B.busy || B.auto || OT.on) return;
  clearTimeout(B.hnT);
 B.hnT = setTimeout(() => {
    if (!B || B.over || B.busy || B.auto || B.ending || OT.on) return;
    if (helperOn('ox')){
      const kill = singleKill();
      if (kill >= 0){ toast('≈ OX SMELLS BLOOD', 900); aiPlay(kill); return; }
    }
    if (helperOn('gary') && !B.hand.some(canPlayAuto)){
      toast('¶ GARY ENDS THE TURN. EFFICIENTLY.', 900);
      endTurn();
    }
  }, DL(750));
}
function autoPolicy(){
  if (B.aiPending) return;
  const h = B.hand;
  const nextK = B.foe.pat[B.foe.pi % B.foe.pat.length];
  const inc = incomingDmg();
  const intentAtk = inc > 0;
  const winding = B.foe.winding || nextK === 'enrage';   
  
  if (B.foe.tell && tellSpec(B.foe)){
    const g = tellSpec(B.foe);
    const ci = h.findIndex(c => canPlayAuto(c) && answersTell(c, { turnIds: [...(B.turnIds || []), c.id] }));
    if (ci >= 0) return aiPlay(ci, 'COUNTER IT.');
  }
  
  const kill = goatGhost() ? -1 : singleKill();
  if (kill < 0 && !goatGhost()){ const shk = h.findIndex(c => c.shatter && canPlayAuto(c) && autoDmg(c) >= B.foe.hp); if (shk >= 0) return aiPlay(shk, 'BREAK IT.'); }
  if (kill >= 0 && !h[kill].harvest){ const hk = h.findIndex(c => c.harvest && canPlayAuto(c) && c.dmg && autoDmg(c) >= B.foe.hp + (B.foe.blk || 0)); if (hk >= 0) return aiPlay(hk, 'HARVEST TIME.'); }
  if (kill >= 0) return aiPlay(kill, 'FINISH IT.');
  const pl = pairLethal();
  if (pl >= 0) return aiPlay(pl, "THE OL' ONE-TWO.");
  
  const free = h.findIndex(c => canPlayAuto(c) && costOf(c) === 0 && !c.dmg && !c.gamble && !c.mystery && !c.molt && (c.draw || c.energy || c.freeNext));
  if (free >= 0) return aiPlay(free);
  const scoutI = h.findIndex(c => canPlayAuto(c) && costOf(c) === 0 && !c.dmg && c.scout && (B.scoutT !== B.turn || B.scoutN < 3));
  if (scoutI >= 0) return aiPlay(scoutI);
  const ocI = h.findIndex(c => canPlayAuto(c) && costOf(c) === 0 && !c.dmg && c.overcharge && (B.nextE || 0) < 3);
  if (ocI >= 0) return aiPlay(ocI);
  
  if (B.turn <= 3 && !winding && (!intentAtk || B.block >= inc)){
    const pow = h.findIndex(c => canPlayAuto(c) && c.type === 'pow');
    if (pow >= 0) return aiPlay(pow, 'INVESTING. TRUST THE PROCESS.');
  }
  
  if (winding && !intentAtk){
    const bw = B.hand.map((c, i) => [c, i]).filter(([c]) => canPlayAuto(c) && c.blk)
      .sort((x, y) => y[0].blk - x[0].blk);
    if (bw.length && B.block < 14) return aiPlay(bw[0][1], 'IT\'S WINDING UP. BRACE.');
  }
  
  if (intentAtk && B.block < inc){
    if (inc >= Math.max(8, R.hp * .25)){
      const st = h.findIndex(c => canPlayAuto(c) && c.stun && !B.foe.stun && !B.foe.stunProof && !B.foe.tell);
      if (st >= 0) return aiPlay(st, 'SLEEP.');
      const czI = h.findIndex(c => canPlayAuto(c) && c.confuse && !B.foe.confused && !B.foe.stun && !B.foe.stagger && !B.foe.stunProof && !B.foe.tell);
      if (czI >= 0) return aiPlay(czI, 'CONFUSE IT.');
    }
    const blocks = h.map((c, i) => [c, i]).filter(([c]) => canPlayAuto(c) && c.blk && !c.dmg)
      .sort((x, y) => y[0].blk - x[0].blk);
    if (blocks.length) return aiPlay(blocks[0][1], 'WALL UP.');
    if (R.hp - inc < R.mhp * .35){
      const hl = h.findIndex(c => canPlayAuto(c) && c.heal && !c.dmg);
      if (hl >= 0) return aiPlay(hl, 'SNACK BREAK.');
    }
  }
  
  const score = c => {
    let s = autoDmg(c);
    if (c.vamp && R.hp < R.mhp * .6) s *= 1.4;
    if (c.weak && intentAtk) s += 4;
    if (c.bleed) s += c.bleed * 1.5;
    if (c.sunder && !B.foe.vuln) s += 3 + c.sunder * 2;
    if (c.drain && B.foe.atk > Math.ceil((B.foe.atk0 || B.foe.atk) / 2)) s += c.drain * 2;
    if (c.riposte && intentAtk) s += c.riposte * (nextK === 'multi' || nextK === 'stampede' ? 3 : 1);
    return s / Math.max(1, costOf(c));
  };

function upgradeCard(c){

function shopMul(){ return (1 - treeVal('shopOff')) * (1 + .1 * (META.stake || 0)) * (R.wkShopOff || 1) * (1 - (regionLaw().shopOff || 0)) * (META.meerkatOff ? .9 : 1); }
function backOff(){ return shopMul(); }
const SPECIALS = [
  { id: 'patch', w: 3, on: () => true },
  { id: 'pakS', w: 3, on: () => true },
  { id: 'pakA', w: 2, on: () => (META.recipes || []).length > 0 || bestF() >= 8 },
  { id: 'stamp', w: 2, on: () => tierOn('ed') },
  { id: 'wheel', w: 2, on: () => bestF() >= 6 },
  { id: 'vouch', w: 2, on: () => bestF() >= 8 && !!voucherStock() },
  { id: 'pakW', w: 1, on: () => bestF() >= 8 },

function shopStock(){
  if (R.shop && R.shop.f === R.floor) return R.shop;
  const prev = (R.shop && R.shop.sp) || [], pool = SPECIALS.filter(s => s.on()), sp = [];
  if (R.hp < R.mhp * .5) sp.push('patch');
  while (sp.length < 2){
    const left = pool.filter(s => !sp.includes(s.id));
    if (!left.length) break;
    const fresh = left.filter(s => !prev.includes(s.id)), L = fresh.length ? fresh : left;
    let t = Math.random() * L.reduce((a, s) => a + s.w, 0);
    sp.push((L.find(s => (t -= s.w) < 0) || L[0]).id);
  }
  const owned = new Set(R.relics.map(r => r.id)), av = RELICS.filter(r => !owned.has(r.id)), st = stampsOpen();
  R.shop = { f: R.floor, sp, stamp: st.length ? pick(st) : null,
    card: mkCard(pick(BASE_CARDS.filter(c => !c.secret && (R.floor >= 5 || c.early))).id),
    relic: av.length ? pick(av) : genRelic(R.relics.length),
    sold: { relic: R.shopRelicF === R.floor ? 1 : 0, banish: R.shopBanF === R.floor ? 1 : 0, patch: R.shopHealF === R.floor ? 1 : 0 } };
  saveRun();
  return R.shop;
}

function wheelCost(){ return (12 + Math.floor(R.floor / 2)) + 8 * (R._spins || 0); }

function nextNode(){

  TREE.forEach(b => b.nodes.forEach((n, ni) => {

function animBl(root, L0, x0, L1, x1, done){
  const fill = root && root.querySelector('.fill'), lab = root && root.querySelector('.lvl');
  if (!fill) return;
  const pct = (L, x) => Math.max(0, Math.min(100, (x - blCum(L)) / blNeed(L) * 100)) + '%';
  fill.style.transition = 'none'; fill.style.width = pct(L0, x0); void fill.offsetWidth;
  let L = L0;
  const step = () => {
    if (!fill.isConnected) return;
    if (L < L1){
      fill.style.transition = 'width .6s'; fill.style.width = '100%';
      setTimeout(() => {
        if (!fill.isConnected) return;
        L++; lab.textContent = '☥ BLOODLINE LV ' + L;
        stampFx('LEVEL UP'); Music.on() ? Music.jingle('levelup') : SFX.ach(); hapt([30, 20, 60]);
        fill.style.transition = 'none'; fill.style.width = '0%'; void fill.offsetWidth;
        step();

      return;
    }
    fill.style.transition = 'width .6s'; fill.style.width = pct(L1, x1);
    setTimeout(() => { if (fill.isConnected && done) done(); }, 650);
  };
  setTimeout(step, 650);
}

const YT_W = [180, 240, 340];
function ytPrefs(){ META.yt = META.yt || {}; return META.yt; }
function ytBox(d){ const r = d.getBoundingClientRect(); return { w: r.width, h: r.height }; }
function ytPlace(d, x, y){
  const { w, h } = ytBox(d);
  x = clamp(Math.round(x), 4, Math.max(4, innerWidth - w - 4));
  y = clamp(Math.round(y), 4, Math.max(4, innerHeight - h - 4));
  const br = btmBox();
  if (br && x < br.right && x + w > br.left && y + h > br.top - 6) y = Math.max(4, Math.round(br.top - 8 - h));
  d.style.left = x + 'px'; d.style.top = y + 'px';
  fixPad();
  return { x, y };
}
function ytWidth(){
  const p = ytPrefs(), gutter = (innerWidth - 640) / 2;
  if (p.size != null) return Math.min(YT_W[p.size], innerWidth - 16);
  if (gutter >= 200) return Math.min(340, gutter - 24);
  return Math.min(220, Math.round(innerWidth * .54));
}
function ytDefault(d){
  const gutter = (innerWidth - 640) / 2, { w, h } = ytBox(d);
  if (gutter >= w + 24) return ytPlace(d, innerWidth - gutter + Math.round((gutter - w) / 2), 72);
  const bb = btmBox();
  return ytPlace(d, innerWidth - w - 8, (bb ? bb.top - 10 : innerHeight - 16) - h);
}
function ytRestore(d){
  const p = ytPrefs();
  if (p.fx == null || p.fy == null) return ytDefault(d);
  return ytPlace(d, p.fx * innerWidth, p.fy * innerHeight);
}
function ytSave(d){
  const p = ytPrefs(), r = d.getBoundingClientRect();
  p.fx = +(r.left / innerWidth).toFixed(4); p.fy = +(r.top / innerHeight).toFixed(4);
  saveMeta();
}
function toggleYt(){
  const ex = document.getElementById('ytDock');
  if (ex){ ex.remove(); fixPad(); return; }
  const p = ytPrefs();
  let ch = clamp(p.ch || 0, 0, YT_TABS.length - 1);
  const d = el(`<div id="ytDock" class="${p.min ? 'min' : ''}" role="dialog" aria-label="Watch and play">
    <div class="ytBar">
      <span class="ytGrip" title="Drag to move">▷ TV</span>
      <button class="ytCh" title="${YT_TABS[ch].name} · tap for next channel">${YT_TABS[ch].k}</button>
      <button class="ytSize" title="Resize">⤢</button>
      <button class="ytMin" title="Tuck away (keeps playing)">${p.min ? '▢' : '–'}</button>
      <button class="ytX" title="Close">✕</button>
    </div>
    <div class="ytBody"><iframe id="ytFrame" src="${YT_TABS[ch].src}" frameborder="0"
      allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
  </div>`);
  d.style.width = ytWidth() + 'px';
  document.body.appendChild(d);
  ytRestore(d);
  const bar = d.querySelector('.ytBar'), frame = d.querySelector('iframe');
  const chB = d.querySelector('.ytCh'), minB = d.querySelector('.ytMin');
  chB.onclick = () => {
    ch = (ch + 1) % YT_TABS.length; p.ch = ch; saveMeta();
    frame.src = YT_TABS[ch].src; chB.textContent = YT_TABS[ch].k; chB.title = YT_TABS[ch].name + ' · tap for next channel';
    toast('▷ ' + YT_TABS[ch].name.toUpperCase(), 1200);
  };
  d.querySelector('.ytSize').onclick = () => {
    if (p.size != null) p.size = (p.size + 1) % YT_W.length;
    else { const i = YT_W.findIndex(w => w > ytBox(d).w + 4); p.size = i < 0 ? 0 : i; }
    const r = d.getBoundingClientRect(), right = r.right;
    d.style.width = Math.min(YT_W[p.size], innerWidth - 16) + 'px';
    ytPlace(d, r.left + r.width / 2 > innerWidth / 2 ? right - ytBox(d).w : r.left, r.top);
    ytSave(d);
  };
  minB.onclick = () => {
    const r = d.getBoundingClientRect(), right = r.right;
    p.min = d.classList.toggle('min') ? 1 : 0;
    minB.textContent = p.min ? '▢' : '–';
    minB.title = p.min ? 'Show the video' : 'Tuck away (keeps playing)';
    ytPlace(d, r.left + r.width / 2 > innerWidth / 2 ? right - ytBox(d).w : r.left, r.top);
    ytSave(d);
  };
  d.querySelector('.ytX').onclick = () => { d.remove(); fixPad(); };
  let drag = null;
  bar.addEventListener('pointerdown', e => {
    if (e.button > 0 || e.target.closest('button')) return;
    e.preventDefault();
    const r = d.getBoundingClientRect();
    drag = { id: e.pointerId, ox: e.clientX - r.left, oy: e.clientY - r.top };
    try { bar.setPointerCapture(e.pointerId); } catch {}
    frame.style.pointerEvents = 'none';
    d.classList.add('drag');
  });
  bar.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    ytPlace(d, e.clientX - drag.ox, e.clientY - drag.oy);
  });
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null;
    frame.style.pointerEvents = '';
    d.classList.remove('drag');
    const r = d.getBoundingClientRect();
    if (r.left < 28) ytPlace(d, 6, r.top);
    else if (innerWidth - r.right < 28) ytPlace(d, innerWidth - r.width - 6, r.top);
    ytSave(d);
  };
  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', end);
}
