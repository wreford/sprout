<style>
:root{
  --paper:#f7f5ef; --card:#ffffff; --ink:#22252d; --ink2:#4c5160; --muted:#8a8f9c;
  --line:#e3e0d6; --blue:#2457e0; --blue-soft:#e8eefc; --red:#d43a52; --green:#1d9f61;
  --green-soft:#e3f6ec; --gold:#b98a1c; --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;
  min-height:100dvh;
  background-image:linear-gradient(rgba(36,87,224,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(36,87,224,.045) 1px,transparent 1px);
  background-size:28px 28px}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 90px}
header{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.brand{font-weight:900;font-size:26px;letter-spacing:-.03em;cursor:pointer}
.brand i{color:var(--blue);font-style:normal}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.lead{color:var(--ink2);font-size:14.5px;line-height:1.55;margin:8px 0 20px;max-width:640px}
.units{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.unit{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
  cursor:pointer;transition:.15s;box-shadow:0 1px 3px rgba(30,30,50,.05)}
.unit:hover{border-color:var(--blue);transform:translateY(-2px)}
.unit .em{font-size:24px}
.unit h3{font-size:15.5px;font-weight:800;letter-spacing:-.01em;margin:8px 0 4px}
.unit p{font-size:12px;color:var(--muted);line-height:1.45}
.unit .bar{height:5px;border-radius:99px;background:var(--line);margin-top:12px;overflow:hidden}
.unit .bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:.4s}
.unit .st{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted);margin-top:6px;text-transform:uppercase}
.unit.done{border-color:var(--green)}
.crumb{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.crumb button{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;font:600 13px Inter,sans-serif;color:var(--ink2);cursor:pointer}
.crumb button:hover{border-color:var(--blue);color:var(--blue)}
.crumb .here{font-weight:800;font-size:15px}
.lesson{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  box-shadow:0 1px 3px rgba(30,30,50,.05)}
.card h4{font-size:15px;font-weight:800;margin-bottom:8px}
.card h4 span{color:var(--blue)}
.card p,.card li{font-size:14px;line-height:1.65;color:var(--ink2)}
.card ul{padding-left:20px;margin:6px 0}
.card .m{font-family:var(--mono);font-size:.93em;background:var(--blue-soft);border-radius:6px;
  padding:1px 6px;color:var(--blue);white-space:nowrap;font-weight:700}
.card .ex{margin-top:10px;border-left:3px solid var(--blue);padding:8px 12px;background:var(--blue-soft);
  border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.card .ex b{color:var(--ink)}
.gowrap{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.go{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:13px 22px;
  font:800 14px Inter,sans-serif;cursor:pointer;box-shadow:0 3px 10px rgba(36,87,224,.3)}
.go.ghost{background:var(--card);color:var(--ink2);border:1px solid var(--line);box-shadow:none}
svg text{font-family:var(--mono)}
.widget{margin-top:12px}
.widget .sl{display:flex;align-items:center;gap:10px;margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.widget .sl b{width:74px;color:var(--ink)}
.widget input[type=range]{flex:1;accent-color:var(--blue)}
.widget .out{font-family:var(--mono);font-size:12px;color:var(--blue);font-weight:700;margin-top:8px;line-height:1.7}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.qhead .n{font-family:var(--mono);font-size:11px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.qhead .streak{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--gold)}
.q{font-size:17px;line-height:1.6;font-weight:600}
.q .m{font-family:var(--mono);font-size:.95em;background:var(--blue-soft);border-radius:6px;padding:1px 7px;color:var(--blue);white-space:nowrap}
.ansrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.ansrow label{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ansrow input{width:130px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;
  font:700 16px var(--mono);color:var(--ink);background:var(--card);outline:none}
.ansrow input:focus{border-color:var(--blue)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 16px;
  font:600 14.5px Inter,sans-serif;color:var(--ink);cursor:pointer;text-align:left}
.opt:hover{border-color:var(--blue)}
.opt.pick{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:#fdecef}
.opt .m{font-family:var(--mono);font-size:.93em}
.verdict{margin-top:16px;border-radius:12px;padding:13px 16px;font-size:14px;font-weight:700;display:none}
.verdict.ok{display:block;background:var(--green-soft);color:var(--green)}
.verdict.no{display:block;background:#fdecef;color:var(--red)}
.sol{margin-top:12px;border-left:3px solid var(--gold);padding:10px 14px;background:#fbf4e2;
  border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.7;color:var(--ink2);display:none}
.sol.show{display:block}
.sol b{color:var(--ink)} .sol .m{font-family:var(--mono);font-size:.93em;color:var(--gold);font-weight:700}
.mast{margin-top:14px;display:flex;align-items:center;gap:10px}
.mast .bar{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.mast .bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:.4s}
.mast .t{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.foot{margin-top:34px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase;line-height:1.9}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(max-width:520px){ .q{font-size:15.5px} .brand{font-size:22px} }

<body>
<div class="wrap" id="app"></div>
<canvas class="confetti" id="cf" width="10" height="10"></canvas>
<script>
"use strict";
const $=s=>document.querySelector(s);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nz=(a,b)=>{ let v=0; while(!v) v=ri(a,b); return v; };
const sgn=n=>n<0?"− "+Math.abs(n):"+ "+n;
const money=n=>"$"+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");
const m=s=>'<span class="m">'+s+'</span>';
const MASTER=10;

let P={};
try{ P=JSON.parse(localStorage.getItem("math11")||"{}")||{}; }catch(e){}
const saveP=()=>{ try{ localStorage.setItem("math11",JSON.stringify(P)); }catch(e){} };
const prog=id=>P[id]||(P[id]={right:0,tried:0});

function parabolaSVG(a,h,k){
  const W=320,H=210,sx=W/12,sy=H/14,ox=W/2,oy=H/2;
  let pts="";
  for(let x=-6;x<=6;x+=0.1){
    const y=a*(x-h)*(x-h)+k;
    const px=ox+x*sx, py=oy-y*sy;
    if(py>-40&&py<H+40) pts+=(pts?" L":"M")+px.toFixed(1)+" "+py.toFixed(1);
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#fff;border:1px solid var(--line);border-radius:12px">
    <line x1="0" y1="${oy}" x2="${W}" y2="${oy}" stroke="#c9c5b8" stroke-width="1.4"/>
    <line x1="${ox}" y1="0" x2="${ox}" y2="${H}" stroke="#c9c5b8" stroke-width="1.4"/>
    <path d="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.6"/>
    <circle cx="${ox+h*sx}" cy="${oy-k*sy}" r="4.5" fill="#fff" stroke="var(--red)" stroke-width="2.6"/>
  </svg>`;
}
function sineSVG(a,kk,c){
  const W=320,H=190,ox=30,oy=H/2,sx=(W-40)/(4*Math.PI),sy=H/9;
  let pts="";
  for(let x=0;x<=4*Math.PI;x+=0.06){
    const y=a*Math.sin(kk*x)+c;
    pts+=(pts?" L":"M")+(ox+x*sx).toFixed(1)+" "+(oy-y*sy).toFixed(1);
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#fff;border:1px solid var(--line);border-radius:12px">
    <line x1="0" y1="${oy}" x2="${W}" y2="${oy}" stroke="#c9c5b8" stroke-width="1.4"/>
    <line x1="${ox}" y1="0" x2="${ox}" y2="${H}" stroke="#c9c5b8" stroke-width="1.4"/>
    <path d="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.4"/>
  </svg>`;
}
function growthSVG(P0,r,n){
  const W=320,H=190,ox=34,oy=H-26;
  const maxA=P0*Math.pow(1+r,n);
  let pts="",bars="";
  for(let t=0;t<=n;t++){
    const A=P0*Math.pow(1+r,t);
    const px=ox+t*(W-50)/n, py=oy-(A/maxA)*(H-50);
    bars+=`<circle cx="${px}" cy="${py}" r="3" fill="var(--blue)"/>`;
    pts+=(pts?" L":"M")+px.toFixed(1)+" "+py.toFixed(1);
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#fff;border:1px solid var(--line);border-radius:12px">
    <line x1="${ox}" y1="${oy}" x2="${W-10}" y2="${oy}" stroke="#c9c5b8" stroke-width="1.4"/>
    <line x1="${ox}" y1="10" x2="${ox}" y2="${oy}" stroke="#c9c5b8" stroke-width="1.4"/>
    <path d="${pts}" fill="none" stroke="var(--green)" stroke-width="2.2"/>${bars}
    <text x="${W-14}" y="${oy+16}" text-anchor="end" font-size="9" fill="#8a8f9c">years →</text>
  </svg>`;
}

const UNITS=[
{ id:"fn", em:"🧭", name:"Functions & notation",
  blurb:"What makes a relation a function, f(x) notation, domain and range, inverses.",
  lesson:[
    {h:"A <span>function</span> is a one-answer machine",
     b:`<p>A relation is a function when every input ${m("x")} gives exactly <b>one</b> output ${m("y")}. On a graph, that's the <b>vertical line test</b> — any vertical line may cross the graph at most once.</p>
     <div class="ex"><b>Function:</b> ${m("y = x² + 1")} — every x has one y.<br><b>Not a function:</b> ${m("x = y²")} — x = 4 gives y = 2 <i>and</i> y = −2.</div>`},
    {h:"<span>f(x)</span> is just y with a name",
     b:`<p>${m("f(x) = 3x − 2")} names the machine ${m("f")}. Then ${m("f(4)")} means "run 4 through it": ${m("f(4) = 3(4) − 2 = 10")}. Nothing scarier than substitution.</p>`},
    {h:"<span>Domain</span> and <span>range</span>",
     b:`<p><b>Domain</b> = every x allowed in. <b>Range</b> = every y that can come out. Two things break the domain in this course:</p>
     <ul><li>Dividing by zero — exclude x that zeroes a denominator.</li>
     <li>Square roots of negatives — need the inside ≥ 0.</li></ul>
     <div class="ex">${m("f(x) = √(x − 3)")} → domain ${m("x ≥ 3")}, range ${m("y ≥ 0")}.</div>`},
    {h:"<span>Inverses</span> undo",
     b:`<p>${m("f⁻¹")} reverses the machine: if ${m("f(2) = 11")} then ${m("f⁻¹(11) = 2")}. To find it, swap x and y, then solve for y. Its graph is the original reflected in the line ${m("y = x")}.</p>
     <div class="ex">${m("f(x) = 2x + 6")} → swap: ${m("x = 2y + 6")} → ${m("f⁻¹(x) = (x − 6)/2")}.</div>`}],
  gens:[
    ()=>{ const a=nz(-4,4),b=ri(-9,9),c=ri(-9,9),x=ri(-4,4);
      const ans=a*x*x+b*x+c;
      return {q:`If ${m(`f(x) = ${a}x² ${sgn(b)}x ${sgn(c)}`)}, evaluate ${m(`f(${x})`)}.`,kind:"num",ans,
        sol:`Substitute: ${m(`f(${x}) = ${a}(${x})² ${sgn(b)}(${x}) ${sgn(c)} = ${a*x*x} ${sgn(b*x)} ${sgn(c)} = ${ans}`)}.`}; },
    ()=>{ const a=ri(1,9);
      return {q:`State the domain of ${m(`f(x) = √(x − ${a})`)}. The smallest allowed x is:`,kind:"num",ans:a,
        sol:`The inside of a square root must be ≥ 0: ${m(`x − ${a} ≥ 0`)} so ${m(`x ≥ ${a}`)}. The smallest allowed x is <b>${a}</b>.`}; },
    ()=>{ const a=ri(2,5),b=ri(-8,8),x=ri(-5,5),y=a*x+b;
      return {q:`If ${m(`f(x) = ${a}x ${sgn(b)}`)}, find ${m(`f⁻¹(${y})`)}.`,kind:"num",ans:x,
        sol:`${m("f⁻¹")} asks: which x gives ${y}? Solve ${m(`${a}x ${sgn(b)} = ${y}`)} → ${m(`${a}x = ${y-b}`)} → ${m(`x = ${x}`)}.`}; },
    ()=>{ const a=ri(1,6);
      return {q:`Which relation is <b>not</b> a function?`,kind:"mc",
        opts:[`y = ${a}x + 2`,`y = x² − ${a}`,`x = y²`,`y = √x`],ans:2,
        sol:`${m("x = y²")} fails the vertical line test: x = ${a*a} gives y = ${a} and y = −${a}. Two outputs for one input — not a function.`}; },
    ()=>{ const h=nz(-6,6),k=nz(-6,6),up=pick([1,-1]);
      return {q:`A parabola has vertex ${m(`(${h}, ${k})`)} and opens ${up>0?"up":"down"}. Its range is:`,kind:"mc",
        opts:[`y ≥ ${k}`,`y ≤ ${k}`,`x ≥ ${h}`,`all real numbers`],ans:up>0?0:1,
        sol:`Range is about y. Opening ${up>0?"up, the vertex is the minimum":"down, the vertex is the maximum"}, so ${m(up>0?`y ≥ ${k}`:`y ≤ ${k}`)}.`}; },
    ()=>{ const h=nz(-5,5),k=nz(-5,5);
      const dir=h>0?`right ${h}`:`left ${Math.abs(h)}`, ud=k>0?`up ${k}`:`down ${Math.abs(k)}`;
      return {q:`Compared with ${m("y = f(x)")}, the graph of ${m(`y = f(x ${sgn(-h)}) ${sgn(k)}`)} is shifted:`,kind:"mc",
        opts:[`${dir}, ${ud}`,`${h>0?"left "+h:"right "+Math.abs(h)}, ${ud}`,`${dir}, ${k>0?"down "+k:"up "+Math.abs(k)}`,`not shifted`],ans:0,
        sol:`Inside the brackets moves x <b>opposite</b> to the sign — ${m(`f(x − h)`)} moves right h. Outside moves y the way it reads. So: <b>${dir}, ${ud}</b>.`}; }],
},
{ id:"qd", em:"⛰️", name:"Quadratic functions",
  blurb:"Vertex form, completing the square, the discriminant, max/min word problems.",
  widget:"parabola",
  lesson:[
    {h:"Three outfits, one <span>parabola</span>",
     b:`<p>Same function, three forms — each answers a different question instantly:</p>
     <ul><li><b>Standard</b> ${m("y = ax² + bx + c")} — c is the y-intercept.</li>
     <li><b>Vertex</b> ${m("y = a(x − h)² + k")} — vertex is ${m("(h, k)")}. Watch the sign: ${m("(x − 3)²")} means h = 3.</li>
     <li><b>Factored</b> ${m("y = a(x − r)(x − s)")} — roots at r and s.</li></ul>`},
    {h:"<span>Completing the square</span>",
     b:`<p>Turn standard into vertex form: halve the x-coefficient, square it, add and subtract it.</p>
     <div class="ex">${m("y = x² + 6x + 2")} → ${m("y = (x² + 6x + 9) − 9 + 2")} → ${m("y = (x + 3)² − 7")}. Vertex ${m("(−3, −7)")}.</div>`},
    {h:"The <span>discriminant</span> counts roots",
     b:`<p>${m("D = b² − 4ac")}. Positive → two real roots. Zero → one (the vertex sits on the x-axis). Negative → none — the parabola never touches the x-axis, like ${m("y = −x² + 4x − 9")} with D = −20.</p>`},
    {h:"<span>Max/min</span> word problems",
     b:`<p>Anything thrown, fenced, or priced quadratically peaks at the vertex. Height ${m("h(t) = −5t² + vt + h₀")} peaks at ${m("t = −b/2a = v/10")} seconds.</p>`}],
  gens:[
    ()=>{ const a=pick([1,2,-1,-2]),h=nz(-6,6),k=nz(-9,9);
      return {q:`State the vertex of ${m(`y = ${a===1?"":a===-1?"−":a}(x ${sgn(-h)})² ${sgn(k)}`)}.`,kind:"pair",labels:["h","k"],ans:[h,k],
        sol:`Vertex form ${m("y = a(x − h)² + k")} → the vertex is ${m(`(${h}, ${k})`)}. The bracket sign flips: ${m(`(x ${sgn(-h)})`)} means h = ${h}.`}; },
    ()=>{ const h=nz(-5,5),k=nz(-9,9),b=-2*h,c=h*h+k;
      return {q:`Complete the square: the vertex of ${m(`y = x² ${sgn(b)}x ${sgn(c)}`)} is:`,kind:"pair",labels:["h","k"],ans:[h,k],
        sol:`Half of ${b} is ${-h}; square it: ${h*h}. ${m(`y = (x ${sgn(-h)})² − ${h*h} ${sgn(c)} = (x ${sgn(-h)})² ${sgn(k)}`)}. Vertex ${m(`(${h}, ${k})`)}.`}; },
    ()=>{ const a=nz(-3,3),b=ri(-8,8),c=ri(-8,8),D=b*b-4*a*c;
      return {q:`How many real roots does ${m(`y = ${a}x² ${sgn(b)}x ${sgn(c)}`)} have?`,kind:"mc",
        opts:["Two","One","None","Can't tell"],ans:D>0?0:D===0?1:2,
        sol:`${m(`D = b² − 4ac = ${b}² − 4(${a})(${c}) = ${D}`)}. ${D>0?"Positive → <b>two</b> real roots.":D===0?"Zero → exactly <b>one</b> root.":"Negative → <b>no</b> real roots — it never crosses the x-axis."}`}; },
    ()=>{ let r=nz(-6,6),s=nz(-6,6); if(r===s) s=r+ri(1,3);
      const b=-(r+s),c=r*s,lo=Math.min(r,s),hi=Math.max(r,s);
      return {q:`Solve ${m(`x² ${sgn(b)}x ${sgn(c)} = 0`)}. Enter the two roots.`,kind:"pair",labels:["smaller","larger"],ans:[lo,hi],
        sol:`Factor: ${m(`(x ${sgn(-r)})(x ${sgn(-s)}) = 0`)} → ${m(`x = ${lo}`)} or ${m(`x = ${hi}`)}. Check: they multiply to ${c} and add to ${-b}.`}; },
    ()=>{ const v=pick([10,20,30,40]),h0=ri(1,3),t=v/10,hm=-5*t*t+v*t+h0;
      return {q:`A ball is thrown: ${m(`h(t) = −5t² + ${v}t + ${h0}`)} (metres, seconds). What is its <b>maximum height</b>?`,kind:"num",ans:hm,
        sol:`Peak at ${m(`t = −b/2a = ${v}/10 = ${t}`)} s. Then ${m(`h(${t}) = −5(${t*t}) + ${v*t} + ${h0} = ${hm}`)} m.`}; },
    ()=>{ const a=nz(-4,4),b=2*a*nz(-4,4);
      const ax=-b/(2*a);
      return {q:`State the axis of symmetry of ${m(`y = ${a}x² ${sgn(b)}x + 1`)}. x =`,kind:"num",ans:ax,
        sol:`${m(`x = −b/2a = ${-b}/(2·${a}) = ${ax}`)}. The vertex, and the mirror line, live there.`}; }],
},
{ id:"ex", em:"📈", name:"Exponential functions",
  blurb:"Exponent laws, negative and fractional exponents, growth and decay.",
  lesson:[
    {h:"The <span>exponent laws</span>",
     b:`<ul><li>Multiply → add exponents: ${m("a⁵ · a³ = a⁸")}</li>
     <li>Divide → subtract: ${m("a⁷ ÷ a² = a⁵")}</li>
     <li>Power of a power → multiply: ${m("(a³)⁴ = a¹²")}</li>
     <li>${m("a⁰ = 1")} and ${m("a⁻ⁿ = 1/aⁿ")}</li>
     <li>Fractions are roots: ${m("8^(2/3) = (³√8)² = 4")}</li></ul>`},
    {h:"<span>Growth</span> and <span>decay</span>",
     b:`<p>${m("A = A₀ · bᵗ")}. Growth has b > 1 (7% growth → b = 1.07); decay has 0 < b < 1 (half-life → b = ½ per half-life). Exponential change multiplies; linear change adds.</p>
     <div class="ex"><b>Half-life:</b> 80 mg with three half-lives elapsed → ${m("80 · (½)³ = 10")} mg.</div>`}],
  gens:[
    ()=>{ const a=ri(2,5),p=ri(2,5),q=ri(2,5);

    ()=>{ const a=ri(2,4),n=ri(1,3);

    ()=>{ const p0=pick([100,200,500,1000]),r=pick([5,10,20]),t=ri(2,3);

      return {q:`A population of ${p0} grows ${r}% per year. After ${t} years it is (2 decimals):`,kind:"num",ans,tol:0.05,

    ()=>{ const start=pick([80,160,240,400]),n=ri(2,4);

    {h:"Any triangle: <span>sine law</span> & <span>cosine law</span>",
     b:`<ul><li><b>Sine law</b> ${m("a/sin A = b/sin B")} — use with a matching side-angle pair.</li>

     b:`<p>${m("sin 30° = ½")}, ${m("cos 60° = ½")}, ${m("tan 45° = 1")}, ${m("sin 45° = √2/2")}, ${m("sin 60° = √3/2")}. These come from the 1-1-√2 and 1-√3-2 triangles.</p>`},
    {h:"<span>Sinusoidal</span> functions",

{ id:"sq", em:"🪜", name:"Sequences & series",
  blurb:"Arithmetic and geometric patterns, nth terms, sums, recursion.",
  lesson:[
    {h:"<span>Arithmetic</span>: add the same thing",
     b:`<p>Common difference d. ${m("tₙ = a + (n − 1)d")} and sum ${m("Sₙ = n/2 · (2a + (n − 1)d)")}.</p>
     <div class="ex">5, 8, 11, … → ${m("t₂₀ = 5 + 19·3 = 62")}.</div>`},
    {h:"<span>Geometric</span>: multiply the same thing",
     b:`<p>Common ratio r. ${m("tₙ = a·rⁿ⁻¹")} and ${m("Sₙ = a(rⁿ − 1)/(r − 1)")}. Geometric grows like an exponential — same DNA.</p>`},
    {h:"<span>Recursion</span> defines by yesterday",
     b:`<p>${m("t₁ = 4, tₙ = 2tₙ₋₁ − 1")} says: to get a term, look at the previous one. Compute step by step: 4, 7, 13, 25, …</p>`}],
  gens:[
    ()=>{ const a=ri(1,9),d=nz(-6,9),n=ri(8,20);
      return {q:`Arithmetic: ${m(`${a}, ${a+d}, ${a+2*d}, …`)} Find ${m(`t${n}`)}.`,kind:"num",ans:a+(n-1)*d,
        sol:`${m(`tₙ = a + (n−1)d = ${a} + ${n-1}·(${d}) = ${a+(n-1)*d}`)}.`}; },
    ()=>{ const a=ri(1,6),d=ri(2,7),n=ri(6,12);
      const ans=n/2*(2*a+(n-1)*d);
      return {q:`Sum the first ${m(n)} terms of ${m(`${a}, ${a+d}, ${a+2*d}, …`)}`,kind:"num",ans,
        sol:`${m(`Sₙ = n/2(2a + (n−1)d) = ${n}/2(${2*a} + ${(n-1)*d}) = ${ans}`)}.`}; },
    ()=>{ const a=ri(2,5),r=ri(2,3),n=ri(4,7);
      return {q:`Geometric: ${m(`${a}, ${a*r}, ${a*r*r}, …`)} Find ${m(`t${n}`)}.`,kind:"num",ans:a*Math.pow(r,n-1),
        sol:`${m(`tₙ = a·rⁿ⁻¹ = ${a}·${r}^${n-1} = ${a*Math.pow(r,n-1)}`)}.`}; },
    ()=>{ const a=ri(1,4),r=2,n=ri(5,8);
      const ans=a*(Math.pow(r,n)-1);
      return {q:`Sum the first ${m(n)} terms of ${m(`${a}, ${a*2}, ${a*4}, …`)}`,kind:"num",ans,
        sol:`${m(`Sₙ = a(rⁿ−1)/(r−1) = ${a}(2^${n}−1)/1 = ${ans}`)}.`}; },
    ()=>{ const t1=ri(2,6),k=ri(2,3),c=nz(-3,3);
      let t=t1; for(let i=0;i<3;i++) t=k*t+c;
      return {q:`If ${m(`t₁ = ${t1}`)} and ${m(`tₙ = ${k}tₙ₋₁ ${sgn(c)}`)}, find ${m("t₄")}.`,kind:"num",ans:t,
        sol:`Step it: t₂ = ${k*t1+c}, t₃ = ${k*(k*t1+c)+c}, ${m(`t₄ = ${t}`)}.`}; },
    ()=>{ const first=ri(12,20),d=ri(2,4),rows=ri(8,15);
      const ans=rows/2*(2*first+(rows-1)*d);
      return {q:`A theatre has ${m(first)} seats in row 1, each row adds ${m(d)} seats, ${m(rows)} rows. Total seats:`,kind:"num",ans,
        sol:`Arithmetic series: ${m(`S = ${rows}/2(2·${first} + ${(rows-1)}·${d}) = ${ans}`)} seats.`}; }],
},

{ id:"rat", em:"🍕", name:"Rational expressions",
  blurb:"Simplifying algebraic fractions and never, ever dividing by zero.",
  lesson:[
    {h:"<span>Restrictions</span> come first",
     b:`<p>A rational expression is a fraction of polynomials. Before simplifying anything, ban every x that zeroes a denominator — even factors you're about to cancel keep their restriction.</p>
     <div class="ex">${m("(x² − 9)/(x − 3) = x + 3")}, but still ${m("x ≠ 3")}. The simplified version remembers the hole.</div>`},
    {h:"<span>Simplify</span> by factoring",
     b:`<p>Factor top and bottom, cancel whole factors (never terms!). ${m("(x+2)")} cancels; the 2 in ${m("(x+2)")} does not.</p>`}],
  gens:[
    ()=>{ const a=ri(2,9);
      return {q:`State the positive restriction for ${m(`(x + 1)/(x² − ${a*a})`)}. x ≠`,kind:"num",ans:a,
        sol:`${m(`x² − ${a*a} = (x − ${a})(x + ${a})`)} → x ≠ ±${a}. The positive one is <b>${a}</b>.`}; },
    ()=>{ const a=ri(2,8);
      return {q:`Simplify ${m(`(x² − ${a*a})/(x + ${a})`)}.`,kind:"mc",
        opts:[`x − ${a}`,`x + ${a}`,`x² − ${a}`,`${a} − x`],ans:0,
        sol:`Difference of squares: ${m(`(x−${a})(x+${a})/(x+${a}) = x − ${a}`)}, with ${m(`x ≠ −${a}`)}.`}; },
    ()=>{ const a=ri(2,6),b=ri(2,6);
      return {q:`Simplify ${m(`(${a}x²)/(${a*b}x)`)} for x ≠ 0.`,kind:"mc",
        opts:[`x/${b}`,`${b}x`,`x²/${b}`,`1/${b}x`],ans:0,
        sol:`${m(`${a}x²/${a*b}x = x/${b}`)} — cancel ${a} and one x.`}; },
    ()=>{ const a=ri(1,5),x=ri(2,5);
      const ans=(x+a)/(x-a);
      const num=x+a, den=x-a;
      return {q:`Evaluate ${m(`(x + ${a})/(x − ${a})`)} at ${m(`x = ${x+2*a}`)}.`,kind:"num",ans:+(((x+2*a)+a)/((x+2*a)-a)).toFixed(2),tol:0.02,
        sol:`Substitute: ${m(`(${x+2*a} + ${a})/(${x+2*a} − ${a}) = ${x+3*a}/${x+a} = ${(((x+3*a))/((x+a))).toFixed(2)}`)}.`}; }],
}];

let view={page:"home",unit:null,q:null,picked:-1,answered:false};

function render(){
  const app=$("#app");
  if(view.page==="home"){
    app.innerHTML=`<header><div class="brand" onclick="go('home')">Math<i>11</i></div>
      <div class="tag">grade 11 · canada · mcr3u-aligned</div></header>
      <p class="lead">The Grade 11 course — functions through financial math — in short lessons,
      live graphs you can drag, and practice questions that never run out. Every answer comes
      with the full worked solution. Get ${MASTER} right in a unit to master it.</p>
      <div class="units">${UNITS.map(u=>{
        const p=prog(u.id),pc=Math.min(100,p.right/MASTER*100);
        return `<div class="unit ${p.right>=MASTER?"done":""}" data-u="${u.id}">
          <div class="em">${u.em}</div><h3>${u.name}</h3><p>${u.blurb}</p>
          <div class="bar"><i style="width:${pc}%"></i></div>
          <div class="st">${p.right>=MASTER?"✓ mastered":p.right+" / "+MASTER+" correct"}</div></div>`;
      }).join("")}</div>
      <div class="foot">every question is generated fresh · progress lives on this device<br>
      aligned with ontario mcr3u — a close cousin of pre-calculus 11 in bc &amp; alberta</div>`;
    document.querySelectorAll(".unit").forEach(el=>el.onclick=()=>{ view={page:"lesson",unit:el.dataset.u}; render(); });
    return;
  }
  const u=UNITS.find(x=>x.id===view.unit);
  if(view.page==="lesson"){
    app.innerHTML=`<div class="crumb"><button id="back">← units</button><span class="here">${u.em} ${u.name}</span></div>
      <div class="lesson">${u.lesson.map(c=>`<div class="card"><h4>${c.h}</h4>${c.b}</div>`).join("")}
      ${u.widget?widgetHTML(u.widget):""}</div>
      <div class="gowrap"><button class="go" id="prac">Practice ${u.name.toLowerCase()} →</button></div>`;
    $("#back").onclick=()=>{ view={page:"home"}; render(); };
    $("#prac").onclick=()=>{ view={page:"prac",unit:u.id}; nextQ(); };
    if(u.widget) wireWidget(u.widget);
    return;
  }
  if(view.page==="prac"){
    const p=prog(u.id),q=view.q;
    app.innerHTML=`<div class="crumb"><button id="back">← lesson</button><span class="here">${u.em} practice</span></div>
      <div class="card"><div class="qhead"><span class="n">question ${p.tried+1}</span>
        <span class="streak">${(P._streak||0)>1?"🔥 "+P._streak+" in a row":""}</span></div>
      <div class="q">${q.q}</div>
      ${q.kind==="mc"
        ? `<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${/[a-z]\)|√|½|—/.test(o)||!/^[A-Z]/.test(o)?m(o):o}</button>`).join("")}</div>`
        : `<div class="ansrow">${(q.kind==="pair"?q.labels:[""]).map((l,i)=>
            `${l?`<label>${l}</label>`:""}<input inputmode="text" autocomplete="off" id="in${i}">`).join("")}</div>`}
      <div class="verdict" id="verdict"></div>
      <div class="sol" id="sol">${q.sol}</div>
      <div class="gowrap">
        <button class="go" id="check">Check</button>
        <button class="go ghost" id="skip">Show me + next</button>
      </div>
      <div class="mast"><div class="bar"><i style="width:${Math.min(100,p.right/MASTER*100)}%"></i></div>
        <span class="t">${p.right>=MASTER?"MASTERED ✓":p.right+"/"+MASTER+" TO MASTERY"}</span></div>
      </div>`;
    $("#back").onclick=()=>{ view={page:"lesson",unit:u.id}; render(); };
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(view.answered) return;
      document.querySelectorAll(".opt").forEach(x=>x.classList.remove("pick"));
      b.classList.add("pick"); view.picked=+b.dataset.i;
    });
    $("#check").onclick=check;
    $("#skip").onclick=()=>{ if(!view.answered){ reveal(false,true); } else nextQ(); };
    const first=$("#in0"); if(first) first.focus();
    document.querySelectorAll(".ansrow input").forEach(inp=>inp.addEventListener("keydown",e=>{ if(e.key==="Enter") $("#check").click(); }));
  }
}
function widgetHTML(w){
  if(w==="parabola") return `<div class="card widget"><h4>Play with the <span>parabola</span></h4>
    <div id="wg"></div>
    <div class="sl"><b>a = <span id="va">1</span></b><input type="range" id="wa" min="-3" max="3" step="0.5" value="1"></div>
    <div class="sl"><b>h = <span id="vh">0</span></b><input type="range" id="wh" min="-5" max="5" step="1" value="0"></div>
    <div class="sl"><b>k = <span id="vk">0</span></b><input type="range" id="wk" min="-6" max="6" step="1" value="0"></div>
    <div class="out" id="wout"></div></div>`;
  if(w==="sine") return `<div class="card widget"><h4>Play with the <span>sine wave</span></h4>
    <div id="wg"></div>
    <div class="sl"><b>a = <span id="va">2</span></b><input type="range" id="wa" min="-4" max="4" step="1" value="2"></div>
    <div class="sl"><b>k = <span id="vh">1</span></b><input type="range" id="wh" min="1" max="4" step="1" value="1"></div>
    <div class="sl"><b>c = <span id="vk">0</span></b><input type="range" id="wk" min="-3" max="3" step="1" value="0"></div>
    <div class="out" id="wout"></div></div>`;
  return `<div class="card widget"><h4>Watch <span>compounding</span> run away from simple interest</h4>
    <div id="wg"></div>
    <div class="sl"><b>rate <span id="va">8</span>%</b><input type="range" id="wa" min="1" max="15" step="1" value="8"></div>
    <div class="sl"><b><span id="vh">20</span> yrs</b><input type="range" id="wh" min="5" max="40" step="1" value="20"></div>
    <div class="out" id="wout"></div></div>`;
}
function wireWidget(w){
  const up=()=>{
    const a=+$("#wa").value,h=+$("#wh").value,k=$("#wk")?+$("#wk").value:0;
    $("#va").textContent=a; $("#vh").textContent=h; if($("#vk")) $("#vk").textContent=k;
    if(w==="parabola"){
      $("#wg").innerHTML=parabolaSVG(a||0.001,h,k);
      const b=-2*(a||0.001)*h,c=(a||0.001)*h*h+k,D=b*b-4*(a||0.001)*c;
      $("#wout").innerHTML=`y = ${a}(x ${sgn(-h)})² ${sgn(k)} · vertex (${h}, ${k}) · opens ${a>=0?"up":"down"}<br>`+
        `standard: y = ${a}x² ${sgn(+b.toFixed(1))}x ${sgn(+c.toFixed(1))} · D = ${D.toFixed(1)} → ${D>0.001?"two roots":D<-0.001?"no real roots":"one root"}`;
    } else if(w==="sine"){
      $("#wg").innerHTML=sineSVG(a,h,k);
      $("#wout").innerHTML=`y = ${a} sin(${h===1?"":h}x) ${sgn(k)} · amplitude ${Math.abs(a)} · period ${(360/h)}° · midline y = ${k}`;
    } else {
      const P0=1000;
      $("#wg").innerHTML=growthSVG(P0,a/100,h);
      const comp=P0*Math.pow(1+a/100,h),simp=P0*(1+a/100*h);
      $("#wout").innerHTML=`$1,000 at ${a}%/a for ${h} years<br>compound: ${money(comp)} · simple would be: ${money(simp)} · gap: ${money(comp-simp)}`;
    }
  };
  ["wa","wh","wk"].forEach(id=>{ const el=$("#"+id); if(el) el.oninput=up; });
  up();
}
function nextQ(){
  const u=UNITS.find(x=>x.id===view.unit);
  view.q=pick(u.gens)(); view.picked=-1; view.answered=false;
  view.page="prac"; render();
  window.scrollTo({top:0});
}
function check(){
  if(view.answered){ nextQ(); return; }
  const q=view.q;
  let right=false;
  if(q.kind==="mc"){
    if(view.picked<0) return;
    right=view.picked===q.ans;
    document.querySelectorAll(".opt").forEach((b,i)=>{
      if(i===q.ans) b.classList.add("right");
      else if(i===view.picked) b.classList.add("wrong");
    });
  } else {
    const vals=(q.kind==="pair"?[0,1]:[0]).map(i=>parseFloat(($("#in"+i)?.value||"").replace(/[$,\s]/g,"").replace("−","-")));
    if(vals.some(v=>isNaN(v))) return;
    const want=q.kind==="pair"?q.ans:[q.ans];
    const tol=q.tol??0.001;
    right=vals.every((v,i)=>Math.abs(v-want[i])<=tol);
  }
  reveal(right,false);
}
function reveal(right,skipped){
  const u=UNITS.find(x=>x.id===view.unit);
  const p=prog(u.id);
  p.tried++;
  view.answered=true;
  if(right){ p.right++; P._streak=(P._streak||0)+1; }
  else P._streak=0;
  saveP();
  const v=$("#verdict");
  v.className="verdict "+(right?"ok":"no");
  v.textContent=right?pick(["Correct. 🎯","Nailed it.","Yes — exactly.","Clean. ✓","That's the one."])
    :skipped?"Here's how it goes:":"Not quite — walk through it below, then hit Next.";
  $("#sol").classList.add("show");
  $("#check").textContent="Next →";
  $("#skip").textContent="Next →";
  if(right&&p.right===MASTER) confetti();
  const bar=document.querySelector(".mast .bar i");
  if(bar) bar.style.width=Math.min(100,p.right/MASTER*100)+"%";
  const t=document.querySelector(".mast .t");
  if(t) t.textContent=p.right>=MASTER?"MASTERED ✓":p.right+"/"+MASTER+" TO MASTERY";
}
function confetti(){
  const c=$("#cf"),x=c.getContext("2d");
  c.width=innerWidth; c.height=innerHeight;
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*300,
    v:2+Math.random()*4,s:4+Math.random()*6,r:Math.random()*6.28,
    col:pick(["#2457e0","#d43a52","#1d9f61","#b98a1c"])}));
  let n=0;
  const tick=()=>{
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.y+=p.v; p.r+=0.1;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r);
      x.fillStyle=p.col; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); });
    if(++n<160) requestAnimationFrame(tick);
    else x.clearRect(0,0,c.width,c.height);
  };
  tick();
}
function go(p){ view={page:p}; render(); }
render();
window.M11={UNITS,prog:P,gen:(uid,i)=>UNITS.find(u=>u.id===uid).gens[i]()};
</script>
