<body><h1>More People Can Make It Slower</h1><p>When a job falls behind, the reflex is to add crews. Put four trades in one room and they wait on each other, block each other's access and damage each other's work. Output per person drops, sometimes far enough that the room finishes later.</p><p><a href="/all.html#more-people-can-make-it-slower">Read it in the journal →</a></p></body></html>
