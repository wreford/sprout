<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{position:fixed;inset:0;overflow:hidden;background:#140d2b;color:#e8e2f5;
  touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  font-family:-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif}
#stars{position:fixed;inset:0;z-index:0}
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 10px);
  max-width:820px;margin:0 auto}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
/* ---------- title ---------- */
#tTitle{font-size:clamp(26px,6vw,44px);font-weight:900;text-align:center;line-height:1.1;
  background:linear-gradient(90deg,#ffd95e,#ff9ac4,#b48ae8,#7ad8f0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(180,138,232,0.45));margin-top:8px}
#tSub{text-align:center;font-size:12.5px;color:#9a8cc0;margin-top:6px;letter-spacing:0.14em;
  text-transform:uppercase;font-weight:700}
#wizard{height:200px;margin:8px auto;position:relative;width:200px}
#rankLbl{text-align:center;font-size:13px;color:#ffd95e;font-weight:800}
#xpBar{width:min(300px,80%);height:8px;background:rgba(255,255,255,0.1);border-radius:99px;
  margin:8px auto;overflow:hidden}
#xpFill{height:100%;border-radius:99px;background:linear-gradient(90deg,#b48ae8,#ffd95e)}
#schools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px;
  overflow-y:auto;padding:4px 2px 12px;touch-action:pan-y}
@media(min-width:620px){#schools{grid-template-columns:repeat(3,1fr)}}
.school{border-radius:18px;padding:14px 10px 12px;position:relative;text-align:center;
  background:linear-gradient(160deg,rgba(255,255,255,0.09),rgba(255,255,255,0.02));
  border:1.5px solid var(--sc,#6a5a9a);box-shadow:0 6px 20px rgba(0,0,0,0.35)}
.school:active{transform:scale(0.96)}
.school .em{font-size:30px;filter:drop-shadow(0 0 10px var(--sc))}
.school .sn{font-size:12.5px;font-weight:900;margin-top:6px;color:#fff;letter-spacing:0.03em}
.school .su{font-size:9.5px;color:#9a8cc0;margin-top:2px}
.school .stars{margin-top:6px;font-size:11px;letter-spacing:2px;color:#ffd95e}
.school.dragon{grid-column:1/-1;background:linear-gradient(120deg,#3a1428,#1c0f33);
  border-color:#ff6a5e}
/* ---------- play ---------- */
#pTop{display:flex;align-items:center;gap:10px;padding:4px 0}
#pBack{font-size:22px;padding:4px 10px;background:rgba(255,255,255,0.08);border-radius:12px;border:none;color:#e8e2f5}
#pSchool{font-weight:900;font-size:14px;color:var(--sc,#b48ae8)}
#pStreak{margin-left:auto;font-weight:800;font-size:13px;color:#ffd95e}
#orb{width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,var(--sc,#b48ae8) 55%,#3a2a60);
  box-shadow:0 0 16px var(--sc,#b48ae8);transition:transform 0.3s}
#orb.happy{animation:orbH 0.6s ease}
#orb.mad{animation:orbM 0.5s ease}
@keyframes orbH{30%{transform:translateY(-14px) scale(1.15)}}
@keyframes orbM{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
#circleWrap{position:relative;margin:6px 0 4px}
#qCard{position:relative;border-radius:20px;padding:18px 16px;
  background:linear-gradient(170deg,rgba(255,255,255,0.1),rgba(255,255,255,0.03));
  border:1.5px solid var(--sc,#6a5a9a);
  box-shadow:0 0 34px rgba(0,0,0,0.4), inset 0 0 40px rgba(180,138,232,0.05);
  animation:summon 0.45s cubic-bezier(.2,1.4,.4,1)}
@keyframes summon{0%{transform:scale(0.6) rotate(-3deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
#qKicker{font-size:10px;font-weight:800;letter-spacing:0.18em;color:var(--sc,#b48ae8);
  text-transform:uppercase}
#qText{font-size:clamp(17px,3.4vw,24px);font-weight:700;margin-top:8px;line-height:1.45}
#qText .m{font-family:"Georgia",serif;font-style:italic;color:#ffd95e;white-space:nowrap}
#ansRow{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
#ansBox{flex:1;font-size:26px;font-weight:800;text-align:center;padding:12px;
  background:rgba(0,0,0,0.35);border-radius:14px;border:1.5px dashed var(--sc,#6a5a9a);
  min-height:56px;color:#ffd95e;letter-spacing:0.05em}
#ansBox.empty{color:#5a4a80}
#castBtn{padding:14px 18px;border-radius:14px;border:none;font-weight:900;font-size:15px;
  background:linear-gradient(135deg,var(--sc,#b48ae8),#6a4ad8);color:#fff;
  box-shadow:0 4px 18px rgba(106,74,216,0.5)}
#castBtn:active{transform:scale(0.95)}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto;padding-top:8px;
  width:100%;max-width:560px;margin-left:auto;margin-right:auto}
#pad button{font-size:24px;font-weight:800;padding:0;height:clamp(52px,8.5vh,76px);
  border-radius:16px;border:1.5px solid rgba(180,160,230,0.25);color:#e8e2f5;
  background:linear-gradient(170deg,rgba(255,255,255,0.1),rgba(255,255,255,0.02));
  box-shadow:0 3px 10px rgba(0,0,0,0.35)}
#pad button:active{transform:scale(0.92);background:rgba(180,138,232,0.3)}
#pad .alt{color:#ffd95e;font-size:19px}
#solution{display:none;border-radius:16px;margin-top:10px;padding:14px;
  background:rgba(0,0,0,0.4);border:1.5px solid #ffd95e;overflow-y:auto;max-height:36vh;
  touch-action:pan-y}
#solution.on{display:block}
#solution h4{color:#ffd95e;font-size:12px;letter-spacing:0.12em;margin-bottom:8px}
#solution .st{font-size:14.5px;margin:7px 0;color:#d8d0ec;line-height:1.5}
#solution .st b{color:#fff}
#solGraph{width:100%;height:120px;margin-top:8px;border-radius:10px;background:rgba(255,255,255,0.03)}
#midGap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
#solution.on ~ #midGap{display:none}
.mc{position:relative;width:min(30vh,230px);height:min(30vh,230px);opacity:0.5}
.mc .r1,.mc .r2{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--sc,#6a5a9a)}
.mc .r1{animation:spinA 24s linear infinite}
.mc .r2{inset:14%;border-style:dotted;animation:spinB 16s linear infinite}
@keyframes spinA{to{transform:rotate(360deg)}}
@keyframes spinB{to{transform:rotate(-360deg)}}
.mc .gl{position:absolute;left:50%;top:50%;font-family:Georgia,serif;font-size:15px;
  color:var(--sc,#b48ae8);text-shadow:0 0 8px var(--sc,#b48ae8)}
.mc .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;
  color:#ffd95e;text-shadow:0 0 14px #ffd95e;animation:corep 2.2s ease-in-out infinite}
@keyframes corep{50%{transform:translate(-50%,-50%) scale(1.3);opacity:0.7}}
#nextBtn{width:100%;margin-top:10px;padding:13px;border-radius:14px;border:none;
  font-weight:900;font-size:14px;background:#274a2e;color:#8fe08a;border:1.5px solid #8fe08a}
#keiraSay{text-align:center;font-size:12.5px;color:#c9b8e8;min-height:18px;margin-top:6px;font-style:italic}
/* dragon */
#dragonHud{display:none;align-items:center;gap:10px;margin:4px 0}
#dragonHud.on{display:flex}
#dHp{flex:1;height:14px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden}
#dHpF{height:100%;background:linear-gradient(90deg,#ff6a5e,#c9332e);border-radius:99px;transition:width 0.4s}
#dTimer{font-weight:900;color:#ff9a5e;font-size:15px;min-width:40px;text-align:right}
/* vault + rewards */
#topBar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:2px}
.pill{font-weight:900;font-size:13px;padding:9px 14px;border-radius:999px;
  background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,217,94,0.5);color:#ffd95e}
button.pill:active{transform:scale(0.94)}
.vTop{display:flex;align-items:center;gap:10px;padding:4px 0 8px}
#vBack{font-size:22px;padding:4px 10px;background:rgba(255,255,255,0.08);border-radius:12px;border:none;color:#e8e2f5}
#vWrap{overflow-y:auto;touch-action:pan-y;flex:1;padding:2px 2px 24px;min-height:0}
#vGems{text-align:center;font-size:32px;font-weight:900;color:#ffd95e;margin:6px 0 2px;
  filter:drop-shadow(0 0 16px rgba(255,217,94,0.5))}
#vSub{text-align:center;font-size:10.5px;color:#9a8cc0;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:10px}
.rw{display:flex;gap:12px;align-items:center;border-radius:18px;padding:12px;margin:10px 0;
  background:linear-gradient(160deg,rgba(255,255,255,0.09),rgba(255,255,255,0.02));border:1.5px solid #6a5a9a}
.rw .re{font-size:34px;filter:drop-shadow(0 0 8px rgba(255,217,94,0.4))}
.rw .rn{font-weight:900;font-size:13.5px}
.rw .rd{font-size:11px;color:#9a8cc0;margin-top:3px;line-height:1.4}
.rw button{margin-left:auto;padding:10px 12px;border-radius:12px;border:none;font-weight:900;font-size:12.5px;
  background:linear-gradient(135deg,#ffd95e,#ff9a5e);color:#2a1a08;white-space:nowrap}
.rw button:disabled{opacity:0.4}
.rw button:active{transform:scale(0.93)}
.vH{font-size:11px;color:#ffd95e;letter-spacing:0.16em;margin:16px 0 2px}
.coupon{position:relative;border:2px dashed #ffd95e;border-radius:14px;padding:12px;margin:10px 0;
  background:repeating-linear-gradient(45deg,rgba(255,217,94,0.04) 0 10px,rgba(255,217,94,0.09) 10px 20px),#231a47}
.coupon .cc{font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:0.18em;color:#ffd95e;font-weight:900}
.coupon .ct{font-size:12.5px;font-weight:800;margin-top:3px}
.coupon .cf{font-size:9.5px;color:#9a8cc0;margin-top:5px;line-height:1.5}
.coupon .rdm{margin-top:8px;padding:9px 12px;border-radius:10px;border:1.5px solid #8fe08a;
  background:transparent;color:#8fe08a;font-weight:900;font-size:11px}
.coupon.used{opacity:0.5}
.coupon.used::after{content:"REDEEMED";position:absolute;right:12px;top:34%;transform:rotate(-14deg);
  border:2.5px solid #ff6a5e;color:#ff6a5e;font-weight:900;padding:2px 9px;border-radius:6px;font-size:14px;letter-spacing:0.1em}
/* arcade */
#gBody{flex:1;overflow:hidden;display:flex;flex-direction:column;padding-top:8px}
#gScore{margin-left:auto;font-weight:900;color:#ffd95e;font-size:15px}
#gTime{font-weight:900;color:#7ad8f0;min-width:48px;text-align:right;font-size:15px;font-variant-numeric:tabular-nums}
.rrQ{font-size:54px;font-weight:900;text-align:center;margin:7vh 0 26px;color:#fff;
  filter:drop-shadow(0 0 18px rgba(122,216,240,0.5))}
.rrOpts{display:flex;flex-direction:column;gap:12px;max-width:420px;margin:0 auto;width:100%}
.rrOpts button{font-size:28px;font-weight:900;padding:17px;border-radius:18px;
  border:1.5px solid rgba(122,216,240,0.4);color:#e8e2f5;
  background:linear-gradient(170deg,rgba(255,255,255,0.1),rgba(255,255,255,0.02))}
.rrOpts button:active{transform:scale(0.95)}
.ffT{font-size:26px;text-align:center;margin:3vh 0 18px;color:#e8e2f5}
.ffT b{color:#8fe08a;font-size:46px;filter:drop-shadow(0 0 14px rgba(143,224,138,0.5))}
.ffGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:400px;margin:0 auto;width:100%}
.ffTile{font-size:30px;font-weight:900;aspect-ratio:1;border-radius:18px;
  border:1.5px solid rgba(143,224,138,0.35);color:#e8e2f5;
  background:linear-gradient(170deg,rgba(255,255,255,0.1),rgba(255,255,255,0.02))}
.ffTile.sel{background:rgba(143,224,138,0.3);border-color:#8fe08a;transform:scale(0.94)}
.gsCv{width:100%;height:180px;border-radius:14px;background:rgba(0,0,0,0.3);margin:8px 0 14px}
.gsOpts{display:flex;flex-direction:column;gap:10px;max-width:460px;margin:0 auto;width:100%}
.gsOpts button{font-size:19px;font-weight:800;padding:14px;border-radius:14px;
  border:1.5px solid rgba(255,154,196,0.4);color:#ffd95e;font-family:Georgia,serif;font-style:italic;
  background:linear-gradient(170deg,rgba(255,255,255,0.1),rgba(255,255,255,0.02))}
#breakOv{position:fixed;inset:0;z-index:97;background:rgba(8,5,20,0.96);display:none;
  align-items:center;justify-content:center;padding:20px}
#breakOv.on{display:flex}
#breakCard{text-align:center;max-width:380px;width:100%}
#brEmoji{font-size:76px;animation:brFloat 2.4s ease-in-out infinite;display:inline-block}
@keyframes brFloat{50%{transform:translateY(-12px)}}
#brTitle{color:#ffd95e;font-size:19px;margin-top:10px;letter-spacing:0.06em}
#brTimer{font-size:58px;font-weight:900;color:#fff;margin:8px 0;font-variant-numeric:tabular-nums;
  filter:drop-shadow(0 0 22px rgba(180,138,232,0.6))}
#brQuip{color:#9a8cc0;font-size:13px;font-style:italic;min-height:36px;line-height:1.5}
#brEnd{margin-top:14px;padding:12px 22px;border-radius:999px;border:1.5px solid #8fe08a;
  background:transparent;color:#8fe08a;font-weight:900;font-size:13px}
#scroll{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-150%);
  z-index:96;width:min(92vw,430px);background:linear-gradient(170deg,#2a1f52,#1a1238);
  border:1.5px solid #ffd95e;border-radius:16px;padding:12px 14px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);transition:transform 0.45s cubic-bezier(.2,1.3,.4,1)}
#scroll.on{transform:translate(-50%,0)}
#scroll .sh{font-size:10px;color:#ffd95e;letter-spacing:0.16em;font-weight:800}
#scroll .sb{font-size:13.5px;color:#e8e2f5;margin-top:4px;font-style:italic;line-height:1.45}
.burst{position:fixed;pointer-events:none;z-index:90;font-size:20px;font-weight:900;
  animation:bursty 0.9s ease-out forwards}
@keyframes bursty{0%{transform:translate(0,0) scale(0.6);opacity:1}
  100%{transform:translate(var(--bx),var(--by)) scale(1.3);opacity:0}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:80;opacity:0;transition:opacity 0.3s}
.shake{animation:shk 0.4s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#bigOv{position:fixed;inset:0;z-index:95;background:rgba(10,6,24,0.92);display:none;
  align-items:center;justify-content:center;padding:18px}
#bigOv.on{display:flex}
#bigCard{background:#1e1440;border:2px solid #ffd95e;border-radius:22px;padding:26px 20px;
  text-align:center;max-width:380px;width:100%;box-shadow:0 0 60px rgba(180,138,232,0.3)}
#bigCard h2{color:#ffd95e;font-size:22px}
#bigCard p{color:#c9b8e8;font-size:13.5px;margin:8px 0}
#bigCard button{margin-top:12px;padding:13px 24px;border-radius:999px;border:none;
  font-weight:900;background:linear-gradient(135deg,#b48ae8,#6a4ad8);color:#fff;font-size:14px}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="flash"></div>
<div id="app">

<div class="screen on" id="scHome">

</div>

    <div id="orb"></div>
    <span id="pStreak"></span>
  </div>
  <div id="dragonHud"><span style="font-size:22px">🐉</span><div id="dHp"><div id="dHpF"></div></div><span id="dTimer"></span></div>

    <div id="qCard">
      <div id="qKicker"></div>

      </div>

<div class="screen" id="scVault">

</div>

  <div class="vTop"><button id="aBack">‹</button>

  <div id="aList" style="overflow-y:auto;touch-action:pan-y;flex:1;min-height:0;padding-bottom:20px"></div>
</div>

<div class="screen" id="scGame">
  <div class="vTop"><button id="gBack">‹</button><span id="gTitle" style="font-weight:900;font-size:14px"></span>
    <span id="gScore"></span><span id="gTime"></span></div>

</div>

</div>
<div id="bigOv"><div id="bigCard"></div></div>
<div id="breakOv"><div id="breakCard">

</div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const rnd=Math.random;
function ri(a,b){return a+((rnd()*(b-a+1))|0);}
function pick(a){return a[(rnd()*a.length)|0];}

/* ---------- starfield ---------- */
const sc=$("stars"),sg=sc.getContext("2d");
let W=0,H=0;
const starArr=[];
function sizeStars(){W=innerWidth;H=innerHeight;
  const d=Math.min(devicePixelRatio||1,2);
  sc.width=W*d;sc.height=H*d;sg.setTransform(d,0,0,d,0,0);}
sizeStars();addEventListener("resize",sizeStars);
for(let i=0;i<70;i++)starArr.push({x:rnd(),y:rnd(),r:rnd()*1.6+0.4,p:rnd()*6.28,
  glyph:rnd()<0.12?pick(["π","Σ","√","∞","θ","𝑓"]):null});
function drawStars(t){
  sg.clearRect(0,0,W,H);
  const grd=sg.createRadialGradient(W/2,H*0.25,20,W/2,H*0.5,H*0.9);
  grd.addColorStop(0,"rgba(90,60,150,0.22)");grd.addColorStop(1,"rgba(0,0,0,0)");
  sg.fillStyle=grd;sg.fillRect(0,0,W,H);
  for(const s of starArr){
    const a=0.3+0.7*Math.abs(Math.sin(t*0.6+s.p));
    sg.globalAlpha=a;
    if(s.glyph){sg.fillStyle="#9a8cc0";sg.font="13px Georgia";
      sg.fillText(s.glyph,s.x*W,s.y*H);}
    else{sg.fillStyle="#fff";
      sg.beginPath();sg.arc(s.x*W,s.y*H,s.r,0,6.29);sg.fill();}
  }
  sg.globalAlpha=1;
  requestAnimationFrame(ts=>drawStars(ts/1000));
}
requestAnimationFrame(ts=>drawStars(ts/1000));

let AC=null,muted=false;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}}
function tone(f,d,vol,delay){
  if(muted||!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),t0=AC.currentTime+(delay||0);
  o.type="sine";o.frequency.value=f;
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(vol||0.05,t0+0.02);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(v).connect(AC.destination);o.start(t0);o.stop(t0+d+0.05);
}
function chimeGood(){[659,830,988,1318].forEach((f,i)=>tone(f,0.3,0.04,i*0.07));}
function chimeBad(){tone(240,0.35,0.05);tone(226,0.4,0.04,0.1);}
function chimeClick(){tone(880,0.05,0.02);}
function haptic(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}

  const p=$("pad");p.innerHTML="";

    if("⌫−.,✕✦".includes(b.textContent))b.className="alt";
    b.onclick=()=>{
      audio();chimeClick();haptic(8);

  $("qText").innerHTML=cur.q;
  $("keiraSay").textContent="";
  $("pStreak").textContent=streak?("🔥"+streak):"";
  if(dragon)startDragonTimer();
  else if(rnd()<0.15)showScroll(pick(WISDOM));
}
function parseEntry(){
  const parts=entry.split(",").map(s=>parseFloat(s)).filter(v=>!isNaN(v));
  return parts;
}
function checkAnswer(){
  const parts=parseEntry();
  if(cur.type==="num"){
    if(parts.length!==1)return false;
    return Math.abs(parts[0]-cur.ans)<=(cur.tol||0.01);
  }
  if(cur.type==="pair"){
    if(parts.length!==2)return false;
    return Math.abs(parts[0]-cur.ans[0])<=0.01&&Math.abs(parts[1]-cur.ans[1])<=0.01;
  }
  if(cur.type==="set"){
    if(parts.length!==2)return false;
    const a=[...parts].sort((x,y)=>x-y),b=[...cur.ans].sort((x,y)=>x-y);
    return Math.abs(a[0]-b[0])<=0.01&&Math.abs(a[1]-b[1])<=0.01;
  }
  return false;
}
function burst(good){
  const n=good?14:5;
  for(let i=0;i<n;i++){
    const d=document.createElement("div");
    d.className="burst";
    d.textContent=good?pick(["✦","✧","⋆","💎","+1"]):pick(["✗","…"]);
    d.style.color=good?pick(["#ffd95e","#b48ae8","#7ad8f0","#8fe08a"]):"#ff6a5e";
    d.style.left=(innerWidth/2)+"px";d.style.top=(innerHeight*0.3)+"px";
    d.style.setProperty("--bx",(rnd()*220-110)+"px");
    d.style.setProperty("--by",(rnd()*-180-20)+"px");
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),950);
  }
  const f=$("flash");
  f.style.background=good?"radial-gradient(circle,rgba(143,224,138,0.22),transparent 70%)"
    :"radial-gradient(circle,rgba(255,80,80,0.25),transparent 70%)";
  f.style.opacity=1;setTimeout(()=>f.style.opacity=0,250);
}
function cast(){
  if(answered||!cur)return;
  if(!entry){$("keiraSay").textContent="Cast… nothing? Bold. Enter an answer.";return;}
  answered=true;
  stopDragonTimer();
  const good=checkAnswer();
  const orb=$("orb");
  orb.classList.remove("happy","mad");void orb.offsetWidth;
  if(good){
    chimeGood();haptic([20,30,20]);burst(true);
    orb.classList.add("happy");
    streak++;SV.xp++;
    const gWin=(dragon?2:1)+(streak>=3?1:0);
    SV.gems=(SV.gems||0)+gWin;
    if(!dragon){SV.m[curSchool.id]=(SV.m[curSchool.id]||0)+1;}
    save();
    $("keiraSay").textContent="Keira: "+(dragon?pick(KEIRA.dragonHit):pick(KEIRA.right));
    if(dragon){
      dragon.hp--;dragon.hits++;
      $("dHpF").style.width=(dragon.hp*10)+"%";
      if(dragon.hp<=0){dragonEnd(true);return;}
      dragon.left--;
      if(dragon.left<=0){dragonEnd(false);return;}
      setTimeout(nextQ,900);
    }else{
      setTimeout(nextQ,900);
    }

    chimeBad();haptic(80);burst(false);
    orb.classList.add("mad");
    streak=0;
    $("qCard").classList.remove("shake");void $("qCard").offsetWidth;
    $("qCard").classList.add("shake");
    $("keiraSay").textContent="Keira: "+(dragon?pick(KEIRA.dragonMiss):pick(KEIRA.wrong));
    showSolution();
    if(dragon){
      dragon.left--;
      if(dragon.left<=0){setTimeout(()=>dragonEnd(false),1400);}
    }

  $("pStreak").textContent=streak?("🔥"+streak):"";
}
function showSolution(){
  const box=$("solSteps");
  box.innerHTML=cur.steps.map((s,i)=>`<div class="st"><b>${i+1}.</b> ${s}</div>`).join("");
  const gc=$("solGraph");

    drawGraph(gc,cur.graph);
  }else gc.style.display="none";
  $("solution").classList.add("on");
}
function drawGraph(cv2,G){
  const g2=cv2.getContext("2d");
  const Wg=600,Hg=240;
  g2.clearRect(0,0,Wg,Hg);
  const pts=[G.pt,G.pt2].filter(Boolean);
  const xc=pts.length?pts.reduce((a,p)=>a+p[0],0)/pts.length:0;
  let xr=7;
  if(pts.length===2)xr=Math.max(6,Math.abs(pts[0][0]-pts[1][0])*0.9+3);
  const x0=xc-xr,x1=xc+xr;
  const xs=[];
  for(let i=0;i<=140;i++){const x=x0+(x1-x0)*i/140;xs.push([x,G.fn(x)]);}
  const pMin=pts.length?Math.min(...pts.map(p=>p[1])):0;
  const pMax=pts.length?Math.max(...pts.map(p=>p[1])):10;
  let cMin=Infinity,cMax=-Infinity;
  for(const[,y]of xs){if(isFinite(y)){cMin=Math.min(cMin,y);cMax=Math.max(cMax,y);}}
  const span=Math.max(pMax-pMin,8);
  let ymax=Math.min(cMax,pMax+span*0.9);
  let ymin=Math.max(cMin,pMin-span*0.9);
  if(ymax-ymin<6){ymax+=3;ymin-=3;}
  const padY=(ymax-ymin)*0.1;ymin-=padY;ymax+=padY;
  const X=x=>((x-x0)/(x1-x0))*Wg, Y=y=>Hg-((y-ymin)/(ymax-ymin))*Hg;
  g2.strokeStyle="rgba(255,255,255,0.15)";g2.lineWidth=1;
  g2.beginPath();g2.moveTo(X(0),0);g2.lineTo(X(0),Hg);
  g2.moveTo(0,Y(0));g2.lineTo(Wg,Y(0));g2.stroke();
  g2.strokeStyle="#b48ae8";g2.lineWidth=3;g2.lineJoin="round";
  g2.shadowColor="#b48ae8";g2.shadowBlur=10;
  g2.beginPath();
  let started=false;
  for(const[x,y]of xs){
    if(!isFinite(y)||y<ymin-(ymax-ymin)||y>ymax+(ymax-ymin)){started=false;continue;}
    const px=X(x),py=Y(y);
    started?g2.lineTo(px,py):g2.moveTo(px,py);started=true;
  }
  g2.stroke();g2.shadowBlur=0;
  [G.pt,G.pt2].forEach(pt=>{
    if(!pt)return;
    g2.fillStyle="#ffd95e";g2.shadowColor="#ffd95e";g2.shadowBlur=12;
    g2.beginPath();g2.arc(X(pt[0]),Y(pt[1]),6,0,6.29);g2.fill();
    g2.shadowBlur=0;
  });
}

function buyReward(k){

/* ---------- arcane arcade ---------- */
const ARCADE=[
  {k:"rune",em:"⚡",n:"RUNE RUSH",c:"#7ad8f0",
   d:"30 seconds of rapid-fire mental math. Wrong answers cost 3 seconds. The runes do not wait."},
  {k:"factor",em:"🧩",n:"FACTOR FRENZY",c:"#8fe08a",
   d:"Tap two tiles that multiply to the target. 45 seconds of pure multiplication violence."},
  {k:"graph",em:"📈",n:"GRAPH SNAP",c:"#ff9ac4",
   d:"One graph. Three equations. Only one is telling the truth. 8 rounds."},
];
const ARCQUIP=["The arcade machines run on pure adolescent spite.",
  "Your reflexes have been notarized by the council.",
  "The high score lives in an ancient scroll. localStorage, technically.",
  "Somewhere, a math teacher felt a disturbance and doesn't know why."];
let AG=null,gInt=null;
const shuffle=a=>a.sort(()=>rnd()-0.5);
function renderArcade(){
  const l=$("aList");l.innerHTML="";
  ARCADE.forEach(g=>{
    const d=document.createElement("div");d.className="rw";d.style.borderColor=g.c;
    d.innerHTML='<div class="re">'+g.em+'</div><div><div class="rn" style="color:'+g.c+'">'+g.n+'</div>'+

    d.querySelector("button").onclick=()=>{audio();startGame(g.k);};
    l.appendChild(d);
  });
}
function startGame(k){
  const meta=ARCADE.find(g=>g.k===k);
  AG={k,score:0,over:false,t:0,round:0};
  $("gTitle").textContent=meta.em+" "+meta.n;
  $("gTitle").style.color=meta.c;

  show("scGame");
  if(k==="rune"){startGTimer(30);rrNext();}
  else if(k==="factor"){startGTimer(45);ffNext();}
  else{$("gTime").textContent="";gsNext();}
}
function updScore(){$("gScore").textContent="⭐ "+AG.score;}
function startGTimer(secs){
  AG.t=secs;$("gTime").textContent=AG.t+"s";
  if(gInt)clearInterval(gInt);
  gInt=setInterval(()=>{
    if(!AG||AG.over){clearInterval(gInt);gInt=null;return;}
    AG.t--;
    $("gTime").textContent=Math.max(0,AG.t)+"s";
    if(AG.t<=5&&AG.t>0)tone(660,0.06,0.03);
    if(AG.t<=0)endGame();
  },1000);
}
function endGame(){
  if(!AG||AG.over)return;
  AG.over=true;
  if(gInt){clearInterval(gInt);gInt=null;}
  const k=AG.k,sc=AG.score;
  const gWon=k==="rune"?Math.max(1,Math.floor(sc/2)):Math.max(1,sc);
  SV.gems=(SV.gems||0)+gWon;
  if(!SV.best[k]||sc>SV.best[k])SV.best[k]=sc;
  save();
  chimeGood();burst(true);
  const ov=$("bigOv"),c=$("bigCard");
  ov.classList.add("on");
  c.innerHTML='<h2>🕹️ '+sc+' POINTS</h2><p>Gems earned: 💎 '+gWon+'</p>'+
    '<p>Keira: \u201C'+pick(ARCQUIP)+'\u201D</p><button id="bigGo2">BACK TO THE ARCADE</button>';
  $("bigGo2").onclick=()=>{ov.classList.remove("on");renderArcade();show("scArcade");};
}
/* rune rush */
function genRune(){
  const t=ri(0,4);let q,a;
  if(t===0){const x=ri(3,12),y=ri(3,12);q=x+" × "+y;a=x*y;}
  else if(t===1){const x=ri(13,68),y=ri(13,59);q=x+" + "+y;a=x+y;}
  else if(t===2){const x=ri(30,99),y=ri(11,x-5);q=x+" − "+y;a=x-y;}
  else if(t===3){const x=ri(4,13);q=x+"²";a=x*x;}
  else{const x=ri(2,12);q="√"+(x*x);a=x;}
  const opts=new Set([a]);
  let guard=0;
  while(opts.size<3&&guard++<40)opts.add(a+pick([-10,-3,-2,-1,1,2,3,10]));
  return{q,a,opts:shuffle([...opts])};
}
function rrNext(){
  if(!AG||AG.over)return;
  AG.cur=genRune();
  $("gBody").innerHTML='<div class="rrQ">'+AG.cur.q+'</div><div class="rrOpts">'+
    AG.cur.opts.map(o=>'<button class="rrO">'+o+'</button>').join("")+'</div>';
  document.querySelectorAll(".rrO").forEach(b=>{
    b.onclick=()=>{audio();
      if(+b.textContent===AG.cur.a){AG.score++;updScore();tone(880,0.08,0.04);haptic(10);rrNext();}
      else{chimeBad();AG.t=Math.max(1,AG.t-3);b.style.opacity=0.3;b.disabled=true;}
    };
  });
}
/* factor frenzy */
function genFactor(){
  const a=ri(2,12),b=ri(2,12);
  const tiles=[a,b];
  while(tiles.length<9)tiles.push(ri(2,12));
  return{target:a*b,tiles:shuffle(tiles)};
}
function ffNext(){
  if(!AG||AG.over)return;
  AG.ff=genFactor();AG.sel=-1;
  $("gBody").innerHTML='<div class="ffT">make <b>'+AG.ff.target+'</b></div><div class="ffGrid">'+
    AG.ff.tiles.map((t,i)=>'<button class="ffTile" data-i="'+i+'">'+t+'</button>').join("")+'</div>';
  document.querySelectorAll(".ffTile").forEach(b=>{
    b.onclick=()=>{audio();
      const i=+b.dataset.i;
      if(AG.sel===i){b.classList.remove("sel");AG.sel=-1;return;}
      if(AG.sel<0){AG.sel=i;b.classList.add("sel");tone(760,0.05,0.03);return;}
      const v1=AG.ff.tiles[AG.sel],v2=AG.ff.tiles[i];
      if(v1*v2===AG.ff.target){
        AG.score++;updScore();AG.t+=2;$("gTime").textContent=AG.t+"s";
        tone(880,0.08,0.04);tone(1175,0.1,0.04,0.07);haptic(12);ffNext();
      }else{
        chimeBad();AG.t=Math.max(1,AG.t-3);
        const sel=document.querySelector(".ffTile.sel");
        if(sel)sel.classList.remove("sel");
        AG.sel=-1;
      }
    };
  });
}
/* graph snap */
function genSnap(){
  const t=ri(0,2);
  if(t===0){const h=nz(-5,5),k=nz(-5,5);
    const eq=(hh,kk)=>"y = (x "+(hh>=0?"− ":"+ ")+Math.abs(hh)+")² "+(kk>=0?"+ ":"− ")+Math.abs(kk);
    return{graph:{fn:x=>(x-h)*(x-h)+k,pt:[h,k]},right:eq(h,k),opts:shuffle([eq(h,k),eq(-h,k),eq(h,-k)])};}
  if(t===1){const m=nz(-3,3),b=nz(-5,5);
    const eq=(mm,bb)=>"y = "+mm+"x "+(bb>=0?"+ ":"− ")+Math.abs(bb);
    return{graph:{fn:x=>m*x+b,pt:[0,b]},right:eq(m,b),opts:shuffle([eq(m,b),eq(-m,b),eq(m,-b)])};}
  const a=ri(1,3);
  const eq=(aa,base)=>"y = "+aa+" · "+base+"˟";
  return{graph:{fn:x=>a*Math.pow(2,x),pt:[0,a]},right:eq(a,2),opts:shuffle([eq(a,2),eq(a,3),eq(a+1,2)])};
}
function gsNext(){
  if(!AG||AG.over)return;
  if(AG.round>=8){endGame();return;}
  AG.round++;
  AG.gs=genSnap();
  $("gTime").textContent=AG.round+"/8";
  $("gBody").innerHTML='<canvas id="gsCv" width="600" height="240" class="gsCv"></canvas><div class="gsOpts">'+
    AG.gs.opts.map(o=>'<button class="gsO">'+o+'</button>').join("")+'</div>';
  drawGraph(document.getElementById("gsCv"),AG.gs.graph);
  document.querySelectorAll(".gsO").forEach(b=>{
    b.onclick=()=>{audio();
      if(b.textContent===AG.gs.right){AG.score++;updScore();tone(880,0.08,0.04);haptic(10);gsNext();}
      else{chimeBad();b.style.opacity=0.3;b.disabled=true;}
    };
  });
}
