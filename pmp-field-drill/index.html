['doc',"INVEST (mnemonic)","In the INVEST criteria for user stories, what does the 'T' stand for?",["Testable","Timeboxed","Tracked","Technical"],"INVEST: Independent, Negotiable, Valuable, Estimable, Small, Testable.",["Sprints are timeboxed, not stories.","Not part of INVEST.","Not part of INVEST."],""],
['cycle',"Planning poker","What is the main benefit of planning poker?",["It reduces anchoring and builds shared understanding","It produces exact hour estimates for every task","It lets the product owner set the final estimates","It removes the need to keep a product backlog"],"Simultaneous reveals avoid anchoring, and differing estimates trigger useful discussion.",["Points are relative, not hours.","The developers estimate.","Unrelated."],""],
['target',"Minimum viable product","Why would a team release a minimum viable product?",["To test assumptions with real users, with little effort","To deliver every planned feature in one complete release","To skip testing and get feedback from users instead","To meet the contract's final deliverable early"],"An MVP tests the hypothesis and gets early feedback, which reduces the risk of building the wrong thing.",["The opposite of an MVP.","Quality still matters.","An MVP is a learning step, not the final product."],"Real world: there's no MVP of a reactor building. In nuclear the 'MVP' idea shows up in digital tools, mock-ups and first-of-a-kind trials, not in permanent plant."],
['cycle',"Sprint review","What is the main purpose of the sprint review?",["To inspect the increment with stakeholders and adapt the backlog","To improve how the team works together, its tools and its definition of done","To plan the next sprint's tasks and estimate them in hours","To approve the team's timesheets for the sprint"],"The sprint review is a working session with stakeholders on the product. The retrospective is about the process.",["That's the retrospective.","That's sprint planning.","Not a scrum event."],""],
['doc',"Definition of done","A user story meets its acceptance criteria but hasn't been code reviewed, which the definition of done requires. Is it done?",["No; it must meet the definition of done too","Yes, because its acceptance criteria are met","Yes, as long as the product owner accepts it","Only if the sprint is about to end"],"Done means it meets both the story's acceptance criteria and the team's shared definition of done.",["The definition of done applies to every item.","The PO can't waive the team's quality standard.","Time pressure doesn't change done."],""],
]);

D('R',[
[4,'network',"Precedence diagramming method","Northshore's turbine hall roof steel cannot be erected until the columns are grouted and cured. What type of dependency is this?",["Mandatory (hard logic)","Discretionary (preferential)","External","Internal discretionary lag"],"Physical or contractual necessity creates mandatory dependencies. You cannot set roof steel on uncured grout.",["Discretionary logic is a team preference that could be changed.","External dependencies involve parties outside the project, such as a permit.","Not a dependency type."],""],
[4,'network',"Precedence diagramming method","The regulator must issue the construction licence before nuclear-safety-related concrete can be placed. This is a(n):",["External dependency","Mandatory internal dependency","Discretionary dependency","Lead"],"The constraint comes from outside the project team's control, so it's external.",["The licence isn't the team's own work.","It isn't optional.","A lead is an acceleration of a successor."],""],
[4,'gantt',"Lead time","Your scheduler lets drywall in the admin building start 3 days before painting prep finishes in each zone, using an FS relationship. This is a:",["Lead","Lag","Free float","Resource constraint"],"A lead pulls the successor earlier (negative lag), allowing overlap.",["Lag adds waiting time, such as concrete cure.","Free float is slack before delaying a successor.","Not a resource issue."],""],
[4,'gantt',"Lag (project management)","Formwork on the reactor building wall can't be stripped until 7 days after the pour. In the schedule this is shown as a:",["Finish-to-start with a 7-day lag","A 7-day lead on the formwork","A start-to-start relationship","A milestone on the pour date"],"A lag is a required delay between activities, such as concrete curing time.",["A lead is the opposite: overlap.","Stripping depends on the pour finishing.","Milestones have zero duration."],""],
[4,'money',"Cost estimate","Early in Northshore's business case, you estimate cost using the actual costs of two recent CANDU refurbishments, adjusted for scale. This is:",["Analogous estimating","Bottom-up estimating","Parametric estimating","Three-point estimating"],"Analogous (top-down) estimating uses similar past projects. It's quick, early and less accurate.",["Bottom-up aggregates detailed work-package estimates.","Parametric uses a statistical rate, such as $/m³.","Three-point uses optimistic, likely and pessimistic values."],"Real world: analogous estimates for first-of-a-kind nuclear builds are notoriously optimistic. Reference class forecasting (adjusting for how similar megaprojects actually overran) is the honest-to-data approach Flyvbjerg pushes."],
[4,'money',"Cost estimate","The civil estimator prices containment concrete at $2,100 per cubic metre placed, times the quantity from the 3D model. This is:",["Parametric estimating","Analogous estimating from past plants","Expert judgment from the estimator","Reserve analysis of the quantities"],"Parametric estimating multiplies a unit rate by a quantity. It's accurate when the rate and quantities are reliable.",["Analogous uses a whole similar project, not unit rates.","There's a model and a rate, not just judgment.","Reserve analysis sizes contingency."],""],
[4,'money',"Cost estimate","For Northshore's definitive (Class 1) estimate, which estimate type is the most accurate and takes the most effort?",["Bottom-up","Analogous","Rough order of magnitude","Parametric"],"Bottom-up rolls up detailed work-package estimates. It's the most accurate and time-consuming.",["Least effort, least accuracy.","ROM is −25% to +75%, an early range.","Accurate only if the model is good, and less effort."],""],
[4,'chart',"Cost baseline","The cost baseline for Northshore includes:",["Work package estimates plus contingency reserves","Work package estimates plus management reserve","Only the work package estimates","The total project budget including management reserve"],"Cost baseline = estimates + contingency reserve. Add management reserve to get the project budget.",["Management reserve sits outside the baseline.","Missing contingency.","That's the project budget, not the baseline."],""],
[4,'chart',"S-curve","A cumulative cost chart for Northshore shaped like an S is typically used to:",["Compare planned and actual spend with earned value","Show the critical path through the project","Rank the project risks by their exposure","Show how resource loading changes over time across the project's life"],"The S-curve plots cumulative PV, EV and AC, which is the visual heart of earned value reporting.",["Network diagrams show the critical path.","Risk matrices rank risks.","Histograms are bar charts by period."],""],
[4,'gantt',"Rolling-wave planning","Northshore's Unit 4 work is 6 years out and its design isn't finished. How should it be scheduled now?",["Rolling wave: detail the near term, keep Unit 4 high level for now","Plan everything, Unit 4 included, in full detail now","Leave Unit 4 out of the schedule until its design is complete","Copy Unit 1's detailed schedule for Unit 4 and adjust it later"],"Rolling wave planning is progressive elaboration: detail where you have information, placeholders for later work.",["False precision that will be redone.","It must be in the integrated schedule for the total cost and duration.","Units differ; copying assumes away the learning curve and changes."],""],
[4,'doc',"Responsibility assignment matrix","For each commissioning activity, you need to show who is Responsible, Accountable, Consulted and Informed. Which tool?",["RACI chart","Resource histogram","Organizational breakdown structure","Stakeholder cube"],"A RACI is a responsibility assignment matrix. There should be exactly one 'A' per activity.",["Histograms show resource loading.","An OBS maps work to organizational units, without roles per task.","A stakeholder analysis model."],""],
[4,'stake',"Communication","Northshore's core coordination group grows from 10 to 15 people. How many more communication channels are there?",["60","5","105","45"],"n(n−1)/2: 15 people = 105 channels, 10 people = 45. The increase is 60.",["That's the change in people, not channels.","That's the total for 15, not the increase.","That's the total for 10."],""],
[4,'stake',"Communication","You need to tell the full Northshore workforce (3,000 people) about a new site safety rule. Which communication method fits best?",["Push it through several channels, then confirm at toolbox talks","Post it on the intranet so people can find it when they need it","Meet every worker one-on-one to explain the new rule","Send a single email from the site manager to all staff"],"Large audiences need push, using several channels, with a check for understanding on safety-critical messages.",["Pull relies on people looking; safety can't depend on that.","Impractical at 3,000 people.","Email alone misses the craft workforce."],""],
[4,'doc',"Issue log","A design clash between a cable tray and an HVAC duct is found and must be resolved this week. Where should it be tracked?",["Issue log","Risk register","Lessons learned register","Assumption log"],"It has already happened, so it's an issue, not a risk. Track it in the issue log with an owner and due date.",["Risks are uncertain future events.","Lessons are captured, but the issue needs management.","Assumptions are things believed true."],""],
[4,'risk',"Risk management","After applying the mitigation for crane-collapse risk, some risk remains. This is called:",["Residual risk","Secondary risk","Contingent risk","Accepted risk"],"Residual risk is what remains after the response is implemented.",["Secondary risks are new risks created by the response.","Not a standard PMI term here.","You may choose to accept it, but the term is residual."],""],
[4,'risk',"Risk management","Adding a second crane to cut lift risk creates a new risk of the two cranes swinging into each other. This is a:",["Secondary risk","Residual risk","Workaround","Trigger condition"],"Secondary risks arise directly from implementing a risk response.",["Residual is what's left of the original risk.","Workarounds respond to unplanned events.","A trigger is a warning sign."],""],
[4,'risk',"Risk management","Who should own the risk of late delivery of the reactor pressure vessel forging?",["The person best placed to watch and respond, such as the supply chain lead","Always the project manager, who is accountable for every risk on the project","The forging vendor alone, since the delay would be theirs","The sponsor, given the size of the impact"],"Risk owners are assigned by who can best manage the response. The PM stays accountable overall.",["The PM owns the process, not every risk.","The vendor's contract may share it, but the owner still needs an internal risk owner.","Too high for an operational risk."],""],
[4,'risk',"Tornado diagram","Which chart shows which risks have the most effect on Northshore's total cost, ranked as horizontal bars?",["Tornado diagram","Histogram of cost outcomes","Control chart of the estimate","Burnup chart of spend"],"The tornado diagram is the visual from sensitivity analysis: the widest bar is most influential.",["Histograms show distributions.","Control charts track process stability.","Burnup shows completed work."],""],
[5,'contract',"Fixed-price contract","Northshore wants to contract the security fence and gatehouse, which has a complete, stable design. Which contract type fits best?",["Firm fixed price","Cost plus fixed fee","Time and materials","Cost plus incentive fee"],"Well-defined scope suits FFP: the seller carries the cost risk and the buyer gets price certainty.",["Cost-plus puts risk on the buyer, which is suited to uncertain scope.","T&M suits small or undefined work.","Incentive fees suit uncertain scope where you want cost focus."],""],
[5,'contract',"Cost-plus contract","The reactor vendor's first-of-a-kind module work has highly uncertain scope. Which contract type puts the most cost risk on the buyer?",["Cost plus percentage of cost","Firm fixed price","Fixed price incentive fee","Cost plus incentive fee"],"CPPC puts the most risk on the buyer and rewards the seller for spending more. It's often prohibited in public procurement.",["FFP puts risk on the seller.","FPIF shares some risk but caps the buyer.","CPIF shares overruns through the incentive formula."],"Real world: Canadian nuclear builds moved toward alliance and target-cost models, using shared pain/gain, for exactly this reason. Neither FFP nor pure cost-plus survived first-of-a-kind reality well."],
[5,'contract',"Time and materials","You need a specialty engineering firm for a few weeks of undefined troubleshooting on dewatering. Which contract fits?",["Time and materials with a not-to-exceed limit","Firm fixed price for the whole investigation","Cost plus award fee over a multi-year scope","Fixed price with economic price adjustment"],"T&M suits small, undefined, short work. A not-to-exceed cap controls the buyer's risk.",["You can't fix-price an undefined scope.","Overkill for a few weeks.","EPA suits long contracts exposed to inflation."],""],
[5,'contract',"Fixed-price contract","A 7-year supply contract for reinforcing steel is exposed to commodity price swings. Which contract type helps?",["Fixed price with economic price adjustment","Firm fixed price with a contingency added","Time and materials for the steel supply","Cost plus fixed fee"],"FP-EPA adjusts the price against an agreed index, such as a steel price index, protecting both parties over long durations.",["A seller pricing 7 years of risk will load the bid heavily.","Unsuitable for a long supply contract.","Unnecessary for a defined commodity."],""],
[5,'contract',"Request for proposal","Northshore needs proposals for an innovative approach to marine intake tunnelling where cost is not the only factor. Which document?",["Request for proposal (RFP)","Request for quotation (RFQ)","Request for information (RFI)","Purchase order"],"An RFP seeks a solution and an approach, evaluated on several criteria. An RFQ is price-focused for defined items.",["RFQs suit commodity items where price decides.","RFIs gather information before solicitation.","A PO is placed after selection."],""],
[5,'contract',"Procurement","When evaluating bids for the turbine generator, which approach selects on more than price?",["Weighted source selection criteria","Lowest price, with a technical pass or fail","Sole source to the best-known supplier","Best and final offer from the cheapest two"],"Weighted criteria (technical, experience, schedule, price) produce best-value selection.",["Lowest price ignores capability and risk.","Sole source skips competition.","Not a selection method."],""],
[5,'contract',"Procurement","During bid evaluation for the cooling-water intake screens, a bidder calls you with new information about their price. What should you do?",["Decline, and keep all communication with the procurement lead","Listen and note it so the evaluation team has the full picture","Share it with the evaluation team as useful market information","Let them resubmit, since it may improve value for the owner"],"Fairness in public procurement requires controlled communications. Side channels can void the process.",["It breaks the fair-process rules.","It contaminates the evaluation.","Unfair to the other bidders."],"Real world in Ontario: a single uncontrolled call during a blackout period can lead to a bid dispute or a cancelled tender. The procurement lead will want to hear about it the same day."],
[5,'contract',"Claims","The excavation contractor submits a claim saying the rock was harder than the geotechnical baseline report showed. What is the preferred way to resolve it?",["Negotiation, using the contract's change and dispute clauses","Go straight to litigation to protect the owner's position","Reject the claim outright, as the geotechnical baseline report is part of the contract","Pay the claim to keep the relationship working"],"PMI prefers negotiation. Use the contract terms and the geotechnical baseline report as the shared facts; arbitration and litigation are later steps.",["Litigation is the last resort.","Claims need evaluation, not reflex rejection.","Paying without evaluation is poor stewardship."],"Real world: a geotechnical baseline report exists to make this exact claim objective. Check the contract's notice time bars first. A late notice can extinguish the claim no matter how fair it sounds."],
[5,'contract',"Make-or-buy decision","Northshore is deciding whether to fabricate pipe spools in-house or buy from a shop. What analysis should come first?",["Make-or-buy analysis of cost, capacity, quality and risk","Issue a request for proposal to local fabrication shops","Ask the most experienced craft foreman which is better","Choose whichever quote comes in cheapest"],"Make-or-buy analysis compares total cost, capability, control and risk before procurement starts.",["Too soon. You don't know yet whether you're buying.","One input, not an analysis.","Price alone ignores quality and schedule."],"Real world: in nuclear, the deciding factor is often the shop's quality program qualification (CSA N285 / N299 in Canada), not price. Qualified fabricators are scarce."],
[5,'contract',"Procurement","A seller is late delivering embedded plates, and this threatens the Unit 1 pour. The contract has a liquidated damages clause. What should you do first?",["Review the contract, notify the seller formally and work on recovery","Apply the liquidated damages at once and deduct them from the next invoice","Terminate the contract for default and rebid the remaining scope","Quietly place a backup order with another supplier"],"Administer the contract: confirm the facts, give formal notice per the contract, and focus first on recovering the delivery.",["Damages may apply later, but recovery comes first.","Drastic and premature.","May breach the contract and creates a duplicate cost."],""],
[5,'contract',"Point of total assumption","Northshore's turbine hall steel contract is fixed price incentive fee. What is the point of total assumption (PTA)?",["The cost above which the seller bears all overruns","The price at which the buyer can cancel the contract","The point where the incentive payments begin","The final price both sides agreed at award"],"PTA = (ceiling price − target price) / buyer's share + target cost. Above it, the seller absorbs every dollar.",["Not a cancellation trigger.","Incentives apply below target.","Not a negotiated final price."],""],
[6,'build',"Advanced work packaging","Site leadership wants crews to stop waiting for materials, drawings and scaffolding. Which approach breaks construction into constraint-free installation work packages?",["Advanced work packaging (AWP)","Crashing the installation schedule","Fast-tracking design and construction","Resource levelling across crews"],"AWP aligns engineering and procurement to the construction path. IWPs are only released when all constraints are cleared.",["Crashing adds resources to shorten the schedule.","Gold plating adds unrequested features.","Levelling smooths resource use."],"PMI's exam barely names AWP, but it's lean thinking, rolling wave and WBS combined. Expect it framed as 'constraint management' or 'make-ready planning' on the exam."],
[6,'build',"Last Planner System","The site wants foremen to commit only to work that is truly ready, and to track percent plan complete (PPC) weekly. Which lean method is this?",["Last Planner System","Critical chain","Kanban for software","Earned schedule"],"Last Planner uses pull planning, a make-ready lookahead, weekly commitments and PPC with reasons for variance.",["Critical chain manages buffers and resource constraints.","Kanban is related, but it isn't the construction-specific system.","Earned schedule is an EV time metric."],""],
[6,'build',"Lean construction","In a weekly review, foremen report that 40% of their crews' time is spent waiting for permits and tools. Which lean idea does this point to?",["Waste from waiting; remove the constraints causing it","Normal construction variance that averages out over time","A need for more overtime to make up the lost hours","Poor crew motivation that needs a supervisor's attention"],"Waiting is one of lean's classic wastes. Remove the systemic constraints rather than pushing the crews harder.",["40% idle is not normal variance.","Overtime pays for the waste instead of removing it.","Blames people for a system problem."],""],
[7,'doc',"Configuration management","A field engineer installs a valve to drawing Rev C, but Rev D was issued last week. Which process failed?",["Configuration management and document control","Risk management of design changes","Procurement management of the drawings","Stakeholder engagement with the design team"],"Configuration management makes sure the right revision of every document reaches the work front.",["Not a risk process failure.","The valve arrived fine.","Unrelated."],"Real world in nuclear: this triggers a nonconformance report, and a design-basis check if it's safety-related. The fix is document control linked to the work package, so a crew physically can't get a superseded revision."],
[7,'quality',"Quality audit","A planned review checks whether the Unit 1 piping contractor is following its own approved welding procedures. This is a:",["Quality audit","Inspection","Control chart analysis","Benchmarking"],"Audits check process compliance (QA). Inspections check the product (QC).",["Inspection checks the welds themselves.","A statistical tool, not a review.","Compares to others' practices."],""],
[7,'quality',"Inspection","A QC inspector examines completed welds by radiography against acceptance criteria. Which process is this?",["Control quality","Manage quality","Plan quality management","Validate scope"],"Inspecting deliverables against standards is control quality.",["Manage quality is about processes and audits.","Planning happens beforehand.","Validate scope is customer acceptance."],""],
[9,'change',"Commissioning","Construction turns over the Unit 1 feedwater system to commissioning with 300 open punch items. What should the PM ensure?",["Turnover follows agreed criteria: punch items sorted, owned and tracked","Accept the turnover, since commissioning will clear the remaining punch items anyway","Refuse every turnover until the punch list is at zero","Let construction close the items after the project ends"],"Clear turnover criteria (A/B/C punch categories), ownership and tracking keep commissioning moving without hiding problems.",["Commissioning inheriting unknown work causes delays.","Too rigid. Minor items can follow by agreement.","Leaves open work with no owner."],""],
[9,'doc',"Lessons learned","When should lessons learned be captured on Northshore?",["Throughout the project, applied to the units still to come","At the end of the project, in a full lessons-learned workshop","Whenever something goes wrong, as part of the incident review","At each phase gate, as a formal governance step"],"Lessons are gathered continuously. On a multi-unit build, Unit 1 lessons should directly improve Units 2–4.",["Too late to help this project.","Successes are lessons too.","Gates help, but continuous capture works better."],"Real world: lessons registers are often write-only. The test is whether Unit 2's work packages actually changed because of Unit 1. Assign a lesson owner and a due date, like any action."],
[10,'target',"Project closure","Unit 4 is in service and all deliverables are accepted. What should you do before releasing the team?",["Finish closure: final report, archived records, closed contracts, lessons","Release the team at once, since every extra week on the project costs the owner money","Hold a celebration for the team and close the project file","Hand everything over to operations and close the office"],"Closure includes contract closure, records, the final report, lessons learned and then releasing resources.",["Loses the knowledge and documentation.","A good step, but not closure.","Skips formal closure steps."],""],
[10,'contract',"Contract","A contractor has finished the work, but its final invoice disputes remain open. Can the project be formally closed?",["Not until the claims are settled and the contract is formally closed","Yes; open disputes belong to procurement, not the project","Yes, because all the physical work is complete","Only if the sponsor agrees to waive the disputes"],"Close procurements requires resolving claims and formally completing the contract before administrative closure.",["The PM is responsible for closing procurements on the project.","Physical completion isn't contractual completion.","Waiving liability isn't the sponsor's unilateral call."],""],
[4,'cycle',"Hybrid project management","Northshore's plant construction is predictive, but the field app is agile. How should you integrate them?",["Hybrid: agile releases sit in the integrated schedule as milestones","Put the app team onto the Gantt schedule, task by task","Keep the two plans completely separate, with no shared governance","Move the construction crews onto two-week sprints as well"],"Tailoring means choosing the right life cycle for each part and integrating them at milestones and in governance.",["Breaks the agile approach for no benefit.","Integration risk goes unmanaged.","Physical construction sequences don't fit sprints."],""],
]);

D('B',[
[1,'money',"Net present value","Two options for Northshore's cooling system: Option A has an NPV of $120M over 60 years; Option B has an NPV of $95M over 40 years. Which should be chosen on financial grounds?",["Option A, because NPV already counts the time value of money","Option B, because it pays back sooner","Option B, because it is the shorter project","Neither; compare their internal rates of return only, since NPV depends on the rate"],"NPV already discounts cash flows to today's dollars. Pick the higher NPV; the project lengths are already built in.",["Payback ignores cash flows after payback.","Duration is already handled by NPV.","IRR can mislead for mutually exclusive projects of different scale."],""],
[1,'money',"Internal rate of return","Northshore's business case shows an IRR of 6.5%. The province's hurdle rate is 5%. What does this mean?",["It returns more than the required rate, so it is acceptable","It will lose money over its life","It returns 6.5% a year in cash to the province","Its net present value must be negative at the 5% hurdle rate"],"An IRR above the hurdle rate means a positive NPV at that discount rate.",["IRR above the hurdle rate implies gain.","IRR is a discount rate, not a cash yield.","It would be positive at the 5% hurdle."],""],
[1,'money',"Payback period","A board member wants Northshore judged by payback period alone. What is the main weakness of payback period as a selection method?",["It ignores cash after payback and the time value of money","It is too complex for most sponsors to use","It needs a Monte Carlo simulation to calculate","It only works well for agile projects"],"Payback is simple but blind to long-term value. For a 60-year nuclear asset, that's a serious flaw.",["It's actually the simplest method.","Not required.","It applies to any project."],"Real world: for a nuclear station, the discount rate chosen moves NPV more than almost any engineering decision. Watch who picks that rate, and why."],
[1,'money',"Opportunity cost","The province can fund either Northshore (NPV $2B) or a transmission upgrade (NPV $1.5B), not both. If it picks Northshore, what is the opportunity cost?",["$1.5B","$2B","$0.5B","$3.5B"],"Opportunity cost is the value of the best option you give up: $1.5B.",["That's the value of what you chose.","That's the difference, not the opportunity cost.","That's the sum."],""],
[1,'money',"Sunk cost","Northshore has spent $800M on an early design that is now obsolete. A new design is cheaper to finish. How should the $800M affect the decision?",["It shouldn't; sunk costs don't count in future decisions","Keep the old design so the spend is not wasted","Add the $800M to the new design's estimate","Stop the project now, before more money is lost on top of the $800M"],"Sunk costs are gone either way. Decide on future costs and benefits only.",["The sunk cost fallacy.","It doesn't change the future comparison.","Not supported by the information given."],"Real world: politically, sunk cost is everything. 'We've already spent $800M' wins arguments in the legislature. The exam answer is right; it just doesn't always win the room."],
[1,'doc',"Business case","Dana asks who should own Northshore's business case. Who is typically responsible for it?",["The sponsor, often with the PM's input","The project manager, who knows the project best","The project team, as a group","The regulator, who must approve it"],"The sponsor owns the business case and the benefits. The PM may help develop it and keeps it in view during delivery.",["The PM contributes but doesn't own it.","The team delivers outputs, not the case.","The regulator licenses safety, not the business case."],""],
[1,'target',"Benefits realisation management","Northshore's benefits (clean baseload power, jobs and lower system emissions) will mostly appear after handover. Who ensures they are realized?",["The benefits owner in the business, as the benefits plan sets out","The project manager, who stays involved for a year after the project closes","The main contractor, under the warranty terms","Nobody in particular; benefits follow from good delivery"],"The benefits management plan names owners, metrics and timing, often extending beyond project closure.",["The PM's role usually ends at handover.","Contractors deliver outputs, not business benefits.","Untracked benefits often never arrive."],""],
[1,'target',"Value (economics)","The utility board asks how Northshore's success will be judged. In PMI's 2026 view, what is the main measure of project success?",["Delivering the intended value and outcomes","Finishing on time and within the approved budget","Meeting every requirement in the scope statement","The customer signing off the final deliverable"],"The current outline focuses on value and outcomes, not only the triple constraint.",["Necessary but not sufficient.","Requirements can be met with no value.","Acceptance isn't the same as benefit."],""],
[1,'scale',"Project governance","Northshore must pass formal phase gates before major commitments. What is the purpose of these gates?",["To let governance continue, change or stop the project on its merits","To give the project manager a chance to reset the plan","To audit each team member's individual performance","To let scope change without going through change control"],"Gate reviews are governance decision points: continue, adjust or stop.",["Not the purpose.","Gates review the project, not individuals.","Changes still go through change control."],"Real world: gates on megaprojects rarely stop anything; momentum and political commitment are enormous. A good gate makes the 'continue' decision a real one, with conditions that bite."],
[1,'building',"Project management office","The Northshore PMO provides templates and training but has little control over projects. This type of PMO is:",["Supportive","Controlling","Directive","Strategic"],"Supportive PMOs act as a resource hub with low control. Controlling PMOs require compliance; directive PMOs manage projects directly.",["Controlling PMOs require compliance with standards.","Directive PMOs directly manage projects.","Not one of PMI's three PMO types."],""],
[1,'building',"Program management","Northshore's four reactor units, the transmission connection and the training centre are managed together for combined benefits. This is a:",["Program","Portfolio","Single project","Operation"],"A program is related projects managed together to deliver benefits that wouldn't come from managing them separately.",["Portfolios group work by strategy, not necessarily related.","It's several coordinated projects.","Operations are ongoing, not temporary."],""],
[1,'building',"Project portfolio management","The utility's executive committee ranks Northshore against refurbishments and hydro upgrades by strategic fit. This is:",["Portfolio management","Program management","Scope management","Integration management"],"Portfolio management selects and prioritizes work against the organization's strategy.",["Programs coordinate related work.","Scope is inside one project.","Integration is inside one project."],""],
[1,'target',"Key performance indicator","The board wants a few measures that show whether Northshore is delivering its business value. Which is most appropriate?",["Outcome KPIs tied to the business case, such as forecast cost to complete","The number of steering committee meetings held each quarter and attended","Hours the project manager logs against the project","The count of documents the project has produced"],"Good KPIs measure progress toward outcomes, not activity.",["Activity, not outcomes.","An input measure.","Output volume isn't value."],""],
[1,'target',"OKR","Leadership sets an objective, 'Northshore is the safest nuclear build in Canada', with key results such as a lost-time incident rate below 0.1. This framework is:",["OKRs (objectives and key results)","SWOT analysis of the plant's strengths and weaknesses","RACI chart","MoSCoW priorities"],"OKRs pair a qualitative objective with measurable key results.",["SWOT analyzes strengths, weaknesses, opportunities and threats.","RACI assigns roles.","MoSCoW prioritizes requirements."],""],
[1,'doc',"PEST analysis","Early on, the team assesses political, economic, social, technological, legal and environmental factors affecting Northshore. This is:",["PESTLE analysis","SWOT analysis","Root cause analysis","Stakeholder mapping"],"PESTLE scans the external environment, which is core to the Business Environment domain.",["SWOT includes internal factors too.","Root cause analyzes a problem.","Stakeholder mapping focuses on people."],""],
[1,'doc',"SWOT analysis","Which part of a SWOT for Northshore would 'Ontario's experienced nuclear supply chain' belong in?",["Strength","Opportunity","Weakness","Threat"],"An internal or organizational advantage you control or have is a strength.",["Opportunities are external.","It's an advantage.","It's not external or negative."],"Real world: whether the supply chain is a strength or a threat depends on what else is being built at the same time. With several large nuclear projects running in Ontario at once, skilled trades become a constraint."],
[2,'shield',"Canadian Nuclear Safety Commission","Mid-construction, the regulator issues a new requirement for seismic qualification of a system already designed. What should you do first?",["Assess its impact and process it through change control","Ignore it, since the licence was already issued","Ask the regulator to exempt the project","Make the change at once, before analysis"],"Compliance is mandatory. Analyze the impact on scope, schedule and cost, then manage it through integrated change control.",["Non-compliance can stop the project.","Exemptions are rare; work the requirement properly.","Implement after analysis, through the process."],"Real world: you'd also talk to the regulator early. Their staff often have flexibility on how to demonstrate compliance, if not on whether to."],
[2,'shield',"Regulatory compliance","The Unit 2 schedule is tight and a supervisor suggests skipping a required hold point inspection. What should you do?",["Refuse; hold points are mandatory, so recover time elsewhere","Allow it just this once, as the schedule is critical this week and the crew is ready","Skip it now and do the inspection after the pour","Proceed and ask the regulator's view afterwards"],"Compliance isn't negotiable for schedule. Find recovery options that don't break requirements.",["Unauthorized, and it could invalidate the work.","After-the-fact inspection may be impossible once the work is covered.","Violates the licence conditions."],""],
[2,'stake',"Duty to consult","Northshore's site is within the traditional territory of several First Nations. What is the best approach?",["Engage early and meaningfully, and use their input in decisions","Notify them formally once the licence has been approved and the plans are final","Leave the engagement entirely to the government","Engage only if they raise an objection"],"Early, respectful, ongoing engagement is both ethical and essential to the project's legitimacy and licence.",["Too late for meaningful input.","The Crown holds the duty, but the proponent is expected to take part substantively.","Reactive engagement erodes trust."],"In Canada this isn't just good practice. The Crown's duty to consult is constitutional, and procedural aspects get delegated to proponents. Equity partnerships with First Nations are now common on major Ontario energy projects."],
[2,'leaf',"Environmental impact assessment","Northshore's environmental assessment requires mitigation for fish impingement at the cooling intake. How should the PM treat these commitments?",["As requirements with owners, tracked to verification","As nice-to-haves, if the budget allows at the end","As the environmental team's issue, not the project's","As items to revisit after the project is finished"],"Environmental commitments are compliance obligations. Track them like any other requirement.",["They're conditions, not options.","The PM integrates all requirements.","Many are construction-phase obligations."],""],
[2,'leaf',"Sustainability","The sponsor asks how Northshore can reduce the embodied carbon of construction. Which action best supports this?",["Specify lower-carbon concrete where allowed, and track embodied carbon","Leave it, since nuclear power is already low-carbon","Plant trees around the site once construction ends","Leave carbon choices to the concrete contractors"],"Sustainability is now an exam theme. Treat it as a measurable project objective, integrated into the design and procurement.",["Operating emissions don't cancel construction emissions.","Offsets aren't reductions.","The owner sets the requirements."],"Real world: nuclear safety-related concrete specs are tightly controlled. Low-carbon mixes may be fine for non-safety structures first, and need qualification before use in safety-related ones."],
[2,'leaf',"Environmental, social, and governance","Investors ask for Northshore's ESG reporting. Which best describes the PM's role?",["Supply accurate project data for the ESG metrics the company reports","None; ESG reporting is handled entirely by finance","Promote the project as green in public communications","Report the positive metrics and leave the weaker ones out of the project's data"],"PMs supply reliable data and integrate ESG requirements into delivery.",["The project is a key data source.","That's PR, not reporting.","Selective reporting is greenwashing and breaches ethics."],""],
[2,'leaf',"Circular economy","Northshore will generate thousands of tonnes of excavated rock. Which is the most sustainable approach?",["Reuse it on site or locally where it meets specifications","Truck it all to a licensed landfill to keep the site clear","Stockpile it on site in case a use turns up later","Sell it to the highest bidder, whatever they use it for"],"Reuse cuts emissions, cost and traffic. It's a circular-economy approach.",["Highest emissions and cost.","Creates environmental risk.","Ignores environmental responsibility."],""],
[2,'stake',"Corporate social responsibility","Local businesses want to benefit from Northshore. Which approach best balances value and fairness?",["A transparent local procurement and hiring program with clear criteria","Give contracts to local firms first, whatever their capability or price","Treat the project like any other and ignore local interests","Make informal promises at town halls to build goodwill"],"Structured community-benefit programs deliver social value while protecting procurement fairness.",["Ignores capability and fairness.","Damages the social licence.","Informal promises create expectations you can't keep."],""],
[3,'scale',"Code of ethics","A vendor bidding on the turbine contract offers you tickets to a hockey game. What should you do?",["Decline, or follow the gift policy and disclose it","Accept, since it is a small gift","Accept, and give the tickets to the team","Accept once the contract has been awarded"],"PMI's code requires avoiding conflicts of interest. Gifts from bidders during procurement are a clear red flag.",["Perception matters, especially during a bid.","Still a gift from a bidder.","It looks like a reward for the award."],"Real world: most organizations have a nominal-value threshold for gifts. During an active procurement, though, the answer is almost always a flat no."],
[3,'scale',"Conflict of interest","You discover your brother-in-law's firm is bidding on a Northshore contract you're evaluating. What should you do?",["Disclose the relationship and step out of the evaluation","Evaluate fairly and keep the relationship to yourself","Score his firm lower to make sure there is no bias","Share the other bids with him so he can compete"],"Disclose any conflict of interest and step away from the decision.",["Hidden conflicts breach the code even if you act fairly.","Unfair to the firm, and still a conflict.","A serious ethical and legal breach."],""],
[3,'scale',"Code of ethics","You learn that a Northshore colleague falsified the training hours on their PMP application. What should you do?",["Report it to PMI, as the code of ethics requires","Ignore it, since it isn't your business","Confront them about it in front of the team","Report it to your own HR department only, and let them decide what to do"],"PMI's code of ethics requires reporting violations to PMI.",["Ignoring a known violation is itself a breach.","Public confrontation isn't the process.","HR can't act on PMI certification."],""],
[3,'scale',"Bribery","A local official hints that permits would move faster with a 'consulting fee'. What should you do?",["Refuse and report it","Pay it as a cost of doing business","Ask the contractor to pay it","Ignore the hint and wait"],"Bribery is illegal and unethical. Refuse it and report it.",["Illegal under the Criminal Code and the Corruption of Foreign Public Officials Act.","Still bribery, through a proxy.","Passive, and the pressure may continue."],""],
[3,'scale',"Code of ethics","Your sponsor asks you to report the Unit 1 schedule as 'on track' to the board, although it's two months behind. What should you do?",["Report the true status and discuss recovery with the sponsor","Report on track, as the program director asked","Report on track as asked, but tell the team the truth so they can recover","Resign from the project rather than report"],"Honesty is a core value in the code. Give accurate reporting, with options.",["Misrepresentation breaches the code.","Still deceiving the board.","Avoidance doesn't fix it."],"Real world: have this conversation with the sponsor privately first. Bring the recovery options, so they can present the bad news as 'here's our plan', not as an ambush."],
[3,'building',"Organizational culture","Northshore's culture is hierarchical and risk-averse. You want to introduce more agile ways of working. What should you consider first?",["Adapt the approach to the culture and build support gradually","Mandate agile from the top and let the culture catch up","Drop the idea, since the culture won't accept it","Replace the team with people who already work in an agile way"],"Organizational culture is an enterprise environmental factor. Tailor the change to it.",["Culture eats strategy for breakfast.","Change is possible with tailoring.","Impractical and destructive."],""],
[3,'building',"Matrix management","If Northshore moved from a weak to a strong matrix, who would usually have more authority over project resources?",["The project manager","The functional manager","The sponsor alone","The team members"],"In a strong matrix, the PM has moderate to high authority. In a weak matrix, functional managers do.",["That's the weak matrix.","Sponsors authorize, but don't run resources day to day.","Team members don't hold resource authority."],""],
[3,'team',"Skilled worker","Ontario faces a shortage of nuclear-qualified welders while three major nuclear projects run at once. What is the best approach?",["Plan the workforce early: training, apprenticeships, a realistic schedule","Assume the contractors will find the labour they need","Pay above market rates to attract welders from other projects","Wait until construction starts, then hire as needed"],"External market conditions are a business environment factor. Plan for them strategically, with training pipelines.",["Transfers the risk without managing it.","Bidding wars inflate costs for everyone, including the ratepayer.","Too late. Qualifications take years."],"Real world: projects in the same province competing for the same welders is a real systemic risk. Coordinating workforce planning across owners often helps everyone."],
[3,'team',"Collective agreement","Northshore's work is covered by building-trades collective agreements. A crew assignment conflicts with jurisdiction rules. What should you do?",["Follow the agreements and resolve jurisdiction with labour relations","Assign the work anyway to save time, and settle the jurisdiction question later","Ignore it unless a grievance is actually filed","Bring in non-union labour for that scope"],"Labour agreements are legal and contractual constraints. Respect them and resolve disputes through the proper process.",["Leads to grievances or work stoppages.","Reactive, and the risk grows.","Likely breaches the agreements."],""],
[3,'shield',"Nuclear safety culture","A Northshore worker raises a safety concern about scaffolding but fears retaliation. What should you do?",["Thank them, act on it, and make clear raising safety is protected","Ask them to put the concern in writing first, so there is a proper record of it","Tell them to raise it with their own foreman","Wait, since no incident has happened yet"],"A strong nuclear safety culture depends on people feeling free to raise concerns without fear.",["Adds friction to a safety concern.","They came to you. Act.","Waiting for an incident is the wrong standard."],""],
[3,'change',"Change management","Northshore will change how the operations organization works (new procedures, roles and tools). Which model helps individuals through the change?",["ADKAR","RACI","WBS","Monte Carlo simulation"],"ADKAR guides individual change adoption step by step.",["Assigns roles, not change adoption.","Decomposes scope.","Simulates uncertainty."],""],
[3,'change',"Change management","The future operations staff are resisting the new digital work management system. What should you do first?",["Understand their concerns and involve them in the rollout","Mandate its use from a fixed date to drive adoption","Delay the rollout until everyone is comfortable","Assume that training will deal with the resistance"],"Resistance often has valid reasons. Engagement turns resisters into co-designers.",["Mandates without buy-in breed workarounds.","Avoids the issue.","Training addresses ability, not desire."],""],
[3,'change',"Organizational change","For the new station to be ready to operate, what must happen besides construction finishing?",["Operational readiness: trained staff, procedures and systems","Nothing more; operations will adapt to the new plant once they take it over","Only the final punch list being closed out","Only the operating licence being granted"],"Value is realized only when the organization can operate what was built.",["A common cause of failed transitions.","Necessary, not sufficient.","Necessary, not sufficient."],""],
[4,'ai',"Artificial intelligence","Your controls team wants to use an AI model to forecast schedule risk. What is a key governance step?",["Validate its outputs and keep people accountable for decisions","Let the model make the schedule decisions automatically, since it sees more data","Avoid AI tools entirely on safety-critical projects","Trust its forecasts, since they are data-driven"],"The 2026 outline stresses responsible AI use: transparency, validation and human accountability.",["Removes accountability.","Too restrictive; AI can add value.","Models can be wrong or biased."],"Real world: AI schedule forecasts are only as good as the schedule's logic quality. Garbage logic produces confident garbage. Fix the DCMA-type schedule health issues first."],
[4,'ai',"Algorithmic bias","An AI tool used to screen craft job applicants seems to reject candidates from certain regions more often. What should you do?",["Stop using it, investigate the bias, and involve HR and legal","Keep using it, since it saves recruiters a lot of time","Adjust its rankings by hand without investigating further","Tell the vendor about it and keep using the tool meanwhile"],"Biased AI decisions create ethical and legal risk. Investigate and correct before using it further.",["Efficiency doesn't justify discrimination.","Hides the root cause.","Continuing harms candidates."],""],
[4,'ai',"Information privacy","The field app collects worker location data for safety tracking. What must be considered?",["Privacy law, consent, data minimization and secure handling","Nothing more; safety outweighs privacy concerns","Only what the wearables vendor recommends","Collecting as much data as possible now, in case it is useful for later analysis"],"Data privacy is a compliance and ethical issue. Collect only what's needed, with consent and protection.",["Both must be balanced lawfully.","The owner is accountable, not the vendor.","Violates data minimization."],""],

[4,'shield',"Computer security","A contractor wants to connect their laptop to the plant's construction-phase control system network for testing. What should you do?",["Follow cybersecurity procedures: approved, scanned devices only","Allow it, since commissioning tests are urgent","Allow it if the contractor confirms the laptop is clean","Disconnect the whole control network until testing ends"],"Nuclear cybersecurity requirements are strict. Process protects the plant.",["Urgency is how breaches happen.","Promises aren't controls.","An overreaction that halts the work."],""],

[5,'money',"Interest rate","Interest rates rise sharply during Northshore's construction. Why does this matter so much for a nuclear project?",["Financing during long construction can change total cost and NPV a lot","It hardly affects projects like this one, which are mostly construction work","It only affects the plant once it is in operation","It only matters to the contractors' own finances"],"Long, capital-intensive builds are very sensitive to financing costs. Every month of delay compounds it.",["It strongly affects capital projects.","Construction-period interest is a major cost.","It affects the owner's finances most."],"Real world: this is why schedule is the cost driver on nuclear. A year's delay on a multibillion-dollar build can cost more in interest than most of the scope changes people argue about."],

[3,"team","Weak matrix organization","Your best scheduler's functional manager wants her back full time for another project next month, in the middle of your baseline update. You have no authority over her manager. What should you do?",["Meet her manager, show the impact on your milestone, and negotiate timing or a handover","Escalate straight to the sponsor and ask them to block the move until your baseline update is finished","Tell the scheduler she must stay until your baseline is done","Accept the loss and say nothing, since you have no authority"],"In a weak matrix, influence and negotiation are your main tools: show the business impact and agree a solution, escalating only if that fails.",["Escalation first damages the relationship you'll need later.","You don't have that authority over her.","Silent acceptance hides a real risk to the project."],"",{"t":"bars","max":100,"unit":"%","rows":[["Your project needs",60,"#ff6a13"],["Other project needs",80,"#9aa3b2"],["Her time",100,"#3fbf73"]]}],
[2,"stake","Stakeholder engagement","The mayor will announce support for Northshore only if you commit to a local hiring target of 40%, but the union agreement allows 25%. The announcement is tomorrow. What should you do?",["Explain the union limit, and offer what you can commit to, such as training for local hires","Agree to the 40% target to secure the mayor's support tomorrow, and work out the details with the union later","Decline to meet the mayor until after the announcement","Ask the union to change its agreement by tomorrow"],"Don't commit to what you can't deliver. Be open about the constraint and offer real alternatives that serve the mayor's goal.",["A promise you can't keep damages trust later.","Avoiding a key stakeholder at a key moment loses influence.","Unrealistic in a day, and not yours to demand."],"",{"t":"bars","max":50,"unit":"%","rows":[["Mayor wants",40,"#ff6a13"],["Union allows",25,"#9aa3b2"],["With training plan",30,"#3fbf73"]]}],
[3,"conflict","Conflict management","The safety manager stops all work at height after a near miss. The construction manager says this costs $400k a day and wants work restarted this afternoon. As PM, what do you do?",["Support the stop, and work with both on what must be true to restart safely, fast","Overrule the safety manager, since the near miss caused no injury","Ask the sponsor to decide between the two managers","Restart half the crews to split the difference"],"Safety stops are respected. The PM's job is to get to a safe restart quickly: clear conditions, owners and a time to review.",["Overruling safety on cost is never acceptable.","Pushes your job upward and wastes time.","Half the risk is still risk."],"",{"t":"bars","max":500,"unit":"k","rows":[["Cost of a day stopped",400,"#ff6a13"],["Cost of a serious fall",5000,"#c62828"]]}],
[3,"team","Program management","Three of your project managers each want the program's single best estimator for their own proposal due the same week. As program manager, what should you do?",["Rank the proposals by value and deadline, then share the estimator to match","Give the estimator to whichever project manager asked first, so the rule is clear and fair","Let the three project managers negotiate it among themselves","Have the estimator work on all three at once"],"A program manager allocates shared resources by program priority. Make the trade-off openly, based on value and timing.",["First come first served ignores value.","Pushes a program decision down to the projects.","Splitting attention puts all three at risk."],"",{"t":"bars","max":50,"unit":"M","rows":[["Proposal A value",40,"#3fbf73"],["Proposal B value",15,"#9aa3b2"],["Proposal C value",25,"#ff6a13"]]}]
]);
D('R',[
[6,"gantt","Critical path method","The crane for the reactor dome lift is booked for day 40, but the ring beam it needs finishes on day 44. The crane goes to another site on day 42 for three months. What should the construction manager do first?",["Look for a way to finish the ring beam by day 40, or move the lift, before the crane leaves","Keep the booking and lift on day 40 with the ring beam partly done","Let the crane go and re-plan the dome for three months later","Ask the crane supplier to break their other booking for a fee, and keep the day 40 lift as planned"],"The crane is a hard constraint: check recovery options on the ring beam (crashing, overtime, resequencing) and the crane's availability before accepting a three-month delay.",["Lifting onto an incomplete ring beam breaks the design sequence and the safety case.","Accepting three months on the critical path before trying recovery throws away float you may be able to buy back.","Possible later, but it isn't the first step and may not be available."],"",{"t":"gantt","days":50,"rows":[["Ring beam",30,14,1],["Dome lift",40,3,1],["Crane on site",0,42,0]],"line":[42,"crane leaves"]}],
[4,"chart","Resource leveling","Two work fronts both need the site's only 300-tonne crawler crane in weeks 12 to 14. One has 3 weeks of float; the other is critical. What should the project manager do?",["Give the crane to the critical work and move the other front into its float","Split the crane between the two fronts on alternate days, so both keep moving and neither superintendent loses out","Rent a second crawler crane for the three weeks at once","Ask the two superintendents to agree between themselves"],"Resource levelling uses float: the critical front keeps the crane, the front with 3 weeks of float moves without delaying the finish.",["Splitting delays the critical front and gains nothing for the other.","Possible, but costly when free float already solves it.","The decision needs the schedule view, and it is the PM's call."],"",{"t":"gantt","days":20,"rows":[["Front A (critical)",11,4,1],["Front B",11,4,0],["Front B float",15,3,0]],"line":[14,"crane free"]}],
[7,"money","Earned value management","Unit 2's containment is 40% done, with 52% of its budget spent and the schedule 3 weeks behind. The program director asks for one number to watch next month. Which is most useful?",["CPI, because it shows how much work each dollar is buying","The percentage of budget spent so far","The number of workers on site each week","Hours worked against the hours planned for the containment work so far this month"],"CPI = EV / AC = 0.40 / 0.52 ≈ 0.77: every dollar buys 77 cents of work. Spend alone and headcount say nothing about value earned.",["Spend says what went out, not what it bought.","Headcount is an input, not progress.","Hours are effort, not earned value."],"",{"t":"bars","max":100,"unit":"%","rows":[["Work done (EV)",40,"#3fbf73"],["Budget spent (AC)",52,"#ff6a13"],["Planned (PV)",55,"#9aa3b2"]]}],
[9,"risk","Program management","As program manager over four units, you can fund one of two fixes: a design fix that removes a recurring weld defect on Units 2 to 4, or overtime that recovers Unit 1's six-week slip. The money covers only one. What should guide the choice?",["The benefit to the whole program, comparing total cost, risk and value across the units","Unit 1's slip, because it is the most visible to the board this quarter and the easiest to explain","The weld fix, because quality always comes before schedule","Whichever project manager makes the stronger case at the meeting"],"A program manager optimizes across projects: weigh the recurring cost of the weld defect on three units against the value of six weeks on Unit 1.",["Visibility isn't value; a program balances all its units.","A rule of thumb, not an analysis; schedule may matter more here.","Advocacy isn't a basis for a program decision."],"",{"t":"bars","max":60,"unit":"M","rows":[["Weld fix saves (Units 2-4)",48,"#3fbf73"],["Unit 1 recovery saves",30,"#ff6a13"],["Money available",35,"#9aa3b2"]]}],
[6,"shield","Hold point (quality)","A 600 m³ pour is ready at 6 a.m., but the inspector who must release the hold point is stuck in traffic for two hours. The concrete trucks are already batching. What should the superintendent do?",["Hold the pour, call the plant to slow batching, and wait for the release","Start the pour, since the inspector has already seen the rebar","Pour the first lift now while the trucks are here, and have the inspector check the work on arrival","Ask the site safety officer to sign the hold point instead"],"A hold point can only be released by the named inspector. Manage the trucks (slow or divert batching); never pour through a hold point.",["Seeing the rebar earlier isn't a release.","Pouring covers what the inspection must see.","Only the authorized inspector can release it."],"",{"t":"gantt","days":12,"rows":[["Trucks batching",0,4,0],["Inspector travel",0,2,1],["Pour (after release)",2,8,1]],"line":[2,"release"]}],
[5,"contract","Supply chain risk management","The turbine vendor warns that a sub-supplier's factory fire will delay the stator by 10 weeks. The stator has 4 weeks of float. What should the project manager do first?",["Confirm the new date, assess the 6-week impact and work through recovery options with the vendor","Apply liquidated damages to the vendor straight away, so the cost of the delay is clearly theirs from the start","Re-baseline the schedule with the new stator date","Start looking for a different turbine vendor"],"Get facts first: a firm date, the impact beyond float (10 - 4 = 6 weeks) and recovery options (expediting, resequencing, partial shipments).",["Damages don't recover time and may not apply to force majeure.","Re-baselining before trying recovery hides the variance.","Changing vendor at this stage costs far more time."],"",{"t":"gantt","days":16,"rows":[["Stator (planned)",0,6,0],["Stator (new date)",0,16,1],["Float",6,4,0]],"line":[10,"needed by"]}],
[6,"leaf","Environmental compliance","Fish spawning season closes in-water work from April 1. The cofferdam is 85% done on March 20, and finishing needs 18 more working days. What should the project manager do?",["Plan to make the cofferdam safe by March 31 and finish after the window reopens","Keep working into April and pay any fine as a cost of the schedule","Ask the crew to finish in 11 days by working double shifts, whatever it takes","Stop in-water work today to be extra careful"],"The fisheries window is a legal constraint. Secure the partial work for the closure and replan the rest; don't plan to break the permit.",["Breaking a permit risks the licence, not just a fine.","An unrealistic crash plan that strains safety and quality.","Stopping early wastes the days you legally have."],"",{"t":"gantt","days":40,"rows":[["Cofferdam work left",0,18,1],["Allowed in-water",0,11,0]],"line":[11,"window closes"]}],
[7,"build","Constructability","Field engineers say the embed plates in the drawings clash with rebar at 40 locations. Fixing the drawings takes 3 weeks; the walls are scheduled in 2. What should you do?",["Have engineering resolve the first walls' clashes first, and resequence the walls to match","Let the field cut the rebar to fit as needed, and record all the changes on the drawings later","Pour the walls as drawn and fix the embeds afterwards","Wait three weeks for the full drawing revision before any wall"],"Prioritize the design fix to suit the construction sequence: the first walls get resolved first, and the order adapts, so work continues without unapproved field changes.",["Unapproved field changes to rebar break design and quality control.","Fixing embeds after the pour is costly and often impossible.","Stops all work when the fixes could be staged."],"",{"t":"gantt","days":30,"rows":[["Drawing fixes (all)",0,21,0],["First walls fixed",0,10,1],["Walls pour",14,14,1]],"line":[14,"walls start"]}],
[9,"gauge","Commissioning","A pump failed its flow test twice. The vendor says it will pass after a third test with a tweaked setting. Startup is in 9 days. What should the commissioning manager do?",["Treat it as a deficiency: find the cause with the vendor before any retest","Run the third test, since the vendor knows its pump best","Accept the pump at 95% flow to protect the startup date","Swap in the spare pump for the startup, and send the failed one back to the vendor to investigate"],"Two failures mean a cause to understand. Retesting until it passes, or accepting below the criteria, hides the problem.",["Testing until it passes isn't verification.","The criteria are the criteria; deviations go through formal approval.","May be needed later, but without a cause the spare could fail too."],"",{"t":"bars","max":110,"unit":"%","rows":[["Required flow",100,"#9aa3b2"],["Test 1",93,"#ff6a13"],["Test 2",94,"#ff6a13"]]}],
[4,"wbs","Schedule compression","The sponsor asks you to cut 8 weeks. Fast-tracking the turbine hall saves 6 weeks with some rework risk; crashing the electrical works saves 4 weeks for $3M. What should you present?",["Options with their savings, cost and risk, and a recommended combination","Fast-tracking only, since it saves the most time and adds no direct cost to the budget","Crashing only, since money removes the risk","A statement that the 8 weeks can't be done"],"Give the sponsor a real decision: each option's time, cost and risk, and a combination that meets 8 weeks (for example fast-track plus partial crashing).",["Ignores that one option alone falls short of 8 weeks.","Crashing alone saves only 4 weeks.","You haven't tested whether a combination works."],"",{"t":"bars","max":10,"unit":" wk","rows":[["Asked for",8,"#9aa3b2"],["Fast-track",6,"#3fbf73"],["Crash ($3M)",4,"#ff6a13"]]}],
[5,"contract","Change order","A contractor starts extra excavation without a signed change order, saying your site engineer told them verbally to go ahead. What should the project manager do?",["Check what was instructed, stop unapproved work, and process a proper change order","Pay for the work, since your engineer gave the instruction","Refuse to pay anything for the extra excavation, since there is no signed change order","Tell the engineer to sign a change order backdated to the start"],"Establish the facts, control further unauthorized work, and handle the valid part through the contract's change process.",["Verbal instruction may not bind the owner; check first.","May be unfair if a valid instruction was given.","Backdating is falsifying records."],"",{"t":"gantt","days":20,"rows":[["Verbal go-ahead",2,1,0],["Extra excavation",3,8,1],["Change order",11,4,0]],"line":[11,"discovered"]}],

[7,"risk","Risk management","A heavy-lift path crosses an energized 230 kV line. The utility can de-energize it for 6 hours on two Sundays. The lift plan needs 8 hours. What should you do?",["Rework the lift plan to fit inside the outage windows, or ask for longer outages","Do the lift with the line live, keeping extra clearance","Do the first 6 hours on one Sunday and finish the remaining 2 hours on the next Sunday","Ask the utility to move the line permanently"],"The outage window is the constraint: replan the lift (pre-rigging, sequence) to fit, or negotiate a longer outage. Never lift near an energized line.",["Live-line lifts near 230 kV are unacceptably dangerous.","A heavy lift can't be left hanging between Sundays.","Far too slow and costly as a first step."],"",{"t":"gantt","days":12,"rows":[["Outage window",2,6,0],["Lift plan (now)",2,8,1],["Lift plan (reworked)",2,6,0]],"line":[8,"power back on"]}],

// a question's chart: a small schedule with the constraint marked, or labelled bars
function fig(f){
  if(!f)return '';
  const rows=f.rows,W=340,rowH=22,top=6,labelW=150,plotW=W-labelW-44,H=top+rows.length*rowH+(f.t==='gantt'&&f.line?14:6);
  const parts=[];
  if(f.t==='gantt'){
    const x=d=>labelW+d/f.days*plotW;
    rows.forEach((r,i)=>{const y=top+i*rowH;parts.push('<text x="'+(labelW-6)+'" y="'+(y+15)+'" text-anchor="end">'+esc(r[0])+'</text><rect x="'+x(r[1])+'" y="'+(y+4)+'" width="'+Math.max(2,x(r[1]+r[2])-x(r[1]))+'" height="14" rx="3" fill="'+(r[3]?'var(--hv)':'var(--bp)')+'"/>')});
    if(f.line){const lx=x(f.line[0]),y2=top+rows.length*rowH;parts.push('<line x1="'+lx+'" x2="'+lx+'" y1="'+top+'" y2="'+y2+'" stroke="var(--bad)" stroke-width="2" stroke-dasharray="4 3"/><text x="'+lx+'" y="'+(y2+11)+'" text-anchor="middle" fill="var(--bad)">'+esc(f.line[1])+'</text>')}
  }else{
    const max=f.max||Math.max(...rows.map(r=>r[1]));
    rows.forEach((r,i)=>{const y=top+i*rowH,w=Math.min(1,r[1]/max)*plotW;parts.push('<text x="'+(labelW-6)+'" y="'+(y+15)+'" text-anchor="end">'+esc(r[0])+'</text><rect x="'+labelW+'" y="'+(y+4)+'" width="'+Math.max(2,w)+'" height="14" rx="3" fill="'+(r[2]||'var(--bp)')+'"/><text x="'+(labelW+Math.max(2,w)+4)+'" y="'+(y+15)+'">'+r[1]+(f.unit||'')+'</text>')});
  }
  return '<svg class="fig" viewBox="0 0 '+W+' '+H+'" style="aspect-ratio:'+W+'/'+H+'" role="img" aria-label="Chart of the situation">'+parts.join('')+'</svg>';
}

function loadImg(q){
  const put=src=>{const box=$('pho');if(!src||!box||box.dataset.q!=String(q.id))return;const im=new Image();im.alt='Wikipedia: '+q.w;im.onload=()=>{const b=$('pho');if(b&&b.dataset.q==String(q.id)){b.replaceChildren(im);b.classList.add('on')}};im.src=src};
  if(q.w in imgCache){put(imgCache[q.w]);return}
  try{fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q.w.replace(/ /g,'_'))).then(r=>r.ok?r.json():null).then(j=>{const s=j&&j.thumbnail&&j.thumbnail.source;imgCache[q.w]=s||'';put(s)}).catch(()=>{imgCache[q.w]=''})}catch(e){}
}

function bump(){ // call after scoring; returns new element index if one unlocked
  const before=builtN();S.built=Math.max(S.built||0,correctN());const after=builtN();

}
