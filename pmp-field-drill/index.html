  let body='';
  if(tabNow==='play'){
    const n=builtN(),pct=Math.round((S.built||0)/Q.length*100),sp=S.pos||0,miss=Object.values(S.seen).filter(s=>!s.c).length;
    body=`<div class="page fit" id="pg">
<div class="scene">${site(-1)}<div class="cap"><span><b>${pct}% built</b> · ${n?esc(E[n-1][0]):'Greenfield site'}</span><span>${n<E.length?'Next: '+esc(E[n][0]):'Complete'}</span></div></div>
<h1>Build Northshore 5000. Pass the PMP.</h1>
<p class="lede">200 questions, one fictional 5,000 MW Lake Huron build. Every correct answer builds the plant.</p>
<div class="tb"><div><small>Level</small><strong>${level().i+1}</strong></div><div><small>Best streak</small><strong>${S.best}</strong></div><div><small>Badges</small><strong>${S.badges.length}/${BG.length}</strong></div><div><small>Seen</small><strong>${seenCount()}</strong></div><div><small>Correct</small><strong>${correctN()}</strong></div><div><small>XP</small><strong>${S.xp}</strong></div></div>
<button class="big" data-m="story"><h3>${sp?'Continue the story →':'Start the story →'}</h3><span>${sp?'Q'+(sp+1)+' · Ch '+Q[sp].ch+': '+esc(CH[Q[sp].ch][0]):'From the business case to handover, in order.'}</span></button>
<div class="row2"><button class="mode" data-m="sprint"><h3>Sprint 20</h3><span>80 s each, exam pace</span></button><button class="mode" data-m="miss" ${miss?'':'disabled'}><h3>Fix misses</h3><span>${miss?miss+' to redo':'None yet'}</span></button></div>
<div class="row2" style="grid-template-columns:repeat(3,minmax(0,1fr))"><button class="mode" data-m="P"><h3>People</h3><span>33%</span></button><button class="mode" data-m="R"><h3>Process</h3><span>41%</span></button><button class="mode" data-m="B"><h3>Business</h3><span>26%</span></button></div>
</div>`;
  }else if(tabNow==='ch'){
    body=`<div class="page fit" id="pg"><h2 class="sec">Chapters</h2><div class="chl">${CH.slice(1).map((c,i)=>{const s=chStat(i+1);return '<button class="chi" data-c="'+(i+1)+'"><span class="n">'+(i+1)+'</span><span><b>'+esc(c[0])+'</b></span><span><small>'+s.c+'/'+s.t+'</small><div class="bar"><i style="width:'+(s.t?s.c/s.t*100:0)+'%"></i></div></span></button>'}).join('')}</div></div>`;
  }else{
    const dm=['P','R','B'].map(d=>{const s=domStat(d);return '<div class="drow"><span>'+DN[d]+'</span><div class="bar"><i style="width:'+(s.c/s.t*100)+'%;background:var(--ok)"></i><i style="width:'+(s.x/s.t*100)+'%;background:var(--bad)"></i></div><span>'+s.c+'/'+s.t+'</span></div>'}).join('');
    body=`<div class="page fit" id="pg"><h2 class="sec">Domain mastery</h2>${dm}
<h2 class="sec">Question map <small style="font:500 11px Barlow;color:var(--mut)">tap to jump in</small></h2>
<div class="grid200">${Q.map(q=>{const s=S.seen[q.id];return '<button data-q="'+q.id+'" class="'+(s?(s.c?'c':'x'):'')+'" aria-label="Question '+(q.id+1)+'"></button>'}).join('')}</div>
<h2 class="sec">Badges</h2><div class="badges">${BG.map(b=>'<div class="badge '+(S.badges.includes(b[0])?'on':'')+'" title="'+esc(b[2])+'">'+medal+b[1]+'</div>').join('')}</div>
<div class="tiny"><span>Fictional project. Practice material, not official PMI content. Progress stays in this browser.</span><button id="reset">Reset</button></div></div>`;
  }
  V.innerHTML=body+`<nav class="nav" role="tablist">${[['play','Play'],['ch','Chapters'],['pr','Progress']].map(t=>'<button role="tab" data-t="'+t[0]+'" aria-selected="'+(t[0]===tabNow)+'">'+ICN[t[0]]+t[1]+'</button>').join('')}</nav>`;
  V.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>home(b.dataset.t));
  V.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(b.dataset.m));
  V.querySelectorAll('.chi').forEach(b=>b.onclick=()=>start('jump',chStat(+b.dataset.c).first));
  V.querySelectorAll('.grid200 button').forEach(b=>b.onclick=()=>start('jump',+b.dataset.q));
  if($('reset')){let armed=false;$('reset').onclick=e=>{if(!armed){armed=true;e.target.textContent='Tap again to wipe';return}S={xp:0,best:0,seen:{},badges:[],real:0,answered:0,sprint80:false,streak:0,built:0,pos:0};save();home('play')}}
  fit($('pg'),.6);
}

/* ---------- session ---------- */
let X=null,tmr=null;
function stopTimer(){if(tmr){clearInterval(tmr);tmr=null}}
function start(m,from){
  let ids;const all=Q.map(q=>q.id);
  if(m==='story')ids=all.slice(S.pos||0);
  else if(m==='sprint')ids=shuffle(all).slice(0,20);
  else if(m==='miss')ids=shuffle(Q.filter(q=>S.seen[q.id]&&!S.seen[q.id].c).map(q=>q.id));
  else if(m==='jump'){ids=all.slice(from);m='story'}
  else ids=shuffle(Q.filter(q=>q.d===m).map(q=>q.id));
  if(!ids.length)ids=all;
  X={m,ids,i:0,ok:0,xp:0,log:[],lastCh:-1};show();
}
const L='ABCD';
const IC={say:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>',x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 5l14 14M19 5L5 19"/></svg>'};
function show(){
  stopTimer();hush();hud();
  const q=Q[X.ids[X.i]];
  if(X.m==='story'&&q.ch!==X.lastCh){X.lastCh=q.ch;return chapter(q.ch)}
  X.order=shuffle([0,1,2,3]);X.done=false;X.t0=Date.now();
  if(X.m==='story'){S.pos=q.id;save()}
  const pct=Math.round((S.built||0)/Q.length*100);
  V.innerHTML=`<div class="strip" id="strip">${site(-1)}<span class="lab">Site cam · ${pct}% built</span><span class="lab lab2">Q${q.id+1} · ${X.i+1}/${X.ids.length}</span></div>
<div class="qmeta"><div class="plate">${art(q.ic)}</div><div class="pho" id="pho" data-q="${q.id}"></div>
<div class="mi"><div class="chips"><span class="chip ${q.d}">${DN[q.d]}</span><span class="chip">Ch ${q.ch}</span></div><span>${esc(CH[q.ch][0])}</span><a href="${wikiUrl(q.w)}" target="_blank" rel="noopener">Wikipedia: ${esc(q.w)} ↗</a></div>
${X.m==='sprint'?'<span class="timer" id="tm">80</span>':''}<button class="ibtn" id="sayq" aria-label="Read aloud">${IC.say}</button><button class="ibtn" id="quit" aria-label="End drill">${IC.x}</button></div>
<div class="prog"><span style="width:${X.i/X.ids.length*100}%"></span></div>
<div class="qbody fit" id="qb"><p class="qtext">${esc(q.q)}</p>${fig(q.f)}
<div class="opts" id="opts">${X.order.map((k,i)=>'<button class="opt" data-k="'+k+'"><span class="k">'+L[i]+'</span><span>'+esc(q.o[k])+'</span></button>').join('')}</div></div>`;
  loadImg(q);
  $('quit').onclick=finish;
  const readQ=()=>say([q.q].concat(X.order.map((k,i)=>'Option '+L[i]+'. '+q.o[k])),true);
  $('sayq').onclick=readQ;
  V.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(X.m==='sprint'){let t=80;tmr=setInterval(()=>{t--;const e=$('tm');if(e){e.textContent=t;e.classList.toggle('low',t<=15)}if(t<=0){stopTimer();answer(-1)}},1000)}
  fit($('qb'),.68);
  if(VO.on)readQ();
}
function chapter(c){
  const s=chStat(c);
  V.innerHTML=`<div class="strip">${site(-1)}<span class="lab">Site cam · ${Math.round((S.built||0)/Q.length*100)}% built</span></div><div class="chap fit" id="cp"><small>Chapter ${c} of 10 · ${s.t} questions</small><h2>${esc(CH[c][0])}</h2><p>${esc(CH[c][1])}</p><button class="btn hv" id="go">Start chapter →</button></div>`;
  $('go').onclick=show;fit($('cp'),.6);
  say(['Chapter '+c+'. '+CH[c][0]+'.',CH[c][1]]);
}
function answer(k){
  if(X.done)return;X.done=true;stopTimer();
  const q=Q[X.ids[X.i]],ok=k===0,secs=(Date.now()-X.t0)/1000;
  S.answered++;S.seen[q.id]={c:ok,n:((S.seen[q.id]||{}).n||0)+1};
  let gain=0;
  if(ok){S.streak++;S.best=Math.max(S.best,S.streak);const mult=Math.min(3,1+Math.floor(S.streak/3)*.5);gain=Math.round(10*mult)+(X.m==='sprint'&&secs<40?5:0);X.ok++}
  else S.streak=0;
  S.xp+=gain;X.xp+=gain;X.log.push({id:q.id,ok});
  const fresh=bump();
  if(fresh>=0){$('strip').innerHTML=site(fresh)+'<span class="lab">Site cam · '+Math.round(S.built/Q.length*100)+'% built</span>';}
  V.querySelectorAll('.opt').forEach(b=>{const kk=+b.dataset.k;b.disabled=true;if(kk===0)b.classList.add('right');else if(kk===k)b.classList.add('wrong')});
  const last=X.i===X.ids.length-1,mult=Math.min(3,1+Math.floor(S.streak/3)*.5);
  const head=ok?['Nailed it.','Correct.','That\'s the PMI answer.','Spot on.'][Math.floor(Math.random()*4)]:k<0?'Time\'s up.':'Not this time.';
  const [sl,su]=src(q);
  const panes={
    why:`<p><strong>Answer:</strong> ${esc(q.o[0])}</p><p>${esc(q.e)}</p>${!ok&&k>0?'<p><strong>Your pick:</strong> '+esc(q.n[k-1])+'</p>':''}<div class="src"><strong>PMI source:</strong> <a href="${su}" target="_blank" rel="noopener">${esc(sl)} ↗</a></div>`,
    opts:'<div class="ol">'+X.order.map((kk,i)=>'<div class="'+(kk===0?'c':kk===k?'x':'')+'"><b class="k">'+L[i]+'</b><span><strong>'+esc(q.o[kk])+'</strong><br>'+(kk===0?'Correct. '+esc(q.e.split('. ')[0].replace(/\.$/,''))+'.':esc(q.n[kk-1]))+'</span></div>').join('')+'</div>',
    real:q.r?'<span class="real">PMI vs the real world</span><p>'+esc(q.r)+'</p>':''};
  const tabs=[['why','Why'],['opts','All options']].concat(q.r?[['real','Real world']]:[]);
  const sh=document.createElement('section');sh.className='sheet'+(ok?'':' bad');
  sh.innerHTML=`<div class="sh"><h3>${head}</h3>${gain?'<span class="xp">+'+gain+' XP'+(mult>1?' ×'+mult:'')+'</span>':''}</div>
<div class="tabs" role="tablist">${tabs.map((t,i)=>'<button class="tab'+(t[0]==='real'?' hv':'')+'" role="tab" data-p="'+t[0]+'" aria-selected="'+(i===0)+'">'+t[1]+'</button>').join('')}</div>
<div class="sbody fit" id="sb"></div><button class="next" id="next">${last?'See results':'Next question →'}</button>`;
  V.appendChild(sh);
  let counted=false;
  const pane=p=>{$('sb').innerHTML=panes[p];$('sb').style.overflowY='hidden';sh.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.p===p));fit($('sb'),.7);if(p==='real'){say(['PMI versus the real world.',q.r]);if(!counted){counted=true;S.real++;save();checkBadges()}}};
  sh.querySelectorAll('.tab').forEach(t=>t.onclick=()=>pane(t.dataset.p));
  pane('why');
  $('next').onclick=()=>{if(last)finish();else{X.i++;show()}};
  if(gain)pop('+'+gain+' XP');
  if(fresh>=0)toast('Construction update',E[fresh][0]+'. Northshore is '+Math.round(S.built/Q.length*100)+'% built.');
  if(ok&&S.streak>0&&S.streak%5===0)toast('Streak '+S.streak,'Multiplier now ×'+mult);
  if(X.m==='story')S.pos=last?0:Q[X.ids[X.i+1]].id;
  save();hud();checkBadges();
  say([head,(!ok?'The answer is: '+q.o[0]+'. ':'')+q.e,(!ok&&k>0?'Your pick: '+q.n[k-1]:''),q.r?'There\'s a real-world note on this one.':'']);
}
function finish(){
  stopTimer();hush();
  const n=X.log.length;if(!n){home('play');return}
  const pct=Math.round(X.ok/n*100);
  if(X.m==='sprint'&&n===20&&pct>=80){S.sprint80=true;save();checkBadges()}
  const missed=X.log.filter(x=>!x.ok);
  const verdict=pct>=80?'Above target. The exam would like you.':pct>=65?'Close to target. Fix the misses and go again.':'Below target. Read every note and run it again.';
  V.innerHTML=`<div class="strip">${site(-1)}<span class="lab">Site cam · ${Math.round((S.built||0)/Q.length*100)}% built</span></div>
<div class="res fit" id="rs"><p class="cond" style="font-size:20px">Drill complete</p><div class="pct">${pct}%</div><p style="margin:0">${verdict}</p>
<div class="rw"><div>Correct<strong>${X.ok}/${n}</strong></div><div>XP earned<strong>+${X.xp}</strong></div><div>Built<strong>${Math.round((S.built||0)/Q.length*100)}%</strong></div></div>
<button class="btn hv" id="again">Keep going</button>${missed.length?'<button class="btn" id="fix">Drill these '+missed.length+' misses</button>':''}<button class="btn alt" id="hm">Home</button></div>`;
  say(['Drill complete. You scored '+pct+' percent.',verdict]);
  const m=X.m,ids=missed.map(x=>x.id);
  $('again').onclick=()=>start(m);$('hm').onclick=()=>home('play');
  if($('fix'))$('fix').onclick=()=>{X={m:'miss',ids:shuffle(ids),i:0,ok:0,xp:0,log:[],lastCh:-1};show()};
  hud();fit($('rs'),.6);
}
document.addEventListener('keydown',e=>{
  if(!X||!$('opts')||e.ctrlKey||e.metaKey||e.altKey)return;
  const i='abcd1234'.indexOf(e.key.length===1?e.key.toLowerCase():'#');
  if(i>=0&&!X.done){const b=$('opts').children[i%4];if(b)b.click()}
  else if(e.key==='Enter'&&X.done&&$('next')&&document.activeElement!==$('next')){e.preventDefault();$('next').click()}
});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>['pg','qb','sb','cp','rs'].forEach(id=>fit($(id),.6)),120)});
$('home').onclick=()=>home('play');
home('play');
}
</script>
</body>
</html>
