<style>
/* VOICE: a site foreman who also passed the exam - direct, energetic
   IDEA: a phone-sized site cam + drawing plate; the station builds as you learn
   PICTURE: live plant strip on top, animated blueprint plate + Wikipedia photo per question
   COLOUR and TYPE: blueprint blue, hi-vis orange, white; Barlow / Barlow Condensed
   LAYOUT: fixed portrait phone frame, no page scroll, bottom sheet feedback, tabbed home */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#111418);--ink:light-dark(#121417,#eef0f3);--mut:light-dark(#5b6270,#9aa3b2);
--card:light-dark(#ffffff,#191d22);--line:light-dark(#e2e5ea,#2a3038);--soft:light-dark(#f1f3f6,#1f242b);
--bp:light-dark(#1d4ed8,#2a55c9);--bpd:light-dark(#173ea8,#1b3a8f);--hv:#ff6a13;--hvk:#1a1300;
--ok:light-dark(#16803f,#3fbf73);--okb:light-dark(#e8f6ee,#13301f);--bad:light-dark(#c62828,#ff6b6b);--badb:light-dark(#fdecec,#3a1717)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#0e2a7a;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif-condensed,Barlow,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--hv);outline-offset:2px}
a{color:var(--bp)}
#phone{position:relative;width:min(100vw,430px);height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:620px) and (min-height:720px){#phone{height:min(94dvh,880px);margin-top:3dvh;border-radius:34px;border:10px solid #0b0d10;box-shadow:0 30px 80px rgba(0,0,0,.45)}}
/* HUD */
.hud{flex:none;background:var(--bpd);color:#fff;border-bottom:3px solid var(--hv);display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));min-height:54px}
.hbtn{background:none;border:0;color:#fff;padding:0;width:34px;height:34px;display:grid;place-items:center;flex:none}
.hbtn i{display:block;width:22px;height:22px;background:var(--hv);clip-path:polygon(50% 0,100% 100%,0 100%)}
.lvl{flex:1;display:flex;flex-direction:column;gap:3px}
.lvl b{font:700 15px "Barlow Condensed","Arial Narrow",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:7px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden}
.xpbar span{display:block;height:100%;background:var(--hv);transition:width .5s}
.streak{display:flex;align-items:center;gap:4px;font:700 19px "Barlow Condensed","Arial Narrow",sans-serif;white-space:nowrap}
.streak svg{width:16px;height:20px}.streak.hot svg path{fill:var(--hv)}
.vbtn{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;width:44px;height:38px;display:grid;place-items:center;flex:none}
.vbtn[aria-pressed=true]{background:var(--hv);border-color:var(--hv);color:var(--hvk)}
.vbtn svg{width:20px;height:20px}
#view{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.fit{--s:1}
/* plant strip */
.strip{flex:none;height:92px;position:relative;background:linear-gradient(#cfe0ff,#eef4ff 75%);overflow:hidden;border-bottom:2px solid var(--line)}
:root[data-theme=dark] .strip,:root[data-theme=dark] .scene{background:linear-gradient(#0d1a3a,#1a2b55 75%)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .strip,:root:not([data-theme=light]) .scene{background:linear-gradient(#0d1a3a,#1a2b55 75%)}}
.strip svg,.scene svg{position:absolute;inset:0;width:100%;height:100%}
.strip .lab{position:absolute;left:8px;top:6px;font:700 12px Barlow;background:rgba(0,0,0,.55);color:#fff;padding:2px 8px;border-radius:10px}
.strip .lab2{left:auto;right:8px}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1.2s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rise{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.pwr{stroke-dasharray:6 10;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-16}}
.steam{animation:steam 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes steam{0%,100%{opacity:.5}50%{opacity:.95;transform:translateY(-6px) scale(1.1)}}
/* a question's chart */
.fig{display:block;flex:none;width:100%;height:auto;max-width:440px;margin:6px auto 10px;font:600 12px Barlow,system-ui,sans-serif;fill:var(--ink);background:var(--soft);border-radius:8px;padding:2px 0}
/* quiz */
.qmeta{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px 0}
.plate{width:84px;height:63px;flex:none;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:#1d4ed8}
.plate svg{display:block;width:100%;height:100%}
.pho{width:63px;height:63px;flex:none;border-radius:50%;overflow:hidden;border:2px solid var(--ink);display:none}
.pho.on{display:block}.pho img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .5s}
@keyframes fade{from{opacity:0}}
.mi{flex:1;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.mi .chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--soft);white-space:nowrap;color:var(--ink)}
.chip.P{background:#ffe3d1;color:#7a2e00}.chip.R{background:#dbe5ff;color:#102c7a}.chip.B{background:#e6dcff;color:#3a1b80}
.mi a{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;flex:none;border:2px solid var(--line);border-radius:10px;background:var(--card);display:grid;place-items:center;padding:0}
.ibtn svg{width:18px;height:18px}
.prog{flex:none;height:4px;background:var(--soft);margin:8px 12px 0;border-radius:3px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--bp)}
.timer{font:700 20px "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}.timer.low{color:var(--bad)}
.qbody{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:calc(8px*var(--s));padding:8px 12px 10px}
.qtext{font-size:calc(16.5px*var(--s));font-weight:600;line-height:1.32;margin:0}
.opts{display:flex;flex-direction:column;gap:calc(7px*var(--s))}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:9px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:calc(8px*var(--s)) 10px;min-height:44px;font-size:calc(15px*var(--s));line-height:1.28}
.opt .k{width:26px;height:26px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font:700 15px "Barlow Condensed","Arial Narrow",sans-serif}
.opt:active:not([disabled]){transform:scale(.98)}
.opt.right{border-color:var(--ok);background:var(--okb)}.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badb)}.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:66%;height:66%;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:up .35s cubic-bezier(.2,1,.3,1);border-top:5px solid var(--ok);z-index:4}
.sheet.bad{border-top-color:var(--bad)}
@keyframes up{from{transform:translateY(100%)}}
.sh{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
.sh h3{font-size:24px;flex:1}
.xp{font:700 16px "Barlow Condensed","Arial Narrow",sans-serif;background:var(--hv);color:var(--hvk);padding:2px 9px;border-radius:14px;white-space:nowrap}
.tabs{display:flex;gap:4px;padding:0 10px;border-bottom:2px solid var(--line)}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 2px;font-weight:700;font-size:13.5px;color:var(--mut);min-height:40px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--hv)}
.tab.hv{color:#c24a00}
.sbody{flex:1;min-height:0;overflow:hidden;padding:10px 14px;font-size:calc(15px*var(--s));line-height:1.4}
.sbody p{margin:0 0 calc(8px*var(--s))}
.sbody .ol{display:flex;flex-direction:column;gap:calc(7px*var(--s))}
.sbody .ol div{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px}
.sbody .ol b.k{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font:700 13px "Barlow Condensed","Arial Narrow",sans-serif;background:var(--soft)}
.sbody .ol .c b.k{background:var(--ok);color:#fff}.sbody .ol .x b.k{background:var(--bad);color:#fff}
.src{font-size:calc(13px*var(--s));color:var(--mut);border-top:1px solid var(--line);padding-top:calc(8px*var(--s))}
.real{background:repeating-linear-gradient(-45deg,var(--hv) 0 12px,#ffc229 12px 24px);color:var(--hvk);font:700 14px "Barlow Condensed","Arial Narrow",sans-serif;padding:3px 10px;border-radius:4px;display:inline-block;margin-bottom:8px}
.next{flex:none;margin:6px 12px 12px;background:var(--bp);color:#fff;border:0;border-radius:12px;padding:12px;font:700 20px "Barlow Condensed","Arial Narrow",sans-serif;min-height:52px}
/* home */
.page{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:12px 14px;gap:calc(10px*var(--s))}
.scene{position:relative;flex:none;height:calc(180px*var(--s));border-radius:10px;overflow:hidden;border:2px solid var(--line)}
.scene .cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:6px;padding:5px 10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px}
.scene .cap b{font:700 15px "Barlow Condensed","Arial Narrow",sans-serif}
.page h1{font-size:calc(30px*var(--s))}
.page p.lede{margin:0;font-size:calc(14px*var(--s));color:var(--mut)}
.tb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.tb div{padding:calc(6px*var(--s)) 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tb div:nth-child(3n){border-right:0}.tb div:nth-last-child(-n+3){border-bottom:0}
.tb small{display:block;font-size:11px;color:var(--mut)}
.tb strong{font:700 calc(24px*var(--s)) "Barlow Condensed","Arial Narrow",sans-serif;white-space:nowrap}
.big{background:var(--hv);color:var(--hvk);border:0;border-radius:12px;padding:calc(12px*var(--s)) 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.big h3{font-size:calc(26px*var(--s))}.big span{font-size:calc(13.5px*var(--s))}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.mode{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:calc(9px*var(--s)) 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:44px}
.mode h3{font-size:calc(19px*var(--s))}.mode span{font-size:calc(12.5px*var(--s));color:var(--mut)}
.mode[disabled]{opacity:.45}
.nav{flex:none;display:flex;border-top:2px solid var(--line);background:var(--card)}
.nav button{flex:1;background:none;border:0;padding:8px 0 10px;font:700 15px "Barlow Condensed","Arial Narrow",sans-serif;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px}
.nav button svg{width:22px;height:22px}
.nav button[aria-selected=true]{color:var(--bp)}
.chl{display:flex;flex-direction:column;gap:5px}
.chi{display:grid;grid-template-columns:30px minmax(0,1fr) 56px;gap:8px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:3px 10px;text-align:left;min-height:calc(46px*var(--s))}
.chi .n{font:800 22px "Barlow Condensed","Arial Narrow",sans-serif;color:var(--bp)}
.chi b{font:700 calc(19px*var(--s)) "Barlow Condensed","Arial Narrow",sans-serif;display:block;line-height:1.1}
.chi small{color:var(--mut);font-size:11.5px}
.chi .bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}.chi .bar i{display:block;height:100%;background:var(--ok)}
.sec{font-size:calc(20px*var(--s))}
.drow{display:grid;grid-template-columns:8.6em minmax(0,1fr) 3.4em;gap:8px;align-items:center;font-size:calc(13.5px*var(--s))}
.drow .bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;display:flex}.drow .bar i{display:block;height:100%}
.drow span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.grid200{width:calc(100% * var(--s));margin:0 auto;display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:2px}
.grid200 button{aspect-ratio:1;border:0;border-radius:2px;background:var(--soft);padding:0}
.grid200 button.c{background:var(--ok)}.grid200 button.x{background:var(--bad)}
.badges{width:calc(100% * (var(--s) + .15));max-width:100%;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.badge{border:2px dashed var(--line);border-radius:8px;padding:calc(5px*var(--s)) 3px;text-align:center;font:700 calc(13px*var(--s)) "Barlow Condensed","Arial Narrow",sans-serif;color:var(--mut);line-height:1.1}
.badge svg{width:calc(26px*var(--s));height:calc(26px*var(--s));display:block;margin:0 auto 2px}
.badge.on{border-style:solid;border-color:var(--hv);color:var(--ink)}.badge.on svg .m{fill:var(--hv)}
.tiny{font-size:11px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:8px}
.tiny button{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;min-height:32px}
/* chapter + results */
.chap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:calc(12px*var(--s));padding:20px;background:var(--bp);color:#fff;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:24px 24px;overflow:hidden}
.chap small{font-weight:700;opacity:.85}
.chap h2{font-size:calc(40px*var(--s))}
.chap p{font-size:calc(17px*var(--s));margin:0}
.btn{background:var(--bp);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:700 20px "Barlow Condensed","Arial Narrow",sans-serif;min-height:50px}
.btn.hv{background:var(--hv);color:var(--hvk)}.btn.alt{background:var(--soft);color:var(--ink)}
.res{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:center;padding:16px;gap:calc(12px*var(--s));overflow:hidden}
.res .pct{font:800 calc(96px*var(--s)) "Barlow Condensed","Arial Narrow",sans-serif;line-height:1}
.res .rw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.res .rw div{background:var(--soft);border-radius:8px;padding:8px 4px;font-size:12px}
.res .rw strong{display:block;font:700 22px "Barlow Condensed","Arial Narrow",sans-serif}
.res .btn{width:100%}
/* fx */
.pop{position:absolute;left:50%;top:110px;transform:translateX(-50%);background:var(--hv);color:var(--hvk);font:800 26px "Barlow Condensed","Arial Narrow",sans-serif;padding:6px 16px;border-radius:30px;pointer-events:none;animation:pop 1s forwards;z-index:9}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px)}}
.toast{position:absolute;left:12px;right:12px;top:62px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;border-left:6px solid var(--hv);z-index:9;animation:fade .3s;font-size:14px}
.toast b{font:700 17px "Barlow Condensed","Arial Narrow",sans-serif;display:block}
/* animated blueprint */
.art g>*{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease forwards}
.art g>*:nth-child(2){animation-delay:.15s}.art g>*:nth-child(3){animation-delay:.3s}.art g>*:nth-child(n+4){animation-delay:.45s}
.art g>[stroke="#ff6a13"]{animation:draw 1.4s .5s ease forwards,glow 2.4s 2s ease-in-out infinite}
.art .scan{animation:scan 3.2s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes glow{50%{opacity:.35}}
@keyframes scan{from{transform:translateX(-40px)}to{transform:translateX(220px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.art g>*{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="phone">

D('P',[
['team',"Tuckman's stages of group development","Two weeks after a hybrid team forms, two senior engineers argue in every meeting about the design approach. Progress is slowing. What should the project manager do?",["Recognize the storming stage and facilitate an agreement on how design calls get made","Reassign one of the engineers to another package so design work can move again","Escalate to both engineers' functional managers and ask them to settle the dispute","Leave it for now; teams usually work through these disagreements on their own"],"Storming is a normal stage. The PM's job is to coach the team through it, usually by agreeing ground rules and a decision process in the team charter, not by punishing anyone or escalating.",["Punitive and premature. Conflict at this stage is expected and can be productive.","Escalating before you have tried to resolve it yourself is a classic wrong answer.","Passive. Unmanaged storming can stall a team for months."],"On a real job, if those two are on the critical path, a lot of PMs would also name a design authority to make the call this week. Sometimes a fast decision beats a perfect consensus."],
['conflict',"Conflict management","Two team members disagree on the testing approach. The deadline is weeks away and both have valid points. Which conflict technique is most effective here?",["Collaborate to reach a solution both can support","Smooth over the differences so the test plan stays on track","Force a decision now, using your authority as project manager","Compromise: each gives up part of their approach to save time"],"With time available and two valid positions, collaborating gives a lasting win-win and buy-in. PMI rates collaborate/problem-solve as the best long-term technique.",["Smoothing plays down the issue. It buys calm but solves nothing.","Forcing is win-lose. Save it for emergencies or safety calls.","Withdrawing just postpones the conflict."],"PMI treats collaborate as almost always right. On site, when it's a safety, code or regulatory question, forcing (a clear call from the person accountable) is correct, and often kinder than a long workshop."],
['team',"Servant leadership","An agile team is blocked waiting for a security review that has been stuck for a week. As a servant leader, what do you do?",["Work directly with the security group to remove the impediment","Tell the team to pull other work and wait for the review to clear","Ask the product owner to reprioritize the backlog around the blocked item","Log the blocker and raise it at the next sprint retrospective"],"A servant leader's core job is removing impediments so the team can deliver. Go and clear the blocker.",["Working around it may be needed, but the blocker still has to be removed.","Reprioritizing hides the problem rather than solving it.","A retrospective is too late. Impediments get handled now."],""],
['team',"Emotional intelligence","A team member comes out of a client call visibly upset and snaps at a colleague. What should you do first?",["Talk with them privately and listen to what happened","Remind them in the team channel of the agreed code of conduct","Reassign the difficult client to a more experienced colleague","Report the incident to HR so it is properly documented"],"Emotional intelligence starts with empathy and private, active listening. Understand before you act.",["Public correction humiliates them and damages trust.","Jumping to a solution before you understand the cause.","Far too formal for a first response to one bad moment."],""],
['team',"Virtual team","Your team spans four time zones and handoffs keep getting dropped. What is the best action?",["Agree team norms on overlap hours, handoff notes and async updates","Require everyone to work the same core hours, whatever their time zone","Ask each site to send a more detailed daily status report","Ask the sponsor to fund moving the team to one location"],"Distributed teams need explicit working agreements: overlap windows, handoff protocols and communication norms, ideally written up with the team.",["Unrealistic, and it ignores people's lives and labour rules.","More reporting adds overhead without fixing the handoff process.","Co-location may not be possible, and it skips the cheaper fix."],"Real world: bringing the core team together for a few weeks (a 'big room') often fixes it faster than any charter. PMI rarely picks the answer that spends travel money."],
['team',"Self-organization","A self-organizing agile team asks you to decide how to split up the sprint tasks. What should you do?",["Encourage the team to decide together, and facilitate if needed","Assign the tasks to the fastest people so the sprint stays on track","Ask the product owner to assign the tasks by business priority","Decide the split yourself to save the team time in planning"],"Self-organizing teams own how the work gets done. The PM or scrum master coaches them to decide and does not take the decision back.",["Command-and-control, and it creates bottlenecks.","The PO owns what gets built, not who builds it.","It undermines self-organization in the long run."],"In hybrid construction and engineering work, the PM often does assign work packages, and crews expect it. 'Never assign tasks' is a software-agile idea, not a law of nature."],
['team',"Performance management","A team member has missed three deliverables in a row. What is your first step?",["Meet privately to understand the cause and agree a way forward","Report the missed deliverables to their functional manager in writing","Raise the pattern at the daily standup so the team can help","Ask the resource manager to replace them with someone more reliable"],"PMI's mindset is to understand the root cause first, privately. There may be a skill gap, workload clash or personal issue.",["Escalating before talking to the person directly.","Public shaming. Standups are for coordination.","Removal comes only after coaching and support have failed."],"Real world: by the third miss, many PMs document it and loop in the functional manager at the same time as the private talk, especially with contractor staff. PMI wants the conversation first, every time."],
['doc',"Team charter","A new hybrid team keeps clashing over meeting times, response-time expectations and decision rights. What should you do?",["Facilitate the team in writing a team charter together","Write the ground rules yourself and send them to everyone","Ask the sponsor to set the rules so they carry authority","Wait a few weeks to see whether the problems repeat"],"A team charter built by the team itself (values, ground rules, decision process, working agreements) gets ownership and prevents repeat conflicts.",["Imposed rules get less buy-in than rules the team writes.","The sponsor shouldn't be pulled into how the team runs day to day.","Reactive. The problems are already happening."],""],
['team',"Psychological safety","In retrospectives nobody speaks up, but you hear complaints in the hallway afterwards. What is the best approach?",["Build safety: anonymous input, you speak last, and act visibly on what's raised","Ask each person to speak in turn so everyone has to contribute","Replace retrospectives with an anonymous written survey, since the meetings clearly aren't working","Invite a senior manager to attend so the team takes it seriously"],"People speak up when it feels safe and when they see action. Anonymous tools and following through build that trust.",["Forced participation without safety produces safe, empty answers.","Removes the improvement loop altogether.","Senior managers in the room usually reduce candour."],""],
['team',"Two-factor theory","Team members complain that their laptops are slow and out of date. In Herzberg's theory, the laptops are a:",["Hygiene factor","Motivator","Self-actualization need","Theory Y driver"],"Hygiene factors (tools, pay, conditions) cause dissatisfaction when missing but don't motivate when present. Fix them to remove complaints.",["Motivators are achievement, recognition, growth and the work itself.","That's Maslow's top tier, not Herzberg.","Theory X and Y (McGregor) are about managers' assumptions, not factors."],""],
['conflict',"Negotiation","A functional manager wants to pull your key engineer off the project for a month in the middle of critical work. What should you do first?",["Meet the functional manager, understand their need and negotiate an option","Escalate to the sponsor at once, since the work is on the critical path and can't slip a day","Accept the request and re-plan the critical work around the gap","Refuse, pointing to the resource commitment in the plan"],"In a matrix organization the PM negotiates for resources. Understand their need and look for a win-win, such as sharing time or a later start.",["Escalation comes after negotiation fails.","Gives up without trying, and it may hurt the critical path.","Combative, and it damages the relationship."],"Real world: if that engineer is on the critical path and the functional manager won't budge, a quick sponsor call the same day is normal, and expected. Senior people would rather hear early."],
['team',"Mentorship","A junior team member wants to grow into a scheduling role, but you have little time to mentor. What is best?",["Pair them with an experienced scheduler and agree development goals","Point them to an online scheduling course they can take in their own time","Note the request and agree to revisit it once the project is closed","Give them the hardest scheduling task so they learn quickly by doing"],"Supporting growth through mentoring with clear goals builds capability and engagement.",["Self-study alone is weak support.","Defers their development and hurts engagement.","Sink-or-swim risks failure and the schedule."],""],
['stake',"Active listening","A stakeholder is loudly complaining in a meeting that their requirements are being ignored. What should you do?",["Listen, paraphrase their concerns back, and agree a follow-up","Correct their facts on the spot so the record stays accurate","Close the meeting and reschedule once they have calmed down","Ask them to put their concerns in an email for the change log"],"Active listening defuses emotion and shows respect. Confirm understanding, then follow up with action.",["Arguing escalates the situation.","Avoidance. The issue remains.","Dismissive at the moment they want to be heard."],""],
['conflict',"Conflict management","According to PMI, the most common sources of conflict on projects are:",["Schedules, priorities and resources","Personalities and individual work styles","Technical opinions and design approaches","Cost overruns and budget pressure"],"PMI's classic list ranks schedules, project priorities and resources at the top. Personality is near the bottom.",["Personality is one of the least common sources in PMI's list.","Technical disagreements are a source, but not the top one.","Cost matters, but it's lower on the classic list."],"On megaprojects with several prime contractors, interfaces between scopes (who owns the gap) generate as much conflict as schedules. PMI's list predates modern multi-contract builds."],
['team',"Employee recognition","Your team just hit a very tough milestone. What is the best way to recognize them?",["Recognize the team publicly, and each person in a way that matters to them","Give a bonus to the top performer, so effort is clearly rewarded","Thank everyone by email; meeting the milestone is part of the job","Hold one big celebration when the whole project is finished"],"Timely recognition, tailored to what each person values, reinforces the behaviour. Do it now, and include the whole team.",["Singling out one person can damage team cohesion.","Missed chance to reinforce good performance.","Too late. Recognition works best close to the event."],""],
['team',"Fist of five","An agile team needs to make a quick decision and you want to check everyone's level of support. Which technique fits best?",["Fist of five","Delphi technique","Majority vote by email","Let the most senior member decide"],"Fist of five (or roman voting) quickly shows the level of agreement and lets low scores explain their concerns.",["Delphi is anonymous, slow and expert-based. It doesn't fit a quick team check.","Slow, and it hides how strongly people feel.","Autocratic, and it skips buy-in."],""],
['team',"Situational leadership theory","A new team member is enthusiastic but has little experience with the work. Which leadership style fits best?",["Directing (telling)","Delegating, to build their confidence","Supporting (participative)","Coaching through questions only"],"High commitment and low competence calls for directing: clear instructions and close supervision while they build skill.",["Delegating suits people with high competence and high commitment.","Supporting suits capable people whose confidence varies.","Hands-off leaves an inexperienced person on their own."],""],
['stake',"Stakeholder analysis","A stakeholder with high power and high interest is resisting the project. How should you engage them?",["Manage them closely: meet, understand their concerns and involve them","Monitor them with minimal effort and watch for any changes in their interest or influence","Keep them informed through the regular project newsletter","Limit contact with them so the friction doesn't spread"],"On the power/interest grid, high-high stakeholders are managed closely. Understand the resistance and engage directly.",["Monitoring is for low-power, low-interest stakeholders.","Too passive for someone who can derail the project.","Avoiding a powerful resister makes it worse."],""],
['stake',"Stakeholder management","A new senior stakeholder joins the project halfway through. What should you do first?",["Update the stakeholder register and meet them to learn their needs","Send them the full set of project documents so they can catch up on everything at their own pace","Add them to the distribution list for status reports and minutes","Ask the sponsor what this stakeholder is likely to want"],"Identify and analyze them first. Register, assess, meet, then tailor engagement and communication.",["Information dump. Not tailored to what they need.","Passive. You don't yet know what they need.","Skips direct engagement."],""],
['team',"Groupthink","Your team quickly agrees on a risky technical approach and nobody raises any concerns. What should you do?",["Draw out dissent, using a devil's advocate or anonymous input","Approve the approach, since the whole team agrees on it","Ask the sponsor to make the final call to be safe","Postpone the decision until a specialist can review it"],"Fast, unchallenged agreement on something risky is a groupthink warning sign. Build in structured dissent.",["Unanimity is not the same as a sound decision.","Pushes the decision away from the people who know the work.","Delay without a method doesn't improve the decision."],""],
['cycle',"Daily stand-up meeting","During the daily standup, one team member keeps taking over to solve technical problems, and the meeting runs 40 minutes. What should the scrum master do?",["Coach the member privately on the standup's purpose; take problems offline","Remind the member in front of the team to keep updates short, so the standup stays on time","Ask the member to send written updates instead of attending","Let it continue, since the problems being raised are real ones"],"Standups are timeboxed coordination (15 minutes). Problem-solving happens afterward with only the people who need to be there. Coach privately.",["Public reprimands damage psychological safety.","Excluding someone breaks team coordination.","It wastes everyone's time and erodes the event."],""],
['team',"Training and development","Your team lacks skills in a new modelling tool that will be critical next month. What should you do?",["Assess the gap, arrange training and put the training time in the schedule","Hire a contractor to do all of the modelling for this project","Expect them to learn the tool on the job as the work starts","Delay the modelling work until someone experienced with the tool frees up from another project"],"Training is a planned project activity. Identify the gap and plan for it, including the schedule time.",["Leaves the team's capability gap in place long term.","Hoping is not a plan.","Premature. Training solves the problem."],""],
['doc',"Ground rules","A team member is regularly 10 minutes late to meetings, even though the team charter says meetings start on time. What should you do?",["Talk with them privately, referring to the ground rules the team agreed","Move the meetings to a time that suits their other commitments","Mention the lateness to their manager at the next review","Start each meeting on time and lock the door at the start"],"Ground rules belong to the team, and the PM enforces them respectfully, starting with a private conversation.",["Rewards the behaviour and inconveniences everyone else.","Escalates before trying to resolve it directly.","Punitive and hostile."],""],
['team',"Cross-cultural communication","A team member from a culture where challenging authority is uncommon never raises issues, even when problems exist. What should you do?",["Offer several ways to raise issues and invite their views directly","Take their silence as agreement and carry on with the plan","Tell them clearly that they are expected to speak up in meetings like everyone else on the team","Move them to a role where they don't need to raise issues"],"Adapt to cultural differences by creating safe, varied channels for input.",["Silence doesn't mean there are no problems.","Demanding behaviour against their norms rarely works.","Punishes a cultural difference."],""],
['scale',"French and Raven's bases of power","You are the PM in a weak matrix with little formal authority. Which types of power are most effective?",["Expert and referent power","Coercive power","Legitimate (formal) power","Reward power"],"With little formal authority, influence comes from your expertise and from people respecting and wanting to work with you.",["Coercion destroys trust, and you likely can't use it anyway.","That's the power you don't have in a weak matrix.","You usually control few rewards in a weak matrix."],""],
['kanban',"Scrum (software development)","Mid-sprint, a developer wants to work on an interesting feature that isn't in the sprint backlog. What should happen?",["Point to the sprint goal; suggest they take the idea to the product owner","Let them build it, since they are motivated and the customer may well love the extra feature","Add the feature to the current sprint and drop something smaller","Escalate to their manager, as they are working outside the plan"],"Sprint scope is protected by the sprint goal. New ideas go to the product owner for the product backlog.",["It jeopardizes the sprint commitment.","Changing sprint scope mid-sprint undermines the goal.","Overreaction. Coach, don't escalate."],""],
['team',"Occupational burnout","Your team has been working heavy overtime for six weeks and quality is slipping. What should you do?",["Reassess the workload and negotiate scope, schedule or resources","Push through to the finish, then give the team time off afterwards","Bring in dinners and recognition for the late nights to lift morale","Hire several new people immediately to share the overtime"],"Sustainable pace matters. Overtime this long hurts quality and morale. Re-plan with stakeholders using options.",["Burnout and defects will make the schedule worse.","A nice gesture that doesn't fix the cause.","Brooks's law: adding people late often slows things down further."],"Real world: sometimes the outage window or regulatory date is fixed and you do push. Good PMs then plan the recovery explicitly (rotations, rest days) and say so out loud."],
['stake',"Project sponsor","Your sponsor criticized the team publicly in a steering meeting. Morale has dropped. What should you do?",["Meet the sponsor privately to understand their concerns and explain the impact","Defend the team publicly at the next steering meeting","Let it pass; sponsors are often under pressure themselves","Raise the sponsor's behaviour with the sponsor's own manager"],"Raise it privately and respectfully. Understand what's behind the criticism and address both the concern and the impact.",["A public confrontation damages the relationship.","Morale and the underlying concern both go unaddressed.","Going over the sponsor's head first is an escalation error."],""],
['doc',"Knowledge transfer","Your only expert in a critical system is leaving the organization in three weeks. What should you do?",["Plan knowledge transfer: pairing, recorded walkthroughs and repository updates","Ask them to write full documentation of everything they do before their last day on the project","Start looking for a replacement once their notice period has ended","Offer them more money to stay until the project is finished"],"Tacit knowledge needs people-to-people methods (pairing, shadowing) plus explicit capture. Plan it now.",["Documents alone miss tacit knowledge.","Too late. The knowledge walks out the door.","Not usually the PM's call, and they may leave anyway."],""],
['team',"Conflict management","Two team members have a personal conflict that is now affecting the whole team's work. They've tried to resolve it themselves and failed. What should you do?",["Meet with both together and facilitate a resolution focused on the work","Ask HR to handle it, since it has now become a personal matter rather than a work one","Separate them permanently onto different work packages","Tell the rest of the team to ignore the conflict and keep working"],"Once direct resolution fails, the PM steps in and facilitates. Keep it about the behaviour and the work, not the personalities.",["HR comes in only for policy violations or after the PM's efforts fail.","Avoidance. The conflict stays.","Hiding it doesn't stop the impact."],""],
['team',"Interpersonal skills","You are taking over a project from another PM mid-stream. The team is wary of you. What should you do first?",["Meet each team member to learn their work, concerns and ways of working","Announce your new processes at a kickoff so expectations are clear","Review the team's past performance ratings to see who needs support","Ask the previous PM which team members caused the most problems"],"Build relationships and understanding first. Trust comes before changing anything.",["Imposing change before understanding creates resistance.","Judging people on paper before meeting them.","It starts you off biased."],""],
['ai',"Generative artificial intelligence","A team member uses a public AI chatbot to summarize confidential vendor bids. What should you do?",["Stop it, explain the data policy, and point them to approved tools","Encourage it, since it saves time and the summaries were accurate","Let it go this once, and add a note about AI use to the lessons log","Ban all AI tools on the project until a policy is written"],"Confidential data in unapproved tools is a policy and security issue. Correct it, educate, and offer an approved route.",["Productivity doesn't override confidentiality.","Accurate output doesn't fix the data leak.","Overreaction. Approved AI tools can add real value."],""],
['team',"Coaching","An agile team keeps missing its sprint goals because it over-commits. As servant leader, what should you do?",["Coach the team to plan to its actual velocity and discuss it in the retro","Set the sprint scope for the team based on last sprint's results","Report the missed commitments to management so they are visible","Extend the sprint length so the team has enough time to finish everything it commits to"],"Coach, don't control. Use empirical data (velocity) and the retrospective to improve planning.",["Removes the team's ownership of its commitments.","Escalation doesn't fix the planning habit.","Longer sprints don't fix over-commitment."],""],
]);

D('P',[
['stake',"Stakeholder engagement","A stakeholder register shows a department head as 'unaware' of the project, but their team will be heavily affected. What should you do?",["Plan engagement to move them toward supportive, starting with a meeting","Leave them out of the loop for now to avoid early resistance","Wait until deployment, when the changes will be concrete and easier for them to understand","Ask their staff to brief them about the project as it goes"],"The stakeholder engagement assessment matrix compares current and desired engagement. Close the gap on purpose, with a plan.",["Surprised stakeholders become resistant stakeholders.","Late surprises create the worst resistance.","Indirect, and it bypasses a key relationship."],""],
['conflict',"Conflict management","Two contractors on site are arguing over who is responsible for a gap between their scopes, and work has stopped. What should you do first?",["Bring both together, review the contract scopes and agree the gap","Tell the larger contractor to cover the gap and sort out costs later","Wait for them to settle it between themselves under the contract","Issue a stop-work order to both until the dispute is resolved"],"Facilitate, using the contract documents as the shared facts. Then capture the decision through change control if the scope changes.",["Forcing without reviewing the contracts may create a claim.","Work has stopped. Waiting costs money.","Escalates the impact instead of resolving it."],"Real world in construction: you also confirm in writing straight away who is directed to do the work and that cost entitlement is reserved. Otherwise the 'facilitated agreement' becomes a claim six months later."],
['team',"Team building","A newly formed team doesn't know each other and is hesitant to share ideas. What should you do?",["Hold team-building activities and set up early chances to collaborate","Assign work individually for now to avoid friction between people","Wait for the norming stage, when trust will build by itself","Bring in a motivational speaker to energize the new team"],"In the forming stage, the PM helps people get to know each other and build trust.",["It isolates people and delays team development.","Stages don't progress by themselves without support.","A one-off event doesn't build working relationships."],""],
['team',"Decision-making","The team is split 50/50 on two technically sound options and has debated for two meetings. As PM, what should you do?",["Agree a decision method, such as weighted criteria, and lead them to a decision","Pick one option yourself so the team can stop arguing, and explain your reasons afterwards","Keep the debate open until everyone agrees on the same option","Ask the sponsor to choose, since the team can't agree"],"Use a structured decision method (multicriteria analysis) to break the deadlock while keeping the decision in the team.",["Arbitrary. The team won't own the decision.","Endless consensus-seeking costs time.","Pushes a technical decision too high."],""],
['team',"Delegation","You are overloaded and need to delegate the vendor-coordination work. Who should get it?",["A capable team member who wants to grow, given clear expectations","Whoever has the least work on their plate at the moment, to keep the load balanced","The newest person, as a way to help them learn the project","Nobody; vendor coordination is too important to delegate"],"Delegate to someone capable and motivated, with clear outcomes and matching authority.",["Availability alone ignores capability.","Sets up an inexperienced person to fail.","Failing to delegate burns you out and slows the project."],""],
['team',"Motivation","A high-performing team member seems disengaged lately. What should you do?",["Have a one-on-one to learn what changed and what would help","Give them more work so they stay busy and engaged","Assume it's personal and leave it unless their work slips","Mention to their manager that they seem to be slipping"],"Understand individual motivation through direct conversation. The cause could be growth, recognition, or something personal.",["More work may deepen the disengagement.","Ignoring it risks losing them.","Escalates before understanding."],""],
['stake',"Communication plan","A key stakeholder says they're overwhelmed by detailed weekly reports and doesn't read them. What should you do?",["Ask what they need and tailor it, for example a one-page dashboard","Keep sending the full reports so there is a complete record","Stop sending reports to them, since they don't read them","Ask the sponsor to remind them to read the weekly reports"],"Communication is tailored to each stakeholder's needs. Update the communications management plan.",["Sending what isn't read doesn't count as communicating.","Cutting them off risks surprises.","Coercion doesn't fix a format mismatch."],""],
['team',"Emotional intelligence","Which is the core of emotional intelligence for a project leader?",["Recognizing and managing your own emotions and those of others","Hiding your emotions at all times to stay professional","Always putting the team's happiness and comfort ahead of the work that needs doing","Using emotional appeals to persuade stakeholders to agree"],"Emotional intelligence covers self-awareness, self-management, social awareness and relationship management.",["Suppression isn't management.","Happiness isn't the goal; effective relationships are.","That's manipulation, not EI."],""],
['cycle',"Retrospective","After a failed release, management wants the retrospective to find who was responsible. What should the scrum master do?",["Keep it blameless and on the process, then share the improvement actions","Run the retrospective as management asked, and record who was involved in the failure","Cancel the retrospective until the incident review is finished","Let management attend and lead the session this time"],"Retrospectives work when they are safe and blameless. Focus on the system and the process, then share the outcomes.",["Blame kills candour and learning.","Loses the learning when it's needed most.","Changes the dynamic and reduces honesty."],""],
['team',"Conflict management","A team member complains to you about a colleague's behaviour. What should you do first?",["Encourage them to talk to the colleague, and offer to facilitate if needed","Talk to the colleague yourself on their behalf","Escalate the complaint to HR straight away","Raise the behaviour with the whole team at the next meeting"],"PMI prefers that the people involved try first, with the PM available as facilitator.",["Becoming the go-between creates triangles.","Too formal for a first step, unless there's harassment.","Public airing embarrasses both people."],"Real world: if the complaint is about harassment, discrimination or safety, it's not 'go talk to them'. You act right away and follow policy. Read the question for those words."],
['team',"Coaching","A team member asks you how to handle a difficult stakeholder. What is the best response?",["Coach them with questions that help them work out an approach","Take over the stakeholder relationship until things settle down","Tell them stakeholders are the project manager's job, not theirs","Book them onto a stakeholder-management training course"],"Coaching builds capability. Guide them to their own solution.",["Removes their chance to grow.","Dismissive, and stakeholder work matters.","Delays help they need now."],""],
['team',"Agile software development","The team asks for a dedicated space with whiteboards to collaborate more effectively. What should you do?",["Support it and work to arrange the space","Decline; email and chat are enough for a co-located team","Tell them to book shared meeting rooms when they need to work together","Pass the request to facilities and let them prioritize it"],"Osmotic communication and information radiators help team performance. The servant leader secures that kind of support.",["Ignores a reasonable team need.","A workaround, not support.","Hands off instead of helping."],""],
['stake',"Stakeholder engagement","A community group is opposing a construction project near their homes. Which approach is best?",["Engage early and openly, listen, and look for ways to address concerns","Rely on the permits, since residents have no legal say in the project","Hold communication until construction starts, so plans are final","Let the public relations department handle residents on its own"],"External stakeholders can stop projects. Early, open engagement reduces resistance and finds workable fixes.",["Legal permission doesn't equal a social licence.","Late engagement increases opposition.","PR helps, but the PM owns stakeholder engagement."],"On nuclear and large infrastructure builds, the regulator also looks at how you engage communities and Indigenous rights holders. It isn't optional good practice; it's licence-critical."],
['team',"Psychological safety","A team member admits they made an error that cost two days. How should you respond?",["Thank them for raising it, fix it, and look at the process that allowed it","Note the error on their performance record so any pattern is tracked and visible later","Remind the whole team at standup to be more careful with their work","Move their tasks to someone more experienced until confidence returns"],"Rewarding transparency keeps problems surfacing early. Punishing it hides the next one.",["Punishing honesty means future errors stay hidden.","Vague. It doesn't address the cause.","A disproportionate response."],""],
['team',"Leadership","Which statement best describes the difference between leadership and management?",["Leadership guides and inspires people; management directs resources and processes","They are the same skill, described with different words","Management belongs to senior executives; leadership belongs to project managers","Leadership is mainly needed in agile projects; management in predictive ones"],"PMI frames leadership as influencing people toward a vision and management as running the system. PMs need both.",["They overlap but aren't identical.","Management happens at every level.","Every project needs leadership."],""],
['stake',"Stakeholder engagement","A stakeholder keeps asking team members directly for small changes. What should you do?",["Talk with the stakeholder about the change process and why it protects them","Tell the team to quietly do the small changes to keep the stakeholder happy","Report the stakeholder's behaviour to the sponsor and ask them to intervene","Stop the team from talking to any stakeholders without you present"],"Explain the process without damaging the relationship. Changes go through the agreed route (backlog or change control).",["Scope creep, and the work goes untracked.","An escalation the PM should first handle directly.","Cuts off useful collaboration."],""],
['team',"Organizational culture","You join a company where the culture tends to hide bad news from management. Your project is slipping. What should you do?",["Report the true status, with recovery options","Report green until you have a chance to recover the slip","Share the real status with the team only, for now","Wait for management to ask before raising it"],"PMI's code of conduct requires honesty. Bad news early, with options, is the professional standard.",["Watermelon reporting (green outside, red inside) violates honesty.","Stakeholders need the truth.","Passive. Proactive communication is expected."],"Real world: a PM can be right and still get punished for being first with bad news. The craft is giving it to your sponsor privately first, with options, so they aren't blindsided in the room."],
['team',"Conflict management","A conflict between two leads is escalating and a decision is needed in an hour for a safety-critical activity. Which technique is most appropriate?",["Force the decision, based on the safety requirements","Collaborate in a workshop until both leads reach full agreement","Smooth things over so work can carry on calmly","Withdraw until tempers settle, then revisit"],"Forcing has its place: emergencies, safety and urgent decisions. PMI accepts it when time is short and the stakes are high.",["No time for a workshop.","Smoothing doesn't produce a decision.","Withdrawing delays a safety-critical decision."],""],
['team',"Team","What best describes a high-performing team?",["Trust, open communication, shared goals and mutual accountability","Strong individuals working independently with little overlap","A team where conflict never comes up because everyone agrees","A project manager who makes every decision quickly and alone"],"High-performing teams have trust, productive conflict, commitment and accountability.",["Collaboration is a hallmark of high performance.","Healthy teams do have conflict, and they handle it well.","That's centralization, not performance."],""],
['team',"Pair programming","A complex module is late and has many defects. A senior developer suggests pairing with a junior. What should you do?",["Support pairing, since it improves quality and spreads knowledge","Reject it, because two people on one task halves productivity","Ask the junior to put in overtime on the module instead","Outsource the module to a specialist firm to reduce risk"],"Pairing improves quality and knowledge transfer. Fewer defects often makes up for the extra time spent.",["A myth. Defect reduction usually pays for pairing.","Overtime doesn't fix a skill gap.","Overreaction, and it adds handoffs."],""],
['stake',"Requirements elicitation","Users are not showing up to requirements workshops. What should you do?",["Understand why, then adjust: shorter sessions, their location, or sponsor backing","Proceed without their input and ask them to review the requirements document once it's written","Escalate to their managers so attendance becomes mandatory","Write the requirements yourself from earlier projects and circulate them"],"Find the root cause, then adapt the engagement approach to suit the stakeholders.",["Missing requirements cause rework later.","Forcing attendance gets bodies, not engagement.","Assumptions replace real needs."],""],
['team',"Feedback","A team member's work quality has improved a lot after coaching. What should you do?",["Give specific, timely positive feedback","Wait until the annual review","Say nothing in case it seems like favouritism","Increase their workload as a reward"],"Specific, timely feedback reinforces the behaviour.",["Too late to reinforce anything.","Recognition done right isn't favouritism.","More work isn't a reward."],""],
['team',"Diversity (business)","You are forming a team for a new product. What is a benefit of a diverse team?",["Broader perspectives that lead to better decisions","Fewer conflicts, since people respect differences","A faster forming stage, as roles are clearer","Less need for formal communication planning"],"Diversity brings different viewpoints. It can raise conflict, but it improves outcomes when managed well.",["Diverse teams can have more conflict, not less.","Forming may take longer.","Diversity usually needs more deliberate communication."],""],
['team',"Brainstorming","Your team needs creative solutions to a supply problem, but quieter members rarely contribute in brainstorms. Which technique helps most?",["Brainwriting or the nominal group technique","An open discussion led by the most senior staff","Asking the most confident members to go first","A quick show of hands with a majority vote"],"Silent idea generation, then sharing and ranking, gives everyone an equal voice.",["Senior-led sessions suppress quieter voices.","Makes the imbalance worse.","Voting comes after ideas are generated."],""],
['stake',"Expectation management","A sponsor expects the project to finish two months earlier than the approved schedule allows. What should you do?",["Meet the sponsor and present options with their trade-offs","Agree to the date and look for ways the team can make it work","Tell the team the new date and ask them to work faster","Hold to the approved schedule and decline the request"],"Manage expectations with data and options (fast-track, crash, cut scope), and let the sponsor make an informed trade-off.",["Overpromising destroys credibility.","Pressure without a plan leads to burnout and defects.","The misalignment remains."],""],
['team',"Conflict management","Two team members agree to split the difference on a design parameter, leaving both somewhat unhappy. This technique is:",["Compromise / reconcile","Collaborate / problem-solve","Smooth / accommodate","Force / direct"],"Compromise is lose-lose-ish: each side gives something up. It's useful for a temporary or partial solution.",["Collaboration finds a solution both fully support.","Smoothing emphasizes agreement and plays down differences.","Forcing imposes one side's view."],"Real world: compromise is often the right answer, not the second-best one. When the parameter has a tolerance band, splitting it is just good engineering."],
['team',"Team","A team member asks to work remotely two days a week. The work can be done remotely. What should you do?",["Agree how it will work with the team, within company policy","Refuse, to keep the team working together on site","Approve it quietly, without telling the rest of the team, to avoid others asking too","Pass the request to HR and let them decide"],"Within policy, flexibility supports engagement. Make the arrangement transparent so the team can coordinate.",["Rigid without a reason.","Secrecy damages trust and coordination.","A PM-level decision within policy."],""],
['team',"Servant leadership","Which behaviour best shows servant leadership?",["Removing obstacles and supporting team growth","Assigning detailed tasks to each team member every day","Reporting each member's performance to management","Making the key decisions so the team is protected"],"Servant leaders put the team's needs first: they remove impediments, coach and shield the team from distractions.",["Command-and-control, not servant leadership.","Necessary, but not servant leadership itself.","Takes away team empowerment."],""],
['stake',"Stakeholder management","A powerful stakeholder threatens to withdraw support unless an extra feature is added. What should you do first?",["Understand the need, then evaluate it through the change process","Add the feature, since losing this stakeholder's support is a bigger risk","Refuse the request because the feature is outside the approved scope","Escalate to the sponsor right away before the stakeholder does"],"Find the underlying need, then assess the impact properly. Neither giving in nor refusing outright is right.",["Uncontrolled scope change.","Dismisses a powerful stakeholder's legitimate concern.","Gather facts first."],""],
['team',"Team","Your team is moving into the performing stage. What is the appropriate leadership style?",["Delegating","Directing closely, to keep standards high","Coaching on the basics to reinforce good habits","Reintroducing the ground rules to keep order"],"Performing teams are mature. Delegate and support.",["Directing suits forming teams.","Over-supervising a mature team demotivates it.","Ground rules are already set."],""],
['team',"Conflict management","You hear that a key team member is planning to quit because of a conflict with a lead. What should you do?",["Meet them privately to understand the issue and work on a resolution","Tell the lead to change their attitude toward the team member","Start recruiting a replacement in case they do leave","Ignore it until they actually resign; it may only be a rumour"],"Address it early and directly with the affected person. Facts first.",["Acting on hearsay against the lead.","Gives up on retaining them.","Passive. You may lose a key person."],""],
['team',"Organizational culture","Your company is moving from predictive to agile delivery and the team is anxious. What should you do?",["Explain the why, train and coach, and start with a pilot","Mandate the change from next sprint so it happens quickly","Let each person decide whether to adopt the new approach","Keep running the predictive plan quietly alongside it"],"Change needs a reason, capability building and early wins. A pilot reduces risk.",["Mandates without support create resistance.","Inconsistent, and it fragments the team.","Defies the organizational direction."],""],
['team',"Team","A team member regularly helps others while their own tasks slip. What should you do?",["Recognize their help and work with them to balance their own commitments","Tell them to stop helping others until their own work is done, and check their tasks daily","Reassign their slipping tasks to other members of the team","Leave it alone, since the team as a whole benefits from the help"],"Value the behaviour, but help them balance it. Maybe the help itself needs to be planned into the work.",["Discourages collaboration.","Punishes a positive behaviour.","Their own commitments still matter."],""],
]);

D('R',[
['gauge',"Earned value management","Your project has EV = $400k, PV = $500k and AC = $450k. What is the status?",["Behind schedule and over budget","Ahead of schedule and under budget","Behind schedule and under budget","On schedule and over budget"],"SV = EV − PV = −$100k (behind). CV = EV − AC = −$50k (over budget). SPI = 0.8 and CPI ≈ 0.89, both below 1.",["Both indices are below 1.","CV is negative, so it's over budget.","SV is negative, so it's behind schedule."],"Real world: EV is only as good as the percent-complete behind it. 'Engineer's judgment' progress is easy to game. Rules of credit tied to installed quantities (AWP installation work packages) are much harder to fudge."],
['gauge',"Earned value management","BAC = $1,000,000 and CPI = 0.8. Assuming the current cost performance continues, what is the EAC?",["$1,250,000","$800,000","$1,200,000","$1,080,000"],"EAC = BAC / CPI = 1,000,000 / 0.8 = $1,250,000.",["That's BAC × CPI, the wrong direction.","A guess. It doesn't come from a formula.","Not a standard EAC result here."],"Real world: on megaprojects CPI rarely recovers on its own. Studies of large builds show cost performance tends to get worse after about 20% complete. BAC/CPI is often optimistic."],
['gauge',"Earned value management","EAC = $1.2M and AC to date = $700k. What is the ETC?",["$500k","$1.9M","$700k","$1.2M"],"ETC = EAC − AC = 1.2M − 0.7M = $500k.",["That's EAC + AC.","That's AC, not what's left.","That's EAC, the total."],""],
['gauge',"Earned value management","BAC = $200k, EV = $120k, AC = $150k. What TCPI is needed to finish within BAC?",["1.6","0.8","1.25","0.6"],"TCPI = (BAC − EV) / (BAC − AC) = 80k / 50k = 1.6. Very hard to achieve.",["That's CPI (EV/AC).","That's the inverse of CPI.","That's EV/BAC, percent complete."],""],
['network',"Critical path method","Activity A (3 days) leads to B (5 days) and C (2 days). Both lead to D (4 days). What is the project duration?",["12 days","14 days","9 days","10 days"],"The paths are A-B-D = 12 and A-C-D = 9. The longest path, the critical path, is 12 days.",["That sums every activity, which ignores the parallel paths.","That's the shorter path.","Not a path total."],""],
['network',"Float (project management)","An activity has ES = 5, LS = 9 and duration 3. What is its total float?",["4 days","3 days","0 days","9 days"],"Total float = LS − ES = 9 − 5 = 4 days.",["That's the duration, not the float.","It would be zero only if it were on the critical path.","That's LS itself."],""],
['network',"Program evaluation and review technique","Optimistic = 4 days, most likely = 7, pessimistic = 16. What is the PERT (beta) estimate?",["8 days","9 days","7 days","10 days"],"(O + 4M + P) / 6 = (4 + 28 + 16) / 6 = 48 / 6 = 8 days.",["That's the triangular average: (4 + 7 + 16) / 3.","That's just the most likely value.","Arithmetic error."],""],
['network',"Program evaluation and review technique","Using O = 4 and P = 16, what is the PERT standard deviation?",["2 days","12 days","4 days","3 days"],"σ = (P − O) / 6 = 12 / 6 = 2 days.",["That's the range, not divided by 6.","That's the variance.","Wrong divisor."],""],
['gantt',"Fast tracking","The project is behind schedule. The sponsor wants to recover time without adding cost. Which technique fits best?",["Fast tracking","Crashing","Resource levelling","Adding contingency"],"Fast tracking overlaps activities in parallel. It adds risk and rework potential but usually no direct cost.",["Crashing adds resources, which adds cost.","Levelling usually extends the schedule.","Contingency is a reserve, not a recovery technique."],"Real world: fast tracking is never free. Starting construction before design is frozen is the classic way megaprojects buy rework. It's 'no cost' only on the exam."],
['gantt',"Crashing (project management)","To crash the schedule, you should first add resources to which activities?",["Critical path activities with the lowest cost per day saved","The activities with the most float, since they can absorb change","The longest activities, wherever they sit in the network","Non-critical activities first, to free resources for the critical ones"],"Crashing targets critical activities, cheapest first, for the time saved. Watch for new critical paths appearing.",["Activities with float don't shorten the project.","Long but non-critical activities don't help.","Doesn't affect the end date."],""],
['gantt',"Resource leveling","After resource levelling, what is the most likely effect on the schedule?",["The project end date may be extended","The critical path will always shorten","Float will increase on all activities","Costs will always go down"],"Levelling adjusts start dates to fit resource constraints, which often extends the schedule and can change the critical path.",["Levelling usually lengthens, not shortens.","Float is often used up.","Not necessarily. It's about resources, not cost."],""],
['wbs',"Work breakdown structure","What is the lowest level of the WBS called?",["Work package","Activity","Control account","Deliverable"],"The work package is the lowest WBS level. It's where cost and duration can be reliably estimated and managed.",["Activities come from decomposing work packages, in the schedule.","Control accounts sit above work packages.","Deliverables can be at many levels."],"In AWP terms, the PMI work package is roughly the CWP, and the IWP sits below it for the crew. Different vocabulary, same idea of decomposing until it's controllable."],
['wbs',"Work breakdown structure","What is the 100% rule in a WBS?",["The WBS includes all of the project work and only that work","Every work package must be 100% complete before the next starts","All resources must be 100% allocated","The budget must be 100% approved before the WBS is built"],"The 100% rule: the WBS captures all deliverables and work, including project management, and nothing outside scope.",["That's sequencing, not the WBS.","Resource allocation is unrelated.","Approval timing is unrelated."],""],
['scope',"Scope creep","A developer adds an extra feature they think the customer will love, without telling anyone. This is:",["Gold plating","Good customer service that builds goodwill","Scope creep driven by the customer's wishes","Progressive elaboration of the requirements"],"Gold plating means adding unrequested features. It adds risk, cost and possible defects without authorization.",["Unapproved additions aren't service; they're uncontrolled scope.","Scope creep comes from requests, not the team adding things.","Progressive elaboration refines planned details."],"Real world: small goodwill extras happen all the time and keep relationships warm. The exam view is strict because unrequested features carry warranty, testing and safety liability, which really matters in nuclear."],
['change',"Change control","A stakeholder asks for a scope change in a predictive project. What should you do first?",["Evaluate its impact on scope, schedule, cost, quality and risk","Implement it straight away if the stakeholder is senior enough","Reject it, because the baseline is frozen after approval","Send it straight to the change control board for a decision"],"PMI's order: evaluate the impact, look at options, then submit to the CCB for a decision, then update plans and communicate.",["Seniority doesn't bypass change control.","Baselines can change through the process.","The CCB needs the impact analysis first."],"Real world: most organizations delegate change authority by threshold. A PM can approve small changes inside contingency without a CCB meeting. The exam assumes everything goes to the board."],
['change',"Change control","The CCB approves a change. What should you do next?",["Update the baseline and plans, then tell stakeholders","Start the approved work with the team immediately, before the window closes","Close the change request in the change log","Ask the sponsor to sign off on the change again"],"Approved changes update the baselines and documents, get communicated, and then get implemented.",["Plans must reflect the change first.","Only after it's implemented and verified.","The CCB decision is the authorization."],""],
['doc',"Project charter","What is the main purpose of the project charter?",["To authorize the project and give the PM authority","To define the detailed scope and the work breakdown","To set out how and when stakeholders get information","To list the main project risks and their owners"],"The charter authorizes the project and the PM, and records the high-level objectives, constraints and sponsor.",["Detailed scope is in the scope statement and WBS.","That's in the communications management plan.","Risks are in the risk register; the charter has only high-level risks."],""],
['risk',"Risk management","What should you do first when a new risk is identified?",["Record it in the risk register and analyze it","Put a response in place immediately, before it grows","Escalate it to the sponsor so they are aware","Add contingency to the budget to cover it"],"Log it, analyze probability and impact, then plan a response. Escalate only if it's outside your authority or project.",["Responses come after analysis.","Escalate only if it's beyond the project.","Reserves are sized from analysis."],"Real world: if the 'risk' is a crane with a cracked boom, you stop the lift first and log it later. Exams love the register; job sites love fingers on the stop button."],
['risk',"Risk management","A risk has occurred. What should you do first?",["Implement the planned risk response","Update the risk register with what happened","Inform the sponsor and key stakeholders","Perform a root cause analysis of the event"],"When an identified risk happens, run the response you already planned (the contingency plan). Then update records and communicate.",["Updating records comes after acting.","Communicate as you act, but act first.","Analysis comes later."],""],
['risk',"Risk management","An unidentified risk occurs and has an impact. What is the correct response?",["Apply a workaround","Implement the contingency plan","Use the contingency reserve","Transfer the risk"],"Unplanned issues get workarounds. Contingency plans exist only for identified risks.",["There is no plan for an unidentified risk.","Contingency reserve is for known-unknowns; management reserve covers unknown-unknowns.","Too late to transfer. It has already happened."],""],
['money',"Contingency (budget)","Which reserve covers unknown-unknowns and is usually controlled by management?",["Management reserve","Contingency reserve","Cost baseline","Buffer float"],"Management reserve is outside the cost baseline and covers unforeseen work within scope. Using it requires management approval.",["Contingency covers identified risks (known-unknowns).","The baseline includes contingency but not management reserve.","Not a standard reserve term."],""],
['risk',"Risk management","Buying insurance for equipment damage is an example of which risk response?",["Transfer","Mitigate","Avoid","Accept"],"Transfer shifts the impact and ownership to a third party, such as an insurer or contractor.",["Mitigating reduces probability or impact, for example through training.","Avoiding removes the threat, for example by changing the plan.","Accepting means taking no action except perhaps a reserve."],""],
['risk',"Risk management","A risk could bring your project an early bonus. You assign your best team to make sure it happens. This response is:",["Exploit","Enhance","Share","Accept"],"Exploit makes sure an opportunity happens: it raises the probability to 100%.",["Enhance raises the probability or impact, but doesn't guarantee it.","Share partners with a third party.","Accept takes no action."],""],
['risk',"Monte Carlo method","Which technique uses many simulations to produce a probability distribution of project completion dates?",["Monte Carlo simulation","Sensitivity analysis","Expected monetary value","Decision tree"],"Monte Carlo runs thousands of iterations with random durations to show the probability of finishing by each date.",["Sensitivity analysis (tornado) ranks which risks matter most.","EMV calculates a single expected value.","Decision trees evaluate choices."],"Real world: a schedule risk analysis is only as good as the correlations and risk drivers you put into it. Uncorrelated activity ranges produce dangerously narrow P80s."],
['risk',"Expected value","A risk has a 30% probability and a $50,000 impact. An opportunity has a 20% probability and a $20,000 benefit. What is the net EMV?",["−$11,000","−$15,000","+$4,000","−$19,000"],"EMV = (0.3 × −50k) + (0.2 × +20k) = −15k + 4k = −$11,000.",["That ignores the opportunity.","That's only the opportunity.","A sign error on the opportunity."],""],
['quality',"Control chart","On a control chart, seven consecutive points fall on one side of the mean but within the control limits. What does this indicate?",["The process may be out of control and should be investigated","The process is in control, since all points sit within the limits","The specification limits have been exceeded and work must stop","It is normal random variation and can safely be ignored"],"The rule of seven signals a non-random pattern even inside the limits. Investigate for an assignable cause.",["Within-limits doesn't mean in control when a pattern exists.","Spec limits are the customer's; control limits are the process's.","Seven in a row is unlikely to be random."],""],
['quality',"Pareto principle","Which tool helps prioritize the defect causes that produce most of the problems?",["Pareto chart","Scatter diagram","Control chart","Flowchart"],"The Pareto chart ranks causes by frequency, so you can focus on the vital few (80/20).",["Scatter diagrams show correlation.","Control charts show stability over time.","Flowcharts map a process."],""],
['quality',"Ishikawa diagram","The team wants to find possible root causes of weld rework. Which tool is best?",["Cause-and-effect (Ishikawa) diagram","Histogram of defects by welder","Control chart of weld test results","Checksheet of rework by location"],"Fishbone diagrams organize possible causes into categories (methods, materials, people, machines and so on).",["Histograms show distributions.","Control charts monitor stability.","Checksheets collect data."],""],
['quality',"Cost of quality","Which is a cost of conformance?",["Training and inspection","Rework of defective welds","Warranty claims from the owner","Scrap and wasted material"],"Conformance costs (prevention and appraisal) are spent to avoid failures: training, testing, inspection.",["Rework is an internal failure cost.","Warranty is an external failure cost.","Scrap is an internal failure cost."],""],
['quality',"Quality assurance","What is the main difference between quality assurance and quality control?",["QA looks at the process; QC inspects the product","QA is done by the customer; QC is done by the project team","They are two names for the same set of activities","QC happens before the work starts; QA happens after it ends"],"QA (manage quality) audits and improves processes. QC (control quality) inspects deliverables for correctness.",["Both are done internally.","They have distinct purposes.","Reversed. QA runs throughout."],""],
['scope',"Validate scope","What is the output of the validate scope process?",["Accepted deliverables","Verified deliverables","Change requests only","Lessons learned register"],"Validate scope means the customer formally accepts deliverables that QC has already verified.",["Verified deliverables come from control quality.","Change requests may result, but acceptance is the main output.","Not the primary output."],""],
['kanban',"Kanban (development)","On a Kanban board, the 'testing' column always has many items waiting. What should the team do?",["Lower the WIP limit and swarm to clear the bottleneck","Add more columns to the board to show where work waits","Start more development work so nobody sits idle","Leave it; overall throughput is still acceptable"],"WIP limits expose bottlenecks. The team stops starting and starts finishing.",["More columns hide the problem.","Makes the queue worse.","Queues increase lead time."],""],
['chart',"Burndown chart","The sprint burndown line is flat for the first three days. What does this most likely indicate?",["Work isn't being finished, or the board isn't updated","The team is ahead of schedule and saving effort for later","The sprint is going to plan, with a steady pace","Scope was removed from the sprint by the product owner"],"A flat burndown means no remaining work is being burned. Check for blockers or update habits.",["Ahead would show a steep drop.","A flat line isn't ideal progress.","Removing scope would drop the line."],""],
['cycle',"Velocity (software development)","Team velocity over the last three sprints was 30, 34 and 32. The backlog has 160 points left. Roughly how many sprints remain?",["5","4","6","3"],"Average velocity ≈ 32. 160 / 32 = 5 sprints.",["160 / 40, which uses the wrong velocity.","Too pessimistic for this data.","Far too optimistic."],""],
['cycle',"Velocity (software development)","Management wants to compare velocity across three teams to rank them. What should you advise?",["Velocity is team-specific and shouldn't be compared","Rank the teams by velocity to reward the most productive","Standardize story points across teams first, then rank them","Use velocity in performance reviews to motivate the teams"],"Story points are relative to each team. Comparing velocities is meaningless and invites point inflation.",["Misuses the metric.","It still invites gaming.","Creates perverse incentives."],""],
['doc',"User story","Which is the best-written user story?",["As a site supervisor, I want tomorrow's work packages so I can plan crews","The system shall display all work packages in a list","Build a work package screen for supervisors by Friday","Add a database table for work packages and their status"],"The 'As a … I want … so that …' format captures the user, the need and the value.",["A requirement statement, not a story.","A task with a deadline.","A technical task with no user value stated."],""],
