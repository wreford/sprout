// one-page primers: [what it matches, title, gist, key points, on the exam, traps, picture]
const LEARN=[
[/agile manifesto|agile software|agile/i,"The Agile Manifesto","Written in 2001 by seventeen software developers at Snowbird, Utah. It's four value statements and twelve principles about building things in short, working steps with the customer close by.",["Four values, each preferring the left over the right without throwing the right away: people and how they work together over processes and tools; working product over exhaustive documentation; collaborating with the customer over negotiating contracts; responding to change over following a fixed plan.","The principles stress early and continuous delivery, welcoming changing requirements, delivering every few weeks, business and builders working together daily, motivated people with support and trust, face-to-face talk, working product as the measure of progress, a sustainable pace, technical excellence, simplicity (maximizing the work not done), self-organizing teams, and regular reflection to improve.","It's a mindset, not a method: Scrum, Kanban and XP are ways of putting it into practice."],"Exam questions reward servant leadership, team empowerment, customer collaboration and adapting to change. When an answer imposes a plan, controls the team or protects documentation for its own sake, it's usually wrong.","'Over' doesn't mean 'instead of': plans, documents and contracts still matter. Agile isn't 'no planning'; it's planning often, in smaller pieces.",""],
[/earned value|\bCPI\b|\bSPI\b|\bEAC\b|\bTCPI\b|estimate at completion/i,"Earned value management","Earned value tells you, in money, how much work you've actually done compared with what you planned and what you've spent, so you can see trouble early and forecast the finish.",["PV (planned value): the budgeted cost of the work scheduled to date. EV (earned value): the budgeted cost of the work actually done. AC (actual cost): what that work really cost.","Variances: CV = EV − AC (negative is over budget); SV = EV − PV (negative is behind).","Indices: CPI = EV ÷ AC and SPI = EV ÷ PV; under 1 is bad, over 1 is good.","Forecasts: EAC = BAC ÷ CPI if the trend continues; EAC = AC + (BAC − EV) if the rest goes to plan. ETC = EAC − AC. VAC = BAC − EAC.","TCPI = (BAC − EV) ÷ (BAC − AC): the efficiency you need from now on to finish on budget."],"Expect calculations and interpretation: 'CPI is 0.8: what does it mean and what do you do?' Read which formula the question's assumptions point to.","SPI drifts back to 1 at the end of any project, even a late one, because all the planned work is eventually earned. Don't read percent complete or money spent as progress on their own.","ev"],
[/critical path|float|forward pass|backward pass/i,"The critical path method","The critical path is the longest chain of dependent work through the schedule. It sets the earliest finish: delay anything on it and the project is late.",["Forward pass: early start and early finish for each activity, from the start. Backward pass: late finish and late start, back from the end.","Total float = LS − ES (or LF − EF): how long an activity can slip without moving the finish. Critical activities have zero float (or the least).","Free float: how long it can slip without delaying the next activity.","Compressing: crashing adds resources to critical work (costs money); fast-tracking overlaps work (adds rework risk). Only critical-path work shortens the project.","Near-critical paths matter: shorten the critical path and another one may take over."],"Questions ask for float, the critical path, or which activity to crash first: pick the critical one with the lowest cost per day saved.","Negative float means a deadline can't be met as planned. Shortening non-critical work never brings the finish date in.","cpm"],
[/risk|\bEMV\b|expected monetary|residual|secondary risk|trigger/i,"Risk management","A risk is an uncertain event that would affect the project if it happened: threats hurt it, opportunities help. You plan for them before they happen.",["Identify, then analyze: qualitative (probability and impact, a heat map) then quantitative (EMV, Monte Carlo, sensitivity).","EMV = probability × impact, summed: threats negative, opportunities positive.","Threat responses: avoid, transfer (insurance, bonds, contracts), mitigate, accept (actively with contingency, or passively). Opportunities: exploit, share, enhance, accept. Either: escalate when it's beyond the project.","Each risk gets an owner, the person best placed to watch and act, and triggers that warn it's coming.","Residual risk is what's left after a response; secondary risk is a new risk the response creates."],"When a risk happens, implement the planned response first. When a new risk appears, record and analyze it. 'Escalate' fits only when it's outside the project's authority.","An issue is a risk that has happened. Contingency reserve covers known risks; management reserve covers unknown ones and needs approval to use.","emv"],
[/change control|change request|\bCCB\b|scope creep|gold plating|change order/i,"Integrated change control","Every change to scope, schedule, cost or the baselines goes through one process: request, analyze impact, decide, then update the plans and tell people.",["Steps: log the change request; assess impact on scope, schedule, cost, quality, risk and resources; take it to the decision-maker (often a change control board); if approved, update baselines and plans and communicate.","Scope creep: changes that slip in without control. Gold plating: the team adding extras nobody asked for. Both are wrong even if the customer would like them.","In agile, change is welcome but goes through the product owner and the backlog, not into the middle of a sprint."],"The first step is almost always to evaluate the impact, not to implement, refuse or escalate. After approval: update the baseline, then communicate.","Senior stakeholders don't get to skip the process. A 'small' change is still a change.",""],
[/stakeholder|power.interest|salience/i,"Stakeholder engagement","Stakeholders are anyone who affects or is affected by the project. The job is to find them early, understand them and engage each the right way.",["Identify them early and keep a stakeholder register: interests, influence, expectations, current and desired engagement.","Power-interest grid: manage closely (high power, high interest), keep satisfied (high power, low), keep informed (low power, high), monitor (low, low).","Engagement levels run from unaware and resistant through neutral to supportive and leading.","Communicate in the way each needs: a one-page dashboard for an executive, a toolbox talk for a crew."],"Answers that listen, meet in person and involve people beat those that ignore, avoid, or go over someone's head. A new stakeholder: update the register and meet them.","Don't wait until resistance appears, and don't send everyone everything.",""],
[/conflict/i,"Conflict management","Conflict on projects is normal. Most of it comes from schedules, priorities and resources, not personalities. How you handle it decides whether it helps or hurts.",["Five approaches: collaborate (problem-solve for a solution both support), compromise (each gives something), smooth (play up agreement), force (decide using authority), withdraw (step back).","Collaboration is usually best when there's time and both sides matter. Forcing fits emergencies and safety. Compromise fits when a tolerance band allows splitting it.","Address it early and privately where possible; let the people involved try first, and facilitate if they can't."],"PMI favours collaboration and direct, private conversation. Safety and urgent decisions are the classic exception, where forcing is right.","Smoothing and withdrawing buy calm but solve nothing. Escalating straight to HR or managers skips the step where you try.",""],
[/tuckman|team development|storming|norming|team.building/i,"Team development (Tuckman)","Teams go through stages: forming, storming, norming, performing and, at the end, adjourning. Leaders change their style as the team moves through them.",["Forming: polite, uncertain; give direction. Storming: conflict over how to work; facilitate and set ground rules. Norming: agreement on how they work; support. Performing: self-managing; delegate. Adjourning: wrap up and recognize.","Teams can slip back a stage when people join or leave.","A team charter, written by the team, sets values, ground rules and how decisions get made."],"Match the stage to the behaviour in the question, then pick the matching leadership move.","Don't impose rules the team should write, and don't treat storming as failure.",""],
[/servant|leader|emotional intelligence|motivat|power/i,"Leadership and servant leadership","Modern project leadership is mostly about enabling people: removing obstacles, growing them, and earning influence rather than relying on authority.",["Servant leadership: put the team's needs first, clear impediments, protect them from distraction, help them grow.","Situational leadership: directing, coaching, supporting, delegating, depending on the person's skill and commitment.","Emotional intelligence: knowing and managing your own emotions and reading others'.","Power: expert and referent power (respect) work best; legitimate, reward and coercive power have limits.","Motivation: achievement, recognition, growth and the work itself motivate; pay and conditions mostly prevent dissatisfaction."],"In weak-matrix or agile settings, influence and negotiation beat authority. Private coaching beats public correction.","Making all the decisions to 'protect' the team isn't servant leadership.",""],
[/contract|fixed price|cost plus|time and materials|procure|claim|make-or-buy/i,"Contracts and procurement","The contract type decides who carries cost risk. Procurement is choosing sellers fairly and managing them to the contract.",["Fixed price (firm fixed, incentive fee, economic price adjustment): the seller carries most cost risk; it needs clear scope.","Cost-reimbursable (cost plus fixed fee, incentive fee, award fee, percentage of cost): the buyer carries most risk; it suits uncertain scope. Cost plus percentage of cost is the worst for the buyer.","Time and materials: rates for labour and materials; for small or unclear work, ideally with a not-to-exceed limit.","Point of total assumption (fixed price incentive): above it, the seller bears every extra dollar.","Make-or-buy, then RFI (information), RFQ (price) or RFP (solution and approach); select on weighted criteria, not price alone."],"Claims are best settled by negotiation under the contract's change and dispute clauses. Only the procurement lead talks to bidders during a tender.","A verbal go-ahead isn't a change order. Closing a project includes closing its contracts.",""],
[/quality|control chart|ishikawa|conformance|inspection|hold point/i,"Quality management","Quality is meeting requirements and fitness for use. Prevention costs less than finding and fixing defects.",["Quality assurance looks at the process; quality control inspects the product.","Cost of conformance (training, prevention, inspection) versus cost of non-conformance (rework, scrap, warranty).","Tools: cause-and-effect (Ishikawa) diagrams for root causes; control charts for process stability (seven points on one side of the mean is a signal, even inside the limits); Pareto charts for the vital few; histograms and check sheets.","Hold points stop work until inspected; witness points let work go on if the inspector doesn't attend."],"Validate scope is the customer formally accepting deliverables that QC has already checked. Continuous improvement (plan, do, check, act) runs throughout.","Inspecting quality in at the end is the expensive way. Specification limits are the customer's; control limits are the process's.",""],
[/\bWBS\b|work breakdown|work package/i,"The work breakdown structure","The WBS breaks the project's deliverables into smaller pieces until each can be estimated, scheduled and owned.",["It's organized around deliverables, not departments or phases of activity.","The lowest level is the work package; activities come later, when you schedule.","The 100% rule: the WBS covers all the scope, and nothing outside it.","The WBS dictionary describes each element; together with the scope statement it forms the scope baseline."],"'What's the lowest level of the WBS?' Work package. 'Where's the scope baseline?' Scope statement, WBS and WBS dictionary.","Don't organize it by who does the work: that's the organizational breakdown structure (OBS).",""],
[/scrum|sprint|velocity|backlog|product owner|definition of done|standup|retrospective/i,"Scrum in one page","Scrum runs the work in fixed sprints of up to a month, with three roles, a handful of events and a few artefacts, to deliver a usable increment every sprint.",["Roles: the product owner orders the backlog and owns value; developers build; the scrum master coaches and removes impediments.","Events: sprint planning, the daily scrum (fifteen minutes, for the team), the sprint review (inspect the increment with stakeholders), and the retrospective (improve how the team works).","Artefacts: product backlog, sprint backlog, increment. The definition of done applies to every item.","Velocity is a team's own planning tool, not a performance score; never compare teams by it."],"New requests go to the product owner, not into the current sprint. The scrum master serves; they don't assign work.","A story that passes its acceptance criteria but not the definition of done isn't done.",""],
[/kanban|\bWIP\b|cumulative flow|lean|waste|last planner/i,"Kanban and lean flow","Kanban makes work visible, limits work in progress and improves flow. Lean removes waste: anything that doesn't add value for the customer.",["Visualize the workflow on a board, limit WIP per column, manage flow, make policies explicit, and improve together.","Little's law: lead time = work in progress ÷ throughput, so less WIP means faster delivery.","A cumulative flow diagram shows a bottleneck as a band that widens.","Lean's wastes include waiting, rework, overproduction, excess inventory, extra processing, motion and transport. On site, waiting for materials, drawings and permits is the big one.","The Last Planner System has the people doing the work commit to what can really be done next week."],"When a column overflows, lower the WIP limit and swarm the bottleneck. Starting more work makes it worse.","Busy isn't the same as productive.",""],
[/advanced work pack|workface|\bAWP\b|\bIWP\b|\bCWP\b/i,"Advanced work packaging","AWP plans the job backwards from the crews: engineering and procurement deliver in the order construction will build, and a crew only gets work with every constraint cleared.",["Construction work areas, then construction work packages (CWPs), then engineering (EWPs) and procurement packages to feed them.","Workface planners turn CWPs into installation work packages (IWPs): a week or two of work for one crew, with drawings, materials, scaffold, tools and permits all in hand.","Only constraint-free IWPs are released. Productivity rises mainly because crews stop waiting.","It comes from the Construction Industry Institute (CII), not PMI."],"If an IWP has an open constraint, hold it and release a ready one instead.","Starting a package that isn't ready is the waste AWP exists to stop.",""],
[/\bBIM\b|building information|clash|\bIFC\b|ISO 19650|\bLOD\b|4D|5D/i,"BIM in one page","Building information modelling is a shared, data-rich model of the asset used through design, construction and operation.",["Each discipline keeps its own model; they're combined (federated) for coordination and clash detection.","Dimensions: 3D geometry, 4D adds time (the schedule), 5D adds cost. Later 'D's (energy, operations) vary by who you ask.","LOD (Level of Development) runs 100 (concept) to 500 (as-built); 400 is fabrication-ready.","IFC is the open, vendor-neutral exchange format (ISO 16739); ISO 19650 sets information management and the common data environment.","A digital twin links the model to live operating data."],"Clash detection pays off before construction; a common data environment gives one controlled source of truth.","The model doesn't replace issued drawings or the people who coordinate it.",""],
[/\bGIS\b|geographic|datum|buffer|elevation model|raster|vector|GPS/i,"GIS in one page","A geographic information system stores data with a location, so you can map it, measure it and ask spatial questions.",["Vector data: points, lines and polygons (wells, pipelines, parcels). Raster data: a grid of cells (elevation, imagery).","Coordinate systems and datums matter: NAD27 against NAD83 can shift data by tens of metres. Reproject everything to one system.","Common operations: buffer (everything within a distance), overlay (where layers intersect), spatial select.","RTK GPS gets centimetre accuracy with a base station; a phone gets metres."],"When two surveys don't line up by tens of metres, suspect the datum first.","Units scale data; datums shift it.",""],
[/CSA N286|NQA|Appendix B|nuclear qa|commercial grade|counterfeit|nonconform|calibration/i,"Nuclear quality assurance","Nuclear QA programmes make sure everything important to safety is designed, bought, built and checked under strict control, with records to prove it.",["Canada: CSA N286 sets management system requirements. US: 10 CFR 50 Appendix B (18 criteria), usually met through ASME NQA-1.","A graded approach: the more safety-significant the item, the more rigorous the controls.","Commercial grade dedication qualifies an off-the-shelf item for safety-related use by verifying its critical characteristics.","Suspect, counterfeit or fraudulent items are quarantined and reported, never used on a guess.","Nonconformances are dispositioned as use-as-is, repair, rework or reject, with corrective action aimed at the root cause."],"Anything measured with an out-of-calibration tool since its last good check is suspect and must be evaluated.","Retesting until something passes isn't verification.",""],
[/Occupational Health|Ontario|O\. Reg|fall protection|trench|Notice of Project|joint health|working at heights|competent/i,"Ontario's Green Book (OHSA and O. Reg. 213/91)","Ontario's Occupational Health and Safety Act and its Construction Projects regulation set out who is responsible for what on a site, and the minimum rules for the work.",["Workers' three rights: to know about hazards, to participate in health and safety, and to refuse unsafe work.","The constructor has the overall duty to make sure the Act and regulations are followed on the project. Supervisors must be competent: qualified, trained, experienced and aware of the Act and the hazards.","Fall protection generally above 3 m (and in set cases lower). Working at heights training is required before using fall protection on construction projects.","Trenches more than 1.2 m deep generally need support, sloping or a trench box.","A notice of project is required when the project's total cost exceeds $50,000, among other triggers. A joint health and safety committee is needed where 20 or more workers are regularly employed; 6 or more need a health and safety representative."],"When in doubt, the safe and compliant answer wins over the schedule, every time.","These are summaries: the regulation has exceptions and changes. Check the current text on ontario.ca before relying on a number.",""],
[/V-model|systems engineering|verification and validation|traceab|interface control|requirement|single point|trade study/i,"Systems engineering in one page","Systems engineering looks at the whole: what's needed, how the parts fit, and proof that the finished system does the job.",["The V-model: down the left side, needs become requirements, then design; up the right, parts are integrated and tested against each level.","Verification: did we build it right (against the spec)? Validation: did we build the right thing (against the need)?","Good requirements are clear, testable, needed and traceable; a traceability matrix links each to design and test.","Interface control documents define where systems meet, so both sides build to the same boundary.","Trade studies compare options against weighted criteria; single points of failure get redundancy where the stakes demand it."],"Untraceable requirements and undefined interfaces are where integration problems come from.","Two scopes can each assume the other handles the interface.",""],
[/Flyvbjerg|megaproject|giga|iron law|reference class|optimism|modular/i,"Why giga projects fail (and some don't)","Bent Flyvbjerg's research on thousands of big projects found they mostly come in over budget, late and under benefits, over and over: his 'iron law'.",["About 8.5% of projects hit both budget and schedule; about 0.5% hit budget, schedule and the promised benefits.","Causes: optimism bias and, sometimes, strategic misrepresentation to win approval.","Reference class forecasting fixes estimates by looking at how similar past projects actually turned out.","'Think slow, act fast': plan thoroughly while change is cheap, then deliver quickly, since delivery is when things go wrong.","Modular, repeatable designs (solar and wind farms) do best; bespoke one-offs carry the most risk."],"Use the outside view (similar past projects), not just the team's own estimate.","A big budget and a long plan don't make a project safe; untested, unique designs make it fragile.",""],
[/ethic|bribery|conflict of interest|gift/i,"The PMI Code of Ethics","PMI's code rests on four values: responsibility, respect, fairness and honesty, with standards members aspire to and standards they must meet.",["Responsibility: own your decisions, keep commitments, report unethical conduct.","Respect: listen, deal with conflict directly, don't abuse power.","Fairness: be impartial, disclose conflicts of interest, don't favour friends.","Honesty: tell the truth about status and qualifications, never mislead."],"Disclose conflicts of interest and step out of the decision. Decline gifts or follow the gift policy. Report real status even under pressure. Report code violations to PMI.","Staying quiet to keep the peace is usually the wrong answer.",""],
[/program|portfolio|benefit|PgMP|PfMP/i,"Programs and portfolios","A program is a group of related projects managed together for benefits they couldn't deliver apart. A portfolio is the set of work an organization chooses, balanced against its strategy.",["Program managers manage interdependencies, shared resources and benefits across projects.","Benefits are realized after delivery, usually by benefits owners in the business, as set out in a benefits management plan.","Portfolio managers select, rank and balance work by strategic fit, value, risk and capacity, and stop work that no longer fits.","Governance bodies steer direction and decide major changes; they don't approve every task."],"Program questions reward the whole-program view over any one project. Portfolio questions reward ranking, capacity and strategy over enthusiasm or seniority.","Delivering outputs isn't realizing benefits. If everything is 'priority one', nothing is.",""],
[/three.point|\bPERT\b|estimat|analogous|parametric/i,"Estimating","Estimates are forecasts with uncertainty, so say how sure you are.",["Analogous: from a similar past project (quick, rough). Parametric: a rate times a quantity (for example dollars per cubic metre). Bottom-up: summing the detail (slow, accurate).","Three-point: PERT (beta) = (O + 4M + P) ÷ 6, with σ ≈ (P − O) ÷ 6. Triangular = (O + M + P) ÷ 3.","Rolling wave: detail the near term and keep later work at a higher level until it's clearer.","Ranges and confidence (P50, P80) beat single numbers for anything uncertain."],"Pick the technique the question's information supports: a past project means analogous; a unit rate means parametric.","Padding every estimate hides risk instead of managing it.","pert"]];
const learnFor=q=>{const i=LEARN.findIndex(p=>p[0].test(q.w));return i>=0?i:LEARN.findIndex(p=>p[0].test(q.q))};
const LEARN_AID={ev:()=>evAid(),cpm:()=>cpmAid(),emv:()=>emvAid(),pert:()=>pertAid()};
function learnPage(i){const [,title,gist,points,exam,traps,aid]=LEARN[i];
  const r=document.createElement('div');r.className='report';r.innerHTML='<div class="rc lp" role="dialog" aria-label="'+esc(title)+'"><small>Learn more · one page</small><h2>'+esc(title)+'</h2><p class="lg">'+rich(gist)+'</p>'+
  '<h3>Key points</h3><ul>'+points.map(t=>'<li>'+rich(t)+'</li>').join('')+'</ul>'+(aid?LEARN_AID[aid]():'')+

  '<p class="disc">A short summary in plain words. Follow the Wikipedia link for the full story.</p><div class="rb"><button class="btn alt" id="lclose">Got it</button></div></div>';

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-learn]');if(!b)return;e.preventDefault();learnPage(+b.dataset.learn)});
const learnIndex=()=>'<h2 class="sec">One-page primers</h2><div class="lix">'+LEARN.map((p,i)=>'<button class="chip lb" data-learn="'+i+'">'+esc(p[1])+'</button>').join('')+'</div>';

/* ---------- keeping progress: every store the browser offers ---------- */
// localStorage is the main copy (above). These mirror it, so clearing one store doesn't lose a month of study:
// IndexedDB, the origin private file system, the Cache API, a cookie with the headline numbers, a backup file,
// and a restore link. On start-up the newest copy wins.
const STORE_KEY='pmpdrill1';
const stores={local:false,idb:false,file:false,cache:false,cookie:false,kept:false};
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('twbootcamp',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function idbPut(text){const db=await idb();await new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(text,STORE_KEY);t.oncomplete=ok;t.onerror=()=>no(t.error)});db.close()}
async function idbGet(){const db=await idb();const v=await new Promise((ok,no)=>{const r=db.transaction('kv').objectStore('kv').get(STORE_KEY);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});db.close();return v}
async function fileDir(){return navigator.storage.getDirectory()}
async function filePut(text){const h=await (await fileDir()).getFileHandle('progress.json',{create:true}),w=await h.createWritable();await w.write(text);await w.close()}
async function fileGet(){const h=await (await fileDir()).getFileHandle('progress.json');return (await h.getFile()).text()}
const CACHE_URL='./__progress.json';
async function cachePut(text){const c=await caches.open('twbootcamp-progress');await c.put(CACHE_URL,new Response(text,{headers:{'content-type':'application/json'}}))}
async function cacheGet(){const c=await caches.open('twbootcamp-progress'),r=await c.match(CACHE_URL);return r?r.text():null}
// a cookie can't hold the whole record (4 KB), so it keeps the headline numbers as a last resort
function cookiePut(){document.cookie='twbootcamp='+encodeURIComponent(JSON.stringify({xp:S.xp,best:S.best,built:S.built,pos:S.pos,saved:S.saved}))+';max-age=31536000;path=/;SameSite=Lax'}
function cookieGet(){const m=document.cookie.match(/(?:^|; )twbootcamp=([^;]*)/);return m?decodeURIComponent(m[1]):null}
const attempt=async(name,job)=>{try{await job();stores[name]=true}catch(e){stores[name]=false}};
async function mirrorAll(){const text=JSON.stringify(S);
  stores.local=(()=>{try{return localStorage.getItem(STORE_KEY)===text}catch(e){return false}})();
  await Promise.all([attempt('idb',()=>idbPut(text)),attempt('file',()=>filePut(text)),attempt('cache',()=>cachePut(text)),attempt('cookie',async()=>{cookiePut();if(!cookieGet())throw 0})])}
let mirrorTimer=0;
function mirrorSoon(){clearTimeout(mirrorTimer);mirrorTimer=setTimeout(mirrorAll,1200)}
// leaving the page writes straight away
addEventListener('pagehide',()=>{clearTimeout(mirrorTimer);mirrorAll()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(mirrorTimer);mirrorAll()}});
// ask the browser not to clear this site's storage when space runs low
async function askToKeep(){try{stores.kept=await navigator.storage.persisted()||await navigator.storage.persist()}catch(e){stores.kept=false}}
const parse=t=>{try{const v=typeof t==='string'?JSON.parse(t):t;return v&&typeof v==='object'?v:null}catch(e){return null}};
// adopt a saved record if it's newer than what's loaded (only between drills, never mid-question)
function adopt(rec,from){if(!rec||!rec.seen||(rec.saved||0)<=(S.saved||0)||X)return false;S=Object.assign(S,rec);try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}if(from)toast('Progress restored','Recovered from '+from+'.');return true}
async function recover(){
  const found=[];
  const tryGet=async(name,job)=>{try{const v=parse(await job());if(v)found.push([name,v])}catch(e){}};
  await Promise.all([tryGet('the database copy',idbGet),tryGet('the file copy',fileGet),tryGet('the cache copy',cacheGet)]);
  found.sort((a,b)=>(b[1].saved||0)-(a[1].saved||0));
  let changed=found.length&&adopt(found[0][1],found[0][0]);
  // nothing anywhere but the cookie: keep its headline numbers at least
  const ck=parse(cookieGet());if(!found.length&&ck&&(ck.saved||0)>(S.saved||0)&&!X&&!Object.keys(S.seen).length){Object.assign(S,ck);changed=true}
  await askToKeep();await mirrorAll();
  if(changed&&!X)home(tabNow);else if(!X&&tabNow==='pr')home('pr')}
// another tab saved: pick it up
addEventListener('storage',e=>{if(e.key===STORE_KEY&&e.newValue&&adopt(parse(e.newValue),null)&&!X)home(tabNow)});

// backup file and restore link (the link carries the whole record, compressed, after the #)
const b64url=bytes=>{let t='';bytes.forEach(b=>t+=String.fromCharCode(b));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64url=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function squeeze(text){if(!window.CompressionStream)return 'j'+b64url(new TextEncoder().encode(text));const st=new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));return 'z'+b64url(new Uint8Array(await new Response(st).arrayBuffer()))}
async function unsqueeze(code){const bytes=unb64url(code.slice(1));if(code[0]==='j')return new TextDecoder().decode(bytes);const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return new Response(st).text()}
const backupName=()=>'tw-bootcamp-progress-'+today()+'.json';
function downloadBackup(){S.backedUp=today();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=backupName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup saved','Keep the file somewhere safe. Restore it on any phone or computer.')}
async function shareBackup(){const file=new File([JSON.stringify(S)],backupName(),{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'TW\'s Bootcamp progress'});S.backedUp=today();save()}catch(e){}}else downloadBackup()}
async function copyRestoreLink(){const link=location.href.split('#')[0]+'#restore='+await squeeze(JSON.stringify(S));
  try{await navigator.clipboard.writeText(link);S.backedUp=today();save();toast('Restore link copied','Paste it into notes or email it to yourself. Opening it brings this progress back.')}catch(e){prompt('Copy this restore link:',link)}}
function restoreFrom(rec,label){if(!rec||!rec.seen){toast('Not a progress file','Nothing was changed.');return}
  if(!confirm('Replace the progress on this device with '+label+'? ('+Object.keys(rec.seen).length+' questions answered, '+(rec.xp||0)+' XP)'))return;
  S=Object.assign({xp:0,best:0,seen:{},badges:[],real:0,answered:0,sprint80:false,streak:0,built:0,pos:0},rec);save();mirrorAll();home('pr');toast('Progress restored','Welcome back.')}
function pickBackupFile(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const fl=i.files[0];if(fl)restoreFrom(parse(await fl.text()),'the backup file')};i.click()}
async function restoreFromLink(){const m=location.hash.match(/^#restore=([\w-]+)/);if(!m)return;history.replaceState(null,'',location.pathname+location.search);
  try{restoreFrom(parse(await unsqueeze(m[1])),'the progress in this link')}catch(e){toast('That restore link is broken','Nothing was changed.')}}

/* ---------- the dashboard ---------- */
// each day's answers by domain: S.days['2026-11-27'] = {P:[right, asked], R:[...], B:[...], X:[...]}
function logDay(d,ok){S.days=S.days||{};const day=S.days[today()]=S.days[today()]||{};const c=day[d]=day[d]||[0,0];c[1]++;if(ok)c[0]++}
const EXAM_WEIGHT={P:.33,R:.41,B:.26};
const dayKeys=()=>Object.keys(S.days||{}).sort();
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
// exam-weighted accuracy over a set of days (the PMP weights: People 33%, Process 41%, Business 26%)
function weightedPct(keys){let w=0,sum=0;for(const d of ['P','R','B']){let r=0,n=0;keys.forEach(k=>{const c=(S.days[k]||{})[d];if(c){r+=c[0];n+=c[1]}});if(n){sum+=EXAM_WEIGHT[d]*r/n;w+=EXAM_WEIGHT[d]}}return w?sum/w*100:null}
// readiness: the last 14 study days, weighted like the exam
function readiness(){const keys=dayKeys().slice(-14);return weightedPct(keys)}
// a straight line through each study day's weighted score (7-day rolling), projected to 75%
function projection(target=75){const keys=dayKeys();if(keys.length<4)return{msg:'Study on 4 different days to get a forecast.'};
  const pts=keys.map((k,i)=>[daysBetween(keys[0],k),weightedPct(keys.slice(Math.max(0,i-6),i+1))]).filter(p=>p[1]!=null);
  const now=pts[pts.length-1][1];if(now>=target)return{msg:'You\'re at the target now. Book the exam and keep the Daily 10 going.',hit:true};
  const n=pts.length,mx=pts.reduce((a,p)=>a+p[0],0)/n,my=pts.reduce((a,p)=>a+p[1],0)/n;
  const slope=pts.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/(pts.reduce((a,p)=>a+(p[0]-mx)**2,0)||1);
  if(slope<=0.05)return{msg:'Flat lately. Fix misses and use the primers to get the line moving.'};
  const day=(target-my)/slope+mx,when=new Date(new Date(keys[0]).getTime()+day*864e5);
  if(when<new Date())return{msg:'On trend to hit '+target+'% any day now.'};
  return{msg:'At this pace you reach '+target+'% around '+when.toLocaleDateString(undefined,{month:'short',day:'numeric'})+'.',date:when}}
// a line chart of the rolling score, one line per domain, the exam-weighted line in red

const FOREMAN=[
[/critical path|float/i,'If any job on this line slips a day, we finish a day late. Those other jobs have a few days of slack.','The critical path is the longest path through the network with zero total float.','Float is computed as late start minus early start for each activity.'],

/* ---------- site crisis: a branching pour day ---------- */
const CRISIS={
start:{t:'6:10 a.m. The 300-tonne crawler crane that sets the formwork for today\'s 600 m³ pour has a hydraulic leak. Concrete trucks are batched for 7:00. The inspector arrives at 8:00.',c:[['Call the plant and push the batching two hours while you find out how bad the leak is','assess',{days:0,cost:-5,morale:0}],['Pour anyway with the formwork that\'s already set','risky',{days:0,cost:0,morale:-10}],['Cancel the pour for today','cancel',{days:2,cost:-40,morale:-5}]]},

risky:{t:'Half the forms aren\'t braced. Your foreman refuses to put his crew under them.',c:[['Back him up, stop, and call the plant','assess',{days:0,cost:-15,morale:10}],['Overrule him: the trucks are on their way','unsafe',{days:0,cost:0,morale:-25}]]},

borrow:{t:'The lift plan shows the 250-tonne crane can make the lifts at a shorter radius if you move it closer. That puts it over the excavation edge.',c:[['Bring in an engineer to check the ground and set crane mats','mats',{days:0,cost:-10,morale:5}],['Set it up at the shorter radius anyway','unsafe',{days:0,cost:0,morale:-20}]]},
wait:{t:'Repaired by 11:00. The pour runs into the evening and the crew is tired, but the inspector stayed.',c:[['Pour with a fresh relief crew for the last four hours','end_ok',{days:0,cost:-15,morale:10}],['Push the same crew through','end_tired',{days:0,cost:0,morale:-15}]]},

let crisisState=null;

  const n=CRISIS[node],score=n.end?Math.max(0,Math.round(100-crisisState.days*12+crisisState.cost/3+(crisisState.morale-60)/2)):0;
  const bar=(label,v,max,red)=>'<div class="cm"><span>'+label+'</span><div class="bar"><i style="width:'+Math.min(100,Math.abs(v)/max*100)+'%;background:'+(red?'#e10600':'var(--ink)')+'"></i></div><b>'+(label==='Budget'?(v<0?'−$':'$')+Math.abs(v)+'k':label==='Schedule'?(v?'+'+v+' days':'on time'):v+'%')+'</b></div>';
  V.innerHTML='<div class="crisis fit" id="cp"><small class="brand">Site crisis · pour day</small><p class="ctext">'+esc(n.t)+'</p>'+bar('Schedule',crisisState.days,6,crisisState.days>0)+bar('Budget',crisisState.cost,150,crisisState.cost<-50)+bar('Morale',crisisState.morale,100,crisisState.morale<40)+
  (n.end?'<div class="pct">'+score+'</div><p>'+(score>=70?'APPROVED. Good call, boss.':'REJECTED. Run it again.')+'</p><button class="btn hv" id="cagain">Run the day again</button><button class="btn alt" id="chome">Home</button>':
  n.c.map((c,i)=>'<button class="cchoice" data-i="'+i+'">'+esc(c[0])+'</button>').join(''))+'</div>';
  if(n.end){stamp(score>=70);$('cagain').onclick=()=>crisis();$('chome').onclick=()=>home('play');if(score>=70){S.xp+=25;save();hud()}}
  else V.querySelectorAll('.cchoice').forEach(b=>b.onclick=()=>{const c=n.c[+b.dataset.i];blip(true);crisis(c[1],c[2])});

function start(m,from){
  let ids;const all=Q.map(q=>q.id);
  const pmiIds=Q.filter(q=>trackOf(q.ch)==='pmi').map(q=>q.id);
  if(m==='story')ids=pmiIds.filter(id=>id>=(S.pos||0));
  else if(m==='sprint')ids=shuffle(pmiIds).slice(0,20);
  else if(m==='miss')ids=shuffle(Q.filter(q=>S.seen[q.id]&&!S.seen[q.id].c).map(q=>q.id));
  else if(m==='jump'){ids=all.slice(from);m='story'}
  else if(m==='mock'){ids=shuffle(pmiIds).slice(0,180)}
  else if(m==='super'){const w=worstTopics(3);ids=shuffle(Q.filter(q=>w.includes(q.w)).map(q=>q.id)).slice(0,10);superSays(SUPER[superMode()||'gentle'].open(w.join(', ')))}
  else if(m==='daily'){const day=today();let h=0;for(const c of day)h=(h*31+c.charCodeAt(0))>>>0;const pick=all.slice();for(let i=pick.length-1;i>0;i--){h=(h*1103515245+12345)>>>0;const j=h%(i+1);[pick[i],pick[j]]=[pick[j],pick[i]]}const due=dueIds();ids=due.concat(pick.filter(id=>!due.includes(id))).slice(0,10)}
  else ids=shuffle(Q.filter(q=>q.d===m).map(q=>q.id));

  say(['Chapter '+c+'. '+CH[c][0]+'.',CH[c][1]]);
}
// a little celebration: hard-hat confetti, combo calls, the foreman's word, and two short sounds
let audioCtx=null;
function blip(ok){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;
  (ok?[523,659,784]:[220,175]).forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=ok?'triangle':'sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.08);g.gain.exponentialRampToValueAtTime(ok?.12:.05,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.08+.18);o.connect(g).connect(audioCtx.destination);o.start(t+i*.08);o.stop(t+i*.08+.2)})}catch(e){}}
function confetti(){const colours=['#e10600','#b6b6b6','#9e9e9e','#545454','#ffffff'];for(let i=0;i<26;i++){const d=document.createElement('i');d.className='cf';d.style.left=(30+Math.random()*40)+'%';d.style.background=colours[i%colours.length];d.style.setProperty('--dx',(Math.random()*240-120)+'px');d.style.setProperty('--r',(Math.random()*720-360)+'deg');d.style.animationDelay=(Math.random()*.15)+'s';PH.appendChild(d);setTimeout(()=>d.remove(),1400)}}
const RIGHT=['Damn right.','Yep. Pour it.','Boom. Next.','Textbook. Go get a coffee.','That\'s how you keep your job.','Clean as a fresh slab.','The sponsor just smiled. Rare.','Nobody even had to call a meeting.'];
const WRONG=['Nope. That\'s a stern email from head office.','Ouch. The inspector saw that.','Swing and a miss.','That\'s a change order waiting to happen.','Close, but the crane already left.','Bold. Wrong, but bold.','That one ends up in the lessons learned.'];
const LATE=['Clock ran out. Just like the float.','Too slow. The concrete set.','Time\'s up. The trucks went home.'];
const QUIPS_OLD=['The foreman nods. That\'s a rare thing.','Hard hats off to you.','Crane\'s on time. So are you.','That one goes on the site whiteboard.','The concrete truck honks in approval.','Superintendent material, that.'];
const QUIPS=['The foreman actually nodded.','Somebody print that on a hard hat.','The concrete truck honked. That\'s a compliment.','Superintendent material, right there.','Even the inspector looked impressed.'];
const COMBO=['','','','Three straight. Somebody\'s been studying.','Four in a row. The crane operator waved.','Five! You\'re on fire. Literally, check the screen.'];
function stamp(ok){const d=document.createElement('div');d.className='stamp'+(ok?'':' no');d.textContent=ok?'APPROVED':'REJECTED';PH.appendChild(d);setTimeout(()=>d.remove(),1200)}
const EVENTS=[['Coffee truck\'s here','Crew morale up. +5 XP.'],['Inspector came early','And you were ready. +5 XP.'],['Rain held off','Pour went fine. +5 XP.'],['Delivery on time','First time this year. +5 XP.'],['Safety stand-down','Nobody got hurt this month. +5 XP.']];
function siteEvent(){if(Math.random()>.12)return;const e=EVENTS[Math.floor(Math.random()*EVENTS.length)];S.xp+=5;X.xp+=5;setTimeout(()=>toast(e[0],e[1]),900)}
function celebrate(ok){blip(ok);stamp(ok);PH.classList.toggle('fire',S.streak>=5);siteEvent();if(!ok){PH.classList.add('shake');setTimeout(()=>PH.classList.remove('shake'),400);return}
  confetti();if(S.streak>=3)toast(COMBO[Math.min(S.streak,5)]||(S.streak+' in a row. Unstoppable.'),QUIPS[Math.floor(Math.random()*QUIPS.length)]);}
function answer(k){
  if(X.done)return;X.done=true;stopTimer();
  const q=Q[X.ids[X.i]],ok=k===0,secs=(Date.now()-X.t0)/1000;
  S.answered++;S.seen[q.id]={c:ok,n:((S.seen[q.id]||{}).n||0)+1};review(q.id,ok);logDay(q.d,ok);
  if(superMode()){const L=SUPER[superMode()];if(!ok&&missesOn(q.w)>=2)superSays(L.repeat(q.w));else if(secs>25)superSays(L.slow[Math.floor(Math.random()*L.slow.length)]);else if(ok&&S.streak>0&&(S.streak+1)%5===0)superSays(L.streak[Math.floor(Math.random()*L.streak.length)])}
  let gain=0;
  if(ok){S.streak++;S.best=Math.max(S.best,S.streak);const mult=Math.min(3,1+Math.floor(S.streak/3)*.5);gain=Math.round(10*mult)+(X.m==='sprint'&&secs<40?5:0);X.ok++}
  else S.streak=0;
  if(ok&&X.red)gain*=2;
  S.xp+=gain;X.xp+=gain;X.log.push({id:q.id,ok});
  const fresh=bump();
  if(fresh>=0){$('strip').innerHTML=site(fresh)+'<span class="lab">Site cam · '+Math.round(S.built/Q.length*100)+'% built</span>';}
  V.querySelectorAll('.opt').forEach(b=>{const kk=+b.dataset.k;b.disabled=true;if(kk===0)b.classList.add('right');else if(kk===k)b.classList.add('wrong')});
  const last=X.i===X.ids.length-1,mult=Math.min(3,1+Math.floor(S.streak/3)*.5);
  const head=ok?RIGHT[Math.floor(Math.random()*RIGHT.length)]:k<0?LATE[Math.floor(Math.random()*LATE.length)]:WRONG[Math.floor(Math.random()*WRONG.length)];
  const [sl,su]=src(q);
  const panes={
    why:`<p><strong>Answer:</strong> ${rich(q.o[0])}</p><p>${rich(q.e)}</p>${!ok&&k>0?'<p><strong>Your pick:</strong> '+rich(q.n[k-1])+'</p>':''}${aidFor(q)}<div class="vidbox" id="vidbox"></div><div class="src"><strong>${trackOf(q.ch)==='more'?'Source':'PMI source'}:</strong> <a href="${su}" target="_blank" rel="noopener">${esc(sl)} ↗</a></div>`,
    opts:'<div class="ol">'+X.order.map((kk,i)=>'<div class="'+(kk===0?'c':kk===k?'x':'')+'"><b class="k">'+L[i]+'</b><span><strong>'+rich(q.o[kk])+'</strong><br>'+(kk===0?'Correct. '+rich(q.e.split('. ')[0].replace(/\.$/,''))+'.':rich(q.n[kk-1]))+'</span></div>').join('')+'</div>',
    real:q.r?'<span class="real">PMI vs the real world</span><p>'+rich(q.r)+'</p>':''};
  const tabs=[['why','Why'],['opts','All options']].concat(q.r?[['real','Real world']]:[]);
  const sh=document.createElement('section');sh.className='sheet'+(ok?'':' bad');
  sh.innerHTML=`<div class="sh"><h3>${head}</h3>${gain?'<span class="xp">+'+gain+' XP'+(mult>1?' ×'+mult:'')+'</span>':''}</div>
<div class="tabs" role="tablist">${tabs.map((t,i)=>'<button class="tab'+(t[0]==='real'?' hv':'')+'" role="tab" data-p="'+t[0]+'" aria-selected="'+(i===0)+'">'+t[1]+'</button>').join('')}</div>
<div class="sbody fit" id="sb"></div><button class="next" id="next">${last?'See results':'Next question →'}</button>`;
  V.appendChild(sh);
  if(ok)foremanCard(sh,q);
  let counted=false;
  const pane=p=>{$('sb').innerHTML=panes[p];if(p==='why')showVideo(q,$('vidbox'));$('sb').style.overflowY='hidden';sh.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.p===p));fit($('sb'),.7);if(p==='real'){say(['PMI versus the real world.',q.r]);if(!counted){counted=true;S.real++;save();checkBadges()}}};
  sh.querySelectorAll('.tab').forEach(t=>t.onclick=()=>pane(t.dataset.p));
  pane('why');
  showVideo(q,$('vidbox'));
  $('next').onclick=()=>{if(last)finish();else{X.i++;show()}};
  celebrate(ok);
  if(gain)pop('+'+gain+' XP');
  if(fresh>=0)toast('Construction update',E[fresh][0]+'. Northshore is '+Math.round(S.built/Q.length*100)+'% built.');
  if(ok&&S.streak>0&&S.streak%5===0)toast('Streak '+S.streak,'Multiplier now ×'+mult);
  if(X.m==='story')S.pos=last?0:Q[X.ids[X.i+1]].id;
  save();hud();checkBadges();
  say([head,(!ok?'The answer is: '+q.o[0]+'. ':'')+q.e,(!ok&&k>0?'Your pick: '+q.n[k-1]:''),q.r?'There\'s a real-world note on this one.':'']);
}
function finish(){
  if(X&&X.m==='daily'&&X.i>=X.ids.length-1)dailyDone();
  stopTimer();hush();
  const n=X.log.length;if(!n){home('play');return}
  const pct=Math.round(X.ok/n*100);
  if(X.m==='mock'&&!X.logged){X.logged=true;S.mocks=S.mocks||[];const by=d=>{const l=X.log.filter(x=>Q[x.id].d===d);return l.length?Math.round(l.filter(x=>x.ok).length/l.length*100):null};S.mocks.push({day:today(),n,pct,P:by('P'),R:by('R'),B:by('B')});save()}
  if(X.m==='sprint'&&n===20&&pct>=80){S.sprint80=true;save();checkBadges()}
  const missed=X.log.filter(x=>!x.ok);
  const verdict=pct>=80?'Above target. The exam would like you.':pct>=65?'Close to target. Fix the misses and go again.':'Below target. Read every note and run it again.';
  V.innerHTML=`<div class="strip">${site(-1)}<span class="lab">Site cam · ${Math.round((S.built||0)/Q.length*100)}% built</span></div>
<div class="res fit" id="rs"><p class="cond" style="font-size:20px">Drill complete</p><div class="pct">${pct}%</div><p style="margin:0">${verdict}</p>
<div class="rw"><div>Correct<strong>${X.ok}/${n}</strong></div><div>XP earned<strong>+${X.xp}</strong></div><div>Built<strong>${Math.round((S.built||0)/Q.length*100)}%</strong></div></div>
${X.m==='mock'?'<div class="rw">'+['P','R','B'].map(d=>{const l=X.log.filter(x=>Q[x.id].d===d);return '<div>'+DN[d]+'<strong>'+(l.length?Math.round(l.filter(x=>x.ok).length/l.length*100):0)+'%</strong></div>'}).join('')+'</div><p style="margin:4px 0;font-size:13px">PMI doesn\'t publish a pass mark. Around 70% or better in every domain is a good sign.</p>':''}<button class="btn hv" id="card">Site report card</button><button class="btn hv" id="again">Keep going</button>${missed.length?'<button class="btn" id="fix">Drill these '+missed.length+' misses</button>':''}<button class="btn alt" id="hm">Home</button></div>`;
  say(['Drill complete. You scored '+pct+' percent.',verdict]);
  const m=X.m,ids=missed.map(x=>x.id);
  $('again').onclick=()=>start(m);$('card').onclick=()=>reportCard(pct,n,X.ok);$('hm').onclick=()=>home('play');
  if($('fix'))$('fix').onclick=()=>{X={m:'miss',ids:shuffle(ids),i:0,ok:0,xp:0,log:[],lastCh:-1};show()};
  hud();fit($('rs'),.6);
}
document.addEventListener('keydown',e=>{
  if(!X||!$('opts')||e.ctrlKey||e.metaKey||e.altKey)return;
  const i='abcd1234'.indexOf(e.key.length===1?e.key.toLowerCase():'#');
  if(i>=0&&!X.done){const b=$('opts').children[i%4];if(b)b.click()}
  else if(e.key==='Enter'&&X.done&&$('next')&&document.activeElement!==$('next')){e.preventDefault();$('next').click()}
});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>['pg','qb','sb','cp','rs'].forEach(id=>fit($(id),.6)),120)});
$('home').onclick=()=>home('play');
home('play');
}
</script>
