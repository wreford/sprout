<!doctype html>
<html lang="en-US">
<head>

<link rel="icon" type="image/png" href="/icons/squirm-64.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Squirmers</title>
<style>
:root{--ink:#fff8ec;--pink:#ff8fb1;--gold:#ffd34a;--dark:#1b1530}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1530;color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:max(6px,env(safe-area-inset-top)) 10px 6px;background:linear-gradient(#2a2050,#1b1530);flex:0 0 auto;z-index:3}
#top b{font:900 18px "Trebuchet MS",system-ui;color:var(--pink);letter-spacing:.02em}
.pill{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);font:800 13px system-ui;white-space:nowrap}
.pill.good{color:#9ff0a8}.pill.warn{color:#ffd34a}
#top .sp{flex:1}
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none;background:linear-gradient(#7fd3ff,#c8f0ff 60%,#e8ffe8)}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#terr{position:absolute;left:0;top:0;width:960px;height:540px;image-rendering:auto}
#svg{position:absolute;left:0;top:0;width:960px;height:540px;overflow:visible;pointer-events:none}
#bg{position:absolute;inset:0;pointer-events:none}
#bar{display:flex;gap:5px;padding:6px 6px max(6px,env(safe-area-inset-bottom));overflow-x:auto;background:linear-gradient(#2a2050,#151028);flex:0 0 auto;scrollbar-width:none;z-index:3}#bar::-webkit-scrollbar{display:none}
.sk{position:relative;flex:0 0 auto;width:62px;height:66px;border-radius:16px;border:3px solid #4a3a80;background:linear-gradient(#3a2d6a,#241a48);color:var(--ink);font:800 10.5px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:3px;cursor:pointer}
.sk svg{width:40px;height:34px;overflow:visible}
.sk .n{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--pink);color:#2a0a1a;font:900 12px system-ui;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #1b1530}
.sk.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(255,211,74,.6);transform:translateY(-3px)}
.sk.zero{opacity:.4}.sk.ctl{width:52px;background:linear-gradient(#2d2a4a,#1d1a36)}
.sk.ctl .big{font:900 22px system-ui;line-height:1;margin-bottom:6px}
#msg{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:8px 16px;border-radius:14px;background:rgba(27,21,48,.85);font:800 15px system-ui;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;z-index:4}
#msg.on{opacity:1}
#modal{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-start;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(60,40,110,.94),rgba(15,10,30,.97));padding:14px;overflow:auto}
#modal[hidden]{display:none}
#modal>div{max-width:620px;width:100%;text-align:center;margin:auto}
.card{background:linear-gradient(#2e2358,#1d1638);border:3px solid #5a48a0;border-radius:22px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
h1.logo{margin:0}h2{font:900 26px "Trebuchet MS",system-ui;color:var(--pink);margin:6px 0}
p{font:600 15px/1.45 system-ui;color:#e8e0ff;margin:6px 0}
.btn{font:900 18px system-ui;color:#2a0a1a;background:linear-gradient(#ffb3c8,#ff7aa0);border:0;border-radius:16px;padding:12px 22px;margin:6px;box-shadow:0 4px 0 #b84a70;cursor:pointer}
.btn.alt{background:linear-gradient(#5a48a0,#3a2d6a);color:var(--ink);box-shadow:0 4px 0 #241a48}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.lv{border-radius:16px;border:3px solid #5a48a0;background:#241a48;color:var(--ink);padding:10px 8px;font:800 14px system-ui;cursor:pointer;text-align:left}
.lv small{display:block;font:600 11.5px system-ui;color:#b8a8e8;margin-top:2px}.lv.done{border-color:#7ad08a}.lv.lock{opacity:.4;cursor:default}
.lv .num{font:900 20px system-ui;color:var(--pink)}
.skillrow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0}.skillrow span{padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.1);font:800 12px system-ui}
@keyframes wob{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.04)}}
.logo .l{display:inline-block;animation:wob 1.6s ease-in-out infinite}
</style>
</head>
<body>
<div id="app">
 <div id="top"><b>Squirmers</b><span class="pill" id="lvN"></span><span class="sp"></span><span class="pill" id="out">Out 0</span><span class="pill" id="home">Home 0%</span><span class="pill" id="time">5:00</span></div>
 <div id="stage"><svg id="bg" preserveAspectRatio="xMidYMax slice" viewBox="0 0 960 540"></svg><div id="world"><canvas id="terr" width="960" height="540"></canvas><svg id="svg" viewBox="0 0 960 540"></svg></div><div id="msg"></div></div>
 <div id="bar"></div>
</div>
<div id="modal" hidden></div>
<script>
"use strict";
// ================================================================ Squirmers: guide the worms home. Original game; all art is SVG drawn in code.
const W=960,H=540,TICK=1000/30;
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=Math.random;
// ---------------------------------------------------------------- skills
const SKILLS=[
 {id:"climb",n:"Sticky",d:"Climbs straight up walls."},
 {id:"float",n:"Leafer",d:"Floats down safely on a leaf."},
 {id:"bomb",n:"Popper",d:"Pops after 5 seconds, blasting a hole."},
 {id:"block",n:"Stopper",d:"Rears up and turns the others back."},
 {id:"build",n:"Noodler",d:"Lays a staircase of noodles."},
 {id:"bash",n:"Tunneler",d:"Burrows straight ahead."},
 {id:"dig",n:"Digger",d:"Burrows straight down."}];
// ---------------------------------------------------------------- levels: bendy shapes (smoothed through the points), rock is indestructible
// s: soil shapes, r: rock shapes, w: water line (y), in/out: entrance and home, n: worms, need: worms to save, rate: release rate (1-99), k: skill counts
const LEVELS=[
 {n:"First Wiggle",tip:"Just watch. Worms know the way home.",n_:10,need:6,rate:50,time:180,in:[120,250],out:[830,300],
  s:[[[0,400],[150,385],[300,398],[480,378],[650,392],[800,380],[960,388],[960,540],[0,540]]],k:{}},
 {n:"Dig In",tip:"Walls on both sides. Pick the Digger, then tap a worm to burrow down.",n_:10,need:8,rate:50,time:180,in:[300,200],out:[640,350],
  s:[[[95,300],[300,292],[520,300],[700,294],[865,300],[865,340],[95,340]],[[0,386],[200,382],[420,388],[640,383],[960,388],[960,540],[0,540]]],
  r:[[[60,170],[95,170],[95,340],[60,340]],[[865,170],[900,170],[900,340],[865,340]]],k:{dig:2}},
 {n:"Mind the Gap",tip:"Noodlers build bridges. Hold the others back with a Stopper, then pop it when the bridge is done.",n_:12,need:7,rate:30,time:240,in:[150,250],out:[820,250],w:470,
  s:[[[40,330],[200,326],[440,330],[440,540],[40,540]],[[475,315],[700,310],[960,316],[960,540],[475,540]]],r:[[[0,150],[40,150],[40,540],[0,540]]],k:{build:3,block:1,bomb:1}},
 {n:"Clay Wall",tip:"A Tunneler burrows straight through soft clay.",n_:10,need:9,rate:40,time:200,in:[140,300],out:[860,330],
  s:[[[40,400],[300,396],[600,402],[960,398],[960,540],[40,540]],[[450,402],[452,250],[470,238],[492,236],[508,248],[510,402]]],r:[[[0,150],[40,150],[40,540],[0,540]]],k:{bash:2}},
 {n:"Leap of Faith",tip:"Too high to fall. Give every worm a leaf.",n_:8,need:7,rate:25,time:240,in:[120,100],out:[760,400],w:505,
  s:[[[30,172],[200,168],[330,175],[330,226],[30,226]],[[250,470],[500,462],[960,468],[960,540],[250,540]]],r:[[[0,40],[30,40],[30,226],[0,226]]],k:{float:8}},
 {n:"Up and Over",tip:"Stickies climb walls. That cliff is rock, so nobody's digging through it.",n_:10,need:8,rate:40,time:240,in:[140,300],out:[820,100],
  s:[[[35,400],[300,396],[540,400],[540,540],[35,540]],[[565,155],[700,150],[860,160],[960,155],[960,540],[565,540]]],r:[[[0,250],[35,250],[35,540],[0,540]],[[540,150],[565,150],[565,540],[540,540]]],k:{climb:10,float:2}},
 {n:"Soft Spot",tip:"Rock lines the floor, all but one soft spot in the middle.",n_:10,need:8,rate:40,time:240,in:[200,250],out:[480,385],
  s:[[[100,330],[300,326],[480,332],[700,326],[860,330],[860,365],[100,365]],[[0,412],[300,406],[600,414],[960,408],[960,540],[0,540]]],r:[[[70,200],[100,200],[100,380],[70,380]],[[860,200],[890,200],[890,380],[860,380]],[[100,365],[440,365],[440,380],[100,380]],[[525,365],[860,365],[860,380],[525,380]]],k:{bomb:1,dig:1}},
 {n:"Stairway to Leaven",tip:"Two gaps. Stop, build, pop, and go. Twice.",n_:12,need:7,rate:30,time:330,in:[100,250],out:[880,230],w:480,
  s:[[[30,330],[150,326],[262,330],[262,540],[30,540]],[[300,314],[430,310],[560,314],[560,540],[300,540]],[[598,296],[780,290],[960,295],[960,540],[598,540]]],r:[[[0,150],[30,150],[30,540],[0,540]]],k:{build:4,block:2,bomb:2}},
 {n:"The Big Dig",tip:"Down through the soil, through the clay, across the water, home.",n_:15,need:10,rate:40,time:400,in:[150,120],out:[880,230],w:520,
  s:[[[60,240],[250,234],[400,240],[400,290],[60,290]],[[0,322],[300,318],[640,322],[640,540],[0,540]],[[520,322],[522,232],[546,222],[570,234],[572,322]],[[680,302],[800,296],[960,302],[960,540],[680,540]]],r:[[[30,100],[60,100],[60,290],[30,290]],[[400,170],[420,170],[420,290],[400,290]]],k:{dig:2,bash:2,build:2,block:2,bomb:2,float:2}}];
LEVELS.forEach(L=>L.N=L.n_);
// ---------------------------------------------------------------- terrain: a mask for physics, a canvas for looks
let mask=new Uint8Array(W*H);// 0 air, 1 soil, 2 rock, 3 noodle
const tc=$("terr"),tg=tc.getContext("2d");let TR=1;
function roundPoly(pts,r){const p=new Path2D();const n=pts.length;const M=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];const st=M(pts[n-1],pts[0]);p.moveTo(...st);for(let i=0;i<n;i++){const c=pts[i],nx=pts[(i+1)%n];p.arcTo(c[0],c[1],...M(c,nx),r)}p.closePath();return p}
function smoothPath(pts){const p=new Path2D();const n=pts.length;const P=i=>pts[(i+n)%n];p.moveTo(...P(0));for(let i=0;i<n;i++){const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);const t=.18;p.bezierCurveTo(p1[0]+(p2[0]-p0[0])*t,p1[1]+(p2[1]-p0[1])*t,p2[0]-(p3[0]-p1[0])*t,p2[1]-(p3[1]-p1[1])*t,p2[0],p2[1])}p.closePath();return p}
function svgPath(pts,closed){const n=pts.length;if(n<2)return "";const P=i=>closed?pts[(i+n)%n]:pts[clamp(i,0,n-1)];let d=`M${P(0)[0].toFixed(1)} ${P(0)[1].toFixed(1)}`;const m=closed?n:n-1;for(let i=0;i<m;i++){const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2),t=.18;d+=`C${(p1[0]+(p2[0]-p0[0])*t).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])*t).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])*t).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])*t).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`}return closed?d+"Z":d}
function buildMask(L){mask=new Uint8Array(W*H);const c=document.createElement("canvas");c.width=W;c.height=H;const q=c.getContext("2d");
 const raster=(shapes,v,rect)=>{q.clearRect(0,0,W,H);q.fillStyle="#fff";for(const s of shapes||[]){q.fill(roundPoly(s,rect?4:12))}const d=q.getImageData(0,0,W,H).data;for(let i=0;i<W*H;i++)if(d[i*4+3]>127)mask[i]=v};
 raster(L.s,1,false);raster(L.r,2,true)}
const solid=(x,y)=>{x|=0;y|=0;if(y<0||y>=H)return false;if(x<0||x>=W)return true;return mask[y*W+x]>0};
const kind=(x,y)=>{x|=0;y|=0;return x>=0&&x<W&&y>=0&&y<H?mask[y*W+x]:0};
const hash=(x,y)=>{let h=(x*374761393+y*668265263)^0x5bd1e995;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967295};
let dirtyRect=null;function markDirty(x0,y0,x1,y1){x0=clamp(Math.floor(x0)-3,0,W);y0=clamp(Math.floor(y0)-3,0,H);x1=clamp(Math.ceil(x1)+3,0,W);y1=clamp(Math.ceil(y1)+3,0,H);dirtyRect=dirtyRect?[Math.min(dirtyRect[0],x0),Math.min(dirtyRect[1],y0),Math.max(dirtyRect[2],x1),Math.max(dirtyRect[3],y1)]:[x0,y0,x1,y1]}
const low=document.createElement("canvas");low.width=W;low.height=H;const lg=low.getContext("2d");let lowImg=null;
function paintTerrain(x0,y0,x1,y1){if(!lowImg)lowImg=lg.createImageData(W,H);const d=lowImg.data;
 for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const i=y*W+x,k=mask[i],o=i*4;if(!k){d[o+3]=0;continue}
  const up=y>0?mask[i-W]:0,up2=y>1?mask[i-2*W]:0,up3=y>2?mask[i-3*W]:0,lf=x>0?mask[i-1]:0,rt=x<W-1?mask[i+1]:0,dn=y<H-1?mask[i+W]:1;const n=hash(x,y);let r,g,b;
  if(k===1){const deep=Math.min(1,y/H);r=150-deep*40+n*14;g=96-deep*30+n*10;b=58-deep*16+n*6;if(n>.985){r=200;g=180;b=150}else if(n>.97){r-=40;g-=30;b-=20}
   if(!up||!up2||!up3){const gN=!up?0:!up2?1:2;r=70+gN*14+n*20;g=170-gN*20+n*30;b=60+n*10}}
  else if(k===2){r=128+n*24;g=126+n*22;b=140+n*26;if(((x+y*2)%23===0)||n>.98){r-=36;g-=36;b-=30}if(!up){r+=30;g+=30;b+=34}}
  else{r=250;g=214+n*20;b=110+n*20;if(!up){r=255;g=240;b=160}}
  if(!lf||!rt||!dn||!up){r*=.7;g*=.7;b*=.7;if(k===1&&!up){r=60;g=140;b=50}}
  d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=255}
 lg.putImageData(lowImg,0,0,x0,y0,x1-x0,y1-y0);
 tg.save();tg.setTransform(TR,0,0,TR,0,0);tg.clearRect(x0,y0,x1-x0,y1-y0);tg.imageSmoothingEnabled=true;tg.drawImage(low,x0,y0,x1-x0,y1-y0,x0,y0,x1-x0,y1-y0);tg.restore()}
function carve(cx,cy,r,fn){const x0=Math.max(0,Math.floor(cx-r)),x1=Math.min(W-1,Math.ceil(cx+r)),y0=Math.max(0,Math.floor(cy-r)),y1=Math.min(H-1,Math.ceil(cy+r));let hitRock=false;
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(fn&&!fn(x,y))continue;const i=y*W+x;if(mask[i]===2){hitRock=true;continue}mask[i]=0}markDirty(x0,y0,x1+1,y1+1);return hitRock}
function carveRect(x0,y0,x1,y1){if(x0>x1)[x0,x1]=[x1,x0];x0=Math.max(0,Math.floor(x0));x1=Math.min(W-1,Math.ceil(x1));y0=Math.max(0,Math.floor(y0));y1=Math.min(H-1,Math.ceil(y1));let rock=false,any=false;for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=y*W+x;if(mask[i]===2){rock=true;continue}if(mask[i]){any=true;mask[i]=0}}markDirty(x0,y0,x1+1,y1+1);return {rock,any}}
function fillRect(x0,y0,x1,y1,v){if(x0>x1)[x0,x1]=[x1,x0];for(let y=Math.max(0,y0|0);y<=Math.min(H-1,y1|0);y++)for(let x=Math.max(0,x0|0);x<=Math.min(W-1,x1|0);x++)if(!mask[y*W+x])mask[y*W+x]=v;markDirty(x0,y0,x1+1,y1+1)}
// ---------------------------------------------------------------- game state
let G=null,sel="dig",speed=1,paused=false,lastT=0,acc=0,camX=0,SC=1;
function startLevel(i){const L=LEVELS[i];buildMask(L);lowImg=null;sizeWorld();paintTerrain(0,0,W,H);
 const ex=L.out[0];let ey=L.out[1]||0;while(ey<H-1&&!solid(ex,ey+1))ey++;
 let gy=L.in[1];while(gy<H-1&&!solid(L.in[0],gy))gy++;const ent=[L.in[0],Math.max(L.in[1],gy-60)];
 G={i,L,worms:[],spawned:0,saved:0,dead:0,t:0,rate:L.rate,minRate:L.rate,k:{...L.k},nextSpawn:20,over:false,nuke:false,exit:[ex,ey],ent,fx:[],timeLeft:L.time*30};
 sel=SKILLS.find(s=>G.k[s.id])?.id||null;buildScene();buildBar();hud();$("modal").hidden=true;camX=clamp(L.in[0]-viewW()/2/SC,0,Math.max(0,W-viewW()/SC));placeWorld();paused=false;
 msg(L.tip,4000);beep(660,.08,"triangle");setTimeout(()=>beep(880,.1,"triangle"),120)}
// ---------------------------------------------------------------- worms
let UID=1;
function spawn(){const [x,y]=G.ent;G.worms.push({id:UID++,x,y:y+14,dir:1,st:"fall",fall:0,t:0,ph:rnd()*6,climber:false,floater:false,bombT:0,bricks:0,fx:0});G.spawned++}
function blockedByStopper(w,nx){for(const b of G.worms)if(b!==w&&b.st==="block"&&Math.abs(b.x-nx)<5&&Math.abs(b.y-w.y)<12&&Math.sign(b.x-w.x)===w.dir)return true;return false}
function wallHeight(x,y){let h=0;while(h<12&&solid(x,y-h))h++;return h}
function stepWorm(w){w.t++;w.ph+=.18;
 if(w.bombT>0){w.bombT--;if(w.bombT===0)return explode(w)}
 if(w.y>H+10||w.x<-10||w.x>W+10)return kill(w,"lost");
 if(G.L.w&&w.y>=G.L.w&&w.st!=="drown"){w.st="drown";w.t=0;sfx("splash");return}
 switch(w.st){
 case "walk":{if(Math.abs(w.x-G.exit[0])<7&&Math.abs(w.y-G.exit[1])<10){w.st="exit";w.t=0;sfx("yay");return}
  const nx=w.x+w.dir*.8;if(blockedByStopper(w,nx)){w.dir*=-1;return}
  if(solid(nx,w.y)){const h=wallHeight(nx|0,w.y|0);if(h<=6){w.x=nx;w.y-=h}else if(w.climber){w.st="climb";w.t=0}else w.dir*=-1;return}
  w.x=nx;if(!solid(w.x,w.y+1)){let d=1;while(d<=4&&!solid(w.x,w.y+d))d++;if(d<=4)w.y+=d-1;else{w.st="fall";w.fall=0}}
  break}
 case "fall":{const v=w.floater&&w.fall>18?1.3:Math.min(4,1+w.fall*.08);let landed=false;for(let s=0;s<v;s++){if(solid(w.x,w.y+1)){landed=true;break}w.y+=1;w.fall+=1}
  if(landed||solid(w.x,w.y+1)){if(w.fall>95&&!w.floater){w.st="splat";w.t=0;sfx("splat");return}w.st="walk";if(w.fall>20)sfx("land")}break}
 case "climb":{if(solid(w.x,w.y-14)||w.y<16){w.dir*=-1;w.st="fall";w.fall=0;w.x+=w.dir*2;return}w.y-=.7;if(!solid(w.x+w.dir*2,w.y-2)&&!solid(w.x+w.dir*2,w.y-6)){w.x+=w.dir*3;w.y-=3;w.st="walk"}break}
 case "dig":{if(w.t%5===0){if(!solid(w.x,w.y+1)&&!solid(w.x,w.y+3)){w.st="fall";w.fall=0;return}const r=carveRect(w.x-5,w.y-3,w.x+5,w.y+1);if(r.rock&&!r.any){w.st="walk";sfx("clank");return}w.y+=1;if(w.t%10===0)sfx("dig")}break}

let ptr=null,hoverPt=null;
function viewW(){return $("stage").clientWidth}
function sizeWorld(){const st=$("stage");SC=Math.max(.4,st.clientHeight/H);if(W*SC<st.clientWidth)SC=st.clientWidth/W;const k=Math.min(3,SC*(devicePixelRatio||1));TR=k;tc.width=Math.round(W*k);tc.height=Math.round(H*k);const w=$("world");w.style.width=W+"px";w.style.height=H+"px";placeWorld()}
function placeWorld(){camX=clamp(camX,0,Math.max(0,W-viewW()/SC));const st=$("stage");const oy=st.clientHeight-H*SC;$("world").style.transform=`translate(${-camX*SC}px,${Math.max(0,oy)}px) scale(${SC})`}
function toWorld(cx,cy){const r=$("stage").getBoundingClientRect();const oy=Math.max(0,r.height-H*SC);return [(cx-r.left)/SC+camX,(cy-r.top-oy)/SC]}
function hoverWorm(){if(!hoverPt||!G)return null;const [x,y]=hoverPt;let best=null,bd=1e9;for(const w of G.worms){if(w.done)continue;const d=Math.hypot(w.x-x,(w.y-8)-y);if(d<bd){bd=d;best=w}}return bd<22/Math.min(1.2,SC)?best:null}
const st=$("stage");
st.addEventListener("pointerdown",e=>{audioInit();ptr={x:e.clientX,y:e.clientY,cx:camX,moved:false,id:e.pointerId};st.setPointerCapture(e.pointerId);hoverPt=toWorld(e.clientX,e.clientY)});
st.addEventListener("pointermove",e=>{hoverPt=toWorld(e.clientX,e.clientY);if(ptr&&ptr.id===e.pointerId){const dx=e.clientX-ptr.x;if(Math.abs(dx)>12)ptr.moved=true;if(ptr.moved){camX=ptr.cx-dx/SC;placeWorld()}}});
st.addEventListener("pointerup",e=>{if(ptr&&!ptr.moved&&G&&!G.over){hoverPt=toWorld(ptr.x,ptr.y);const w=hoverWorm();if(w){if(!sel||!G.k[sel])msg("Pick a skill with some left first.",1400);else if(!assign(w,sel))beep(160,.08,"sawtooth")}}if(e.pointerType!=="mouse")hoverPt=null;ptr=null});
st.addEventListener("wheel",e=>{camX+=(e.deltaX||e.deltaY)/SC;placeWorld();e.preventDefault()},{passive:false});
addEventListener("resize",()=>{if(!G)return;sizeWorld();lowImg=null;paintTerrain(0,0,W,H)});
addEventListener("keydown",e=>{if(!G)return;const k=e.key;const i="1234567".indexOf(k);if(i>=0){sel=SKILLS[i].id;buildBar()}if(k===" "){paused=!paused;buildBar();e.preventDefault()}if(k==="f")speed=speed>1?1:3;if(k==="ArrowLeft"){camX-=40;placeWorld()}if(k==="ArrowRight"){camX+=40;placeWorld()}});
function msg(t,ms){const m=$("msg");m.textContent=t;m.classList.add("on");clearTimeout(msg.h);msg.h=setTimeout(()=>m.classList.remove("on"),ms||1800)}
// ---------------------------------------------------------------- sound: little synth blips
let AC=null;function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function beep(f,d,type,v){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.value=v||.08;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function slide(f1,f2,d,type,v){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f1,AC.currentTime);o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);g.gain.value=v||.08;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function noise(d,v){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(rnd()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v||.1;s.connect(g);g.connect(AC.destination);s.start()}
function sfx(k){if(speed>1&&(k==="dig"||k==="brick"))return;({assign:()=>slide(500,900,.12,"triangle",.07),dig:()=>noise(.06,.04),brick:()=>beep(700+rnd()*200,.05,"square",.03),tick:()=>beep(1200,.03,"square",.03),shrug:()=>slide(400,250,.2,"triangle",.06),clank:()=>beep(180,.12,"square",.07),
 pop:()=>{noise(.25,.2);slide(300,60,.3,"sawtooth",.08)},splat:()=>{noise(.15,.1);slide(300,80,.15,"sine",.1)},land:()=>slide(200,120,.06,"sine",.05),splash:()=>noise(.3,.08),yay:()=>{slide(600,1200,.15,"triangle",.07)},
 win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,"triangle",.09),i*120)),lose:()=>[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.25,"triangle",.08),i*180))})[k]?.()}
// ---------------------------------------------------------------- menu
function logo(){return `<h1 class="logo"><svg viewBox="0 0 420 110" width="100%" style="max-width:460px"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb6cb"/><stop offset="1" stop-color="#ff6f98"/></linearGradient></defs>
 ${(()=>{const wd=[42,50,46,22,44,56,40,44,42];let x=(420-wd.reduce((a,b)=>a+b))/2;return wd.map(w=>{x+=w;return x-w/2})})().map((cx,i)=>[cx,"SQUIRMERS"[i]]).map(([cx,c],i)=>`<text x="${cx}" y="74" font-size="66" font-weight="900" font-family="Trebuchet MS,system-ui" text-anchor="middle" fill="url(#lg)" stroke="#5a1a30" stroke-width="5" paint-order="stroke" style="transform-box:fill-box;transform-origin:center;animation:wob ${1.2+i*.07}s ease-in-out ${i*.1}s infinite">${c}</text>`).join("")}
 <path d="M30 96 C80 82 130 108 180 94 C230 80 280 106 330 92 C360 84 380 92 392 96" stroke="url(#lg)" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="388" cy="93" r="3.4" fill="#fff"/><circle cx="389" cy="93" r="1.6" fill="#2a1020"/></svg></h1>`}
function menu(){if(G)G.over=true;const best=JSON.parse(localStorage.getItem("squirm.best")||"{}");const m=$("modal");m.hidden=false;let open=0;LEVELS.forEach((L,i)=>{if(i===0||best[i-1]!==undefined)open=i});
 m.innerHTML=`<div>${logo()}<div class="card"><p>The worms are lost! Guide them home to the burrow. Tap a skill, then tap a worm. Drag to look around.</p><div class="skillrow">${SKILLS.map(s=>`<span>${s.n}: ${s.d}</span>`).join("")}</div>
 <div class="levels">${LEVELS.map((L,i)=>`<button class="lv ${best[i]!==undefined?"done":""} ${i>open?"lock":""}" data-i="${i}" ${i>open?"disabled":""}><span class="num">${i+1}</span> ${L.n}<small>${best[i]!==undefined?`Best: ${best[i]} of ${L.N} home`:`Save ${L.need} of ${L.N}`}</small></button>`).join("")}</div></div></div>`;
 m.querySelectorAll(".lv[data-i]").forEach(b=>b.onclick=()=>{audioInit();startLevel(+b.dataset.i)})}
requestAnimationFrame(loop);menu();
window.__sq={get G(){return G},startLevel,tick,assign,LEVELS,get worms(){return G.worms},solid,setSpeed:v=>speed=v};
</script>
</body>
