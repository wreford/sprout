function slide(f1,f2,d,type,v){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f1,AC.currentTime);o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);g.gain.value=v||.08;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function noise(d,v){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(rnd()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v||.1;s.connect(g);g.connect(AC.destination);s.start()}
function sfx(k){if(speed>1&&(k==="dig"||k==="brick"))return;({assign:()=>slide(500,900,.12,"triangle",.07),dig:()=>noise(.06,.04),brick:()=>beep(700+rnd()*200,.05,"square",.03),tick:()=>beep(1200,.03,"square",.03),shrug:()=>slide(400,250,.2,"triangle",.06),clank:()=>beep(180,.12,"square",.07),
 pop:()=>{noise(.25,.2);slide(300,60,.3,"sawtooth",.08)},splat:()=>{noise(.15,.1);slide(300,80,.15,"sine",.1)},land:()=>slide(200,120,.06,"sine",.05),spring:()=>{slide(180,900,.18,"square",.05);setTimeout(()=>slide(700,300,.2,"sine",.05),120)},crunch:()=>{noise(.07,.09);beep(900,.05,"square",.04)},spike:()=>{slide(900,120,.18,"sawtooth",.08);noise(.1,.08)},boing:()=>{slide(120,520,.12,"sine",.08);setTimeout(()=>slide(500,180,.14,"sine",.05),90)},splash:()=>noise(.3,.08),yay:()=>{slide(600,1200,.15,"triangle",.07)},
 win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,"triangle",.09),i*120)),lose:()=>[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.25,"triangle",.08),i*180))})[k]?.()}
// ---------------------------------------------------------------- menu
const TITLE="SQUIRMERS";
function logo(){return `<h1 class="logo"><svg viewBox="0 0 420 110" width="100%" style="max-width:460px"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff59a"/><stop offset="1" stop-color="#ffb81a"/></linearGradient><linearGradient id="lw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb6cb"/><stop offset="1" stop-color="#ff6f98"/></linearGradient></defs>
 ${(()=>{const wd=[...TITLE].map(c=>c==="I"?16:c==="M"||c==="W"?44:c==="O"?36:31);let x=(420-wd.reduce((a,b)=>a+b))/2;return wd.map(w=>{x+=w;return x-w/2})})().map((cx,i)=>[cx,TITLE[i]]).map(([cx,c],i)=>`<text x="${cx}" y="74" font-size="50" font-weight="900" font-style="italic" font-family="Georgia,serif" text-anchor="middle" fill="url(#lg)" stroke="#000" stroke-width="5" paint-order="stroke" style="transform-box:fill-box;transform-origin:center;animation:wob ${1.2+i*.07}s ease-in-out ${i*.1}s infinite">${c}</text>`).join("")}
 <path d="M30 96 C80 82 130 108 180 94 C230 80 280 106 330 92 C360 84 380 92 392 96" stroke="url(#lw)" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="388" cy="93" r="3.4" fill="#fff"/><circle cx="389" cy="93" r="1.6" fill="#2a1020"/></svg></h1>`}
function menu(){if(G)G.over=true;const best=JSON.parse(localStorage.getItem("squirm.best")||"{}"),apb=JSON.parse(localStorage.getItem("squirm.apples")||"{}"),stb=JSON.parse(localStorage.getItem("squirm.stars")||"{}");const m=$("modal");m.hidden=false;let open=0;LEVELS.forEach((L,i)=>{if(i===0||best[i-1]!==undefined)open=i});
 m.innerHTML=`<div>${logo()}<div class="card"><p>The springy worms are lost! Guide them to the flower. Tap a skill, then tap a worm. Drag to look around.</p><div class="skillrow">${SKILLS.map(s=>`<span>${s.n}: ${s.d}</span>`).join("")}</div>
 <div class="levels">${LEVELS.map((L,i)=>`<button class="lv ${best[i]!==undefined?"done":""} ${i>open?"lock":""}" data-i="${i}" ${i>open?"disabled":""}><span class="num">${i+1}</span> ${L.n}<span class="st">${stb[i]?"★".repeat(stb[i])+"☆".repeat(3-stb[i]):""}</span><small>${best[i]!==undefined?`Best: ${best[i]} of ${L.N} · 🍎 ${(apb[i]||0)}/${(L.ap||[]).length}`:`Save ${L.need} of ${L.N}`}</small></button>`).join("")}</div></div></div>`;
 m.querySelectorAll(".lv[data-i]").forEach(b=>b.onclick=()=>{audioInit();startLevel(+b.dataset.i)})}
requestAnimationFrame(loop);menu();
window.__sq={get G(){return G},startLevel,tick,assign,LEVELS,get worms(){return G.worms},solid,setSpeed:v=>speed=v};
</script>
