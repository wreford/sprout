<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="Blended Zebra — an endless black/white/red deckbuilder. Blend cards. Climb forever. The savanna keeps score.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23000'/%3E%3Cpath d='M4 6 l6 20 M11 4 l6 24 M18 4 l6 24 M25 6 l4 20' stroke='%23fff' stroke-width='3' fill='none'/%3E%3Ccircle cx='24' cy='8' r='5' fill='%23e8232a'/%3E%3C/svg%3E">
<title>Blended Zebra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --k:#000; --w:#fff; --r:#e8232a;
  --disp:'Sora',-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  font-family:var(--disp);color:var(--w);background:var(--k)}
#app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px)}
.page{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:100%}
.hide{display:none!important}
.kick{font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.24em;color:var(--r);text-transform:uppercase}
h1{font-weight:900;font-size:clamp(34px,10vw,58px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
h1 .z{color:var(--r)}
.stripes{height:10px;background:repeating-linear-gradient(-55deg,var(--w) 0 14px,var(--k) 14px 28px)}
.btn{display:block;width:100%;padding:15px 20px;border:2px solid var(--w);background:var(--w);color:var(--k);
  font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;min-height:54px}
.btn:active{transform:translate(2px,2px)}
.btn.red{background:var(--r);border-color:var(--r);color:var(--w)}
.btn.ghost{background:none;color:var(--w)}
.btn:disabled{opacity:.35}
/* HUD */
#hud{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid #ffffff55;padding:.35em .7em;font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.06em;white-space:nowrap}
.pill b{color:var(--r)}
#hpbar{height:14px;border:2px solid var(--w);position:relative}
#hpbar div{height:100%;background:var(--r);transition:width .3s}
#hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.1em}
/* enemy */
#foe{border:2px solid var(--w);padding:14px;display:flex;gap:14px;align-items:center;position:relative}
#foeArt{width:92px;height:92px;flex-shrink:0;border:2px solid var(--w);overflow:hidden;position:relative}
#foeArt .jtm{position:absolute;inset:0;background-size:cover;background-position:center}
#foeName{font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:.02em}
#foeHp{height:10px;border:1.5px solid var(--w);margin-top:6px}
#foeHp div{height:100%;background:var(--r);transition:width .3s}
#intent{font-family:var(--mono);font-weight:800;font-size:12px;margin-top:7px;color:var(--w)}
#intent b{color:var(--r)}
#foeStats{font-family:var(--mono);font-size:10px;color:#ffffff88;margin-top:4px;letter-spacing:.06em}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* hand */
#hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.card{border:2px solid var(--w);background:var(--k);cursor:pointer;position:relative;display:flex;flex-direction:column;
  min-height:150px;transition:transform .1s}
.card:active{transform:scale(.96)}
.card.unplayable{opacity:.4}
.card .cost{position:absolute;top:-2px;left:-2px;width:26px;height:26px;background:var(--r);color:var(--w);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:13px;z-index:2}
.card .art{height:56px;border-bottom:2px solid var(--w);position:relative;overflow:hidden;background:var(--k)}
.card .art .jtm{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.15)}
.card .nm{font-weight:900;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;padding:6px 7px 2px;line-height:1.15}
.card .fx{font-family:var(--mono);font-weight:700;font-size:9.5px;color:#ffffffbb;padding:2px 7px 8px;line-height:1.5;flex:1}
.card .fx b{color:var(--r)}
.card.blend{border-color:var(--r)}
.card.blend .nm{color:var(--r)}
.card.pow .art{background:repeating-linear-gradient(45deg,#111 0 8px,#000 8px 16px)}
.card.sel{outline:3px solid var(--r);outline-offset:2px}
/* battle bottom */
#btm{display:flex;gap:8px;align-items:center}
#energy{width:52px;height:52px;border:2px solid var(--r);color:var(--w);background:var(--k);flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800}
#energy b{font-size:19px;color:var(--r)}
#energy span{font-size:8px;letter-spacing:.1em}
#piles{font-family:var(--mono);font-size:10px;color:#ffffff88;letter-spacing:.08em;line-height:1.8}
/* map doors */
.door{border:2px solid var(--w);padding:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.door:active{transform:translate(2px,2px)}
.door .dn{font-weight:900;font-size:16px;text-transform:uppercase}
.door .dd{font-family:var(--mono);font-size:10px;color:#ffffff88;letter-spacing:.06em;margin-top:3px}
.door .ic{font-size:24px}
.door.elite{border-color:var(--r)} .door.elite .dn{color:var(--r)}
/* overlays / lists */
.big{font-weight:900;font-size:clamp(24px,7vw,40px);text-transform:uppercase;letter-spacing:-.02em;line-height:1}
.big .z{color:var(--r)}
.sub{font-family:var(--mono);font-size:12px;color:#ffffffaa;line-height:1.9;letter-spacing:.03em}
.ach{border:1.5px solid #ffffff44;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.ach .an{font-weight:800;font-size:13px;text-transform:uppercase}
.ach .ap{font-family:var(--mono);font-size:10px;color:#ffffff88;letter-spacing:.05em;margin-top:2px}
.ach .tick{font-family:var(--mono);font-weight:800;color:var(--r);font-size:12px;white-space:nowrap}
#toast{position:fixed;left:50%;top:12%;transform:translateX(-50%) scale(0);z-index:40;pointer-events:none;
  font-family:var(--mono);font-weight:800;font-size:clamp(11px,3vmin,15px);letter-spacing:.06em;text-transform:uppercase;
  background:var(--w);color:var(--k);border:3px solid var(--r);padding:.55em 1.1em;white-space:nowrap;
  transition:transform .18s cubic-bezier(.2,1.6,.4,1)}
#toast.on{transform:translateX(-50%) scale(1) rotate(-1.5deg)}
.relicRow{display:flex;gap:6px;flex-wrap:wrap}
.relic{border:1.5px solid var(--r);padding:.3em .55em;font-family:var(--mono);font-weight:800;font-size:9.5px;letter-spacing:.04em;color:var(--w)}
.zline{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#ffffff88;line-height:2}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   BLENDED ZEBRA · endless B/W/R deckbuilder · StS-blooded
   ============================================================
   JTM MEDIA FORMAT (v1) — drop-in art for cards/enemies/relics.
   Put images in /zebra/art/ and register them here (or just name
   the file after the art key — the loader auto-tries art/<key>.png,
   .jpg, .webp in that order). Entry options:
     JTM.manifest['card-bite'] = {
       src: 'art/card-bite.png',   // optional if file is named after key
       fit: 'cover'|'contain',     // default cover
       px: .5, py: .3,             // focus point 0..1 (background-position)
       mono: true,                 // force grayscale+contrast (default true —
     };                            //   keeps grok art on-palette)
   Anything without an image gets procedural zebra art. Send images
   any time; nothing else in the game needs to change.
   ============================================================ */
const JTM = {
  version: 1,
  base: 'art/',
  exts: ['png', 'jpg', 'webp'],
  manifest: {},            /* key -> entry (see above) */
  cache: {},               /* key -> resolved url | null */
  resolve(key, cb){
    if (key in this.cache) return cb(this.cache[key]);
    const entry = this.manifest[key] || {};
    const tries = entry.src ? [entry.src] : this.exts.map(e => this.base + key + '.' + e);
    const next = i => {
      if (i >= tries.length){ this.cache[key] = null; cb(null); return; }
      const img = new Image();
      img.onload = () => { this.cache[key] = tries[i]; cb(tries[i]); };
      img.onerror = () => next(i + 1);
      img.src = tries[i];
    };
    next(0);
  },
  css(key, el){
    this.resolve(key, url => {
      if (!url || !el.isConnected) return;
      const m = this.manifest[key] || {};
      const d = document.createElement('div');
      d.className = 'jtm';
      d.style.backgroundImage = `url(${url})`;
      d.style.backgroundSize = m.fit === 'contain' ? 'contain' : 'cover';
      d.style.backgroundRepeat = 'no-repeat';
      d.style.backgroundPosition = `${(m.px ?? .5) * 100}% ${(m.py ?? .5) * 100}%`;
      if (m.mono === false) d.style.filter = 'none';
      el.prepend(d);
    });
  },
};

const $ = s => document.querySelector(s);
const app = document.getElementById('app');
const ri = n => Math.floor(Math.random() * n);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[ri(a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let toastT = null;
function toast(m, ms = 1600){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}

/* ---------- procedural zebra art (fallback when no JTM image) ---------- */
function zart(seed, accent = false){
  let s = 0; for (const c of seed) s = (s * 31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => (s = (s * 1103515245 + 12345) >>> 0) / 4294967296;
  let stripes = '';
  for (let i = 0; i < 7; i++){
    const x = i * 16 + rnd() * 8, w = 5 + rnd() * 8, k = rnd() * 30 - 15;
    stripes += `<path d="M${x} -10 q ${k} 40 ${k * .4} 80" stroke="${accent && i === 3 ? 'var(--r)' : '#fff'}" stroke-width="${w}" fill="none"/>`;
  }
  const eye = rnd() > .5 ? `<circle cx="${20 + rnd() * 60}" cy="${14 + rnd() * 24}" r="4" fill="var(--r)"/>` : '';
  return `<svg viewBox="0 0 110 60" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0">${stripes}${eye}</svg>`;
}

/* ============================================================
   CARDS · base set + infinite blends
   ============================================================ */
const BASE_CARDS = [
  { id: 'bite', name: 'Bite', cost: 1, type: 'atk', dmg: 6, desc: 'Deal <b>6</b>.' },
  { id: 'kick', name: 'Kick', cost: 1, type: 'atk', dmg: 8, desc: 'Deal <b>8</b>.' },
  { id: 'tailwhip', name: 'Tail Whip', cost: 0, type: 'atk', dmg: 3, desc: 'Deal <b>3</b>.' },
  { id: 'headbutt', name: 'Headbutt', cost: 1, type: 'atk', dmg: 11, self: 2, desc: 'Deal <b>11</b>. Take <b>2</b>.' },
  { id: 'stampede', name: 'Stampede', cost: 2, type: 'atk', dmg: 15, desc: 'Deal <b>15</b>.' },
  { id: 'charge', name: 'Charge', cost: 2, type: 'atk', dmg: 10, draw: 1, desc: 'Deal <b>10</b>. Draw 1.' },
  { id: 'frenzy', name: 'Frenzy', cost: 1, type: 'atk', frenzy: true, desc: 'Deal <b>3×</b> cards played this turn.' },
  { id: 'muzzle', name: 'Muzzle Jab', cost: 1, type: 'atk', dmg: 5, weak: 1, desc: 'Deal <b>5</b>. Foe −2 attack next turn.' },
  { id: 'hide', name: 'Hide', cost: 1, type: 'skl', blk: 6, desc: 'Block <b>6</b>.' },
  { id: 'herd', name: 'Herd Up', cost: 1, type: 'skl', blk: 9, desc: 'Block <b>9</b>.' },
  { id: 'dust', name: 'Dust Bath', cost: 1, type: 'skl', blk: 4, draw: 1, desc: 'Block <b>4</b>. Draw 1.' },
  { id: 'zoomies', name: 'Zoomies', cost: 1, type: 'skl', draw: 2, desc: 'Draw <b>2</b>.' },
  { id: 'graze', name: 'Graze', cost: 1, type: 'skl', heal: 3, desc: 'Heal <b>3</b>.' },
  { id: 'bray', name: 'Bray', cost: 0, type: 'skl', weak: 1, desc: 'Foe −2 attack next turn.' },
  { id: 'stripes', name: 'Stripes', cost: 2, type: 'pow', str: 1, desc: '<b>Power:</b> +1 damage on all attacks.' },
  { id: 'thickhide', name: 'Thick Hide', cost: 2, type: 'pow', autoblk: 2, desc: '<b>Power:</b> +2 block every turn.' },
];
const cardById = {};
BASE_CARDS.forEach(c => cardById[c.id] = c);
function mkCard(id){ return { ...cardById[id], uid: Math.random().toString(36).slice(2) }; }
/* blend two cards → portmanteau hybrid */
function blendName(a, b){
  const A = a.split(' ')[0], B = b.split(' ').pop();
  return A.slice(0, Math.ceil(A.length / 2)) + B.slice(Math.floor(B.length / 2)).toLowerCase();
}
function blendCards(a, b){
  const c = {
    uid: Math.random().toString(36).slice(2),
    id: 'blend', name: blendName(a.name, b.name),
    cost: Math.max(1, Math.round((a.cost + b.cost) / 2)),
    type: (a.type === 'pow' || b.type === 'pow') ? 'pow' : (a.dmg || b.dmg || a.frenzy || b.frenzy) ? 'atk' : 'skl',
    blend: true,
    dmg: Math.round(((a.dmg || 0) + (b.dmg || 0)) * .85) || undefined,
    blk: Math.round(((a.blk || 0) + (b.blk || 0)) * .85) || undefined,
    draw: ((a.draw || 0) + (b.draw || 0)) || undefined,
    heal: ((a.heal || 0) + (b.heal || 0)) || undefined,
    weak: ((a.weak || 0) + (b.weak || 0)) || undefined,
    str: ((a.str || 0) + (b.str || 0)) || undefined,
    autoblk: ((a.autoblk || 0) + (b.autoblk || 0)) || undefined,
    self: ((a.self || 0) + (b.self || 0)) || undefined,
    frenzy: a.frenzy || b.frenzy || undefined,
  };
  const bits = [];
  if (c.dmg) bits.push(`Deal <b>${c.dmg}</b>.`);
  if (c.frenzy) bits.push(`Deal <b>3×</b> cards played.`);
  if (c.self) bits.push(`Take <b>${c.self}</b>.`);
  if (c.blk) bits.push(`Block <b>${c.blk}</b>.`);
  if (c.draw) bits.push(`Draw ${c.draw}.`);
  if (c.heal) bits.push(`Heal <b>${c.heal}</b>.`);
  if (c.weak) bits.push(`Foe −2 atk.`);
  if (c.str) bits.push(`<b>Power:</b> +${c.str} str.`);
  if (c.autoblk) bits.push(`<b>Power:</b> +${c.autoblk} blk/turn.`);
  c.desc = bits.join(' ');
  return c;
}

/* ---------- relics ---------- */
const RELICS = [
  { id: 'saltlick', name: 'Salt Lick', desc: '+6 max HP', hp: 6 },
  { id: 'oxpecker', name: 'Oxpecker Pal', desc: 'Heal 4 after each battle', healAfter: 4 },
  { id: 'thirdstripe', name: 'Third Stripe', desc: '+1 draw on turn 1', firstDraw: 1 },
  { id: 'hoofguard', name: 'Hoof Guard', desc: '+2 block every turn', autoblk: 2 },
  { id: 'redmane', name: 'Red Mane', desc: '+1 damage on all attacks', str: 1 },
  { id: 'watering', name: 'Watering Hole', desc: '+35% stripes from battles', goldMul: .35 },
  { id: 'darkstripe', name: 'Dark Stripe', desc: 'First attack each battle +6', firstHit: 6 },
  { id: 'braveheart', name: 'Brave Heart', desc: '+1 energy every 3rd turn', energy3: true },
];
function genRelic(n){    /* infinite relic ladder for deep floors */
  const kinds = [
    f => ({ name: `Stripe Totem ${roman(f)}`, desc: `+${4 + f * 2} max HP`, hp: 4 + f * 2 }),
    f => ({ name: `War Paint ${roman(f)}`, desc: `+${f} damage on all attacks`, str: f }),
    f => ({ name: `Dazzle Sigil ${roman(f)}`, desc: `+${f * 2} block every turn`, autoblk: f * 2 }),
    f => ({ name: `Grass Charm ${roman(f)}`, desc: `Heal ${2 + f * 2} after battle`, healAfter: 2 + f * 2 }),
  ];
  const k = kinds[n % kinds.length](Math.floor(n / kinds.length) + 1);
  return { id: 'gen' + n, ...k };
}
function roman(n){ const R = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X']; return n <= 10 ? R[n] : 'X' + roman(n - 10); }

/* ---------- enemies · endless scaling ---------- */
const FOES = [
  { id: 'hyena', name: 'Giggling Hyena', hp: 14, atk: 5, pat: ['atk', 'atk', 'blk'] },
  { id: 'vulture', name: 'Smug Vulture', hp: 12, atk: 4, pat: ['atk', 'buff', 'atk'] },
  { id: 'jackal', name: 'Side-Eye Jackal', hp: 18, atk: 6, pat: ['atk', 'blk', 'atk'] },
  { id: 'croc', name: 'Pond Croc', hp: 26, atk: 8, pat: ['blk', 'atk', 'atk'] },
  { id: 'baboon', name: 'Loud Baboon', hp: 22, atk: 7, pat: ['buff', 'atk', 'atk'] },
  { id: 'lioness', name: 'Bored Lioness', hp: 30, atk: 9, pat: ['atk', 'atk', 'buff'] },
];
const BOSSES = [
  { id: 'alpha', name: 'ALPHA HYENA', hp: 60, atk: 11, pat: ['atk', 'atk', 'buff', 'atk'] },
  { id: 'lion', name: 'THE LION HIMSELF', hp: 80, atk: 13, pat: ['buff', 'atk', 'atk', 'blk'] },
  { id: 'crocking', name: 'CROC KING', hp: 100, atk: 15, pat: ['blk', 'atk', 'buff', 'atk'] },
  { id: 'blender', name: 'THE BLENDER', hp: 130, atk: 17, pat: ['atk', 'buff', 'atk', 'atk'] },
];
/* ---------- THE ROGUES' GALLERY · fictional villain archetypes (elites) ---------- */
const VILLAINS = [
  { id: 'felon', name: 'THE FELON', ep: 'CONVICTED OF EVERYTHING', hp: 34, atk: 9, pat: ['atk', 'atk', 'blk'] },
  { id: 'grifter', name: 'THE GRIFTER', ep: 'FEES UPON FEES', hp: 30, atk: 8, pat: ['buff', 'atk', 'atk'] },
  { id: 'pharmabro', name: 'THE PHARMA BRO', ep: 'PRICE: YES', hp: 32, atk: 8, pat: ['atk', 'buff', 'atk'] },
  { id: 'landlord', name: 'THE LANDLORD', ep: 'THE HEAT IS DECORATIVE', hp: 40, atk: 7, pat: ['blk', 'atk', 'atk'] },
  { id: 'tyrant', name: 'THE TYRANT', ep: 'MEDALS SELF-AWARDED', hp: 38, atk: 10, pat: ['buff', 'atk', 'blk', 'atk'] },
  { id: 'influencer', name: 'THE INFLUENCER', ep: 'CRIMES AGAINST CONTENT', hp: 28, atk: 9, pat: ['atk', 'atk', 'buff'] },
];
/* chibi pixel-style portraits · grayscale + red accent, crisp edges */
function VART(id){
  const P = { k: '#0a0a0a', d: '#3a3a3a', m: '#7a7a7a', l: '#c8c8c8', w: '#f2f2f2', r: 'var(--r)' };
  const head = (skin = P.l) => `
    <rect x="38" y="18" width="44" height="40" fill="${skin}"/>
    <rect x="34" y="26" width="4" height="20" fill="${skin}"/><rect x="82" y="26" width="4" height="20" fill="${skin}"/>
    <rect x="44" y="34" width="10" height="5" fill="${P.k}"/><rect x="66" y="34" width="10" height="5" fill="${P.k}"/>
    <rect x="42" y="28" width="14" height="4" fill="${P.k}"/><rect x="64" y="28" width="14" height="4" fill="${P.k}" transform="translate(142 0) scale(-1 1)"/>
    <rect x="52" y="50" width="16" height="4" fill="${P.k}"/>`;
  const legs = `<rect x="44" y="118" width="12" height="22" fill="${P.d}"/><rect x="64" y="118" width="12" height="22" fill="${P.d}"/>
    <rect x="40" y="138" width="18" height="7" fill="${P.k}"/><rect x="62" y="138" width="18" height="7" fill="${P.k}"/>`;
  const art = {
    felon: `
      ${head()}
      <rect x="36" y="8" width="48" height="12" fill="${P.d}"/>
      <rect x="34" y="60" width="52" height="58" fill="${P.w}"/>
      ${[0, 1, 2].map(i => `<rect x="34" y="${66 + i * 16}" width="52" height="8" fill="${P.k}"/>`).join('')}
      <rect x="40" y="62" width="18" height="8" fill="${P.r}"/><text x="42" y="69" font-family="monospace" font-size="7" font-weight="800" fill="${P.w}">0001</text>
      <rect x="20" y="112" width="16" height="16" fill="${P.d}"/><rect x="26" y="100" width="4" height="14" fill="${P.d}"/>
      ${legs}`,
    grifter: `
      ${head()}
      <rect x="36" y="10" width="48" height="10" fill="${P.k}"/>

function scaleFoe(base, floor, mult = 1){
  const s = 1 + floor * .13;
  return {
    ...base, mhp: Math.round(base.hp * s * mult), hp: Math.round(base.hp * s * mult),
    atk: Math.round(base.atk * (1 + floor * .09) * mult),
    blk: 0, str: 0, pi: 0, weak: 0,
  };
}
function makeFoe(floor, kind){
  if (kind === 'boss'){
    const b = BOSSES[(Math.floor(floor / 5) - 1) % BOSSES.length];
    const cycles = Math.floor((Math.floor(floor / 5) - 1) / BOSSES.length);
    return scaleFoe(b, floor, 1 + cycles * .6);
  }
  if (kind === 'elite'){
    /* elites are the Rogues' Gallery — fictional villain archetypes */
    const v = pick(VILLAINS);
    const foe = scaleFoe(v, floor, 1.15);
    foe.vill = true;
    return foe;
  }
  const f = pick(FOES.slice(0, clamp(2 + Math.floor(floor / 2), 2, FOES.length)));
  return scaleFoe(f, floor, 1);
}

/* ============================================================
   META · stripes, infinite achievements, infinite unlocks
   ============================================================ */
const ACH_FAMS = [
  ['damage', 'Damage Dealt', 'stat'], ['cards', 'Cards Played', 'stat'], ['blocks', 'Block Gained', 'stat'],
  ['kills', 'Foes Dropped', 'stat'], ['blends', 'Cards Blended', 'stat'], ['floors', 'Best Floor', 'max'],
  ['runs', 'Runs Started', 'stat'], ['bosses', 'Bosses Beaten', 'stat'],
];
const thresh = n => Math.round(10 * Math.pow(2.7, n));            /* 10, 27, 73, 197… forever */
function defaultMeta(){
  return { stripes: 0, herd: 0, unlocks: 0, stats: { damage: 0, cards: 0, blocks: 0, kills: 0, blends: 0, floors: 0, runs: 0, bosses: 0 },
    achTiers: {}, bonusHp: 0, bonusStripe: 0, startRelics: 0 };
}
let META = defaultMeta();
function loadMeta(){
  try { META = { ...defaultMeta(), ...JSON.parse(localStorage.getItem('zebra-meta') || '{}') }; }
  catch {}
  META.stats = { ...defaultMeta().stats, ...(META.stats || {}) };
}
function saveMeta(){ localStorage.setItem('zebra-meta', JSON.stringify(META)); }
function bumpStat(k, n, isMax = false){
  if (isMax) META.stats[k] = Math.max(META.stats[k], n);
  else META.stats[k] += n;
  const fam = ACH_FAMS.find(f => f[0] === k);
  if (!fam) return;
  let tier = META.achTiers[k] || 0;
  while (META.stats[k] >= thresh(tier)){
    tier++;
    META.achTiers[k] = tier;
    META.stripes += tier * 5;
    toast(`🏆 ${fam[1]} ${roman(tier)} · +${tier * 5} STRIPES`, 2000);
  }
  saveMeta();
}
/* infinite unlock ladder */
function unlockDef(n){
  const kinds = [
    i => ({ name: `Thicker Hide ${roman(i)}`, desc: `+${3 + i} starting max HP`, apply: m => m.bonusHp += 3 + i }),
    i => ({ name: `Scavenger ${roman(i)}`, desc: `+${5 * i} stripes after every battle`, apply: m => m.bonusStripe += 5 * i }),
    i => ({ name: `Herd Blessing ${roman(i)}`, desc: `Start each run with a bonus relic`, apply: m => m.startRelics += 1 }),
  ];
  const i = Math.floor(n / kinds.length) + 1;
  return { cost: Math.round(40 * Math.pow(1.7, n)), ...kinds[n % kinds.length](i) };
}

let R = null;
function newRun(){
  R = {
    floor: 0, hp: 60 + META.bonusHp, mhp: 60 + META.bonusHp, stripes: 0,

    relics: [], turn: 0,
  };
  for (let i = 0; i < META.startRelics; i++) R.relics.push(pick(RELICS));
  bumpStat('runs', 1);
  saveRun();
}

function loadRun(){

}
function relicSum(k){ return R.relics.reduce((s, r) => s + (r[k] || 0), 0); }

/* ---------- battle ---------- */
let B = null;
function startBattle(kind){
  const foe = makeFoe(R.floor, kind === 'boss' ? 'boss' : kind === 'elite' ? 'elite' : 'normal');
  B = { foe, kind, hand: [], drawPile: [...R.deck].sort(() => Math.random() - .5), discard: [],
    energy: 3, maxEnergy: 3, block: 0, str: relicSum('str'), autoblk: relicSum('autoblk'),
    played: 0, turn: 1, firstHit: relicSum('firstHit'), over: false };
  drawCards(5 + relicSum('firstDraw'));
  renderBattle();
}
function drawCards(n){
  for (let i = 0; i < n; i++){
    if (!B.drawPile.length){
      B.drawPile = B.discard.sort(() => Math.random() - .5);
      B.discard = [];
      if (!B.drawPile.length) return;
    }
    if (B.hand.length < 10) B.hand.push(B.drawPile.pop());
    else B.discard.push(B.drawPile.pop());
  }
}
function foeIntent(){
  const f = B.foe;
  const kind = f.pat[f.pi % f.pat.length];
  if (kind === 'atk'){
    const n = Math.max(1, f.atk + f.str - (f.weak ? 2 : 0));
    return `INTENT: <b>ATTACK ${n}</b>`;
  }
  if (kind === 'blk') return 'INTENT: BRACING (+block)';
  return 'INTENT: <b style="color:var(--r)">GETTING ANGRIER</b> (+attack)';
}
function renderBattle(){
  app.innerHTML = '';
  const f = B.foe;
  const p = el(`<div class="page">
    ${hudHtml()}
    <div id="foe">
      <div id="foeArt" data-art="foe-${f.id}">${f.vill ? VART(f.id) : zart(f.id + f.name, true)}</div>
      <div style="flex:1">

        ${f.ep ? `<div style="font-family:var(--mono);font-weight:800;font-size:9.5px;letter-spacing:.1em;color:var(--r)">(${f.ep})</div>` : ''}
        <div id="foeHp"><div style="width:${f.hp / f.mhp * 100}%"></div></div>
        <div id="intent">${foeIntent()}</div>
        <div id="foeStats">HP ${f.hp}/${f.mhp}${f.blk ? ' · BLK ' + f.blk : ''}${f.str ? ' · STR +' + f.str : ''}${f.weak ? ' · WEAKENED' : ''}</div>
      </div>
    </div>
    <div class="zline">YOU · BLOCK <b style="color:var(--w)">${B.block}</b>${B.str ? ' · STR +' + B.str : ''}${B.autoblk ? ' · AUTO-BLK ' + B.autoblk : ''} · TURN ${B.turn}</div>
    <div id="hand"></div>
    <div id="btm">
      <div id="energy"><b>${B.energy}</b><span>ENERGY</span></div>
      <div id="piles">DRAW ${B.drawPile.length}<br>DISCARD ${B.discard.length}</div>
      <button class="btn red" id="bEnd" style="flex:1">End turn</button>
    </div>
  </div>`);
  app.appendChild(p);
  JTM.css('foe-' + f.id, $('#foeArt'));
  const hand = $('#hand');
  B.hand.forEach((c, i) => {
    const cd = el(cardHtml(c, B.energy < c.cost));
    cd.onclick = () => playCard(i);
    hand.appendChild(cd);
    JTM.css('card-' + c.id, cd.querySelector('.art'));
  });
  $('#bEnd').onclick = endTurn;
}
function cardHtml(c, unplayable = false){
  return `<div class="card ${c.type === 'pow' ? 'pow' : ''} ${c.blend ? 'blend' : ''} ${unplayable ? 'unplayable' : ''}">
    <div class="cost">${c.cost}</div>
    <div class="art" data-art="card-${c.id}">${zart(c.name + c.id, c.type === 'atk')}</div>
    <div class="nm">${c.name}</div>
    <div class="fx">${c.desc}</div>
  </div>`;
}
function playCard(i){
  if (B.over) return;
  const c = B.hand[i];
  if (!c || B.energy < c.cost) return;
  B.energy -= c.cost;
  B.played++;
  bumpStat('cards', 1);
  let dmg = 0;
  if (c.frenzy) dmg = 3 * B.played;
  else if (c.dmg) dmg = c.dmg;
  if (dmg){
    dmg += B.str;
    if (B.firstHit){ dmg += B.firstHit; B.firstHit = 0; }
    const f = B.foe;
    const absorbed = Math.min(f.blk, dmg);
    f.blk -= absorbed;
    f.hp -= (dmg - absorbed);
    bumpStat('damage', dmg);
    $('#foe') && $('#foe').classList.add('shake');
  }
  if (c.self) R.hp = Math.max(1, R.hp - c.self);
  if (c.blk){ B.block += c.blk; bumpStat('blocks', c.blk); }
  if (c.heal) R.hp = Math.min(R.mhp, R.hp + c.heal);
  if (c.weak) B.foe.weak = Math.max(B.foe.weak, c.weak + 1);
  if (c.str) B.str += c.str;
  if (c.autoblk) B.autoblk += c.autoblk;
  if (c.draw) drawCards(c.draw);
  B.hand.splice(i, 1);
  if (c.type !== 'pow') B.discard.push(c);
  if (B.foe.hp <= 0){ winBattle(); return; }
  renderBattle();
}
function endTurn(){
  if (B.over) return;
  /* foe acts */
  const f = B.foe;
  const kind = f.pat[f.pi % f.pat.length];
  f.pi++;
  if (kind === 'atk'){
    const n = Math.max(1, f.atk + f.str - (f.weak ? 2 : 0));
    const absorbed = Math.min(B.block, n);
    const through = n - absorbed;
    R.hp -= through;
    if (f.weak) f.weak--;
    if (through > 0 && R.hp <= 0){ loseRun(); return; }
  } else if (kind === 'blk') f.blk += Math.round(f.atk * .8);
  else f.str += 1 + Math.floor(R.floor / 8);
  /* new player turn */
  B.turn++;
  B.discard.push(...B.hand);
  B.hand = [];
  B.block = B.autoblk;
  if (B.autoblk) bumpStat('blocks', B.autoblk);
  B.energy = B.maxEnergy + (relicSum('energy3') && B.turn % 3 === 0 ? 1 : 0);
  drawCards(5);
  saveRun();
  renderBattle();
}
function winBattle(){
  B.over = true;
  bumpStat('kills', 1);
  if (B.kind === 'boss') bumpStat('bosses', 1);
  const base = (B.kind === 'boss' ? 40 : B.kind === 'elite' ? 22 : 12) + Math.floor(R.floor * 1.5);
  const gold = Math.round(base * (1 + relicSum('goldMul'))) + META.bonusStripe;
  R.stripes += gold;
  META.stripes += Math.floor(gold / 3);
  const heal = relicSum('healAfter');
  if (heal) R.hp = Math.min(R.mhp, R.hp + heal);
  saveMeta(); saveRun();
  screenReward(gold, B.kind);
}
function screenReward(gold, kind){
  const picks = [];
  const pool = BASE_CARDS.filter(c => !['bite', 'hide'].includes(c.id));
  while (picks.length < 3){
    const c = pick(pool);
    if (!picks.some(p => p.id === c.id) || Math.random() < .2) picks.push(mkCard(c.id));
  }
  /* deep floors offer pre-blended exotics */
  if (R.floor >= 8 && Math.random() < .4){
    picks[2] = blendCards(mkCard(pick(BASE_CARDS).id), mkCard(pick(BASE_CARDS).id));
  }
  app.innerHTML = '';
  const relicDrop = (kind === 'elite' || kind === 'boss');
  let relic = null;
  if (relicDrop){
    const owned = new Set(R.relics.map(r => r.id));
    const av = RELICS.filter(r => !owned.has(r.id));
    relic = av.length ? pick(av) : genRelic(R.relics.length);
  }
  const p = el(`<div class="page">
    ${hudHtml()}
    <div class="stripes"></div>
    <span class="kick">VICTORY · +${gold} ◆ STRIPES${relic ? ' · RELIC GET' : ''}</span>
    ${relic ? `<div class="ach"><div><div class="an" style="color:var(--r)">${relic.name}</div><div class="ap">${relic.desc}</div></div><div class="tick">RELIC</div></div>` : ''}
    <div class="big">Take a <span class="z">card</span></div>
    <div id="hand">${picks.map((c, i) => `<div data-i="${i}">${cardHtml(c)}</div>`).join('')}</div>
    <button class="btn ghost" id="bSkip">Skip card</button>
  </div>`);
  app.appendChild(p);
  if (relic){
    R.relics.push(relic);
    if (relic.hp){ R.mhp += relic.hp; R.hp += relic.hp; }
  }
  p.querySelectorAll('#hand > div').forEach(dv => {
    JTM.css('card-' + picks[+dv.dataset.i].id, dv.querySelector('.art'));
    dv.onclick = () => { R.deck.push(picks[+dv.dataset.i]); saveRun(); screenMap(); };
  });
  $('#bSkip').onclick = () => { saveRun(); screenMap(); };
}

function screenBlend(){

  });
  $('#bDo').onclick = () => {
    const [a, b] = sel.sort((x, y) => y - x);
    const nc = blendCards(R.deck[a], R.deck[b]);
    R.deck.splice(a, 1); R.deck.splice(b, 1);
    R.deck.push(nc);
    bumpStat('blends', 1);
    saveRun();
    toast(`⚡ BLENDED: ${nc.name.toUpperCase()}`, 2200);
    screenMap();
  };
  $('#bBack').onclick = screenRest;
}
/* ---------- shop ---------- */
function screenShop(){
  app.innerHTML = '';
  const cards = [mkCard(pick(BASE_CARDS).id), mkCard(pick(BASE_CARDS).id)];
  const cardCost = 25 + R.floor * 2;
  const healCost = 15 + R.floor;
  const owned = new Set(R.relics.map(r => r.id));
  const av = RELICS.filter(r => !owned.has(r.id));
  const relic = av.length ? pick(av) : genRelic(R.relics.length);
  const relicCost = 50 + R.floor * 3;
  const p = el(`<div class="page">
    ${hudHtml()}
    <div class="stripes"></div>
    <div class="big">Trading <span class="z">Post</span></div>
    <div class="sub">A meerkat with a ledger. It has seen things.</div>
    <div id="hand">${cards.map((c, i) => `<div data-i="${i}">${cardHtml(c)}</div>`).join('')}</div>
    <button class="btn" id="bC0">Buy card 1 · ◆ ${cardCost}</button>
    <button class="btn" id="bC1">Buy card 2 · ◆ ${cardCost}</button>
    <button class="btn" id="bRelic">${relic.name} (${relic.desc}) · ◆ ${relicCost}</button>
    <button class="btn" id="bHeal">Patch up · heal 20 · ◆ ${healCost}</button>
    <button class="btn red" id="bGo">Leave</button>
  </div>`);
  app.appendChild(p);
  p.querySelectorAll('#hand > div').forEach(dv => JTM.css('card-' + cards[+dv.dataset.i].id, dv.querySelector('.art')));
  const buy = (cost, fn, btn) => {
    if (R.stripes < cost){ toast('NOT ENOUGH STRIPES. THE MEERKAT SIGHS.'); return; }
    R.stripes -= cost; fn(); saveRun(); btn.disabled = true;
    screenShopRefresh();
  };
  function screenShopRefresh(){ $('#hud') && ($('#hud').outerHTML = hudHtml().match(/<div id="hud">[\s\S]*?<\/div>/)[0]); }
  $('#bC0').onclick = e => buy(cardCost, () => R.deck.push(cards[0]), e.target);
  $('#bC1').onclick = e => buy(cardCost, () => R.deck.push(cards[1]), e.target);
  $('#bRelic').onclick = e => buy(relicCost, () => { R.relics.push(relic); if (relic.hp){ R.mhp += relic.hp; R.hp += relic.hp; } }, e.target);
  $('#bHeal').onclick = e => buy(healCost, () => R.hp = Math.min(R.mhp, R.hp + 20), e.target);
  $('#bGo').onclick = screenMap;
}
/* ---------- death ---------- */
function loseRun(){
  const floor = R.floor;
  const earned = 10 + floor * 4;
  META.stripes += earned;
  META.herd++;
  saveMeta();
  R = null; saveRun();
  app.innerHTML = '';
  const p = el(`<div class="page" style="justify-content:center;text-align:center;gap:16px">
    <span class="kick">THE SAVANNA IS PATIENT</span>
    <div class="big">Run <span class="z">over</span></div>
    <div class="stripes"></div>
    <div class="sub">Fell on floor ${floor}.<br>+${earned} ◆ stripes · herd level up → ${META.herd}<br>
    ${pick(['The herd will speak of this. Briefly.', 'The lion sends its regards.', 'Blend harder next time.', 'The zebra regrets only the unblended.'])}</div>
    <button class="btn red" id="bAgain">Run it back</button>
    <button class="btn ghost" id="bTitle">Title</button>
  </div>`);
  app.appendChild(p);
  $('#bAgain').onclick = () => { newRun(); screenMap(); };
  $('#bTitle').onclick = screenTitle;
}
/* ---------- meta screens ---------- */
function screenUnlocks(){
  app.innerHTML = '';
  const n = META.unlocks;
  const items = [unlockDef(n), unlockDef(n + 1), unlockDef(n + 2)];
  const p = el(`<div class="page">
    <span class="kick">PERMANENT UNLOCKS · THE LADDER NEVER ENDS</span>
    <div class="big">Unlocks <span class="z">∞</span></div>
    <div class="sub">◆ ${META.stripes} stripes · ${n} claimed</div>
    <div class="stripes"></div>
    ${items.map((u, i) => `<div class="ach"><div><div class="an">${u.name}</div><div class="ap">${u.desc}</div></div>
      <button class="btn ${i === 0 ? 'red' : ''}" style="width:auto;min-height:40px;padding:8px 14px" data-i="${i}" ${i > 0 || META.stripes < u.cost ? 'disabled' : ''}>◆ ${u.cost}</button></div>`).join('')}
    <div class="sub">next tiers preview only — claim in order. the ladder is infinite. so is the zebra.</div>
    <button class="btn ghost" id="bBack">Back</button>
  </div>`);
  app.appendChild(p);
  p.querySelector('[data-i="0"]').onclick = () => {
    const u = unlockDef(META.unlocks);
    if (META.stripes < u.cost) return;
    META.stripes -= u.cost;
    u.apply(META);
    META.unlocks++;
    saveMeta();
    toast('UNLOCKED: ' + u.name.toUpperCase());
    screenUnlocks();
  };
  $('#bBack').onclick = screenTitle;
}
function screenAch(){
  app.innerHTML = '';
  const rows = ACH_FAMS.map(([k, label]) => {
    const tier = META.achTiers[k] || 0;
    const cur = META.stats[k], next = thresh(tier);
    return `<div class="ach"><div><div class="an">${label} ${roman(tier + 1)}</div>
      <div class="ap">${cur.toLocaleString()} / ${next.toLocaleString()}</div></div>
      <div class="tick">${tier ? '★' + tier : '—'}</div></div>`;
  }).join('');
  const totalTiers = Object.values(META.achTiers).reduce((a, b) => a + b, 0);
  const p = el(`<div class="page">
    <span class="kick">EVERY FAMILY TIERS FOREVER · ×2.7 EACH TIME</span>
    <div class="big">Achievements <span class="z">∞</span></div>
    <div class="sub">${totalTiers} tiers earned · each pays stripes on unlock</div>
    <div class="stripes"></div>
    ${rows}
    <button class="btn ghost" id="bBack">Back</button>
  </div>`);
  app.appendChild(p);
  $('#bBack').onclick = screenTitle;
}

/* ---------- boot ---------- */
loadMeta();
loadRun();
screenTitle();
window.ZB = { META, R: () => R, B: () => B, newRun, startBattle, playCard, endTurn, blendCards, mkCard,
  screenMap, screenTitle, JTM, bumpStat, unlockDef, thresh };   /* test hook */
</script>
</body>
</html>
