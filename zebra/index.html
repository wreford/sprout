<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="Blended Zebra — an endless black/white/red deckbuilder. Blend cards. Climb forever. The savanna keeps score.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23000'/%3E%3Cpath d='M4 6 l6 20 M11 4 l6 24 M18 4 l6 24 M25 6 l4 20' stroke='%23fff' stroke-width='3' fill='none'/%3E%3Ccircle cx='24' cy='8' r='5' fill='%23e8232a'/%3E%3C/svg%3E">
<title>Blended Zebra</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zebra">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --k:#000; --w:#fff; --r:#e8232a;
  --disp:'Sora',-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  font-family:var(--disp);color:var(--w);background:var(--k)}
#app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.page{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:100%}
.hide{display:none!important}
.kick{font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.24em;color:var(--r);text-transform:uppercase}
h1{font-weight:900;font-size:clamp(34px,10vw,58px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
h1 .z{color:var(--r)}
.stripes{height:10px;background:repeating-linear-gradient(-55deg,var(--w) 0 14px,var(--k) 14px 28px);
  background-size:200% 100%;animation:stripeMove 14s linear infinite}
@keyframes stripeMove{to{background-position:-80px 0}}
.page{animation:pageIn .28s cubic-bezier(.2,.9,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}}
.btn{display:block;width:100%;padding:15px 20px;border:2px solid var(--w);background:var(--w);color:var(--k);
  font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;min-height:54px}
.btn:active{transform:translate(2px,2px)}
.btn.red{background:var(--r);border-color:var(--r);color:var(--w)}
.btn.ghost{background:none;color:var(--w)}
.btn:disabled{opacity:.35}
/* HUD */
#hud{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid #ffffff55;padding:.35em .7em;font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.06em;white-space:nowrap}
.pill b{color:var(--r)}
#hpbar{height:14px;border:2px solid var(--w);position:relative;overflow:hidden}
#hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.1em;z-index:2}
/* enemy */
#foe{border:2px solid var(--w);padding:14px;display:flex;gap:14px;align-items:center;position:relative}
#foeArt{width:92px;height:92px;flex-shrink:0;border:2px solid var(--w);overflow:hidden;position:relative}
#foeArt .jtm{position:absolute;inset:0;background-size:cover;background-position:center}
#foeName{font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:.02em}
#foeHp{height:10px;border:1.5px solid var(--w);margin-top:6px;overflow:hidden}
#intent{font-family:var(--mono);font-weight:800;font-size:12px;margin-top:7px;color:var(--w)}
#intent b{color:var(--r)}
#foeStats{font-family:var(--mono);font-size:10px;color:#ffffff88;margin-top:4px;letter-spacing:.06em}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hitflash::after{content:'';position:absolute;inset:0;background:var(--r);animation:hflash .28s;pointer-events:none}
@keyframes hflash{0%{opacity:.55}100%{opacity:0}}
.card.played{transform:translateY(-34px) scale(1.08);opacity:0;transition:transform .16s,opacity .16s}
.fnum{position:fixed;z-index:50;font-family:var(--mono);font-weight:800;font-size:22px;pointer-events:none;
  text-shadow:2px 2px 0 #000;animation:fnum .8s forwards}
@keyframes fnum{from{transform:translateY(0);opacity:1}to{transform:translateY(-56px);opacity:0}}
#pflash{position:fixed;inset:0;z-index:45;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,var(--r));
  opacity:0}
#pflash.on{animation:pfl .4s}
@keyframes pfl{0%{opacity:.7}100%{opacity:0}}
#turnBanner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scaleX(0);z-index:44;pointer-events:none;
  background:var(--r);color:var(--w);font-family:var(--mono);font-weight:800;letter-spacing:.3em;font-size:14px;
  padding:.6em 2em;white-space:nowrap}
#turnBanner.on{animation:tb .8s}
@keyframes tb{0%{transform:translate(-50%,-50%) scaleX(0)}18%{transform:translate(-50%,-50%) scaleX(1)}
  82%{transform:translate(-50%,-50%) scaleX(1)}100%{transform:translate(-50%,-50%) scaleX(0)}}
.ceremony{position:fixed;inset:0;z-index:60;background:#000000e8;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px}
.ceremony .duo{display:flex;gap:10px;align-items:center}
.ceremony .duo .card{width:110px;min-height:150px;animation:slamIn .5s cubic-bezier(.6,0,.4,1) forwards}
.ceremony .duo .card:last-child{animation-name:slamIn2}
@keyframes slamIn{60%{transform:translateX(56px) rotate(-6deg)}
  75%{transform:translateX(53px) rotate(-4deg)}90%{transform:translateX(58px) rotate(-7deg)}to{transform:translateX(56px) rotate(-6deg)}}
@keyframes slamIn2{60%{transform:translateX(-56px) rotate(6deg)}
  75%{transform:translateX(-53px) rotate(4deg)}90%{transform:translateX(-58px) rotate(7deg)}to{transform:translateX(-56px) rotate(6deg)}}
.ceremony.suck .duo .card{animation:suckL .45s cubic-bezier(.7,-.3,1,.6) forwards}
.ceremony.suck .duo .card:last-child{animation-name:suckR}
@keyframes suckL{to{transform:translateX(64px) rotate(-560deg) scale(.02);opacity:.3;filter:blur(1.5px)}}
@keyframes suckR{to{transform:translateX(-64px) rotate(560deg) scale(.02);opacity:.3;filter:blur(1.5px)}}
.ceremony .result{width:140px;animation:resultPop .5s cubic-bezier(.2,1.7,.35,1)}
@keyframes resultPop{from{transform:scale(0) rotate(-24deg)}60%{transform:scale(1.12) rotate(3deg)}}
.ceremony .zap{font-weight:900;font-size:44px;color:var(--r);animation:zapPulse .5s infinite alternate}
@keyframes zapPulse{to{transform:scale(1.25)}}
.ceremony .flashX{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
.ceremony.boom .flashX{animation:hflash .45s ease-out}
.ceremony .shock{position:fixed;left:50%;top:50%;width:12px;height:12px;border:3px solid var(--w);border-radius:50%;
  transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.ceremony.boom .shock{animation:shockOut .55s ease-out}
@keyframes shockOut{0%{opacity:1;width:12px;height:12px;border-width:6px}100%{opacity:0;width:76vw;height:76vw;border-width:1px}}
.ceremony .resultWrap{position:relative;display:flex;align-items:center;justify-content:center}
.ceremony .rays{position:absolute;width:330px;height:330px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(#ffffff12 0 7deg,transparent 7deg 20deg);animation:raySpin 9s linear infinite;
  -webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%);mask-image:radial-gradient(circle,#000 30%,transparent 70%)}
.ceremony .rays.hotR{background:repeating-conic-gradient(#e8232a26 0 7deg,transparent 7deg 20deg)}
@keyframes raySpin{to{transform:rotate(360deg)}}
#stampV{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-8deg) scale(0);z-index:55;pointer-events:none;
  border:4px solid var(--r);color:var(--r);font-weight:900;font-size:clamp(30px,9.5vw,52px);letter-spacing:.05em;
  padding:.15em .5em;text-transform:uppercase;background:#000000cc}
#stampV.on{animation:stampIn .9s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stampIn{0%{transform:translate(-50%,-50%) rotate(-6deg) scale(1.7);opacity:0}
  35%{transform:translate(-50%,-50%) rotate(-6deg) scale(1);opacity:.94}
  100%{transform:translate(-50%,-50%) rotate(-6deg) scale(1);opacity:.94}}
.ovlDeck{position:fixed;inset:0;z-index:58;background:#000000f0;overflow-y:auto;padding:20px}
.hoardOvl{background:#000;z-index:60}
.ovlDeck .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-width:640px;margin:0 auto}
/* deep polish */
#wipe{position:fixed;inset:0;z-index:80;pointer-events:none;transform:translateX(-102%);
  background:repeating-linear-gradient(-55deg,var(--w) 0 22px,var(--k) 22px 44px)}
#wipe.go{animation:wipeX .52s cubic-bezier(.6,0,.4,1) forwards}
@keyframes wipeX{0%{transform:translateX(-102%)}45%{transform:translateX(0)}55%{transform:translateX(0)}100%{transform:translateX(102%)}}
#foeArt .jtm{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035) translateY(-1px)}}
.quip{position:absolute;right:6px;top:-14px;z-index:5;background:var(--w);color:var(--k);border:2px solid var(--k);
  font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.04em;padding:4px 8px;white-space:nowrap;
  animation:quipIn 2.2s forwards;pointer-events:none}
@keyframes quipIn{0%{transform:scale(0) rotate(4deg)}12%{transform:scale(1) rotate(-2deg)}
  80%{opacity:1;transform:translateY(0) rotate(-2deg)}100%{opacity:0;transform:translateY(-14px) rotate(-2deg)}}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.bcell{position:relative;border:2px solid #ffffff44;height:158px;overflow:hidden}
.bcell.locked .bart{filter:brightness(.14)}
.bcell .bart{position:absolute;inset:0 0 34px 0}
.bcell .bname{position:absolute;left:0;right:0;bottom:0;height:34px;padding:3px 5px;border-top:1.5px solid #ffffff33;
  font-family:var(--mono);font-weight:800;font-size:8.5px;letter-spacing:.04em;line-height:1.4}
.bcell .bname b{color:var(--r)}
.card.recHint{box-shadow:0 0 0 2px #e8232a44;animation:recShimmer 1.6s ease-in-out infinite}
@keyframes recShimmer{0%,100%{box-shadow:0 0 0 2px #e8232a33}50%{box-shadow:0 0 0 3px #e8232a66}}
.foeHit{animation:foeHit .28s ease}
@keyframes foeHit{0%{transform:translateX(0)}18%{transform:translateX(-7px) rotate(-1.6deg) scale(1.07,.9)}
  50%{transform:translateX(4px) rotate(1.2deg) scale(.97,1.04)}100%{transform:translateX(0) scale(1)}}
.foeDie{animation:foeDie .55s cubic-bezier(.6,0,.8,.4) forwards!important}
@keyframes foeDie{to{transform:rotate(14deg) translateY(30px) scale(.8);opacity:0;filter:contrast(2)}}
.foeDie2{animation:foeDie2 .6s ease forwards!important}
@keyframes foeDie2{40%{transform:scaleY(.6) scaleX(1.15)}to{transform:scaleY(.05) scaleX(1.5) translateY(42px);opacity:0}}
.foeDie3{animation:foeDie3 .75s cubic-bezier(.5,-.3,.8,.6) forwards!important}
@keyframes foeDie3{30%{transform:translateY(-48px) rotate(-15deg)}to{transform:translateY(95px) rotate(30deg);opacity:0}}
.foeDie4{animation:foeDie4 .9s ease-in forwards!important}
@keyframes foeDie4{/* deflating balloon: zips around, then drops */
  20%{transform:translate(-34px,-26px) rotate(-28deg) scale(.92)}
  40%{transform:translate(30px,-44px) rotate(24deg) scale(.8)}
  60%{transform:translate(-18px,-30px) rotate(-40deg) scale(.62)}
  to{transform:translate(6px,80px) rotate(120deg) scale(.2);opacity:0}}
.foeDie5{animation:foeDie5 1s cubic-bezier(.4,0,.7,1) forwards!important}
@keyframes foeDie5{/* dramatic Victorian faint, with a bounce */
  30%{transform:rotate(-8deg) translateY(-6px)}
  55%{transform:rotate(74deg) translateY(34px)}
  68%{transform:rotate(66deg) translateY(26px)}
  to{transform:rotate(84deg) translateY(58px) scale(.9);opacity:0}}
.foeIn1{animation:foeIn1 .5s ease both}
@keyframes foeIn1{from{transform:translateX(70px);opacity:0}60%{transform:translateX(-6px)}to{transform:none;opacity:1}}
.foeIn2{animation:foeIn2 .55s ease both}
@keyframes foeIn2{from{transform:translateY(-70px);opacity:0}55%{transform:translateY(7px)}75%{transform:translateY(-4px)}to{transform:none;opacity:1}}
.foeIn3{animation:foeIn3 .45s ease both}
@keyframes foeIn3{from{transform:scale(.2) rotate(-14deg);opacity:0}70%{transform:scale(1.08)}to{transform:none;opacity:1}}
.lunge{animation:lunge .42s cubic-bezier(.3,.1,.3,1)}
@keyframes lunge{16%{transform:translateX(-9px) rotate(3deg) scale(.97,.94)}
  44%{transform:translateX(30px) rotate(-5deg) scale(1.04,1)}66%{transform:translateX(20px) rotate(-2deg)}100%{transform:none}}
.impact{pointer-events:none;z-index:45;animation:impactPop .4s ease forwards}
@keyframes impactPop{0%{opacity:0;transform:scale(.5) rotate(-8deg)}25%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.3) rotate(4deg)}}
.fnum.crit{font-size:30px;font-weight:900;text-shadow:0 0 10px #e8232a}
.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.motes i{position:absolute;width:3px;height:3px;background:#ffffff2b;border-radius:50%;animation:mote linear infinite}
@keyframes mote{from{transform:translateY(102vh)}to{transform:translateY(-4vh)}}
.intIc{display:inline-block;animation:intBob 1.1s ease-in-out infinite}
@keyframes intBob{50%{transform:translateY(-3px)}}
.chip{display:inline-block;border:1.5px solid #ffffff44;padding:.2em .5em;font-family:var(--mono);
  font-weight:800;font-size:10px;letter-spacing:.06em;margin-right:5px}
.chip.hot{border-color:var(--r);color:var(--r)}
.hot{color:var(--r)}
.gwrap{position:relative}
.gwrap .ghost{position:absolute;left:0;top:0;bottom:0;background:#ffffff55;transition:width .8s .3s}
.gwrap .real{position:absolute;left:0;top:0;bottom:0;background:var(--r);transition:width .25s}
#bEnd.pulse{animation:endPulse 1s infinite}
#bDo.pulse,.door.pulse{animation:endPulse 1.2s infinite}
@keyframes confFall{to{transform:translateY(108vh) rotate(720deg);opacity:.75}}
/* youtube dock pins to the bottom edge; in battle it lifts above the fixed footer */
#ytDock{bottom:0}
body:has(.battlePage) #ytDock{bottom:calc(env(safe-area-inset-bottom) + 158px);border-bottom:2px solid var(--w)}
@keyframes endPulse{50%{box-shadow:0 0 0 2px var(--r);filter:brightness(1.12)}}
#energy.dry{animation:shk .3s}
#app.bigshake{animation:shk .3s}
#splash{position:fixed;inset:0;z-index:66;background:#000000f2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;animation:pageIn .3s}
#splash .sk{font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.3em;color:var(--r)}
#splash .sn{font-weight:900;font-size:clamp(30px,9vw,54px);text-transform:uppercase;letter-spacing:-.02em;line-height:1}
#splash .art{width:130px;height:150px;position:relative}
.relicPop{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:65;background:var(--k);
  border:2px solid var(--r);padding:18px 22px;text-align:center;max-width:86vw;animation:resultPop .35s cubic-bezier(.2,1.6,.4,1)}
.relicPop .rn{font-weight:900;font-size:19px;text-transform:uppercase;color:var(--r)}
.relicPop .rd{font-family:var(--mono);font-weight:700;font-size:11px;color:#ffffffaa;margin-top:6px;letter-spacing:.06em}
#hand > div{animation:pageIn .3s backwards;animation-delay:calc(var(--i,0) * 70ms)}
/* tutorial */
#tutScrim{position:fixed;inset:0;z-index:70;background:#000000cc;display:flex;align-items:flex-end;justify-content:center;
  padding:0 14px calc(env(safe-area-inset-bottom) + 22px)}
.tutTarget{position:relative!important;z-index:71!important;outline:3px solid var(--r);outline-offset:4px}
.tutBox{max-width:520px;width:100%;background:var(--k);border:2px solid var(--w);padding:16px;
  animation:pageIn .25s cubic-bezier(.2,.9,.3,1)}
.tutBox .tk{font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.22em;color:var(--r);text-transform:uppercase;margin-bottom:8px}
.tutBox .tb{font-family:var(--mono);font-weight:700;font-size:12.5px;line-height:1.9;color:var(--w);letter-spacing:.02em}
.tutBox .tb b{color:var(--r)}
.tutBox .btn{margin-top:12px}
.guide{position:fixed;inset:0;z-index:72;background:#000000f2;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:22px;text-align:center}
.guide .gstep{font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.24em;color:#ffffff66}
.guide .gt{font-weight:900;font-size:clamp(28px,8vw,44px);text-transform:uppercase;letter-spacing:-.02em}
.guide .gt span{color:var(--r)}
.guide .gb{font-family:var(--mono);font-weight:700;font-size:13px;line-height:2;color:#ffffffcc;max-width:34em;text-align:left}
.guide .gb b{color:var(--r)}
.guide .gnav{display:flex;gap:8px;width:100%;max-width:420px}
.guide .dots{display:flex;gap:6px}
.guide .dots i{width:10px;height:10px;background:#ffffff33}
.guide .dots i.on{background:var(--r)}
/* hand */
#hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.card{border:2px solid var(--w);background:var(--k);cursor:pointer;position:relative;display:flex;flex-direction:column;
  min-height:150px;transition:transform .1s}
.card:active{transform:scale(.96)}
@media (hover:hover){
  .card:not(.unplayable):hover{transform:translateY(-4px);box-shadow:0 6px 0 #ffffff33}
  .door:hover{background:#ffffff0d}
  .btn:hover{filter:brightness(1.12)}
}
.card.unplayable{opacity:.4}
.card .cost{position:absolute;top:-2px;left:-2px;width:26px;height:26px;background:var(--r);color:var(--w);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:13px;z-index:2}
.card .art{height:56px;border-bottom:2px solid var(--w);position:relative;overflow:hidden;background:var(--k)}
.card .art .jtm{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.15)}
.card .art .glyph{position:absolute;top:2px;right:2px;background:var(--k);border:1px solid var(--w);color:var(--w);
  font-family:var(--mono);font-weight:800;font-size:7px;letter-spacing:.08em;padding:1px 3px;z-index:2}
.card .art .glyph.hot{border-color:var(--r);color:var(--r)}
.card .nm{font-weight:900;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;padding:6px 7px 2px;line-height:1.15;
  word-break:break-word;overflow-wrap:anywhere}
.card .fx{font-family:var(--mono);font-weight:700;font-size:9.5px;color:#ffffffbb;padding:2px 7px 8px;line-height:1.5;flex:1;
  display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.card .fx b{color:var(--r)}
.card.blend .nm{color:var(--r)}
/* rarity borders · brightness is the currency */
.card.r0{border-color:#ffffff66}
.card.r1{border-color:var(--w)}
.card.r2{border-color:var(--r)}
.card.r3{border-color:transparent;
  background:linear-gradient(var(--k),var(--k)) padding-box,
    repeating-linear-gradient(45deg,var(--r) 0 9px,var(--w) 9px 18px) border-box;
  background-size:auto,300% 300%;animation:legendMove 4s linear infinite}
@keyframes legendMove{to{background-position:0 0,60px 60px}}
.rtag{position:absolute;bottom:2px;left:2px;background:var(--k);border:1px solid var(--r);color:var(--r);
  font-family:var(--mono);font-weight:800;font-size:6.5px;letter-spacing:.1em;padding:1px 3px;z-index:2}
.card.pow .art{background:repeating-linear-gradient(45deg,#111 0 8px,#000 8px 16px)}
.card.sel{outline:3px solid var(--r);outline-offset:2px}
/* battle bottom */
/* fixed battle footer — iOS sticky proved unreliable; energy must ALWAYS be visible */
#btm{display:flex;gap:8px;align-items:center;position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 10px);width:min(100vw - 24px,616px);z-index:34;
  background:#000000f2;padding:7px;border:1.5px solid #ffffff2e}
.battlePage{padding-bottom:150px}

<script>
'use strict';
/* ============================================================
   BLENDED ZEBRA · endless B/W/R deckbuilder · StS-blooded
   ============================================================
   JTM MEDIA FORMAT (v1) — drop-in art for cards/enemies/relics.
   Put images in /zebra/art/ and register them here (or just name
   the file after the art key — the loader auto-tries art/<key>.png,
   .jpg, .webp in that order). Entry options:
     JTM.manifest['card-bite'] = {
       src: 'art/card-bite.png',   // optional if file is named after key
       fit: 'cover'|'contain',     // default cover
       px: .5, py: .3,             // focus point 0..1 (background-position)
       mono: true,                 // force grayscale+contrast (default true —
     };                            //   keeps grok art on-palette)
   Anything without an image gets procedural zebra art. Send images
   any time; nothing else in the game needs to change.
   ============================================================ */
const JTM = {
  version: 1,
  base: 'art/',
  exts: ['png', 'jpg', 'webp'],
  manifest: {},            /* key -> entry (see above) */
  cache: {},               /* key -> resolved url | null */
  resolve(key, cb){
    if (key in this.cache) return cb(this.cache[key]);
    const entry = this.manifest[key] || {};
    const tries = entry.src ? [entry.src] : this.exts.map(e => this.base + key + '.' + e);
    const next = i => {
      if (i >= tries.length){ this.cache[key] = null; cb(null); return; }
      const img = new Image();
      img.onload = () => { this.cache[key] = tries[i]; cb(tries[i]); };
      img.onerror = () => next(i + 1);
      img.src = tries[i];
    };
    next(0);
  },
  css(key, el){
    this.resolve(key, url => {
      if (!url || !el.isConnected) return;
      const m = this.manifest[key] || {};
      const d = document.createElement('div');
      d.className = 'jtm';
      d.style.backgroundImage = `url(${url})`;
      d.style.backgroundSize = m.fit === 'contain' ? 'contain' : 'cover';
      d.style.backgroundRepeat = 'no-repeat';
      d.style.backgroundPosition = `${(m.px ?? .5) * 100}% ${(m.py ?? .5) * 100}%`;
      if (m.mono === false) d.style.filter = 'none';
      el.prepend(d);
    });
  },
};

const $ = s => document.querySelector(s);
const app = document.getElementById('app');

/* ---------- audio · dry, percussive, monochrome ---------- */
let ACTX = null, AMASTER = null;
function audio(){
  if (ACTX) return ACTX;
  ACTX = new (window.AudioContext || window.webkitAudioContext)();
  AMASTER = ACTX.createGain(); AMASTER.gain.value = .15;
  const dc = ACTX.createDynamicsCompressor();
  AMASTER.connect(dc); dc.connect(ACTX.destination);
  return ACTX;
}
function tone(type, f0, f1, dur, vol, delay = 0){
  audio();
  const t = ACTX.currentTime + delay;
  const o = ACTX.createOscillator(), g = ACTX.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(AMASTER); o.start(t); o.stop(t + dur + .03);
}
function nzz(dur, vol, hp, delay = 0){
  audio();
  const t = ACTX.currentTime + delay;
  const len = Math.ceil(ACTX.sampleRate * dur);
  const buf = ACTX.createBuffer(1, len, ACTX.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ACTX.createBufferSource(); src.buffer = buf;
  const f = ACTX.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = ACTX.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  src.connect(f); f.connect(g); g.connect(AMASTER); src.start(t);
}
/* ---------- sampled SFX layer · real audio fetched from the Phaser
   examples library (see snd/README.md), decoded through the master bus,
   pitch-randomized, layered over the synth. Synth alone if unloaded. */
const SAMPLES = { hit: 'shot1.wav', hit2: 'shot2.wav', big: 'explosion.mp3', ko: 'blaster.mp3',
  play: 'key.wav', click: 'numkey.wav', coin: 'pickup.wav', blend: 'squit.wav', swish: 'lazer.wav' };
const SBUF = {};
let samplesRequested = false;
function loadSamples(){
  if (samplesRequested) return;
  samplesRequested = true;
  audio();
  Object.entries(SAMPLES).forEach(([k, f]) =>
    fetch('snd/' + f).then(r => r.ok ? r.arrayBuffer() : Promise.reject())
      .then(b => ACTX.decodeAudioData(b))
      .then(buf => { SBUF[k] = buf; })
      .catch(() => {}));
}
function smp(k, vol = .5, rate = 1, jitter = .12){
  const b = SBUF[k];
  if (!b) return false;
  const s = ACTX.createBufferSource();
  s.buffer = b;
  s.playbackRate.value = rate * (1 - jitter / 2 + Math.random() * jitter);
  const g = ACTX.createGain(); g.gain.value = vol;
  s.connect(g); g.connect(AMASTER); s.start();
  return true;
}
const SFX = {
  click(){ if (!smp('click', .22, 1.4)) nzz(.03, .12, 3000); },
  play(){ smp('play', .35, 1.1); nzz(.05, .1, 1400); tone('sine', 300, 180, .1, .18); },
  hit(big){

  },
  block(){ tone('triangle', 700, 500, .1, .25); smp('click', .3, .7); },
  heal(){ tone('sine', 523, null, .25, .18); tone('sine', 784, null, .3, .14, .08); },
  power(){ tone('sawtooth', 110, 220, .35, .2); smp('swish', .25, .8); },

  death(){ smp('ko', .55, .7); tone('sawtooth', 220, 40, 1.1, .3); nzz(.6, .18, 150, .2); },
  ach(){ smp('coin', .4, 1.3); tone('triangle', 1047, null, .15, .18); tone('triangle', 1568, null, .25, .14, .09); },
};

function findRecipe(x, y){
  return RECIPES.find(r => (r.a === x.id && r.b === y.id) || (r.a === y.id && r.b === x.id));
}
/* a recipe result is the PERFECTED card · +30% numbers, one rarity up */
function primeCard(id){
  const c = mkCard(id);
  ['dmg', 'blk', 'heal', 'autoblk', 'str'].forEach(k => {
    if (c[k]) c[k] = Math.min(CAPS[k] || 999, Math.round(c[k] * 1.3));
  });
  c.prime = true;
  c.blend = true;
  markSeen('prime:' + id);
  c.name = c.name + ' ★';
  c.rar = Math.min(3, (c.rar || 0) + 1);
  descFor(c);
  return c;
}

  const kinds = [
    f => ({ name: `Stripe Totem ${roman(f)}`, desc: `+${4 + f * 2} max HP`, hp: 4 + f * 2 }),
    f => ({ name: `War Paint ${roman(f)}`, desc: `+${f} damage on all attacks`, str: f }),

function rollPowerups(n = 2){
  const out = [];
  while (out.length < Math.min(n, POWERUPS.length)){
    const p = pick(POWERUPS)();
    if (!out.some(x => x.name === p.name)) out.push(p);
  }
  return out;
}
function applyPowerup(p){
  if (p.now){ p.now(R); }
  else {
    R.relics.push({ name: p.name, desc: p.desc, pw: true,
      ...['str', 'hp', 'autoblk', 'healAfter', 'goldMul', 'firstHit'].reduce((o, k) => (p[k] != null && (o[k] = p[k]), o), {}) });
    if (p.hp){ R.mhp += p.hp; R.hp += p.hp; }
  }
  SFX.ach();
  saveRun();
}

function scaleFoe(base, floor, mult = 1){
  /* THE WALL · past floor 30 the savanna stops being linear -- every build dies eventually */
  let s = 1 + floor * .17, sa = 1 + floor * .115;
  if (floor > 30){ const w = Math.pow(floor - 30, 1.55) * .02; s += w; sa += w * .6; }
  const stk = 1 + .1 * ((META && META.stake) || 0);
  const wk = (typeof R === 'object' && R && R.wkFoe) || 1;
  return {
    ...base, mhp: Math.round(base.hp * s * mult * stk * wk), hp: Math.round(base.hp * s * mult * stk * wk),
    atk: Math.round(base.atk * sa * mult * stk),
    blk: 0, str: 0, pi: 0, weak: 0,
  };
}

function makeFoe(floor, kind){
  if (kind === 'boss'){
    const bi = Math.floor(floor / 5) - 1;
    const b = BOSSES[bi % BOSSES.length];
    const cycles = Math.floor(bi / BOSSES.length);
    const foe = scaleFoe(b, floor, 1 + cycles * .6);
    /* every boss warps one rule -- read the sign before you swing */
    foe.rule = BOSS_RULES[bi % BOSS_RULES.length].id;
    foe.ruleTxt = BOSS_RULES[bi % BOSS_RULES.length].txt;
    return foe;
  }
  if (kind === 'elite'){
    /* THE GHOST · Mirage pilots your last dead deck. it read the whole thing. */
    if (META.ghost && floor >= 5 && Math.random() < .25){
      const mir = VILLAINS.find(v => v.id === 'mirage') || pick(VILLAINS);
      const foe = scaleFoe(mir, floor, 1.35);
      foe.vill = true;
      foe.gdeck = META.ghost.deck;
      foe.gname = META.ghost.name;
      foe.name = 'MIRAGE OF ' + (META.ghost.name || 'YOU').toUpperCase().slice(0, 10);
      return foe;
    }
    /* FUSED FOES · sometimes two bad ideas walk in as one */
    if (floor >= 6 && Math.random() < .25){
      const a = pick(FOES), b = pick(FOES.filter(f => f.id !== a.id));
      const foe = scaleFoe({ id: a.id, name: blendName(a.name, b.name).toUpperCase(),
        hp: Math.round((a.hp + b.hp) * .85), atk: Math.max(a.atk, b.atk) + 1,
        pat: [...a.pat, ...b.pat] }, floor, 1.2);
      foe.vill = true; foe.fused = 1; foe.ep = 'TWO OF THEM. IN ONE. BUREAUCRATICALLY.';
      return foe;
    }
    /* elites are the Rogues' Gallery — fictional villain archetypes */
    const v = pick(VILLAINS);
    const foe = scaleFoe(v, floor, 1.3);
    foe.vill = true;
    return foe;
  }
  const f = pick(FOES.slice(0, clamp(2 + Math.floor(floor / 2), 2, FOES.length)));
  return scaleFoe(f, floor, 1);
}

function nodeLvl(id){ return (META.tree || {})[id] || 0; }
function nodeCost(n){ return n.rep ? Math.round(n.cost * Math.pow(n.rep, nodeLvl(n.id))) : n.cost; }
function treeVal(k){
  let s = 0;
  TREE.forEach(b => b.nodes.forEach(n => {
    const lvl = nodeLvl(n.id);
    if (lvl && n.fx[k]) s += n.fx[k] * lvl;
  }));
  return s;
}
function treeOwned(){ return TREE.reduce((s, b) => s + b.nodes.reduce((t, n) => t + nodeLvl(n.id), 0), 0); }
function treeClaimable(){
  return TREE.some(b => b.nodes.some((n, ni) => {
    const open = ni === 0 || nodeLvl(b.nodes[ni - 1].id) > 0;
    return open && (n.rep || nodeLvl(n.id) === 0) && META.stripes >= nodeCost(n);
  }));
}

  const last = META.lastSeen || 0;
  if (rate && last){
    const hrs = (now - last) / 3600000;
    if (hrs >= .05){                                  /* 3+ minutes counts as "away" */
      const capped = Math.min(hrs, 8 + treeVal('idleCap'));
      let g = Math.floor(capped * rate);

      if (deep) g *= 2;

        }, 900);
      }

  }

function bounties(){
  const day = todayKey();
  if (!META.bounty || META.bounty.day !== day){
    let s = 0; for (const c of day) s = (s * 131 + c.charCodeAt(0)) >>> 0;
    const rnd = () => (s = (s * 1103515245 + 12345) >>> 0) / 4294967296;
    const pool = [...BOUNTY_POOL], list = [];
    while (list.length < 3 && pool.length) list.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);

    floor: 0, hp: thp, mhp: thp, stripes: treeVal('startGold'), bestAtStart: META.stats.floors,
    deck: ['bite', 'bite', 'bite', 'bite', 'kick', 'kick', 'hide', 'hide', 'hide', 'zoomies'].map(mkCard),
    relics: [], turn: 0, sdmg: 0, scards: 0, sblends: 0, menergy: 3 + treeVal('menergy'), cls: cls.id,
    phoenix: treeVal('phoenix') > 0,
    wx: WEATHER[Math.floor(Math.random() * WEATHER.length)].id,
  };
  if (cls.id === 'wizard'){ R.deck.push(mkCard('zebramath'), mkCard(pick(RAR_R))); }
  if (cls.id === 'pirate'){ R.deck.push(mkCard('coinmane')); }
  if (cls.id === 'goth'){ R.mhp += 15; R.hp += 15; R.deck.push(mkCard('thickhide')); }
  if (cls.id === 'disco'){ R.deck.push(mkCard('zoomies'), mkCard('zoomies')); }
  if (cls.id === 'robo'){ R.deck.push(mkCard('mudroll')); }
  if (cls.id === 'ninja'){ R.deck.push(mkCard('warnstripe')); }
  if (cls.id === 'granny'){ R.deck.push(mkCard('nuzzle'), mkCard('sugarcube')); }
  if (cls.id === 'cowboy'){ R.deck.push(mkCard('muzzle')); }
  if (cls.id === 'ghost'){ R.deck.push(mkCard('powernap')); }
  if (cls.id === 'chef'){ R.deck.push(blendCards(mkCard(pick(BASE_CARDS.filter(c => !c.secret)).id), mkCard(pick(BASE_CARDS.filter(c => !c.secret)).id)), blendCards(mkCard(pick(BASE_CARDS.filter(c => !c.secret)).id), mkCard(pick(BASE_CARDS.filter(c => !c.secret)).id))); }
  if (cls.id === 'moon'){ R.menergy = Math.max(R.menergy, 4); }
  for (let i = 0; i < treeVal('thin'); i++){
    const bi = R.deck.findIndex(c => c.id === 'bite');
    if (bi >= 0) R.deck.splice(bi, 1);
  }
  for (let i = 0; i < treeVal('startBlend'); i++) R.deck.push(blendCards(mkCard(pick(BASE_CARDS.filter(c => !c.secret)).id), mkCard(pick(BASE_CARDS.filter(c => !c.secret)).id)));
  R.vouchers = [];
  /* THE HEIRLOOM · one blend survives every migration. the family line continues. */

    R.deck.push({ ...META.heirloom, uid: Math.random().toString(36).slice(2) });
    setTimeout(() => toast('☀ HEIRLOOM: ' + META.heirloom.name.toUpperCase() + ' RIDES AGAIN', 2200), 1600);
  }
  /* STAKES · opt-in pain, better marks. stake 3+ starts infested. */
  if ((META.stake || 0) >= 3) R.deck.push(mkCursed());
  if ((META.stake || 0) >= 4) R.deck.push(mkCursed());
  for (let i = 0; i < META.startRelics + treeVal('relic'); i++){
    const r = pick(RELICS);
    R.relics.push(r);
    if (r.hp){ R.mhp += r.hp; R.hp += r.hp; }
  }
  /* beginner's luck: the savanna goes easy on your first two runs. after that, it's personal. */
  if ((META.stats.runs || 0) < 2){

    R.deck.push(mkCard('sugarcube'));

}

/* ---------- drop points · start deeper, geared up ---------- */
function suggestedStart(){
  /* base drops on the best CLIMB (floors cleared past a drop-in point), not the
     best floor ever — death-wish drops ratcheted the record and inflated
     suggestions way past survivable. legacy saves get a conservative guess. */
  const climb = META.stats.climb != null ? META.stats.climb : Math.floor((META.stats.floors || 1) * .6);
  return Math.max(1, Math.floor(climb / 3));
}
function dropKit(N){
  /* gear scaled to the drop: the savanna doesn't send you down naked */
  R.mhp += Math.round(N * .8); R.hp = R.mhp;
  R.stripes += N * 3;
  for (let i = 0; i < Math.floor(N / 8); i++){
    const m = rollPowerups(1)[0];
    if (!m.now) applyMutationSilent(m);
  }
  for (let i = 0; i < Math.floor(N / 15); i++){
    const r = pick(RELICS);
    R.relics.push(r);
    if (r.hp){ R.mhp += r.hp; R.hp += r.hp; }
  }
  for (let i = 0; i < Math.floor(N / 20); i++) R.deck.push(blendCards(mkCard(pick(BASE_CARDS.filter(c => !c.secret)).id), mkCard(pick(BASE_CARDS.filter(c => !c.secret)).id)));
  saveRun();
}
function applyMutationSilent(m){
  R.relics.push({ name: m.name, desc: m.desc,
    ...['str', 'hp', 'autoblk', 'healAfter', 'goldMul', 'firstHit'].reduce((o, k) => (m[k] != null && (o[k] = m[k]), o), {}) });
  if (m.hp){ R.mhp += m.hp; R.hp += m.hp; }
}

function glyphFor(c){
  if (c.mystery || c.gamble || c.echo || c.molt || c.zmath || c.mirror || c.quake || c.frenzy || c.stun || c.freeNext || c.grow || c.cresc) return ['WYRD', 1];
  if (c.type === 'pow') return ['PWR', 0];
  if (c.energy) return ['NRG', 0];
  if (c.dmg || c.multi) return ['ATK', 0];
  if (c.blk) return ['DEF', 0];
  if (c.draw) return ['DRW', 0];
  return ['SKL', 0];
}
function cardHtml(c, unplayable = false){
  const [g, hot] = glyphFor(c);
  const rar = c.rar || 0;
  const edCls = c.ed ? ' ed' + c.ed[0].toUpperCase() + c.ed.slice(1) : '';
  return `<div class="card r${rar} ${c.type === 'pow' ? 'pow' : ''} ${c.blend ? 'blend' : ''} ${unplayable ? 'unplayable' : ''}${edCls}${c.glass ? ' glass' : ''}${c.unstable ? ' unstable' : ''}${c.cursed ? ' cursed' : ''}">
    ${c.seal ? `<span class="seal ${c.seal}"></span>` : ''}
    <div class="cost">${c.cost}</div>
    <div class="art" data-art="card-${c.id}">${motifArt(c, c.type === 'atk')}
      <span class="glyph ${hot ? 'hot' : ''}">${g}</span>
      ${rar >= 2 ? `<span class="rtag">${RAR_NAMES[rar]}</span>` : ''}</div>
    <div class="nm">${c.name}</div>
    <div class="fx">${c.desc}</div>
  </div>`;
}
function playCard(i, cardEl){
  if (B.over || B.busy || B.ending) return;
  const c = B.hand[i];
  if (!c) return;
  if (c.cursed){ toast('🕷 UNPLAYABLE. IT ITCHES. THE MEERKAT CAN EAT IT.', 1600); return; }
  if (B.foe.rule === 'lock' && c.uid === B.lockUid){ toast('⚖ FROZEN BY HOUSE RULE. PLAY AROUND IT.', 1400); return; }
  const eager = c.quirk === 'eager' && !B.eagerUsed[c.uid];
  const taxed = B.foe.rule === 'tax' && c.type === 'atk' ? 1 : 0;
  const cost = (B.freeNext || eager) ? 0 : c.cost + taxed;
  if (B.energy < cost){
    const en = $('#energy');
    if (en){ en.classList.remove('dry'); void en.offsetWidth; en.classList.add('dry'); }
    toast('NOT ENOUGH ENERGY · END TURN TO REFILL', 1200);
    return;
  }
  B.busy = true;
  if (cardEl) cardEl.classList.add('played');
  SFX.play();
  setTimeout(() => {
    B.busy = false;
    if (B.over) return;
    if (B.freeNext){ B.freeNext = 0; if (c.cost) toast('🤝 BARTERED · FREE', 900); }
    else if (eager){ B.eagerUsed[c.uid] = 1; if (c.cost) toast('⚡ EAGER · FREE THIS FIGHT', 900); }
    else B.energy -= (c.cost + taxed);
    /* GOLD SEAL pays on sight · HOLO feeds the turn's mult · HERD HANDS: 3 shared stripes = the pattern pays */
    if (c.seal === 'gold'){ R.stripes += 5; floatNum($('#energy'), '+5 ◆', 'var(--w)'); }
    if (c.ed === 'holo'){ B.mult += 1; toast('◈ HOLO · MULT × ' + multNow().toFixed(1).replace('.0', ''), 900); }
    motifsOf(c).slice(0, 2).forEach(m => {   /* 4-motif dynasties don't quad-dip the herd */
      B.motifCnt[m] = (B.motifCnt[m] || 0) + 1;
      if (B.motifCnt[m] === 3){ B.mult += 1; toast('🦓 HERD HAND · 3× ' + m.toUpperCase() + ' · +1 MULT', 1400); SFX.power(); }
      if (B.motifCnt[m] === 4){ B.mult += 1; drawCards(1); toast('🦓 FULL HERD · +1 MULT · DRAW 1', 1400); SFX.ach(); }
    });
    /* UNSTABLE rerolls its whole pool across dmg/blk/heal. every play. no refunds. */
    if (c.unstable && c.upool){
      const cuts = [Math.random(), Math.random()].sort();
      c.dmg = Math.round(c.upool * cuts[0]) || undefined;
      c.blk = Math.round(c.upool * (cuts[1] - cuts[0])) || undefined;
      c.heal = Math.round(c.upool * (1 - cuts[1])) || undefined;
      descFor(c);
      toast('⚗ UNSTABLE: ' + [c.dmg && c.dmg + ' DMG', c.blk && c.blk + ' BLK', c.heal && c.heal + ' HEAL'].filter(Boolean).join(' · '), 1400);
    }
    /* WILD quirk · 10%: the card forgets which zebra it works for */
    let wildMiss = false;
    if (c.quirk === 'wild' && c.dmg && Math.random() < .1){
      wildMiss = true;
      R.hp = Math.max(1, R.hp - c.dmg);
      B.tookDmg = true;
      playerFx(); SFX.playerHit();
      toast('🎲 WILD! IT HIT YOU. −' + c.dmg + '. THE BLENDER SHRUGS.', 1600);
    }
    const sealX = c.seal === 'red' ? 2 : 1;
    if (sealX > 1) toast('⭕ RED SEAL · EVERYTHING TWICE', 900);
    B.played++;
    bumpStat('cards', 1);
    R.scards = (R.scards || 0) + 1;
    if (R.cls === 'disco' && B.played % 3 === 0){
      B.energy = Math.min(9, B.energy + 1);
      floatNum($('#energy'), '+1⚡ GROOVE', 'var(--w)');
    }
    /* remove self first so echo/molt see the true remaining hand */
    B.hand.splice(i, 1);
    /* ---- resource + weird effects (pre-damage) ---- */
    if (c.energy){ B.energy = Math.min(9, B.energy + c.energy); SFX.power(); }   /* red seal never doubles energy — that way lies infinity */
    if (c.gamble){
      if (Math.random() < .5){ B.energy = Math.min(9, B.energy + 2); toast('COIN: HEADS · +2 ENERGY ⚡', 1000); SFX.ach(); }
      else { R.hp = Math.max(1, R.hp - 3); B.tookDmg = true; toast('COIN: TAILS · OW. −3 HP', 1000); playerFx(); SFX.playerHit(); }
    }
    let myst = null;
    if (c.mystery){
      myst = pick(['dmg', 'blk', 'draw', 'energy', 'heal']);
      toast('??? RESOLVES: ' + { dmg: '12 DAMAGE', blk: '12 BLOCK', draw: 'DRAW 3', energy: '+2 ENERGY', heal: 'HEAL 6' }[myst], 1200);
      if (myst === 'blk'){ B.block += 12; bumpStat('blocks', 12); SFX.block(); }
      if (myst === 'draw') drawCards(3);
      if (myst === 'energy') B.energy = Math.min(9, B.energy + 2);
      if (myst === 'heal'){ R.hp = Math.min(R.mhp, R.hp + 6); SFX.heal(); }
    }
    /* ---- damage (single or multi-hit) ---- */
    let base = 0;
    if (c.frenzy) base = 3 * B.played;
    else if (c.mirror) base = B.block;
    else if (c.quake) base = 8 + Math.floor(B.discard.length / 3);
    else if (c.dmg) base = c.dmg;
    if (c.cresc) base += B.turn * 2;
    if (c.exec && B.foe.hp < B.foe.mhp / 2){ base *= 2; toast('⚔ COUP DE GRASS · DOUBLED', 1000); }
    if (myst === 'dmg') base += 12;
    let dmg = 0, blocked = 0;
    if ((base > 0 || c.multi) && !wildMiss){
      const hits = Math.min((c.multi || 1) + (sealX > 1 ? Math.min(c.multi || 1, 3) : 0), CAPS.multi + 3);
      for (let h = 0; h < hits; h++){
        let d = Math.max(base, c.multi ? 1 : 0) + B.str;
        if (h === 0 && B.firstHit){ d += B.firstHit; B.firstHit = 0; }
        if (c.ed === 'inv') d = Math.round(d * 1.5);
        d = Math.round(d * multNow());   /* THE MULT · chips × mult, savanna edition */
        const f = B.foe;
        const absorbed = Math.min(f.blk, d);
        f.blk -= absorbed;
        f.hp -= (d - absorbed);
        dmg += d - absorbed;        /* only damage that lands counts */
        blocked += absorbed;
      }
      if (dmg > 0 || blocked > 0){
        if (dmg > 0){ bumpStat('damage', dmg); R.sdmg = (R.sdmg || 0) + dmg; B.fdmg += dmg; B.bestHit = Math.max(B.bestHit, dmg); B.peakMult = Math.max(B.peakMult, multNow()); }
        const fa = $('#foeArt');
        if (fa && !fa.classList.contains('foeDie')){ fa.classList.remove('foeHit'); void fa.offsetWidth; fa.classList.add('foeHit'); }
        impactFx();
        floatNum($('#foeArt'), dmg > 0 ? '−' + dmg : 'BLOCKED', dmg >= 15 ? '#f2f2f2' : dmg > 0 ? 'var(--r)' : '#8a8a8a');
        /* lunge lands after the re-render, on the fresh node */
        setTimeout(() => { const yz = $('#youZeb'); if (yz) yz.classList.add('lunge'); }, 30);
      }
    }
    /* ---- the rest ---- */
    if (c.vamp && dmg > 0){ R.hp = Math.min(R.mhp, R.hp + dmg); floatNum($('#hpbar'), '+' + dmg + ' 🩸', 'var(--w)'); SFX.heal(); }
    if (c.grow){
      const src = R.deck.find(x => x.uid === c.uid) || c;
      src.dmg = Math.min(CAPS.dmg, (src.dmg || 0) + c.grow);
      descFor(src);
      toast('😤 THE GRUDGE GROWS · NOW ' + src.dmg, 1000);
    }
    if (c.stun){
      if (B.foe.stunProof){ toast('IT\'S WISE TO THE TRICK NOW — NO CHAIN-STUNNING.', 1500); }
      else { B.foe.stun = 1; toast('💫 ' + B.foe.name.toUpperCase() + ' FORGETS WHAT IT WAS DOING', 1400); SFX.power(); }
    }
    if (c.freeNext){ B.freeNext = 1; }
    if (c.self){ R.hp = Math.max(1, R.hp - c.self); B.tookDmg = true; }
    if (c.blk){ B.block += c.blk * sealX; bumpStat('blocks', c.blk * sealX); SFX.block(); }
    if (c.heal){
      const before = R.hp;
      const healed = Math.max(1, Math.floor((B.foe.rule === 'leech' ? c.heal / 2 : c.heal) * sealX));
      R.hp = Math.min(R.mhp, R.hp + healed);
      const spill = healed - (R.hp - before);
      if (c.overblk && spill > 0){ B.block += spill; bumpStat('blocks', spill); floatNum($('#hpbar'), '+' + spill + ' BLK (CUD)', 'var(--w)'); }
      SFX.heal();
    }
    if (c.weak) B.foe.weak = Math.max(B.foe.weak, c.weak * sealX);
    if (c.str) B.str = Math.min(99, B.str + c.str * sealX);
    if (c.autoblk) B.autoblk = Math.min(99, B.autoblk + c.autoblk * sealX);
    if (c.stripegen) B.stripegen = Math.min(99, (B.stripegen || 0) + c.stripegen * sealX);
    if (c.str || c.autoblk || c.stripegen) SFX.power();
    if (c.echo && B.hand.length){
      const src = B.hand[ri(B.hand.length)];
      if (B.hand.length < 10){
        B.hand.push({ ...src, uid: Math.random().toString(36).slice(2) });
        toast('ECHO: ' + src.name.toUpperCase() + ' ×2', 1000);
      }
    }
    if (c.molt){
      const n = B.hand.length;
      B.discard.push(...B.hand);
      B.hand = [];
      drawCards(n);
      if (n) toast('MOLTED ' + n + ' → DREW ' + n, 1000);
    }
    if (c.draw) drawCards(Math.min(c.draw + (sealX > 1 ? 1 : 0), CAPS.draw + 1));
    if (c.zmath && B.energy > 0) drawCards(Math.min(B.energy, CAPS.draw));
    /* GLASS shatters 1-in-4 · BLUE seal boomerangs back once a turn */
    if (c.glass && Math.random() < .25){
      const di = R.deck.findIndex(x => x.uid === c.uid);
      if (di >= 0) R.deck.splice(di, 1);
      stampFx('SHATTERED');
      toast('❄ ' + c.name.toUpperCase() + ' SHATTERS. IT WAS BEAUTIFUL. IT IS GONE.', 2000);
      SFX.bell(); hapt(40);
    } else if (c.seal === 'blue' && !B.blueUsed[c.uid] && B.hand.length < 10){
      B.blueUsed[c.uid] = 1;
      B.hand.push(c);
      toast('🔵 BLUE SEAL · IT COMES BACK', 900);
    } else if (c.type !== 'pow') B.discard.push(c);
    const dead = B.foe.hp <= 0;
    renderBattle();
    if (dmg || blocked){
      B.zebPose = 'atk'; B.zebUntil = Date.now() + 380;
      SFX.hit(dmg >= 12);
      hapt(dmg >= 15 ? 30 : 12);
      foeFx();
      if (dmg >= 15){
        const a = document.getElementById('app');
        a.classList.remove('bigshake'); void a.offsetWidth; a.classList.add('bigshake');
      }
    }
    if (c.blk){
      floatNum($('#hpbar'), '+' + c.blk + ' BLK', 'var(--w)');
      if (!dmg){ B.zebPose = 'blk'; B.zebUntil = Date.now() + 500; }
    }

      const fa = $('#foeArt');
      if (fa) fa.classList.add(pick(['foeDie', 'foeDie2', 'foeDie3', 'foeDie4', 'foeDie5']));
      hapt(60);
      setTimeout(winBattle, 520);
      return;
    }
  }, cardEl ? DL(150) : 0);
}
function endTurn(){

  turnBanner(B.foe.name + ' ACTS');

    if (B.over){ B.busy = false; return; }
    const f = B.foe;
    let kind = f.pat[f.pi % f.pat.length];

      f.stun = 0;
      f.stunProof = 2;   /* wakes wary — immune to the next stun attempt, wears off after a turn */

      } else if (R.cls === 'ghost' && B.turn === 1){

        through = n - absorbed;

      if (appEl){ appEl.classList.remove('bigshake'); void appEl.offsetWidth; appEl.classList.add('bigshake'); }
      setTimeout(() => toast(pick(['THE HERD LOOKS AWAY.', 'THE VULTURE TAKES NOTES.', 'THE SAVANNA GOES QUIET.', 'THE GRASS ACCEPTS YOU NOW.', 'EVEN THE MEERKAT CLOSES THE LEDGER.', 'YOUR STRIPES RETURN TO THE POOL.']), 1700), 500);

/* ---------- pit crew battle brains ---------- */
function canPlayAuto(c){
  /* the crew must respect the same gates playCard enforces: curses, lock rule, tax rule */
  if (c.cursed) return false;
  if (B.foe.rule === 'lock' && c.uid === B.lockUid) return false;
  const taxed = B.foe.rule === 'tax' && c.type === 'atk' ? 1 : 0;
  return c.cost + taxed <= B.energy;
}
function singleKill(){
  /* firstHit lands on the first hit only — mirror playCard's math exactly */
  return B.hand.findIndex(c => canPlayAuto(c) && c.dmg &&
    (c.dmg + B.str) * (c.multi || 1) + (B.firstHit || 0) >= B.foe.hp + (B.foe.blk || 0));
}
function helperNudge(){
  if (!B || B.over || B.busy || B.auto) return;
  clearTimeout(B.hnT);
  B.hnT = setTimeout(() => {
    if (!B || B.over || B.busy || B.auto || B.ending) return;
    if (helperOn('ox')){
      const kill = singleKill();
      if (kill >= 0){ toast('🩸 OX SMELLS BLOOD', 900); playCard(kill); return; }
    }
    if (helperOn('gary') && !B.hand.some(canPlayAuto)){
      toast('📋 GARY ENDS THE TURN. EFFICIENTLY.', 900);
      endTurn();
    }
  }, DL(750));
}
function autoPolicy(){
  const h = B.hand;
  const kill = singleKill();
  if (kill >= 0){ playCard(kill); return; }
  const intentAtk = B.foe.pat[B.foe.pi % B.foe.pat.length] === 'atk' && !B.foe.stun;
  if (intentAtk){
    const inc = Math.max(1, B.foe.atk + B.foe.str - (B.foe.weak ? 2 : 0) - (R.cls === 'goth' ? 1 : 0) - petVal('dmgCut'));
    if (B.block < inc){
      const bi = h.findIndex(c => canPlayAuto(c) && c.blk && !c.dmg);
      if (bi >= 0){ playCard(bi); return; }
    }
  }
  const atks = h.map((c, i) => [c, i]).filter(([c]) => canPlayAuto(c) && (c.dmg || c.frenzy))
    .sort((a, b) => ((b[0].dmg || 0) * (b[0].multi || 1)) - ((a[0].dmg || 0) * (a[0].multi || 1)));
  if (atks.length){ playCard(atks[0][1]); return; }
  const safe = h.findIndex(c => canPlayAuto(c) && !c.gamble && !c.mystery && !c.molt);
  if (safe >= 0){ playCard(safe); return; }
  endTurn();
}

/* ---------- back room machinery ---------- */
function backOff(){ return (1 - treeVal('shopOff')) * (1 + .1 * (META.stake || 0)) * (R.wkShopOff || 1); }
function packCost(t){ const base = { std: 25, anc: 55, wild: 40 }[t] + R.floor * 2; return Math.round(base * (hasVoucher('packoff') ? .7 : 1) * backOff()); }
function sealCost(){ return Math.round((30 + R.floor) * backOff()); }
function dnaCost(){ return Math.round((70 + R.floor * 2) * backOff()); }
function wheelCost(){ return (12 + Math.floor(R.floor / 2)) + 8 * (R._spins || 0); }   /* each spin this visit costs more */
const VOUCHERS = [
  { id: 'hand6', name: 'Bigger Saddlebag', desc: '+1 card drawn every turn', cost: 60 },
  { id: 'blend2', name: 'Second Pitcher', desc: 'the Oasis blender runs twice per visit', cost: 50 },
  { id: 'seer', name: 'Vulture Consultant', desc: "see the foe's next TWO moves", cost: 45 },
  { id: 'packoff', name: 'Wholesale Ledger', desc: 'packs cost −30%', cost: 40 },
];
function voucherStock(){
  const un = VOUCHERS.filter(v => !(R.vouchers || []).includes(v.id));
  if (!un.length) return null;
  /* stable per floor so re-renders don't reroll the stock */
  return un[R.floor % un.length];
}
function rentalStock(){
  if (!R._rental || R._rentalFloor !== R.floor){ R._rental = genRelic(R.relics.length + 4); R._rentalFloor = R.floor; }
  return R._rental;
}
function collectRent(){
  if (!R || !R.relics) return;
  const due = R.relics.filter(r => r.rent);
  due.forEach(r => {
    if (R.stripes >= 3){ R.stripes -= 3; }
    else {
      const i = R.relics.indexOf(r);
      R.relics.splice(i, 1);
      if (r.hp){ R.mhp = Math.max(20, R.mhp - r.hp); R.hp = Math.min(R.hp, R.mhp); }
      R.hp = Math.max(1, R.hp - 5);
      toast('🏷 RENT UNPAID. ' + r.name.toUpperCase() + ' REPOSSESSED. IT TOOK 5 HP AS A FEE.', 3000);
      SFX.playerHit();
    }
  });
}
function openPack(tier, _unused, done){
  markSeen('pack:' + tier);
  let picks;
  if (tier === 'anc'){
    const secrets = BASE_CARDS.filter(c => c.secret);
    picks = shuffle([...secrets]).slice(0, 2).map(c => mkCard(c.id));
  } else if (tier === 'wild'){
    const nc = blendCards(mkCard(pick(BASE_CARDS.filter(c => !c.secret)).id), mkCard(pick(BASE_CARDS.filter(c => !c.secret)).id));
    R.deck.push(nc);
    saveRun();
    stampFx('WILD PACK');
    toast('🎁 IT WAS ' + nc.name.toUpperCase() + '. NO REFUNDS. NO REGRETS. PROBABLY.', 2600);
    SFX.blend();
    done && done();
    return;
  } else {
    const pool = BASE_CARDS.filter(c => !c.secret);
    picks = [];
    while (picks.length < 3){
      const r = Math.random();
      const rar = r < .15 ? 2 : r < .5 ? 1 : 0;
      let sub = pool.filter(c => c.rar === rar);
      if (!sub.length) sub = pool;
      const c = pick(sub);
      if (!picks.some(p => p.id === c.id)) picks.push(mkCard(c.id));
    }
  }
  const o = el(`<div class="ovlDeck"><div style="max-width:640px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center">
    <span class="kick">📦 ${tier === 'anc' ? 'ANCESTRAL' : 'BOOSTER'} PACK · PICK ONE</span>
    <button class="btn red" style="width:auto;min-height:40px;padding:8px 16px" id="pkX">Skip</button></div>
    <div class="grid">${picks.map((c, i) => `<div data-i="${i}">${cardHtml(c)}</div>`).join('')}</div></div>`);
  document.body.appendChild(o);
  o.querySelector('#pkX').onclick = () => { o.remove(); done && done(); };
  o.querySelectorAll('.grid > div').forEach(dv => dv.onclick = () => {
    const c = picks[+dv.dataset.i];
    R.deck.push(c);
    saveRun();
    o.remove();
    toast('📦 + ' + c.name.toUpperCase(), 1500);
    SFX.ach();
    done && done();
  });
}

    B.hand.push(nc);
    bumpStat('blends', 1);
    bountyBump('blends');

/* ---------- WEEKLY SAVANNA · same week, same rules, local ledger ---------- */
function weekKey(){
  const d = new Date();
  const on = new Date(d.getFullYear(), 0, 1);
  const wk = Math.ceil(((d - on) / 86400000 + on.getDay() + 1) / 7);
  return d.getFullYear() + '-W' + wk;
}
const WK_MUTS = [
  { id: 'feral', name: 'FERAL WEEK', desc: 'foes +25% HP · stripes ×2', fx: r => { r.wkFoe = 1.25; r.wkGold = 2; } },
  { id: 'chefwk', name: 'SMOOTHIE WEEK', desc: 'every new blend +2 dmg & block', fx: r => { r.wkBlend = 2; } },
  { id: 'richwk', name: 'BULL MARKET', desc: 'start +80 ◆ · shop −20%', fx: r => { r.stripes += 80; r.wkShopOff = .8; } },
  { id: 'glasswk', name: 'GLASS WORLD', desc: 'reward cards may come GLASS: ×2, may shatter', fx: r => { r.wkGlass = 1; } },
];
function weekMut(){
  let h = 0;
  const k = weekKey();
  for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0;
  return WK_MUTS[h % WK_MUTS.length];
}

      return `<div class="bcell ${got ? '' : 'locked'}" data-id="${x.id}" data-vill="${x.vill ? 1 : 0}">
        <div class="bart">${artFor(x, 0)}</div>
        <div class="bname">${got
          ? `${x.name} <b>×${got}</b><br><span style="color:#ffffff77">${x.ep ? '(' + x.ep + ')' : (QUIPS[x.id] ? '“' + QUIPS[x.id][0] + '”' : x.kind)}</span>`
          : `??? <br><span style="color:#ffffff44">${x.kind} · UNMET</span>`}</div>
      </div>`;
    }).join('')}</div>
    <button class="btn ghost" id="bBack">Back</button>
  </div>`);
  app.appendChild(p);
  /* everything in the book is alive */
  let bf = 0;
  BEST_T = setInterval(() => {
    bf += 3;
    p.querySelectorAll('.bcell:not(.locked)').forEach(cell => {
      const art = cell.querySelector('.bart');
      if (art) art.innerHTML = artFor({ id: cell.dataset.id, vill: cell.dataset.vill === '1', name: '' }, bf);
    });
  }, 120);
  $('#bBack').onclick = () => { clearInterval(BEST_T); BEST_T = null; screenTitle(); };
}
function screenAch(){
  app.innerHTML = '';
  const rows = ACH_FAMS.map(([k, label]) => {
    const tier = META.achTiers[k] || 0;
    const cur = META.stats[k], next = thresh(tier);
    const prev = tier ? thresh(tier - 1) : 0;
    const pct = clamp((cur - prev) / Math.max(1, next - prev) * 100, 0, 100);
    return `<div class="ach"><div style="flex:1"><div class="an">${label} ${roman(tier + 1)}</div>
      <div class="ap">${cur.toLocaleString()} / ${next.toLocaleString()}</div>
      <div style="height:5px;background:#ffffff18;margin-top:5px"><div style="height:100%;width:${pct}%;background:var(--r)"></div></div></div>
      <div class="tick">${tier ? '★' + tier : '—'}</div></div>`;
  }).join('');
  const totalTiers = Object.values(META.achTiers).reduce((a, b) => a + b, 0);
  const worn = META.worn || [];
  const trophyRows = TROPHIES.map(t => {
    const got = trophyEarned(t.id);
    const wearing = worn.includes(t.id);
    const cur = META.stats[t.stat] || 0;
    return `<div class="ach" style="${got ? '' : 'opacity:.65'}">
      <div style="font-size:22px;flex-shrink:0;${got ? '' : 'filter:grayscale(1) brightness(.6)'}">${t.icon}</div>
      <div style="flex:1"><div class="an">${t.name}${wearing ? ' <span style="color:var(--r)">· WEARING</span>' : ''}</div>
      <div class="ap">${t.ep}<br><b style="color:${got ? 'var(--r)' : '#ffffff66'}">PRIZE: ${t.prize}</b> · ${Math.min(cur, t.need).toLocaleString()}/${t.need.toLocaleString()}</div></div>
      ${got ? `<button class="btn slim ${wearing ? '' : 'red'}" style="width:auto" data-wear="${t.id}">${wearing ? 'DOFF' : 'WEAR'}</button>` : '<div class="tick">🔒</div>'}
    </div>`;
  }).join('');
  const p = el(`<div class="page">
    <span class="kick m" style="color:var(--r)">THE TROPHY CASE · PRIZES GO ON THE ZEBRA · WEAR UP TO 3</span>
    <div style="display:flex;justify-content:center"><div class="liveArt" data-rig="zeb" data-pose="trot" style="width:150px;height:104px;position:relative"></div></div>
    ${trophyRows}
    <div class="stripes"></div>
    <span class="kick">EVERY FAMILY TIERS FOREVER · ×2.2 EACH TIME</span>
    <div class="big">Achievements <span class="z">∞</span></div>
    <div class="sub">${totalTiers} tiers earned · each pays stripes on unlock</div>
    ${rows}
    <button class="btn ghost" id="bBack">Back</button>
  </div>`);
  app.appendChild(p);
  p.querySelectorAll('[data-wear]').forEach(b => b.onclick = () => {
    const id = b.dataset.wear;
    if ((META.worn || []).includes(id)){
      META.worn = META.worn.filter(x => x !== id);
      toast('DOFFED. THE ZEBRA FEELS NAKED.', 1300);
    } else {
      if ((META.worn || []).length >= 3){ toast('THREE ACCESSORIES MAX. THIS IS A SAVANNA, NOT A RUNWAY.', 1800); return; }
      META.worn = [...(META.worn || []), id];
      SFX.ach();
      toast('WEARING: ' + (TROPHIES.find(t => t.id === id) || {}).prize, 1400);
    }
    saveMeta(); screenAch();
  });
  $('#bBack').onclick = screenTitle;
}

function toggleYt(){
  const ex = document.getElementById('ytDock');
  if (ex){ ex.remove(); return; }
  /* pinned to the bottom edge, centered — battle footer sits above it */
  const d = el(`<div id="ytDock" style="position:fixed;left:50%;transform:translateX(-50%);width:min(100vw,240px);z-index:33;
      background:#000;border:2px solid var(--w);border-bottom:none;box-shadow:0 -6px 24px #000c;padding-bottom:env(safe-area-inset-bottom)">
    <div id="ytBar" style="display:flex;align-items:center;gap:4px;padding:4px 6px;background:#111">
      <span style="font-family:var(--mono);font-weight:800;font-size:8px;letter-spacing:.12em;color:#ffffff66">📺 WATCH</span>
      <span style="flex:1"></span>
      ${YT_TABS.map((t, i) => `<button data-yt="${i}" title="${t.name}" style="background:none;border:1.5px solid #ffffff44;color:#fff;
        font-family:var(--mono);font-weight:800;font-size:8.5px;padding:2px 5px;cursor:pointer">${t.k}</button>`).join('')}
      <button id="ytX" style="background:var(--r);border:none;color:#fff;font-weight:800;font-size:10px;padding:2px 7px;cursor:pointer">✕</button>
    </div>
    <iframe id="ytFrame" src="${YT_TABS[0].src}" frameborder="0"
      allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen
      style="display:block;width:100%;aspect-ratio:16/9;border:none"></iframe>
  </div>`);
  document.body.appendChild(d);
  d.querySelectorAll('[data-yt]').forEach(b => b.onclick = () => {
    const t = YT_TABS[+b.dataset.yt];
    document.getElementById('ytFrame').src = t.src;
    d.querySelectorAll('[data-yt]').forEach(x => x.style.borderColor = '#ffffff44');
    b.style.borderColor = 'var(--r)';
    toast('📺 ' + t.name.toUpperCase(), 1200);
  });
  d.querySelector('[data-yt="0"]').style.borderColor = 'var(--r)';
  d.querySelector('#ytX').onclick = () => d.remove();
}
