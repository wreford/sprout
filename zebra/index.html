<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="Blended Zebra — an endless black/white/red deckbuilder. Blend cards. Climb forever. The savanna keeps score.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23000'/%3E%3Cpath d='M4 6 l6 20 M11 4 l6 24 M18 4 l6 24 M25 6 l4 20' stroke='%23fff' stroke-width='3' fill='none'/%3E%3Ccircle cx='24' cy='8' r='5' fill='%23e8232a'/%3E%3C/svg%3E">
<title>Blended Zebra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --k:#000; --w:#fff; --r:#e8232a;
  --disp:'Sora',-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  font-family:var(--disp);color:var(--w);background:var(--k)}
#app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px)}
.page{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:100%}
.hide{display:none!important}
.kick{font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.24em;color:var(--r);text-transform:uppercase}
h1{font-weight:900;font-size:clamp(34px,10vw,58px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
h1 .z{color:var(--r)}
.stripes{height:10px;background:repeating-linear-gradient(-55deg,var(--w) 0 14px,var(--k) 14px 28px);
  background-size:200% 100%;animation:stripeMove 14s linear infinite}
@keyframes stripeMove{to{background-position:-80px 0}}
.page{animation:pageIn .28s cubic-bezier(.2,.9,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}}
.btn{display:block;width:100%;padding:15px 20px;border:2px solid var(--w);background:var(--w);color:var(--k);
  font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;min-height:54px}
.btn:active{transform:translate(2px,2px)}
.btn.red{background:var(--r);border-color:var(--r);color:var(--w)}
.btn.ghost{background:none;color:var(--w)}
.btn:disabled{opacity:.35}
/* HUD */
#hud{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid #ffffff55;padding:.35em .7em;font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.06em;white-space:nowrap}
.pill b{color:var(--r)}
#hpbar{height:14px;border:2px solid var(--w);position:relative;overflow:hidden}
#hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.1em;z-index:2}
/* enemy */
#foe{border:2px solid var(--w);padding:14px;display:flex;gap:14px;align-items:center;position:relative}
#foeArt{width:92px;height:92px;flex-shrink:0;border:2px solid var(--w);overflow:hidden;position:relative}
#foeArt .jtm{position:absolute;inset:0;background-size:cover;background-position:center}
#foeName{font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:.02em}
#foeHp{height:10px;border:1.5px solid var(--w);margin-top:6px;overflow:hidden}
#intent{font-family:var(--mono);font-weight:800;font-size:12px;margin-top:7px;color:var(--w)}
#intent b{color:var(--r)}
#foeStats{font-family:var(--mono);font-size:10px;color:#ffffff88;margin-top:4px;letter-spacing:.06em}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hitflash::after{content:'';position:absolute;inset:0;background:var(--r);animation:hflash .28s;pointer-events:none}
@keyframes hflash{0%{opacity:.85}100%{opacity:0}}
.card.played{transform:translateY(-34px) scale(1.08);opacity:0;transition:transform .16s,opacity .16s}
.fnum{position:fixed;z-index:50;font-family:var(--mono);font-weight:800;font-size:22px;pointer-events:none;
  text-shadow:2px 2px 0 #000;animation:fnum .8s forwards}
@keyframes fnum{from{transform:translateY(0);opacity:1}to{transform:translateY(-56px);opacity:0}}
#pflash{position:fixed;inset:0;z-index:45;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,var(--r));
  opacity:0}
#pflash.on{animation:pfl .4s}
@keyframes pfl{0%{opacity:.7}100%{opacity:0}}
#turnBanner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scaleX(0);z-index:44;pointer-events:none;
  background:var(--r);color:var(--w);font-family:var(--mono);font-weight:800;letter-spacing:.3em;font-size:14px;
  padding:.6em 2em;white-space:nowrap}
#turnBanner.on{animation:tb .8s}
@keyframes tb{0%{transform:translate(-50%,-50%) scaleX(0)}18%{transform:translate(-50%,-50%) scaleX(1)}
  82%{transform:translate(-50%,-50%) scaleX(1)}100%{transform:translate(-50%,-50%) scaleX(0)}}
.ceremony{position:fixed;inset:0;z-index:60;background:#000000e8;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px}
.ceremony .duo{display:flex;gap:10px;align-items:center}
.ceremony .duo .card{width:110px;min-height:150px;animation:slamIn .5s cubic-bezier(.6,0,.4,1) forwards}
.ceremony .duo .card:last-child{animation-name:slamIn2}
@keyframes slamIn{to{transform:translateX(56px) rotate(-6deg)}}
@keyframes slamIn2{to{transform:translateX(-56px) rotate(6deg)}}
.ceremony .result{width:140px;animation:resultPop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes resultPop{from{transform:scale(0) rotate(-8deg)}}
.ceremony .zap{font-weight:900;font-size:44px;color:var(--r);animation:zapPulse .5s infinite alternate}
@keyframes zapPulse{to{transform:scale(1.25)}}
#stampV{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-8deg) scale(0);z-index:55;pointer-events:none;
  border:6px solid var(--r);color:var(--r);font-weight:900;font-size:clamp(38px,12vw,64px);letter-spacing:.06em;
  padding:.15em .5em;text-transform:uppercase;background:#000000cc}
#stampV.on{animation:stampIn .9s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stampIn{0%{transform:translate(-50%,-50%) rotate(-8deg) scale(2.4);opacity:0}
  35%{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:1}
  100%{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:1}}
.ovlDeck{position:fixed;inset:0;z-index:58;background:#000000f0;overflow-y:auto;padding:20px}
.ovlDeck .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-width:640px;margin:0 auto}
/* deep polish */
#wipe{position:fixed;inset:0;z-index:80;pointer-events:none;transform:translateX(-102%);
  background:repeating-linear-gradient(-55deg,var(--w) 0 22px,var(--k) 22px 44px)}
#wipe.go{animation:wipeX .52s cubic-bezier(.6,0,.4,1) forwards}
@keyframes wipeX{0%{transform:translateX(-102%)}45%{transform:translateX(0)}55%{transform:translateX(0)}100%{transform:translateX(102%)}}
#foeArt .jtm{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035) translateY(-1px)}}
.quip{position:absolute;right:6px;top:-14px;z-index:5;background:var(--w);color:var(--k);border:2px solid var(--k);
  font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.04em;padding:4px 8px;white-space:nowrap;
  animation:quipIn 2.2s forwards;pointer-events:none}
@keyframes quipIn{0%{transform:scale(0) rotate(4deg)}12%{transform:scale(1) rotate(-2deg)}
  80%{opacity:1;transform:translateY(0) rotate(-2deg)}100%{opacity:0;transform:translateY(-14px) rotate(-2deg)}}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.bcell{position:relative;border:2px solid #ffffff44;height:158px;overflow:hidden}
.bcell.locked .bart{filter:brightness(.14)}
.bcell .bart{position:absolute;inset:0 0 34px 0}
.bcell .bname{position:absolute;left:0;right:0;bottom:0;height:34px;padding:3px 5px;border-top:1.5px solid #ffffff33;
  font-family:var(--mono);font-weight:800;font-size:8.5px;letter-spacing:.04em;line-height:1.4}
.bcell .bname b{color:var(--r)}
.foeDie{animation:foeDie .55s cubic-bezier(.6,0,.8,.4) forwards!important}
@keyframes foeDie{to{transform:rotate(14deg) translateY(30px) scale(.8);opacity:0;filter:contrast(2)}}
.intIc{display:inline-block;animation:intBob 1.1s ease-in-out infinite}
@keyframes intBob{50%{transform:translateY(-3px)}}
.chip{display:inline-block;border:1.5px solid #ffffff44;padding:.2em .5em;font-family:var(--mono);
  font-weight:800;font-size:10px;letter-spacing:.06em;margin-right:5px}
.chip.hot{border-color:var(--r);color:var(--r)}
.hot{color:var(--r)}
.gwrap{position:relative}
.gwrap .ghost{position:absolute;left:0;top:0;bottom:0;background:#ffffff55;transition:width .8s .3s}
.gwrap .real{position:absolute;left:0;top:0;bottom:0;background:var(--r);transition:width .25s}
#bEnd.pulse{animation:endPulse 1s infinite}
@keyframes endPulse{50%{box-shadow:0 0 0 4px var(--r);filter:brightness(1.25)}}
#energy.dry{animation:shk .3s}
#app.bigshake{animation:shk .3s}
#splash{position:fixed;inset:0;z-index:66;background:#000000f2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;animation:pageIn .3s}
#splash .sk{font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.3em;color:var(--r)}
#splash .sn{font-weight:900;font-size:clamp(30px,9vw,54px);text-transform:uppercase;letter-spacing:-.02em;line-height:1}
#splash .art{width:130px;height:150px;position:relative}
.relicPop{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:65;background:var(--k);
  border:2px solid var(--r);padding:18px 22px;text-align:center;max-width:86vw;animation:resultPop .35s cubic-bezier(.2,1.6,.4,1)}
.relicPop .rn{font-weight:900;font-size:19px;text-transform:uppercase;color:var(--r)}
.relicPop .rd{font-family:var(--mono);font-weight:700;font-size:11px;color:#ffffffaa;margin-top:6px;letter-spacing:.06em}
#hand > div{animation:pageIn .3s backwards;animation-delay:calc(var(--i,0) * 70ms)}
/* tutorial */
#tutScrim{position:fixed;inset:0;z-index:70;background:#000000cc;display:flex;align-items:flex-end;justify-content:center;
  padding:0 14px calc(env(safe-area-inset-bottom) + 22px)}
.tutTarget{position:relative!important;z-index:71!important;outline:3px solid var(--r);outline-offset:4px}
.tutBox{max-width:520px;width:100%;background:var(--k);border:2px solid var(--w);padding:16px;
  animation:pageIn .25s cubic-bezier(.2,.9,.3,1)}
.tutBox .tk{font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.22em;color:var(--r);text-transform:uppercase;margin-bottom:8px}
.tutBox .tb{font-family:var(--mono);font-weight:700;font-size:12.5px;line-height:1.9;color:var(--w);letter-spacing:.02em}
.tutBox .tb b{color:var(--r)}
.tutBox .btn{margin-top:12px}
.guide{position:fixed;inset:0;z-index:72;background:#000000f2;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:22px;text-align:center}
.guide .gstep{font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.24em;color:#ffffff66}
.guide .gt{font-weight:900;font-size:clamp(28px,8vw,44px);text-transform:uppercase;letter-spacing:-.02em}
.guide .gt span{color:var(--r)}
.guide .gb{font-family:var(--mono);font-weight:700;font-size:13px;line-height:2;color:#ffffffcc;max-width:34em;text-align:left}
.guide .gb b{color:var(--r)}
.guide .gnav{display:flex;gap:8px;width:100%;max-width:420px}
.guide .dots{display:flex;gap:6px}
.guide .dots i{width:10px;height:10px;background:#ffffff33}
.guide .dots i.on{background:var(--r)}
/* hand */
#hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.card{border:2px solid var(--w);background:var(--k);cursor:pointer;position:relative;display:flex;flex-direction:column;
  min-height:150px;transition:transform .1s}
.card:active{transform:scale(.96)}
@media (hover:hover){
  .card:not(.unplayable):hover{transform:translateY(-4px);box-shadow:0 6px 0 #ffffff33}
  .door:hover{background:#ffffff0d}
  .btn:hover{filter:brightness(1.12)}
}
.card.unplayable{opacity:.4}
.card .cost{position:absolute;top:-2px;left:-2px;width:26px;height:26px;background:var(--r);color:var(--w);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:13px;z-index:2}
.card .art{height:56px;border-bottom:2px solid var(--w);position:relative;overflow:hidden;background:var(--k)}
.card .art .jtm{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.15)}
.card .art .glyph{position:absolute;top:2px;right:2px;background:var(--k);border:1px solid var(--w);color:var(--w);
  font-family:var(--mono);font-weight:800;font-size:7px;letter-spacing:.08em;padding:1px 3px;z-index:2}
.card .art .glyph.hot{border-color:var(--r);color:var(--r)}
.card .nm{font-weight:900;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;padding:6px 7px 2px;line-height:1.15;
  word-break:break-word;overflow-wrap:anywhere}
.card .fx{font-family:var(--mono);font-weight:700;font-size:9.5px;color:#ffffffbb;padding:2px 7px 8px;line-height:1.5;flex:1;
  display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.card .fx b{color:var(--r)}
.card.blend .nm{color:var(--r)}
/* rarity borders · brightness is the currency */
.card.r0{border-color:#ffffff66}
.card.r1{border-color:var(--w)}
.card.r2{border-color:var(--r)}
.card.r3{border-color:transparent;
  background:linear-gradient(var(--k),var(--k)) padding-box,
    repeating-linear-gradient(45deg,var(--r) 0 9px,var(--w) 9px 18px) border-box;
  background-size:auto,300% 300%;animation:legendMove 4s linear infinite}
@keyframes legendMove{to{background-position:0 0,60px 60px}}
.rtag{position:absolute;bottom:2px;left:2px;background:var(--k);border:1px solid var(--r);color:var(--r);
  font-family:var(--mono);font-weight:800;font-size:6.5px;letter-spacing:.1em;padding:1px 3px;z-index:2}
.card.pow .art{background:repeating-linear-gradient(45deg,#111 0 8px,#000 8px 16px)}
.card.sel{outline:3px solid var(--r);outline-offset:2px}
/* battle bottom */
#btm{display:flex;gap:8px;align-items:center}
#energy{width:52px;height:52px;border:2px solid var(--r);color:var(--w);background:var(--k);flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800}
#energy b{font-size:19px;color:var(--r)}
#energy span{font-size:8px;letter-spacing:.1em}
#piles{font-family:var(--mono);font-size:10px;color:#ffffff88;letter-spacing:.08em;line-height:1.8}
/* map doors */
.door{border:2px solid var(--w);padding:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.door:active{transform:translate(2px,2px)}
.door .dn{font-weight:900;font-size:16px;text-transform:uppercase}
.door .dd{font-family:var(--mono);font-size:10px;color:#ffffff88;letter-spacing:.06em;margin-top:3px}
.door .ic{font-size:24px}
.door.elite{border-color:var(--r)} .door.elite .dn{color:var(--r)}
/* overlays / lists */
.big{font-weight:900;font-size:clamp(24px,7vw,40px);text-transform:uppercase;letter-spacing:-.02em;line-height:1}
.big .z{color:var(--r)}
.sub{font-family:var(--mono);font-size:12px;color:#ffffffaa;line-height:1.9;letter-spacing:.03em}
.ach{border:1.5px solid #ffffff44;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.ach .an{font-weight:800;font-size:13px;text-transform:uppercase}
.ach .ap{font-family:var(--mono);font-size:10px;color:#ffffff88;letter-spacing:.05em;margin-top:2px}
.ach .tick{font-family:var(--mono);font-weight:800;color:var(--r);font-size:12px;white-space:nowrap}
.ach.pow{border-color:var(--r);animation:powIn .35s cubic-bezier(.2,1.6,.4,1) both}
.ach.pow:active{transform:scale(.97)}
@keyframes powIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1}}
/* skill tree */
#treeWrap{overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scroll-snap-type:x proximity}
#treeRow{display:flex;gap:16px;width:max-content;align-items:flex-end}
.branch{scroll-snap-align:start}
#growRow{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
#swipeHint{font-family:var(--mono);font-weight:800;font-size:9px;letter-spacing:.22em;color:var(--r);text-align:center;
  animation:swipeNudge 1.6s ease-in-out infinite;transition:opacity .4s}
@keyframes swipeNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.tnode.justBought{animation:nodeBought .55s cubic-bezier(.2,1.8,.4,1)}
@keyframes nodeBought{0%{transform:scale(1.12);box-shadow:0 0 0 8px #e8232a88}100%{transform:scale(1);box-shadow:0 0 0 0 #e8232a00}}
.btn.claimable{border-color:var(--r);animation:claimPulse 1.6s ease-in-out infinite}
@keyframes claimPulse{0%,100%{box-shadow:0 0 0 0 #e8232a00}50%{box-shadow:0 0 0 4px #e8232a66}}
.branch{width:158px;flex:0 0 auto;display:flex;flex-direction:column-reverse}
.bh{display:flex;gap:8px;align-items:center;border:1.5px solid var(--r);padding:8px 10px;background:var(--r)}
.bh .bic{font-size:16px}
.bh .bn{font-weight:900;font-size:13px;letter-spacing:.06em;color:#fff}
.bh .bt{font-family:var(--mono);font-size:8px;font-weight:800;letter-spacing:.16em;color:#ffffffcc}
.tnode{border:1.5px solid #ffffff30;padding:8px 9px;position:relative;margin-bottom:16px}
.tnode::after{content:'';position:absolute;left:50%;bottom:-16px;width:2px;height:16px;background:#ffffff30}
.tnode.own{border-color:var(--r);background:#ffffff08}
.tnode.own::after,.tnode.avail::after{background:var(--r)}
.tnode.avail{border-color:#f2f2f2;cursor:pointer;animation:availPulse 2.2s ease-in-out infinite}
@keyframes availPulse{0%,100%{box-shadow:0 0 0 0 #e8232a00}50%{box-shadow:0 0 0 3px #e8232a55}}
.tnode.avail:active{transform:scale(.97)}
.tnode.poor{border-color:#ffffff55;cursor:pointer}
.tnode.lock{opacity:.35;cursor:pointer}
.tnode.rep .tn::before{content:'∞ ';color:var(--r)}
.tnode .tn{font-weight:800;font-size:11px;text-transform:uppercase;line-height:1.25}
.tnode .tn .lv{color:var(--r);font-family:var(--mono);font-size:10px}
.tnode .td{font-family:var(--mono);font-size:8.5px;color:#ffffff88;margin-top:3px;letter-spacing:.02em;line-height:1.5}
.tnode .tc{font-family:var(--mono);font-weight:800;font-size:10px;margin-top:5px;color:var(--r)}
.tnode.own .tc{color:#f2f2f2}
#toast{position:fixed;left:50%;top:12%;transform:translateX(-50%) scale(0);z-index:40;pointer-events:none;
  font-family:var(--mono);font-weight:800;font-size:clamp(11px,3vmin,15px);letter-spacing:.06em;text-transform:uppercase;
  background:var(--w);color:var(--k);border:3px solid var(--r);padding:.55em 1.1em;white-space:nowrap;
  transition:transform .18s cubic-bezier(.2,1.6,.4,1)}
#toast.on{transform:translateX(-50%) scale(1) rotate(-1.5deg)}
.relicRow{display:flex;gap:6px;flex-wrap:wrap}
.relic{border:1.5px solid var(--r);padding:.3em .55em;font-family:var(--mono);font-weight:800;font-size:9.5px;letter-spacing:.04em;color:var(--w)}
.zline{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#ffffff88;line-height:2}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="pflash"></div>
<div id="turnBanner">FOE ACTS</div>
<div id="stampV">K.O.</div>

<script>
'use strict';
/* ============================================================
   BLENDED ZEBRA · endless B/W/R deckbuilder · StS-blooded
   ============================================================
   JTM MEDIA FORMAT (v1) — drop-in art for cards/enemies/relics.
   Put images in /zebra/art/ and register them here (or just name
   the file after the art key — the loader auto-tries art/<key>.png,
   .jpg, .webp in that order). Entry options:
     JTM.manifest['card-bite'] = {
       src: 'art/card-bite.png',   // optional if file is named after key
       fit: 'cover'|'contain',     // default cover
       px: .5, py: .3,             // focus point 0..1 (background-position)
       mono: true,                 // force grayscale+contrast (default true —
     };                            //   keeps grok art on-palette)
   Anything without an image gets procedural zebra art. Send images
   any time; nothing else in the game needs to change.
   ============================================================ */
const JTM = {
  version: 1,
  base: 'art/',
  exts: ['png', 'jpg', 'webp'],
  manifest: {},            /* key -> entry (see above) */
  cache: {},               /* key -> resolved url | null */
  resolve(key, cb){
    if (key in this.cache) return cb(this.cache[key]);
    const entry = this.manifest[key] || {};
    const tries = entry.src ? [entry.src] : this.exts.map(e => this.base + key + '.' + e);
    const next = i => {
      if (i >= tries.length){ this.cache[key] = null; cb(null); return; }
      const img = new Image();
      img.onload = () => { this.cache[key] = tries[i]; cb(tries[i]); };
      img.onerror = () => next(i + 1);
      img.src = tries[i];
    };
    next(0);
  },
  css(key, el){
    this.resolve(key, url => {
      if (!url || !el.isConnected) return;
      const m = this.manifest[key] || {};
      const d = document.createElement('div');
      d.className = 'jtm';
      d.style.backgroundImage = `url(${url})`;
      d.style.backgroundSize = m.fit === 'contain' ? 'contain' : 'cover';
      d.style.backgroundRepeat = 'no-repeat';
      d.style.backgroundPosition = `${(m.px ?? .5) * 100}% ${(m.py ?? .5) * 100}%`;
      if (m.mono === false) d.style.filter = 'none';
      el.prepend(d);
    });
  },
};

let ACTX = null, AMASTER = null;
function audio(){
  if (ACTX) return ACTX;
  ACTX = new (window.AudioContext || window.webkitAudioContext)();
  AMASTER = ACTX.createGain(); AMASTER.gain.value = .15;
  const dc = ACTX.createDynamicsCompressor();
  AMASTER.connect(dc); dc.connect(ACTX.destination);
  return ACTX;
}
function tone(type, f0, f1, dur, vol, delay = 0){
  audio();
  const t = ACTX.currentTime + delay;
  const o = ACTX.createOscillator(), g = ACTX.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(AMASTER); o.start(t); o.stop(t + dur + .03);
}
function nzz(dur, vol, hp, delay = 0){
  audio();
  const t = ACTX.currentTime + delay;
  const len = Math.ceil(ACTX.sampleRate * dur);
  const buf = ACTX.createBuffer(1, len, ACTX.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ACTX.createBufferSource(); src.buffer = buf;
  const f = ACTX.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = ACTX.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  src.connect(f); f.connect(g); g.connect(AMASTER); src.start(t);
}

/* ============================================================
   MUSIC · 14-BIT SEXY™ (mathematically 7-bit. emotionally 14.)
   92 BPM swung groove · Am7-Dm7-Fmaj7-E7 · walking bass ·
   vibrato saw lead through a real bit-crusher and slap-back.
   Chill everywhere; drums and lead wake up in battle.
   ============================================================ */
const Music = (() => {
  let timer = null, step = 0, nextT = 0, battle = false, bus = null;
  const BPM = 92, S16 = 60 / BPM / 4, SW = S16 * .33;
  const N = m => 440 * Math.pow(2, (m - 69) / 12);
  const PROG = [
    { root: 45, chord: [57, 60, 64, 67] },   /* Am7 */
    { root: 50, chord: [57, 62, 65, 69] },   /* Dm7 */
    { root: 41, chord: [57, 60, 65, 69] },   /* Fmaj7 */
    { root: 40, chord: [56, 59, 64, 68] },   /* E7 */
  ];
  const BASSPAT = [0, null, null, 7, null, null, 5, null, 0, null, 3, null, 5, null, 7, 10];
  const RIFF = [76, 74, 72, 69, 67, 69, 72, 74, 76, 79, 76, 74, 72, 69, 67, 64];
  function ensureBus(){
    if (bus) return;
    audio();
    bus = ACTX.createGain(); bus.gain.value = .8;
    /* the fourteen bits (allegedly) */
    const crush = ACTX.createWaveShaper();
    const steps = 128, curve = new Float32Array(8192);
    for (let i = 0; i < 8192; i++){ const x = i / 4096 - 1; curve[i] = Math.round(x * steps) / steps; }
    crush.curve = curve;
    const lp = ACTX.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2800; lp.Q.value = .5;
    const delay = ACTX.createDelay(.7); delay.delayTime.value = S16 * 6;
    const fb = ACTX.createGain(); fb.gain.value = .18;
    const wet = ACTX.createGain(); wet.gain.value = .12;
    bus.connect(crush); crush.connect(lp); lp.connect(AMASTER);
    lp.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(AMASTER);
  }
  function note(midi, t, dur, vol, type = 'square', vib = 0){
    const o = ACTX.createOscillator(), g = ACTX.createGain();
    o.type = type; o.frequency.value = N(midi);
    if (vib){
      const l = ACTX.createOscillator(), lg = ACTX.createGain();
      l.frequency.value = 5.2; lg.gain.value = vib;
      l.connect(lg); lg.connect(o.detune); l.start(t); l.stop(t + dur);
    }
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .025);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + .05);
  }
  function sched(i, t){
    const bar = Math.floor(i / 16) % 4, pos = i % 16;
    const P = PROG[bar];
    const b = BASSPAT[pos];
    if (b !== null) note(P.root + b, t, S16 * 1.9, .3, 'triangle');
    if (pos === 0) P.chord.forEach((m, ci) => note(m, t + ci * .018, S16 * 13, .045, 'square', 7));
    /* lead: shy in the menus, confident in a fight */
    const leadOn = battle ? pos % 2 === 0 : (bar % 2 === 1 && pos % 4 === 0);
    if (leadOn && Math.sin(i * 2.7) > -.1){
      note(RIFF[(i * 7 + bar * 3) % 16], t, S16 * (battle ? 1.7 : 3.2), .085, 'sawtooth', 16);
    }
    /* drums (uncrushed, straight to master, for punch) */
    if (pos === 0 || pos === 8) tone('sine', 105, 42, .15, .38);
    if (pos === 4 || pos === 12) nzz(.05, .14, 1800);
    if (battle){
      if (pos % 2 === 0) nzz(.02, pos % 4 === 0 ? .07 : .04, 7000);
      if (pos === 14 && bar % 2) tone('sine', 82, 48, .14, .25);
    } else if (pos % 4 === 2) nzz(.02, .035, 8000);
  }
  function tick(){
    while (nextT < ACTX.currentTime + .12){
      sched(step, nextT + (step % 2 ? SW : 0));
      step++; nextT += S16;
    }
  }
  return {
    start(){
      if (META.music === false) return;
      ensureBus(); ACTX.resume();
      if (!timer){ nextT = ACTX.currentTime + .05; timer = setInterval(tick, 25); }
    },
    stop(){ clearInterval(timer); timer = null; },
    setBattle(b){ battle = b; },
    on(){ return META.music !== false; },
    toggle(){
      META.music = META.music === false ? true : false;
      saveMeta();
      if (META.music === false) this.stop(); else this.start();
      return this.on();
    },
    running(){ return !!timer; },
  };
})();

/* ---------- procedural zebra art (fallback when no JTM image) ---------- */
function zart(seed, accent = false){
  let s = 0; for (const c of seed) s = (s * 31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => (s = (s * 1103515245 + 12345) >>> 0) / 4294967296;
  let stripes = '';
  for (let i = 0; i < 7; i++){
    const x = i * 16 + rnd() * 8, w = 5 + rnd() * 8, k = rnd() * 30 - 15;
    stripes += `<path d="M${x} -10 q ${k} 40 ${k * .4} 80" stroke="${accent && i === 3 ? 'var(--r)' : '#fff'}" stroke-width="${w}" fill="none"/>`;
  }
  const eye = rnd() > .5 ? `<circle cx="${20 + rnd() * 60}" cy="${14 + rnd() * 24}" r="4" fill="var(--r)"/>` : '';
  return `<svg viewBox="0 0 110 60" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0">${stripes}${eye}</svg>`;
}

const CAPS = { dmg: 999, blk: 999, draw: 5, heal: 60, weak: 3, str: 9, autoblk: 30, self: 9, energy: 4, multi: 10, stripegen: 12, cost: [0, 4] };
function blendCards(a, b){
  const num = (k, f = 1) => {
    const v = Math.round(((a[k] || 0) + (b[k] || 0)) * f);
    return v > 0 ? Math.min(v, CAPS[k] || 999) : undefined;
  };
  const flag = k => (a[k] || b[k]) ? true : undefined;
  const c = {
    uid: Math.random().toString(36).slice(2),
    rar: Math.min(3, Math.max(a.rar || 0, b.rar || 0) + 1),   /* blending climbs the ladder · legendary is blend-only */
    id: 'blend', name: blendName(a.name, b.name),
    cost: clamp(Math.round(((a.cost || 0) + (b.cost || 0)) / 2), CAPS.cost[0], CAPS.cost[1]),
    blend: true,
    dmg: num('dmg', .85), blk: num('blk', .85),
    draw: num('draw'), heal: num('heal'), weak: num('weak'),
    str: num('str'), autoblk: num('autoblk'), self: num('self'),
    energy: num('energy'), stripegen: num('stripegen'),
    frenzy: flag('frenzy'), mirror: flag('mirror'), quake: flag('quake'),
    gamble: flag('gamble'), echo: flag('echo'), molt: flag('molt'),
    zmath: flag('zmath'), mystery: flag('mystery'),
  };
  /* multi-hit: keep the larger, +1 if both sides had one */
  const am = a.multi || 0, bm = b.multi || 0;
  if (am || bm) c.multi = Math.min(CAPS.multi, Math.max(am, bm) + (am && bm ? 1 : 0));
  /* skill tree: Smooth Operator lineage sweetens every new blend */
  const bb = typeof treeVal === 'function' ? treeVal('blendBonus') : 0;
  if (bb){
    if (c.dmg) c.dmg = Math.min(CAPS.dmg, c.dmg + bb);
    if (c.blk) c.blk = Math.min(CAPS.blk, c.blk + bb);
  }
  c.type = (a.type === 'pow' || b.type === 'pow') ? 'pow'
    : (c.dmg || c.frenzy || c.mirror || c.quake) ? 'atk' : 'skl';
  const bits = [];
  if (c.dmg) bits.push(`Deal <b>${c.dmg}</b>${c.multi ? ` × <b>${c.multi}</b>` : ''}.`);
  else if (c.multi) bits.push(`Hit × <b>${c.multi}</b>.`);
  if (c.frenzy) bits.push(`+<b>3×</b> cards played.`);
  if (c.mirror) bits.push(`+dmg = your <b>block</b>.`);
  if (c.quake) bits.push(`+1 dmg per 3 discarded.`);
  if (c.self) bits.push(`Take <b>${c.self}</b>.`);
  if (c.blk) bits.push(`Block <b>${c.blk}</b>.`);
  if (c.draw) bits.push(`Draw ${c.draw}.`);
  if (c.heal) bits.push(`Heal <b>${c.heal}</b>.`);
  if (c.energy) bits.push(`+<b>${c.energy}</b> energy.`);
  if (c.weak) bits.push(`Foe −2 atk.`);
  if (c.zmath) bits.push(`Draw = energy left.`);
  if (c.molt) bits.push(`Redraw hand.`);
  if (c.echo) bits.push(`Copy a hand card.`);
  if (c.gamble) bits.push(`Coin: +2⚡ or take 3.`);
  if (c.mystery) bits.push(`Does <b>something</b>.`);
  if (c.str) bits.push(`<b>Pow:</b> +${c.str} str.`);
  if (c.autoblk) bits.push(`<b>Pow:</b> +${c.autoblk} blk/turn.`);
  if (c.stripegen) bits.push(`<b>Pow:</b> +${c.stripegen} ◆/turn.`);
  c.desc = bits.join(' ') || 'Does absolutely nothing. A collector\'s item.';
  return c;
}

  const kinds = [

  () => ({ name: 'Shiny Pebble', ic: '◆', desc: '+10% stripes from battles', goldMul: .1 }),
  () => ({ name: 'War Snort', ic: '☄', desc: 'First attack each battle +3', firstHit: 3 }),
  () => ({ name: 'Quick Sip', ic: '♥', desc: 'Heal 10 HP right now', now: r => r.hp = Math.min(r.mhp, r.hp + 10) }),
  () => ({ name: 'Stripe Dividend', ic: '◆', desc: `+${20 + (typeof R === 'object' && R ? R.floor * 2 : 0)} stripes right now`, now: r => { const g = 20 + r.floor * 2; r.stripes += g; toast('◆ +' + g + ' STRIPES', 1200); } }),
];
function rollPowerups(n = 2){
  const out = [];
  while (out.length < Math.min(n, POWERUPS.length)){
    const p = pick(POWERUPS)();
    if (!out.some(x => x.name === p.name)) out.push(p);
  }
  return out;
}
function applyPowerup(p){
  if (p.now){ p.now(R); }
  else {
    R.relics.push({ name: p.name, desc: p.desc, pw: true,
      ...['str', 'hp', 'autoblk', 'healAfter', 'goldMul', 'firstHit'].reduce((o, k) => (p[k] != null && (o[k] = p[k]), o), {}) });
    if (p.hp){ R.mhp += p.hp; R.hp += p.hp; }
  }
  SFX.ach();
  saveRun();
}

function artFor(foe, f = 0){
  if (foe.vill) return VART(foe.id, f);
  if (['hyena', 'vulture', 'jackal', 'croc', 'baboon', 'lioness', 'alpha', 'lion', 'crocking', 'blender'].includes(foe.id)) return FOEART(foe.id, f);
  return zart(foe.id + foe.name, true);
}

function scaleFoe(base, floor, mult = 1){
  const s = 1 + floor * .13;
  return {
    ...base, mhp: Math.round(base.hp * s * mult), hp: Math.round(base.hp * s * mult),
    atk: Math.round(base.atk * (1 + floor * .09) * mult),
    blk: 0, str: 0, pi: 0, weak: 0,
  };
}
function makeFoe(floor, kind){
  if (kind === 'boss'){
    const b = BOSSES[(Math.floor(floor / 5) - 1) % BOSSES.length];
    const cycles = Math.floor((Math.floor(floor / 5) - 1) / BOSSES.length);
    return scaleFoe(b, floor, 1 + cycles * .6);
  }
  if (kind === 'elite'){
    /* elites are the Rogues' Gallery — fictional villain archetypes */
    const v = pick(VILLAINS);
    const foe = scaleFoe(v, floor, 1.15);
    foe.vill = true;
    return foe;
  }
  const f = pick(FOES.slice(0, clamp(2 + Math.floor(floor / 2), 2, FOES.length)));
  return scaleFoe(f, floor, 1);
}

const ACH_FAMS = [
  ['damage', 'Damage Dealt', 'stat'], ['cards', 'Cards Played', 'stat'], ['blocks', 'Block Gained', 'stat'],
  ['kills', 'Foes Dropped', 'stat'], ['blends', 'Cards Blended', 'stat'], ['floors', 'Best Floor', 'max'],
  ['bosses', 'Bosses Beaten', 'stat'],
];
const thresh = n => Math.round(10 * Math.pow(2.2, n));            /* 10, 22, 48, 106… forever */
function defaultMeta(){
  return { stripes: 0, herd: 0, unlocks: 0, stats: { damage: 0, cards: 0, blocks: 0, kills: 0, blends: 0, floors: 0, runs: 0, bosses: 0 },
    achTiers: {}, bonusHp: 0, bonusStripe: 0, startRelics: 0, tips: {}, bestiary: {}, tree: {},
    clsOwned: ['zeb'], clsSel: 'zeb' };
}
let META = defaultMeta();
function loadMeta(){
  try { META = { ...defaultMeta(), ...JSON.parse(localStorage.getItem('zebra-meta') || '{}') }; }
  catch {}
  META.stats = { ...defaultMeta().stats, ...(META.stats || {}) };
  META.tree = META.tree || {};
}
function saveMeta(){ localStorage.setItem('zebra-meta', JSON.stringify(META)); }
function bumpStat(k, n, isMax = false){
  if (isMax) META.stats[k] = Math.max(META.stats[k], n);
  else META.stats[k] += n;
  const fam = ACH_FAMS.find(f => f[0] === k);
  if (!fam) return;
  let tier = META.achTiers[k] || 0;
  while (META.stats[k] >= thresh(tier)){
    tier++;
    META.achTiers[k] = tier;
    META.stripes += tier * 8;
    toast(`🏆 ${fam[1]} ${roman(tier)} · +${tier * 8} STRIPES`, 2000);
    if (typeof SFX !== 'undefined') SFX.ach();
  }
  saveMeta();
}

function nodeLvl(id){ return (META.tree || {})[id] || 0; }
function nodeCost(n){ return n.rep ? Math.round(n.cost * Math.pow(n.rep, nodeLvl(n.id))) : n.cost; }
function treeVal(k){
  let s = 0;
  TREE.forEach(b => b.nodes.forEach(n => {
    const lvl = nodeLvl(n.id);
    if (lvl && n.fx[k]) s += n.fx[k] * lvl;
  }));
  return s;
}
function treeOwned(){ return TREE.reduce((s, b) => s + b.nodes.reduce((t, n) => t + nodeLvl(n.id), 0), 0); }
function treeClaimable(){
  return TREE.some(b => b.nodes.some((n, ni) => {
    const open = ni === 0 || nodeLvl(b.nodes[ni - 1].id) > 0;
    return open && (n.rep || nodeLvl(n.id) === 0) && META.stripes >= nodeCost(n);
  }));
}

function drawCards(n){
  for (let i = 0; i < n; i++){

      B.drawPile = shuffle(B.discard);
      B.discard = [];
      if (!B.drawPile.length) return;
    }
    if (B.hand.length < 10) B.hand.push(B.drawPile.pop());
    else B.discard.push(B.drawPile.pop());
  }
}
function foeIntent(){
  const f = B.foe;
  const kind = f.pat[f.pi % f.pat.length];
  if (kind === 'atk'){
    const n = Math.max(1, f.atk + f.str - (f.weak ? 2 : 0));
    return `<span class="intIc">⚔</span> INTENT: <b>ATTACK ${n}</b>`;
  }
  if (kind === 'blk') return '<span class="intIc">🛡</span> INTENT: BRACING (+block)';
  return '<span class="intIc">📈</span> INTENT: <b style="color:var(--r)">GETTING ANGRIER</b>';
}
function statChips(){
  const bits = [];
  if (B.block) bits.push(`<span class="chip">🛡 BLK ${B.block}</span>`);
  if (B.str) bits.push(`<span class="chip hot">⚔ STR +${B.str}</span>`);
  if (B.autoblk) bits.push(`<span class="chip">♻ AUTO-BLK ${B.autoblk}</span>`);
  if (B.stripegen) bits.push(`<span class="chip hot">◆ +${B.stripegen}/TURN</span>`);
  if (B.firstHit) bits.push(`<span class="chip hot">☄ FIRST HIT +${B.firstHit}</span>`);
  return bits.join('') || '<span class="chip" style="opacity:.5">NO EFFECTS</span>';
}
function foeChips(){
  const f = B.foe, bits = [];
  if (f.blk) bits.push(`<span class="chip">🛡 ${f.blk}</span>`);
  if (f.str) bits.push(`<span class="chip hot">⚔ +${f.str}</span>`);
  if (f.weak) bits.push(`<span class="chip">💫 WEAK</span>`);
  return bits.join('');
}
function renderBattle(){
  app.innerHTML = '';
  const f = B.foe;
  const p = el(`<div class="page">
    ${hudHtml()}
    <div id="foe">
      <div id="foeArt" data-art="foe-${f.id}">${artFor(f, FOE_F)}</div>
      <div style="flex:1">
        <div id="foeName">${f.name}</div>
        ${f.ep ? `<div style="font-family:var(--mono);font-weight:800;font-size:9.5px;letter-spacing:.1em;color:var(--r)">(${f.ep})</div>` : ''}
        <div id="foeHp" class="gwrap"><div class="ghost" style="width:${f.hp / f.mhp * 100}%"></div><div class="real" style="width:${f.hp / f.mhp * 100}%"></div></div>
        <div id="intent">${foeIntent()}</div>
        <div id="foeStats" style="margin-top:5px">HP ${f.hp}/${f.mhp} &nbsp;${foeChips()}</div>
      </div>
    </div>
    <div class="zline" style="display:flex;align-items:center;flex-wrap:wrap;gap:6px">
      <div id="youZeb" class="liveArt" data-rig="zeb" style="width:78px;height:58px;position:relative;flex-shrink:0"></div>
      <div>YOU · TURN ${B.turn}<br>${statChips()}</div>
    </div>
    <div id="hand"></div>
    <div id="btm">
      <div id="energy"><b>${B.energy}</b><span>ENERGY</span></div>
      <div id="piles">DRAW ${B.drawPile.length}<br><span id="discardBtn" style="cursor:pointer;text-decoration:underline">DISCARD ${B.discard.length}</span></div>
      <button class="btn red" id="bEnd" style="flex:1">End turn</button>
    </div>
  </div>`);
  app.appendChild(p);
  JTM.css('foe-' + f.id, $('#foeArt'));
  const hand = $('#hand');
  B.hand.forEach((c, i) => {
    const cd = el(cardHtml(c, B.energy < c.cost));
    /* live numbers: show boosted damage + frenzy's current value */
    const fx = cd.querySelector('.fx');
    if (c.dmg && (B.str || B.firstHit)){
      const eff = c.dmg + B.str + (B.firstHit || 0);
      fx.innerHTML = fx.innerHTML.replace(`<b>${c.dmg}</b>`, `<b class="hot">${eff}</b>`);
    }
    if (c.frenzy) fx.innerHTML += ` <b class="hot">(NOW ${3 * (B.played + 1) + B.str})</b>`;
    if (c.mirror) fx.innerHTML += ` <b class="hot">(NOW ${B.block + B.str})</b>`;
    if (c.quake) fx.innerHTML += ` <b class="hot">(NOW ${8 + Math.floor(B.discard.length / 3) + B.str})</b>`;
    cd.onclick = () => playCard(i, cd);
    hand.appendChild(cd);
    JTM.css('card-' + c.id, cd.querySelector('.art'));
  });
  $('#bEnd').onclick = endTurn;
  $('#discardBtn').onclick = () => {
    if (!B.discard.length){ toast('DISCARD IS EMPTY. PRISTINE.'); return; }
    const sorted = [...B.discard].sort((a, b) => a.cost - b.cost);
    const o = el(`<div class="ovlDeck"><div style="max-width:640px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center">
      <span class="kick">DISCARD PILE · ${B.discard.length} CARDS</span>
      <button class="btn red" style="width:auto;min-height:40px;padding:8px 16px" id="dcClose">Close</button></div>
      <div class="grid">${sorted.map(c => cardHtml(c)).join('')}</div></div>`);
    document.body.appendChild(o);
    o.querySelector('#dcClose').onclick = () => o.remove();
  };
  /* nothing playable? light the way out */
  if (!B.hand.some(c => c.cost <= B.energy)) $('#bEnd').classList.add('pulse');
  /* tap DECK pill anywhere to inspect the deck */
  p.querySelectorAll('.pill').forEach(pl => {
    if (pl.textContent.startsWith('DECK')) pl.onclick = showDeck;
  });
}
function showDeck(){
  const sorted = [...R.deck].sort((a, b) => a.cost - b.cost || a.name.localeCompare(b.name));
  const o = el(`<div class="ovlDeck"><div style="max-width:640px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center">
    <span class="kick">YOUR DECK · ${R.deck.length} CARDS · BY COST</span>
    <button class="btn red" style="width:auto;min-height:40px;padding:8px 16px" id="dClose">Close</button></div>
    <div class="grid">${sorted.map(c => cardHtml(c)).join('')}</div></div>`);
  document.body.appendChild(o);
  o.querySelector('#dClose').onclick = () => o.remove();
}
function glyphFor(c){
  if (c.mystery || c.gamble || c.echo || c.molt || c.zmath || c.mirror || c.quake || c.frenzy) return ['WYRD', 1];
  if (c.type === 'pow') return ['PWR', 0];
  if (c.energy) return ['NRG', 0];
  if (c.dmg || c.multi) return ['ATK', 0];
  if (c.blk) return ['DEF', 0];
  if (c.draw) return ['DRW', 0];
  return ['SKL', 0];
}
function cardHtml(c, unplayable = false){
  const [g, hot] = glyphFor(c);
  const rar = c.rar || 0;
  return `<div class="card r${rar} ${c.type === 'pow' ? 'pow' : ''} ${c.blend ? 'blend' : ''} ${unplayable ? 'unplayable' : ''}">
    <div class="cost">${c.cost}</div>
    <div class="art" data-art="card-${c.id}">${zart(c.name + c.id, c.type === 'atk')}
      <span class="glyph ${hot ? 'hot' : ''}">${g}</span>
      ${rar >= 2 ? `<span class="rtag">${RAR_NAMES[rar]}</span>` : ''}</div>
    <div class="nm">${c.name}</div>
    <div class="fx">${c.desc}</div>
  </div>`;
}
function playCard(i, cardEl){
  if (B.over || B.busy || B.ending) return;
  const c = B.hand[i];
  if (!c) return;
  if (B.energy < c.cost){
    const en = $('#energy');
    if (en){ en.classList.remove('dry'); void en.offsetWidth; en.classList.add('dry'); }
    toast('NOT ENOUGH ENERGY · END TURN TO REFILL', 1200);
    return;
  }
  B.busy = true;
  if (cardEl) cardEl.classList.add('played');
  SFX.play();
  setTimeout(() => {
    B.busy = false;
    if (B.over) return;
    B.energy -= c.cost;
    B.played++;
    bumpStat('cards', 1);
    R.scards = (R.scards || 0) + 1;
    if (R.cls === 'disco' && B.played % 3 === 0){
      B.energy = Math.min(9, B.energy + 1);
      floatNum($('#energy'), '+1⚡ GROOVE', 'var(--w)');
    }
    /* remove self first so echo/molt see the true remaining hand */
    B.hand.splice(i, 1);
    /* ---- resource + weird effects (pre-damage) ---- */
    if (c.energy){ B.energy = Math.min(9, B.energy + c.energy); SFX.power(); }
    if (c.gamble){
      if (Math.random() < .5){ B.energy = Math.min(9, B.energy + 2); toast('COIN: HEADS · +2 ENERGY ⚡', 1000); SFX.ach(); }
      else { R.hp = Math.max(1, R.hp - 3); toast('COIN: TAILS · OW. −3 HP', 1000); playerFx(); SFX.playerHit(); }
    }
    let myst = null;
    if (c.mystery){
      myst = pick(['dmg', 'blk', 'draw', 'energy', 'heal']);
      toast('??? RESOLVES: ' + { dmg: '12 DAMAGE', blk: '12 BLOCK', draw: 'DRAW 3', energy: '+2 ENERGY', heal: 'HEAL 6' }[myst], 1200);
      if (myst === 'blk'){ B.block += 12; bumpStat('blocks', 12); SFX.block(); }
      if (myst === 'draw') drawCards(3);
      if (myst === 'energy') B.energy = Math.min(9, B.energy + 2);
      if (myst === 'heal'){ R.hp = Math.min(R.mhp, R.hp + 6); SFX.heal(); }
    }
    /* ---- damage (single or multi-hit) ---- */
    let base = 0;
    if (c.frenzy) base = 3 * B.played;
    else if (c.mirror) base = B.block;
    else if (c.quake) base = 8 + Math.floor(B.discard.length / 3);
    else if (c.dmg) base = c.dmg;
    if (myst === 'dmg') base += 12;
    let dmg = 0;
    if (base > 0 || c.multi){
      const hits = Math.min(c.multi || 1, CAPS.multi);
      for (let h = 0; h < hits; h++){
        let d = Math.max(base, c.multi ? 1 : 0) + B.str;
        if (h === 0 && B.firstHit){ d += B.firstHit; B.firstHit = 0; }
        const f = B.foe;
        const absorbed = Math.min(f.blk, d);
        f.blk -= absorbed;
        f.hp -= (d - absorbed);
        dmg += d;
      }
      if (dmg > 0){
        bumpStat('damage', dmg);
        R.sdmg = (R.sdmg || 0) + dmg;
      }
    }
    /* ---- the rest ---- */
    if (c.self) R.hp = Math.max(1, R.hp - c.self);
    if (c.blk){ B.block += c.blk; bumpStat('blocks', c.blk); SFX.block(); }
    if (c.heal){ R.hp = Math.min(R.mhp, R.hp + c.heal); SFX.heal(); }
    if (c.weak) B.foe.weak = Math.max(B.foe.weak, c.weak + 1);
    if (c.str) B.str = Math.min(99, B.str + c.str);
    if (c.autoblk) B.autoblk = Math.min(99, B.autoblk + c.autoblk);
    if (c.stripegen) B.stripegen = Math.min(99, (B.stripegen || 0) + c.stripegen);
    if (c.str || c.autoblk || c.stripegen) SFX.power();
    if (c.echo && B.hand.length){
      const src = B.hand[ri(B.hand.length)];
      if (B.hand.length < 10){
        B.hand.push({ ...src, uid: Math.random().toString(36).slice(2) });
        toast('ECHO: ' + src.name.toUpperCase() + ' ×2', 1000);
      }
    }
    if (c.molt){
      const n = B.hand.length;
      B.discard.push(...B.hand);
      B.hand = [];
      drawCards(n);
      if (n) toast('MOLTED ' + n + ' → DREW ' + n, 1000);
    }
    if (c.draw) drawCards(Math.min(c.draw, CAPS.draw));
    if (c.zmath && B.energy > 0) drawCards(Math.min(B.energy, CAPS.draw));
    if (c.type !== 'pow') B.discard.push(c);
    const dead = B.foe.hp <= 0;
    renderBattle();
    if (dmg){
      B.zebPose = 'atk'; B.zebUntil = Date.now() + 380;
      SFX.hit(dmg >= 12);
      hapt(dmg >= 15 ? 30 : 12);
      foeFx();
      floatNum($('#foeArt'), '-' + dmg);
      if (dmg >= 15){
        const a = document.getElementById('app');
        a.classList.remove('bigshake'); void a.offsetWidth; a.classList.add('bigshake');
      }
    }
    if (c.blk){
      floatNum($('#hpbar'), '+' + c.blk + ' BLK', 'var(--w)');
      if (!dmg){ B.zebPose = 'blk'; B.zebUntil = Date.now() + 500; }
    }
    if (dead && !B.ending){
      B.ending = true;
      const fa = $('#foeArt');
      if (fa) fa.classList.add('foeDie');
      hapt(60);
      setTimeout(winBattle, 520);
      return;
    }
  }, cardEl ? 150 : 0);
}
function endTurn(){
  if (B.over || B.busy || B.ending) return;
  B.busy = true;
  turnBanner(B.foe.name + ' ACTS');
  setTimeout(() => {
    if (B.over){ B.busy = false; return; }
    const f = B.foe;
    const kind = f.pat[f.pi % f.pat.length];
    f.pi++;
    let through = 0;
    if (kind === 'atk'){
      const n = Math.max(1, f.atk + f.str - (f.weak ? 2 : 0) - (R.cls === 'goth' ? 1 : 0));
      const absorbed = Math.min(B.block, n);
      through = n - absorbed;
      R.hp -= through;
      if (f.weak) f.weak--;
      if (through > 0){ playerFx(); SFX.playerHit(); hapt(25); B.zebPose = 'hurt'; B.zebUntil = Date.now() + 550; }
      else { SFX.block(); B.zebPose = 'blk'; B.zebUntil = Date.now() + 450; }
    } else if (kind === 'blk') f.blk += Math.round(f.atk * .8);
    else f.str += 1 + Math.floor(R.floor / 8);
    if (B.stripegen){ R.stripes += B.stripegen; }
    if (through > 0 && R.hp <= 0 && R.phoenix){
      R.phoenix = false;
      R.hp = 1;
      stampFx('ANCESTRAL CALLUS');
      toast('THE ANCESTORS SAY: NOT YET. · 1 HP', 2400);
      SFX.bell(); hapt([40, 30, 40]);
    }
    if (through > 0 && R.hp <= 0){ B.busy = false; loseRun(); return; }
    B.turn++;
    B.discard.push(...B.hand);
    B.hand = [];
    B.block = (R.cls === 'robo' ? B.block : 0) + B.autoblk;   /* robo firmware retains block */
    if (B.autoblk) bumpStat('blocks', B.autoblk);
    B.energy = B.maxEnergy + (relicSum('energy3') && B.turn % 3 === 0 ? 1 : 0);
    drawCards(5);
    saveRun();
    renderBattle();
    if (through > 0) floatNum($('#hpbar'), '-' + through);
    B.busy = false;
  }, 650);
}
function winBattle(){
  if (B.won) return;
  B.won = true;
  B.over = true;
  B.zebPose = 'win'; B.zebUntil = 0;
  Music.setBattle(false);
  META.bestiary = META.bestiary || {};
  if (!META.bestiary[B.foe.id]) toast('📖 BESTIARY: ' + B.foe.name + ' CATALOGUED', 1600);
  META.bestiary[B.foe.id] = (META.bestiary[B.foe.id] || 0) + 1;
  bumpStat('kills', 1);
  if (B.kind === 'boss') bumpStat('bosses', 1);
  const base = (B.kind === 'boss' ? 50 : B.kind === 'elite' ? 28 : 16) + Math.floor(R.floor * 2);
  const gold = Math.round(base * (1 + relicSum('goldMul') + treeVal('goldMul') + (R.cls === 'pirate' ? .4 : 0))) + META.bonusStripe + treeVal('flat');
  R.stripes += gold;
  META.stripes += Math.floor(gold / 2);
  const heal = relicSum('healAfter');
  if (heal) R.hp = Math.min(R.mhp, R.hp + heal);
  /* MIGRATION · every boss down: the herd moves, and so do your limits */
  if (B.kind === 'boss'){
    if ((R.menergy || 3) < 5){
      R.menergy = (R.menergy || 3) + 1;
      setTimeout(() => toast('⚡ MAX ENERGY → ' + R.menergy + ' · THE HERD BLESSES YOU', 2200), 1200);
    }
    R.hp = Math.min(R.mhp, R.hp + Math.round(R.mhp * .25));
    R.stripes += 30 + R.floor;
    const mfloor = R.floor, mgold = 30 + R.floor;
    setTimeout(() => { stampFx('MIGRATION'); toast('FLOOR ' + mfloor + ' · +25% HP · +' + mgold + ' ◆ · THE HERD MOVES', 2400); SFX.victory(); }, 2400);
  }
  saveMeta(); saveRun();
  stampFx(B.kind === 'boss' ? 'BOSS DOWN' : 'K.O.');
  SFX.victory();
  const g2 = gold, k2 = B.kind;
  setTimeout(() => screenReward(g2, k2), 950);
}
function screenReward(gold, kind){
  const picks = [];
  /* floors 1-4 deal simple commons; the deep pool opens at floor 5 */
  const pool = BASE_CARDS.filter(c => !['bite', 'hide'].includes(c.id) && (R.floor >= 5 || c.early));
  /* rarity roll scales with the fight: bosses never deal commons */
  const rollRar = () => {
    const r = Math.random();
    if (kind === 'boss') return r < .5 ? 2 : 1;
    if (kind === 'elite') return r < .2 ? 2 : r < .55 ? 1 : 0;
    return r < .08 ? 2 : r < .35 ? 1 : 0;
  };
  const nPicks = 3 + (treeVal('pick4') ? 1 : 0);
  while (picks.length < nPicks){
    let rar = rollRar();
    let sub = pool.filter(c => c.rar === rar);
    while (!sub.length && rar > 0){ rar--; sub = pool.filter(c => c.rar === rar); }
    if (!sub.length) sub = pool;
    const c = pick(sub);
    if (!picks.some(p => p.id === c.id) || Math.random() < .2) picks.push(mkCard(c.id));
  }
  /* deep floors offer pre-blended exotics */
  if (R.floor >= 8 && Math.random() < .4){
    picks[nPicks - 1] = blendCards(mkCard(pick(BASE_CARDS).id), mkCard(pick(BASE_CARDS).id));
  }
  app.innerHTML = '';
  const relicDrop = (kind === 'elite' || kind === 'boss');
  let relic = null;
  if (relicDrop){
    const owned = new Set(R.relics.map(r => r.id));
    const av = RELICS.filter(r => !owned.has(r.id));
    relic = av.length ? pick(av) : genRelic(R.relics.length);
  }
  /* almost every fight drops a powerup — pick one of two (tree: every fight, three choices) */
  const pows = (!relicDrop && (treeVal('powAlways') || Math.random() < .85)) ? rollPowerups(2 + (treeVal('powChoice') ? 1 : 0)) : null;
  const p = el(`<div class="page">
    ${hudHtml()}
    <div class="stripes"></div>
    <span class="kick">VICTORY · +${gold} ◆ STRIPES${relic ? ' · RELIC GET' : ''}${pows ? ' · POWERUP DROP' : ''}</span>
    ${relic ? `<div class="ach"><div><div class="an" style="color:var(--r)">${relic.name}</div><div class="ap">${relic.desc}</div></div><div class="tick">RELIC</div></div>` : ''}
    ${pows ? `<div id="powRow">${pows.map((pw, i) => `<div class="ach pow" data-p="${i}" style="cursor:pointer">
      <div><div class="an" style="color:var(--r)">${pw.ic || '⚡'} ${pw.name}</div><div class="ap">${pw.desc}</div></div><div class="tick">POW ▸</div></div>`).join('')}</div>` : ''}
    <div class="big">Take a <span class="z">card</span></div>
    <div id="hand">${picks.map((c, i) => `<div data-i="${i}" style="--i:${i}">${cardHtml(c)}</div>`).join('')}</div>
    <button class="btn ghost" id="bSkip">Skip card</button>
  </div>`);
  app.appendChild(p);
  let powTaken = !pows;
  const takePow = pw => {
    if (powTaken) return;
    powTaken = true;
    applyPowerup(pw);
    toast('⚡ ' + pw.name.toUpperCase(), 1400);
    const row = $('#powRow'); if (row) row.remove();
  };
  if (pows) p.querySelectorAll('.pow').forEach(dv => dv.onclick = () => takePow(pows[+dv.dataset.p]));
  /* leaving without choosing? the zebra grabs one on the way out */
  const autoPow = () => { if (!powTaken){ const pw = pick(pows); takePow(pw); toast('⚡ GRABBED ' + pw.name.toUpperCase() + ' ON THE WAY OUT', 1500); } };
  if (relic){
    R.relics.push(relic);
    if (relic.hp){ R.mhp += relic.hp; R.hp += relic.hp; }
    relicPop(relic);
  }
  p.querySelectorAll('#hand > div').forEach(dv => {
    JTM.css('card-' + picks[+dv.dataset.i].id, dv.querySelector('.art'));
    dv.onclick = () => {
      autoPow();
      const c = picks[+dv.dataset.i];
      R.deck.push(c);
      saveRun();
      toast('+ ' + c.name.toUpperCase() + ' · DECK ' + R.deck.length, 1300);
      wipe(screenMap);
    };
  });
  $('#bSkip').onclick = () => { autoPow(); saveRun(); screenMap(); };
  tut('reward', '#hand', 'LOOT', 'Tap a <b>powerup</b> when one drops — they stack forever. Then pick <b>one</b> card, or skip. Skipping is a real strategy: a <b>small deck</b> draws its best cards more often. Hoarders get eaten around floor 9.');
}
/* ---------- the mystery door · the psycho's favourite ---------- */
function mysteryDoor(){
  const roll = Math.random();
  if (roll < .3){
    const owned = new Set(R.relics.map(r => r.id));
    const av = RELICS.filter(r => !owned.has(r.id));
    const relic = av.length ? pick(av) : genRelic(R.relics.length);
    R.relics.push(relic);
    if (relic.hp){ R.mhp += relic.hp; R.hp += relic.hp; }
    relicPop(relic);
    toast('THE DOOR CONTAINED A RELIC. NO QUESTIONS.', 1800);
    saveRun();
    setTimeout(screenMap, 1400);
  } else if (roll < .55){
    const g = 40 + R.floor * 2;
    R.stripes += g;
    toast('◆ +' + g + ' STRIPES. THE DOOR WAS GENEROUS TODAY.', 1800);
    SFX.ach();
    saveRun();
    setTimeout(screenMap, 1200);
  } else if (roll < .8){
    toast('IT\'S AN AMBUSH! IT WAS ALWAYS AN AMBUSH!', 1600);
    SFX.bell();
    setTimeout(() => startBattle('elite'), 900);
  } else if (treeVal('safeDoor')){
    const g = 15 + R.floor;
    R.stripes += g;
    toast('THE DOOR TRIED TO BITE. YOU WERE ALREADY ELSEWHERE. ◆ +' + g, 2000);
    SFX.ach();
    saveRun();
    setTimeout(screenMap, 1400);
  } else {
    R.hp = Math.max(1, R.hp - 8);
    playerFx(); SFX.playerHit(); hapt(25);
    toast('THE DOOR BIT YOU. −8 HP. IT WAS A TRAP. OBVIOUSLY.', 2000);
    saveRun();
    setTimeout(screenMap, 1400);
  }
}
/* ---------- rest / blend ---------- */
function screenRest(){
  app.innerHTML = '';
  const p = el(`<div class="page">
    ${hudHtml()}
    <div class="stripes"></div>
    <div class="big">The <span class="z">Oasis</span></div>
    <div class="liveArt" data-rig="oasis" style="width:100%;height:74px;position:relative"></div>
    <div class="sub">Quiet water. Red sky. A suspicious blender on a rock.</div>
    <button class="btn" id="bHeal">Rest · heal ${Math.round(R.mhp * .3)} HP</button>

  </div>`);
  app.appendChild(p);
  $('#bHeal').onclick = () => { R.hp = Math.min(R.mhp, R.hp + Math.round(R.mhp * .3)); saveRun(); toast('RESTED. THE ZEBRA DREAMS IN STRIPES.'); screenMap(); };
  $('#bBlend').onclick = screenBlend;

function screenBlend(){
  app.innerHTML = '';
  const sel = [];
  const p = el(`<div class="page">
    ${hudHtml()}
    <span class="kick">SELECT TWO CARDS · THEY BECOME ONE · FOREVER</span>
    <div id="hand"></div>
    <button class="btn red" id="bDo" disabled>Blend</button>
    <button class="btn ghost" id="bBack">Never mind</button>
  </div>`);
  app.appendChild(p);
  const hand = $('#hand');
  R.deck.forEach((c, i) => {
    const cd = el(cardHtml(c));
    cd.onclick = () => {
      const at = sel.indexOf(i);
      if (at >= 0) sel.splice(at, 1);
      else if (sel.length < 2) sel.push(i);
      hand.querySelectorAll('.card').forEach((x, xi) => x.classList.toggle('sel', sel.includes(xi)));
      $('#bDo').disabled = sel.length !== 2;
    };
    hand.appendChild(cd);
    JTM.css('card-' + c.id, cd.querySelector('.art'));
  });
  $('#bDo').onclick = () => {
    const [a, b] = sel.sort((x, y) => y - x);
    const cA = R.deck[a], cB = R.deck[b];
    const nc = blendCards(cA, cB);
    R.deck.splice(a, 1); R.deck.splice(b, 1);
    R.deck.push(nc);
    bumpStat('blends', 1);
    R.sblends = (R.sblends || 0) + 1;
    const bh = treeVal('blendHeal');
    if (bh){ R.hp = Math.min(R.mhp, R.hp + bh); setTimeout(() => toast('🌿 THE BLEND NOURISHES · +' + bh + ' HP', 1500), 2500); }
    saveRun();
    if (nc.rar === 3) setTimeout(() => { toast('⚡ LEGENDARY BLEND · IT HAS NO EQUAL', 2400); SFX.victory(); hapt(50); }, 2400);
    /* the blend ceremony · two cards enter, one card leaves */
    SFX.blend();
    const cer = el(`<div class="ceremony">
      <span class="kick">THE BLENDER ACCEPTS YOUR OFFERING</span>
      <div class="duo">${cardHtml(cA)}<div class="zap">⚡</div>${cardHtml(cB)}</div>
      <div class="resultWrap" style="display:none"><div class="result">${cardHtml(nc)}</div></div>

      cer.querySelector('.duo').style.display = 'none';

  };

  tut('blendsel', '#hand', 'CHOOSE THE PARENTS', 'Tap <b>two cards</b>. Attack + block makes a hybrid that does both. Blending two attacks makes a bigger attack. There are no wrong answers, only funny names.');
}
/* ---------- shop ---------- */
function screenShop(){
  app.innerHTML = '';
  const cards = [mkCard(pick(BASE_CARDS.filter(c => R.floor >= 5 || c.early)).id)];
  const off = 1 - treeVal('shopOff');
  const cardCost = Math.round((18 + (cards[0].rar || 0) * 12 + R.floor * 2) * off);
  const healCost = Math.round((15 + R.floor) * off);
  const banishCost = Math.round((45 + R.floor * 2) * off);
  const owned = new Set(R.relics.map(r => r.id));
  const av = RELICS.filter(r => !owned.has(r.id));
  const relic = av.length ? pick(av) : genRelic(R.relics.length);
  const relicCost = Math.round((40 + R.floor * 2) * off);
  const p = el(`<div class="page">
    ${hudHtml()}
    <div class="stripes"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="flex:1"><div class="big">Trading <span class="z">Post</span></div>
      <div class="sub">A meerkat with a ledger. It has seen things. It also eats cards now.</div></div>
      <div class="liveArt" data-rig="meerkat" style="width:64px;height:96px;position:relative;flex-shrink:0"></div>
    </div>
    <div id="hand">${cards.map((c, i) => `<div data-i="${i}">${cardHtml(c)}</div>`).join('')}</div>
    <button class="btn" id="bC0">Buy this card · ◆ ${cardCost}</button>
    <button class="btn" id="bRelic">${relic.name} (${relic.desc}) · ◆ ${relicCost}</button>
    <button class="btn" id="bBanish">BANISH a card — the meerkat eats it · ◆ ${banishCost}</button>
    <button class="btn" id="bHeal">Patch up · heal 20 · ◆ ${healCost}</button>
    <button class="btn red" id="bGo">Leave</button>
  </div>`);
  app.appendChild(p);
  p.querySelectorAll('#hand > div').forEach(dv => JTM.css('card-' + cards[+dv.dataset.i].id, dv.querySelector('.art')));
  $('#bBanish').onclick = () => {
    if (R.stripes < banishCost){ toast('NOT ENOUGH STRIPES. THE MEERKAT STAYS HUNGRY.'); return; }
    if (R.deck.length <= 5){ toast('DECK TOO THIN. EVEN THE MEERKAT HAS STANDARDS.'); return; }
    const o = el(`<div class="ovlDeck"><div style="max-width:640px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center">
      <span class="kick">PICK A CARD · THE MEERKAT IS READY</span>
      <button class="btn red" style="width:auto;min-height:40px;padding:8px 16px" id="banCancel">Cancel</button></div>
      <div class="grid">${R.deck.map((c, i) => `<div data-i="${i}">${cardHtml(c)}</div>`).join('')}</div></div>`);
    document.body.appendChild(o);
    o.querySelector('#banCancel').onclick = () => o.remove();
    o.querySelectorAll('.grid > div').forEach(dv => dv.onclick = () => {
      const c = R.deck[+dv.dataset.i];
      R.deck.splice(+dv.dataset.i, 1);
      R.stripes -= banishCost;
      saveRun();
      o.remove();
      const bb = $('#bBanish');
      if (bb){ bb.disabled = true; bb.dataset.sold = 1; bb.textContent = 'THE MEERKAT IS FULL. IT ATE ' + c.name.toUpperCase(); }
      toast('🍽 BANISHED: ' + c.name.toUpperCase() + ' · GONE FOREVER', 1800);
      SFX.blend();
      refreshAfford();
    });
  };
  const priced = [['#bC0', cardCost], ['#bRelic', relicCost], ['#bBanish', banishCost], ['#bHeal', healCost]];
  function refreshAfford(){
    $('#hud') && ($('#hud').outerHTML = hudHtml().match(/<div id="hud">[\s\S]*?<\/div>/)[0]);
    priced.forEach(([sel, cost]) => {
      const b = $(sel);
      if (b && !b.dataset.sold && R.stripes < cost){ b.disabled = true; b.style.color = 'var(--r)'; }
    });
  }
  const buy = (cost, fn, btn) => {
    if (R.stripes < cost){ toast('NOT ENOUGH STRIPES. THE MEERKAT SIGHS.'); return; }
    R.stripes -= cost; fn(); saveRun();
    btn.disabled = true; btn.dataset.sold = 1; btn.textContent = 'SOLD · THE MEERKAT NODS';
    SFX.ach();
    refreshAfford();
  };
  $('#bC0').onclick = e => buy(cardCost, () => R.deck.push(cards[0]), e.target);
  $('#bRelic').onclick = e => buy(relicCost, () => { R.relics.push(relic); if (relic.hp){ R.mhp += relic.hp; R.hp += relic.hp; } relicPop(relic); }, e.target);
  $('#bHeal').onclick = e => buy(healCost, () => R.hp = Math.min(R.mhp, R.hp + 20), e.target);
  $('#bGo').onclick = () => wipe(screenMap);
  refreshAfford();
}
/* ---------- death ---------- */
function loseRun(){
  Music.setBattle(false);
  SFX.death();
  hapt([60, 40, 120]);
  const byBlender = !!(B && B.foe && B.foe.id === 'blender');

  META.stripes += earned;
  saveMeta();
  R = null; saveRun();
  app.innerHTML = '';
  const p = el(`<div class="page" style="justify-content:center;text-align:center;gap:16px">
    <span class="kick">${byBlender ? 'BLACK AND WHITE AND RED ALL OVER' : newBest ? '★ NEW BEST FLOOR · THE HERD IS IMPRESSED ★' : 'THE SAVANNA IS PATIENT'}</span>
    <div class="big">Run <span class="z">over</span></div>

  $('#bTree').onclick = () => screenTree();
  $('#bTitle').onclick = screenTitle;

/* ---------- meta screens ---------- */
function treeGrowth(){
  const G = [
    ['str', v => `⚔ +${v} DMG`], ['firstHit', v => `☄ FIRST HIT +${v}`], ['hp', v => `♥ +${v} HP`],
    ['autoblk', v => `🛡 +${v} BLK/TURN`], ['phoenix', () => `☠ CHEATS DEATH`],
    ['flat', v => `◆ +${v}/WIN`], ['goldMul', v => `◆ +${Math.round(v * 100)}%`],
    ['startGold', v => `◆ ${v} SEED`], ['shopOff', v => `SHOP −${Math.round(v * 100)}%`],
    ['firstDraw', v => `🃏 +${v} ON T1`], ['thin', v => `📚 −${v} BITE`], ['t1energy', v => `⚡ +${v} T1`],
    ['menergy', v => `⚡ START ${3 + v}`], ['blendHeal', v => `♥ BLEND +${v}`],
    ['blendBonus', v => `⚡ BLENDS +${v}`], ['startBlend', v => `⚡ ${v} PRE-BLEND`],
    ['powAlways', () => `POW 100%`], ['powChoice', () => `POW ×3`],
    ['safeDoor', () => `❓ BITE-PROOF`], ['relic', v => `◈ +${v} RELIC`], ['pick4', () => `🃏 4 PICKS`],
  ];
  return G.map(([k, f]) => { const v = treeVal(k); return v ? `<span class="chip hot">${f(v)}</span>` : ''; }).join('');
}
let lastBought = null;
function screenTree(keepScroll){
  const prevScroll = keepScroll && $('#treeWrap') ? $('#treeWrap').scrollLeft : 0;
  app.innerHTML = '';
  const grow = treeGrowth();
  const p = el(`<div class="page">
    <span class="kick">THE SKILL TREE · SIX BRANCHES · EVERY TIP GROWS FOREVER</span>
    <div class="big">Skill <span class="z">Tree</span></div>
    <div class="sub"><b style="color:var(--r)">◆ ${META.stripes}</b> STRIPES · ${treeOwned()} NODES CLAIMED</div>
    ${grow ? `<div id="growRow">${grow}</div>` : ''}
    <div class="stripes"></div>
    <div id="treeWrap"><div id="treeRow">
    ${TREE.map((b, bi) => {
      const done = b.nodes.filter(n => nodeLvl(n.id) > 0).length;
      return `<div class="branch">
      <div class="bh"><span class="bic">${b.ic}</span><div><div class="bn">${b.br}</div><div class="bt">${b.tag} · ${done}/6</div></div></div>
      ${b.nodes.map((n, ni) => {
        const lvl = nodeLvl(n.id);
        const open = ni === 0 || nodeLvl(b.nodes[ni - 1].id) > 0;
        const cost = nodeCost(n);
        const own = lvl > 0 && !n.rep;
        const st = own ? 'own' : open ? (META.stripes >= cost ? 'avail' : 'poor') : 'lock';
        return `<div class="tnode ${st} ${n.rep ? 'rep' : ''} ${lastBought === n.id ? 'justBought' : ''}" data-b="${bi}" data-n="${ni}">
          <div class="tn">${n.name}${n.rep && lvl ? ` <span class="lv">Lv.${lvl}</span>` : ''}</div>
          <div class="td">${n.desc}</div>
          <div class="tc">${own ? '✔ CLAIMED' : open ? '◆ ' + cost : '🔒 ◆ ' + cost}</div>
        </div>`;
      }).join('')}
    </div>`; }).join('')}
    </div></div>
    <div id="swipeHint">⟶ FOUR MORE BRANCHES THAT WAY ⟶</div>
    <button class="btn ghost" id="bBack">Back</button>
  </div>`);
  app.appendChild(p);
  lastBought = null;
  if (prevScroll) $('#treeWrap').scrollLeft = prevScroll;
  const hint = $('#swipeHint');
  if (prevScroll > 40) hint.style.opacity = 0;
  if ($('#treeWrap').scrollWidth <= $('#treeWrap').clientWidth + 8) hint.style.display = 'none';
  /* snap can fire a phantom scroll on layout — only hide on a real swipe */
  setTimeout(() => {
    const w = $('#treeWrap');
    if (w) w.addEventListener('scroll', () => { if (w.scrollLeft > 30) hint.style.opacity = 0; }, { passive: true });
  }, 350);
  p.querySelectorAll('.tnode.avail').forEach(dv => dv.onclick = () => {
    const n = TREE[+dv.dataset.b].nodes[+dv.dataset.n];
    const cost = nodeCost(n);
    if (META.stripes < cost) return;
    META.stripes -= cost;
    META.tree[n.id] = nodeLvl(n.id) + 1;
    saveMeta();
    SFX.ach(); hapt(15);
    lastBought = n.id;
    toast('🌿 ' + n.name.toUpperCase() + (n.rep ? ' Lv.' + META.tree[n.id] : '') + ' · YOURS FOREVER', 1600);
    screenTree(true);
  });
  p.querySelectorAll('.tnode.poor').forEach(dv => dv.onclick = () => toast('NOT ENOUGH STRIPES. THE TREE IS PATIENT.', 1300));
  p.querySelectorAll('.tnode.lock').forEach(dv => dv.onclick = () => toast('CLAIM THE NODE BELOW IT FIRST. TREES GROW UPWARD.', 1300));
  $('#bBack').onclick = screenTitle;
  tut('tree', '#treeRow', 'THE SKILL TREE', 'Six branches, claimed <b>bottom-up</b> with banked ◆ stripes. The top node of every branch is <b>repeatable forever</b> — costs grow, the zebra grows faster. Swipe sideways to see all six.');
}

      } else toast('NOT ENOUGH STRIPES. THE ' + c.name.split(' ')[0] + ' WAITS.');
    };
  });
