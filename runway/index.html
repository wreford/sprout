<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>RUNWAY — dress to impress</title>
<meta name="description" content="A 3D dress-up runway. Every garment is procedural geometry lit like a photo studio. Pick a look, hit the lights, get judged.">
<meta name="theme-color" content="#0b0812">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700;6..96,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0812; --panel:rgba(20,14,30,.8); --line:rgba(255,255,255,.13);
  --gold:#f2c879; --hot:#ff5fa2; --ice:#8fd6ff; --text:#f6f1ff; --dim:#a99cc0;
  --ok:#7ce8a4; --bad:#ff7b8f;
  --disp:'Bodoni Moda',Didot,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;position:fixed;inset:0;width:100%;
  touch-action:none;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:var(--sans);user-select:none;-webkit-user-select:none}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}

/* ---- top left lockup ---- */
#brand{position:absolute;z-index:5;left:14px;top:calc(12px + env(safe-area-inset-top));pointer-events:none}
#brand .t{font-family:var(--disp);font-weight:900;font-size:26px;line-height:.94;letter-spacing:.01em;
  text-shadow:0 3px 24px rgba(0,0,0,.7)}
#brand .t i{font-style:italic;color:var(--gold)}
#brand .s{font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-top:5px}
#stat{margin-top:9px;font-size:9.5px;letter-spacing:.07em;color:var(--dim);line-height:1.65;
  font-variant-numeric:tabular-nums}
#stat b{color:var(--ice);font-weight:600}

/* ---- top right ---- */
#tr{position:absolute;z-index:6;right:12px;top:calc(12px + env(safe-area-inset-top));
  display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chip{background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:100px;
  padding:6px 13px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;
  color:var(--dim);cursor:pointer;white-space:nowrap}
.chip.on{color:#160d1e;background:linear-gradient(180deg,#ffe6a8,var(--gold));border-color:var(--gold)}
.chip b{color:var(--gold);letter-spacing:.05em}
.chip.on b{color:#160d1e}

/* ---- wardrobe dock ---- */
#dock{position:absolute;left:0;right:0;bottom:0;z-index:6;
  padding:0 8px calc(9px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}
#slots{display:flex;gap:5px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;
  scrollbar-width:none;padding:0 2px}
#slots::-webkit-scrollbar{display:none}
.slot{flex:0 0 auto}
.slot{background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:100px;
  padding:6px 13px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  cursor:pointer;color:var(--dim);transition:background .16s,color .16s,border-color .16s}
.slot.on{color:#160d1e;background:linear-gradient(180deg,#ffe6a8,var(--gold));border-color:var(--gold)}
#rack{display:flex;gap:7px;overflow-x:auto;padding:3px 2px 4px;scrollbar-width:none;
  scroll-snap-type:x proximity}
#rack::-webkit-scrollbar{display:none}
.item{flex:0 0 auto;width:68px;height:76px;border-radius:15px;border:2px solid var(--line);
  background:rgba(255,255,255,.05);cursor:pointer;position:relative;overflow:hidden;scroll-snap-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:0 3px 6px;transition:border-color .16s,box-shadow .16s}
.item .sw{position:absolute;left:6px;right:6px;top:6px;height:44px;border-radius:10px;
  box-shadow:inset 0 -14px 20px rgba(0,0,0,.32),inset 0 2px 6px rgba(255,255,255,.28)}
.item .lb{position:relative;font-size:8px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
  font-weight:600;text-align:center;line-height:1.15;max-width:100%}
.item.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,200,121,.26)}
.item.on .lb{color:var(--gold)}

#fx{position:absolute;right:12px;bottom:calc(var(--dockh,104px) + 10px);z-index:6;
  display:flex;flex-direction:column;gap:5px;align-items:flex-end}

/* ---- verify panel ---- */
#vfy{position:absolute;left:12px;bottom:calc(var(--dockh,104px) + 10px);z-index:7;
  width:min(300px,62vw);max-height:44vh;overflow:auto;background:var(--panel);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:none;
  font-size:10.5px;line-height:1.65;letter-spacing:.02em;scrollbar-width:none}
#vfy::-webkit-scrollbar{display:none}
#vfy.show{display:block}
#vfy h4{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
  font-weight:600;margin-bottom:7px}
#vfy .row{display:flex;gap:7px;align-items:baseline;color:var(--dim)}
#vfy .row .k{color:var(--text);min-width:96px;font-weight:500}
#vfy .pass{color:var(--ok);font-weight:600}
#vfy .fail{color:var(--bad);font-weight:600}
#vfy .hr{height:1px;background:var(--line);margin:8px 0}

/* ---- screens ---- */
.screen{position:absolute;inset:0;z-index:12;display:none;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(120% 90% at 50% 42%,rgba(40,20,56,.42),rgba(8,5,14,.90));
  backdrop-filter:blur(3px)}
.screen.show{display:flex}
.big{font-family:var(--disp);font-weight:900;font-size:clamp(38px,11vmin,86px);line-height:.9;
  letter-spacing:.01em;text-shadow:0 6px 40px rgba(0,0,0,.7)}
.big i{font-style:italic;color:var(--gold)}
.kick{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-top:10px}
.btn{margin-top:8px;background:linear-gradient(180deg,#ffe9b4,var(--gold));color:#180f22;
  border:none;border-radius:100px;padding:13px 34px;font-size:12.5px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 10px 34px rgba(242,200,121,.24)}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);
  box-shadow:none;padding:11px 26px;font-size:11px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}

#themeName{font-family:var(--disp);font-weight:900;font-size:clamp(32px,9vmin,64px);
  line-height:1;margin-top:6px}
#themeSub{font-size:12px;color:var(--dim);margin-top:14px;max-width:30ch;line-height:1.6}
#themeTags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.tag{border:1px solid var(--line);border-radius:100px;padding:5px 12px;font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}

/* dressing HUD */
#brief{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));z-index:8;
  display:none;flex-direction:column;gap:7px;pointer-events:none;
  background:linear-gradient(180deg,rgba(12,8,20,.88),rgba(12,8,20,.55) 78%,rgba(12,8,20,0));
  border-radius:16px;padding:9px 12px 13px}
#brief.show{display:flex}
#briefTop{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
#briefName{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#briefTags{display:flex;gap:5px;flex-wrap:wrap}
#briefTags .tag{font-size:8.5px;padding:4px 9px;background:rgba(255,255,255,.05)}
#briefTags .tag.hit{color:#160d1e;background:linear-gradient(180deg,#ffe6a8,var(--gold));
  border-color:var(--gold)}
#clock{font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;letter-spacing:.03em;
  line-height:1}
#clock.low{color:var(--bad)}
#go{position:absolute;right:12px;bottom:calc(var(--dockh,104px) + 10px);z-index:9;display:none}
#go.show{display:block}

/* runway overlay */
#walkHud{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top));z-index:8;
  display:none;text-align:center;pointer-events:none}
#walkHud.show{display:block}
#walkHud .n{font-family:var(--disp);font-weight:900;font-size:clamp(24px,6vmin,42px)}
#walkHud .s{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-top:6px}
#flash{position:absolute;inset:0;z-index:11;background:#fff;opacity:0;pointer-events:none}

/* results */
#scResult{justify-content:flex-end;padding-bottom:calc(22px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(8,5,14,.06) 0%,rgba(8,5,14,.55) 34%,rgba(8,5,14,.93) 62%)}
#scResult>*{flex:0 0 auto}
#place{font-family:var(--disp);font-weight:900;font-size:clamp(38px,10vmin,72px);line-height:.9}
#scoreBig{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:8px}
#board{margin-top:16px;width:min(420px,92vw);display:flex;flex-direction:column;gap:5px}
.rowr{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px}
.rowr.you{border-color:var(--gold);background:rgba(242,200,121,.10)}
.rowr .rk{width:20px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.rowr .nm{flex:1;text-align:left;font-weight:600;letter-spacing:.02em}
.rowr .sw2{display:flex;gap:3px}
.rowr .sw2 i{width:11px;height:11px;border-radius:3px;display:block}
.rowr .sc{width:34px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold)}
#notes{margin-top:14px;font-size:11.5px;color:var(--dim);line-height:1.7;max-width:34ch}
#notes b{color:var(--text);font-weight:600}

#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;
  background:var(--bg);font-family:var(--disp);font-size:20px;letter-spacing:.3em;color:var(--gold)}

@media (max-width:520px){
  #brand .t{font-size:21px} #stat{font-size:9px}
  .item{width:60px;height:69px} .item .sw{height:39px}
  .chip{padding:5px 11px;font-size:9.5px}
  #fx{flex-direction:row;left:10px;right:10px;justify-content:center;flex-wrap:wrap}
  #vfy{width:calc(100% - 20px);right:10px;bottom:calc(var(--dockh,104px) + 52px)}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="brand">
  <div class="t">RUN<i>WAY</i></div>
  <div class="s">procedural couture</div>
  <div id="stat"></div>
</div>

<div id="tr">
  <div class="chip" id="cLook">look <b id="hLook">—</b></div>
  <div class="chip" id="cSkin">skin</div>
  <div class="chip" id="cPose">pose</div>
</div>

<div id="vfy"></div>

<div id="fx">
  <button class="chip on" id="bSpin">turntable</button>
  <button class="chip on" id="bLights">lights</button>
  <button class="chip" id="bWire">wireframe</button>
  <button class="chip" id="bVfy">verify</button>
</div>

<div id="dock">
  <div id="slots"></div>
  <div id="rack"></div>
</div>

<div id="brief">
  <div id="briefTop"><span id="briefName">—</span><span id="clock">60</span></div>
  <div id="briefTags"></div>
</div>
<button class="btn" id="go">walk it</button>

<div id="walkHud"><div class="n" id="walkName">—</div><div class="s" id="walkSub">on the runway</div></div>
<div id="flash"></div>

<div class="screen show" id="scTitle">
  <div class="big">RUN<i>WAY</i></div>
  <div class="kick">dress to impress</div>
  <div class="btnrow">
    <button class="btn" id="bPlay">start a show</button>
    <button class="btn ghost" id="bStudio">free studio</button>
  </div>
  <div class="kick" id="bestLine" style="margin-top:26px"></div>
</div>

<div class="screen" id="scTheme">
  <div class="kick">tonight's theme</div>
  <div id="themeName">—</div>
  <div id="themeSub"></div>
  <div id="themeTags"></div>
  <button class="btn" id="bDress">open the wardrobe</button>
</div>

<div class="screen" id="scResult">
  <div id="place">—</div>
  <div id="scoreBig"></div>
  <div id="board"></div>
  <div id="notes"></div>
  <div class="btnrow">
    <button class="btn" id="bAgain">next show</button>
    <button class="btn ghost" id="bHome">home</button>
  </div>
</div>

<div id="load">LOADING</div>

<script src="three.min.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$("cv");
const TAU=Math.PI*2;

/* ═══════════════════════════════════════════════════════════
   RENDERER · photo-studio setup
   ═══════════════════════════════════════════════════════════ */
let W=1,H=1,DPR=1;
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,1,.1,120);

let DOCKH=104;
function measureDock(){
  const d=$("dock");
  if(d){ DOCKH=d.offsetHeight||104; document.documentElement.style.setProperty("--dockh",DOCKH+"px"); }
}
function resize(){
  /* canvas is a replaced element — always size from the laid-out box,
     never from innerWidth (iOS can report device pixels at parse time) */
  W=cv.clientWidth||innerWidth; H=cv.clientHeight||innerHeight;
  DPR=Math.min(2,devicePixelRatio||1);
  renderer.setPixelRatio(DPR);
  renderer.setSize(W,H,false);
  camera.aspect=W/H;
  camera.fov=H>W?40:30;
  camera.updateProjectionMatrix();
  measureDock();
}
resize();
addEventListener("resize",resize);
if(window.visualViewport) visualViewport.addEventListener("resize",resize);

/* ═══════════════════════════════════════════════════════════
   ENVIRONMENT · hand-painted equirect → PMREM
   gives every satin, metal and gem something real to reflect
   ═══════════════════════════════════════════════════════════ */
function envTexture(){
  const c=document.createElement("canvas"); c.width=512; c.height=256;
  const g=c.getContext("2d");
  const sky=g.createLinearGradient(0,0,0,256);
  sky.addColorStop(0,"#3a2456"); sky.addColorStop(.38,"#5c2f5e");
  sky.addColorStop(.5,"#7a4a68"); sky.addColorStop(.55,"#2a1c34"); sky.addColorStop(1,"#0a0710");
  g.fillStyle=sky; g.fillRect(0,0,512,256);
  const blob=(x,y,r,col,a)=>{
    const rg=g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,col); rg.addColorStop(1,"rgba(0,0,0,0)");
    g.globalAlpha=a; g.fillStyle=rg; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); g.globalAlpha=1;
  };
  blob(118,64,88,"#f6e7cf",.72);   /* key softbox */
  blob(126,64,34,"#fffdf6",.9);    /* its hot core — the specular you actually see */
  blob(384,74,72,"#e491be",.6);    /* pink rim box */
  blob(300,52,110,"#9dbbe0",.28);  /* cool top bounce */
  blob(470,96,52,"#74a6cc",.34);
  blob(50,198,124,"#4a2f5c",.5);   /* warm floor bounce */
  const t=new THREE.CanvasTexture(c);
  t.mapping=THREE.EquirectangularReflectionMapping;
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const pmrem=new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
scene.environment=pmrem.fromEquirectangular(envTexture()).texture;

/* backdrop cyclorama — a seamless painted wall, no visible corner */
{
  const c=document.createElement("canvas"); c.width=16; c.height=256;
  const g=c.getContext("2d");
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,"#100a19"); gr.addColorStop(.34,"#2a1a38");
  gr.addColorStop(.6,"#542d55"); gr.addColorStop(.8,"#3a2040"); gr.addColorStop(1,"#0d0814");
  g.fillStyle=gr; g.fillRect(0,0,16,256);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const sky=new THREE.Mesh(new THREE.SphereGeometry(42,32,20),
    new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide,fog:false}));
  sky.name="cyc"; sky.userData.stage=true;
  scene.add(sky);
}
scene.fog=new THREE.FogExp2(0x150e20,.020);

/* ═══════════════════════════════════════════════════════════
   LIGHTS · key / rim / kicker, a real three-point studio
   ═══════════════════════════════════════════════════════════ */
const LIGHTS=new THREE.Group(); scene.add(LIGHTS);
function spot(col,int,pos,tgt,ang,pen){
  const l=new THREE.SpotLight(col,int,30,ang,pen,1.7);
  l.position.set(pos[0],pos[1],pos[2]);
  l.target.position.set(tgt[0],tgt[1],tgt[2]);
  LIGHTS.add(l,l.target);
  return l;
}
const key=spot(0xfff3e2,105,[3.1,5.0,4.0],[0,1.25,0],.58,.72);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.bias=-0.0012; key.shadow.normalBias=.022;
key.shadow.camera.near=1.2; key.shadow.camera.far=22;
key.shadow.radius=2;

const rimHot =spot(0xff5aa4,110,[-3.5,3.9,-3.3],[0,1.45,0],.58,.82);   /* magenta silhouette */
const rimCool=spot(0x5fbcff, 62,[ 3.4,3.4,-3.7],[0,1.35,0],.60,.88);   /* cyan counter-rim */
const fill   =spot(0xbcd6ff, 26,[-3.2,2.5, 3.9],[0,1.20,0],.95,1);     /* open the shadows */

const kick=new THREE.PointLight(0xffd9a8,4.5,5.0,2.2);   /* floor bounce into the chin */
kick.position.set(0,.24,1.7);
LIGHTS.add(kick);

const hemi=new THREE.HemisphereLight(0xc3aaff,0x2a1b33,.26);
scene.add(hemi);

/* ═══════════════════════════════════════════════════════════
   STAGE · dark mirror floor + a low studio riser
   ═══════════════════════════════════════════════════════════ */
function floorTexture(){
  const c=document.createElement("canvas"); c.width=c.height=512;
  const g=c.getContext("2d");
  g.fillStyle="#0d0914"; g.fillRect(0,0,512,512);
  const rg=g.createRadialGradient(256,256,10,256,256,215);
  rg.addColorStop(0,"rgba(126,86,156,.85)");
  rg.addColorStop(.45,"rgba(64,38,88,.5)");
  rg.addColorStop(1,"rgba(10,7,16,0)");
  g.fillStyle=rg; g.fillRect(0,0,512,512);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const floor=new THREE.Mesh(
  new THREE.CircleGeometry(18,72),
  new THREE.MeshPhysicalMaterial({map:floorTexture(),roughness:.19,metalness:.42,
    envMapIntensity:.9,color:0x8b7c9c}));
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
floor.name="floor"; floor.userData.stage=true;
scene.add(floor);

const RISER=.075;                     /* the model stands this high */
const pedestal=new THREE.Group();
{
  const top=new THREE.Mesh(new THREE.CylinderGeometry(.66,.71,RISER,72),
    new THREE.MeshPhysicalMaterial({color:0x241a30,roughness:.24,metalness:.55,envMapIntensity:1.2}));
  top.position.y=RISER/2; top.castShadow=true; top.receiveShadow=true;
  top.name="riser"; top.userData.stage=true;
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.675,.023,12,96),
    new THREE.MeshStandardMaterial({color:0xf5cf87,roughness:.18,metalness:1,
      emissive:0x40300f,envMapIntensity:1.7}));
  ring.rotation.x=Math.PI/2; ring.position.y=RISER;
  ring.name="riserRing"; ring.userData.stage=true;
  pedestal.add(top,ring);
}
scene.add(pedestal);

/* ═══════════════════════════════════════════════════════════
   MATERIALS · a small couture library
   ═══════════════════════════════════════════════════════════ */
const M={
  skin:  c=>new THREE.MeshPhysicalMaterial({color:c,roughness:.58,metalness:0,
           clearcoat:.22,clearcoatRoughness:.55,sheen:.35,
           sheenColor:new THREE.Color(0xffd6c4),envMapIntensity:.8}),
  matte: c=>new THREE.MeshPhysicalMaterial({color:c,roughness:.86,metalness:0,envMapIntensity:.7}),
  satin: c=>new THREE.MeshPhysicalMaterial({color:c,roughness:.22,metalness:.05,
           sheen:1,sheenColor:new THREE.Color(0xffffff),sheenRoughness:.3,
           clearcoat:.35,clearcoatRoughness:.28,envMapIntensity:1.5}),
  velvet:c=>new THREE.MeshPhysicalMaterial({color:c,roughness:.96,metalness:0,
           sheen:1,sheenColor:new THREE.Color(c).lerp(new THREE.Color(0xffffff),.6),
           sheenRoughness:.85,envMapIntensity:.9}),
  denim: c=>new THREE.MeshPhysicalMaterial({color:c,roughness:.78,metalness:.02,
           sheen:.5,sheenColor:new THREE.Color(0x9fb4d8),envMapIntensity:.8}),
  metal: c=>new THREE.MeshPhysicalMaterial({color:c,roughness:.14,metalness:1,envMapIntensity:1.8}),
  holo:  c=>new THREE.MeshPhysicalMaterial({color:c,roughness:.12,metalness:.55,
           iridescence:1,iridescenceIOR:1.6,iridescenceThicknessRange:[120,520],
           envMapIntensity:1.9}),
  gem:   c=>new THREE.MeshPhysicalMaterial({color:c,roughness:.04,metalness:0,transmission:.92,
           thickness:.22,ior:1.9,transparent:true,opacity:.92,envMapIntensity:2}),
  tulle: c=>new THREE.MeshPhysicalMaterial({color:c,roughness:.5,metalness:0,transparent:true,
           opacity:.66,side:THREE.DoubleSide,sheen:1,sheenColor:new THREE.Color(0xffffff),
           envMapIntensity:1.3,depthWrite:false}),
};
function shade(g,mat,cast){
  const m=new THREE.Mesh(g,mat);
  m.castShadow=cast!==false; m.receiveShadow=true;
  return m;
}
const SPH=(r,a,b)=>new THREE.SphereGeometry(r,a||20,b||16);
const CAP=(r,l)=>new THREE.CapsuleGeometry(r,l,6,18);

/* Every garment silhouette is a hand-authored lathe profile.
   LatheGeometry winds its faces from the point order, so a profile written
   top-down comes out inside-out — normalise to bottom-up here, once, and
   every piece in the wardrobe is guaranteed to face the camera. */
function lathe(profile,seg,mat,cast,phiStart,phiLen){
  let p=profile;
  if(p[0][1]>p[p.length-1][1]) p=p.slice().reverse();
  const pts=p.map(q=>new THREE.Vector2(Math.max(.0008,q[0]),q[1]));
  const g=new THREE.LatheGeometry(pts,seg||48,phiStart||0,
    phiLen===undefined?Math.PI*2:phiLen);
  const m=shade(g,mat,cast);
  if(phiLen===undefined) m.userData.lathe=true;   /* verify() checks these point outward */
  return m;
}

/* ═══════════════════════════════════════════════════════════
   RIG · one table of anatomy landmarks.
   The body and every garment are authored against these, so a
   proportion tweak moves the clothes with it.
   ═══════════════════════════════════════════════════════════ */
const RIG={
  foot:0,  ankle:.085, knee:.56,  hipJoint:.92, hip:.98,
  waist:1.20, bust:1.40, shoulder:1.52, neck:1.60, chin:1.71,
  headC:1.858, headR:.152, crown:2.026,
  hipW:.213, waistW:.158, bustW:.209, shoulderW:.204,
  legX:.104, armX:.205,
};
/* the head is a single ellipsoid — these are its semi-axes, and every
   facial feature is placed on the surface the equation actually describes,
   not on a guessed flat plane */
const HA={x:RIG.headR*.95, y:RIG.headR*1.08, z:RIG.headR*.97};
function faceZ(x,dy,pad){
  const t=1-(x*x)/(HA.x*HA.x)-(dy*dy)/(HA.y*HA.y);
  return HA.z*Math.sqrt(Math.max(.05,t))+(pad||0);
}
const FRONT=HA.z;
/* A hat or a hairstyle is authored with the origin AT the head centre and
   parented to the head group, so tilting a beret pivots on the skull
   instead of swinging it a third of a metre out into the studio. */
function headPiece(build){
  const g=new THREE.Group();
  g.userData.att="head";
  build(g);
  return g;
}

/* The silhouette of the body, as a radius at each height. Garments are cut
   against this instead of against guessed numbers, which is what stops a hip
   or a rib poking out through a dress — and verify() re-checks it after the
   fact by sampling the real vertices. */
const BODYR=[
  [.00,.158],[.20,.172],[.45,.188],[.70,.200],[.845,.203],[.885,.203],
  [.925,.208],[.975,.213],[1.045,.206],[1.115,.183],[1.20,.158],
  [1.255,.170],[1.315,.194],[1.40,.209],[1.445,.204],[1.50,.190],
  [1.545,.150],[1.60,.050],
];
function bodyR(y){
  if(y<=BODYR[0][0]) return BODYR[0][1];
  for(let i=1;i<BODYR.length;i++){
    if(y<=BODYR[i][0]){
      const a=BODYR[i-1],b=BODYR[i],t=(y-a[0])/(b[0]-a[0]);
      return a[1]+(b[1]-a[1])*t;
    }
  }
  return BODYR[BODYR.length-1][1];
}
function over(y,pad){ return bodyR(y)+(pad===undefined?.020:pad); }
/* a run of profile points that hug the body from y0 to y1 */
function fit(y0,y1,pad,steps){
  const n=steps||8, out=[];
  for(let i=0;i<=n;i++){ const y=y0+(y1-y0)*i/n; out.push([over(y,pad),y]); }
  return out;
}

/* ═══════════════════════════════════════════════════════════
   THE MODEL · primitives + joint groups, so it can be posed
   ═══════════════════════════════════════════════════════════ */
const SKIN=[0xf6d7ba,0xecba91,0xcf9166,0x99603e,0x63402a];
const model=new THREE.Group();
model.position.y=RISER;
scene.add(model);

let skinIdx=0;
const skinMat=M.skin(SKIN[0]);
const BODY={};

function makeArm(s){
  const arm=new THREE.Group();                       /* pivot: shoulder */
  arm.position.set(s*RIG.shoulderW*.97,RIG.shoulder-.05,0);
  const delt=shade(SPH(.060),skinMat); delt.scale.set(1.05,.88,1);
  const up=shade(CAP(.051,.23),skinMat); up.position.y=-.175;
  arm.add(delt,up);
  const fore=new THREE.Group(); fore.position.y=-.325; arm.add(fore);
  const elb=shade(SPH(.049),skinMat);
  const fa=shade(CAP(.0425,.23),skinMat); fa.position.y=-.155;
  const wrist=shade(SPH(.036),skinMat); wrist.position.y=-.30;
  const hand=shade(SPH(.048),skinMat);
  hand.scale.set(.60,1.18,.42); hand.position.y=-.345;
  fore.add(elb,fa,wrist,hand);
  arm.rotation.z=s*.085;
  return {arm,fore};
}
function makeLeg(s){
  const leg=new THREE.Group();                       /* pivot: hip */
  leg.position.set(s*RIG.legX,RIG.hipJoint,0);
  const thigh=shade(CAP(.098,.29),skinMat); thigh.position.y=-.185;
  leg.add(thigh);
  const shinG=new THREE.Group(); shinG.position.y=-.36; leg.add(shinG);
  const knee=shade(SPH(.084),skinMat); knee.scale.set(1,.9,1);
  const shin=shade(CAP(.068,.28),skinMat); shin.position.y=-.20;
  const ankle=shade(SPH(.052),skinMat); ankle.position.y=-.375;
  shinG.add(knee,shin,ankle);
  const footG=new THREE.Group(); footG.position.y=-.475; shinG.add(footG);
  BODY["foot"+(s<0?"L":"R")]=footG;
  const foot=shade(new THREE.BoxGeometry(.098,.055,.20),skinMat);
  foot.position.set(0,.0285,.055);
  const toe=shade(SPH(.05),skinMat); toe.scale.set(.98,.5,1.0); toe.position.set(0,.026,.135);
  footG.add(foot,toe);
  return {leg,shinG};
}

function buildFace(){
  const f=new THREE.Group();
  const white=M.matte(0xfffdfa), iris=M.matte(0x3a2018), pupil=M.matte(0x140b0f);
  const lashM=M.matte(0x1c1014), browM=M.matte(0x4a2b2c);
  const EY=-.012;                    /* eyes sit a touch below the head centre */
  [-1,1].forEach(s=>{
    const x=s*.058;
    const zs=faceZ(x,EY);            /* the skull surface right under this eye */
    /* almond eye: a white dome that sits proud of the skull, iris + pupil in front */
    const w=shade(SPH(.037,20,16),white,false);
    w.scale.set(1,.80,.42); w.position.set(x,EY,zs-.004);
    const ir=shade(new THREE.CylinderGeometry(.0215,.0215,.006,20),iris,false);
    ir.rotation.x=Math.PI/2; ir.position.set(x,EY-.001,zs+.0135);
    const pu=shade(new THREE.CylinderGeometry(.0098,.0098,.006,16),pupil,false);
    pu.rotation.x=Math.PI/2; pu.position.set(x,EY-.001,zs+.0165);
    const hi=shade(SPH(.0072,10,8),new THREE.MeshBasicMaterial({color:0xffffff}),false);
    hi.position.set(x+s*.010,EY+.011,zs+.020);
    const hi2=shade(SPH(.0040,8,6),new THREE.MeshBasicMaterial({color:0xffffff}),false);
    hi2.position.set(x-s*.011,EY-.010,zs+.019);
    /* upper lash line — a thick arc hugging the top of the eye */
    const lash=shade(new THREE.TorusGeometry(.0345,.0058,8,20,2.35),lashM,false);
    lash.position.set(x,EY+.004,zs+.001); lash.rotation.set(.16,0,s*-.30);
    const brow=shade(new THREE.TorusGeometry(.036,.0050,8,16,1.25),browM,false);
    brow.position.set(x,+.048,faceZ(x,.048)-.008); brow.rotation.set(.22,0,s*-.46);
    const blush=shade(SPH(.036,16,12),
      new THREE.MeshBasicMaterial({color:0xff8fac,transparent:true,opacity:.22}),false);
    blush.scale.set(1,.58,.20);
    blush.position.set(s*.092,-.052,faceZ(s*.092,-.052)-.016);
    f.add(w,ir,pu,hi,hi2,lash,brow,blush);
  });
  const nose=shade(SPH(.0155,14,12),skinMat,false);
  nose.scale.set(.78,.86,1.0); nose.position.set(0,-.048,faceZ(0,-.048)-.004);
  /* lips: a full lower lip plus a narrower upper, so the mouth reads in profile */
  const lipM=M.satin(0xd8496e);
  const low=shade(new THREE.TorusGeometry(.0225,.0092,10,24,Math.PI),lipM,false);
  low.position.set(0,-.088,faceZ(0,-.088)-.012); low.rotation.set(.30,0,Math.PI);
  const up=shade(new THREE.TorusGeometry(.0215,.0058,10,22,Math.PI),lipM,false);
  up.position.set(0,-.085,faceZ(0,-.085)-.014); up.rotation.set(.18,0,0);
  f.add(nose,low,up);
  return f;
}

function buildModel(){
  model.clear();
  if(typeof worn!=="undefined") Object.keys(worn).forEach(k=>delete worn[k]);
  const g=new THREE.Group();

  /* legs */
  const lL=makeLeg(-1), lR=makeLeg(1);
  BODY.legL=lL.leg; BODY.legR=lR.leg; BODY.shinL=lL.shinG; BODY.shinR=lR.shinG;
  g.add(lL.leg,lR.leg);

  /* torso · one lathe from the seat to the collarbone so the waist
     actually nips in instead of stepping between two cylinders */
  const R=RIG;
  const torso=lathe([
    [.020,.845],[.130,.855],[.185,.885],[.208,.925],[R.hipW,.975],
    [.206,1.045],[.183,1.115],[R.waistW,R.waist],
    [.170,1.255],[.194,1.315],[R.bustW,R.bust],[.204,1.445],
    [.190,R.shoulder-.02],[.150,1.545],[.085,1.575],[.020,1.585],
  ],52,skinMat);
  g.add(torso);
  BODY.torso=torso;

  /* the seat, closing the bottom of the torso between the legs */
  const seat=lathe([[.02,.80],[.11,.815],[.17,.855],[.02,.90]],36,skinMat);
  g.add(seat);

  /* collar + neck + head */
  const neck=shade(new THREE.CylinderGeometry(.048,.058,.13,22),skinMat);
  neck.position.y=RIG.neck+.005;
  const headG=new THREE.Group(); headG.position.y=RIG.headC;
  const skull=shade(SPH(RIG.headR,40,30),skinMat);
  skull.scale.set(HA.x/RIG.headR,HA.y/RIG.headR,HA.z/RIG.headR);
  const chin=shade(SPH(.052,18,14),skinMat);
  chin.scale.set(1.05,.78,.92); chin.position.set(0,-.108,.052);
  const ears=[-1,1].map(s=>{
    const e=shade(SPH(.030,14,10),skinMat);
    e.scale.set(.32,1.05,.74); e.position.set(s*.127,-.010,-.006);
    return e;
  });
  headG.add(skull,chin,...ears);
  BODY.skull=skull;
  const face=buildFace();          /* authored head-local, like every head piece */
  headG.add(face);
  g.add(neck,headG);
  BODY.head=headG; BODY.face=face;

  /* arms */
  const aL=makeArm(-1), aR=makeArm(1);
  BODY.armL=aL.arm; BODY.armR=aR.arm; BODY.foreL=aL.fore; BODY.foreR=aR.fore;
  g.add(aL.arm,aR.arm);

  model.add(g);
  BODY.root=g;
  return g;
}

/* ═══════════════════════════════════════════════════════════
   POSES · the joint groups earn their keep
   ═══════════════════════════════════════════════════════════ */
const POSES=[
  {name:"stand",  arm:[.09,.09],  fore:[.05,.05],  legs:[0,0],      hip:0,   head:0},
  {name:"hip",    arm:[-.55,.09], fore:[.95,.05],  legs:[.04,-.09], hip:.09, head:-.15},
  {name:"wave",   arm:[.10,-2.5], fore:[.05,.42],  legs:[0,0],      hip:-.04,head:.16},
  {name:"power",  arm:[-.55,-.55],fore:[.95,.95],  legs:[.09,-.11], hip:0,   head:0},
  {name:"walk",   arm:[.38,-.26], fore:[.28,.10],  legs:[-.26,.24], hip:.06, head:.05},
];
let poseIdx=0, poseT={};
let poseSettle=0;
function setPose(i){
  poseIdx=(i+POSES.length)%POSES.length;
  poseSettle=60;
  const p=POSES[poseIdx];
  poseT={azL:p.arm[0],azR:-p.arm[1],fzL:p.fore[0],fzR:-p.fore[1],
         lxL:p.legs[0],lxR:p.legs[1],hip:p.hip,head:p.head};
  const c=$("cPose"); if(c) c.innerHTML="pose <b>"+p.name+"</b>";
}
function applyPose(k){
  if(!BODY.armL||!poseT.azL===undefined) return;
  const L=(a,b)=>a+(b-a)*k;
  BODY.armL.rotation.z=L(BODY.armL.rotation.z,poseT.azL);
  BODY.armR.rotation.z=L(BODY.armR.rotation.z,poseT.azR);
  BODY.foreL.rotation.z=L(BODY.foreL.rotation.z,poseT.fzL);
  BODY.foreR.rotation.z=L(BODY.foreR.rotation.z,poseT.fzR);
  BODY.legL.rotation.x=L(BODY.legL.rotation.x,poseT.lxL);
  BODY.legR.rotation.x=L(BODY.legR.rotation.x,poseT.lxR);
  BODY.root.rotation.z=L(BODY.root.rotation.z,poseT.hip*.28);
  BODY.head.rotation.y=L(BODY.head.rotation.y,poseT.head);
}

/* ═══════════════════════════════════════════════════════════
   WARDROBE · every piece is authored geometry, no meshes loaded
   ═══════════════════════════════════════════════════════════ */
const worn={};
const SLOTS=["hair","dress","top","bottom","shoes","hat","extra"];

const PAL={
  rose:0xff4f96, blush:0xffc2d4, wine:0x74123a, ink:0x1a1626, cream:0xfff0d4,
  gold:0xf2c879, ice:0x86d2ff, mint:0x8eefc4, violet:0x9b6bff, jet:0x14111c,
  emerald:0x18a173, tang:0xff8a3d, silver:0xdfe4ee, sky:0x5fa8ff, plum:0x4a1f5e,
};

/* ---- HAIR ---- (head-local: y 0 is the middle of the skull)
   A full surface of revolution would seal the face inside a helmet, so the
   shell is swept only around the back and the fringe is a separate cap that
   stops at the brow line. FACE_ARC is the opening left for her face. ---- */
const FACE_ARC=0.66;
function hairMat(col){
  const m=M.matte(col); m.side=THREE.DoubleSide; return m;
}
function hairShell(m,pad,lowT){
  const P=pad===undefined?.015:pad, LT=lowT===undefined?-.46:lowT;
  const at=t=>[HA.x*Math.sqrt(Math.max(0,1-t*t))+P, HA.y*t];
  const prof=[[.014,HA.y+P],at(.95),at(.86),at(.72),at(.52),at(.28),
              at(.02),at(-.24),at(LT)];
  return lathe(prof,40,m,true,FACE_ARC,TAU-FACE_ARC*2);
}
function hairFringe(m,drop){
  /* a forehead cap centred on the face, stopping just above the brows */
  const f=shade(new THREE.SphereGeometry(1,26,16,
    Math.PI/2-FACE_ARC*1.35,FACE_ARC*2.7,0,drop||1.16),m);
  f.scale.set(HA.x+.019,HA.y+.019,HA.z+.019);
  return f;
}
function hairBob(col){
  return headPiece(g=>{
    const m=hairMat(col);
    g.add(hairShell(m),hairFringe(m));
    /* a little volume on the crown so it is not a shrink-wrapped skull */
    const poof=shade(SPH(.112,20,16),m);
    poof.scale.set(1.18,.62,1.10); poof.position.set(0,HA.y*.72,-.020);
    g.add(poof);
    /* sides that fall past the jaw and frame the face */
    [-1,1].forEach(sd=>{
      const sw=shade(SPH(.052,16,14),m);
      sw.scale.set(.60,1.95,.86); sw.position.set(sd*(HA.x-.004),-.098,.020);
      g.add(sw);
    });
  });
}
function hairLong(col){
  const g=hairBob(col); const m=hairMat(col);
  const fall=lathe([
    [.02,-.02],[HA.x+.026,-.075],[HA.x+.046,-.32],
    [HA.x+.050,-.62],[HA.x+.016,-.80],[.070,-.90],[.02,-.92],
  ],30,m,true,FACE_ARC*1.5,TAU-FACE_ARC*3);
  fall.scale.set(1,1,.72); fall.position.z=-.030;
  g.add(fall);
  return g;
}
function hairBun(col){
  const g=hairBob(col); const m=hairMat(col);
  const bun=shade(SPH(.086,24,20),m); bun.position.set(0,HA.y+.052,-.078);
  const wrap=shade(new THREE.TorusGeometry(.086,.016,10,26),M.metal(PAL.gold));
  wrap.position.copy(bun.position); wrap.rotation.x=.55;
  g.add(bun,wrap);
  return g;
}
function hairAfro(col){
  return headPiece(g=>{
    const m=M.matte(col);
    const base=shade(SPH(.170,30,24),m);
    base.scale.set(1.06,1.02,1.02); base.position.set(0,.052,-.030);
    g.add(base);
    /* puffs ring the back and crown only — never across the face */
    for(let i=0;i<15;i++){
      const a=-1.10+i/14*(TAU-2.20), r=.152;
      const p=shade(SPH(.062+((i*37)%11)/11*.024,14,12),m);
      p.position.set(Math.sin(a)*r*1.04,.052+Math.cos(i*2.31)*.084,-.030+Math.cos(a)*r);
      g.add(p);
    }
  });
}
function hairPony(col){
  const g=hairBob(col); const m=hairMat(col);
  const tie=shade(new THREE.TorusGeometry(.044,.013,8,20),M.satin(PAL.rose));
  tie.position.set(0,.070,-HA.z-.026); tie.rotation.x=1.25;
  const tail=lathe([
    [.02,.060],[.070,-.020],[.086,-.25],[.072,-.48],[.040,-.59],[.02,-.61],
  ],24,m);
  tail.position.set(0,0,-HA.z-.044); tail.rotation.x=-.20;
  g.add(tie,tail);
  return g;
}

/* ---- DRESSES ---- */
function gownBall(col,accent){
  const g=new THREE.Group(); const m=M.satin(col);
  /* hem to neckline in one unbroken profile — the whole point of a lathe */
  const gown=lathe([
    [.02,0],[.30,0],[.485,.012],[.500,.075],[.492,.17],[.458,.33],[.398,.50],
    [.324,.66],[.276,.79],[.248,.875],
    ...fit(.92,1.45,.022,10),[.02,1.470],
  ],72,m);
  const sash=shade(new THREE.TorusGeometry(over(RIG.waist,.026),.022,12,56),M.metal(accent||PAL.gold));
  sash.position.y=RIG.waist; sash.rotation.x=Math.PI/2;
  g.add(gown,sash);
  return g;
}
function dressSlip(col){
  const g=new THREE.Group(); const m=M.satin(col);
  const body=lathe([
    [.02,.40],[.286,.40],[.300,.50],[.278,.70],[.244,.855],
    ...fit(.90,1.44,.018,10),[.02,1.458],
  ],52,m);
  g.add(body);
  /* the straps are armhole bands riding the outside of the shoulder — a
     straight rod from chest to shoulder would sink into the ribcage */
  [-1,1].forEach(s=>{
    const r=over(1.462,.014);
    const band=shade(new THREE.TorusGeometry(r,.0125,10,28,2.05),m);
    band.rotation.x=Math.PI/2;
    band.rotation.z=s>0?-1.02:(Math.PI-1.02);
    band.position.y=1.462;
    const tilt=new THREE.Group();
    tilt.rotation.z=s*-.14; tilt.add(band);
    g.add(tilt);
  });
  return g;
}
function dressTutu(col,tul){
  const g=new THREE.Group();
  const body=lathe([[.02,.94],...fit(.95,1.45,.020,10),[.02,1.468]],48,M.velvet(col));
  g.add(body);
  /* an opaque petticoat under the tulle — four sheer tiers over bare legs
     reads as "no skirt", however pretty the geometry is */
  const pet=lathe([[.02,.63],[.300,.63],[.318,.70],[.300,.80],[.262,.885],
                   ...fit(.92,.99,.014,3)],52,M.satin(col));
  g.add(pet);
  for(let i=0;i<4;i++){
    const y=.965-i*.055, r=.285+i*.082;
    const layer=lathe([[over(y,.006),y],[r*.62,y-.080],[r*.90,y-.180],[r,y-.235],[r*.93,y-.268]],
      56,M.tulle(tul||PAL.blush),false);
    g.add(layer);
  }
  const band=shade(new THREE.TorusGeometry(over(.975,.010),.020,10,44),M.satin(tul||PAL.blush));
  band.position.y=.975; band.rotation.x=Math.PI/2;
  g.add(band);
  return g;
}
function dressMermaid(col){
  const g=new THREE.Group(); const m=M.holo(col);
  const body=lathe([
    [.02,.02],[.40,.02],[.42,.10],[.335,.26],[.252,.44],[.226,.62],[.224,.80],
    ...fit(.90,1.46,.016,11),[.02,1.478],
  ],56,m);
  g.add(body);
  return g;
}

/* ---- TOPS ---- */
function topTee(col){
  const g=new THREE.Group(); const m=M.matte(col);
  const body=lathe([[.02,.93],...fit(.94,1.50,.030,10),[.150,1.532],[.02,1.548]],44,m);
  g.add(body);
  [-1,1].forEach(s=>{
    const sl=shade(new THREE.CylinderGeometry(.088,.078,.18,18,1,true),
      new THREE.MeshPhysicalMaterial({color:col,roughness:.86,side:THREE.DoubleSide}));
    sl.position.set(s*.226,RIG.shoulder-.078,0); sl.rotation.z=s*1.42;
    sl.userData.att=s<0?"armL":"armR";

function disposeTree(o){ o.traverse(n=>{ if(n.geometry) n.geometry.dispose(); }); }

/* Garments ride the joint they belong to. Head pieces are authored
   head-local and parent straight to the skull; sleeves and trouser legs
   are authored in body space, so they get a wrapper that cancels out the
   joint's own offset. Everything else hangs on the body root, which means
   a pose moves the clothes with the body instead of leaving her standing
   inside a frozen outfit. */
function attach(obj,att){
  if(att==="head"&&BODY.head){ BODY.head.add(obj); return obj; }
  const joint=att&&BODY[att];
  if(joint){
    /* accumulate every offset from the body root down to this joint, so
       nested joints (forearm, foot) land in the right place too */
    const off=new THREE.Vector3();
    for(let n=joint;n&&n!==BODY.root;n=n.parent) off.add(n.position);
    const w=new THREE.Group();
    w.position.copy(off).multiplyScalar(-1);
    w.add(obj); joint.add(w);
    return w;
  }
  BODY.root.add(obj);
  return obj;
}

function wear(slot,id){
  if(!WARDROBE[slot]) return false;
  const def=WARDROBE[slot].find(x=>x.id===id);
  if(!def){ console.warn("no such piece",slot,id); return false; }
  outfit[slot]=id;
  if(worn[slot]){
    (worn[slot].userData.parts||[]).forEach(p=>{ if(p.parent) p.parent.remove(p); disposeTree(p); });
    delete worn[slot];
  }
  if(slot==="shoes"&&BODY.footL){ BODY.footL.rotation.x=0; BODY.footR.rotation.x=0; }
  if(slot==="shoes"){
    const p=def.pitch||0;
    if(BODY.footL) BODY.footL.rotation.x=p;
    if(BODY.footR) BODY.footR.rotation.x=p;
  }
  if(def.make){
    const g=new THREE.Group();
    g.name="worn_"+slot;
    const parts=[];
    if(slot==="shoes"){
      /* one shoe per foot, parented so it follows the pose and the pitch */
      ["footL","footR"].forEach(k=>{
        const sh=def.make();           /* built symmetric — no negative scale,
                                          which would invert the winding */
        if(BODY[k]) BODY[k].add(sh); else BODY.root.add(sh);
        parts.push(sh);
      });
    }else{
      const made=def.make();
      const cloth=slot==="dress"||slot==="top"||slot==="bottom";
      if(made.userData.att){ parts.push(attach(made,made.userData.att)); }
      else made.children.slice().forEach(c=>{
        /* only the pieces that hang on the torso get cut against the torso
           envelope — a sleeve is supposed to overlap the shoulder */
        if(cloth&&!c.userData.att) c.traverse(n=>{ if(n.isMesh) n.userData.garment=true; });
        parts.push(attach(c,c.userData.att));
      });
    }
    g.userData.parts=parts;
    worn[slot]=g;
  }
  if(slot==="dress"&&id!=="none"){ ["top","bottom"].forEach(s=>{ if(outfit[s]!=="none") wear(s,"none"); }); }
  if((slot==="top"||slot==="bottom")&&id!=="none"&&outfit.dress!=="none") wear("dress","none");
  groundModel(); frameModel();
  renderRack(); updateStats();
  if(G.mode==="dress") renderBrief();
  return true;
}

/* ═══════════════════════════════════════════════════════════
   GROUNDING + FRAMING · measured, never guessed
   Heels lift her, a ballgown widens her, a tiara adds height —
   so both the stance and the camera are solved from the real
   bounding box after every change instead of hand-tuned.
   ═══════════════════════════════════════════════════════════ */
const _gb=new THREE.Box3(), _gs=new THREE.Vector3();
function modelBox(){
  const by=BODY.root?BODY.root.position.y:0;
  if(BODY.root) BODY.root.position.y=0;          /* ignore the breath */
  const py=model.position.y; model.position.y=0;
  model.updateMatrixWorld(true);
  _gb.setFromObject(model);
  model.position.y=py;
  if(BODY.root) BODY.root.position.y=by;
  model.updateMatrixWorld(true);
  return _gb;
}
function groundModel(){
  const b=modelBox();
  if(Number.isFinite(b.min.y)) model.position.y=RISER-b.min.y;
}
function frameModel(){
  const b=modelBox();
  if(!Number.isFinite(b.min.y)) return;
  b.getSize(_gs);
  const h=_gs.y, w=Math.max(_gs.x,_gs.z*.7);
  const half=Math.tan(camera.fov*Math.PI/360);
  const dockFrac=Math.min(.32,(DOCKH+16)/Math.max(1,H));
  const topFrac=Math.min(.14,64/Math.max(1,H));      /* the RUNWAY lockup */
  const usable=Math.max(.42,1-dockFrac-topFrac);
  const needY=(h*1.10/usable)/(2*half);
  const needX=(w*1.24)/(2*half*Math.max(.55,camera.aspect));
  cam.want=Math.max(2.6,Math.min(9.5,Math.max(needY,needX)));
  /* centre her in the strip of screen neither the lockup nor the dock covers */
  const visH=2*half*cam.want;
  cam.tgtWant=b.min.y+h*.5-visH*(dockFrac-topFrac)*.5;
}

/* ═══════════════════════════════════════════════════════════
   VERIFY · prove the geometry I authored is actually sane
   ═══════════════════════════════════════════════════════════ */
const _v3=new THREE.Vector3(), _n3=new THREE.Vector3();
function checkOutward(mesh){
  /* A lathe is a surface of revolution around its own Y axis. Every face
     normal must point away from that axis, or the piece is inside-out and
     backface culling makes it vanish. Sample and score. */
  const g=mesh.geometry;
  const pos=g.attributes.position, nrm=g.attributes.normal;
  if(!pos||!nrm) return 1;
  let good=0,n=0;
  const step=Math.max(1,Math.floor(pos.count/64));
  for(let i=0;i<pos.count;i+=step){
    _v3.set(pos.getX(i),0,pos.getZ(i));
    if(_v3.lengthSq()<1e-8) continue;
    _n3.set(nrm.getX(i),0,nrm.getZ(i));
    if(_n3.lengthSq()<1e-8) continue;
    if(_v3.normalize().dot(_n3.normalize())>0) good++;
    n++;
  }
  return n?good/n:1;
}
/* Sample a garment's real vertices and ask whether any of them sit inside
   the body it is supposed to be covering. This is the check that catches a
   hip poking through a gown, which no amount of staring at one camera angle
   reliably does. */
const _cv=new THREE.Vector3();
function clipCount(mesh){
  const g=mesh.geometry, pos=g.attributes.position;
  if(!pos||!BODY.root) return 0;
  let bad=0;
  const step=Math.max(1,Math.floor(pos.count/240));
  for(let i=0;i<pos.count;i+=step){
    _cv.set(pos.getX(i),pos.getY(i),pos.getZ(i));
    mesh.localToWorld(_cv);
    BODY.root.worldToLocal(_cv);                 /* the envelope is defined in body space */
    if(_cv.y<.92||_cv.y>1.52) continue;          /* only where the body is one solid of revolution */
    const r=Math.hypot(_cv.x,_cv.z);
    if(r>.03&&r<bodyR(_cv.y)-.014) bad++;
  }
  return bad;
}
function verify(){
  const problems=[];
  let meshes=0,tris=0,lathes=0,inverted=0,clipped=0;
  const bb=new THREE.Box3();

  scene.traverse(o=>{
    if(!o.isMesh) return;
    const label=o.name||o.geometry?.type||o.type;
    if(o.userData.stage){                       /* stage props: only sanity, not size */
      if(!o.geometry||!o.geometry.attributes.position) problems.push(label+": no geometry");
      return;
    }
    meshes++;
    const g=o.geometry;
    if(!g||!g.attributes.position){ problems.push(label+": no position attribute"); return; }
    if(!o.material){ problems.push(label+": no material"); }
    const p=g.attributes.position.array;
    for(let i=0;i<p.length;i++){
      if(!Number.isFinite(p[i])){ problems.push(label+": NaN vertex"); break; }
    }
    g.computeBoundingBox();
    const box=g.boundingBox;
    if(!box||!Number.isFinite(box.min.x)){ problems.push(label+": bad bounding box"); }
    else{
      const s=box.getSize(_v3).length();
      if(s>4)   problems.push(label+": absurd size "+s.toFixed(1));
      if(s<1e-4)problems.push(label+": degenerate size");
    }
    const idx=g.index;
    tris+=(idx?idx.count:g.attributes.position.count)/3;
    if(o.userData.lathe){
      lathes++;
      const frac=checkOutward(o);
      if(frac<.5){ inverted++; problems.push(label+": lathe is inside-out ("+Math.round(frac*100)+"% outward)"); }
    }
    if(o.userData.garment){
      const c=clipCount(o);
      if(c>6){ clipped++; problems.push(label+": skin shows through it at "+c+" sample points"); }
    }
  });

  bb.setFromObject(model);
  const size=bb.getSize(new THREE.Vector3());
  const height=size.y, width=size.x;
  if(!(height>1.7&&height<2.7)) problems.push("model height out of range: "+height.toFixed(2));
  const groundGap=bb.min.y-RISER;               /* 0 means standing exactly on the riser */
  if(groundGap<-.015) problems.push("clips through the riser by "+Math.abs(groundGap).toFixed(3));
  if(groundGap> .015) problems.push("floating above the riser by "+groundGap.toFixed(3));
  /* she has to actually fit in shot */
  const half=Math.tan(camera.fov*Math.PI/360);
  const fitY=2*half*cam.dist, fitX=fitY*camera.aspect;
  if(size.y>fitY) problems.push("taller than the frame ("+size.y.toFixed(2)+" > "+fitY.toFixed(2)+")");
  if(size.x>fitX) problems.push("wider than the frame ("+size.x.toFixed(2)+" > "+fitX.toFixed(2)+")");

  /* the skull itself, not whatever hairstyle is sitting on it */
  if(BODY.skull){
    const hb=new THREE.Box3().setFromObject(BODY.skull);
    const hy=hb.getSize(_v3).y;
    const ratio=height/hy;
    if(ratio<4.5||ratio>9) problems.push("head-to-body ratio off: "+ratio.toFixed(1)+" heads");
  }
  /* every worn slot in `outfit` should have real geometry in the scene */
  Object.entries(outfit).forEach(([slot,id])=>{
    if(id!=="none"&&!worn[slot]) problems.push("slot "+slot+" says "+id+" but nothing is worn");
  });

  let heads=0;
  if(BODY.skull){ const hb=new THREE.Box3().setFromObject(BODY.skull);
    heads=height/Math.max(.001,hb.getSize(_v3).y); }
  return { ok:problems.length===0, problems, meshes, tris:Math.round(tris),
    lathes, inverted, clipped, heads:+heads.toFixed(2),
    modelHeight:+height.toFixed(3), modelWidth:+width.toFixed(3),
    groundGap:+groundGap.toFixed(3), pieces:Object.keys(worn).length };
}

function look(){ const o={}; SLOTS.forEach(k=>o[k]=outfit[k]); return o; }
function pieceOf(slot,id){ return WARDROBE[slot].find(x=>x.id===id); }

function judge(lk,theme){
  const w=theme.w; let raw=0; const hits={};
  SLOTS.forEach(slot=>{
    const p=pieceOf(slot,lk[slot]);
    if(!p||!p.tags) return;
    p.tags.split(" ").forEach(t=>{
      if(w[t]){ raw+=w[t]; hits[t]=(hits[t]||0)+1; }
    });
  });
  let complete=0;
  const dressed=lk.dress!=="none"||(lk.top!=="none"&&lk.bottom!=="none");
  if(dressed) complete+=14;
  if(lk.hair!=="none") complete+=5;
  if(lk.shoes!=="none") complete+=5;
  if(lk.hat!=="none") complete+=3;
  if(lk.extra!=="none") complete+=3;
  const score=Math.max(4,Math.min(100,Math.round(raw*3.2+complete*.85)));
  return {score,raw,hits,complete,dressed};
}

function walkFrame(dt,ts){
  const w=G.walk; if(!w) return;
  /* wall clock, not accumulated frame deltas — the walk must take the same
     six seconds on a slow device as on a fast one */
  w.t=performance.now()-w.start;
  const k=Math.min(1,w.t/w.dur);
  const ease=k<.86?k/.86:1;
  model.position.z=w.z0+(w.z1-w.z0)*ease;
  /* stride */
  const striding=k<.86;
  const ph=ts/300;
  if(striding){
    const sw=.52;
    BODY.legL.rotation.x=Math.sin(ph)*sw;
    BODY.legR.rotation.x=-Math.sin(ph)*sw;
    BODY.shinL.rotation.x=Math.max(0,-Math.sin(ph-.7))*.62;
    BODY.shinR.rotation.x=Math.max(0,Math.sin(ph-.7))*.62;
    BODY.armL.rotation.z=.10+Math.sin(ph)*.20;
    BODY.armR.rotation.z=-.10+Math.sin(ph)*.20;
    BODY.root.rotation.z=Math.sin(ph)*.045;
    BODY.root.rotation.y=Math.sin(ph)*.10;
    BODY.root.position.y=Math.abs(Math.sin(ph))*.020;
    model.position.x=Math.sin(ph)*.045;
    BODY.head.rotation.y=Math.sin(ts/1700)*.10;
  }else{
    /* the turn at the end of the runway */
    const p=(k-.86)/.14;
    BODY.legL.rotation.x*= .86; BODY.legR.rotation.x*=.86;
    BODY.shinL.rotation.x*=.86; BODY.shinR.rotation.x*=.86;
    BODY.root.rotation.y+=(0-BODY.root.rotation.y)*.12;
    BODY.root.rotation.z+=(.09*.28-BODY.root.rotation.z)*.10;
    BODY.armL.rotation.z+=(-.55-BODY.armL.rotation.z)*.10;
    BODY.foreL.rotation.z+=(.95-BODY.foreL.rotation.z)*.10;
    BODY.armR.rotation.z+=(-.09-BODY.armR.rotation.z)*.10;
    model.position.x+=(0-model.position.x)*.12;
    if(p>=1&&!w.done){ w.done=true; setTimeout(endWalk,720); }
  }
  /* camera choreography: parked at the end of the deck and dollying gently
     in, so she genuinely walks toward the lens and grows into frame */
  const camZ=5.35-ease*.55;
  const camY=1.62-ease*.52;
  camera.position.set(Math.sin(ts/3000)*.22,camY,camZ);
  camera.lookAt(0,1.24-ease*.18,model.position.z*.26);
  /* flashbulbs */
  const bulbs=RUNWAY.userData.bulbs;
  for(let i=0;i<3;i++){
    const b=bulbs[(Math.random()*bulbs.length)|0];
    b.emissiveIntensity=2.6;
  }
  bulbs.forEach(b=>{ b.emissiveIntensity*=.90; });
  if(Math.random()<.055+ease*.10){
    $("flash").style.opacity=".30";
    flashLight.intensity=26;
    setTimeout(()=>{ $("flash").style.opacity="0"; },70);
  }
  flashLight.intensity*=.80;
}
function endWalk(){
  G.mode="result";
  $("walkHud").classList.remove("show");
  const lk=look(), j=judge(lk,G.theme);
  const all=G.rivals.map(r=>({name:r.name,score:r.score,look:r.look,you:false}))
    .concat([{name:"YOU",score:j.score,look:lk,you:true}])
    .sort((a,b)=>b.score-a.score||(a.you?-1:1));
  const rank=all.findIndex(x=>x.you)+1;
  const ORD=["","1ST","2ND","3RD","4TH","5TH"];
  $("place").textContent=ORD[rank]||(rank+"TH");
  $("scoreBig").textContent=j.score+" points · "+G.theme.n;
  $("board").innerHTML=all.map((x,i)=>
    `<div class="rowr${x.you?" you":""}"><span class="rk">${i+1}</span>`+
    `<span class="nm">${x.name}</span>`+
    `<span class="sw2">${swatches(x.look).map(c=>`<i style="background:${c}"></i>`).join("")}</span>`+
    `<span class="sc">${x.score}</span></div>`).join("");
  const top=Object.keys(G.theme.w).sort((a,b)=>G.theme.w[b]-G.theme.w[a]);
  const missed=top.filter(t=>!j.hits[t]).slice(0,3);
  let note;
  if(!j.dressed) note="The judges noted you were <b>not actually dressed</b>. Bold. Costly.";
  else if(j.score>=88) note="Head to toe on brief. The panel had <b>nothing to say</b>.";
  else if(j.score>=70) note="Strong brief-reading. A little more <b>"+(missed[0]||"conviction")+"</b> and it's a win.";
  else if(j.score>=48) note="Pretty, but it wandered. Missing <b>"+missed.slice(0,2).join("</b> and <b>")+"</b>.";
  else note="The theme was <b>"+G.theme.n+"</b>. This was not that.";
  if(j.score>G.best){ G.best=j.score; try{localStorage.setItem("rw_best",String(j.score));}catch(e){}
    note+=" <b>New personal best.</b>"; }
  $("notes").innerHTML=note;
  showScreen("scResult");
  /* she holds the finish at the end of the runway behind the scorecard —
     the camera stays exactly where the walk left it */
}
function enterStudio(){
  G.mode="studio";
  showScreen(null);
  setPlayMode(false);
  $("dock").style.display="flex"; $("fx").style.display="flex"; $("tr").style.display="flex";
  $("brief").classList.remove("show"); $("go").classList.remove("show");
  $("walkHud").classList.remove("show");
  $("brand").style.display="";
  RUNWAY.visible=false; pedestal.visible=true;
  resetRig(); cam.spin=true; setPose(1); groundModel(); frameModel(); measureDock();
}
function goHome(){
  G.mode="title";
  $("bestLine").textContent=G.best?("personal best · "+G.best+" points"):"";
  showScreen("scTitle");
  setPlayMode(false);
  $("dock").style.display="none"; $("fx").style.display="none"; $("tr").style.display="none";
  $("walkHud").classList.remove("show");
  $("brand").style.display="";
  RUNWAY.visible=false; pedestal.visible=true;
  resetRig(); cam.spin=true; setPose(1); groundModel(); frameModel();
}

/* camera orbit + turntable */
const cam={az:.22,el:.05,dist:4.6,want:4.6,tgtWant:1.06,tgt:new THREE.Vector3(0,1.06,0),spin:true};
let drag=null,pinch=null;
cv.addEventListener("pointerdown",e=>{ drag={x:e.clientX,y:e.clientY,az:cam.az,el:cam.el}; });
addEventListener("pointermove",e=>{
  if(!drag) return;
  cam.az=drag.az-(e.clientX-drag.x)*.008;
  cam.el=Math.max(-.30,Math.min(.80,drag.el+(e.clientY-drag.y)*.005));
});
addEventListener("pointerup",()=>drag=null);
addEventListener("pointercancel",()=>drag=null);
cv.addEventListener("wheel",e=>{ e.preventDefault();
  cam.want=cam.dist=Math.max(1.2,Math.min(9.5,cam.dist+e.deltaY*.002)); },{passive:false});
cv.addEventListener("touchstart",e=>{
  if(e.touches.length===2){ drag=null;
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    pinch={d,dist:cam.dist};
  }
},{passive:true});
cv.addEventListener("touchmove",e=>{
  if(pinch&&e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    cam.want=cam.dist=Math.max(1.2,Math.min(9.5,pinch.dist*pinch.d/Math.max(1,d)));
  }
},{passive:true});
cv.addEventListener("touchend",()=>{ pinch=null; },{passive:true});

$("bSpin").addEventListener("click",()=>{
  cam.spin=!cam.spin; $("bSpin").classList.toggle("on",cam.spin); });
$("bLights").addEventListener("click",()=>{
  LIGHTS.visible=!LIGHTS.visible; $("bLights").classList.toggle("on",LIGHTS.visible); });
let wire=false;
$("bWire").addEventListener("click",()=>{
  wire=!wire; $("bWire").classList.toggle("on",wire);
  scene.traverse(o=>{ if(o.isMesh&&o.material&&!o.userData.stage&&"wireframe" in o.material)
    o.material.wireframe=wire; });
});
$("bVfy").addEventListener("click",()=>{
  const on=$("vfy").classList.toggle("show");
  $("bVfy").classList.toggle("on",on);
  if(on) showVerify();
});
$("cLook").addEventListener("click",()=>{ randomLook(); if($("vfy").classList.contains("show")) showVerify(); });
$("bPlay").addEventListener("click",startShow);
$("bStudio").addEventListener("click",enterStudio);
$("bDress").addEventListener("click",startDressing);
$("bAgain").addEventListener("click",startShow);
$("bHome").addEventListener("click",goHome);
$("go").addEventListener("click",startWalk);
$("cSkin").addEventListener("click",()=>setSkin(skinIdx+1));
$("cPose").addEventListener("click",()=>setPose(poseIdx+1));

/* ═══════════════════════════════════════════════════════════
   LOOP
   ═══════════════════════════════════════════════════════════ */
let t0=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(60,ts-(t0||ts)); t0=ts;
  if(cv.clientWidth&&(Math.abs(cv.clientWidth-W)>1||Math.abs(cv.clientHeight-H)>1)){ resize(); frameModel(); }

  if(G.mode==="dress") tickClock();
  if(G.mode==="walk"){
    walkFrame(dt,ts);
    renderer.render(scene,camera);
    return;
  }
  if(G.mode==="result"){
    /* hold the finish: keep the walk camera, let her breathe */
    if(BODY.root) BODY.root.position.y=Math.sin(ts/1500)*.005;
    const bulbs=RUNWAY.userData.bulbs;
    bulbs[(Math.random()*bulbs.length)|0].emissiveIntensity=2.2;
    bulbs.forEach(b=>{ b.emissiveIntensity*=.93; });
    renderer.render(scene,camera);
    return;
  }
  if(cam.spin&&!drag) cam.az+=dt*.00020;
  cam.dist+=(cam.want-cam.dist)*Math.min(1,dt*.008);
  cam.tgt.y+=(cam.tgtWant-cam.tgt.y)*Math.min(1,dt*.008);

  const cx=Math.sin(cam.az)*cam.dist*Math.cos(cam.el);
  const cz=Math.cos(cam.az)*cam.dist*Math.cos(cam.el);
  const cy=cam.tgt.y+Math.sin(cam.el)*cam.dist;
  camera.position.set(cx,cy,cz);
  camera.lookAt(cam.tgt);

  /* breath + settle into the pose */
  applyPose(Math.min(1,dt*.006));
  if(poseSettle>0&&--poseSettle%6===0){ groundModel(); frameModel(); }
  if(BODY.root){
    const b=Math.sin(ts/1500);
    BODY.root.position.y=b*.005;
    if(BODY.torso) BODY.torso.scale.set(1+b*.004,1,1+b*.004);
    if(BODY.head) BODY.head.rotation.x=Math.sin(ts/2300)*.035;
  }
  renderer.render(scene,camera);
}

/* boot */
buildModel();
setPose(1);
groundModel(); frameModel(); cam.dist=cam.want; cam.tgt.y=cam.tgtWant;
renderSlots();
Object.entries(outfit).forEach(([s,id])=>{ if(id!=="none") wear(s,id); });
renderRack(); updateStats();
goHome();
$("load").style.display="none";
requestAnimationFrame(frame);

window.FS={THREE,scene,renderer,camera,model,pedestal,LIGHTS,BODY,RIG,cam,
  WARDROBE,SLOTS,outfit,worn,wear,randomLook,setSkin,setPose,POSES,verify,showVerify,PAL,
  groundModel,frameModel,modelBox,G,THEMES,judge,startShow,startDressing,startWalk,
  enterStudio,goHome,look,RUNWAY,
  setSlot:s=>{curSlot=s;renderSlots();renderRack();}};
</script>
