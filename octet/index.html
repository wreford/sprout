<style>
*{margin:0;padding:0;box-sizing:border-box}
button{touch-action:manipulation;font-family:inherit}
html,body{position:fixed;inset:0;overflow:hidden;background:var(--bg);
  touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  font-family:"Quicksand",-apple-system,system-ui,sans-serif;color:var(--tx)}
:root{
  --bg:#0b1416;--felt:#0f2225;--panel:#122a2e;--tx:#dff3ee;--mut:#5f8a84;
  --gold:#ffd95e;--red:#ff5a6e;--blue:#59c2ff;--acc:#38e0b0;
  --card:#f4fbf7;--cardtx:#11312b;
}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px);
  background:
    radial-gradient(ellipse at 50% -10%, rgba(56,224,176,0.12), transparent 55%),
    var(--bg)}
/* top: blind panel */
#blindBar{display:flex;gap:8px;align-items:stretch}
#blindBox{flex:1;background:var(--panel);border:1.5px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:8px 12px}
#blindName{font-size:12px;font-weight:700;letter-spacing:0.08em}
#blindName .boss{color:var(--red)}
#bossFx{font-size:9.5px;color:var(--red);font-weight:700;min-height:12px;letter-spacing:0.03em}
#tgtRow{display:flex;align-items:baseline;gap:8px;margin-top:2px}
#score{font-size:21px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
#tgt{font-size:11px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
#tgtBar{height:5px;border-radius:99px;background:rgba(255,255,255,0.1);margin-top:5px;overflow:hidden}
#tgtFill{height:100%;border-radius:99px;background:var(--gold);transition:width 0.4s;width:0%}
#statBox{display:flex;flex-direction:column;gap:4px;justify-content:center;
  background:var(--panel);border:1.5px solid rgba(255,255,255,0.1);border-radius:14px;padding:8px 12px;
  font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
#statBox .h{color:var(--blue)}#statBox .d{color:var(--red)}#statBox .m{color:var(--gold)}
/* jokers */
#jokerRow{display:flex;gap:7px;margin:8px 0 2px;min-height:58px}
.jk{width:52px;height:58px;border-radius:11px;background:linear-gradient(160deg,#1b3a3f,#122a2e);
  border:1.5px solid rgba(255,217,94,0.4);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;flex:none;position:relative}
.jk .je{font-size:21px;line-height:1}
.jk .jn{font-size:6.6px;font-weight:700;color:var(--mut);text-align:center;letter-spacing:0.02em;
  text-transform:uppercase;padding:0 2px}
.jk.pulse{animation:jkp 0.45s ease}
@keyframes jkp{40%{transform:translateY(-7px) scale(1.12);border-color:var(--gold)}}
#jokerHint{font-size:9px;color:var(--mut);align-self:center;margin-left:4px;letter-spacing:0.06em}
/* play area */
#table{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative}
#playRow{display:flex;gap:7px;min-height:92px;align-items:center;justify-content:center}
#resultFly{position:absolute;left:0;right:0;top:4px;text-align:center;pointer-events:none}
#comboName{font-size:17px;font-weight:700;letter-spacing:0.12em;color:var(--acc);
  text-transform:uppercase;opacity:0;transition:opacity 0.2s}
#comboName.on{opacity:1}
#calcRow{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;
  opacity:0;transition:opacity 0.2s}
#calcRow.on{opacity:1}
#calcRow .c{color:var(--blue)}#calcRow .m{color:var(--red)}#calcRow .t{color:var(--gold);font-size:19px}
#mascot{position:absolute;bottom:2px;left:6px;right:6px;text-align:center;
  font-size:11px;color:var(--mut);font-style:italic;min-height:16px;line-height:1.45}
/* hand */
#handWrap{min-height:118px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.cd{width:62px;height:86px;border-radius:11px;background:var(--card);color:var(--cardtx);
  flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2px solid rgba(0,0,0,0.12);position:relative;margin:0 -7px;
  box-shadow:0 4px 10px rgba(0,0,0,0.45);transition:transform 0.14s;z-index:1}
.cd .sym{font-size:25px;font-weight:700;line-height:1.05}
.cd .nm{font-size:7.5px;font-weight:700;opacity:0.55;text-transform:uppercase;letter-spacing:0.04em}
.cd .chip{position:absolute;top:4px;left:6px;font-size:10px;font-weight:700;color:var(--cardtx);opacity:0.65;
  font-variant-numeric:tabular-nums}
.cd.sel{transform:translateY(-20px);border-color:var(--gold);z-index:5;
  box-shadow:0 10px 20px rgba(0,0,0,0.5),0 0 14px rgba(255,217,94,0.35)}
.cd.played{margin:0;transform:none}
.cd.scoring{animation:cdScore 0.4s ease}
@keyframes cdScore{40%{transform:translateY(-12px) scale(1.1)}}
.cd.dim{opacity:0.35}
/* buttons */
#btnRow{display:flex;gap:9px;padding:4px 2px 2px}
#btnRow button{flex:1;padding:14px 6px;border-radius:13px;border:none;font-size:14.5px;font-weight:700}
#playBtn{background:var(--acc);color:#07211a}
#playBtn:disabled{opacity:0.35}
#discBtn{background:var(--panel);color:var(--red);border:1.5px solid rgba(255,90,110,0.5) !important}
#discBtn:disabled{opacity:0.35}
#btnRow button:active:not(:disabled){transform:scale(0.96)}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,12,13,0.88);display:none;
  align-items:center;justify-content:center;padding:18px}
.ov.on{display:flex}
.ovCard{background:var(--felt);border:1.5px solid rgba(255,255,255,0.14);border-radius:20px;
  padding:22px 18px;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;touch-action:pan-y;
  text-align:center}
.ovCard h2{font-size:20px;letter-spacing:0.1em}
.ovCard .sub{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:0.1em;margin-top:4px;
  text-transform:uppercase}
.bigBtn{margin-top:14px;width:100%;padding:15px;border-radius:14px;border:none;
  font-size:15px;font-weight:700;background:var(--acc);color:#07211a}
.bigBtn:active{transform:scale(0.97)}
.bigBtn.gold{background:var(--gold);color:#2a2008}
/* shop */
.shopRow{display:flex;gap:9px;margin-top:12px;justify-content:center}
.shopItem{flex:1;max-width:116px;background:var(--panel);border:1.5px solid rgba(255,255,255,0.14);
  border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.shopItem .se{font-size:26px}
.shopItem .sn{font-size:9.5px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase}
.shopItem .sd{font-size:8.6px;color:var(--mut);line-height:1.35;min-height:32px}
.shopItem button{width:100%;padding:8px 4px;border-radius:9px;border:none;font-weight:700;font-size:11px;
  background:var(--gold);color:#2a2008}
.shopItem button:disabled{opacity:0.35}
.shopItem.sold{opacity:0.4}
#shopMoney{font-size:15px;color:var(--gold);font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
/* molecule book rows */
.bookRow{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px;
  border-bottom:1px solid rgba(255,255,255,0.07);font-size:12px;font-weight:700}
.bookRow .f{color:var(--acc)}
.bookRow .v{color:var(--mut);font-size:10.5px;font-variant-numeric:tabular-nums}
#topLinks{display:flex;gap:8px;margin-bottom:6px}
#topLinks a,#topLinks button{font-size:11px;font-weight:700;padding:7px 12px;border-radius:10px;
  border:1.5px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:var(--tx);
  text-decoration:none}
#anteTag{margin-left:auto;font-size:11px;font-weight:700;color:var(--mut);align-self:center;
  font-variant-numeric:tabular-nums;letter-spacing:0.08em}
</style>
</head>
<body>

<script>
"use strict";
const $=id=>document.getElementById(id);
["gesturestart","gesturechange","gestureend"].forEach(ev=>
  document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
let lastTouchEnd=0;
document.addEventListener("touchend",e=>{
  const now=Date.now();
  if(now-lastTouchEnd<320&&!e.target.closest("button,a"))e.preventDefault();
  lastTouchEnd=now;
},{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
const rnd=Math.random;
function ri(a,b){return a+((rnd()*(b-a+1))|0);}
function pick(a){return a[(rnd()*a.length)|0];}
const shuffle=a=>a.sort(()=>rnd()-0.5);

/* ================= CONTENT (chemistry) ================= */
const CONTENT={
save:"oc-save",
title:"OCTET",em:"🧪",sub:"build molecules · break the rules",
blurb:"Play element cards from your hand to synthesize real molecules.<br>Bigger molecules, bigger payouts. Catalysts bend the rules.<br>Beat the quota before your plays run out.",
mascotName:"The Flask",shopName:"THE SUPPLY CLOSET",packEm:"🎁",packName:"Element Pack",
lines:{
  good:["Beautiful synthesis.","The peer reviewers are weeping.","Nobel committee has been notified.","That molecule is load-bearing now."],
  mix:["That's... a mixture. Technically matter.","No reaction. The atoms are ignoring each other.","Chemistry requires consent between atoms."],
  lose:["The grant ran out. Science is cruel.","Entropy wins again. It always does.","The lab is foam now. Mostly foam."],
  win:["QUOTA MET. The department is thrilled and suspicious."],
},
deck:[
  {id:"H",nm:"hydrogen",chip:1,n:10,col:"#59c2ff"},
  {id:"O",nm:"oxygen",chip:6,n:7,col:"#ff5a6e"},
  {id:"C",nm:"carbon",chip:4,n:6,col:"#9aa7b5"},
  {id:"N",nm:"nitrogen",chip:5,n:4,col:"#38e0b0"},
  {id:"Na",nm:"sodium",chip:3,n:3,col:"#ffd95e"},
  {id:"Cl",nm:"chlorine",chip:5,n:3,col:"#b4e85a"},
  {id:"Fe",nm:"iron",chip:8,n:2,col:"#e8945a"},
  {id:"Ca",nm:"calcium",chip:4,n:2,col:"#e0d8c8"},
  {id:"S",nm:"sulfur",chip:6,n:2,col:"#f0e060"},
  {id:"He",nm:"helium",chip:2,n:1,col:"#d8a0ff"},
],
packCards:["H","O","C","N","Na","Cl","Fe","Ca","S","He"],
combos:[
  {id:"c6h6",name:"C₆H₆ · benzene",chips:90,mult:9,req:{C:3,H:3},
   book:"3C + 3H (abridged ring) — the aromatic jackpot"},
  {id:"h2so4",name:"H₂SO₄ · sulfuric acid",chips:70,mult:7,req:{H:2,S:1,O:1},
   book:"2H + S + O — king of industrial chemicals"},
  {id:"ch4",name:"CH₄ · methane",chips:55,mult:6,req:{C:1,H:4},book:"C + 4H — the toot molecule"},
  {id:"nh3",name:"NH₃ · ammonia",chips:45,mult:5,req:{N:1,H:3},book:"N + 3H — window cleaner energy"},
  {id:"caco3",name:"CaCO₃-ish · chalk",chips:45,mult:5,req:{Ca:1,C:1,O:1},book:"Ca + C + O — blackboard fuel"},
  {id:"h2o2",name:"H₂O₂ · peroxide",chips:40,mult:5,req:{H:2,O:2},book:"2H + 2O — hair-raising"},
  {id:"so2",name:"SO₂ · sulfur dioxide",chips:38,mult:4,req:{S:1,O:1},book:"S + O — smells like a volcano's gym bag"},
  {id:"feo",name:"FeO · rust",chips:36,mult:4,req:{Fe:1,O:1},book:"Fe + O — time's favourite chemical"},
  {id:"co2",name:"CO₂ · carbon dioxide",chips:32,mult:4,req:{C:1,O:2},book:"C + 2O — plant food"},
  {id:"nacl",name:"NaCl · table salt",chips:30,mult:4,req:{Na:1,Cl:1},book:"Na + Cl — deadly alone, delicious together"},
  {id:"h2o",name:"H₂O · water",chips:24,mult:3,req:{H:2,O:1},book:"2H + O — the classic"},
  {id:"hcl",name:"HCl · stomach acid",chips:22,mult:3,req:{H:1,Cl:1},book:"H + Cl — you contain this right now"},
  {id:"n2",name:"N₂ · nitrogen gas",chips:18,mult:3,req:{N:2},book:"2N — 78% of every breath"},
  {id:"o2",name:"O₂ · oxygen gas",chips:16,mult:2,req:{O:2},book:"2O — breathe it while it's free"},
  {id:"h2",name:"H₂ · hydrogen gas",chips:10,mult:2,req:{H:2},book:"2H — hydrogen, meet hydrogen"},
],
loneName:"LONE ATOM",mixName:"MIXTURE",
jokers:[
  {id:"bunsen",em:"🔥",nm:"Bunsen",desc:"+4 mult if your play has 3+ cards",cost:5,
   fx:(ctx)=>{if(ctx.cards.length>=3)ctx.mult+=4;}},
  {id:"platinum",em:"💍",nm:"Platinum",desc:"C cards give double chips",cost:6,
   fx:(ctx)=>{ctx.cards.forEach(c=>{if(c.id==="C")ctx.chips+=c.chip;});}},
  {id:"acidrain",em:"🌧️",nm:"Acid Rain",desc:"each O played: +12 chips",cost:5,
   fx:(ctx)=>{ctx.cards.forEach(c=>{if(c.id==="O")ctx.chips+=12;});}},
  {id:"noble",em:"👑",nm:"Noble Idea",desc:"a lone He scores ×8 mult",cost:6,
   fx:(ctx)=>{if(ctx.cards.length===1&&ctx.cards[0].id==="He")ctx.mult*=8;}},
  {id:"saltbae",em:"🧂",nm:"Salt Bae",desc:"NaCl: +10 mult",cost:6,
   fx:(ctx)=>{if(ctx.comboId==="nacl")ctx.mult+=10;}},
  {id:"organic",em:"🥦",nm:"Organic",desc:"molecules containing C: +3 mult",cost:5,
   fx:(ctx)=>{if(ctx.comboId&&ctx.cards.some(c=>c.id==="C"))ctx.mult+=3;}},
  {id:"hydro",em:"💧",nm:"Hydro Homie",desc:"H₂O scores double chips",cost:5,
   fx:(ctx)=>{if(ctx.comboId==="h2o")ctx.chips*=2;}},
  {id:"lechat",em:"⚖️",nm:"Le Chatelier",desc:"every molecule: +15 chips",cost:4,
   fx:(ctx)=>{if(ctx.comboId)ctx.chips+=15;}},
  {id:"isotope",em:"☢️",nm:"Isotope",desc:"pairs of identical atoms: +2 mult each",cost:5,
   fx:(ctx)=>{const m={};ctx.cards.forEach(c=>m[c.id]=(m[c.id]||0)+1);
     for(const k in m)ctx.mult+=Math.floor(m[k]/2)*2;}},
  {id:"fumehood",em:"🌀",nm:"Fume Hood",desc:"mixtures aren't embarrassing: mixture mult ×3",cost:4,
   fx:(ctx)=>{if(!ctx.comboId&&ctx.cards.length>1)ctx.mult*=3;}},
  {id:"grantmoney",em:"💰",nm:"Grant Money",desc:"+$2 every blind you win",cost:4,fx:null,cash:2},
  {id:"ta",em:"🧑‍🔬",nm:"The TA",desc:"+1 swap per blind",cost:4,fx:null,disc:1},
],
bosses:[
  {id:"inspector",nm:"THE INSPECTOR",fx:"H cards score 0 chips",
   mod:(ctx)=>{ctx.cards.forEach(c=>{if(c.id==="H")ctx.chips-=c.chip;});}},
  {id:"humidity",nm:"HUMIDITY",fx:"H₂O cannot be played",ban:"h2o"},
  {id:"entropy",nm:"ENTROPY",fx:"quota is 30% higher",tgtMul:1.3},
  {id:"shortstaff",nm:"STAFF SHORTAGE",fx:"one fewer play",hands:-1},
  {id:"blackout",nm:"LAB BLACKOUT",fx:"hand size −2",handSize:-2},

/* ================= /CONTENT ================= */

/* ---------- save ---------- */
let SV={bestAnte:0,wins:0,runs:0};
try{SV={...SV,...JSON.parse(localStorage.getItem(CONTENT.save)||"{}")};}catch(e){}
function save(){try{localStorage.setItem(CONTENT.save,JSON.stringify(SV));}catch(e){}}

/* ---------- audio ---------- */
let AC=null;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}}
function tone(f,d,v,del,type){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+(del||0);
  o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(v||0.04,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+0.05);
}
function chipSnd(i){tone(620+i*90,0.09,0.035);}
function multSnd(){tone(220,0.18,0.05,"",0.06&&"sawtooth");}
function winSnd(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.4,0.04,i*0.07));}
function loseSnd(){tone(220,0.5,0.05);tone(185,0.6,0.05,0.18);}
function buySnd(){tone(880,0.12,0.04);tone(1175,0.14,0.04,0.08);}

/* ---------- run state ---------- */
const MAXJ=4,HANDSIZE=8,MAXPLAY=5;
let run=null,sel=[],busy=false;
function freshDeck(){
  const d=[];
  CONTENT.deck.forEach(def=>{
    for(let i=0;i<def.n;i++)d.push({id:def.id,nm:def.nm,chip:def.chip,col:def.col});
  });
  return d;
}
function blindTarget(ante,bi){
  const base=Math.round(28*Math.pow(2.0,ante-1));
  const mul=bi===0?1:bi===1?1.5:2.2;
  return Math.round(base*mul);
}
function blindName(bi){return bi===0?"SMALL BLIND":bi===1?"BIG BLIND":"BOSS";}
function startRun(){
  run={ante:1,bi:0,money:4,jokers:[],deckBase:freshDeck(),
    boss:null,score:0,hands:0,discs:0,target:0,
    deck:[],hand:[],disc:[]};
  SV.runs++;save();
  startBlind();
}
function startBlind(){
  const r=run;
  r.boss=r.bi===2?pick(CONTENT.bosses):null;
  r.target=blindTarget(r.ante,r.bi);
  if(r.boss&&r.boss.tgtMul)r.target=Math.round(r.target*r.boss.tgtMul);
  r.score=0;
  r.hands=4+(r.boss&&r.boss.hands?r.boss.hands:0);
  r.discs=Math.max(0,3+(r.jokers.some(j=>j.disc)?1:0)+(r.boss&&r.boss.discs?r.boss.discs:0));
  r.deck=shuffle(r.deckBase.map(c=>({...c})));
  r.disc=[];r.hand=[];
  drawTo();
  sel=[];
  $("mascot").textContent="";
  renderAll();
}
function handLimit(){
  return HANDSIZE+(run.boss&&run.boss.handSize?run.boss.handSize:0);
}
function drawTo(){
  const r=run;
  while(r.hand.length<handLimit()){
    if(!r.deck.length){
      if(!r.disc.length)break;
      r.deck=shuffle(r.disc.splice(0));
    }
    r.hand.push(r.deck.pop());
  }
}
/* ---------- combo evaluation ---------- */
function multisetMatch(cards,req){
  const m={};
  cards.forEach(c=>m[c.id]=(m[c.id]||0)+1);
  const keys=Object.keys(req);
  if(Object.keys(m).length!==keys.length)return false;
  return keys.every(k=>m[k]===req[k]);
}
function evalPlay(cards){
  for(const cb of CONTENT.combos){
    if(cb.check){if(cb.check(cards))return{comboId:cb.id,name:cb.name,chips:cb.chips,mult:cb.mult};}
    else if(multisetMatch(cards,cb.req))return{comboId:cb.id,name:cb.name,chips:cb.chips,mult:cb.mult};
  }
  if(cards.length===1)return{comboId:null,name:CONTENT.loneName,chips:4,mult:1};
  return{comboId:null,name:CONTENT.mixName,chips:0,mult:1};
}
/* ---------- render ---------- */
function renderAll(){
  const r=run;
  $("anteTag").textContent="ANTE "+r.ante+"/8";
  $("blindName").innerHTML=r.bi===2
    ?'<span class="boss">☠ '+(r.boss?r.boss.nm:"BOSS")+'</span>'
    :blindName(r.bi);
  $("bossFx").textContent=r.boss?r.boss.fx:"";
  $("score").textContent=r.score;
  $("tgt").textContent="/ "+r.target+" quota";
  $("tgtFill").style.width=Math.min(100,r.score/r.target*100)+"%";
  $("handsN").textContent=r.hands;
  $("discN").textContent=r.discs;
  $("moneyN").textContent=r.money;
  const jr=$("jokerRow");jr.innerHTML="";
  r.jokers.forEach(j=>{
    const d=document.createElement("div");
    d.className="jk";d.dataset.j=j.id;
    d.innerHTML='<span class="je">'+j.em+'</span><span class="jn">'+j.nm+'</span>';
    d.onclick=()=>{$("mascot").textContent=j.nm+": "+j.desc;};
    jr.appendChild(d);
  });
  if(!r.jokers.length){
    const d=document.createElement("div");
    d.id="jokerHint";d.textContent="— catalysts appear here · buy them in the shop —";
    jr.appendChild(d);
  }
  renderHand();
  renderButtons();
}
function renderHand(){
  const h=$("hand");h.innerHTML="";
  run.hand.forEach((c,i)=>{
    const d=document.createElement("div");
    d.className="cd"+(sel.includes(i)?" sel":"");
    d.innerHTML='<span class="chip">'+c.chip+'</span><span class="sym" style="color:'+c.col+'">'+c.id+'</span><span class="nm">'+c.nm+'</span>';
    d.onclick=()=>{
      if(busy)return;
      audio();
      if(sel.includes(i))sel=sel.filter(x=>x!==i);
      else if(sel.length<MAXPLAY){sel.push(i);tone(760,0.05,0.02);}
      renderHand();renderButtons();
    };
    h.appendChild(d);
  });
}
function renderButtons(){
  const banned=run.boss&&run.boss.ban&&sel.length
    &&evalPlay(sel.map(i=>run.hand[i])).comboId===run.boss.ban;
  $("playBtn").disabled=busy||!sel.length||run.hands<=0||!!banned;
  $("playBtn").textContent=banned?"BANNED BY BOSS":"PLAY"+(sel.length?" ("+sel.length+")":"");
  $("discBtn").disabled=busy||!sel.length||run.discs<=0;
  $("discBtn").textContent="SWAP"+(sel.length?" ("+sel.length+")":"")+(run.discs<=0?" ✖":"");
}
/* ---------- actions ---------- */
$("discBtn").onclick=()=>{
  if(busy||!sel.length||run.discs<=0)return;
  audio();tone(300,0.1,0.03);
  const picked=sel.slice().sort((a,b)=>b-a);
  picked.forEach(i=>{run.disc.push(run.hand.splice(i,1)[0]);});
  run.discs--;
  sel=[];
  drawTo();
  renderAll();
};
$("playBtn").onclick=async()=>{
  if(busy||!sel.length||run.hands<=0)return;
  audio();
  const cards=sel.map(i=>run.hand[i]);
  const ev=evalPlay(cards);
  if(run.boss&&run.boss.ban&&ev.comboId===run.boss.ban)return;
  busy=true;
  // move to play row
  const pr=$("playRow");pr.innerHTML="";
  const picked=sel.slice().sort((a,b)=>b-a);
  picked.forEach(i=>run.hand.splice(i,1));
  sel=[];
  renderHand();renderButtons();
  const els=cards.map(c=>{
    const d=document.createElement("div");
    d.className="cd played";
    d.innerHTML='<span class="chip">'+c.chip+'</span><span class="sym" style="color:'+c.col+'">'+c.id+'</span><span class="nm">'+c.nm+'</span>';
    pr.appendChild(d);
    return d;
  });
  // base ctx
  const ctx={cards,comboId:ev.comboId,chips:ev.chips,mult:ev.mult};
  // card chips count-up
  await wait(240);
  $("comboName").textContent=ev.name;
  $("comboName").classList.add("on");
  for(let i=0;i<cards.length;i++){
    ctx.chips+=cards[i].chip;
    els[i].classList.add("scoring");
    chipSnd(i);
    showCalc(ctx,false);
    await wait(210);
  }
  // boss modifier
  if(run.boss&&run.boss.mod){run.boss.mod(ctx);showCalc(ctx,false);}
  // jokers
  for(const j of run.jokers){
    if(!j.fx)continue;
    const b4c=ctx.chips,b4m=ctx.mult;
    j.fx(ctx);
    if(ctx.chips!==b4c||ctx.mult!==b4m){
      const el=document.querySelector('.jk[data-j="'+j.id+'"]');
      if(el){el.classList.remove("pulse");void el.offsetWidth;el.classList.add("pulse");}
      multSnd();
      showCalc(ctx,false);
      await wait(300);
    }
  }
  ctx.chips=Math.max(0,Math.round(ctx.chips));
  ctx.mult=Math.max(0.5,ctx.mult);
  const total=Math.round(ctx.chips*ctx.mult);
  showCalc(ctx,true,total);
  tone(980,0.3,0.05);
  run.score+=total;
  run.hands--;
  $("mascot").textContent=CONTENT.mascotName+": "+pick(ev.comboId?CONTENT.lines.good:CONTENT.lines.mix);
  await wait(820);
  run.disc.push(...cards);
  pr.innerHTML="";
  $("comboName").classList.remove("on");
  $("calcRow").classList.remove("on");
  drawTo();
  busy=false;
  if(run.score>=run.target)return blindWon();
  if(run.hands<=0)return runLost();
  renderAll();
};
function showCalc(ctx,final,total){
  const cr=$("calcRow");
  cr.innerHTML='<span class="c">'+Math.round(ctx.chips)+'</span> × <span class="m">'+(+ctx.mult.toFixed(1))+'</span>'+
    (final?' = <span class="t">'+total+'</span>':'');
  cr.classList.add("on");
  $("score").textContent=final?run.score+total:run.score;
  if(final)$("tgtFill").style.width=Math.min(100,(run.score+total)/run.target*100)+"%";
}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
/* ---------- blind won / shop ---------- */
function blindWon(){
  winSnd();
  const r=run;
  const base=r.bi===2?6:r.bi===1?5:4;
  const bonus=r.hands;
  const grant=r.jokers.filter(j=>j.cash).reduce((a,j)=>a+j.cash,0);
  const earned=base+bonus+grant;
  r.money+=earned;
  $("winTitle").textContent=(r.bi===2?"BOSS DOWN":"BLIND CLEARED");
  $("winSub").textContent=CONTENT.lines.win[0];
  $("cashRows").innerHTML=
    row("Blind reward","$"+base)+
    row("Unused plays","$"+bonus)+
    (grant?row("Grant money","$"+grant):"")+
    row("<b>Total</b>","<b>$"+earned+"</b>");
  $("winOv").classList.add("on");
  renderAll();
  function row(a,b){return '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:5px 2px;color:var(--tx)">'+
    '<span>'+a+'</span><span style="color:var(--gold)">'+b+'</span></div>';}
}
$("toShop").onclick=()=>{
  audio();
  $("winOv").classList.remove("on");
  openShop();
};
let shopStock=null;
function openShop(){
  shopStock={
    jokers:shuffle(CONTENT.jokers.filter(j=>!run.jokers.some(o=>o.id===j.id))).slice(0,2),
    pack:{cost:3},
  };
  $("shopTitle").textContent=CONTENT.shopName;
  renderShop();
  $("shopOv").classList.add("on");
}
function renderShop(){
  $("shopMoney").textContent="$"+run.money;
  const sj=$("shopJokers");sj.innerHTML="";
  shopStock.jokers.forEach(j=>{
    const d=document.createElement("div");
    d.className="shopItem"+(j.sold?" sold":"");
    d.innerHTML='<span class="se">'+j.em+'</span><span class="sn">'+j.nm+'</span>'+
      '<span class="sd">'+j.desc+'</span>';
    const b=document.createElement("button");
    b.textContent=j.sold?"SOLD":"$"+j.cost;
    b.disabled=j.sold||run.money<j.cost||run.jokers.length>=MAXJ;
    b.onclick=()=>{
      audio();buySnd();
      run.money-=j.cost;j.sold=true;
      run.jokers.push(j);
      renderShop();renderAll();
    };
    d.appendChild(b);
    sj.appendChild(d);
  });
  const sp=$("shopPacks");sp.innerHTML="";
  const d=document.createElement("div");
  d.className="shopItem"+(shopStock.pack.sold?" sold":"");
  d.innerHTML='<span class="se">'+CONTENT.packEm+'</span><span class="sn">'+CONTENT.packName+'</span>'+
    '<span class="sd">add 1 of 3 random cards to your deck</span>';
  const b=document.createElement("button");
  b.textContent=shopStock.pack.sold?"SOLD":"$"+shopStock.pack.cost;
  b.disabled=shopStock.pack.sold||run.money<shopStock.pack.cost;
  b.onclick=()=>{
    audio();buySnd();
    run.money-=shopStock.pack.cost;
    shopStock.pack.sold=true;
    renderShop();
    openPack();
  };
  d.appendChild(b);
  sp.appendChild(d);
}
function openPack(){
  const defs=CONTENT.deck;
  const opts=[];
  for(let i=0;i<3;i++){
    const id=pick(CONTENT.packCards);
    opts.push(defs.find(d2=>d2.id===id));
  }
  const pr=$("packRow");pr.innerHTML="";
  opts.forEach(def=>{
    const d=document.createElement("div");
    d.className="shopItem";
    d.innerHTML='<span class="se" style="color:'+def.col+';font-weight:700;font-family:inherit">'+def.id+'</span>'+
      '<span class="sn">'+def.nm+'</span><span class="sd">chip value '+def.chip+'</span>';
    const b=document.createElement("button");
    b.textContent="TAKE";
    b.onclick=()=>{
      audio();buySnd();
      run.deckBase.push({id:def.id,nm:def.nm,chip:def.chip,col:def.col});
      $("packOv").classList.remove("on");
    };
    d.appendChild(b);
    pr.appendChild(d);
  });
  $("packOv").classList.add("on");
}
$("packSkip").onclick=()=>{audio();$("packOv").classList.remove("on");};
$("shopGo").onclick=()=>{
  audio();
  $("shopOv").classList.remove("on");
  const r=run;
  r.bi++;
  if(r.bi>2){
    r.bi=0;r.ante++;
    if(r.ante>SV.bestAnte){SV.bestAnte=r.ante;save();}
    if(r.ante>8)return runWon();
  }
  startBlind();
};
/* ---------- lose / win run ---------- */
function runLost(){
  loseSnd();
  if(run.ante>SV.bestAnte){SV.bestAnte=run.ante;save();}
  $("loseTitle").textContent="RUN OVER";
  $("loseSub").textContent=pick(CONTENT.lines.lose);
  $("loseStats").innerHTML="reached ANTE "+run.ante+" · "+blindName(run.bi)+
    "<br>best ever: ANTE "+SV.bestAnte+(SV.wins?" · wins: "+SV.wins:"");
  $("loseOv").classList.add("on");
}
function runWon(){
  SV.wins++;save();
  winSnd();
  $("loseTitle").textContent="🏆 ANTE 8 CLEARED";
  $("loseSub").textContent="You beat the whole lab. The periodic table applauds.";
  $("loseStats").innerHTML="wins: "+SV.wins;
  $("loseOv").classList.add("on");
}
$("againBtn").onclick=()=>{audio();$("loseOv").classList.remove("on");startRun();};
/* ---------- book + splash ---------- */
$("bookBtn").onclick=()=>{
  audio();
  $("bookTitle").textContent="📖 THE COMBO BOOK";
  $("bookList").innerHTML=CONTENT.combos.map(cb=>
    '<div class="bookRow"><span class="f">'+cb.name+'</span>'+
    '<span class="v">'+cb.chips+' × '+cb.mult+'</span></div>'+
    '<div style="font-size:9.5px;color:var(--mut);padding:0 4px 4px">'+cb.book+'</div>').join("")+
    '<div class="bookRow"><span class="f">'+CONTENT.loneName+'</span><span class="v">4+card × 1</span></div>'+
    '<div class="bookRow"><span class="f">'+CONTENT.mixName+'</span><span class="v">cards × 1</span></div>';
  $("bookOv").classList.add("on");
};
$("bookX").onclick=()=>$("bookOv").classList.remove("on");
$("spEm").textContent=CONTENT.em;
$("spTitle").textContent=CONTENT.title;
$("spSub").textContent=CONTENT.sub;
$("spBlurb").innerHTML=CONTENT.blurb;
$("spStats").textContent=SV.runs?("best: ANTE "+SV.bestAnte+" · runs: "+SV.runs+(SV.wins?" · 🏆 "+SV.wins:"")):"first shift in the lab";
$("splashOv").classList.add("on");
$("spGo").onclick=()=>{
  audio();
  $("splashOv").classList.remove("on");
  startRun();
};
document.addEventListener("visibilitychange",()=>{
  try{if(!AC)return;document.hidden?AC.suspend():AC.resume();}catch(e){}
});
window.OC={
  get run(){return run;},get SV(){return SV;},get sel(){return sel;},get busy(){return busy;},
  evalPlay,startRun,startBlind,
  selectByIds(ids){
    sel=[];
    ids.forEach(id=>{
      const i=run.hand.findIndex((c,ix)=>c.id===id&&!sel.includes(ix));
      if(i>=0)sel.push(i);
    });
    renderHand();renderButtons();
    return sel.length===ids.length;
  },
  play(){$("playBtn").click();},
  swap(){$("discBtn").click();},
  addJoker(id){
    const j=CONTENT.jokers.find(x=>x.id===id);
    if(j&&!run.jokers.some(o=>o.id===id))run.jokers.push({...j});
    renderAll();
  },
  setScoreNearTarget(){run.score=run.target-1;renderAll();},
  get CONTENT(){return CONTENT;},
};
</script>
