<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Decawordle">
<meta name="theme-color" content="#121213">
<title>DECAWORDLE</title>
<meta name="description" content="Wordle, except the word has TEN letters. Breathe.">
<link rel="apple-touch-icon" href="/icons/deca-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23538d4e'/%3E%3Ctext x='8' y='12' font-size='9' font-weight='bold' fill='white' text-anchor='middle'%3E10%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
button{touch-action:manipulation;font-family:inherit}
html,body{position:fixed;inset:0;overflow:hidden;background:#121213;
  touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  font-family:"Quicksand",-apple-system,system-ui,sans-serif;color:#e8e8e8}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px)}
#top{display:flex;align-items:center;gap:8px;padding:2px 4px 8px;
  border-bottom:1px solid rgba(255,255,255,0.12)}
#top a,#top button{font-size:15px;font-weight:700;padding:7px 11px;border-radius:10px;
  border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.05);color:#e8e8e8;
  text-decoration:none}
#title{flex:1;text-align:center;font-weight:700;font-size:19px;letter-spacing:0.22em}
#title span{color:#538d4e}
#modeTag{text-align:center;font-size:9.5px;color:#888;letter-spacing:0.18em;font-weight:700;
  padding:6px 0 2px;text-transform:uppercase}
#toast{position:absolute;top:calc(env(safe-area-inset-top) + 70px);left:50%;
  transform:translateX(-50%);z-index:30;background:#e8e8e8;color:#121213;font-weight:700;
  font-size:13px;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity 0.2s;
  pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#board{flex:1;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;
  min-height:0;padding:6px 0}
.row{display:flex;gap:4px}
.tile{width:min(8.6vw,44px);height:min(8.6vw,44px);max-width:44px;
  border:2px solid #3a3a3c;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:min(4.6vw,22px);text-transform:uppercase;border-radius:4px;
  transition:transform 0.08s}
.tile.fill{border-color:#565758;animation:pop 0.09s ease}
@keyframes pop{50%{transform:scale(1.09)}}
.tile.g{background:#538d4e;border-color:#538d4e}
.tile.y{background:#b59f3b;border-color:#b59f3b}
.tile.x{background:#3a3a3c;border-color:#3a3a3c}
.tile.flip{animation:flip 0.45s ease}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.tile.hinted{box-shadow:inset 0 0 0 2px #ffd95e}
.row.shake{animation:shk 0.4s}
@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.row.dance .tile{animation:dance 0.5s ease}
@keyframes dance{40%{transform:translateY(-12px)}}
#kb{display:flex;flex-direction:column;gap:6px;padding:4px 0 2px}
.krow{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:40px;height:52px;border-radius:7px;border:none;background:#818384;
  color:#e8e8e8;font-weight:700;font-size:14px;text-transform:uppercase}
.key.wide{max-width:62px;flex:1.5;font-size:11px}
.key:active{transform:scale(0.92);filter:brightness(1.3)}
.key.g{background:#538d4e}.key.y{background:#b59f3b}.key.x{background:#2b2b2d;color:#777}
#hintBtn{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 64px);z-index:5;
  font-size:11px;font-weight:700;padding:8px 12px;border-radius:999px;
  border:1.5px solid rgba(255,217,94,0.5);background:rgba(255,217,94,0.08);color:#ffd95e}
#hintBtn:disabled{opacity:0.3}
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,10,11,0.82);display:none;
  align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.ovCard{background:#1c1c1e;border:1px solid rgba(255,255,255,0.14);border-radius:18px;
  padding:24px 20px;width:100%;max-width:380px;text-align:center;max-height:86vh;
  overflow-y:auto;touch-action:pan-y}
.ovCard h2{font-size:19px;letter-spacing:0.14em}
.ovCard .sub{font-size:11px;color:#999;font-weight:700;letter-spacing:0.1em;margin-top:5px;
  text-transform:uppercase}
.ovCard .word{font-size:23px;font-weight:700;letter-spacing:0.14em;color:#538d4e;
  margin:12px 0 4px;text-transform:uppercase}
.statRow{display:flex;justify-content:space-around;margin:14px 0 6px}
.statRow div{text-align:center}
.statRow b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.statRow span{font-size:9px;color:#999;font-weight:700;letter-spacing:0.08em;text-transform:uppercase}
.distRow{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:11px;font-weight:700}
.distRow .bar{height:16px;background:#538d4e;border-radius:3px;min-width:16px;
  display:flex;align-items:center;justify-content:flex-end;padding-right:5px;
  font-variant-numeric:tabular-nums}
.bigBtn{margin-top:14px;width:100%;padding:14px;border-radius:12px;border:none;
  font-size:14px;font-weight:700;background:#538d4e;color:#fff}
.bigBtn.alt{background:#2b2b2d;color:#e8e8e8}
.bigBtn:active{transform:scale(0.97)}
#quip{text-align:center;font-size:11px;color:#777;font-style:italic;padding:3px 0 1px;min-height:16px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a href="/">‹</a>
    <div id="title">DECAW<span>O</span>RDLE</div>
    <button id="statsBtn">📊</button>
    <button id="modeBtn">∞</button>
  </div>
  <div id="modeTag"></div>
  <div id="quip"></div>
  <button id="hintBtn">💡 HINT</button>
  <div id="board"></div>
  <div id="kb"></div>
  <div id="toast"></div>
</div>
<div class="ov" id="endOv"><div class="ovCard">
  <h2 id="endTitle"></h2>
  <div class="sub" id="endSub"></div>
  <div class="word" id="endWord"></div>
  <div id="endDef" style="font-size:11.5px;color:#999;line-height:1.5"></div>
  <div class="statRow" id="endStats"></div>
  <div id="endDist"></div>
  <button class="bigBtn" id="shareBtn">SHARE RESULT</button>
  <button class="bigBtn alt" id="endNext"></button>
</div></div>
<div class="ov" id="statsOv"><div class="ovCard">
  <h2>STATISTICS</h2>
  <div class="sub">daily mode</div>
  <div class="statRow" id="statsRow"></div>
  <div id="statsDist"></div>
  <button class="bigBtn alt" id="statsX">CLOSE</button>
</div></div>
<script src="words.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
["gesturestart","gesturechange","gestureend"].forEach(ev=>
  document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
let lastTouchEnd=0;
document.addEventListener("touchend",e=>{
  const now=Date.now();
  if(now-lastTouchEnd<320&&!e.target.closest("button,a"))e.preventDefault();
  lastTouchEnd=now;
},{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
const rnd=Math.random;
function mulberry(seed){let a2=seed>>>0;return function(){a2|=0;a2=a2+0x6D2B79F5|0;
  let t2=Math.imul(a2^a2>>>15,1|a2);t2=t2+Math.imul(t2^t2>>>7,61|t2)^t2;
  return((t2^t2>>>14)>>>0)/4294967296;};}
function pick(a){return a[(rnd()*a.length)|0];}

const LEN=10,ROWS=6;
const DICT=new Set(DICT_RAW.split(" "));
ANSWERS.forEach(w=>DICT.add(w));

/* ---------- save ---------- */
let SV={stats:{played:0,won:0,streak:0,maxStreak:0,dist:[0,0,0,0,0,0]},
  daily:null,pPlayed:0,pWon:0};
try{SV={...SV,...JSON.parse(localStorage.getItem("dw-save")||"{}")};}catch(e){}
function save(){try{localStorage.setItem("dw-save",JSON.stringify(SV));}catch(e){}}

/* ---------- audio ---------- */
let AC=null;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}}
function tone(f,d,v,del){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+(del||0);
  o.type="sine";o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(v||0.03,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+0.04);
}
function keySnd(){tone(700,0.04,0.015);}
function winSnd(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.35,0.035,i*0.07));}
function loseSnd(){tone(230,0.4,0.04);tone(190,0.5,0.04,0.16);}

/* ---------- daily ---------- */
function dayNum(){
  const epoch=new Date(2026,9,20);
  const now=new Date();
  const d1=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.max(1,Math.round((d1-epoch)/86400000)+1);
}
function dailyWord(n){
  const r=mulberry(0xDECA+n*7919);
  return ANSWERS[(r()*ANSWERS.length)|0];
}

const QUIPS=["the word has TEN letters. breathe.","ten letters. six tries. no pressure.",
  "somewhere in here is a whole word.","long words are just short words with commitment.",
  "you've read books. you know words. probably this one."];
const WINQ=[["GENIUS","first try?! checking you for hidden cameras."],
  ["MAGNIFICENT","two guesses. show-off."],["SPLENDID","three. properly impressive."],
  ["GREAT","four — solid wordsmithing."],["PHEW","five. heart rate: elevated."],
  ["CLUTCH","six. by a single whisker."]];

/* ---------- game state ---------- */
let mode="daily";      // daily | practice
let target="",guesses=[],cur="",done=false,wonAt=0,busy=false,hintUsed=false,hintPos=-1;
function newGame(m){
  mode=m;
  const n=dayNum();
  if(m==="daily"){
    if(SV.daily&&SV.daily.n===n){
      target=dailyWord(n);
      guesses=SV.daily.guesses.slice();
      done=SV.daily.done;
      wonAt=SV.daily.wonAt||0;
      hintUsed=!!SV.daily.hintUsed;
      hintPos=SV.daily.hintPos!==undefined?SV.daily.hintPos:-1;
    }else{
      target=dailyWord(n);
      guesses=[];done=false;wonAt=0;hintUsed=false;hintPos=-1;
      SV.daily={n,guesses:[],done:false,wonAt:0,hintUsed:false,hintPos:-1};
      save();
    }
  }else{
    target=pick(ANSWERS);
    guesses=[];done=false;wonAt=0;hintUsed=false;hintPos=-1;
  }
  cur="";busy=false;
  $("modeTag").textContent=m==="daily"?("DAILY #"+n):"PRACTICE · UNLIMITED";
  $("modeBtn").textContent=m==="daily"?"∞":"📅";
  $("quip").textContent=pick(QUIPS);
  $("hintBtn").disabled=hintUsed||done;
  buildBoard();buildKb();paintAll();
  if(done)setTimeout(()=>showEnd(wonAt>0),400);
}
/* ---------- scoring (NYT duplicate rules) ---------- */
function scoreGuess(guess,tgt){
  const res=new Array(LEN).fill("x");
  const counts={};
  for(let i=0;i<LEN;i++){
    if(guess[i]===tgt[i])res[i]="g";
    else counts[tgt[i]]=(counts[tgt[i]]||0)+1;
  }
  for(let i=0;i<LEN;i++){
    if(res[i]==="g")continue;
    if(counts[guess[i]]>0){res[i]="y";counts[guess[i]]--;}
  }
  return res;
}
/* ---------- board ---------- */
function buildBoard(){
  const b=$("board");b.innerHTML="";
  for(let r=0;r<ROWS;r++){
    const row=document.createElement("div");
    row.className="row";row.dataset.r=r;
    for(let c=0;c<LEN;c++){
      const t=document.createElement("div");
      t.className="tile";
      row.appendChild(t);
    }
    b.appendChild(row);
  }
}
function paintAll(){
  guesses.forEach((g,r)=>paintRow(r,g,scoreGuess(g,target),false));
  paintCur();
}
function paintRow(r,guess,res,animate){
  const row=document.querySelector('.row[data-r="'+r+'"]');
  [...row.children].forEach((t,i)=>{
    t.textContent=guess[i];
    if(animate){
      setTimeout(()=>{
        t.classList.add("flip");
        setTimeout(()=>{t.classList.add(res[i]);},220);
      },i*120);
    }else t.classList.add(res[i]);
  });
}
function paintCur(){
  if(done)return;
  const r=guesses.length;
  const row=document.querySelector('.row[data-r="'+r+'"]');
  if(!row)return;
  [...row.children].forEach((t,i)=>{
    t.textContent=cur[i]||"";
    t.classList.toggle("fill",!!cur[i]);
    t.classList.toggle("hinted",hintPos===i&&!cur[i]);
    if(hintPos===i&&!cur[i])t.textContent=target[i];
  });
}
/* ---------- keyboard ---------- */
const KROWS=["qwertyuiop","asdfghjkl","Xzxcvbnm⌫"];
function buildKb(){
  const kb=$("kb");kb.innerHTML="";
  KROWS.forEach(kr=>{
    const row=document.createElement("div");row.className="krow";
    [...kr].forEach(ch=>{
      const k=document.createElement("button");
      if(ch==="X"){k.className="key wide";k.textContent="ENTER";k.dataset.k="enter";}
      else if(ch==="⌫"){k.className="key wide";k.textContent="⌫";k.dataset.k="back";}
      else{k.className="key";k.textContent=ch;k.dataset.k=ch;}
      k.onclick=()=>{audio();press(k.dataset.k);};
      row.appendChild(k);
    });
    kb.appendChild(row);
  });
}
function paintKb(){
  const state={};
  guesses.forEach(g=>{
    const res=scoreGuess(g,target);
    for(let i=0;i<LEN;i++){
      const ch=g[i],s=res[i];
      if(s==="g")state[ch]="g";
      else if(s==="y"&&state[ch]!=="g")state[ch]="y";
      else if(!state[ch])state[ch]="x";
    }
  });
  document.querySelectorAll(".key").forEach(k=>{
    const ch=k.dataset.k;
    k.classList.remove("g","y","x");
    if(state[ch])k.classList.add(state[ch]);
  });
}
function press(k){
  if(done||busy)return;
  if(k==="enter")return submit();
  if(k==="back"){cur=cur.slice(0,-1);paintCur();return;}
  if(cur.length<LEN){cur+=k;keySnd();paintCur();}
}
document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="enter")press("enter");
  else if(k==="backspace")press("back");
  else if(/^[a-z]$/.test(k))press(k);
});
/* ---------- submit ---------- */
function toast(msg,ms){
  $("toast").textContent=msg;
  $("toast").classList.add("on");
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>$("toast").classList.remove("on"),ms||1400);
}
function submit(){
  if(cur.length<LEN)return shakeRow("not enough letters");
  if(!DICT.has(cur))return shakeRow("not in word list");
  busy=true;
  const guess=cur;
  const res=scoreGuess(guess,target);
  guesses.push(guess);
  cur="";
  paintRow(guesses.length-1,guess,res,true);
  res.forEach((s,i)=>{if(s!=="x")tone(s==="g"?880:660,0.08,0.02,i*0.12);});
  setTimeout(()=>{
    paintKb();
    busy=false;
    const won=guess===target;
    if(won||guesses.length>=ROWS){
      done=true;
      wonAt=won?guesses.length:0;
      if(mode==="daily"){
        SV.daily.guesses=guesses;SV.daily.done=true;SV.daily.wonAt=wonAt;
        SV.stats.played++;
        if(won){
          SV.stats.won++;SV.stats.streak++;
          SV.stats.maxStreak=Math.max(SV.stats.maxStreak,SV.stats.streak);
          SV.stats.dist[guesses.length-1]++;
        }else SV.stats.streak=0;
        save();
      }else{
        SV.pPlayed++;if(won)SV.pWon++;save();
      }
      if(won){
        winSnd();
        const row=document.querySelector('.row[data-r="'+(guesses.length-1)+'"]');
        row.classList.add("dance");
        setTimeout(()=>showEnd(true),900);
      }else{
        loseSnd();
        setTimeout(()=>showEnd(false),500);
      }
    }else{
      paintCur();
      if(mode==="daily"){SV.daily.guesses=guesses;save();}
    }
  },LEN*120+350);
}
function shakeRow(msg){
  toast(msg);
  tone(200,0.15,0.03);
  const row=document.querySelector('.row[data-r="'+guesses.length+'"]');
  if(row){row.classList.remove("shake");void row.offsetWidth;row.classList.add("shake");}
}
/* ---------- hint ---------- */
$("hintBtn").onclick=()=>{
  if(hintUsed||done)return;
  audio();
  const known=new Set();
  guesses.forEach(g=>{
    scoreGuess(g,target).forEach((s,i)=>{if(s==="g")known.add(i);});
  });
  const open=[];
  for(let i=0;i<LEN;i++)if(!known.has(i))open.push(i);
  if(!open.length)return;
  hintPos=pick(open);
  hintUsed=true;
  if(mode==="daily"){SV.daily.hintUsed=true;SV.daily.hintPos=hintPos;save();}
  $("hintBtn").disabled=true;
  toast("letter "+(hintPos+1)+" is “"+target[hintPos].toUpperCase()+"”");
  tone(980,0.2,0.04);
  paintCur();
};
/* ---------- end + stats ---------- */
function emojiGrid(){
  return guesses.map(g=>scoreGuess(g,target).map(s=>s==="g"?"🟩":s==="y"?"🟨":"⬛").join("")).join("\n");
}
function showEnd(won){
  const w=WINQ[Math.max(0,(wonAt||6)-1)];
  $("endTitle").textContent=won?w[0]:"SO CLOSE";
  $("endSub").textContent=won?w[1]:"the word escaped. this time.";
  $("endWord").textContent=target;
  $("endDef").textContent=won?"":"six tries, ten letters — the math was never fair.";
  const s=SV.stats;
  $("endStats").innerHTML=mode==="daily"?statCells(s):
    '<div><b>'+SV.pWon+'</b><span>practice wins</span></div><div><b>'+SV.pPlayed+'</b><span>played</span></div>';
  $("endDist").innerHTML=mode==="daily"?distBars(s):"";
  $("endNext").textContent=mode==="daily"?"PRACTICE A RANDOM WORD ∞":"ANOTHER ONE ➜";
  $("endOv").classList.add("on");
}
function statCells(s){
  const pct=s.played?Math.round(s.won/s.played*100):0;
  return '<div><b>'+s.played+'</b><span>played</span></div>'+
    '<div><b>'+pct+'%</b><span>win rate</span></div>'+
    '<div><b>'+s.streak+'</b><span>streak</span></div>'+
    '<div><b>'+s.maxStreak+'</b><span>best</span></div>';
}
function distBars(s){
  const mx=Math.max(1,...s.dist);
  return s.dist.map((n,i)=>'<div class="distRow"><span>'+(i+1)+'</span>'+
    '<div class="bar" style="width:'+Math.round(n/mx*88)+'%'+
    (wonAt===i+1?';background:#b59f3b':'')+'">'+n+'</div></div>').join("");
}
$("shareBtn").onclick=async()=>{
  audio();
  const n=dayNum();
  const head=mode==="daily"
    ?"DECAWORDLE #"+n+" "+(wonAt||"X")+"/6"+(hintUsed?" 💡":"")
    :"DECAWORDLE practice "+(wonAt||"X")+"/6"+(hintUsed?" 💡":"");
  const txt=head+"\n"+emojiGrid()+"\ntaskiap.com/decawordle/";
  try{
    if(navigator.share)await navigator.share({text:txt});
    else{await navigator.clipboard.writeText(txt);toast("copied to clipboard");}
  }catch(e){
    try{await navigator.clipboard.writeText(txt);toast("copied to clipboard");}catch(e2){}
  }
};
$("endNext").onclick=()=>{
  audio();
  $("endOv").classList.remove("on");
  newGame("practice");
};
$("statsBtn").onclick=()=>{
  audio();
  $("statsRow").innerHTML=statCells(SV.stats);
  $("statsDist").innerHTML=distBars(SV.stats);
  $("statsOv").classList.add("on");
};
$("statsX").onclick=()=>$("statsOv").classList.remove("on");
$("modeBtn").onclick=()=>{
  audio();
  $("endOv").classList.remove("on");
  newGame(mode==="daily"?"practice":"daily");
};
newGame("daily");
document.addEventListener("visibilitychange",()=>{
  try{if(!AC)return;document.hidden?AC.suspend():AC.resume();}catch(e){}
});
window.DW={
  get target(){return target;},get guesses(){return guesses;},get mode(){return mode;},
  get done(){return done;},get wonAt(){return wonAt;},get SV(){return SV;},
  get hintPos(){return hintPos;},
  scoreGuess,dailyWord,dayNum,newGame,emojiGrid,
  type(w){cur="";w.toLowerCase().split("").forEach(ch=>press(ch));},
  enter(){press("enter");},
  get cur(){return cur;},
  get DICTSIZE(){return DICT.size;},
  hasWord(w){return DICT.has(w);},
};
</script>
