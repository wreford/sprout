<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10243e">
<meta name="description" content="Let's Go to the Freakin' Beach — a serious business presentation for L-kid and K-kid.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2310243e'/%3E%3Ccircle cx='22' cy='10' r='6' fill='%23f6c94a'/%3E%3Cpath d='M0 24q8-6 16-1t16-1v10H0z' fill='%234fc3f7'/%3E%3C/svg%3E">
<title>Let's Go to the Freakin' Beach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#10243e; --navy-2:#183253; --paper:#f7f4ec; --ink:#12233a;
  --sun:#f6c94a; --sea:#4fc3f7; --coral:#ff6b6b; --palm:#57b06b; --sand:#eed9a4;
  --disp:'Sora',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--navy);color:var(--paper);font-family:var(--disp);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#comp{
  position:relative;overflow:hidden;background:var(--paper);color:var(--ink);
  width:min(100vw, calc((100vh - 92px) * 16 / 9));aspect-ratio:16/9;
  border-radius:14px;box-shadow:0 40px 90px -30px rgba(0,0,0,.8)
}
.el{position:absolute;will-change:transform,opacity}
.kick{font-family:var(--mono);font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.stamp{
  font-family:var(--mono);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  border:3px solid currentColor;border-radius:8px;padding:.35em .7em
}
.bar-h{border-radius:6px}
/* controls */
#bar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);
  display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(0deg,rgba(9,18,32,.92),transparent)
}
#scrub{position:relative;height:22px;cursor:pointer}
#scrub .track{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:rgba(247,244,236,.2)}
#scrub .fill{position:absolute;left:0;top:9px;height:4px;border-radius:4px;background:var(--sun);width:0}
#scrub .mark{position:absolute;top:7px;width:2px;height:8px;background:rgba(247,244,236,.5)}
#scrub .knob{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:var(--sun);box-shadow:0 2px 8px rgba(0,0,0,.5);margin-left:-8px}
#bar .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#bar .btns{display:flex;gap:8px}
#bar button{
  min-width:44px;height:40px;padding:0 16px;border-radius:100px;cursor:pointer;
  background:rgba(247,244,236,.1);border:1.5px solid rgba(247,244,236,.25);color:var(--paper);
  font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase
}
#bar button:hover{border-color:var(--sun);color:var(--sun)}
#bar button.play{background:var(--sun);color:var(--navy);border-color:transparent;min-width:84px}
#bar .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:rgba(247,244,236,.6);font-weight:700;text-transform:uppercase;text-align:right}
#tapstart{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:rgba(9,18,32,.85);backdrop-filter:blur(8px);cursor:pointer;text-align:center;padding:24px
}
#tapstart.hide{display:none}
#tapstart .k{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--sun);font-weight:800;text-transform:uppercase}
#tapstart h1{font-size:clamp(30px,7vw,54px);font-weight:900;letter-spacing:-.02em;line-height:1;text-transform:uppercase;color:var(--paper)}
#tapstart h1 .y{color:var(--sun)} #tapstart h1 .b{color:var(--sea)}
#tapstart .big{
  padding:18px 36px;border-radius:14px;background:var(--sun);color:var(--navy);border:none;cursor:pointer;
  font-family:var(--disp);font-weight:900;font-size:16px;letter-spacing:.05em;text-transform:uppercase;min-height:58px;
  box-shadow:0 18px 40px -10px rgba(246,201,74,.5)
}
#tapstart .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:rgba(247,244,236,.55);font-weight:700;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage"><div id="comp"></div></div>

<div id="bar">
  <div id="scrub"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
  <div class="row">
    <div class="btns">
      <button id="bPrev" title="Previous scene">Prev</button>
      <button id="bPlay" class="play">Pause</button>
      <button id="bNext" title="Next scene">Next</button>
      <button id="bMusic" title="Music on/off">Music: On</button>
    </div>
    <div class="lbl" id="sceneLbl"></div>
  </div>
</div>

<div id="tapstart">
  <span class="k">A serious business presentation</span>
  <h1>Let's go to the<br><span class="b">freakin'</span> <span class="y">beach</span></h1>
  <button class="big">Play deck</button>
  <span class="sub">Prepared for stakeholders L-kid + K-kid · Space pauses · Arrows skip</span>
</div>

<script>
'use strict';
/* ============================================================
   Remotion-style composition engine, one file.
   A global 30 fps frame clock drives every element through
   interpolate() + spring() — scrub the timeline and the whole
   deck re-renders deterministically at that frame, exactly
   like a Remotion player.
   ============================================================ */
const FPS = 30;
const comp = document.getElementById('comp');

/* ---------- animation math ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function interp(f, [f0, f1], [v0, v1], ease){
  const t = clamp((f - f0) / (f1 - f0), 0, 1);
  return v0 + (v1 - v0) * (ease ? ease(t) : t);
}
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn  = t => t * t * t;
/* damped spring with overshoot · Remotion's spring() vibe */
function spring(f, delay = 0, stiffness = .55){
  const t = clamp((f - delay) / (FPS * .9), 0, 1);
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  return 1 - Math.pow(1 - t, 2) * Math.cos(t * Math.PI * 2.2 * stiffness) ;
}
const pop = (f, d) => `scale(${spring(f, d)})`;
const slamY = (f, d, from = -300) => `translateY(${interp(spring(f, d), [0, 1], [from, 0])}px)`;
const slamX = (f, d, from = -600) => `translateX(${interp(spring(f, d), [0, 1], [from, 0])}px)`;
const fade = (f, a, b) => clamp(interp(f, [a, b], [0, 1]), 0, 1);

/* ---------- scene helpers (all sizes in composition %) ---------- */
function el(html, style){
  return `<div class="el" style="${style}">${html}</div>`;
}
const S = (obj) => Object.entries(obj).map(([k, v]) => `${k}:${v}`).join(';');

/* seagull path svg */
const GULL = `<svg viewBox="0 0 60 30" width="100%"><path d="M2 18 Q14 4 30 16 Q46 4 58 18" fill="none" stroke="#12233a" stroke-width="4" stroke-linecap="round"/></svg>`;
const CUP = `<svg viewBox="0 0 100 130" width="100%">
  <path d="M18 30 h64 l-9 92 a8 8 0 0 1-8 7 h-30 a8 8 0 0 1-8-7 z" fill="#fff" stroke="#12233a" stroke-width="5"/>
  <rect x="10" y="16" width="80" height="16" rx="6" fill="#12233a"/>
  <circle cx="50" cy="76" r="20" fill="#0a5c3c"/>
  <circle cx="50" cy="76" r="13" fill="none" stroke="#fff" stroke-width="3.5"/>
  <path d="M43 70 q7 12 14 0 q-7 16 -14 0" fill="#fff"/>
</svg>`;
const HAND = `<svg viewBox="0 0 100 110" width="100%">
  <path d="M30 105 V55 q0-8-7-8t-7 8v14 M30 60 V22 q0-8 7-8t7 8v34 M44 56 V14 q0-8 7-8t7 8v42 M58 58 V20 q0-8 7-8t7 8v44 q14 6 12 22 l-4 24" fill="none" stroke="#12233a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

/* confetti precomputed */
const CONF = Array.from({ length: 60 }, (_, i) => ({
  x: (i * 137.5) % 100, delay: (i * 7) % 40,
  hue: ['#f6c94a', '#4fc3f7', '#ff6b6b', '#57b06b'][i % 4],
  spin: (i % 2 ? 1 : -1) * (180 + i * 13 % 240), drift: ((i * 31) % 40) - 20
}));

/* ============================================================
   SCENES · each = { dur (frames), name, render(f) -> html }
   ============================================================ */
const SCENES = [

/* 1 · TITLE */
{ dur: 150, name: 'Title', render(f){
  const sun = interp(f, [0, 60], [120, 34], easeOut);
  return el('', S({ inset: 0, background: 'linear-gradient(180deg,#bfe6f7 0 62%, #eed9a4 62% 100%)' }))
  + el('', S({ left: '72%', top: sun + '%', width: '13%', 'aspect-ratio': '1', 'border-radius': '50%', background: 'var(--sun)', 'box-shadow': '0 0 60px rgba(246,201,74,.85)' }))
  + el(GULL, S({ left: interp(f, [20, 150], [-12, 105]) + '%', top: '14%', width: '6%' }))
  + el(GULL, S({ left: interp(f, [40, 150], [-20, 100]) + '%', top: '22%', width: '4%' }))
  + el(`<div class="kick" style="font-size:1.6vmax;color:#0a5c3c">Q3 FAMILY INITIATIVE · MANDATORY FUN</div>`,
      S({ left: '7%', top: '16%', opacity: fade(f, 5, 20), transform: slamX(f, 5, -400) }))
  + el(`<div style="font-weight:900;font-size:6vmax;line-height:.95;letter-spacing:-.03em;text-transform:uppercase">Let's go<br>to the <span style="color:#e0483e">freakin'</span><br><span style="color:#0b79bf">beach.</span></div>`,
      S({ left: '7%', top: '26%', transform: slamY(f, 15, 500) + ' rotate(' + interp(spring(f, 15), [0, 1], [-6, 0]) + 'deg)' }))
  + el(`<div class="stamp" style="font-size:1.3vmax;color:#e0483e;transform:rotate(-10deg)">CONFIDENTIAL-ISH</div>`,
      S({ right: '7%', top: '12%', transform: pop(f, 55) + ' rotate(-10deg)', opacity: f > 55 ? 1 : 0 }))
  + el(`<div class="kick" style="font-size:1.1vmax;color:#12233a99">PREPARED FOR: L-KID (VP OF SNACKS) &nbsp;+&nbsp; K-KID (CHIEF VIBES OFFICER)</div>`,
      S({ left: '7%', bottom: '9%', opacity: fade(f, 75, 95) }));
}},

/* 2 · AGENDA */
{ dur: 200, name: 'Agenda', render(f){
  const rows = [
    ['01', 'Starbucks', 'caffeine synergy · slurpee option'],
    ['02', 'Bulk Barn', 'chudworthy loot acquisition'],
    ['03', 'Goodwill', 'fashion R&amp;D division'],
    ['04', 'The actual beach', 'core deliverable'],
    ['05', 'Sushi + shawarma', 'way-back procurement'],
    ['06', 'Grip tanning', 'key performance indicator'],
    ['07', 'Couch potato mode', 'Malcolm in the Middle marathon'],
  ];
  return el(`<div class="kick" style="font-size:1.4vmax;color:#0b79bf">AGENDA · NON-NEGOTIABLE</div>`,
      S({ left: '7%', top: '8%', transform: slamX(f, 0) }))
  + el(`<div style="font-weight:900;font-size:3.2vmax;text-transform:uppercase;letter-spacing:-.02em">The plan<span style="color:#e0483e">.</span></div>`,
      S({ left: '7%', top: '13%', transform: slamX(f, 6) }))
  + rows.map((r, i) => el(
      `<div style="display:flex;align-items:baseline;gap:1.4vmax;border-bottom:2px solid #12233a22;padding-bottom:.45vmax">
        <span class="kick" style="font-size:1.3vmax;color:#e0483e">${r[0]}</span>
        <span style="font-weight:900;font-size:1.9vmax;text-transform:uppercase">${r[1]}</span>
        <span class="kick" style="font-size:.95vmax;color:#12233a88;margin-left:auto">${r[2]}</span>
      </div>`,
      S({ left: '7%', right: '7%', top: (23 + i * 10) + '%', transform: slamX(f, 18 + i * 9, 900), opacity: f > 18 + i * 9 ? 1 : 0 })
    )).join('');
}},

/* 3 · STARBUCKS */
{ dur: 210, name: 'Phase 1 · Starbucks', render(f){
  const barH = interp(f, [60, 110], [0, 100], easeOut);
  return el(`<div class="kick" style="font-size:1.4vmax;color:#0a5c3c">PHASE 1 · CAFFEINE SYNERGY</div>`,
      S({ left: '7%', top: '10%', transform: slamX(f, 0) }))
  + el(`<div style="font-weight:900;font-size:4vmax;text-transform:uppercase;letter-spacing:-.02em;line-height:.95">We will get<br><span style="color:#0a5c3c">Starbucks.</span></div>`,
      S({ left: '7%', top: '17%', transform: slamY(f, 8, 300) }))
  + el(`<div style="font-size:1.5vmax;font-weight:700;color:#12233a;max-width:34vmax;line-height:1.5">Nobody drives to a beach uncaffeinated. That's how mistakes happen. This is a <b>safety expenditure</b>.</div>`,
      S({ left: '7%', top: '46%', opacity: fade(f, 30, 50) }))
  + el(CUP, S({ right: '10%', top: '14%', width: '17%', transform: pop(f, 20) + ` rotate(${Math.sin(f / 9) * 3}deg)` }))
  /* morale chart */
  + el(`<div class="kick" style="font-size:1vmax;color:#12233a88">FIG 1 · MORALE</div>`, S({ left: '7%', bottom: '30%', opacity: fade(f, 55, 65) }))
  + el(`<div class="bar-h" style="width:9vmax;background:#12233a33;height:2.2vmax"></div>`, S({ left: '7%', bottom: '22%', opacity: fade(f, 55, 65) }))
  + el(`<div class="bar-h" style="width:${9 * barH / 100 * 3.2}vmax;background:#0a5c3c;height:2.2vmax"></div>`, S({ left: '7%', bottom: '14%' }))
  + el(`<div class="kick" style="font-size:1vmax;color:#12233a88">BEFORE</div>`, S({ left: '17%', bottom: '22.5%', opacity: fade(f, 55, 65) }))
  + el(`<div class="kick" style="font-size:1.15vmax;color:#0a5c3c">AFTER · +${Math.round(barH * 2)}%</div>`, S({ left: '38%', bottom: '14.5%', opacity: fade(f, 80, 95) }))
  /* slurpee stretch goal — cup slides in late with a straw wobble */
  + el(`<svg viewBox="0 0 80 110" width="100%">
      <path d="M20 34 h40 l-6 68 a6 6 0 0 1-6 5 h-16 a6 6 0 0 1-6-5 z" fill="#c9e9fb" stroke="#12233a" stroke-width="4"/>
      <path d="M22 52 h36 l-2 22 h-32 z" fill="#e0483e" opacity=".8"/>
      <path d="M24 76 h32 l-2 20 h-28 z" fill="#0b79bf" opacity=".8"/>
      <ellipse cx="40" cy="34" rx="22" ry="8" fill="#fff" stroke="#12233a" stroke-width="4"/>
      <path d="M46 30 L58 4" stroke="#e0483e" stroke-width="6" stroke-linecap="round"/>
    </svg>`,
    S({ right: '28%', top: '18%', width: '9%', transform: slamY(f, 105, -400) + ` rotate(${Math.sin(f / 7) * 5}deg)`, opacity: f > 105 ? 1 : 0 }))
  + el(`<div class="stamp" style="font-size:1vmax;color:#0b79bf;background:#f7f4ec">STRETCH GOAL: SLURPEES</div>`,
      S({ right: '22%', top: '48%', transform: pop(f, 125) + ' rotate(6deg)', opacity: f > 125 ? 1 : 0 }))
  + el(`<div class="kick" style="font-size:.85vmax;color:#12233a66">PENDING BOARD APPROVAL · BRAIN-FREEZE RISK: ACCEPTED</div>`,
      S({ right: '13%', top: '56%', opacity: fade(f, 140, 155) }));
}},

/* 4 · BULK BARN */
{ dur: 190, name: 'Phase 2 · Bulk Barn', render(f){
  const n = Math.round(interp(f, [40, 120], [0, 9999], easeOut));
  const drops = Array.from({ length: 16 }, (_, i) => {
    const d = 30 + i * 6;
    const y = interp(f, [d, d + 46], [-12, 108], easeIn);
    const hue = ['#e0483e', '#f6c94a', '#57b06b', '#0b79bf', '#c084fc'][i % 5];
    return el('', S({ left: (6 + (i * 29) % 88) + '%', top: y + '%', width: '3%', 'aspect-ratio': '1',
      'border-radius': i % 3 ? '50%' : '22%', background: hue, transform: `rotate(${f * (4 + i % 5)}deg)`, opacity: f > d ? 1 : 0 }));
  }).join('');
  return drops
  + el(`<div class="kick" style="font-size:1.4vmax;color:#7a3fb0">PHASE 2 · SKILL ISSUE? NEVER HEARD OF IT</div>`,
      S({ left: '7%', top: '10%', transform: slamX(f, 0) }))
  + el(`<div style="font-weight:900;font-size:3.8vmax;text-transform:uppercase;letter-spacing:-.02em;line-height:.95">Max our <span style="color:#7a3fb0">chud skills.</span><br>Acquire <span style="color:#e0483e">chudworthy loot.</span></div>`,
      S({ left: '7%', top: '17%', transform: slamY(f, 8, 300) }))
  + el(`<div class="stamp" style="font-size:1.4vmax;color:#7a3fb0">SOURCE: BULK BARN</div>`,
      S({ left: '7%', top: '44%', transform: pop(f, 30) + ' rotate(-4deg)', opacity: f > 30 ? 1 : 0 }))
  + el(`<div style="font-family:var(--mono);font-weight:800;font-size:5vmax;color:#12233a">${n.toLocaleString()}</div>
        <div class="kick" style="font-size:1vmax;color:#12233a88">APPROX. GUMMIES PER BAG (UNAUDITED)</div>`,
      S({ left: '7%', bottom: '14%', opacity: fade(f, 40, 55) }))
  + el(`<div style="font-size:1.4vmax;font-weight:700;color:#12233a;max-width:26vmax;line-height:1.5;text-align:right">The scoop is a <b>skill</b>. The bag is a <b>portfolio</b>. Diversify: sour, fizzy, regrettable.</div>`,
      S({ right: '7%', bottom: '14%', opacity: fade(f, 70, 90) }));
}},

/* 4b · SNACK POLICY */
{ dur: 190, name: 'Snack policy', render(f){
  const carrotShake = f > 60 && f < 90 ? Math.sin(f * 2.2) * 5 : 0;
  return el(`<div class="kick" style="font-size:1.4vmax;color:#6b4226">OFFICIAL SNACK POLICY · v2 · FINAL (REALLY)</div>`,
      S({ left: '7%', top: '10%', transform: slamX(f, 0) }))
  + el(`<div style="font-weight:900;font-size:3.8vmax;text-transform:uppercase;letter-spacing:-.02em">Chocolate<span style="color:#0a5c3c">: approved.</span></div>`,
      S({ left: '7%', top: '17%', transform: slamY(f, 8, 300) }))
  /* chocolate bar with breaking squares */
  + el(`<svg viewBox="0 0 120 74" width="100%">
      <rect x="2" y="2" width="116" height="70" rx="7" fill="#5a3620" stroke="#3a2113" stroke-width="4"/>
      ${[0,1,2,3].map(c => [0,1].map(r =>
        `<rect x="${8 + c * 27.5}" y="${8 + r * 31}" width="24" height="27" rx="4" fill="#6b4226" stroke="#3a2113" stroke-width="2"/>`
      ).join('')).join('')}
    </svg>`,
    S({ left: '7%', top: '32%', width: '24%', transform: pop(f, 20) + ` rotate(${interp(spring(f, 20), [0, 1], [-9, -3])}deg)` }))
  /* one square breaks off and tumbles */
  + el(`<svg viewBox="0 0 30 30" width="100%"><rect x="2" y="2" width="26" height="26" rx="4" fill="#6b4226" stroke="#3a2113" stroke-width="2.5"/></svg>`,
    S({ left: interp(f, [70, 130], [26, 34], easeOut) + '%', top: interp(f, [70, 130], [42, 78], easeIn) + '%', width: '4.5%',
        transform: `rotate(${interp(f, [70, 130], [0, 260])}deg)`, opacity: f > 70 ? fade(f, 70, 72) : 0 }))
  /* carrot · denied */
  + el(`<svg viewBox="0 0 60 120" width="100%">
      <path d="M30 116 L14 34 h32 z" fill="#e8843c" stroke="#b35f1e" stroke-width="4"/>
      <path d="M22 30 q-8-16 2-24 M30 30 q0-18 0-26 M38 30 q8-16 -2-24" stroke="#57b06b" stroke-width="6" fill="none" stroke-linecap="round"/>
    </svg>`,
    S({ right: '20%', top: '24%', width: '8%', transform: pop(f, 40) + ` rotate(${carrotShake}deg)` }))
  + el(`<svg viewBox="0 0 100 100" width="100%">
      <line x1="12" y1="12" x2="88" y2="88" stroke="#e0483e" stroke-width="13" stroke-linecap="round"/>
      <line x1="88" y1="12" x2="12" y2="88" stroke="#e0483e" stroke-width="13" stroke-linecap="round"/>
    </svg>`,
    S({ right: '17.5%', top: '26%', width: '13%', transform: pop(f, 62), opacity: f > 62 ? 1 : 0 }))
  + el(`<div class="stamp" style="font-size:1.7vmax;color:#e0483e;background:#f7f4ec">NOT FKIN' CARROTS.</div>`,
      S({ right: '8%', top: '62%', transform: pop(f, 85) + ' rotate(-7deg)', opacity: f > 85 ? 1 : 0 }))
  + el(`<div style="font-size:1.3vmax;font-weight:700;color:#12233a;max-width:30vmax;line-height:1.5">Vegetables are a weekday product. The beach runs on <b>cocoa-based morale infrastructure</b>. This is settled policy.</div>`,
      S({ left: '7%', bottom: '10%', opacity: fade(f, 110, 130) }));
}},

/* 4c · GOODWILL FASHION R&D */
{ dur: 210, name: 'Phase 2.5 · Goodwill', render(f){
  const cutX = interp(f, [60, 120], [0, 100], easeOut);       // scissor progress along the sleeve
  const sleeveGone = f > 118;

/* ============================================================
   PLAYER
   ============================================================ */
const TOTAL = SCENES.reduce((s, sc) => s + sc.dur, 0);
let frame = 0, playing = false, rafLast = 0;
function sceneAt(gf){
  let acc = 0;
  for (let i = 0; i < SCENES.length; i++){
    if (gf < acc + SCENES[i].dur) return { i, local: gf - acc, start: acc };
    acc += SCENES[i].dur;
  }
  return { i: SCENES.length - 1, local: SCENES[SCENES.length - 1].dur - 1, start: TOTAL - SCENES[SCENES.length - 1].dur };
}
function render(){
  const { i, local } = sceneAt(frame);
  comp.innerHTML = SCENES[i].render(local);
  document.getElementById('sceneLbl').textContent = `${i + 1} / ${SCENES.length} · ${SCENES[i].name}`;
  const p = frame / TOTAL;
  document.querySelector('#scrub .fill').style.width = (p * 100) + '%';
  document.querySelector('#scrub .knob').style.left = (p * 100) + '%';
}
function tick(ts){
  requestAnimationFrame(tick);
  if (!playing) return;
  if (!rafLast) rafLast = ts;
  const adv = (ts - rafLast) / (1000 / FPS);
  if (adv >= 1){
    frame = Math.min(TOTAL - 1, frame + Math.round(adv));
    rafLast = ts;
    if (frame >= TOTAL - 1){ playing = false; updatePlayBtn(); if (typeof Music !== 'undefined') Music.stop(); }
    render();
  }
}
requestAnimationFrame(tick);

function updatePlayBtn(){ document.getElementById('bPlay').textContent = playing ? 'Pause' : (frame >= TOTAL - 1 ? 'Replay' : 'Play'); }
function playPause(){
  if (frame >= TOTAL - 1 && !playing) frame = 0;
  playing = !playing; rafLast = 0;
  updatePlayBtn();
  if (typeof Music !== 'undefined'){ playing ? Music.start() : Music.stop(); }
}
document.getElementById('bPlay').addEventListener('click', playPause);
document.getElementById('bPrev').addEventListener('click', () => {
  const { i, start } = sceneAt(frame);
  frame = frame - start > FPS ? start : (i > 0 ? sceneAt(start - 1).start : 0);
  render();
});
document.getElementById('bNext').addEventListener('click', () => {
  const { i, start } = sceneAt(frame);
  frame = i < SCENES.length - 1 ? start + SCENES[i].dur : TOTAL - 1;
  render();
});
addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); playPause(); }
  if (e.code === 'ArrowLeft') document.getElementById('bPrev').click();
  if (e.code === 'ArrowRight') document.getElementById('bNext').click();
});

/* scrubber */
const scrub = document.getElementById('scrub');
let marks = '';
let acc = 0;
for (const sc of SCENES.slice(0, -1)){ acc += sc.dur; marks += `<div class="mark" style="left:${acc / TOTAL * 100}%"></div>`; }
scrub.insertAdjacentHTML('beforeend', marks);
function scrubTo(clientX){
  const r = scrub.getBoundingClientRect();
  frame = Math.round(clamp((clientX - r.left) / r.width, 0, 1) * (TOTAL - 1));
  render();
}
let scrubbing = false;
scrub.addEventListener('pointerdown', e => { scrubbing = true; playing = false; updatePlayBtn(); scrubTo(e.clientX); });
addEventListener('pointermove', e => { if (scrubbing) scrubTo(e.clientX); });
addEventListener('pointerup', () => scrubbing = false);

/* ============================================================
   MUSIC · original 16-bit-style driving loop (Road Rash spirit)
   Genesis-ish: detuned saw lead, square bass, noise drums.
   Look-ahead step sequencer at 148 BPM, 8-bar loop.
   ============================================================ */
const Music = (() => {
  let ctx = null, master = null, timer = null, step = 0, nextT = 0;
  let enabled = true;
  const BPM = 148, SPB = 60 / BPM / 2;      // eighth-note step length
  const N = (name) => {                      // note name → Hz
    const m = /^([A-G]#?)(\d)$/.exec(name);
    const idx = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'].indexOf(m[1]);
    return 440 * Math.pow(2, (idx - 9) / 12 + (m[2] - 4));
  };
  /* 64-step (8-bar) patterns · '' = rest */
  const BASS = [
    'E2','E2','E2','E2','E2','E2','G2','A2',  'E2','E2','E2','E2','D2','D2','B1','B1',
    'E2','E2','E2','E2','E2','E2','G2','A2',  'C3','C3','B2','B2','A2','A2','G2','A2',
    'E2','E2','E2','E2','E2','E2','G2','A2',  'E2','E2','E2','E2','D2','D2','B1','B1',
    'C3','C3','C3','C3','D3','D3','D3','D3',  'E3','E3','D3','B2','A2','G2','A2','B2',
  ];
  const LEAD = [
    '','','','','','','','',                  '','','','','','','','',
    'E4','','G4','E4','A4','','G4','E4',      'D4','','E4','','','','','',
    'E4','','G4','E4','A4','','B4','A4',      'G4','','E4','','D4','','E4','',
    'C5','','B4','A4','B4','','A4','G4',      'E4','','G4','','A4','','B4','',
  ];
  const KICK  = [1,0,0,0, 1,0,0,0, 1,0,0,0, 1,0,0,1];   // per bar-of-16? we use per-2-bars slice below
  function drum(i){
    const b = i % 8;
    return { kick: b === 0 || b === 4 || (i % 32 === 30), snare: b === 2 || b === 6, hat: true };
  }
  function ensure(){
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = .14;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
  }
  function osc(type, freq, t, dur, vol, detune = 0){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; o.detune.value = detune;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + .02);
  }
  function noise(t, dur, vol, hp){
    const len = Math.ceil(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t);
  }
  function scheduleStep(i, t){
    const bass = BASS[i % 64];
    if (bass) osc('square', N(bass), t, SPB * .9, .30);
    const lead = LEAD[i % 64];
    if (lead){
      osc('sawtooth', N(lead), t, SPB * 1.7, .16);
      osc('sawtooth', N(lead), t, SPB * 1.7, .12, 9);   // detune shimmer
    }
    const dr = drum(i);
    if (dr.kick){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(120, t);
      o.frequency.exponentialRampToValueAtTime(38, t + .1);
      g.gain.setValueAtTime(.7, t);
      g.gain.exponentialRampToValueAtTime(.001, t + .13);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + .15);
    }
    if (dr.snare) noise(t, .1, .3, 1400);
    if (dr.hat) noise(t, .03, i % 2 ? .07 : .11, 6000);
  }
  function tickSched(){
    while (nextT < ctx.currentTime + .12){
      scheduleStep(step, nextT);
      step++; nextT += SPB;
    }
  }
  return {
    start(){
      if (!enabled) return;
      ensure();
      ctx.resume();
      if (!timer){ nextT = ctx.currentTime + .05; timer = setInterval(tickSched, 25); }
    },
    stop(){ if (timer){ clearInterval(timer); timer = null; } if (ctx) ctx.suspend(); },
    toggle(){
      enabled = !enabled;
      if (!enabled) this.stop();
      else if (playing) this.start();
      document.getElementById('bMusic').textContent = 'Music: ' + (enabled ? 'On' : 'Off');
      return enabled;
    },
    get enabled(){ return enabled; }
  };
})();
document.getElementById('bMusic').addEventListener('click', () => Music.toggle());

/* tap to start */
document.getElementById('tapstart').addEventListener('click', () => {
  document.getElementById('tapstart').classList.add('hide');
  frame = 0; playing = true; rafLast = 0; updatePlayBtn();
  Music.start();
});
comp.addEventListener('click', playPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) Music.stop(); else if (playing) Music.start(); });

render();
</script>
</body>
