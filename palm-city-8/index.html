<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Palm City 8</title>
<meta name="description" content="An 8-bit beach town joyride: deliveries, traffic, parking enforcement and lo-fi beats.">
<meta name="theme-color" content="#2b0f3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#2b0f3a;--pink:#ff3ea5;--teal:#26d9d9;--cream:#ffe8f4;--shell1:#ff5fb5;--shell2:#7a2bd1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12061a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif}
/* the handheld */
.shell{position:relative;width:min(100vw,calc(100vh * .58),560px);height:min(100vh,calc(100vw / .58),965px);
  background:linear-gradient(160deg,var(--shell1) 0%,#ff7ac2 30%,#c04de0 70%,var(--shell2) 100%);
  border-radius:22px 22px 70px 22px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.25),inset 0 -14px 30px rgba(43,15,58,.35),0 20px 60px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;padding:4% 5% 0}
.shell::before{content:"";position:absolute;left:0;right:0;top:46%;height:9%;background:repeating-linear-gradient(180deg,var(--teal) 0 18%,transparent 18% 32%);opacity:.55;pointer-events:none}
.bezel{position:relative;width:100%;background:#1b0826;border-radius:14px 14px 40px 14px;padding:5% 6% 4%;box-shadow:inset 0 0 0 3px #3a1650}
.bezel .lamp{position:absolute;left:3%;top:42%;width:2.2%;aspect-ratio:1;border-radius:50%;background:#511;box-shadow:0 0 0 2px #2a0a18}
.bezel .lamp.on{background:var(--pink);box-shadow:0 0 10px var(--pink)}
.bezel .lbl{position:absolute;left:0;right:0;top:1.2%;text-align:center;color:var(--teal);font:800 clamp(8px,2.2vw,12px) "Barlow Condensed",sans-serif;letter-spacing:.25em}
canvas{display:block;width:100%;aspect-ratio:160/144;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--deep);border-radius:4px}
.brand{margin:3.2% 0 0;font:clamp(22px,7vw,40px) Pacifico,cursive;color:var(--cream);text-shadow:3px 3px 0 var(--deep),0 0 14px rgba(38,217,217,.8);transform:rotate(-4deg)}
.brand b{font:800 .7em "Barlow Condensed",sans-serif;color:var(--teal);margin-left:.2em;text-shadow:2px 2px 0 var(--deep)}
.pad{position:relative;width:100%;flex:1;min-height:0}
.dpad{position:absolute;left:4%;top:18%;width:40%;aspect-ratio:1}
.dpad button{position:absolute;width:34%;height:34%;background:#2b0f3a;border:0;border-radius:6px;box-shadow:0 4px 0 #14051c;color:var(--cream);font-size:clamp(10px,3vw,16px)}
.dpad .u{left:33%;top:0}.dpad .d{left:33%;bottom:0}.dpad .l{left:0;top:33%}.dpad .r{right:0;top:33%}
.dpad .c{position:absolute;left:33%;top:33%;width:34%;height:34%;background:#2b0f3a}
.ab{position:absolute;right:4%;top:20%;width:44%;height:40%;transform:rotate(-22deg)}
.ab button{position:absolute;width:42%;aspect-ratio:1;border-radius:50%;border:0;background:var(--deep);box-shadow:0 5px 0 #14051c,inset 0 0 0 3px var(--teal);color:var(--teal);font:800 clamp(14px,4vw,22px) "Barlow Condensed",sans-serif}
.ab .b{left:0;top:30%}.ab .a{right:0;top:0}
.ss{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;gap:8%}
.ss button{transform:rotate(-22deg);width:20%;height:clamp(12px,3.4vw,18px);border-radius:999px;border:0;background:#4a1a63;box-shadow:0 3px 0 #14051c;color:transparent}
.ss span{display:block;text-align:center;color:var(--cream);font:800 clamp(9px,2.4vw,12px) "Barlow Condensed",sans-serif;letter-spacing:.1em;margin-top:6px}
.ss div{width:20%;display:flex;flex-direction:column;align-items:center}
.ss div button{width:100%}
button:active{transform:translateY(2px);box-shadow:none!important}
.ss div button:active{transform:rotate(-22deg) translateY(2px)}
.speaker{position:absolute;right:7%;bottom:4%;width:18%;aspect-ratio:1;background:repeating-linear-gradient(115deg,transparent 0 10%,rgba(43,15,58,.55) 10% 15%);border-radius:10px}
.back{position:fixed;left:12px;bottom:10px;color:var(--cream);font:700 13px "Barlow Condensed",sans-serif;text-decoration:none;opacity:.7;z-index:5}
</style>
</head>
<body>
<a class="back" href="/experiments/">← experiments</a>
<div class="shell" id="shell">
  <div class="bezel"><div class="lbl">DOT MATRIX · WITH LO-FI SOUND</div><div class="lamp" id="lamp"></div><canvas id="c" width="160" height="144" aria-label="Palm City 8 game screen"></canvas></div>
  <div class="brand">Palm City <b>8</b></div>
  <div class="pad">
    <div class="dpad"><button class="u" data-k="up" aria-label="Gas">▲</button><button class="l" data-k="left" aria-label="Steer left">◀</button><div class="c"></div><button class="r" data-k="right" aria-label="Steer right">▶</button><button class="d" data-k="down" aria-label="Brake">▼</button></div>
    <div class="ab"><button class="b" data-k="b" aria-label="Horn">B</button><button class="a" data-k="a" aria-label="Gas">A</button></div>
    <div class="ss"><div><button data-k="select" aria-label="Music on or off">.</button><span>MUSIC</span></div><div><button data-k="start" aria-label="Start or pause">.</button><span>START</span></div></div>
    <div class="speaker"></div>
  </div>
</div>
<script>
'use strict';
/* ================= screen ================= */
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const SW = 160, SH = 144;
// four colours, like a Game Boy, but sunset
const C0 = '#2b0f3a', C1 = '#ff3ea5', C2 = '#26d9d9', C3 = '#ffe8f4';
const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, w, h); };

/* ================= tiny pixel font (3x5) ================= */
const FONT = {
 'A':'010101111101101','B':'110101111101110','C':'011100100100011','D':'110101101101110','E':'111100110100111','F':'111100110100100','G':'011100101101011',
 'H':'101101111101101','I':'111010010010111','J':'001001001101010','K':'101101110101101','L':'100100100100111','M':'101111111101101','N':'110101101101101',
 'O':'010101101101010','P':'111101111100100','Q':'010101101110011','R':'110101110101101','S':'011100010001110','T':'111010010010010','U':'101101101101111',
 'V':'101101101101010','W':'101101111111101','X':'101101010101101','Y':'101101010010010','Z':'111001010100111',
 '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111',
 '7':'111001010010010','8':'111101111101111','9':'111101111001111','$':'011110010011110','!':'010010010000010',':':'000010000010000','.':'000000000000010',
 '-':'000000111000000','?':'110001010000010',"'":'010010000000000',',':'000000000010100','/':'001001010100100','+':'000010111010000',' ':'000000000000000'
};
function text(s, x, y, c, k = 1) { s = String(s).toUpperCase(); let cx = x;
  for (const ch of s) { const f = FONT[ch] || FONT['?']; for (let i = 0; i < 15; i++) if (f[i] === '1') px(cx + (i % 3) * k, y + ((i / 3) | 0) * k, k, k, c); cx += 4 * k; } }
const tw = (s, k = 1) => String(s).length * 4 * k - k;
function ctext(s, y, c, k = 1, shadow) { const x = ((SW - tw(s, k)) / 2) | 0; if (shadow) text(s, x + k, y + k, shadow, k); text(s, x, y, c, k); }

/* ================= the town ================= */
const MW = 64, MH = 64, T = 8;
const ROAD = 0, WALK = 1, BLD = 2, PARK = 3, SAND = 4, SEA = 5, PALM = 6, HYD = 7;
const map = new Uint8Array(MW * MH);
const at = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH) ? SEA : map[y * MW + x];
const set = (x, y, v) => { map[y * MW + x] = v; };
let seed = 20260;
const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
function buildTown() {
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    let v;
    if (x >= 52) v = SEA;
    else if (x >= 45) v = SAND;
    else if (x % 9 < 2 || y % 9 < 2 || x === 43 || x === 44) v = ROAD;
    else { const bx = x % 9, by = y % 9; v = (bx === 2 || bx === 8 || by === 2 || by === 8) ? WALK : BLD; }
    set(x, y, v);
  }
  // a few parks, palms on the beach and in parks, hydrants on the sidewalks
  for (let by = 0; by < 7; by++) for (let bx = 0; bx < 5; bx++) if (rnd() < .22) for (let y = 3; y < 8; y++) for (let x = 3; x < 8; x++) { const X = bx * 9 + x, Y = by * 9 + y; if (X < 43) set(X, Y, rnd() < .18 ? PALM : PARK); }
  for (let y = 1; y < MH - 1; y += 3) if (rnd() < .8) set(46 + ((rnd() * 5) | 0), y, PALM);
  for (let y = 0; y < MH; y++) for (let x = 0; x < 43; x++) if (at(x, y) === WALK && rnd() < .035) set(x, y, HYD);
}
const solid = t => t === BLD || t === SEA || t === PALM || t === HYD;
const isRoad = (x, y) => at(x, y) === ROAD;

/* ================= drawing the town ================= */
let frame = 0;
function drawTile(t, sx, sy, tx, ty) {
  switch (t) {
    case ROAD: px(sx, sy, 8, 8, C0); if ((tx % 9 === 1 && ty % 9 > 1 && (ty & 1)) ) px(sx + 7, sy + 2, 1, 4, C3); if ((ty % 9 === 1 && tx % 9 > 1 && (tx & 1))) px(sx + 2, sy + 7, 4, 1, C3); break;
    case WALK: px(sx, sy, 8, 8, C3); px(sx + 3, sy + 3, 1, 1, C2); break;
    case BLD: { px(sx, sy, 8, 8, C0); const h = (tx * 7 + ty * 13) % 5; px(sx, sy, 8, 1, C1);
      for (let wy = 2; wy < 8; wy += 3) for (let wx = 1; wx < 8; wx += 3) px(sx + wx, sy + wy, 2, 2, ((tx + ty + wx + wy + h) % 4 === 0) ? C1 : (h > 2 ? C2 : '#4b1d63')); break; }
    case PARK: px(sx, sy, 8, 8, C2); if ((tx + ty) & 1) px(sx + 2, sy + 5, 1, 1, C0); break;
    case SAND: px(sx, sy, 8, 8, C3); if ((tx * 3 + ty) % 4 === 0) px(sx + 5, sy + 2, 1, 1, C1); break;
    case SEA: { px(sx, sy, 8, 8, C2); const w = ((frame >> 4) + tx + ty) % 4; px(sx + w * 2, sy + 3, 3, 1, C3); px(sx + ((w + 2) % 4) * 2, sy + 6, 2, 1, C0); break; }
    case PALM: px(sx, sy, 8, 8, at(tx - 1, ty) === SAND || at(tx + 1, ty) === SAND ? C3 : C2); px(sx + 3, sy + 3, 2, 5, C0); px(sx, sy + 1, 8, 2, C1); px(sx + 2, sy, 4, 4, C1); px(sx + 3, sy + 1, 2, 1, C0); break;
    case HYD: px(sx, sy, 8, 8, C3); px(sx + 2, sy + 2, 4, 5, C1); px(sx + 1, sy + 4, 6, 1, C1); px(sx + 3, sy + 1, 2, 1, C0); break;
  }
}

/* ================= cars ================= */
// a car drawn facing one of 8 directions; colours: body, roof
function drawCar(x, y, dir8, body, roof, lights) {
  const cx = x | 0, cy = y | 0, d = dir8 & 7;
  const diag = d & 1;
  if (!diag) {
    const horiz = d === 0 || d === 4;
    if (horiz) { px(cx - 4, cy - 3, 8, 6, body); px(cx - 1, cy - 2, 3, 4, roof); const f = d === 0 ? cx + 3 : cx - 4; px(f, cy - 3, 1, 1, C3); px(f, cy + 2, 1, 1, C3); if (lights) px(d === 0 ? cx - 4 : cx + 3, cy - 1, 1, 2, C1); }
    else { px(cx - 3, cy - 4, 6, 8, body); px(cx - 2, cy - 1, 4, 3, roof); const f = d === 2 ? cy + 3 : cy - 4; px(cx - 3, f, 1, 1, C3); px(cx + 2, f, 1, 1, C3); }
  } else {
    // diagonal: a chunky rotated box from small squares
    const sx = (d === 1 || d === 7) ? 1 : -1, sy = (d === 1 || d === 3) ? 1 : -1;
    for (let i = -3; i <= 3; i++) for (let j = -1; j <= 1; j++) px(cx + i * sx * .72 - j * sy * 1.4 - 1, cy + i * sy * .72 + j * sx * 1.4 - 1, 3, 3, body);
    px(cx - 1, cy - 1, 3, 3, roof); px(cx + sx * 3 - 1, cy + sy * 3 - 1, 2, 2, C3);
  }
}
const dir8Of = a => (Math.round(a / (Math.PI / 4)) % 8 + 8) % 8;

/* ================= state ================= */
const best = (() => { try { return +localStorage.getItem('palmcity8.best') || 0; } catch (e) { return 0; } })();
let S, mode = 'title', musicOn = (() => { try { return localStorage.getItem('palmcity8.music') !== 'off'; } catch (e) { return true; } })();
const keys = { up: 0, down: 0, left: 0, right: 0, a: 0, b: 0 };
function newGame() {
  S = { x: 43.5 * T, y: 4.5 * T, a: Math.PI / 2, v: 0, cash: 0, heat: 0, heatClock: 0, best, stage: 'pickup', target: null, timer: 0,
    delivered: 0, streak: 0, flash: null, flashT: 0, traffic: [], maids: [], shake: 0, honk: 0 };
  for (let i = 0; i < 14; i++) S.traffic.push(spawnTraffic());
  nextPickup();
}
function randomCurb() { for (;;) { const x = (rnd() * 43) | 0, y = (rnd() * MH) | 0; if (at(x, y) === WALK && (isRoad(x - 1, y) || isRoad(x + 1, y) || isRoad(x, y - 1) || isRoad(x, y + 1))) return { x: x * T + 4, y: y * T + 4 }; } }
function nextPickup() { S.stage = 'pickup'; S.target = randomCurb(); S.timer = 0; }
function startDelivery() {
  let t; do { t = randomCurb(); } while (Math.hypot(t.x - S.x, t.y - S.y) < 140);
  S.stage = 'deliver'; S.target = t; S.timer = Math.round(Math.hypot(t.x - S.x, t.y - S.y) / 34 + 12) * 60;
}
function spawnTraffic() { for (;;) { const x = (rnd() * 44) | 0, y = (rnd() * MH) | 0; if (isRoad(x, y)) { const horiz = y % 9 < 2;
  return { x: x * T + 4, y: y * T + 4, dx: horiz ? (rnd() < .5 ? 1 : -1) : 0, dy: horiz ? 0 : (rnd() < .5 ? 1 : -1), sp: .55 + rnd() * .3, col: rnd() < .5 ? C2 : C3 }; } } }
function flash(s, t = 90) { S.flash = s; S.flashT = t; }

/* ================= update ================= */
function tileAtPx(x, y) { return at(Math.floor(x / T), Math.floor(y / T)); }
function blockedAt(x, y, r) { return solid(tileAtPx(x - r, y - r)) || solid(tileAtPx(x + r, y - r)) || solid(tileAtPx(x - r, y + r)) || solid(tileAtPx(x + r, y + r)); }
function update() {
  frame++;
  if (mode !== 'play') return;
  // the car
  const gas = keys.up || keys.a, brake = keys.down;
  if (gas) S.v = Math.min(1.75, S.v + .045); else if (brake) S.v = Math.max(-.7, S.v - .07); else S.v *= .965;
  if (Math.abs(S.v) > .05) S.a += (keys.right - keys.left) * .055 * Math.sign(S.v);
  const nx = S.x + Math.cos(S.a) * S.v, ny = S.y + Math.sin(S.a) * S.v;
  const hit = blockedAt(nx, ny, 3);
  if (hit) { const t = tileAtPx(nx + Math.cos(S.a) * 3, ny + Math.sin(S.a) * 3);
    if (Math.abs(S.v) > .9) { sfx('crash'); S.shake = 8; if (t === HYD) { addHeat(1, 'HYDRANT!'); setTileAtPx(nx + Math.cos(S.a) * 3, ny + Math.sin(S.a) * 3, WALK); } }
    S.v *= -.25; }
  else { S.x = nx; S.y = ny; }
  if (tileAtPx(S.x, S.y) === SAND && S.v > .9) S.v *= .96;   // sand slows you down
  // traffic
  for (const c of S.traffic) {
    const tx = Math.floor(c.x / T), ty = Math.floor(c.y / T), cxp = tx * T + 4, cyp = ty * T + 4;
    if (Math.abs(c.x - cxp) < c.sp && Math.abs(c.y - cyp) < c.sp && tx % 9 < 2 && ty % 9 < 2 && rnd() < .5) {   // at a crossing: maybe turn
      const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => isRoad(tx + dx * 2, ty + dy * 2) && !(dx === -c.dx && dy === -c.dy));
      if (opts.length) { const o = opts[(rnd() * opts.length) | 0]; c.dx = o[0]; c.dy = o[1]; c.x = cxp; c.y = cyp; }
    }
    if (!isRoad(Math.floor((c.x + c.dx * 5) / T), Math.floor((c.y + c.dy * 5) / T))) { c.dx = -c.dx; c.dy = -c.dy; }
    c.x += c.dx * c.sp; c.y += c.dy * c.sp;
    if (Math.abs(c.x - S.x) < 7 && Math.abs(c.y - S.y) < 7) {
      if (Math.abs(S.v) > .7) { sfx('crash'); S.shake = 6; addHeat(1, 'FENDER BENDER'); }
      S.v *= -.4; S.x -= Math.cos(S.a) * 3; S.y -= Math.sin(S.a) * 3; c.dx = -c.dx; c.dy = -c.dy; c.x += c.dx * 4; c.y += c.dy * 4;
    }
  }
  // parking enforcement: one scooter per heat level
  while (S.maids.length < Math.min(3, S.heat)) S.maids.push(spawnMaid());
  for (const m of S.maids) {
    const dx = S.x - m.x, dy = S.y - m.y, d = Math.hypot(dx, dy) || 1, sp = .95 + S.heat * .12;
    let mx = m.x + dx / d * sp, my = m.y + dy / d * sp;
    if (blockedAt(mx, my, 2)) { if (!blockedAt(mx, m.y, 2)) my = m.y; else if (!blockedAt(m.x, my, 2)) mx = m.x; else { mx = m.x + (rnd() - .5) * 3; my = m.y + (rnd() - .5) * 3; if (blockedAt(mx, my, 2)) { mx = m.x; my = m.y; } } }
    m.x = mx; m.y = my;
    if (d < 7) { ticket(); break; }
  }
  // heat cools off if nobody is close
  if (S.heat > 0) { const near = S.maids.some(m => Math.hypot(m.x - S.x, m.y - S.y) < 56); S.heatClock = near ? 0 : S.heatClock + 1;
    if (S.heatClock > 60 * 7) { S.heat--; S.heatClock = 0; S.maids.pop(); if (!S.heat) flash('LOST THEM'); } }
  // jobs
  const td = Math.hypot(S.target.x - S.x, S.target.y - S.y);
  if (S.stage === 'pickup' && td < 9) { sfx('pickup'); flash('PACKAGE IN'); startDelivery(); }
  else if (S.stage === 'deliver') {
    S.timer--;
    if (td < 9) { const bonus = Math.max(0, Math.floor(S.timer / 60)) * 2; S.streak++; const pay = 50 + bonus + (S.streak - 1) * 10; S.cash += pay; S.delivered++; sfx('deliver'); flash('+$' + pay); nextPickup(); }
    else if (S.timer <= 0) { S.streak = 0; sfx('late'); flash('LATE! TRY ANOTHER'); nextPickup(); }
  }
  if (S.honk) S.honk--;
  if (S.flashT) S.flashT--;
  if (S.shake) S.shake--;
}
function setTileAtPx(x, y, v) { const tx = Math.floor(x / T), ty = Math.floor(y / T); if (tx >= 0 && ty >= 0 && tx < MW && ty < MH) set(tx, ty, v); }
function addHeat(n, why) { S.heat = Math.min(5, S.heat + n); S.heatClock = 0; flash(why); }
function spawnMaid() { for (let i = 0; i < 200; i++) { const a = rnd() * Math.PI * 2, r = 90 + rnd() * 30, x = S.x + Math.cos(a) * r, y = S.y + Math.sin(a) * r; if (!blockedAt(x, y, 2) && x > 0 && y > 0 && x < 44 * T && y < MH * T) return { x, y }; } return { x: S.x + 100, y: S.y }; }
function ticket() { const fine = Math.max(25, Math.floor(S.cash * .2)); S.cash = Math.max(0, S.cash - fine); S.heat = 0; S.maids = []; S.streak = 0; sfx('ticket'); flash('TICKET! -$' + fine, 120); S.v = 0; }

/* ================= draw ================= */
function draw() {
  if (mode === 'title') return drawTitle();
  const sh = S.shake ? ((frame & 2) - 1) : 0;
  const camX = Math.max(0, Math.min(MW * T - SW, S.x - SW / 2)) | 0, camY = Math.max(0, Math.min(MH * T - SH, S.y - SH / 2 + 6)) | 0;
  const tx0 = (camX / T) | 0, ty0 = (camY / T) | 0;
  for (let ty = ty0; ty <= ty0 + 19; ty++) for (let tx = tx0; tx <= tx0 + 21; tx++) drawTile(at(tx, ty), tx * T - camX + sh, ty * T - camY, tx, ty);
  // target marker: a bouncing pin
  const tgx = S.target.x - camX, tgy = S.target.y - camY - ((frame >> 3) & 1) * 2;
  const tc = S.stage === 'pickup' ? C1 : C2;
  px(tgx - 3, tgy - 9, 7, 6, tc); px(tgx - 1, tgy - 3, 3, 3, tc); px(tgx - 1, tgy - 7, 3, 2, C3);
  for (const c of S.traffic) { const x = c.x - camX, y = c.y - camY; if (x > -8 && y > -8 && x < SW + 8 && y < SH + 8) drawCar(x, y, c.dx > 0 ? 0 : c.dx < 0 ? 4 : c.dy > 0 ? 2 : 6, c.col, C0, false); }
  for (const m of S.maids) { const x = m.x - camX, y = m.y - camY; px(x - 2, y - 3, 5, 6, C3); px(x - 1, y - 4, 3, 2, (frame >> 3) & 1 ? C1 : C2); px(x - 1, y - 1, 3, 2, C0); }
  drawCar(S.x - camX + sh, S.y - camY, dir8Of(S.a), C1, C3, S.v < 0);
  if (S.honk) { text('HONK', (S.x - camX - 7) | 0, (S.y - camY - 14) | 0, C3); }

    for (let i = 0; i < 4; i++) px(ax + Math.cos(ang) * i * 1.5 - 1, ay + Math.sin(ang) * i * 1.5 - 1, 3 - (i >> 1), 3 - (i >> 1), tc); }

  for (let i = 0; i < 5; i++) { const on = i < S.heat; px(SW - 36 + i * 7, 3, 5, 5, on ? ((frame >> 3) & 1 ? C1 : C3) : '#4b1d63'); }
  if (S.flashT) { const w = tw(S.flash) + 8; px((SW - w) / 2, 118, w, 11, C0); px((SW - w) / 2, 118, w, 1, C1); ctext(S.flash, 121, C3); }
  if (mode === 'paused') { px(30, 54, 100, 36, C0); px(30, 54, 100, 1, C2); ctext('PAUSED', 60, C2, 2); ctext('START TO GO ON', 80, C3); }

}
function drawTitle() {
  // sunset bands
  const bands = [C0, '#4b1d63', C1, C1, '#ff7ac2', C3];
  for (let i = 0; i < 6; i++) px(0, i * 12, SW, 12, bands[i]);
  // the sun, sliced
  for (let y = 0; y < 34; y++) { const w = Math.round(Math.sqrt(34 * 34 - (34 - y) * (34 - y)) * 1.0); if (y > 18 && (y % 4) < 1 + (y - 18) / 6) continue; px(80 - w / 2, 28 + y, w, 1, y < 18 ? C3 : '#ffd0e8'); }

  // grid floor
  for (let i = 0; i < 9; i++) { const y = 62 + i * i * 1.0 + ((frame >> 2) % 4) * i * .25; px(0, y, SW, 1, C2); }
  for (let i = -8; i <= 8; i++) { g.strokeStyle = C2; g.beginPath(); g.moveTo(80 + i * 3 + .5, 62); g.lineTo(80 + i * 30 + .5, 144); g.stroke(); }
  // palms
  for (const [x, h] of [[14, 44], [26, 36], [140, 48]]) { px(x, 62 - h, 2, h, C0); px(x - 8, 62 - h, 18, 2, C0); px(x - 5, 60 - h, 12, 2, C0); px(x - 10, 64 - h, 4, 2, C0); px(x + 8, 64 - h, 4, 2, C0); }
  ctext('PALM CITY', 78, C1, 3, C0); ctext('8', 100, C2, 3, C0);
  if ((frame >> 5) & 1) ctext('PRESS START', 122, C3);
  ctext('AN 8-BIT BEACH TOWN JOYRIDE', 134, C2);
  if (best) text('BEST $' + best, 3, 3, C3);
}

/* ================= lo-fi beats (Web Audio) ================= */
let AC = null, master = null, musicGain = null, nextStep = 0, stepN = 0, sched = null, crackle = null;
const BPM = 78, STEP = 60 / BPM / 4;
const CHORDS = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60, 64], [48, 52, 55, 59]];   // Fmaj7, Em7, Dm9, Cmaj7
const BASS = [41, 40, 38, 36];
const hz = n => 440 * Math.pow(2, (n - 69) / 12);
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = .55;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;   // the lo-fi dullness
  master.connect(lp); lp.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = musicOn ? 1 : 0; musicGain.connect(master);
  // vinyl crackle: a looped noise buffer with sparse pops
  const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * .012 + (Math.random() < .0009 ? (Math.random() * 2 - 1) * .6 : 0);
  crackle = AC.createBufferSource(); crackle.buffer = buf; crackle.loop = true;
  const cg = AC.createGain(); cg.gain.value = .5; const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400;
  crackle.connect(bp); bp.connect(cg); cg.connect(musicGain); crackle.start();
  nextStep = AC.currentTime + .1;
  sched = setInterval(schedule, 25);
}
function noiseBuf() { const b = AC.createBuffer(1, AC.sampleRate * .4, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
let NB = null;
function kick(t) { const o = AC.createOscillator(), gn = AC.createGain(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + .18);
  gn.gain.setValueAtTime(.9, t); gn.gain.exponentialRampToValueAtTime(.001, t + .35); o.connect(gn); gn.connect(musicGain); o.start(t); o.stop(t + .4); }
function snare(t, v = .35) { const s = AC.createBufferSource(); s.buffer = NB; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = .8;
  const gn = AC.createGain(); gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.001, t + .22); s.connect(f); f.connect(gn); gn.connect(musicGain); s.start(t); s.stop(t + .25); }
function hat(t, v, open) { const s = AC.createBufferSource(); s.buffer = NB; const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
  const gn = AC.createGain(); gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.001, t + (open ? .25 : .05)); s.connect(f); f.connect(gn); gn.connect(musicGain); s.start(t); s.stop(t + .3); }
function keysChord(t, notes, dur) {   // soft electric-piano chord, slightly detuned, rolled
  notes.forEach((n, i) => { const tt = t + i * .018; for (const [type, det, vol] of [['sine', 0, .07], ['triangle', 6, .035]]) {
    const o = AC.createOscillator(), gn = AC.createGain(), f = AC.createBiquadFilter(); o.type = type; o.frequency.value = hz(n); o.detune.value = det + (Math.random() * 6 - 3);
    f.type = 'lowpass'; f.frequency.value = 1400; gn.gain.setValueAtTime(0, tt); gn.gain.linearRampToValueAtTime(vol, tt + .03); gn.gain.exponentialRampToValueAtTime(.0005, tt + dur);
    o.connect(f); f.connect(gn); gn.connect(musicGain); o.start(tt); o.stop(tt + dur + .05); } });
}
function bass(t, n, dur) { const o = AC.createOscillator(), gn = AC.createGain(); o.type = 'sine'; o.frequency.value = hz(n);
  gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(.32, t + .02); gn.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(gn); gn.connect(musicGain); o.start(t); o.stop(t + dur + .05); }
function schedule() {
  if (!NB) NB = noiseBuf();
  while (nextStep < AC.currentTime + .15) {
    const s = stepN % 16, bar = ((stepN / 16) | 0) % 4, swing = (s & 1) ? STEP * .28 : 0, t = nextStep + swing;
    if (s === 0 || s === 7 || s === 10) kick(t);
    if (s === 4 || s === 12) snare(t);
    if (s === 15 && bar === 3) snare(t, .12);
    if (!(s & 1)) hat(t, s % 4 === 2 ? .09 : .05, s === 14 && bar % 2 === 1);
    if (s === 0) keysChord(t, CHORDS[bar], STEP * 14);
    if (s === 8 && bar % 2 === 0) keysChord(t, CHORDS[bar].slice(1).map(n => n + 12), STEP * 5);
    if (s === 0) bass(t, BASS[bar], STEP * 5); if (s === 10) bass(t, BASS[bar] + 7, STEP * 3);

}
function sfx(name) {   // chip sounds, kept quiet under the beat
  if (!AC) return; const t = AC.currentTime;
  const beep = (f1, f2, dur, type = 'square', vol = .08, at = 0) => { const o = AC.createOscillator(), gn = AC.createGain(); o.type = type;
    o.frequency.setValueAtTime(f1, t + at); o.frequency.exponentialRampToValueAtTime(f2, t + at + dur); gn.gain.setValueAtTime(vol, t + at); gn.gain.exponentialRampToValueAtTime(.001, t + at + dur);
    o.connect(gn); gn.connect(master); o.start(t + at); o.stop(t + at + dur + .02); };
  if (name === 'pickup') { beep(660, 990, .08); beep(990, 1320, .1, 'square', .07, .08); }
  if (name === 'deliver') { [523, 659, 784, 1047].forEach((f, i) => beep(f, f, .09, 'square', .07, i * .07)); }
  if (name === 'crash') { if (!NB) NB = noiseBuf(); const s = AC.createBufferSource(); s.buffer = NB; const gn = AC.createGain(); gn.gain.setValueAtTime(.25, t); gn.gain.exponentialRampToValueAtTime(.001, t + .25); s.connect(gn); gn.connect(master); s.start(t); s.stop(t + .3); }
  if (name === 'ticket') { beep(880, 440, .18, 'square', .08); beep(880, 440, .18, 'square', .08, .22); }
  if (name === 'late') beep(330, 160, .35, 'triangle', .1);
  if (name === 'honk') { beep(392, 380, .22, 'sawtooth', .05); beep(494, 480, .22, 'sawtooth', .04); }
  if (name === 'start') { [392, 523, 659].forEach((f, i) => beep(f, f, .08, 'square', .07, i * .06)); }
}
function toggleMusic() { musicOn = !musicOn; try { localStorage.setItem('palmcity8.music', musicOn ? 'on' : 'off'); } catch (e) {} if (musicGain) musicGain.gain.setTargetAtTime(musicOn ? 1 : 0, AC.currentTime, .1); }

/* ================= input ================= */
function press(k, down) {
  if (k === 'start' && down) { audioInit(); if (mode === 'title') { newGame(); mode = 'play'; sfx('start'); } else mode = mode === 'play' ? 'paused' : 'play'; return; }
  if (k === 'select' && down) { audioInit(); toggleMusic(); return; }
  if (k === 'b' && down && mode === 'play') { S.honk = 30; sfx('honk'); }
  if ((k === 'a' || k === 'up') && down && mode === 'title') { audioInit(); newGame(); mode = 'play'; sfx('start'); return; }
  if (k in keys) keys[k] = down ? 1 : 0;
}
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', z: 'a', x: 'b', Enter: 'start', ' ': 'start', m: 'select', Shift: 'select' };
addEventListener('keydown', e => { const k = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase && e.key.toLowerCase()]; if (k) { e.preventDefault(); if (!e.repeat || k in keys) press(k, true); } });
addEventListener('keyup', e => { const k = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase && e.key.toLowerCase()]; if (k) press(k, false); });
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); press(k, true); if (navigator.vibrate) navigator.vibrate(8); };
  const off = e => { e.preventDefault(); press(k, false); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
});
cv.addEventListener('pointerdown', () => { if (mode === 'title') press('start', true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') mode = 'paused'; });

/* ================= loop ================= */
buildTown();
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  if (S && mode === 'play' && S.cash > (S.best || 0)) { S.best = S.cash; try { localStorage.setItem('palmcity8.best', S.cash); } catch (e) {} }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__pc8 = { get S() { return S; }, get mode() { return mode; }, get audio() { return AC ? AC.state + ":" + stepN : "none"; }, press, at, MW, MH, T };
