<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Palm City 8</title>
<meta name="description" content="An 8-bit beach town joyride: deliveries, traffic, parking enforcement and lo-fi beats.">
<meta name="theme-color" content="#2b0f3a">
<link rel="icon" type="image/png" href="/icons/palm-city-8-64.png">
<link rel="apple-touch-icon" href="/icons/palm-city-8-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#2b0f3a;--pink:#ff3ea5;--teal:#26d9d9;--cream:#ffe8f4;--shell1:#ff5fb5;--shell2:#7a2bd1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12061a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif}
/* the handheld */
.shell{position:relative;width:min(100vw,calc(100vh * .58),560px);height:min(100vh,calc(100vw / .58),965px);
  background:linear-gradient(160deg,var(--shell1) 0%,#ff7ac2 30%,#c04de0 70%,var(--shell2) 100%);
  border-radius:22px 22px 70px 22px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.25),inset 0 -14px 30px rgba(43,15,58,.35),0 20px 60px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;padding:4% 5% 0}
.shell::before{content:"";position:absolute;left:0;right:0;top:46%;height:9%;background:repeating-linear-gradient(180deg,var(--teal) 0 18%,transparent 18% 32%);opacity:.55;pointer-events:none}
.bezel{position:relative;width:100%;background:#1b0826;border-radius:14px 14px 40px 14px;padding:5% 6% 4%;box-shadow:inset 0 0 0 3px #3a1650}
.bezel .lamp{position:absolute;left:3%;top:42%;width:2.2%;aspect-ratio:1;border-radius:50%;background:#511;box-shadow:0 0 0 2px #2a0a18}
.bezel .lamp.on{background:var(--pink);box-shadow:0 0 10px var(--pink)}
.bezel .lbl{position:absolute;left:0;right:0;top:1.2%;text-align:center;color:var(--teal);font:800 clamp(8px,2.2vw,12px) "Barlow Condensed",sans-serif;letter-spacing:.25em}
canvas{display:block;width:100%;aspect-ratio:320/288;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--deep);border-radius:4px}
.brand{margin:3.2% 0 0;font:clamp(22px,7vw,40px) Pacifico,cursive;color:var(--cream);text-shadow:3px 3px 0 var(--deep),0 0 14px rgba(38,217,217,.8);transform:rotate(-4deg)}
.brand b{font:800 .7em "Barlow Condensed",sans-serif;color:var(--teal);margin-left:.2em;text-shadow:2px 2px 0 var(--deep)}
.subhead{margin:1.2% 0 0;color:var(--cream);font:700 clamp(12px,3.6vw,18px) "Barlow Condensed",sans-serif;letter-spacing:.04em;text-shadow:2px 2px 0 var(--deep);text-align:center}
.pad{position:relative;width:100%;flex:1;min-height:0}
.dpad{position:absolute;left:4%;top:18%;width:40%;aspect-ratio:1}
.dpad button{position:absolute;width:34%;height:34%;background:#2b0f3a;border:0;border-radius:6px;box-shadow:0 4px 0 #14051c;color:var(--cream);font-size:clamp(10px,3vw,16px)}
.dpad .u{left:33%;top:0}.dpad .d{left:33%;bottom:0}.dpad .l{left:0;top:33%}.dpad .r{right:0;top:33%}
.dpad .c{position:absolute;left:33%;top:33%;width:34%;height:34%;background:#2b0f3a}
.ab{position:absolute;right:4%;top:20%;width:44%;height:40%;transform:rotate(-22deg)}
.ab button{position:absolute;width:42%;aspect-ratio:1;border-radius:50%;border:0;background:var(--deep);box-shadow:0 5px 0 #14051c,inset 0 0 0 3px var(--teal);color:var(--teal);font:800 clamp(14px,4vw,22px) "Barlow Condensed",sans-serif}
.ab .b{left:0;top:30%}.ab .a{right:0;top:0}
.ss{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;gap:8%}
.ss button{transform:rotate(-22deg);width:20%;height:clamp(12px,3.4vw,18px);border-radius:999px;border:0;background:#4a1a63;box-shadow:0 3px 0 #14051c;color:transparent}
.ss span{display:block;text-align:center;color:var(--cream);font:800 clamp(9px,2.4vw,12px) "Barlow Condensed",sans-serif;letter-spacing:.1em;margin-top:6px}
.ss div{width:20%;display:flex;flex-direction:column;align-items:center}
.ss div button{width:100%}
button:active{transform:translateY(2px);box-shadow:none!important}
.ss div button:active{transform:rotate(-22deg) translateY(2px)}
.speaker{position:absolute;right:7%;bottom:4%;width:18%;aspect-ratio:1;background:repeating-linear-gradient(115deg,transparent 0 10%,rgba(43,15,58,.55) 10% 15%);border-radius:10px}
.back{position:fixed;left:12px;bottom:10px;color:var(--cream);font:700 13px "Barlow Condensed",sans-serif;text-decoration:none;opacity:.7;z-index:5}
</style>
</head>
<body>
<a class="back" href="/experiments/">← experiments</a>
<div class="shell" id="shell">
  <div class="bezel"><div class="lbl">DOT MATRIX · WITH LO-FI SOUND</div><div class="lamp" id="lamp"></div><canvas id="c" width="320" height="288" aria-label="Palm City 8 game screen"></canvas></div>
  <div class="brand">Palm City <b>8</b></div>
  <div class="subhead">I can't afford GTA 6, so this is my GTA 6-bit 😂</div>
  <div class="pad">
    <div class="dpad"><button class="u" data-k="up" aria-label="Gas">▲</button><button class="l" data-k="left" aria-label="Steer left">◀</button><div class="c"></div><button class="r" data-k="right" aria-label="Steer right">▶</button><button class="d" data-k="down" aria-label="Brake">▼</button></div>
    <div class="ab"><button class="b" data-k="b" aria-label="Horn">B</button><button class="a" data-k="a" aria-label="Gas">A</button></div>
    <div class="ss"><div><button data-k="select" aria-label="Music on or off">.</button><span>MUSIC</span></div><div><button data-k="start" aria-label="Start or pause">.</button><span>START</span></div></div>
    <div class="speaker"></div>
  </div>
</div>
<script>
'use strict';
/* ================= screen ================= */
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const SW = 320, SH = 288;
// sunset palette
const P = {
  ink: '#1a0726', deep: '#2b0f3a', purp: '#4b1d63', violet: '#7a2bd1', pink: '#ff3ea5', blush: '#ff8fcb', teal: '#26d9d9', cream: '#ffe8f4', sun: '#ffd36b', red: '#ff2a55',
  asph: '#33193f', asph2: '#3d2149', line: '#ffd36b', walk: '#f4d3e6', walk2: '#e4b6d2', curb: '#b9789f',
  sand: '#ffdcc0', sand2: '#f3c29d', sea: '#139fb8', sea2: '#0d7f96', foam: '#bff7f5', grass: '#1fbfa6', grass2: '#129a8b',
  trunk: '#7a3b4e', frond: '#16c98f', frond2: '#0a8a6b', glass: '#24144a'
};
const C0 = P.deep, C1 = P.pink, C2 = P.teal, C3 = P.cream;
let ctx = g;   // what px() draws on: the screen, or the town picture while it is being painted
const px = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
const hash = (x, y) => (((x * 73856093) ^ (y * 19349663)) >>> 0) % 1000 / 1000;

/* ================= pixel font (5x7) ================= */
// each letter is seven rows of five bits, written as two hex digits per row
const FONT = {};
Object.entries({
  A: '0e11111f111111', B: '1e11111e11111e', C: '0e11101010110e', D: '1e11111111111e', E: '1f10101e10101f', F: '1f10101e101010', G: '0e111017111 10f',
  H: '1111111f111111', I: '0e04040404040e', J: '0702020202120c', K: '11121418141211', L: '1010101010101f', M: '111b1515111111', N: '11111915131111',
  O: '0e11111111110e', P: '1e11111e101010', Q: '0e11111115120d', R: '1e11111e141211', S: '0f10100e01011e', T: '1f040404040404', U: '1111111111110e',
  V: '11111111110a04', W: '11111115151 50a', X: '11110a040a1111', Y: '11110a04040404', Z: '1f01020408101f',
  0: '0e11131519110e', 1: '040c040404040e', 2: '0e11010204081f', 3: '1f02040201110e', 4: '02060a121f0202', 5: '1f101e0101110e', 6: '0608101e11110e',
  7: '1f010204080808', 8: '0e11110e11110e', 9: '0e11110f01020c',
  '$': '040f140e051e04', '!': '04040404040004', ':': '000c0c000c0c00', '.': '00000000000c0c', '-': '0000001f000000', '?': '0e110102040004',
  "'": '04040800000000', ',': '000000000c0408', '/': '01010204081010', '+': '0004041f040400', ' ': '00000000000000'
}).forEach(([ch, hex]) => { hex = hex.replace(/ /g, ''); FONT[ch] = [0, 1, 2, 3, 4, 5, 6].map(r => parseInt(hex.substr(r * 2, 2), 16)); });
function text(s, x, y, c, k = 1) {
  s = String(s).toUpperCase(); let cx = Math.round(x);
  for (const ch of s) { const rows = FONT[ch] || FONT['?'];
    for (let r = 0; r < 7; r++) for (let b = 0; b < 5; b++) if (rows[r] & (16 >> b)) px(cx + b * k, y + r * k, k, k, c);
    cx += 6 * k; }
}
const tw = (s, k = 1) => String(s).length * 6 * k - k;
function ctext(s, y, c, k = 1, shadow) { const x = Math.round((SW - tw(s, k)) / 2); if (shadow) text(s, x + k, y + k, shadow, k); text(s, x, y, c, k); }

/* ================= the town ================= */
const MW = 64, MH = 64, T = 16;
const ROAD = 0, WALK = 1, BLD = 2, PARK = 3, SAND = 4, SEA = 5, PALM = 6, HYD = 7;
const map = new Uint8Array(MW * MH);
const at = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH) ? SEA : map[y * MW + x];
const set = (x, y, v) => { map[y * MW + x] = v; };
let seed = 20260;
const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
const isBoulevard = x => x === 43 || x === 44;
function buildTown() {
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    let v;
    if (x >= 52) v = SEA;
    else if (x >= 45) v = SAND;
    else if (x % 9 < 2 || y % 9 < 2 || isBoulevard(x)) v = ROAD;
    else { const bx = x % 9, by = y % 9; v = (bx === 2 || bx === 8 || by === 2 || by === 8) ? WALK : BLD; }
    set(x, y, v);
  }
  // a few parks, palms on the beach and in parks, hydrants on the sidewalks
  for (let by = 0; by < 7; by++) for (let bx = 0; bx < 5; bx++) if (rnd() < .22) for (let y = 3; y < 8; y++) for (let x = 3; x < 8; x++) { const X = bx * 9 + x, Y = by * 9 + y; if (X < 43) set(X, Y, rnd() < .18 ? PALM : PARK); }
  for (let y = 1; y < MH - 1; y += 3) if (rnd() < .8) set(46 + ((rnd() * 5) | 0), y, PALM);
  for (let y = 0; y < MH; y++) for (let x = 0; x < 43; x++) if (at(x, y) === WALK && rnd() < .035) set(x, y, HYD);
  paintTown();
}
const solid = t => t === BLD || t === SEA || t === PALM || t === HYD;
const isRoad = (x, y) => at(x, y) === ROAD;

/* ================= painting the town ================= */
// the town is painted once onto its own picture; only the waves move
let frame = 0;
const townPic = document.createElement('canvas'); townPic.width = MW * T; townPic.height = MH * T;
const townCtx = townPic.getContext('2d');
// roof, parapet and wall colours for the buildings
const ROOFS = [['#ff8fcb', '#d9609f', '#a8417a'], ['#7de8e3', '#3fbcbc', '#21808a'], ['#b98cf0', '#8a5ad1', '#5c3399'], ['#ffd36b', '#e0a94a', '#a8722c'], ['#ffc1dc', '#e595bb', '#b06a8f']];
// which building a tile belongs to: some blocks are split into two buildings
function buildingOf(tx, ty) { const bx = Math.floor(tx / 9), by = Math.floor(ty / 9), split = hash(bx, by + 50) < .5, half = split && tx % 9 >= 5 ? 1 : 0; return bx * 2 + half + by * 100; }
function roofOf(tx, ty) { const b = buildingOf(tx, ty); return ROOFS[Math.floor(hash(b, 7) * ROOFS.length)]; }
const sameBuilding = (ax, ay, bx, by) => at(bx, by) === BLD && buildingOf(ax, ay) === buildingOf(bx, by);
const horizStreet = ty => ty % 9 < 2, vertStreet = tx => tx % 9 < 2 || isBoulevard(tx);

function paintGround(t, sx, sy, tx, ty) {
  if (t === SAND || (t === PALM && tx >= 45)) {
    px(sx, sy, 16, 16, P.sand);
    for (let i = 0; i < 3; i++) { const h = hash(tx * 3 + i, ty); px(sx + (h * 14 | 0), sy + (hash(ty, tx + i) * 14 | 0), 2, 1, P.sand2); }
    if (at(tx + 1, ty) === SEA) px(sx + 14, sy, 2, 16, '#fff1e2');
  } else if (t === PARK || t === PALM) {
    px(sx, sy, 16, 16, P.grass);
    for (let i = 0; i < 4; i++) { const h = hash(tx + i * 7, ty * 3); px(sx + (h * 14 | 0), sy + (hash(ty + i, tx) * 13 | 0), 1, 3, P.grass2); }
    if (hash(tx, ty) < .25) { const fx = sx + 4 + (hash(ty, tx) * 8 | 0), fy = sy + 5 + (hash(tx + 1, ty) * 6 | 0); px(fx - 1, fy, 3, 1, P.blush); px(fx, fy - 1, 1, 3, P.blush); px(fx, fy, 1, 1, P.sun); }
  } else if (t === WALK || t === HYD) {
    px(sx, sy, 16, 16, P.walk); px(sx, sy + 15, 16, 1, P.walk2); px(sx + 15, sy, 1, 16, P.walk2);
    if (isRoad(tx, ty - 1)) px(sx, sy, 16, 2, P.curb);
    if (isRoad(tx, ty + 1)) px(sx, sy + 14, 16, 2, P.curb);
    if (isRoad(tx - 1, ty)) px(sx, sy, 2, 16, P.curb);
    if (isRoad(tx + 1, ty)) px(sx + 14, sy, 2, 16, P.curb);
  }
}
function paintRoad(sx, sy, tx, ty) {
  px(sx, sy, 16, 16, P.asph);
  if (hash(tx, ty) < .3) px(sx + (hash(ty, tx) * 12 | 0), sy + (hash(tx + 3, ty) * 12 | 0), 3, 2, P.asph2);   // patches
  const h = horizStreet(ty), v = vertStreet(tx);
  if (h && v) { if (hash(tx, ty + 9) < .15) { px(sx + 5, sy + 5, 6, 6, P.asph2); px(sx + 6, sy + 6, 4, 4, P.ink); } return; }   // crossing, sometimes a manhole
  if (v) {
    const leftLane = tx === 43 || tx % 9 === 0;
    px(leftLane ? sx + 15 : sx, sy + 3, 1, 8, P.line);                                // centre line, dashed
    if (horizStreet(ty - 1)) for (let i = 0; i < 4; i++) px(sx + 1 + i * 4, sy + 1, 2, 6, P.cream);   // crosswalks next to the crossing
    if (horizStreet(ty + 1)) for (let i = 0; i < 4; i++) px(sx + 1 + i * 4, sy + 9, 2, 6, P.cream);
  } else if (h) {
    px(sx + 3, ty % 9 === 0 ? sy + 15 : sy, 8, 1, P.line);
    if (vertStreet(tx - 1)) for (let i = 0; i < 4; i++) px(sx + 1, sy + 1 + i * 4, 6, 2, P.cream);
    if (vertStreet(tx + 1)) for (let i = 0; i < 4; i++) px(sx + 9, sy + 1 + i * 4, 6, 2, P.cream);
  }
}
function paintBuilding(sx, sy, tx, ty) {
  const [roof, rim, wall] = roofOf(tx, ty);
  px(sx, sy, 16, 16, roof);
  // art-deco roof bands
  if ((tx + ty) % 2 === 0) px(sx + 2, sy + 7, 12, 1, rim);
  const up = sameBuilding(tx, ty, tx, ty - 1), down = sameBuilding(tx, ty, tx, ty + 1), left = sameBuilding(tx, ty, tx - 1, ty), right = sameBuilding(tx, ty, tx + 1, ty);
  if (!up) px(sx, sy, 16, 2, rim);
  if (!left) px(sx, sy, 2, 16, rim);
  if (!right) px(sx + 14, sy, 2, 16, rim);
  const r = hash(tx * 5, ty * 3);
  if (up && down && left && right) {
    if (r < .22) { px(sx + 3, sy + 3, 9, 7, '#e9d6f0'); px(sx + 3, sy + 10, 9, 2, '#a98bb5'); for (let i = 0; i < 4; i++) px(sx + 4 + i * 2, sy + 4, 1, 5, '#a98bb5'); }   // AC unit
    else if (r < .32) { px(sx + 4, sy + 4, 8, 8, rim); px(sx + 5, sy + 5, 6, 6, P.teal); px(sx + 5, sy + 5, 2, 2, P.cream); }   // skylight
    else if (r < .38) { px(sx + 6, sy + 2, 4, 12, rim); px(sx + 7, sy + 3, 2, 10, P.sun); }   // neon sign on the roof
  }
  // the street side shows the front of the building, with lit windows
  if (!down) {
    px(sx, sy + 8, 16, 8, wall); px(sx, sy + 8, 16, 1, rim);
    for (const wx of [2, 9]) { const lit = hash(tx * 2 + wx, ty) < .45; px(sx + wx, sy + 10, 5, 4, lit ? P.sun : P.glass); if (lit) px(sx + wx, sy + 10, 5, 1, '#fff3c4'); }
    if (hash(tx, ty * 7) < .2) { px(sx + 6, sy + 10, 4, 6, P.ink); px(sx + 5, sy + 9, 6, 1, P.pink); }   // a door with an awning
  }
}
function paintTile(tx, ty) {
  ctx = townCtx;
  const t = at(tx, ty), sx = tx * T, sy = ty * T;
  if (t === ROAD) paintRoad(sx, sy, tx, ty);
  else if (t === BLD) paintBuilding(sx, sy, tx, ty);
  else if (t === SEA) px(sx, sy, 16, 16, P.sea);
  else paintGround(t, sx, sy, tx, ty);
  if (t === HYD) { px(sx + 4, sy + 12, 9, 2, P.walk2); px(sx + 5, sy + 4, 6, 9, P.red); px(sx + 3, sy + 7, 10, 3, P.red); px(sx + 6, sy + 3, 4, 2, '#b3123a'); px(sx + 6, sy + 5, 2, 2, '#ff9bb0'); }
  if (t === PALM) { px(sx + 3, sy + 11, 11, 3, 'rgba(26,7,38,.25)'); px(sx + 7, sy + 5, 3, 8, P.trunk); px(sx + 7, sy + 7, 3, 1, '#5a2638'); px(sx + 7, sy + 10, 3, 1, '#5a2638'); }
  ctx = g;
}
// palm tops are painted last so they can hang over the next tile
function paintPalmTop(tx, ty) {
  ctx = townCtx; const sx = tx * T + 8, sy = ty * T + 4;
  for (const [dx, dy] of [[-8, -1], [8, -1], [-6, 3], [6, 3], [0, -6], [-5, -5], [5, -5]]) { px(sx + dx * .5 - 3, sy + dy * .5 - 1, 6, 3, P.frond2); px(sx + dx - 2, sy + dy - 1, 5, 3, P.frond); }
  px(sx - 3, sy - 2, 6, 5, P.frond); px(sx - 1, sy - 1, 3, 3, '#7a3b2e'); px(sx - 1, sy - 1, 1, 1, P.sun);
  ctx = g;
}
function paintTown() {
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) paintTile(x, y);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (at(x, y) === PALM) paintPalmTop(x, y);
  // beach umbrellas and towels
  ctx = townCtx;
  for (let y = 2; y < MH - 2; y += 4) { const x = 47 + ((hash(y, 3) * 4) | 0); if (at(x, y) !== SAND) continue; const cx = x * T + 8, cy = y * T + 8, cols = [[P.pink, P.cream], [P.teal, P.cream], [P.sun, P.pink]][y % 3];
    px(cx - 2, cy + 6, 12, 6, cols[0]); px(cx + 2, cy + 6, 4, 6, cols[1]);   // towel
    px(cx - 7, cy - 4, 14, 3, cols[0]); px(cx - 5, cy - 6, 10, 7, cols[0]); px(cx - 2, cy - 7, 4, 9, cols[1]); px(cx - 1, cy - 1, 2, 2, P.ink); }
  ctx = g;
}

/* ================= sprites ================= */
// draw a small picture facing east, then turn it into 16 headings, pixel by pixel, so it stays sharp
function makeSprite(w, h, paint) { const c = document.createElement('canvas'); c.width = w; c.height = h; ctx = c.getContext('2d'); paint(); ctx = g; return c; }
function turnSprite(src, n = 16, shadow = false) {
  const w = src.width, h = src.height, data = src.getContext('2d').getImageData(0, 0, w, h).data, D = Math.ceil(Math.hypot(w, h)) + 2, out = [];
  for (let i = 0; i < n; i++) {
    const a = i * Math.PI * 2 / n, co = Math.cos(a), si = Math.sin(a), c = document.createElement('canvas'); c.width = c.height = D;
    const cc = c.getContext('2d'), img = cc.createImageData(D, D);
    for (let y = 0; y < D; y++) for (let x = 0; x < D; x++) {
      const dx = x + .5 - D / 2, dy = y + .5 - D / 2, sx = Math.floor(dx * co + dy * si + w / 2), sy = Math.floor(-dx * si + dy * co + h / 2);
      if (sx < 0 || sy < 0 || sx >= w || sy >= h) continue;
      const s = (sy * w + sx) * 4, d = (y * D + x) * 4; if (!data[s + 3]) continue;
      if (shadow) { img.data[d + 3] = 80; } else { img.data[d] = data[s]; img.data[d + 1] = data[s + 1]; img.data[d + 2] = data[s + 2]; img.data[d + 3] = data[s + 3]; }
    }
    cc.putImageData(img, 0, 0); out.push(c);
  }
  return out;
}
const headingIndex = (a, n = 16) => ((Math.round(a / (Math.PI * 2 / n)) % n) + n) % n;
function carPicture(body, roof, stripe) {
