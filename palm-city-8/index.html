<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Palm City 8</title>
<meta name="description" content="An 8-bit island joyride: leaning pixel buildings, drifts, jumps, jobs and lo-fi radio.">
<meta name="theme-color" content="#2b0f3a">
<link rel="icon" type="image/png" href="/icons/palm-city-8-64.png">
<link rel="apple-touch-icon" href="/icons/palm-city-8-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ar:1.5;--deep:#2b0f3a;--pink:#ff3ea5;--teal:#26d9d9;--cream:#ffe8f4;--sun:#ffd36b;--body1:#2c2536;--body2:#141019;--edge:#3d3449}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#2a1438 0%,#0b0612 70%);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif}
/* the handheld: a wide, rounded slab in charcoal with an 80s stripe */
.shell{position:relative;display:grid;align-items:center;gap:2vmin;padding:2.4vmin 3vmin 3vmin;
  background:linear-gradient(175deg,var(--body1) 0%,#221c2b 45%,var(--body2) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -6px 14px rgba(0,0,0,.6),0 0 0 2px #0a070e,0 24px 60px rgba(0,0,0,.7)}
.shell::before{content:"";position:absolute;left:7%;right:7%;top:9px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--pink),var(--sun) 50%,var(--teal));opacity:.85}
.grip{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vmin}
/* screen */
.screenwrap{grid-area:screen;position:relative;background:#0c0910;border-radius:16px;padding:max(3.2vmin,18px) 3.6vmin 2.6vmin;box-shadow:inset 0 0 0 2px #2c2536,inset 0 4px 12px rgba(0,0,0,.8)}
.screenwrap .print{position:absolute;left:3.6vmin;right:3.6vmin;top:.7vmin;display:flex;justify-content:space-between;align-items:center;color:#8b7f99;font:800 clamp(8px,1.6vmin,12px) "Barlow Condensed",sans-serif;letter-spacing:.2em}
.screenwrap .print b{font:italic 800 clamp(10px,2.1vmin,15px) "Barlow Condensed",sans-serif;letter-spacing:.06em;background:linear-gradient(90deg,var(--pink),var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent}
.lamp{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3a1a24;margin-right:6px;vertical-align:middle}
.lamp.on{background:var(--pink);box-shadow:0 0 8px var(--pink)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--deep);border-radius:3px}
.subhead{margin:.8vmin 0 0;text-align:center;color:var(--cream);opacity:.85;font:700 clamp(10px,2vmin,15px) "Barlow Condensed",sans-serif;letter-spacing:.03em}
/* stick */
.stickzone{position:relative;width:100%;height:clamp(120px,34vmin,230px);touch-action:none}
.stick{position:absolute;left:50%;top:50%;width:clamp(100px,26vmin,170px);aspect-ratio:1;margin:calc(clamp(100px,26vmin,170px) / -2) 0 0 calc(clamp(100px,26vmin,170px) / -2);border-radius:50%;
  background:radial-gradient(circle,#1d1724 0 58%,#0d0a11 60%);box-shadow:inset 0 0 0 2px #3d3449,inset 0 3px 8px rgba(0,0,0,.8),0 2px 0 rgba(255,255,255,.06);pointer-events:none}
.stick::before,.stick::after{content:"";position:absolute;left:50%;top:50%;background:rgba(255,232,244,.08);transform:translate(-50%,-50%)}
.stick::before{width:74%;height:2px}.stick::after{width:2px;height:74%}
.knob{position:absolute;left:50%;top:50%;width:52%;aspect-ratio:1;margin:-26% 0 0 -26%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#4a4156,#25202d 60%,#17131c);box-shadow:0 5px 8px rgba(0,0,0,.6),inset 0 0 0 2px #574c66,inset 0 -3px 0 rgba(0,0,0,.4);will-change:transform}
.knob::after{content:"";position:absolute;inset:26%;border-radius:50%;background:repeating-radial-gradient(circle,#2c2536 0 2px,#352d40 2px 4px)}
.stickzone.on .stick{box-shadow:inset 0 0 0 2px var(--teal),0 0 16px rgba(38,217,217,.35)}
.label{color:#a99cb8;font:800 clamp(9px,1.8vmin,13px) "Barlow Condensed",sans-serif;letter-spacing:.18em;text-align:center}
/* face buttons, labelled with what they do */
.face{display:grid;grid-template-columns:repeat(2,auto);gap:1.6vmin 2vmin;transform:rotate(-12deg)}
.face button{width:clamp(54px,14vmin,92px);aspect-ratio:1;border-radius:50%;border:0;color:#fff;font:800 clamp(11px,2.6vmin,17px) "Barlow Condensed",sans-serif;letter-spacing:.06em;
  box-shadow:0 5px 0 rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 6px rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(0,0,0,.4);touch-action:none}
.face .gas{background:radial-gradient(circle at 35% 30%,#7af0ea,#1fb5b5)}
.face .drift{background:radial-gradient(circle at 35% 30%,#ff8fcb,#e0247f)}
.face .fire{background:radial-gradient(circle at 35% 30%,#ffb07a,#ef4a2a)}
.face .door{background:radial-gradient(circle at 35% 30%,#ffe7a0,#e2a52a);color:#3a2408;text-shadow:none}
.small{display:flex;gap:2vmin}
.small div{display:flex;flex-direction:column;align-items:center;gap:.6vmin}
.small button{width:clamp(44px,10vmin,66px);height:clamp(16px,3.4vmin,22px);border-radius:999px;border:0;background:linear-gradient(#3a3245,#231d2b);box-shadow:0 3px 0 #08060b,inset 0 1px 0 rgba(255,255,255,.15);touch-action:none}
button:active,button.down{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.6),inset 0 2px 4px rgba(0,0,0,.4)!important;filter:brightness(1.1)}
.grille{display:grid;grid-template-columns:repeat(4,6px);gap:5px}
.grille i{width:6px;height:6px;border-radius:50%;background:#0b080f;box-shadow:inset 0 1px 1px rgba(0,0,0,.8)}
.back{position:fixed;left:12px;bottom:10px;color:var(--cream);font:700 13px "Barlow Condensed",sans-serif;text-decoration:none;opacity:.6;z-index:5}
/* landscape: grips either side of the screen, like a real handheld */
@media (orientation:landscape){
  .shell{grid-template-columns:auto auto auto;grid-template-areas:"left screen right";border-radius:44px 44px 70px 70px/44px 44px 90px 90px;max-width:100vw}
  .screenwrap{width:min(58vw,calc((100vh - 12vmin - 40px) * var(--ar) + 7.2vmin))}
  .left{grid-area:left;width:min(19vw,230px)}.right{grid-area:right;width:min(19vw,230px)}
}
/* portrait: screen on top, controls below */
@media (orientation:portrait){
  .shell{width:min(100vw,600px);grid-template-columns:1fr 1fr;grid-template-areas:"screen screen" "left right";border-radius:28px 28px 60px 60px;padding-top:4vmin}
  .screenwrap{width:100%}
  .left{grid-area:left}.right{grid-area:right}
  .stickzone{height:clamp(150px,44vmin,240px)}
}
</style>
</head>
<body>
<a class="back" href="/experiments/">← experiments</a>
<div class="shell" id="shell">
  <div class="grip left">
    <div class="stickzone" id="stickzone" aria-label="Stick: point where you want to go"><div class="stick" id="stick"><div class="knob" id="knob"></div></div></div>
    <div class="label">DRIVE · WALK</div>
    <div class="small"><div><button data-k="select" aria-label="Radio: next station or off"></button><span class="label">RADIO</span></div><div><button data-k="map" aria-label="Map"></button><span class="label">MAP</span></div></div>
  </div>
  <div class="screenwrap">
    <div class="print"><span><span class="lamp" id="lamp"></span>POWER</span><b>PALM CITY 8</b><span>COLOUR PORTABLE</span></div>
    <canvas id="c" width="336" height="224" aria-label="Palm City 8 game screen"></canvas>
    <div class="subhead">I can't afford GTA 6, so this is my GTA 6-bit 😂</div>
  </div>
  <div class="grip right">
    <div class="face">
      <button class="gas" data-k="a" aria-label="Gas">GAS</button><button class="fire" data-k="fire" aria-label="Fire">FIRE</button>
      <button class="drift" data-k="b" aria-label="Drift: hold while turning">DRIFT</button><button class="door" data-k="door" aria-label="Get in or out, talk">DOOR</button>
    </div>
    <div class="small"><div><button data-k="start" aria-label="Pause"></button><span class="label">PAUSE</span></div><div class="grille"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
