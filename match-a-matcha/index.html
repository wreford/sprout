<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f2e4">
<meta name="description" content="Match a Matcha — a serene little memory game with matcha, mochi, dango, and tea things. Flip cards, find pairs, chase your best time.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Match a Matcha">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,600;1,9..144,900&family=IBM+Plex+Mono:wght@400;600&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%234d7c56'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20'%3E🍵%3C/text%3E%3C/svg%3E">
<title>Match a Matcha</title>
<style>
:root{
  --cream:#f7f2e4;
  --cream-2:#efe6d0;
  --cream-3:#e6d9b8;
  --ink:#2e2517;
  --ink-2:#4a3d28;
  --dim:#8a7658;
  --dimmer:#b8a682;
  --matcha:#4d7c56;
  --matcha-dark:#2e5c3a;
  --matcha-mid:#6b9673;
  --matcha-light:#a8c9a3;
  --matcha-soft:#d8e8d1;
  --terra:#c88467;
  --gold:#d4a556;
  --line:rgba(46,37,23,.14);
  --line-2:rgba(46,37,23,.26);
  --disp:'Fraunces',Georgia,serif;
  --serif:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --squish:cubic-bezier(.34,1.56,.64,1);
  --pad-x:max(16px,env(safe-area-inset-left));
  --pad-x-r:max(16px,env(safe-area-inset-right));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%;overflow-x:hidden}
html,body{
  background:var(--cream);color:var(--ink);
  font-family:var(--sans);
  overscroll-behavior:none;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh
}
body{
  background:
    radial-gradient(70% 40% at 12% 0%, rgba(168,201,163,.34), transparent 60%),
    radial-gradient(60% 40% at 100% 20%, rgba(200,132,103,.16), transparent 62%),
    radial-gradient(70% 50% at 50% 100%, rgba(212,165,86,.16), transparent 60%),
    var(--cream);
  position:relative
}
button,a,input,select{touch-action:manipulation}
button{background:none;border:none;cursor:pointer;color:inherit;font:inherit}
::selection{background:rgba(107,150,115,.32)}

/* Header */
.hero{
  max-width:820px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 26px) var(--pad-x-r) 8px var(--pad-x);
  text-align:center;position:relative
}
.hero .kicker{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;color:var(--matcha);text-transform:uppercase;font-weight:700;
  display:inline-flex;align-items:center;gap:12px;margin-bottom:6px
}
.hero .kicker::before,.hero .kicker::after{content:"";width:26px;height:1px;background:currentColor;opacity:.5}
.hero h1{
  font-family:var(--disp);font-weight:900;font-style:italic;
  font-size:clamp(38px,9vw,58px);line-height:.92;letter-spacing:-.035em;
  color:var(--ink)
}
.hero h1 .a{color:var(--matcha)}
.hero h1 .m{color:var(--terra);font-family:var(--disp);font-weight:900;font-style:italic}

/* HUD */
.hud{
  max-width:520px;margin:14px auto 12px;
  padding:0 var(--pad-x-r) 0 var(--pad-x);
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px
}
.hud .stat{
  padding:11px 10px;border-radius:16px;
  background:linear-gradient(180deg,#fff,var(--cream-2));
  border:1px solid var(--line);
  text-align:center;
  box-shadow:0 4px 12px rgba(46,37,23,.06),inset 0 1px 0 rgba(255,255,255,.9)
}
.hud .stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;font-weight:700}
.hud .stat .v{font-family:var(--disp);font-weight:900;font-size:22px;color:var(--ink);letter-spacing:-.015em;margin-top:2px;font-variant-numeric:tabular-nums}
.hud .stat.matcha .v{color:var(--matcha)}
.hud .stat.pop{animation:pop .35s var(--squish)}
@keyframes pop{0%,100%{transform:scale(1)}30%{transform:scale(1.08)}}

/* Grid */
.board-wrap{max-width:520px;margin:0 auto;padding:14px var(--pad-x-r) 0 var(--pad-x)}
.board{
  display:grid;gap:8px;
  grid-template-columns:repeat(var(--cols,4),1fr)
}
.tile{
  position:relative;aspect-ratio:1/1;perspective:900px;
  cursor:pointer;
  animation:tile-in .35s var(--squish) both
}
@keyframes tile-in{from{opacity:0;transform:scale(.85) translateY(6px)}to{opacity:1;transform:none}}
.tile.matched{cursor:default}
.tile .face,.tile .back{
  position:absolute;inset:0;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:transform .5s var(--squish);
  box-shadow:0 8px 20px rgba(46,37,23,.16),inset 0 1px 0 rgba(255,255,255,.32)
}
.tile .back{
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.28), transparent 60%),
    linear-gradient(160deg,var(--matcha) 0%,var(--matcha-dark) 100%);
  border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.88);
  transform:rotateY(0deg)
}
.tile .back::after{
  content:"";position:absolute;inset:6px;border-radius:11px;
  border:1px dashed rgba(255,255,255,.22);
  background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.14), transparent 70%)
}
.tile .back .mark{
  font-family:var(--disp);font-style:italic;font-weight:900;font-size:22px;
  letter-spacing:-.03em;text-shadow:0 2px 6px rgba(0,0,0,.24);
  position:relative;z-index:1;color:rgba(255,255,255,.55)
}
.tile .face{
  background:linear-gradient(180deg,#fff,var(--cream-2));
  border:1px solid var(--line);
  color:var(--ink);
  transform:rotateY(180deg);
  font-size:min(48px,10vw);
  overflow:hidden;padding:0
}
.tile .face img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  background:var(--cream-2)
}
.tile .face .cap{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:6px 8px 7px;
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;
  color:#fff;text-transform:uppercase;text-align:center;line-height:1.15;
  background:linear-gradient(180deg,transparent,rgba(46,37,23,.9));
  text-shadow:0 1px 3px rgba(0,0,0,.6);
  opacity:0;transition:opacity .35s var(--ease) .1s;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.tile.matched .face .cap{opacity:1}
.tile .face .emo{font-size:min(48px,10vw);position:relative;z-index:1}
.tile.flipped .back{transform:rotateY(-180deg)}
.tile.flipped .face{transform:rotateY(0deg)}
.tile.matched .face{
  background:linear-gradient(180deg,var(--matcha-soft),#c9dfc2);
  border-color:rgba(107,150,115,.4);
  animation:matched .55s var(--squish)
}
@keyframes matched{
  0%{transform:rotateY(0) scale(1)}
  30%{transform:rotateY(0) scale(1.12);box-shadow:0 12px 32px rgba(77,124,86,.42),0 0 0 3px rgba(107,150,115,.5),inset 0 1px 0 rgba(255,255,255,.7)}
  100%{transform:rotateY(0) scale(1);box-shadow:0 6px 16px rgba(77,124,86,.24),inset 0 1px 0 rgba(255,255,255,.7)}
}
.tile.wrong .face{animation:wrong .5s ease}
@keyframes wrong{0%,100%{transform:rotateY(0) translateX(0)}25%{transform:rotateY(0) translateX(-8px)}50%{transform:rotateY(0) translateX(8px)}75%{transform:rotateY(0) translateX(-4px)}}

/* Controls */
.controls{
  max-width:520px;margin:20px auto 0;
  padding:0 var(--pad-x-r) 12px var(--pad-x);
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center
}
.chip{
  padding:9px 14px;border-radius:100px;
  background:#fff;border:1.5px solid var(--line);color:var(--ink);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  min-height:40px;cursor:pointer;
  transition:all .16s var(--squish);
  box-shadow:0 4px 10px rgba(46,37,23,.06),inset 0 1px 0 rgba(255,255,255,.9)
}
.chip:hover{transform:translateY(-1px);border-color:var(--matcha);color:var(--matcha)}
.chip.on{background:linear-gradient(180deg,var(--matcha),var(--matcha-dark));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(77,124,86,.34),inset 0 1px 0 rgba(255,255,255,.28)}
.chip.new{
  background:linear-gradient(180deg,var(--terra),#a66451);color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(200,132,103,.34),inset 0 1px 0 rgba(255,255,255,.28)
}

footer{max-width:820px;margin:14px auto 0;padding:12px var(--pad-x-r) calc(env(safe-area-inset-bottom) + 18px) var(--pad-x);text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
footer a{color:var(--matcha);text-decoration:none;border-bottom:1px dotted var(--dimmer)}

/* Win modal */
.modal{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(46,37,23,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
}
.modal.show{display:flex;animation:mf .3s var(--ease)}
@keyframes mf{from{opacity:0}to{opacity:1}}
.mcard{
  width:100%;max-width:380px;text-align:center;
  padding:32px 28px 24px;border-radius:24px;
  background:linear-gradient(180deg,#fff,var(--cream));
  border:1px solid var(--line);
  box-shadow:0 30px 60px rgba(46,37,23,.42);
  animation:mc-in .45s var(--squish) both;position:relative
}
@keyframes mc-in{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
.mcard .m-icon{
  width:82px;height:82px;border-radius:50%;
  background:linear-gradient(160deg,var(--matcha),var(--matcha-dark));
  display:flex;align-items:center;justify-content:center;font-size:44px;
  margin:0 auto 14px;
  box-shadow:0 14px 28px rgba(77,124,86,.42),inset 0 2px 0 rgba(255,255,255,.32);
  animation:bowl-in .6s var(--squish) both
}
@keyframes bowl-in{0%{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.14) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.mcard .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;color:var(--matcha);text-transform:uppercase;font-weight:700;margin-bottom:6px}
.mcard h2{font-family:var(--disp);font-weight:900;font-style:italic;font-size:34px;color:var(--ink);letter-spacing:-.025em;line-height:1;margin-bottom:14px}
.mcard .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.mcard .stats .cell{padding:12px;border-radius:14px;background:var(--cream-2);border:1px solid var(--line)}
.mcard .stats .cell .k2{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;font-weight:700}
.mcard .stats .cell .v2{font-family:var(--disp);font-weight:900;font-size:22px;color:var(--ink);letter-spacing:-.015em;margin-top:3px;font-variant-numeric:tabular-nums}
.mcard .stats .cell.best .v2{color:var(--gold)}
.mcard .stats .cell.best.new .v2::after{content:" ★";color:var(--gold)}
.mcard .btnrow{display:flex;gap:8px}
.mcard .btnrow .chip{flex:1;justify-content:center;text-align:center;display:inline-flex;align-items:center;justify-content:center;min-height:48px;font-size:11px}

/* Confetti — light petals falling on win */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:210;overflow:hidden}
.confetti span{position:absolute;top:-30px;font-size:22px;animation:fall linear forwards;opacity:.94}
@keyframes fall{
  0%{transform:translateY(-40px) rotate(0);opacity:0}
  10%{opacity:1}
  100%{transform:translateY(110dvh) rotate(720deg);opacity:.85}
}

/* Toast */
.toast{
  position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);
  z-index:180;padding:9px 16px;background:rgba(46,37,23,.94);color:#fff;
  border-radius:100px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  box-shadow:0 10px 24px rgba(46,37,23,.4);
  animation:tin .28s var(--ease),tout .28s 1.6s var(--ease) forwards;pointer-events:none
}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes tout{to{opacity:0;transform:translate(-50%,10px)}}
</style>
</head>
<body>

<header class="hero">
  <div class="kicker">A serene little game</div>
  <h1><span class="a">Match</span> a <em class="m">Matcha</em></h1>
</header>

<div class="hud">
  <div class="stat"><div class="k">Moves</div><div class="v" id="movesV">0</div></div>
  <div class="stat matcha"><div class="k">Time</div><div class="v" id="timeV">0:00</div></div>
  <div class="stat"><div class="k">Best</div><div class="v" id="bestV">—</div></div>
</div>

<div class="board-wrap">
  <div class="board" id="board" style="--cols:4"></div>
</div>

<div class="controls">
  <button class="chip" data-diff="easy">Easy · 3×4</button>
  <button class="chip on" data-diff="med">Medium · 4×4</button>
  <button class="chip" data-diff="hard">Hard · 4×6</button>
  <button class="chip new" id="newBtn">New game</button>
</div>

<footer>Match a Matcha · a memory game · <a href="/">back to taskiap</a></footer>

<div class="modal" id="modal">
  <div class="mcard">
    <div class="m-icon">🍵</div>
    <div class="k">You did it</div>
    <h2 id="winTitle">Nicely poured.</h2>
    <div class="stats">
      <div class="cell"><div class="k2">Moves</div><div class="v2" id="wMoves">0</div></div>
      <div class="cell"><div class="k2">Time</div><div class="v2" id="wTime">0:00</div></div>
      <div class="cell"><div class="k2">Pairs</div><div class="v2" id="wPairs">0</div></div>
      <div class="cell best" id="wBestCell"><div class="k2">Best time</div><div class="v2" id="wBest">—</div></div>
    </div>
    <div class="btnrow">
      <button class="chip" id="againBtn">Again</button>
      <button class="chip new" id="nextBtn">New round</button>
    </div>
  </div>
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);
const ICONS = ['🍵','🌱','🍡','🍥','🥠','🍘','🌸','🍯','🫖','🍰','🌿','🥮','🎋','🧋','🌺','🥟','🍙','🍦'];
const DIFFS = {
  easy: { cols:3, rows:4, name:'Easy · 3×4' },
  med:  { cols:4, rows:4, name:'Medium · 4×4' },
  hard: { cols:4, rows:6, name:'Hard · 4×6' }
};

const state = {
  diff: localStorage.getItem('mam-diff') || 'med',
  moves: 0,
  seconds: 0,
  timer: null,
  first: null,
  lock: false,
  matched: 0,
  total: 0,
  best: {},         // per diff → seconds
  items: [],        // { id, name, image } — real matcha/Japanese photos
  loading: false
};
try { state.best = JSON.parse(localStorage.getItem('mam-best') || '{}'); } catch(e) {}

/* ═══════════════════════════════════════════════════════
   Fetch real matcha / Japanese recipe images
   TheMealDB (search + Japanese area) with LoremFlickr fallback.
   Cache 24h in localStorage so we don't hammer the API.
   ═══════════════════════════════════════════════════════ */
const POOL_KEY = 'mam-pool-v1';
const POOL_TTL_MS = 24 * 60 * 60 * 1000;

function loadPoolCache() {
  try {
    const raw = JSON.parse(localStorage.getItem(POOL_KEY) || 'null');
    if (!raw || !raw.ts || Date.now() - raw.ts > POOL_TTL_MS) return null;
    return raw.items || null;
  } catch(e) { return null; }
}
function savePoolCache(items) {
  try { localStorage.setItem(POOL_KEY, JSON.stringify({ ts: Date.now(), items })); } catch(e) {}
}

async function fetchPool() {
  const queries = ['matcha','green tea','tea','mochi','dango','soba','tofu','miso'];
  const cocktails = ['matcha','green tea','sake'];
  const seen = new Map(); // id → { id, name, image }

  const takeMeal = m => {
    if (!m || !m.idMeal || !m.strMealThumb) return;
    if (seen.has('m'+m.idMeal)) return;
    seen.set('m'+m.idMeal, { id:'m'+m.idMeal, name:m.strMeal, image:m.strMealThumb });
  };
  const takeDrink = d => {
    if (!d || !d.idDrink || !d.strDrinkThumb) return;
    if (seen.has('d'+d.idDrink)) return;
    seen.set('d'+d.idDrink, { id:'d'+d.idDrink, name:d.strDrink, image:d.strDrinkThumb });
  };

  // Fire all queries in parallel
  const mealSearches = queries.map(q =>
    fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(q)}`)
      .then(r => r.json()).then(j => (j.meals || []).forEach(takeMeal))
      .catch(() => {})
  );
  const drinkSearches = cocktails.map(q =>
    fetch(`https://www.thecocktaildb.com/api/json/v1/1/search.php?s=${encodeURIComponent(q)}`)
      .then(r => r.json()).then(j => (j.drinks || []).forEach(takeDrink))
      .catch(() => {})
  );
  const japaneseFilter = fetch('https://www.themealdb.com/api/json/v1/1/filter.php?a=Japanese')
    .then(r => r.json()).then(j => (j.meals || []).forEach(m => takeMeal({
      idMeal: m.idMeal, strMeal: m.strMeal, strMealThumb: m.strMealThumb
    }))).catch(() => {});

  await Promise.all([...mealSearches, ...drinkSearches, japaneseFilter]);
  const items = [...seen.values()];
  return items;
}

async function ensurePool() {
  if (state.items.length >= 12) return;
  const cached = loadPoolCache();
  if (cached && cached.length >= 12) { state.items = cached; return; }
  if (state.loading) return;
  state.loading = true;
  try {
    const items = await fetchPool();
    if (items.length >= 12) {
      state.items = items;
      savePoolCache(items);
    } else {
      // Fall back to LoremFlickr matcha keyword — always available
      const kws = ['matcha','tea,green','japanese,dessert','mochi','dango','wagashi','tofu','miso','ramen','sushi','tempura','ceremony'];
      state.items = kws.map((kw, i) => ({
        id:'lf'+i, name:kw.replace(/,/g,' & '),
        image:`https://loremflickr.com/500/500/${encodeURIComponent(kw)}?lock=${i+1}`
      }));
    }
  } catch(e) {
    state.items = [];
  } finally { state.loading = false; }
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${String(sec).padStart(2, '0')}`;
}
function saveBest() { try { localStorage.setItem('mam-best', JSON.stringify(state.best)); } catch(e) {} }

function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function newGame() {
  clearInterval(state.timer); state.timer = null;
  state.moves = 0; state.seconds = 0;
  state.first = null; state.lock = false;
  state.matched = 0;
  const d = DIFFS[state.diff] || DIFFS.med;
  const pairs = (d.cols * d.rows) / 2;
  state.total = pairs;

  // Prefer real photos when we have enough; otherwise emoji fallback
  let chosen;
  const useReal = state.items && state.items.length >= pairs;
  if (useReal) {
    chosen = shuffle(state.items).slice(0, pairs).map(x => ({ key:x.id, name:x.name, image:x.image }));
  } else {
    chosen = shuffle(ICONS).slice(0, pairs).map(icon => ({ key:icon, name:'', emoji:icon }));
  }
  const deck = shuffle(chosen.concat(chosen));

  const board = $('board');
  board.style.setProperty('--cols', d.cols);
  board.innerHTML = '';
  deck.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'tile';
    el.dataset.i = i;
    el.dataset.key = item.key;
    el.style.animationDelay = (i * 18) + 'ms';
    const face = item.image
      ? `<img src="${esc(item.image)}" alt="${esc(item.name)}" loading="lazy"><div class="cap">${esc(item.name)}</div>`
      : `<span class="emo">${item.emoji}</span>`;
    el.innerHTML = `<div class="back"><span class="mark">MM</span></div><div class="face">${face}</div>`;
    el.addEventListener('click', () => onTap(el));
    board.appendChild(el);
  });

  updateHUD();
  document.querySelectorAll('.chip[data-diff]').forEach(c => c.classList.toggle('on', c.dataset.diff === state.diff));

  // If we don't have a pool yet, load one and refresh on next round
  if (!useReal && !state.loading) ensurePool();
}

function onTap(el) {
  if (state.lock) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (!state.timer) startTimer();
  el.classList.add('flipped');

  if (!state.first) {
    state.first = el;
    return;
  }
  if (state.first === el) return;
  state.moves++;
  updateHUD(true);

  const a = state.first, b = el;
  if (a.dataset.key === b.dataset.key) {
    // Match
    state.lock = true;
    setTimeout(() => {
      a.classList.add('matched'); b.classList.add('matched');
      state.matched++;
      state.first = null; state.lock = false;
      if (state.matched === state.total) win();
    }, 220);
  } else {
    // Miss — brief shake, then flip back
    state.lock = true;
    a.classList.add('wrong'); b.classList.add('wrong');
    setTimeout(() => {
      a.classList.remove('flipped', 'wrong');
      b.classList.remove('flipped', 'wrong');
      state.first = null; state.lock = false;
    }, 780);
  }
}

function startTimer() {
  state.timer = setInterval(() => {
    state.seconds++;
    $('timeV').textContent = fmtTime(state.seconds);
  }, 1000);
}

function updateHUD(pop) {
  $('movesV').textContent = state.moves;
  $('timeV').textContent = fmtTime(state.seconds);
  const best = state.best[state.diff];
  $('bestV').textContent = best ? fmtTime(best) : '—';
  if (pop) {
    const el = $('movesV').parentElement;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  }
}

function win() {
  clearInterval(state.timer); state.timer = null;
  const prev = state.best[state.diff] || 0;
  const isBest = !prev || state.seconds < prev;
  if (isBest) { state.best[state.diff] = state.seconds; saveBest(); }
  const d = DIFFS[state.diff];
  $('wMoves').textContent = state.moves;
  $('wTime').textContent = fmtTime(state.seconds);
  $('wPairs').textContent = state.total;
  $('wBest').textContent = fmtTime(state.best[state.diff] || state.seconds);
  $('wBestCell').classList.toggle('new', isBest);
  const eff = state.total / Math.max(1, state.moves);
  const title = eff > 0.7 ? 'Cha-do master.'
              : eff > 0.55 ? 'Nicely poured.'
              : eff > 0.4  ? 'Steady hand.'
              : 'Zen achieved.';
  $('winTitle').textContent = title;
  $('modal').classList.add('show');
  updateHUD();
  confetti();
}

function confetti() {
  const c = document.createElement('div');
  c.className = 'confetti';
  const items = ['🌸','🌿','🍵','🌱','✨','🍡'];
  const N = 32;
  for (let i = 0; i < N; i++) {
    const s = document.createElement('span');
    s.textContent = items[Math.floor(Math.random() * items.length)];
    s.style.left = (Math.random() * 100) + '%';
    s.style.animationDuration = (2.4 + Math.random() * 2.6) + 's';
    s.style.animationDelay = (Math.random() * 0.6) + 's';
    s.style.fontSize = (16 + Math.random() * 18) + 'px';
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 5200);
}

function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

/* Wire */
document.querySelectorAll('.chip[data-diff]').forEach(c => c.addEventListener('click', () => {
  if (state.diff === c.dataset.diff) return;
  state.diff = c.dataset.diff;
  try { localStorage.setItem('mam-diff', state.diff); } catch(e) {}
  newGame();
}));
$('newBtn').addEventListener('click', () => { newGame(); toast('New round poured'); });
$('againBtn').addEventListener('click', () => { $('modal').classList.remove('show'); newGame(); });
$('nextBtn').addEventListener('click', () => {
  $('modal').classList.remove('show');
  const order = ['easy','med','hard'];
  const idx = order.indexOf(state.diff);
  state.diff = order[(idx + 1) % order.length];
  try { localStorage.setItem('mam-diff', state.diff); } catch(e) {}
  newGame();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').classList.remove('show'); });

async function init() {
  // Try the localStorage cache first for an instant start with real photos
  const cached = loadPoolCache();
  if (cached && cached.length >= 12) state.items = cached;
  newGame();
  // If we started with fallback emojis, load the pool in the background
  // and swap on the next round
  if (!state.items.length) {
    await ensurePool();
    // If a game is in progress, don't disturb — the fetched pool
    // will be used on the next "new game" / "again" / diff change.
  }
}
init();
</script>
</body>
</html>
