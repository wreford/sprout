<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#95d67a">
<meta name="description" content="Match a Matcha — a fast, chunky memory match. Only matcha. Score points, keep a combo, beat the clock.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Match a Matcha">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,900&family=IBM+Plex+Mono:wght@600;700&family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23a1e56b'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='19'%3E🍵%3C/text%3E%3C/svg%3E">
<title>Match a Matcha</title>
<style>
:root{
  --mint:#c9f7a8;
  --mint-2:#a1e56b;
  --matcha:#7bc142;
  --matcha-2:#5a9e2a;
  --matcha-3:#3d7a1a;
  --leaf:#2b5511;
  --cream:#fff9e8;
  --cream-2:#f7ecc8;
  --ink:#111a08;
  --ink-2:#2b3b18;
  --white:#fff;
  --pop:#ff5aa8;
  --pop-2:#ff2d84;
  --sun:#ffd23f;
  --electric:#c1ff2f;
  --disp:'Fraunces',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --squish:cubic-bezier(.34,1.56,.64,1);
  --pad-x:max(14px,env(safe-area-inset-left));
  --pad-x-r:max(14px,env(safe-area-inset-right));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%;overflow:hidden}
html,body{
  color:var(--ink);font-family:var(--sans);
  overscroll-behavior:none;overflow:hidden;
  -webkit-font-smoothing:antialiased
}
body{
  position:fixed;inset:0;width:100%;height:100%;
  background:
    radial-gradient(70% 45% at 10% 0%, rgba(193,255,47,.55), transparent 62%),
    radial-gradient(60% 40% at 100% 24%, rgba(255,90,168,.35), transparent 62%),
    radial-gradient(70% 50% at 50% 110%, rgba(255,210,63,.55), transparent 62%),
    linear-gradient(180deg,#f9ffe4 0%,var(--mint) 45%,var(--mint-2) 100%)
}
body::before{
  content:"";position:fixed;inset:-10%;pointer-events:none;z-index:0;
  background:
    radial-gradient(30% 24% at 22% 30%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(28% 22% at 78% 62%, rgba(255,255,255,.3), transparent 62%);
  filter:blur(30px);
  animation:blob 14s ease-in-out infinite alternate
}
@keyframes blob{0%{transform:translate3d(-3%,-2%,0)}100%{transform:translate3d(3%,2%,0)}}
button,a,input{touch-action:manipulation}
button{background:none;border:none;cursor:pointer;color:inherit;font:inherit}
::selection{background:rgba(255,45,132,.28)}

/* Header */
.hero{
  padding:calc(env(safe-area-inset-top) + 14px) var(--pad-x-r) 8px var(--pad-x);
  text-align:center;position:relative;z-index:2
}
.hero .kicker{
  display:inline-flex;align-items:center;gap:8px;
  padding:5px 12px;border-radius:100px;
  background:var(--leaf);color:var(--electric);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;
  box-shadow:0 4px 12px rgba(43,85,17,.34)
}
.hero .kicker::before{content:"🍵"}
.hero h1{
  font-family:var(--disp);font-weight:900;font-style:italic;
  font-size:clamp(38px,10vw,58px);line-height:.92;letter-spacing:-.045em;
  color:var(--leaf);margin-top:6px;
  text-shadow:0 3px 0 rgba(255,255,255,.5),0 6px 16px rgba(43,85,17,.14)
}
.hero h1 .a{color:var(--matcha-3);font-weight:700;font-style:normal;padding:0 .12em}
.hero h1 em{color:var(--pop);font-style:italic;font-weight:900}

/* HUD — score, timer, combo */
.hud{
  position:relative;z-index:2;
  max-width:520px;margin:14px auto 6px;
  padding:0 var(--pad-x-r) 0 var(--pad-x);
  display:grid;grid-template-columns:1.4fr .8fr 1fr;gap:8px
}
.hud .cell{
  padding:11px 14px;border-radius:18px;
  background:var(--white);border:2.5px solid var(--leaf);
  box-shadow:0 5px 0 var(--leaf),0 12px 24px rgba(43,85,17,.16);
  position:relative;overflow:hidden
}
.hud .cell .k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--matcha-3);text-transform:uppercase;font-weight:700}
.hud .cell .v{font-family:var(--disp);font-weight:900;font-size:26px;color:var(--leaf);letter-spacing:-.025em;line-height:1;margin-top:2px;font-variant-numeric:tabular-nums}
.hud .cell.pop .v{animation:hud-pop .38s var(--squish)}
@keyframes hud-pop{0%{transform:scale(1);color:var(--leaf)}30%{transform:scale(1.28);color:var(--pop)}100%{transform:scale(1);color:var(--leaf)}}
.hud .cell.combo{background:linear-gradient(180deg,var(--sun),#ffb324);border-color:var(--leaf)}
.hud .cell.combo .k{color:var(--leaf)}
.hud .cell.combo .v{color:var(--leaf)}
.hud .cell.combo.hot{background:linear-gradient(180deg,var(--pop),var(--pop-2));border-color:var(--leaf)}
.hud .cell.combo.hot .v,.hud .cell.combo.hot .k{color:var(--white)}
.hud .cell.combo .v::before{content:"🔥 ";font-size:20px;line-height:1}

/* Timer bar (its own row) */
.timerbar-wrap{
  max-width:520px;margin:8px auto 0;
  padding:0 var(--pad-x-r) 0 var(--pad-x);
  position:relative;z-index:2
}
.timerbar{
  height:12px;border-radius:100px;
  background:var(--white);border:2.5px solid var(--leaf);
  overflow:hidden;position:relative;
  box-shadow:0 4px 0 var(--leaf),0 10px 20px rgba(43,85,17,.14)
}
.timerbar .fill{
  height:100%;width:100%;
  background:linear-gradient(90deg,var(--matcha),var(--electric));
  transform-origin:left;transition:transform 1s linear;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)
}
.timerbar.low .fill{background:linear-gradient(90deg,#ffb324,var(--sun))}
.timerbar.critical .fill{background:linear-gradient(90deg,var(--pop),var(--pop-2));animation:crit .6s ease-in-out infinite alternate}
@keyframes crit{0%{opacity:1}100%{opacity:.75}}

/* Board */
.board-wrap{
  max-width:520px;margin:0 auto;
  padding:14px var(--pad-x-r) 0 var(--pad-x);
  position:relative;z-index:2
}
.board{display:grid;gap:8px;grid-template-columns:repeat(var(--cols,4),1fr);perspective:1200px}
.tile{
  position:relative;aspect-ratio:1/1;perspective:900px;cursor:pointer;
  animation:tile-in .35s var(--squish) both
}
@keyframes tile-in{from{opacity:0;transform:scale(.7) translateY(10px)}to{opacity:1;transform:none}}
.tile.matched{cursor:default}
.tile .face,.tile .back{
  position:absolute;inset:0;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:transform .5s var(--squish)
}
/* Card back — matcha diagonal stripes with a glossy top */
.tile .back{
  background:
    repeating-linear-gradient(135deg, var(--matcha) 0 12px, var(--matcha-2) 12px 24px);
  border:2.5px solid var(--leaf);
  box-shadow:0 6px 0 var(--leaf),0 10px 20px rgba(43,85,17,.24);
  transform:rotateY(0deg);overflow:hidden
}
.tile .back::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.36) 0%,rgba(255,255,255,.08) 32%,transparent 60%)
}
.tile .back .mark{
  position:relative;z-index:1;
  font-family:var(--disp);font-weight:900;font-style:italic;font-size:26px;
  letter-spacing:-.04em;color:var(--electric);
  text-shadow:0 2px 0 var(--leaf),0 3px 8px rgba(0,0,0,.28)
}
/* Card face — real matcha photo */
.tile .face{
  background:var(--white);
  border:2.5px solid var(--leaf);
  box-shadow:0 6px 0 var(--leaf),0 10px 22px rgba(43,85,17,.22);
  transform:rotateY(180deg);overflow:hidden
}
.tile .face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--cream-2)}
.tile .face .cap{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:6px 8px 7px;
  font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.02em;
  color:var(--white);text-align:center;line-height:1.15;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.85));
  text-shadow:0 1px 3px rgba(0,0,0,.6);
  opacity:0;transition:opacity .3s var(--ease) .12s;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.tile.matched .face .cap{opacity:1}
.tile .face .emo{font-size:min(56px,11vw);position:relative;z-index:1}
/* Glossy sheen on face */
.tile .face::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.38) 0%,transparent 30%);
  border-radius:16px 16px 0 0
}
.tile.flipped .back{transform:rotateY(-180deg)}
.tile.flipped .face{transform:rotateY(0deg)}
.tile.matched{animation:matched-pop .55s var(--squish)}
@keyframes matched-pop{
  0%{transform:scale(1)}
  30%{transform:scale(1.16) rotate(-2deg)}
  55%{transform:scale(1.08) rotate(2deg)}
  100%{transform:scale(1) rotate(0)}
}
.tile.matched .face{
  border-color:var(--pop);
  box-shadow:0 6px 0 var(--pop-2),0 12px 32px rgba(255,90,168,.5)
}
.tile.wrong .face{animation:wrong .5s ease}
@keyframes wrong{0%,100%{transform:rotateY(0) translateX(0)}20%,60%{transform:rotateY(0) translateX(-8px)}40%,80%{transform:rotateY(0) translateX(8px)}}

/* Floating +points popup */
.points-pop{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) translateY(0);
  z-index:100;pointer-events:none;
  font-family:var(--disp);font-weight:900;font-style:italic;font-size:44px;
  letter-spacing:-.03em;color:var(--white);
  text-shadow:0 3px 0 var(--pop-2),0 6px 22px rgba(0,0,0,.35);
  animation:pt-float 1.1s var(--squish) forwards
}
@keyframes pt-float{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}
  100%{opacity:0;transform:translate(-50%,-120%) scale(1)}
}
/* Confetti burst (tile-local) */
.burst{
  position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:6
}
.burst span{
  position:absolute;left:50%;top:50%;font-size:18px;
  animation:burst .9s var(--squish) forwards;opacity:0
}
@keyframes burst{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  10%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--tx,0px)), calc(-50% + var(--ty,-80px))) scale(1) rotate(var(--r,180deg))}
}

/* Controls */
.controls{
  position:relative;z-index:2;
  max-width:520px;margin:14px auto 0;
  padding:0 var(--pad-x-r) 8px var(--pad-x);
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center
}
.chip{
  padding:11px 16px;border-radius:100px;
  background:var(--white);border:2.5px solid var(--leaf);color:var(--leaf);
  font-family:var(--sans);font-size:12px;letter-spacing:.02em;font-weight:800;
  min-height:44px;cursor:pointer;
  transition:transform .14s var(--squish),background .16s;
  box-shadow:0 4px 0 var(--leaf)
}
.chip:hover{transform:translateY(-2px)}
.chip:active{transform:translateY(1px);box-shadow:0 2px 0 var(--leaf)}
.chip.on{background:var(--leaf);color:var(--electric)}
.chip.new{background:linear-gradient(180deg,var(--pop),var(--pop-2));color:var(--white);border-color:var(--leaf);box-shadow:0 5px 0 var(--leaf)}
.chip.new::before{content:"↻ ";font-weight:900}

footer{position:relative;z-index:2;max-width:520px;margin:10px auto 0;padding:8px var(--pad-x-r) calc(env(safe-area-inset-bottom) + 14px) var(--pad-x);text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--leaf);text-transform:uppercase;font-weight:700;opacity:.7}
footer a{color:var(--leaf);text-decoration:none;border-bottom:1px dotted var(--leaf)}

/* Modal · win + game over */
.modal{
  position:fixed;inset:0;z-index:220;display:none;
  align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at center,rgba(43,85,17,.72),rgba(43,85,17,.94));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}
.modal.show{display:flex;animation:mf .3s var(--ease)}
@keyframes mf{from{opacity:0}to{opacity:1}}
.mcard{
  width:100%;max-width:380px;text-align:center;
  padding:30px 26px 22px;border-radius:26px;
  background:var(--white);border:3px solid var(--leaf);
  box-shadow:0 8px 0 var(--leaf),0 30px 60px rgba(0,0,0,.5);
  animation:mc-in .45s var(--squish) both;position:relative
}
@keyframes mc-in{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:none}}
.mcard .m-icon{
  width:78px;height:78px;border-radius:26px;
  background:linear-gradient(160deg,var(--matcha-2),var(--matcha-3));
  border:3px solid var(--leaf);
  display:flex;align-items:center;justify-content:center;font-size:40px;
  margin:0 auto 14px;
  box-shadow:0 6px 0 var(--leaf);
  animation:bowl-in .65s var(--squish) both
}
@keyframes bowl-in{0%{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.12) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.mcard .k{font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--matcha-3);text-transform:uppercase;font-weight:700;margin-bottom:4px}
.mcard h2{font-family:var(--disp);font-weight:900;font-style:italic;font-size:34px;color:var(--leaf);letter-spacing:-.03em;line-height:1;margin-bottom:6px}
.mcard .big-score{
  font-family:var(--disp);font-weight:900;font-style:italic;font-size:64px;
  color:var(--pop);letter-spacing:-.04em;line-height:1;
  text-shadow:0 3px 0 var(--leaf);
  margin:14px 0 6px;font-variant-numeric:tabular-nums;
  animation:score-count .5s var(--squish) both
}
@keyframes score-count{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.mcard .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:14px 0 18px}
.mcard .stats .cell{padding:8px 6px;border-radius:12px;background:var(--cream);border:2px solid var(--leaf)}
.mcard .stats .cell .k2{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--matcha-3);text-transform:uppercase;font-weight:700}
.mcard .stats .cell .v2{font-family:var(--disp);font-weight:900;font-size:18px;color:var(--leaf);letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.mcard .stats .cell.best.new .v2::after{content:" ★";color:var(--sun)}
.mcard .btnrow{display:flex;gap:8px}
.mcard .btnrow .chip{flex:1;justify-content:center;text-align:center;display:inline-flex;align-items:center;justify-content:center;min-height:48px;font-size:12px}

/* Confetti (global on win) */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:240;overflow:hidden}
.confetti span{position:absolute;top:-30px;font-size:22px;animation:fall linear forwards;opacity:.94}
@keyframes fall{
  0%{transform:translateY(-40px) rotate(0);opacity:0}
  10%{opacity:1}
  100%{transform:translateY(110dvh) rotate(720deg);opacity:.85}
}

/* Toast */
.toast{
  position:fixed;bottom:calc(env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%);
  z-index:180;padding:10px 18px;background:var(--leaf);color:var(--electric);
  border-radius:100px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;font-weight:700;
  box-shadow:0 6px 0 var(--matcha-3);
  animation:tin .28s var(--ease),tout .28s 1.6s var(--ease) forwards;pointer-events:none
}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes tout{to{opacity:0;transform:translate(-50%,10px)}}
</style>
</head>
<body>

<header class="hero">
  <div class="kicker">Matcha only · beat the clock</div>
  <h1>Match <span class="a">a</span> <em>Matcha</em></h1>
</header>

<div class="hud">
  <div class="cell" id="scoreCell"><div class="k">Score</div><div class="v" id="scoreV">0</div></div>
  <div class="cell" id="pairsCell"><div class="k">Pairs</div><div class="v" id="pairsV">0/0</div></div>
  <div class="cell combo" id="comboCell"><div class="k">Combo</div><div class="v" id="comboV">0</div></div>
</div>

<div class="timerbar-wrap">
  <div class="timerbar" id="timerbar"><div class="fill" id="timerFill"></div></div>
</div>

<div class="board-wrap">
  <div class="board" id="board" style="--cols:4"></div>
</div>

<div class="controls">
  <button class="chip" data-diff="easy">Easy · 3×4</button>
  <button class="chip on" data-diff="med">Medium · 4×4</button>
  <button class="chip" data-diff="hard">Hard · 4×6</button>
  <button class="chip new" id="newBtn">New game</button>
</div>

<footer>Only Matcha · <a href="/">back to taskiap</a></footer>

<div class="modal" id="modal">
  <div class="mcard">
    <div class="m-icon" id="mIcon">🍵</div>
    <div class="k" id="mTag">You did it</div>
    <h2 id="winTitle">Whisked to perfection.</h2>
    <div class="big-score" id="wBigScore">0</div>
    <div class="stats">
      <div class="cell"><div class="k2">Pairs</div><div class="v2" id="wPairs">0</div></div>
      <div class="cell"><div class="k2">Combo</div><div class="v2" id="wCombo">0</div></div>
      <div class="cell best" id="wBestCell"><div class="k2">Best</div><div class="v2" id="wBest">—</div></div>
    </div>
    <div class="btnrow">
      <button class="chip" id="againBtn">Again</button>
      <button class="chip new" id="nextBtn">Next level</button>
    </div>
  </div>
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);
const rand = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const ICONS = ['🍵','🌱','🍡','🌸','🥮','🎋','🧋','🌿'];  /* fallback only */
const DIFFS = {
  easy: { cols:3, rows:4, name:'Easy · 3×4',  seconds: 75 },
  med:  { cols:4, rows:4, name:'Medium · 4×4', seconds: 105 },
  hard: { cols:4, rows:6, name:'Hard · 4×6',   seconds: 165 }
};

const state = {
  diff: localStorage.getItem('mam-diff') || 'med',
  score: 0,
  pairs: 0,
  total: 0,
  combo: 0,
  bestCombo: 0,
  timer: null,
  timeLeft: 0,
  timeTotal: 0,
  first: null,
  lock: false,
  best: {},
  items: [],
  loading: false
};
try { state.best = JSON.parse(localStorage.getItem('mam-best-v2') || '{}'); } catch(e) {}

/* ═══════════════════════════════════════════════════════
   Fetch matcha-only images
   TheMealDB "matcha" + TheCocktailDB "matcha" + LoremFlickr
   matcha-keyword variants. No sushi. No fish. No rice.
   Cached 24h in localStorage.
   ═══════════════════════════════════════════════════════ */
const POOL_KEY = 'mam-pool-v3';
const POOL_TTL_MS = 24 * 60 * 60 * 1000;

function loadPoolCache() {
  try {
    const raw = JSON.parse(localStorage.getItem(POOL_KEY) || 'null');
    if (!raw || !raw.ts || Date.now() - raw.ts > POOL_TTL_MS) return null;
    return raw.items || null;
  } catch(e) { return null; }
}
function savePoolCache(items) {
  try { localStorage.setItem(POOL_KEY, JSON.stringify({ ts: Date.now(), items })); } catch(e) {}
}

/* If a meal/drink name doesn't contain "matcha" (or a matcha-adjacent
   word we approve), reject it. Sushi and rice and fish are OUT. */
const OK_WORDS = /matcha|green tea|greentea|hojicha|houjicha/i;

async function fetchPool() {
  const seen = new Map();
  const takeMeal = m => {
    if (!m || !m.idMeal || !m.strMealThumb || !m.strMeal) return;
    if (!OK_WORDS.test(m.strMeal)) return;
    if (seen.has('m'+m.idMeal)) return;
    seen.set('m'+m.idMeal, { id:'m'+m.idMeal, name:m.strMeal, image:m.strMealThumb });
  };
  const takeDrink = d => {
    if (!d || !d.idDrink || !d.strDrinkThumb || !d.strDrink) return;
    if (!OK_WORDS.test(d.strDrink)) return;
    if (seen.has('d'+d.idDrink)) return;
    seen.set('d'+d.idDrink, { id:'d'+d.idDrink, name:d.strDrink, image:d.strDrinkThumb });
  };

  const jobs = [
    fetch('https://www.themealdb.com/api/json/v1/1/search.php?s=matcha').then(r=>r.json()).then(j=>(j.meals||[]).forEach(takeMeal)).catch(()=>{}),
    fetch('https://www.themealdb.com/api/json/v1/1/search.php?s=green%20tea').then(r=>r.json()).then(j=>(j.meals||[]).forEach(takeMeal)).catch(()=>{}),
    fetch('https://www.thecocktaildb.com/api/json/v1/1/search.php?s=matcha').then(r=>r.json()).then(j=>(j.drinks||[]).forEach(takeDrink)).catch(()=>{}),
    fetch('https://www.thecocktaildb.com/api/json/v1/1/search.php?s=green%20tea').then(r=>r.json()).then(j=>(j.drinks||[]).forEach(takeDrink)).catch(()=>{})
  ];
  await Promise.all(jobs);
  const dbItems = [...seen.values()];

  // Always pad with LoremFlickr matcha variants so we hit at least 12 unique tiles
  const flickrKws = [
    { kw:'matcha,latte',    label:'matcha latte' },
    { kw:'matcha,powder',   label:'matcha powder' },
    { kw:'matcha,whisk',    label:'chasen whisk' },
    { kw:'matcha,cake',     label:'matcha cake' },
    { kw:'matcha,mochi',    label:'matcha mochi' },
    { kw:'matcha,ice+cream',label:'matcha ice cream' },
    { kw:'matcha,ceremony', label:'tea ceremony' },
    { kw:'matcha,bowl',     label:'matcha bowl' },
    { kw:'matcha,drink',    label:'matcha drink' },
    { kw:'matcha,dessert',  label:'matcha dessert' },
    { kw:'matcha,green',    label:'matcha green' },
    { kw:'matcha,tea',      label:'matcha tea' },
    { kw:'matcha,japan',    label:'matcha japan' },
    { kw:'matcha,cookie',   label:'matcha cookie' }
  ];
  const flickrItems = flickrKws.map((f, i) => ({
    id: 'f' + i,
    name: f.label,
    image: `https://loremflickr.com/500/500/${encodeURIComponent(f.kw)}?lock=${i + 1}`
  }));

  // DB items first, then Flickr fillers. Dedup by name (case-insensitive).
  const byName = new Set();
  const combined = [];
  for (const it of [...dbItems, ...flickrItems]) {
    const key = it.name.toLowerCase();
    if (byName.has(key)) continue;
    byName.add(key);
    combined.push(it);
  }
  return combined;
}

async function ensurePool() {
  if (state.items.length >= 12) return;
  const cached = loadPoolCache();
  if (cached && cached.length >= 12) { state.items = cached; return; }
  if (state.loading) return;
  state.loading = true;
  try {
    const items = await fetchPool();
    if (items.length >= 12) {
      state.items = items;
      savePoolCache(items);
    }
  } finally { state.loading = false; }
}

/* ═══════════════════════════════════════════════════════
   Game
   ═══════════════════════════════════════════════════════ */
function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function fmtTime(s) {
  s = Math.max(0, s);
  const m = Math.floor(s / 60);
  return `${m}:${String(s % 60).padStart(2, '0')}`;
}
function saveBest() { try { localStorage.setItem('mam-best-v2', JSON.stringify(state.best)); } catch(e) {} }

function newGame() {
  clearInterval(state.timer); state.timer = null;
  state.score = 0; state.pairs = 0;
  state.combo = 0; state.bestCombo = 0;
  state.first = null; state.lock = false;

  const d = DIFFS[state.diff] || DIFFS.med;
  state.total = (d.cols * d.rows) / 2;
  state.timeTotal = d.seconds;
  state.timeLeft = d.seconds;

  // Prefer real matcha photos; if pool has fewer than we need, pad with emojis
  const pool = state.items && state.items.length >= state.total ? state.items : null;
  let chosen;
  if (pool) {
    chosen = shuffle(pool).slice(0, state.total).map(x => ({ key:x.id, name:x.name, image:x.image }));
  } else {
    const need = state.total;
    const emojiCount = Math.max(0, need - (state.items ? state.items.length : 0));
    const photos = shuffle((state.items || []).slice()).slice(0, need - emojiCount).map(x => ({ key:x.id, name:x.name, image:x.image }));
    const emojis = shuffle(ICONS.slice()).slice(0, emojiCount).map(icon => ({ key:'e'+icon, name:'', emoji:icon }));
    chosen = shuffle([...photos, ...emojis]);
  }
  const deck = shuffle(chosen.concat(chosen));

  const board = $('board');
  board.style.setProperty('--cols', d.cols);
  board.innerHTML = '';
  deck.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'tile';
    el.dataset.key = item.key;
    el.style.animationDelay = (i * 18) + 'ms';
    const face = item.image
      ? `<img src="${esc(item.image)}" alt="${esc(item.name)}" loading="lazy"><div class="cap">${esc(item.name)}</div>`
      : `<span class="emo">${item.emoji || '🍵'}</span>`;
    el.innerHTML = `<div class="back"><span class="mark">MM</span></div><div class="face">${face}</div>`;
    el.addEventListener('click', () => onTap(el));
    board.appendChild(el);
  });

  document.querySelectorAll('.chip[data-diff]').forEach(c => c.classList.toggle('on', c.dataset.diff === state.diff));
  updateHUD();
  updateTimerBar();
  if (!pool && !state.loading) ensurePool();
}

function onTap(el) {
  if (state.lock) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (!state.timer) startTimer();
  el.classList.add('flipped');

  if (!state.first) { state.first = el; return; }
  if (state.first === el) return;

  const a = state.first, b = el;
  if (a.dataset.key === b.dataset.key) {
    // Match
    state.lock = true;
    setTimeout(() => {
      a.classList.add('matched'); b.classList.add('matched');
      state.pairs++;
      state.combo++;
      state.bestCombo = Math.max(state.bestCombo, state.combo);
      const base = 100;
      const bonus = Math.max(0, state.combo - 1) * 25;
      const gained = base + bonus;
      state.score += gained;
      showPointsPop(b, gained, state.combo);
      burstAt(b);
      updateHUD(true);
      state.first = null; state.lock = false;
      if (state.pairs === state.total) win();
    }, 220);
  } else {
    // Miss
    state.lock = true;
    state.combo = 0;
    updateHUD();
    a.classList.add('wrong'); b.classList.add('wrong');
    setTimeout(() => {
      a.classList.remove('flipped', 'wrong');
      b.classList.remove('flipped', 'wrong');
      state.first = null; state.lock = false;
    }, 720);
  }
}

function showPointsPop(el, points, combo) {
  const p = document.createElement('div');
  p.className = 'points-pop';
  p.textContent = combo > 2 ? `+${points} 🔥` : `+${points}`;
  el.appendChild(p);
  setTimeout(() => p.remove(), 1200);
}
function burstAt(el) {
  const b = document.createElement('div');
  b.className = 'burst';
  const items = ['🍵','🌸','🌿','✨','💚'];
  const n = 10;
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.textContent = items[Math.floor(Math.random() * items.length)];
    const angle = (Math.random() * Math.PI * 2);
    const dist = 60 + Math.random() * 40;
    s.style.setProperty('--tx', (Math.cos(angle) * dist).toFixed(0) + 'px');
    s.style.setProperty('--ty', (Math.sin(angle) * dist - 20).toFixed(0) + 'px');
    s.style.setProperty('--r', (Math.random() * 720 - 360).toFixed(0) + 'deg');
    s.style.fontSize = (14 + Math.random() * 12) + 'px';
    s.style.animationDelay = (Math.random() * 0.05) + 's';
    b.appendChild(s);
  }
  el.appendChild(b);
  setTimeout(() => b.remove(), 1000);
}

function startTimer() {
  state.timer = setInterval(() => {
    state.timeLeft--;
    updateTimerBar();
    if (state.timeLeft <= 0) {
      clearInterval(state.timer); state.timer = null;
      gameOver();
    }
  }, 1000);
}

function updateHUD(pop) {
  $('scoreV').textContent = state.score.toLocaleString();
  $('pairsV').textContent = `${state.pairs}/${state.total}`;
  $('comboV').textContent = state.combo;
  const c = $('comboCell');
  c.classList.toggle('hot', state.combo >= 3);
  if (pop) {
    ['scoreCell','pairsCell','comboCell'].forEach(id => {
      const el = $(id);
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    });
  }
}

function updateTimerBar() {
  const pct = state.timeTotal ? (state.timeLeft / state.timeTotal) * 100 : 0;
  const fill = $('timerFill');
  fill.style.transform = `scaleX(${pct / 100})`;
  const bar = $('timerbar');
  bar.classList.toggle('critical', state.timeLeft <= 10 && state.timeLeft > 0);
  bar.classList.toggle('low', state.timeLeft <= 20 && state.timeLeft > 10);
}

function win() {
  clearInterval(state.timer); state.timer = null;
  const timeBonus = state.timeLeft * 5;
  state.score += timeBonus;
  const prev = state.best[state.diff] || 0;
  const isBest = state.score > prev;
  if (isBest) { state.best[state.diff] = state.score; saveBest(); }
  const eff = state.pairs / (state.pairs + Math.max(0, state.total)); // placeholder
  const title = state.timeLeft > state.timeTotal * 0.4 ? 'Whisked to perfection.'
              : state.timeLeft > state.timeTotal * 0.2 ? 'Nicely poured.'
              : 'Just in time.';
  $('mIcon').textContent = '🍵';
  $('mTag').textContent = timeBonus > 0 ? `+${timeBonus} time bonus` : 'You did it';
  $('winTitle').textContent = title;
  $('wBigScore').textContent = state.score.toLocaleString();
  $('wPairs').textContent = `${state.pairs}/${state.total}`;
  $('wCombo').textContent = state.bestCombo;
  $('wBest').textContent = (state.best[state.diff] || state.score).toLocaleString();
  $('wBestCell').classList.toggle('new', isBest);
  updateHUD();
  updateTimerBar();
  $('modal').classList.add('show');
  confetti();
}

function gameOver() {
  const prev = state.best[state.diff] || 0;
  const isBest = state.score > prev;
  if (isBest) { state.best[state.diff] = state.score; saveBest(); }
  $('mIcon').textContent = '⏱️';
  $('mTag').textContent = 'Time up';
  $('winTitle').textContent = state.pairs === state.total ? 'You did it!' : `${state.pairs}/${state.total} pairs.`;
  $('wBigScore').textContent = state.score.toLocaleString();
  $('wPairs').textContent = `${state.pairs}/${state.total}`;
  $('wCombo').textContent = state.bestCombo;
  $('wBest').textContent = (state.best[state.diff] || state.score).toLocaleString();
  $('wBestCell').classList.toggle('new', isBest);
  $('modal').classList.add('show');
}

function confetti() {
  const c = document.createElement('div');
  c.className = 'confetti';
  const items = ['🍵','🌸','🌿','✨','💚','🎋'];
  for (let i = 0; i < 48; i++) {
    const s = document.createElement('span');
    s.textContent = items[Math.floor(Math.random() * items.length)];
    s.style.left = (Math.random() * 100) + '%';
    s.style.animationDuration = (2.4 + Math.random() * 2.6) + 's';
    s.style.animationDelay = (Math.random() * 0.6) + 's';
    s.style.fontSize = (16 + Math.random() * 20) + 'px';
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 5200);
}

function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

/* Wire */
document.querySelectorAll('.chip[data-diff]').forEach(c => c.addEventListener('click', () => {
  if (state.diff === c.dataset.diff) return;
  state.diff = c.dataset.diff;
  try { localStorage.setItem('mam-diff', state.diff); } catch(e) {}
  newGame();
}));
$('newBtn').addEventListener('click', () => { newGame(); toast('Fresh matcha'); });
$('againBtn').addEventListener('click', () => { $('modal').classList.remove('show'); newGame(); });
$('nextBtn').addEventListener('click', () => {
  $('modal').classList.remove('show');
  const order = ['easy','med','hard'];
  const idx = order.indexOf(state.diff);
  state.diff = order[(idx + 1) % order.length];
  try { localStorage.setItem('mam-diff', state.diff); } catch(e) {}
  newGame();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').classList.remove('show'); });

async function init() {
  const cached = loadPoolCache();
  if (cached && cached.length >= 12) state.items = cached;
  newGame();
  if (!state.items || state.items.length < 12) await ensurePool();
}
init();
</script>
