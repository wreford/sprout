*{margin:0;padding:0;box-sizing:border-box}
button{touch-action:manipulation}
html,body{position:fixed;inset:0;overflow:hidden;background:#0f0f0f;

#stage{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden;background:#0f0f0f}
#scene{position:absolute;inset:0;width:100%;height:100%}
/* top bar */
#top{position:absolute;top:0;left:0;right:0;z-index:5;

#logo{display:flex;align-items:center;gap:7px;font-weight:700;font-size:16px;letter-spacing:-0.02em}
#logo .play{width:26px;height:18px;background:#ff0033;border-radius:5px;display:flex;

#logo .shorts{font-size:10px;color:#aaa;font-weight:700;margin-left:2px;letter-spacing:0.06em}
/* right rail */
#rail{position:absolute;right:8px;bottom:36%;z-index:6;display:flex;flex-direction:column;gap:16px;align-items:center}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;color:#fff;font-family:inherit}
.rbtn .ic{width:46px;height:46px;border-radius:50%;background:rgba(40,40,40,0.75);

.rbtn:active .ic{transform:scale(0.88);background:rgba(90,90,90,0.8)}
.rbtn .ct{font-size:10.5px;font-weight:700;color:#eee;font-variant-numeric:tabular-nums}

#bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;

#bottom.ans #prompt{font-size:14.5px;margin-bottom:6px;opacity:0.85}

#views{font-size:10.5px;color:#999;margin-bottom:8px;font-variant-numeric:tabular-nums}
#prompt{font-size:clamp(17px,4.4vw,22px);font-weight:700;line-height:1.35;margin-bottom:8px;

#prompt .fr{color:#ffd95e}
#lily{display:none;background:rgba(32,32,32,0.9);border-radius:12px;padding:9px 11px;
  font-size:12.5px;color:#eee;line-height:1.45;margin-bottom:9px;border-left:3px solid #ff9ac4}
#lily.on{display:block}
#lily .pin{color:#ff9ac4;font-weight:700;font-size:10px;letter-spacing:0.06em}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#choices button{font-family:inherit;font-size:15.5px;font-weight:700;padding:13px 6px;border-radius:13px;
  border:1.5px solid rgba(255,255,255,0.25);background:rgba(30,30,30,0.72);color:#fff;

#choices button.bad{border-color:#ff6a5e;background:rgba(140,40,30,0.55);color:#ffc8c0}

#nextBtn{display:none;width:100%;margin-top:9px;padding:13px;border-radius:13px;border:none;

#sBarn{font-size:12.5px;color:#ddd;margin-top:12px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.7}
#sGo{margin-top:16px;width:100%;padding:16px;border-radius:999px;border:none;font-family:inherit;
  font-size:17px;font-weight:700;background:#ff0033;color:#fff}
#sGo:active{transform:scale(0.97)}
/* end */
#endOv{position:absolute;inset:0;z-index:11;background:rgba(0,0,0,0.65);display:none;

#endCard{background:#1c1c1c;border-radius:20px;padding:24px 20px;width:100%;max-width:380px;text-align:center;

/* drawers */
.drawer{position:absolute;left:0;right:0;bottom:0;z-index:12;background:#1c1c1c;
  border-radius:18px 18px 0 0;max-height:62%;display:none;flex-direction:column;

.drawer.on{display:flex;animation:dIn 0.25s ease}
@keyframes dIn{from{transform:translateY(40px);opacity:0}}
.dHead{display:flex;align-items:center;font-weight:700;font-size:14px;margin-bottom:10px}
.dHead button{margin-left:auto;border:none;background:#2a2a2a;color:#fff;width:32px;height:32px;

.cmt{display:flex;gap:9px;margin:11px 0}

.cmt .cu{font-size:10.5px;color:#999;font-weight:700}

.ach{display:flex;gap:11px;align-items:center;padding:10px 6px;border-bottom:1px solid rgba(255,255,255,0.08)}
.ach .ae{font-size:24px;width:34px;text-align:center;filter:grayscale(1);opacity:0.35}
.ach.got .ae{filter:none;opacity:1}

.ach .ad{font-size:11px;color:#777;margin-top:2px}
.ach .chk{margin-left:auto;color:#4ade80;font-weight:700;font-size:13px}
/* toast */
#achToast{position:absolute;top:calc(env(safe-area-inset-top) + 54px);left:50%;transform:translate(-50%,-180%);
  z-index:14;background:#1c1c1c;border:1.5px solid #ffd95e;border-radius:14px;padding:10px 16px;
  display:flex;gap:10px;align-items:center;transition:transform 0.4s cubic-bezier(.2,1.3,.4,1);
  box-shadow:0 10px 30px rgba(0,0,0,0.5);max-width:86%}
#achToast.on{transform:translate(-50%,0)}
#achToast .te{font-size:22px}
#achToast .tt{font-size:10px;color:#ffd95e;font-weight:700;letter-spacing:0.08em}
#achToast .tn{font-size:13px;font-weight:700}
.heartPop{position:absolute;z-index:13;font-size:22px;pointer-events:none;
  animation:hPop 0.9s ease-out forwards}
@keyframes hPop{0%{transform:translate(0,0) scale(0.6);opacity:1}
  100%{transform:translate(var(--hx),-90px) scale(1.4);opacity:0}}

<script>
"use strict";
const $=id=>document.getElementById(id);
["gesturestart","gesturechange","gestureend"].forEach(ev=>
  document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
let lastTouchEnd=0;
document.addEventListener("touchend",e=>{
  const now=Date.now();
  if(now-lastTouchEnd<320&&!e.target.closest("button,input,a"))e.preventDefault();
  lastTouchEnd=now;
},{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
const rnd=Math.random;
function ri(a,b){return a+((rnd()*(b-a+1))|0);}
function pick(a){return a[(rnd()*a.length)|0];}
const shuffle=a=>a.sort(()=>rnd()-0.5);

/* ---------- save ---------- */
let SV={carrots:0,rides:0,best:0,toots:0,plopN:0,sneezeN:0,likes:0,subbed:false,ach:{},ros:{g:0,s:0,b:0}};
try{SV={...SV,...JSON.parse(localStorage.getItem("lf-save")||"{}")};}catch(e){}
SV.ach=SV.ach||{};SV.ros=SV.ros||{g:0,s:0,b:0};
function save(){try{localStorage.setItem("lf-save",JSON.stringify(SV));}catch(e){}}

/* ---------- audio ---------- */
let AC=null;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}}
function clipClop(){
  if(!AC)return;
  for(let i=0;i<2;i++){
    const b=AC.createBuffer(1,900,AC.sampleRate),d=b.getChannelData(0);
    for(let j=0;j<900;j++)d[j]=(Math.random()*2-1)*(1-j/900);
    const s=AC.createBufferSource();s.buffer=b;
    const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=700+i*180;f.Q.value=1.4;
    const v=AC.createGain();
    const t0=AC.currentTime+i*0.11;
    v.gain.setValueAtTime(0.09,t0);
    s.connect(f);f.connect(v);v.connect(AC.destination);
    s.start(t0);
  }
}
function ding(){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),t0=AC.currentTime;
  o.type="sine";o.frequency.value=988;
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(0.05,t0+0.015);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.4);
  o.connect(v);v.connect(AC.destination);o.start(t0);o.stop(t0+0.45);
}
function toot(big){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),vib=AC.createOscillator(),vg=AC.createGain();
  const t0=AC.currentTime,dur=big?0.48:0.21;
  o.type="square";
  o.frequency.setValueAtTime(big?210:170,t0);
  o.frequency.linearRampToValueAtTime(big?62:92,t0+dur-0.04);
  vib.frequency.value=big?32:28;vg.gain.value=big?30:18;
  vib.connect(vg);vg.connect(o.frequency);
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(big?0.04:0.03,t0+0.02);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(v);v.connect(AC.destination);
  o.start(t0);vib.start(t0);o.stop(t0+dur+0.03);vib.stop(t0+dur+0.03);
  if(!big&&Math.random()<0.3){
    const o2=AC.createOscillator(),v2=AC.createGain();
    o2.type="square";
    o2.frequency.setValueAtTime(230,t0+0.14);
    o2.frequency.linearRampToValueAtTime(330,t0+0.2);
    v2.gain.setValueAtTime(0.0001,t0+0.14);
    v2.gain.linearRampToValueAtTime(0.022,t0+0.16);
    v2.gain.exponentialRampToValueAtTime(0.0001,t0+0.24);
    o2.connect(v2);v2.connect(AC.destination);
    o2.start(t0+0.14);o2.stop(t0+0.26);
  }
}
function burp(){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),vib=AC.createOscillator(),vg=AC.createGain();
  const t0=AC.currentTime;
  o.type="sawtooth";
  o.frequency.setValueAtTime(135,t0);
  o.frequency.linearRampToValueAtTime(68,t0+0.26);
  vib.frequency.value=11;vg.gain.value=14;
  vib.connect(vg);vg.connect(o.frequency);
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(0.04,t0+0.03);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.32);
  o.connect(v);v.connect(AC.destination);
  o.start(t0);vib.start(t0);o.stop(t0+0.35);vib.stop(t0+0.35);
}
function neigh(){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),vib=AC.createOscillator(),vg=AC.createGain();
  const t0=AC.currentTime;
  o.type="sawtooth";
  o.frequency.setValueAtTime(430,t0);
  o.frequency.linearRampToValueAtTime(240,t0+0.5);
  vib.frequency.value=9;vg.gain.value=22;
  vib.connect(vg);vg.connect(o.frequency);
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(0.035,t0+0.05);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.55);
  o.connect(v);v.connect(AC.destination);
  o.start(t0);vib.start(t0);o.stop(t0+0.6);vib.stop(t0+0.6);
}
function achoo(){
  if(!AC)return;
  const t0=AC.currentTime;
  const b=AC.createBuffer(1,2600,AC.sampleRate),d=b.getChannelData(0);
  for(let j=0;j<2600;j++)d[j]=(Math.random()*2-1)*(1-j/2600);
  const sn=AC.createBufferSource();sn.buffer=b;
  const nv=AC.createGain();nv.gain.value=0.07;
  sn.connect(nv);nv.connect(AC.destination);sn.start(t0+0.18);
  const o=AC.createOscillator(),v=AC.createGain(),am=AC.createOscillator(),ag=AC.createGain();
  o.type="sawtooth";o.frequency.value=95;
  am.frequency.value=26;ag.gain.value=0.02;
  v.gain.setValueAtTime(0.0001,t0+0.26);
  v.gain.linearRampToValueAtTime(0.03,t0+0.3);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.62);
  am.connect(ag);ag.connect(v.gain);
  o.connect(v);v.connect(AC.destination);
  o.start(t0+0.26);am.start(t0+0.26);o.stop(t0+0.65);am.stop(t0+0.65);
}
function fanfare(){
  if(!AC)return;
  [523,659,784,1047].forEach((f2,i)=>{
    const o=AC.createOscillator(),v=AC.createGain(),t0=AC.currentTime+i*0.08;
    o.type="triangle";o.frequency.value=f2;
    v.gain.setValueAtTime(0.0001,t0);
    v.gain.linearRampToValueAtTime(0.045,t0+0.02);
    v.gain.exponentialRampToValueAtTime(0.0001,t0+0.4);
    o.connect(v);v.connect(AC.destination);o.start(t0);o.stop(t0+0.45);
  });
}

/* ---------- content ---------- */
const VOCAB=[

["lundi","Monday","day"],["mardi","Tuesday","day"],["mercredi","Wednesday","day"],

/* ---------- question generator ---------- */
function kw(str){return str.replace(/^(le |la |les |l')/,"");}
function gen(){
  const roll=rnd();
  let out;
  if(roll<0.2){
    const v=pick(VOCAB);
    const wrongs=shuffle(VOCAB.filter(x=>x[2]===v[2]&&x[1]!==v[1])).slice(0,3);
    while(wrongs.length<3)wrongs.push(pick(VOCAB.filter(x=>x[1]!==v[1])));
    out={q:'What does <span class="fr">'+v[0]+'</span> mean?',
      ans:v[1],choices:shuffle([v[1]].concat(wrongs.map(x=>x[1]))),
      fix:'"'+v[0]+'" = '+v[1],cat:v[2],word:v[0]};
  }else if(roll<0.4){
    const v=pick(VOCAB);
    const wrongs=shuffle(VOCAB.filter(x=>x[2]===v[2]&&x[0]!==v[0])).slice(0,3);
    while(wrongs.length<3)wrongs.push(pick(VOCAB.filter(x=>x[0]!==v[0])));
    out={q:'How do you say <b>'+v[1]+'</b> in French?',
      ans:v[0],choices:shuffle([v[0]].concat(wrongs.map(x=>x[0]))),
      fix:v[1]+' = "'+v[0]+'"',cat:v[2],word:v[0]};
  }else if(roll<0.54){
    const c=pick(CONJ);
    out={q:'Complete: <span class="fr">'+c[0].replace("___","_____")+'</span> <b>('+c[1]+')</b>',
      ans:c[2],choices:shuffle([c[2]].concat(c[3])),
      fix:c[0].replace("___",c[2]),word:c[1]};
  }else if(roll<0.66){
    const nouns=VOCAB.filter(x=>/^(le |la |l')/.test(x[0]));
    const v=pick(nouns);
    const art=v[0].startsWith("l'")?"l'":v[0].slice(0,2);
    out={q:'Pick the article: <span class="fr">___ '+kw(v[0])+'</span> ('+v[1]+')',
      ans:art,choices:shuffle(["le","la","l'","les"]),
      fix:v[0]+(art==="la"?" — feminine":art==="le"?" — masculine":" — vowel sound, so l'"),
      word:v[0]};
  }else if(roll<0.82){
    const e=pick(EMOJI);
    const wrongs=shuffle(EMOJI.filter(x=>x[1]!==e[1])).slice(0,3);
    out={q:'Which one is <span style="font-size:30px">'+e[0]+'</span> ?',
      ans:e[1],choices:shuffle([e[1]].concat(wrongs.map(x=>x[1]))),
      fix:e[0]+" = "+e[1],word:e[1]};
  }else if(roll<0.9){
    const o=pick(OPP);
    const wrongs=shuffle(VOCAB.filter(x=>x[2]==="adj"&&x[0]!==o[1]&&x[0]!==o[0])).slice(0,3);
    out={q:'What is the <b>opposite</b> of <span class="fr">'+o[0]+'</span>?',
      ans:o[1],choices:shuffle([o[1]].concat(wrongs.map(x=>x[0]))),
      fix:o[0]+" ↔ "+o[1],word:o[0]};
  }else{
    const n=pick(NUMS);
    const wrongs=shuffle(NUMS.filter(x=>x[1]!==n[1])).slice(0,3);
    out=rnd()<0.5
      ?{q:'<span class="fr">'+n[0]+'</span> is which number?',
        ans:String(n[1]),choices:shuffle([String(n[1])].concat(wrongs.map(x=>String(x[1])))),
        fix:'"'+n[0]+'" = '+n[1],word:n[0]}
      :{q:'How do you say <b>'+n[1]+'</b>?',
        ans:n[0],choices:shuffle([n[0]].concat(wrongs.map(x=>x[0]))),
        fix:n[1]+' = "'+n[0]+'"',word:n[0]};
  }
  out.title=pick(TITLES).replace("«W»","«"+out.word+"»");
  out.views=(ri(2,99)/10).toFixed(1)+(rnd()<0.5?"M":"K")+" views · "+ri(2,11)+"h ago";
  return out;
}

function answer(btn,choice){
  if(locked||state!=="q")return;
  locked=true;state="answered";audio();
  $("bottom").classList.add("ans");
  const good=choice===cur.ans;
  [...$("choices").children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===cur.ans)b.classList.add("good");
    else if(b===btn&&!good)b.classList.add("bad");
  });
  if(good){
    score++;
    SV.carrots++;SV.toots++;save();
    $("lilyTxt").textContent="Lily: "+pick(LILY.right);
    $("lily").classList.add("on");
    clipClop();ding();
    const hx0=W*0.34,g0=GROUND();
    const isJump=qIdx%3===0;
    if(isJump){
      toot(true);
      for(let i=0;i<6;i++)FARTS.push({x:hx0-54-i*9,y:g0-26+ri(-12,12),r:8+i*4,a:1});
      jumpT=0;
    }else{
      toot(false);
      for(let i=0;i<3;i++)FARTS.push({x:hx0-56-i*10,y:g0-28+ri(-7,7),r:6+i*3,a:0.85});
    }
    if(rnd()<0.55)setTimeout(()=>{
      if(state!=="title"){PLOPS.push({wx:camX-1.45,age:0});SV.plopN++;save();checkCounters();}
    },480);
    horseState="gallop";horseT=0;
    camTarget=camX+1;
    if(cur.cat==="gross")unlock("gross");
    const blob=(cur.q+" "+cur.ans+" "+(cur.word||"")).toLowerCase();
    if(/grand|\bbig\b/.test(blob))startSpecial("big");
    else if(/violet|purple/.test(blob))startSpecial("purple");
    else if(/père|father/.test(blob))startSpecial("ymca");
    else if(/sœur|sister/.test(blob))startSpecial("lick");
    else if(/orange/.test(blob))startSpecial("kick");
    checkCounters();
    try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
  }else{
    $("lilyTxt").textContent="Lily: "+pick(LILY.wrong)+"  "+cur.fix;
    $("lily").classList.add("on");
    neigh();
    horseState="munch";horseT=0;
    setTimeout(()=>{if(horseState==="munch"){burp();burpT=0;}},1450);
    try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
  }
  $("nextBtn").classList.add("on");
}

  W=r.width;H=r.height;
  cv.width=W*d;cv.height=H*d;
  g.setTransform(d,0,0,d,0,0);
}

  g.fillStyle=DARK;
  g.beginPath();g.moveTo(hdX-2,hdY-8);g.lineTo(hdX-6,hdY-20);g.lineTo(hdX+4,hdY-11);g.closePath();g.fill();
  g.beginPath();g.moveTo(hdX+6,hdY-10);g.lineTo(hdX+8,hdY-21);g.lineTo(hdX+13,hdY-9);g.closePath();g.fill();
  if(munch){
    g.fillStyle="#5aa83c";
    g.fillRect(hdX+12,hdY+13,3,6);g.fillRect(hdX+17,hdY+12,3,7);
    const dl=10+Math.sin(t*3)*8;
    g.strokeStyle="rgba(184,212,144,0.8)";g.lineWidth=2;
    g.beginPath();g.moveTo(hdX+19,hdY+10);g.lineTo(hdX+20,hdY+10+dl);g.stroke();
    g.fillStyle="rgba(184,212,144,0.85)";
    g.beginPath();g.arc(hdX+20,hdY+10+dl,2.6,0,6.29);g.fill();
  }
  if(sneeze&&horseT>0.28&&horseT<0.6){
    g.strokeStyle="rgba(178,214,120,0.7)";g.lineWidth=2;
    for(let li=0;li<3;li++){
      g.beginPath();
      g.moveTo(hdX+20,hdY+4+li*3);
      g.lineTo(hdX+34+li*6,hdY+li*7-4);
      g.stroke();
    }
  }
  if(burpT>=0&&burpT<0.8){
    g.fillStyle="#fffdf4";
    g.strokeStyle="#2b2318";g.lineWidth=1.6;
    g.beginPath();g.ellipse(hdX+26,hdY-26-burpT*10,26,13,0,0,6.29);g.fill();g.stroke();
    g.fillStyle="#2b2318";g.font="700 12px Quicksand,sans-serif";g.textAlign="center";
    g.fillText("BURP!",hdX+26,hdY-22-burpT*10);
    g.strokeStyle="rgba(140,170,90,0.7)";g.lineWidth=1.8;
    for(let w2=0;w2<3;w2++){
      const wx3=hdX+14+w2*11,wy3=hdY-38-burpT*22;
      g.beginPath();
      g.moveTo(wx3,wy3+12);
      g.quadraticCurveTo(wx3+4,wy3+8,wx3,wy3+4);
      g.quadraticCurveTo(wx3-4,wy3,wx3,wy3-4);
      g.stroke();
    }
  }
  g.strokeStyle="#8a5a2e";g.lineWidth=2;
  g.beginPath();g.moveTo(10,-62);g.quadraticCurveTo(26,-56,hdX+4,hdY+2);g.stroke();
  g.fillStyle="#d4604a";
  g.beginPath();g.ellipse(-2,-46,16,7,0,0,6.29);g.fill();
  const lilyBob=gallop?Math.sin(t*16+1)*2:0;
  const purple=special&&special.kind==="purple";
  g.save();
  g.translate(-4,-50+lilyBob);
  g.strokeStyle="#4a6ab0";g.lineWidth=6;
  g.beginPath();g.moveTo(2,2);g.quadraticCurveTo(10,8,14,16);g.stroke();
  g.fillStyle=purple?"#b06ae8":"#ff9ac4";
  g.beginPath();g.ellipse(0,-12,9,13,0.1,0,6.29);g.fill();
  g.strokeStyle=purple?"#b06ae8":"#ff9ac4";g.lineWidth=4.5;g.lineCap="round";
  g.beginPath();g.moveTo(4,-14);g.quadraticCurveTo(18,-10,30,-11);g.stroke();
  g.fillStyle=purple?"#d8b0ff":"#ffdcc0";
  g.beginPath();g.arc(2,-32,9,0,6.29);g.fill();
  g.fillStyle=purple?"#7a3ae0":"#6a4226";
  g.beginPath();g.ellipse(-3,-36,10,8,-0.3,0,6.29);g.fill();
  g.beginPath();g.ellipse(-9,-26,4,9,0.2,0,6.29);g.fill();
  g.fillStyle="#2a2a30";
  g.beginPath();g.arc(2,-36,9.5,Math.PI,6.29);g.fill();
  g.fillRect(-8,-37,20,3);
  const grossed=burpT>=0&&burpT<0.8;
  g.fillStyle="#2b2318";
  if(grossed){
    g.fillRect(4,-32,4,1.6);
  }else{
    g.beginPath();g.arc(6,-31,1.2,0,6.29);g.fill();
  }
  g.strokeStyle="#2b2318";g.lineWidth=1.3;
  if(grossed){
    g.beginPath();g.arc(5,-24,2.6,3.5,5.9);g.stroke();
    g.strokeStyle=purple?"#d8b0ff":"#ffdcc0";g.lineWidth=3.5;g.lineCap="round";
    g.beginPath();g.moveTo(-4,-16);g.quadraticCurveTo(4,-22,7,-27+Math.sin(t*10)*1.5);g.stroke();
  }else{
    g.beginPath();g.arc(5,-28,2.6,0.3,2.5);g.stroke();
  }
  if(purple){
    for(let si=0;si<4;si++){
      const sa=t*3+si*1.57;
      g.fillStyle="rgba(176,106,232,"+(0.5+0.4*Math.sin(sa*2))+")";
      g.font="11px serif";g.textAlign="center";
      g.fillText("✦",Math.cos(sa)*22,-28+Math.sin(sa)*20);
    }
  }
  g.restore();
  if(special&&special.kind==="big"&&special.t<3.8){
    g.fillStyle="#fff";g.font="900 "+Math.round(18/scale)+"px Quicksand,sans-serif";g.textAlign="center";
    g.fillText("GRAND!",0,-110);
  }
  g.restore();
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  draw(now/1000,dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener("visibilitychange",()=>{
  try{if(!AC)return;document.hidden?AC.suspend():AC.resume();}catch(e){}
});
renderSegs();

window.LF={
  get state(){return state;},get cur(){return cur;},get score(){return score;},
  get qIdx(){return qIdx;},get SV(){return SV;},get special(){return special;},
  get FARTS(){return FARTS;},get PLOPS(){return PLOPS;},
  get SNOT(){return SNOT;},get BITS(){return BITS;},
  startRide,gen,next(){if(state==="answered")nextQ();},
  startSpecial,unlock,
  forceSneeze(){horseState="sneeze";horseT=0;sneezeSpat=false;achoo();},
  answerRight(){const b=[...$("choices").children].find(x=>x.textContent===cur.ans);b.click();},
  answerWrong(){const b=[...$("choices").children].find(x=>x.textContent!==cur.ans);b.click();},
};
