<script>
"use strict";
const $=id=>document.getElementById(id);
const rnd=Math.random;
function ri(a,b){return a+((rnd()*(b-a+1))|0);}
function pick(a){return a[(rnd()*a.length)|0];}
const shuffle=a=>a.sort(()=>rnd()-0.5);

/* ---------- save ---------- */
let SV={carrots:0,rides:0,best:0,toots:0,ros:{g:0,s:0,b:0}};
try{SV={...SV,...JSON.parse(localStorage.getItem("lf-save")||"{}")};}catch(e){}
function save(){try{localStorage.setItem("lf-save",JSON.stringify(SV));}catch(e){}}

/* ---------- audio ---------- */
let AC=null;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}}
function clipClop(){
  if(!AC)return;
  for(let i=0;i<2;i++){
    const b=AC.createBuffer(1,900,AC.sampleRate),d=b.getChannelData(0);
    for(let j=0;j<900;j++)d[j]=(Math.random()*2-1)*(1-j/900);
    const s=AC.createBufferSource();s.buffer=b;
    const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=700+i*180;f.Q.value=1.4;
    const v=AC.createGain();
    const t0=AC.currentTime+i*0.11;
    v.gain.setValueAtTime(0.09,t0);
    s.connect(f);f.connect(v);v.connect(AC.destination);
    s.start(t0);
  }
}
function ding(){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),t0=AC.currentTime;
  o.type="sine";o.frequency.value=988;
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(0.05,t0+0.015);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.4);
  o.connect(v);v.connect(AC.destination);o.start(t0);o.stop(t0+0.45);
}
function toot(){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),vib=AC.createOscillator(),vg=AC.createGain();
  const t0=AC.currentTime;
  o.type="square";
  o.frequency.setValueAtTime(170,t0);
  o.frequency.linearRampToValueAtTime(92,t0+0.17);
  vib.frequency.value=28;vg.gain.value=18;
  vib.connect(vg);vg.connect(o.frequency);
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(0.03,t0+0.02);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.21);
  o.connect(v);v.connect(AC.destination);
  o.start(t0);vib.start(t0);o.stop(t0+0.23);vib.stop(t0+0.23);
  if(Math.random()<0.3){
    const o2=AC.createOscillator(),v2=AC.createGain();
    o2.type="square";
    o2.frequency.setValueAtTime(230,t0+0.14);
    o2.frequency.linearRampToValueAtTime(330,t0+0.2);
    v2.gain.setValueAtTime(0.0001,t0+0.14);
    v2.gain.linearRampToValueAtTime(0.022,t0+0.16);
    v2.gain.exponentialRampToValueAtTime(0.0001,t0+0.24);
    o2.connect(v2);v2.connect(AC.destination);
    o2.start(t0+0.14);o2.stop(t0+0.26);
  }
}
function rocketToot(){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),vib=AC.createOscillator(),vg=AC.createGain();
  const t0=AC.currentTime;
  o.type="square";
  o.frequency.setValueAtTime(210,t0);
  o.frequency.linearRampToValueAtTime(68,t0+0.42);
  vib.frequency.value=32;vg.gain.value=30;
  vib.connect(vg);vg.connect(o.frequency);
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(0.04,t0+0.03);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.48);
  o.connect(v);v.connect(AC.destination);
  o.start(t0);vib.start(t0);o.stop(t0+0.5);vib.stop(t0+0.5);
}
function achoo(){
  if(!AC)return;
  const t0=AC.currentTime;
  const b=AC.createBuffer(1,2600,AC.sampleRate),d=b.getChannelData(0);
  for(let j=0;j<2600;j++)d[j]=(Math.random()*2-1)*(1-j/2600);
  const sn=AC.createBufferSource();sn.buffer=b;
  const nv=AC.createGain();nv.gain.value=0.07;
  sn.connect(nv);nv.connect(AC.destination);sn.start(t0+0.18);
  const o=AC.createOscillator(),v=AC.createGain(),am=AC.createOscillator(),ag=AC.createGain();
  o.type="sawtooth";o.frequency.value=95;
  am.frequency.value=26;ag.gain.value=0.02;
  v.gain.setValueAtTime(0.0001,t0+0.26);
  v.gain.linearRampToValueAtTime(0.03,t0+0.3);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.62);
  am.connect(ag);ag.connect(v.gain);
  o.connect(v);v.connect(AC.destination);
  o.start(t0+0.26);am.start(t0+0.26);o.stop(t0+0.65);am.stop(t0+0.65);
}
function burp(){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),vib=AC.createOscillator(),vg=AC.createGain();
  const t0=AC.currentTime;
  o.type="sawtooth";
  o.frequency.setValueAtTime(135,t0);
  o.frequency.linearRampToValueAtTime(68,t0+0.26);
  vib.frequency.value=11;vg.gain.value=14;
  vib.connect(vg);vg.connect(o.frequency);
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(0.04,t0+0.03);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.32);
  o.connect(v);v.connect(AC.destination);
  o.start(t0);vib.start(t0);o.stop(t0+0.35);vib.stop(t0+0.35);
}
function neigh(){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),vib=AC.createOscillator(),vg=AC.createGain();
  const t0=AC.currentTime;
  o.type="sawtooth";
  o.frequency.setValueAtTime(430,t0);
  o.frequency.linearRampToValueAtTime(240,t0+0.5);
  vib.frequency.value=9;vg.gain.value=22;
  vib.connect(vg);vg.connect(o.frequency);
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(0.035,t0+0.05);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.55);
  o.connect(v);v.connect(AC.destination);
  o.start(t0);vib.start(t0);o.stop(t0+0.6);vib.stop(t0+0.6);
}

/* ---------- french content (grade 6 core) ---------- */

["le professeur","the teacher","sch"],["le sac à dos","the backpack","sch"],["le pupitre","the desk","sch"],
["la mère","the mother","fam"],["le père","the father","fam"],["la sœur","the sister","fam"],
["le frère","the brother","fam"],["la famille","the family","fam"],["l'ami","the friend","fam"],
["le lait","the milk","food"],["le pain","the bread","food"],["le fromage","the cheese","food"],
["la pomme","the apple","food"],["l'eau","the water","food"],["le jus","the juice","food"],
["le gâteau","the cake","food"],
["manger","to eat","verb"],["jouer","to play","verb"],["sauter","to jump","verb"],
["courir","to run","verb"],["aimer","to like","verb"],["parler","to speak","verb"],
["écouter","to listen","verb"],["regarder","to watch","verb"],["galoper","to gallop","verb"],
["marcher","to walk","verb"],
["le pet","the fart","gross"],["le prout","the toot","gross"],["le caca","the poop","gross"],
["la crotte","the horse droppings","gross"],["le pipi","the pee","gross"],
["le derrière","the bottom (the butt)","gross"],["puer","to stink","gross"],
["péter","to fart","gross"],["la boue","the mud","gross"],["sale","dirty","gross"],
["dégoûtant","disgusting","gross"],
["il fait beau","it's nice out","wx"],["il pleut","it's raining","wx"],["il neige","it's snowing","wx"],
["il fait froid","it's cold","wx"],["il fait chaud","it's hot","wx"],
];
const NUMS=[["onze",11],["douze",12],["treize",13],["quatorze",14],["quinze",15],["seize",16],
["dix-sept",17],["dix-huit",18],["dix-neuf",19],["vingt",20],["trente",30],["quarante",40],
["cinquante",50],["soixante",60]];
const CONJ=[
["Je ___ un poney.","avoir","ai",["as","a","avons"]],
["Tu ___ un cheval brun.","avoir","as",["ai","ont","avez"]],
["Elle ___ une carotte.","avoir","a",["ai","as","ont"]],
["Nous ___ du foin.","avoir","avons",["ai","avez","ont"]],
["Je ___ à l'écurie.","aller","vais",["vas","va","allons"]],
["Tu ___ au pré.","aller","vas",["vais","va","vont"]],
["Il ___ à l'école.","aller","va",["vais","vont","allez"]],
["Nous ___ à la ferme.","aller","allons",["vais","allez","vont"]],
["Je ___ contente.","être","suis",["es","est","sommes"]],
["Tu ___ rapide!","être","es",["suis","est","êtes"]],
["Le poney ___ brun.","être","est",["suis","es","sont"]],
["Nous ___ amis.","être","sommes",["suis","êtes","sont"]],

["Elle ___ une promenade.","faire","fait",["fais","faisons","font"]],
["Ils ___ du cheval.","faire","font",["fais","fait","faites"]],

const LILY={
  right:["Oui oui! (That means yes-yes, not a bathroom word. Probably.)",
    "Correct! The horse tooted with pride. You heard it.",
    "Magnifique! That gallop was 100% fart-powered.",

    "Sacrebleu! Wrong — and the horse chose THIS exact moment to poop. Rude.",
    "Non! The horse is eating grass so it has something to poop about later.",
    "Oops. Even the poop back there knows this one:",
    "Non non. The horse did a tiny stress toot. Here's the fix:"],
  end5:["A champion! The horse tooted the entire national anthem.",
    "Gold! Ten right answers, ten proud toots. A perfect symphony."],
  endMid:["Good ride! Only a couple of emergency poops.",

/* ---------- question generator ---------- */
function gen(){
  const roll=rnd();
  if(roll<0.38){
    const v=pick(VOCAB);
    const wrongs=shuffle(VOCAB.filter(x=>x[2]===v[2]&&x[1]!==v[1])).slice(0,3);
    while(wrongs.length<3)wrongs.push(pick(VOCAB.filter(x=>x[1]!==v[1])));
    return{q:'What does <span class="fr">'+v[0]+'</span> mean?',
      ans:v[1],choices:shuffle([v[1]].concat(wrongs.map(x=>x[1]))),
      fix:'"'+v[0]+'" = '+v[1]};
  }
  if(roll<0.7){
    const v=pick(VOCAB);
    const wrongs=shuffle(VOCAB.filter(x=>x[2]===v[2]&&x[0]!==v[0])).slice(0,3);
    while(wrongs.length<3)wrongs.push(pick(VOCAB.filter(x=>x[0]!==v[0])));
    return{q:'How do you say <b>'+v[1]+'</b> in French?',
      ans:v[0],choices:shuffle([v[0]].concat(wrongs.map(x=>x[0]))),
      fix:v[1]+' = "'+v[0]+'"'};
  }
  if(roll<0.88){
    const c=pick(CONJ);
    return{q:'Complete: <span class="fr">'+c[0].replace("___","_____")+'</span> <b>('+c[1]+')</b>',
      ans:c[2],choices:shuffle([c[2]].concat(c[3])),
      fix:c[0].replace("___",c[2])};
  }
  const n=pick(NUMS);
  const wrongs=shuffle(NUMS.filter(x=>x[1]!==n[1])).slice(0,3);
  return rnd()<0.5
    ?{q:'<span class="fr">'+n[0]+'</span> is which number?',
      ans:String(n[1]),choices:shuffle([String(n[1])].concat(wrongs.map(x=>String(x[1])))),
      fix:'"'+n[0]+'" = '+n[1]}
    :{q:'How do you say <b>'+n[1]+'</b>?',
      ans:n[0],choices:shuffle([n[0]].concat(wrongs.map(x=>x[0]))),
      fix:n[1]+' = "'+n[0]+'"'};
}

/* ---------- game state ---------- */
const COURSE=10;
let state="title",qIdx=0,score=0,cur=null,locked=false;
let camX=0,camTarget=0,horseState="idle",horseT=0,jumpT=-1;
const FARTS=[],PLOPS=[],SNOT=[],BITS=[];
let burpT=-1,sneezeCd=8,sneezeSpat=false;

function startRide(){
  audio();
  qIdx=0;score=0;camX=0;camTarget=0;
  FARTS.length=0;PLOPS.length=0;SNOT.length=0;BITS.length=0;burpT=-1;sneezeCd=8;
  horseState="idle";jumpT=-1;
  state="play";
  $("title").classList.add("off");
  $("endOv").classList.remove("on");
  nextQ();
}
function nextQ(){
  if(qIdx>=COURSE){endRide();return;}
  cur=gen();locked=false;
  qIdx++;
  $("qNum").textContent="question "+qIdx+" / "+COURSE;
  $("prompt").innerHTML=cur.q;
  $("lily").textContent="";
  const box=$("choices");box.innerHTML="";
  cur.choices.forEach(c=>{
    const b=document.createElement("button");
    b.textContent=c;
    b.onclick=()=>answer(b,c);
    box.appendChild(b);
  });
}
function answer(btn,choice){
  if(locked||state!=="play")return;
  locked=true;audio();
  const good=choice===cur.ans;
  [...$("choices").children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===cur.ans)b.classList.add("good");
    else if(b===btn&&!good)b.classList.add("bad");
  });
  if(good){
    score++;
    SV.carrots++;save();
    $("carrots").textContent=SV.carrots;
    $("lily").textContent="Lily: "+pick(LILY.right);
    clipClop();ding();
    SV.toots=(SV.toots||0)+1;save();
    const hx0=W*0.3,g0=H*0.78;
    const isJump=qIdx%3===0;
    if(isJump){
      rocketToot();
      for(let i=0;i<6;i++)FARTS.push({x:hx0-54-i*9,y:g0-26+ri(-12,12),r:8+i*4,a:1});
    }else{
      toot();
      for(let i=0;i<3;i++)FARTS.push({x:hx0-56-i*10,y:g0-28+ri(-7,7),r:6+i*3,a:0.85});
    }
    if(rnd()<0.55)setTimeout(()=>{if(state==="play")PLOPS.push({wx:camX-1.45,age:0});},480);
    horseState="gallop";horseT=0;
    camTarget=camX+1;
    if(isJump)jumpT=0;
    try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
    setTimeout(nextQ,1050);
  }else{
    $("lily").textContent="Lily: "+pick(LILY.wrong)+"  "+cur.fix;
    neigh();
    horseState="munch";horseT=0;
    setTimeout(()=>{if(horseState==="munch"){burp();burpT=0;}},1450);
    try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
    setTimeout(nextQ,2300);
  }
}
function endRide(){
  state="end";
  SV.rides++;
  if(score>SV.best)SV.best=score;
  let ros,ttl;
  if(score===10){ros="🥇";ttl="CHAMPION ROSETTE";SV.ros.g++;
    PLOPS.push({wx:camX-1.5,age:0,trophy:true});}
  else if(score>=8){ros="🥈";ttl="SILVER ROSETTE";SV.ros.s++;}
  else if(score>=6){ros="🥉";ttl="BRONZE ROSETTE";SV.ros.b++;}
  else{ros="🎀";ttl="PARTICIPANT RIBBON";}
  save();
  $("rosette").textContent=ros;
  $("endTitle").textContent=ttl;
  $("endScore").textContent=score+" / "+COURSE;
  $("endCarrots").textContent="🥕 "+score;
  $("endToots").textContent="💨 "+score;
  $("endBest").textContent=SV.best+" / "+COURSE;
  $("endQuip").textContent="Lily: "+pick(score===10?LILY.end5:score>=6?LILY.endMid:LILY.endLow);
  $("endOv").classList.add("on");
  horseState="idle";
}
$("goBtn").onclick=startRide;
$("againBtn").onclick=startRide;
function renderBarn(){
  $("barn").textContent="🥕 "+SV.carrots+" carrots · 💨 "+(SV.toots||0)+" toots · 🥇"+SV.ros.g+" 🥈"+SV.ros.s+" 🥉"+SV.ros.b+
    (SV.best?(" · best "+SV.best+"/10"):"");
  $("carrots").textContent=SV.carrots;
}
renderBarn();

/* ---------- scene ---------- */
const cv=$("scene"),g=cv.getContext("2d");
let W=0,H=0;
function size(){
  const r=cv.getBoundingClientRect();
  const d=Math.min(devicePixelRatio||1,2);
  W=r.width;H=r.height;
  cv.width=W*d;cv.height=H*d;
  g.setTransform(d,0,0,d,0,0);
}
size();addEventListener("resize",size);
const clouds=[[0.15,0.18,1],[0.55,0.1,1.4],[0.85,0.24,0.8]];
function seg(x){return x-Math.floor(x);}
function draw(t,dt){
  camX+=(camTarget-camX)*Math.min(1,dt*3.2);
  horseT+=dt;
  if(horseState==="gallop"&&horseT>1)horseState="idle";
  if(horseState==="munch"&&horseT>2.1)horseState="idle";
  sneezeCd-=dt;
  if(horseState==="idle"&&sneezeCd<=0){
    horseState="sneeze";horseT=0;sneezeSpat=false;
    achoo();
    sneezeCd=7+rnd()*9;
  }
  if(horseState==="sneeze"){
    if(horseT>0.32&&!sneezeSpat){
      sneezeSpat=true;
      const g1=H*0.78;
      for(let i=0;i<8;i++)SNOT.push({x:W*0.3+58,y:g1-56,vx:70+rnd()*110,vy:-50+rnd()*90,r:1.6+rnd()*2.2,a:1});
    }
    if(horseT>1.1)horseState="idle";
  }
  if(horseState==="munch"&&rnd()<dt*5){
    const g1=H*0.78;
    BITS.push({x:W*0.3+52,y:g1-14,vx:-30+rnd()*70,vy:-70-rnd()*40,rot:rnd()*6,a:1});
  }
  if(jumpT>=0){jumpT+=dt*1.4;if(jumpT>1)jumpT=-1;}
  const ground=H*0.78;
  const sky=g.createLinearGradient(0,0,0,ground);
  sky.addColorStop(0,"#8ed1f0");sky.addColorStop(1,"#d8f0f8");
  g.fillStyle=sky;g.fillRect(0,0,W,ground);
  g.save();
  g.translate(W-64,54);g.rotate(t*0.08);
  g.strokeStyle="rgba(255,217,94,0.65)";g.lineWidth=3;
  for(let i=0;i<8;i++){g.rotate(Math.PI/4);g.beginPath();g.moveTo(30,0);g.lineTo(40,0);g.stroke();}
  g.restore();
  g.fillStyle="#ffd95e";
  g.beginPath();g.arc(W-64,54,24,0,6.29);g.fill();
  g.fillStyle="rgba(255,255,255,0.92)";
  clouds.forEach(c=>{
    const cx=seg(c[0]-t*0.008*c[2]+10)*(W+160)-80,cy=H*c[1];
    const s2=c[2]*18;
    g.beginPath();
    g.arc(cx,cy,s2,0,6.29);g.arc(cx+s2*1.1,cy-s2*0.35,s2*0.8,0,6.29);g.arc(cx+s2*2,cy,s2*0.9,0,6.29);
    g.fill();
  });
  g.fillStyle="#a8d48c";
  g.beginPath();g.moveTo(0,ground);
  for(let x=0;x<=W;x+=8)g.lineTo(x,ground-26-Math.sin((x+camX*40)*0.012)*16);
  g.lineTo(W,ground);g.closePath();g.fill();
  g.fillStyle="#7ec850";g.fillRect(0,ground,W,H-ground);
  g.fillStyle="#5aa83c";
  for(let i=0;i<22;i++){
    const gx=seg(i*0.137-camX*0.09)*(W+30)-15,gy=ground+8+(i*37%Math.max(1,(H-ground-16)));
    g.fillRect(gx,gy,2.5,7);
    g.fillRect(gx+4,gy+2,2.5,6);
  }
  const unit=W*0.62;
  for(let i=1;i<=COURSE;i++){
    const fx=(i-camX)*unit*0.5+W*0.72;
    if(fx<-60||fx>W+60)continue;
    if(i===COURSE){
      g.strokeStyle="#8a5a2e";g.lineWidth=5;
      g.beginPath();g.moveTo(fx,ground+6);g.lineTo(fx,ground-74);g.stroke();
      g.fillStyle="#d4604a";
      g.beginPath();g.moveTo(fx,ground-74);g.lineTo(fx+40,ground-62);g.lineTo(fx,ground-50);g.closePath();g.fill();
      g.fillStyle="#fff";g.font="700 11px Quicksand,sans-serif";g.textAlign="center";
      g.fillText("FIN",fx+17,ground-59);
    }else if(i%3===0){
      g.strokeStyle="#fffdf4";g.lineWidth=5;g.lineCap="round";
      g.beginPath();
      g.moveTo(fx-16,ground+4);g.lineTo(fx-16,ground-34);
      g.moveTo(fx+16,ground+4);g.lineTo(fx+16,ground-34);
      g.moveTo(fx-22,ground-14);g.lineTo(fx+22,ground-14);
      g.moveTo(fx-22,ground-28);g.lineTo(fx+22,ground-28);
      g.stroke();
    }else{
      g.strokeStyle="rgba(255,253,244,0.8)";g.lineWidth=4;
      g.beginPath();g.moveTo(fx,ground+4);g.lineTo(fx,ground-22);g.stroke();
    }
  }
  PLOPS.forEach(p=>{
    p.age+=dt;
    const px=(p.wx-camX)*unit*0.5+W*0.72;
    if(px<-50)return;
    g.fillStyle="#6a4a26";
    if(p.trophy){
      g.beginPath();g.ellipse(px,ground+6,16,6,0,0,6.29);g.fill();
      g.beginPath();g.ellipse(px,ground-2,11,5,0,0,6.29);g.fill();
      g.beginPath();g.ellipse(px,ground-9,6,4,0,0,6.29);g.fill();
      g.strokeStyle="#8a5a2e";g.lineWidth=2;
      g.beginPath();g.moveTo(px,ground-12);g.lineTo(px,ground-32);g.stroke();
      g.fillStyle="#ffd95e";
      g.beginPath();g.moveTo(px,ground-32);g.lineTo(px+24,ground-27);g.lineTo(px,ground-21);g.closePath();g.fill();
      g.fillStyle="#2b2318";g.font="700 8px Quicksand,sans-serif";g.textAlign="center";
      g.fillText("10/10",px+11,ground-25);
      for(let si=0;si<3;si++){
        const sa=t*2+si*2.1;
        g.fillStyle="rgba(255,217,94,"+(0.45+0.45*Math.sin(sa*3))+")";
        g.font="10px serif";
        g.fillText("✦",px+Math.cos(sa)*24,ground-14+Math.sin(sa*1.3)*11);
      }
    }else{
      g.beginPath();g.ellipse(px,ground+6,11,5,0,0,6.29);g.fill();
      g.beginPath();g.ellipse(px-3,ground+1,7,4,0,0,6.29);g.fill();
      g.beginPath();g.ellipse(px+4,ground+2,5,3.4,0,0,6.29);g.fill();
    }
    if(p.age>1){
      for(let fi=0;fi<2;fi++){
        const fa=t*5+fi*2.6+p.wx*7;
        const fx2=px+Math.cos(fa)*13+Math.cos(fa*2.3)*4;
        const fy2=ground-10+Math.sin(fa*1.7)*7;
        g.fillStyle="#2b2318";
        g.fillRect(fx2,fy2,2.4,2.4);
        g.strokeStyle="rgba(255,255,255,0.65)";g.lineWidth=1;
        g.beginPath();g.moveTo(fx2+1,fy2);g.lineTo(fx2+4,fy2-3);g.stroke();
      }
    }
    if(p.age<3){
      g.strokeStyle="rgba(140,170,90,"+(0.6*(1-p.age/3))+")";
      g.lineWidth=1.6;
      for(let w=-1;w<=1;w++){
        const wx2=px+w*6,wy=ground-4-p.age*5;
        g.beginPath();
        g.moveTo(wx2,wy+8);
        g.quadraticCurveTo(wx2+3,wy+4,wx2,wy);
        g.stroke();
      }
    }
  });
  for(let i=PLOPS.length-1;i>=0;i--)
    if((PLOPS[i].wx-camX)*unit*0.5+W*0.72<-50||PLOPS.length>12)PLOPS.splice(i,1);
  FARTS.forEach(fp=>{
    fp.x-=dt*26;fp.r+=dt*20;fp.a-=dt*1.15;
    if(fp.a<=0)return;
    g.fillStyle="rgba(168,212,110,"+(fp.a*0.5)+")";
    g.beginPath();g.arc(fp.x,fp.y,fp.r,0,6.29);g.fill();
  });
  for(let i=FARTS.length-1;i>=0;i--)if(FARTS[i].a<=0)FARTS.splice(i,1);
  SNOT.forEach(d2=>{
    d2.vy+=dt*230;d2.x+=d2.vx*dt;d2.y+=d2.vy*dt;d2.a-=dt*1.5;
    if(d2.a>0){
      g.fillStyle="rgba(178,214,120,"+Math.max(0,d2.a)+")";
      g.beginPath();g.arc(d2.x,d2.y,d2.r,0,6.29);g.fill();
    }
  });
  for(let i=SNOT.length-1;i>=0;i--)if(SNOT[i].a<=0)SNOT.splice(i,1);
  BITS.forEach(b2=>{
    b2.vy+=dt*260;b2.x+=b2.vx*dt;b2.y+=b2.vy*dt;b2.rot+=dt*9;b2.a-=dt*1.2;
    if(b2.a>0){
      g.save();g.translate(b2.x,b2.y);g.rotate(b2.rot);
      g.fillStyle="rgba(90,168,60,"+Math.max(0,b2.a)+")";
      g.fillRect(-3,-1.2,6,2.4);
      g.restore();
    }
  });
  for(let i=BITS.length-1;i>=0;i--)if(BITS[i].a<=0)BITS.splice(i,1);
  if(burpT>=0){
    burpT+=dt;
    if(burpT>0.8)burpT=-1;
  }
  const hx=W*0.3;
  let hy=ground-6;
  if(jumpT>=0)hy-=Math.sin(jumpT*Math.PI)*38;
  drawHorse(hx,hy,t);
}
function drawHorse(x,y,t){
  const gallop=horseState==="gallop",munch=horseState==="munch",sneeze=horseState==="sneeze";
  const jumping=jumpT>=0;
  const bob=gallop?Math.sin(t*16)*3:Math.sin(t*2.2)*1.5;
  g.save();
  g.translate(x,y+bob);
  g.fillStyle="rgba(43,35,24,0.18)";
  g.beginPath();g.ellipse(0,8-bob+(jumping?Math.sin(jumpT*Math.PI)*38:0),52,8,0,0,6.29);g.fill();
  const BODY="#a5683a",DARK="#5e3a1e";
  g.strokeStyle=DARK;g.lineWidth=7;g.lineCap="round";
  const sw=Math.sin(t*(gallop?10:2.6))*10;
  g.beginPath();g.moveTo(-44,-30);g.quadraticCurveTo(-62,-22+sw*0.4,-58+sw*0.3,-2);g.stroke();
  g.strokeStyle=BODY;g.lineWidth=9;
  const legPh=t*(gallop?15:4);
  const legs=jumping
    ?[[-30,-14,-38,4],[-22,-10,-26,2],[26,-12,36,2],[20,-9,28,0]]
    :[[-30,Math.sin(legPh)*8,-30+Math.sin(legPh)*9,6],
      [-20,Math.sin(legPh+2.2)*8,-20+Math.sin(legPh+2.2)*9,6],
      [22,Math.sin(legPh+Math.PI)*8,22+Math.sin(legPh+Math.PI)*9,6],
      [30,Math.sin(legPh+1.1)*8,30+Math.sin(legPh+1.1)*9,6]];
  legs.forEach(L=>{
    g.beginPath();g.moveTo(L[0],-18);g.lineTo(L[2],L[3]);g.stroke();
    g.fillStyle="#3a2414";
    g.beginPath();g.ellipse(L[2],L[3]+2,4.5,3,0,0,6.29);g.fill();
  });
  g.fillStyle=BODY;
  g.beginPath();g.ellipse(0,-32,46,20,0,0,6.29);g.fill();
  let hdY2=-58;
  if(munch)hdY2=-8+Math.sin(t*9)*2;
  else if(sneeze){
    const p2=horseT/1.1;
    hdY2=p2<0.3?(-58-18*(p2/0.3)):(p2<0.5?-40+Math.sin(t*60)*2:-46-12*((p2-0.5)/0.6));
  }
  const hdX=40,hdY=hdY2;
  g.strokeStyle=BODY;g.lineWidth=17;
  g.beginPath();g.moveTo(30,-38);g.lineTo(hdX,hdY+6);g.stroke();
  g.strokeStyle=DARK;g.lineWidth=5;g.lineCap="round";
  for(let i=0;i<4;i++){
    const mt=i/3;
    const mx=30+(hdX-30)*mt-4,my=-38+(hdY+6+38)*mt;
    g.beginPath();g.moveTo(mx,my);g.quadraticCurveTo(mx-7,my+5,mx-6,my+12);g.stroke();
  }
  g.fillStyle=BODY;
  g.beginPath();g.ellipse(hdX+7,hdY,15,10,munch?0.9:0.35,0,6.29);g.fill();
  g.fillStyle="#c98a56";
  g.beginPath();g.ellipse(hdX+16,hdY+(munch?8:4),8,6,munch?0.9:0.35,0,6.29);g.fill();
  g.fillStyle="#3a2414";
  g.beginPath();g.arc(hdX+17,hdY+(munch?10:6),1.4,0,6.29);g.fill();
  g.fillStyle="#f2e7d0";
  g.beginPath();g.ellipse(hdX+9,hdY+1,3.4,7,munch?0.9:0.35,0,6.29);g.fill();
  g.fillStyle="#2b2318";
  g.beginPath();g.ellipse(hdX+5,hdY-4,2.6,3.2,0,0,6.29);g.fill();
  g.fillStyle=DARK;
  g.beginPath();g.moveTo(hdX-2,hdY-8);g.lineTo(hdX-6,hdY-20);g.lineTo(hdX+4,hdY-11);g.closePath();g.fill();
  g.beginPath();g.moveTo(hdX+6,hdY-10);g.lineTo(hdX+8,hdY-21);g.lineTo(hdX+13,hdY-9);g.closePath();g.fill();
  if(munch){
    g.fillStyle="#5aa83c";
    g.fillRect(hdX+12,hdY+13,3,6);g.fillRect(hdX+17,hdY+12,3,7);
    const dl=10+Math.sin(t*3)*8;
    g.strokeStyle="rgba(184,212,144,0.8)";g.lineWidth=2;
    g.beginPath();g.moveTo(hdX+19,hdY+10);g.lineTo(hdX+20,hdY+10+dl);g.stroke();
    g.fillStyle="rgba(184,212,144,0.85)";
    g.beginPath();g.arc(hdX+20,hdY+10+dl,2.6,0,6.29);g.fill();
  }
  if(sneeze&&horseT>0.28&&horseT<0.6){
    g.strokeStyle="rgba(178,214,120,0.7)";g.lineWidth=2;
    for(let li=0;li<3;li++){
      g.beginPath();
      g.moveTo(hdX+20,hdY+4+li*3);
      g.lineTo(hdX+34+li*6,hdY+li*7-4);
      g.stroke();
    }
  }
  if(burpT>=0&&burpT<0.8){
    g.fillStyle="#fffdf4";
    g.strokeStyle="#2b2318";g.lineWidth=1.6;
    g.beginPath();g.ellipse(hdX+26,hdY-26-burpT*10,26,13,0,0,6.29);g.fill();g.stroke();
    g.fillStyle="#2b2318";g.font="700 12px Quicksand,sans-serif";g.textAlign="center";
    g.fillText("BURP!",hdX+26,hdY-22-burpT*10);
    g.strokeStyle="rgba(140,170,90,0.7)";g.lineWidth=1.8;
    for(let w2=0;w2<3;w2++){
      const wx3=hdX+14+w2*11,wy3=hdY-38-burpT*22;
      g.beginPath();
      g.moveTo(wx3,wy3+12);
      g.quadraticCurveTo(wx3+4,wy3+8,wx3,wy3+4);
      g.quadraticCurveTo(wx3-4,wy3,wx3,wy3-4);
      g.stroke();
    }
  }
  g.strokeStyle="#8a5a2e";g.lineWidth=2;
  g.beginPath();g.moveTo(10,-62);g.quadraticCurveTo(26,-56,hdX+4,hdY+2);g.stroke();
  g.fillStyle="#d4604a";
  g.beginPath();g.ellipse(-2,-46,16,7,0,0,6.29);g.fill();
  const lilyBob=gallop?Math.sin(t*16+1)*2:0;
  g.save();
  g.translate(-4,-50+lilyBob);
  g.strokeStyle="#4a6ab0";g.lineWidth=6;
  g.beginPath();g.moveTo(2,2);g.quadraticCurveTo(10,8,14,16);g.stroke();
  g.fillStyle="#ff9ac4";
  g.beginPath();g.ellipse(0,-12,9,13,0.1,0,6.29);g.fill();
  g.strokeStyle="#ff9ac4";g.lineWidth=4.5;g.lineCap="round";
  g.beginPath();g.moveTo(4,-14);g.quadraticCurveTo(18,-10,30,-11);g.stroke();
  g.fillStyle="#ffdcc0";
  g.beginPath();g.arc(2,-32,9,0,6.29);g.fill();
  g.fillStyle="#6a4226";
  g.beginPath();g.ellipse(-3,-36,10,8,-0.3,0,6.29);g.fill();
  g.beginPath();g.ellipse(-9,-26,4,9,0.2,0,6.29);g.fill();
  g.fillStyle="#2a2a30";
  g.beginPath();g.arc(2,-36,9.5,Math.PI,6.29);g.fill();
  g.fillRect(-8,-37,20,3);
  const grossed=burpT>=0&&burpT<0.8;
  g.fillStyle="#2b2318";
  if(grossed){
    g.fillRect(4,-32,4,1.6);
  }else{
    g.beginPath();g.arc(6,-31,1.2,0,6.29);g.fill();
  }
  g.strokeStyle="#2b2318";g.lineWidth=1.3;
  if(grossed){
    g.beginPath();g.arc(5,-24,2.6,3.5,5.9);g.stroke();
    g.strokeStyle="#ffdcc0";g.lineWidth=3.5;g.lineCap="round";
    g.beginPath();g.moveTo(-4,-16);g.quadraticCurveTo(4,-22,7,-27+Math.sin(t*10)*1.5);g.stroke();
  }else{
    g.beginPath();g.arc(5,-28,2.6,0.3,2.5);g.stroke();
  }
  g.restore();
  g.restore();
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  draw(now/1000,dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener("visibilitychange",()=>{
  try{if(!AC)return;document.hidden?AC.suspend():AC.resume();}catch(e){}
});

window.LF={
  get state(){return state;},get cur(){return cur;},get score(){return score;},
  get qIdx(){return qIdx;},get SV(){return SV;},
  startRide,gen,
  get FARTS(){return FARTS;},get PLOPS(){return PLOPS;},
  get SNOT(){return SNOT;},get BITS(){return BITS;},
  forceSneeze(){horseState="sneeze";horseT=0;sneezeSpat=false;achoo();},
  answerRight(){const b=[...$("choices").children].find(x=>x.textContent===cur.ans);b.click();},
  answerWrong(){const b=[...$("choices").children].find(x=>x.textContent!==cur.ans);b.click();},
};
