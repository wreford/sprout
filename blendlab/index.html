<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{margin:0;padding:0;box-sizing:border-box}
button{touch-action:manipulation;font-family:inherit}
html,body{position:fixed;inset:0;overflow:hidden;background:#101418;
  touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  font-family:"Quicksand",-apple-system,"Segoe UI",system-ui,sans-serif;color:#e8ecef}
#stage{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
#top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 10px}
#back{font-size:20px;padding:8px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.06);color:#e8ecef;text-decoration:none;font-weight:700}
#lvlName{font-weight:700;font-size:15px;letter-spacing:0.02em}
#lvlSub{font-size:10.5px;color:#8a94a0;letter-spacing:0.12em;text-transform:uppercase;font-weight:700}
#reset{margin-left:auto;font-size:17px;padding:9px 14px;border-radius:12px;
  border:1.5px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);color:#e8ecef}
#reset:active,#back:active{transform:scale(0.93)}
#hintBar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 4px);z-index:5;
  text-align:center;font-size:10.5px;color:#5a6470;letter-spacing:0.06em;font-weight:700;
  pointer-events:none}
#splash{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;text-align:center;background:rgba(16,20,24,0.9)}
#splash.off{display:none}
#spIcon{font-size:56px}
#spTitle{font-size:32px;font-weight:700;letter-spacing:0.14em;margin-top:10px}
#spSub{font-size:12px;color:#8a94a0;margin-top:8px;line-height:1.7;letter-spacing:0.04em;max-width:300px}
#spStats{font-size:12px;color:#aab4c0;margin-top:14px;font-weight:700;font-variant-numeric:tabular-nums}
#spGo{margin-top:20px;padding:16px 50px;border-radius:999px;border:none;font-size:16px;font-weight:700;
  background:#e8ecef;color:#101418}
#spGo:active{transform:scale(0.96)}
#factOv{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
  padding:24px;background:rgba(16,20,24,0.55)}
#factOv.on{display:flex}
#factCard{background:#1a2026;border:1px solid rgba(255,255,255,0.12);border-radius:20px;
  padding:26px 22px;width:100%;max-width:360px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);animation:fIn 0.35s cubic-bezier(.2,1.3,.4,1)}
@keyframes fIn{from{transform:translateY(24px) scale(0.95);opacity:0}}
#fChem{font-size:26px;font-weight:700;letter-spacing:0.04em}
#fTag{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;font-weight:700;margin-top:4px}
#fFact{font-size:13.5px;color:#aab4c0;line-height:1.65;margin-top:14px}
#fNext{margin-top:18px;width:100%;padding:15px;border-radius:14px;border:none;
  font-size:15px;font-weight:700;background:#e8ecef;color:#101418}
#fNext:active{transform:scale(0.97)}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv"></canvas>
<div id="top">
  <a id="back" href="/">‹</a>
  <div><div id="lvlName"></div><div id="lvlSub"></div></div>
  <button id="reset">↺</button>
</div>
<div id="hintBar">TAP A TUBE · TAP A GAP · COMPLETE THE SERIES</div>
<div id="splash">
  <div id="spIcon">⚗️</div>
  <div id="spTitle">BLEND LAB</div>
  <div id="spSub">Every puzzle is a real chemical colour series.<br>
    Place the missing tubes so the blend is perfect.</div>
  <div id="spStats"></div>
  <button id="spGo">BEGIN</button>
</div>
<div id="factOv"><div id="factCard">
  <div id="fChem"></div>
  <div id="fTag">SERIES COMPLETE</div>
  <div id="fFact"></div>
  <button id="fNext">NEXT EXPERIMENT ➜</button>
</div></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
["gesturestart","gesturechange","gestureend"].forEach(ev=>
  document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
let lastTouchEnd=0;
document.addEventListener("touchend",e=>{
  const now=Date.now();
  if(now-lastTouchEnd<320&&!e.target.closest("button,a"))e.preventDefault();
  lastTouchEnd=now;
},{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
const rnd=Math.random;
function ri(a,b){return a+((rnd()*(b-a+1))|0);}
function pick(a){return a[(rnd()*a.length)|0];}
const shuffle=a=>a.sort(()=>rnd()-0.5);

/* ---------- save ---------- */
let SV={lvl:0,solved:0};
try{SV={...SV,...JSON.parse(localStorage.getItem("bl-save")||"{}")};}catch(e){}
function save(){try{localStorage.setItem("bl-save",JSON.stringify(SV));}catch(e){}}

/* ---------- audio ---------- */
let AC=null;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}}
function tink(){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),t0=AC.currentTime;
  o.type="sine";o.frequency.value=1320;
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(0.04,t0+0.008);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);
  o.connect(v);v.connect(AC.destination);o.start(t0);o.stop(t0+0.2);
}
function bloop(){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),t0=AC.currentTime;
  o.type="sine";
  o.frequency.setValueAtTime(340,t0);
  o.frequency.exponentialRampToValueAtTime(170,t0+0.12);
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(0.06,t0+0.015);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.16);
  o.connect(v);v.connect(AC.destination);o.start(t0);o.stop(t0+0.18);
}
function thud(){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),t0=AC.currentTime;
  o.type="triangle";o.frequency.value=105;
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(0.05,t0+0.015);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
  o.connect(v);v.connect(AC.destination);o.start(t0);o.stop(t0+0.25);
}
function winChime(){
  if(!AC)return;
  [523,659,784,988,1319].forEach((f,i)=>{
    const o=AC.createOscillator(),v=AC.createGain(),t0=AC.currentTime+i*0.07;
    o.type="sine";o.frequency.value=f;
    v.gain.setValueAtTime(0.0001,t0);
    v.gain.linearRampToValueAtTime(0.045,t0+0.015);
    v.gain.exponentialRampToValueAtTime(0.0001,t0+0.5);
    o.connect(v);v.connect(AC.destination);o.start(t0);o.stop(t0+0.55);
  });
}

/* ---------- levels ----------
   paths: row, col, L, S, X (two crossing series) */
const LEVELS=[
{n:"CuSO₄",sub:"copper sulfate · dilution",path:"row",len:4,
 c1:[210,85,34],c2:[210,70,86],
 fact:"Add water and the blue fades — a dilution series. Same chemical, less of it per drop."},
{n:"KMnO₄",sub:"potassium permanganate",path:"row",len:5,
 c1:[295,78,26],c2:[300,60,86],
 fact:"Permanganate is so intensely purple that a single crystal can tint an entire beaker."},
{n:"Bromothymol blue",sub:"pH indicator",path:"row",len:5,
 c1:[55,92,54],c2:[200,82,44],
 fact:"Yellow in acid, blue in base — and perfectly green right at neutral pH 7."},
{n:"Iodine",sub:"tincture · dilution",path:"col",len:5,
 c1:[33,85,24],c2:[40,80,82],
 fact:"Iodine solution ranges from near-black amber to pale honey as it dilutes."},
{n:"Universal indicator",sub:"the full pH rainbow",path:"row",len:6,
 c1:[0,82,50],c2:[275,70,46],
 fact:"Red at pH 1 through violet at pH 14 — one dye mixture that sweeps the whole rainbow."},
{n:"Chlorophyll",sub:"leaf extract · dilution",path:"L",len:6,
 c1:[125,62,20],c2:[110,58,80],
 fact:"Chlorophyll absorbs red and blue light and reflects green — which is why leaves look green."},
{n:"Flame test",sub:"lithium → sodium",path:"row",len:5,
 c1:[356,85,52],c2:[52,95,55],
 fact:"Burn lithium: crimson. Burn sodium: bright yellow. Chemists identify metals by flame colour."},
{n:"Cu flame",sub:"copper's flame · subtle",path:"col",len:5,
 c1:[158,78,40],c2:[212,85,50],
 fact:"Copper burns blue-green — it's what makes fireworks teal. This one's subtle. Trust your eyes."},
{n:"Methyl orange",sub:"acid-base indicator",path:"S",len:7,
 c1:[350,85,52],c2:[45,95,56],
 fact:"Methyl orange flips from red to yellow around pH 4 — sharp enough to titrate with."},
{n:"Red cabbage",sub:"kitchen indicator",path:"L",len:6,
 c1:[340,72,46],c2:[258,60,42],
 fact:"Boil red cabbage and the water becomes a real pH indicator. Your kitchen is a lab."},
{n:"CuSO₄ crossing",sub:"two series, one tube",path:"X",len:5,
 c1:[210,85,32],c2:[210,65,84],dh:70,dl:16,
 fact:"Two dilution series, one shared tube. The crossing flask must be true to both."},
{n:"Phenolphthalein",sub:"the magic trick",path:"S",len:7,
 c1:[300,8,92],c2:[322,78,54],
 fact:"Colourless in acid, hot pink in base. The classic 'water into wine' demo is just pH."},
{n:"Chromate ⇌ dichromate",sub:"equilibrium shift",path:"row",len:6,
 c1:[55,95,50],c2:[26,90,44],
 fact:"Add acid and yellow chromate shifts to orange dichromate. Add base, it shifts back."},
{n:"pH × dilution",sub:"crossing series",path:"X",len:5,
 c1:[0,80,50],c2:[130,70,42],dh:95,dl:20,
 fact:"An indicator sweep crossed with a dilution ladder. One tube lives in both worlds."},
{n:"Ni(NH₃)₆²⁺",sub:"nickel ammonia complex",path:"S",len:8,
 c1:[140,48,40],c2:[250,62,46],
 fact:"Add ammonia to green nickel solution and it deepens to blue-violet as complexes form."},
{n:"Grand synthesis",sub:"the final cross",path:"X",len:7,
 c1:[190,80,38],c2:[190,55,85],dh:85,dl:14,
 fact:"You've completed the lab. Every colour you blended exists on a real bench somewhere."},
];
function lerp(a,b,t){return a+(b-a)*t;}
function lerpC(c1,c2,t){return[lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];}
function css(c){return"hsl("+c[0]+","+c[1]+"%,"+c[2]+"%)";}
function pathCells(spec){
  const L=spec.len,cells=[];
  if(spec.path==="row")for(let i=0;i<L;i++)cells.push([i,0]);
  else if(spec.path==="col")for(let i=0;i<L;i++)cells.push([0,i]);
  else if(spec.path==="L"){
    const a=Math.ceil(L/2);
    for(let i=0;i<a;i++)cells.push([0,a-1-i]);
    for(let i=1;i<=L-a;i++)cells.push([i,0]);
  }else if(spec.path==="S"){
    const w=Math.ceil(L/2);
    for(let i=0;i<w;i++)cells.push([i,0]);
    for(let i=w;i<L;i++)cells.push([w-1-(i-w),1]);
  }
  return cells;
}
function buildLevel(spec){
  const cells=[];
  if(spec.path==="X"){
    const L=spec.len,mid=(L-1)/2|0;
    const A=[],B=[];
    for(let i=0;i<L;i++)A.push({g:[i,mid],c:lerpC(spec.c1,spec.c2,i/(L-1))});
    const M=lerpC(spec.c1,spec.c2,mid/(L-1));
    const dh=spec.dh,dl=spec.dl;
    for(let i=0;i<L;i++){
      const t=(i-mid);
      B.push({g:[mid,i],c:[M[0]+dh*t/mid,M[1],M[2]+dl*t/mid]});
    }
    const seen={};
    A.concat(B).forEach(e=>{
      const k=e.g[0]+","+e.g[1];
      if(seen[k])return;
      seen[k]=1;
      cells.push({gx:e.g[0],gy:e.g[1],color:e.c,locked:false,placed:null});
    });
    const lockKeys=[[0,mid],[spec.len-1,mid],[mid,0],[mid,spec.len-1],[mid,mid]];
    lockKeys.forEach(k=>{
      const c=cells.find(c2=>c2.gx===k[0]&&c2.gy===k[1]);
      if(c)c.locked=true;
    });
  }else{
    const pos=pathCells(spec);
    pos.forEach((p,i)=>{
      cells.push({gx:p[0],gy:p[1],color:lerpC(spec.c1,spec.c2,i/(spec.len-1)),
        locked:i===0||i===spec.len-1,placed:null});
    });
  }
  return cells;
}
function endlessSpec(n){
  const h=ri(0,340),span=pick([0,0,ri(60,160)]);
  const paths=["row","col","L","S","S","X"];
  const path=paths[Math.min(5,ri(0,5))];
  return{n:"Mystery compound #"+(n+1),sub:"endless lab",path,
    len:path==="X"?pick([5,7]):ri(5,8),
    c1:[h,ri(60,90),ri(22,38)],c2:[h+span,ri(50,80),ri(72,88)],
    dh:ri(60,110),dl:ri(12,20),
    fact:pick(["Hypothesis confirmed. The blend holds.",
      "Peer review says: gorgeous.",
      "Lab notebook updated. Nobel pending.",
      "The series is stable. You may exhale."])};
}

/* ---------- game state ---------- */
let spec=null,cells=[],tray=[],sel=-1,state="title";
let wiggles={},winT=-1,pour=null;
function levelSpec(i){return i<LEVELS.length?LEVELS[i]:endlessSpec(i-LEVELS.length);}
function loadLevel(i){
  SV.lvl=i;save();
  spec=levelSpec(i);
  cells=buildLevel(spec);
  tray=shuffle(cells.filter(c=>!c.locked).map(c=>({color:c.color})));
  sel=-1;wiggles={};winT=-1;pour=null;
  state="play";
  $("lvlName").textContent=spec.n;
  $("lvlSub").textContent="LEVEL "+(i+1)+" · "+spec.sub.toUpperCase();
  $("factOv").classList.remove("on");
}
function fullCheck(){
  if(cells.some(c=>!c.locked&&c.placed===null))return;
  const wrong=cells.filter(c=>!c.locked&&!sameC(tray[c.placed].color,c.color));
  if(wrong.length===0){
    state="won";winT=0;
    SV.solved++;save();
    winChime();
    setTimeout(()=>{
      $("fChem").textContent=spec.n;
      $("fTag").style.color=css(lerpC(spec.c1,spec.c2,0.5));
      $("fFact").textContent=spec.fact;
      $("factOv").classList.add("on");
    },900);
  }else{
    thud();
    try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
    wrong.forEach(c=>{wiggles[c.gx+","+c.gy]=0.6;});
  }
}
function sameC(a,b){return Math.abs(a[0]-b[0])<0.01&&Math.abs(a[1]-b[1])<0.01&&Math.abs(a[2]-b[2])<0.01;}
$("fNext").onclick=()=>{audio();loadLevel(SV.lvl+1);};
$("reset").onclick=()=>{audio();loadLevel(SV.lvl);};
$("spGo").onclick=()=>{audio();$("splash").classList.add("off");loadLevel(SV.lvl);};
function renderSplash(){
  $("spStats").textContent=SV.solved?("🧪 "+SV.solved+" series completed · level "+(SV.lvl+1)):"a new lab coat. spotless.";
}
renderSplash();

/* ---------- layout + draw ---------- */
const cv=$("cv"),g=cv.getContext("2d");
let W=0,H=0;
function size(){
  const r=cv.getBoundingClientRect();
  const d=Math.min(devicePixelRatio||1,2);
  W=r.width;H=r.height;
  cv.width=W*d;cv.height=H*d;
  g.setTransform(d,0,0,d,0,0);
}
size();addEventListener("resize",size);
let cellRects=[],trayRects=[];
function layout(){
  cellRects=[];trayRects=[];
  if(!cells.length)return;
  const xs=cells.map(c=>c.gx),ys=cells.map(c=>c.gy);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const gw=maxX-minX+1,gh=maxY-minY+1;
  const topPad=110,trayH=170;
  const availW=W-48,availH=H-topPad-trayH-40;
  const cs=Math.min(74,availW/gw,availH/gh);
  const ox=(W-gw*cs)/2,oy=topPad+(availH-gh*cs)/2;
  cells.forEach(c=>{
    cellRects.push({x:ox+(c.gx-minX)*cs,y:oy+(c.gy-minY)*cs,s:cs,c});
  });
  const n=tray.length;
  const perRow=Math.min(n,Math.max(4,Math.ceil(n/2)));
  const rows=Math.ceil(n/perRow);
  const ts=Math.min(58,(W-40)/perRow-8);
  const ty0=H-trayH+16;
  tray.forEach((t,i)=>{
    const row=Math.floor(i/perRow),col=i%perRow;
    const inRow=Math.min(perRow,n-row*perRow);
    const rx=(W-inRow*(ts+8))/2;
    trayRects.push({x:rx+col*(ts+8),y:ty0+row*(ts*1.45),s:ts,i});
  });
}
function tube(x,y,s,color,fill,opts){
  opts=opts||{};
  const w=s*0.62,h=s*0.9,tx=x+(s-w)/2,ty=y+(s-h)/2;
  const r=w*0.3;
  g.save();
  if(opts.lift)g.translate(0,-10);
  if(opts.wiggle)g.translate(Math.sin(performance.now()/28)*4,0);
  // glow
  if(fill>0&&opts.glow!==false){
    g.shadowColor=css(color);
    g.shadowBlur=opts.hot?26:13;
  }
  // liquid
  const lh=(h-8)*fill;
  if(fill>0){
    g.fillStyle=css(color);
    g.beginPath();
    g.roundRect?g.roundRect(tx+3,ty+h-4-lh,w-6,lh,[3,3,r,r]):g.rect(tx+3,ty+h-4-lh,w-6,lh);
    g.fill();
  }
  g.shadowBlur=0;
  // liquid surface shine
  if(fill>0.05){
    g.fillStyle="rgba(255,255,255,0.28)";
    g.beginPath();
    g.ellipse(tx+w/2,ty+h-4-lh,(w-8)/2,2.4,0,0,6.29);
    g.fill();
  }
  // glass
  g.strokeStyle="rgba(255,255,255,"+(opts.err?"0.9":"0.34")+")";
  if(opts.err)g.strokeStyle="rgba(255,106,94,0.95)";
  g.lineWidth=1.6;
  g.beginPath();
  g.roundRect?g.roundRect(tx,ty,w,h,[4,4,r,r]):g.rect(tx,ty,w,h);
  g.stroke();
  // neck lip
  g.beginPath();g.moveTo(tx-3,ty);g.lineTo(tx+w+3,ty);g.stroke();
  // highlight
  g.strokeStyle="rgba(255,255,255,0.2)";
  g.lineWidth=2.4;
  g.beginPath();g.moveTo(tx+5,ty+8);g.lineTo(tx+5,ty+h-12);g.stroke();
  // bubbles in filled tubes
  if(fill>0.3&&opts.bubbles){
    g.fillStyle="rgba(255,255,255,0.35)";
    for(let b=0;b<2;b++){
      const bt=((performance.now()/1000)*0.4+b*0.5+x*0.01)%1;
      g.beginPath();
      g.arc(tx+w*0.35+b*w*0.3,ty+h-6-lh*bt,1.6,0,6.29);
      g.fill();
    }
  }
  if(opts.lockDot){
    g.fillStyle="rgba(255,255,255,0.4)";
    g.beginPath();g.arc(x+s/2,y+s*0.99,2.2,0,6.29);g.fill();
  }
  g.restore();
}
let last=performance.now();
function draw(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  g.clearRect(0,0,W,H);
  // ambient vignette tinted by level
  if(spec){
    const mid=lerpC(spec.c1,spec.c2,0.5);
    const grd=g.createRadialGradient(W/2,H*0.4,40,W/2,H*0.45,H*0.75);
    grd.addColorStop(0,"hsla("+mid[0]+","+mid[1]+"%,"+mid[2]+"%,0.07)");
    grd.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=grd;
    g.fillRect(0,0,W,H);
  }
  layout();
  if(cellRects.length){
    const cs=cellRects[0].s;
    g.strokeStyle="rgba(255,255,255,0.05)";
    g.lineWidth=cs*0.82;
    g.lineCap="round";g.lineJoin="round";
    if(spec&&spec.path==="X"){
      const row=cellRects.filter(cr=>cr.c.gy===cellRects[0].c.gy||true);
      const xs=cellRects.map(cr=>cr.x+cr.s/2),ys=cellRects.map(cr=>cr.y+cr.s/2);
      const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
      const midX=(minX+maxX)/2,midY=(minY+maxY)/2;
      g.beginPath();g.moveTo(minX,midY);g.lineTo(maxX,midY);g.stroke();
      g.beginPath();g.moveTo(midX,minY);g.lineTo(midX,maxY);g.stroke();
    }else{
      g.beginPath();
      cellRects.forEach((cr,i)=>{
        const cx=cr.x+cr.s/2,cy=cr.y+cr.s/2;
        i?g.lineTo(cx,cy):g.moveTo(cx,cy);
      });
      g.stroke();
    }
  }
  if(winT>=0)winT+=dt;
  for(const k in wiggles){wiggles[k]-=dt;if(wiggles[k]<=0)delete wiggles[k];}
  if(pour){pour.t+=dt*4;if(pour.t>=1)pour=null;}
  // slots
  cellRects.forEach(cr=>{
    const c=cr.c;
    const key=c.gx+","+c.gy;
    const w=wiggles[key]>0;
    if(c.locked){
      tube(cr.x,cr.y,cr.s,c.color,1,{bubbles:true,lockDot:true});
    }else if(c.placed!==null){
      let fill=1;
      if(pour&&pour.cell===c)fill=Math.min(1,pour.t);
      tube(cr.x,cr.y,cr.s,tray[c.placed].color,fill,
        {bubbles:state==="won",wiggle:w,err:w,hot:state==="won"&&winT<1.6});
    }else{
      // empty slot
      g.strokeStyle="rgba(255,255,255,0.14)";
      g.setLineDash([5,5]);
      g.lineWidth=1.5;
      const w2=cr.s*0.62,h2=cr.s*0.9;
      g.beginPath();
      g.roundRect?g.roundRect(cr.x+(cr.s-w2)/2,cr.y+(cr.s-h2)/2,w2,h2,8):g.rect(cr.x+(cr.s-w2)/2,cr.y+(cr.s-h2)/2,w2,h2);
      g.stroke();
      g.setLineDash([]);
    }
  });
  // tray
  g.fillStyle="rgba(255,255,255,0.04)";
  g.beginPath();
  g.roundRect?g.roundRect(14,H-172,W-28,130,18):g.rect(14,H-172,W-28,130);
  g.fill();
  trayRects.forEach(tr=>{
    const t=tray[tr.i];
    if(t.used)return;
    tube(tr.x,tr.y,tr.s,t.color,1,{lift:sel===tr.i,hot:sel===tr.i});
  });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ---------- input ---------- */
cv.addEventListener("pointerdown",e=>{
  if(state!=="play")return;
  audio();
  const r=cv.getBoundingClientRect();
  const px=e.clientX-r.left,py=e.clientY-r.top;
  // tray hit
  for(const tr of trayRects){
    if(px>=tr.x-4&&px<=tr.x+tr.s+4&&py>=tr.y-12&&py<=tr.y+tr.s+6&&!tray[tr.i].used){
      sel=sel===tr.i?-1:tr.i;
      tink();
      return;
    }
  }
  // cell hit
  for(const cr of cellRects){
    if(px>=cr.x&&px<=cr.x+cr.s&&py>=cr.y&&py<=cr.y+cr.s){
      const c=cr.c;
      if(c.locked)return;
      if(c.placed!==null){
        tray[c.placed].used=false;
        c.placed=null;
        tink();
        return;
      }
      if(sel>=0){
        c.placed=sel;
        tray[sel].used=true;
        sel=-1;
        pour={cell:c,t:0};
        bloop();
        try{navigator.vibrate&&navigator.vibrate(8);}catch(e2){}
        setTimeout(fullCheck,280);
      }
      return;
    }
  }
});

window.BL={
  get state(){return state;},get spec(){return spec;},get cells(){return cells;},
  get tray(){return tray;},get SV(){return SV;},get sel(){return sel;},
  get trayRects(){return trayRects;},get cellRects(){return cellRects;},
  loadLevel,
  place(trayIdx,cellIdx){
    const c=cells[cellIdx];
    if(c.locked||c.placed!==null||tray[trayIdx].used)return false;
    c.placed=trayIdx;tray[trayIdx].used=true;fullCheck();return true;
  },
  unplace(cellIdx){
    const c=cells[cellIdx];
    if(c.locked||c.placed===null)return false;
    tray[c.placed].used=false;c.placed=null;return true;
  },
  solve(){
    cells.forEach(c=>{
      if(c.locked)return;
      if(c.placed!==null){tray[c.placed].used=false;c.placed=null;}
    });
    cells.forEach(c=>{
      if(c.locked)return;
      const ti=tray.findIndex(t=>!t.used&&sameC(t.color,c.color));
      c.placed=ti;tray[ti].used=true;
    });
    fullCheck();
  },
  wrongFill(){
    const open=cells.filter(c=>!c.locked&&c.placed===null);
    open.forEach(c=>{
      let ti=tray.findIndex((t,i)=>!t.used&&!sameC(t.color,c.color));
      if(ti<0)ti=tray.findIndex(t=>!t.used);
      c.placed=ti;tray[ti].used=true;
    });
    fullCheck();
  },
  get wiggling(){return Object.keys(wiggles).length;},
  next(){$("fNext").click();},
  start(){$("spGo").click();},
};
document.addEventListener("visibilitychange",()=>{
  try{if(!AC)return;document.hidden?AC.suspend():AC.resume();}catch(e){}
});
</script>
