function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}

let AC=null,muted=false,droneOsc=null,droneGain=null,MB=null;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();
  if(AC&&!MB){
    const mg=AC.createGain();mg.gain.value=0.55;
    const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=3600;
    mg.connect(lp).connect(AC.destination);MB=mg;
  }
  return AC;}catch(e){return null;}}
function beep(f,d,type,vol,slide){
  if(muted)return;const a=audio();if(!a)return;
  const o=a.createOscillator(),v=a.createGain(),t=a.currentTime;
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  v.gain.setValueAtTime(0.0001,t);
  v.gain.linearRampToValueAtTime(vol||0.045,t+0.018);
  v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(v).connect(MB);o.start(t);o.stop(t+d+0.02);
}
function kaching(){[523,659,784].forEach((f2,i)=>setTimeout(()=>beep(f2,0.16,"sine",0.038),i*70));}
function noiseSfx(dur,f0,f1,vol){
  if(muted)return;const a=audio();if(!a)return;
  const len=a.sampleRate*dur,buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
  const src=a.createBufferSource(),ff=a.createBiquadFilter(),v=a.createGain();
  src.buffer=buf;ff.type="bandpass";ff.frequency.setValueAtTime(f0,a.currentTime);
  ff.frequency.exponentialRampToValueAtTime(f1,a.currentTime+dur);ff.Q.value=1.4;
  v.gain.value=vol;src.connect(ff).connect(v).connect(MB);src.start();
}
function sizzle(){noiseSfx(0.7,2400,900,0.05);}
function midi(n){return 440*Math.pow(2,(n-69)/12);}
const SONGS=[

let mTimer=null,mStep=0,mNext=0;
function schedNote(fr,t0,d,type,vol,det){
  const o=AC.createOscillator(),v=AC.createGain();
  o.type=type;o.frequency.value=fr;if(det)o.detune.value=det;
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(vol,t0+0.025);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(v).connect(MB);o.start(t0);o.stop(t0+d+0.05);
}
function musicTick(){
  if(!AC||!MB)return;
  if(muted){mNext=AC.currentTime+0.12;return;}
  const S=SONGS[(state!=="menu"&&day>=3)?1:0];
  const stepDur=60/S.bpm/2;
  if(mNext<AC.currentTime)mNext=AC.currentTime+0.05;
  while(mNext<AC.currentTime+0.4){
    const st=mStep%32;
    if(st%8===0){
      const b=S.bass[(st/8)|0];
      schedNote(midi(b),mNext,stepDur*6.5,"triangle",0.03*S.vol);
    }
    const m=S.mel[st];
    if(m!==null&&m!==undefined){
      schedNote(midi(m),mNext,stepDur*1.7,"sine",0.02*S.vol);
      if(S===SONGS[1])schedNote(midi(m),mNext,stepDur*1.7,"sine",0.012,9);
    }
    mNext+=stepDur;mStep++;
  }
}
function ensureMusic(){
  if(mTimer||!audio())return;
  mNext=AC.currentTime+0.15;
  mTimer=setInterval(musicTick,110);
}

function jingle(minor){
  const notes=minor?[392,466,587,466]:[523,659,784,1046];
  notes.forEach((f2,i)=>setTimeout(()=>beep(f2,0.22,"sine",0.04),i*150));
}
function rumble(){
  if(muted)return;const a=audio();if(!a)return;
  const len=a.sampleRate*1.1,buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
  const src=a.createBufferSource(),f2=a.createBiquadFilter(),v=a.createGain();
  src.buffer=buf;f2.type="lowpass";f2.frequency.value=110;
  v.gain.value=0.1;f2.frequency.value=95;src.connect(f2).connect(v).connect(MB);src.start();
}
function buzz(){beep(150,0.22,"sine",0.035,95);}
function readyDing(){beep(880,0.14,"sine",0.04,1175);}
function whisper(){
  if(muted)return;const a=audio();if(!a)return;
  const len=a.sampleRate*0.7,buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len)*0.4;
  const src=a.createBufferSource(),f=a.createBiquadFilter(),v=a.createGain();
  src.buffer=buf;f.type="bandpass";f.frequency.value=900+Math.random()*700;f.Q.value=6;
  v.gain.value=0.02;src.connect(f).connect(v).connect(MB);src.start();
}
function setDrone(on,freq){
  const a=audio();if(!a)return;
  if(on&&!droneOsc&&!muted){
    droneOsc=a.createOscillator();droneGain=a.createGain();
    droneOsc.type="triangle";droneOsc.frequency.value=freq||48;
    droneGain.gain.value=0.0001;
    droneGain.gain.linearRampToValueAtTime(0.012,a.currentTime+1.5);
    droneOsc.connect(droneGain).connect(MB);droneOsc.start();
  }else if(!on&&droneOsc){try{droneOsc.stop();}catch(e){}droneOsc=null;droneGain=null;}
  if(droneOsc&&freq)droneOsc.frequency.value=freq;
}

function drawSprite(key,x,y,sc,alpha,flip){
  const s=SPR[key];if(!s)return;
  g.save();if(alpha!==undefined)g.globalAlpha=alpha;
  for(let r=0;r<s.rows.length;r++){
    const row=s.rows[r];
    for(let c2=0;c2<row.length;c2++){
      const ch=row[c2];if(ch===".")continue;
      let col=s.map[ch]||ch;
      if(col==="H")col=curPal.hair;if(col==="E")col=curPal.eye;if(col==="T")col=curPal.shirt;
      const cx=flip?(row.length-1-c2):c2;
      g.fillStyle=col;
      g.fillRect(x+cx*sc,y+r*sc,sc+0.5,sc+0.5);
    }
  }
  g.restore();
}

      g.save();g.translate(W/2-30+rs4()*60,H*0.38+rs4()*H*0.15);
      g.rotate(rs4()*6);
      for(let a2=0;a2<5;a2++){g.rotate(1.257);g.fillRect(-1.5,-7,3,7);}
      g.restore();
    }
    if(stick.slap&&stick.slap.t>0){stick.slap.t-=0.016;
      g.save();g.translate(stick.slap.x,stick.slap.y);g.rotate(stick.slap.r);
      g.fillStyle="#ffd95e";
      for(let a2=0;a2<5;a2++){g.rotate(1.257);g.fillRect(-2,-11,4,11);}
      g.restore();}
    g.fillStyle="#e8c46a";g.font="bold 26px 'Courier New',monospace";
    g.fillText(Math.min(500,stick.n)+" / 500",W/2,H*0.65);
    if(!stick.done){
      g.fillStyle="#8fe08a";g.font="bold 13px 'Courier New',monospace";
      g.fillText("TAP TAP TAP — "+Math.max(0,stick.t).toFixed(1)+"s",W/2,H*0.71);
    }else{
      g.fillStyle="#b8a8d8";g.font="11px 'Courier New',monospace";
      g.fillText(stick.n>=500?"all five hundred. HQ is unsettled.":"the rest got 'quality checked'.",W/2,H*0.71);
      g.fillStyle="#8fe08a";g.font="bold 13px 'Courier New',monospace";
      g.fillText("+$"+stick.pay+" · TAP TO SLEEP",W/2,H*0.76);
    }
  }
  drawIntro();
  scanlines();
  glitch();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.CT={
  get state(){return state},get money(){return money},get day(){return day},
  get tray(){return tray},get customers(){return customers},get served(){return served},
  start(){day=1;money=0;tips=0;excel=0;stickerDone=false;upgrades={fryer:0,oven:0,keg:0,ladle:0,charm:0,register:0};menuOn={poutine:true,cookie:true,coffee:true,wings:true,tart:true,slush:true};startDay();},
  make,cheatServe(){const c=customers[0];if(!c)return;tray=c.order.slice();serve(0);},
  setDay(d){day=d;startDay();},endDay,spawn(k){spawnCustomer(k);},
  get craft(){return craft},
  craftAuto(){
    let guard=20;
    while(craft&&guard-->0){
      if(craft.k==="coffee"){craft.idx++;if(craft.idx>=craft.need)craftDone();}
      else{craft.taps=5;craftDone();}
    }
  },
  get events(){return{burn:evBurn,rush:evRush}},
  get stick(){return stick},
  get tips(){return tips},get excel(){return excel},
  get menuOn(){return menuOn},toggleMenu(k){menuOn[k]=!menuOn[k];},
  get troy(){return troyHere},
  danceTroy(){if(troyHere)troyHere.danceT=2.8;},
};
</script>
