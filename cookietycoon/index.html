let AC=null,muted=false,droneOsc=null,droneGain=null,MB=null;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();
  if(AC&&!MB){
    const mg=AC.createGain();mg.gain.value=0.55;
    const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=3600;
    mg.connect(lp).connect(AC.destination);MB=mg;
  }
  return AC;}catch(e){return null;}}
function beep(f,d,type,vol,slide){
  if(muted)return;const a=audio();if(!a)return;
  const o=a.createOscillator(),v=a.createGain(),t=a.currentTime;
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  v.gain.setValueAtTime(0.0001,t);
  v.gain.linearRampToValueAtTime(vol||0.045,t+0.018);
  v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(v).connect(MB);o.start(t);o.stop(t+d+0.02);
}
function kaching(){beep(784,0.12,"sine",0.05);setTimeout(()=>beep(1175,0.18,"sine",0.045),80);}
function clickSfx(){beep(1600,0.04,"sine",0.02);}
function jingle(minor){
  const notes=minor?[392,466,587,466]:[523,659,784,1046];
  notes.forEach((f2,i)=>setTimeout(()=>beep(f2,0.22,"sine",0.04),i*150));
}
function rumble(){
  if(muted)return;const a=audio();if(!a)return;
  const len=a.sampleRate*1.1,buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
  const src=a.createBufferSource(),f2=a.createBiquadFilter(),v=a.createGain();
  src.buffer=buf;f2.type="lowpass";f2.frequency.value=110;
  v.gain.value=0.1;f2.frequency.value=95;src.connect(f2).connect(v).connect(MB);src.start();
}
function buzz(){beep(150,0.22,"sine",0.035,95);}
function readyDing(){beep(880,0.14,"sine",0.04,1175);}
function whisper(){
  if(muted)return;const a=audio();if(!a)return;
  const len=a.sampleRate*0.7,buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len)*0.4;
  const src=a.createBufferSource(),f=a.createBiquadFilter(),v=a.createGain();
  src.buffer=buf;f.type="bandpass";f.frequency.value=900+Math.random()*700;f.Q.value=6;
  v.gain.value=0.02;src.connect(f).connect(v).connect(MB);src.start();
}
function setDrone(on,freq){
  const a=audio();if(!a)return;
  if(on&&!droneOsc&&!muted){
    droneOsc=a.createOscillator();droneGain=a.createGain();
    droneOsc.type="triangle";droneOsc.frequency.value=freq||48;
    droneGain.gain.value=0.0001;
    droneGain.gain.linearRampToValueAtTime(0.012,a.currentTime+1.5);
    droneOsc.connect(droneGain).connect(MB);droneOsc.start();
  }else if(!on&&droneOsc){try{droneOsc.stop();}catch(e){}droneOsc=null;droneGain=null;}
  if(droneOsc&&freq)droneOsc.frequency.value=freq;
}

function drawSprite(key,x,y,sc,alpha,flip){
  const s=SPR[key];if(!s)return;
  g.save();if(alpha!==undefined)g.globalAlpha=alpha;
  for(let r=0;r<s.rows.length;r++){
    const row=s.rows[r];
    for(let c2=0;c2<row.length;c2++){
      const ch=row[c2];if(ch===".")continue;
      let col=s.map[ch]||ch;
      if(col==="H")col=curPal.hair;if(col==="E")col=curPal.eye;if(col==="T")col=curPal.shirt;
      const cx=flip?(row.length-1-c2):c2;
      g.fillStyle=col;
      g.fillRect(x+cx*sc,y+r*sc,sc+0.5,sc+0.5);
    }
  }
  g.restore();
}

function spawnCustomer(force){
  if(customers.length>=3)return;
  let kind="cust";
  if(force)kind=force;
  else if(day===4&&!customers.some(c=>c.kind==="leather")&&Math.random()<0.25)kind="leather";
  else if(day===5&&!customers.some(c=>c.kind==="deadite")&&Math.random()<0.3)kind="deadite";
  else if(day>=6&&served>=3&&!roDone&&!customers.some(c=>c.kind==="ro")){kind="ro";roDone=true;}
  else if(day>=6&&!customers.some(c=>c.kind==="bowie")&&Math.random()<0.3)kind="bowie";
  const order=[];
  if(kind==="ro")order.push("poutine","cookie","coffee","wings");
  else if(kind==="leather")order.push("wings","wings","wings");
  else if(kind==="deadite")order.push("cookie",Math.random()<0.5?"cookie":"coffee");
  else if(kind==="bowie")order.push("coffee",Math.random()<0.5?"poutine":"cookie");
  else{const n=1+((Math.random()*Math.min(3,1+day*0.6))|0);
    for(let i=0;i<n;i++)order.push(FKEYS[(Math.random()*4)|0]);}
  let pat=(12+order.length*4)*CHARM_F[upgrades.charm];
  if(kind==="ro")pat=45;
  customers.push({kind,order,pat,maxPat:pat,
    hair:HAIRS[(Math.random()*HAIRS.length)|0],
    shirt:SHIRTS[(Math.random()*SHIRTS.length)|0],
    eye:"#241f1c",x:-60,slot:customers.length,wob:Math.random()*6.28});
  if(kind==="leather"){say("K",pick(LINES.day4),4);setDrone(true,36);}
  if(kind==="deadite"){say("D",pick(LINES.deadite),4);whisper();}
  if(kind==="bowie"){say("B",pick(LINES.bowie),4.5);}
  if(kind==="ro"){say("R","One of everything. Nice apron, kid. It was mine.",5);
    say("K","...Aunt Ro?!",4);}
}

const DAYSUB=["","saturday · 9 am","sunday · still lovely","monday · the lights hum",
  "tuesday · he brings his own apron","wednesday · the book wakes up","thursday · the maze arrives"];
function startDay(){
  state="play";served=0;servedTarget=4+day;tray=[];resetStations();
  customers=[];leavers=[];spawnT=2.0;elapsed=0;
  if(day<6)roDone=false;
  intro={t:2.4,txt:"DAY "+day,sub:DAYSUB[Math.min(6,day)]||""};
  jingle(day>=3);
  nextLightning=3+Math.random()*5;
  if(day===1)say("K",pick(LINES.keiraStart),3.5);
  if(day===3)say("K",pick(LINES.day3),4);
  if(day===5)say("K",pick(LINES.day5),4);
  if(day===6)say("K",pick(LINES.day6),4.5);
  setDrone(day>=5,day===6?30:40);
  if(day<5)setDrone(false);
}
function endDay(){
  state="shop";shopMsg="";setDrone(false);
  if(money>best){best=money;try{localStorage.setItem("ct-best",""+best);}catch(e){}}
}

function make(k){
  const st=stations[k];if(st.busy||state!=="play")return;
  if(tray.length>=5){buzz();return;}
  let t=FOODS[k].time;
  if(k==="wings")t*=FRYER_F[upgrades.fryer];
  if(k==="coffee")t*=KEG_F[upgrades.keg];
  if(k==="poutine")t*=LADLE_F[upgrades.ladle];
  if(k==="cookie")t*=OVEN_F[upgrades.oven];
  st.busy=true;st.t=t;st.total=t;
  beep(300,0.07,"square",0.05,420);
}
function finishItem(k){
  tray.push(k);trayPop=0.25;
  if(k==="cookie"&&upgrades.oven>=2&&tray.length<5)tray.push("cookie");
  readyDing();
}
function serve(ci){
  const c=customers[ci];if(!c)return;
  const need=c.order.slice(),got=[];
  for(const o of need){const i=tray.indexOf(o);
    if(i<0){buzz();say("K",pick(LINES.wrong),2.5);return;}
    got.push(i);}
  got.sort((a,b)=>b-a).forEach(i=>tray.splice(i,1));
  let pay=0;for(const o of need)pay+=FOODS[o].price;
  const tip=Math.round(pay*0.5*(c.pat/c.maxPat)*REG_F[upgrades.register]);
  let bonus=0;
  if(c.kind==="bowie"){bonus=20;say("B","A crystal. Nothing more.",3);}
  if(c.kind==="leather"){setDrone(day>=5);say("L","...family thanks you.",3);}
  if(c.kind==="deadite")say("D","the book is... satisfied.",3);
  if(c.kind==="ro"){bonus=100;
    say("R","Thirty years catering the maze. Your gravy's better. Don't tell anyone.",5);}
  money+=pay+tip+bonus;served++;
  kaching();
  const L2=layout();
  pops.push({x:c.sx||W/2,y:L2.counterY-CHH*L2.p-40,txt:"$"+(pay+tip+bonus),t:1});
  for(let i=0;i<5;i++)coins.push({x:c.sx,y:L2.counterY-40,t:0,
    dx:(Math.random()-0.5)*90,dy:-90-Math.random()*70});
  c.happy=true;c.vx=140;leavers.push(c);
  customers.splice(ci,1);customers.forEach((cc,i)=>cc.slot=i);
  if(served>=servedTarget)endDay();
}

function layout(){
  const p=PS();
  const counterY=H*0.60;
  const stW=Math.min(86,(W-30)/4-6),stH=74;
  const sx=(W-(stW*4+18))/2;

addEventListener("pointerdown",e=>{

  audio();

  if(state==="menu"){day=1;money=0;upgrades={fryer:0,oven:0,keg:0,ladle:0,charm:0,register:0};startDay();return;}
  if(state==="over"){state="menu";return;}
  if(state==="shop"){

    SHOP.forEach((it,i)=>{

        const lv=upgrades[it.k];
        if(lv>=it.tiers.length){shopMsg="maxed out";return;}
        const tier=it.tiers[lv];
        if(money<tier.price){shopMsg="not enough money";buzz();return;}
        money-=tier.price;upgrades[it.k]=lv+1;
        shopMsg=it.name+" → level "+(lv+1);kaching();
      }
    });
    const ny=by0+SHOP.length*52+12;
    if(y>ny&&y<ny+50){
      if(day>=6)state="over";

    }
    return;
  }
  if(state==="story"){
    day++;startDay();return;
  }
  if(state!=="play")return;

  for(const st of L.stations)
    if(x>st.x&&x<st.x+st.w&&y>st.y&&y<st.y+st.h){make(st.k);return;}

});

  }
}

function lighting(t){
  const d=dread();
  if(d<=0.02){
    const L2=layout();
    const glow=g.createRadialGradient(W/2,L2.counterY+20,20,W/2,L2.counterY+20,W*0.75);
    glow.addColorStop(0,"rgba(255,220,170,0.10)");glow.addColorStop(1,"rgba(255,220,170,0)");
    g.fillStyle=glow;g.fillRect(0,0,W,H);
    return;
  }
  let dark=(0.16+d*0.3)*flick;
  if(lightsOutT>0)dark=0.72;
  if(lightningT>0.1)dark*=0.15;
  lg.clearRect(0,0,W,H);
  lg.fillStyle=`rgba(8,4,20,${dark})`;
  lg.fillRect(0,0,W,H);
  lg.globalCompositeOperation="destination-out";
  const L2=layout();
  const pool=lg.createRadialGradient(W/2,L2.counterY+30,30,W/2,L2.counterY+30,W*0.62);
  pool.addColorStop(0,"rgba(0,0,0,0.95)");pool.addColorStop(1,"rgba(0,0,0,0)");
  lg.fillStyle=pool;lg.fillRect(0,0,W,H);
  for(const c of customers){
    const cx2=c.sx||W/2,cy2=L2.counterY-40;
    const cp=lg.createRadialGradient(cx2,cy2,6,cx2,cy2,86);
    cp.addColorStop(0,"rgba(0,0,0,0.9)");cp.addColorStop(1,"rgba(0,0,0,0)");
    lg.fillStyle=cp;lg.fillRect(cx2-90,cy2-90,180,180);
  }
  lg.globalCompositeOperation="source-over";
  g.drawImage(lightCv,0,0,W,H);
  for(const c of customers){
    if(c.kind==="cust")continue;
    const cx2=c.sx||W/2,cy2=L2.counterY-16;
    const col=c.kind==="bowie"?"140,180,255":"216,60,50";
    const ug=g.createRadialGradient(cx2,cy2,4,cx2,cy2,60);
    ug.addColorStop(0,`rgba(${col},0.28)`);ug.addColorStop(1,`rgba(${col},0)`);
    g.fillStyle=ug;g.fillRect(cx2-64,cy2-64,128,128);
  }
}
function drawIntro(){
  if(!intro)return;
  const a=Math.min(1,intro.t,(2.4-intro.t)*2.2);
  g.globalAlpha=Math.max(0,a);
  g.fillStyle="rgba(12,7,22,0.55)";g.fillRect(0,H*0.16,W,H*0.15);
  g.textAlign="center";
  g.fillStyle="#f0ecdc";g.font="bold 32px 'Courier New',monospace";
  g.fillText(intro.txt,W/2,H*0.225);
  g.fillStyle=day>=3?"#c98ba0":"#b8a8d8";g.font="13px 'Courier New',monospace";
  g.fillText(intro.sub,W/2,H*0.275);
  g.globalAlpha=1;
}
function card(title,lines,foot){
  g.fillStyle="rgba(16,10,26,0.88)";g.fillRect(0,0,W,H);
  const bw=Math.min(360,W-30),bx=(W-bw)/2,by=H*0.14;
  g.fillStyle="#241a38";g.strokeStyle="#e8c46a";g.lineWidth=2.5;
  g.beginPath();g.roundRect(bx,by,bw,H*0.66,12);g.fill();g.stroke();
  g.textAlign="center";g.fillStyle="#e8c46a";
  g.font="bold 21px 'Courier New',monospace";
  g.fillText(title,W/2,by+42);
  g.font="12px 'Courier New',monospace";g.fillStyle="#f0ecdc";
  lines.forEach((l,i)=>{
    if(l.startsWith("~")){g.fillStyle="#b8a8d8";g.fillText(l.slice(1),W/2,by+76+i*20);g.fillStyle="#f0ecdc";}
    else g.fillText(l,W/2,by+76+i*20);
  });
  g.fillStyle="#8fe08a";g.font="bold 13px 'Courier New',monospace";
  g.fillText(foot,W/2,by+H*0.66-24);
  return{bx,by,bw};
}

let lt=0;
function frame(ts){
  const t=ts/1000,dt=Math.min(0.05,(t-lt)||0.016);lt=t;
  if(state==="play"){
    elapsed+=dt;
    spawnT-=dt;
    if(spawnT<=0&&served+customers.length<servedTarget+2){
      spawnCustomer();
      spawnT=Math.max(2.2,5.5-day*0.4)+Math.random()*2;
    }
    for(const k of FKEYS){const s=stations[k];
      if(s.busy){s.t-=dt;if(s.t<=0){s.busy=false;finishItem(k);}}}
    for(let i=customers.length-1;i>=0;i--){
      const c=customers[i];c.pat-=dt;
      if(c.pat<=0){c.angry=true;c.vx=-160;leavers.push(c);
        customers.splice(i,1);customers.forEach((cc,j)=>cc.slot=j);
        say("K",pick(LINES.angry),2.5);buzz();served++;
        if(served>=servedTarget)endDay();}
    }
    if(day>=3&&Math.random()<dt*0.06){glitchT=0.12;if(Math.random()<0.4)whisper();}
    if(day>=3&&lightsOutT<=0&&Math.random()<dt*(0.03+dread()*0.12)){
      lightsOutT=0.09+Math.random()*0.12;clickSfx();}
    if(day>=6){nextLightning-=dt;
      if(nextLightning<=0){lightningT=0.5;rumble();nextLightning=5+Math.random()*7;}}
  }
  lightsOutT=Math.max(0,lightsOutT-dt);
  lightningT=Math.max(0,lightningT-dt);
  flickTarget=1-(day>=3?Math.random()*0.16*dread():0);
  flick+=(flickTarget-flick)*Math.min(1,dt*14);
  trayPop=Math.max(0,trayPop-dt);
  if(intro){intro.t-=dt;if(intro.t<=0)intro=null;}
  for(let i=leavers.length-1;i>=0;i--){const c=leavers[i];
    c.x+=c.vx*dt;c.hopT=(c.hopT||0)+dt;
    if(c.x<-80||c.x>W+80)leavers.splice(i,1);}
  for(let i=coins.length-1;i>=0;i--){const q=coins[i];
    q.t+=dt;q.x+=q.dx*dt;q.y+=q.dy*dt;q.dy+=340*dt;
    if(q.t>0.8)coins.splice(i,1);}
  for(const k of FKEYS){const st2=stations[k];
    if(st2.busy&&Math.random()<0.25){
      const L2=layout(),box=L2.stations.find(o=>o.k===k);
      steam.push({x:box.x+box.w/2+(Math.random()-0.5)*20,y:box.y+6,t:0.9,r:3+Math.random()*3});}}
  for(let i=steam.length-1;i>=0;i--){const q=steam[i];
    q.t-=0.016;q.y-=26*0.016;q.r+=6*0.016;
    if(q.t<=0)steam.splice(i,1);}
  for(const q of pops)q.t-=dt;pops=pops.filter(q=>q.t>0);
  for(const m of msgs)m.t-=dt;msgs=msgs.filter(m=>m.t>0);
  glitchT=Math.max(0,glitchT-dt);

  surrealBG(t);
  drawStand(t);
  if(state==="play"||state==="shop"){
    for(const c of leavers){
      curPal={hair:c.hair,eye:c.eye,shirt:c.shirt};
      const L2=layout();
      const hop=c.happy?-Math.abs(Math.sin((c.hopT||0)*9))*8:0;
      const key=c.kind==="cust"?"cust":c.kind;
      drawSprite(key,c.x,L2.counterY-CHH*L2.p-6+hop,L2.p,c.kind==="bowie"?0.7:1);
      if(c.happy&&Math.random()<0.12){
        g.fillStyle="#ef6f96";g.font="12px 'Courier New',monospace";
        g.fillText("♥",c.x+14+Math.random()*10,L2.counterY-CHH*L2.p-14);}
      if(c.angry&&Math.random()<0.2){
        g.fillStyle="#d8433f";g.font="12px 'Courier New',monospace";
        g.fillText("!",c.x+10,L2.counterY-CHH*L2.p-16);}
    }
    drawCustomers(t,dt);
    for(const q of steam){
      g.globalAlpha=q.t*0.4;g.fillStyle="#f0ecdc";
      g.beginPath();g.arc(q.x,q.y,q.r,0,6.29);g.fill();g.globalAlpha=1;}
    drawUI(t);
    for(const q of coins){
      g.globalAlpha=Math.max(0,1-q.t*1.2);
      g.fillStyle="#e8c46a";g.beginPath();g.arc(q.x,q.y,3.4,0,6.29);g.fill();
      g.fillStyle="#f7e6b5";g.beginPath();g.arc(q.x-1,q.y-1,1.4,0,6.29);g.fill();
      g.globalAlpha=1;}
    lighting(t);
  }
  if(state==="menu"){
    const c2=card("COOKIE TYCOON",
      ["Aunt Ro ran this stand for thirty years.","She vanished during the '96 semifinal.",
       "They only ever found her ladle.","","~The stand is Keira's now.","",
       "POUTINE $9 · COOKIES $5","COFFEE $6 · WINGS $8","~(wings are boneless. nuggets, for adults.)","",
       "tap stations to cook","tap a customer to serve","",
       best?("~best haul: $"+best):"~week one starts normal."],
      "TAP TO OPEN THE STAND");
    drawSprite("keira",c2.bx+26,c2.by+38,3);
    drawSprite("cookie",c2.bx+c2.bw-52,c2.by+34,2.6);
  }
  if(state==="shop"){
    g.fillStyle="rgba(16,10,26,0.9)";g.fillRect(0,0,W,H);
    g.textAlign="center";g.fillStyle="#e8c46a";g.font="bold 20px 'Courier New',monospace";
    g.fillText("DAY "+day+" — CLOSED",W/2,H*0.13+SAT*0.5);
    g.fillStyle="#f0ecdc";g.font="12px 'Courier New',monospace";
    g.fillText("till: $"+money,W/2,H*0.13+24+SAT*0.5);
    g.fillStyle="#b8a8d8";g.font="11px 'Courier New',monospace";
    g.fillText(shopMsg||"invest in the stand:",W/2,H*0.13+44+SAT*0.5);
    const bw=Math.min(340,W-36),bx=(W-bw)/2,by0=H*0.13+68;
    SHOP.forEach((it,i)=>{
      const by=by0+i*52,lv=upgrades[it.k],max=it.tiers.length,maxed=lv>=max;
      const afford=!maxed&&money>=it.tiers[lv].price;
      g.fillStyle=maxed?"rgba(70,90,60,0.45)":afford?"#31204a":"rgba(38,28,58,0.6)";
      g.strokeStyle=maxed?"#6fce6a":afford?"#e8c46a":"#5a4a78";g.lineWidth=1.5;
      g.beginPath();g.roundRect(bx,by,bw,46,8);g.fill();g.stroke();
      g.textAlign="left";g.fillStyle=afford||maxed?"#f0ecdc":"#8a7aa8";
      g.font="bold 11px 'Courier New',monospace";
      g.fillText(it.name,bx+12,by+17);
      g.fillStyle="#b8a8d8";g.font="9px 'Courier New',monospace";
      g.fillText(maxed?"fully upgraded":it.tiers[lv].desc,bx+12,by+33);
      for(let d2=0;d2<max;d2++){
        g.fillStyle=d2<lv?"#6fce6a":"rgba(240,236,220,0.2)";
        g.beginPath();g.arc(bx+bw-86+d2*11,by+13,3.4,0,6.29);g.fill();
      }
      g.textAlign="right";g.fillStyle=maxed?"#6fce6a":afford?"#e8c46a":"#8a7aa8";
      g.font="bold 12px 'Courier New',monospace";
      g.fillText(maxed?"MAX":"$"+it.tiers[lv].price,bx+bw-12,by+35);
    });
    const ny=by0+SHOP.length*52+12;
    g.fillStyle="#8a3b3b";g.strokeStyle="#e8c46a";g.lineWidth=1.5;
    g.beginPath();g.roundRect((W-bw)/2,ny,bw,50,8);g.fill();g.stroke();
    g.textAlign="center";g.fillStyle="#f0ecdc";g.font="bold 15px 'Courier New',monospace";
    g.fillText(day>=6?"COUNT THE TILL":"CLOSE UP FOR THE NIGHT",W/2,ny+30);
  }
  if(state==="story"){
    g.fillStyle="rgba(8,4,16,0.94)";g.fillRect(0,0,W,H);
    const st2=STORY[Math.min(day,5)]||[];
    g.textAlign="center";g.fillStyle="#c98ba0";g.font="bold 15px 'Courier New',monospace";
    g.fillText("that night",W/2,H*0.26);
    g.fillStyle="#f0ecdc";g.font="13px 'Courier New',monospace";
    st2.forEach((l,i)=>{
      const lines2=[];let cur="";
      for(const w2 of l.split(" ")){const test=cur?cur+" "+w2:w2;
        if(g.measureText(test).width>W-70&&cur){lines2.push(cur);cur=w2;}else cur=test;}
      if(cur)lines2.push(cur);
      lines2.forEach((l2,j)=>g.fillText(l2,W/2,H*0.34+i*54+j*18));
    });
    g.fillStyle="#8fe08a";g.font="bold 13px 'Courier New',monospace";
    g.fillText("TAP TO SLEEP. BADLY.",W/2,H*0.82);
  }
  if(state==="over"){
    card("THE FREEZER OPENS",
      [roDone?"Aunt Ro steps out, ladle first.":"Nobody comes. The tape held.",
       roDone?"\"The maze audits its caterers":"~(you never served her. she waited.)",
       roDone?"every thirty years. You passed.\"":"",
       "","$"+money+" in the till",
       money>=best?"~NEW BEST HAUL":"~best haul: $"+best,"",
       "The eye closed. The stairs left.",
       roDone?"Ro takes the morning shift.":"The freezer hums, patient.","",
       "~the ghost left five stars. would haunt again."],
      "TAP FOR A NEW SEASON");
    if(roDone)drawSprite("ro",W/2-21,H*0.14+H*0.66-128,3);
  }
  drawIntro();
  scanlines();
  glitch();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.CT={
  get state(){return state},get money(){return money},get day(){return day},
  get tray(){return tray},get customers(){return customers},get served(){return served},
  start(){day=1;money=0;upgrades={fryer:0,oven:0,keg:0,ladle:0,charm:0,register:0};startDay();},
  make,cheatServe(){const c=customers[0];if(!c)return;tray=c.order.slice();serve(0);},
  setDay(d){day=d;startDay();},endDay,spawn(k){spawnCustomer(k);},
};
</script>
