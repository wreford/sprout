<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="description" content="youGoob — an inline video browser. Basically YouTube, legally distinct. Search, browse, and watch without leaving the page.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff0040'/%3E%3Cpath d='M13 11 L22 16 L13 21 Z' fill='%23fff'/%3E%3Ccircle cx='11' cy='9' r='2.4' fill='%23fff'/%3E%3Ccircle cx='11' cy='9' r='1' fill='%23111'/%3E%3C/svg%3E">
<title>youGoob · streaming, allegedly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f; --bg2:#181818; --card:#212121; --line:#303030;
  --ink:#f1f1f1; --dim:#aaa; --dimmer:#717171;
  --goob:#ff0040; --goob2:#ff3d6b;
  --disp:'Baloo 2',system-ui,sans-serif;
  --body:'Roboto',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body)}
body{min-height:100dvh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block}
::selection{background:rgba(255,0,64,.35)}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(15,15,15,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.hrow{display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto}
#back{width:38px;height:38px;border-radius:50%;font-size:20px;display:none;flex-shrink:0}
#back:hover{background:var(--card)}
.logo{display:flex;align-items:center;gap:6px;flex-shrink:0;cursor:pointer}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--goob);display:flex;align-items:center;justify-content:center;position:relative}
.logo .mark .tri{width:0;height:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.logo .mark .eye{position:absolute;top:4px;left:5px;width:8px;height:8px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.logo .mark .eye::after{content:"";width:3px;height:3px;border-radius:50%;background:#111;animation:googly 3s ease-in-out infinite}
@keyframes googly{0%,100%{transform:translate(1px,1px)}50%{transform:translate(-1px,0)}}
.logo .wm{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo .wm .g{color:var(--goob)}
.searchbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:100px;padding:8px 14px}
.searchbox:focus-within{border-color:var(--goob)}
.searchbox input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-size:15px}
.searchbox input::placeholder{color:var(--dimmer)}
.searchbox .ic{color:var(--dim)}
.searchbox .clr{color:var(--dim);font-size:16px;display:none}

/* chips */
#chips{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--bg);
  border-bottom:1px solid var(--line);scrollbar-width:none;max-width:900px;margin:0 auto}
#chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:13px;font-weight:500;padding:7px 13px;border-radius:9px;background:var(--card);white-space:nowrap;transition:background .14s}
.chip:hover{background:#333}
.chip.on{background:var(--ink);color:#0f0f0f;font-weight:700}

main{max-width:900px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}

/* player */
#player{display:none;background:#000;position:sticky;top:0;z-index:15}
#player.on{display:block}
.pwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.pwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pfallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--dim);padding:20px;background:#000}
.pfallback img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:.35}
.pfallback .z{position:relative;z-index:2;font-family:var(--disp);font-weight:700}
.pmeta{display:none;padding:14px 14px 6px;border-bottom:1px solid var(--line)}
.pmeta.on{display:block}
.pmeta h1{font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.25}
.pmeta .sub{color:var(--dim);font-size:12.5px;margin-top:5px}
.pmeta .ch{display:flex;align-items:center;gap:9px;margin-top:11px}
.pmeta .ch .av{width:36px;height:36px;border-radius:50%;background:var(--goob);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;color:#fff;font-size:16px}
.pmeta .ch .nm{font-weight:500;font-size:14px}
.pmeta .yt{margin-left:auto;font-size:11px;color:var(--dimmer);text-decoration:none;border:1px solid var(--line);padding:5px 10px;border-radius:100px}

/* list */
.uptitle{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--dim);padding:14px 14px 4px;letter-spacing:.02em}
#list{padding:6px 0}
.vid{display:block;width:100%;text-align:left;padding:8px 12px;transition:background .12s}
.vid:hover{background:var(--bg2)}
.vid .thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.vid .thumb img{width:100%;height:100%;object-fit:cover}
.vid .thumb .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.82);color:#fff;font-size:11px;font-weight:700;padding:1px 5px;border-radius:5px}
.vid .thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .16s;background:rgba(0,0,0,.25)}
.vid:hover .thumb .play{opacity:1}
.vid .thumb .play svg{width:52px;height:52px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.vid .meta{display:flex;gap:11px;margin-top:10px}
.vid .meta .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:var(--goob2);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;color:#fff;font-size:15px}
.vid .meta .txt{flex:1;min-width:0}
.vid .meta .t{font-size:14.5px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .meta .s{font-size:12.5px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.msg{text-align:center;color:var(--dim);font-size:13.5px;padding:40px 24px;line-height:1.9}
.msg .big{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--ink);margin-bottom:6px}
.skel{padding:8px 12px}
.skel .sh{width:100%;aspect-ratio:16/9;border-radius:12px;background:linear-gradient(90deg,var(--card) 25%,#2c2c2c 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.1s infinite}
@keyframes sk{to{background-position:-200% 0}}
.note{text-align:center;font-size:11px;color:var(--dimmer);padding:8px 16px 0;letter-spacing:.02em}
footer{text-align:center;font-size:10.5px;color:var(--dimmer);padding:26px 16px;letter-spacing:.04em;line-height:1.8}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <button id="back" title="back">←</button>
    <div class="logo" id="logo">
      <div class="mark"><div class="eye"></div><div class="tri"></div></div>
      <div class="wm">you<span class="g">Goob</span></div>
    </div>
    <label class="searchbox">
      <span class="ic">⌕</span>
      <input id="search" placeholder="Search youGoob…" autocomplete="off" enterkeyhint="search">
      <button class="clr" id="clr" title="clear">✕</button>
    </label>
  </div>
</header>

<div id="chips"></div>

<main>
  <div id="player"><div class="pwrap" id="pwrap"></div></div>
  <div class="pmeta" id="pmeta"></div>
  <div class="uptitle" id="uptitle" style="display:none"></div>
  <div id="list"></div>
  <div class="note" id="note"></div>
  <footer>youGoob is a legally-distinct inline video browser.<br>Search &amp; trending via the open Piped API · playback via YouTube's own embed.<br>We don't host, own, or understand any of it.</footer>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ── Piped API · open YouTube frontend, no key, with fallbacks ── */
const INSTANCES = [
  'https://pipedapi.kavin.rocks',
  'https://pipedapi-libre.kavin.rocks',
  'https://api.piped.yt',
  'https://pipedapi.adminforge.de',
  'https://pipedapi.reallyaweso.me',
];
let goodInstance = null;
async function piped(pathAndQuery){
  const order = goodInstance ? [goodInstance, ...INSTANCES.filter(i => i !== goodInstance)] : INSTANCES;
  for (const base of order){
    try {
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), 6500);
      const r = await fetch(base + pathAndQuery, { signal: ctl.signal });
      clearTimeout(to);
      if (r.ok){ goodInstance = base; return await r.json(); }
    } catch (e){}
  }
  return null;
}

const idFrom = u => { const m = (u || '').match(/[?&]v=([\w-]{6,})/) || (u || '').match(/([\w-]{11})/); return m ? m[1] : ''; };
function mapItem(it){
  const id = idFrom(it.url || it.videoId || '');
  if (!id) return null;
  return {
    id, title: it.title || 'Untitled',
    channel: it.uploaderName || it.uploader || 'Unknown',
    thumb: it.thumbnail || `https://i.ytimg.com/vi/${id}/hqdefault.jpg`,
    duration: it.duration || 0, views: it.views || 0,
  };
}
function fmtDur(s){ if (!s || s < 0) return ''; const h = s / 3600 | 0, m = (s % 3600) / 60 | 0, x = s % 60 | 0; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
function fmtViews(v){ if (!v) return ''; if (v >= 1e9) return (v / 1e9).toFixed(1) + 'B views'; if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M views'; if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K views'; return v + ' views'; }

/* ── curated fallback catalog (works offline / when Piped is down) ── */
const FALLBACK = [
  ['dQw4w9WgXcQ', 'Rick Astley - Never Gonna Give You Up', 'Rick Astley', 213, 1600000000],
  ['9bZkp7q19f0', 'PSY - GANGNAM STYLE', 'officialpsy', 253, 5200000000],
  ['kJQP7kiw5Fk', 'Luis Fonsi - Despacito ft. Daddy Yankee', 'Luis Fonsi', 282, 8500000000],
  ['fJ9rUzIMcZQ', 'Queen - Bohemian Rhapsody', 'Queen Official', 355, 1800000000],
  ['OPf0YbXqDm0', 'Mark Ronson - Uptown Funk ft. Bruno Mars', 'Mark Ronson', 270, 5000000000],
  ['JGwWNGJdvx8', 'Ed Sheeran - Shape of You', 'Ed Sheeran', 264, 6200000000],
  ['RgKAFK5djSk', 'Wiz Khalifa - See You Again ft. Charlie Puth', 'Wiz Khalifa', 237, 6300000000],
  ['CevxZvSJLk8', 'Katy Perry - Roar', 'Katy Perry', 269, 4000000000],
  ['hT_nvWreIhg', 'OneRepublic - Counting Stars', 'OneRepublic', 257, 4300000000],
  ['YQHsXMglC9A', 'Adele - Hello', 'Adele', 367, 3300000000],
  ['2Vv-BfVoq4g', 'Ed Sheeran - Perfect', 'Ed Sheeran', 275, 3900000000],
  ['e-ORhEE9VVg', 'Taylor Swift - Blank Space', 'Taylor Swift', 271, 3400000000],
  ['lWA2pjMjpBs', 'Katy Perry - Dark Horse ft. Juicy J', 'Katy Perry', 264, 3600000000],
  ['09R8_2nJtjg', 'Maroon 5 - Sugar', 'Maroon 5', 302, 4000000000],
  ['pRpeEdMmmQ0', 'Shakira - Waka Waka', 'Shakira', 211, 3600000000],
  ['SlPhMPnQ58k', 'Maroon 5 - Memories', 'Maroon 5', 200, 900000000],
];
const fbVideos = () => FALLBACK.map(f => ({ id: f[0], title: f[1], channel: f[2], thumb: `https://i.ytimg.com/vi/${f[0]}/hqdefault.jpg`, duration: f[3], views: f[4] }));
function fbSearch(q){ const s = q.toLowerCase(); const hits = fbVideos().filter(v => (v.title + ' ' + v.channel).toLowerCase().includes(s)); return hits.length ? hits : fbVideos(); }

/* ── state ── */
const CHIPS = ['Trending', 'Music', 'Gaming', 'Comedy', 'Live', 'Learning', 'Sports', 'News', 'History'];
let mode = 'browse', results = [], current = null, activeChip = 'Trending';
let history = JSON.parse(localStorage.getItem('yougoob-hist') || '[]');

const initials = s => (s || '?').replace(/[^A-Za-z0-9 ]/g, '').split(' ').filter(Boolean)[0]?.[0]?.toUpperCase() || '?';

function renderChips(){
  $('chips').innerHTML = CHIPS.filter(c => c !== 'History' || history.length).map(c =>
    `<button class="chip ${c === activeChip ? 'on' : ''}" data-c="${c}">${c === 'History' ? '🕑 History' : c}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    activeChip = b.dataset.c;
    $('search').value = '';
    if (activeChip === 'History') showHistory();
    else load(activeChip);
  }));
}

function videoCard(v){
  return `<button class="vid" data-id="${v.id}">
    <div class="thumb">
      <img src="${v.thumb}" alt="" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'">
      ${v.duration ? `<span class="dur">${fmtDur(v.duration)}</span>` : ''}
      <div class="play"><svg viewBox="0 0 68 48"><rect width="68" height="48" rx="12" fill="#ff0040"/><path d="M27 15 L48 24 L27 33 Z" fill="#fff"/></svg></div>
    </div>
    <div class="meta">
      <div class="av">${initials(v.channel)}</div>
      <div class="txt">
        <div class="t">${v.title}</div>
        <div class="s">${v.channel}${v.views ? ' · ' + fmtViews(v.views) : ''}</div>
      </div>
    </div>
  </button>`;
}
function renderList(vids, upNext){
  $('uptitle').style.display = upNext ? 'block' : 'none';
  if (upNext) $('uptitle').textContent = 'Up next';
  if (!vids.length){ $('list').innerHTML = `<div class="msg"><div class="big">Nothing here 🫥</div>youGoob searched the whole tube and found lint.</div>`; return; }
  $('list').innerHTML = vids.map(videoCard).join('');
  $('list').querySelectorAll('.vid').forEach(b => b.addEventListener('click', () => {
    const v = (results.concat(current ? [current] : [])).find(x => x.id === b.dataset.id) || vids.find(x => x.id === b.dataset.id);
    if (v) openVideo(v);
  }));
}

function skeletons(){ $('list').innerHTML = Array.from({ length: 6 }, () => `<div class="skel"><div class="sh"></div></div>`).join(''); $('uptitle').style.display = 'none'; }

async function load(chip){
  mode = 'browse'; setChrome();
  renderChips();
  skeletons();
  $('note').textContent = '';
  const q = chip === 'Trending' ? '' : chip;
  let vids = [];
  if (!q){
    const j = await piped('/trending?region=US');
    vids = (Array.isArray(j) ? j : (j && j.items) || []).map(mapItem).filter(Boolean);
  } else {
    const j = await piped('/search?q=' + encodeURIComponent(q + ' videos') + '&filter=videos');
    const items = (j && (j.items || j)) || [];
    vids = (Array.isArray(items) ? items : []).filter(x => (x.type ? /stream/i.test(x.type) : true)).map(mapItem).filter(Boolean);
  }
  if (!vids.length){ vids = q ? fbSearch(q) : fbVideos(); $('note').textContent = "couldn't reach the tubes · showing youGoob classics"; }
  results = vids;
  renderList(vids, false);
}

async function doSearch(q){
  activeChip = ''; renderChips();
  mode = 'browse'; setChrome();
  skeletons(); $('note').textContent = '';
  const j = await piped('/search?q=' + encodeURIComponent(q) + '&filter=videos');
  const items = (j && (j.items || j)) || [];
  let vids = (Array.isArray(items) ? items : []).filter(x => (x.type ? /stream/i.test(x.type) : true)).map(mapItem).filter(Boolean);
  if (!vids.length){ vids = fbSearch(q); $('note').textContent = "search couldn't reach the tubes · showing close-ish classics"; }
  results = vids;
  renderList(vids, false);
}

function openVideo(v){
  current = v;
  mode = 'watch'; setChrome();
  /* history */
  history = [v, ...history.filter(h => h.id !== v.id)].slice(0, 30);
  localStorage.setItem('yougoob-hist', JSON.stringify(history));
  $('player').classList.add('on');
  $('pwrap').innerHTML = `<img class="pfallback-img" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.25" src="${v.thumb}" alt="">
    <iframe src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0&autoplay=1&playsinline=1&modestbranding=1"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${v.title.replace(/"/g, '')}"></iframe>`;
  const meta = $('pmeta'); meta.classList.add('on');
  meta.innerHTML = `<h1>${v.title}</h1>
    <div class="sub">${v.views ? fmtViews(v.views) : 'on youGoob'}${v.duration ? ' · ' + fmtDur(v.duration) : ''}</div>
    <div class="ch"><div class="av">${initials(v.channel)}</div><div class="nm">${v.channel}</div>
      <a class="yt" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">open on YouTube ↗</a></div>`;
  const up = results.filter(x => x.id !== v.id);
  renderList(up.length ? up : fbVideos().filter(x => x.id !== v.id), true);
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

function showHistory(){
  mode = 'browse'; setChrome(); renderChips();
  $('note').textContent = '';
  if (!history.length){ $('list').innerHTML = `<div class="msg"><div class="big">No history yet 🍿</div>Go watch something questionable.</div>`; $('uptitle').style.display = 'none'; return; }
  results = history.slice();
  renderList(history, false);
}

function setChrome(){
  const watch = mode === 'watch';
  $('back').style.display = watch ? 'flex' : 'none';
  $('chips').style.display = watch ? 'none' : 'flex';
  if (!watch){ $('player').classList.remove('on'); $('pmeta').classList.remove('on'); $('pwrap').innerHTML = ''; }
}
function goBrowse(){ mode = 'browse'; current = null; setChrome(); renderList(results.length ? results : fbVideos(), false); window.scrollTo({ top: 0 }); }

/* ── events ── */
$('back').addEventListener('click', goBrowse);
$('logo').addEventListener('click', () => { activeChip = 'Trending'; $('search').value = ''; $('clr').style.display = 'none'; load('Trending'); window.scrollTo({ top: 0 }); });
let st = null;
$('search').addEventListener('input', e => {
  const q = e.target.value.trim();
  $('clr').style.display = q ? 'block' : 'none';
  clearTimeout(st);
  if (q.length < 2) return;
  st = setTimeout(() => doSearch(q), 420);
});
$('search').addEventListener('keydown', e => { if (e.key === 'Enter'){ const q = e.target.value.trim(); if (q) doSearch(q); e.target.blur(); } });
$('clr').addEventListener('click', () => { $('search').value = ''; $('clr').style.display = 'none'; activeChip = 'Trending'; load('Trending'); });

renderChips();
load('Trending');
</script>
</body>
</html>
