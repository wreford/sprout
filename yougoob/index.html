<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="description" content="youGoob — an inline video browser. Basically YouTube, legally distinct. Now with 200% more goobery.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff0040'/%3E%3Cpath d='M13 11 L22 16 L13 21 Z' fill='%23fff'/%3E%3Ccircle cx='11' cy='9' r='2.4' fill='%23fff'/%3E%3Ccircle cx='11' cy='9' r='1' fill='%23111'/%3E%3C/svg%3E">
<title>youGoob · streaming, allegedly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f; --bg2:#181818; --card:#212121; --line:#303030;
  --ink:#f1f1f1; --dim:#aaa; --dimmer:#717171;
  --goob:#ff0040; --goob2:#ff3d6b;
  --disp:'Baloo 2',system-ui,sans-serif;
  --body:'Roboto',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body)}
body{min-height:100dvh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block}
::selection{background:rgba(255,0,64,.35)}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(15,15,15,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.hrow{display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto}
#back{width:38px;height:38px;border-radius:50%;font-size:20px;display:none;flex-shrink:0}
#back:hover{background:var(--card)}
.logo{display:flex;align-items:center;gap:6px;flex-shrink:0;cursor:pointer}
.logo.wig{animation:wig .5s ease}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--goob);display:flex;align-items:center;justify-content:center;position:relative}
.logo .mark .tri{width:0;height:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.logo .mark .eye{position:absolute;top:4px;left:5px;width:8px;height:8px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo .mark .eye::after{content:"";width:3px;height:3px;border-radius:50%;background:#111;animation:googly 2.6s ease-in-out infinite}
@keyframes googly{0%,100%{transform:translate(1.4px,1px)}33%{transform:translate(-1.4px,1.4px)}66%{transform:translate(1px,-1px)}}
.logo .wm{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo .wm .g{color:var(--goob)}
.searchbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:100px;padding:8px 14px}
.searchbox:focus-within{border-color:var(--goob)}
.searchbox input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-size:15px}
.searchbox input::placeholder{color:var(--dimmer)}
.searchbox .ic{color:var(--dim)}
.searchbox .clr{color:var(--dim);font-size:16px;display:none}

/* chips */
#chips{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--bg);
  border-bottom:1px solid var(--line);scrollbar-width:none;max-width:900px;margin:0 auto}
#chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:13px;font-weight:500;padding:7px 13px;border-radius:9px;background:var(--card);white-space:nowrap;transition:background .14s,transform .1s}
.chip:hover{background:#333}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--ink);color:#0f0f0f;font-weight:700}
.chip.hot{background:linear-gradient(90deg,#ff0040,#ff8a00);color:#fff;font-weight:700}

main{max-width:900px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}

/* player */
#player{display:none;background:#000;position:sticky;top:0;z-index:15}
#player.on{display:block;animation:pin .3s ease}
@keyframes pin{0%{opacity:0;transform:scale(.98)}100%{opacity:1;transform:none}}
.pwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.pwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pmeta{display:none;padding:14px 14px 6px;border-bottom:1px solid var(--line)}
.pmeta.on{display:block;animation:cardIn .35s ease both}
.pmeta h1{font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.25}
.pmeta .sub{color:var(--dim);font-size:12.5px;margin-top:5px}
.pmeta .ch{display:flex;align-items:center;gap:9px;margin-top:11px}
.pmeta .ch .av{width:36px;height:36px;border-radius:50%;background:var(--goob);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;color:#fff;font-size:16px}
.pmeta .ch .nm{font-weight:500;font-size:14px}
.pmeta .yt{margin-left:auto;font-size:11px;color:var(--dimmer);text-decoration:none;border:1px solid var(--line);padding:5px 10px;border-radius:100px}
.pmeta .react{display:flex;gap:8px;margin-top:12px}
.pmeta .rbtn{font-size:12.5px;font-weight:700;background:var(--card);border-radius:100px;padding:7px 14px;display:flex;gap:6px;align-items:center;transition:transform .1s,background .14s}
.pmeta .rbtn:hover{background:#2c2c2c}
.pmeta .rbtn:active{transform:scale(.9)}
.pmeta .rbtn.boop{animation:boop .4s ease}
@keyframes boop{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}}

/* list */
.uptitle{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--dim);padding:14px 14px 4px;letter-spacing:.02em}
#list{padding:6px 0}
.vid{display:block;width:100%;text-align:left;padding:8px 12px;transition:background .12s;animation:cardIn .4s cubic-bezier(.2,1,.4,1) both}
@keyframes cardIn{0%{opacity:0;transform:translateY(16px) scale(.98)}100%{opacity:1;transform:none}}
.vid:hover{background:var(--bg2)}
.vid .thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.vid .thumb img{width:100%;height:100%;object-fit:cover}
.vid .thumb .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.82);color:#fff;font-size:11px;font-weight:700;padding:1px 5px;border-radius:5px;z-index:3}
.vid .thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .16s;background:rgba(0,0,0,.25);z-index:2}
.vid:hover .thumb .play{opacity:1}
.vid .thumb .play svg{width:56px;height:56px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6));animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.badge{position:absolute;top:6px;left:6px;z-index:4;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  color:#111;padding:3px 7px;border-radius:6px;background:var(--bc,#ff0040);overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.badge::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%{left:-70%}45%,100%{left:150%}}
.hcorner{position:absolute;right:4px;top:2px;width:34%;max-width:96px;z-index:4;animation:bob 1.7s ease-in-out infinite;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.vid .meta{display:flex;gap:11px;margin-top:10px}
.vid .meta .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:var(--goob2);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;color:#fff;font-size:15px}
.vid .meta .txt{flex:1;min-width:0}
.vid .meta .t{font-size:14.5px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .meta .s{font-size:12.5px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.msg{text-align:center;color:var(--dim);font-size:13.5px;padding:40px 24px;line-height:1.9}
.msg .big{font-family:var(--disp);font-weight:700;font-size:18px;color:var(--ink);margin-bottom:6px}
.skel{padding:8px 12px}
.skel .sh{width:100%;aspect-ratio:16/9;border-radius:12px;background:linear-gradient(90deg,var(--card) 25%,#2c2c2c 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.1s infinite}
@keyframes sk{to{background-position:-200% 0}}
.loadmsg{text-align:center;font-family:var(--disp);font-weight:700;color:var(--dim);font-size:14px;padding:14px}
.note{text-align:center;font-size:11px;color:var(--dimmer);padding:8px 16px 0;letter-spacing:.02em}
footer{text-align:center;font-size:10.5px;color:var(--dimmer);padding:26px 16px;letter-spacing:.04em;line-height:1.8}
footer b{color:var(--dim)}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:80;background:#fff;color:#111;
  font-family:var(--disp);font-weight:700;font-size:13px;padding:9px 17px;border-radius:100px;box-shadow:0 10px 30px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* the horse gallops */
.horseRun{position:fixed;bottom:15vh;left:0;width:min(48vw,360px);z-index:70;pointer-events:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <button id="back" title="back">←</button>
    <div class="logo" id="logo">
      <div class="mark"><div class="eye"></div><div class="tri"></div></div>
      <div class="wm">you<span class="g">Goob</span></div>
    </div>
    <label class="searchbox">
      <span class="ic">⌕</span>
      <input id="search" placeholder="Search youGoob…" autocomplete="off" enterkeyhint="search">
      <button class="clr" id="clr" title="clear">✕</button>
    </label>
  </div>
</header>

<div id="chips"></div>

<main>
  <div id="player"><div class="pwrap" id="pwrap"></div></div>
  <div class="pmeta" id="pmeta"></div>
  <div class="uptitle" id="uptitle" style="display:none"></div>
  <div id="list"></div>
  <div class="note" id="note"></div>
  <footer>youGoob is a legally-distinct inline video browser.<br>search &amp; trending via the open <b>Piped</b> API · playback via YouTube's own embed.<br>we don't host, own, or emotionally understand any of it.<br><span id="ticker"></span></footer>
</main>

<div id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ═════════ tiny SFX ═════════ */
const SFX = (() => {
  let ctx = null;
  const on = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); };
  function tone(f, t0, d, type = 'square', v = .06, slide = 0){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, ctx.currentTime + t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), ctx.currentTime + t0 + d);
    g.gain.setValueAtTime(v, ctx.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t0 + d);
    o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t0); o.stop(ctx.currentTime + t0 + d + .02);
  }
  return {
    blip(){ on(); tone(680, 0, .05, 'square', .05, 180); },
    pop(){ on(); tone(420, 0, .08, 'triangle', .05, 260); },
    neigh(){
      on(); const t = ctx.currentTime + .01;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(920, t);
      for (let k = 1; k <= 7; k++) o.frequency.linearRampToValueAtTime(Math.max(240, 920 - k * 95 + (k % 2 ? 120 : -40)), t + k * .07);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.08, t + .04); g.gain.exponentialRampToValueAtTime(.001, t + .6);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + .66);
    },
  };
})();

/* ═════════ Lily's horse (ported from Horse Facts) ═════════ */
function HORSE(f, o = {}){
  const gait = o.gait || 'trot';
  const P = { gallop:{spd:2.6,swing:40,knee:40,lift:15,bob:10,mane:6}, trot:{spd:3.6,swing:26,knee:26,lift:9,bob:6,mane:7},
    prance:{spd:4.4,swing:15,knee:54,lift:12,bob:6,mane:6}, idle:{spd:11,swing:4,knee:8,lift:1,bob:2,mane:11}, eat:{spd:11,swing:3,knee:6,lift:1,bob:1.5,mane:11} }[gait];
  const t = f / P.spd, step = t * 2;
  const bob = Math.abs(Math.sin(step)) * P.bob;
  const sway = (gait === 'gallop' || gait === 'prance') ? Math.sin(step) * 2.2 : 0;
  const blink = Math.sin(f / 13) < -.92;
  const headDip = gait === 'eat' ? 24 + Math.sin(f / 6) * 5 : (gait === 'prance' ? -7 : 0);
  const earFlick = Math.sin(f / 19) > .9 ? -15 : 0;
  const coat = '#b57c50', coatD = '#8c5c39', coatL = '#cf9a6d', maneC = '#5b3c25', hoof = '#2c241e', out = '#3a2e26';
  const U = 28, Lg = 30, D2R = Math.PI / 180;
  function limb(hx, hy, ph, hind, shade){
    const th1 = (P.swing * Math.sin(ph)) * D2R;
    const lift = Math.max(0, Math.sin(ph + (hind ? 2.5 : 0.7)));
    const th2 = (hind ? 1 : -1) * (P.knee * lift) * D2R;
    const kx = hx + Math.sin(th1) * U, ky = hy + Math.cos(th1) * U;
    const fx = kx + Math.sin(th1 + th2) * Lg, fy = ky + Math.cos(th1 + th2) * Lg - lift * P.lift;
    const col = shade ? coatD : coat, ang = (th1 + th2) / D2R;
    return `<path d="M${hx} ${hy} L${kx.toFixed(1)} ${ky.toFixed(1)} L${fx.toFixed(1)} ${fy.toFixed(1)}" fill="none" stroke="${out}" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M${hx} ${hy} L${kx.toFixed(1)} ${ky.toFixed(1)} L${fx.toFixed(1)} ${fy.toFixed(1)}" fill="none" stroke="${col}" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(${fx.toFixed(1)} ${fy.toFixed(1)}) rotate(${ang.toFixed(1)})"><rect x="-6.5" y="-1" width="13" height="12" rx="3.5" fill="${hoof}"/></g>`;
  }
  const off = { gallop:[0,3.5,1.0,4.4], trot:[0,Math.PI,Math.PI,0], prance:[0,Math.PI,Math.PI*.5,Math.PI*1.5], idle:[0,.5,.25,.7], eat:[0,.3,.15,.45] }[gait];
  const legFar = limb(98,116,step+off[0],true,true) + limb(190,113,step+off[1],false,true);
  const legNear = limb(110,118,step+off[2],true,false) + limb(202,115,step+off[3],false,false);
  let maneS = '';
  for (let i = 0; i < 8; i++){ const u = i/7, bx = 236-44*u, by = 52+34*u, w = Math.sin(t*1.4+i*.7)*P.mane;
    maneS += `<path d="M${bx.toFixed(1)} ${by.toFixed(1)} q${(-12+w).toFixed(1)} 11 ${(-7+w).toFixed(1)} 24" stroke="${maneC}" stroke-width="${(8-u*3).toFixed(1)}" fill="none" stroke-linecap="round"/>`; }
  let tailS = '';
  for (let i = 0; i < 7; i++){ const w = Math.sin(t*1.2+i*.55)*(P.mane+5);
    tailS += `<path d="M74 92 q${(-30+w).toFixed(1)} ${18+i*2} ${(-22+w).toFixed(1)} ${54+i*2}" stroke="${maneC}" stroke-width="${(10-i).toFixed(1)}" fill="none" stroke-linecap="round"/>`; }
  return `<svg viewBox="0 0 300 200" width="100%" style="overflow:visible">
    <ellipse cx="150" cy="190" rx="${(84-bob*1.6).toFixed(1)}" ry="8" fill="rgba(0,0,0,.18)"/>
    <g transform="translate(0 ${(-bob).toFixed(1)}) rotate(${sway.toFixed(2)} 150 108)">
      ${tailS}${legFar}
      <path d="M72 104 C64 78 104 68 150 70 C182 71 204 78 214 96 C222 110 218 128 200 134 C160 143 108 143 84 134 C70 129 68 116 72 104 Z" fill="${coat}" stroke="${out}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M78 96 C96 76 150 72 196 84 C176 78 120 78 88 96 Z" fill="${coatD}" opacity=".55"/>
      <path d="M92 134 C130 142 172 141 200 132 C176 138 120 139 92 134 Z" fill="${coatL}" opacity=".5"/>
      <g transform="rotate(${headDip} 198 92)">
        <path d="M182 96 C188 66 206 50 232 52 L250 62 C230 70 210 86 202 110 C196 118 182 116 178 106 Z" fill="${coat}" stroke="${out}" stroke-width="5" stroke-linejoin="round"/>
        <path d="M186 92 C194 68 210 54 232 54 L238 60 C214 66 198 82 190 104 Z" fill="${coatD}" opacity=".5"/>${maneS}
        <path d="M228 50 C246 42 262 48 266 62 C269 74 264 88 251 94 L236 96 C226 88 222 64 228 50 Z" fill="${coat}" stroke="${out}" stroke-width="5" stroke-linejoin="round"/>
        <path d="M251 92 C262 88 267 78 266 66 C270 78 268 90 255 96 Z" fill="${coatL}" opacity=".55"/>
        <path d="M232 34 l3 -16 l11 12 z" fill="${coat}" stroke="${out}" stroke-width="4" stroke-linejoin="round" transform="rotate(${earFlick} 236 30)"/>
        <path d="M246 34 l11 -13 l4 15 z" fill="${coatD}" stroke="${out}" stroke-width="4" stroke-linejoin="round"/>
        <path d="M234 40 q4 -14 14 -18 q-3 12 1 16 q-8 4 -11 12 z" fill="${maneC}"/>
        <ellipse cx="258" cy="82" rx="10" ry="9" fill="${coatL}" stroke="${out}" stroke-width="3.5"/>
        <ellipse cx="260" cy="79" rx="2.6" ry="3.6" fill="${out}"/>
        <path d="M252 90 q7 3 12 0" stroke="${out}" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="242" cy="60" rx="5.2" ry="${blink ? .9 : 5.6}" fill="#1c1712"/>
        ${blink ? '' : '<circle cx="244" cy="58" r="1.7" fill="#fff" opacity=".85"/>'}
        ${o.acc === 'crown' ? `<path d="M226 34 l4 -14 l8 9 l7 -14 l7 14 l8 -9 l4 14 z" fill="#f2c14e" stroke="${out}" stroke-width="3" stroke-linejoin="round"/><circle cx="240" cy="24" r="2.4" fill="#e88ca6"/>` : ''}
      </g>${legNear}
    </g></svg>`;
}
let horseBusy = false;
function gallopHorse(){
  if (horseBusy) return;
  horseBusy = true;
  SFX.neigh();
  toast(pick(HORSE_TOASTS));
  const wrap = document.createElement('div');
  wrap.className = 'horseRun';
  document.body.appendChild(wrap);
  const start = performance.now();
  let f = 0;
  function step(now){
    const p = (now - start) / 2700;
    if (p >= 1){ wrap.remove(); horseBusy = false; return; }
    f += 1.4;
    wrap.style.transform = `translateX(${(-28 + p * 156).toFixed(1)}vw) scaleX(${p < .5 ? 1 : 1})`;
    wrap.innerHTML = HORSE(f, { gait: 'gallop', acc: 'crown' });
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
const HORSE_TOASTS = ['🐴 HORSE DETECTED — Lily approves', '🐴 a wild Lily\'s horse appears', '🐴 neigh means neigh', '🐴 certified horse content', '🐴 the horse has entered the chat'];

/* ═════════ Piped API ═════════ */
const INSTANCES = ['https://pipedapi.kavin.rocks','https://pipedapi-libre.kavin.rocks','https://api.piped.yt','https://pipedapi.adminforge.de','https://pipedapi.reallyaweso.me'];
let goodInstance = null;
async function piped(pathAndQuery){
  const order = goodInstance ? [goodInstance, ...INSTANCES.filter(i => i !== goodInstance)] : INSTANCES;
  for (const base of order){
    try { const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 6500);
      const r = await fetch(base + pathAndQuery, { signal: ctl.signal }); clearTimeout(to);
      if (r.ok){ goodInstance = base; return await r.json(); } } catch (e){}
  }
  return null;
}
const idFrom = u => { const m = (u || '').match(/[?&]v=([\w-]{6,})/) || (u || '').match(/([\w-]{11})/); return m ? m[1] : ''; };
function mapItem(it){
  const id = idFrom(it.url || it.videoId || ''); if (!id) return null;
  return { id, title: it.title || 'Untitled', channel: it.uploaderName || it.uploader || 'Unknown',
    thumb: it.thumbnail || `https://i.ytimg.com/vi/${id}/hqdefault.jpg`, duration: it.duration || 0, views: it.views || 0 };
}
const fmtDur = s => { if (!s || s < 0) return ''; const h = s/3600|0, m = (s%3600)/60|0, x = s%60|0; return (h ? h+':'+String(m).padStart(2,'0') : m)+':'+String(x).padStart(2,'0'); };
const fmtViews = v => { if (!v) return ''; if (v>=1e9) return (v/1e9).toFixed(1)+'B goobs'; if (v>=1e6) return (v/1e6).toFixed(1)+'M goobs'; if (v>=1e3) return (v/1e3).toFixed(0)+'K goobs'; return v+' goobs'; };

/* ═════════ fallback catalog ═════════ */
const FALLBACK = [
  ['dQw4w9WgXcQ','Rick Astley - Never Gonna Give You Up','Rick Astley',213,1600000000],
  ['9bZkp7q19f0','PSY - GANGNAM STYLE','officialpsy',253,5200000000],
  ['kJQP7kiw5Fk','Luis Fonsi - Despacito ft. Daddy Yankee','Luis Fonsi',282,8500000000],
  ['fJ9rUzIMcZQ','Queen - Bohemian Rhapsody','Queen Official',355,1800000000],
  ['OPf0YbXqDm0','Mark Ronson - Uptown Funk ft. Bruno Mars','Mark Ronson',270,5000000000],
  ['JGwWNGJdvx8','Ed Sheeran - Shape of You','Ed Sheeran',264,6200000000],
  ['RgKAFK5djSk','Wiz Khalifa - See You Again ft. Charlie Puth','Wiz Khalifa',237,6300000000],
  ['CevxZvSJLk8','Katy Perry - Roar','Katy Perry',269,4000000000],
  ['hT_nvWreIhg','OneRepublic - Counting Stars','OneRepublic',257,4300000000],
  ['YQHsXMglC9A','Adele - Hello','Adele',367,3300000000],
  ['2Vv-BfVoq4g','Ed Sheeran - Perfect','Ed Sheeran',275,3900000000],
  ['e-ORhEE9VVg','Taylor Swift - Blank Space','Taylor Swift',271,3400000000],
  ['lWA2pjMjpBs','Katy Perry - Dark Horse ft. Juicy J','Katy Perry',264,3600000000],
  ['09R8_2nJtjg','Maroon 5 - Sugar','Maroon 5',302,4000000000],
  ['pRpeEdMmmQ0','Shakira - Waka Waka','Shakira',211,3600000000],
  ['SlPhMPnQ58k','Maroon 5 - Memories','Maroon 5',200,900000000],
];
const fbVideos = () => FALLBACK.map(f => ({ id:f[0], title:f[1], channel:f[2], thumb:`https://i.ytimg.com/vi/${f[0]}/hqdefault.jpg`, duration:f[3], views:f[4] }));
function fbSearch(q){ const s = q.toLowerCase(); const hits = fbVideos().filter(v => (v.title+' '+v.channel).toLowerCase().includes(s)); return hits.length ? hits : fbVideos(); }

/* ═════════ funny bits ═════════ */
const pick = a => a[(Math.random() * a.length) | 0];
const BADGES = [
  {t:"GOOBER'S PICK",c:'#ff0040'}, {t:'CERTIFIED BANGER',c:'#ffb020'}, {t:'100% REAL',c:'#22c07a'},
  {t:'NOT A VIRUS',c:'#4da3ff'}, {t:'YOUR DAD SAW THIS',c:'#b79bff'}, {t:'PEAK CONTENT',c:'#ff6ba8'},
  {t:'MOM APPROVED',c:'#22c07a'}, {t:'ELITE GOOBERY',c:'#ffb020'}, {t:'ZERO CHILL',c:'#4da3ff'},
  {t:'BUFFERING LEGEND',c:'#ff0040'}, {t:'FBI WATCHLIST',c:'#ff6ba8'}, {t:'8/7 GOOBS AGREE',c:'#22c07a'},
];
const LOADING = ['buffering your dopamine…','asking the tubes nicely…','bribing the algorithm…','summoning goobers…','untangling the cables…','yelling at the router…','downloading more RAM…','feeding the hamster…','consulting a horse…'];
const PLACEHOLDERS = ['Search youGoob…','type "horse". trust me. 🐴','search for regret…','find a certified banger…','search responsibly…','what are we NOT doing today','2 hours of rain on a tent','how do magnets work'];
const SPONSORS = ['Big Sock™','a horse named Kevin','your search history','raw enthusiasm','a mysterious benefactor','nothing at all','the letter G','one (1) goober','Lily\'s horse'];
const SURPRISE = ['horse','cats being jerks','oddly satisfying','goat screaming','why is this trending','1980s infomercials','how to fold a fitted sheet','lofi beats to goob to','the best 4 seconds ever','duck army'];
const EMPTY = [['nothing. nada. zilch. 🫥','youGoob searched every tube and found one (1) sock.'],['tumbleweeds 🌵','not a single goob out here.'],['hmm. 🤨','the tubes shrugged. try another word?']];
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0); }
const isHorse = s => /\bhorse|pony|equestrian|equine|stallion|mare|foal/i.test(s || '');

/* ═════════ state ═════════ */
const CHIPS = ['Trending','Horses 🐴','Surprise 🎲','Music','Gaming','Comedy','Live','Learning','Sports','News','History'];
let mode = 'browse', results = [], current = null, activeChip = 'Trending';
let history = JSON.parse(localStorage.getItem('yougoob-hist') || '[]');
const initials = s => (s || '?').replace(/[^A-Za-z0-9 ]/g,'').split(' ').filter(Boolean)[0]?.[0]?.toUpperCase() || '?';

function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }

function renderChips(){
  $('chips').innerHTML = CHIPS.filter(c => c !== 'History' || history.length).map(c => {
    const on = c === activeChip, hot = c.startsWith('Horses') || c.startsWith('Surprise');
    return `<button class="chip ${on ? 'on' : hot ? 'hot' : ''}" data-c="${c}">${c === 'History' ? '🕑 History' : c}</button>`;
  }).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    SFX.pop();
    const c = b.dataset.c; activeChip = c; $('search').value = ''; $('clr').style.display = 'none';
    if (c === 'History') showHistory();
    else if (c.startsWith('Surprise')){ const q = pick(SURPRISE); toast('🎲 rolling the goob dice…'); doSearch(q); }
    else if (c.startsWith('Horses')) doSearch('horse');
    else load(c);
  }));
}

function videoCard(v, i){
  const horse = isHorse(v.title);
  const h = hashStr(v.id);
  const showBadge = horse || (h % 10 < 6);
  const badge = horse ? { t: '🐴 HORSE', c: '#8c5c39' } : BADGES[h % BADGES.length];
  return `<button class="vid" data-id="${v.id}" style="animation-delay:${Math.min(i * 45, 500)}ms">
    <div class="thumb">
      ${showBadge ? `<span class="badge" style="--bc:${badge.c}">${badge.t}</span>` : ''}
      <img src="${v.thumb}" alt="" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'">
      ${horse ? `<div class="hcorner">${HORSE(20, { gait: 'idle' })}</div>` : ''}
      ${v.duration ? `<span class="dur">${fmtDur(v.duration)}</span>` : ''}
      <div class="play"><svg viewBox="0 0 68 48"><rect width="68" height="48" rx="12" fill="#ff0040"/><path d="M27 15 L48 24 L27 33 Z" fill="#fff"/></svg></div>
    </div>
    <div class="meta">
      <div class="av">${initials(v.channel)}</div>
      <div class="txt"><div class="t">${v.title}</div><div class="s">${v.channel}${v.views ? ' · ' + fmtViews(v.views) : ''}</div></div>
    </div>
  </button>`;
}
function renderList(vids, upNext){
  $('uptitle').style.display = upNext ? 'block' : 'none';
  if (upNext) $('uptitle').textContent = 'Up next (allegedly)';
  if (!vids.length){ const e = pick(EMPTY); $('list').innerHTML = `<div class="msg"><div class="big">${e[0]}</div>${e[1]}</div>`; return; }
  $('list').innerHTML = vids.map((v, i) => videoCard(v, i)).join('');
  $('list').querySelectorAll('.vid').forEach(b => b.addEventListener('click', () => {
    SFX.blip();
    const v = (results.concat(current ? [current] : [])).find(x => x.id === b.dataset.id) || vids.find(x => x.id === b.dataset.id);
    if (v) openVideo(v);
  }));
  if (vids.some(v => isHorse(v.title))) gallopHorse();
}
function skeletons(){ $('list').innerHTML = `<div class="loadmsg">${pick(LOADING)}</div>` + Array.from({ length: 6 }, () => `<div class="skel"><div class="sh"></div></div>`).join(''); $('uptitle').style.display = 'none'; }

async function load(chip){
  mode = 'browse'; setChrome(); renderChips(); skeletons(); $('note').textContent = '';
  const q = chip === 'Trending' ? '' : chip;
  let vids = [];
  if (!q){ const j = await piped('/trending?region=US'); vids = (Array.isArray(j) ? j : (j && j.items) || []).map(mapItem).filter(Boolean); }
  else { const j = await piped('/search?q=' + encodeURIComponent(q + ' videos') + '&filter=videos'); const items = (j && (j.items || j)) || [];
    vids = (Array.isArray(items) ? items : []).filter(x => (x.type ? /stream/i.test(x.type) : true)).map(mapItem).filter(Boolean); }
  if (!vids.length){ vids = q ? fbSearch(q) : fbVideos(); $('note').textContent = "couldn't reach the tubes · showing youGoob classics"; }
  results = vids; renderList(vids, false);
}
async function doSearch(q){
  activeChip = ''; renderChips(); mode = 'browse'; setChrome(); skeletons(); $('note').textContent = '';
  if (isHorse(q)) gallopHorse();
  const j = await piped('/search?q=' + encodeURIComponent(q) + '&filter=videos'); const items = (j && (j.items || j)) || [];
  let vids = (Array.isArray(items) ? items : []).filter(x => (x.type ? /stream/i.test(x.type) : true)).map(mapItem).filter(Boolean);
  if (!vids.length){ vids = fbSearch(q); $('note').textContent = "search couldn't reach the tubes · showing close-ish classics"; }
  results = vids; renderList(vids, false);
}

function openVideo(v){
  current = v; mode = 'watch'; setChrome();
  history = [v, ...history.filter(h => h.id !== v.id)].slice(0, 30);
  localStorage.setItem('yougoob-hist', JSON.stringify(history));
  toast(`▶ brought to you by ${pick(SPONSORS)}`);
  if (isHorse(v.title)) gallopHorse();
  $('player').classList.add('on');
  $('pwrap').innerHTML = `<img style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.25" src="${v.thumb}" alt="">
    <iframe src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0&autoplay=1&playsinline=1&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${v.title.replace(/"/g,'')}"></iframe>`;
  const meta = $('pmeta'); meta.classList.add('on');
  meta.innerHTML = `<h1>${v.title}</h1>
    <div class="sub">${v.views ? fmtViews(v.views) : 'watched by dozens'}${v.duration ? ' · ' + fmtDur(v.duration) : ''} · uploaded whenever</div>
    <div class="ch"><div class="av">${initials(v.channel)}</div><div class="nm">${v.channel}</div>
      <a class="yt" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">open on YouTube ↗</a></div>
    <div class="react">
      <button class="rbtn" data-r="like">👍 <span>${(hashStr(v.id) % 900 + 100)}K</span></button>
      <button class="rbtn" data-r="goob">🫡 Goob it</button>
      <button class="rbtn" data-r="horse">🐴 Summon horse</button>
    </div>`;
  meta.querySelectorAll('.rbtn').forEach(b => b.addEventListener('click', () => {
    b.classList.remove('boop'); void b.offsetWidth; b.classList.add('boop');
    if (b.dataset.r === 'like'){ SFX.pop(); toast(pick(['liked. the algorithm is pleased.','+1 goob to your karma','bold choice. respected.'])); }
    else if (b.dataset.r === 'goob'){ SFX.pop(); toast(pick(['GOOBED. 🫡','it has been goobed.','you goobed this. legendary.'])); }
    else { gallopHorse(); }
  }));
  const up = results.filter(x => x.id !== v.id);
  renderList(up.length ? up : fbVideos().filter(x => x.id !== v.id), true);
  window.scrollTo({ top: 0 });
}

function showHistory(){
  mode = 'browse'; setChrome(); renderChips(); $('note').textContent = '';
  if (!history.length){ $('list').innerHTML = `<div class="msg"><div class="big">no history yet 🍿</div>go watch something questionable.</div>`; $('uptitle').style.display = 'none'; return; }
  results = history.slice(); renderList(history, false);
}
function setChrome(){
  const watch = mode === 'watch';
  $('back').style.display = watch ? 'flex' : 'none';
  $('chips').style.display = watch ? 'none' : 'flex';
  if (!watch){ $('player').classList.remove('on'); $('pmeta').classList.remove('on'); $('pwrap').innerHTML = ''; }
}
function goBrowse(){ mode = 'browse'; current = null; setChrome(); renderList(results.length ? results : fbVideos(), false); window.scrollTo({ top: 0 }); }

/* ═════════ events ═════════ */
$('back').addEventListener('click', () => { SFX.blip(); goBrowse(); });
$('logo').addEventListener('click', () => { $('logo').classList.remove('wig'); void $('logo').offsetWidth; $('logo').classList.add('wig'); SFX.pop(); activeChip = 'Trending'; $('search').value = ''; $('clr').style.display = 'none'; load('Trending'); window.scrollTo({ top: 0 }); });
let st = null;
$('search').addEventListener('input', e => { const q = e.target.value.trim(); $('clr').style.display = q ? 'block' : 'none'; clearTimeout(st); if (q.length < 2) return; st = setTimeout(() => doSearch(q), 420); });
$('search').addEventListener('keydown', e => { if (e.key === 'Enter'){ const q = e.target.value.trim(); if (q) doSearch(q); e.target.blur(); } });
$('clr').addEventListener('click', () => { $('search').value = ''; $('clr').style.display = 'none'; activeChip = 'Trending'; load('Trending'); });

/* rotating placeholder + goober ticker ambiance */
let phi = 0;
setInterval(() => { const inp = $('search'); if (document.activeElement !== inp && !inp.value){ phi = (phi + 1) % PLACEHOLDERS.length; inp.placeholder = PLACEHOLDERS[phi]; } }, 3800);
let goobers = 3400 + (hashStr(location.href) % 900);
setInterval(() => { goobers += (Math.random() * 12 | 0) - 5; $('ticker').textContent = `🟢 ${goobers.toLocaleString()} goobers online right now (probably)`; }, 1400);
$('ticker').textContent = `🟢 ${goobers.toLocaleString()} goobers online right now (probably)`;

renderChips();
load('Trending');
setTimeout(() => toast(`welcome, goober #${(hashStr(location.href + Date.now() % 1e6) % 9000 + 1000)} 🫡`), 700);
</script>
