<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#241c17">
<meta name="description" content="Pygmy Marmoset — the world's smallest monkey lives in your browser now. Feed it, play with it, keep it alive.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23241c17'/%3E%3Ccircle cx='16' cy='14' r='8' fill='%23c9a06a'/%3E%3Ccircle cx='13' cy='12' r='1.6' fill='%23241c17'/%3E%3Ccircle cx='19' cy='12' r='1.6' fill='%23241c17'/%3E%3Cpath d='M12 17q4 3 8 0' stroke='%23241c17' stroke-width='1.4' fill='none'/%3E%3C/svg%3E">
<title>Pygmy Marmoset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#241c17; --panel:#332822; --panel-2:#3f322a; --line:rgba(240,222,196,.12); --line-2:rgba(240,222,196,.22);
  --ink:#f0dec4; --ink-2:#d4bfa2; --muted:#96816a;
  --gold:#e8b04b; --leaf:#7fb069; --sky:#7fb3d5; --rose:#e07a5f; --cream:#f6ead4;
  --disp:'Sora',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--disp);user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 20px);gap:14px;max-width:480px;margin:0 auto;min-height:100dvh}
header{display:flex;justify-content:space-between;align-items:baseline;width:100%}
header .t{font-weight:900;font-size:20px;letter-spacing:-.01em;text-transform:uppercase}
header .t .g{color:var(--gold)}
header .age{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:700;text-transform:uppercase}
.window{
  width:100%;aspect-ratio:1/.86;border-radius:22px;overflow:hidden;position:relative;
  background:#2b211b;border:2.5px solid var(--line-2);
  box-shadow:0 26px 50px -22px rgba(0,0,0,.75), inset 0 0 0 6px rgba(0,0,0,.28)
}
.window canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.window .name{
  position:absolute;top:12px;left:14px;padding:6px 12px;border-radius:100px;
  background:rgba(36,28,23,.75);border:1px solid var(--line-2);backdrop-filter:blur(8px);
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--gold);text-transform:uppercase;cursor:pointer
}
.window .mood{
  position:absolute;top:12px;right:14px;padding:6px 12px;border-radius:100px;
  background:rgba(36,28,23,.75);border:1px solid var(--line-2);backdrop-filter:blur(8px);
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--ink-2);text-transform:uppercase
}
.window .zzz{
  position:absolute;inset:0;background:rgba(20,15,12,.45);opacity:0;transition:opacity .6s ease;pointer-events:none;
  display:flex;align-items:flex-start;justify-content:flex-end;padding:52px 26px;
  font-family:var(--mono);font-weight:800;font-size:22px;color:var(--sky);letter-spacing:.1em
}
.window.sleeping .zzz{opacity:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stat{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px 12px}
.stat .l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.stat .l .v{color:var(--ink-2)}
.stat .bar{height:10px;border-radius:100px;background:rgba(0,0,0,.4);overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:100px;transition:width .5s ease, background .5s ease}
.stat.low .l{color:var(--rose)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.act{
  padding:14px 6px 12px;border-radius:16px;background:var(--panel-2);border:1.5px solid var(--line-2);
  color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
  font-family:var(--disp);font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
  min-height:70px;transition:transform .14s cubic-bezier(.34,1.56,.64,1), border-color .14s ease
}
.act:active{transform:scale(.93)}
.act:disabled{opacity:.38;pointer-events:none}
.act .ic{width:34px;height:34px;image-rendering:pixelated;border-radius:8px}
.act.feed{border-color:rgba(127,176,105,.5)} .act.feed:active{border-color:var(--leaf)}
.act.play{border-color:rgba(232,176,75,.5)}
.act.groom{border-color:rgba(127,179,213,.5)}
.act.sleep{border-color:rgba(224,122,95,.5)}
.tip{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:700;text-align:center;min-height:14px}
.overlay{
  position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(36,28,23,.9);backdrop-filter:blur(10px);padding:26px;text-align:center;transition:opacity .3s ease
}
.overlay.hide{opacity:0;pointer-events:none}
.overlay .k{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:800;text-transform:uppercase}
.overlay h1{font-size:clamp(30px,8vw,44px);font-weight:900;letter-spacing:-.02em;line-height:1;text-transform:uppercase}
.overlay p{font-size:14.5px;color:var(--ink-2);font-weight:600;max-width:320px;line-height:1.55}
.overlay input{
  padding:14px 18px;border-radius:12px;background:var(--panel);border:1.5px solid var(--line-2);color:var(--gold);
  font-family:var(--disp);font-weight:800;font-size:18px;text-align:center;max-width:240px;width:100%;outline:none
}
.overlay input:focus{border-color:var(--gold)}
.overlay .big{
  padding:16px 30px;border-radius:14px;background:var(--gold);color:#241c17;border:none;cursor:pointer;
  font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:.05em;text-transform:uppercase;min-height:54px;
  box-shadow:0 14px 30px -8px rgba(232,176,75,.5);transition:transform .15s cubic-bezier(.34,1.56,.64,1)
}
.overlay .big:active{transform:scale(.94)}
.fact{font-size:12px;color:var(--muted);font-weight:600;max-width:330px;line-height:1.5;font-style:italic}
</style>
</head>
<body>
<header>
  <div class="t">Pygmy <span class="g">Marmoset</span></div>
  <div class="age" id="age">Day 1</div>
</header>

<div class="window" id="win">
  <canvas id="cv" width="480" height="413"></canvas>
  <div class="name" id="nameChip">Peanut</div>
  <div class="mood" id="moodChip">Content</div>
  <div class="zzz">z z z</div>
</div>

<div class="stats">
  <div class="stat" id="stFood"><div class="l"><span>Food</span><span class="v">100</span></div><div class="bar"><i></i></div></div>
  <div class="stat" id="stEnergy"><div class="l"><span>Energy</span><span class="v">100</span></div><div class="bar"><i></i></div></div>
  <div class="stat" id="stFun"><div class="l"><span>Fun</span><span class="v">100</span></div><div class="bar"><i></i></div></div>
  <div class="stat" id="stClean"><div class="l"><span>Clean</span><span class="v">100</span></div><div class="bar"><i></i></div></div>
</div>

<div class="actions">
  <button class="act feed" id="aFeed"><canvas class="ic" width="34" height="34"></canvas>Feed</button>
  <button class="act play" id="aPlay"><canvas class="ic" width="34" height="34"></canvas>Play</button>
  <button class="act groom" id="aGroom"><canvas class="ic" width="34" height="34"></canvas>Groom</button>
  <button class="act sleep" id="aSleep"><canvas class="ic" width="34" height="34"></canvas>Sleep</button>
</div>
<div class="tip" id="tip"></div>

<div class="overlay" id="adopt">
  <span class="k">Adoption papers</span>
  <h1>Name your <br>marmoset</h1>
  <p>The world's smallest monkey. 15 cm, 100 g, fits on a finger. Yours now.</p>
  <input id="nameIn" maxlength="14" placeholder="Peanut" autocomplete="off">
  <button class="big" id="adoptBtn">Adopt</button>
</div>

<div class="overlay hide" id="gone">
  <span class="k">Empty branch</span>
  <h1 id="goneTitle">He left.</h1>
  <p id="goneMsg">Marmosets remember. Neglect one and it finds a better tree.</p>
  <div class="fact" id="goneFact"></div>
  <button class="big" id="againBtn">Adopt another</button>
</div>

<script>
'use strict';
/* ============================================================
   Pygmy Marmoset · pocket pet
   Frames are cropped live from the sheet with calibrated rects.
   Backgrounds stay — each strip's panel is the habitat.
   ============================================================ */
const SHEET = new Image();
SHEET.src = 'sheet.jpg';

/* Calibrated animation rects on the 960x960 sheet (row strips, n frames) */
const ANIM = {
  idle:  { x: 18,  y: 40,  w: 296, h: 82, n: 4, fps: 3 },
  eat:   { x: 650, y: 220, w: 295, h: 82, n: 4, fps: 5 },
  sleep: { x: 650, y: 345, w: 295, h: 84, n: 3, fps: 1.6 },
  groom: { x: 330, y: 475, w: 300, h: 96, n: 3, fps: 4 },
  play:  { x: 330, y: 605, w: 615, h: 76, n: 6, fps: 7 },
  hurt:  { x: 330, y: 345, w: 300, h: 92, n: 4, fps: 3 },
};
/* Icon crops from the sheet's UI row · leaf=feed, star=play, bug=groom
   (marmosets groom bugs out of each other's fur — accurate), nest=sleep */
const ICONS = {
  feed:  { x: 118, y: 704, s: 48 },  // leaf
  play:  { x: 70,  y: 704, s: 48 },  // star
  groom: { x: 166, y: 704, s: 48 },  // bug
  sleep: { x: 262, y: 704, s: 48 },  // nest
};

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- state ---------- */
const DEFAULTS = { food: 86, energy: 92, fun: 80, clean: 88 };
let S = null;
function load(){
  try { S = JSON.parse(localStorage.getItem('marmoset-v1') || 'null'); } catch(_){ S = null; }
  if (S && S.stats){
    // offline decay · capped so a night away stings but doesn't kill
    const dt = Math.min(6 * 3600, (Date.now() - (S.seen || Date.now())) / 1000);
    decay(dt, true);
  }
}
function save(){
  if (!S) return;
  S.seen = Date.now();
  try { localStorage.setItem('marmoset-v1', JSON.stringify(S)); } catch(_){}
}
function fresh(name){
  S = { name, adopted: Date.now(), seen: Date.now(), stats: { ...DEFAULTS }, gone: false };
  save();
}

/* per-second decay rates */
const RATE = { food: .10, energy: .065, fun: .12, clean: .05 };
function decay(dt, offline){
  if (!S || S.gone) return;
  const f = offline ? .35 : 1;      // offline decays slower
  for (const k in RATE){
    S.stats[k] = Math.max(0, S.stats[k] - RATE[k] * dt * f);
  }
}

/* ---------- animation ---------- */
let current = 'idle';
let animT = 0;
let busyUntil = 0;      // during an action, ignore other actions
let sleeping = false;

function setAnim(name, holdSec){
  current = name; animT = 0;
  if (holdSec) busyUntil = performance.now() + holdSec * 1000;
}
function drawFrame(){
  const a = ANIM[current] || ANIM.idle;
  const fw = a.w / a.n;
  const fi = Math.floor(animT * a.fps) % a.n;
  ctx.fillStyle = '#2b211b';
  ctx.fillRect(0, 0, cv.width, cv.height);
  if (SHEET.complete && SHEET.naturalWidth){
    // fit frame into canvas with margin, preserving aspect
    const m = 26;
    const availW = cv.width - m * 2, availH = cv.height - m * 2;
    const sc = Math.min(availW / fw, availH / a.h);
    const dw = fw * sc, dh = a.h * sc;
    ctx.drawImage(SHEET, a.x + fi * fw, a.y, fw, a.h,
      (cv.width - dw) / 2, (cv.height - dh) / 2 + 8, dw, dh);
  }
}

/* ---------- mood + UI ---------- */
const $ = id => document.getElementById(id);
function lowest(){
  let k = 'food', v = 101;
  for (const s in S.stats){ if (S.stats[s] < v){ v = S.stats[s]; k = s; } }
  return { k, v };
}
const MOODS = [
  [80, 'Blissed out'], [60, 'Content'], [40, 'Restless'], [20, 'Grumpy'], [0, 'Miserable']
];
const NEED_TIP = { food: 'needs a snack', energy: 'needs a nap', fun: 'is bored stiff', clean: 'needs a groom' };
function refreshUI(){
  if (!S) return;
  const map = { food: 'stFood', energy: 'stEnergy', fun: 'stFun', clean: 'stClean' };
  const cols = { food: 'var(--leaf)', energy: 'var(--rose)', fun: 'var(--gold)', clean: 'var(--sky)' };
  for (const k in map){
    const el = $(map[k]);
    const v = Math.round(S.stats[k]);
    el.querySelector('.v').textContent = v;
    const bar = el.querySelector('.bar i');
    bar.style.width = v + '%';
    bar.style.background = v < 25 ? 'var(--rose)' : cols[k];
    el.classList.toggle('low', v < 25);
  }
  const { k, v } = lowest();
  const mood = MOODS.find(m => v >= m[0])[1];
  $('moodChip').textContent = mood;
  $('tip').textContent = v < 45 && !sleeping ? `${S.name} ${NEED_TIP[k]}` : (sleeping ? `${S.name} is sleeping…` : '');
  $('nameChip').textContent = S.name;
  const days = Math.max(1, Math.ceil((Date.now() - S.adopted) / 86400000));
  $('age').textContent = `Day ${days}`;
}

/* ---------- actions ---------- */
function busy(){ return performance.now() < busyUntil || sleeping; }
function bump(k, amt){ S.stats[k] = Math.min(100, S.stats[k] + amt); }
$('aFeed').addEventListener('click', () => {
  if (busy() || S.gone) return;
  setAnim('eat', 2.6); bump('food', 34); bump('clean', -6);
  save(); refreshUI();
});
$('aPlay').addEventListener('click', () => {
  if (busy() || S.gone) return;
  setAnim('play', 2.8); bump('fun', 36); bump('energy', -12); bump('food', -6);
  save(); refreshUI();
});
$('aGroom').addEventListener('click', () => {
  if (busy() || S.gone) return;
  setAnim('groom', 2.6); bump('clean', 38); bump('fun', 6);
  save(); refreshUI();
});
$('aSleep').addEventListener('click', () => {
  if (busy() || S.gone) return;
  sleeping = true;
  setAnim('sleep', 0);
  $('win').classList.add('sleeping');
});
$('win').addEventListener('click', () => {
  if (sleeping){
    sleeping = false;
    $('win').classList.remove('sleeping');
    setAnim('idle', 0);
  }
});

/* ---------- gone / adopt ---------- */
const FACTS = [
  'Pygmy marmosets gouge tree bark and drink the sap.',
  'They talk in trills so high humans can barely hear them.',
  'A full-grown pygmy marmoset weighs less than a deck of cards.',
  'They live in the Amazon, in family groups of up to nine.',
  'Twins are the norm — single births are rare.'
];
function checkGone(){
  if (S.gone) return;
  const { v } = lowest();
  if (v <= 0){
    S.gone = true; save();
    setAnim('hurt', 0);
    $('goneTitle').textContent = `${S.name} left.`;
    $('goneFact').textContent = 'Fact: ' + FACTS[(Math.random() * FACTS.length) | 0];
    setTimeout(() => $('gone').classList.remove('hide'), 1400);
  }
}
$('adoptBtn').addEventListener('click', () => {
  const name = ($('nameIn').value.trim() || 'Peanut').slice(0, 14);
  fresh(name);
  $('adopt').classList.add('hide');
  setAnim('idle', 0);
  refreshUI();
});
$('againBtn').addEventListener('click', () => {
  $('gone').classList.add('hide');
  $('adopt').classList.remove('hide');
  $('nameIn').value = '';
});
$('nameChip').addEventListener('click', () => {
  const n = prompt('Rename your marmoset', S.name);
  if (n && n.trim()){ S.name = n.trim().slice(0, 14); save(); refreshUI(); }
});

/* ---------- icons ---------- */
SHEET.onload = () => {
  for (const [k, ic] of Object.entries(ICONS)){
    const el = document.querySelector(`#a${k[0].toUpperCase()}${k.slice(1)} .ic`);
    if (!el) continue;
    const ictx = el.getContext('2d');
    ictx.imageSmoothingEnabled = false;
    ictx.drawImage(SHEET, ic.x, ic.y, ic.s, ic.s, 0, 0, 34, 34);
  }
};

/* ---------- loop ---------- */
let last = performance.now();
setInterval(() => {
  if (!S || S.gone) return;
  const now = performance.now();
  const dt = (now - last) / 1000; last = now;
  if (sleeping){
    bump('energy', dt * 6);
    if (S.stats.energy >= 100){ sleeping = false; $('win').classList.remove('sleeping'); setAnim('idle', 0); }
  } else {
    decay(dt, false);
  }
  if (!busy() && !sleeping && current !== 'idle') setAnim('idle', 0);
  refreshUI();
  checkGone();
  save();
}, 500);
(function raf(t){
  requestAnimationFrame(raf);
  animT += 1 / 60;
  drawFrame();
})(0);

/* ---------- boot ---------- */
load();
if (S && !S.gone){
  $('adopt').classList.add('hide');
  refreshUI();
} else if (S && S.gone){
  $('adopt').classList.add('hide');
  $('gone').classList.remove('hide');
  $('goneTitle').textContent = `${S.name} left.`;
}
</script>
</body>
</html>
