<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#160d26">
<meta name="description" content="What Are We Doing Today? — an emergency session of the Fun Committee. 12 options. Live ballot. K & L decide.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23160d26'/%3E%3Crect x='7' y='12' width='18' height='13' rx='2' fill='%23ffc94d'/%3E%3Crect x='12' y='14' width='8' height='2.5' rx='1' fill='%23160d26'/%3E%3Crect x='13' y='5' width='6' height='9' rx='1' fill='%23ff2e88' transform='rotate(12 16 9)'/%3E%3C/svg%3E">
<title>What Are We Doing Today?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#160d26; --plum-2:#241640; --paper:#f6f1e7; --ink:#221533;
  --pink:#ff2e88; --gold:#ffc94d; --acid:#7fc74f; --blue:#4fa3f7; --red:#e0483e;
  --disp:'Sora',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--plum);color:var(--paper);font-family:var(--disp);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#comp{
  position:relative;overflow:hidden;background:var(--paper);color:var(--ink);
  width:min(100vw, calc((100vh - 92px) * 16 / 9));aspect-ratio:16/9;
  border-radius:14px;box-shadow:0 40px 90px -30px rgba(0,0,0,.8)
}
.el{position:absolute;will-change:transform,opacity}
.kick{font-family:var(--mono);font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.stamp{
  font-family:var(--mono);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  border:3px solid currentColor;border-radius:8px;padding:.35em .7em
}
#bar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);
  display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(0deg,rgba(13,7,24,.92),transparent)
}
#scrub{position:relative;height:22px;cursor:pointer}
#scrub .track{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:rgba(246,241,231,.2)}
#scrub .fill{position:absolute;left:0;top:9px;height:4px;border-radius:4px;background:var(--gold);width:0}
#scrub .mark{position:absolute;top:7px;width:2px;height:8px;background:rgba(246,241,231,.5)}
#scrub .knob{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.5);margin-left:-8px}
#bar .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#bar .btns{display:flex;gap:8px}
#bar button{
  min-width:44px;height:40px;padding:0 16px;border-radius:100px;cursor:pointer;
  background:rgba(246,241,231,.1);border:1.5px solid rgba(246,241,231,.25);color:var(--paper);
  font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase
}
#bar button:hover{border-color:var(--gold);color:var(--gold)}
#bar button.play{background:var(--gold);color:var(--plum);border-color:transparent;min-width:84px}
#bar .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:rgba(246,241,231,.6);font-weight:700;text-transform:uppercase;text-align:right}
#tapstart{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:rgba(13,7,24,.87);backdrop-filter:blur(8px);cursor:pointer;text-align:center;padding:24px
}
#tapstart.hide{display:none}
#tapstart .k{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--gold);font-weight:800;text-transform:uppercase}
#tapstart h1{font-size:clamp(30px,7vw,54px);font-weight:900;letter-spacing:-.02em;line-height:1;text-transform:uppercase;color:var(--paper)}
#tapstart h1 .p{color:var(--pink)} #tapstart h1 .y{color:var(--gold)}
#tapstart .big{
  padding:18px 36px;border-radius:14px;background:var(--gold);color:var(--plum);border:none;cursor:pointer;
  font-family:var(--disp);font-weight:900;font-size:16px;letter-spacing:.05em;text-transform:uppercase;min-height:58px;
  box-shadow:0 18px 40px -10px rgba(255,201,77,.5)
}
#tapstart .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:rgba(246,241,231,.55);font-weight:700;text-transform:uppercase}
/* ballot */
#ballot button{font-family:var(--disp)}
@keyframes confFall{
  0%{transform:translateY(-8vmax) rotate(0deg);opacity:1}
  100%{transform:translateY(60vmax) rotate(720deg);opacity:.9}
}
@keyframes seal{0%{transform:scale(2.4) rotate(-14deg);opacity:0}60%{transform:scale(.95) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes seal2{0%{transform:scale(2.2) rotate(-9deg);opacity:0}60%{transform:scale(.96) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(-2deg);opacity:1}}
</style>
</head>
<body>
<div id="stage"><div id="comp"></div></div>

<div id="bar">
  <div id="scrub"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
  <div class="row">
    <div class="btns">
      <button id="bPrev" title="Previous scene">Prev</button>
      <button id="bPlay" class="play">Pause</button>
      <button id="bNext" title="Next scene">Next</button>
      <button id="bMusic" title="Music on/off">Music: On</button>
    </div>
    <div class="lbl" id="sceneLbl"></div>
  </div>
</div>

<div id="tapstart">
  <span class="k">An emergency session of the Fun Committee</span>
  <h1>What are we<br>doing <span class="p">today</span><span class="y">?</span></h1>
  <button class="big">Convene the committee</button>
  <span class="sub">12 options · live ballot at the end · K &amp; L vote · Space pauses</span>
</div>

<script>
'use strict';
/* ============================================================
   Remotion-style composition engine — same 30 fps deterministic
   frame clock as the beach deck. Scrub anywhere, it re-renders.
   ============================================================ */
const FPS = 30;
const comp = document.getElementById('comp');

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function interp(f, [f0, f1], [v0, v1], ease){
  const t = clamp((f - f0) / (f1 - f0), 0, 1);
  return v0 + (v1 - v0) * (ease ? ease(t) : t);
}
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn  = t => t * t * t;
function spring(f, delay = 0, stiffness = .55){
  const t = clamp((f - delay) / (FPS * .9), 0, 1);
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  return 1 - Math.pow(1 - t, 2) * Math.cos(t * Math.PI * 2.2 * stiffness);
}
const pop = (f, d) => `scale(${spring(f, d)})`;
const slamY = (f, d, from = -300) => `translateY(${interp(spring(f, d), [0, 1], [from, 0])}px)`;
const slamX = (f, d, from = -600) => `translateX(${interp(spring(f, d), [0, 1], [from, 0])}px)`;
const fade = (f, a, b) => clamp(interp(f, [a, b], [0, 1]), 0, 1);

function el(html, style){ return `<div class="el" style="${style}">${html}</div>`; }
const S = (obj) => Object.entries(obj).map(([k, v]) => `${k}:${v}`).join(';');

/* ---------- shared slide furniture ---------- */
function optHead(f, n, titleHtml, color){
  return el(`<div class="kick" style="font-size:1.25vmax;color:${color}">OPTION ${String(n).padStart(2, '0')} / 12 · UNDER REVIEW</div>`,
      S({ left: '7%', top: '8%', transform: slamX(f, 0) }))
  + el(`<div style="font-weight:900;font-size:3.9vmax;text-transform:uppercase;letter-spacing:-.02em;line-height:.97">${titleHtml}</div>`,
      S({ left: '7%', top: '14%', transform: slamY(f, 7, 300) }));
}
function meters(f, d, top, rows){
  return rows.map((r, i) => {
    const dd = d + i * 12;
    const w = interp(f, [dd, dd + 45], [0, r[1]], easeOut);
    return el(`<div style="display:flex;align-items:center;gap:1.2vmax">
        <span class="kick" style="font-size:.92vmax;color:#22153388;width:12vmax">${r[0]}</span>
        <div style="flex:1;height:1.5vmax;background:#22153318;border-radius:.8vmax;overflow:hidden"><div style="width:${w}%;height:100%;background:${r[2]};border-radius:.8vmax"></div></div>
        <span class="kick" style="font-size:.92vmax;color:${r[2]};width:9vmax;text-align:right">${r[3] !== undefined ? r[3] : Math.round(w) + '%'}</span>
      </div>`,
      S({ left: '7%', width: '48%', top: (top + i * 5.4) + '%', opacity: f > dd ? 1 : 0 }));
  }).join('');
}
function verdict(f, d, text, color, rot = -8){
  return el(`<div class="stamp" style="font-size:1.35vmax;color:${color};background:var(--paper)">${text}</div>`,
      S({ right: '6%', bottom: '9%', transform: pop(f, d) + ` rotate(${rot}deg)`, opacity: f > d ? 1 : 0 }));
}
function bodyCopy(f, d, html, top, width = 38){
  return el(`<div style="font-size:1.35vmax;font-weight:700;color:#221533;max-width:${width}vmax;line-height:1.55">${html}</div>`,
      S({ left: '7%', top: top + '%', opacity: fade(f, d, d + 18) }));
}

/* Jackson, in full regalia */
const JACKSON = (f, tutu, tiara) => `<svg viewBox="0 0 200 190" width="100%">
  <ellipse cx="100" cy="128" rx="46" ry="38" fill="#17141a"/>
  <circle cx="100" cy="66" r="34" fill="#17141a"/>
  <path d="M74 46 L66 16 L92 36 Z" fill="#17141a"/><path d="M126 46 L134 16 L108 36 Z" fill="#17141a"/>
  <path d="M78 40 L74 26 L88 36 Z" fill="#ff9ec4"/><path d="M122 40 L126 26 L112 36 Z" fill="#ff9ec4"/>
  <ellipse cx="88" cy="64" rx="5.5" ry="${6 + Math.sin(f / 11) < -0.86 ? 0.8 : 6}" fill="#ffc94d"/>
  <ellipse cx="112" cy="64" rx="5.5" ry="${6 + Math.sin(f / 11) < -0.86 ? 0.8 : 6}" fill="#ffc94d"/>
  <circle cx="88" cy="64" r="2.4" fill="#17141a"/><circle cx="112" cy="64" r="2.4" fill="#17141a"/>
  <path d="M96 76 q4 4 8 0" stroke="#ff9ec4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M100 72 l-3 4 h6 z" fill="#ff9ec4"/>
  <path d="M144 130 q28 ${-6 + Math.sin(f / 8) * 14} 34 ${-30 + Math.sin(f / 8) * 8}" stroke="#17141a" stroke-width="11" fill="none" stroke-linecap="round"/>
  ${tutu ? `<ellipse cx="100" cy="126" rx="64" ry="16" fill="#ff2e88" opacity=".92"/>
  <ellipse cx="100" cy="126" rx="64" ry="16" fill="none" stroke="#ff9ec4" stroke-width="3" stroke-dasharray="6 5"/>` : ''}
  ${tiara ? `<path d="M84 32 l5 -12 l6 8 l5 -12 l5 12 l6 -8 l5 12 z" fill="#ffc94d" stroke="#e0a92e" stroke-width="1.5"/>` : ''}
  <path d="M78 158 v14 M92 162 v12 M108 162 v12 M122 158 v14" stroke="#17141a" stroke-width="9" stroke-linecap="round"/>
</svg>`;

/* confetti positions, precomputed & deterministic */
const CONF = Array.from({ length: 50 }, (_, i) => ({
  x: (i * 137.5) % 100, delay: (i * 9) % 50,
  hue: ['#ffc94d', '#ff2e88', '#7fc74f', '#4fa3f7'][i % 4],
}));

/* ============================================================
   THE TWELVE OPTIONS · master record (deck + ballot share this)
   ============================================================ */
const OPTIONS = [
  { short: 'Go to the moon' },
  { short: 'Scary movies' },
  { short: 'Fold the dishes' },
  { short: 'Mop the ceiling' },
  { short: 'Simpsons marathon' },
  { short: 'Chudmaxxing' },
  { short: 'Read a book' },
  { short: "Paint dad's toes" },
  { short: 'Ballerina Jackson' },
  { short: 'Protein cookies' },
  { short: 'Iced coffee lab' },
  { short: 'Fight to the death' },
];

/* ============================================================
   SCENES
   ============================================================ */
const SCENES = [

/* 1 · TITLE */
{ dur: 165, name: 'Call to order', render(f){
  const flicker = f > 90 && f < 96 ? .6 : 1;
  return el('', S({ inset: 0, background: 'linear-gradient(160deg,#f6f1e7 0 55%,#f0e6d2 55% 100%)' }))
  + el(`<div class="kick" style="font-size:1.35vmax;color:#a4407e">EMERGENCY SESSION · THE FUN COMMITTEE · SATURDAY, 9:47 AM</div>`,
      S({ left: '7%', top: '13%', opacity: fade(f, 4, 18), transform: slamX(f, 4, -400) }))
  + el(`<div style="font-weight:900;font-size:6vmax;line-height:.93;letter-spacing:-.03em;text-transform:uppercase;opacity:${flicker}">What are we<br><span style="color:#d81b6d">doing</span> <span style="color:#c78a12">today?</span></div>`,
      S({ left: '7%', top: '24%', transform: slamY(f, 14, 500) + ' rotate(' + interp(spring(f, 14), [0, 1], [-5, 0]) + 'deg)' }))
  + el(`<div class="stamp" style="font-size:1.25vmax;color:#e0483e">AGENDA ALREADY LEAKED</div>`,
      S({ right: '7%', top: '12%', transform: pop(f, 60) + ' rotate(9deg)', opacity: f > 60 ? 1 : 0 }))
  + el(`<div class="kick" style="font-size:1.05vmax;color:#22153399;line-height:2">VOTING MEMBERS: K (CHIEF VIBES OFFICER) · L (VP OF SNACKS)<br>ALSO PRESENT: DAD (MINUTES ONLY · NO VOTING RIGHTS · KNOWS IT)</div>`,
      S({ left: '7%', bottom: '10%', opacity: fade(f, 85, 105) }));
}},

/* 2 · METHODOLOGY */
{ dur: 185, name: 'Methodology', render(f){
  return el(`<div class="kick" style="font-size:1.35vmax;color:#3c78c0">METHODOLOGY · EXTREMELY SCIENTIFIC</div>`,
      S({ left: '7%', top: '9%', transform: slamX(f, 0) }))
  + el(`<div style="font-weight:900;font-size:3.4vmax;text-transform:uppercase;letter-spacing:-.02em">Twelve options entered<br>the pipeline<span style="color:#d81b6d">.</span></div>`,
      S({ left: '7%', top: '15%', transform: slamX(f, 6) }))
  + bodyCopy(f, 30, `Each option was scored by our proprietary decision algorithm <b>(dad, guessing)</b> across four metrics. All scores are final, non-negotiable, and completely made up.`, 34, 40)
  + meters(f, 55, 52, [
      ['FUN', 100, '#d81b6d'],
      ['EFFORT', 30, '#3c78c0'],
      ['LEGALITY', 75, '#5a9e3c', 'TBD'],
      ['DAD APPROVAL', 50, '#c78a12', 'VARIES'],
    ])
  + el(`<div class="kick" style="font-size:.9vmax;color:#22153366">FIG 0 · SAMPLE SCORECARD · NUMBERS PROVIDED BY VIBES</div>`,
      S({ left: '7%', bottom: '8%', opacity: fade(f, 120, 135) }))
  + el(`<div class="stamp" style="font-size:1.1vmax;color:#5a9e3c">PEER-REVIEWED*</div>`,
      S({ right: '8%', top: '30%', transform: pop(f, 95) + ' rotate(7deg)', opacity: f > 95 ? 1 : 0 }))
  + el(`<div class="kick" style="font-size:.8vmax;color:#22153355">*THE PEER WAS JACKSON. HE BLINKED. WE TOOK THAT AS A YES.</div>`,
      S({ right: '8%', top: '38%', opacity: fade(f, 110, 125), 'text-align': 'right' }));
}},

/* 3 · OPTION 1 · MOON */
{ dur: 205, name: 'Option 01 · Moon', render(f){
  const cash = Math.round(interp(f, [40, 110], [0, 2.4e9], easeOut));
  const up = interp(f, [55, 100], [70, 22], easeOut);
  const y = f < 118 ? up : interp(f, [118, 150], [22, 78], easeIn);
  const rot = f < 118 ? 0 : interp(f, [118, 150], [0, 140]);
  return optHead(f, 1, 'Go to the moon<span style="color:#3c78c0">.</span>', '#3c78c0')
  + bodyCopy(f, 25, `Distance: 384,400&nbsp;km. Snack range of this family: 45&nbsp;km, on a good day, with juice boxes.`, 30)
  + el(`<div class="kick" style="font-size:1vmax;color:#22153388">CURRENT BUDGET SHORTFALL</div>`, S({ left: '7%', top: '44%', opacity: fade(f, 35, 45) }))
  + el(`<div style="font-family:var(--mono);font-weight:800;font-size:3vmax;color:#e0483e">$${cash.toLocaleString('en-US')}</div>`,
      S({ left: '7%', top: '49%', opacity: fade(f, 35, 45) }))
  + meters(f, 90, 64, [
      ['FUN', 100, '#d81b6d'],
      ['FEASIBILITY', 2, '#e0483e'],
      ['SNACK LOGISTICS', 61, '#c78a12'],
    ])
  + el(`<svg viewBox="0 0 60 110" width="100%"><path d="M30 4 q16 22 16 52 h-32 q0 -30 16 -52z" fill="#dfe6ef" stroke="#221533" stroke-width="4"/><circle cx="30" cy="42" r="8" fill="#4fa3f7" stroke="#221533" stroke-width="3"/><path d="M14 56 l-10 26 l14 -8 M46 56 l10 26 l-14 -8" fill="#e0483e" stroke="#221533" stroke-width="3"/><path d="M22 84 h16 l-8 ${14 + Math.sin(f / 3) * 6} z" fill="#ffc94d" opacity="${f > 55 && f < 118 ? 1 : 0}"/></svg>`,
      S({ right: '14%', top: y + '%', width: '8%', transform: `rotate(${rot}deg)`, opacity: fade(f, 50, 58) }))
  + el(`<div class="kick" style="font-size:.9vmax;color:#22153366">NASA CALLBACK STATUS: "PLEASE STOP CALLING" (MARCH)</div>`,
      S({ right: '7%', bottom: '26%', opacity: fade(f, 150, 165) }))
  + verdict(f, 165, 'PENDING FUNDING', '#c78a12', -7);
}},

/* 4 · OPTION 2 · SCARY MOVIES */
{ dur: 200, name: 'Option 02 · Scary movies', render(f){
  const dark = (f > 120 && f < 126) || (f > 134 && f < 138) ? .82 : 0;
  const rows = [
    ['K', 12, '#5a9e3c', '12% · "CLAIMS"'],
    ['L', 96, '#e0483e', '96% · SAYS 0%'],
    ['DAD', 100, '#e0483e', 'SCREAMS FIRST'],
  ];
  return optHead(f, 2, 'Watch scary movies<span style="color:#d81b6d">.</span>', '#d81b6d')
  + bodyCopy(f, 25, `A curated program of poor decisions, scheduled directly before bedtime. What could go wrong. <b>(Everything. That's the product.)</b>`, 30)
  + el(`<div class="kick" style="font-size:1vmax;color:#22153388">FIG 2 · PROJECTED FEAR LEVELS</div>`, S({ left: '7%', top: '48%', opacity: fade(f, 45, 55) }))
  + meters(f, 55, 54, rows)
  + el(`<svg viewBox="0 0 90 90" width="100%"><rect x="6" y="14" width="78" height="56" rx="6" fill="#221533"/><rect x="12" y="20" width="66" height="44" rx="3" fill="#3a2a55"/><circle cx="45" cy="42" r="12" fill="#f6f1e7" opacity="${.4 + Math.sin(f / 5) * .3}"/><path d="M38 40 q7 10 14 0" stroke="#221533" stroke-width="3" fill="none"/><circle cx="41" cy="38" r="2" fill="#221533"/><circle cx="49" cy="38" r="2" fill="#221533"/><rect x="34" y="70" width="22" height="8" rx="2" fill="#221533"/></svg>`,
      S({ right: '10%', top: '22%', width: '15%', transform: pop(f, 30) + ` rotate(${Math.sin(f / 10) * 2}deg)` }))
  + el(`<div class="kick" style="font-size:.9vmax;color:#22153366">BLANKET INVENTORY: SUFFICIENT · POPCORN: ARMED · HALLWAY LIGHT: STAYING ON, FOR DAD</div>`,
      S({ left: '7%', bottom: '9%', opacity: fade(f, 145, 160) }))
  + el('', S({ inset: 0, background: '#0d0718', opacity: dark, 'pointer-events': 'none' }))
  + verdict(f, 160, 'APPROVED · AFTER DARK', '#d81b6d', 6);
}},

/* 5 · OPTION 3 · FOLD THE DISHES */
{ dur: 195, name: 'Option 03 · Fold the dishes', render(f){
  const tries = Math.min(4, Math.floor(Math.max(0, f - 60) / 26));
  const possible = f < 100 ? interp(f, [70, 100], [0, 3], easeOut) : interp(f, [100, 120], [3, 0], easeIn);
  return optHead(f, 3, 'Fold the dishes<span style="color:#e0483e">.</span>', '#e0483e')
  + bodyCopy(f, 22, `Submitted by management with total confidence. The physics department was consulted. The physics department <b>laughed and hung up.</b>`, 30)
  + el(`<div style="background:#fff;border:3px solid #221533;border-radius:.8vmax;box-shadow:.6vmax .6vmax 0 #22153333;padding:1.4vmax 1.8vmax;width:30vmax">
      <div class="kick" style="font-size:1vmax;color:#e0483e;margin-bottom:.7vmax">⚠ TASK ERROR 404</div>
      <div style="font-weight:900;font-size:1.5vmax;text-transform:uppercase">Dishes are not foldable</div>
      <div style="font-family:var(--mono);font-size:.95vmax;color:#22153399;margin-top:.5vmax">Did you mean: <u>laundry</u>?</div>
      <div style="display:flex;gap:.8vmax;margin-top:1vmax">
        <span class="kick" style="font-size:.9vmax;background:#221533;color:#f6f1e7;padding:.4vmax 1vmax;border-radius:.4vmax;transform:scale(${tries % 2 === 1 ? .92 : 1})">RETRY (${tries}/∞)</span>
        <span class="kick" style="font-size:.9vmax;border:2px solid #22153344;color:#22153388;padding:.3vmax 1vmax;border-radius:.4vmax">GIVE UP</span>
      </div>
    </div>`,

  for (let i = 0; i < SCENES.length; i++){
    if (gf < acc + SCENES[i].dur) return { i, local: gf - acc, start: acc };
    acc += SCENES[i].dur;
  }
  return { i: SCENES.length - 1, local: SCENES[SCENES.length - 1].dur - 1, start: TOTAL - SCENES[SCENES.length - 1].dur };
}
function render(){
  const { i, local } = sceneAt(frame);
  comp.innerHTML = SCENES[i].render(local);
  document.getElementById('sceneLbl').textContent = `${i + 1} / ${SCENES.length} · ${SCENES[i].name}`;
  const p = frame / TOTAL;
  document.querySelector('#scrub .fill').style.width = (p * 100) + '%';
  document.querySelector('#scrub .knob').style.left = (p * 100) + '%';
}
function tick(ts){
  requestAnimationFrame(tick);
  if (!playing) return;
  if (!rafLast) rafLast = ts;
  const adv = (ts - rafLast) / (1000 / FPS);
  if (adv >= 1){
    frame = Math.min(TOTAL - 1, frame + Math.round(adv));
    rafLast = ts;
    if (frame >= TOTAL - 1){
      playing = false; updatePlayBtn(); Music.stop();
      if (!ballotDone) openBallot();
    }
    render();
  }
}
requestAnimationFrame(tick);

function updatePlayBtn(){ document.getElementById('bPlay').textContent = playing ? 'Pause' : (frame >= TOTAL - 1 ? 'Replay' : 'Play'); }
function playPause(){
  if (frame >= TOTAL - 1 && !playing){
    frame = 0;
    ballotDone = false;
    closeBallot();
  }
  playing = !playing; rafLast = 0;
  updatePlayBtn();
  playing ? Music.start() : Music.stop();
}
document.getElementById('bPlay').addEventListener('click', playPause);
document.getElementById('bPrev').addEventListener('click', () => {
  const { i, start } = sceneAt(frame);
  frame = frame - start > FPS ? start : (i > 0 ? sceneAt(start - 1).start : 0);
  closeBallot();
  render();
});
document.getElementById('bNext').addEventListener('click', () => {
  const { i, start } = sceneAt(frame);
  if (i >= SCENES.length - 1){
    frame = TOTAL - 1;
    playing = false; updatePlayBtn();
    render();
    if (!ballotDone) openBallot();
    return;
  }
  frame = start + SCENES[i].dur;
  render();
});
addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); playPause(); }
  if (e.code === 'ArrowLeft') document.getElementById('bPrev').click();
  if (e.code === 'ArrowRight') document.getElementById('bNext').click();
});

/* scrubber */
const scrub = document.getElementById('scrub');
let marks = '';
let acc = 0;
SCENES.slice(0, -1).forEach(sc => {
  acc += sc.dur;
  marks += `<div class="mark" style="left:${acc / TOTAL * 100}%"></div>`;
});
scrub.insertAdjacentHTML('beforeend', marks);
function scrubTo(clientX){
  const r = scrub.getBoundingClientRect();
  frame = Math.round(clamp((clientX - r.left) / r.width, 0, 1) * (TOTAL - 1));
  render();
}
let scrubbing = false;
scrub.addEventListener('pointerdown', e => { scrubbing = true; playing = false; updatePlayBtn(); closeBallot(); scrubTo(e.clientX); });
addEventListener('pointermove', e => { if (scrubbing) scrubTo(e.clientX); });
addEventListener('pointerup', () => scrubbing = false);

/* ============================================================
   THE BALLOT · two voters, twelve options, live democracy.
   Special rulings for the legally troubled options.
   ============================================================ */
const RULINGS = {
  0: 'NASA has been emailed. Expect delays of 10–40 years.',
  2: 'Vote counted. Task remains physically impossible. Good luck.',
  3: 'OSHA has been notified and is on the way.',
  6: 'HR is thrilled. Nobody else is.',
  11: 'LEGAL HAS INTERVENED. Vote converted to: Thumb war, best of 3.',
};
const displayPick = i => i === 11 ? 'Thumb war (best of 3)' : OPTIONS[i].short;

let ballotEl = null;
const votes = { K: null, L: null };

function closeBallot(){ if (ballotEl){ ballotEl.remove(); ballotEl = null; } }

/* In portrait the 16:9 comp is a letterbox slit — the ballot breaks out
   and takes the whole screen above the control bar instead. All ballot
   type is sized off the ballot's own box via --u (with px floors), so
   it stays readable at any size. */
const isPortrait = () => innerWidth < innerHeight;
function ballotRect(){
  if (isPortrait()) return { left: 10, top: 10, width: innerWidth - 20, height: innerHeight - 130 };
  const r = comp.getBoundingClientRect();
  return { left: r.left, top: r.top, width: r.width, height: r.height };
}
function applyBallotRect(){
  const r = ballotRect();
  ballotEl.style.left = r.left + 'px'; ballotEl.style.top = r.top + 'px';
  ballotEl.style.width = r.width + 'px'; ballotEl.style.height = r.height + 'px';
  const u = isPortrait() ? r.width / 60 : Math.min(r.width / 92, r.height / 52);
  ballotEl.style.setProperty('--u', u + 'px');
}
/* every "Nvmax" in ballot markup becomes calc(N * --u) — ballot-local units */
const bUnits = h => h.replace(/([\d.]+)vmax/g, 'calc($1 * var(--u))');
function bset(html){ ballotEl.innerHTML = bUnits(html); }

function openBallot(){
  closeBallot();
  votes.K = null; votes.L = null;
  ballotEl = document.createElement('div');
  ballotEl.id = 'ballot';
  ballotEl.style.cssText = `position:fixed;z-index:8;overflow:hidden;border-radius:14px;background:#221533;user-select:none;font-family:var(--disp)`;
  document.body.appendChild(ballotEl);
  applyBallotRect();
  ballotStep('K');
}

function ballotStep(voter){
  const color = voter === 'K' ? '#ff2e88' : '#ffc94d';
  const title = voter === 'K' ? 'K · Chief Vibes Officer' : 'L · VP of Snacks';
  const cols = isPortrait() ? 2 : 3;
  bset(`
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:2vmax 3vmax ${isPortrait() ? '2vmax' : '6vmax'};gap:.9vmax">
      <div class="kick" style="font-size:max(8px,1vmax);color:${color};letter-spacing:.24em">OFFICIAL BALLOT · ${voter === 'K' ? '1' : '2'} OF 2 · NO PEEKING</div>
      <div style="font-weight:900;font-size:max(17px,2.6vmax);color:#f6f1e7;text-transform:uppercase;letter-spacing:-.02em">${title} — cast your vote.</div>
      <div class="kick" style="font-size:max(7px,.8vmax);color:#f6f1e755">NO WRONG ANSWERS. SOME ILLEGAL ANSWERS.</div>
      <div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${12 / cols},minmax(0,1fr));gap:.9vmax;margin-top:.6vmax">
        ${OPTIONS.map((o, i) => `
          <button data-i="${i}" style="border-radius:.9vmax;border:2px solid ${i === 11 ? '#e0483e88' : '#f6f1e733'};background:${i === 11 ? '#e0483e18' : '#f6f1e70d'};color:${i === 11 ? '#ff8d85' : '#f6f1e7'};cursor:pointer;font-weight:800;font-size:max(11px,1.15vmax);text-transform:uppercase;letter-spacing:.02em;padding:.4vmax;overflow:hidden">
            ${o.short}${i === 11 ? '<div class="kick" style="font-size:max(6px,.6vmax);margin-top:.3vmax;letter-spacing:.14em">FLAGGED BY LEGAL</div>' : ''}
          </button>`).join('')}
      </div>
    </div>`);
  ballotEl.querySelectorAll('button[data-i]').forEach(b => b.addEventListener('click', () => {
    votes[voter] = +b.dataset.i;
    ballotEl.insertAdjacentHTML('beforeend', bUnits(
      `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#221533ee;z-index:3">
        <div class="stamp" style="font-size:max(16px,2.2vmax);color:${color};animation:seal .5s ease both">VOTE SEALED</div>
      </div>`));
    setTimeout(() => {
      if (voter === 'K') ballotStep('L');
      else ballotResult();
    }, 800);
  }));
}

function ballotResult(fated){
  const k = votes.K, l = votes.L;
  const same = k === l;
  const notes = [...new Set([k, l])].filter(i => RULINGS[i] !== undefined).map(i => RULINGS[i]);
  let heading, ruling;
  if (fated !== undefined){
    heading = 'FATE HAS SPOKEN';
    ruling = displayPick(fated).toUpperCase();
  } else if (same){
    heading = 'UNANIMOUS';
    ruling = displayPick(k).toUpperCase();
  } else {
    heading = 'SPLIT DECISION';
    ruling = `${displayPick(k).toUpperCase()} + ${displayPick(l).toUpperCase()}`;
  }
  const sub = fated !== undefined
    ? 'The committee has spoken. The committee is a button.'
    : same
      ? 'Execute immediately. This has never happened before in committee history.'
      : 'Coalition ruling: DO BOTH. Democracy is beautiful and exhausting.';
  const conf = CONF.map(c =>
    `<div style="position:absolute;left:${c.x}%;top:-4%;width:.8vmax;height:1.3vmax;background:${c.hue};border-radius:.2vmax;animation:confFall ${2.4 + (c.delay % 14) / 10}s ${c.delay / 30}s linear infinite"></div>`).join('');
  bset(`
    ${conf}
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1vmax;text-align:center;padding:2vmax 3vmax ${isPortrait() ? '2vmax' : '6vmax'}">
      <div class="kick" style="font-size:max(8px,1vmax);color:#7fc74f;letter-spacing:.24em">RESULTS CERTIFIED · RECOUNTS DENIED</div>
      <div style="font-weight:900;font-size:max(24px,4vmax);color:#f6f1e7;text-transform:uppercase;letter-spacing:-.02em">${heading}</div>
      <div class="stamp" style="font-size:max(12px,1.5vmax);color:#ffc94d;max-width:86%;margin:.4vmax 0;animation:seal2 .5s .2s ease both">${ruling}</div>
      <div style="font-weight:700;font-size:max(11px,1.25vmax);color:#f6f1e7cc;max-width:46vmax;line-height:1.6">${sub}</div>
      ${notes.map(n => `<div class="kick" style="font-size:max(8px,.85vmax);color:#ff8d85;letter-spacing:.14em;max-width:90%">${n}</div>`).join('')}
      <div style="display:flex;gap:1vmax;margin-top:1vmax;flex-wrap:wrap;justify-content:center">
        <button id="bvRevote" style="padding:1vmax 2vmax;border-radius:1vmax;border:2px solid #f6f1e744;background:none;color:#f6f1e7;cursor:pointer;font-weight:900;font-size:max(11px,1.1vmax);text-transform:uppercase">Revote</button>
        <button id="bvFate" style="padding:1vmax 2vmax;border-radius:1vmax;border:none;background:#ff2e88;color:#fff;cursor:pointer;font-weight:900;font-size:max(11px,1.1vmax);text-transform:uppercase">Let fate decide</button>
        <button id="bvDone" style="padding:1vmax 2vmax;border-radius:1vmax;border:none;background:#ffc94d;color:#221533;cursor:pointer;font-weight:900;font-size:max(11px,1.1vmax);text-transform:uppercase">Adjourn</button>
      </div>
    </div>`);
  ballotEl.querySelector('#bvRevote').addEventListener('click', () => { votes.K = null; votes.L = null; ballotStep('K'); });
  ballotEl.querySelector('#bvFate').addEventListener('click', spinFate);
  ballotEl.querySelector('#bvDone').addEventListener('click', () => { ballotDone = true; closeBallot(); render(); });
}

function spinFate(){
  /* slot-machine spin across the option list, lands anywhere but 12 */
  const landing = (Math.random() * 11) | 0;
  const seq = [];
  for (let i = 0; i < 18; i++) seq.push((landing + i * 7 + 3) % 12);
  seq.push(landing);
  bset(`
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vmax;text-align:center;padding:3vmax">
      <div class="kick" style="font-size:max(8px,1vmax);color:#ffc94d;letter-spacing:.24em">CONSULTING THE WHEEL OF DESTINY</div>
      <div id="fateSlot" style="font-weight:900;font-size:max(20px,3.6vmax);color:#f6f1e7;text-transform:uppercase;letter-spacing:-.02em;min-height:1.2em"></div>
    </div>`);
  const slot = ballotEl.querySelector('#fateSlot');
  let idx = 0;
  function stepSpin(){
    slot.textContent = OPTIONS[seq[idx]].short;
    idx++;
    if (idx < seq.length) setTimeout(stepSpin, 60 + idx * idx * 1.3);
    else setTimeout(() => ballotResult(landing), 500);
  }
  stepSpin();
}

/* re-anchor ballot on resize / rotation */
addEventListener('resize', () => { if (ballotEl) applyBallotRect(); });

/* ============================================================
   MUSIC · original 16-bit committee funk. A minor, 132 BPM.
   Square bass, detuned saw lead, noise drums, look-ahead sched.
   ============================================================ */
const Music = (() => {
  let ctx = null, master = null, timer = null, step = 0, nextT = 0;
  let enabled = true;
  const BPM = 132, SPB = 60 / BPM / 2;
  const N = (name) => {
    const m = /^([A-G]#?)(\d)$/.exec(name);
    const idx = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'].indexOf(m[1]);
    return 440 * Math.pow(2, (idx - 9) / 12 + (m[2] - 4));
  };
  const BASS = [
    'A2','A2','','A2','A2','','C3','D3',  'A2','A2','','A2','G2','','E2','G2',
    'A2','A2','','A2','A2','','C3','D3',  'F2','F2','','F2','G2','G2','E2','D2',
    'A2','A2','','A2','A2','','C3','D3',  'A2','A2','','A2','G2','','E2','G2',
    'F2','F2','F2','','G2','G2','G2','',  'A2','C3','D3','E3','D3','C3','B2','G2',
  ];
  const LEAD = [
    '','','','','','','','',              '','','','','','','','',
    'A4','','C5','A4','D5','','C5','A4',  'G4','','A4','','','','','',
    'A4','','C5','A4','D5','','E5','D5',  'C5','','A4','','G4','','A4','',
    'F4','','G4','A4','G4','','F4','E4',  'A4','','C5','','D5','','E5','',
  ];
  function drum(i){
    const b = i % 8;
    return { kick: b === 0 || b === 4 || (i % 32 === 30), snare: b === 2 || b === 6, hat: true };
  }
  function ensure(){
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = .14;
    const dc = ctx.createDynamicsCompressor();
    master.connect(dc); dc.connect(ctx.destination);
  }
  function osc(type, freq, t, dur, vol, detune = 0){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; o.detune.value = detune;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + .02);
  }
  function noise(t, dur, vol, hp){
    const len = Math.ceil(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const flt = ctx.createBiquadFilter(); flt.type = 'highpass'; flt.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(t);
  }
  function scheduleStep(i, t){
    const bass = BASS[i % 64];
    if (bass) osc('square', N(bass), t, SPB * .9, .30);
    const lead = LEAD[i % 64];
    if (lead){
      osc('sawtooth', N(lead), t, SPB * 1.7, .16);
      osc('sawtooth', N(lead), t, SPB * 1.7, .12, 9);
    }
    const dr = drum(i);
    if (dr.kick){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(120, t);
      o.frequency.exponentialRampToValueAtTime(38, t + .1);
      g.gain.setValueAtTime(.7, t);
      g.gain.exponentialRampToValueAtTime(.001, t + .13);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + .15);
    }
    if (dr.snare) noise(t, .1, .3, 1400);
    if (dr.hat) noise(t, .03, i % 2 ? .07 : .11, 6000);
  }
  function tickSched(){
    while (nextT < ctx.currentTime + .12){
      scheduleStep(step, nextT);
      step++; nextT += SPB;
    }
  }
  return {
    start(){
      if (!enabled) return;
      ensure();
      ctx.resume();
      if (!timer){ nextT = ctx.currentTime + .05; timer = setInterval(tickSched, 25); }
    },
    stop(){ if (timer){ clearInterval(timer); timer = null; } if (ctx) ctx.suspend(); },
    toggle(){
      enabled = !enabled;
      if (!enabled) this.stop();
      else if (playing) this.start();
      document.getElementById('bMusic').textContent = 'Music: ' + (enabled ? 'On' : 'Off');
      return enabled;
    },
    get enabled(){ return enabled; }
  };
})();
document.getElementById('bMusic').addEventListener('click', () => Music.toggle());

/* tap to start */
document.getElementById('tapstart').addEventListener('click', () => {
  document.getElementById('tapstart').classList.add('hide');
  frame = 0; playing = true; rafLast = 0; updatePlayBtn();
  Music.start();
});
comp.addEventListener('click', playPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) Music.stop(); else if (playing) Music.start(); });

render();
</script>
</body>
