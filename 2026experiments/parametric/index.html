<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10141f">
<title>Parametric Playground</title>
<style>
:root{--bg:#10141f;--panel:#1a2130;--edge:#2c3850;--ink:#e8eefc;--dim:#8a97b8;--acc:#5ad0ff;--acc2:#ff8a5a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-y}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:10px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.1rem;color:var(--acc)}
header div button{background:var(--panel);border:1px solid var(--edge);color:var(--ink);
  border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;font-size:.85rem}
#cv{width:100%;border-radius:14px;background:#0b0e17;touch-action:none}
#presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#presets button{flex:none;background:var(--panel);border:1px solid var(--edge);color:var(--dim);
  border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer}
#presets button.on{color:var(--acc);border-color:var(--acc)}
#sliders{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-bottom:6px}
.sl{background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:7px 12px}
.sl label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--dim);font-weight:600}
.sl label b{color:var(--ink)}
.sl input{width:100%;accent-color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>◆ Parametric Playground</h1>
    <div>
      <button id="wireBtn">wire</button>
      <button id="randBtn">🎲</button>
      <button id="objBtn">.obj</button>
    </div>
  </header>
  <canvas id="cv"></canvas>
  <div id="presets"></div>
  <div id="sliders"></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
const W=420,H=300,S=2;
cv.width=W*S;cv.height=H*S;ctx.scale(S,S);cv.style.aspectRatio=W+"/"+H;
const DEFS=[
{k:"sides",n:"sides",min:3,max:32,step:1,v:14},
{k:"rings",n:"rings",min:4,max:40,step:1,v:22},
{k:"height",n:"height",min:40,max:200,step:1,v:130},
{k:"radius",n:"radius",min:10,max:90,step:1,v:52},
{k:"taper",n:"taper",min:-0.9,max:0.9,step:0.01,v:0.25},
{k:"twist",n:"twist °",min:0,max:360,step:1,v:60},
{k:"waves",n:"ripples",min:0,max:12,step:1,v:5},
{k:"amp",n:"ripple depth",min:0,max:0.6,step:0.01,v:0.18},
{k:"bulge",n:"belly",min:-0.6,max:1,step:0.01,v:0.35},
];
const P={};DEFS.forEach(d=>P[d.k]=d.v);
const PRESETS={
vase:{sides:14,rings:22,height:130,radius:52,taper:0.25,twist:60,waves:5,amp:0.18,bulge:0.35},
tower:{sides:6,rings:30,height:190,radius:34,taper:0.5,twist:220,waves:0,amp:0,bulge:0},
gear:{sides:24,rings:6,height:46,radius:70,taper:0,twist:0,waves:12,amp:0.3,bulge:0},
shell:{sides:20,rings:36,height:120,radius:60,taper:0.85,twist:360,waves:3,amp:0.12,bulge:0.1},
lamp:{sides:10,rings:18,height:150,radius:44,taper:-0.4,twist:30,waves:8,amp:0.1,bulge:0.6},
};
let wire=false,yaw=0.7,pitch=0.42,spin=true,mesh=null,T=0;
function buildMesh(){
  const R=Math.round(P.rings),N=Math.round(P.sides),vs=[],qs=[];
  for(let r=0;r<=R;r++){
    const t=r/R,y=(t-0.5)*P.height;
    let rad=P.radius*(1-P.taper*t);
    rad*=1+P.bulge*Math.sin(t*Math.PI);
    rad*=1+P.amp*Math.cos(P.waves*Math.PI*2*t);
    const tw=P.twist*Math.PI/180*t;
    for(let i=0;i<N;i++){
      const a=i/N*Math.PI*2+tw;
      vs.push([Math.cos(a)*rad,y,Math.sin(a)*rad]);
    }
  }
  for(let r=0;r<R;r++)for(let i=0;i<N;i++){
    const a=r*N+i,b=r*N+(i+1)%N;
    qs.push([a,b,b+N,a+N]);
  }
  mesh={vs,qs};
}
function proj(v){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  let x=v[0]*cy-v[2]*sy,z=v[0]*sy+v[2]*cy,y=v[1];
  let y2=y*cp-z*sp,z2=y*sp+z*cp;
  const d=340,f=d/(d+z2+220);
  return [W/2+x*f,H/2+y2*f,z2,f];
}
function render(){
  ctx.fillStyle="#0b0e17";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(90,208,255,.08)";ctx.lineWidth=1;
  for(let g=0;g<W;g+=30){ctx.beginPath();ctx.moveTo(g,0);ctx.lineTo(g,H);ctx.stroke();}
  const pv=mesh.vs.map(proj);
  const faces=mesh.qs.map(q=>{
    const z=(pv[q[0]][2]+pv[q[1]][2]+pv[q[2]][2]+pv[q[3]][2])/4;
    return {q,z};
  }).sort((a,b)=>b.z-a.z);
  faces.forEach(({q})=>{
    const a=pv[q[0]],b=pv[q[1]],c=pv[q[2]],d=pv[q[3]];
    const nx=(b[1]-a[1])*(d[2]-a[2])-(b[2]-a[2])*(d[1]-a[1]);
    const shade=0.35+0.65*Math.max(0,Math.min(1,0.5+nx/9000));
    ctx.beginPath();
    ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);
    ctx.closePath();
    if(!wire){
      const hue=195+((mesh.qs.indexOf(q)%9===0)?0:0);
      ctx.fillStyle=`hsl(${hue},70%,${Math.round(18+shade*38)}%)`;
      ctx.fill();
    }
    ctx.strokeStyle=wire?"rgba(90,208,255,.75)":"rgba(11,14,23,.55)";
    ctx.lineWidth=wire?1:0.7;
    ctx.stroke();
  });
  ctx.fillStyle="#8a97b8";ctx.font="600 11px system-ui";
  ctx.fillText(mesh.vs.length+" verts · "+mesh.qs.length+" faces",10,H-10);
}
function buildUI(){
  $('sliders').innerHTML=DEFS.map(d=>`<div class="sl">
    <label>${d.n}<b id="v_${d.k}">${P[d.k]}</b></label>
    <input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${P[d.k]}" data-k="${d.k}">
  </div>`).join("");
  document.querySelectorAll('#sliders input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      P[inp.dataset.k]=+inp.value;
      $('v_'+inp.dataset.k).textContent=inp.value;
      buildMesh();
    });
  });
  $('presets').innerHTML=Object.keys(PRESETS).map(k=>`<button data-p="${k}">${k}</button>`).join("");
  document.querySelectorAll('#presets button').forEach(b=>{
    b.onclick=()=>setPreset(b.dataset.p);
  });
}
function setPreset(name){
  Object.assign(P,PRESETS[name]);
  document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('on',b.dataset.p===name));
  document.querySelectorAll('#sliders input').forEach(inp=>{
    inp.value=P[inp.dataset.k];
    $('v_'+inp.dataset.k).textContent=P[inp.dataset.k];
  });
  buildMesh();
}
function randomize(){
  DEFS.forEach(d=>{
    P[d.k]=+(d.min+Math.random()*(d.max-d.min)).toFixed(2);
    if(d.step===1)P[d.k]=Math.round(P[d.k]);
  });
  document.querySelectorAll('#presets button').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('#sliders input').forEach(inp=>{
    inp.value=P[inp.dataset.k];
    $('v_'+inp.dataset.k).textContent=P[inp.dataset.k];
  });
  buildMesh();
}
function exportOBJ(){
  let s="# parametric playground\n";
  mesh.vs.forEach(v=>s+="v "+v.map(n=>n.toFixed(3)).join(" ")+"\n");
  mesh.qs.forEach(q=>s+="f "+q.map(i=>i+1).join(" ")+"\n");
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([s],{type:"text/plain"}));
  a.download="parametric.obj";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  return s;
}
$('wireBtn').onclick=()=>{wire=!wire;$('wireBtn').textContent=wire?"solid":"wire";};
$('randBtn').onclick=randomize;
$('objBtn').onclick=exportOBJ;
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};spin=false;});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  yaw+=(e.clientX-drag.x)*0.01;
  pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-drag.y)*0.01));
  drag={x:e.clientX,y:e.clientY};
});
["pointerup","pointerleave","pointercancel"].forEach(ev=>cv.addEventListener(ev,()=>{drag=null;}));
cv.addEventListener('dblclick',()=>spin=true);
buildUI();buildMesh();setPreset('vase');
(function frame(){
  T+=0.016;
  if(spin)yaw+=0.006;
  render();
  requestAnimationFrame(frame);
})();
window.PM={
  set(k,v){P[k]=v;buildMesh();},
  get:k=>P[k],
  preset:setPreset,
  randomize,
  exportOBJ,
  wire(v){wire=v;},
  state(){return{params:{...P},verts:mesh.vs.length,faces:mesh.qs.length,wire,presets:Object.keys(PRESETS)};}
};
</script>
</body>
</html>
