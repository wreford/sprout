<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#151519">
<title>PDF Markup</title>
<style>
:root{--bg:#151519;--panel:#212127;--edge:#3a3a46;--ink:#f0f0f6;--dim:#9a9ab0;--acc:#ff5a76}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:560px;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:8px}
#bar,#bar2{display:flex;gap:5px;align-items:center}
#bar button,#bar label,#bar2 button{background:var(--panel);border:1px solid var(--edge);color:var(--ink);
  border-radius:9px;padding:8px 10px;font-weight:700;font-size:.82rem;cursor:pointer}
#bar2 button.on{border-color:var(--acc);color:var(--acc)}
input[type=file]{display:none}
#stage{flex:1;min-height:0;overflow:auto;border-radius:12px;background:#0d0d11;
  display:flex;align-items:flex-start;justify-content:center;touch-action:none}
#wrap{position:relative;margin:10px}
#base,#anno{border-radius:4px;display:block}
#anno{position:absolute;inset:0;touch-action:none}
#pg{color:var(--dim);font-size:.8rem;min-width:52px;text-align:center;font-weight:700}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--edge);cursor:pointer;flex:none}
.dot.on{border-color:#fff}
#msg{color:var(--dim);font-size:.74rem;text-align:center;min-height:1em}
#spacer{flex:1}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <label for="file">📄 open</label>
    <input type="file" id="file" accept="application/pdf,image/*">
    <button id="blankBtn">blank</button>
    <div id="spacer"></div>
    <button id="prevBtn">◀</button><span id="pg">–</span><button id="nextBtn">▶</button>
    <button id="expBtn">⬇️</button>
  </div>
  <div id="bar2">
    <button data-t="pen" class="on">✏️</button>
    <button data-t="hi">🖍️</button>
    <button data-t="arrow">↗</button>
    <button data-t="text">T</button>
    <button data-t="erase">⌫</button>
    <button id="undoBtn">↩</button>
    <div id="spacer2" style="flex:1"></div>
    <div class="dot on" data-c="#ff3b30" style="background:#ff3b30"></div>
    <div class="dot" data-c="#ffcc00" style="background:#ffcc00"></div>
    <div class="dot" data-c="#34c759" style="background:#34c759"></div>
    <div class="dot" data-c="#0a84ff" style="background:#0a84ff"></div>
  </div>
  <div id="stage"><div id="wrap">
    <canvas id="base"></canvas><canvas id="anno"></canvas>
  </div></div>
  <p id="msg">open a PDF or image — or start on a blank sheet</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const base=$("base"),bctx=base.getContext("2d");
const anno=$("anno"),actx=anno.getContext("2d");
let doc=null,pageN=1,pageCount=1,pages={},tool="pen",color="#ff3b30",stroke=null,pageBitmaps={};
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc=
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
function say(t){$('msg').textContent=t;}
function marks(){return pages[pageN]=pages[pageN]||[];}
function setSize(w,h){
  base.width=w;base.height=h;anno.width=w;anno.height=h;
  const dw=Math.min(520,innerWidth-36);
  base.style.width=dw+"px";base.style.height=(dw*h/w)+"px";
  anno.style.width=base.style.width;anno.style.height=base.style.height;
}
function newBlank(){
  doc=null;pageCount=1;pageN=1;pages={1:pages[1]||[]};pageBitmaps={};
  setSize(1000,1414);
  bctx.fillStyle="#ffffff";bctx.fillRect(0,0,1000,1414);
  bctx.strokeStyle="#e8e8f0";bctx.lineWidth=1;
  for(let y=60;y<1414;y+=40){bctx.beginPath();bctx.moveTo(40,y);bctx.lineTo(960,y);bctx.stroke();}
  pageBitmaps[1]=bctx.getImageData(0,0,1000,1414);
  drawAnno();paintPg();say("blank sheet — scribble away");
}
async function renderPage(){
  if(!doc){newBlank();return;}
  const page=await doc.getPage(pageN);
  const vp=page.getViewport({scale:2});
  setSize(vp.width,vp.height);
  await page.render({canvasContext:bctx,viewport:vp}).promise;
  pageBitmaps[pageN]=bctx.getImageData(0,0,base.width,base.height);
  drawAnno();paintPg();
}
function paintPg(){$('pg').textContent=pageN+" / "+pageCount;}
function drawMark(c,m){
  c.lineCap="round";c.lineJoin="round";
  if(m.t==="text"){
    c.fillStyle=m.c;c.font="700 "+m.s*9+"px system-ui";
    c.fillText(m.txt,m.p[0][0],m.p[0][1]);return;
  }
  c.strokeStyle=m.c;
  c.globalAlpha=m.t==="hi"?0.35:1;
  c.lineWidth=m.t==="hi"?m.s*7:m.s*2.4;
  c.beginPath();
  m.p.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));
  c.stroke();
  if(m.t==="arrow"&&m.p.length>1){
    const[a,b]=[m.p[0],m.p[m.p.length-1]];
    const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),L=14*m.s;
    c.beginPath();
    c.moveTo(b[0],b[1]);
    c.lineTo(b[0]-L*Math.cos(ang-0.45),b[1]-L*Math.sin(ang-0.45));
    c.moveTo(b[0],b[1]);
    c.lineTo(b[0]-L*Math.cos(ang+0.45),b[1]-L*Math.sin(ang+0.45));
    c.stroke();
  }
  c.globalAlpha=1;
}
function drawAnno(){
  actx.clearRect(0,0,anno.width,anno.height);
  marks().forEach(m=>drawMark(actx,m));
  if(stroke)drawMark(actx,stroke);
}
function pt(e){
  const r=anno.getBoundingClientRect();
  return[(e.clientX-r.left)*anno.width/r.width,(e.clientY-r.top)*anno.height/r.height];
}
anno.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const p=pt(e);
  if(tool==="erase"){
    const ms=marks();
    for(let i=ms.length-1;i>=0;i--){
      if(ms[i].p.some(([x,y])=>Math.hypot(x-p[0],y-p[1])<26)){ms.splice(i,1);drawAnno();return;}
    }
    return;
  }
  if(tool==="text"){
    const txt=prompt("note text:");
    if(txt){marks().push({t:"text",c:color,s:3,p:[p],txt});drawAnno();}
    return;
  }
  stroke={t:tool==="arrow"?"arrow":tool,c:color,s:2,p:[p]};
});
anno.addEventListener('pointermove',e=>{
  if(!stroke)return;
  if(stroke.t==="arrow")stroke.p=[stroke.p[0],pt(e)];
  else stroke.p.push(pt(e));
  drawAnno();
});
["pointerup","pointerleave","pointercancel"].forEach(ev=>anno.addEventListener(ev,()=>{
  if(stroke&&stroke.p.length>0){marks().push(stroke);}
  stroke=null;drawAnno();
}));
$('file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  pages={};pageBitmaps={};
  if(f.type.startsWith("image/")){
    const i=new Image();
    i.onload=()=>{doc=null;pageCount=1;pageN=1;
      setSize(i.width,i.height);bctx.drawImage(i,0,0);
      pageBitmaps[1]=bctx.getImageData(0,0,base.width,base.height);
      drawAnno();paintPg();say("image loaded — mark it up");};
    i.src=URL.createObjectURL(f);return;
  }
  if(!window.pdfjsLib){say("PDF engine didn't load (offline?) — images + blank still work");return;}
  say("opening PDF…");
  try{
    const buf=await f.arrayBuffer();
    doc=await pdfjsLib.getDocument({data:buf}).promise;
    pageCount=doc.numPages;pageN=1;
    await renderPage();
    say(pageCount+" page"+(pageCount>1?"s":"")+" — pen up");
  }catch(err){say("couldn't read that PDF: "+err.message.slice(0,60));}
});
$('blankBtn').onclick=()=>{pages={};newBlank();};
$('prevBtn').onclick=()=>{if(pageN>1){pageN--;renderPage();}};
$('nextBtn').onclick=()=>{if(pageN<pageCount){pageN++;renderPage();}};
$('undoBtn').onclick=()=>{marks().pop();drawAnno();};
document.querySelectorAll('#bar2 [data-t]').forEach(b=>b.onclick=()=>{
  tool=b.dataset.t;
  document.querySelectorAll('#bar2 [data-t]').forEach(x=>x.classList.toggle('on',x===b));
});
document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{
  color=d.dataset.c;
  document.querySelectorAll('.dot').forEach(x=>x.classList.toggle('on',x===d));
});
async function exportDoc(){
  const flat=document.createElement('canvas');
  const fx=flat.getContext('2d');
  const savedN=pageN;
  if(window.jspdf){
    let pdf=null;
    for(let n=1;n<=pageCount;n++){
      pageN=n;
      if(doc)await renderPage();else drawAnno();
      flat.width=base.width;flat.height=base.height;
      fx.putImageData(pageBitmaps[n]||bctx.getImageData(0,0,base.width,base.height),0,0);
      (pages[n]||[]).forEach(m=>drawMark(fx,m));
      const wmm=210,hmm=wmm*flat.height/flat.width;
      if(!pdf)pdf=new jspdf.jsPDF({unit:"mm",format:[wmm,hmm]});
      else pdf.addPage([wmm,hmm]);
      pdf.addImage(flat.toDataURL("image/jpeg",0.85),"JPEG",0,0,wmm,hmm);
    }
    pdf.save("markup.pdf");
    pageN=savedN;if(doc)await renderPage();else drawAnno();
    say("exported markup.pdf ✓");
  } else {
    flat.width=base.width;flat.height=base.height;
    fx.drawImage(base,0,0);(pages[pageN]||[]).forEach(m=>drawMark(fx,m));
    const a=document.createElement('a');
    a.href=flat.toDataURL("image/png");a.download="markup-p"+pageN+".png";a.click();
    say("PDF lib offline — saved this page as PNG");
  }
}
$('expBtn').onclick=exportDoc;
newBlank();
window.PDM={
  tool:t=>{tool=t;},
  color:c=>{color=c;},
  addStroke(pts,t){marks().push({t:t||"pen",c:color,s:2,p:pts});drawAnno();},
  addText(x,y,txt){marks().push({t:"text",c:color,s:3,p:[[x,y]],txt});drawAnno();},
  undo(){marks().pop();drawAnno();},
  newBlank,
  marks:()=>marks().slice(),
  libs:()=>({pdf:!!window.pdfjsLib,jspdf:!!window.jspdf}),
  state(){return{tool,color,page:pageN,pages:pageCount,marks:marks().length,
    w:base.width,h:base.height};}
};
</script>
</body>
</html>
