<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1610">
<title>Sun Path</title>
<style>
:root{--bg:#1a1610;--panel:#2a2318;--edge:#4a3d26;--ink:#faf4e6;--dim:#b8a988;--acc:#ffc554}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-y}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:10px;overflow-y:auto}
h1{font-size:1.1rem;color:var(--acc)}
#cv{width:100%;border-radius:12px;background:#100d08}
.row{display:flex;gap:6px}
input,button{background:var(--panel);border:1px solid var(--edge);color:var(--ink);
  border-radius:10px;padding:9px 10px;font-size:.88rem;font-weight:600}
input{flex:1;min-width:0}
button{cursor:pointer;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid div{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:8px 10px;text-align:center}
.grid small{display:block;color:var(--dim);font-size:.66rem;font-weight:700;text-transform:uppercase}
.grid b{font-size:.95rem}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:10px 12px}
.card h2{font-size:.78rem;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
table{width:100%;font-size:.8rem;border-collapse:collapse}
td,th{padding:3px 4px;text-align:right;color:var(--dim)}
th{color:var(--ink);font-size:.72rem}
td:first-child,th:first-child{text-align:left}
#msg{color:var(--dim);font-size:.75rem;text-align:center;min-height:1em}
</style>
</head>
<body>
<div id="app">
  <h1>☀️ Sun Path</h1>
  <div class="row">
    <input id="lat" type="number" step="0.0001" placeholder="lat" value="49.2827">
    <input id="lon" type="number" step="0.0001" placeholder="lon" value="-123.1207">
    <button id="geoBtn">📍</button>
  </div>
  <div class="row">
    <input id="date" type="date">
    <button id="todayBtn">today</button>
  </div>
  <canvas id="cv"></canvas>
  <div class="grid">
    <div><small>sunrise</small><b id="rise">–</b></div>
    <div><small>solar noon</small><b id="noon">–</b></div>
    <div><small>sunset</small><b id="set">–</b></div>
    <div><small>day length</small><b id="len">–</b></div>
    <div><small>max altitude</small><b id="maxAlt">–</b></div>
    <div><small>golden hour</small><b id="golden">–</b></div>
  </div>
  <div class="card">
    <h2>shadow caster</h2>
    <div class="row">
      <input id="objH" type="number" step="0.1" value="2" placeholder="object height (m)">
      <div style="flex:2;align-self:center;font-size:.86rem" id="shadowNow">–</div>
    </div>
    <table id="shTable"></table>
  </div>
  <p id="msg">times are in this device's timezone</p>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
const W=420,H=210;cv.width=W*2;cv.height=H*2;ctx.scale(2,2);cv.style.aspectRatio=W+"/"+H;
const D2R=Math.PI/180;
let lat=49.2827,lon=-123.1207,date=new Date();
function solarPos(latD,lonD,d,hourLocal){
  const start=new Date(d.getFullYear(),0,0);
  const N=Math.floor((d-start)/864e5);
  const tzHours=-d.getTimezoneOffset()/60;
  const g=2*Math.PI/365*(N-1+(hourLocal-12)/24);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)
    -0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)
    -0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)
    -0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const tst=hourLocal*60+eq+4*lonD-60*tzHours;
  const ha=(tst/4-180)*D2R;
  const la=latD*D2R;
  const cosZen=Math.sin(la)*Math.sin(decl)+Math.cos(la)*Math.cos(decl)*Math.cos(ha);
  const zen=Math.acos(Math.max(-1,Math.min(1,cosZen)));
  const elev=90-zen/D2R;
  let az=Math.acos(Math.max(-1,Math.min(1,
    (Math.sin(decl)-Math.sin(la)*cosZen)/(Math.cos(la)*Math.sin(zen)))))/D2R;
  if(ha>0)az=360-az;
  return{elev,az,decl:decl/D2R};
}
function fmtH(h){
  if(h==null)return"—";
  const hh=Math.floor(h),mm=Math.round((h-hh)*60);
  return String((hh+24)%24).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}
function sunTimes(){
  let rise=null,set=null,maxE=-90,noonH=12;
  let prev=solarPos(lat,lon,date,0).elev;
  for(let m=1;m<=1440;m++){
    const h=m/60;
    const e=solarPos(lat,lon,date,h).elev;
    if(prev<-0.833&&e>=-0.833)rise=h;
    if(prev>=-0.833&&e<-0.833)set=h;
    if(e>maxE){maxE=e;noonH=h;}
    prev=e;
  }
  const dayLen=rise!=null&&set!=null?set-rise:(maxE>0?24:0);
  return{rise,set,noon:noonH,maxElev:maxE,dayLen};
}
function shadowLen(hObj,elev){
  if(elev<=0.5)return null;
  return hObj/Math.tan(elev*D2R);
}
function calc(){
  const st=sunTimes();
  $('rise').textContent=fmtH(st.rise);
  $('set').textContent=fmtH(st.set);
  $('noon').textContent=fmtH(st.noon);
  $('len').textContent=st.dayLen>0?st.dayLen.toFixed(1)+" h":"none";
  $('maxAlt').textContent=st.maxElev.toFixed(1)+"°";
  $('golden').textContent=st.set!=null?fmtH(st.set-1)+"→"+fmtH(st.set):"—";
  ctx.fillStyle="#100d08";ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"rgba(255,197,84,.12)");g.addColorStop(1,"rgba(255,197,84,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H*0.75);
  const y0=H-34,scaleY=(H-58)/90;
  ctx.strokeStyle="#4a3d26";ctx.lineWidth=1;
  [0,30,60,90].forEach(a=>{
    const y=y0-a*scaleY;
    ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(W-8,y);ctx.stroke();
    ctx.fillStyle="#7a6a4a";ctx.font="600 9px system-ui";ctx.fillText(a+"°",8,y+3);
  });
  ctx.strokeStyle="#ffc554";ctx.lineWidth=2.5;ctx.beginPath();
  let started=false;
  for(let m=0;m<=1440;m+=10){
    const h=m/60,e=solarPos(lat,lon,date,h).elev;
    const x=30+(W-38)*h/24,y=y0-Math.max(0,e)*scaleY;
    if(e>0){started?ctx.lineTo(x,y):ctx.moveTo(x,y);started=true;}
    else started=false;
  }
  ctx.stroke();
  [0,6,12,18,24].forEach(h=>{
    const x=30+(W-38)*h/24;
    ctx.fillStyle="#7a6a4a";ctx.font="600 9px system-ui";ctx.textAlign="center";
    ctx.fillText(String(h).padStart(2,"0")+":00",x,H-20);
  });
  ctx.textAlign="left";
  const now=new Date();
  if(dayKey(now)===dayKey(date)){
    const h=now.getHours()+now.getMinutes()/60;
    const e=solarPos(lat,lon,date,h).elev;
    const x=30+(W-38)*h/24,y=y0-Math.max(0,e)*scaleY;
    ctx.fillStyle=e>0?"#ffe08a":"#5a4a30";
    ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();
    ctx.fillStyle="#100d08";ctx.font="800 8px system-ui";ctx.textAlign="center";
    ctx.fillText("☀",x,y+3);ctx.textAlign="left";
  }
  ctx.fillStyle="#b8a988";ctx.font="600 10px system-ui";
  ctx.fillText(lat.toFixed(3)+", "+lon.toFixed(3)+" · "+date.toDateString(),30,14);
  const hObj=+$('objH').value||2;
  const nowH=new Date().getHours()+new Date().getMinutes()/60;
  const eNow=solarPos(lat,lon,date,nowH).elev;
  const sh=shadowLen(hObj,eNow);
  $('shadowNow').innerHTML=sh?("right now: a "+hObj+" m object throws <b style='color:var(--acc)'>"+
    sh.toFixed(1)+" m</b> of shadow"):"sun is down — shadows are infinite and spooky";
  let rows="<tr><th>hour</th><th>altitude</th><th>azimuth</th><th>shadow</th></tr>";
  for(let h=6;h<=20;h+=2){
    const p=solarPos(lat,lon,date,h);
    const s=shadowLen(hObj,p.elev);
    rows+=`<tr><td>${String(h).padStart(2,"0")}:00</td><td>${p.elev.toFixed(0)}°</td>
      <td>${p.az.toFixed(0)}°</td><td>${s?s.toFixed(1)+" m":"—"}</td></tr>`;
  }
  $('shTable').innerHTML=rows;
  return st;
}
function dayKey(d){return d.toISOString().slice(0,10);}
$('date').value=dayKey(new Date());
$('lat').addEventListener('input',e=>{lat=+e.target.value||0;calc();});
$('lon').addEventListener('input',e=>{lon=+e.target.value||0;calc();});
$('date').addEventListener('input',e=>{
  const p=e.target.value.split("-");
  date=new Date(+p[0],+p[1]-1,+p[2]);calc();
});
$('todayBtn').onclick=()=>{date=new Date();$('date').value=dayKey(date);calc();};
$('objH').addEventListener('input',calc);
$('geoBtn').onclick=()=>{
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(p=>{
    lat=p.coords.latitude;lon=p.coords.longitude;
    $('lat').value=lat.toFixed(4);$('lon').value=lon.toFixed(4);
    calc();$('msg').textContent="sun math for right here";
  },()=>{$('msg').textContent="location denied — type coordinates instead";});
};
calc();
window.SP={
  set(la,lo,dstr){lat=la;lon=lo;
    if(dstr){const p=dstr.split("-");date=new Date(+p[0],+p[1]-1,+p[2]);}
    $('lat').value=la;$('lon').value=lo;
    return calc();},
  pos:(h)=>solarPos(lat,lon,date,h),
  sunTimes,shadowLen,calc,
  state(){return{lat,lon,date:dayKey(date)};}
};
</script>
</body>
</html>
