<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12161c">
<title>Tape Math</title>
<style>
:root{--bg:#12161c;--panel:#1c232e;--edge:#33415a;--ink:#eef3fa;--dim:#93a3bc;--acc:#ffb054;--mint:#7ce0a8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-y}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:420px;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:10px}
h1{font-size:1.05rem;color:var(--acc)}
#disp{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:12px 14px;text-align:right}
#expr{color:var(--dim);font-size:.85rem;min-height:1.2em}
#cur{font-size:1.7rem;font-weight:800;min-height:1.3em}
#alt{color:var(--mint);font-size:.8rem;min-height:1.1em}
#pads{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
.kr{display:flex;gap:6px;flex:1}
.kr button{flex:1;background:var(--panel);border:1px solid var(--edge);color:var(--ink);
  border-radius:11px;font-size:1.05rem;font-weight:700;cursor:pointer}
.kr button.op{color:var(--acc)}
.kr button.eq{background:var(--acc);color:#3a2408;border-color:var(--acc)}
.kr button.u{color:var(--mint)}
#fracs{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
#fracs button{background:var(--panel);border:1px solid var(--edge);color:var(--dim);
  border-radius:8px;font-size:.68rem;font-weight:700;padding:6px 0;cursor:pointer}
#hist{max-height:90px;overflow-y:auto;font-size:.78rem;color:var(--dim);text-align:right}
#hist div b{color:var(--ink)}
#msg{color:var(--dim);font-size:.72rem;text-align:center}
</style>
</head>
<body>
<div id="app">
  <h1>📏 Tape Math</h1>
  <div id="disp"><div id="expr"></div><div id="cur">0"</div><div id="alt"></div></div>
  <div id="fracs"></div>
  <div id="pads">
    <div class="kr"><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="div" class="op">÷</button></div>
    <div class="kr"><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="mul" class="op">×</button></div>
    <div class="kr"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="sub" class="op">−</button></div>
    <div class="kr"><button data-k="0">0</button><button data-k="ft" class="u">ft</button><button data-k="in" class="u">in</button><button data-k="add" class="op">+</button></div>
    <div class="kr"><button data-k="clr">C</button><button data-k="back">⌫</button><button data-k="parts" class="u">÷parts</button><button data-k="eq" class="eq">=</button></div>
  </div>
  <div id="hist"></div>
  <p id="msg">enter 5 ft 3 in ½ then + − × ÷ · totals stay in 16ths</p>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let acc=null,op=null,cur={ft:0,inch:0,num:0,den:16,digits:""},entering="in",hist=[];
function curInches(c){return c.ft*12+c.inch+(c.den?c.num/c.den:0);}
function fmtFrac(inches){
  const neg=inches<0;inches=Math.abs(inches);
  let sixteenths=Math.round(inches*16);
  const rounded=Math.abs(sixteenths-inches*16)>0.01;
  let ft=Math.floor(sixteenths/(12*16));sixteenths-=ft*12*16;
  let whole=Math.floor(sixteenths/16);let n=sixteenths%16,d=16;
  while(n&&n%2===0){n/=2;d/=2;}
  let s=(neg?"−":"")+(ft?ft+"' ":"")+
    (whole||(!ft&&!n)?whole:"")+(n?(whole?"-":"")+n+"/"+d:"")+'"';
  return(rounded?"≈ ":"")+s;
}
function fmtAlt(inches){
  const mm=inches*25.4;
  return inches.toFixed(3)+" in · "+(mm>=1000?(mm/1000).toFixed(3)+" m":mm.toFixed(1)+" mm");
}
function paint(){
  const v=curInches(cur);
  $('cur').textContent=cur.digits!==""||cur.ft||cur.num?buildCurText():fmtFrac(v);
  $('alt').textContent=fmtAlt(v);
  $('expr').textContent=acc!=null?fmtFrac(acc)+" "+{add:"+",sub:"−",mul:"×",div:"÷"}[op]:"";
  $('hist').innerHTML=hist.slice(-4).map(h=>`<div>${h.e} = <b>${h.r}</b></div>`).join("");
}
function buildCurText(){
  let s="";
  if(cur.ft)s+=cur.ft+"' ";
  s+=(cur.digits||cur.inch||(!cur.ft&&!cur.num)?(cur.digits||cur.inch):"");
  if(cur.num)s+=(cur.digits||cur.inch?"-":"")+cur.num+"/"+cur.den;
  return s+'"';
}
function digit(d){
  cur.digits=(cur.digits+d).slice(0,5);
  cur.inch=+cur.digits;
  paint();
}
function pressFt(){
  cur.ft=+(cur.digits||cur.inch)||0;
  cur.digits="";cur.inch=0;paint();
}
function setFrac(n,d){cur.num=n;cur.den=d;paint();}
function clearCur(){cur={ft:0,inch:0,num:0,den:16,digits:""};}
function apply(){
  if(acc==null||!op)return;
  const b=curInches(cur);
  let r=acc;
  if(op==="add")r=acc+b;
  if(op==="sub")r=acc-b;
  if(op==="mul")r=acc*b;
  if(op==="div")r=b===0?0:acc/b;
  return r;
}
function doOp(o){
  if(acc!=null&&op){acc=apply();}
  else acc=curInches(cur);
  op=o;clearCur();paint();
}
function equals(){
  if(acc==null||!op){paint();return curInches(cur);}
  const b=curInches(cur);
  let r,eTxt;
  if(op==="add"){r=acc+b;eTxt=fmtFrac(acc)+" + "+fmtFrac(b);}
  else if(op==="sub"){r=acc-b;eTxt=fmtFrac(acc)+" − "+fmtFrac(b);}
  else if(op==="mul"){r=acc*(cur.ft?curInches(cur):(+cur.digits||curInches(cur)||1));
    const k=cur.ft?fmtFrac(b):(cur.digits||b);
    eTxt=fmtFrac(acc)+" × "+k;}
  else{const k=+cur.digits||b||1;r=acc/k;eTxt=fmtFrac(acc)+" ÷ "+(cur.digits||fmtFrac(b));}
  hist.push({e:eTxt,r:fmtFrac(r)});
  acc=null;op=null;
  clearCur();
  const sixteenths=Math.round(r*16);
  cur.ft=Math.floor(sixteenths/192);
  cur.inch=Math.floor((sixteenths-cur.ft*192)/16);
  cur.num=sixteenths%16;cur.den=16;
  paint();
  say("=");
  return r;
}
function parts(){
  const n=+prompt("divide this length into how many equal parts?","4");
  if(!n||n<2)return;
  const v=acc!=null?acc:curInches(cur);
  const each=v/n;
  hist.push({e:fmtFrac(v)+" ÷ "+n+" parts",r:fmtFrac(each)+" each"});
  say(n+" marks every "+fmtFrac(each));
  paint();
}
function say(t){$('msg').textContent=t;}
const FR=[];
for(let d of[2,4,8,16])for(let n=1;n<d;n+=2)FR.push([n,d]);
FR.sort((a,b)=>a[0]/a[1]-b[0]/b[1]);
$('fracs').innerHTML=FR.map(([n,d])=>`<button data-n="${n}" data-d="${d}">${n}⁄${d}</button>`).join("");
document.querySelectorAll('#fracs button').forEach(b=>b.onclick=()=>setFrac(+b.dataset.n,+b.dataset.d));
document.querySelectorAll('.kr button').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;
  if(/^\d$/.test(k))digit(k);
  else if(k==="ft")pressFt();
  else if(k==="in")paint();
  else if(k==="clr"){acc=null;op=null;clearCur();paint();say("cleared");}
  else if(k==="back"){cur.digits=cur.digits.slice(0,-1);cur.inch=+cur.digits||0;paint();}
  else if(k==="eq")equals();
  else if(k==="parts")parts();
  else doOp(k);
});
function parse(s){
  s=s.trim();
  let sign=1;
  if(s.startsWith("-")){sign=-1;s=s.slice(1);}
  let inches=0;
  const ftM=s.match(/(\d+(?:\.\d+)?)\s*(?:'|ft)/);
  if(ftM)inches+=+ftM[1]*12;
  const fracM=s.match(/(\d+)\s*\/\s*(\d+)/);
  let rest=s.replace(/(\d+(?:\.\d+)?)\s*(?:'|ft)/,"").replace(/(\d+)\s*\/\s*(\d+)/,"");
  const inM=rest.match(/(\d+(?:\.\d+)?)/);
  if(inM)inches+=+inM[1];
  if(fracM)inches+=+fracM[1]/+fracM[2];
  return sign*inches;
}
function calcStr(expr){
  const m=expr.match(/^(.+?)\s+([+\-−×x*÷\/])\s+(.+)$/);
  if(!m)return parse(expr);
  const a=parse(m[1]),o=m[2],b=/['"\/a-z]/.test(m[3])?parse(m[3]):+m[3];
  if(o==="+")return a+b;
  if(o==="-"||o==="−")return a-b;
  if(o==="×"||o==="x"||o==="*")return a*b;
  return a/b;
}
paint();
window.TM={
  parse,calcStr,fmtFrac,fmtAlt,
  press(k){document.querySelector(`[data-k="${k}"]`).click();},
  frac(n,d){setFrac(n,d);},
  value:()=>curInches(cur),
  hist:()=>hist.slice(),
  state(){return{cur:buildCurText(),acc,op,hist:hist.length};}
};
</script>
</body>
</html>
