<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Labyrinth">
<meta name="theme-color" content="#f4ecdc">
<title>Not That Labyrinth</title>
<style>
:root{--bg:#f4ecdc;--ink:#2a2233;--mute:#7d7186;--card:#fffaf0;--line:rgba(42,34,51,.16);--glam:#7b4fb5;--glam2:#c9a3ff;--red:#c0392b;--gold:#c99a2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:1100px;height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 8px)}
#top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 2px 6px}
#fname{font-weight:700;font-size:16px;font-style:italic}
.stat{font:600 13px/1 -apple-system,system-ui,sans-serif;padding:5px 8px;border-radius:7px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
#clock.low{background:#fde5e1;color:var(--red);border-color:#e9a79e}
#hp.low{background:#fde5e1;color:var(--red)}
#top .sp{flex:1}
#menuBtn{font:600 13px -apple-system,system-ui,sans-serif;background:none;border:1px solid var(--line);border-radius:7px;padding:5px 9px;color:var(--ink)}
#main{flex:1;display:flex;gap:12px;min-height:0}
#board{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
canvas{display:block;border-radius:10px;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(42,34,51,.12);touch-action:none;background:#e6dfd0}
#side{width:300px;display:flex;flex-direction:column;gap:8px;min-height:0}
#log{flex:1;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.35}
#log p{margin:0 0 5px}
#log p:first-child{font-weight:700}
#log p.old{color:var(--mute)}
#pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,46px);gap:5px;justify-content:center}
.btn{font:600 14px -apple-system,system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:0 10px;min-height:40px;cursor:pointer;user-select:none}
.btn:active{transform:translateY(1px);background:#efe5d2}
.btn[disabled]{opacity:.4}
.btn.glam{background:var(--glam);color:#fff;border-color:var(--glam)}
#acts{display:flex;gap:6px;flex-wrap:wrap}
#acts .btn{flex:1;min-width:88px;font-size:13px}
#comp{font:13px -apple-system,system-ui,sans-serif;color:var(--mute)}
#banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;border-radius:20px;font:600 13px -apple-system,system-ui,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#banner.on{opacity:.92}
#modal{position:fixed;inset:0;background:rgba(42,34,51,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
#card{background:var(--card);border-radius:14px;max-width:460px;width:100%;max-height:92dvh;overflow:auto;padding:18px 18px 14px;box-shadow:0 20px 60px rgba(0,0,0,.3);border-top:6px solid var(--glam)}
#card h2{margin:0 0 8px;font-size:21px}
#card .x{font-size:16px;line-height:1.45;margin:0 0 14px}
#card .o{display:block;width:100%;text-align:left;margin:0 0 8px;padding:10px 12px;font:15px/1.3 -apple-system,system-ui,sans-serif;min-height:44px}
#card .o small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
#card .o.glam small{color:#eadcff}
.kbd{font:12px -apple-system,system-ui,sans-serif;color:var(--mute);text-align:center}
@media (max-width:760px){
 #main{flex-direction:column;gap:6px}
 #side{width:100%;flex:0 0 auto}
 #log{flex:0 0 auto;height:68px;font-size:13px;padding:6px 8px}
 #log p.old:nth-child(n+4){display:none}
 #ctrl{display:flex;gap:8px;align-items:center}
 #pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,40px);gap:4px}
 #acts{flex-direction:column;flex:1}
 #acts .btn{min-height:36px}
 .kbd{display:none}
 #fname{font-size:14px;width:100%}
}
</style>
</head>
<body>
<div id="app">
 <div id="top"><span id="fname">Not That Labyrinth</span><span class="sp"></span><span class="stat" id="clock">13:00</span><span class="stat" id="hp">HP 12/12</span><span class="stat" id="atk">Hit 1-3</span><button id="menuBtn">Menu</button></div>
 <div id="main">
  <div id="board"><canvas id="cv"></canvas><div id="banner"></div></div>
  <div id="side">
   <div id="log"></div>
   <div id="ctrl">
    <div id="pad">
     <span></span><button class="btn" data-d="0,-1">Up</button><span></span>
     <button class="btn" data-d="-1,0">Left</button><button class="btn" data-d="0,0">Wait</button><button class="btn" data-d="1,0">Right</button>
     <span></span><button class="btn" data-d="0,1">Down</button><span></span>
    </div>
    <div id="acts"></div>
   </div>
   <div id="comp"></div>
   <div class="kbd">Arrows or WASD to move, space to wait, I for items, 1 2 3 for friends. Tap a spot to walk there.</div>
  </div>
 </div>
</div>
<div id="modal"><div id="card"></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const R=Math.random,ri=n=>Math.floor(R()*n),pick=a=>a[ri(a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const LS="ntl.v1";
const store={get(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}},set(o){try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}}};

// ---------------- The floors ----------------
const FLOORS=[
 {k:"wall",n:"The Outer Wall",W:17,H:17,wall:"#b8a585",wall2:"#9c8a6b",floor:"#f3ead6",vis:5,loops:.12,mob:[["fairy",5],["goblin",2]],items:2,
  intro:"Thirteen hours. That's what the Goblin King gave you to get your baby brother back, which is fair, given you were the one who wished him away. The wall looks like it goes on forever. It doesn't. It only looks that way."},
 {k:"hedge",n:"The Hedge Maze",W:19,H:19,wall:"#5f8b4b",wall2:"#476f36",floor:"#efe6cd",vis:4,loops:.07,shift:1,mob:[["goblin",4],["fairy",3]],items:2,guards:1,
  intro:"The hedges are tall, neat, and move when you are not looking at them. Somewhere in here are two doors and two guards with a logic puzzle they are very proud of."},
 {k:"oub",n:"The Oubliette",W:15,H:15,wall:"#6d6578",wall2:"#544d5e",floor:"#ddd5e1",vis:2,loops:.14,mob:[["cleaner",2],["goblin",2]],items:3,wise:1,
  intro:"An oubliette. A place you put people to forget about them. It is very dark and something down here is making a grinding noise."},
 {k:"bog",n:"The Bog of Stench",W:19,H:19,wall:"#7d7a4c",wall2:"#5f5c35",floor:"#ece5c6",vis:4,loops:.1,bog:1,mob:[["goblin",3],["firey",3]],items:2,beast:1,knight:1,
  intro:"You smell it before you see it. One step in the brown water and you will smell like this for the rest of your life, which here could be short."},
 {k:"junk",n:"The Junk Yard",W:19,H:19,wall:"#a58f74",wall2:"#86715a",floor:"#efe2cc",vis:4,loops:.12,mob:[["junk",4],["firey",2],["goblin",2]],items:3,junklady:1,peach:1,
  intro:"Heaps of old things, all of them yours. Your bear, your music box, your dressing gown. It would be very easy to sit down here and stay."},
 {k:"city",n:"Goblin City",W:21,H:21,wall:"#8c7f73",wall2:"#6e6258",floor:"#eee3d2",vis:4,loops:.16,rooms:4,mob:[["guard",5],["goblin",5],["firey",1]],items:3,giant:1,
  intro:"Goblin City. Chickens, washing lines, and every goblin in the kingdom, most of them armed with something they found. The castle gate is guarded by something very large."},
 {k:"stairs",n:"The Impossible Stairs",W:17,H:17,wall:"#9a8fb0",wall2:"#7a6f92",floor:"#f1ecf6",vis:5,loops:.2,escher:1,mob:[["goblin",3]],items:2,king:1,
  intro:"Stairs going up, down, and sideways at the same time. Your brother is crawling across a ceiling somewhere. The Goblin King is here, and he has had a lot of time to rehearse."}
];
const MOB={
 fairy:{n:"fairy",hp:1,dmg:1,spd:2,col:"#ee8fc8",sight:6,hit:["A fairy bites you. They do that.","A fairy bites your ear and giggles.","Something small and pretty bites you."]},
 goblin:{n:"goblin",hp:3,dmg:1,spd:1,col:"#7fa54b",sight:7,hit:["A goblin pokes you with a fork.","A goblin kicks your shin and runs off, then comes back.","A goblin hits you with a chicken. The chicken is fine."]},
 cleaner:{n:"Cleaner",hp:99,dmg:2,spd:1,col:"#8a8f9a",sight:0,inv:1,straight:1,hit:["The Cleaner runs over you, blades spinning."]},
 firey:{n:"firey",hp:4,dmg:1,spd:1,col:"#f0892e",sight:7,ranged:3,rdmg:1,rname:"takes its own head off and throws it at you",hit:["A firey wants to take your head off. It means it as a compliment."]},
 junk:{n:"junk hoarder",hp:4,dmg:1,spd:1,col:"#a98c6b",sight:6,steal:1,hit:["A junk hoarder hits you with a lampshade."]},
 guard:{n:"goblin guard",hp:5,dmg:2,spd:1,col:"#5b7b3a",sight:8,hit:["A goblin guard hits you with a pike, handle first. Still hurts.","A goblin guard shield-bashes you."]},
 giant:{n:"the Gate Giant",hp:16,dmg:3,spd:.5,col:"#9aa0aa",sight:6,boss:1,hit:["The Gate Giant swings an arm the size of a door."]},
 king:{n:"the Goblin King",hp:10,dmg:2,spd:1,col:"#7b4fb5",sight:9,ranged:5,rdmg:2,rname:"spins a crystal ball at you, very casually",king:1,hit:["The Goblin King slaps you with a glove. It is a very nice glove."]}
};
const ITEMS={
 sandwich:{n:"Sandwich",d:"Heals 4. Slightly squashed.",use(){heal(4);say("You eat the sandwich. It was squashed in a nice way.");return 1}},
 peach:{n:"Peach",d:"Heals you fully. Possibly enchanted.",use(){heal(99);if(R()<.5){spend(60);say("You bite the peach. A ballroom, a mask, a man in a frilly shirt. You wake up an hour later with crumbs on you.");}else say("You eat the peach. Just a peach. Delicious.");return 1}},
 crystal:{n:"Crystal ball",d:"Throw at the nearest enemy you can see: 3 damage.",use(){const m=nearestMob();if(!m){say("Nothing to throw it at.");return 0}say(`You throw the crystal ball at the ${M(m).n}. It bounces off its head and turns into a bubble.`);hurt(m,3);return 1}},
 lipstick:{n:"Lipstick",d:"Mark your way. Shows the way out of this floor.",use(){G.mark=1;G.seen[G.ex.y][G.ex.x]=1;say("You draw arrows on the floor. The goblins will flip the tiles over, but not before you see where the way out is.");return 1}},
 bracelet:{n:"Plastic bracelet",d:"Shiny. Somebody will want it.",use(){say("You admire the bracelet. Someone around here would love it.");return 0}},
 clock:{n:"Stopped clock",d:"Gives back 30 minutes.",use(){G.min+=30;say("You turn the clock's hands back. Time grudgingly goes along with it.");return 1}},
 boots:{n:"Rain boots",d:"Wear them: bog water stops costing you.",use(){G.boots=1;say("You pull on the rain boots. The bog can do its worst.");return 1}}
};
const FLOORITEMS=["sandwich","sandwich","crystal","crystal","lipstick","clock","boots","peach"];
const COMPS={
 grumble:{n:"Grumble",title:"the dwarf",skill:"Ask the way",d:"Shows the path out for 15 turns."},
 boulder:{n:"Boulder",title:"the big one",skill:"Call the rocks",d:"Rocks hit every enemy you can see for 2 and stun them."},
 dashwood:{n:"Sir Dashwood",title:"the fox knight",skill:"Charge!",d:"Charges the nearest enemy for 4. Also lunges at enemies beside you on his own."}
};

// ---------------- State ----------------
let G=null,busy=false,walkTimer=0;
function newRun(){
 G={f:0,hp:14,mhp:14,lo:1,hi:3,min:780,items:["bracelet","sandwich"],comp:{},charge:{},kills:0,turn:0,turns:0,log:[],flags:{},boots:0,rot:0,dead:0,won:0,bribed:0,taunts:{}};
 const s=store.get();s.runs=(s.runs||0)+1;store.set(s);
 build(0);openIntro(true);
}
function build(f){
 const F=FLOORS[f];G.f=f;G.F=F;G.W=F.W;G.H=F.H;G.mobs=[];G.npcs=[];G.loot=[];G.path=0;G.mark=0;G.rot=0;G.turn=0;G.bog=null;G.fx=[];
 for(const k in G.comp)G.charge[k]=1;
 const W=F.W,H=F.H,m=[];for(let y=0;y<H;y++){m.push(new Array(W).fill(1))}
 // carve a maze
 const st=[[1,1]];m[1][1]=0;
 while(st.length){const [x,y]=st[st.length-1];const ds=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>0&&ny>0&&nx<W-1&&ny<H-1&&m[ny][nx]})
  if(!ds.length){st.pop();continue}const [dx,dy]=pick(ds);m[y+dy/2][x+dx/2]=0;m[y+dy][x+dx]=0;st.push([x+dx,y+dy])}
 // loops
 const n=Math.round(W*H*F.loops/2);for(let i=0;i<n;i++){const x=1+ri(W-2),y=1+ri(H-2);if(!m[y][x])continue;if((m[y][x-1]===0&&m[y][x+1]===0&&m[y-1][x]&&m[y+1][x])||(m[y-1][x]===0&&m[y+1][x]===0&&m[y][x-1]&&m[y][x+1]))m[y][x]=0}
 // rooms
 for(let i=0;i<(F.rooms||1);i++){const w=3+ri(2),h=3+ri(2),x=1+ri(W-w-1),y=1+ri(H-h-1);for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)m[yy][xx]=0}
 G.m=m;
 const cells=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(!m[y][x])cells.push({x,y});
 const s=pick(cells);G.x=s.x;G.y=s.y;
 let d=dist(G.x,G.y);let far=cells.reduce((a,c)=>d[c.y][c.x]>d[a.y][a.x]?c:a,cells[0]);G.ex={x:far.x,y:far.y};
 G.seen=[];G.vis=[];for(let y=0;y<H;y++){G.seen.push(new Array(W).fill(0));G.vis.push(new Array(W).fill(0))}
 const free=()=>{for(let t=0;t<400;t++){const c=pick(cells);if(d[c.y][c.x]>4&&!(c.x===G.ex.x&&c.y===G.ex.y)&&!occ(c.x,c.y)&&!G.loot.some(l=>l.x===c.x&&l.y===c.y))return c}return null};
 const onPath=frac=>{const p=pathTo(G.x,G.y,G.ex.x,G.ex.y,0);return p&&p.length>4?p[Math.floor(p.length*frac)]:free()};
 // bog water
 if(F.bog){G.bog=[];for(let y=0;y<H;y++)G.bog.push(new Array(W).fill(0));for(let i=0;i<5;i++){const c=pick(cells);for(let k=0;k<9;k++){const x=clamp(c.x+ri(5)-2,1,W-2),y=clamp(c.y+ri(5)-2,1,H-2);if(!m[y][x]&&d[y][x]>2)G.bog[y][x]=1}}}
 // monsters
 F.mob.forEach(([k,n])=>{for(let i=0;i<n+(f>3&&R()<.5?1:0);i++){const c=free();if(c)addMob(k,c.x,c.y)}});
 if(G.flags.kicked&&f===0){for(let i=0;i<2;i++){const c=free();if(c)addMob("fairy",c.x,c.y)}}
 // loot
 for(let i=0;i<F.items;i++){const c=free();if(c)G.loot.push({x:c.x,y:c.y,k:pick(FLOORITEMS)})}
 // people
 if(f===0){const c=onPath(.3);if(c)G.npcs.push({x:c.x,y:c.y,id:"grumble",col:"#a0784a"})}
 if(F.guards){G.npcs.push({x:G.ex.x,y:G.ex.y,id:"guards",col:"#c45d3a",door:1})}
 if(F.wise){const c=free();if(c)G.npcs.push({x:c.x,y:c.y,id:"wise",col:"#8d7b5e"});if(G.comp.grumble){G.flags.oubgr=1}}
 if(F.beast&&!G.comp.boulder){const c=free();if(c){G.npcs.push({x:c.x,y:c.y,id:"boulder",col:"#b9784a",big:1});[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{if(!m[c.y+dy][c.x+dx]&&!occ(c.x+dx,c.y+dy))addMob("goblin",c.x+dx,c.y+dy)})}}
 if(F.knight&&!G.comp.dashwood){const c=onPath(.55);if(c){G.npcs.push({x:c.x,y:c.y,id:"dashwood",col:"#d2752f"});if(G.bog)G.bog[c.y][c.x]=0}}
 if(F.junklady){const c=onPath(.4);if(c)G.npcs.push({x:c.x,y:c.y,id:"junklady",col:"#9b8a77"})}
 if(F.giant){const p=pathTo(G.x,G.y,G.ex.x,G.ex.y,0);const c=p&&p.length>3?p[p.length-3]:free();if(c){addMob("giant",c.x,c.y)}}
 if(F.king){const c=free();if(c)addMob("king",c.x,c.y);G.npcs.push({x:G.ex.x,y:G.ex.y,id:"baby",col:"#f2c2a0",baby:1})}
 G.mobs.forEach(o=>{if(o.k==="cleaner")o.dir=pick([[1,0],[-1,0],[0,1],[0,-1]])});
 see();
}
function addMob(k,x,y){const d=MOB[k];G.mobs.push({k,x,y,hp:d.hp+(G.f>=4&&!d.boss&&!d.inv?1:0),mhp:d.hp,stun:0,acc:0})}
const M=o=>MOB[o.k];
function occ(x,y){return G.mobs.some(o=>o.x===x&&o.y===y)||G.npcs.some(o=>o.x===x&&o.y===y)}
function wall(x,y){return x<0||y<0||x>=G.W||y>=G.H||G.m[y][x]===1}
function dist(sx,sy,known){const W=G.W,H=G.H,d=[];for(let y=0;y<H;y++)d.push(new Array(W).fill(1e9));d[sy][sx]=0;const q=[[sx,sy]];let i=0;
 while(i<q.length){const [x,y]=q[i++];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(wall(nx,ny)||d[ny][nx]<1e9)continue;if(known&&!G.seen[ny][nx])continue;d[ny][nx]=d[y][x]+1;q.push([nx,ny])}}return d}
function pathTo(sx,sy,tx,ty,known){const d=dist(tx,ty,known);if(d[sy][sx]>=1e9)return null;const p=[];let x=sx,y=sy;
 while(!(x===tx&&y===ty)){let b=null;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(!wall(nx,ny)&&d[ny][nx]<d[y][x]){b=[nx,ny];break}}if(!b)break;[x,y]=b;p.push({x,y})}return p}
function los(x0,y0,x1,y1){let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx-dy,x=x0,y=y0;
 while(!(x===x1&&y===y1)){const e2=2*e;if(e2>-dy){e-=dy;x+=sx}if(e2<dx){e+=dx;y+=sy}if(x===x1&&y===y1)break;if(wall(x,y))return false}return true}
function see(){const r=G.F.vis;for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++){const v=(x-G.x)**2+(y-G.y)**2<=r*r+1&&los(G.x,G.y,x,y);G.vis[y][x]=v?1:0;if(v)G.seen[y][x]=1}}

// ---------------- Log and helpers ----------------
function say(t){G.log.unshift(t);if(G.log.length>30)G.log.pop();drawLog()}
function drawLog(){$("log").innerHTML=G.log.slice(0,12).map((t,i)=>`<p class="${i?"old":""}">${t}</p>`).join("")}
function banner(t){const b=$("banner");b.textContent=t;b.classList.add("on");clearTimeout(banner.t);banner.t=setTimeout(()=>b.classList.remove("on"),1800)}
function heal(n){G.hp=Math.min(G.mhp,G.hp+n)}
function spend(n){G.min=Math.max(0,G.min-n)}
function nearestMob(){let b=null,bd=1e9;G.mobs.forEach(o=>{if(!G.vis[o.y][o.x]||M(o).inv)return;const d=Math.abs(o.x-G.x)+Math.abs(o.y-G.y);if(d<bd){bd=d;b=o}});return b}
function fx(x,y,t,c){G.fx.push({x,y,t,c:c||"#c0392b",a:0})}
function hurt(o,n){const d=M(o);if(d.inv){say(`The ${d.n} doesn't notice.`);return}o.hp-=n;fx(o.x,o.y,"-"+n,"#7b4fb5");
 if(o.hp<=0){if(d.king){o.hp=d.hp;const c=farCell();say(pick(["The Goblin King laughs and vanishes in a puff of glitter.","The Goblin King turns into an owl, flies off, and turns back somewhere else.","'Ouch,' says the Goblin King, unconvincingly, and is gone."]));o.x=c.x;o.y=c.y;o.stun=4;return}
  G.mobs.splice(G.mobs.indexOf(o),1);G.kills++;
  if(d.boss){say("The Gate Giant tips over backwards with a noise like a filing cabinet falling down stairs. The gate is open.");banner("The gate is open")}

function farCell(){const d=dist(G.x,G.y);let b={x:G.x,y:G.y},bv=-1;for(let t=0;t<60;t++){const x=1+ri(G.W-2),y=1+ri(G.H-2);if(!wall(x,y)&&!occ(x,y)&&d[y][x]<1e9&&d[y][x]>bv&&d[y][x]<14){bv=d[y][x];b={x,y}}}return b}
function playerHit(n,why){if(G.dead||G.won)return;G.hp-=n;fx(G.x,G.y,"-"+n);say(why);shake();if(G.hp<=0){G.hp=0;die("hp")}}

function rot(dx,dy){for(let i=0;i<G.rot;i++){[dx,dy]=[-dy,dx]}return [dx,dy]}
function act(dx,dy,auto){
 if(busy||G.dead||G.won)return false;
 if(!auto&&G.F.escher)[dx,dy]=rot(dx,dy);
 if(dx||dy){const nx=G.x+dx,ny=G.y+dy;
  const o=G.mobs.find(o=>o.x===nx&&o.y===ny);
  if(o){attack(o)}
  else{const n=G.npcs.find(o=>o.x===nx&&o.y===ny);if(n){meet(n);return false}
   if(wall(nx,ny)){if(!auto)say(pick(["A wall. You push it. It's a wall.","That's a wall. Some walls here are doors, but not this one.","Wall."]));return false}
   G.x=nx;G.y=ny;pickup()}}
 endTurn();return true}
function attack(o){const d=M(o);if(d.inv){playerHit(1,"You punch the Cleaner. Your hand regrets it.");return}
 const n=G.lo+ri(G.hi-G.lo+1);hurt(o,n);if(G.mobs.includes(o)&&!d.king)say(pick([`You hit the ${d.n}.`,`You shove the ${d.n} into a wall.`,`You bop the ${d.n} on the nose.`]))}
function pickup(){const i=G.loot.findIndex(l=>l.x===G.x&&l.y===G.y);if(i<0)return;const l=G.loot.splice(i,1)[0];
 if(G.items.length>=6){G.loot.push(l);say(`There's a ${ITEMS[l.k].n.toLowerCase()} here, but your pockets are full.`);return}
 G.items.push(l.k);say(`You find a ${ITEMS[l.k].n.toLowerCase()}. ${ITEMS[l.k].d}`)}
function endTurn(){
 G.turn++;G.turns++;spend(1);
 if(G.bog&&G.bog[G.y][G.x]){if(G.boots)say("Your rain boots squelch through the bog. Smugly.");else{spend(3);G.flags.stink=1;say(pick(["You step in the Bog of Stench. You will smell like this forever. It costs you three minutes of gagging.","Bog water up to your knees. Three minutes lost being sick in a bush."]))}}
 // companions
 if(G.comp.dashwood){const adj=G.mobs.filter(o=>Math.abs(o.x-G.x)+Math.abs(o.y-G.y)===1&&!M(o).inv);if(adj.length&&R()<.5){const o=pick(adj);say(pick(["Sir Dashwood lunges past you. 'Have at thee!'","Sir Dashwood pokes it with his little sword. 'En garde, varlet!'"]));hurt(o,1)}}
 if(G.path)G.path--;
 if(G.turn%10===0&&G.hp<G.mhp){G.hp++}
 // monsters
 const dm=dist(G.x,G.y);
 for(const o of G.mobs.slice()){if(G.dead)break;if(!G.mobs.includes(o))continue;const d=M(o);if(o.stun>0){o.stun--;continue}
  o.acc+=d.spd;while(o.acc>=1&&!G.dead){o.acc-=1;mobStep(o,d,dm)}}

 if(G.F.king&&G.turn%22===0&&G.mobs.length<9){const c=farCell();addMob("goblin",c.x,c.y);say(pick(["The Goblin King snaps his fingers. A goblin falls out of the ceiling.","'Someone deal with her,' says the Goblin King. A goblin sighs and gets up."]))}

}
function mobStep(o,d,dm){
 const ad=Math.abs(o.x-G.x)+Math.abs(o.y-G.y);
 if(d.straight){const nx=o.x+o.dir[0],ny=o.y+o.dir[1];if(nx===G.x&&ny===G.y){playerHit(d.dmg,pick(d.hit));o.dir=[-o.dir[0],-o.dir[1]];return}
  if(wall(nx,ny)||occ(nx,ny)){const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>!wall(o.x+dx,o.y+dy)&&!occ(o.x+dx,o.y+dy));if(opts.length)o.dir=pick(opts);return}o.x=nx;o.y=ny;return}

 if(ad===1){if(o.hitT===G.turns)return;o.hitT=G.turns;playerHit(d.dmg,pick(d.hit));if(d.steal&&G.items.length&&R()<.4){const k=G.items.splice(ri(G.items.length),1)[0];say(`It grabs your ${ITEMS[k].n.toLowerCase()} and adds it to the pile on its back.`)}return}
 if(sees&&d.ranged&&ad<=d.ranged&&R()<.45){playerHit(d.rdmg,`The ${d.n} ${d.rname}.`);return}
 let opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:o.x+dx,y:o.y+dy})).filter(c=>!wall(c.x,c.y)&&!occ(c.x,c.y)&&!(c.x===G.x&&c.y===G.y));
 if(G.F.giant&&d.boss)opts=opts.filter(c=>Math.abs(c.x-G.ex.x)+Math.abs(c.y-G.ex.y)<=4);
 if(!opts.length)return;
 if(sees||(dm[o.y][o.x]<6&&R()<.5)){opts.sort((a,b)=>dm[a.y][a.x]-dm[b.y][b.x]);const c=opts[0];if(dm[c.y][c.x]<dm[o.y][o.x]){o.x=c.x;o.y=c.y}}

function shiftHedges(){const m=G.m,W=G.W,H=G.H,changed=[];
 for(let t=0,n=0;t<200&&n<6;t++){const x=1+ri(W-2),y=1+ri(H-2);if(!m[y][x])continue;if((m[y][x-1]===0&&m[y][x+1]===0)||(m[y-1][x]===0&&m[y+1][x]===0)){m[y][x]=0;changed.push([x,y,1]);n++}}
 for(let t=0,n=0;t<200&&n<6;t++){const x=1+ri(W-2),y=1+ri(H-2);if(m[y][x]||occ(x,y)||(x===G.x&&y===G.y)||(x===G.ex.x&&y===G.ex.y)||G.loot.some(l=>l.x===x&&l.y===y))continue;if(Math.abs(x-G.x)+Math.abs(y-G.y)<2)continue;m[y][x]=1;changed.push([x,y,0]);n++}
 const d=dist(G.x,G.y);let ok=d[G.ex.y][G.ex.x]<1e9&&G.mobs.every(o=>d[o.y][o.x]<1e9||M(o).inv)&&G.loot.every(l=>d[l.y][l.x]<1e9)&&G.npcs.every(p=>d[p.y][p.x]<1e9);
 // the guards' doors sit on the exit, so we check the cell beside them

 s.wins=(s.wins||0)+1;s.bestTime=Math.max(s.bestTime||0,G.min);s.best=7;store.set(s);
 const rank=G.min>300?"Ruler of the Labyrinth":G.min>180?"Champion of the Bog":G.min>60?"Friend of Dwarves":"Just in time";
 setTimeout(()=>showCard("You have no power over me",`<p>The Goblin King's face falls. Literally: the glitter slides off it. He shrinks into a white owl and flaps out of a window that wasn't there a moment ago. The castle folds up like a paper hat.</p><p>You're in your bedroom. Your brother is asleep in his cot. In the mirror, Grumble, Boulder and Sir Dashwood wave. You wave back, which you will not be explaining to anybody.</p><p><b>${fmt(G.min)}</b> to spare. ${G.kills} things beaten. ${Object.keys(G.comp).length} of 3 friends made.</p><p style="font-size:18px"><b>${rank}</b></p>`,[{t:"Play again",cls:"glam",f(){newRun()}}]),300)}

// ---------------- Items and friends ----------------
function openItems(){if(busy||G.dead||G.won)return;
 if(!G.items.length){say("Your pockets are empty except for fluff.");return}
 showCard("Your pockets",`<p style="color:var(--mute);font-size:14px">Using something takes a turn.</p>`,G.items.map((k,i)=>({t:ITEMS[k].n,s:ITEMS[k].d,f(){const used=ITEMS[k].use();if(used){G.items.splice(i,1);endTurn()}else render()}})).concat([{t:"Never mind",f(){render()}}]))}
function useComp(k){if(busy||G.dead||G.won||!G.comp[k])return;if(!G.charge[k]){say(`${COMPS[k].n} has done his bit for this floor.`);return}
 G.charge[k]=0;
 if(k==="grumble"){G.path=15;G.seen[G.ex.y][G.ex.x]=1;say(pick(["Grumble sighs and points. 'That way. Then left. No, your other left.'","'Fine,' says Grumble. 'Follow the dotted line, if you can manage that.'"]))}
 if(k==="boulder"){const vs=G.mobs.filter(o=>G.vis[o.y][o.x]);say("Boulder lets out a long, low howl. Rocks tumble out of the walls and the floor and everywhere.");vs.forEach(o=>{o.stun=3;hurt(o,2)});G.fx.push({rocks:1,a:0});if(!vs.length)say("The rocks look around, find nothing to squash, and wander off again.")}
 if(k==="dashwood"){const o=nearestMob();if(!o){G.charge[k]=1;say("'Show me the foe!' says Sir Dashwood, but there isn't one.");return}say(`Sir Dashwood charges the ${M(o).n} at full gallop. The sheepdog does its best.`);hurt(o,4)}
 endTurn()}

// ---------------- Drawing ----------------
const cv=$("cv"),g=cv.getContext("2d");let CS=24,OX=0,OY=0;
function size(){const b=$("board"),bw=b.clientWidth,bh=b.clientHeight;const W=G?G.W:17,H=G?G.H:17;CS=Math.max(10,Math.floor(Math.min(bw/W,bh/H)));const dpr=devicePixelRatio||1;cv.width=W*CS*dpr;cv.height=H*CS*dpr;cv.style.width=W*CS+"px";cv.style.height=H*CS+"px";g.setTransform(dpr,0,0,dpr,0,0);render()}
function render(){if(!G)return;
 if(cv.style.width!==G.W*CS+"px"){size();return}
 const F=G.F,c=CS;g.clearRect(0,0,G.W*c,G.H*c);
 const path=G.path?pathTo(G.x,G.y,G.ex.x,G.ex.y,0):null;
 for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++){const s=G.seen[y][x],v=G.vis[y][x];
  if(!s){g.fillStyle="#d9d1c2";g.fillRect(x*c,y*c,c,c);continue}
  if(G.m[y][x]){g.fillStyle=F.wall;g.fillRect(x*c,y*c,c,c);g.fillStyle=F.wall2;g.fillRect(x*c,y*c+c*.72,c,c*.28);
   if(F.k==="hedge"){g.fillStyle="rgba(255,255,255,.12)";g.beginPath();g.arc(x*c+c*.3,y*c+c*.3,c*.16,0,7);g.arc(x*c+c*.7,y*c+c*.45,c*.12,0,7);g.fill()}
   else{g.strokeStyle="rgba(0,0,0,.12)";g.lineWidth=1;g.strokeRect(x*c+.5,y*c+.5,c-1,c*.72)}}
  else{g.fillStyle=F.floor;g.fillRect(x*c,y*c,c,c);if(F.escher&&(x+y)%2){g.fillStyle="rgba(123,79,181,.06)";g.fillRect(x*c,y*c,c,c)}
   if(G.bog&&G.bog[y][x]){g.fillStyle="#9a8a44";g.fillRect(x*c+1,y*c+1,c-2,c-2);g.fillStyle="rgba(255,255,255,.25)";g.beginPath();g.arc(x*c+c*.35,y*c+c*.4,c*.1,0,7);g.arc(x*c+c*.65,y*c+c*.65,c*.07,0,7);g.fill()}}
  if(!v){g.fillStyle="rgba(60,48,74,.16)";g.fillRect(x*c,y*c,c,c)}}
 if(path)path.forEach(p=>{g.fillStyle="rgba(123,79,181,.55)";g.beginPath();g.arc(p.x*c+c/2,p.y*c+c/2,c*.1,0,7);g.fill()});
 // exit
 if(G.seen[G.ex.y][G.ex.x]&&!G.F.guards&&!G.F.king){const x=G.ex.x*c,y=G.ex.y*c;g.fillStyle="#7b4fb5";g.fillRect(x+c*.18,y+c*.12,c*.64,c*.8);g.fillStyle="#f6d77a";g.fillRect(x+c*.26,y+c*.2,c*.48,c*.62);g.fillStyle="#7b4fb5";g.beginPath();g.arc(x+c*.62,y+c*.55,c*.05,0,7);g.fill();
  if(G.mark){g.strokeStyle="#c0392b";g.lineWidth=2;g.strokeRect(x+1,y+1,c-2,c-2)}}
 G.loot.forEach(l=>{if(!G.seen[l.y][l.x])return;const x=l.x*c+c/2,y=l.y*c+c/2;g.fillStyle=l.k==="crystal"?"#bfe3ff":"#d9b45a";g.beginPath();g.arc(x,y,c*.2,0,7);g.fill();g.strokeStyle="#6b5320";g.lineWidth=1;g.stroke();g.fillStyle="#fff";g.beginPath();g.arc(x-c*.06,y-c*.06,c*.05,0,7);g.fill()});
 G.npcs.forEach(n=>{if(!G.seen[n.y][n.x])return;drawNpc(n)});
 G.mobs.forEach(o=>{const loud=o.k==="cleaner"&&Math.abs(o.x-G.x)+Math.abs(o.y-G.y)<=6;if(!G.vis[o.y][o.x]&&!loud)return;if(!G.vis[o.y][o.x])g.globalAlpha=.45;drawMob(o);g.globalAlpha=1});
 drawPlayer();
 // floaters
 G.fx=G.fx.filter(f=>f.a<1);G.fx.forEach(f=>{if(f.rocks)return;g.globalAlpha=1-f.a;g.fillStyle=f.c;g.font=`700 ${Math.round(c*.6)}px -apple-system,system-ui,sans-serif`;g.textAlign="center";g.fillText(f.t,f.x*c+c/2,f.y*c-f.a*c*.8+c*.3);g.globalAlpha=1});
 if(G.fx.length)requestAnimationFrame(()=>{G.fx.forEach(f=>f.a+=.06);render()});
 hud()}
function eyes(x,y,c,col){g.fillStyle="#fff";g.beginPath();g.arc(x-c*.1,y-c*.04,c*.08,0,7);g.arc(x+c*.1,y-c*.04,c*.08,0,7);g.fill();g.fillStyle=col||"#222";g.beginPath();g.arc(x-c*.09,y-c*.03,c*.04,0,7);g.arc(x+c*.11,y-c*.03,c*.04,0,7);g.fill()}
function drawMob(o){const d=M(o),c=CS,x=o.x*c+c/2,y=o.y*c+c/2;g.save();
 if(o.k==="fairy"){g.fillStyle="rgba(255,255,255,.8)";g.beginPath();g.ellipse(x-c*.18,y-c*.12,c*.16,c*.09,-.5,0,7);g.ellipse(x+c*.18,y-c*.12,c*.16,c*.09,.5,0,7);g.fill();g.fillStyle=d.col;g.beginPath();g.arc(x,y,c*.17,0,7);g.fill();eyes(x,y,c*.7,"#222")}
 else if(o.k==="cleaner"){g.translate(x,y);g.rotate(G.turns*.6);g.fillStyle=d.col;g.beginPath();g.arc(0,0,c*.4,0,7);g.fill();g.strokeStyle="#4b4f57";g.lineWidth=2;for(let i=0;i<6;i++){g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(i)*c*.4,Math.sin(i)*c*.4);g.stroke()}}
 else if(o.k==="giant"){g.fillStyle=d.col;g.fillRect(x-c*.46,y-c*.46,c*.92,c*.92);g.fillStyle="#6c727c";g.fillRect(x-c*.46,y+c*.2,c*.92,c*.26);g.fillStyle="#ffcf4a";g.beginPath();g.arc(x,y-c*.12,c*.14,0,7);g.fill();g.fillStyle="#222";g.beginPath();g.arc(x,y-c*.12,c*.06,0,7);g.fill()}
 else if(o.k==="king"){g.fillStyle="#efe7ff";for(let i=0;i<7;i++){g.beginPath();g.arc(x+Math.cos(i*.9+3.6)*c*.26,y-c*.12+Math.sin(i*.9+3.6)*c*.22,c*.13,0,7);g.fill()}g.fillStyle=d.col;g.beginPath();g.moveTo(x-c*.3,y+c*.45);g.lineTo(x+c*.3,y+c*.45);g.lineTo(x,y);g.fill();g.fillStyle="#f6e2d0";g.beginPath();g.arc(x,y-c*.08,c*.18,0,7);g.fill();g.fillStyle="#3b2a5a";g.fillRect(x-c*.12,y-c*.14,c*.08,c*.03);g.fillRect(x+c*.04,y-c*.14,c*.08,c*.03)}
 else{const r=o.k==="guard"?c*.36:c*.32;g.fillStyle=d.col;g.beginPath();g.moveTo(x-r*1.3,y-r*.5);g.lineTo(x-r*.6,y-r*.1);g.lineTo(x+r*.6,y-r*.1);g.lineTo(x+r*1.3,y-r*.5);g.lineTo(x+r*.7,y+r*.3);g.lineTo(x-r*.7,y+r*.3);g.fill();g.beginPath();g.arc(x,y+r*.1,r*.85,0,7);g.fill();
  if(o.k==="guard"){g.fillStyle="#8c8f96";g.beginPath();g.arc(x,y-r*.25,r*.75,Math.PI,0);g.fill()}
  if(o.k==="firey"){g.fillStyle="#ffd34a";g.beginPath();g.arc(x+r*.5,y-r*.6,r*.4,0,7);g.fill()}
  if(o.k==="junk"){g.fillStyle="#6f5b44";g.fillRect(x-r*.6,y-r*1.1,r*1.2,r*.7);g.fillStyle="#c9b28d";g.fillRect(x-r*.3,y-r*1.3,r*.5,r*.4)}
  eyes(x,y+r*.1,c,"#b00")}
 if(o.stun){g.fillStyle="#7b4fb5";g.font=`700 ${Math.round(c*.38)}px sans-serif`;g.textAlign="center";g.fillText("zz",x+c*.28,y-c*.28)}
 if(o.hp<o.mhp&&!d.inv&&!d.king){g.fillStyle="#c0392b";g.fillRect(o.x*c+2,o.y*c+1,(c-4)*Math.max(0,o.hp)/o.mhp,3)}
 g.restore()}
function drawNpc(n){const c=CS,x=n.x*c+c/2,y=n.y*c+c/2;
 if(n.door){g.fillStyle="#7a4d2a";g.fillRect(n.x*c+c*.08,n.y*c+c*.1,c*.38,c*.85);g.fillRect(n.x*c+c*.54,n.y*c+c*.1,c*.38,c*.85);g.fillStyle="#d8a656";g.fillRect(n.x*c+c*.14,n.y*c+c*.4,c*.26,c*.26);g.fillRect(n.x*c+c*.6,n.y*c+c*.4,c*.26,c*.26);return}
 if(n.baby){g.fillStyle="#fff";g.beginPath();g.arc(x,y+c*.12,c*.26,0,7);g.fill();g.strokeStyle="#c9a3ff";g.lineWidth=2;g.stroke();g.fillStyle="#f2c2a0";g.beginPath();g.arc(x,y-c*.12,c*.18,0,7);g.fill();eyes(x,y-c*.12,c*.6);return}
 g.fillStyle=n.col;g.beginPath();g.arc(x,y,n.big?c*.44:c*.32,0,7);g.fill();g.strokeStyle="#7b4fb5";g.lineWidth=2;g.stroke();
 if(n.id==="grumble"){g.fillStyle="#e7dcc8";g.beginPath();g.moveTo(x-c*.2,y+c*.05);g.lineTo(x+c*.2,y+c*.05);g.lineTo(x,y+c*.34);g.fill()}
 if(n.id==="wise"){g.fillStyle="#6e5a3c";g.beginPath();g.moveTo(x-c*.25,y-c*.15);g.lineTo(x+c*.25,y-c*.15);g.lineTo(x+c*.05,y-c*.48);g.fill()}
 if(n.id==="dashwood"){g.fillStyle="#c9ced6";g.fillRect(x-c*.2,y-c*.36,c*.4,c*.16)}
 eyes(x,y-c*.04,c,"#222")}
function drawPlayer(){const c=CS,x=G.x*c+c/2,y=G.y*c+c/2;
 g.fillStyle="#f5f2ea";g.beginPath();g.moveTo(x-c*.3,y+c*.44);g.lineTo(x+c*.3,y+c*.44);g.lineTo(x+c*.16,y);g.lineTo(x-c*.16,y);g.fill();g.strokeStyle="#7b4fb5";g.lineWidth=1.5;g.stroke();
 g.fillStyle="#3a2a1e";g.beginPath();g.arc(x,y-c*.16,c*.24,0,7);g.fill();g.fillStyle="#f3d2b8";g.beginPath();g.arc(x,y-c*.12,c*.16,0,7);g.fill();
 g.fillStyle="#2a2233";g.beginPath();g.arc(x-c*.06,y-c*.13,c*.025,0,7);g.arc(x+c*.06,y-c*.13,c*.025,0,7);g.fill();
 if(G.F.escher&&G.rot){g.save();g.translate(x,y);g.rotate(G.rot*Math.PI/2);g.fillStyle="#7b4fb5";g.beginPath();g.moveTo(0,-c*.62);g.lineTo(c*.12,-c*.46);g.lineTo(-c*.12,-c*.46);g.fill();g.restore()}}
function hud(){$("fname").textContent=`${G.f+1}/7 · ${G.F.n}`;const ck=$("clock");ck.textContent=fmt(G.min)+" left";ck.classList.toggle("low",G.min<=90);
 const hp=$("hp");hp.textContent=`HP ${G.hp}/${G.mhp}`;hp.classList.toggle("low",G.hp<=4);$("atk").textContent=`Hit ${G.lo}-${G.hi}`;
 const a=$("acts");const comps=Object.keys(G.comp);
 a.innerHTML=`<button class="btn" id="itemsBtn">Pockets (${G.items.length})</button>`+comps.map((k,i)=>`<button class="btn ${G.charge[k]?"glam":""}" data-c="${k}" ${G.charge[k]?"":"disabled"}>${COMPS[k].skill}<br><small style="font-weight:400">${COMPS[k].n} · ${i+1}</small></button>`).join("");
 $("itemsBtn").onclick=openItems;a.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>useComp(b.dataset.c));
 $("comp").textContent=comps.length?"With you: "+comps.map(k=>COMPS[k].n+", "+COMPS[k].title).join("; "):"You're on your own. For now."}

// ---------------- Input ----------------
const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],k:[0,-1],j:[0,1],h:[-1,0],l:[1,0]," ":[0,0],".":[0,0]};
addEventListener("keydown",e=>{if(!G)return;
 if($("modal").classList.contains("on")){const bs=[...$("card").querySelectorAll(".o")];const n=parseInt(e.key);if(n>=1&&n<=bs.length){bs[n-1].click();e.preventDefault()}else if(e.key==="Enter"&&bs.length===1){bs[0].click();e.preventDefault()}return}
 const k=KEYS[e.key]||KEYS[e.key.toLowerCase()];if(k){e.preventDefault();stopWalk();act(k[0],k[1]);return}
 if(e.key==="i"||e.key==="I"){openItems();return}
 const n=parseInt(e.key);if(n>=1&&n<=3){const c=Object.keys(G.comp)[n-1];if(c)useComp(c)}});
document.querySelectorAll("#pad [data-d]").forEach(b=>{b.onclick=()=>{stopWalk();const [dx,dy]=b.dataset.d.split(",").map(Number);act(dx,dy)}});
function stopWalk(){clearTimeout(walkTimer);walkTimer=0}
let sx=0,sy=0,st=0;
cv.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;st=Date.now()});
cv.addEventListener("pointerup",e=>{if(!G||busy)return;const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.hypot(dx,dy)>28&&Date.now()-st<600){stopWalk();if(Math.abs(dx)>Math.abs(dy))act(Math.sign(dx),0);else act(0,Math.sign(dy));return}
 const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/CS),y=Math.floor((e.clientY-r.top)/CS);tapTo(x,y)});
function tapTo(x,y){stopWalk();if(x<0||y<0||x>=G.W||y>=G.H)return;
 if(x===G.x&&y===G.y){act(0,0,1);return}
 const adj=Math.abs(x-G.x)+Math.abs(y-G.y)===1;
 if(G.F.escher&&!adj){say("The stairs don't go where you point. One step at a time.");return}
 if(adj){act(x-G.x,y-G.y,1);return}
 if(!G.seen[y][x]||wall(x,y))return;
 const p=pathTo(G.x,G.y,x,y,1);if(!p||!p.length)return;
 const visMobs=()=>G.mobs.filter(o=>G.vis[o.y][o.x]&&!M(o).inv).length;const start=visMobs();
 const step=()=>{if(!p.length||busy||G.dead||G.won)return;const n=p.shift();const ok=act(n.x-G.x,n.y-G.y,1);if(!ok)return;if(visMobs()>start){say("You stop. Something's coming.");return}walkTimer=setTimeout(step,70)};step()}
// landing on the exit
const _end=endTurn;
endTurn=function(){_end();if(!G.dead&&!G.won&&!busy&&G.x===G.ex.x&&G.y===G.ex.y&&!G.F.guards&&!G.F.king)exitFloor()};
$("menuBtn").onclick=()=>{if(busy&&!G.dead&&!G.won)return;const s=store.get();showCard("Not That Labyrinth",`<p>A rogue-ish parody. Seven parts of the labyrinth, thirteen hours, one baby brother. Every step costs a minute. Bump to fight, bump people to talk. Friends you make help once each floor.</p><p style="color:var(--mute);font-size:14px">Runs ${s.runs||0} · Wins ${s.wins||0} · Furthest part ${s.best||0} of 7${s.bestTime?` · Most time to spare ${fmt(s.bestTime)}`:""}${s.yes?` · Said yes ${s.yes}`:""}</p>`,[{t:"Keep going",f(){render()}},{t:"Start a new run",f(){newRun()}}])};
addEventListener("resize",size);
newRun();size();
</script>
</body>
</html>
