<title>Not That Labyrinth</title>
<style>
:root{--bg:#f4ecdc;--ink:#2a2233;--glam:#7b4fb5;--box:#1d1a5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{position:fixed;inset:0}
#app{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 6px) calc(env(safe-area-inset-bottom) + 4px) calc(env(safe-area-inset-left) + 6px)}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#wrap{position:relative}
canvas{display:block;border-radius:6px;box-shadow:0 0 0 3px #2a2233,0 10px 30px rgba(42,34,51,.3);background:#000}
#dlg{position:absolute;left:3%;right:3%;bottom:3%;background:var(--box);border:3px solid #fff;box-shadow:0 0 0 3px var(--box);border-radius:5px;color:#fff;padding:9px 12px 10px;font:700 clamp(12px,3.4vmin,18px)/1.38 ui-monospace,Menlo,Consolas,monospace;display:none;min-height:30%}
#dlg.top{bottom:auto;top:19%}
#dlg .who{color:#ffd76a;margin-bottom:3px;letter-spacing:.04em}
#dlg .ch{display:flex;flex-direction:column;gap:5px;margin-top:8px}
#dlg .ch button{font:inherit;text-align:left;background:rgba(255,255,255,.08);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:4px;padding:5px 8px;cursor:pointer}
#dlg .ch button.sel{border-color:#ffd76a;background:rgba(255,215,106,.18)}
#dlg .more{position:absolute;right:10px;bottom:4px;color:#ffd76a;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 35%,#fff8e6,#efe2c8);border-radius:6px;text-align:center;padding:14px}
#title h1{margin:0;font:900 clamp(22px,7vmin,44px)/1 Georgia,serif;letter-spacing:.02em;color:var(--glam);text-shadow:2px 2px 0 #2a2233}
#title p{margin:0;font:italic clamp(12px,3vmin,16px)/1.4 Georgia,serif;color:#5b4d66;max-width:34em}
#title .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.tbtn{font:800 15px -apple-system,system-ui,sans-serif;padding:11px 20px;border-radius:10px;border:none;background:var(--glam);color:#fff;box-shadow:0 4px 0 #4f2f7c;cursor:pointer}
.tbtn.alt{background:#fffaf0;color:var(--ink);box-shadow:0 4px 0 #cbbfa8}
.tbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #4f2f7c}
#title small{color:#8a7c64;font-size:12px}
#keys{font-size:12px;color:#7d7186;padding:6px 0 0;text-align:center}
.touch #keys{display:none}
#pads{display:none;width:100%;max-width:520px;height:168px;align-items:center;justify-content:space-between;padding:4px 14px 2px;flex:0 0 auto}
.touch #pads{display:flex}
#joy{width:142px;height:142px;border-radius:50%;background:rgba(42,34,51,.07);border:2px solid rgba(42,34,51,.16);position:relative;touch-action:none;flex:0 0 auto}
#joy:before,#joy:after{content:"";position:absolute;background:rgba(42,34,51,.12);border-radius:4px}
#joy:before{left:44%;right:44%;top:14%;bottom:14%}#joy:after{top:44%;bottom:44%;left:14%;right:14%}
#knob{position:absolute;width:58px;height:58px;left:50%;top:50%;margin:-29px 0 0 -29px;border-radius:50%;background:#2a2233;opacity:.85;box-shadow:0 3px 0 #000}
#btns{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:8px 12px;align-items:center}
.pb{width:70px;height:70px;border-radius:50%;border:none;font:900 22px -apple-system,system-ui,sans-serif;color:#fff;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.pb small{display:block;font-size:10px;font-weight:700;opacity:.85}
#bA{background:#c0392b;grid-column:2;grid-row:1/3}
#bB{background:#3b6fb6;width:58px;height:58px;font-size:18px}
#bR{background:#b5742f;width:58px;height:58px;font-size:18px;visibility:hidden}
#bR.on{visibility:visible}
#bR.cd{opacity:.4}
#menu{position:absolute;top:2.5%;right:1.5%;width:7%;height:9%;min-width:26px;min-height:22px;border-radius:5px;border:none;background:rgba(0,0,0,.35);color:#fff;font:800 12px system-ui;display:none}
.playing #menu{display:block}
@media (orientation:landscape) and (max-height:520px){
 .touch #pads{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 6px);max-width:none;height:auto;pointer-events:none;padding:0 calc(env(safe-area-inset-right) + 10px) 0 calc(env(safe-area-inset-left) + 10px)}
 .touch #pads>*{pointer-events:auto}
 .touch #joy{opacity:.85}
}
</style>
</head>

// ---------------------------------------------------------------- rooms
function areaRooms(){return AREAS[G.area].rooms}
function roomKey(dx,dy){const [x,y]=G.room.split(",").map(Number);return (x+dx)+","+(y+dy)}
function hasRoom(k){return !!areaRooms()[k]}
function modsKey(){return G.area+":"+G.room}
function buildRoom(){
 const A=AREAS[G.area],src=A.rooms[G.room],mods=G.flags["m:"+modsKey()]||{};
 const t=[],ents=[],items=[];
 for(let y=0;y<ROWS;y++){t.push([]);for(let x=0;x<COLS;x++){let ch=(src[y]||"")[x]||"#";
  if(mods[x+","+y])ch=mods[x+","+y];
  const cx=x*TS+TS/2,cy=y*TS+TS/2;
  if("agqrud".includes(ch)){ents.push(enemy(ch,cx,cy));ch=A.fl}
  else if("$*o".includes(ch)){if(!mods["i"+x+","+y])items.push({k:ch==="$"?"jewel5":ch==="*"?"piece":"crystal",x:cx,y:cy,keep:1,tx:x,ty:y});ch=A.fl}
  else if("HWQOLSJMYt".includes(ch)){const e=npc(ch,cx,cy);if(e)ents.push(e);ch=ch==="S"?"=":A.fl}
  else if(ch==="@")ch=A.fl;
  t[y].push(ch)}}
 ROOM={t,ents,items,proj:[],fx:[],key:G.room,canvas:null,timer:0};
 if(G.area===3&&G.room==="0,-1"&&!G.flags.cleaned)ROOM.cleanerAt=80;
 renderRoom();
}
function tile(tx,ty){if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return null;return ROOM.t[ty][tx]}
function setTile(tx,ty,ch,persist){ROOM.t[ty][tx]=ch;if(persist!==false){const k="m:"+modsKey();(G.flags[k]=G.flags[k]||{})[tx+","+ty]=ch}renderRoom()}
function gateOpen(){const A=AREAS[G.area];return !!(A.gate&&G.flags[A.gate])}
function solidTile(ch){if(ch==="G")return !gateOpen();return SOLID.includes(ch)}
function edgeOpen(side){const d={l:[-1,0],r:[1,0],u:[0,-1],d:[0,1]}[side];if(hasRoom(roomKey(d[0],d[1])))return true;const A=AREAS[G.area];return A.wrap===G.room&&side==="l"}
function blockedAt(x,y,w,h,who){
 const pts=[[x,y],[x+w-1,y],[x,y+h-1],[x+w-1,y+h-1],[x+w/2,y],[x+w/2,y+h-1],[x,y+h/2],[x+w-1,y+h/2]];
 for(const [px,py] of pts){const tx=Math.floor(px/TS),ty=Math.floor(py/TS);
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS){if(who!==P)return true;const side=tx<0?"l":tx>=COLS?"r":ty<0?"u":"d";if(!edgeOpen(side))return true;continue}
  const ch=ROOM.t[ty][tx];if(solidTile(ch))return true}
 if(who===P){for(const e of ROOM.ents){if(!e.solid)continue;if(x<e.x+e.w/2&&x+w>e.x-e.w/2&&y<e.y+e.h/2&&y+h>e.y-e.h/2)return true}}
 return false}
function move(e,dx,dy){
 if(dx){const nx=e.x+dx;if(!blockedAt(nx,e.y,e.w,e.h,e)){e.x=nx;return true}
  for(const n of [1,2,3,4,5,6])for(const s of [-1,1]){if(!blockedAt(nx,e.y+s*n,e.w,e.h,e)&&!blockedAt(e.x,e.y+s,e.w,e.h,e)){e.y+=s;return true}}}
 if(dy){const ny=e.y+dy;if(!blockedAt(e.x,ny,e.w,e.h,e)){e.y=ny;return true}
  for(const n of [1,2,3,4,5,6])for(const s of [-1,1]){if(!blockedAt(e.x+s*n,ny,e.w,e.h,e)&&!blockedAt(e.x+s,e.y,e.w,e.h,e)){e.x+=s;return true}}}
 return false}
function emove(e,dx,dy){let ok=false;const bx=e.x-e.w/2,by=e.y-e.h/2;if(!blockedAt(bx+dx,by,e.w,e.h,e)){e.x+=dx;ok=true}if(!blockedAt(e.x-e.w/2,by+dy,e.w,e.h,e)){e.y+=dy;ok=true}return ok}

// ---------------------------------------------------------------- entities
const EN={a:{k:"fairy",hp:1,dmg:1,w:8,h:8,spd:.75},g:{k:"goblin",hp:2,dmg:1,w:12,h:12,spd:.5},q:{k:"guard",hp:3,dmg:2,w:12,h:12,spd:.45},r:{k:"firey",hp:3,dmg:1,w:12,h:14,spd:.55},u:{k:"hoarder",hp:3,dmg:1,w:12,h:12,spd:.35},d:{k:"dancer",hp:99,dmg:0,w:12,h:14,spd:.4,inv:1}};
function enemy(ch,x,y){const d=EN[ch];const hp=d.hp+(G.area>=7&&!d.inv?1:0);return {type:"en",ch,k:d.k,x,y,w:d.w,h:d.h,hp,max:hp,dmg:d.dmg,spd:d.spd,invul:d.inv,inv:0,kb:null,stun:0,t:ri(120),vx:0,vy:0,col:d.k==="dancer"?ri(4):0}}
function npc(ch,x,y){const f=G.flags;
 const base={type:"npc",x,y,w:14,h:14,solid:1,id:ch};
 if(ch==="H"){if(G.area===3&&f.gate3)return null;return {...base,spr:"hoggle"}}
 if(ch==="W")return {...base,spr:"worm",w:12,h:8,id:G.room==="0,0"?"W1":"W2"};
 if(ch==="Q")return {...base,spr:"guards",w:44,h:16,x:x+8};
 if(ch==="O")return {...base,spr:"wise",h:18};
 if(ch==="L"){if(G.friends.ludo)return null;return {...base,spr:"ludo",w:22,h:22,hang:1}}
 if(ch==="S"){if(G.friends.didy)return null;return {...base,spr:"didy",w:16,h:16}}
 if(ch==="J"){if(f.junk)return null;return {...base,spr:"junklady",w:20,h:20}}
 if(ch==="M"){if(f.gate8)return null;return {type:"boss",k:"giant",x,y:y+8,w:30,h:34,hp:8,max:8,inv:0,state:"walk",t:0,stun:0,solid:1}}
 if(ch==="Y"){if(G.area===6)return {...base,spr:"jareth",h:18,id:"Y6"};return {type:"boss",k:"jareth",x,y,w:12,h:18,hp:10,max:10,inv:0,t:0,stun:0,tp:150}}
 if(ch==="t")return {...base,spr:"toby",w:12,h:12,solid:0,id:"t"};
 return null}
function hurtEnemy(e,n,fromX,fromY){
 if(e.invul){e.kb={vx:Math.sign(e.x-fromX)*2,vy:Math.sign(e.y-fromY)*2,t:8};sfx("bonk");return}
 if(e.inv>0)return;
 if(e.type==="boss"&&e.k==="giant"&&e.state!=="open"&&!e.stun){sfx("bonk");fxText(e.x,e.y-20,"CLANG");return}
 e.hp-=n;e.inv=e.type==="boss"?30:16;sfx("hit");
 const a=Math.atan2(e.y-fromY,e.x-fromX);if(e.type!=="boss")e.kb={vx:Math.cos(a)*3,vy:Math.sin(a)*3,t:9};
 if(e.hp<=0){
  if(e.type==="boss")return bossDown(e);
  ROOM.ents.splice(ROOM.ents.indexOf(e),1);G.kills++;poof(e.x,e.y);
  const r=R();if(r<.22)drop("heart",e.x,e.y);else if(r<.5)drop("jewel",e.x,e.y);else if(r<.58)drop("crystal",e.x,e.y)}}
function drop(k,x,y){ROOM.items.push({k,x,y,t:540})}
function poof(x,y){for(let i=0;i<8;i++){const a=i/8*6.28;ROOM.fx.push({x,y,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4,t:18,c:"#fff"})}}
function fxText(x,y,s,c){ROOM.fx.push({x,y,txt:s,t:50,c:c||"#fff",vy:-.4,vx:0})}
function hurtPlayer(n,fx,fy){
 if(P.inv>0||mode!=="play")return;G.hp-=n;P.inv=70;sfx("hurt");shake=8;
 const a=Math.atan2(P.y+5-fy,P.x+5-fx);P.kb={vx:Math.cos(a)*3,vy:Math.sin(a)*3,t:10};
 if(G.hp<=0){G.hp=0;faint()}}

// ---------------------------------------------------------------- dialogue
function say(pages,done){mode="talk";dlg={pages:pages.filter(Boolean),i:0,shown:0,done,sel:0};if(!dlg.pages.length){dlg.pages=[{n:"",t:"..."}]}showPage()}
function showPage(){dlg.shown=0;dlg.sel=0;const box=$("dlg");box.style.display="block";box.classList.toggle("top",P.y>ROWS*TS*.55);drawDlg()}
function drawDlg(){const pg=dlg.pages[dlg.i];const txt=pg.t.slice(0,Math.floor(dlg.shown));const done=dlg.shown>=pg.t.length;
 let h=(pg.n?`<div class="who">${pg.n}</div>`:"")+`<div>${txt}</div>`;
 if(done&&pg.ch)h+=`<div class="ch">${pg.ch.filter(Boolean).map((c,i)=>`<button data-i="${i}" class="${i===dlg.sel?"sel":""}">${c.t}</button>`).join("")}</div>`;
 else if(done)h+=`<div class="more">&#9660;</div>`;
 const box=$("dlg");box.innerHTML=h;
 box.querySelectorAll(".ch button").forEach(b=>{b.onpointerdown=e=>{e.stopPropagation();e.preventDefault();choose(+b.dataset.i)}})}
function dlgTick(){if(!dlg)return;const pg=dlg.pages[dlg.i];if(dlg.shown<pg.t.length){const before=Math.floor(dlg.shown);dlg.shown=Math.min(pg.t.length,dlg.shown+1.5);if(Math.floor(dlg.shown)!==before){if(before%3===0&&pg.t[before]!==" ")sfx("blip");drawDlg()}}}
function dlgAdvance(){if(!dlg)return;const pg=dlg.pages[dlg.i];
 if(dlg.shown<pg.t.length){dlg.shown=pg.t.length;drawDlg();return}
 if(pg.ch){choose(dlg.sel);return}
 nextPage()}
function choose(i){if(!dlg)return;const pg=dlg.pages[dlg.i];if(!pg.ch||dlg.shown<pg.t.length)return;const ch=pg.ch.filter(Boolean)[i];if(!ch)return;sfx("blip");const r=ch.f?ch.f():null;
 if(!dlg)return;
 if(Array.isArray(r)&&r.length){dlg.pages.splice(dlg.i+1,0,...r.filter(Boolean))}nextPage()}
function nextPage(){dlg.i++;if(dlg.i>=dlg.pages.length){const d=dlg.done;dlg=null;$("dlg").style.display="none";if(mode==="talk")mode="play";if(d)d();return}showPage()}
function dlgMove(d){if(!dlg)return;const pg=dlg.pages[dlg.i];if(!pg.ch||dlg.shown<pg.t.length)return;const n=pg.ch.filter(Boolean).length;dlg.sel=(dlg.sel+d+n)%n;drawDlg()}

const N={s:"Sarah",h:"Hoggle",j:"Jareth",w:"The Worm",l:"Ludo",d:"Sir Didymus",o:"The Wise Man",hat:"The Hat",jl:"The Junk Lady",g:"Guard",n:""};
function talkTo(e){
 const f=G.flags,id=e.id;
 if(id==="H"&&G.area===0){
  if(f.gate1)return say([{n:N.h,t:pick(["Go on, then. It's your funeral. Probably.","Still here? The labyrinth's through the gate. The one I showed you."])}]);
  return say([{n:N.n,t:"A short, cross dwarf is squirting fairies with a spray can. Every so often he counts them."},{n:N.h,t:"Fifty-seven. Fifty-eight. What do you want?"},
   {n:N.s,t:"I have to get into the labyrinth. How do I get in?",ch:[
    {t:"Ask him nicely",f(){return [{n:N.h,t:"Nicely. Nobody's asked me nicely since the Bronze Age."},{n:N.h,t:"You get in through the gate. The one behind me. Wasn't there a minute ago."}]}},
    {t:"Point out he just squirted a fairy",f(){return [{n:N.h,t:"They're pests! What did you expect, a fairy godmother?"},{n:N.h,t:"Look, the gate's behind me. Go and get lost. It's what the labyrinth's for."}]}}]},
   {n:N.n,t:"With a long, rusty groan, a gate opens in a wall you could have sworn was solid."}],()=>{f.gate1=1;renderRoom();sfx("door");shake=6})}
 if(id==="W1"){
  return say([{n:N.w,t:"'Allo."},{n:N.s,t:"Did you say hello?"},{n:N.w,t:"No, I said ''allo', but that's close enough. Come inside and meet the missus.",ch:[
    {t:"Meet the missus",f(){G.min=Math.max(1,G.min-10);G.hp=G.max;G.crystals=Math.min(9,G.crystals+2);return [{n:N.n,t:"The missus is lovely. She makes you tea in a thimble and gives you two crystal balls she found. Ten minutes go by."},{n:N.w,t:"The way through's right in front of you. You're just not looking. Things aren't always what they seem in this place."}]}},
    {t:"I have to find my way through",f(){return [{n:N.w,t:"Well, you're not looking properly. There's an opening right in front of you."},{n:N.s,t:"There isn't. It just goes on and on."},{n:N.w,t:"Walk into the wall at the end, then. Things aren't always what they seem in this place. Don't take anything for granted."}]}}]}],()=>{f.worm=1})}
 if(id==="W2")return say([{n:N.w,t:"Oi! Don't go up there!"},{n:N.s,t:"Up where?"},{n:N.w,t:"Up there. Never go up there. If you'd gone up there, you'd have gone straight to that castle."},{n:N.n,t:"The worm goes back to his tea, very pleased with himself."}]);
 if(id==="Q")return guards();
 if(id==="H"&&G.area===3){
  return say([{n:N.n,t:"Something rattles in the dark. A small figure with a lantern."},{n:N.h,t:"Oh. It's you. This is an oubliette. The labyrinth's full of them."},{n:N.s,t:"What's an oubliette?"},{n:N.h,t:"A place you put people to forget about them. I could get you out. For a price.",ch:[

function update(){
 frame++;
 if(mode==="talk"||mode==="over"){dlgTick();return}
 if(mode==="fade"){trans.fade++;if(trans.fade===30)startArea(trans.to);return}
 if(mode!=="play"||paused)return;
 if(trans){trans.t++;if(trans.t>=trans.n)trans=null;return}
 const A=AREAS[G.area];
 // the clock: a game minute every 50 frames, three times faster in the dream
 if(frame%50===0||(A.dream&&frame%17===0)){G.min--;if(G.min<=0){G.min=0;return timeUp()}if(G.min===60)banner2("One hour left")}
 let ix=(keys.right?1:0)-(keys.left?1:0),iy=(keys.down?1:0)-(keys.up?1:0);
 if(joy.x||joy.y){ix=joy.x;iy=joy.y}
 if(G.rot)for(let i=0;i<G.rot;i++){[ix,iy]=[-iy,ix]}

 else if(P.swing<=0&&(ix||iy)){const l=Math.hypot(ix,iy);move(P,ix/l*spd,0);move(P,0,iy/l*spd);P.moving=1;P.anim++;
  if(Math.abs(ix)>Math.abs(iy))P.dir=ix>0?"r":"l";else if(iy)P.dir=iy>0?"d":"u";
  G.hist.push([P.x,P.y]);if(G.hist.length>80)G.hist.shift();
  const fp=front(9);const ch=tile(Math.floor(fp[0]/TS),Math.floor(fp[1]/TS));if(ch==="["||ch==="]")return doorPick(ch==="["?"l":"r")}
 else P.moving=0;
 if(P.inv>0)P.inv--;
 if(press.a){press.a=0;actA()}
 if(press.b){press.b=0;actB()}
 if(press.r){press.r=0;actR()}
 if(mode!=="play")return;
 if(P.swing>0){P.swing--;swingHits();if(mode!=="play")return}

 const cx=P.x+5,cy=P.y+5,ct=tile(Math.floor(cx/TS),Math.floor(cy/TS));

 for(const it of ROOM.items.slice()){if(it.t&&--it.t<=0){ROOM.items.splice(ROOM.items.indexOf(it),1);continue}if(Math.abs(it.x-cx)<10&&Math.abs(it.y-cy)<10)take(it)}
 for(const e of ROOM.ents.slice()){if(mode!=="play")break;if(!ROOM.ents.includes(e))continue;if(e.type==="en")runEnemy(e);else if(e.type==="boss")runBoss(e)}

 if(G.area===9&&G.room==="0,-1"&&ROOM.ents.some(e=>e.k==="jareth")){ROOM.timer++;if(ROOM.timer%420===0){G.rot=(G.rot+1)%4;shake=10;sfx("boom");banner2(["Up is up again","Up is now left","Up is now down","Up is now right"][G.rot])}}

}
