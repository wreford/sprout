 {id:"simpsons",kind:"trivia",tags:["tv"],title:"Only A True Simpsons Fan Can Get 10/10 On This Springfield Quiz",dek:"D'oh-n't get any wrong. Ten questions about the longest-running American sitcom.",badge:"TV",author:"Fuzz",
  tiers:[[0,"You Live In Shelbyville","Never heard of the place. You might be thinking of a different yellow family."],[4,"Occasional Kwik-E-Mart Customer","You know the basics. Mmm, basics."],[7,"Springfield Local","Strong work. You could probably name everyone at Moe's."],[10,"Professor Frink Level Genius","Ten out of ten. Glavin! You know more about Springfield than its mayor."]],
  qs:[
   {q:"What is the name of the town where the Simpsons live?",a:["Shelbyville","Springfield","Capital City","Ogdenville"],c:1,why:"Springfield. Which state it's in is a long-running joke the show never answers."},
   {q:"Where does Homer work?",a:["The Kwik-E-Mart","Moe's Tavern","The nuclear power plant","The bowling alley"],c:2,why:"The Springfield Nuclear Power Plant, as a safety inspector. Terrifyingly."},
   {q:"Who created The Simpsons?",a:["Seth MacFarlane","Mike Judge","Matt Groening","Trey Parker"],c:2,why:"Matt Groening. He named several of the family after his own relatives."},
   {q:"What is the name of the Simpsons' dog?",a:["Snowball","Santa's Little Helper","Spot","Mr. Teeny"],c:1,why:"Santa's Little Helper, a former racing greyhound adopted in the very first episode."},
   {q:"Which instrument does Lisa play?",a:["Saxophone","Violin","Trumpet","Piano"],c:0,why:"The saxophone. Her solos have been different in almost every opening sequence."},
   {q:"Who is Bart's teacher?",a:["Mrs. Hoover","Mrs. Krabappel","Miss Lovejoy","Mrs. Skinner"],c:1,why:"Edna Krabappel, who has mostly given up on Bart. Fair."},
   {q:"Who is Mr. Burns' loyal assistant?",a:["Lenny","Carl","Smithers","Barney"],c:2,why:"Waylon Smithers, devoted to Mr. Burns beyond all reason."},
   {q:"What are Ned Flanders' sons called?",a:["Rod and Todd","Tod and Rob","Ned Jr and Ted","Rick and Nick"],c:0,why:"Rod and Todd. Hi-diddly-ho."},
   {q:"Which former sidekick of Krusty keeps trying to get revenge on Bart?",a:["Sideshow Mel","Sideshow Bob","Mr. Teeny","Itchy"],c:1,why:"Sideshow Bob, who also cannot walk past a garden rake safely."},
   {q:"In what year did The Simpsons begin as a half-hour series?",a:["1985","1989","1993","1996"],c:1,why:"December 1989. Before that the family appeared in short cartoons on The Tracey Ullman Show."}]},
 {id:"simpchar",kind:"personality",tags:["tv"],title:"Which Simpsons Character Are You, Deep Down?",dek:"Everyone is secretly one member of the household on Evergreen Terrace. Or the nice man next door.",badge:"TV",author:"Fuzz",
  results:{
   homer:{t:"Homer",d:"You run on donuts, naps and enormous good intentions. You make terrible decisions with your whole heart, and somehow it usually works out."},
   marge:{t:"Marge",d:"You hold everything together and nobody notices until you stop. You have the patience of a saint and hair to match."},
   bart:{t:"Bart",d:"Chaos with a heart of gold, buried quite deep. You have never once done your homework and you never will."},
   lisa:{t:"Lisa",d:"The smartest person in every room, and slightly annoyed about it. You care about everything, loudly, on a saxophone."},
   ned:{t:"Ned Flanders",d:"Relentlessly cheerful and kind, even to people who borrow your stuff and never give it back. Okily dokily."}},
  qs:[
   {q:"Pick a snack:",a:[["A pink donut with sprinkles",{homer:3}],["Pork chops for everyone",{marge:3}],["Whatever I can sneak",{bart:3}],["Something vegetarian",{lisa:3}],["Hot cocoa with a little marshmallow",{ned:3}],["A Squishee",{bart:2,homer:1}]]},
   {q:"Your ideal Saturday:",a:[["The couch. All of it.",{homer:3}],["Finally finishing the laundry",{marge:3}],["Skateboarding somewhere I'm not allowed",{bart:3}],["A museum and a protest",{lisa:3}],["Helping a neighbor, whether they asked or not",{ned:3}],["Bowling",{homer:2}]]},
   {q:"Someone is rude to you. You:",a:[["Strangle-yell, briefly",{homer:3}],["Make a little disapproving noise",{marge:3}],["Prank call them",{bart:3}],["Write a strongly worded essay",{lisa:3}],["Forgive them, diddly-instantly",{ned:3}],["Eat my feelings",{homer:2}]]},
   {q:"Pick a catchphrase:",a:[["Woo-hoo!",{homer:3}],["Hmmmm.",{marge:3}],["Eat my shorts!",{bart:3}],["If anyone wants me, I'll be in my room.",{lisa:3}],["Hi-diddly-ho!",{ned:3}],["D'oh!",{homer:2}]]},
   {q:"How do you handle homework?",a:[["Homework? I'm forty.",{homer:2}],["I help everyone else with theirs",{marge:3}],["The dog ate it. The dog eats a lot.",{bart:3}],["Finished it last week. Did extra.",{lisa:3}],["Neatly, with a smile",{ned:3}],["Copied it",{bart:2}]]}]},
 {id:"greys",kind:"trivia",tags:["tv"],title:"How Well Do You Know Grey's Anatomy? Scrub In",dek:"Ten questions about the most dramatic hospital in Seattle. Paging all McFans.",badge:"TV",author:"Fuzz",
  tiers:[[0,"Intern On Day One","You're lost, you're nervous, and you just walked into a supply closet. We've all been there."],[4,"Resident","Solid. You know who's who, mostly, and who's in the on-call room."],[7,"Attending Surgeon","Seriously impressive. Bailey would give you a very small nod."],[10,"Chief Of Surgery","Ten out of ten. You're running the hospital now. Please hire more nurses."]],
  qs:[
   {q:"What was the hospital originally called?",a:["Seattle Grace Hospital","Seattle General","Mercy West","St. Elsewhere"],c:0,why:"Seattle Grace. It later became Seattle Grace Mercy West, and then Grey Sloan Memorial."},
   {q:"Which city is Grey's Anatomy set in?",a:["Boston","Chicago","Seattle","Portland"],c:2,why:"Seattle. It rains a lot. So does everyone."},
   {q:"Who plays Meredith Grey?",a:["Ellen Pompeo","Sandra Oh","Katherine Heigl","Chandra Wilson"],c:0,why:"Ellen Pompeo, who stayed with the show for a very, very long time."},
   {q:"Who created the show?",a:["Shonda Rhimes","J. J. Abrams","Dick Wolf","Ryan Murphy"],c:0,why:"Shonda Rhimes, who also went on to create Scandal."},
   {q:"Which doctor is known as McDreamy?",a:["Mark Sloan","Derek Shepherd","Alex Karev","Owen Hunt"],c:1,why:"Derek Shepherd, the neurosurgeon with the hair."},
   {q:"And who is McSteamy?",a:["Mark Sloan","Preston Burke","George O'Malley","Richard Webber"],c:0,why:"Mark Sloan, the plastic surgeon, usually seen in a towel."},
   {q:"Who plays Cristina Yang?",a:["Sandra Oh","Kate Walsh","Sara Ramirez","Jessica Capshaw"],c:0,why:"Sandra Oh, who later starred in Killing Eve."},
   {q:"What do Meredith and Cristina call each other?",a:["My twin","My person","My rock","My shadow"],c:1,why:"My person. It became one of the show's most famous lines."},
   {q:"The show's title is a pun on what?",a:["A famous anatomy textbook","A painting","A medical TV show","A song"],c:0,why:"Gray's Anatomy, the classic medical textbook first published in 1858."},
   {q:"In what year did Grey's Anatomy first air?",a:["2001","2005","2008","2010"],c:1,why:"2005. It became one of the longest-running prime-time dramas in US history."}]},
 {id:"greysdoc",kind:"personality",tags:["tv"],title:"Which Grey's Anatomy Doctor Are You In A Crisis?",dek:"The pager goes off. Everything is on fire. Who are you?",badge:"TV",author:"Fuzz",
  results:{
   mer:{t:"Meredith Grey",d:"Dark and twisty on the inside, astonishingly brilliant on the outside. Terrible things keep happening to you and you keep turning up to work."},
   cristina:{t:"Cristina Yang",d:"Ruthless, hilarious and the best surgeon in the room. You don't do feelings. You do cardiothoracic surgery."},
   bailey:{t:"Miranda Bailey",d:"Small, mighty and terrifying. Everyone fears you a little and loves you a lot. You are always, always right."},
   derek:{t:"Derek Shepherd",d:"Calm, dreamy and very good with a ferry boat. You say 'it's a beautiful day to save lives' and actually mean it."},
   alex:{t:"Alex Karev",d:"Grumpy on the outside, a total softie with kids on the inside. You pretend not to care. You care the most."}},
  qs:[
   {q:"The pager goes off at 3am. You:",a:[["Sigh dramatically, then go",{mer:3}],["Already there. I sleep here.",{cristina:3}],["Was already awake. Waiting.",{bailey:3}],["Smile, fix my hair, go",{derek:3}],["Grumble, then run faster than anyone",{alex:3}],["Bring tequila. For after.",{mer:1,cristina:1}]]},
   {q:"Pick a hangout:",a:[["The bar across the street",{mer:2,cristina:1}],["The operating room gallery",{cristina:3}],["My office, door closed",{bailey:3}],["A ferry",{derek:3}],["The children's ward",{alex:3}],["A dance party in a hallway",{mer:2,cristina:2}]]},
   {q:"How do you comfort a friend?",a:[["Sit with them on the floor",{mer:3}],["Tell them to stop crying and dance it out",{cristina:3}],["A firm talk and a firmer hug",{bailey:3}],["A speech, ideally in the rain",{derek:3}],["Pretend I'm not comforting them",{alex:3}],["Bring food",{bailey:1,mer:1}]]},
   {q:"Pick a motto:",a:[["Pick me. Choose me. Love me.",{mer:3}],["I'm a surgeon, not a therapist",{cristina:3}],["Don't make me come over there",{bailey:3}],["It's a beautiful day to save lives",{derek:3}],["Whatever",{alex:3}],["You're my person",{mer:1,cristina:2}]]},
   {q:"Your biggest strength:",a:[["Surviving absolutely anything",{mer:3}],["Raw talent",{cristina:3}],["Leadership",{bailey:3}],["Steady hands",{derek:3}],["Loyalty",{alex:3}],["Hair",{derek:2}]]}]},
 {id:"pickles",kind:"trivia",tags:["food"],title:"Are You A Pickle Genius? Prove It In 10 Briny Questions",dek:"Salty, sour, and surprisingly complicated. Let's find out if you know your gherkins.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Freshly Cucumbered","You're not a pickle yet. Give it time and some vinegar."],[4,"Half Sour","You know a bit. You're on your way to being properly pickled."],[7,"Full Dill","Very good. You are briny and wise."],[10,"Pickle Royalty","Ten out of ten. You are the big dill. Long may you brine."]],
  qs:[
   {q:"What vegetable is usually meant when someone says 'pickle'?",a:["Carrot","Cucumber","Zucchini","Onion"],c:1,why:"A cucumber, preserved in brine or vinegar."},
   {q:"What is a small pickled cucumber often called?",a:["A gherkin","A pickleton","A sourling","A cucumbit"],c:0,why:"A gherkin."},
   {q:"What do the French call their tiny, sour pickled gherkins?",a:["Croissants","Cornichons","Canapes","Crudites"],c:1,why:"Cornichons, often served with pate."},
   {q:"Sauerkraut is fermented what?",a:["Cabbage","Lettuce","Beets","Turnip"],c:0,why:"Cabbage. Sauerkraut means 'sour cabbage' in German."},
   {q:"Kimchi, a famous fermented dish, comes from where?",a:["Japan","Korea","Thailand","India"],c:1,why:"Korea. There are hundreds of kinds."},
   {q:"If you're 'in a pickle', you are:",a:["Hungry","In trouble","Very happy","Sleepy"],c:1,why:"In a difficult situation. Shakespeare used the phrase in The Tempest."},
   {q:"What is the salty water used for pickling called?",a:["Brine","Broth","Bisque","Brack"],c:0,why:"Brine."},
   {q:"In Rick and Morty, what does Rick turn himself into?",a:["A pickle","A turnip","A gherkin jar","A sandwich"],c:0,why:"A pickle. Pickle Riiiick!"},
   {q:"What makes fermented pickles sour?",a:["Lemon juice","Lactic acid bacteria","Sugar","Starlight"],c:1,why:"Friendly lactic acid bacteria, which turn sugars into sour acid."},
   {q:"Which herb gives a dill pickle its name and flavor?",a:["Basil","Dill","Mint","Parsley"],c:1,why:"Dill. Not a trick question. We felt you deserved one."}]},
 {id:"gmm",kind:"trivia",tags:["tv"],title:"Only Mythical Beasts Can Get 10/10 On This Good Mythical Morning Quiz",dek:"Let's talk about that. Ten questions about the internet's favorite breakfast show.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Not Yet A Beast","You've maybe seen a thumbnail. Will it quiz? Not today."],[4,"Casual Viewer","You've watched a few. You know who Rhett and Link are, and that's a start."],[7,"Mythical Beast","Strong. You've definitely watched someone eat something terrible at breakfast time."],[10,"Mythical Crew","Ten out of ten. You probably know what's in the Wheel of Mythicality."]],
  qs:[
   {q:"Who hosts Good Mythical Morning?",a:["Rhett and Link","Dan and Phil","Jack and Finn","Smosh"],c:0,why:"Rhett McLaughlin and Link Neal."},
   {q:"When did Rhett and Link first meet?",a:["At university","In first grade","At a job interview","On YouTube"],c:1,why:"In first grade, in North Carolina. They've been best friends ever since."},
   {q:"Which US state are they from?",a:["Texas","North Carolina","Ohio","California"],c:1,why:"North Carolina."},
   {q:"What are fans of the show called?",a:["Mythical Beasts","Morning People","Linkheads","Rhettros"],c:0,why:"Mythical Beasts."},
   {q:"What is the after-show called?",a:["Good Mythical Evening","Good Mythical More","Mythical Bonus","After Breakfast"],c:1,why:"Good Mythical More."},
   {q:"Where can you watch Good Mythical Morning?",a:["YouTube","A movie theater","Radio","Only on DVD"],c:0,why:"YouTube, where it has been running since 2012."},
   {q:"Which kind of recurring taste test asks whether something will work, like a burger made of something odd?",a:["Will It ___?","Can You ___?","Should We ___?","Who Ate ___?"],c:0,why:"'Will It ___?', as in 'Will It Burger?' Often it will not."},
   {q:"In what year did Good Mythical Morning start?",a:["2006","2012","2016","2019"],c:1,why:"2012."},
   {q:"What is the name of their company?",a:["Mythical","Breakfast Inc","Beast Media","Linkerton"],c:0,why:"Mythical, which makes their shows."},
   {q:"What do they usually say right before getting into a topic?",a:["Let's talk about that","Buckle up","Here we go","Hold my spoon"],c:0,why:"'Let's talk about that.'"}]},
 {id:"fastfood90s",kind:"trivia",tags:["nostalgia","food"],title:"Only A True 90s Kid Remembers These Fast Food Classics",dek:"Clear cola. Toy crazes. A talking chihuahua. Ten questions from the golden age of the drive-thru.",badge:"Nostalgia",author:"Fuzz",
  tiers:[[0,"Born After The Supersize","You missed it. Ask a grown-up about the toy that came with the meal."],[4,"Happy Meal Veteran","You remember the toys, if not the food."],[7,"Drive-Thru Legend","Great score. You definitely had a favorite Pogs-and-fries combo."],[10,"Fry Cook Of The Decade","Ten out of ten. You are basically a walking 90s menu board."]],
  qs:[
   {q:"Which 1996 McDonald's burger was aimed at grown-ups and became a famous flop?",a:["The Big N' Tasty","The Arch Deluxe","The McLean","The McPizza"],c:1,why:"The Arch Deluxe. It had a huge ad campaign and very few fans."},
   {q:"What did the Taco Bell chihuahua famously say?",a:["Hasta la vista","Yo quiero Taco Bell","Think outside the bun","Ay caramba"],c:1,why:"'Yo quiero Taco Bell', in ads from 1997."},
   {q:"What did Pizza Hut launch in 1995 that put cheese inside the crust?",a:["Cheesy Bites","Stuffed Crust","Pan Pizza","Crust Melt"],c:1,why:"Stuffed Crust pizza."},
   {q:"Which tiny toys caused a Happy Meal frenzy in 1997?",a:["Teenie Beanie Babies","Polly Pockets","Tamagotchis","Hot Wheels"],c:0,why:"Teenie Beanie Babies. Some people bought meals just for the toys."},
   {q:"What was unusual about Crystal Pepsi, launched in 1992?",a:["It was blue","It was clear","It was hot","It was solid"],c:1,why:"It was completely clear. Nobody quite knew what to make of it."},
   {q:"What color is McDonald's character Grimace?",a:["Green","Purple","Orange","Blue"],c:1,why:"Purple. Nobody knows exactly what he is."},
   {q:"In 1991, Kentucky Fried Chicken officially shortened its name to:",a:["KFC","K-Chicken","Kentucky's","Fried"],c:0,why:"KFC."},
   {q:"Which fast food founder starred in his own company's adverts through the 90s?",a:["Ray Kroc","Dave Thomas of Wendy's","Colonel Sanders","Glen Bell"],c:1,why:"Dave Thomas, who founded Wendy's and named it after his daughter."},
   {q:"What was the biggest McDonald's portion size, dropped in 2004?",a:["Mega","Super Size","Max","Jumbo"],c:1,why:"Super Size, phased out in 2004."},
   {q:"Burger King's 90s club for children was called the:",a:["Kids Club","Crown Club","Whopper Juniors","Royal Gang"],c:0,why:"The Burger King Kids Club, with its own gang of cartoon characters."}]},
 {id:"cartoons80s",kind:"trivia",tags:["nostalgia","tv"],title:"Only An 80s Kid Can Get 10/10 On This Saturday Morning Cartoon Quiz",dek:"Turtles, ducks, cats with swords and a very small blue village. How much do you remember?",badge:"Nostalgia",author:"Fuzz",
  tiers:[[0,"Watched The Adverts Instead","You were up early, but mostly for the cereal."],[4,"Pajama Watcher","You remember the theme tunes, if not every name."],[7,"Saturday Morning Champion","Excellent. Your parents definitely told you to sit further from the TV."],[10,"Cartoon Encyclopedia","Ten out of ten. Cowabunga, and also by the power of Grayskull."]],
  qs:[
   {q:"Who are the Teenage Mutant Ninja Turtles named after?",a:["Roman emperors","Renaissance artists","Greek gods","Famous chefs"],c:1,why:"Renaissance artists: Leonardo, Michelangelo, Donatello and Raphael."},
   {q:"In the 1987 cartoon, what color is Leonardo's mask?",a:["Red","Blue","Orange","Purple"],c:1,why:"Blue. Raphael is red, Michelangelo orange, Donatello purple."},
   {q:"Who is the Turtles' rat sensei?",a:["Splinter","Shredder","Krang","Casey"],c:0,why:"Master Splinter."},
   {q:"In DuckTales, who is the richest duck in the world?",a:["Donald Duck","Scrooge McDuck","Launchpad McQuack","Gyro Gearloose"],c:1,why:"Scrooge McDuck, who swims in a money bin."},
   {q:"What does Inspector Gadget say before using a gadget?",a:["Gadget go!","Go go gadget","Activate!","Wowsers!"],c:1,why:"'Go go gadget', followed by the gadget. It often goes wrong."},
   {q:"What is He-Man's secret identity?",a:["Prince Adam","Lion-O","Skeletor","Duncan"],c:0,why:"Prince Adam of Eternia."},
   {q:"Who leads the ThunderCats?",a:["Panthro","Lion-O","Tygra","Cheetara"],c:1,why:"Lion-O, with the Sword of Omens."},
   {q:"Who is the Smurfs' villain?",a:["Gargamel","Azrael","Momm-Ra","Dr. Claw"],c:0,why:"Gargamel. Azrael is his cat."},
   {q:"Who leads the Autobots?",a:["Megatron","Optimus Prime","Bumblebee","Starscream"],c:1,why:"Optimus Prime."},
   {q:"In Chip 'n Dale Rescue Rangers, which mouse can't resist cheese?",a:["Monterey Jack","Gadget","Zipper","Fat Cat"],c:0,why:"Monterey Jack, who goes into a trance at the smell of cheese."}]},
 {id:"mv90s",kind:"trivia",tags:["nostalgia","music"],title:"Can You Name These Iconic 90s Music Videos?",dek:"Back when everyone stopped what they were doing to watch music television. Ten questions, maximum nostalgia.",badge:"Nostalgia",author:"Fuzz",
  tiers:[[0,"Had The Sound Off","You were there, but you were looking at something else."],[4,"Casual Channel Surfer","You caught the big ones. Nice."],[7,"Total Request Regular","Excellent. You voted for videos. Possibly daily."],[10,"Living Music Television","Ten out of ten. You are basically a VJ. Welcome back from the break."]],
  qs:[
   {q:"Nirvana's 'Smells Like Teen Spirit' video is set at:",a:["A beach party","A high school pep rally","A shopping mall","A space station"],c:1,why:"A very chaotic high school pep rally, with cheerleaders and a janitor."},
   {q:"Who sang '...Baby One More Time' in a school-corridor video in 1998?",a:["Christina Aguilera","Britney Spears","Mandy Moore","Jessica Simpson"],c:1,why:"Britney Spears."},
   {q:"Which group's 'Wannabe' video has them running riot through a grand hotel?",a:["All Saints","Spice Girls","TLC","Destiny's Child"],c:1,why:"The Spice Girls, in 1996."},
   {q:"Michael Jackson's 'Black or White' video is famous for:",a:["Faces morphing into each other","Being filmed underwater","Using only puppets","Being silent"],c:0,why:"A sequence of faces smoothly morphing into one another, which was amazing in 1991."},
   {q:"Weezer's 'Buddy Holly' video puts the band inside which TV show?",a:["Happy Days","Friends","Cheers","The Brady Bunch"],c:0,why:"Happy Days, at Arnold's diner."},
   {q:"The Beastie Boys' 'Sabotage' video parodies:",a:["70s cop shows","Cooking shows","Nature documentaries","Game shows"],c:0,why:"1970s cop shows, complete with fake moustaches."},
   {q:"Who wrote 'Nothing Compares 2 U', the song in Sinead O'Connor's famous close-up video?",a:["Prince","Elton John","Madonna","Bono"],c:0,why:"Prince."},
   {q:"Madonna's 'Vogue' video is filmed in:",a:["Black and white","Neon colors","Slow motion","A jungle"],c:0,why:"Glamorous black and white."},
   {q:"Coolio's 'Gangsta's Paradise' came from which film?",a:["Dangerous Minds","Clueless","Space Jam","Titanic"],c:0,why:"Dangerous Minds, starring Michelle Pfeiffer, who also appears in the video."},
   {q:"What did MTV's TRL, launched in 1998, stand for?",a:["Top Rated List","Total Request Live","Today's Real Loud","Teen Radio Live"],c:1,why:"Total Request Live."}]},
 {id:"fantasy80s",kind:"trivia",tags:["nostalgia","film"],title:"Only A True 80s Kid Can Get 10/10 On This Fantasy Movie Quiz",dek:"Goblin kings, luckdragons, pirate treasure and a very small farmer with a very big quest.",badge:"Nostalgia",author:"Fuzz",
  tiers:[[0,"Lost In The Labyrinth","You took a wrong turn somewhere around the Bog of Eternal Stench."],[4,"Apprentice Adventurer","You remember the good bits. Inconceivable? Not quite."],[7,"Goonie For Life","Excellent. Goonies never say die."],[10,"Ruler Of The Fantasy Realm","Ten out of ten. As you wish."]],
  qs:[
   {q:"In The Goonies, what does Sloth famously shout?",a:["Hey you guys!","Goonies never die!","Over here!","Truffle shuffle!"],c:0,why:"'Hey you guys!'"},
   {q:"Whose pirate treasure are the Goonies hunting?",a:["Captain Hook","One-Eyed Willy","Blackbeard","Long John Silver"],c:1,why:"One-Eyed Willy's."},
   {q:"Which town is The Goonies set in?",a:["Astoria, Oregon","Salem, Massachusetts","Hill Valley","Hawkins, Indiana"],c:0,why:"Astoria, Oregon, where fans still visit the house today."},
   {q:"Who plays Jareth, the Goblin King, in Labyrinth?",a:["David Bowie","Tim Curry","Prince","Mick Jagger"],c:0,why:"David Bowie, who also wrote songs for the film."},
   {q:"In Labyrinth, who does Sarah have to rescue?",a:["Her dog","Her baby brother","Her best friend","Her dad"],c:1,why:"Her baby brother, Toby, who she wished away to the goblins."},
   {q:"How long does Sarah have to solve the Labyrinth?",a:["3 hours","13 hours","24 hours","7 days"],c:1,why:"Thirteen hours."},
   {q:"In Willow, what kind of person is Willow?",a:["A Nelwyn","A Daikini","An elf","A troll"],c:0,why:"A Nelwyn, one of the small folk. He's played by Warwick Davis."},
   {q:"What is the name of the luckdragon in The NeverEnding Story?",a:["Falkor","Smaug","Draco","Morla"],c:0,why:"Falkor."},
   {q:"In The Princess Bride, who says 'You killed my father. Prepare to die'?",a:["Westley","Fezzik","Inigo Montoya","Vizzini"],c:2,why:"Inigo Montoya, who has been practicing that line for twenty years."},
   {q:"In The Princess Bride, what does R.O.U.S. stand for?",a:["Really Old Unhappy Snakes","Rodents Of Unusual Size","Royal Order Of Unicorn Slayers","Rats Of Unknown Species"],c:1,why:"Rodents Of Unusual Size. Westley doesn't think they exist. Then one does."}]},
 {id:"sidekick80s",kind:"personality",tags:["nostalgia","film"],title:"Which 80s Fantasy Movie Sidekick Are You?",dek:"Every hero needs a big friendly sidekick. Find out which one you'd be.",badge:"Nostalgia",author:"Fuzz",
  results:{
   ludo:{t:"Ludo, from Labyrinth",d:"Big, shaggy and gentle, with a secret talent for summoning rocks. You speak in short sentences and every one of them is kind. Ludo friend."},
   falkor:{t:"Falkor, from The NeverEnding Story",d:"A luckdragon who never gives up. You're relentlessly optimistic, a bit fluffy, and you'll fly anyone anywhere if they need it."},
   sloth:{t:"Sloth, from The Goonies",d:"Misunderstood, enormously strong and a big softie. You will swing in to save your friends at the last possible second. Hey you guys!"},
   madmartigan:{t:"Madmartigan, from Willow",d:"A charming rogue with a sword and terrible judgment. You talk big, you're always in trouble, and you come through when it counts."},
   fezzik:{t:"Fezzik, from The Princess Bride",d:"A gentle giant who loves a good rhyme. You are strong, loyal and you'd carry your friends anywhere. Anybody want a peanut?"}},
  qs:[
   {q:"Pick a superpower:",a:[["Calling rocks to help",{ludo:3}],["Flying, and luck",{falkor:3}],["Being very, very strong",{sloth:2,fezzik:1}],["Talking my way out of anything",{madmartigan:3}],["Rhyming on demand",{fezzik:3}],["Never giving up",{falkor:2}]]},
   {q:"Your hero is in trouble. You:",a:[["Roar until help arrives",{ludo:3}],["Swoop in from the clouds",{falkor:3}],["Swing in on a rope at the last second",{sloth:3}],["Grab a sword and improvise",{madmartigan:3}],["Carry them to safety",{fezzik:3}],["Make a joke first",{madmartigan:2}]]},
   {q:"Pick a snack:",a:[["Whatever my friend shares",{ludo:3}],["Something light, I fly a lot",{falkor:3}],["A chocolate bar. A big one.",{sloth:3}],["Anything stolen from a tavern",{madmartigan:3}],["Peanuts",{fezzik:3}],["Soup",{ludo:1,fezzik:1}]]},
   {q:"Where do you live?",a:[["A big, friendly forest",{ludo:3}],["The sky",{falkor:3}],["A basement. It's complicated.",{sloth:3}],["Wherever I'm not wanted",{madmartigan:3}],["Wherever my friends go",{fezzik:3}],["A swamp. Not by choice.",{ludo:1,madmartigan:1}]]},
   {q:"How do people describe you?",a:[["Gentle",{ludo:3}],["Lucky",{falkor:3}],["Misunderstood",{sloth:3}],["Trouble",{madmartigan:3}],["Big-hearted",{fezzik:3}],["Fluffy",{falkor:2,ludo:1}]]}]},
 {id:"toys90s",kind:"trivia",tags:["nostalgia"],title:"Only A True 90s Kid Can Get 10/10 On This Toy Box Quiz",dek:"Digital pets, collectable bears, and an alarming number of things that talked. Remember them?",badge:"Nostalgia",author:"Fuzz",
  tiers:[[0,"Played Outside, Apparently","Fair enough. Somebody had to."],[4,"Christmas List Writer","You remember the big ones. And the lines."],[7,"Toy Box Veteran","Excellent. Your Tamagotchi lived a long, pixelated life."],[10,"Toy Shop Owner","Ten out of ten. You still have the box for everything, don't you."]],
  qs:[
   {q:"Which company made the Tamagotchi?",a:["Nintendo","Bandai","Hasbro","Sega"],c:1,why:"Bandai, in Japan, in 1996."},
   {q:"What language did Furbies speak when you first got them?",a:["Furbish","Furblish","Gibberish","Robotese"],c:0,why:"Furbish, slowly switching to English the more you played."},
   {q:"Who made Beanie Babies?",a:["Ty","Mattel","Lego","Fisher-Price"],c:0,why:"Ty. Collectors went wild for them."},
   {q:"Which toy caused shoppers to fight in the aisles at Christmas 1996?",a:["Tickle Me Elmo","Buzz Lightyear","Furby","Game Boy"],c:0,why:"Tickle Me Elmo. Buzz Lightyear's big shortage came in 1995."},
   {q:"Which game came bundled with the original Game Boy in many countries?",a:["Mario Kart","Tetris","Pokemon","Zelda"],c:1,why:"Tetris."},
   {q:"Pogs were originally:",a:["Milk bottle caps","Bus tokens","Bottle tops from soda","Buttons"],c:0,why:"Milk bottle caps, from Hawaii."},
   {q:"What does a Polly Pocket world fold up into?",a:["A shoe","A compact case","A book","A lunchbox"],c:1,why:"A little compact case, like a make-up compact."},
   {q:"What type of Pokemon is Pikachu?",a:["Fire","Water","Electric","Grass"],c:2,why:"Electric."},
   {q:"Who invented the Super Soaker water gun?",a:["A NASA engineer","A baker","A schoolteacher","A pirate"],c:0,why:"Lonnie Johnson, an engineer who had worked for NASA."},
   {q:"What does a Bop It tell you to do?",a:["Bop it, twist it, pull it","Jump, run, sit","Spin, flip, throw","Sing, clap, dance"],c:0,why:"Bop it, twist it, pull it. Faster and faster."}]},
 {id:"firstcame",kind:"trivia",tags:["nostalgia"],title:"Which Came First? This Nostalgia Timeline Quiz Will Mess With Your Head",dek:"Two things from the past. One came first. Easy? Some of these will surprise you.",badge:"Nostalgia",author:"Fuzz",
  tiers:[[0,"Time Is A Flat Circle","Everything happened at once, for you. That's actually quite peaceful."],[4,"Decent Sense Of History","You get the gist. The 90s are a bit of a blur, which is fair."],[7,"Human Timeline","Very good. You could organize a museum."],[10,"Time Traveler","Ten out of ten. Have you been back? Did you touch anything?"]],
  qs:[
   {q:"Which came first?",a:["The Game Boy","The Tamagotchi"],c:0,why:"The Game Boy, in 1989. Tamagotchi hatched in 1996."},
   {q:"Which came first?",a:["VHS tapes","DVDs"],c:0,why:"VHS, in the 1970s. DVDs arrived in the late 1990s."},
   {q:"Which came first?",a:["Toy Story","Windows 95"],c:1,why:"Windows 95, in August 1995. Toy Story came out that November."},
   {q:"Which came first?",a:["The first episode of Friends","The Lion King"],c:1,why:"The Lion King, in June 1994. Friends started that September."},
   {q:"Which came first?",a:["The first Harry Potter book","The first Pokemon games"],c:1,why:"Pokemon Red and Green, in Japan in early 1996. The first Harry Potter book came out in 1997."},
   {q:"Which came first?",a:["The film Titanic","The Spice Girls' 'Wannabe'"],c:1,why:"'Wannabe', in 1996. Titanic sailed into cinemas in late 1997."},
   {q:"Which came first?",a:["Google","Amazon"],c:1,why:"Amazon, in 1994. Google was founded in 1998."},
   {q:"Which came first?",a:["The PlayStation","The Nintendo 64"],c:0,why:"The PlayStation, in Japan in 1994. The Nintendo 64 arrived in 1996."},
   {q:"Which came first?",a:["The iPod","Shrek"],c:1,why:"Shrek, in May 2001. The iPod came out that October."},
   {q:"Which came first?",a:["The Simpsons as a TV series","The Teenage Mutant Ninja Turtles cartoon"],c:1,why:"The Turtles cartoon, in 1987. The Simpsons series started in December 1989."}]},
 {id:"nightmare",kind:"personality",tags:["dreams"],title:"Which Classic Nightmare Is Living Rent-Free In Your Head?",dek:"Everybody has one. The falling one. The teeth one. The one where you forgot there was an exam. Which is yours?",badge:"Spooky",author:"Fuzz",
  results:{
   fall:{t:"The Falling Dream",d:"You're falling, you're falling, and then you jolt awake and kick the blanket across the room. You like to be in control, and your brain likes to remind you that you aren't."},
   teeth:{t:"The Teeth Falling Out Dream",d:"One wobbles. Then they all go. You care a lot about how things look and what people think, and your brain finds that very funny at 4am."},
   chase:{t:"The Being Chased Dream",d:"Something is behind you. You never see what. You have a to-do list as long as a corridor, and it is gaining on you."},
   exam:{t:"The Surprise Exam Dream",d:"You're in a hall. There's a test. You have never attended this class. You work hard and worry harder, even years after school."},
   pajamas:{t:"The Pajamas At School Dream",d:"Everyone else is dressed. You are in pajamas with ducks on. You're braver than you think, but your brain wants to check."},
   stuck:{t:"The Can't-Run Dream",d:"You run and run and your legs move like they're in syrup. You're patient with everyone except yourself."}},
  qs:[
   {q:"How do you fall asleep?",a:[["Instantly, like a dropped phone",{fall:3}],["After checking my teeth in the mirror",{teeth:3}],["Thinking about everything I didn't do today",{chase:3}],["Replaying old conversations",{exam:3}],["In my most embarrassing pajamas",{pajamas:3}],["Slowly. Very slowly.",{stuck:3}]]},
   {q:"Pick a scary sound:",a:[["The wind, from very high up",{fall:3}],["A crunch",{teeth:3}],["Footsteps that match yours",{chase:3}],["A pen being clicked in silence",{exam:3}],["Everyone laughing at once",{pajamas:3}],["Your own heartbeat",{stuck:3}]]},
   {q:"Your worst Monday morning:",a:[["Tripping on the stairs",{fall:3}],["Biting into something too hard",{teeth:3}],["Running for a bus that won't stop",{chase:2,stuck:1}],["Realizing there was homework",{exam:3}],["Odd socks, and everyone noticing",{pajamas:3}],["Alarm goes off. Body says no.",{stuck:3}]]},
   {q:"Pick a hiding place:",a:[["Somewhere low to the ground",{fall:2}],["Behind a closed mouth",{teeth:2}],["Anywhere, as long as it has a lock",{chase:3}],["The library",{exam:2}],["Under a big coat",{pajamas:3}],["I can't move, so here I am",{stuck:3}]]},
   {q:"When you wake from a bad dream, you:",a:[["Grab the edge of the bed",{fall:3}],["Check my teeth with my tongue",{teeth:3}],["Look at the door",{chase:3}],["Check what day it is",{exam:3}],["Look down at what I'm wearing",{pajamas:3}],["Wiggle my toes to make sure",{stuck:3}]]}]},
 {id:"dreamfacts",kind:"trivia",tags:["dreams"],title:"How Much Do You Know About Dreams? A Quiz For Night Owls",dek:"Sleep is strange and dreams are stranger. Ten real questions from the science of the night.",badge:"Spooky",author:"Fuzz",
  tiers:[[0,"Sleepwalker","You've slept through most of this. Which, to be fair, is the point of sleep."],[4,"Light Sleeper","You know the basics of the night shift."],[7,"Dream Scientist","Very impressive. You could run a sleep lab, or at least a good sleepover."],[10,"Master Of Dreams","Ten out of ten. Are you awake right now? Check your hands."]],
  qs:[
   {q:"During which stage of sleep do we have our most vivid dreams?",a:["REM sleep","Deep sleep","Light sleep","Yawning"],c:0,why:"REM sleep."},
   {q:"What does REM stand for?",a:["Really Exciting Memories","Rapid Eye Movement","Restful Evening Mode","Resting Energy Mode"],c:1,why:"Rapid Eye Movement. Your eyes dart about under your eyelids."},
   {q:"A dream where you know you're dreaming is called:",a:["A lucid dream","A loop dream","A clear dream","A daydream"],c:0,why:"A lucid dream. Some people learn to steer them."},
   {q:"That sudden jolt, like falling, just as you drift off is called:",a:["A hypnic jerk","A sleep hiccup","A bed bump","A dream drop"],c:0,why:"A hypnic jerk. It's very common and harmless."},
   {q:"Waking up but briefly being unable to move is called:",a:["Sleep paralysis","Bed freeze","Night lock","Dream lag"],c:0,why:"Sleep paralysis. It can feel scary, but it passes."},
   {q:"What is the study of dreams called?",a:["Oneirology","Dreamology","Somnography","Noctology"],c:0,why:"Oneirology, from the Greek word for dream."},
   {q:"Who wrote the famous book The Interpretation of Dreams?",a:["Sigmund Freud","Charles Darwin","Albert Einstein","Isaac Newton"],c:0,why:"Sigmund Freud, published at the turn of the 20th century."},
   {q:"Who painted 'The Nightmare', with a goblin sitting on a sleeper?",a:["Henry Fuseli","Vincent van Gogh","Claude Monet","Leonardo da Vinci"],c:0,why:"Henry Fuseli, in 1781. It's one of the most famous spooky paintings ever."},
   {q:"Do people who were born blind dream?",a:["Yes, with sounds, touch and smells","No, never","Only in color","Only about music"],c:0,why:"Yes. Their dreams are full of sound, touch, smell and feelings."},
   {q:"When do most people forget their dreams?",a:["Within minutes of waking","After a week","Never","Only on Tuesdays"],c:0,why:"Usually within minutes of waking. Write them down fast."}]},
 {id:"eatit",kind:"personality",tags:["food"],title:"Would You Eat It? Rate These Cursed Food Combos And We'll Reveal Your Stomach Type",dek:"Some of these are delicious. Some of these are crimes. Your answers say everything about your insides.",badge:"Gross",author:"Fuzz",
  results:{
   iron:{t:"The Iron Stomach",d:"You have eaten a gas station burrito at 2am and felt fine. Science cannot explain you. Restaurants fear you. Buffets close early when you arrive."},
   picky:{t:"The Picky Eater",d:"You like four foods and none of them are touching. You have sent back a plate because the sauce was 'looking at you'. Valid."},
   raccoon:{t:"The Raccoon",d:"If it's in a dumpster, a lunchbox or someone else's fridge, it's fair game. You eat cold pizza off the box lid and you'd do it again."},
   critic:{t:"The Food Critic",d:"You'll try anything once, then describe it for twenty minutes. 'The pickle-chocolate pairing is bold but confused.' Nobody asked. Everyone listened."},
   dare:{t:"The Dare Machine",d:"You don't actually like any of these. You just can't say no to a dare. Your friends have filmed you eating things that should not be eaten."}},
  qs:[
   {q:"Pickles dipped in chocolate:",a:[["Yes, delicious",{iron:2,critic:1}],["Only on a dare",{dare:3}],["Absolutely not",{picky:3}],["Already have, twice",{raccoon:3}],["Bold, but confused",{critic:3}],["Is the chocolate also a pickle?",{dare:1,iron:1}]]},
   {q:"Cold pizza that's been in the car since Saturday:",a:[["Breakfast",{raccoon:3}],["If I'm dared",{dare:3}],["Throw it out, then throw the car out",{picky:3}],["Microwave it and rate the crust",{critic:3}],["Yes, and the box",{iron:3}],["Depends on the topping",{critic:1,raccoon:1}]]},
   {q:"Mayonnaise on vanilla ice cream:",a:[["Why not",{iron:3}],["Film me doing it",{dare:3}],["I'm leaving",{picky:3}],["It's basically custard. Fine.",{critic:3}],["I'd lick the spoon",{raccoon:3}],["Only if it's in the dark",{dare:1,picky:1}]]},
   {q:"A hot dog from a gas station roller that's been spinning since Tuesday:",a:[["The spinning is part of the flavor",{iron:3}],["Ten bucks says I will",{dare:3}],["Not even for a million dollars",{picky:3}],["Rich, rotating, slightly tragic",{critic:3}],["I'll take two and the bun from the floor",{raccoon:3}],["I'll just smell it",{picky:1,critic:1}]]},
   {q:"Pickle juice, straight from the jar:",a:[["It's a sports drink",{iron:3}],["Chug it on camera",{dare:3}],["I'd rather drink pond water",{picky:3}],["Refreshing, briny, aggressive",{critic:3}],["Already did, it was the last thing in the fridge",{raccoon:3}],["Only if it's cold",{iron:1,critic:1}]]},
   {q:"Peanut butter and sardine sandwich:",a:[["Protein!",{iron:3}],["Dare accepted",{dare:3}],["That's a war crime",{picky:3}],["Salty, nutty, deeply confusing",{critic:3}],["I'll eat whatever's left of it",{raccoon:3}],["Can it be smooth peanut butter at least",{picky:1,dare:1}]]},
   {q:"A french fry you found under the car seat:",a:[["Seasoned by time",{raccoon:3}],["Somebody dare me",{dare:3}],["I'm calling the police",{picky:3}],["Vintage. Crunchy. A 6 out of 10.",{critic:3}],["Yes, and I'll look for more",{iron:2,raccoon:1}],["How old is it",{critic:1,picky:1}]]}]},
 {id:"condiment",kind:"personality",tags:["food"],title:"Which Condiment Is Your Soulmate?",dek:"There's one sauce out there that truly gets you. Answer six questions and we'll introduce you.",badge:"Food",author:"Fuzz",
  results:{
   ketchup:{t:"Ketchup",d:"Reliable, classic, a little sweet. You go with everything and everyone likes you, even if food snobs pretend they don't."},
   mustard:{t:"Mustard",d:"Sharp, tangy and absolutely not for everyone. The people who love you really, really love you."},
   mayo:{t:"Mayo",d:"Smooth, controversial and secretly in everything. Half the internet hates you. The other half is lying."},
   ranch:{t:"Ranch",d:"The life of every party. You'll go on pizza, wings, fries and, if nobody's looking, directly into your mouth."},
   hot:{t:"Hot Sauce",d:"Dramatic, fiery and always a little too much. You make everything more exciting and slightly painful."},
   pickle:{t:"Pickle Juice",d:"Technically not a condiment. You showed up anyway. Weird, salty, and somehow everyone's favorite surprise."}},
  qs:[
   {q:"Pick a fry:",a:[["Classic shoestring",{ketchup:3}],["Waffle fry",{mustard:2,ranch:1}],["Crinkle cut, soggy",{mayo:3}],["Curly fry with seasoning",{ranch:3}],["Spicy fries, extra spicy",{hot:3}],["A pickle spear, which is a fry now",{pickle:3}]]},
   {q:"How do you act at a party?",a:[["Friendly with everyone",{ketchup:3}],["Strong opinions near the snacks",{mustard:3}],["Quietly in everything",{mayo:3}],["Loudest one there",{ranch:3}],["Starting drama",{hot:3}],["Standing by the fridge",{pickle:3}]]},
   {q:"Pick a color:",a:[["Red, classic",{ketchup:3}],["Yellow, bold",{mustard:3}],["White, smooth",{mayo:3}],["White with green flecks",{ranch:3}],["Orange-red, dangerous",{hot:3}],["Murky green",{pickle:3}]]},
   {q:"Your toxic trait:",a:[["I'm on everything",{ketchup:2}],["Too much, too fast",{mustard:2,hot:1}],["People hate me for no reason",{mayo:3}],["I'll drown your salad",{ranch:3}],["I make people cry",{hot:3}],["I'm not technically allowed here",{pickle:3}]]},
   {q:"Best food to put you on:",a:[["Burgers",{ketchup:3}],["Pretzels",{mustard:3}],["Sandwiches",{mayo:3}],["Pizza",{ranch:3}],["Tacos",{hot:3}],["Popcorn, apparently",{pickle:3}]]},
   {q:"How do you leave a room?",a:[["Politely",{ketchup:2}],["With a sharp comment",{mustard:2}],["Nobody notices",{mayo:2}],["Leaving a little bit of me on everyone",{ranch:2}],["On fire",{hot:2}],["Dripping",{pickle:2}]]}]},
 {id:"diner",kind:"personality",tags:["food","dreams"],title:"Order At A Sketchy Midnight Diner And We'll Tell You How You'd Survive A Horror Movie",dek:"It's 2am. The neon sign is flickering. The waitress has been staring at you for a while. Order carefully.",badge:"Spooky",author:"Fuzz",
  results:{
   last:{t:"The Final Survivor",d:"You noticed the creepy thing in the window first, packed a flashlight, and never once said 'hello?' into a dark room. Credits roll on your face."},
   basement:{t:"Goes Into The Basement To Check",d:"You heard a noise, you grabbed a candle, and you went downstairs alone. Brave. Not smart. Brave."},
   back:{t:"Says 'I'll Be Right Back'",d:"You meant it. You really did. Nobody saw you again, but the fries you ordered are still on the table."},
   trip:{t:"Trips While Running",d:"Flat ground. No obstacles. You still tripped. The monster was walking slowly the whole time and still caught up."},
   monster:{t:"Secretly The Monster",d:"Plot twist: it was you all along. That explains the extra ketchup and the way the waitress was looking at you."}},
  qs:[
   {q:"Pick a booth:",a:[["Back corner, facing the door",{last:3}],["Next to the door marked STAFF ONLY",{basement:3}],["By the bathroom",{back:3}],["Right in the middle of the floor",{trip:3}],["The one that's always reserved",{monster:3}],["Any booth with a window",{last:1,trip:1}]]},
   {q:"What do you order?",a:[["Coffee, black. I need to stay alert.",{last:3}],["Today's special. The waitress won't say what it is.",{basement:3}],["Fries. I'll be right back for them.",{back:3}],["A giant milkshake I'll definitely spill",{trip:3}],["Something rare. Very rare.",{monster:3}],["Pie, with suspicious filling",{basement:1,monster:1}]]},
   {q:"The lights flicker. You:",a:[["Grab the keys and leave",{last:3}],["Go check the fuse box downstairs",{basement:3}],["Say 'I'll be right back' and go look",{back:3}],["Stand up too fast and knock over everything",{trip:3}],["Smile in the dark",{monster:3}],["Turn on my phone flashlight",{last:2}]]},
   {q:"The cook comes out holding a cleaver. You:",a:[["Already halfway out the window",{last:3}],["Ask if I can see the kitchen",{basement:3}],["Excuse myself to the restroom",{back:3}],["Run, slip on a pickle, fall",{trip:3}],["Ask if he needs a hand",{monster:3}],["Leave a big tip and back away slowly",{last:2}]]},
   {q:"Pick a dessert:",a:[["Nothing. We're leaving.",{last:3}],["The pie from the back of the fridge",{basement:3}],["I'll grab it later",{back:3}],["Jello, which I'll drop",{trip:3}],["Whatever's still moving",{monster:3}],["A cookie for the road",{last:1,back:1}]]}]},
 {id:"weirdfoods",kind:"trivia",tags:["food"],title:"Real Or Fake? These Gross Foods People Actually Eat Around The World",dek:"Some of these are real dishes people love. Some we made up to gross you out. Can you tell which is which?",badge:"Gross",author:"Fuzz",
  tiers:[[0,"Sheltered Snacker","You thought everything was made up. Some of it very much is not."],[4,"Adventurous Eater","Not bad. You've read a menu or two in your time."],[7,"Food Explorer","Great score. You'd survive any dinner party on Earth."],[10,"Iron-Stomached Legend","Ten out of ten. You know every gross food on the planet and you're proud of it."]],
  qs:[
   {q:"Casu marzu is a cheese from Sardinia, Italy, served with live maggots inside.",a:["Real","Fake"],c:0,why:"Real. It's a traditional sheep's milk cheese, and the maggots are part of how it ripens."},
   {q:"Surstromming is a Swedish fermented herring so smelly people often open the can outdoors.",a:["Real","Fake"],c:0,why:"Real. Some people open the can underwater to keep the smell down."},
   {q:"Sweden's national dessert is herring-flavored ice cream.",a:["Real","Fake"],c:1,why:"Fake. Please do not try to order it."},
   {q:"Balut is a fertilized duck egg, boiled and eaten as a street snack in the Philippines.",a:["Real","Fake"],c:0,why:"Real, and very popular."},
   {q:"Hakarl is fermented shark, a traditional food in Iceland.",a:["Real","Fake"],c:0,why:"Real. It's hung to dry for months and has a famously strong smell."},
   {q:"Hot dog smoothies are a classic breakfast in Texas.",a:["Real","Fake"],c:1,why:"Fake. Texas has many great breakfasts. This is not one of them."},
   {q:"Escamoles, eaten in Mexico, are ant larvae and are sometimes called 'insect caviar'.",a:["Real","Fake"],c:0,why:"Real. They're said to taste buttery and nutty."},
   {q:"Fried tarantulas are sold as a snack in Cambodia.",a:["Real","Fake"],c:0,why:"Real, especially in the town of Skuon."},
   {q:"Chocolate cake made with mayonnaise is a real American recipe.",a:["Real","Fake"],c:0,why:"Real. Mayo adds oil and egg, and it makes the cake super moist."},
   {q:"In Peru, a popular cheese is made from bat milk.",a:["Real","Fake"],c:1,why:"Fake. Bats are busy. They don't have time for cheese."}]},
 {id:"candy",kind:"trivia",tags:["food"],title:"How Much Do You Really Know About Candy?",dek:"Ten sweet questions about the stuff your dentist warned you about.",badge:"Food",author:"Fuzz",
  tiers:[[0,"Dentist Approved","You haven't had much candy. Your teeth thank you."],[4,"Trick-Or-Treat Pro","You know your way around a candy aisle."],[7,"Candy Connoisseur","Excellent. You could run a candy store, and eat most of it."],[10,"Willy Wonka Level","Ten out of ten. Please show us the chocolate river."]],
  qs:[
   {q:"What do the M's in M&M's stand for?",a:["Melty and Munchy","Mars and Murrie","Milk and More","Mmm and Mmm"],c:1,why:"Forrest Mars and Bruce Murrie, the two men behind the candy."},
   {q:"Snickers was named after what?",a:["A laugh","The Mars family's favorite horse","A city","A chef"],c:1,why:"A horse the Mars family loved."},
   {q:"Which candy's slogan is 'Taste the rainbow'?",a:["Starburst","Skittles","Nerds","Jolly Ranchers"],c:1,why:"Skittles."},
   {q:"Which US president famously kept a jar of Jelly Belly jelly beans on his desk?",a:["Ronald Reagan","Abraham Lincoln","Barack Obama","George Washington"],c:0,why:"Ronald Reagan. Blueberry beans were even made for his inauguration."},
   {q:"What were Twinkies originally filled with?",a:["Vanilla cream","Banana cream","Strawberry jam","Chocolate"],c:1,why:"Banana cream. A banana shortage in World War II switched them to vanilla."},
   {q:"Cotton candy was co-invented by a:",a:["Dentist","Clown","Farmer","Astronaut"],c:0,why:"A dentist, William Morrison, in the 1890s. Excellent business plan."},
   {q:"Why do Pop Rocks crackle in your mouth?",a:["Tiny batteries","Trapped carbon dioxide gas","Magic","Salt crystals"],c:1,why:"They're made with pressurized carbon dioxide that pops free as the candy melts."},
   {q:"Candy corn was originally sold under what name?",a:["Chicken Feed","Corn Pops","Sweet Seeds","Harvest Bits"],c:0,why:"'Chicken Feed', back when most Americans were farmers."},
   {q:"Who made the first peanut butter cup sold under his name?",a:["H. B. Reese","Milton Hershey","Frank Mars","Willy Wonka"],c:0,why:"H. B. Reese, who once worked for Milton Hershey."},
   {q:"Which candy was included in American soldiers' rations during World War II?",a:["Tootsie Rolls","Skittles","Gummy bears","Cotton candy"],c:0,why:"Tootsie Rolls, because they held up well in any weather."}]},
 {id:"pizzaq",kind:"trivia",tags:["food"],title:"Only A Pizza Expert Can Get 10/10 On This Cheesy Quiz",dek:"You've eaten a lot of it. But how much do you actually know about it?",badge:"Food",author:"Fuzz",
  tiers:[[0,"Frozen Pizza Rookie","You eat it, you don't study it. That's fine. That's healthy."],[4,"Slice Fan","You know your toppings and probably your local delivery number."],[7,"Pizza Pro","Great score. You could open a pizzeria tomorrow."],[10,"Pizza Royalty","Ten out of ten. You are made of at least 40% mozzarella."]],
  qs:[
   {q:"Hawaiian pizza, with pineapple, was invented in which country?",a:["Hawaii, USA","Canada","Italy","Japan"],c:1,why:"Canada. A restaurant owner in Ontario came up with it in the 1960s."},
   {q:"Which Italian city is considered the birthplace of modern pizza?",a:["Rome","Naples","Venice","Milan"],c:1,why:"Naples."},
   {q:"The Margherita pizza is said to be named after:",a:["A queen","A flower","A ship","A cook's grandma"],c:0,why:"Queen Margherita of Italy. Its colors match the Italian flag."},
   {q:"Which is the most popular pizza topping in the US?",a:["Mushrooms","Pepperoni","Pineapple","Olives"],c:1,why:"Pepperoni."},
   {q:"Deep-dish pizza is most famously associated with which city?",a:["New York","Chicago","Detroit","Boston"],c:1,why:"Chicago."},
   {q:"Where did the very first Pizza Hut open in 1958?",a:["Wichita, Kansas","Chicago","Los Angeles","Dallas"],c:0,why:"Wichita, Kansas."},
   {q:"Which team of heroes famously loves pizza?",a:["The Avengers","The Teenage Mutant Ninja Turtles","The Power Rangers","The Smurfs"],c:1,why:"The Ninja Turtles. Cowabunga."},
   {q:"In 2001, Pizza Hut delivered a pizza where?",a:["To the International Space Station","To the bottom of the ocean","To the top of Mount Everest","To the North Pole"],c:0,why:"To astronauts on the International Space Station."},
   {q:"What is the small plastic table in the middle of a pizza box for?",a:["Stopping the lid from sinking into the cheese","Holding dipping sauce","Decoration","A tiny toy"],c:0,why:"It keeps the box lid from squashing the cheese. It's sometimes called a pizza saver."},
   {q:"Which cheese is most traditional on pizza?",a:["Cheddar","Mozzarella","Swiss","Blue cheese"],c:1,why:"Mozzarella."}]},
 {id:"breakfastworld",kind:"trivia",tags:["food"],title:"Can You Guess Which Country These Breakfasts Come From?",dek:"Not everyone eats cereal. Ten breakfasts from around the world. Where are they from?",badge:"Food",author:"Fuzz",
  tiers:[[0,"Cereal Only","You know one breakfast and it comes in a box. Respect."],[4,"Brunch Traveler","Not bad. You've definitely seen a menu with an accent on it."],[7,"Breakfast Globetrotter","Excellent. You eat your way around the world before 10am."],[10,"Master Of The Morning","Ten out of ten. Every country's breakfast table would welcome you."]],
  qs:[
   {q:"Vegemite on toast is a breakfast classic in:",a:["Australia","Canada","Ireland","South Africa"],c:0,why:"Australia. It's a dark, salty yeast spread."},
   {q:"Natto, sticky fermented soybeans, is a breakfast food in:",a:["China","Japan","Korea","Vietnam"],c:1,why:"Japan. It's famously stringy and strong-smelling."},
   {q:"Congee, a warm rice porridge, is a popular breakfast across:",a:["East and Southeast Asia","South America","Scandinavia","West Africa"],c:0,why:"East and Southeast Asia, especially China."},
   {q:"Shakshuka, eggs poached in spicy tomato sauce, is popular in:",a:["North Africa and the Middle East","Germany","Brazil","Russia"],c:0,why:"North Africa and the Middle East."},
   {q:"Chilaquiles, tortilla chips simmered in salsa, come from:",a:["Spain","Mexico","Argentina","Cuba"],c:1,why:"Mexico."},
   {q:"Grits, made from ground corn, are a breakfast staple in:",a:["The American South","France","India","Poland"],c:0,why:"The American South."},
   {q:"A croissant with coffee is the classic breakfast of:",a:["France","Italy","Greece","Brazil"],c:0,why:"France."},
   {q:"Gallo pinto, rice and beans, is a breakfast favorite in:",a:["Costa Rica and Nicaragua","Norway","Egypt","Japan"],c:0,why:"Costa Rica and Nicaragua."},
   {q:"Pao de queijo, little cheese breads, are popular for breakfast in:",a:["Brazil","Portugal","Chile","Peru"],c:0,why:"Brazil."},
   {q:"Idli, soft steamed rice cakes, are a breakfast food in:",a:["South India","Turkey","Mexico","Ireland"],c:0,why:"South India, often with sambar and chutney."}]},
 {id:"cursedpizza",kind:"build",shape:"pizza",tags:["food"],title:"Build A Cursed Pizza And We'll Reveal Your Love Language",dek:"Make the worst pizza you can. Or the best. We'll know everything about your heart either way.",badge:"Build it",author:"Fuzz",
  qs:[
   {q:"Pick a crust:",a:[["Thin and crispy","#e8b04a"],["Deep dish","#d9a35e"],["Stuffed crust","#f0c27b"],["A giant cookie","#c08a4a"],["A tortilla","#f3dfa6"],["A frozen waffle","#dba44f"]]},
   {q:"Pick a sauce:",a:[["Classic tomato","#d32f2f"],["BBQ","#6d2e1f"],["Ranch","#f4f1e6"],["Chocolate","#4e342e"],["Pickle juice","#9ccc65"],["Nacho cheese","#ffb300"]]},
   {q:"Pick a cheese:",a:[["Mozzarella","#fff6d8"],["Cheddar","#ffa726"],["Vegan cheese","#fff0b3"],["String cheese, peeled by hand","#fffde7"],["Plastic-wrapped cheese slices","#ffcc33"],["No cheese. Chaos.","#00000000"]]},
   {q:"First topping:",a:[["Pepperoni","#c62828"],["Pineapple","#ffe066"],["Anchovies","#90a4ae"],["Gummy worms","#ff4081"],["Mac and cheese","#ffd54f"],["Broccoli","#43a047"]]},
   {q:"Second topping:",a:[["Jalapenos","#2e7d32"],["Marshmallows","#ffffff"],["Canned tuna","#bcaaa4"],["Hot Cheetos","#ff3d00"],["Black olives","#212121"],["A single fried egg","#fffde7"]]},
   {q:"Finish it with:",a:[["Oregano","#558b2f"],["A ranch drizzle","#f4f1e6"],["Edible glitter","#ce93d8"],["Hot honey","#ffb300"],["Rainbow sprinkles","#ff4081"],["A birthday candle","#ff8a65"]]}],
  guess:(p,z,r)=>{const L=["Snacks. You show love by sharing food, and you will absolutely eat the last slice anyway.","Sending memes at 2am. That's how people know you care.","Acts of service, specifically picking the olives off for someone.","Words of affirmation, shouted across the room, mid-bite.","Quality time, in silence, watching a show you've both seen eleven times.","Gifts, especially weird ones, like a single jalapeno in a box.","Physical touch, as in grabbing a slice off someone's plate."];const it=n=>z.qs[n].a[p[n]][0].toLowerCase();
   const l=pick2(r,L);return {t:"Your love language is: "+l.split(".")[0],d:`Anyone who puts ${it(3)} and ${it(4)} on ${bare(it(0))} with ${it(1)} has a big, strange heart. ${l.split(". ").slice(1).join(". ")||"We respect it."}`}}},
 {id:"gasstation",kind:"build",shape:"plate",tags:["food"],title:"Make A Gas Station Dinner And We'll Guess Your Zodiac Sign",dek:"Midnight. Pump 4. You're hungry and the only thing open has a hot dog roller and a dream. Build your dinner.",badge:"Build it",author:"Fuzz",

  guess:(p,z,r)=>{const T=["You can whistle with a mouth full of crackers.","You can tell what time it is without looking, within five minutes.","You can fold a fitted sheet. Nobody else alive can.","You can parallel park on the first try, every time.","You can name any song from the first two notes.","You can make any dog like you instantly.","You can burp the alphabet. Most of it.","You can sleep anywhere, including standing up.","You can find a lost remote in under ten seconds.","You can eat spicy food without crying. Mostly."];const it=n=>z.qs[n].a[p[n]][0].toLowerCase();
   return {t:pick2(r,T),d:`A ${it(0)} shake with ${it(1)} and a ${bare(it(2).replace(/ \(.*\)/,""))} swirl doesn't happen by accident. It takes someone with a gift. Now you know what yours is.`}}},
 {id:"minecraft",kind:"trivia",tags:["games"],title:"Only A True Minecraft Player Can Get 10/10 On This Blocky Quiz",dek:"Creepers, diamonds and a dragon at the end of the world. How well do you know the blockiest game ever?",badge:"Games",author:"Fuzz",
  tiers:[[0,"Just Punched A Tree","You're on day one. Watch out, it's getting dark."],[4,"Stone Tools","You've survived a few nights. Your house is a dirt cube, and that's fine."],[7,"Diamond Miner","Excellent. You've got a whole chest full of shiny stuff."],[10,"Ender Dragon Slayer","Ten out of ten. You've beaten the game and built a castle with a moat."]],
  qs:[
   {q:"What happens when a Creeper gets close to you?",a:["It hugs you","It explodes","It steals your items","It turns into a pig"],c:1,why:"It hisses and explodes. Classic Creeper."},
   {q:"Why should you avoid looking an Enderman in the eyes?",a:["It turns you to stone","It gets angry and attacks","It teleports you","It cries"],c:1,why:"Looking at one makes it angry. Endermen also pick up and carry blocks."},
   {q:"What block do you need to build a Nether portal frame?",a:["Diamond","Obsidian","Gold","Netherrack"],c:1,why:"Obsidian."},
   {q:"What is the final boss of Minecraft?",a:["The Wither","The Ender Dragon","A giant Creeper","Herobrine"],c:1,why:"The Ender Dragon, in the End."},
   {q:"Who originally created Minecraft?",a:["Markus 'Notch' Persson","Shigeru Miyamoto","Gabe Newell","Hideo Kojima"],c:0,why:"Markus 'Notch' Persson, in Sweden."},
   {q:"Which company bought Minecraft's maker, Mojang, in 2014?",a:["Sony","Nintendo","Microsoft","Google"],c:2,why:"Microsoft."},
   {q:"What are the names of the two classic default skins?",a:["Steve and Alex","Sam and Max","Bob and Jane","Notch and Jeb"],c:0,why:"Steve and Alex."},
   {q:"Which floating Nether mob shoots fireballs and makes crying noises?",a:["Blaze","Ghast","Phantom","Vex"],c:1,why:"The Ghast."},
   {q:"How was the Creeper first created?",a:["A coding mistake while making a pig","A fan contest","A dream","It was copied from a movie"],c:0,why:"By accident. Notch mixed up the measurements while making a pig, and it came out tall and thin."},
   {q:"Minecraft is famous for being:",a:["The best-selling video game of all time","The first video game ever","Only playable on phones","Banned in space"],c:0,why:"The best-selling video game of all time."}]},
 {id:"mcmob",kind:"personality",tags:["games"],title:"Which Minecraft Mob Are You?",dek:"Are you a Creeper with anger issues or a chill Axolotl? Answer truthfully. The game is watching.",badge:"Games",author:"Fuzz",
  results:{
   creeper:{t:"The Creeper",d:"Quiet, green and absolutely ready to blow up at the worst possible moment. People hear you hiss and run. Respect."},
   enderman:{t:"The Enderman",d:"Tall, mysterious and deeply uncomfortable with eye contact. You keep moving other people's stuff around and you won't explain why."},
   villager:{t:"The Villager",d:"You're always trading, always making that noise, and you'll sell anyone a stick for an emerald. Business is business."},
   axolotl:{t:"The Axolotl",d:"Pink, adorable and secretly vicious. Everyone thinks you're sweet. You'll eat a whole fish without blinking."},
   pig:{t:"The Pig",d:"Simple, happy and just vibing. You don't need much. Maybe a carrot. Maybe a saddle. Life is good."}},
  qs:[
   {q:"Pick a home:",a:[["Hiding in the dark, waiting",{creeper:3}],["The End. It's quiet there.",{enderman:3}],["A village with good trades",{villager:3}],["An underwater cave",{axolotl:3}],["A grassy field",{pig:3}],["A dirt hut someone built",{pig:1,villager:1}]]},
   {q:"Someone walks into your house. You:",a:[["Sneak up behind them",{creeper:3}],["Teleport away and take a block with me",{enderman:3}],["Offer them a deal",{villager:3}],["Swim over and smile",{axolotl:3}],["Oink",{pig:3}],["Stare. Just stare.",{enderman:2}]]},
   {q:"Your favorite item:",a:[["TNT",{creeper:3}],["An ender pearl",{enderman:3}],["Emeralds",{villager:3}],["A bucket of tropical fish",{axolotl:3}],["Carrots",{pig:3}],["A saddle",{pig:2}]]},
   {q:"How do you handle stress?",a:[["Explode",{creeper:3}],["Disappear",{enderman:3}],["Go 'hmm' loudly",{villager:3}],["Play dead until it's over",{axolotl:3}],["Roll in mud",{pig:3}],["Rearrange the furniture",{enderman:2}]]},
   {q:"Pick a time of day:",a:[["Night. It's my time.",{creeper:3}],["Always night in the End",{enderman:3}],["Daytime, shop's open",{villager:3}],["Whenever, I'm underwater",{axolotl:3}],["Sunny afternoon",{pig:3}],["Dusk",{creeper:1,enderman:1}]]}]},
 {id:"lego",kind:"trivia",tags:["games"],title:"Only A Master Builder Can Get 10/10 On This Lego Quiz",dek:"Everything is awesome, as long as you don't step on it. Ten questions about the world's favorite brick.",badge:"Toys",author:"Fuzz",
  tiers:[[0,"Stepped On A Brick","Ouch. You know Lego mostly as a floor hazard."],[4,"Weekend Builder","You've followed the instructions. Mostly. There were spare pieces."],[7,"Master Builder","Excellent. You build without instructions and it looks amazing."],[10,"Legend Of Legoland","Ten out of ten. Everything is awesome, and so are you."]],
  qs:[
   {q:"Which country does Lego come from?",a:["Germany","Denmark","Sweden","Netherlands"],c:1,why:"Denmark."},
   {q:"The name Lego comes from Danish words meaning:",a:["Little bricks","Play well","Build big","Fun forever"],c:1,why:"'Leg godt', which means 'play well'."},
   {q:"Who founded Lego?",a:["Ole Kirk Christiansen","Hans Christian Andersen","Lars Lego","Niels Bohr"],c:0,why:"Ole Kirk Christiansen, a carpenter, who started out making wooden toys."},
   {q:"In what year was the Lego minifigure introduced?",a:["1958","1978","1995","2005"],c:1,why:"1978."},
   {q:"Where did the very first Legoland open in 1968?",a:["California","Billund, Denmark","London","Tokyo"],c:1,why:"Billund, Denmark, right next to the Lego factory."},
   {q:"Will a Lego brick from 1958 fit with one made today?",a:["Yes","No","Only on Tuesdays","Only with glue"],c:0,why:"Yes. The modern brick design was patented in 1958 and they still fit."},
   {q:"What's the famous song from The Lego Movie?",a:["Let It Go","Everything Is Awesome","Happy","Build Me Up"],c:1,why:"'Everything Is Awesome'."},
   {q:"What kind of plastic are Lego bricks mostly made of?",a:["ABS plastic","Bubble wrap","Rubber","Glass"],c:0,why:"ABS plastic, which is strong and holds its shape."},
   {q:"What was Lego's very first licensed theme, in 1999?",a:["Harry Potter","Star Wars","Batman","Spider-Man"],c:1,why:"Star Wars."},
   {q:"Before plastic bricks, Lego first made toys out of:",a:["Wood","Metal","Paper","Cheese"],c:0,why:"Wood."}]},
 {id:"legofig",kind:"personality",tags:["games"],title:"Which Lego Minifigure Are You?",dek:"Yellow head, claw hands, big dreams. Find your inner minifigure.",badge:"Toys",author:"Fuzz",
  results:{
   space:{t:"The Classic Space Astronaut",d:"Optimistic, adventurous and wearing a slightly cracked helmet. You want to explore everything. You probably will."},
   pirate:{t:"The Pirate Captain",d:"Loud, dramatic and missing a leg, an eye and a hand, all at once somehow. You've never once given back treasure."},
   wizard:{t:"The Wizard",d:"Mysterious, wise and very into tall pointy hats. You know a spell for everything and you never explain any of them."},
   chef:{t:"The Chef",d:"Warm, reliable and always holding a tiny frying pan. Every Lego town would fall apart without you."},
   builder:{t:"The Construction Worker",d:"Practical, strong and the only one who actually read the instructions. You're the reason the city exists."}},
  qs:[
   {q:"Pick an accessory:",a:[["A helmet with a cracked chin strap",{space:3}],["A parrot",{pirate:3}],["A magic wand",{wizard:3}],["A tiny frying pan",{chef:3}],["A jackhammer",{builder:3}],["A coffee cup that's glued to my hand",{builder:1,chef:1}]]},
   {q:"Your dream Lego set:",a:[["A rocket base",{space:3}],["A pirate ship",{pirate:3}],["A castle with a tower",{wizard:3}],["A pizza shop",{chef:3}],["A huge skyscraper",{builder:3}],["The giant one I can't afford",{pirate:1,space:1}]]},
   {q:"How do you build?",a:[["Wildly, with lots of antennas",{space:3}],["I steal pieces from other sets",{pirate:3}],["Magically, without instructions",{wizard:3}],["Carefully, one step at a time",{chef:3}],["Exactly by the instructions",{builder:3}],["I sort every piece by color first",{builder:2}]]},
   {q:"Pick a catchphrase:",a:[["Spaceship!",{space:3}],["Arrr!",{pirate:3}],["You shall not... wait, wrong one.",{wizard:3}],["Order up!",{chef:3}],["Safety first!",{builder:3}],["Everything is awesome!",{space:1,chef:1}]]},
   {q:"Someone steps on a Lego brick. You:",a:[["Float away, in zero gravity",{space:3}],["Laugh like a pirate",{pirate:3}],["Cast a healing spell",{wizard:3}],["Bring them a snack",{chef:3}],["Clean up the floor",{builder:3}],["Pretend I didn't see",{pirate:2}]]}]},
 {id:"pokemon",kind:"trivia",tags:["games"],title:"Gotta Get Them All: Only A True Trainer Can Score 10/10 On This Pokemon Quiz",dek:"Ten questions about the pocket monsters that took over the world. Do you have what it takes?",badge:"Games",author:"Fuzz",
  tiers:[[0,"Lost In Tall Grass","A wild quiz appeared, and it won. Try again with a better Pokemon."],[4,"Rookie Trainer","You've got your first badge. Not bad."],[7,"Gym Leader","Excellent. Trainers come from far away to battle you."],[10,"Pokemon Master","Ten out of ten. You caught them all, and the quiz too."]],

   {q:"Which Pokemon on Team Rocket can talk?",a:["Ekans","Koffing","Meowth","Wobbuffet"],c:2,why:"Meowth."},

 {id:"starter",kind:"personality",tags:["games"],title:"Which Original Pokemon Partner Are You?",dek:"Professor Oak is holding out a Poke Ball. Answer five questions and find out which partner is really you.",badge:"Games",author:"Fuzz",
  results:{
   bulba:{t:"Bulbasaur",d:"Calm, kind and quietly underrated. You grow on people, literally, like a plant. Number one in the Pokedex, number one in our hearts."},
   char:{t:"Charmander",d:"Fiery, brave and a little dramatic. You keep your tail flame burning no matter what, and you will evolve into something very big and very loud."},
   squirt:{t:"Squirtle",d:"Cool, cheeky and always the leader of the squad. You wear sunglasses indoors and somehow it works."},
   pika:{t:"Pikachu",d:"The face of the whole franchise. Cute, loyal and absolutely capable of zapping anyone who crosses your friends."},
   eevee:{t:"Eevee",d:"Adaptable and full of possibility. You could become anything. You're still deciding, and that's the best part."}},
  qs:[
   {q:"Pick a place to hang out:",a:[["A sunny garden",{bulba:3}],["A volcano",{char:3}],["The beach",{squirt:3}],["Wherever my best friend is",{pika:3}],["Somewhere new every day",{eevee:3}],["A cozy Pokemon Center",{bulba:1,eevee:1}]]},
   {q:"How do you battle?",a:[["Patiently, wearing them down",{bulba:3}],["All-out attack",{char:3}],["With style",{squirt:3}],["With lightning speed",{pika:3}],["I adapt to anything",{eevee:3}],["I'd rather make friends",{bulba:2}]]},
   {q:"Pick a snack:",a:[["Something from the garden",{bulba:3}],["Something spicy",{char:3}],["Seafood",{squirt:3}],["Ketchup, straight from the bottle",{pika:3}],["A little of everything",{eevee:3}],["Berries",{bulba:1,eevee:1}]]},
   {q:"Your trainer forgets to feed you. You:",a:[["Wait patiently",{bulba:3}],["Set something on fire",{char:3}],["Spray them with water",{squirt:3}],["Zap them, lovingly",{pika:3}],["Make puppy eyes",{eevee:3}],["Sulk in a Poke Ball",{char:1,pika:1}]]},
   {q:"What do you want to become?",a:[["Something big and strong, slowly",{bulba:3}],["A giant dragon",{char:3}],["A tank with water cannons",{squirt:3}],["I'm good as I am, thanks",{pika:3}],["I can't decide. There are so many options.",{eevee:3}],["Famous",{pika:2}]]}]},
 {id:"photoanimals",kind:"trivia",tags:["photo"],title:"Can You Name These Weird Animals From Just A Photo?",dek:"Ten real animals. Some are cute, some are strange, one is famously described as the world's ugliest. Name them.",badge:"Photo quiz",author:"Fuzz",
  tiers:[[0,"Has Never Been To A Zoo","That's okay. The zoo will still let you in."],[4,"Nature Show Fan","You know your weird animals. Respect."],[7,"Wildlife Expert","Great job. Animals probably follow you around."],[10,"Basically A Zookeeper","Ten out of ten. You could name every creature on Earth."]],
  qs:[
   {q:"What animal is this?",img:"Axolotl",hint:"A pink salamander that smiles and can regrow its legs.",a:["Axolotl","Tadpole","Gecko","Eel"],c:0,why:"An axolotl. It can regrow lost legs and even parts of its heart."},
   {q:"What animal is this?",img:"Platypus",hint:"A furry mammal with a duck's bill that lays eggs.",a:["Beaver","Otter","Platypus","Mole"],c:2,why:"A platypus: a mammal that lays eggs and has a bill like a duck."},
   {q:"What animal is this?",img:"Capybara",hint:"The world's biggest rodent, famously chill with every other animal.",a:["Guinea pig","Capybara","Wombat","Beaver"],c:1,why:"A capybara, the largest rodent on Earth."},
   {q:"What animal is this?",img:"Red panda",hint:"A red, fluffy tree-climber with a ringed tail.",a:["Raccoon","Fox","Red panda","Lemur"],c:2,why:"A red panda. It's not a close relative of the giant panda."},
   {q:"What animal is this?",img:"Pangolin",hint:"Covered in scales, rolls into a ball, eats ants.",a:["Armadillo","Pangolin","Anteater","Hedgehog"],c:1,why:"A pangolin, the only mammal covered in scales."},
   {q:"What animal is this?",img:"Okapi",hint:"Zebra-striped legs, but it's actually related to giraffes.",a:["Zebra","Okapi","Tapir","Antelope"],c:1,why:"An okapi. Its closest relative is the giraffe."},
   {q:"What animal is this?",img:"Aye-aye",hint:"A lemur from Madagascar with a super-long middle finger.",a:["Bat","Aye-aye","Possum","Bush baby"],c:1,why:"An aye-aye, which taps on trees to find grubs."},
   {q:"What animal is this?",img:"Blobfish",hint:"A deep-sea fish once voted the world's ugliest animal.",a:["Blobfish","Pufferfish","Jellyfish","Sea slug"],c:0,why:"A blobfish. It only looks like that out of the water."},
   {q:"What animal is this?",img:"Quokka",hint:"A small Australian marsupial that always looks like it's smiling.",a:["Quokka","Kangaroo","Meerkat","Hamster"],c:0,why:"A quokka, sometimes called the happiest animal in the world."},
   {q:"What animal is this?",img:"Narwhal",hint:"An Arctic whale with a long spiral tusk.",a:["Swordfish","Narwhal","Dolphin","Walrus"],c:1,why:"A narwhal. The tusk is actually a very long tooth."}]},
 {id:"photoflags",kind:"trivia",tags:["photo"],title:"Guess The Country From Its Flag",dek:"Ten flags from around the world. How many can you name?",badge:"Photo quiz",author:"Fuzz",
  tiers:[[0,"Flag Rookie","You know your own flag, and that's what matters most."],[4,"World Traveler","Nice. You've seen a few of these at the Olympics."],[7,"Flag Expert","Excellent. You could run the opening ceremony."],[10,"Geography Genius","Ten out of ten. You know every flag that flies."]],
  qs:[
   {q:"Which country's flag is this?",img:"Flag of Japan",hint:"A red circle on a white background.",a:["China","Japan","South Korea","Bangladesh"],c:1,why:"Japan. The red circle stands for the sun."},
   {q:"Which country's flag is this?",img:"Flag of Canada",hint:"A red maple leaf.",a:["Canada","Switzerland","Peru","Austria"],c:0,why:"Canada."},
   {q:"Which country's flag is this?",img:"Flag of Brazil",hint:"Green, with a yellow diamond and a blue starry globe.",a:["Brazil","Portugal","Jamaica","Argentina"],c:0,why:"Brazil. The stars show the night sky over Rio de Janeiro."},
   {q:"Which country's flag is this?",img:"Flag of Mexico",hint:"Green, white and red stripes with an eagle on a cactus.",a:["Italy","Ireland","Mexico","Hungary"],c:2,why:"Mexico. The eagle is eating a snake on a cactus."},
   {q:"Which country's flag is this?",img:"Flag of South Korea",hint:"White, with a red and blue circle and four black symbols.",a:["Japan","South Korea","Taiwan","Mongolia"],c:1,why:"South Korea."},
   {q:"Which country's flag is this?",img:"Flag of Kenya",hint:"Black, red and green with a shield and two spears.",a:["Kenya","Nigeria","Ghana","Egypt"],c:0,why:"Kenya. The shield and spears stand for defending freedom."},
   {q:"Which country's flag is this?",img:"Flag of India",hint:"Orange, white and green with a blue wheel in the middle.",a:["Ireland","India","Niger","Pakistan"],c:1,why:"India. The wheel is called the Ashoka Chakra."},
   {q:"Which country's flag is this?",img:"Flag of Australia",hint:"Dark blue with stars and the Union Jack in the corner.",a:["New Zealand","Australia","United Kingdom","Fiji"],c:1,why:"Australia. New Zealand's looks similar, but its stars are red."},
   {q:"Which country's flag is this?",img:"Flag of Jamaica",hint:"A gold X with green and black triangles.",a:["Jamaica","Barbados","Bahamas","Belize"],c:0,why:"Jamaica."},
   {q:"Which country's flag is this?",img:"Flag of the United States",hint:"Fifty stars and thirteen stripes.",a:["Liberia","United States","Malaysia","Chile"],c:1,why:"The United States. Fifty stars for fifty states, thirteen stripes for the original colonies."}]},
 {id:"photolandmarks",kind:"trivia",tags:["photo"],title:"Name These Famous Landmarks From A Photo",dek:"Ten of the most famous places on Earth. Do you know where you're looking?",badge:"Photo quiz",author:"Fuzz",
  tiers:[[0,"Stayed Home","Nothing wrong with that. Home is great."],[4,"Postcard Collector","You'd recognize these from a fridge magnet."],[7,"World Explorer","Excellent. You've definitely got a passport, or a big atlas."],[10,"Globe Trotter","Ten out of ten. You could guide a tour of the whole planet."]],

   {q:"What landmark is this?",img:"Statue of Liberty",hint:"A giant green statue holding a torch in New York Harbor.",a:["Statue of Liberty","Christ the Redeemer","The Motherland Calls","Lady Justice"],c:0,why:"The Statue of Liberty, a gift from France in 1886."},
   {q:"What landmark is this?",img:"Great Wall of China",hint:"A very, very long wall over mountains in China.",a:["Hadrian's Wall","Great Wall of China","Berlin Wall","Walls of Troy"],c:1,why:"The Great Wall of China, thousands of miles long."},
   {q:"What landmark is this?",img:"Taj Mahal",hint:"A white marble tomb with a big dome in India.",a:["Taj Mahal","Blue Mosque","Alhambra","Angkor Wat"],c:0,why:"The Taj Mahal, in Agra, India."},
   {q:"What landmark is this?",img:"Colosseum",hint:"A huge ancient Roman arena.",a:["Parthenon","Colosseum","Pantheon","Acropolis"],c:1,why:"The Colosseum, in Rome, nearly 2,000 years old."},
   {q:"What landmark is this?",img:"Sydney Opera House",hint:"Shell-shaped roofs by the harbor in Australia.",a:["Sydney Opera House","Lotus Temple","Guggenheim Museum","Louvre"],c:0,why:"The Sydney Opera House."},
   {q:"What landmark is this?",img:"Golden Gate Bridge",hint:"A big orange-red bridge in San Francisco.",a:["Brooklyn Bridge","Golden Gate Bridge","Tower Bridge","Sydney Harbour Bridge"],c:1,why:"The Golden Gate Bridge. Its color is called International Orange."},

 {id:"photofoods",kind:"trivia",tags:["photo","food"],title:"Can You Guess These Foods From Around The World By Their Photo?",dek:"Ten dishes. You've probably eaten some. Can you name them all?",badge:"Photo quiz",author:"Fuzz",
