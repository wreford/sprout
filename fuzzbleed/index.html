   {q:"What food is this?",img:"Pizza",hint:"You know this one.",a:["Pizza","Flatbread","Pie","Quiche"],c:0,why:"Pizza. We felt you deserved a win."}]},
 {id:"photodinos",kind:"trivia",tags:["photo"],title:"Can You Name These Dinosaurs?",dek:"Fossils, skeletons and models. Eight dinosaurs and their prehistoric pals. How many can you name?",badge:"Photo quiz",author:"Fuzz",
  tiers:[[0,"Fresh Hatchling","You just cracked out of your egg. Welcome to the Cretaceous."],[4,"Fossil Finder","Not bad. You've definitely been to a museum."],[7,"Paleontologist","Excellent. You could dig these up yourself."],[10,"Dino Master","A perfect score. Roar."]],
  qs:[
   {q:"Which dinosaur is this?",img:"Stegosaurus",hint:"Big plates down its back and spikes on its tail.",a:["Stegosaurus","Ankylosaurus","Triceratops","Iguanodon"],c:0,why:"Stegosaurus."},
   {q:"Which dinosaur is this?",img:"Triceratops",hint:"Three horns and a big bony frill.",a:["Styracosaurus","Triceratops","Pachycephalosaurus","Protoceratops"],c:1,why:"Triceratops, whose name means 'three-horned face'."},
   {q:"Which dinosaur is this?",img:"Tyrannosaurus",hint:"The famous meat-eater with tiny arms.",a:["Allosaurus","Spinosaurus","Tyrannosaurus","Giganotosaurus"],c:2,why:"Tyrannosaurus rex."},
   {q:"Which dinosaur is this?",img:"Brachiosaurus",hint:"A giant long-necked plant-eater with front legs longer than its back legs.",a:["Brachiosaurus","Diplodocus","Apatosaurus","Stegosaurus"],c:0,why:"Brachiosaurus."},
   {q:"Which dinosaur is this?",img:"Ankylosaurus",hint:"Armored like a tank, with a club on its tail.",a:["Ankylosaurus","Stegosaurus","Triceratops","Iguanodon"],c:0,why:"Ankylosaurus."},
   {q:"Which dinosaur is this?",img:"Spinosaurus",hint:"A huge sail on its back and a crocodile-like snout.",a:["Dimetrodon","Spinosaurus","Allosaurus","Baryonyx"],c:1,why:"Spinosaurus. Dimetrodon also had a sail, but it wasn't a dinosaur."},
   {q:"Which dinosaur is this?",img:"Parasaurolophus",hint:"A duck-billed dinosaur with a long tube-shaped crest.",a:["Parasaurolophus","Pteranodon","Iguanodon","Corythosaurus"],c:0,why:"Parasaurolophus. Its crest may have worked like a trumpet."},
   {q:"Which prehistoric creature is this?",img:"Pteranodon",hint:"A flying reptile with a long crest on its head.",a:["Archaeopteryx","Pteranodon","Quetzalcoatlus","Microraptor"],c:1,why:"Pteranodon, a flying reptile. Not technically a dinosaur."}]},
 {id:"mario",kind:"trivia",tags:["games","kids"],title:"Only A True Super Mario Fan Can Get 10/10 On This Mushroom Kingdom Quiz",dek:"Let's-a go! Ten questions about the world's most famous plumber.",badge:"Games",author:"Fuzz",
  tiers:[[0,"Fell Down A Pipe","You took a wrong turn at World 1-1. It happens to everyone."],[4,"Coin Collector","Not bad. You've stomped a few Goombas in your time."],[7,"Super Star","Excellent. You're powered up and invincible."],[10,"Ruler Of The Mushroom Kingdom","Ten out of ten. Thank you, but our princess is in another castle."]],
  qs:[
   {q:"What is the name of Mario's brother?",a:["Wario","Luigi","Toad","Waluigi"],c:1,why:"Luigi, who is taller and wears green."},
   {q:"What is Mario's job?",a:["Chef","Plumber","Builder","Firefighter"],c:1,why:"Plumber. That's why there are so many pipes."},
   {q:"Who is the king of the Koopas?",a:["Bowser","Kamek","Donkey Kong","King Boo"],c:0,why:"Bowser."},
   {q:"What was Mario called in his very first game, Donkey Kong, in 1981?",a:["Jumpman","Plumberman","Mr. Video","Super Guy"],c:0,why:"Jumpman. He got the name Mario soon after."},
   {q:"What kind of creature is Yoshi?",a:["A frog","A dinosaur","A turtle","A dragon"],c:1,why:"A friendly green dinosaur who can eat almost anything."},
   {q:"Who created Mario?",a:["Shigeru Miyamoto","Satoru Iwata","Hideo Kojima","Sonic"],c:0,why:"Shigeru Miyamoto, who also created The Legend of Zelda."},
   {q:"Which kingdom does Princess Peach rule?",a:["The Mushroom Kingdom","Hyrule","Dream Land","Koopa Kingdom"],c:0,why:"The Mushroom Kingdom."},
   {q:"What does a Super Mushroom do?",a:["Makes Mario big","Makes Mario fly","Makes Mario invisible","Gives Mario a kart"],c:0,why:"It makes Mario grow big."},
   {q:"What letter is on Mario's cap?",a:["S","N","M","L"],c:2,why:"M, for Mario. Luigi's says L."},
   {q:"The first Mario Kart game came out in what year?",a:["1985","1992","2001","2008"],c:1,why:"1992: Super Mario Kart, on the Super Nintendo."}]},
 {id:"kartracer",kind:"personality",tags:["games","kids"],title:"Which Mario Kart Racer Are You?",dek:"Start your engines. Six questions to find out who you really are on Rainbow Road.",badge:"Games",author:"Fuzz",
  results:{
   mario:{t:"Mario",d:"The all-rounder. You're good at everything, everyone knows your name, and you always look happy to be here. Wahoo!"},
   luigi:{t:"Luigi",d:"Underrated, a little nervous, and secretly the best racer on the track. You have a death stare that terrifies everyone."},
   peach:{t:"Princess Peach",d:"Graceful, kind and absolutely ruthless with a red shell. People think you're sweet. You are. You also win."},
   bowser:{t:"Bowser",d:"Big, loud and very heavy. You're slow to start but nobody can push you off the track. You love chaos."},
   yoshi:{t:"Yoshi",d:"Cheerful, speedy and always hungry. You make friends with everyone and eat their snacks."},
   toad:{t:"Toad",d:"Small, fast and zooming around everyone's feet. You yell a lot. You're having the best time."}},
  qs:[
   {q:"Pick your kart:",a:[["The classic red one",{mario:3}],["Something green and sleek",{luigi:3}],["A fancy pink one",{peach:3}],["The biggest, spikiest one",{bowser:3}],["Something egg-shaped",{yoshi:3}],["The tiniest, fastest one",{toad:3}]]},
   {q:"Your favorite item:",a:[["A star",{mario:3}],["A green shell",{luigi:3}],["A red shell, aimed carefully",{peach:3}],["A bullet bill",{bowser:3}],["An egg",{yoshi:3}],["A mushroom boost",{toad:3}]]},
   {q:"Someone hits you with a blue shell. You:",a:[["Laugh it off",{mario:3}],["Stare. Silently. Forever.",{luigi:3}],["Smile, then get revenge",{peach:3}],["ROAR",{bowser:3}],["Eat the shell",{yoshi:3}],["Scream really loudly",{toad:3}]]},
   {q:"Pick a track:",a:[["Mario Circuit",{mario:3}],["Luigi's Mansion",{luigi:3}],["Peach's Castle",{peach:3}],["Bowser's Castle",{bowser:3}],["Yoshi Valley",{yoshi:3}],["Toad's Turnpike",{toad:3}]]},
   {q:"Your racing style:",a:[["Steady and smart",{mario:3}],["Quiet, then suddenly first",{luigi:3}],["Elegant drifting",{peach:3}],["Bump everyone off the road",{bowser:3}],["Fast and bouncy",{yoshi:3}],["Zoom zoom zoom",{toad:3}]]},
   {q:"Pick a snack after the race:",a:[["Spaghetti",{mario:3}],["Whatever Mario's having",{luigi:3}],["Cake",{peach:3}],["Everyone else's food",{bowser:3}],["Fruit. Lots of fruit.",{yoshi:3}],["Mushroom soup",{toad:3}]]}]},
 {id:"sharks",kind:"trivia",tags:["kids"],title:"Only A True Shark Expert Can Get 10/10 On This Jawsome Quiz",dek:"Sharks are older than trees and stranger than you think. Ten questions from the deep.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Afraid Of The Bathtub","That's okay. There are no sharks in there. Probably."],[4,"Beach Day Expert","You know your way around the ocean."],[7,"Marine Biologist","Excellent. Sharks would invite you to their parties."],[10,"Basically A Shark","Ten out of ten. Are you sure you're not reading this underwater?"]],
  qs:[
   {q:"What is the biggest fish in the world?",a:["Great white shark","Whale shark","Blue whale","Tiger shark"],c:1,why:"The whale shark. The blue whale is bigger, but it's a mammal, not a fish."},
   {q:"What are shark skeletons made of?",a:["Bone","Cartilage","Shell","Wood"],c:1,why:"Cartilage, the same bendy stuff in your nose and ears."},
   {q:"What happens when a shark loses a tooth?",a:["It's gone forever","A new one moves in to replace it","It gets a gold tooth","It stops eating"],c:1,why:"A new tooth moves forward. Some sharks go through thousands in a lifetime."},
   {q:"Which shark has a head shaped like a hammer?",a:["Hammerhead","Mako","Nurse shark","Goblin shark"],c:0,why:"The hammerhead. Its wide head helps it find prey."},
   {q:"Which came first on Earth: sharks or trees?",a:["Trees","Sharks","Both at the same time","Neither"],c:1,why:"Sharks, by tens of millions of years."},
   {q:"What is a baby shark called?",a:["A pup","A calf","A fry","A sharklet"],c:0,why:"A pup."},
   {q:"Which shark can live for hundreds of years?",a:["Greenland shark","Bull shark","Lemon shark","Reef shark"],c:0,why:"The Greenland shark, one of the longest-living animals with a backbone."},
   {q:"What was the megalodon?",a:["A giant extinct shark","A sea monster from myths","A kind of whale","A submarine"],c:0,why:"A giant shark that went extinct millions of years ago."},
   {q:"Sharks can sense the tiny electric signals given off by other animals. True or false?",a:["True","False"],c:0,why:"True. Special pores on their snouts can feel electric fields."},
   {q:"Which TV event every summer is all about sharks?",a:["Shark Week","Fin Fest","Jaws Day","Ocean Month"],c:0,why:"Shark Week, running since 1988."}]},
 {id:"heroes",kind:"trivia",tags:["kids","tv"],title:"Only A True Superhero Fan Can Get 10/10 On This Quiz",dek:"Capes, shields, hammers and a lot of secret identities. Ten questions. Suit up.",badge:"Quiz",author:"Fuzz",

   {q:"Which city does Batman protect?",a:["Metropolis","Gotham City","New York","Star City"],c:1,why:"Gotham City."},
   {q:"Which planet is Superman from?",a:["Mars","Krypton","Asgard","Titan"],c:1,why:"Krypton."},
   {q:"What is Iron Man's real name?",a:["Steve Rogers","Tony Stark","Bruce Banner","Scott Lang"],c:1,why:"Tony Stark."},
   {q:"Who turns into the Hulk?",a:["Bruce Banner","Bruce Wayne","Peter Parker","Nick Fury"],c:0,why:"Bruce Banner."},

   {q:"What is the name of Thor's hammer?",a:["Mjolnir","Excalibur","Stormbreaker","Gungnir"],c:0,why:"Mjolnir."},
   {q:"Which country does Black Panther rule?",a:["Wakanda","Latveria","Genosha","Atlantis"],c:0,why:"Wakanda."},
   {q:"Who is Batman's loyal butler?",a:["Alfred","Jarvis","Robin","Gordon"],c:0,why:"Alfred Pennyworth."}]},
 {id:"superpower",kind:"personality",tags:["kids"],title:"Which Superpower Should You Actually Have?",dek:"Not the one you want. The one you'd actually be good at. Answer truthfully.",badge:"Kids",author:"Fuzz",
  results:{
   fly:{t:"Flying",d:"You want to see everything from above, you love going fast, and you'd definitely use it to skip traffic. Watch out for birds."},
   invis:{t:"Invisibility",d:"Sneaky, curious and great at surprises. You'd use it mostly to find out what everyone's getting you for your birthday."},
   strong:{t:"Super Strength",d:"You'd carry everyone's backpacks, open every jar, and win every tug of war. A gentle giant."},
   speed:{t:"Super Speed",d:"You're always in a hurry anyway. You'd finish your chores in two seconds and then be bored for the rest of the day."},
   talk:{t:"Talking To Animals",d:"Kind, patient and a great listener. Dogs would tell you all their secrets. Cats would tell you nothing, out of principle."},
   time:{t:"Freezing Time",d:"You'd stop the clock to get ten more minutes in bed, every single morning. Smart."}},
  qs:[
   {q:"Pick a morning:",a:[["Up early, ready to go",{speed:3}],["Ten more minutes. Ten more.",{time:3}],["Sneaking a snack before anyone's awake",{invis:3}],["Looking out the window at the sky",{fly:3}],["Saying good morning to the dog",{talk:3}],["Carrying the groceries in one trip",{strong:3}]]},
   {q:"Pick a pet:",a:[["A bird",{fly:3}],["A sneaky cat",{invis:3}],["A really big dog",{strong:3}],["A greyhound",{speed:3}],["Any and every animal",{talk:3}],["A tortoise. Slow is fine.",{time:3}]]},
   {q:"Your friend needs help. You:",a:[["Fly over immediately",{fly:3}],["Quietly sneak over",{invis:3}],["Lift whatever they need lifted",{strong:3}],["Get there before they finish asking",{speed:3}],["Ask their dog what's wrong",{talk:3}],["Pause everything and think",{time:3}]]},
   {q:"Pick a game:",a:[["Tag",{speed:3}],["Hide and seek",{invis:3}],["Tug of war",{strong:3}],["Paper airplanes",{fly:3}],["Pretending to be animals",{talk:3}],["Freeze tag",{time:3}]]},
   {q:"Pick a dream vacation:",a:[["Skydiving",{fly:3}],["A secret spy mission",{invis:3}],["Climbing a mountain",{strong:3}],["A race car track",{speed:3}],["A safari",{talk:3}],["A beach, forever",{time:3}]]}]},
 {id:"photospace",kind:"trivia",tags:["photo","kids"],title:"Can You Name These Planets From Real Space Photos?",dek:"Real pictures taken by telescopes and spacecraft. Ten worlds. How many can you name?",badge:"Photo quiz",author:"Fuzz",
  tiers:[[0,"Still On The Launch Pad","Ten, nine, eight... you'll get there."],[4,"Stargazer","Nice. You've looked up at the night sky a few times."],[7,"Astronaut","Excellent. Mission control is impressed."],[10,"Space Commander","Ten out of ten. NASA should call you."]],
  qs:[
   {q:"Which planet is this?",img:"Jupiter",hint:"The biggest planet, with stripes and a giant red storm.",a:["Saturn","Jupiter","Mars","Neptune"],c:1,why:"Jupiter, the biggest planet in our solar system."},
   {q:"Which planet is this?",img:"Saturn",hint:"Famous for its beautiful rings.",a:["Saturn","Uranus","Jupiter","Venus"],c:0,why:"Saturn. Its rings are made of ice and rock."},
   {q:"Which planet is this?",img:"Mars",hint:"The Red Planet.",a:["Venus","Mercury","Mars","Pluto"],c:2,why:"Mars. It's red because of rusty iron in its dust."},
   {q:"What is this?",img:"Moon",hint:"You can see it from your backyard most nights.",a:["Mercury","The Moon","Pluto","Europa"],c:1,why:"Our Moon."},
   {q:"Which planet is this?",img:"Neptune",hint:"The farthest planet from the Sun, deep blue and windy.",a:["Uranus","Earth","Neptune","Saturn"],c:2,why:"Neptune, the windiest planet."},
   {q:"Which planet is this?",img:"Earth",hint:"Home.",a:["Earth","Neptune","Venus","Mars"],c:0,why:"Earth. Hi!"},
   {q:"What is this?",img:"Pluto",hint:"A dwarf planet with a big heart shape on it.",a:["Pluto","Mercury","The Moon","Ceres"],c:0,why:"Pluto, photographed up close by the New Horizons spacecraft in 2015."},
   {q:"Which planet is this?",img:"Uranus",hint:"A pale blue-green planet that spins on its side.",a:["Neptune","Uranus","Saturn","Earth"],c:1,why:"Uranus, which spins tipped over on its side."},
   {q:"What is this?",img:"Sun",hint:"The star at the middle of our solar system.",a:["The Sun","Jupiter","Mars","A comet"],c:0,why:"The Sun. Never look at it directly!"},
   {q:"Which planet is this?",img:"Venus",hint:"The hottest planet, wrapped in thick clouds.",a:["Venus","Mercury","Mars","Saturn"],c:0,why:"Venus, hotter than Mercury thanks to its thick clouds."}]},
 {id:"photoinstruments",kind:"trivia",tags:["photo","kids","music"],title:"Can You Name These Musical Instruments From A Photo?",dek:"From orchestras to rock bands to faraway places. Ten instruments. Name that noise-maker.",badge:"Photo quiz",author:"Fuzz",

  qs:[

   {q:"What instrument is this?",img:"Trumpet",hint:"A shiny brass horn with three valves.",a:["Trumpet","Tuba","Flute","Saxophone"],c:0,why:"A trumpet."},
   {q:"What instrument is this?",img:"Didgeridoo",hint:"A long wooden tube from Aboriginal Australia, played with a deep hum.",a:["Didgeridoo","Bagpipes","Clarinet","Oboe"],c:0,why:"A didgeridoo, from northern Australia."},
   {q:"What instrument is this?",img:"Bagpipes",hint:"A bag of air with pipes, famous in Scotland.",a:["Accordion","Bagpipes","Harmonica","Organ"],c:1,why:"Bagpipes."},
   {q:"What instrument is this?",img:"Harp",hint:"A big frame with lots of strings you pluck.",a:["Piano","Harp","Banjo","Sitar"],c:1,why:"A harp."},
   {q:"What instrument is this?",img:"Accordion",hint:"You squeeze it in and out and press buttons.",a:["Accordion","Keyboard","Bagpipes","Harmonica"],c:0,why:"An accordion."},
   {q:"What instrument is this?",img:"Banjo",hint:"A round, drum-like body with strings and a twangy sound.",a:["Guitar","Banjo","Mandolin","Violin"],c:1,why:"A banjo."},

 {id:"photobugs",kind:"trivia",tags:["photo","kids"],title:"Can You Name These Bugs From A Close-Up Photo?",dek:"Creepy, crawly and fascinating. Ten bugs up close. How many can you name?",badge:"Photo quiz",author:"Fuzz",
  tiers:[[0,"Bug Avoider","You run when you see one. Understandable."],[4,"Backyard Explorer","Nice. You've flipped over a few rocks in your time."],[7,"Bug Expert","Excellent. Insects respect you."],[10,"Entomologist","Ten out of ten. That's the word for a bug scientist, and it's you."]],
  qs:[
   {q:"What bug is this?",img:"Coccinellidae",hint:"Small, round, red with black spots.",a:["Ladybug","Beetle bug","Spotted fly","Tick"],c:0,why:"A ladybug, also called a ladybird beetle."},
   {q:"What bug is this?",img:"Mantis",hint:"Holds its front legs together like it's praying.",a:["Grasshopper","Praying mantis","Stick insect","Cricket"],c:1,why:"A praying mantis."},
   {q:"What bug is this?",img:"Dragonfly",hint:"Four see-through wings and huge eyes, zooms over ponds.",a:["Dragonfly","Mosquito","Moth","Wasp"],c:0,why:"A dragonfly, one of the fastest flying insects."},
   {q:"What bug is this?",img:"Monarch butterfly",hint:"An orange and black butterfly that migrates thousands of miles.",a:["Monarch butterfly","Moth","Painted lady","Swallowtail"],c:0,why:"A monarch butterfly."},
   {q:"What bug is this?",img:"Phasmatodea",hint:"It looks exactly like a twig.",a:["Stick insect","Worm","Centipede","Caterpillar"],c:0,why:"A stick insect, a master of disguise."},
   {q:"What bug is this?",img:"Firefly",hint:"Its tail lights up at night.",a:["Firefly","Glow worm fly","Moth","Beetle"],c:0,why:"A firefly. The glow is a chemical reaction called bioluminescence."},
   {q:"What bug is this?",img:"Dung beetle",hint:"It rolls balls of poop. Really.",a:["Dung beetle","Ladybug","Ant","Cockroach"],c:0,why:"A dung beetle, which rolls dung into balls to eat and lay eggs in."},
   {q:"What bug is this?",img:"Western honey bee",hint:"Makes honey and lives in a hive.",a:["Wasp","Honey bee","Hornet","Fly"],c:1,why:"A honey bee."},
   {q:"What bug is this?",img:"Atlas moth",hint:"One of the biggest moths in the world.",a:["Atlas moth","Monarch butterfly","Bat","Leaf"],c:0,why:"An atlas moth. Its wings can be as wide as a dinner plate."},
   {q:"What bug is this?",img:"Rhinoceros beetle",hint:"A big beetle with a horn on its head, super strong.",a:["Rhinoceros beetle","Stag beetle","Scarab","Cockroach"],c:0,why:"A rhinoceros beetle, one of the strongest animals for its size."}]},
 {id:"hp",kind:"trivia",tags:["tv","kids"],title:"Only A True Wizard Can Get 10/10 On This Harry Potter Quiz",dek:"Owls, spells, candy that tastes like earwax. Ten questions from the wizarding world. Wands at the ready.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Total Muggle","Your Hogwarts letter got lost in the mail. Happens to the best of us."],[4,"First Year","You know your way to the Great Hall. Keep studying."],[7,"Prefect","Excellent. Hermione would nod at you. Slightly."],[10,"Headmaster","Ten out of ten. The portraits on the wall are clapping."]],
  qs:[
   {q:"What is the name of Harry's owl?",a:["Errol","Hedwig","Pigwidgeon","Fawkes"],c:1,why:"Hedwig, a snowy owl. Errol belongs to the Weasleys and Fawkes is Dumbledore's phoenix."},
   {q:"Which house did the Sorting Hat want to put Harry in, before he asked it not to?",a:["Ravenclaw","Hufflepuff","Slytherin","Gryffindor"],c:2,why:"Slytherin. Harry kept thinking \"not Slytherin\" and the hat listened."},
   {q:"What position does Harry play in Quidditch?",a:["Keeper","Beater","Chaser","Seeker"],c:3,why:"Seeker. He was the youngest house player in a century."},
   {q:"Which platform does the Hogwarts Express leave from?",a:["Platform Nine and Three-Quarters","Platform Seven and a Half","Platform Ten and a Quarter","Platform Thirteen"],c:0,why:"Platform Nine and Three-Quarters, through the wall at King's Cross station."},
   {q:"What does the spell Expelliarmus do?",a:["Lights up your wand","Knocks the wand out of your opponent's hand","Unlocks doors","Makes things float"],c:1,why:"It disarms your opponent. It's Harry's favorite spell."},
   {q:"What is the name of the Weasley family's house?",a:["The Burrow","Shell Cottage","Grimmauld Place","The Leaky Cauldron"],c:0,why:"The Burrow, a wobbly house held up partly by magic."},
   {q:"Who turns out to be the Half-Blood Prince?",a:["Voldemort","Harry","Severus Snape","Neville Longbottom"],c:2,why:"Severus Snape. The old potions book was his."},
   {q:"Which candy can taste like earwax, vomit or sprouts?",a:["Chocolate Frogs","Bertie Bott's Every Flavor Beans","Fizzing Whizbees","Acid Pops"],c:1,why:"Bertie Bott's Every Flavor Beans. They mean every flavor."},
   {q:"What is the name of Hagrid's three-headed dog?",a:["Fang","Norbert","Fluffy","Buckbeak"],c:2,why:"Fluffy. Play him music and he falls asleep."},
   {q:"What shape does Harry's Patronus take?",a:["A stag","A doe","An otter","A phoenix"],c:0,why:"A stag, just like his dad's."}]},
 {id:"starwars",kind:"trivia",tags:["tv","kids"],title:"Can You Get 10/10 On This Star Wars Quiz? The Force Will Tell",dek:"Droids, Wookiees, a very small green Jedi. Ten questions from a galaxy far, far away.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Stormtrooper","You missed every shot. That's okay. They always do."],[4,"Padawan","You've started your training. Keep going."],[7,"Jedi Knight","Excellent. You can feel the Force in you."],[10,"Jedi Master","Ten out of ten. Yoda, you are."]],
  qs:[
   {q:"What is Luke Skywalker's home planet?",a:["Hoth","Tatooine","Endor","Naboo"],c:1,why:"Tatooine, the desert planet with two suns."},
   {q:"Who is Luke Skywalker's father?",a:["Obi-Wan Kenobi","Emperor Palpatine","Darth Vader","Han Solo"],c:2,why:"Darth Vader, who used to be the Jedi Anakin Skywalker."},
   {q:"What color is Yoda's lightsaber?",a:["Blue","Red","Purple","Green"],c:3,why:"Green."},
   {q:"What is the name of Han Solo's ship?",a:["The Millennium Falcon","An X-wing","A TIE fighter","A Star Destroyer"],c:0,why:"The Millennium Falcon. It made the Kessel Run in less than twelve parsecs."},
   {q:"What kind of creature is Chewbacca?",a:["An Ewok","A Wookiee","A Jawa","A Hutt"],c:1,why:"A Wookiee. He's over 200 years old."},
   {q:"Which droid is gold and worries a lot?",a:["R2-D2","BB-8","C-3PO","K-2SO"],c:2,why:"C-3PO, fluent in over six million forms of communication."},
   {q:"What is the name of the Empire's moon-sized space station?",a:["The Death Star","Starkiller Base","Cloud City","The Executor"],c:0,why:"The Death Star. It had one very unfortunate exhaust port."},
   {q:"Which small, furry creatures live on the forest moon of Endor?",a:["Ewoks","Jawas","Porgs","Tusken Raiders"],c:0,why:"Ewoks. Small, fuzzy and surprisingly good at beating stormtroopers."},
   {q:"Who says, \"Do. Or do not. There is no try\"?",a:["Obi-Wan Kenobi","Yoda","Luke Skywalker","Mace Windu"],c:1,why:"Yoda, while training Luke on Dagobah."},
   {q:"What is the real name of the little green child in The Mandalorian?",a:["Grogu","Yaddle","Babu Frik","Nubs"],c:0,why:"Grogu. Most of us still call him Baby Yoda."}]},
 {id:"pixar",kind:"trivia",tags:["tv","kids"],title:"Only Real Pixar Fans Can Get 10/10 On This Quiz",dek:"Toys, fish, monsters and a rat who can cook. Ten questions about the movies everyone has watched fifty times.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Just Here For The Popcorn","You fell asleep during the credits. Every time."],[4,"Movie Night Regular","Nice. You know your Pixar."],[7,"Superfan","Excellent. You've definitely cried at Up."],[10,"Pixar Animator","Ten out of ten. Go make the next one."]],
  qs:[
   {q:"In Toy Story, what is the name of the boy who owns Woody?",a:["Sid","Andy","Bonnie","Al"],c:1,why:"Andy. His name is written on the bottom of Woody's boot."},
   {q:"In Finding Nemo, what kind of fish is Nemo?",a:["A clownfish","A blue tang","A pufferfish","An angelfish"],c:0,why:"A clownfish. Dory is the blue tang."},
   {q:"In Up, what lifts Carl's house into the sky?",a:["Rockets","A giant kite","Thousands of balloons","A tornado"],c:2,why:"Balloons. Thousands of them."},
   {q:"At the start of Monsters, Inc., what powers the monster city?",a:["Children's screams","Lightning","Candy","Dreams"],c:0,why:"Screams. By the end, they find out laughs work even better."},
   {q:"In Ratatouille, what does Remy the rat want to be?",a:["A dancer","A chef","A detective","A pilot"],c:1,why:"A chef. Anyone can cook!"},
   {q:"In The Incredibles, what does Edna Mode say heroes should never wear?",a:["Masks","Boots","Capes","Gloves"],c:2,why:"Capes. \"No capes!\""},
   {q:"In Inside Out, which emotion is blue?",a:["Fear","Anger","Disgust","Sadness"],c:3,why:"Sadness. Fear is purple, Anger is red, Disgust is green and Joy is yellow."},
   {q:"In WALL-E, what is the name of the sleek white robot WALL-E falls for?",a:["EVE","AUTO","M-O","Rosie"],c:0,why:"EVE. He says her name about a hundred times."},
   {q:"In Cars, what is Lightning McQueen's racing number?",a:["43","95","86","7"],c:1,why:"95. It's a nod to 1995, the year the first Toy Story came out."},
   {q:"In Coco, what does Miguel dream of becoming?",a:["A musician","A soccer player","A painter","A chef"],c:0,why:"A musician, even though his family has banned music."}]},
 {id:"sports",kind:"trivia",tags:["kids"],title:"Can You Score 10/10 On This Sports Quiz?",dek:"Home runs, strikes, love and marathons. Ten questions for the whole team. No benchwarmers.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Benchwarmer","Hey, somebody has to keep the bench warm."],[4,"Starting Lineup","Nice. Coach is putting you in."],[7,"All-Star","Excellent. You know your sports."],[10,"Hall Of Famer","Ten out of ten. They're making a statue of you."]],
  qs:[
   {q:"How many rings are on the Olympic flag?",a:["4","5","6","7"],c:1,why:"Five, for five parts of the world joined together."},
   {q:"How many players does a soccer team have on the field at once?",a:["9","10","11","12"],c:2,why:"Eleven, including the goalkeeper."},
   {q:"In basketball, how many points is a shot from behind the arc?",a:["1 point","3 points","2 points","4 points"],c:1,why:"Three points. That's why it's called a three-pointer."},
   {q:"Which sport has home runs?",a:["Baseball","Football","Hockey","Tennis"],c:0,why:"Baseball."},
   {q:"In tennis, what is a score of zero called?",a:["Nil","Love","Zip","Goose egg"],c:1,why:"Love. Nobody is totally sure why."},
   {q:"What is a hockey puck made of?",a:["Plastic","Wood","Rubber","Leather"],c:2,why:"Hard rubber. Pucks are frozen before games so they don't bounce."},
   {q:"How long is a marathon?",a:["10 miles","About 26.2 miles","50 miles","13.1 miles"],c:1,why:"About 26.2 miles. 13.1 miles is a half marathon."},
   {q:"Who has won the most Olympic gold medals ever?",a:["Michael Phelps","Katie Ledecky","Usain Bolt","Simone Biles"],c:0,why:"Michael Phelps, with 23 gold medals in swimming."},
   {q:"In bowling, what is it called when you knock down all ten pins with your first ball?",a:["A spare","A turkey","A split","A strike"],c:3,why:"A strike. Three strikes in a row is a turkey."},
   {q:"Where was basketball invented, in 1891?",a:["Springfield, Massachusetts","Chicago, Illinois","Toronto, Canada","New York City"],c:0,why:"Springfield, Massachusetts. A teacher named James Naismith nailed peach baskets to the wall."}]},
 {id:"usstates",kind:"trivia",tags:["kids"],title:"Only 1 In 50 People Can Get 10/10 On This U.S. States Quiz",dek:"Big ones, small ones, one shaped like a mitten. Ten questions. No looking at a map.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Lost On The Interstate","Pull over and check the map. It's fine."],[4,"Road Tripper","Nice. You've seen a few states from the back seat."],[7,"Geography Whiz","Excellent. You could teach social studies."],[10,"Walking Atlas","Ten out of ten. All fifty states salute you."]],
  qs:[
   {q:"Which state is the biggest by area?",a:["Texas","California","Alaska","Montana"],c:2,why:"Alaska. It's more than twice as big as Texas."},
   {q:"Which state is the smallest?",a:["Delaware","Rhode Island","Connecticut","Hawaii"],c:1,why:"Rhode Island."},
   {q:"Which state is made up entirely of islands?",a:["Hawaii","Florida","Maine","Michigan"],c:0,why:"Hawaii."},
   {q:"What is the capital of California?",a:["Los Angeles","San Francisco","Sacramento","San Diego"],c:2,why:"Sacramento."},
   {q:"Which state is nicknamed the Sunshine State?",a:["California","Arizona","Hawaii","Florida"],c:3,why:"Florida."},
   {q:"Which state is Mount Rushmore in?",a:["Wyoming","South Dakota","Montana","North Dakota"],c:1,why:"South Dakota, in the Black Hills."},
   {q:"Which state has the most people?",a:["Texas","New York","Florida","California"],c:3,why:"California, with about 39 million people."},
   {q:"Which state is shaped like a mitten?",a:["Michigan","Wisconsin","Ohio","Minnesota"],c:0,why:"Michigan. People there point to their hand to show where they live."},
   {q:"Which state is the Grand Canyon in?",a:["Utah","Arizona","Nevada","Colorado"],c:1,why:"Arizona."},
   {q:"How many states are there?",a:["48","50","51","52"],c:1,why:"Fifty. Alaska and Hawaii were the last to join, both in 1959."}]},
 {id:"body",kind:"trivia",tags:["kids"],title:"Only A Future Doctor Can Get 10/10 On This Human Body Quiz",dek:"Bones, blood, teeth and nails. You live in one of these. How well do you know it?",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Has A Body, Technically","You have one. You just haven't read the manual."],[4,"Nurse In Training","Nice. You know the basics."],[7,"Doctor","Excellent. You could fill out the chart yourself."],[10,"Brain Surgeon","Ten out of ten. Steady hands, big brain."]],
  qs:[
   {q:"How many bones does an adult have?",a:["106","206","306","2,006"],c:1,why:"206."},
   {q:"What is the biggest organ in your body?",a:["Liver","Brain","Skin","Lungs"],c:2,why:"Your skin. It's an organ, and it's the biggest one."},
   {q:"What pumps blood around your body?",a:["Your heart","Your lungs","Your kidneys","Your stomach"],c:0,why:"Your heart, all day and all night."},
   {q:"Where is the smallest bone in your body?",a:["In your toe","In your ear","In your nose","In your finger"],c:1,why:"In your ear. It's called the stirrup and it's about the size of a grain of rice."},
   {q:"About how many times does your heart beat in one day?",a:["About 1,000","About 10,000","About 100,000","About 1 million"],c:2,why:"About 100,000 times."},
   {q:"What are your fingernails made of?",a:["Bone","Keratin","Calcium","Cartilage"],c:1,why:"Keratin, the same stuff as your hair and a rhino's horn."},
   {q:"Which blood cells fight germs?",a:["Red blood cells","Platelets","White blood cells","Plasma"],c:2,why:"White blood cells, your body's tiny army."},
   {q:"How many teeth does an adult usually have?",a:["20","28","32","40"],c:2,why:"32, counting wisdom teeth. Kids have 20 baby teeth."},
   {q:"What does the diaphragm help you do?",a:["Breathe","See","Digest food","Walk"],c:0,why:"Breathe. It's a muscle under your lungs. Hiccups are your diaphragm twitching."},
   {q:"About how many bones is a baby born with?",a:["About 100","About 200","About 300","About 400"],c:2,why:"About 300. Some of them join together as you grow."}]},
 {id:"earth",kind:"trivia",tags:["kids"],title:"Only A True Rock Star Can Get 10/10 On This Volcano And Earth Quiz",dek:"Lava, earthquakes, deserts and rainbows. Ten questions about the planet under your feet.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Pebble","Small, but solid. You'll grow."],[4,"Rock Collector","Nice. You've got a few good ones in your pocket."],[7,"Geologist","Excellent. You know your rocks."],[10,"Volcano Expert","Ten out of ten. You are hot stuff."]],
  qs:[
   {q:"What is melted rock called while it's still underground?",a:["Lava","Magma","Basalt","Ash"],c:1,why:"Magma. Once it comes out of the ground, it's called lava."},
   {q:"What is the tallest mountain above sea level?",a:["Mount Everest","K2","Denali","Kilimanjaro"],c:0,why:"Mount Everest, about 29,000 feet high."},
   {q:"Which ocean is the biggest?",a:["Atlantic","Indian","Pacific","Arctic"],c:2,why:"The Pacific. It's bigger than all the land on Earth put together."},
   {q:"What machine measures earthquakes?",a:["A barometer","A seismometer","A thermometer","A telescope"],c:1,why:"A seismometer."},
   {q:"What is the Ring of Fire?",a:["A circle of volcanoes around the Pacific Ocean","A ring around the Sun","A desert in Africa","A circus trick"],c:0,why:"A horseshoe of volcanoes and earthquake zones around the Pacific Ocean."},
   {q:"What is the very middle of the Earth called?",a:["The mantle","The crust","The inner core","The magma chamber"],c:2,why:"The inner core, a ball of iron and nickel about as hot as the surface of the Sun."},
   {q:"Which layer of the Earth do we live on?",a:["The core","The mantle","The outer core","The crust"],c:3,why:"The crust. It's thinner than you'd think."},
   {q:"What makes a rainbow?",a:["Clouds reflecting the ground","Sunlight bending through raindrops","Moonlight","Dust in the air"],c:1,why:"Sunlight bending through raindrops and splitting into colors."},
   {q:"What is the biggest desert in the world?",a:["The Sahara","The Gobi","Antarctica","The Mojave"],c:2,why:"Antarctica. A desert is any place that gets very little rain or snow."},
   {q:"Which volcano buried the Roman town of Pompeii?",a:["Mount Etna","Mount Vesuvius","Mount Fuji","Mount St. Helens"],c:1,why:"Mount Vesuvius, in the year 79."}]},
 {id:"ocean",kind:"trivia",tags:["kids"],title:"Can You Dive Deep Enough To Get 10/10 On This Ocean Quiz?",dek:"Octopus hearts, blue blood and otters holding hands. Ten questions from under the waves.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Still Wearing Floaties","Stay in the shallow end for now."],[4,"Snorkeler","Nice. You've seen a few fish."],[7,"Scuba Diver","Excellent. You've been down deep."],[10,"Ocean Explorer","Ten out of ten. The whales know your name."]],
  qs:[
   {q:"What is the biggest animal that has ever lived?",a:["Megalodon","Blue whale","Giant squid","Whale shark"],c:1,why:"The blue whale. It's bigger than any dinosaur ever was."},
   {q:"How many hearts does an octopus have?",a:["1","2","3","8"],c:2,why:"Three. Two pump blood to the gills, one pumps it around the body."},
   {q:"What is the deepest place in the ocean?",a:["The Mariana Trench","The Bermuda Triangle","The Great Barrier Reef","The Dead Sea"],c:0,why:"The Mariana Trench, almost seven miles down."},
   {q:"What is a group of jellyfish called?",a:["A pod","A school","A smack","A gaggle"],c:2,why:"A smack. Or a bloom. Both are real."},
   {q:"Which of these is NOT a fish?",a:["Seahorse","Starfish","Clownfish","Eel"],c:1,why:"The starfish. Scientists call it a sea star, and it's related to sea urchins."},
   {q:"How do dolphins sleep?",a:["Upside down","With half of their brain at a time","In underwater caves","They never sleep"],c:1,why:"Half of their brain at a time, so they can keep swimming and breathing."},
   {q:"What color is lobster blood?",a:["Red","Green","Blue","Yellow"],c:2,why:"Blue. It has copper in it instead of iron."},
   {q:"What is the biggest coral reef in the world?",a:["The Great Barrier Reef","The Belize Barrier Reef","The Florida Reef","The Red Sea Reef"],c:0,why:"The Great Barrier Reef, off Australia. You can see it from space."},
   {q:"What do sea otters sometimes do while they sleep so they don't drift apart?",a:["Hold rocks","Hum","Hold hands","Bite each other's tails"],c:2,why:"They hold hands. They also wrap themselves in seaweed."},
   {q:"About how much of Earth's surface is covered by ocean?",a:["About half","About 71 percent","About 90 percent","About a third"],c:1,why:"About 71 percent."}]},
 {id:"retrogames",kind:"trivia",tags:["games","nostalgia","kids"],title:"Only A True Gamer Can Get 10/10 On This Classic Video Game Quiz",dek:"Ghosts, blocks, frogs and hedgehogs. Ten questions from the arcade and the living room floor.",badge:"Games",author:"Fuzz",
  tiers:[[0,"Game Over","Insert another coin and try again."],[4,"Player One","Nice. You've logged some hours."],[7,"High Scorer","Excellent. Your initials are on the leaderboard."],[10,"Final Boss","Ten out of ten. Nobody can beat you."]],
  qs:[
   {q:"Which of these is NOT a Pac-Man ghost?",a:["Blinky","Pinky","Clyde","Sparky"],c:3,why:"Sparky. The four ghosts are Blinky, Pinky, Inky and Clyde."},
   {q:"Which is the best-selling video game of all time?",a:["Tetris","Minecraft","Pac-Man","Wii Sports"],c:1,why:"Minecraft, with more than 300 million copies sold."},
   {q:"What color is Sonic the Hedgehog?",a:["Red","Green","Blue","Yellow"],c:2,why:"Blue. Knuckles is the red one."},
   {q:"What are the falling shapes in Tetris called?",a:["Tetrominoes","Blockbusters","Pixels","Bricklets"],c:0,why:"Tetrominoes, shapes made of four squares."},
   {q:"What does NES stand for?",a:["New Electronic System","Nintendo Entertainment System","Nintendo Electric Screen","National Entertainment Set"],c:1,why:"Nintendo Entertainment System. It came to America in 1985."},
   {q:"In which game do you help a frog cross a busy road?",a:["Frogger","Hopper","Road Runner","Leap Year"],c:0,why:"Frogger, from 1981."},
   {q:"In The Legend of Zelda, what is the hero's name?",a:["Zelda","Ganon","Link","Epona"],c:2,why:"Link. Zelda is the princess."},
   {q:"In what year did Donkey Kong first come out in arcades?",a:["1975","1981","1990","1996"],c:1,why:"1981. It's also the first game with Mario in it."},
   {q:"Which company made the PlayStation?",a:["Nintendo","Sega","Sony","Microsoft"],c:2,why:"Sony."},
   {q:"What do you shoot at in Space Invaders?",a:["Asteroids","Rows of aliens","Ducks","Zombies"],c:1,why:"Rows of aliens that get faster as you go."}]},
 {id:"riddles",kind:"trivia",tags:["kids"],title:"Can You Solve These 10 Riddles That Stump Most Grown-Ups?",dek:"Think sideways. Then think sideways again. Ten classic riddles for the whole family.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Totally Stumped","Riddles are tricky. Try them on your parents next."],[4,"Clever Cookie","Nice. Your brain bends the right way."],[7,"Puzzle Master","Excellent. Nothing gets past you."],[10,"The Sphinx","Ten out of ten. You should be asking the riddles."]],
  qs:[
   {q:"What has keys but can't open a single lock?",a:["A piano","A map","A jail","A tree"],c:0,why:"A piano."},
   {q:"What gets wetter the more it dries?",a:["A sponge","A towel","A fish","Rain"],c:1,why:"A towel."},
   {q:"What goes up but never comes down?",a:["A balloon","Your age","Smoke","A rocket"],c:1,why:"Your age."},
   {q:"What has hands but can't clap?",a:["A robot","A glove","A clock","A tree"],c:2,why:"A clock."},
   {q:"What can you catch but never throw?",a:["A ball","A fish","A cold","A frisbee"],c:2,why:"A cold."},
   {q:"What has one eye but can't see?",a:["A pirate","A needle","A cyclops","A storm"],c:1,why:"A needle. A storm has an eye too, but needles are the classic answer."},
   {q:"What has a neck but no head?",a:["A bottle","A snake","A pencil","A sock"],c:0,why:"A bottle."},
   {q:"What runs but never walks?",a:["A turtle","A chair","A book","A river"],c:3,why:"A river."},
   {q:"The more you take, the more you leave behind. What are they?",a:["Cookies","Footsteps","Photos","Naps"],c:1,why:"Footsteps."},
   {q:"What has lots of teeth but can't bite?",a:["A shark","A comb","A dog","A dentist"],c:1,why:"A comb."}]},
 {id:"holidays",kind:"trivia",tags:["kids"],title:"Can You Get 10/10 On This Holiday Quiz?",dek:"Pumpkins, turkeys, groundhogs and lights. Ten questions about the best days of the year.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Grinch","You were busy that day. Every day."],[4,"Party Guest","Nice. You show up for the cake."],[7,"Party Planner","Excellent. You know every holiday on the calendar."],[10,"Holiday Legend","Ten out of ten. Every day should be a party."]],
  qs:[
   {q:"On July 4, 1776, the United States declared independence from which country?",a:["France","Spain","Great Britain","Germany"],c:2,why:"Great Britain."},
   {q:"Which holiday is famous for carved pumpkins?",a:["Thanksgiving","Halloween","Easter","Labor Day"],c:1,why:"Halloween. They're called jack-o'-lanterns."},
   {q:"What does Punxsutawney Phil predict on Groundhog Day?",a:["How much longer winter will last","Rain","Who wins the Super Bowl","Snow days"],c:0,why:"If he sees his shadow, six more weeks of winter. If not, early spring."},
   {q:"Which bird do many American families eat on Thanksgiving?",a:["Chicken","Duck","Turkey","Goose"],c:2,why:"Turkey. About 46 million of them every Thanksgiving."},
   {q:"Where does Santa Claus live, according to the stories?",a:["The South Pole","The North Pole","Iceland","Canada"],c:1,why:"The North Pole."},
   {q:"What is the eight-night Jewish Festival of Lights called?",a:["Passover","Purim","Hanukkah","Rosh Hashanah"],c:2,why:"Hanukkah. One more candle on the menorah each night."},
   {q:"Which Festival of Lights is celebrated by millions of Hindus, Sikhs and Jains?",a:["Holi","Diwali","Eid","Vesak"],c:1,why:"Diwali, with lamps, sweets and fireworks."},
   {q:"What is another name for Chinese New Year?",a:["The Spring Festival","Moon Day","Dragon Night","Kite Week"],c:0,why:"The Spring Festival."},
   {q:"Which month is Valentine's Day in?",a:["January","February","March","May"],c:1,why:"February. The 14th."},
   {q:"Día de los Muertos, the Day of the Dead, is a famous celebration in which country?",a:["Spain","Brazil","Mexico","Peru"],c:2,why:"Mexico, with marigolds, sugar skulls and photos of loved ones."}]},
 {id:"inventions",kind:"trivia",tags:["kids"],title:"Only A Genius Can Get 10/10 On This Inventions Quiz",dek:"Phones, planes, popsicles and Super Soakers. Who made what? Ten questions about big ideas.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Still Reading The Instructions","Every inventor starts somewhere."],[4,"Tinkerer","Nice. You like knowing how stuff works."],[7,"Inventor","Excellent. Got any patents?"],[10,"Mad Scientist","Ten out of ten. Your lab is waiting."]],
  qs:[
   {q:"Who got the first patent for the telephone?",a:["Thomas Edison","Alexander Graham Bell","Nikola Tesla","Benjamin Franklin"],c:1,why:"Alexander Graham Bell, in 1876."},
   {q:"Who flew the first airplane, in 1903?",a:["The Wright brothers","Amelia Earhart","Charles Lindbergh","Henry Ford"],c:0,why:"Orville and Wilbur Wright, at Kitty Hawk, North Carolina. The first flight lasted 12 seconds."},
   {q:"What did Johannes Gutenberg invent around 1440?",a:["The telescope","A printing press with movable type","The compass","Eyeglasses"],c:1,why:"A printing press with movable type, which made books much cheaper."},
   {q:"Which medicine was discovered by accident when mold killed some bacteria?",a:["Aspirin","Penicillin","Cough syrup","Vitamin C"],c:1,why:"Penicillin, found by Alexander Fleming in 1928."},
   {q:"The inventor of the Slinky was an engineer working on what?",a:["A toy","A hair curler","Springs for ship equipment","A phone cord"],c:2,why:"Springs to keep ship equipment steady. One fell off a shelf and kept going."},
   {q:"Who invented the popsicle, according to the story?",a:["A famous chef","An 11-year-old kid","An ice cream company","A scientist"],c:1,why:"Frank Epperson, age 11, left a drink with a stirring stick outside on a cold night."},
   {q:"Which of these was invented first?",a:["The car","The airplane","The bicycle","The television"],c:2,why:"The bicycle. The first one, from 1817, had no pedals. You pushed it with your feet."},
   {q:"Which of these did Thomas Edison invent?",a:["The radio","The telephone","The phonograph","The television"],c:2,why:"The phonograph, the first machine that could record and play back sound."},
   {q:"George Washington Carver found hundreds of uses for which plant?",a:["Corn","The peanut","Cotton","Apples"],c:1,why:"The peanut. Around 300 uses."},
   {q:"The inventor of the Super Soaker also worked for which organization?",a:["NASA","Disney","McDonald's","A bank"],c:0,why:"NASA. Lonnie Johnson worked on spacecraft before inventing the Super Soaker."}]},
 {id:"egypt",kind:"trivia",tags:["kids"],title:"Can You Get 10/10 On This Ancient Egypt Quiz?",dek:"Mummies, pyramids, pharaohs and a very famous cat. Ten questions from 5,000 years ago.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Lost In The Pyramid","Follow the torchlight. Mind the traps."],[4,"Tomb Explorer","Nice. You found a few treasures."],[7,"Archaeologist","Excellent. You should be digging in the desert."],[10,"Pharaoh","Ten out of ten. Bow down, everyone."]],
  qs:[
   {q:"Which river was Ancient Egypt built along?",a:["The Amazon","The Nile","The Tigris","The Ganges"],c:1,why:"The Nile, the longest river in Africa."},
   {q:"What were mummies wrapped in?",a:["Linen bandages","Paper","Leaves","Leather"],c:0,why:"Strips of linen, sometimes hundreds of feet of it."},
   {q:"What were the kings of Ancient Egypt called?",a:["Emperors","Pharaohs","Sultans","Czars"],c:1,why:"Pharaohs."},
   {q:"Whose tomb was found almost untouched, full of treasure, in 1922?",a:["Ramses II","Khufu","Tutankhamun","Akhenaten"],c:2,why:"Tutankhamun, the boy king, who became pharaoh at about age nine."},
   {q:"What is the giant statue with a lion's body and a human head?",a:["The Colossus","The Griffin","The Great Sphinx","The Obelisk"],c:2,why:"The Great Sphinx of Giza."},
   {q:"What was the Egyptian writing made of little pictures called?",a:["Hieroglyphs","Cuneiform","Runes","Emoji"],c:0,why:"Hieroglyphs."},
   {q:"Which animal was especially loved and honored in Ancient Egypt?",a:["Pigs","Cats","Horses","Dogs"],c:1,why:"Cats. Some were even made into mummies."},
   {q:"Which stone helped experts finally read hieroglyphs?",a:["The Rosetta Stone","The Blarney Stone","The Moonstone","The Kidney Stone"],c:0,why:"The Rosetta Stone. It has the same message in three kinds of writing."},
   {q:"The Great Pyramid of Giza was built for which pharaoh?",a:["Tutankhamun","Cleopatra","Khufu","Ramses II"],c:2,why:"Khufu, about 4,500 years ago."},
   {q:"When making a mummy, which organ did Egyptians usually leave inside the body?",a:["The brain","The heart","The stomach","The lungs"],c:1,why:"The heart. They believed it would be weighed in the afterlife."}]},
 {id:"money",kind:"trivia",tags:["kids"],title:"Can You Name Whose Face Is On U.S. Money?",dek:"You've held these a hundred times. But who's on them? Ten bills and coins. Show us the money.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Piggy Bank","Empty, for now. Start saving."],[4,"Allowance Expert","Nice. You know what's in your wallet."],[7,"Banker","Excellent. You can count it and name it."],[10,"U.S. Treasurer","Ten out of ten. Your signature goes on the bills."]],
  qs:[
   {q:"Whose face is on the one dollar bill?",a:["Abraham Lincoln","George Washington","Thomas Jefferson","Benjamin Franklin"],c:1,why:"George Washington, the first president."},
   {q:"Whose face is on the five dollar bill?",a:["Andrew Jackson","Abraham Lincoln","Ulysses S. Grant","Alexander Hamilton"],c:1,why:"Abraham Lincoln."},
   {q:"Whose face is on the ten dollar bill?",a:["George Washington","Andrew Jackson","Alexander Hamilton","Thomas Jefferson"],c:2,why:"Alexander Hamilton. He was never president. He was the first Secretary of the Treasury."},
   {q:"Whose face is on the twenty dollar bill?",a:["Andrew Jackson","Ulysses S. Grant","Benjamin Franklin","Abraham Lincoln"],c:0,why:"Andrew Jackson."},
   {q:"Whose face is on the fifty dollar bill?",a:["Theodore Roosevelt","Ulysses S. Grant","John Adams","James Madison"],c:1,why:"Ulysses S. Grant, the Civil War general who became president."},
   {q:"Whose face is on the hundred dollar bill?",a:["George Washington","John F. Kennedy","Abraham Lincoln","Benjamin Franklin"],c:3,why:"Benjamin Franklin. He was never president either."},
   {q:"Whose face is on the penny?",a:["Thomas Jefferson","Abraham Lincoln","Franklin D. Roosevelt","George Washington"],c:1,why:"Abraham Lincoln."},
   {q:"Whose face is on the nickel?",a:["Thomas Jefferson","John Adams","Theodore Roosevelt","James Madison"],c:0,why:"Thomas Jefferson. His house, Monticello, is on the back."},
   {q:"Whose face is on the dime?",a:["John F. Kennedy","George Washington","Franklin D. Roosevelt","Theodore Roosevelt"],c:2,why:"Franklin D. Roosevelt, who helped start the March of Dimes."},
   {q:"Whose face is on the quarter?",a:["Abraham Lincoln","George Washington","Thomas Jefferson","John Adams"],c:1,why:"George Washington."}]},
 {id:"myths",kind:"trivia",tags:["kids"],title:"Only A True Hero Can Get 10/10 On This Greek Myths Quiz",dek:"Gods, monsters, wax wings and a very big wooden horse. Ten questions from Mount Olympus.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Mere Mortal","The gods have not noticed you yet. Maybe that's for the best."],[4,"Demigod","Nice. Half hero, half quiz whiz."],[7,"Hero Of Legend","Excellent. They'll write poems about you."],[10,"Zeus Himself","Ten out of ten. Thunderbolts all around."]],
  qs:[
   {q:"Who is the king of the Greek gods?",a:["Poseidon","Zeus","Hades","Apollo"],c:1,why:"Zeus, god of the sky and thunder."},
   {q:"Who has snakes for hair?",a:["Medusa","Athena","Hera","Circe"],c:0,why:"Medusa. One look turns you to stone."},
   {q:"What creature is half man and half bull?",a:["A centaur","The Minotaur","A satyr","A cyclops"],c:1,why:"The Minotaur, who lived in a maze called the Labyrinth."},
   {q:"Who is the god of the sea?",a:["Ares","Hermes","Poseidon","Hades"],c:2,why:"Poseidon, with his three-pronged trident."},
   {q:"What did the Greeks hide inside to sneak into the city of Troy?",a:["A giant ship","A giant wooden horse","A giant cake","A giant shield"],c:1,why:"A giant wooden horse, the Trojan Horse."},
   {q:"How many heads does Cerberus, the guard dog of the underworld, have?",a:["One","Two","Three","Seven"],c:2,why:"Three."},
   {q:"Who flew too close to the sun on wings made of feathers and wax?",a:["Icarus","Perseus","Hercules","Jason"],c:0,why:"Icarus. The wax melted."},
   {q:"What did Pandora open that let all the troubles into the world?",a:["A door","A jar","A book","A cave"],c:1,why:"A jar. Over time, the story turned it into a box. Hope stayed inside."},
   {q:"Which messenger god wore winged sandals?",a:["Apollo","Dionysus","Hermes","Ares"],c:2,why:"Hermes."},
   {q:"How many labors did Hercules have to complete?",a:["3","7","12","100"],c:2,why:"Twelve, including fighting a lion and cleaning some extremely dirty stables."}]},
 {id:"photodogs",kind:"trivia",tags:["photo","kids"],title:"Can You Name These 10 Dog Breeds From Just A Photo?",dek:"Spots, wrinkles, fluff and very short legs. Ten good dogs. Who's a good guesser?",badge:"Photo quiz",author:"Fuzz",
  tiers:[[0,"Cat Person","That's allowed. We won't tell the dogs."],[4,"Dog Walker","Nice. You know a few of the neighborhood pups."],[7,"Dog Show Judge","Excellent. Best in show."],[10,"Top Dog","Ten out of ten. Every dog in town wags when you walk by."]],
  qs:[
   {q:"What breed is this?",img:"Dalmatian (dog)",hint:"White with black spots. Famous for riding on fire trucks.",a:["Dalmatian","Great Dane","Pointer","Beagle"],c:0,why:"A Dalmatian. The puppies are born all white and get their spots later."},
   {q:"What breed is this?",img:"Pug",hint:"A small dog with a squished face and a curly tail.",a:["Bulldog","Pug","Boxer","Shih Tzu"],c:1,why:"A pug. A group of pugs is called a grumble."},
   {q:"What breed is this?",img:"Dachshund",hint:"Long body, short legs. Nicknamed the wiener dog.",a:["Corgi","Basset Hound","Dachshund","Beagle"],c:2,why:"A dachshund, bred to chase badgers into their holes."},
   {q:"What breed is this?",img:"Siberian Husky",hint:"A snow dog, often with blue eyes, bred to pull sleds.",a:["Samoyed","Golden Retriever","Siberian Husky","Akita"],c:2,why:"A Siberian Husky."},
   {q:"What breed is this?",img:"Poodle",hint:"Curly fur, often given a fancy haircut.",a:["Poodle","Bichon Frise","Schnauzer","Collie"],c:0,why:"A poodle, one of the smartest dog breeds."},
   {q:"What breed is this?",img:"Beagle",hint:"A floppy-eared hound with an amazing nose. Snoopy is one.",a:["Basset Hound","Beagle","Boxer","Jack Russell Terrier"],c:1,why:"A beagle, just like Snoopy."},
   {q:"What breed is this?",img:"German Shepherd",hint:"Smart, brave and often a police dog.",a:["Doberman","Rottweiler","German Shepherd","Husky"],c:2,why:"A German Shepherd."},
   {q:"What breed is this?",img:"Pembroke Welsh Corgi",hint:"Short legs, big ears and a fluffy rear end.",a:["Corgi","Shiba Inu","Dachshund","Pomeranian"],c:0,why:"A Pembroke Welsh Corgi, bred to herd cows by nipping at their heels."},
   {q:"What breed is this?",img:"Chihuahua (dog)",hint:"The smallest dog breed in the world.",a:["Pomeranian","Chihuahua","Yorkshire Terrier","Pug"],c:1,why:"A Chihuahua, named after a state in Mexico."},
   {q:"What breed is this?",img:"Great Dane",hint:"One of the tallest dogs. Scooby-Doo is one.",a:["Mastiff","Greyhound","Dalmatian","Great Dane"],c:3,why:"A Great Dane, like Scooby-Doo."}]},
 {id:"photofruit",kind:"trivia",tags:["photo","food","kids"],title:"Can You Name These 10 Weird Fruits From A Photo?",dek:"Spiky, hairy, star-shaped and one that looks like a hand. Real fruits from around the world.",badge:"Photo quiz",author:"Fuzz",
  tiers:[[0,"Apples Only, Please","Totally fair. Apples are great."],[4,"Smoothie Fan","Nice. You've tried a few fancy fruits."],[7,"Fruit Explorer","Excellent. You'd find the good stuff at any market."],[10,"Fruit Ninja","Ten out of ten. Slice, slice, slice."]],
  qs:[
   {q:"What fruit is this?",img:"Pitaya",hint:"Bright pink skin with green flames. White inside with tiny black seeds.",a:["Dragon fruit","Star fruit","Lychee","Passion fruit"],c:0,why:"Dragon fruit, which grows on a cactus."},
   {q:"What fruit is this?",img:"Durian",hint:"Covered in spikes and famous for its stinky smell.",a:["Jackfruit","Durian","Pineapple","Horned melon"],c:1,why:"Durian. It smells so strong that some hotels and trains ban it."},
   {q:"What fruit is this?",img:"Rambutan",hint:"Red and hairy on the outside, sweet and white inside.",a:["Lychee","Strawberry","Rambutan","Mangosteen"],c:2,why:"Rambutan. The name comes from a word for hair."},
   {q:"What fruit is this?",img:"Kiwifruit",hint:"Fuzzy and brown outside, bright green inside.",a:["Avocado","Kiwi","Lime","Gooseberry"],c:1,why:"A kiwi. You can eat the fuzzy skin, too."},
   {q:"What fruit is this?",img:"Carambola",hint:"Slice it and every piece is a star.",a:["Papaya","Banana","Star fruit","Quince"],c:2,why:"Star fruit."},
   {q:"What fruit is this?",img:"Pomegranate",hint:"Full of hundreds of juicy red seeds.",a:["Pomegranate","Red apple","Persimmon","Fig"],c:0,why:"A pomegranate. One can have more than 600 seeds."},
   {q:"What fruit is this?",img:"Lychee",hint:"Bumpy pink-red skin, see-through white fruit inside.",a:["Rambutan","Lychee","Grape","Cherry"],c:1,why:"A lychee."},
   {q:"What fruit is this?",img:"Jackfruit",hint:"The biggest fruit that grows on trees. One can weigh as much as a big dog.",a:["Durian","Breadfruit","Jackfruit","Watermelon"],c:2,why:"Jackfruit. Some people cook it to taste like pulled pork."},
   {q:"What fruit is this?",img:"Cucumis metuliferus",hint:"Orange and spiky outside, green jelly inside. Also called kiwano.",a:["Dragon fruit","Durian","Mango","Horned melon"],c:3,why:"A horned melon, also called a kiwano."},
   {q:"What fruit is this?",img:"Buddha's hand",hint:"A lemon-like fruit shaped like a bunch of fingers.",a:["Ginger root","Buddha's hand","Banana bunch","Lemon"],c:1,why:"Buddha's hand, a citrus fruit that's almost all peel and smells amazing."}]},
 {id:"photoart",kind:"trivia",tags:["photo","kids"],title:"Can You Name These 10 Famous Paintings?",dek:"You've seen them on posters, mugs and memes. Do you know what they're called? Ten masterpieces.",badge:"Photo quiz",author:"Fuzz",
  tiers:[[0,"Fridge Artist","Your best work is on the fridge, and that counts."],[4,"Museum Visitor","Nice. You've walked through a gallery or two."],[7,"Art Expert","Excellent. You know your masterpieces."],[10,"Old Master","Ten out of ten. Frame this score."]],
  qs:[
   {q:"What is this famous painting called?",img:"Mona Lisa",hint:"A woman with a mysterious smile, painted by Leonardo da Vinci.",a:["The Mona Lisa","Girl with a Pearl Earring","The Last Supper","Lady with a Fan"],c:0,why:"The Mona Lisa, by Leonardo da Vinci. It hangs in the Louvre in Paris behind bulletproof glass."},
   {q:"Who painted this?",img:"The Starry Night",hint:"Swirling stars over a sleepy village.",a:["Claude Monet","Vincent van Gogh","Pablo Picasso","Leonardo da Vinci"],c:1,why:"Vincent van Gogh painted The Starry Night in 1889."},
   {q:"What is this famous Japanese print called?",img:"The Great Wave off Kanagawa",hint:"A giant wave curling over little boats, with a mountain far away.",a:["Mount Fuji at Night","The Storm","The Great Wave off Kanagawa","The Red Sun"],c:2,why:"The Great Wave off Kanagawa, by Hokusai, from around 1831."},
   {q:"What is this painting called?",img:"The Scream",hint:"A figure on a bridge holding its face under a swirling orange sky.",a:["The Shout","The Scream","The Ghost","The Bridge"],c:1,why:"The Scream, by Edvard Munch."},
   {q:"What is this painting called?",img:"Girl with a Pearl Earring",hint:"A girl in a blue and yellow head wrap, looking over her shoulder.",a:["Girl with a Pearl Earring","The Mona Lisa","The Milkmaid","Girl in a Blue Hat"],c:0,why:"Girl with a Pearl Earring, by Johannes Vermeer."},
   {q:"What is this painting called?",img:"The Birth of Venus",hint:"A goddess standing on a giant seashell.",a:["Spring","The Little Mermaid","The Seashell","The Birth of Venus"],c:3,why:"The Birth of Venus, by Sandro Botticelli, from the 1480s."},
   {q:"This huge painting is called The Night Watch. Who painted it?",img:"The Night Watch",hint:"A big group of soldiers in a dark scene with one bright figure.",a:["Rembrandt","Michelangelo","Van Gogh","Monet"],c:0,why:"Rembrandt. The painting is about 12 feet wide."},
   {q:"This painting is made of lots of tiny what?",img:"A Sunday Afternoon on the Island of La Grande Jatte",hint:"People relaxing in a park by a river, made from tiny marks.",a:["Threads","Dots","Tiles","Stickers"],c:1,why:"Dots. Georges Seurat painted it with tiny dots of color. It's called pointillism."},
   {q:"Which flowers did Van Gogh paint here?",img:"Sunflowers (Van Gogh series)",hint:"Big yellow flowers in a vase.",a:["Daisies","Roses","Sunflowers","Tulips"],c:2,why:"Sunflowers. He painted them again and again."},
   {q:"Claude Monet made about 250 paintings of what?",img:"Water Lilies (Monet series)",hint:"Flowers floating on a pond.",a:["Water lilies","His cat","Apples","Ships"],c:0,why:"Water lilies, in the pond at his garden in Giverny, France."}]},
 {id:"photofaces",kind:"trivia",tags:["photo","kids"],title:"Can You Name These 10 Famous Faces From History?",dek:"Inventors, explorers, scientists and heroes. They changed the world. Do you know their faces?",badge:"Photo quiz",author:"Fuzz",
  tiers:[[0,"Time Traveler, Lost","You went back in time and forgot to take notes."],[4,"History Buff","Nice. You know a few famous faces."],[7,"History Teacher","Excellent. Class is in session."],[10,"Living Museum","Ten out of ten. They should put you in a glass case."]],
  qs:[
   {q:"Who is this?",img:"Abraham Lincoln",hint:"The 16th president, famous for his beard and tall hat.",a:["George Washington","Abraham Lincoln","Ulysses S. Grant","Thomas Jefferson"],c:1,why:"Abraham Lincoln, the 16th president."},
   {q:"Who is this?",img:"Albert Einstein",hint:"A scientist with wild white hair, famous for E = mc².",a:["Albert Einstein","Isaac Newton","Thomas Edison","Mark Twain"],c:0,why:"Albert Einstein. He famously never wore socks."},
   {q:"Who is this?",img:"Marie Curie",hint:"A scientist who studied radioactivity and won two Nobel Prizes.",a:["Florence Nightingale","Amelia Earhart","Marie Curie","Ada Lovelace"],c:2,why:"Marie Curie, the first person to win two Nobel Prizes."},
   {q:"Who is this?",img:"Martin Luther King Jr.",hint:"A civil rights leader who gave the \"I Have a Dream\" speech.",a:["Frederick Douglass","Barack Obama","Malcolm X","Martin Luther King Jr."],c:3,why:"Martin Luther King Jr. He gave his famous speech in Washington, D.C., in 1963."},
   {q:"Who is this?",img:"Amelia Earhart",hint:"The first woman to fly a plane alone across the Atlantic Ocean.",a:["Amelia Earhart","Marie Curie","Rosa Parks","Eleanor Roosevelt"],c:0,why:"Amelia Earhart, the first woman to fly solo across the Atlantic, in 1932."},
   {q:"Who is this?",img:"Harriet Tubman",hint:"She led enslaved people to freedom on the Underground Railroad.",a:["Rosa Parks","Harriet Tubman","Sojourner Truth","Maya Angelou"],c:1,why:"Harriet Tubman. She escaped slavery, then went back again and again to lead others to freedom."},
   {q:"Who is this?",img:"Neil Armstrong",hint:"The first person to walk on the Moon.",a:["Buzz Aldrin","Neil Armstrong","John Glenn","Yuri Gagarin"],c:1,why:"Neil Armstrong. One small step, in 1969."},
   {q:"Who is this?",img:"Mahatma Gandhi",hint:"He led India to independence through peaceful protest.",a:["Nelson Mandela","Martin Luther King Jr.","Mahatma Gandhi","Jawaharlal Nehru"],c:2,why:"Mahatma Gandhi."},
   {q:"Who is this?",img:"Leonardo da Vinci",hint:"The artist who painted the Mona Lisa and drew flying machines.",a:["Leonardo da Vinci","Michelangelo","Galileo Galilei","William Shakespeare"],c:0,why:"Leonardo da Vinci, painter, inventor and serious note-taker."},
   {q:"Who is this?",img:"Thomas Edison",hint:"An inventor famous for the light bulb and the phonograph.",a:["Henry Ford","Alexander Graham Bell","Thomas Edison","Nikola Tesla"],c:2,why:"Thomas Edison, who held more than 1,000 patents."}]},
 {id:"hogwarts",kind:"personality",tags:["tv","kids"],title:"Which Hogwarts House Do You Really Belong In?",dek:"The Sorting Hat is busy, so Fuzz is filling in. Six questions. No arguing with the hat.",badge:"Quiz",author:"Fuzz",
  results:{
   gry:{t:"Gryffindor",d:"Brave, bold and maybe a little reckless. You run toward trouble while everyone else runs away. Your common room is up a lot of stairs, but you take them two at a time."},
   huf:{t:"Hufflepuff",d:"Kind, loyal and the best friend anyone could ask for. Your common room is right next to the kitchens, which is the best spot in the whole castle."},
   rav:{t:"Ravenclaw",d:"Curious, clever and always asking why. To get into your common room you have to answer a riddle, and that's exactly how you like it."},
   sly:{t:"Slytherin",d:"Ambitious, determined and always one step ahead. Your common room is under the lake, so you get to watch the giant squid float past the windows."}},
  qs:[
   {q:"Pick a pet to bring to Hogwarts:",a:[["A brave owl",{gry:3}],["A cozy cat",{huf:3}],["A clever raven",{rav:3}],["A sneaky snake",{sly:3}],["A toad, and I'll lose it",{huf:2,gry:1}],["A phoenix, obviously",{gry:1,sly:2}]]},
   {q:"Which class are you most excited for?",a:[["Defense Against the Dark Arts",{gry:3}],["Herbology",{huf:3}],["Charms",{rav:3}],["Potions",{sly:3}],["Care of Magical Creatures",{huf:1,rav:1,gry:1}],["Astronomy",{rav:2,sly:1}]]},
   {q:"You find a lost wand in the hallway. You:",a:[["Chase down whoever dropped it",{gry:3}],["Hand it in to a teacher",{huf:3}],["Study it first. What wood is it?",{rav:3}],["Keep it. Finders keepers.",{sly:3}],["Make a poster: FOUND WAND",{huf:2,rav:1}],["Try one spell with it, just once",{gry:1,sly:2}]]},
   {q:"What would you see in the Mirror of Erised?",a:[["Me, saving the day",{gry:3}],["Everyone I love, together",{huf:3}],["Me, knowing everything",{rav:3}],["Me, in charge of everything",{sly:3}],["A mountain of Chocolate Frogs",{huf:2,sly:1}],["Me, lifting the Quidditch Cup",{gry:2,sly:1}]]},
   {q:"Pick a snack from the trolley:",a:[["A warm pumpkin pasty",{huf:3}],["A Chocolate Frog, for the card",{rav:3}],["Fizzing Whizbees. I want to float.",{gry:3}],["Whatever is most expensive",{sly:3}],["A bit of everything, to share",{huf:1,rav:2}],["Every Flavor Beans. I like danger.",{gry:1,sly:2}]]},
   {q:"What do you want people to say about you?",a:[["Brave",{gry:3}],["Kind",{huf:3}],["Brilliant",{rav:3}],["Powerful",{sly:3}],["Loyal",{huf:2,gry:1}],["Unforgettable",{sly:2,rav:1}]]}]},
 {id:"swchar",kind:"personality",tags:["tv","kids"],title:"Which Star Wars Hero Are You?",dek:"Jedi, princess, smuggler, little green master or a very brave droid. Six questions. Use the Force.",badge:"Quiz",author:"Fuzz",
  results:{
   luke:{t:"Luke Skywalker",d:"A farm kid with big dreams who became a hero. You see the good in people, even the ones in scary black helmets."},
   leia:{t:"Princess Leia",d:"Smart, fearless and always in charge. You don't wait to be rescued. You grab the blaster and rescue everyone else."},
   han:{t:"Han Solo",d:"Cool, cocky and secretly a big softie. You say you're only in it for the money, but you always come back for your friends."},
   yoda:{t:"Yoda",d:"Small, old and the wisest one in the room. You talk in riddles and you're much stronger than you look."},
   r2:{t:"R2-D2",d:"Small, brave and absolutely essential. Nobody understands a word you say, but you save the day every single time."}},
  qs:[
   {q:"Pick a planet to live on:",a:[["A desert planet with two suns",{luke:3}],["A peaceful planet with mountains",{leia:3}],["Wherever the ship lands",{han:3}],["A quiet swamp planet",{yoda:3}],["Inside a spaceship, plugged into the wall",{r2:3}],["An ice planet. I like snow.",{luke:1,han:1}]]},
   {q:"Pick a weapon:",a:[["A glowing lightsaber",{luke:3}],["A blaster and a plan",{leia:3}],["A blaster, no plan",{han:3}],["No weapon. The Force is enough.",{yoda:3}],["A zapper arm and a lot of beeping",{r2:3}],["A walking stick",{yoda:2}]]},
   {q:"Your best quality:",a:[["Hope",{luke:3}],["Leadership",{leia:3}],["Swagger",{han:3}],["Wisdom",{yoda:3}],["Loyalty",{r2:3}],["Courage",{luke:1,leia:1}]]},
   {q:"The Death Star is coming. You:",a:[["Jump in a starfighter and go",{luke:3}],["Give orders. Everybody listens.",{leia:3}],["Ask how much it pays",{han:3}],["Calm I am. Meditate I will.",{yoda:3}],["Quietly fix the ship while everyone panics",{r2:3}],["Hide in the trash compactor",{han:1,r2:1}]]},
   {q:"Pick a sidekick:",a:[["A droid",{luke:3}],["A whole rebel army",{leia:3}],["A Wookiee",{han:3}],["Nobody. Alone, I am fine.",{yoda:3}],["A worried gold robot",{r2:3}],["A porg",{luke:1,yoda:1}]]},
   {q:"How do you talk?",a:[["Hopeful and a little whiny",{luke:3}],["Sharp and to the point",{leia:3}],["Sarcastic",{han:3}],["Backwards, I talk",{yoda:3}],["Beep boop",{r2:3}],["Mostly growling",{han:2}]]}]},
 {id:"dogbreed",kind:"personality",tags:["kids"],title:"Which Dog Breed Matches Your Personality?",dek:"Fetch-obsessed, chatty, bossy, fancy or tiny but fierce. Six questions. Good boys and girls only.",badge:"Quiz",author:"Fuzz",
  results:{
   lab:{t:"Labrador Retriever",d:"Friendly, loyal and always hungry. Everyone loves you, and you love everyone right back. You'd fetch the same ball for nine hours."},
   husky:{t:"Siberian Husky",d:"Full of energy, a little dramatic and very chatty. You were born to run, and you'll tell everyone about it with a loud aroooo."},
   corgi:{t:"Corgi",d:"Short legs, big personality. You walk into a room like you own it, and somehow everyone agrees."},
   poodle:{t:"Poodle",d:"Smart, elegant and secretly sporty. People see the fancy haircut and forget you're one of the cleverest dogs around."},
   chi:{t:"Chihuahua",d:"Tiny body, giant heart, enormous opinions. You'd take on a bear for your favorite person. You might even win."}},
  qs:[
   {q:"Pick a perfect Saturday:",a:[["Playing fetch at the park",{lab:3}],["Running through the snow",{husky:3}],["Herding my family into the car",{corgi:3}],["A trip to the groomer",{poodle:3}],["Napping on a warm lap",{chi:3}],["Swimming in the lake",{lab:2,husky:1}]]},
   {q:"How loud are you?",a:[["Happy barks only",{lab:3}],["I howl. I talk. I sing.",{husky:3}],["Loud for my size",{corgi:3}],["Quiet and dignified",{poodle:3}],["The loudest in the house, by far",{chi:3}],["Depends who's at the door",{corgi:1,chi:1}]]},
   {q:"Pick a snack:",a:[["Anything. Literally anything.",{lab:3}],["Fish",{husky:3}],["Cheese, sneaked under the table",{corgi:3}],["Something fancy, on a plate",{poodle:3}],["Tacos",{chi:3}],["A tennis ball",{lab:2}]]},
   {q:"Your best quality:",a:[["Friendliness",{lab:3}],["Energy",{husky:3}],["Confidence",{corgi:3}],["Brains",{poodle:3}],["Loyalty",{chi:3}],["Fluffiness",{husky:1,poodle:1}]]},
   {q:"Someone knocks at the door. You:",a:[["Run over with a toy to say hi",{lab:3}],["Howl like it's a wolf reunion",{husky:3}],["Run in happy circles",{corgi:3}],["Watch politely from the couch",{poodle:3}],["Bark until they leave. Or forever.",{chi:3}],["Hide behind someone's legs",{chi:1,poodle:1}]]},
   {q:"Pick a hairstyle:",a:[["Short and easy",{lab:3}],["Thick and fluffy, built for winter",{husky:3}],["A fluffy rear end",{corgi:3}],["Fancy pom-poms",{poodle:3}],["Tiny and sleek",{chi:3}],["Bedhead",{lab:1,corgi:1}]]}]},
 {id:"oceanpal",kind:"personality",tags:["kids"],title:"Which Ocean Animal Are You?",dek:"Clever, playful, chill, fearless or adorable. Dive in. Six questions from the deep.",badge:"Quiz",author:"Fuzz",
  results:{
   octo:{t:"Octopus",d:"Clever, mysterious and a master of escape. You have three hearts, no bones and a lot of surprises."},
   dolphin:{t:"Dolphin",d:"Smart, social and always up for fun. Your friends know your whistle from a mile away, and you never stop playing."},
   turtle:{t:"Sea Turtle",d:"Calm, wise and in no hurry at all. You've traveled thousands of miles and you're still the most relaxed one on the beach."},
   shark:{t:"Shark",d:"Bold, fearless and a little misunderstood. People think you're scary, but you've been keeping the ocean healthy for 400 million years."},
   otter:{t:"Sea Otter",d:"Adorable, cozy and a bit of a show-off. You use tools, you hold hands while you sleep and you look great doing it."}},
  qs:[
   {q:"Pick a spot in the ocean:",a:[["A cozy cave",{octo:3}],["Riding the waves",{dolphin:3}],["A warm, sandy beach",{turtle:3}],["The deep, dark open ocean",{shark:3}],["A kelp forest",{otter:3}],["A coral reef",{octo:1,turtle:1}]]},
   {q:"Pick a superpower:",a:[["Disguise",{octo:3}],["Super brain and super speed",{dolphin:3}],["Living for 100 years",{turtle:3}],["Sensing things nobody else can",{shark:3}],["Being unbelievably cute",{otter:3}],["Escaping from anything",{octo:2}]]},
   {q:"Your friends would call you:",a:[["Clever",{octo:3}],["Playful",{dolphin:3}],["Chill",{turtle:3}],["Fearless",{shark:3}],["Adorable",{otter:3}],["Funny",{dolphin:1,otter:1}]]},
   {q:"Pick a snack:",a:[["Crab",{octo:3}],["Fish",{dolphin:3}],["Jellyfish",{turtle:3}],["Whatever swims by",{shark:3}],["Clams, cracked open on my belly",{otter:3}],["Seaweed",{turtle:2}]]},
   {q:"How do you handle a problem?",a:[["Solve it like a puzzle",{octo:3}],["Talk it out with the group",{dolphin:3}],["Slowly. No rush.",{turtle:3}],["Head on",{shark:3}],["Float with my friends until it goes away",{otter:3}],["Squirt ink and swim away",{octo:2}]]},
   {q:"Pick a sound:",a:[["Silence",{octo:3}],["Clicks and whistles",{dolphin:3}],["Waves on the sand",{turtle:3}],["Dun dun. Dun dun.",{shark:3}],["Happy squeaks",{otter:3}],["Whale songs",{dolphin:1,turtle:1}]]}]},

 {id:"planet",kind:"personality",tags:["kids"],title:"Which Planet Are You?",dek:"Red and dusty, big and stormy, ringed and fancy, home sweet home or cold and deep. Six questions. Blast off.",badge:"Quiz",author:"Fuzz",
