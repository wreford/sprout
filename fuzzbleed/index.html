<script>
"use strict";

const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const pick2=(r,a)=>a[Math.floor(r()*a.length)];

// ---------------------------------------------------------------- Fuzz, the mascot: a furball with a few cartoon drips
function fuzz(o={}){const r=rng(o.seed||"fuzz");const cx=50,cy=46,R=o.r||30,n=34;let d="";
 for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,rr=R+(i%2?7+r()*4:-1+r()*2);d+=(i?"L":"M")+(cx+Math.cos(a)*rr).toFixed(1)+" "+(cy+Math.sin(a)*rr).toFixed(1)}
 const fur=o.fur||"#c9a27a",dark=o.dark||"#8a6440",mood=o.mood||"ok",drips=o.drips===undefined?2:o.drips;
 const eyes=mood==="dead"?`<path d="M34 36l10 10M44 36l-10 10M56 36l10 10M66 36l-10 10" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>`

 const mouth=mood==="happy"?`<path d="M40 56q10 10 20 0" stroke="#222" stroke-width="3" fill="#7a1d1d" stroke-linecap="round"/>`:mood==="shock"?`<ellipse cx="50" cy="59" rx="5" ry="6" fill="#222"/>`:`<path d="M42 58q8 4 16 0" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>`;
 let dr="";const xs=[44,57,36,63];for(let k=0;k<drips;k++){const x=xs[k],h=10+r()*12;dr+=`<path d="M${x-3} 70 q0 ${h} 3 ${h} q3 0 3 -${h}z" fill="#d61f1f"/><circle cx="${x}" cy="${70+h+4}" r="3" fill="#d61f1f"/>`}

function art(seed,label,o={}){const r=rng(seed);const [c1,c2]=PAL[Math.floor(r()*PAL.length)];let sh="";
 for(let i=0;i<9;i++){const x=r()*160,y=r()*100,s=8+r()*30,k=Math.floor(r()*3);sh+=k===0?`<circle cx="${x}" cy="${y}" r="${s/2}" fill="#fff" opacity="${.12+r()*.2}"/>`:k===1?`<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="4" fill="#fff" opacity="${.1+r()*.2}" transform="rotate(${r()*90} ${x} ${y})"/>`:`<path d="M${x} ${y}l${s/2} ${s}l${-s} 0z" fill="#000" opacity="${.06+r()*.1}"/>`}
 const m=o.mascot===false?"":`<g transform="translate(${o.mx??96} ${o.my??30}) scale(${o.ms??.6})"><g class="bob">${fuzz({seed:seed+"m",mood:o.mood||pick(["ok","happy","side","shock","up"]),fur:o.fur,drips:o.drips})}</g></g>`;
 const pr=o.prop?propG(o.prop,o.px??84,o.py??60,o.psc??1.25):"";

// drawn props that tell you what kind of quiz it is, held up next to Fuzz
const PROPS={
 food:`<circle cx="0" cy="0" r="16" fill="#f4a3c8" stroke="#a8572e" stroke-width="2"/><circle cx="0" cy="0" r="16" fill="none" stroke="#e0a050" stroke-width="5" opacity=".6"/><circle cx="0" cy="0" r="5.5" fill="#fff" stroke="#a8572e" stroke-width="1.5"/>${[[-9,-6,"#ffd23f"],[7,-9,"#1d6fe0"],[10,5,"#1fae6a"],[-6,9,"#fff"],[1,-12,"#8a4dff"]].map(([x,y,c])=>`<rect x="${x}" y="${y}" width="4" height="1.6" rx=".8" fill="${c}" transform="rotate(${x*7} ${x} ${y})"/>`).join("")}`,
 games:`<path d="M-20 -6 q0 -8 10 -8 h20 q10 0 10 8 l4 12 q2 8 -6 8 q-5 0 -8 -6 h-16 q-3 6 -8 6 q-8 0 -6 -8z" fill="#3b3550" stroke="#1c1828" stroke-width="2"/><path d="M-13 -4 v8 M-17 0 h8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="10" cy="-3" r="2.6" fill="#e8322b"/><circle cx="15" cy="2" r="2.6" fill="#1fae6a"/>`,
 photo:`<rect x="-19" y="-11" width="38" height="25" rx="5" fill="#2b2b2b" stroke="#000" stroke-width="1.5"/><rect x="-8" y="-16" width="12" height="6" rx="2" fill="#2b2b2b"/><circle cx="1" cy="1.5" r="9" fill="#555" stroke="#ddd" stroke-width="2"/><circle cx="1" cy="1.5" r="4" fill="#7fd6ff"/><circle cx="13" cy="-6" r="2" fill="#ffd23f"/>`,

function propG(name,x,y,sc){return PROPS[name]?`<g transform="translate(${x} ${y}) scale(${sc||1})" class="prop">${PROPS[name]}</g>`:""}

const RISO=[["#ff48b0","#fff3ec"],["#0078bf","#eef5ff"],["#00a95c","#eefaf2"],["#ffb800","#fffbe6"],["#ff6c2f","#fff1ea"],["#765ba7","#f4efff"],["#ff665e","#fff0ef"],["#00838a","#e8fafa"]];

function smooth(pts,closed){if(!pts.length)return "";let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;const n=pts.length;for(let i=1;i<(closed?n+1:n-1);i++){const a=pts[i%n],b=pts[(i+1)%n];d+=` Q${a[0].toFixed(1)} ${a[1].toFixed(1)} ${((a[0]+b[0])/2).toFixed(1)} ${((a[1]+b[1])/2).toFixed(1)}`}if(!closed){const l=pts[n-1];d+=` L${l[0].toFixed(1)} ${l[1].toFixed(1)}`}return d+(closed?"Z":"")}
const jit=(r,a)=>(r()-.5)*a;
const MOTIFS={
 spiral:r=>{const p=[];for(let t=0;t<12.5;t+=.45){const rr=1.2+t*1.25;p.push([20+Math.cos(t)*rr+jit(r,.8),20+Math.sin(t)*rr+jit(r,.8)])}return {line:smooth(p)}},
 sun:r=>{const c=[];for(let k=0;k<14;k++){const a=k/14*6.283;c.push([20+Math.cos(a)*(7+jit(r,1.2)),20+Math.sin(a)*(7+jit(r,1.2))])}let rays="";for(let k=0;k<9;k++){const a=k/9*6.283+jit(r,.2);rays+=`M${(20+Math.cos(a)*10).toFixed(1)} ${(20+Math.sin(a)*10).toFixed(1)} L${(20+Math.cos(a)*(15+r()*3)).toFixed(1)} ${(20+Math.sin(a)*(15+r()*3)).toFixed(1)} `}return {fill:smooth(c,1),line:smooth(c,1)+" "+rays}},
 star:r=>{const p=[];for(let k=0;k<10;k++){const a=k/10*6.283-1.57,rr=k%2?6:15;p.push([20+Math.cos(a)*rr+jit(r,1.5),20+Math.sin(a)*rr+jit(r,1.5)])}const d="M"+p.map(q=>q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" L")+"Z";return {fill:d,line:d}},
 wave:r=>{let d="";for(let k=0;k<3;k++){const p=[];for(let x=2;x<=38;x+=4)p.push([x,10+k*9+Math.sin(x/5+k)*3+jit(r,1)]);d+=smooth(p)+" "}return {line:d}},
 flower:r=>{let f="";for(let k=0;k<6;k++){const a=k/6*6.283;f+=`M${(20+Math.cos(a)*8+5.5).toFixed(1)} ${(20+Math.sin(a)*8).toFixed(1)} a5.5 5.5 0 1 0 -11 0 a5.5 5.5 0 1 0 11 0 `}return {fill:f,line:f+` M23 20 a3 3 0 1 0 -6 0 a3 3 0 1 0 6 0`}},

   {q:"What are you bringing?",a:[["A single enormous sandwich",{yeti:2,bigfoot:1}],["Goats. Don't ask.",{chupa:3}],["Fish, raw, still a bit wriggly",{nessie:3}],["A lamp, for vibes",{moth:3}],["Berries I found",{bigfoot:2}],["A thermos of hot chocolate the size of a person",{yeti:3}]]},
   {q:"It starts to rain. You:",a:[["Stand perfectly still in the trees",{bigfoot:3}],["Get in the lake. Wetter is better.",{nessie:3}],["Fly away dramatically",{moth:3}],["Eat everyone's chips while they're distracted",{chupa:3}],["It's snowing, actually",{yeti:3}],["Hiss",{chupa:2}]]},
   {q:"Someone gets out a camera. You:",a:[["Walk away slowly, at an angle",{bigfoot:3}],["Surface for exactly one second",{nessie:3}],["Glow red eyes at it",{moth:3}],["Steal the camera",{chupa:3}],["Wave. Nobody believes the photo anyway.",{yeti:2}],["Become very blurry",{bigfoot:2,moth:1}]]},
   {q:"Pick a dessert:",a:[["Something from the bottom of a lake",{nessie:2}],["A popsicle, naturally",{yeti:3}],["Anything stolen",{chupa:2}],["A moth-shaped cookie",{moth:2}],["Pine cones, lightly toasted",{bigfoot:2}],["Nothing. I live on mystery.",{moth:1,nessie:1}]]},
   {q:"How does the picnic end?",a:[["Ants. Everywhere.",{chupa:2}],["Somebody screams and points at the lake",{nessie:3}],["A local newspaper headline",{moth:3}],["An avalanche, but a friendly one",{yeti:3}],["You leave giant footprints on the way home",{bigfoot:3}],["Everyone agrees not to talk about it",{moth:1,bigfoot:1}]]},
   {q:"Your ideal neighbor:",a:[["Doesn't exist. I live in a forest.",{bigfoot:2}],["A boat that never comes too close",{nessie:2}],["A bridge with good lighting",{moth:2}],["A farm with poor fencing",{chupa:2}],["A very patient mountain goat",{yeti:2}],["Another cryptid. We have a group chat.",{yeti:1,moth:1}]]}]},
 {id:"groupchat",kind:"personality",title:"Which Group Chat Person Are You? We Can See The Read Receipts",dek:"Every group chat has the same six people. Find out which one is you. Spoiler: it's the one you thought it wasn't.",badge:"Hot",author:"Fuzz",
  results:{
   lurker:{t:"The Lurker",d:"You have read every message since 2019. You have replied to four of them. When you do speak, everyone panics, because it means something has happened."},
   voice:{t:"The Voice Note Sender",d:"Why type eight words when you can send a four-minute voice note recorded while walking past a garbage truck? You are a podcast nobody subscribed to, and we love you."},
   meme:{t:"The Meme Machine",d:"You communicate exclusively in pictures of confused animals. Nobody has seen you write a full sentence. Your memes are, unfortunately, perfect."},
   k:{t:"The 'k' Replier",d:"Someone writes three heartfelt paragraphs. You reply 'k'. You meant it kindly. Nobody will ever believe that, and you refuse to explain."},
   org:{t:"The Organizer",d:"You made a poll. Nobody voted. You made another poll. You are the reason anything has ever happened, and you are tired."},
   chaos:{t:"The Chaos Agent",d:"You rename the group every day. You add strangers. You once sent a photo of a ham at 3am with no context. The chat would die without you."}},
  qs:[
   {q:"Someone sends 'are we still on for Saturday?' You:",a:[["Read it. Say nothing. Forever.",{lurker:3}],["Voice note, 3 minutes, mostly breathing",{voice:3}],["A picture of a frog with a calendar",{meme:3}],["k",{k:3}],["Already made a spreadsheet",{org:3}],["Rename the chat 'SATURDAY OF DOOM'",{chaos:3}]]},
   {q:"How many unread messages do you have?",a:[["0. I read everything. I just don't reply.",{lurker:2,org:1}],["347",{chaos:2,meme:1}],["I listen, I don't read",{voice:3}],["Enough",{k:2}],["Exactly 12. I'm saving them.",{org:2}],["Unread? I've muted it.",{lurker:2,k:1}]]},
   {q:"Pick an emoji vibe (described in words, we're classy):",a:[["The skull. Always the skull.",{meme:2,chaos:1}],["A single thumbs up",{k:3}],["The calendar",{org:3}],["The eyes looking sideways",{lurker:3}],["The microphone",{voice:2}],["A random fruit with no context",{chaos:3}]]},
   {q:"Someone shares big news. Your reply:",a:[["A 9 minute voice note of support",{voice:3}],["A meme about the big news",{meme:3}],["'k congrats'",{k:3}],["You react with a heart. Silently. Days later.",{lurker:3}],["You start planning the celebration",{org:3}],["You change the group picture to their face",{chaos:3}]]},
   {q:"Your phone battery is:",a:[["100%, I never use it",{lurker:2}],["3%, from all the voice notes",{voice:2}],["Low, from scrolling for memes",{meme:2}],["Fine",{k:2}],["Charging, with a backup battery charging the charger",{org:2}],["It's on fire",{chaos:3}]]},
   {q:"The chat goes quiet for a week. You:",a:[["Don't notice",{lurker:2,k:1}],["Send a voice note asking if everyone's alive",{voice:2}],["Revive it with a cursed image",{meme:2,chaos:1}],["Also don't notice. k.",{k:2}],["Suggest a date for the next meetup",{org:3}],["Add your grandma to the chat",{chaos:3}]]}]},
 {id:"furball",kind:"personality",title:"Which Fuzzbleed Furball Are You?",dek:"Every Fuzzbleed staffer is secretly a small, damp, bleeding furball. So are you. Let's find out which one.",badge:"Staff pick",author:"Fuzz",
  results:{
   fluff:{t:"Fluff",d:"Soft, round, approachable. You get adopted by every group you join. You are bleeding slightly from a papercut and handling it with enormous dignity."},
   snarl:{t:"Snarl",d:"Spiky on the outside and, frankly, also spiky on the inside. You bite, but only people who deserve it, and you keep a list."},
   dribble:{t:"Dribble",d:"Something is always leaking out of you: ketchup, tears, the details of everyone's secrets. You mean well. You just cannot hold anything in."},
   clump:{t:"Clump",d:"You are three furballs that got stuck together and decided to make it work. You are a committee. Every decision takes a week."},
   sir:{t:"Sir Hairington III",d:"Old money. Old fur. You wear a tiny monocle and have never once picked up your own fur from the carpet."}},
  qs:[
   {q:"Where do you live?",a:[["Under a couch, cozy",{fluff:3}],["Behind a radiator, angry",{snarl:3}],["In a drain, damp",{dribble:3}],["In a hairbrush, with friends",{clump:3}],["A velvet cushion, inherited",{sir:3}],["The hoover bag. It's fine.",{clump:1,dribble:1}]]},
   {q:"Someone tries to pick you up. You:",a:[["Purr, even though I'm not a cat",{fluff:3}],["Bite",{snarl:3}],["Leave a stain",{dribble:3}],["Fall apart into several smaller clumps",{clump:3}],["Demand they wash their hands first",{sir:3}],["Roll under the fridge",{snarl:1,dribble:1}]]},
   {q:"Pick a hobby:",a:[["Napping in sunbeams",{fluff:2}],["Holding grudges",{snarl:2}],["Spilling things",{dribble:2}],["Forming a band",{clump:2}],["Collecting tiny spoons",{sir:2}],["Hiding in shoes",{snarl:1,fluff:1}]]},
   {q:"How did you get that little bit of blood on you?",a:[["Papercut, very brave about it",{fluff:3}],["Fight. I won.",{snarl:3}],["It's ketchup. I'm almost sure.",{dribble:3}],["We don't know whose it is",{clump:3}],["Fencing accident, at the club",{sir:3}],["I'd rather not say",{snarl:1,sir:1}]]},
   {q:"Your catchphrase:",a:[["'Aww'",{fluff:2}],["'Hssss'",{snarl:2}],["'Oops'",{dribble:2}],["'We think...'",{clump:2}],["'I say!'",{sir:2}],["'...'",{snarl:1}]]},
   {q:"Pick a snack:",a:[["Crumbs from a nice person",{fluff:2}],["A finger, ideally",{snarl:2}],["Anything dropped",{dribble:2}],["Whatever the others are having",{clump:2}],["Caviar, on a crumb",{sir:2}],["Lint. It's a delicacy.",{clump:1,sir:1}]]}]},
 {id:"sandwich",kind:"personality",title:"What Kind Of Sandwich Is Your Soul?",dek:"Your soul is a sandwich. This is science. Answer six questions and we'll tell you what's in it.",author:"Fuzz",
  results:{
   soggy:{t:"The Sandwich That Was Packed At 7am",d:"By lunch you are soft, a bit damp, and somehow still exactly what everyone needed. You have been through a lot in that lunchbox."},
   club:{t:"The Club Sandwich",d:"Many layers, held together with a stick, and slightly too tall for any mouth. You are a lot. You are worth it."},
   cheese:{t:"The Grilled Cheese",d:"Warm, simple, universally loved. You have never been controversial. You have never needed to be."},
   fold:{t:"A Single Slice Of Bread, Folded",d:"Technically a sandwich. Technically. You do the bare minimum with total confidence and somehow it works every time."},
   other:{t:"The Sandwich Someone Else Made",d:"You are, scientifically, the best sandwich. Nobody knows why. You are mysterious and perfect and you didn't even try."}},
  qs:[
   {q:"Pick a bread, but emotionally:",a:[["Soft and a bit squashed",{soggy:3}],["Three slices, at least",{club:3}],["Buttered on both sides",{cheese:3}],["Whatever was nearest",{fold:3}],["Bread? I didn't make it.",{other:3}],["Sourdough, I named the starter",{club:1,cheese:1}]]},
   {q:"How do you handle a crisis?",a:[["Absorb it",{soggy:3}],["Add more layers",{club:3}],["Melt, but nicely",{cheese:3}],["Fold",{fold:3}],["Get someone else to handle it",{other:3}],["Cut it into triangles",{club:1,other:1}]]},
   {q:"Pick a lunch spot:",a:[["Inside a bag, for hours",{soggy:3}],["A fancy hotel with a cocktail stick",{club:3}],["A frying pan",{cheese:3}],["Standing up in the kitchen",{fold:3}],["Someone else's plate",{other:3}],["A park bench with a pigeon watching",{soggy:1,fold:1}]]},
   {q:"What's your secret ingredient?",a:[["Tears. Lunchbox tears.",{soggy:2}],["Bacon, egg, lettuce, regret",{club:2}],["Just cheese. More cheese.",{cheese:2}],["There isn't one",{fold:2}],["Love. Someone else's love.",{other:2}],["Chips, inside it",{fold:1,club:1}]]},
   {q:"Someone takes a bite of you. You:",a:[["Fall apart a little",{soggy:2}],["Collapse, magnificently",{club:2}],["Stretch",{cheese:2}],["Unfold",{fold:2}],["Taste better than theirs",{other:2}],["Scream",{club:1,soggy:1}]]},
   {q:"How do you want to be remembered?",a:[["'It was there when I needed it'",{soggy:2}],["'It was a lot'",{club:2}],["'Comforting'",{cheese:2}],["'Technically a sandwich'",{fold:2}],["'How did they do that?'",{other:2}],["'Crunchy'",{fold:1,club:1}]]}]},
 {id:"weather",kind:"personality",title:"Which Extremely Specific Weather Are You?",dek:"Not 'sunny'. Not 'rainy'. We mean the specific weather you are, on the inside, right now.",author:"Fuzz",
  results:{
   drizzle:{t:"The Drizzle That Doesn't Need An Umbrella But Somehow Soaks You",d:"You seem mild. You are not mild. After ten minutes with you, everybody is damp and has questions."},
   fog:{t:"Morning Fog",d:"Mysterious, soft, and gone by 11. You make ordinary places look like the start of a film. Nobody can see where you're going, including you."},
   hail:{t:"Sudden Hail In June",d:"Nobody saw you coming. Not the forecast, not the barbecue, not you. You are brief, loud and unforgettable."},
   spring:{t:"The First Warm Day Of Spring",d:"Everyone is happy to see you. People take their coats off for you. You are, frankly, the best weather, and you know it."},
   storm:{t:"The 3pm Thunderstorm",d:"Hot, heavy and building all day. Then: everything at once. Then: perfectly fine again, as if nothing happened. Classic you."}},
  qs:[
   {q:"How do you enter a room?",a:[["Slowly, and suddenly everyone's damp",{drizzle:3}],["Quietly. Nobody saw me arrive.",{fog:3}],["Loudly, out of nowhere",{hail:3}],["Warmly. People cheer.",{spring:3}],["After a long build-up",{storm:3}],["Through the window",{hail:1,storm:1}]]},
   {q:"Pick a sound:",a:[["Pitter-patter, forever",{drizzle:3}],["A foghorn, far away",{fog:3}],["Hundreds of tiny ice balls on a car roof",{hail:3}],["Birds, going absolutely wild",{spring:3}],["A rumble you feel in your teeth",{storm:3}],["Nothing. Muffled nothing.",{fog:2}]]},
   {q:"Your mood today:",a:[["Gray but committed",{drizzle:2}],["Unclear",{fog:2}],["Surprising, even to me",{hail:2}],["Delightful",{spring:2}],["Building",{storm:2}],["All of the above, by the hour",{storm:1,hail:1}]]},
   {q:"Pick an outfit:",a:[["Raincoat, always",{drizzle:2}],["Gray hoodie, slightly mysterious",{fog:2}],["Shorts, with a hat for emergencies",{hail:2}],["The first t-shirt of the year",{spring:2}],["Something dramatic and dark",{storm:2}],["Pajamas. It's weather, not my problem.",{fog:1,drizzle:1}]]},
   {q:"How do you leave a party?",a:[["Gradually, everyone's still damp",{drizzle:2}],["You just weren't there any more",{fog:3}],["Abruptly, mid-sentence",{hail:3}],["Late, after a lovely evening",{spring:2}],["With a bang, then calm",{storm:3}],["I'm still there. I live there now.",{drizzle:1}]]},
   {q:"What do people say about you?",a:[["'It's not even raining, why am I wet?'",{drizzle:3}],["'Where did they go?'",{fog:2}],["'Did that just happen?'",{hail:2}],["'Finally!'",{spring:3}],["'I felt that coming all day'",{storm:2}],["'Bring a coat'",{drizzle:1,storm:1}]]}]},
 {id:"villain",kind:"personality",title:"Which Mildly Inconvenient Villain Are You?",dek:"You'd never take over the world. You'd just make it slightly worse. Let's find your villain energy.",author:"Fuzz",
  results:{
   lid:{t:"The One Who Puts The Lid On Too Tight",d:"Nobody can open the pickle jar. Nobody. You did this with a smile, and you will never admit it."},
   spoiler:{t:"The Spoiler",d:"You don't mean to. You just get excited. Everyone knows who dies in every film because of you, and somehow you still get invited to things."},
   reply:{t:"The Reply-All",d:"Two hundred people now know your thoughts on the office fridge. You are a menace. You are a legend."},
   seat:{t:"The Seat-Recliner",d:"You paid for this seat and you will use every degree of it. The person behind you has learned to eat sideways."},
   stair:{t:"The Last-Step Stopper",d:"You stop dead at the top of every escalator to look around. There are eleven people behind you. You have never noticed one of them."}},
  qs:[
   {q:"Pick your villain lair:",a:[["A kitchen with only sealed jars",{lid:3}],["The movie theater, front row, talking",{spoiler:3}],["The office email system",{reply:3}],["Seat 23C on a long-haul flight",{seat:3}],["The top of an escalator",{stair:3}],["A cupboard. Just a regular one.",{lid:1,stair:1}]]},
   {q:"Your evil laugh is:",a:[["A quiet grunt, tightening a lid",{lid:2}],["'Oh you haven't seen it? So basically...'",{spoiler:3}],["The sound of an email sending",{reply:3}],["The click of a seat going back",{seat:3}],["Silence, as you stop to read a sign",{stair:3}],["A normal laugh. That's the scary part.",{spoiler:1,lid:1}]]},
   {q:"Pick a weapon:",a:[["Extremely strong wrists",{lid:3}],["Knowing the ending",{spoiler:3}],["The CC line",{reply:3}],["A recline button",{seat:3}],["A complete lack of spatial awareness",{stair:3}],["A strongly worded sticky note",{reply:1,lid:1}]]},
   {q:"Your archnemesis:",a:[["The rubber jar opener",{lid:2}],["People who say 'no spoilers'",{spoiler:2}],["The 'unsubscribe' button",{reply:2}],["Knees",{seat:2}],["People in a hurry",{stair:2}],["A lady with a cart",{stair:1,seat:1}]]},
   {q:"How will you be defeated?",a:[["Hot water on the lid",{lid:3}],["Everyone wearing headphones",{spoiler:3}],["IT turning off reply-all",{reply:3}],["A flight attendant, politely",{seat:3}],["A gentle push from behind",{stair:3}],["I won't. I'm eternal.",{reply:1,spoiler:1}]]},
   {q:"Your villain catchphrase:",a:[["'It's not that tight'",{lid:2}],["'Wait, you didn't know?'",{spoiler:2}],["'Just looping everyone in!'",{reply:2}],["'I paid for this'",{seat:2}],["'Oh, sorry, were you going this way?'",{stair:2}],["'Hmm?'",{stair:1}]]}]},
 {id:"animals",kind:"trivia",title:"Only A True Animal Expert Can Get 8/10 On This Extremely Weird Animal Quiz",dek:"Nature is disgusting and wonderful. Prove you know it.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Have You Ever Met An Animal?","You may have confused a cat for a small rug. That's fine. Fuzz is technically a rug too."],[4,"Casual Pet Owner","You know the basics and you've seen at least one nature documentary while falling asleep."],[7,"Zookeeper Material","Impressive. Animals probably trust you. Squirrels nod at you in the park."],[10,"Literally A Wombat","Ten out of ten. You either studied, or you are an animal pretending to be a person. We won't tell."]],
  qs:[
   {q:"What shape is wombat poo?",a:["Cubes","Spirals","Little stars","Perfect spheres"],c:0,why:"Wombats really do make cube-shaped poo, and they stack it to mark their territory."},
   {q:"How many hearts does an octopus have?",a:["One","Two","Three","Eight, one per arm"],c:2,why:"Three: two pump blood through the gills and one pumps it round the body."},
   {q:"Which of these animals has no stomach at all?",a:["Cow","Platypus","Shark","Owl"],c:1,why:"The platypus has no stomach. Its food goes straight from the gullet to the intestine."},
   {q:"What is a group of flamingos called?",a:["A blush","A flamboyance","A tutu","A strut"],c:1,why:"A flamboyance of flamingos. Correct, and fabulous."},
   {q:"Which animal has fingerprints so like ours that they could confuse a crime scene?",a:["Koala","Gorilla","Raccoon","Sloth"],c:0,why:"Koalas have fingerprints remarkably like human ones."},
   {q:"What color is a polar bear's skin, under the fur?",a:["White","Pink","Black","Light blue"],c:2,why:"Black skin, to soak up heat. The fur isn't even really white: each hair is see-through."},
   {q:"Which bird can fly backwards?",a:["Penguin","Hummingbird","Ostrich","Pigeon"],c:1,why:"Hummingbirds can hover and fly backwards. Penguins can't fly at all, but they're very good at swimming."},
   {q:"What's a baby kangaroo called?",a:["A kit","A pup","A joey","A hopling"],c:2,why:"A joey. It lives in its mom's pouch for months."},
   {q:"Where is a shrimp's heart?",a:["In its tail","In its head","It doesn't have one","In its legs"],c:1,why:"A shrimp's heart is in its head, or at least in the front part of the body we'd call its head."},
   {q:"What is a group of crows called?",a:["A murder","A gossip","A cackle","A shadow"],c:0,why:"A murder of crows. Very dramatic. Crows are also clever enough to recognize individual human faces."}]},
 {id:"words",kind:"trivia",title:"Can You Spot The Real Word? Only 1 In 50 People Get 8/10",dek:"Every question has one real English word and three we made up while eating chips. Find the real one.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Professional Word Inventor","You trusted the made-up ones. They deserved it, to be fair. Some of them should be real."],[4,"Word Enjoyer","You know a fake when you smell one, at least half the time."],[7,"Walking Dictionary","Excellent. You probably say 'kerfuffle' out loud and mean it."],[10,"Lexicographer Supreme","Ten out of ten. You are the dictionary now. Please be gentle with us."]],
  qs:[
   {q:"Which one is a real word?",a:["Glorptastic","Snollygoster","Fribbleweed","Mungdoodle"],c:1,why:"A snollygoster is a clever person with no principles, especially a sneaky politician."},
   {q:"Which one is a real word?",a:["Squizzlepop","Blartwhistle","Flibbertigibbet","Zumbledorf"],c:2,why:"A flibbertigibbet is a silly, flighty, chattering person."},
   {q:"Which one is a real word?",a:["Collywobbles","Plonkwhistle","Drizzleback","Fumblequack"],c:0,why:"The collywobbles is a nervous, fluttery feeling in your tummy."},
   {q:"Which one is a real word?",a:["Wobblesnout","Crumpetude","Lollygag","Snizzlewick"],c:2,why:"To lollygag is to dawdle about and waste time."},
   {q:"Which one is a real word?",a:["Bumfuzzle","Grumbletart","Splonkered","Wibbleton"],c:0,why:"To bumfuzzle someone is to confuse them completely."},
   {q:"Which one is a real word?",a:["Fluffernook","Taradiddle","Snorkelbum","Pifflesnatch"],c:1,why:"A taradiddle is a small lie, or pretentious nonsense."},
   {q:"Which one is a real word?",a:["Widdershins","Toastlewick","Glumpkin","Murbleface"],c:0,why:"Widdershins means anticlockwise, or in the wrong direction."},
   {q:"Which one is a real word?",a:["Snoffle","Kerfuffle","Grabblenut","Flumptious"],c:1,why:"A kerfuffle is a fuss or a commotion."},
   {q:"Which one is a real word?",a:["Bramblesnout","Squelchery","Cattywampus","Plinkerdoo"],c:2,why:"Cattywampus means crooked, askew, or not lined up properly."},
   {q:"Which one is a real word?",a:["Gardyloo","Dimblefig","Wonkletrot","Flapdoodlery"],c:0,why:"Gardyloo was shouted in old Edinburgh as a warning before throwing dirty water out of a window."}]},
 {id:"space",kind:"trivia",title:"How Much Do You Actually Know About Space?",dek:"Ten questions about the universe. The universe is watching. Mostly it's just very far away.",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Lost In Space","You think a black hole is a sock drawer. To be fair, socks do vanish into it."],[4,"Stargazer","You know your planets and you've definitely looked up at night at least once."],[7,"Astronaut In Training","Great score. NASA hasn't called yet, but they might. Check your phone."],[10,"Literally A Galaxy","Ten out of ten. You are made of star stuff, and so is your brain, apparently."]],
  qs:[
   {q:"On which planet is a day longer than its year?",a:["Mars","Venus","Jupiter","Mercury"],c:1,why:"Venus spins so slowly that one day there lasts longer than its trip round the Sun."},
   {q:"Which is the hottest planet?",a:["Mercury","Venus","Mars","Jupiter"],c:1,why:"Venus, even though Mercury is closer to the Sun. Its thick clouds trap the heat."},
   {q:"Where is Olympus Mons, the tallest volcano in the solar system?",a:["The Moon","Earth","Mars","Venus"],c:2,why:"On Mars. It's about two and a half times as tall as Mount Everest."},
   {q:"About how long does sunlight take to reach Earth?",a:["8 seconds","8 minutes","8 hours","8 days"],c:1,why:"About 8 minutes. The sunshine you see left the Sun before you finished reading this question."},
   {q:"Why could astronauts' footprints on the Moon last for millions of years?",a:["Moon dust is sticky","There's no wind or rain to wipe them away","They were painted on","The Moon is frozen"],c:1,why:"The Moon has no weather, so there's nothing to wipe the footprints away."},
   {q:"How many planets are in our solar system?",a:["7","8","9","12"],c:1,why:"Eight. Pluto was reclassified as a dwarf planet in 2006. It's fine. It's doing fine."},
   {q:"What is the Great Red Spot on Jupiter?",a:["A crater","A volcano","A giant storm","A lake of lava"],c:2,why:"A storm bigger than Earth that has been raging for hundreds of years."},
   {q:"Which planet was predicted using math before anyone saw it?",a:["Neptune","Saturn","Mars","Venus"],c:0,why:"Neptune. Astronomers worked out where it must be from how it tugged on Uranus, then found it there."},
   {q:"What is the Sun?",a:["A planet","A star","A comet","A very big lamp"],c:1,why:"A star, and quite an ordinary one: a yellow dwarf."},
   {q:"Which planet has the most known moons?",a:["Earth","Jupiter","Saturn","Mars"],c:2,why:"Saturn, with well over a hundred known moons. Jupiter is close behind."}]},
 {id:"agewich",kind:"build",shape:"sandwich",title:"Build A Sandwich And We'll Guess Your Age",dek:"Our sandwich scientists can tell exactly how old you are from what you put between two bits of bread. We are never wrong. We are often wrong.",badge:"Build it",author:"Fuzz",
  qs:[
   {q:"Pick your bread:",a:[["White bread","#f7e2b5"],["Wheat bread","#b9814b"],["A bagel","#d9a35e"],["A croissant","#e8b04a"],["Two pancakes","#f0c27b"],["A waffle","#dba44f"]]},
   {q:"Pick a spread:",a:[["Butter","#ffe58a"],["Mayo","#fff6d8"],["Grape jelly","#7b1fa2"],["Peanut butter","#b5763a"],["Ketchup","#d32f2f"],["Nothing. I live dangerously.","#eeeeee"]]},
   {q:"Pick the main filling:",a:[["Cheese","#ffc928"],["Ham","#f48fb1"],["Falafel","#8d6e3a"],["Tuna","#d7ccc8"],["A fried egg","#fffde7"],["Chips","#ffb300"]]},
   {q:"Add something extra:",a:[["Lettuce","#7cb342"],["Pickles","#558b2f"],["Tomato","#e53935"],["Onion","#e1bee7"],["Banana","#fff176"],["Gummy candy","#ff4081"]]},

 {id:"dino",kind:"personality",title:"Which Dinosaur Would Be Your Best Friend?",dek:"Sixty-six million years too late, but friendship is friendship. Find your prehistoric bestie.",badge:"New",author:"Fuzz",
  results:{
   rex:{t:"Tyrannosaurus Rex",d:"Loud, loyal, terrible at hugs. Those tiny arms mean every high five is a near miss, but nobody will ever pick on you again."},
   tri:{t:"Triceratops",d:"Steady, sensible and built like a couch with horns. The friend who remembers your birthday and also how to get home."},
   steg:{t:"Stegosaurus",d:"Gentle, a bit spiky, and famous for a brain about the size of a lime. You'll never have a deep conversation. You'll never need one."},
   raptor:{t:"Velociraptor",d:"Not the scaly giant from the films: the real one was about the size of a turkey and covered in feathers. Small, clever, chaotic. Perfect."},
   ptero:{t:"Pterodactyl",d:"Technically not a dinosaur at all, which is so you. A flying reptile who turned up to the dinosaur party anyway and was the best guest there."}},
  qs:[
   {q:"Pick a weekend plan:",a:[["Shouting at a mountain",{rex:3}],["A long walk with snacks",{tri:3}],["A nap in a sunny field",{steg:3}],["Getting into somewhere you shouldn't",{raptor:3}],["Flying to the seaside",{ptero:3}],["Hide and seek, but I'm very good at it",{raptor:2,ptero:1}]]},
   {q:"How do you say hello?",a:[["ROAR",{rex:3}],["A firm, friendly nod",{tri:3}],["A slow blink",{steg:3}],["From behind you. Hi.",{raptor:3}],["Swooping in from above",{ptero:3}],["A small polite wave",{tri:1,steg:1}]]},
   {q:"Pick a snack:",a:[["The biggest thing on the menu",{rex:3}],["A salad, a big one",{tri:2,steg:1}],["Ferns. Just ferns.",{steg:3}],["Whatever my friends are eating",{raptor:3}],["Fish, caught mid-air",{ptero:3}],["Chips, stolen",{raptor:2}]]},
   {q:"Your friend is upset. You:",a:[["Roar at whoever upset them",{rex:3}],["Stand in front of them like a wall",{tri:3}],["Sit with them quietly for hours",{steg:3}],["Make a cunning plan",{raptor:3}],["Fly them somewhere with a nice view",{ptero:3}],["Try to hug them, but my arms are too short",{rex:2}]]},
   {q:"Pick a superpower:",a:[["Being enormous",{rex:2}],["Unbreakable armor",{tri:2}],["Never being in a hurry",{steg:2}],["Speed",{raptor:2}],["Flight",{ptero:2}],["Being underestimated",{steg:1,raptor:1}]]},
   {q:"What's your biggest flaw?",a:[["Tiny arms, big feelings",{rex:2}],["Too sensible",{tri:2}],["I forget things. What was the question?",{steg:2}],["I can't sit still",{raptor:2}],["I'm technically in the wrong group",{ptero:3}],["None. I'm a dinosaur.",{rex:1,tri:1}]]}]},
 {id:"cereal",kind:"personality",title:"Which Breakfast Cereal Is Your Inner Child?",dek:"Somewhere inside you is a small child eating cereal in their pajamas. What's in the bowl?",author:"Fuzz",
  results:{
   choc:{t:"Chocolate Puffs That Turn The Milk Brown",d:"Your inner child is pure joy and a little bit of mess. They had a great time and they are not cleaning up."},
   oats:{t:"Plain Oatmeal",d:"Your inner child was born forty years old. They like a routine. They read the back of the box for fun."},
   rings:{t:"Rainbow Rings",d:"Your inner child believes in everything: magic, unicorns, the toy at the bottom of the box. Never let anyone take that away."},
   muesli:{t:"Muesli With The Raisins Picked Out",d:"Your inner child is fussy, organized and right. They have a small pile of raisins on the side and they are not apologizing."},
   dust:{t:"The Dust At The Bottom Of The Box",d:"Your inner child is resourceful, chaotic and will eat it straight from the box with a spoon at midnight."}},
  qs:[
   {q:"Pick a cartoon to watch:",a:[["Something with explosions",{choc:3}],["The news. I'm a child.",{oats:3}],["Something with a talking horse",{rings:3}],["The same episode I always watch",{muesli:3}],["Whatever's on, I'm already up too late",{dust:3}],["All of them, at once",{choc:2,rings:1}]]},
   {q:"How do you eat your cereal?",a:[["Milk first. Sorry.",{dust:3}],["Cereal first, like a citizen",{oats:3}],["Fast, before it goes soggy",{choc:3}],["Slowly, picking bits out",{muesli:3}],["I make shapes with it first",{rings:3}],["From the box, standing up",{dust:2}]]},
   {q:"Pick a toy from the box:",a:[["A whistle that's too loud",{choc:3}],["I don't want a toy",{oats:3}],["A tiny sparkly unicorn",{rings:3}],["I'll keep it in the packet",{muesli:3}],["I ate the toy",{dust:3}],["The box itself, as a hat",{rings:1,dust:1}]]},
   {q:"Bedtime is:",a:[["A suggestion",{choc:2,dust:1}],["Seven o'clock sharp",{oats:3}],["After one more story",{rings:3}],["When my things are tidy",{muesli:3}],["I don't know her",{dust:3}],["When I fall asleep on the stairs",{choc:2}]]},
   {q:"Your dream birthday party:",a:[["A chocolate fountain, unsupervised",{choc:3}],["A quiet lunch with a nice aunt",{oats:3}],["A unicorn. A real one.",{rings:3}],["Exactly the party I planned, on a list",{muesli:3}],["A sleepover where nobody sleeps",{dust:3}],["A bouncy castle in the living room",{choc:1,rings:1}]]}]},
 {id:"foodfacts",kind:"trivia",title:"Real Or Fake? These Food Facts Will Make You Question Lunch",dek:"Ten food facts. Some are real. Some we made up while hungry. Which are which?",badge:"Quiz",author:"Fuzz",
  tiers:[[0,"Believes Everything On A Cereal Box","You've been fooled. Delicious, delicious fooled."],[4,"Snack Detective","Decent instincts. You'd spot a fake sandwich at twenty paces, probably."],[7,"Food Scientist","Excellent. You know your fruit from your veg and your berries from your liars."],[10,"Professor Of Lunch","Ten out of ten. Please run the school canteen."]],
  qs:[
   {q:"Honey can stay edible for thousands of years.",a:["Real","Fake"],c:0,why:"Real. Pots of honey found in ancient Egyptian tombs were still edible."},
   {q:"Bananas are berries.",a:["Real","Fake"],c:0,why:"Real. To a botanist, a banana counts as a berry."},
   {q:"Strawberries are berries.",a:["Real","Fake"],c:1,why:"Fake! A strawberry isn't a true berry. Its seeds are on the outside, which breaks the rules."},
   {q:"Peanuts are nuts.",a:["Real","Fake"],c:1,why:"Fake. Peanuts are legumes, like peas and beans. They grow underground."},
   {q:"Tomatoes are a fruit.",a:["Real","Fake"],c:0,why:"Real, botanically speaking. They grow from a flower and hold seeds."},
   {q:"Carrots used to be mostly purple or yellow.",a:["Real","Fake"],c:0,why:"Real. Early cultivated carrots were often purple or yellow. Orange ones came along later."},
   {q:"White chocolate is made with cocoa solids, like milk chocolate.",a:["Real","Fake"],c:1,why:"Fake. White chocolate uses cocoa butter but no cocoa solids, which is why it isn't brown."},
   {q:"Ketchup was once sold as a medicine.",a:["Real","Fake"],c:0,why:"Real. In the 1830s, tomato ketchup was sold in pill form as a cure for indigestion."},
   {q:"Apples float in water.",a:["Real","Fake"],c:0,why:"Real. About a quarter of an apple is air, which is why apple bobbing works."},
   {q:"Cucumbers are a type of melon-family plant.",a:["Real","Fake"],c:0,why:"Real. Cucumbers belong to the same plant family as melons, pumpkins and squash."}]},
