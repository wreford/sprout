<!DOCTYPE html>
<!--
  ============================================================================
  GIGA — ONE MAN'S THOUGHTS ON MANAGING MASSIVE PROJECTS
  Self-playing HD presentation · one file · zero dependencies · synthetic data
  ----------------------------------------------------------------------------
  ARCHITECTURE
    <style>        design tokens · 1920x1080 stage · print stylesheet
    S[]            every sheet is an atom: {ch, dur, html, demo}
    schedule       derived, never stored — content fixed, intermissions = float
    DEMOS{}        canvas engines: plant · forecast · zoom · cube · atoms ·
                   triage · stage · pulse · lattice · counter · selfmodel
    NARR{}         full narration, exportable for ElevenLabs (press x)
  KEYBOARD
    j/k arrows space   navigate        №⏎    goto sheet
    /  n  N            find · cycle    m     mode: manual · preview · room
    g/G                first / last    p     pause    f  fullscreen
    v  narration       r  provenance   x     export narration    ?  help
  QUINE
    The deck runs its own model on itself: the schedule bar is the plan,
    intermissions are the float, a late start is absorbed, the end holds,
    and the sheet "This Deck, As Atoms" derives this file's own state live.
  ============================================================================
-->

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>GIGA · Phone Edition</title>
<meta name="theme-color" content="#070B10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GIGA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B10;
  --panel:#0D141B;
  --ink:#E9EEF3;
  --dim:#93A6B4;
  --amber:#FFAD33;      /* float · safety · attention */
  --red:#FF5147;
  --blue:#53C2D4;       /* data · derived views */
  --violet:#8E7CFF;     /* forecast · uncertainty */
  --green:#2FBF8B;      /* satisfied constraints ONLY */
  --line:#1D2933;
  --disp:"Barlow Condensed",Impact,sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
button{font-family:var(--mono);cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- SHEET FRAME (engineering drawing) ---------- */
#sheet{position:fixed;inset:10px;border:1px solid var(--line);display:flex;flex-direction:column}
#topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:8px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);
  font-size:11px;color:var(--dim);flex-wrap:wrap}
#topbar .ch{color:var(--amber);letter-spacing:.08em}
#stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:clamp(18px,4vw,64px);display:flex;flex-direction:column;
  justify-content:center;opacity:0;transition:opacity .45s;pointer-events:none;overflow-y:auto}
.slide.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}

#titleblock{display:grid;grid-template-columns:1fr auto auto auto;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10px;color:var(--dim)}
#titleblock>div{padding:7px 12px;border-left:1px solid var(--line);white-space:nowrap}
#titleblock>div:first-child{border-left:none;overflow:hidden;text-overflow:ellipsis}
#tb-end{color:var(--amber)}
@media(max-width:560px){#titleblock{grid-template-columns:1fr auto}#tb-doc,#tb-rev{display:none}}

/* ---------- TYPE ---------- */
h1{font-family:var(--disp);font-weight:700;font-size:clamp(44px,9vw,120px);line-height:.95;letter-spacing:.01em}
h2{font-family:var(--disp);font-weight:600;font-size:clamp(28px,5.5vw,62px);line-height:1.02;margin-bottom:.5em}
h3{font-family:var(--disp);font-weight:500;font-size:clamp(20px,3.4vw,32px);color:var(--amber);margin-bottom:.4em}
p,li{font-size:clamp(15px,2.1vw,21px);line-height:1.5;max-width:34em}
p+p{margin-top:.7em}
ul{list-style:none}
li{padding-left:1.1em;position:relative;margin:.42em 0}
li::before{content:"";position:absolute;left:0;top:.62em;width:.5em;height:2px;background:var(--amber)}
.big{font-family:var(--disp);font-weight:700;font-size:clamp(34px,6.5vw,72px);line-height:1.05}
.punch{font-family:var(--disp);font-weight:600;font-size:clamp(22px,4vw,42px);color:var(--amber);margin-top:.8em}
.sub{color:var(--dim)}
.mono{font-family:var(--mono);font-size:.82em}
.kicker{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.14em;margin-bottom:1.2em}
.q{color:var(--blue)}
em{font-style:normal;color:var(--amber)}
.note{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:1.6em;max-width:40em}

/* ---------- BLACK HAT ---------- */
.bh-wrap{display:flex;gap:clamp(16px,4vw,48px);align-items:flex-start;flex-wrap:wrap}
.bh-hat{flex:0 0 auto}
.bh-hat svg{width:clamp(90px,16vw,170px);height:auto;display:block}
.bh-hat .role{font-family:var(--disp);font-weight:700;text-align:center;font-size:clamp(15px,2.4vw,24px);
  letter-spacing:.1em;color:var(--ink);margin-top:6px}
.bh-body{flex:1;min-width:min(88vw,300px)}
.bh-obj{font-family:var(--disp);font-weight:600;font-size:clamp(21px,3.6vw,36px);line-height:1.15;margin-bottom:.6em}
.bh-obj::before{content:"\201C"}.bh-obj::after{content:"\201D"}
.concession{border:1px solid var(--amber);padding:12px 16px;margin-top:1.2em;max-width:32em}
.concession .cl{font-family:var(--mono);font-size:10px;color:var(--amber);letter-spacing:.16em;margin-bottom:6px}
.concession p{font-size:clamp(14px,1.9vw,19px)}

/* ---------- DEMO / CANVAS ---------- */
.demoWrap{width:100%;max-width:1040px;margin:0 auto}
canvas.demo{width:100%;height:auto;display:block;border:1px solid var(--line);background:var(--panel)}
.demoBtns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.demoBtns button, .ctl{background:none;border:1px solid var(--amber);color:var(--amber);
  padding:8px 14px;font-size:12px;letter-spacing:.06em}
.demoBtns button:hover{background:var(--amber);color:var(--bg)}
.demoCap{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:10px}

/* readiness list */
.ready{max-width:640px;font-family:var(--mono);font-size:clamp(12px,1.9vw,15px)}
.ready .row{display:flex;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);opacity:0;transform:none}
.ready .row.in{opacity:1;transition:opacity .4s}
.ready .st{white-space:nowrap}
.st.sat{color:var(--green)}   /* satisfied constraint: the only green */
.st.open{color:var(--amber)}
.ready .verdict{margin-top:16px;font-family:var(--disp);font-size:clamp(22px,3.6vw,34px);font-weight:600}

/* chain */
.chain{max-width:560px}
.chain .node{border:1px solid var(--line);padding:9px 14px;margin:0;font-family:var(--mono);
  font-size:clamp(11px,1.8vw,14px);position:relative;transition:border-color .3s,color .3s}
.chain .node+.node{margin-top:16px}
.chain .node+.node::before{content:"";position:absolute;left:24px;top:-17px;width:2px;height:16px;background:var(--line)}
.chain .node.hot{border-color:var(--amber);color:var(--amber)}
.chain .node.hot::before{background:var(--amber)}

/* intermission */
.imWrap{text-align:left}
.imClock{font-family:var(--mono);font-size:clamp(34px,9vw,90px);color:var(--amber)}
.imMeta{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:14px;line-height:1.9}

/* replay */
.replay{font-family:var(--mono);font-size:clamp(11px,1.8vw,14px);max-width:640px}
.replay table{border-collapse:collapse;width:100%}
.replay td{border-bottom:1px solid var(--line);padding:7px 6px}
.replay td:last-child{text-align:right;color:var(--blue)}
.replay .hash{margin-top:12px;color:var(--dim)}
.replay .hash b{color:var(--amber);font-weight:500}

/* nav */
#nav{position:fixed;right:14px;bottom:52px;display:flex;gap:8px;z-index:9}
#nav button{background:var(--panel);border:1px solid var(--line);color:var(--dim);width:40px;height:40px;font-size:16px}
#nav button:hover{color:var(--amber);border-color:var(--amber)}
#ctlbar{display:flex;gap:8px;align-items:center}
.ctl{font-size:10px;padding:4px 8px}
.ctl.onstate{background:var(--amber);color:var(--bg)}
#latebanner{display:none;color:var(--red)}
#progress{position:fixed;left:10px;right:10px;bottom:10px;height:2px;background:var(--line);z-index:9}
#progress i{display:block;height:100%;width:0;background:var(--amber)}

/* v2 additions */
.cols{columns:2;column-gap:3.5em}
@media(max-width:760px){.cols{columns:1}}
li .d{display:block;color:var(--dim);font-size:.8em;line-height:1.45;margin-top:2px}
.tag{font-family:var(--mono);font-size:10px;color:var(--bg);background:var(--amber);padding:2px 6px;letter-spacing:.1em}
.reg input{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:var(--mono);
  font-size:13px;padding:9px 12px;width:min(100%,420px)}
.reg .hit{border:1px solid var(--line);padding:10px 12px;margin-top:10px;max-width:640px;font-size:clamp(12px,1.8vw,15px)}
.reg .hit .o{font-family:var(--disp);font-weight:600;font-size:1.15em}
.reg .hit .c{color:var(--amber);font-family:var(--mono);font-size:.8em;margin-top:4px}
.tbl{font-family:var(--mono);font-size:clamp(10px,1.6vw,13px);border-collapse:collapse;margin-top:.6em}
.tbl td,.tbl th{border:1px solid var(--line);padding:6px 10px;text-align:left;font-weight:400}
.tbl th{color:var(--dim)}

/* v3 */
.slide{justify-content:flex-start}
.slide::before,.slide::after{content:"";flex:1 0 10px}
.slide.on>*:not(style){animation:rise .5s ease backwards}
.slide.on>*:nth-child(2){animation-delay:.06s}.slide.on>*:nth-child(3){animation-delay:.12s}
.slide.on>*:nth-child(4){animation-delay:.18s}.slide.on>*:nth-child(5){animation-delay:.24s}
.slide.on>*:nth-child(6){animation-delay:.30s}.slide.on>*:nth-child(7){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.on>*{animation:none!important}}
h2{position:relative;padding-top:14px}
h2::before{content:"";position:absolute;top:0;left:1px;width:44px;height:3px;background:var(--amber)}
.chapcard{display:flex;flex-direction:column;justify-content:center}
.chapcard .n{font-family:var(--disp);font-weight:700;font-size:clamp(80px,22vw,240px);
  line-height:.9;color:transparent;-webkit-text-stroke:1.5px var(--amber);opacity:.9}
.chapcard h2{font-size:clamp(34px,7vw,76px);margin:.15em 0 .2em;padding-top:0}
.chapcard h2::before{display:none}
.chapcard .tag{color:var(--dim);font-size:clamp(15px,2.4vw,22px);max-width:30em}
#sched{display:flex;gap:2px;height:9px;margin:0;padding:0 2px;background:var(--bg);
  border-top:1px solid var(--line);position:relative;cursor:pointer}
#sched .seg{outline-offset:-2px;height:100%;background:#202A34;transition:width .8s cubic-bezier(.4,0,.2,1);min-width:2px}
#sched .seg:hover{background:#2C3946}
#sched .seg.float{background:var(--amber);opacity:.5}
#sched .seg.float:hover{opacity:.8}
#sched .ph{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);pointer-events:none;transition:left .2s linear}
.hero{position:relative}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.hero .fg{position:relative}
.imClock{text-shadow:0 0 30px rgba(242,163,60,.35)}
.st.sat{text-shadow:0 0 14px rgba(62,155,107,.5)}
canvas.demo{background:linear-gradient(180deg,#080D13 0%,#0B1219 60%,#0E161E 100%)}

/* ── CUT FOR PHONE ── the fixed 1920×1080 stage + the rotate-your-phone-90° hack; the original responsive styles below/above take over
   (inner comment markers below are spaced with ∕ so this block comment survives)
∕* v4 — HD 1920×1080 stage *∕
body{background:#04070A}
#viewport{position:fixed;inset:0;overflow:hidden}
#sheet{position:absolute;left:50% !important;top:50% !important;
  right:auto !important;bottom:auto !important;
  width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(var(--sc,1));transform-origin:center;
  background:var(--bg);border:1px solid var(--line)}
#topbar{font-size:15px;padding:12px 22px}
#titleblock{font-size:14px}
#titleblock>div{padding:10px 18px}
#sched{height:13px}
.slide{padding:70px 110px}
h1{font-size:170px}
h2{font-size:64px;padding-top:18px}
h2::before{width:56px;height:4px}
h3{font-size:36px}
p,li{font-size:27px;line-height:1.5;max-width:36em}
.big{font-size:84px}
.punch{font-size:44px}
.kicker{font-size:16px;margin-bottom:1.4em}
li .d{font-size:20px}
.note{font-size:15px}
.mono{font-size:.85em}
.tbl{font-size:19px}
.tbl td,.tbl th{padding:9px 16px}
.bh-hat svg{width:220px}
.bh-hat .role{font-size:26px}
.bh-obj{font-size:44px}
.concession p{font-size:23px}
.concession .cl{font-size:14px}
.chapcard .n{font-size:300px;-webkit-text-stroke:2px var(--amber);animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(26px)}}
@media (prefers-reduced-motion:reduce){.chapcard .n{animation:none}}
.chapcard h2{font-size:96px}
.chapcard .tag{font-size:28px}
.imClock{font-size:120px}
.imMeta{font-size:17px}
.ready{font-size:19px;max-width:900px}
.ready .verdict{font-size:40px}
.chain{max-width:760px}
.chain .node{font-size:19px;padding:12px 18px}
.replay{font-size:19px;max-width:900px}
.reg input{font-size:19px;width:560px;padding:12px 16px}
.reg .hit{font-size:19px;max-width:860px}
.reg .hit .c{font-size:15px}
.tag{font-size:14px}
.demoWrap{max-width:1560px}
.demoBtns button,.ctl{font-size:16px;padding:10px 18px}
.ctl{font-size:14px;padding:6px 12px}
.demoCap{font-size:15px}
#nav{position:absolute;right:22px;bottom:70px}
#nav button{width:54px;height:54px;font-size:24px}
@media (max-width:640px){#titleblock{grid-template-columns:1fr auto}}
── END CUT ── */

/* ── CUT FOR PHONE ── keyboard TUI styling — a desktop affectation; there is no j/k on a thumb
   (inner comment markers below are spaced with ∕ so this block comment survives)
∕* TUI navigation *∕
#tui{position:absolute;left:22px;bottom:70px;font-family:var(--mono);font-size:15px;
  color:var(--dim);background:rgba(13,20,27,.92);border:1px solid var(--line);
  padding:8px 14px;letter-spacing:.04em;max-width:1100px;pointer-events:none}
#tui b{color:var(--amber);font-weight:500}
#tui .stat{color:var(--ink)}
#tuihelp{position:absolute;inset:0;display:none;background:rgba(4,7,10,.88);z-index:20;
  padding:120px 140px;font-family:var(--mono)}
#tuihelp.open{display:block}
#tuihelp h2{font-family:var(--disp);color:var(--amber);margin-bottom:.6em}
#tuihelp table{border-collapse:collapse;font-size:20px}
#tuihelp td{padding:8px 26px 8px 0;border-bottom:1px solid var(--line);color:var(--dim)}
#tuihelp td:first-child{color:var(--amber);white-space:nowrap}
── END CUT ── */

/* v5 polish */
#tb-doc b{color:var(--dim);font-weight:400}
#stamp{position:absolute;right:26px;top:64px;font-family:var(--mono);font-size:12px;
  color:var(--dim);letter-spacing:.22em;border:1px solid var(--line);padding:4px 10px;
  opacity:.55;pointer-events:none}
/* ── CUT FOR PHONE ── provenance chips + presenter notes — inside-baseball for the person running the room, noise for a phone reader
   (inner comment markers below are spaced with ∕ so this block comment survives)
.provchip{position:absolute;right:26px;bottom:70px;font-family:var(--mono);font-size:13px;
  letter-spacing:.14em;padding:5px 12px;border:1px solid var(--line);color:var(--dim);display:none}
body.review .provchip{display:block}
.provchip.rec{border-color:var(--green);color:var(--green)}
.provchip.src{border-color:var(--blue);color:var(--blue)}
.provchip.prop{border-color:var(--amber);color:var(--amber)}
#notes{position:absolute;left:22px;right:22px;bottom:120px;display:none;z-index:15;
  background:rgba(13,20,27,.96);border:1px solid var(--line);border-left:3px solid var(--amber);
  padding:20px 26px;font-family:var(--mono);font-size:17px;line-height:1.7;color:var(--ink);max-width:1200px}
#notes.open{display:block}
#notes .nl{color:var(--amber);font-size:13px;letter-spacing:.18em;margin-bottom:8px}
── END CUT ── */
.receipt{font-family:var(--mono);font-size:22px;border:1px solid var(--line);
  padding:26px 34px;max-width:760px;line-height:2.0}
.receipt .rrow{display:flex;justify-content:space-between;gap:40px;border-bottom:1px dashed var(--line)}
.receipt .rrow:last-child{border-bottom:none}
.receipt b{color:var(--amber);font-weight:500}
/* ── CUT FOR PHONE ── print stylesheet — nobody prints from a phone
   (inner comment markers below are spaced with ∕ so this block comment survives)
@media print{
  body{background:#fff}
  #viewport{position:static;overflow:visible}
  #sheet{position:static;width:auto;height:auto;transform:none!important;border:none;background:#fff;color:#111}
  #topbar,#sched,#nav,#tui,#tuihelp,#notes,#stamp,.provchip{display:none!important}
  .slide{position:static;opacity:1!important;pointer-events:auto;page-break-after:always;color:#111;padding:40px}
  .slide::before,.slide::after{display:none}
  canvas{display:none!important}
  h1,h2,h3,.punch,.big{color:#111}
  #titleblock{color:#555;border-top:1px solid #ccc}
}
── END CUT ── */

/* fault toast — any runtime error names itself on stage */
#fault{position:absolute;left:22px;top:70px;display:none;z-index:40;max-width:1300px;
  background:rgba(13,20,27,.97);border:1px solid var(--red);border-left:4px solid var(--red);
  color:var(--red);font-family:var(--mono);font-size:16px;padding:14px 20px;line-height:1.6}
/* history sheets */
.hist{position:relative}
.hist .yr{position:absolute;right:0;top:50%;transform:translateY(-50%);
  font-family:var(--disp);font-weight:700;font-size:340px;line-height:.85;
  color:transparent;-webkit-text-stroke:1.5px var(--line);opacity:.85;pointer-events:none;
  letter-spacing:-.02em}
.hist .fg{position:relative;max-width:1050px}
.chapcard .epi{font-family:var(--mono);font-size:17px;color:var(--blue);
  margin-top:1.4em;letter-spacing:.05em}

/* v6 — integration pass */
canvas.demo{border:none;background:transparent;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%),
                     linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%),
             linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);
  mask-composite:intersect}
.demoCap{border-left:3px solid var(--amber);padding-left:14px;margin-top:16px;max-width:70em}
#ambient{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5}
#stage{z-index:1}
#sched .seg.float{background:repeating-linear-gradient(45deg,var(--amber) 0 4px,transparent 4px 8px);opacity:.55}
#sched .seg.float:hover{opacity:.9}
#sched .ph{box-shadow:0 0 10px 2px rgba(255,173,51,.55);background:var(--amber)}
.imClock{position:relative}

/* ───────────── PHONE EDITION PASS ───────────── */
#sheet{inset:0;border:none}
#topbar{padding:8px 10px;font-size:10px;padding-top:calc(8px + env(safe-area-inset-top))}
#titleblock{padding-bottom:env(safe-area-inset-bottom)}
#titleblock>div{padding:6px 8px}
.slide{padding:20px 16px 76px}
#nav{right:12px;bottom:60px}
#nav button{width:46px;height:46px;font-size:20px;border-radius:10px;
  background:rgba(13,20,27,.9)}
#sched{height:16px}
.hist .yr{font-size:clamp(90px,32vw,220px)}
#stamp{top:auto;bottom:118px;right:12px;font-size:9px;letter-spacing:.12em;padding:3px 7px}
#fault{left:10px;right:10px;top:52px;font-size:12px;max-width:none}
.receipt{font-size:15px;padding:16px 18px;line-height:1.9;max-width:100%}
.reg input{width:100%}
.bh-hat svg{width:104px}

/* ============================================================
   GIGA self-playing presentation.
   The schedule is derived, not stored: content durations are
   fixed; intermissions are the float; end time holds.

let TOTAL = 0;                   // derived below: content plus float — never stored
let   late  = 0;                 // late-start seconds consumed from float
let   speed = 40;                // preview compression (1 = room speed)
let   paused = false;

/* ---------- black hat SVG ---------- */
function hatSVG(role){
  return `<div class="bh-hat"><svg viewBox="0 0 200 130" aria-hidden="true">
    <path d="M30 92 Q30 34 100 34 Q170 34 170 92 Z" fill="#0A0D10" stroke="#3A4450" stroke-width="2"/>
    <rect x="8" y="92" width="184" height="14" rx="7" fill="#0A0D10" stroke="#3A4450" stroke-width="2"/>
    <rect x="88" y="24" width="24" height="14" rx="4" fill="#0A0D10" stroke="#3A4450" stroke-width="2"/>
    <text x="100" y="78" text-anchor="middle" font-family="Barlow Condensed" font-weight="700"
      font-size="26" fill="#F2A33C" letter-spacing="1">${role}</text>
  </svg></div>`;
}
function blackhat(role,obj,ans,conc){
  return `<div class="bh-wrap">${hatSVG(role)}
    <div class="bh-body">
      <div class="kicker">BLACK HAT · SCRIPTED DIALOGUE</div>
      <div class="bh-obj">${obj}</div>
      ${ans}
      <div class="concession"><div class="cl">CONCESSION</div><p>${conc}</p></div>
    </div></div>`;
}
function intermission(n,amb,key){
  return `<div class="imWrap"><div class="kicker">INTERMISSION ${n} · AMBIENT: ${amb}</div>
    <div class="imClock" data-im>--:--</div>
    <div class="imMeta">RESUMES ON THE DERIVED SCHEDULE, TO THE SECOND<br>
    QUESTIONS → TEAMS CHANNEL · ALL ANSWERED IN WRITING BY FRIDAY<br>
    INTERMISSIONS ARE THE FLOAT — A LATE START IS ABSORBED HERE</div>
    <canvas class="demo" data-amb="${key}" style="margin-top:22px;max-width:820px"></canvas></div>`;
}

/* ---------- slide data (v2 — expanded) ---------- */
const S = [];
const add = (ch,dur,html,demo)=>S.push({ch,dur,html,demo});
const PROP = t=>`<p class="note">PROPOSAL — ${t}; mark before the room.</p>`;

/* ============ CH 1 — THE PROBLEM (opening act) ============ */
add("CH 1",16,`<div class="chapcard"><div class="n">01</div><h2>THE PROBLEM</h2><p class="tag">Sixteen systems, seven procedures, forty minutes — and a record that can't say whether the assembly ever happened.</p><p class="epi">1931 · The Empire State Building rose in about 410 days. The building survived. The reasoning didn't.</p></div>`);
add("CH 1 · OPENING",90,`<div class="hero" style="min-height:70vh;display:flex;flex-direction:column;justify-content:center">
  <canvas data-demo="lattice"></canvas>
  <div class="fg">
  <div class="kicker">A PRESENTATION · A DEMONSTRATION · A WORKING THEORY</div>
  <h1>GIGA</h1><h3>One Man's Thoughts On Managing Massive Projects</h3>
  <p class="punch">We're doing things right. There's room for improvement.</p>
  <p class="sub">This runs a little over four hours and ends on the derived schedule, to the second. The bar below this deck is the schedule — the amber segments are the float.</p>
  </div></div>`,'lattice');

add("CH 1 · WHO",100,`<h2>Who's Presenting</h2>
  <p>This session is pre-recorded and self-playing. The arguments arrive at the pace they were written.</p>
  <p>Several hundred small applications shipped this year. The engine behind everything you're about to see runs live at taskiap.com/ace — one HTML file, no server, no login. Save the page and you own it.</p>
  <p class="sub">Questions go to the Teams channel, any time, including right now. Every one is answered in writing, to everyone, by Friday.</p>`);

add("CH 1 · THE PROBLEM",180,`<h2>The Problem You Already Have</h2>
  <p>To make one decision, a qualified person pulls up sixteen systems, seven procedures, four drawings, two emails, and a Teams message.</p>
  <p>The information exists. Assembly costs forty minutes.</p>
  <p>So people either don't do it — or decide without it.</p>
  <p class="punch">And the record can't tell you which.</p>`);

add("CH 1 · ANATOMY",150,`<h2>Anatomy of the Forty Minutes</h2>
  <ul class="cols">
  <li>Find the work package<span class="d">and the revision you're actually on</span></li>
  <li>Find the governing procedure<span class="d">then the procedure it references, then the one that references</span></li>
  <li>Check the permit status<span class="d">different system, different login</span></li>
  <li>Check who's qualified and on shift<span class="d">a spreadsheet, usually</span></li>
  <li>Check what else is in the area<span class="d">ask around; hope</span></li>
  <li>Find the email where this was discussed<span class="d">email is transport, not record — but today it's the record</span></li>
  <li>Confirm nothing changed since Tuesday<span class="d">you can't</span></li>
  </ul>
  <p class="punch">None of these steps is wrong. The cost is the assembly — and the assembly leaves no trace.</p>`);

add("CH 1 · THE QUESTION",180,`<h2>The Question</h2>
  <p class="big">Can everything be a constraint?</p>
  <p>The permit is a constraint. The hold point is a constraint. The isolation two buses away is a constraint. A qualified welder being on shift is a constraint. Concrete cure time is a constraint. A REGDOC clause is a constraint.</p>
  <p>Each one has an owner. Each one has a condition that closes it. Nothing else is required for the whole argument that follows.</p>`);

add("CH 1 · THE CHAIN",150,`<h2>The Same Object at Every Scale</h2>
  <p>The Nuclear Safety and Control Act constrains the REGDOC. The REGDOC constrains the management system. The management system constrains the procedure. The procedure constrains the work package. The work package constrains the activity. The activity constrains a person's afternoon.</p>
  <p class="punch">Same object at every scale. No special cases. It bottoms out at the leaf — the thing a person does with their hands on a Tuesday.</p>`);

add("CH 1 · WHAT THIS IS",130,`<h2>What This Is</h2>
  <p>A working theory, and a demonstration of it. Not a product. Not a pitch.</p>
  <p>In 1968 Doug Engelbart demoed the mouse by moving it. Same rule here: everything claimed on screen is running on screen.</p>
  <p>Take 10% of it and implement it with the systems you already run — AWP still stands, P6 stays the schedule of record, the management system keeps its commitments. JTM, ACE, FMC, BASIS: none of them are required. The ideas are.</p>
  <p class="punch">Every claim here is an extension, not a replacement.</p>`);

add("CH 1 · WHY BOTHER",130,`<h2>Why Bother</h2>
  <p>Gigawatts of clean energy. We aren't doing this for no reason.</p>
  <p>On a program of this scale, 1–2% of efficiency is a gigadollar. Not by working harder — by making the decision that already gets made forty minutes faster, with the record intact.</p>
  <p>And continual improvement is not an initiative here. It is what the management system already requires — CSA N286 makes it a top-management accountability across the full lifecycle, and CNSC REGDOC-2.1.1 is the regulatory hook. This session is that requirement, exercised.</p>
  <p class="note">Exact clause wording to be pulled and quoted precisely before publication (verified at summary level Sept 5).</p>`);

add("CH 1 · HISTORY",120,`<div class="hist"><div class="yr">410</div><div class="fg">
  <h2>The Building Survived. The Reasoning Didn't.</h2>
  <p>The Empire State Building went up in about 410 days — steel arriving on a rhythm, crews flowing floor to floor, decisions made at the pace of the work. It remains the reference for what construction can do when the flow is right.</p>
  <p>What didn't survive is <em>why</em>. The building stands; the decisions that built it are gone. Every project since has faced the same trade — and mostly made it the same way.</p>
  <p class="punch">This deck is about keeping the reasoning without slowing the steel.</p>
  </div></div>`);

add("CH 1 · DEMO",360,`<h2>The Plant Rising</h2>
  <div class="demoWrap"><canvas class="demo" data-demo="plantwhatif"></canvas>
  <div class="demoBtns"><button data-act="hold">+6 MO REGULATORY HOLD</button><button data-act="reset">RESET</button></div>
  <div class="demoCap">"+6 months regulatory hold" — one click. The curve bends, downstream work re-derives, and nothing was typed into a schedule. That's the weekly conversation, done in one click. SYNTHETIC DATA THROUGHOUT.</div></div>`,'plantwhatif');

add("CH 1 · DEMO",210,`<h2>The Zoom</h2>
  <div class="demoWrap"><canvas class="demo" data-demo="zoom"></canvas>
  <div class="demoBtns"><button data-act="rezoom">REPLAY THE ZOOM</button></div>
  <div class="demoCap">Month sixty. Zoom into one room. It's a light fixture. The fixture is nothing — the isolation isn't. The circuit you isolated is not the only way that panel can be fed. The hazard is two buses away, invisible from where the worker stands. Same model. No transition. The zoom is the argument.</div></div>`,'zoom');

add("CH 1 · WHAT YOU SAW",130,`<h2>What You Just Saw</h2>
  <p>The constraint on that fixture carried knowledge the worker cannot see from where he stands.</p>
  <p>That is a constraint's entire job.</p>
  <p>Constraints aren't overhead on a small task — they are the only thing connecting a small task to a big consequence. When the chain is invisible, risk-important and critical steps can be lost in the fog. People have died on the wrong-lightbulb class of task.</p>
  <p class="punch">The chain should be visible.</p>`);

add("CH 1 · READINESS",170,`<h2>The Readiness View</h2>
  <div class="ready" data-demo="ready"></div>
  <div class="demoCap" style="margin-top:14px">The screen does not say "ready." It says everything declared has been checked, by a named person, at a known time. Whether it's ready is still a qualified professional's call.</div>`,'ready');

add("INTERMISSION",0,intermission(1,"THE PLANT RISING","plant"),'im');

/* ============ CH 2 — THE ENGINE ============ */
add("CH 2",16,`<div class="chapcard"><div class="n">02</div><h2>THE ENGINE</h2><p class="tag">P6 stores dates. This chapter is about where dates come from.</p><p class="epi">1957 · The first CPM schedule was computed from a network, not written into a table.</p></div>`);
add("CH 2 · HISTORY",110,`<div class="hist"><div class="yr">1917</div><div class="fg">
  <h2>The Chart That Ate the Plan</h2>
  <p>Henry Gantt drew bars so shipyard managers could <em>see</em> a plan that lived somewhere else. The bars were a picture of the reasoning — never the reasoning itself.</p>
  <p>A century later the picture won. The industry schedules by drawing the bars, and the reasoning lives nowhere.</p>
  <p class="punch">Every chart in this deck is a picture of a model you can query. That's the whole difference.</p>
  </div></div>`);

add("CH 2 · HISTORY",130,`<div class="hist"><div class="yr">1957</div><div class="fg">
  <h2>Born Derived</h2>
  <p>The critical path method wasn't written by hand. Kelley and Walker computed it — a dependency network fed to a mainframe, dates falling out as answers. The schedule was born as a <em>derived result</em>. A year later PERT did the same for Polaris, with uncertainty in every duration.</p>
  <p>Somewhere between 1957 and now, the industry started storing the answers and throwing away the network.</p>
  <p class="punch">Nothing in this chapter is new physics. It's the original physics, given back its computer.</p>
  </div></div>`);

add("CH 2 · THE ENGINE",180,`<h2>Where Dates Come From</h2>
  <p class="big">P6 stores dates. It cannot show its work.</p>
  <p>Every date on this project is the output of constraints — permits, crews, cure times, regulatory holds. Someone worked those out, typed the answer into P6, and the reasoning evaporated.</p>
  <p>What you saw in the demo runs it the other way: hold the constraints, derive the dates. Seeded and deterministic — replay it against the constraints as they stood, get the same dates. Every date has a why, and the why has a name.</p>
  <p class="punch">We call that engine ACE. P6 stays the schedule of record. ACE is what you run before you touch it.</p>`);

add("CH 2 · NAMES",120,`<h2>The Names</h2>
  <ul>
  <li><em>ACE</em> — Atomic Constraint Engine<span class="d">The engine from the last slide. Holds constraints, derives dates.</span></li>
  <li><em>ACT</em> — Atomic Constraint Theory<span class="d">The idea under it: everything is a constraint.</span></li>
  <li><em>FMC</em> — Full Monte Carlo<span class="d">ACE run thousands of times against the uncertainty in every constraint.</span></li>
  </ul>
  <p class="sub" style="margin-top:1.2em">More names exist. They show up when the screen needs them. These three come back all day. Every acronym in this deck is spelled out — and made to justify itself — in the glossary at the end of chapter nine.</p>`);

add("CH 2 · ACT",160,`<h2>ACT — Atomic Constraint Theory</h2>
  <p>Everything is a constraint. Not "can be modeled as" — <em>is.</em></p>
  <p>A constraint is small: a condition, an owner, a closure trigger, a timestamp, a revision. That's the atom. Everything in the next three hours is built from it and only it.</p>
  <p>Scheduling is fuzzy because reality is fuzzy — a constraint doesn't hide that, it carries it. The uncertainty stays attached to the thing that's uncertain, instead of being averaged away three levels up.</p>
  <p class="sub">Everything else in this deck is built on this record and nothing else.</p>`);

add("CH 2 · THE ATOM",140,`<h2>The Atom</h2>
  <p class="mono" style="color:var(--blue)">id · name · type · kind · tags · requires · contains</p>
  <p>Seven fields. Two links: <em>contains</em> is the tree, <em>requires</em> is the chain of what must come first. One derive step.</p>
  <p>No cycles. Ever. The engine refuses to save a graph that would deadlock.</p>
  <p class="punch">Everything for the rest of the day is this record — worn seventy-two ways.</p>`);

add("CH 2 · FIVE KINDS",140,`<h2>Five Ways a Thing Finishes</h2>
  <p>The kind field answers one question: who declares it done?</p>
  <table class="tbl"><tr><th>KIND</th><th>DONE WHEN</th></tr>
  <tr><td>LEAF</td><td>somebody flips it — with evidence if the tag demands it</td></tr>
  <tr><td>GATE</td><td>its waits clear · no inherent work · RFIs and constraints live here</td></tr>
  <tr><td>ROLLUP</td><td>everything it contains is done · no separate progress field</td></tr>
  <tr><td>VERIFIED</td><td>proven — the work AND a witness signature. Two locks.</td></tr>
  <tr><td>TRIVIAL</td><td>born done · lessons, closed history, reference facts</td></tr></table>
  <p class="sub">Five. Not four. Not seven.</p>`);

add("CH 2 · ACE",160,`<h2>ACE — Atomic Constraint Engine</h2>
  <p>ACE is the physics on that ground. It takes the constraints as they stand and derives what follows — dates, sequences, blockers, the readiness view you already saw.</p>
  <p>Seeded and deterministic: same constraints in, same answer out, every time, on anyone's machine. The schedule stops being a report and becomes a reproducible result.</p>
  <p class="punch">A constraint with no data never finishes. The engine will not invent a date.</p>`);

add("CH 2 · DARK ATOM",140,`<h2>The Dark Atom</h2>
  <p>A constraint exists — everyone knows it's there — but it has no data. No estimate, no owner response, no basis.</p>
  <ul>
  <li>The engine carries it forward as unfinished. Forever, if necessary.</li>
  <li>Everything downstream of it inherits the honesty: those dates show as conditional, not clean</li>
  <li>What P6 can't say: <em>"I don't know yet"</em> — P6 has no cell for that</li>
  </ul>
  <p class="punch">A dark atom on screen is not a failure of the system. It's the system refusing to lie.</p>`);

add("CH 2 · BLACK HAT",180,blackhat("SCHEDULER",
  "We use PMI and P6. Why touch what works?",
  `<p>P6 stays. It remains the schedule of record and the contractual artifact. ACE runs <em>before</em> you touch it — it's where the dates come from, not where they live. Same strangler-pattern coexistence as everything else here: nothing is ripped out on day one.</p>`,
  "The board still gets a date. The engine just won't pretend it derived one."));

add("CH 2 · FMC",170,`<h2>FMC — Full Monte Carlo</h2>
  <p>Every constraint carries its uncertainty. Run ACE thousands of times and the answer isn't a date — it's a shape.</p>
  <ul>
  <li>Float is a <em>histogram</em>, not a number<span class="d">the single float value was always a summary someone chose</span></li>
  <li>Margin is the shape<span class="d">a fat right tail is a different conversation than a tight peak, even at the same P50</span></li>
  <li>Sort by cost of delay<span class="d">the queue of what to fix next falls out of the model — it isn't a judgement call</span></li>
  </ul>
  <div class="demoWrap"><canvas class="demo" data-demo="fmcmini" style="max-width:1200px"></canvas></div>`,'fmcmini');

add("CH 2 · HISTORY",110,`<div class="hist"><div class="yr">1943</div><div class="fg">
  <h2>The Curve the Shipyards Rode</h2>
  <p>Liberty ships went from months on the ways to weeks, hull after hull, because repetition graded the process and the process listened. The learning curve wasn't a chart on the wall — it was the yard getting measurably better at the same work.</p>
  <p class="punch">Calibration is that curve, kept on purpose — per class of work, with the forecast grading itself.</p>
  </div></div>`);

add("CH 2 · CALIBRATION",160,`<h2>The Forecast Eats Its Own Scorecard</h2>
  <p>Every estimate is checked against what actually happened — with a named owner on the calibration, not a vibe.</p>
  <ul>
  <li>Bias belongs to the <em>work type</em>, not the person<span class="d">nobody gets a personal accuracy score — the distribution for that class of work narrows or widens</span></li>
  <li>Fleet learning is the beneficiary<span class="d">unit two inherits unit one's corrected distributions on day one</span></li>
  </ul>
  <p class="punch">A forecast that never checks itself is an opinion with formatting.</p>`);

add("CH 2 · FLEX",130,`<h2>Flex</h2>
  <p>A flex package still has constraints — a crew with the right competency, a zone unlocked, material on the shelf. What makes flex <em>flex</em> is the shape: capacity constraints, not sequence constraints.</p>
  <p><span class="mono">requires</span> can point at a predicate instead of a name — <em>any idle civil crew</em> — so its gates fire on availability, not on completion.</p>
  <p class="punch">That's why flex absorbs schedule variance. Same record, same engine.</p>`);

add("CH 2 · DEMO",300,`<h2>Replay</h2>
  <div class="replay" data-demo="replay"></div>
  <div class="demoBtns"><button data-act="run">RUN</button><button data-act="replay">REPLAY</button></div>
  <div class="demoCap">Same constraints in, same result out, anyone's machine. Inputs immutable and versioned. This is the audit story: P6 can show what it said — it cannot show why, nor prove nobody changed a date. This can. SYNTHETIC DATA.</div>`,'replay');

add("INTERMISSION",0,intermission(2,"ATOMS CLEARING","atoms"),'im');

/* ============ CH 3 — PROCEDURES ARE ATOMS ============ */
add("CH 3",16,`<div class="chapcard"><div class="n">03</div><h2>PROCEDURES ARE ATOMS</h2><p class="tag">The Act to a Tuesday afternoon — same object at every scale.</p><p class="epi">1194 · Chartres burned. The rebuild ran on records longer than any builder's career.</p></div>`);
add("CH 3 · PROCEDURES",160,`<h2>Procedures Are Atoms</h2>
  <p>A procedure isn't a document with constraints described in it. It <em>is</em> a set of constraints — the document is one rendering.</p>
  <p>Preconditions are constraints. The named authority is a constraint. The hold point is a constraint that blocks until satisfied by someone with authority. That is the original atom definition, word for word.</p>
  <p class="punch">Procedures were always atoms. They were just written down as prose.</p>`);

add("CH 3 · THE CHAIN",180,`<h2>The Chain, Traversed</h2>
  <div class="chain" data-demo="chain">
    <div class="node">NUCLEAR SAFETY AND CONTROL ACT</div>
    <div class="node">REGDOC</div>
    <div class="node">MANAGEMENT SYSTEM (N286)</div>
    <div class="node">PROCEDURE</div>
    <div class="node">WORK PACKAGE</div>
    <div class="node">ACTIVITY</div>
    <div class="node">A PERSON'S TUESDAY AFTERNOON</div>
  </div>`,'chain');

add("CH 3 · HYPERTEXT",150,`<h2>A Citation Is Not a System</h2>
  <p>Procedures today reference each other by document number. You read the number, open SharePoint, search, guess the revision, repeat.</p>
  <ul>
  <li>A reference should be a link<span class="d">click the clause → every implementing procedure</span></li>
  <li>Click the hold point → the authority<span class="d">the role, as written</span></li>
  <li>Click the authority → who is actually assigned <em>today</em><span class="d">the name, on shift, qualification current</span></li>
  </ul>`);

add("CH 3 · REGULATOR",180,`<h2>The Regulator Answer</h2>
  <p>"Show me you satisfy this clause."</p>
  <ul>
  <li>Click it: every implementing procedure, every hold point inside them, every record produced</li>
  <li>The actual chain, not a binder that claims it</li>
  <li>Assembly that currently takes a person weeks, per audit → a query</li>
  </ul>
  <p class="punch">Compliance stops being a document you assemble and becomes a property you demonstrate.</p>`);

add("CH 3 · EXECUTABLE",190,`<h2>Executable Procedures</h2>
  <p>A hold point, six fields. Any field empty — the procedure isn't finished.</p>
  <table class="tbl"><tr><th>FIELD</th><th>WHAT IT HOLDS</th></tr>
  <tr><td>HOLD POINT</td><td>the step that blocks</td></tr>
  <tr><td>PRECONDITIONS</td><td>constraints that must close first</td></tr>
  <tr><td>AUTHORITY</td><td>a named role held by a single person — not a group inbox</td></tr>
  <tr><td>VERIFICATION</td><td>concurrent or independent — and which</td></tr>
  <tr><td>OUTCOME</td><td>released or held, with reason</td></tr>
  <tr><td>EVIDENCE</td><td>what was produced, attributed</td></tr></table>
  <p class="punch">Paper says the sign-off is required. This says it's blocked, on what, and who's holding it — now, without anyone asking.</p>`);

add("CH 3 · LIMITS",150,`<h2>What Does Not Execute</h2>
  <p>Judgement cores stay human, permanently:</p>
  <ul class="cols">
  <li>Emergency-response improvisation</li>
  <li>Policy, and the management-system manual's statements of intent</li>
  <li>Human relations — grievances, accommodation</li>
  <li>Craft — welding technique, rigging judgement</li>
  </ul>
  <p class="punch">Execute the wrapper. Leave the core alone.</p>
  <p class="sub">Every non-executable procedure still has an executable wrapper: emergency notification accounting, policy-to-clause linkage and review currency, collective-agreement clocks, qualification currency and witnessed hold points.</p>`);

add("CH 3 · IMPLEMENTATION",160,`<h2>Same System, Different Implementation</h2>
  <p>This does not replace the management system. It replaces the <em>implementation</em> of it — the forms, the routing, the SharePoint.</p>
  <p>N286 says what the management system must satisfy. It does not dictate mechanism. Same system, same commitments, same standard — queryable instead of filed.</p>`);

add("CH 3 · BASIS",130,`<h2>BASIS — The Law</h2>
  <p>Build Assurance and Structured Information System. It holds the rules: the procedures, the hold-point definitions, the revision policy, who may sign what.</p>
  <p>BASIS is the law. ACE is the physics. The engine executes what the law permits, and nothing else — version-control mechanics live in the engine; revision and rights policy live in the law.</p>
  <p class="sub">At turnover the B changes meaning: Baseline Authority. Same letters, same file, new life.</p>`);

add("CH 3 · BLACK HAT",180,blackhat("QUALITY",
  "Derived, never stored? Where's my record?",
  `<p>Everything is recorded. Inputs are immutable and versioned — replay the engine against the constraint set as it stood and get the same dates. The record doesn't just exist; it can prove nobody changed it. Views are derived; evidence never is.</p>`,
  "The record you file today, you can still file. Nothing you're required to keep goes away."));

add("CH 3 · THREE REGISTERS",150,`<h2>Three Registers per Document</h2>
  <ul>
  <li><em>VIEW</em> — what a person reads<span class="d">derived, current, disposable</span></li>
  <li><em>LLM</em> — machine-drafted material<span class="d">tracked, because machine editorialism must be visible</span></li>
  <li><em>TRACE</em> — signed human testimony<span class="d">trusted, because a person put their name on it</span></li>
  </ul>
  <p class="punch">Track machine editorialism. Trust human editorialism. The signature is the accountable.</p>`);

add("CH 3 · PLANNED REVISION",140,`<h2>Planned Revision as Schedule Logic</h2>
  <p>Every document carries its own revision trigger — next phase gate, next milestone, yearly, when system X comes online.</p>
  <p>Documents stop going quietly stale. Currency becomes a constraint like any other: visible, owned, and overdue in public.</p>
  <p class="sub">Including this deck.</p>`);

add("INTERMISSION",0,intermission(3,"THE CHAIN, ACT TO AFTERNOON","atoms"),'im');

/* ============ CH 4 — STKY³ ============ */
add("CH 4",16,`<div class="chapcard"><div class="n">04</div><h2>STKY³</h2><p class="tag">Probability, severity — and when the door shuts.</p><p class="epi">Nuclear operations invented the modern hold point. This chapter takes it upstream.</p></div>`);
add("CH 4 · STKY³",160,`<h2>STKY³</h2>
  <p>STKY comes from safety's SIF shift — stop spending attention on paper cuts, focus on what kills. That discipline stays sacred and unchanged.</p>
  <p>Said once, out loud, so nobody has to raise it: what kills <em>people</em> is not what this chapter is about. This extends the idea to what kills the <em>project</em>. Two different things. The first one always wins.</p>`);

add("CH 4 · THIRD AXIS",200,`<h2>The Third Axis</h2>
  <p class="big">Probability × Severity × Reversibility</p>
  <p>The same dollar loss can bleed over three years with a dozen intervention points — or turn permanent in one afternoon, with one signature.</p>
  <p class="punch">In the corner, probability stops mattering. Say it "STKY cubed" — the 3 is the axis count.</p>
  <div class="demoWrap"><canvas class="demo" data-demo="cube" style="max-width:1100px"></canvas></div>`,'cube');

add("CH 4 · CONTROLS MAP",160,`<h2>Not a Risk Matrix — a Controls Map</h2>
  <p>It doesn't tell you what to worry about. It tells you where a person has to be standing.</p>
  <ul>
  <li>Critical-step identification — the discipline ops already applies before touching a valve in a live station, extended upstream to construction and project decisions</li>
  <li>The control is not always a body in the room<span class="d">concurrent verification, a procedure hold point, a peer check, two signatures, a hard system stop — different weights for different corners</span></li>
  <li>Where it already lives — ops, rigging, quality hold points — it works<span class="d">the ask: are the uncovered areas considered decisions, or accidents of which department wrote the procedure?</span></li>
  </ul>`);

add("CH 4 · ARCHAEOLOGY",210,`<h2>Worked Example: Archaeology</h2>
  <ul>
  <li>Flat matrix: the biggest red dot on the register — and it produces no action</li>
  <li>The cube demotes the delay itself: painful, but reversible — early warning and float</li>
  <li>It promotes what wasn't on the register: mobilizing equipment into an uncleared area. Low probability, extreme severity, zero reversibility.</li>
  </ul>
  <p class="punch">And it names the control: concurrent heritage-clearance verification at the gate — not a month-end report.</p>`);

add("CH 4 · DOMAINS",170,`<h2>Where the Corners Are</h2>
  <ul class="cols">
  <li>Critical lifts</li>
  <li>Concrete discharge into a form carrying a design deviation<span class="d">reversible until the pour starts</span></li>
  <li>Long-lead PO release<span class="d">forgings, steam generators — a two-year door</span></li>
  <li>Regulatory submissions<span class="d">correctable, never un-sayable</span></li>
  <li>First fill · first criticality · one-way lineups<span class="d">where concurrent verification is already law — proof the method works</span></li>
  <li>Prime contract signature and claim releases</li>
  </ul>`);

add("CH 4 · BLACK HAT",180,blackhat("RISK",
  "Reversibility is already inside severity. And I'm not re-scoring three hundred risks.",
  `<p>Severity is the <em>size</em> of the outcome. Reversibility is <em>when the door shuts</em>. The axis doesn't change the number — it locates the intervention window.</p>`,
  "Nobody re-scores three hundred. Ask the reversibility question only of what already scores high on severity. About twenty items. One workshop."));

add("CH 4 · THE LIMIT",160,`<h2>The Limit — Stated First</h2>
  <p>Paper cuts aggregate. Fifteen minutes of tool-time loss × 10,000 workers is the whole AWP productivity case, and no instance of it is fatal or irreversible. STKY³ does not mean stop preventing paper cuts — it means stop letting them consume the attention fatal risk needs.</p>
  <p>Aggregate erosion is a different question with a different tool — and the atoms answer it for free. Every blocker is already a recorded constraint with a duration. Trend duration and recurrence by constraint class, give recurring classes an owner, fix procedurally.</p>
  <p class="punch">That loop, with evidence, is N286 continual improvement discharged.</p>`);

add("INTERMISSION",0,intermission(4,"THE CUBE ROTATING","cube"),'im');

/* ============ CH 5 — THE FIFTY SYSTEMS ============ */
add("CH 5",16,`<div class="chapcard"><div class="n">05</div><h2>THE FIFTY SYSTEMS</h2><p class="tag">Each one stays authoritative. None of them owns what's blocking the work.</p><p class="epi">1420 · Brunelleschi built the hoisting machines before he built the dome.</p></div>`);
add("CH 5 · HISTORY",115,`<div class="hist"><div class="yr">2005</div><div class="fg">
  <h2>Alberta</h2>
  <p>WorkFace Planning came out of the oil sands — foremen starved of ready work while the site drowned in unready work. COAA standardized it; CII's research grew it into Advanced Work Packaging. It is the biggest productivity idea this industry has ratified in a generation.</p>
  <p class="punch">The creed at the bottom of it: one crew, about a week, released only constraint-free.</p>
  </div></div>`);

add("CH 5 · AWP",140,`<h2>AWP, Properly</h2>
  <p>The hierarchy: <em>CWA</em> — a construction work area, cut from the plot plan. <em>CWP</em> and <em>EWP</em> — construction and engineering work packages, aligned so the drawings arrive shaped like the build. <em>IWP</em> — the installation work package a crew actually holds.</p>
  <p>And the release rule that makes it all work: an IWP does not release until it is <em>constraint-free</em>. Drawings, materials, scaffold, equipment, access, permits, qualified people — cleared before the crew ever sees it.</p>
  <p class="punch">Everything here completes AWP. Nothing here competes with it.</p>`);

add("CH 5 · MISSING OBJECT",150,`<h2>The Missing Object</h2>
  <p>AWP's release rule says <em>constraint-free</em> — and then never makes the constraint a first-class object. It lives in checklists, spreadsheets, and a planner's memory. The most important word in the framework has no schema.</p>
  <table class="tbl"><tr><th>AWP SAYS</th><th>THE ATOM IS</th></tr>
  <tr><td>CWA</td><td>an area atom — with the named owner AWP never assigned</td></tr>
  <tr><td>CWP / EWP</td><td>rollups — done when their children are done</td></tr>
  <tr><td>IWP</td><td>a rollup gated on its constraint classes</td></tr>
  <tr><td>"constraint-free"</td><td>every gate satisfied — each with an owner, a timestamp, a name</td></tr>
  <tr><td>WorkFace Planner</td><td>a person atom holding a role atom</td></tr></table>
  <p class="punch">This is the ten percent AWP was waiting for: its own central word, given a data model.</p>`);

add("CH 5 · FIFTY SYSTEMS",160,`<h2>The Fifty Systems</h2>
  <p>Maximo, SAP, P6, ARM, SharePoint — each stays authoritative in its domain. ACE reads them. It replaces none of them.</p>
  <p class="punch">What nobody owns today: "what's blocking this work package." That question has no system. It's the most expensive orphan on the project.</p>`);

add("CH 5 · HISTORY",110,`<div class="hist"><div class="yr">1984</div><div class="fg">
  <h2>The Trailer Wall</h2>
  <p>Goldratt's Theory of Constraints taught a generation that the constraint governs the system — then spent forty years as a poster in the site trailer. Everyone agrees with the poster. Nobody's schedule can point at the constraint.</p>
  <p class="punch">This is the theory taken off the trailer wall and made the data instead.</p>
  </div></div>`);

add("CH 5 · FIVE COSTUMES",130,`<h2>One Thing, Five Costumes</h2>
  <p>Schedule. Work breakdown. Materials. RFI log. Risk register. Five systems, five databases, five versions of the truth — and reconciling them is a full-time job. The reconciliation is usually wrong.</p>
  <p>They are one thing wearing five costumes. One table, two links, one derive — every one of those systems is a query on the same graph.</p>
  <p class="punch">The engine is small. The rest is discipline: refusing to add a second primitive when someone waves a whiteboard at you.</p>`);

add("CH 5 · ONE SPINE",170,`<h2>One WBS, Worn Four Ways</h2>
  <p>The WBS is the <span class="mono q">contains</span> tree — built once, owned once, reused everywhere. The estimate, the schedule, the cost report and the work packages are not four structures to reconcile. They are four readings of the same atoms.</p>
  <ul>
  <li><em>Estimate</em> — each leaf carries its quantity and unit rate as a distribution<span class="d">the estimate IS the atoms, priced — no re-mapping into a separate estimating structure</span></li>
  <li><em>Schedule</em> — ACE derives dates from the same leaves' constraints<span class="d">the network was always the WBS plus requires-links; no second breakdown for P6 to disagree with</span></li>
  <li><em>Cost</em> — actuals land on the leaf that did the work<span class="d">roll up the same tree and earned value falls out: budget, earned, actual on one spine</span></li>
  <li><em>Work packages</em> — CWPs and IWPs are rollups over the same leaves<span class="d">release gates read the very constraints the schedule was derived from</span></li>
  </ul>
  <p class="punch">Time control is the same loop run forward — forecast at the leaf, actual at the leaf, calibration closing the gap. One spine. No reconciliation meetings.</p>`);

add("CH 5 · BLACK HAT",210,blackhat("IT",
  "You're adding a fifty-first system.",
  `<p>That objection is an entry in the objection register. Watch: <span class="mono q">[the register is queried live, below]</span></p>
  <div class="reg" data-demo="register"><input type="text" placeholder="search the objection register…" aria-label="search objections"><div class="hits"></div></div>`,
  "Success criterion, out loud: if this becomes one more place people type things, it has failed."),'register');

add("CH 5 · CDE",160,`<h2>Replace Your CDE With an ACE</h2>
  <p>End-state: the CDE becomes a list of URLs with an authorization step. Each document is an atom tracking its own access.</p>
  <p>Phase one coexists with the contractual CDE — same strangler pattern as P6. Nothing is switched off; the better path just gets used more.</p>
  <p class="sub">And access is derived from assignment to the work, not stored grants. Today, too many people have access they don't need <em>and</em> too many lack access they do. Both problems are the same problem: grants are stored, not derived.</p>`);

add("CH 5 · TRANSPORT",140,`<h2>Email Is Transport, Not Record</h2>
  <ul>
  <li>The job jar is a query, never a list<span class="d">a list is stale the moment it's printed; a query is true when asked</span></li>
  <li>Advisory zones are exclusive only by declared exception</li>
  <li>CWA gets a named owner — a stated AWP deviation<span class="d">AWP defines the CWA as a portion of the plot plan and names process-administration roles; it assigns no owner or authority to a CWA. This adds one.</span></li>
  </ul>`);

add("CH 5 · HISTORY",120,`<div class="hist"><div class="yr">1420</div><div class="fg">
  <h2>The Machines Before the Dome</h2>
  <p>Brunelleschi won Florence's dome without complete drawings. What he had was method — the ox-hoist, the herringbone courses, the sequence. He built the machines before the masonry, because the <em>how</em> was the design.</p>
  <p>Six hundred years later we hold the geometry beautifully and the method barely at all. BIM is the drawings Brunelleschi didn't need. Constraints are the method he did.</p>
  <p class="punch">Hold both. Never confuse which one builds the dome.</p>
  </div></div>`);

add("CH 5 · SIX A.M.",140,`<h2>Six A.M.</h2>
  <p>Triage is a query, not a meeting. It walks the graph every morning and answers four questions, in order:</p>
  <div class="demoWrap"><canvas class="demo" data-demo="triage" style="max-width:1200px"></canvas></div>
  <p class="punch">Nothing gets its colour stored anywhere. Colours are derived — and green is a satisfied constraint, never a summary.</p>`,'triage');

add("CH 5 · BIM",160,`<h2>BIM</h2>
  <ul>
  <li>Not a BIM replacement — there are no models yet to replace<span class="d">BIM is right in principle and too slow in practice for Tuesday-speed questions</span></li>
  <li>STAGE models the work <em>in</em> the plant, not the plant<span class="d">2D polygon + height + time interval. Occupancy, not appearance. Pipes are rectangular prisms. Crude on purpose — photorealism would undermine the claim.</span></li>
  <li>Parametric constraints are what BIM structurally can't do<span class="d">BIM holds a coordinate someone decided; constraints solve where things have to be before anyone has decided — which is why it works pre-mobilization, before drawings exist</span></li>
  <li>BIM will come, and should<span class="d">atoms hold a pinned hyperlink to BIM at revision — never a copy of its geometry</span></li>
  </ul>`);

add("CH 5 · WINDOWS",190,`<h2>Windows of Certainty</h2>
  <p>The ask — the one thing this session asks you to give up: the single date.</p>
  <p>A date is a lie of precision. The histogram was always there; someone collapsed it before you saw it. Commit to windows: "between March and June, and here's the shape" — narrower as constraints close.</p>
  <p>What you get back is margin you can see, spend, and defend — instead of hidden float someone's protecting.</p>
  <p class="punch">Contracts and boards still ask for dates. The window is the truth; the date is a signature. The PM signs the date, and the signature is recorded against the window it collapsed — the gap between them is accepted risk, on the record, with a name.</p>
  ${PROP("elaboration beyond the ratified record")}`);

add("INTERMISSION",0,intermission(5,"STAGE OCCUPANCY","stage"),'im');

/* ============ CH 6 — DATA DOCTRINE ============ */
add("CH 6",16,`<div class="chapcard"><div class="n">06</div><h2>DATA DOCTRINE</h2><p class="tag">An attic is not a dataset. Structured at the moment of creation.</p><p class="epi">Masons were signing their stones eight hundred years ago.</p></div>`);
add("CH 6 · DOCTRINE",160,`<h2>Structured, Not Maximal</h2>
  <p>Every project already "captures everything" — terabytes of emails, PDFs, scans, and photos that nothing can query. An attic, not a dataset.</p>
  <p>Capture here is structured at the moment of creation: constraint, authority, timestamp, revision, attributed declaration. Queryable in ten years instead of archaeological.</p>
  <p class="punch">Chapter one asked whether the forty minutes ever happened — and the record couldn&rsquo;t tell you which. This record can.</p>
  <p class="sub">Never "as much data as possible." That phrase is a liability, and cyber is right to hear it that way.</p>`);

add("CH 6 · HISTORY",110,`<div class="hist"><div class="yr">1994</div><div class="fg">
  <h2>The Last Planner</h2>
  <p>Lean construction named a truth every site already knew: the only plan that matters is the one the foreman commits to this week. Everything above it is intent; the last planner's word is the plan.</p>
  <p class="punch">PULSE is that conversation — kept, attributed, and feeding the model instead of evaporating at the whiteboard.</p>
  </div></div>`);

add("CH 6 · PULSE",160,`<h2>PULSE — Field Capture</h2>
  <p>Project Unified Live Site Evidence. Weather, delays, photos, RFIs, constraints — captured where the work is.</p>
  <ul>
  <li>Narrative first<span class="d">record the intangibles and the why; then make it easy to create atomic data supplementing it</span></li>
  <li>Narratives roll up<span class="d">supervisor report, pour log — the story and the data are the same capture, not two forms</span></li>
  <li>At turnover it becomes Plant Unified Live Site Evidence<span class="d">same letters, new life</span></li>
  </ul>`);

add("CH 6 · VERNACULAR",120,`<h2>Site Vernacular</h2>
  <p>"The two-year door." "Watch form 12-B." "Crane calls it at 40." The site already compresses risk, sequence, and priority into its own language — and no system captures it.</p>
  <p>Narrative-first capture keeps the vernacular attached to the atoms it describes. The phrasing is data: what a crew names, it watches.</p>
  <p class="punch">Site vernacular is a free signal channel. Stop throwing it away.</p>`);

add("CH 6 · HISTORY",120,`<div class="hist"><div class="yr">1200</div><div class="fg">
  <h2>Masons' Marks</h2>
  <p>Medieval masons cut a personal mark into their stones — attribution for pay, for quality, for pride. Eight hundred years later you can walk a cathedral and know whose hands did what. The record outlived the men, the guild, and the language they spoke.</p>
  <p>That is the entire theory of testimony, carved in the material itself: a name, on the work, at the time.</p>
  <p class="punch">Green costs someone their name. The masons knew.</p>
  </div></div>`);

add("CH 6 · TRACE",150,`<h2>TRACE — Signed Testimony</h2>
  <p>Testimony Recorded with Attribution, Context, Evidence. The signed human-narrative register.</p>
  <p>Proficiencies are signed testimony, not credentials — a person with authority attesting "I watched this person do this work," on the record, revisable, attributable.</p>
  <p class="punch">TRACE is what makes any green defensible: who declared it, when, against which revision, on what evidence.</p>`);

add("CH 6 · NO GREEN",170,`<h2>No Green Anywhere — One Exception</h2>
  <p>Green is the colour of someone having stopped looking. There is no green in this deck except in one place, and you've already seen it.</p>
  <ul>
  <li>Green for a <em>satisfied constraint</em> — never green for a summary<span class="d">a gate check over a bounded set of preconditions has a definite answer and may show it</span></li>
  <li>A project cannot be green<span class="d">because nobody can verify a project</span></li>
  <li>The readiness view says "no known blockers" — not "ready"<span class="d">it attests everything declared was checked; it cannot attest nothing was missed</span></li>
  </ul>
  <p class="punch">Green costs someone their name.</p>`);

add("CH 6 · HISTORY",115,`<div class="hist"><div class="yr">1967</div><div class="fg">
  <h2>Exactly What Stands</h2>
  <p>After the Apollo 1 fire, NASA rebuilt how it knew what was built. Modern configuration management descends from that reckoning: at any moment, know exactly what stands, exactly as built, exactly why it differs from the drawing.</p>
  <p class="punch">Turnover is that discipline made cheap — because the record was structured on the day the work happened, not reconstructed the year after.</p>
  </div></div>`);

add("CH 6 · TURNOVER",210,`<h2>Turnover — the Best Single Argument</h2>
  <p>Begin with the end in mind — AWP's own founding phrase — but work backwards from turnover: construction-driven planning, <em>operations-driven recording</em>.</p>
  <ul>
  <li>The turnover package is a query against what was already recorded — not a truckload of binders</li>
  <li>Commissioning inherits attributed constraint chains</li>
  <li>Year one, something behaves oddly: ask why it was built that way — get the actual answer, with names</li>
  </ul>
  <p class="punch">Remember your last turnover. The masons&rsquo; marks outlived the masons — your records should outlive the build.</p>
  <p class="sub">And past turnover: decommissioning. Someone in eighty years needs to know what's behind that wall. One sentence — now back to next Tuesday.</p>`);

add("CH 6 · PEOPLE",150,`<h2>What the System Will Not Do</h2>
  <p>The system routes, records, and surfaces. It never rates or ranks people.</p>
  <p>Time-to-clear by person is one query away — and it is the query that kills this system's credibility. It will not exist. Trending is by constraint class, never by individual.</p>
  <p class="sub">Judged awards are safe; counted metrics are dangerous. That distinction is load-bearing and it is policy, not preference.</p>`);

add("INTERMISSION",0,intermission(6,"PULSE CAPTURE","pulse"),'im');

/* ============ CH 7 — THE DEVICES ============ */
add("CH 7",16,`<div class="chapcard"><div class="n">07</div><h2>THE DEVICES</h2><p class="tag">Ten thousand phones. The device is the works badge.</p><p class="epi">The badge is the oldest device on any site. This one learns to listen.</p></div>`);
add("CH 7 · ACT · SECOND PASS",130,`<h2>ACT — Second Pass</h2>
  <p>Everything since the first pass has been the same seven fields wearing different jackets:</p>
  <ul>
  <li>A hold point — a constraint carrying an authority (Chapter 3)</li>
  <li>The corner of the cube — a constraint carrying reversibility (Chapter 4)</li>
  <li>A triage colour — a constraint's derived state at 06:00 (Chapter 5)</li>
  <li>A CWA owner — a constraint carrying a name (Chapter 5)</li>
  <li>Next: a constraint born in the field, on a phone (this chapter)</li>
  </ul>
  <p class="punch">You've been looking at one object all day. That was the hypothesis.</p>`);

add("CH 7 · DEVICES",170,`<h2>The Devices</h2>
  <ul>
  <li>10,000 phones · ~$8M hardware · $60–80M program<span class="d">the program is the cost; the phones are a rounding error</span></li>
  <li>The device is the works badge<span class="d">tool checks, musters, work packages — protected-area security badging stays regulated kit</span></li>
  <li>Crew-confirmed timesheets anchor the business case<span class="d">worked out with labour relations — the foreman still runs the day</span></li>
  <li>QR by default, RFID at chokepoints</li>
  <li>Connectivity is a critical-path predecessor<span class="d">it gets scheduled like one, not discovered like a surprise</span></li>
  </ul>`);

add("CH 7 · LOCATION",150,`<h2>Location Policy Before First Device</h2>
  <p>Decided before the first device ships — not patched after the first grievance.</p>
  <p>Labour relations consultation, not veto. Judged awards safe; counted metrics dangerous. And catering stays.</p>`);

add("CH 7 · BLACK HAT",180,blackhat("UNION",
  "So the phone tells you how fast my members work.",
  `<p>The system routes, records, and surfaces. It never rates or ranks people — trending is by constraint class, never by individual, and the per-person query will not exist. Judged awards are safe; counted metrics are dangerous, and that line is policy.</p>`,
  "Location policy is decided before the first device ships, with labour relations at the table. And catering stays."));

add("CH 7 · BLACK HAT",160,blackhat("CYBER",
  "Cameras and site data on ten thousand phones. On a licensed site.",
  `<p>Site-issued, MDM-managed, no personal devices, no cameras in protected areas, capture limited to laydown and balance of plant. Data stays internal.</p>`,

/* ---------- ambient world — one visual field behind every sheet ---------- */
function ambientBoot(){
  const c=document.getElementById('ambient'); if(!c) return;
  const g=c.getContext('2d');
  const r=mulberry(11), N=22, pts=[];
  for(let i=0;i<N;i++)pts.push({x:r()*1920,y:r()*1080,vx:(r()-0.5)*0.22,vy:(r()-0.5)*0.22});
  function frame(){
    g.clearRect(0,0,1920,1080);
    for(const p of pts){
      if(!reduced){p.x+=p.vx;p.y+=p.vy;}
      if(p.x<0||p.x>1920)p.vx*=-1; if(p.y<0||p.y>1080)p.vy*=-1;
    }
    g.lineWidth=1;
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<300){g.strokeStyle='rgba(29,41,51,'+(0.7*(1-d/300))+')';
        g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();}
    }
    pts.forEach((p,i)=>{
      g.fillStyle=i%7===0?'rgba(255,173,51,0.20)':'rgba(147,166,180,0.14)';
      g.beginPath();g.arc(p.x,p.y,i%7===0?2.6:1.8,0,7);g.fill();
    });
    if(!reduced) requestAnimationFrame(frame);
  }
  frame();
}

TOTAL = contentTotal + IMS*150;
let lateTween=0;
function imDur(){ return Math.max(60,(TOTAL - contentTotal - lateTween)/IMS); }
function durOf(i){ return S[i].demo==='im' ? imDur() : S[i].dur; }
function consumedBefore(i){ let t=0; for(let k=0;k<i;k++) t+=durOf(k); return t; }

const nowS=()=>performance.now()/1000;
function slideElapsed(){ return slideAcc + (paused?0:(nowS()-slideStart)*speed); }
function rebase(){ slideAcc=slideElapsed(); slideStart=nowS(); }
function fmt(t){t=Math.max(0,Math.round(t));const m=Math.floor(t/60),s=t%60;

function segDur(sg){ let t=0; for(let k=sg.from;k<=sg.to;k++) t+=durOf(k); return t; }
function layoutBar(){

let mode='manual';   // 'manual' | 'preview' | 'room'
function tick(){
  // float consumption tween (late start absorbed over ~1.2s, end holds)
  if(lateTween!==late){ lateTween+=Math.sign(late-lateTween)*Math.min(6,Math.abs(late-lateTween)); layoutBar(); }
  if(cur>=0){
    const el=mode==='manual'?0:slideElapsed(), d=durOf(cur);
    if(mode!=='manual' && !paused && el>=d && cur<S.length-1) show(cur+1);
    const consumed=consumedBefore(cur)+Math.min(el,d);
    const remaining=TOTAL-lateTween-consumed;
    const tbTxt='RUNTIME '+fmt(TOTAL)+' · REMAINING '+fmt(remaining)+(late?' · FLOAT −'+fmt(lateTween):'');
    const tbEl=document.getElementById('tb-end');
    if(tbEl.textContent!==tbTxt) tbEl.textContent=tbTxt;
    sched.querySelector('.ph').style.left=(2+clamp(consumed/(TOTAL-lateTween),0,1)*(sched.clientWidth-4))+'px';
    const im=document.querySelector('#s'+cur+' [data-im]');
    if(im){const imel=slideAcc+(paused?0:(nowS()-slideStart));
      im.textContent=fmt(Math.max(0,durOf(cur)-imel));}
  }
  requestAnimationFrame(tick);
}

/* ============================================================
   DEMO ENGINE v3 — rect-based, mobile-first
   ============================================================ */
const C={ink:'#E9EEF3',dim:'#93A6B4',amber:'#FFAD33',red:'#FF5147',blue:'#53C2D4',violet:'#8E7CFF',
         green:'#2FBF8B',line:'#1D2933',panel:'#0D141B',
         top:'#26333F',rt:'#1A2530',lt:'#131D26',bg:'#070B10'};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO='IBM Plex Mono, monospace';
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;}}
const ease=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const NARROW=w=>w<620;

function demoLoop(canvas,ratioFn,draw,period){
  let run=true,t0=performance.now(),W=0;
  const g=canvas.getContext('2d');
  function size(){
    const w=canvas.parentElement.clientWidth||600;
    if(w===W)return; W=w;
    const ratio=typeof ratioFn==='function'?ratioFn(w):ratioFn;
    const res=Math.min(2.5,devicePixelRatio*(window.STAGE_SCALE||1));
    canvas._res=res;
    canvas.width=w*res; canvas.height=w*ratio*res;
    canvas.style.height=(w*ratio)+'px';
  }
  size();
  const ro=new ResizeObserver(size); ro.observe(canvas.parentElement);
  const api={setPhase:p=>{t0=performance.now()-p*(period||14000);}};
  (function frame(){
    if(!run)return;
    const res=canvas._res||devicePixelRatio;
    g.setTransform(res,0,0,res,0,0);
    const w=canvas.width/res,h=canvas.height/res;
    g.clearRect(0,0,w,h);
    const t=reduced?0.85:((performance.now()-t0)/(period||14000))%1;
    try{ draw(g,w,h,t); }
    catch(err){
      run=false;
      const f=document.getElementById('fault');
      if(f){f.style.display='block';f.textContent='FAULT · demo frame · '+err.message;}
      return;
    }
    requestAnimationFrame(frame);
  })();
  const stop=()=>{run=false;ro.disconnect();};
  stop.setPhase=api.setPhase;
  return stop;
}

/* ---------- ISO PLANT (rect-based) ---------- */
function isoCtx(R){
  const u=Math.min(R.w*0.0350,R.h*0.056);
  const ox=R.x+R.w*0.50,oy=R.y+R.h*0.86;
  const P=(x,y,z)=>[ox+(x-y)*u*0.87, oy-(x+y)*u*0.44 - z*u*0.62];
  return {u,P};
}
function poly(g,pts,fill,stroke){
  g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();
  if(fill){g.fillStyle=fill;g.fill();}
  if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke();}
}
function shadow(g,I,cx,cy,r){
  const [px,py]=I.P(cx,cy,0);
  g.fillStyle='rgba(0,0,0,0.30)';
  g.beginPath();g.ellipse(px,py+2,r*I.u*1.5,r*I.u*0.55,0,0,7);g.fill();
}
function prism(g,I,x,y,w,d,hh,p,hot){
  if(p<=0)return;
  const z=hh*p;
  shadow(g,I,x+w/2,y+d/2,Math.max(w,d)*0.72);
  const A=I.P(x,y,0),B=I.P(x+w,y,0),D=I.P(x,y+d,0);
  const A2=I.P(x,y,z),B2=I.P(x+w,y,z),C2=I.P(x+w,y+d,z),D2=I.P(x,y+d,z);
  poly(g,[A,B,B2,A2],C.rt,C.line);
  poly(g,[A,D,D2,A2],C.lt,C.line);
  poly(g,[A2,B2,C2,D2],C.top,hot?C.amber:C.line);

function crane(g,I,x,y,hh,ang,vis){

function drawPlant(g,R,t,hold,labels){
  const I=isoCtx(R);
  const sr=mulberry(7);
  g.fillStyle='rgba(233,238,243,0.5)';
  for(let i=0;i<26;i++){const sx=R.x+sr()*R.w, sy=R.y+sr()*R.h*0.24;
    g.globalAlpha=0.12+0.3*sr()*(0.6+0.4*Math.sin(performance.now()/900+i));
    g.fillRect(sx,sy,1.4,1.4);}
  g.globalAlpha=1;
  const pr=(s,e)=>{ let d=(hold!=null&&s>hold)?0.14:0; return ease((t-(s+d))/Math.max(0.02,(e-s))); };
  const pad=[I.P(-0.5,-0.5,0),I.P(15,-0.5,0),I.P(15,14.5,0),I.P(-0.5,14.5,0)];
  poly(g,pad,'#0B1219','#20303C');
  g.strokeStyle='#16222C';
  for(let i=3;i<15;i+=3){
    let a=I.P(i,-0.5,0),b=I.P(i,14.5,0);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
    a=I.P(-0.5,i,0);b=I.P(15,i,0);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
  }
  /* horizon transmission line along the back of the site */
  {g.strokeStyle='rgba(147,166,180,0.30)';g.lineWidth=1;
   const py=[2.0,5.8,9.6,13.2];
   const tops=py.map(yy=>{
     const b=I.P(13.6,yy,0),tp=I.P(13.6,yy,2.1);
     g.beginPath();g.moveTo(b[0],b[1]);g.lineTo(tp[0],tp[1]);g.stroke();
     g.beginPath();g.moveTo(tp[0]-6,tp[1]+4);g.lineTo(tp[0]+6,tp[1]+4);g.stroke();
     return tp;});
   for(let i=0;i<tops.length-1;i++){
     const a=tops[i],b2=tops[i+1],mx=(a[0]+b2[0])/2,my=Math.max(a[1],b2[1])+9;
     g.beginPath();g.moveTo(a[0]-4,a[1]+5);g.quadraticCurveTo(mx,my,b2[0]-4,b2[1]+5);g.stroke();
     g.beginPath();g.moveTo(a[0]+4,a[1]+5);g.quadraticCurveTo(mx,my+2,b2[0]+4,b2[1]+5);g.stroke();
   }}
  /* access road + laydown slabs */
  poly(g,[I.P(15,6.6,0),I.P(15,7.6,0),I.P(9.2,7.3,0),I.P(9.2,6.9,0)],'rgba(38,51,63,0.55)',null);
  poly(g,[I.P(0.4,1.0,0),I.P(3.4,1.0,0),I.P(3.4,3.2,0),I.P(0.4,3.2,0)],'rgba(19,29,38,0.9)','#20303C');
  poly(g,[I.P(4.2,12.2,0),I.P(7.0,12.2,0),I.P(7.0,13.8,0),I.P(4.2,13.8,0)],'rgba(19,29,38,0.9)','#20303C');
  const items=PLANT.map(b=>({b,k:(b.x+(b.w||b.r||0)/2)+(b.y+(b.d||b.r||0)/2)}));
  items.sort((a,q)=>q.k-a.k);
  const active=[];
  for(const {b} of items){
    const p=pr(b.s,b.e), hot=p>0&&p<1;
    if(hot&&b.act)active.push(b.act);
    if(b.t==='prism')prism(g,I,b.x,b.y,b.w,b.d,b.h,p,hot);
    if(b.t==='cyl')cylinder(g,I,b.x,b.y,b.r,b.h,p,b.dome,hot);
    if(b.t==='tower')coolTower(g,I,b.x,b.y,b.r,b.h,p,hot,t>0.9);
    if(labels&&b.label&&p>0.4){
      const c=I.P(b.x,b.y,(b.h||3)+1.1);
      g.fillStyle=C.dim;g.font='13px '+MONO;g.textAlign='center';
      g.fillText(b.label,c[0],c[1]-4);g.textAlign='left';
    }

  /* turbine hall window lights, late in the build */
  if(t>0.85){
    const b=PLANT[0], glow=Math.min(1,(t-0.85)/0.08);

/* ---------- FORECAST (rect-based) ---------- */
function seededBars(n,shift,widen){
  const r=mulberry(1337);const bars=[];
  for(let i=0;i<n;i++){
    const x=(i+0.5)/n, mu=0.42+shift, sg=0.11*(1+widen);
    let v=Math.exp(-((x-mu)**2)/(2*sg*sg)); v*=0.85+0.3*r(); bars.push(v);
  }
  const mx=Math.max(...bars);return bars.map(b=>b/mx);
}
function drawForecast(g,R,t,mix){
  const x0=R.x+8, cw=R.w-16;
  const yS=R.y+R.h*0.52, hS=R.h*0.40;
  const yH=R.y+R.h*0.94, hH=R.h*0.26;
  const sig=(u,sh,st)=>1/(1+Math.exp(-9*((u-sh)/st-0.5)));
  g.strokeStyle=C.line;g.strokeRect(x0,yS-hS,cw,hS);
  g.setLineDash([2,5]);g.strokeStyle='rgba(29,41,51,0.9)';
  [0.25,0.5,0.75].forEach(f=>{g.beginPath();g.moveTo(x0,yS-hS*f);g.lineTo(x0+cw,yS-hS*f);g.stroke();});
  g.setLineDash([]);
  g.fillStyle=C.dim;g.font='13px '+MONO;
  g.fillText('PROGRAM % COMPLETE — FMC BAND · P10–P90 · SHAPE ILLUSTRATIVE',x0,yS-hS-6);
  function band(sh,st,color,alpha){
    g.beginPath();
    for(let i=0;i<=60;i++){const u=i/60;g.lineTo(x0+u*cw,yS-sig(u,sh-0.045,st*1.05)*hS);}
    for(let i=60;i>=0;i--){const u=i/60;g.lineTo(x0+u*cw,yS-sig(u,sh+0.055,st*1.12)*hS);}
    g.closePath();g.fillStyle=color;g.globalAlpha=alpha;g.fill();g.globalAlpha=1;
  }
  /* 34 seeded traces — the runs behind the band */
  {const tr=mulberry(404);
   for(let k=0;k<34;k++){
     const sh=(tr()-0.5)*0.12, st=1+(tr()-0.5)*0.16;
     g.strokeStyle=C.violet;g.globalAlpha=0.05;g.beginPath();
     for(let i=0;i<=40;i++){const u=i/40;g.lineTo(x0+u*cw,yS-sig(u,sh,st)*hS);}
     g.stroke();
   }
   g.globalAlpha=1;}
  band(0,1,C.violet,0.18);
  g.strokeStyle=C.violet;g.lineWidth=1.6;g.beginPath();
  for(let i=0;i<=60;i++){const u=i/60;g.lineTo(x0+u*cw,yS-sig(u,0,1)*hS);}g.stroke();
  if(mix>0.01){
    band(0.10*mix,1+0.06*mix,C.amber,0.14);
    g.strokeStyle=C.amber;g.setLineDash([4,4]);g.beginPath();
    for(let i=0;i<=60;i++){const u=i/60;g.lineTo(x0+u*cw,yS-sig(u,0.10*mix,1+0.06*mix)*hS);}
    g.stroke();g.setLineDash([]);
    g.fillStyle=C.amber;g.font='13px '+MONO;g.fillText('+6 MO HOLD',x0+cw*0.55,yS-hS*0.10);
  }
  const px=x0+clamp(t,0,1)*cw;
  g.strokeStyle=C.ink;g.globalAlpha=0.65;g.beginPath();g.moveTo(px,yS);g.lineTo(px,yS-hS);g.stroke();g.globalAlpha=1;
  g.fillStyle=C.ink;g.font='11px '+MONO;g.fillText('TODAY',Math.min(px+4,x0+cw-46),yS-hS+14);
  g.fillStyle=C.violet;g.font='11px '+MONO;g.fillText('P50',x0+cw-30,yS-sig(1,0,1)*hS+16);
  g.fillStyle=C.dim;g.font='13px '+MONO;
  g.fillText('COD FLOAT — THE SHAPE IS THE MARGIN',x0,yH-hH-6);
  const b0=seededBars(19,0,0), b1=seededBars(19,0.14,0.55);
  const bw=cw/19;
  for(let i=0;i<19;i++){
    const v=b0[i]*(1-mix)+b1[i]*mix;
    g.fillStyle=mix>0.02?C.amber:C.violet;g.globalAlpha=0.75;
    g.fillRect(x0+i*bw+1,yH-v*hH,bw-2,v*hH);g.globalAlpha=1;
  }
  g.strokeStyle=C.line;g.strokeRect(x0,yH-hH,cw,hH);

  const cod = mix>0.5 ? 'COD P50 2031-12 · P90 2032-05' : 'COD P50 2031-06 · P90 2031-10';
  g.fillText(cod,x0,yH+13);
}

DEMOS.replay=el=>{
