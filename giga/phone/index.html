  const derive=()=>{
    const r=mulberry(0x5EED);
    const day=n=>{const d=new Date(2027,0,1);d.setDate(d.getDate()+Math.round(n));
      return d.toISOString().slice(0,10);};
    const win=(base,spread)=>{const p10=base+r()*spread*0.3,p90=p10+spread*(0.6+r()*0.5);
      return {p10,p90,signed:p10+(p90-p10)*(0.3+r()*0.3)};};
    const rows=[['FIRST CONCRETE',win(85,120)],['MODULE 3 SET',win(620,170)],
      ['TURNOVER PKG 7',win(1180,240)]]
      .map(([n2,w2])=>[n2,'P10–P90: '+day(w2.p10)+' → '+day(w2.p90)+' · SIGNED: '+day(w2.signed)]);
    const text=rows.map(x=>x.join('|')).join(';');
    let h=0x811c9dc5;
    for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}
    const hx=('0000000'+h.toString(16)).slice(-8);
    return {rows,hash:hx.slice(0,4)+' '+hx.slice(4)};
  };
  let runs=0,D=null;
  const render=()=>{host.innerHTML=`
    <table>
      <tr><td>SEED</td><td>0x5EED-2026</td></tr>

        .map(r2=>`<tr><td>${r2[0]}</td><td>${r2[1]||'—'}</td></tr>`).join('')}

      <tr><td>DARK ATOMS</td><td style="color:var(--amber)">${runs?'3 — NO DATE INVENTED':'—'}</td></tr>
    </table>
    <div class="hash">${
      runs===0?'RUN HASH: —'
      :Array.from({length:Math.min(runs,3)},(_,i)=>`RUN ${i+1} HASH: <b>${D.hash}</b>`).join('<br>')
    }
    ${runs>1?'<br><span class="tag">IDENTICAL × '+runs+' — DERIVED FRESH EACH RUN, SAME ANSWER</span>':''}</div>`;};
  render();

DEMOS.cube=el=>{
  const c=el.querySelector('canvas[data-demo=cube]')||el.querySelector('canvas');
  return demoLoop(c,w=>NARROW(w)?0.95:0.62,(g,w,h,t)=>{
    const ex=ease(clamp((t-0.22)/0.20,0,1));
    const mig=ease(clamp((t-0.46)/0.22,0,1));
    const cx=w*0.46, cy=h*0.60, s=Math.min(w,h)*0.335;
    const P=(x,y,z)=>[ cx+(x-y)*s*0.82*(0.4+0.6*ex)+ (1-ex)*(x-0.5)*s*1.5,
                       cy+(x+y)*s*0.40*ex + (1-ex)*(y-0.5)*s*1.1 - z*s*0.85*ex ];
    /* heat-shaded cells while flat; fades as the cube rises */
    if(ex<0.95){
      for(let ci=0;ci<5;ci++)for(let cj=0;cj<5;cj++){
        const heat=(ci+cj)/8;
        const col= heat<0.5? [142,124,255] : heat<0.8? [255,173,51] : [255,81,71];
        const p1=P(ci/5,cj/5,0),p2=P((ci+1)/5,cj/5,0),p3=P((ci+1)/5,(cj+1)/5,0),p4=P(ci/5,(cj+1)/5,0);
        g.fillStyle='rgba('+col[0]+','+col[1]+','+col[2]+','+(0.10*(1-ex))+')';
        g.beginPath();g.moveTo(p1[0],p1[1]);g.lineTo(p2[0],p2[1]);g.lineTo(p3[0],p3[1]);g.lineTo(p4[0],p4[1]);g.closePath();g.fill();
      }
    }
    g.strokeStyle=C.line;
    for(let i=0;i<=5;i++){
      let a=P(i/5,0,0),b=P(i/5,1,0);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
      a=P(0,i/5,0);b=P(1,i/5,0);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
    }
    if(ex>0){
      g.globalAlpha=ex;
      const v=[[0,0],[1,0],[1,1],[0,1]];
      v.forEach(q=>{const a=P(q[0],q[1],0),b=P(q[0],q[1],1);
        g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();});
      for(let i=0;i<4;i++){const a=P(...v[i],1),b=P(...v[(i+1)%4],1);
        g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
      /* the corner volume: high severity × high irreversibility */
      const cv=[P(0.66,0,0.55),P(1,0,0.55),P(1,1,0.55),P(0.66,1,0.55),
                P(0.66,0,1),P(1,0,1),P(1,1,1),P(0.66,1,1)];
      g.fillStyle='rgba(255,81,71,0.07)';
      poly(g,[cv[0],cv[1],cv[2],cv[3]],'rgba(255,81,71,0.07)',null);
      poly(g,[cv[4],cv[5],cv[6],cv[7]],'rgba(255,81,71,0.10)',null);
      poly(g,[cv[0],cv[1],cv[5],cv[4]],'rgba(255,81,71,0.07)',null);
      g.globalAlpha=1;
    }
    g.fillStyle=C.dim;g.font='15px '+MONO;
    const ax=P(0.5,-0.14,0), ay=P(-0.16,0.5,0);
    g.textAlign='center';
    g.fillText('SEVERITY ▸',ax[0],ax[1]+14);
    g.save();g.translate(ay[0]-6,ay[1]);g.rotate(ex>0.5?-0.46:0);g.fillText('PROBABILITY ▸',0,0);g.restore();
    if(ex>0.3){const az=P(-0.06,-0.06,0.55);
      g.globalAlpha=ex;g.fillText('IRREVERSIBILITY ▴',az[0]-6,az[1]);g.globalAlpha=1;}
    g.textAlign='left';
    const r=mulberry(77);
    for(let i=0;i<9;i++){
      const d=P(0.15+r()*0.5, 0.15+r()*0.6, ex*r()*0.15);
      g.fillStyle=C.dim;g.globalAlpha=0.5;g.beginPath();g.arc(d[0],d[1],3,0,7);g.fill();g.globalAlpha=1;
    }
    const a0=P(0.82,0.78, ex*(0.34-0.30*mig));
    g.fillStyle=C.red;g.beginPath();g.arc(a0[0],a0[1],11-4*mig,0,7);g.fill();
    g.fillStyle=C.dim;g.font='13px '+MONO;
    g.fillText(mig>0.5?'ARCHAEOLOGY — REVERSIBLE. DEMOTED.':'ARCHAEOLOGY — BIGGEST DOT, LOCATES NO CONTROL',
      clamp(a0[0]-80,6,w-230),a0[1]+22);
    if(ex>0.6){
      const b0=P(0.9,0.18+0.5*(1-mig), 0.12+0.8*mig);
      const pulse=0.5+0.5*Math.sin(performance.now()/280);
      g.globalAlpha=ex;
      const gr=g.createRadialGradient(b0[0],b0[1],2,b0[0],b0[1],22+10*mig);
      gr.addColorStop(0,'rgba(255,81,71,0.5)');gr.addColorStop(1,'rgba(255,81,71,0)');
      g.fillStyle=gr;g.beginPath();g.arc(b0[0],b0[1],22+10*mig,0,7);g.fill();
      g.fillStyle=C.red;g.beginPath();g.arc(b0[0],b0[1],4+6*mig+2*pulse*mig,0,7);g.fill();
      if(mig>0.3){
        g.fillStyle=C.amber;
        g.fillText('MOBILIZE INTO UNCLEARED AREA — THE CORNER',clamp(b0[0]-140,6,w-260),b0[1]-16);
        if(mig>0.8){
          g.fillStyle=C.ink;
          g.fillText('CONTROL: CONCURRENT CLEARANCE VERIFICATION AT THE GATE',clamp(b0[0]-190,6,w-330),b0[1]-32);
        }
      }
      g.globalAlpha=1;
    }
    g.fillStyle=C.dim;g.font='15px '+MONO;
    g.fillText(ex<0.2?'THE FLAT MATRIX':'IN THE CORNER, PROBABILITY STOPS MATTERING',10,16);
  },18000);
};

DEMOS.atoms=el=>{
  const c=el.querySelector('canvas');
  return demoLoop(c,w=>NARROW(w)?0.85:0.5,(g,w,h,t)=>{
    const r=mulberry(2026);
    const cols=Math.max(6,Math.floor(w/46)),rows=Math.max(4,Math.floor(h*0.58/42));
    let dark=0,closed=0;
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      const x=26+i*46+(j%2)*11,y=h*0.10+j*42;
      const born=r(), isDark=r()>0.965;
      const p=clamp((t-born*0.8)/0.12,0,1);
      if(isDark){dark++;
        g.strokeStyle=C.line;g.setLineDash([2,3]);
        g.beginPath();g.arc(x,y,6,0,7);g.stroke();g.setLineDash([]);
        const pulse=0.3+0.2*Math.sin(performance.now()/500+i);
        g.fillStyle=`rgba(255,81,71,${pulse})`;g.beginPath();g.arc(x,y,2,0,7);g.fill();
      }else if(p>0){
        if(p>=1)closed++;
        if(p>=1){const gr=g.createRadialGradient(x,y,1,x,y,10);
          gr.addColorStop(0,'rgba(47,191,139,0.45)');gr.addColorStop(1,'rgba(47,191,139,0)');
          g.fillStyle=gr;g.beginPath();g.arc(x,y,10,0,7);g.fill();}
        g.fillStyle=p>=1?C.green:C.amber;   /* green = a satisfied constraint, nothing else */
        g.globalAlpha=0.35+0.65*p;
        g.beginPath();g.arc(x,y,3+3*p,0,7);g.fill();g.globalAlpha=1;
      }else{
        g.strokeStyle=C.line;g.beginPath();g.arc(x,y,3,0,7);g.stroke();
      }
    }
    g.fillStyle=C.green;g.font='16px '+MONO;
    g.fillText(closed.toLocaleString()+' SATISFIED — EACH ONE COST SOMEONE THEIR NAME',20,h*0.80);
    g.fillStyle=C.dim;g.font='15px '+MONO;
    g.fillText('GREEN IS A SATISFIED CONSTRAINT, NEVER A SUMMARY',20,h*0.87);
    g.fillStyle=C.amber;
    g.fillText(dark+' DARK ATOMS — NO DATA. NO DATE INVENTED. STILL ON SCREEN.',20,h*0.94);
  },16000);
};

    g.fillStyle=C.amber;
    for(let i=0;i<140;i++){g.globalAlpha=0.1+r()*0.5;
      g.fillRect(r()*w,r()*h,1.5,1.5);}

  },4000);
  const t0=performance.now();let run=true;
  (function f(){if(!run)return;
    const u=clamp((performance.now()-t0)/(reduced?1:6500),0,1);
    node.textContent=Math.round(3e9*(u*u)).toLocaleString('en-CA');
    if(u<1)requestAnimationFrame(f);
    else if(!el.querySelector('.counter-cap')) node.insertAdjacentHTML('afterend','<div class="counter-cap mono sub" style="margin-top:8px">FULL REPLAY: ~41 SECONDS, PROJECTED · ONE MACHINE · A BROWSER<br>EVERY CONSTRAINT · EVERY UNIT · THIRTY YEARS · STILL A CONVERSATION</div>');

  return ()=>{run=false;loop();c.remove();};
};

/* ---------- the deck, as atoms: the file derives its own state ---------- */
const SEEN=new Set();
DEMOS.selfmodel=el=>{
  const c=el.querySelector('canvas');
  return demoLoop(c,w=>NARROW(w)?0.8:0.36,(g,w,h,t)=>{
    const n=S.length, per=Math.ceil(n/3), gapx=(w-60)/per;
    let derives=0;
    for(let i=0;i<n;i++){
      const row=Math.floor(i/per), x=34+(i%per)*gapx, y=h*0.22+row*h*0.22;
      const im=S[i].demo==='im';
      const seen=SEEN.has(i), curr=i===cur;
      derives+= seen?1:0;
      if(curr){
        const pulse=0.5+0.5*Math.sin(performance.now()/260);
        const gr=g.createRadialGradient(x,y,2,x,y,16+6*pulse);
        gr.addColorStop(0,'rgba(255,173,51,0.55)');gr.addColorStop(1,'rgba(255,173,51,0)');
        g.fillStyle=gr;g.beginPath();g.arc(x,y,16+6*pulse,0,7);g.fill();
        g.fillStyle=C.amber;g.beginPath();g.arc(x,y,6,0,7);g.fill();
      } else if(seen){
        g.fillStyle=C.green;g.globalAlpha=0.85;    /* a satisfied sheet-atom */
        g.beginPath();g.arc(x,y,4.5,0,7);g.fill();g.globalAlpha=1;
      } else {
        g.strokeStyle=C.line;g.beginPath();g.arc(x,y,4,0,7);g.stroke();
      }
      if(im){g.strokeStyle=C.amber;g.globalAlpha=0.8;
        g.beginPath();g.arc(x,y,8,0,7);g.stroke();g.globalAlpha=1;}
      if(i>0&&i%per!==0){g.strokeStyle=C.line;g.globalAlpha=0.35;
        g.beginPath();g.moveTo(x-gapx+6,y);g.lineTo(x-6,y);g.stroke();g.globalAlpha=1;}
    }
    if(NARROW(w)){
      g.font='11px '+MONO;
      g.fillStyle=C.green;g.fillText(derives+' SATISFIED',34,h*0.80);
      g.fillStyle=C.amber;g.fillText(IMS+' FLOAT GATES (RINGED)',150,h*0.80);
      g.fillStyle=C.dim;
      g.fillText((n-derives)+' UNRESOLVED · 9 ROLLUPS · END: DERIVED',34,h*0.87);
      g.fillText('LIVE — RE-DERIVED EVERY FRAME FROM SHEETS WATCHED',34,h*0.94);
    } else {
      g.font='14px '+MONO;
      g.fillStyle=C.green;g.fillText(derives+' SATISFIED',34,h*0.86);
      g.fillStyle=C.amber;g.fillText(IMS+' FLOAT GATES (RINGED)',220,h*0.86);
      g.fillStyle=C.dim;g.fillText((n-derives)+' UNRESOLVED · 9 ROLLUPS (CHAPTERS) · END TIME: DERIVED',480,h*0.86);
      g.fillStyle=C.dim;g.font='13px '+MONO;
      g.fillText('LIVE — THIS VIEW RE-DERIVES EVERY FRAME FROM THE SHEETS YOU HAVE WATCHED',34,h*0.95);
    }
  },10000);
};

    ["P6 already does this.","P6 stores dates; ACE stores the constraints that produce them. Run ACE before you touch P6.","P6 stays the schedule of record and the contractual artifact.","REPLAY DEMO"],

const NARR_CH={
 1:"Chapter one. The problem. Not a new one — you lived it this morning.",

const NARR=[
["GIGA</h1>","We're doing things right. There's room for improvement. Everything you'll see today is an extension of work this room already does well — and this presentation will end at the derived time on the title block, to the second. [BEAT]"],
["Who's Presenting","This session is pre-recorded and self-playing, so the arguments arrive at the pace they were written. The engine behind everything on screen runs live at task-eye-ay-pee dot com slash ace. One HTML file. Save the page and you own it."],
["The Problem You Already Have","To make one decision, a qualified person pulls up sixteen systems, seven procedures, four drawings, two emails, and a Teams message. The information exists. Assembly costs forty minutes. So people either don't do it — or decide without it. [PAUSE 2s] And the record can't tell you which."],
["Anatomy of the Forty","Find the work package, and the revision you're actually on. The governing procedure, then the one it references. The permit — different system, different login. Who's qualified and on shift. What else is in the area. The email where this was discussed. And confirm nothing changed since Tuesday — which you can't. None of these steps is wrong. The cost is the assembly, and the assembly leaves no trace."],
["The Question","Can everything be a constraint? The permit is a constraint. The hold point is a constraint. The isolation two buses away is a constraint. Each one has an owner, and a condition that closes it. Nothing else is required for the whole argument that follows."],
["Same Object at Every Scale","The Nuclear Safety and Control Act constrains the REGDOC. The REGDOC constrains the management system. The management system constrains the procedure. The procedure constrains the work package. The work package constrains a person's afternoon. Same object at every scale. No special cases."],
["What This Is","A working theory and a demonstration of it. Not a product. Not a pitch. In nineteen sixty-eight, Doug Engelbart demoed the mouse by moving it. Same rule here — everything claimed on screen is running on screen. Take ten percent. Your AWP still stands."],
["Why Bother","Gigawatts of clean energy. On a program this size, one to two percent of efficiency is a gigadollar — not from working harder, but from making the decision that already gets made, forty minutes faster, with the record intact. And continual improvement isn't an initiative here. The management system already requires it."],
["The Building Survived","The Empire State Building went up in about four hundred and ten days. It remains the reference for what construction can do when the flow is right. What didn't survive is why. The building stands; the decisions that built it are gone. This deck is about keeping the reasoning without slowing the steel."],
["The Plant Rising","[BEAT 40s — the plant carries this] Watch the band on the right. That's not one schedule — it's ten thousand runs of the same constraints. Now: plus six months, regulatory hold. [PAUSE 1s] One click. The curve bends, the histogram shifts, and nothing was typed into a schedule. That's the weekly conversation, done in one click."],
["The Zoom","[BEAT — silence through the zoom itself] Month sixty. One room. It's a light fixture. The fixture is nothing. The isolation isn't. The hazard is two buses away — invisible from where the worker stands. Same model. No transition. [PAUSE 2s] The zoom is the argument."],
["What You Just Saw","That constraint carried knowledge the worker cannot see from where he stands. That is a constraint's entire job. When the chain is invisible, risk-important and critical steps can be lost in the fog. The chain should be visible."],
["The Readiness View","Four satisfied constraints — each with a name, a time, a document, a revision. And one open, with an owner. The screen does not say ready. It says everything declared has been checked, by a named person, at a known time. Whether it's ready is still a qualified professional's call."],
["The Chart That Ate","Henry Gantt drew bars so shipyard managers could see a plan that lived somewhere else. The bars were a picture of the reasoning — never the reasoning itself. A century later, the picture won. Every chart in this deck is a picture of a model you can query. That's the whole difference."],
["Born Derived","The critical path method wasn't written by hand. Kelley and Walker computed it — a dependency network fed to a mainframe, dates falling out as answers. The schedule was born as a derived result. Somewhere between nineteen fifty-seven and now, the industry started storing the answers and throwing away the network. Nothing in this chapter is new physics. It's the original physics, given back its computer."],
["Where Dates Come From","P6 stores dates. It cannot show its work. Every date on this project is the output of constraints — someone worked those out, typed the answer in, and the reasoning evaporated. The demo ran it the other way: hold the constraints, derive the dates. We call that engine ACE. P6 stays the schedule of record. ACE is what you run before you touch it."],
["The Names","ACE — the atomic constraint engine. The engine from the last sheet. ACT — the theory under it: everything is a constraint. FMC — full Monte Carlo, the engine run thousands of times. More names exist. They show up when the screen needs them. These three come back all day."],
["ACT — Atomic","Everything is a constraint. Not can-be-modeled-as. Is. A constraint is small: a condition, an owner, a closure trigger, a timestamp, a revision. Scheduling is fuzzy because reality is fuzzy — a constraint doesn't hide that. It carries it."],
["The Atom<","Seven fields. Two links: contains is the tree, requires is what must come first. One derive step. No cycles — ever. The engine refuses to save a graph that would deadlock. Everything for the rest of the day is this record, worn seventy-two ways."],
["Five Ways a Thing","The kind field answers one question: who declares it done? A leaf — somebody flips it. A gate — clears when its waits clear. A rollup — done when its children are done. Verified — the work and a witness signature. Two locks. And trivial — born done. Five. Not four. Not seven."],
["ACE — Atomic","ACE takes the constraints as they stand and derives what follows. Seeded and deterministic: same constraints in, same answer out, on anyone's machine. [PAUSE 1s] And one refusal that matters: a constraint with no data never finishes. The engine will not invent a date."],
["The Dark Atom","A dark atom is a constraint everyone knows exists — with no estimate, no owner response, no basis. The engine carries it forward as unfinished. Forever, if necessary. Everything downstream inherits the honesty. A dark atom on screen is not a failure of the system. It's the system refusing to lie."],
["Why touch what works","[BEAT — the scheduler speaks first, full strength] P6 stays. It remains the schedule of record and the contractual artifact. ACE runs before you touch it — it's where the dates come from, not where they live. And the concession, on the record: the board still gets a date. The engine just won't pretend it derived one."],
["FMC — Full","Every constraint carries its uncertainty. Run the engine thousands of times and the answer isn't a date — it's a shape. Float is a histogram. Margin is the shape. And the queue of what to fix next falls out of the model, sorted by cost of delay."],
["The Curve the Shipyards","Liberty ships went from months to weeks, hull after hull, because repetition graded the process and the process listened. Calibration is that curve, kept on purpose — per class of work, with the forecast grading itself."],
["Own Scorecard","Every estimate is checked against what actually happened. Bias belongs to the work type, not the person — nobody gets a personal accuracy score; the distribution for that class of work narrows. A forecast that never checks itself is an opinion with formatting."],
["Flex</h2>","A flex package still has constraints — a crew, a zone, material on the shelf. What makes flex flex is the shape: capacity constraints, not sequence constraints. Requires can point at a predicate — any idle civil crew — so its gates fire on availability. That's why flex absorbs variance."],
["Replay</h2>","[BEAT — let the first run land] Same constraints in, same result out, anyone's machine. Run it again. [PAUSE 1s] Identical hash. That's the audit story: P6 can show what it said. It cannot show why, and it cannot prove nobody changed a date. This can."],
["Procedures Are Atoms","A procedure isn't a document with constraints described in it. It is a set of constraints — the document is one rendering. Preconditions are constraints. The named authority is a constraint. The hold point is a constraint that blocks until satisfied. Procedures were always atoms. They were just written down as prose."],
["The Chain, Traversed","[BEAT — the chain lights both ways] From the Act, down through the REGDOC, the management system, the procedure, the work package — to a person's Tuesday afternoon. And back up. Same object, every scale."],
["A Citation Is Not","Procedures reference each other by document number today. You read the number, open SharePoint, search, guess the revision. A reference should be a link. Click the clause — every implementing procedure. Click the hold point — the authority. Click the authority — who's actually assigned today. A citation is not a system."],
["The Regulator Answer","Show me you satisfy this clause. Click it. Every implementing procedure, every hold point, every record produced — the actual chain, not a binder that claims it. Assembly that takes a person weeks per audit becomes a query. Compliance stops being a document you assemble and becomes a property you demonstrate."],
["Executable Procedures","A hold point, six fields. The hold point. Its preconditions. The authority — a name, not an inbox. Verification — concurrent or independent, and which. The outcome, with reason. The evidence. Any field empty, the procedure isn't finished. Paper says the sign-off is required. This says it's blocked, on what, and who's holding it — now."],
["What Does Not Execute","Judgement cores stay human, permanently. Emergency improvisation. Policy. Human relations. Craft. Execute the wrapper — leave the core alone. But every non-executable procedure still has an executable wrapper: notification accounting, review currency, qualification currency, witnessed hold points."],
["Different Implementation","This does not replace the management system. It replaces the implementation of it — the forms, the routing, the SharePoint. N two-eighty-six says what the system must satisfy. It does not dictate mechanism. Same system, same commitments, same standard. Queryable instead of filed."],
["BASIS — The Law","BASIS holds the rules — the procedures, the hold-point definitions, who may sign what. BASIS is the law. ACE is the physics. The engine executes what the law permits, and nothing else. At turnover the B changes meaning: Baseline Authority. Same letters. New life."],
["Where's my record","[BEAT — quality speaks] Everything is recorded. Inputs are immutable and versioned — replay the engine against the constraint set as it stood and get the same dates. Views are derived. Evidence never is. The concession: everything you file today, you still file."],
["Three Registers","Three registers per document. The view — derived, current, disposable. The machine draft — tracked, because machine editorialism must be visible. And TRACE — signed human testimony, trusted, because a person put their name on it. Track machine editorialism. Trust human editorialism. The signature is the accountable."],
["Planned Revision","Every document carries its own revision trigger — next gate, next milestone, yearly, when system X comes online. Documents stop going quietly stale. Currency becomes a constraint: visible, owned, and overdue in public. Including this deck."],
["STKY³</h2>","STKY comes from safety's shift to what seriously injures and kills — stop spending attention on paper cuts. That discipline stays sacred and untouched. Said once, out loud, so nobody has to raise it: what kills people is not what this chapter is about. This extends the idea to what kills the project. The first one always wins."],
["The Third Axis","Probability. Severity. And reversibility. [BEAT — the cube extrudes] The same dollar loss can bleed over three years with a dozen intervention points — or turn permanent in one afternoon, with one signature. In the corner, probability stops mattering."],
["Not a Risk Matrix","This doesn't tell you what to worry about. It tells you where a person has to be standing. It's critical-step identification — the discipline ops already applies before touching a valve — extended upstream. Where it already lives, it works. The ask: are the uncovered areas considered decisions, or accidents of which department wrote the procedure?"],
["Archaeology","On the flat matrix, archaeology is the biggest red dot on the register — and it locates no control. The cube demotes the delay: painful, but reversible. And it promotes what wasn't on the register: mobilizing equipment into an uncleared area. Low probability. Extreme severity. Zero reversibility. And it names the control — concurrent clearance verification at the gate. Not a month-end report."],
["Where the Corners Are","Critical lifts. Concrete discharge into a form carrying a design deviation — reversible until the pour starts. Long-lead purchase orders — forgings and steam generators are a two-year door. Regulatory submissions — correctable, never un-sayable. First fill, first criticality, one-way lineups — where concurrent verification is already law. That's the proof the method works."],
["re-scoring three hundred","[BEAT — risk speaks] Severity is the size of the outcome. Reversibility is when the door shuts. The axis doesn't change the number — it locates the intervention window. The concession: nobody re-scores three hundred. Ask the question of what already scores high. Twenty items. One workshop."],
["The Limit — Stated","Paper cuts aggregate. Fifteen minutes of tool time across ten thousand workers is the whole AWP productivity case, and no instance of it is fatal. STKY cubed doesn't mean stop preventing paper cuts. It means stop letting them consume the attention fatal risk needs. And the atoms answer the aggregate for free: every blocker is already recorded. Trend by class. Give recurring classes an owner. That loop, with evidence, is continual improvement discharged."],
["Alberta</h2>","WorkFace Planning came out of the oil sands — foremen starved of ready work while the site drowned in unready work. COAA standardized it. CII's research grew it into Advanced Work Packaging — the biggest productivity idea this industry has ratified in a generation. The creed at the bottom of it: one crew, about a week, released only constraint-free."],
["AWP, Properly","The hierarchy: the CWA, cut from the plot plan. CWPs and EWPs, aligned so drawings arrive shaped like the build. And the IWP a crew actually holds. The release rule that makes it work: an IWP does not release until it is constraint-free. Everything here completes AWP. Nothing here competes with it."],
["The Missing Object","AWP's release rule says constraint-free — and then never makes the constraint a first-class object. It lives in checklists and a planner's memory. The most important word in the framework has no schema. [BEAT — read the table] And note the first row: the CWA gets the named owner AWP never assigned. Second time you've heard that today. On purpose. This is the ten percent AWP was waiting for."],
["The Trailer Wall","Goldratt taught a generation that the constraint governs the system — then spent forty years as a poster in the site trailer. Everyone agrees with the poster. Nobody's schedule can point at the constraint. This is the theory taken off the trailer wall and made the data instead."],
["Five Costumes","Schedule. Work breakdown. Materials. RFI log. Risk register. Five systems, five databases, five versions of the truth. They are one thing wearing five costumes — every one a query on the same graph. The engine is small. The rest is discipline: refusing to add a second primitive when someone waves a whiteboard at you."],

function narrFor(i){

  const hay=S[i].html;
  for(const [k,v] of NARR) if(hay.includes(k)) return v;
  return "[No narration authored for this sheet yet.]";

function exportNarration(){
  let out="GIGA — NARRATION SCRIPT · REV 12 · "+S.length+" SHEETS\n";
  out+="Format: one block per sheet. [BEAT]/[PAUSE ns] are direction — strip or keep for ElevenLabs pacing.\n";
  out+="=".repeat(76)+"\n\n";
  S.forEach((s,i)=>{
    out+="=".repeat(76)+"\n";
    out+="SHEET "+String(i+1).padStart(3,'0')+" · "+s.ch+" · "+Math.round(durOf(i))+"s\n";
    out+="=".repeat(76)+"\n";
    out+=narrFor(i).replace(/\s+/g,' ').trim()+"\n\n";
  });
  try{
    const blob=new Blob([out],{type:'text/plain'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='giga-narration.txt';
    document.body.appendChild(a);a.click();a.remove();
    tuiStatus('NARRATION EXPORTED — <b>giga-narration.txt</b> ('+Math.round(out.length/1024)+' KB)');
  }catch(e){
    document.getElementById('notesBody').textContent=out.slice(0,4000)+'…';
    document.getElementById('notes').classList.add('open');
  }
}

  p2.classList.add('open');
}
document.getElementById('trwBtn').onclick=()=>{trwOpen=!trwOpen;
  document.getElementById('trwBtn').classList.toggle('onstate',trwOpen);refreshTRW();};

const bs=document.getElementById('btnSpeed');
/* CUT FOR PHONE — the 40× preview mode is an authoring tool; on a phone it just strobes.
   Two modes remain: tap/swipe at your pace, or auto-play at room speed. */
bs.onclick=()=>{rebase();
  mode = mode==='manual' ? 'room' : 'manual';
  speed = 1;
  bs.textContent = mode==='manual' ? '▶ AUTO-PLAY' : '✋ MANUAL';
  bs.classList.toggle('onstate',mode!=='manual');
  slideStart=nowS(); slideAcc=0;
};
/* ── CUT FOR PHONE ── late-start simulator handler
document.getElementById('btnLate').onclick=function(){
  if(late)return;
  late=360;
  this.textContent='FLOAT CONSUMED −6:00';this.disabled=true;
  document.getElementById('latebanner').style.display='inline';
};
── END CUT ── */
function togglePause(){rebase();paused=!paused;
  document.getElementById('btnPause').textContent=paused?'RESUME':'PAUSE';
  document.getElementById('btnPause').classList.toggle('onstate',paused);}
document.getElementById('btnPause').onclick=togglePause;


/* ── CUT FOR PHONE ── the HD stage scaler and its portrait 90° rotation — the phone edition reflows instead
∕* ---- HD stage scaling ---- *∕
function fitStage(){
  const sheet=document.getElementById('sheet');
  const portrait=innerHeight>innerWidth && innerWidth<900;
  let sc;
  if(portrait){
    sc=Math.min(innerHeight/1922,innerWidth/1082);
    sheet.style.transform=`translate(-50%,-50%) rotate(90deg) scale(${sc})`;
  }else{
    sc=Math.min(innerWidth/1922,innerHeight/1082);
    sheet.style.transform=`translate(-50%,-50%) scale(${sc})`;
  }
  window.STAGE_SCALE=sc;
}
addEventListener('resize',fitStage);fitStage();
── END CUT ── */
ambientBoot();

window.GIGA={sheets:S,show,
  schedule:()=>({total:TOTAL,content:contentTotal,floatEach:imDur(),late}),
  seen:SEEN};
let startAt=0;
try{const sv=JSON.parse(localStorage.getItem('giga-pocket-pos')||'null');
  if(sv&&sv.cur>0&&sv.cur<S.length){startAt=sv.cur;(sv.seen||[]).forEach(k=>SEEN.add(k));}}catch(e){}
show(startAt); tick();

/* PHONE — installable: Add to Home Screen gives an app icon, standalone launch, offline playback */
if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
