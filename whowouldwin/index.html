<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Who Would Win">
<meta name="theme-color" content="#181425">
<title>Who Would Win In A Fight?</title>
<meta name="description" content="Ten points. Build a team. A bear is five, a hamster is one. Then watch it play out, realistically.">
<link rel="apple-touch-icon" href="/icons/fight-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23181425'/%3E%3Ctext x='8' y='12.5' font-size='10' text-anchor='middle'%3E%F0%9F%A5%8A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
button{touch-action:manipulation;font-family:inherit;cursor:pointer}
:root{
  --bg:#181425;--panel:#262b44;--panel2:#3a4466;--line:#5a6988;--ink:#0d0a14;
  --tx:#ead4aa;--mut:#8b9bb4;--red:#e43b44;--gold:#feae34;--green:#63c74d;--blue:#2ce8f5;
}
html,body{position:fixed;inset:0;overflow:hidden;background:var(--bg);
  touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  font-family:"VT323","Courier New",monospace;color:var(--tx);font-size:19px;line-height:1.1}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px);
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse at 50% -10%, rgba(228,59,68,0.22), transparent 55%),var(--bg)}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.hidden{display:none!important}
.mk{font-family:"Press Start 2P","VT323",monospace;line-height:1.25}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* ---------- draft ---------- */
header{text-align:center;padding:6px 0 8px}
h1{font-size:19px;color:var(--gold);text-shadow:3px 3px 0 var(--ink)}
h1 span{display:block;font-size:12px;color:var(--tx);margin-top:8px}
.sub{font-size:16px;color:var(--mut);margin-top:8px;letter-spacing:.04em;text-transform:uppercase}
#enemyCard{background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--ink);padding:8px 10px;margin-top:4px;
  display:flex;align-items:center;gap:10px}
#enemyCard .lbl{font-size:8px;color:var(--red);font-family:"Press Start 2P",monospace;margin-bottom:6px}
#enemyCard .tname{font-size:11px;color:var(--tx);line-height:1.3}
#enemyCard .troster{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px 4px;max-width:46%;align-items:flex-end}
.pc{display:inline-flex;align-items:flex-end;gap:1px}
.pc small{font-size:14px;color:var(--mut);line-height:1}
#budget{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 8px;font-size:18px;color:var(--mut)}
#budget b{color:var(--gold);font-size:16px;font-family:"Press Start 2P",monospace}
#budget .cnt b{color:var(--tx);font-size:12px}
#pool{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;padding:6px 4px 10px 0;align-content:start}
.card{background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--ink);padding:10px 4px 6px;color:var(--tx);
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:transform .06s,box-shadow .06s}
.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.card .em{height:54px;display:flex;align-items:flex-end}
.card .nm{font-size:18px;text-align:center;line-height:1;color:#fff;margin-top:4px}
.card .bl{font-size:15px;color:var(--mut);text-align:center;line-height:1;min-height:30px}
.card .cost{position:absolute;top:-8px;right:-6px;background:var(--gold);color:var(--ink);font-family:"Press Start 2P",monospace;
  font-size:10px;min-width:22px;height:22px;line-height:22px;padding:0 5px;text-align:center;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.card:disabled{opacity:.35}
.card .n{position:absolute;top:-8px;left:-6px;background:var(--green);color:var(--ink);font-family:"Press Start 2P",monospace;font-size:8px;
  min-width:22px;height:22px;line-height:22px;text-align:center;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
#teamBar{display:flex;gap:10px;align-items:center;padding-top:10px;border-top:3px solid var(--line)}
#team{flex:1;display:flex;flex-wrap:wrap;gap:5px;min-height:44px;align-items:center}
#team .empty{font-size:17px;color:var(--mut);line-height:1}
.chip{background:var(--panel2);border:2px solid var(--line);padding:2px 4px 2px 3px;color:var(--tx);
  display:flex;align-items:center;gap:3px;box-shadow:2px 2px 0 var(--ink)}
.chip small{font-size:8px;color:var(--gold);font-family:"Press Start 2P",monospace}
#fightBtn{background:var(--red);color:#fff;border:3px solid var(--ink);padding:0 16px;height:54px;font-size:16px;
  box-shadow:4px 4px 0 var(--ink);font-family:"Press Start 2P",monospace;text-shadow:2px 2px 0 var(--ink)}
#fightBtn:disabled{opacity:.35;box-shadow:none}
#fightBtn:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.foot{text-align:center;font-size:16px;color:var(--mut);padding-top:10px}
.lnk{background:none;border:0;color:var(--blue);font-size:16px;text-decoration:underline;padding:4px}

/* ---------- arena ---------- */
#hud{display:flex;gap:10px;align-items:flex-end;padding:4px 0 8px}
#hud .side{flex:1;min-width:0}
#hud .side.r{text-align:right}
#hud .nm{font-size:8px;line-height:1;margin-bottom:6px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .side.r .nm{color:var(--red)}
#hud .bar{height:14px;background:var(--ink);border:2px solid var(--line);overflow:hidden;position:relative}
#hud .bar i{display:block;height:100%;background:var(--green);width:100%;transition:width .18s}
#hud .bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 7px,var(--ink) 7px 9px)}
#hud .side.r .bar i{margin-left:auto}
#hud .vs{font-size:12px;color:#fff;padding-bottom:4px;text-shadow:2px 2px 0 var(--ink)}
#field{flex:1;display:flex;align-items:flex-end;gap:22px;position:relative;min-height:0;padding-bottom:140px;
  background:radial-gradient(ellipse at 50% 70%, rgba(255,255,255,.05), transparent 60%)}
#field::after{content:"";position:absolute;left:0;right:0;bottom:126px;height:14px;z-index:0;
  background:linear-gradient(#5a6988 0 4px,#3a4466 4px 9px,#262b44 9px)}
.squad{flex:1;min-width:0;display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:flex-end;gap:2px 0;align-content:flex-end;z-index:1}
#left{flex-direction:row-reverse}
.u{width:20%;display:flex;flex-direction:column;align-items:center;position:relative;transition:transform .12s steps(3)}
.u .em{display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.45))}
#right .u .em{transform:scaleX(-1)}
.u .hb{width:70%;height:5px;background:var(--ink);margin-top:3px;overflow:hidden;border:1px solid var(--line)}
.u .hb i{display:block;height:100%;background:var(--green);width:100%}
#left .u.lunge{transform:translateX(16px)}
#right .u.lunge{transform:translateX(-16px)}
.u.hit .em{filter:brightness(4) saturate(0)}
.u.dead{opacity:.35;filter:grayscale(1)}
.u.dead .em{transform:rotate(90deg)}
#right .u.dead .em{transform:scaleX(-1) rotate(-90deg)}
.u.dead .hb{visibility:hidden}
.dmg{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-family:"Press Start 2P",monospace;font-size:10px;
  color:#fff;text-shadow:2px 2px 0 var(--ink);pointer-events:none;animation:fl .75s steps(6) forwards;white-space:nowrap;z-index:3}
.dmg.crit{color:var(--gold);font-size:14px}
.dmg.miss{color:var(--mut);font-size:8px}
.dmg.ven{color:var(--green)}
@keyframes fl{0%{opacity:1;top:-4px}100%{opacity:0;top:-34px}}
#announce{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;font-size:26px;line-height:1.3;padding:0 10px;
  color:var(--gold);text-shadow:4px 4px 0 var(--ink);opacity:0;transform:scale(.6);z-index:5}
#announce.on{animation:pop .22s steps(3) forwards}
#announce.red{color:var(--red)}
@keyframes pop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
#log{height:40px;font-size:17px;color:var(--mut);text-align:center;line-height:1.15;overflow:hidden;padding:0 10px}
#log b{color:#fff;font-weight:400}
#ctrl{display:flex;gap:10px;justify-content:center;padding-top:8px}
#ctrl button{background:var(--panel);border:2px solid var(--line);color:var(--tx);padding:8px 14px;font-size:17px;box-shadow:3px 3px 0 var(--ink)}
#ctrl button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#result{position:absolute;inset:0;background:rgba(13,10,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px;z-index:10}
#resTitle{font-size:28px;line-height:1.3;color:var(--gold);text-shadow:4px 4px 0 var(--ink);animation:pop .3s steps(3)}
#resTitle.lose{color:var(--red)}
#resFat{font-size:14px;color:var(--red);margin-top:10px;min-height:20px;text-shadow:2px 2px 0 var(--ink)}
#resSub{font-size:19px;color:var(--tx);margin:14px 0 6px;line-height:1.3;max-width:380px}
#resSub .t{display:flex;justify-content:center;gap:4px 6px;flex-wrap:wrap;margin:6px 0;align-items:flex-end}
#resSub b{color:#fff;font-weight:400}
#resRec{font-size:16px;color:var(--mut);margin-bottom:20px}
#resBtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#resBtns button{border:3px solid var(--ink);padding:12px 14px;font-size:11px;font-family:"Press Start 2P",monospace;color:#fff;background:var(--panel2);box-shadow:4px 4px 0 var(--ink);text-shadow:2px 2px 0 var(--ink)}
#resBtns button.pri{background:var(--red)}
#resBtns button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
</style>

</head>
<body>
<div id="app">

<div id="draft" class="screen">
  <header>
    <h1 class="mk">WHO WOULD WIN<span>IN A FIGHT?</span></h1>
    <div class="sub" id="dateLine"></div>
  </header>
  <div id="enemyCard">
    <div>
      <div class="lbl">BAD GUYS OF THE DAY</div>
      <div class="tname mk" id="enemyName"></div>
    </div>
    <div class="troster" id="enemyRoster"></div>
  </div>
  <div id="budget">
    <span><b id="ptsLeft">10</b> pts left</span>
    <span class="cnt"><b id="cnt">0</b>/10 fighters</span>
  </div>
  <div id="pool"></div>
  <div id="teamBar">
    <div id="team"><span class="empty">Tap fighters to build your team. Spend all 10 or don't.</span></div>
    <button id="fightBtn" disabled>FIGHT</button>
  </div>
  <div class="foot"><button class="lnk" id="randomBtn">random brawl instead</button> · <span id="record"></span></div>
</div>

<div id="arena" class="screen hidden">
  <div id="hud">
    <div class="side"><div class="nm mk">YOUR TEAM</div><div class="bar"><i id="hpL"></i></div></div>
    <div class="vs mk">VS</div>
    <div class="side r"><div class="nm mk" id="hudEnemy">THEM</div><div class="bar"><i id="hpR"></i></div></div>
  </div>
  <div id="field">
    <div id="left" class="squad"></div>
    <div id="right" class="squad"></div>
    <div id="announce" class="mk"></div>
    <div id="result" class="hidden">
      <div id="resTitle" class="mk"></div>
      <div id="resFat" class="mk"></div>
      <div id="resSub"></div>
      <div id="resRec"></div>
      <div id="resBtns">
        <button id="rematch" class="pri">REMATCH</button>
        <button id="redraft">REDRAFT</button>
        <button id="share">SHARE</button>
      </div>
    </div>
  </div>
  <div id="log"></div>
  <div id="ctrl"><button id="speedBtn">1× speed</button><button id="skipBtn">skip to the end</button></div>
</div>

</div>
<script>
// ---------- roster ----------
// id, name, emoji, power, hp, atk, spd (attacks/sec), armour, dodge, size (1-5), trait, blurb
const RAW=[
['trex','T. rex','🦖',100,2000,160,.6,.3,0,5,'','7 tonnes. Extinct. Still the problem.'],
['elephant','Elephant','🐘',90,1800,150,.5,.35,0,5,'','6 tonnes of grudge.'],
['rhino','Rhino','🦏',80,1400,120,.6,.45,0,5,'charge','Armoured. Charges once, hard.'],
['hippo','Hippo','🦛',75,1300,120,.6,.3,0,5,'','Kills more people than lions do.'],
['polar','Polar bear','🐻‍❄️',65,800,70,.9,.15,0,4,'','Largest land carnivore. Hungry.'],
['grizzly','Grizzly bear','🐻',60,750,65,.9,.15,0,4,'','300 kg. Claws like garden tools.'],
['buffalo','Cape buffalo','🐃',58,900,75,.7,.2,0,4,'charge','The Black Death. Holds grudges.'],
['croc','Saltwater croc','🐊',55,700,80,.5,.4,0,4,'','Strongest bite on Earth. Slow on land.'],
['tiger','Tiger','🐅',55,550,70,1.2,.05,.15,4,'','Ambush. 300 kg of fast.'],
['lion','Lion','🦁',50,520,62,1.1,.05,.12,4,'','Built for killing big things.'],
['gorilla','Gorilla','🦍',45,500,50,1.0,0,.1,3,'','Ten men strong. Prefers peace. Not today.'],
['bull','Bull','🐂',45,700,55,.7,.1,0,4,'charge','900 kg. Horns. No sense of humour.'],
['moose','Moose','🦌',42,750,50,.7,.1,0,4,'charge','Taller than your truck. Kicks forward.'],
['cougar','Cougar','🐆',35,300,45,1.4,0,.25,3,'','Silent. Goes for the neck.'],
['boar','Wild boar','🐗',30,350,40,.9,.15,0,3,'charge','Tusks, armour plate, bad attitude.'],
['chimp','Chimpanzee','🐵',30,280,35,1.3,0,.2,2,'','Twice your strength. Bites faces.'],
['kangaroo','Kangaroo','🦘',28,320,38,1.0,0,.2,3,'','Kicks with both feet. Boxes dirty.'],
['anaconda','Anaconda','🐍',25,300,30,.5,.1,0,3,'','Constricts. Patient.'],
['wolf','Wolf','🐺',22,180,28,1.3,0,.2,2,'pack','Stronger with every wolf beside it.'],
['mma','MMA fighter','🥊',22,200,25,1.4,0,.3,3,'human','Peak human. Still just a human.'],
['komodo','Komodo dragon','🦎',20,220,22,.7,.2,0,2,'venom','Venomous bite. Then it waits.'],
['hyena','Hyena','🐕‍🦺',20,170,26,1.2,0,.15,2,'pack','Bone-crushing jaws. Travels in packs.'],
['enforcer','Hockey enforcer','🏒',18,190,22,1.1,0,.2,3,'human','Dropped the gloves. Missing teeth.'],
['pitbull','Pit bull','🐶',16,120,20,1.4,0,.15,2,'','Locks on. Does not let go.'],
['ostrich','Ostrich','🦤',15,180,24,1.0,0,.3,3,'','Kicks hard enough to kill a lion.'],
['foreman','Foreman with shovel','👷',14,160,20,.9,0,.1,3,'human','Has a shovel. Has had a day.'],
['dad','Average dad','👨',12,150,18,1.0,0,.15,3,'human','Dad strength. Threw his back out.'],
['badger','Honey badger','🦡',12,90,18,1.5,.25,.2,1,'','Thick skin. Does not care.'],
['retriever','Golden retriever','🐕',10,110,12,1.3,0,.2,2,'','Mostly wants to be friends.'],
['bees','Swarm of bees','🐝',9,60,8,2.5,0,.7,1,'sting','Hard to hit. Stings everything.'],
['raccoon','Raccoon','🦝',8,60,10,1.5,0,.3,1,'','Trash panda. Fights dirty.'],
['eagle','Bald eagle','🦅',7,50,14,1.2,0,.5,1,'','Talons. Hard to catch.'],
['kid','Grade 6 kid','🧒',6,50,6,1.2,0,.3,2,'human','Fast. Bites. Will tell on you.'],
['grandma','Grandma','👵',5,70,7,.6,0,.05,2,'human','Handbag full of something heavy.'],
['goose','Canada goose','🪿',5,45,7,1.6,0,.4,1,'','Zero fear. Five kilos of hate.'],
['cat','House cat','🐈',5,40,8,2.0,0,.5,1,'','Fast. Slippery. Furious.'],
['chicken','Chicken','🐔',3,25,3,1.5,0,.4,1,'','Pecks. Panics.'],
['hamster','Hamster','🐹',1,8,1,2.0,0,.4,1,'','150 grams. Pure heart.'],
];
// ---------- pixel sprites ----------
// Each fighter is drawn onto a tiny canvas, snapped to a 32-colour palette, outlined, then scaled with nearest-neighbour.
const PAL=['be4a2f','d77643','ead4aa','e4a672','b86f50','733e39','3e2731','a22633','e43b44','f77622','feae34','fee761','63c74d','3e8948','265c42','193c3e','124e89','0099db','2ce8f5','ffffff','c0cbdc','8b9bb4','5a6988','3a4466','262b44','181425','ff0044','68386c','b55088','f6757a','e8b796','c28569']
  .map(h=>[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]);
const GRID={1:12,2:14,3:16,4:20,5:24};
const SPR=new Map();
function spriteURL(em,g){
  const k=em+'|'+g; if(SPR.has(k))return SPR.get(k);
  const n=g+2, c=document.createElement('canvas'); c.width=c.height=n;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.font=`${g-1}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  x.textAlign='center'; x.textBaseline='middle'; x.fillText(em,n/2,n/2+1);
  const im=x.getImageData(0,0,n,n), d=im.data, op=new Uint8Array(n*n);
  for(let i=0;i<n*n;i++){
    const a=d[i*4+3]; if(a<110){d[i*4+3]=0;continue}
    op[i]=1; const r=d[i*4],gg=d[i*4+1],b=d[i*4+2]; let best=0,bd=1e9;
    for(let p=0;p<PAL.length;p++){const q=PAL[p];const dd=(q[0]-r)*(q[0]-r)+(q[1]-gg)*(q[1]-gg)+(q[2]-b)*(q[2]-b);if(dd<bd){bd=dd;best=p}}
    d[i*4]=PAL[best][0];d[i*4+1]=PAL[best][1];d[i*4+2]=PAL[best][2];d[i*4+3]=255;
  }
  for(let i=0;i<n*n;i++){
    if(op[i])continue; const px=i%n, py=(i/n)|0;
    if((px>0&&op[i-1])||(px<n-1&&op[i+1])||(py>0&&op[i-n])||(py<n-1&&op[i+n])){d[i*4]=13;d[i*4+1]=10;d[i*4+2]=20;d[i*4+3]=255}
  }
  x.putImageData(im,0,0); const u=c.toDataURL(); SPR.set(k,u); return u;
}
function spr(id,scale,g){const r=BY[id]; g=g||GRID[r.size]; const w=(g+2)*scale;
  return `<img class="px" src="${spriteURL(r.em,g)}" width="${w}" height="${w}" alt="${r.name}">`}

const ROSTER=RAW.map(r=>({id:r[0],name:r[1],em:r[2],power:r[3],hp:r[4],atk:r[5],spd:r[6],arm:r[7],dodge:r[8],size:r[9],trait:r[10],blurb:r[11]}));
const BY={};ROSTER.forEach(r=>BY[r.id]=r);

// ---------- seeded rng ----------
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,rnd){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const today=new Date();
const dayKey=today.getFullYear()*10000+(today.getMonth()+1)*100+today.getDate();
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const NOUNS=['Maulers','Biters','Stompers','Gougers','Chompers','Clobberers','Wreckers','Bruisers','Tramplers','Shredders','Headbutters','Gnawers'];

// ---------- pool & pricing ----------
const BUDGET=10, MAXTEAM=10;
let state=null; // {seed, daily, pool, enemy:[ids], enemyName, team:[ids]}
function buildPool(rnd){
  const heavy=ROSTER.filter(r=>r.power>=45), light=ROSTER.filter(r=>r.power<=12), mid=ROSTER.filter(r=>r.power>12&&r.power<45);
  const h=shuffle(heavy,rnd), l=shuffle(light,rnd), m=shuffle(mid,rnd);
  let pool=[h[0],h[1],l[0],l[1],l[2],m[0],m[1],m[2],m[3]];
  const rest=shuffle(ROSTER.filter(r=>!pool.includes(r)),rnd);
  pool=pool.concat(rest.slice(0,3));
  const top=Math.max(...pool.map(r=>r.power));
  const costs={};pool.forEach(r=>costs[r.id]=Math.min(10,Math.max(1,Math.round(10*Math.pow(r.power/top,1.2)))));
  pool.sort((a,b)=>costs[b.id]-costs[a.id]||b.power-a.power);
  return {pool,costs};
}
function draftEnemy(pool,costs,rnd){
  const style=['big','swarm','mix','mix'][Math.floor(rnd()*4)];
  let pts=BUDGET, team=[];
  const afford=()=>pool.filter(r=>costs[r.id]<=pts);
  if(style==='big'){
    let a=afford(); a.sort((x,y)=>costs[y.id]-costs[x.id]);
    const pick=a[Math.floor(rnd()*Math.min(2,a.length))]; team.push(pick.id); pts-=costs[pick.id];
    while(pts>0&&team.length<MAXTEAM){a=afford();if(!a.length)break;a.sort((x,y)=>costs[x.id]-costs[y.id]);const c=a[Math.floor(rnd()*Math.min(2,a.length))];team.push(c.id);pts-=costs[c.id]}
  }else if(style==='swarm'){
    let a=afford(); a.sort((x,y)=>costs[x.id]-costs[y.id]);
    const picks=a.slice(0,3);
    while(pts>0&&team.length<MAXTEAM){const c=picks[Math.floor(rnd()*picks.length)];if(costs[c.id]>pts){const d=afford();if(!d.length)break;d.sort((x,y)=>costs[x.id]-costs[y.id]);team.push(d[0].id);pts-=costs[d[0].id];continue}team.push(c.id);pts-=costs[c.id]}
  }else{
    while(pts>0&&team.length<MAXTEAM){const a=afford();if(!a.length)break;const c=a[Math.floor(rnd()*a.length)];team.push(c.id);pts-=costs[c.id]}
  }
  return team;
}
function newGame(daily){
  const seed=daily?dayKey:(Date.now()^Math.floor(Math.random()*1e9));
  const rnd=mulberry(seed*2654435761%4294967296);
  const {pool,costs}=buildPool(rnd);
  const enemy=draftEnemy(pool,costs,rnd);
  const enemyName=daily?`The ${DAYS[today.getDay()]} ${NOUNS[Math.floor(rnd()*NOUNS.length)]}`:`The Random ${NOUNS[Math.floor(rnd()*NOUNS.length)]}`;
  state={seed,daily,pool,costs,enemy,enemyName,team:[]};
  renderDraft();
}

// ---------- storage ----------
const LS='wwwf.v1';
function load(){try{return JSON.parse(localStorage.getItem(LS))||{w:0,l:0,days:{}}}catch(e){return {w:0,l:0,days:{}}}}
function save(s){try{localStorage.setItem(LS,JSON.stringify(s))}catch(e){}}
function recordLine(){const s=load();const d=s.days[dayKey];let t=`record ${s.w}–${s.l}`;if(d&&d.w)t+=' · today: beaten ✅';else if(d&&d.l)t+=` · today: ${d.l} loss${d.l>1?'es':''}`;return t}

// ---------- draft UI ----------
const $=id=>document.getElementById(id);
function emojiList(ids){const c={};ids.forEach(i=>c[i]=(c[i]||0)+1);return Object.keys(c).map(i=>`<span class="pc">${spr(i,2,12)}${c[i]>1?`<small>×${c[i]}</small>`:''}</span>`).join('')}
function spent(){return state.team.reduce((s,i)=>s+state.costs[i],0)}
function renderDraft(){
  $('dateLine').textContent=state.daily?`${MONTHS[today.getMonth()]} ${today.getDate()} · daily pool · prices are relative`:'random brawl · fresh pool · prices are relative';
  $('enemyName').textContent=state.enemyName;
  $('enemyRoster').innerHTML=emojiList(state.enemy);
  $('record').textContent=recordLine();
  renderTeam();
  renderPool();
}
function renderPool(){
  const left=BUDGET-spent(), full=state.team.length>=MAXTEAM;
  $('pool').innerHTML=state.pool.map(r=>{
    const n=state.team.filter(i=>i===r.id).length;
    const dis=state.costs[r.id]>left||full;
    return `<button class="card" data-id="${r.id}" ${dis?'disabled':''}>
      <span class="cost">${state.costs[r.id]}</span>${n?`<span class="n">×${n}</span>`:''}
      <span class="em">${spr(r.id,3,16)}</span><span class="nm">${r.name}</span><span class="bl">${r.blurb}</span></button>`}).join('');
}
function renderTeam(){
  const left=BUDGET-spent();
  $('ptsLeft').textContent=left; $('cnt').textContent=state.team.length;
  $('team').innerHTML=state.team.length?state.team.map((i,k)=>`<button class="chip" data-k="${k}">${spr(i,2,12)}<small>${state.costs[i]}</small></button>`).join(''):'<span class="empty">Tap fighters to build your team. Spend all 10 or don\'t.</span>';
  $('fightBtn').disabled=!state.team.length;
}
$('pool').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b||b.disabled)return;state.team.push(b.dataset.id);renderTeam();renderPool()});
$('team').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;state.team.splice(+b.dataset.k,1);renderTeam();renderPool()});
$('randomBtn').addEventListener('click',()=>newGame(false));
$('fightBtn').addEventListener('click',()=>startFight());

// ---------- fight ----------
let F=null; // fight state
let speed=1, timer=null;
function mkUnits(ids,side){return ids.map((id,i)=>{const r=BY[id];return {r,id,side,i,hp:r.hp,max:r.hp,cd:0.3+Math.random()*0.8/r.spd,alive:true,charged:false,venom:0,el:null}})}
function startFight(){
  F={L:mkUnits(state.team,'L'),R:mkUnits(state.enemy,'R'),t:0,done:false,firstBlood:false,finish:false,lastCrit:false,lostAny:false,critAt:-9,silent:false};
  $('draft').classList.add('hidden'); $('arena').classList.remove('hidden'); $('result').classList.add('hidden');
  $('hudEnemy').textContent=state.enemyName.replace(/^The /,'').toUpperCase();
  $('log').innerHTML='';
  const build=(units,el)=>{el.innerHTML='';units.forEach(u=>{const d=document.createElement('div');d.className='u';
    d.innerHTML=`<span class="em">${spr(u.id,3)}</span><span class="hb"><i></i></span>`;el.appendChild(d);u.el=d})};
  build(F.L,$('left')); build(F.R,$('right'));
  updateHud();
  announce('ROUND 1',false,900,()=>{announce('FIGHT!',true,700);run()});
}
function run(){clearInterval(timer);timer=setInterval(step,50/speed)}
function alive(a){return a.filter(u=>u.alive)}
function step(){
  if(F.done)return;
  const dt=0.05; F.t+=dt;
  const all=F.L.concat(F.R);
  for(const u of all){
    if(!u.alive)continue;
    if(u.venom>0){u.venom-=dt;const d=Math.round(5*dt*10)/10;u.hp-=5*dt;if(Math.floor(F.t*2)!==Math.floor((F.t-dt)*2))float(u,'☠','ven');if(u.hp<=0){kill(u,null)}}
    if(!u.alive)continue;
    u.cd-=dt;
    if(u.cd<=0){attack(u);u.cd=(1/u.r.spd)*(0.8+0.4*Math.random())}
  }
  updateHud();
  const aL=alive(F.L),aR=alive(F.R);
  if(!aL.length||!aR.length){finish(aL.length>0)}
  else if(F.t>=90){finish(aL.reduce((s,u)=>s+u.hp/u.max,0)/F.L.length>=aR.reduce((s,u)=>s+u.hp/u.max,0)/F.R.length,true)}
  else if(!F.finish&&aR.length===1&&aR[0].hp/aR[0].max<0.3&&aL.length){F.finish=true;announce('FINISH HIM!',true,900)}
}
function attack(a){
  const foes=alive(a.side==='L'?F.R:F.L); if(!foes.length)return;
  const t=Math.random()<0.6?foes[0]:foes[Math.floor(Math.random()*foes.length)];
  if(!F.silent){a.el.classList.add('lunge');setTimeout(()=>a.el.classList.remove('lunge'),160/speed)}
  const SIZE_MULT=[1,.75,.45,.25,.12];
  let base=a.r.atk*(0.75+0.5*Math.random());
  if(a.r.trait==='pack'){const n=alive(a.side==='L'?F.L:F.R).filter(u=>u!==a&&u.id===a.id).length;base*=1+Math.min(0.5,0.12*n)}
  if(a.r.trait==='charge'&&!a.charged){base*=2;a.charged=true;log(`<b>${a.r.name}</b> charges!`)}
  // a big attacker's swipe catches extra small targets
  const bigger=a.r.size-foes[0].r.size;
  let targets=[t];
  if(bigger>=3){const extra=foes.filter(f=>f!==t&&a.r.size-f.r.size>=3);targets=targets.concat(shuffle(extra,Math.random).slice(0,Math.min(2,bigger-2)))}
  targets.forEach((t,k)=>{
    if(!t.alive)return;
    let dodge=t.r.dodge*(1+Math.max(0,a.r.size-t.r.size)*0.2); dodge=Math.min(dodge,0.5);
    if(Math.random()<dodge){float(t,'miss','miss');return}
    let dmg=base*(1-t.r.arm)*(k?0.6:1);
    const diff=t.r.size-a.r.size;
    if(diff>=1&&a.r.trait!=='sting')dmg*=SIZE_MULT[Math.min(4,diff)];
    let crit=false; if(Math.random()<0.08){dmg*=2;crit=true}
    if(a.r.trait==='venom')t.venom=Math.max(t.venom,4);
    dmg=Math.max(1,Math.round(dmg));
    t.hp-=dmg;
    float(t,dmg,crit?'crit':'');
    if(crit&&F.t-F.critAt>2&&!F.silent){F.critAt=F.t;announce('CRITICAL',false,500)}
    if(!F.silent){t.el.classList.add('hit');setTimeout(()=>t.el.classList.remove('hit'),120/speed)}
    if(t.hp<=0)kill(t,a,crit);
  });
}
function kill(t,a,crit){
  t.hp=0;t.alive=false;t.el.classList.add('dead');
  F.lastCrit=!!crit; if(t.side==='L')F.lostAny=true;
  if(!F.firstBlood){F.firstBlood=true;if(!F.silent)announce('FIRST BLOOD',true,600)}
  log(a?`<b>${a.r.name}</b> takes down <b>${t.r.name}</b>`:`<b>${t.r.name}</b> succumbs to venom`);
}
function float(u,txt,cls){
  if(F.silent)return;
  const s=document.createElement('span');s.className='dmg '+(cls||'');s.textContent=txt;s.style.left=(30+Math.random()*40)+'%';u.el.appendChild(s);setTimeout(()=>s.remove(),750);
}
function log(h){const l=$('log');l.innerHTML=h+(l.innerHTML?'<br>'+l.innerHTML.split('<br>')[0]:'')}
function updateHud(){
  const pct=a=>Math.max(0,100*a.reduce((s,u)=>s+Math.max(0,u.hp),0)/a.reduce((s,u)=>s+u.max,0));
  $('hpL').style.width=pct(F.L)+'%'; $('hpR').style.width=pct(F.R)+'%';
  F.L.concat(F.R).forEach(u=>{u.el.querySelector('.hb i').style.width=Math.max(0,100*u.hp/u.max)+'%'});
}
let annT=null;
function announce(txt,red,dur,then){
  const a=$('announce');clearTimeout(annT);
  a.classList.remove('on');a.classList.toggle('red',!!red);a.textContent=txt;
  void a.offsetWidth;a.classList.add('on');
  annT=setTimeout(()=>{a.classList.remove('on');if(then)then()},dur/Math.max(1,speed*0.75));
}
function finish(win,timeout){
  F.done=true;clearInterval(timer);
  const s=load(); const d=s.days[dayKey]||(s.days[dayKey]={w:0,l:0});
  if(win){s.w++;if(state.daily)d.w++}else{s.l++;if(state.daily)d.l++} save(s);
  const title=$('resTitle');title.className='mk'+(win?'':' lose');
  title.textContent=timeout?'TIME OVER':win?(F.lostAny?'VICTORY':'FLAWLESS VICTORY'):'DEFEAT';
  $('resFat').textContent=win&&F.lastCrit&&!timeout?'FATALITY':(!win&&!timeout?'THE BAD GUYS WIN':'');
  const secs=F.t.toFixed(1);
  const survivors=alive(F.L).length;
  $('resSub').innerHTML=`${timeout?'Judges\' decision. ':''}Your team <span class="t">${emojiList(state.team)}</span> ${win?'beat':'lost to'} <b>${state.enemyName}</b> <span class="t">${emojiList(state.enemy)}</span> in ${secs}s${win?` with ${survivors} of ${F.L.length} standing.`:'.'}`;
  $('resRec').textContent=recordLine();
  setTimeout(()=>$('result').classList.remove('hidden'),F.silent?0:700/speed);
  announce(win?'K.O.':'K.O.',!win,900);
}
$('speedBtn').addEventListener('click',()=>{speed=speed===1?2:speed===2?4:1;$('speedBtn').textContent=speed+'× speed';if(F&&!F.done)run()});
$('skipBtn').addEventListener('click',()=>{if(!F||F.done)return;F.silent=true;clearInterval(timer);clearTimeout(annT);$('announce').classList.remove('on');let n=0;while(!F.done&&n++<4000)step();});
$('rematch').addEventListener('click',()=>{startFight()});
$('redraft').addEventListener('click',()=>{$('arena').classList.add('hidden');$('draft').classList.remove('hidden');renderDraft()});
$('share').addEventListener('click',async()=>{
  const win=$('resTitle').textContent!=='DEFEAT';
  const plain=ids=>{const c={};ids.forEach(i=>c[i]=(c[i]||0)+1);return Object.keys(c).map(i=>BY[i].em+(c[i]>1?'×'+c[i]:'')).join('')};
  const txt=`Who Would Win · ${MONTHS[today.getMonth()]} ${today.getDate()}\nMy ${plain(state.team)} ${win?'beat':'lost to'} ${state.enemyName} ${plain(state.enemy)}\n${win?'Prove me wrong.':'Avenge me.'} taskiap.com/whowouldwin/`;
  try{if(navigator.share){await navigator.share({text:txt})}else{await navigator.clipboard.writeText(txt);$('share').textContent='COPIED';setTimeout(()=>$('share').textContent='SHARE',1200)}}catch(e){}
});

newGame(true);
</script>
