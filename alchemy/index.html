<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Crucible — combine everything</title>
<meta name="description" content="Start with water, fire, earth and air. Drag things together and see what falls out. Twelve thousand combinations, every one of them reachable, all of it offline.">
<meta name="theme-color" content="#0a0910">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0910; --panel:rgba(24,21,34,.88); --line:rgba(255,255,255,.12);
  --text:#f2eefc; --dim:#9d94b4; --acc:#8b7bff; --acc2:#ffcf6b; --ok:#6ee7a8;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;position:fixed;inset:0;width:100%;
  overscroll-behavior:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--text);font-family:var(--sans);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}

/* ---- board ---- */
#board{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;touch-action:none;
  background:
    radial-gradient(80% 50% at 50% 12%,rgba(139,123,255,.14),transparent 70%),
    radial-gradient(60% 40% at 82% 68%,rgba(255,207,107,.08),transparent 70%),
    var(--bg)}
.chip{position:absolute;display:flex;align-items:center;gap:7px;padding:8px 13px 8px 10px;
  border-radius:100px;border:1px solid var(--line);background:var(--panel);
  backdrop-filter:blur(12px);font-size:13px;font-weight:600;white-space:nowrap;
  box-shadow:0 6px 22px rgba(0,0,0,.45);cursor:grab;touch-action:none;z-index:2;
  transform:translate(-50%,-50%)}
.chip .em{font-size:19px;line-height:1}
.chip.drag{cursor:grabbing;z-index:40;box-shadow:0 14px 40px rgba(0,0,0,.6);
  border-color:var(--acc)}
.chip.target{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(255,207,107,.28)}
.chip.pop{animation:pop .34s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
  60%{transform:translate(-50%,-50%) scale(1.14)}100%{transform:translate(-50%,-50%) scale(1)}}
.chip.gone{animation:gone .22s ease-in forwards;pointer-events:none}
@keyframes gone{to{transform:translate(-50%,-50%) scale(.3);opacity:0}}

/* ---- top ---- */
#top{position:absolute;left:0;right:0;top:0;z-index:9;display:flex;align-items:center;gap:8px;
  padding:calc(9px + env(safe-area-inset-top)) 10px 9px;
  background:linear-gradient(180deg,rgba(10,9,16,.95) 45%,rgba(10,9,16,0));
  pointer-events:none}
#top>*{pointer-events:auto}
.brand{font-size:15px;font-weight:800;letter-spacing:.10em}
.brand i{font-style:normal;color:var(--acc2)}
#stats{flex:1;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  line-height:1.5;min-width:0}
#stats b{color:var(--acc2);font-variant-numeric:tabular-nums}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:100px;
  padding:7px 13px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);cursor:pointer;font-family:var(--sans);white-space:nowrap}
.btn.on{color:#191024;background:linear-gradient(180deg,#ffe6a8,var(--acc2));border-color:var(--acc2)}
.btn.hot{color:#fff;background:linear-gradient(180deg,#a293ff,var(--acc));border-color:var(--acc)}

/* ---- palette ---- */
#dock{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;
  background:linear-gradient(0deg,rgba(10,9,16,.98) 72%,rgba(10,9,16,.86));
  border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:7px;
  max-height:52vh;transition:transform .22s}
#dock.hid{transform:translateY(calc(100% - 44px))}
#dockBar{display:flex;align-items:center;gap:7px}
#search{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:100px;padding:8px 14px;color:var(--text);font-size:13px;font-family:var(--sans);
  outline:none}
#search::placeholder{color:#6d6480}
#pal{display:flex;flex-wrap:wrap;gap:6px;overflow-y:auto;padding:2px;
  scrollbar-width:thin;align-content:flex-start}
.pit{display:flex;align-items:center;gap:6px;padding:6px 11px 6px 8px;border-radius:100px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:12px;font-weight:600;
  cursor:pointer;white-space:nowrap}
.pit .em{font-size:16px;line-height:1}
.pit.new{border-color:var(--ok);box-shadow:0 0 0 2px rgba(110,231,168,.2)}

/* ---- toast + banner ---- */
#toast{position:absolute;left:50%;bottom:calc(52vh + 14px);transform:translateX(-50%);z-index:14;
  background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:100px;padding:9px 17px;font-size:12px;font-weight:600;opacity:0;
  transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:92vw;
  overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#found{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:15;
  text-align:center;pointer-events:none;opacity:0}
#found.show{animation:found 1.5s ease-out}
@keyframes found{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  16%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  74%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}}
#found .e{font-size:64px;line-height:1}
#found .n{font-size:21px;font-weight:800;margin-top:8px}
#found .k{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--acc2);margin-top:7px}

/* ---- screens ---- */
.screen{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:26px 20px;overflow-y:auto;
  background:radial-gradient(100% 70% at 50% 30%,rgba(46,36,86,.6),rgba(8,7,13,.97))}
.screen.show{display:flex}
.h1{font-size:clamp(34px,10vmin,64px);font-weight:800;letter-spacing:-.02em;line-height:1}
.h1 i{font-style:normal;color:var(--acc2)}
.kick{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-top:12px}
.lead{font-size:13px;color:var(--dim);line-height:1.7;max-width:34ch;margin-top:18px}
.big{margin-top:24px;background:linear-gradient(180deg,#a293ff,var(--acc));color:#fff;border:none;
  border-radius:100px;padding:14px 34px;font-size:13px;font-weight:800;letter-spacing:.15em;
  text-transform:uppercase;cursor:pointer;font-family:var(--sans);
  box-shadow:0 10px 30px rgba(139,123,255,.3)}
.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px}

#logList{width:min(460px,94vw);margin-top:16px;display:flex;flex-direction:column;gap:5px;
  max-height:58vh;overflow-y:auto}
.lrow{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:11px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12.5px;text-align:left}
.lrow .em{font-size:17px}
.lrow .nm{flex:1;font-weight:600}
.lrow .rec{font-size:10.5px;color:var(--dim)}
</style>
</head>
<body>
<div id="board"></div>

<div id="top">
  <div class="brand">CRU<i>CIBLE</i></div>
  <div id="stats">—</div>
  <button class="btn" id="bLog">log</button>
  <button class="btn" id="bClear">clear</button>
</div>

<div id="found"><div class="e"></div><div class="n"></div><div class="k">new</div></div>
<div id="toast"></div>

<div id="dock">
  <div id="dockBar">
    <input id="search" placeholder="search your elements" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn" id="bHint">hint</button>
    <button class="btn" id="bHide">hide</button>
  </div>
  <div id="pal"></div>
</div>

<div class="screen show" id="scStart">
  <div class="h1">CRU<i>CIBLE</i></div>
  <div class="kick">combine everything</div>
  <div class="lead">Four things to begin with. Drag one onto another and see what
    falls out. Twelve thousand combinations, no internet involved, and every
    single element reachable from these four — that part is checked, not hoped.</div>
  <button class="big" id="bPlay">begin</button>
  <div class="row"><button class="btn" id="bReset">wipe progress</button></div>
  <div class="kick" id="startStat" style="margin-top:26px;opacity:.7"></div>
</div>

<div class="screen" id="scLog">
  <div class="h1" style="font-size:34px">Log</div>
  <div class="kick" id="logSub">—</div>
  <div id="logList"></div>
  <button class="big" id="bLogBack">back</button>
</div>

/* ═══════════════════════════════════════════════════════════
   BUILD
   ═══════════════════════════════════════════════════════════ */
const EL={}, RECIPES={};
TABLE.trim().split("\n").forEach(line=>{
  const p=line.split("|");
  if(p.length<4) return;
  const tags=p[3].trim().split(/\s+/);
  EL[p[0]]={id:p[0],n:p[1],e:p[2],tags,mod:(p[4]||"").trim()||null,
    /* which kinds of noun this adjective is allowed on: c reature, a rtifact,
       p lace. A place modifying another place gives you "Earth Mountain". */
    on:(p[5]||"cap").trim(),
    noun:tags.includes("creature")||tags.includes("artifact")||tags.includes("place"),
    kind:tags.includes("creature")?"c":tags.includes("artifact")?"a":"p",
    depth:0,mods:[]};
});
/* the book uses a few shorthand ids that resolve to a real one; anything
   still unresolved after this is a typo and gets reported by verify() */
/* No aliases. Every recipe names real ids, so a duplicate pair is a real
   duplicate and the parser can shout about it. */
const ALIAS={};
const badRecipes=[], dupRecipes=[];
BOOK.trim().split("\n").forEach(line=>{
  const m=line.match(/^([a-z0-9]+)\+([a-z0-9]+)=([a-z0-9]+)$/);
  if(!m){ if(line.trim()) badRecipes.push(line); return; }
  const a=ALIAS[m[1]]||m[1], b=ALIAS[m[2]]||m[2], r=ALIAS[m[3]]||m[3];
  if(!EL[a]||!EL[b]||!EL[r]){ badRecipes.push(line+" (unknown id)"); return; }
  const key=[a,b].sort().join("+");
  /* A second recipe for the same pair silently replaced the first, which is
     how half the tree ended up unreachable. Collisions are now errors. */
  if(RECIPES[key]) dupRecipes.push(key+" = "+RECIPES[key]+" then "+r+"  ("+line+")");
  else if(a===r||b===r) badRecipes.push(line+" (makes one of its own ingredients)");
  else RECIPES[key]=r;
});

const MODS=Object.values(EL).filter(e=>e.mod);
const NOUNS=Object.values(EL).filter(e=>e.noun);
const MAX_DEPTH=2;

/* the compositional half: a modifier meets a noun */
function compoundOf(m,n){
  if(!m.mod||!n.noun) return null;
  if(!(m.on||"cap").includes(n.kind)) return null;
  if(n.depth>=MAX_DEPTH) return null;
  if(n.mods.includes(m.mod)) return null;      /* no Fire Fire Wolf */
  if(n.id===m.id) return null;
  const id="c:"+m.mod+":"+n.id;
  if(!EL[id]){
    EL[id]={id,n:m.mod+" "+n.n,e:n.e,tags:n.tags.slice(),mod:null,noun:true,
      on:"cap",kind:n.kind,depth:n.depth+1,mods:n.mods.concat([m.mod]),made:true};
  }
  return id;
}
function combine(a,b){
  const A=EL[a], B=EL[b];
  if(!A||!B) return null;
  const hit=RECIPES[[a,b].sort().join("+")];
  if(hit) return hit;
  return compoundOf(A,B)||compoundOf(B,A);
}

/* ═══════════════════════════════════════════════════════════
   HOW BIG IS IT, ACTUALLY
   Counts every unordered pair that yields something, rather than
   trusting the arithmetic. Reported on the title screen.
   ═══════════════════════════════════════════════════════════ */
function census(){
  const seeds=Object.keys(EL).filter(k=>!EL[k].made);
  let pairs=0;
  const results=new Set();
  for(let i=0;i<seeds.length;i++){
    for(let j=i;j<seeds.length;j++){
      const r=combine(seeds[i],seeds[j]);
      if(r){ pairs++; results.add(r); }
    }
  }
  /* one more layer: the depth-1 compounds can take a second modifier */
  let deep=0;
  const depth1=[...results].filter(r=>EL[r]&&EL[r].depth===1);
  for(const d of depth1) for(const m of MODS) if(compoundOf(m,EL[d])) deep++;
  return {base:seeds.length,pairs,deep,total:pairs+deep,
    reachable:results.size,recipes:Object.keys(RECIPES).length};
}
const CENSUS=census();

/* ═══════════════════════════════════════════════════════════
   SAVE
   ═══════════════════════════════════════════════════════════ */
const KEY="crucible_v1";
const S={found:{},log:[],board:[]};
function load(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY)||"null");
    if(r&&r.found){ S.found=r.found; S.log=r.log||[]; }
  }catch(e){}
  ["water","fire","earth","air"].forEach(k=>S.found[k]=1);
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify({found:S.found,log:S.log.slice(-400)})); }
  catch(e){}
}
load();

/* compounds discovered in a past session have to be re-registered, because
   they are generated on demand and do not exist in the table */
Object.keys(S.found).forEach(id=>{
  if(!EL[id]&&id.startsWith("c:")){
    const [,mod,rest]=id.split(":");
    const base=EL[rest];
    if(base) compoundOf({mod,noun:false,id:"?"},base);
  }
});

/* ═══════════════════════════════════════════════════════════
   BOARD
   ═══════════════════════════════════════════════════════════ */
const board=$("board");
let chips=[], nextChip=1, drag=null;

function chipAt(id,x,y,pop){
  const el=document.createElement("div");
  el.className="chip"+(pop?" pop":"");
  el.innerHTML=`<span class="em">${EL[id].e}</span><span>${EL[id].n}</span>`;
  el.style.left=x+"px"; el.style.top=y+"px";
  el.dataset.id=id; el.dataset.k=nextChip++;
  board.appendChild(el);
  const c={id,x,y,el};
  chips.push(c);
  return c;
}
function removeChip(c,anim){
  const i=chips.indexOf(c);
  if(i>=0) chips.splice(i,1);
  if(anim){ c.el.classList.add("gone"); setTimeout(()=>c.el.remove(),240); }
  else c.el.remove();
}
function freeSpot(){
  const w=board.clientWidth, h=board.clientHeight;
  const top=90, bot=h-(dockOpen?h*.52:70)-30;
  for(let t=0;t<50;t++){
    const x=60+Math.random()*(w-120);
    const y=top+Math.random()*Math.max(40,bot-top);
    if(!chips.some(c=>Math.hypot(c.x-x,c.y-y)<74)) return {x,y};
  }
  return {x:w/2+(Math.random()*80-40),y:(top+bot)/2+(Math.random()*80-40)};
}
function spawn(id){
  const p=freeSpot();
  chipAt(id,p.x,p.y,true);
}

board.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".chip");
  if(!el) return;
  const c=chips.find(x=>x.el===el);
  if(!c) return;
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  drag={c,dx:e.clientX-c.x,dy:e.clientY-c.y,moved:0};
  el.classList.add("drag");
});
addEventListener("pointermove",e=>{
  if(!drag) return;
  const c=drag.c;
  const nx=e.clientX-drag.dx, ny=e.clientY-drag.dy;
  drag.moved+=Math.hypot(nx-c.x,ny-c.y);
  c.x=clamp(nx,20,board.clientWidth-20);
  c.y=clamp(ny,60,board.clientHeight-20);
  c.el.style.left=c.x+"px"; c.el.style.top=c.y+"px";
  const t=nearest(c);
  chips.forEach(o=>o.el.classList.toggle("target",o===t));
});
/* Dropping a chip into the tray is how you get rid of it. A plain tap used
   to delete it, which is a horrible thing to discover by accident. */
function overTray(c){
  const d=$("dock").getBoundingClientRect();
  return c.y>d.top+8;
}
function nearest(c){
  let best=null,bd=68;
  for(const o of chips){
    if(o===c) continue;
    const d=Math.hypot(o.x-c.x,o.y-c.y);
    if(d<bd){ bd=d; best=o; }
  }
  return best;
}
addEventListener("pointerup",()=>{
  if(!drag) return;
  const c=drag.c;
  c.el.classList.remove("drag");
  chips.forEach(o=>o.el.classList.remove("target"));
  const t=nearest(c);
  if(t){ tryCombine(c,t); }
  else if(overTray(c)){ removeChip(c,true); }  /* drag it down to put it back */
  drag=null;
});
addEventListener("pointercancel",()=>{
  if(drag){ drag.c.el.classList.remove("drag"); chips.forEach(o=>o.el.classList.remove("target")); }
  drag=null;
});

function tryCombine(a,b){
  const r=combine(a.id,b.id);
  if(!r){
    toast("Nothing comes of it");
    b.el.animate([{transform:"translate(-50%,-50%) rotate(0)"},
      {transform:"translate(-50%,-50%) rotate(-4deg)"},
      {transform:"translate(-50%,-50%) rotate(4deg)"},
      {transform:"translate(-50%,-50%) rotate(0)"}],{duration:220});
    return;
  }
  const x=(a.x+b.x)/2, y=(a.y+b.y)/2;
  removeChip(a,true); removeChip(b,true);
  const fresh=!S.found[r];
  setTimeout(()=>{
    chipAt(r,x,y,true);
    if(fresh){
      S.found[r]=1;
      S.log.push({r,a:a.id,b:b.id,t:Date.now()});
      save(); renderPal(); showFound(r);
    }else{
      renderPal();
    }
    updateStats();
  },130);
}

/* ═══════════════════════════════════════════════════════════
   UI
   ═══════════════════════════════════════════════════════════ */
let toastT=0;
function toast(m){
  const el=$("toast"); el.textContent=m; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1500);
}
function showFound(id){
  const f=$("found");
  f.querySelector(".e").textContent=EL[id].e;
  f.querySelector(".n").textContent=EL[id].n;
  f.classList.remove("show"); void f.offsetWidth; f.classList.add("show");
}
function updateStats(){
  const n=Object.keys(S.found).length;
  $("stats").innerHTML=`<b>${n}</b> found · <b>${S.log.length}</b> combos made<br>`+
    `of <b>${CENSUS.pairs.toLocaleString()}</b> in the crucible`;
}
let dockOpen=true;
function renderPal(){
  const q=$("search").value.trim().toLowerCase();
  const ids=Object.keys(S.found).filter(id=>EL[id]).sort((a,b)=>{
    const A=EL[a],B=EL[b];
    if(A.depth!==B.depth) return A.depth-B.depth;
    return A.n.localeCompare(B.n);
  });
  const show=q?ids.filter(id=>EL[id].n.toLowerCase().includes(q)):ids;
  $("pal").innerHTML=show.map(id=>
    `<button class="pit" data-id="${id}"><span class="em">${EL[id].e}</span>${EL[id].n}</button>`
  ).join("")||`<div style="color:var(--dim);font-size:12px;padding:8px">nothing matches</div>`;
  $("pal").querySelectorAll(".pit").forEach(b=>b.onclick=()=>spawn(b.dataset.id));
}
$("search").addEventListener("input",renderPal);
$("bHide").onclick=()=>{
  dockOpen=!dockOpen;
  $("dock").classList.toggle("hid",!dockOpen);
  $("bHide").textContent=dockOpen?"hide":"show";
};
$("bClear").onclick=()=>{ chips.slice().forEach(c=>removeChip(c,true)); };
$("bHint").onclick=()=>{
  /* a pair you own that makes something you have not seen */
  const own=Object.keys(S.found).filter(id=>EL[id]);
  for(let t=0;t<4000;t++){
    const a=own[(Math.random()*own.length)|0], b=own[(Math.random()*own.length)|0];
    const r=combine(a,b);
    if(r&&!S.found[r]){ toast(EL[a].n+" + "+EL[b].n+" → ?"); return; }
  }
  toast("Nothing obvious left — try something stranger");
};
$("bLog").onclick=()=>{
  const rows=S.log.slice().reverse().slice(0,300);
  $("logSub").textContent=rows.length+" discoveries, newest first";
  $("logList").innerHTML=rows.map(e=>{
    const R=EL[e.r],A=EL[e.a],B=EL[e.b];
    if(!R) return "";
    return `<div class="lrow"><span class="em">${R.e}</span>`+
      `<span class="nm">${R.n}</span>`+
      `<span class="rec">${A?A.n:"?"} + ${B?B.n:"?"}</span></div>`;
  }).join("")||`<div class="lrow"><span class="nm">Nothing yet.</span></div>`;
  $("scLog").classList.add("show");
};
$("bLogBack").onclick=()=>$("scLog").classList.remove("show");
$("bPlay").onclick=()=>{
  $("scStart").classList.remove("show");
  if(!chips.length) ["water","fire","earth","air"].forEach(spawn);
};
$("bReset").onclick=()=>{
  S.found={}; S.log=[];
  try{ localStorage.removeItem(KEY); }catch(e){}
  load(); save(); renderPal(); updateStats();
  chips.slice().forEach(c=>removeChip(c,false));
  toast("Back to four elements");
};

addEventListener("resize",()=>{
  chips.forEach(c=>{
    c.x=clamp(c.x,20,board.clientWidth-20);
    c.y=clamp(c.y,60,board.clientHeight-20);
    c.el.style.left=c.x+"px"; c.el.style.top=c.y+"px";
  });
});

$("startStat").innerHTML=
  `${CENSUS.base} elements · ${CENSUS.recipes} hand-written recipes<br>`+
  `${CENSUS.pairs.toLocaleString()} combinations, and they keep going after that`;
if(badRecipes.length||dupRecipes.length)
  console.warn("crucible: "+badRecipes.length+" bad, "+dupRecipes.length+" duplicate recipes");
renderPal(); updateStats();

window.CR={EL,RECIPES,MODS,NOUNS,combine,compoundOf,census,CENSUS,S,save,load,
  spawn,chips,tryCombine,renderPal,badRecipes,dupRecipes,ALIAS,BOOK,TABLE,
  get found(){return Object.keys(S.found).length;}};
</script>
