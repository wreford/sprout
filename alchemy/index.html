<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Crucible — combine everything</title>
<meta name="description" content="Start with water, fire, earth and air. Drag things together and watch them fuse. Eleven thousand combinations, every one reachable, all of it offline.">
<meta name="theme-color" content="#08070e">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08070e; --panel:rgba(26,22,40,.86); --line:rgba(255,255,255,.11);
  --text:#f3effc; --dim:#9b92b6; --acc:#8b7bff; --acc2:#ffcf6b; --ok:#6ee7a8;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --dockH:40vh;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;position:fixed;inset:0;width:100%;
  overscroll-behavior:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--text);font-family:var(--sans);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}

/* ── the table ───────────────────────────────────────────── */
#board{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;touch-action:none}
#aurora{position:absolute;inset:-30%;z-index:0;pointer-events:none;opacity:.5;
  background:
    radial-gradient(38% 28% at 30% 24%,rgba(139,123,255,.55),transparent 62%),
    radial-gradient(32% 24% at 74% 62%,rgba(255,207,107,.30),transparent 62%),
    radial-gradient(30% 22% at 52% 84%,rgba(110,231,168,.22),transparent 62%);
  filter:blur(24px);animation:swim 26s ease-in-out infinite alternate}
@keyframes swim{
  0%{transform:translate(-3%,-2%) scale(1) rotate(0deg)}
  50%{transform:translate(4%,3%) scale(1.12) rotate(6deg)}
  100%{transform:translate(-2%,4%) scale(1.04) rotate(-5deg)}}
#grid{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1px);
  background-size:30px 30px;
  mask-image:radial-gradient(70% 55% at 50% 40%,#000 30%,transparent 78%);
  -webkit-mask-image:radial-gradient(70% 55% at 50% 40%,#000 30%,transparent 78%)}
#fx{position:absolute;inset:0;z-index:28;pointer-events:none}
#pair{position:absolute;left:0;top:0;z-index:23;pointer-events:none;opacity:0;
  background:rgba(9,7,17,.92);backdrop-filter:blur(10px);
  border:1px solid rgba(255,207,107,.44);border-radius:100px;
  padding:5px 13px;font-size:11.5px;font-weight:750;color:#ffe6a8;white-space:nowrap;
  box-shadow:0 10px 28px rgba(0,0,0,.55);
  transition:opacity .13s}
#pair.show{opacity:1}

/* ── chips ───────────────────────────────────────────────── */
.chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;
  padding:9px 15px 9px 11px;border-radius:100px;white-space:nowrap;
  border:1px solid color-mix(in srgb,var(--c) 46%,transparent);
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--c) 15%,rgba(40,34,60,.96)),
    color-mix(in srgb,var(--c) 5%,rgba(17,14,28,.97)));
  box-shadow:0 10px 30px rgba(0,0,0,.52),
             0 2px 6px rgba(0,0,0,.4),
             inset 0 1px 0 rgba(255,255,255,.13),
             inset 0 -1px 0 rgba(0,0,0,.34);
  font-size:13.5px;font-weight:650;letter-spacing:.01em;cursor:grab;
  touch-action:none;z-index:6;will-change:transform;
  transition:box-shadow .16s,border-color .16s}
.ic{flex:0 0 auto;display:grid;place-items:center;width:24px;height:24px}
.ic img{width:24px;height:24px;border-radius:7px;object-fit:cover;display:block;
  box-shadow:0 1px 5px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.14);
  animation:ph .3s ease-out}
@keyframes ph{from{opacity:0;transform:scale(.6)}}
.chip .em{font-size:20px;line-height:1;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
.chip .nm{text-shadow:0 1px 3px rgba(0,0,0,.55)}
.chip.dragging{cursor:grabbing;z-index:20;
  box-shadow:0 24px 52px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.16),
             0 0 34px color-mix(in srgb,var(--c) 46%,transparent)}
.chip.flying{transition:none}
.chip.target{border-color:var(--acc2);
  box-shadow:0 8px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09),
             0 0 0 3px rgba(255,207,107,.32),0 0 30px rgba(255,207,107,.35)}
.chip.busy{pointer-events:none}
.chip.forged{border-color:rgba(255,207,107,.5);
  background:linear-gradient(180deg,rgba(52,42,32,.95),rgba(24,19,30,.95))}

/* ── top bar ─────────────────────────────────────────────── */
#top{position:absolute;left:0;right:0;top:0;z-index:22;display:flex;align-items:center;gap:7px;
  padding:calc(9px + env(safe-area-inset-top)) 10px 10px;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,7,14,.96) 40%,rgba(8,7,14,0))}
#top>*{pointer-events:auto}
.brand{font-size:14px;font-weight:900;letter-spacing:.13em;line-height:1}
.brand i{font-style:normal;
  background:linear-gradient(90deg,var(--acc2),#ff9ec4);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#stats{flex:1;min-width:0;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);line-height:1.5;white-space:nowrap;overflow:hidden}
#stats b{color:var(--acc2);font-variant-numeric:tabular-nums}
#bar{height:3px;border-radius:3px;background:rgba(255,255,255,.13);margin-top:6px;overflow:hidden}
#barFill{height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s cubic-bezier(.2,.9,.2,1)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:100px;
  padding:7px 11px;font-size:10px;font-weight:700;letter-spacing:.085em;text-transform:uppercase;
  color:var(--dim);cursor:pointer;font-family:var(--sans);white-space:nowrap;
  backdrop-filter:blur(12px);transition:transform .12s,color .12s,border-color .12s}
.btn:active{transform:scale(.93)}
.btn.on{color:#1a1224;background:linear-gradient(180deg,#ffe6a8,var(--acc2));border-color:var(--acc2)}
#menu{position:absolute;right:8px;top:calc(52px + env(safe-area-inset-top));z-index:31;
  width:224px;background:rgba(24,20,38,.94);backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--line);border-radius:17px;padding:6px;
  box-shadow:0 24px 64px rgba(0,0,0,.66);transform-origin:100% 0;
  opacity:0;transform:translateY(-9px) scale(.95);pointer-events:none;
  transition:opacity .17s cubic-bezier(.2,.9,.2,1),transform .17s cubic-bezier(.2,.9,.2,1)}
#menu.show{opacity:1;transform:none;pointer-events:auto}
.mi{display:flex;align-items:center;gap:11px;width:100%;padding:11px;border-radius:12px;
  background:none;border:none;color:var(--text);font-family:var(--sans);font-size:13px;
  font-weight:600;cursor:pointer;text-align:left}
.mi:active{background:rgba(255,255,255,.08)}
.mi>span:first-child{width:19px;text-align:center;font-size:15px;line-height:1}
.mi .k{margin-left:auto;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:800;color:var(--acc2)}
.mi.danger{color:#ff9ab0}
.mi.danger .k{color:#ff9ab0;opacity:.7}
.msep{height:1px;background:var(--line);margin:5px 9px}
#scrim{position:absolute;inset:0;z-index:30;display:none}
#scrim.show{display:block}
#streak{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top));z-index:21;
  transform:translateX(-50%) scale(.6);opacity:0;pointer-events:none;
  background:linear-gradient(180deg,#ffe6a8,var(--acc2));color:#1a1224;
  border-radius:100px;padding:5px 14px;font-size:11px;font-weight:900;letter-spacing:.1em;
  text-transform:uppercase;transition:transform .2s cubic-bezier(.2,1.5,.4,1),opacity .2s;
  box-shadow:0 6px 20px rgba(255,207,107,.35)}
#streak.show{opacity:1;transform:translateX(-50%) scale(1)}

/* ── dock ────────────────────────────────────────────────── */
#dock{position:absolute;left:0;right:0;bottom:0;z-index:24;display:flex;flex-direction:column;
  background:linear-gradient(0deg,rgba(8,7,14,.99) 62%,rgba(8,7,14,.90));
  border-top:1px solid var(--line);gap:7px;
  padding:9px 8px calc(8px + env(safe-area-inset-bottom));
  height:var(--dockH);transition:transform .28s cubic-bezier(.2,.9,.2,1)}
#dock.hid{transform:translateY(calc(100% - 46px))}
#dock.overtray{box-shadow:0 -1px 0 rgba(255,154,176,.55),0 -18px 46px rgba(255,90,120,.16)}
#dock.overtray::before{content:"let go to put it away";position:absolute;left:0;right:0;top:-25px;
  text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:#ff9ab0;font-weight:800;pointer-events:none}
#recent{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:0}
#recent::-webkit-scrollbar{display:none}
#recent:empty{display:none}
#tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.05);
  border-radius:100px;padding:6px 12px;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim);cursor:pointer;font-family:var(--sans);
  transition:transform .12s}
.tab:active{transform:scale(.94)}
.tab.on{color:#120f1c;background:linear-gradient(180deg,#fff,#cfc6ee);border-color:#cfc6ee}
.tab b{font-variant-numeric:tabular-nums;opacity:.6;margin-left:5px;font-weight:700}
#dockBar{display:flex;align-items:center;gap:7px}
#searchWrap{position:relative;flex:1;min-width:0;display:flex}
#search{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:100px;padding:8px 34px 8px 15px;color:var(--text);font-size:13px;
  font-family:var(--sans);outline:none}
#bSearchX{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:24px;height:24px;
  border-radius:50%;border:none;background:rgba(255,255,255,.12);color:var(--dim);
  font-size:11px;font-family:var(--sans);cursor:pointer;display:none;place-items:center}
#searchWrap.has #bSearchX{display:grid}
#search:focus{border-color:color-mix(in srgb,var(--acc) 60%,transparent)}
#search::placeholder{color:#6b6280}
#pal{display:flex;flex-wrap:wrap;gap:6px;overflow-y:auto;padding:2px 2px 6px;
  align-content:flex-start;flex:1;scrollbar-width:thin}
.pit{position:relative;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;
  border-radius:100px;font-size:12px;font-weight:650;cursor:pointer;white-space:nowrap;
  border:1px solid color-mix(in srgb,var(--c) 34%,transparent);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  animation:pit .26s cubic-bezier(.2,1.3,.4,1) backwards;transition:transform .12s}
.pit:active{transform:scale(.93)}
@keyframes pit{from{opacity:0;transform:translateY(7px) scale(.9)}to{opacity:1}}
.pit .ic{width:19px;height:19px}
.pit .ic img{width:19px;height:19px;border-radius:5px}
.pit .em{font-size:15px;line-height:1}
.pit.fresh{border-color:color-mix(in srgb,var(--ok) 62%,transparent)}
.pit.fresh::after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;
  border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 2px #0d0b16,0 0 10px rgba(110,231,168,.85);
  animation:dot 1.9s ease-in-out infinite}
@keyframes dot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.55}}
.empty{color:var(--dim);font-size:12px;padding:10px 6px;line-height:1.6}
.btn:focus-visible,.tab:focus-visible,.pit:focus-visible,.big:focus-visible,
.mi:focus-visible,#search:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  #aurora,.pit.fresh::after{animation:none}
  #found.go,#mile.go{animation-duration:1.1s}
}

/* ── announcements ───────────────────────────────────────── */
#toast{position:absolute;left:50%;bottom:calc(var(--dockH) + 14px);transform:translateX(-50%) translateY(8px);
  z-index:26;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:100px;padding:9px 18px;font-size:12px;font-weight:600;opacity:0;
  transition:opacity .18s,transform .18s;pointer-events:none;white-space:nowrap;
  max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#found{position:absolute;left:50%;top:20%;z-index:27;text-align:center;pointer-events:none;
  opacity:0;transform:translate(-50%,-50%)}
#found.go{animation:foundIn 1.7s cubic-bezier(.2,.9,.2,1)}
@keyframes foundIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-9deg)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(3deg)}
  26%{transform:translate(-50%,-50%) scale(1) rotate(0)}
  72%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-56%) scale(1.06)}}
#found .e{font-size:70px;line-height:1;filter:drop-shadow(0 8px 24px rgba(0,0,0,.7))}
#found .e .ic,#found .e img{width:104px;height:104px}
#sheet .e .ic,#sheet .e img{width:88px;height:88px}
#found .e .ic,#sheet .e .ic{margin:0 auto;overflow:visible}
#found .e img,#sheet .e img{border-radius:22px;object-fit:cover;
  box-shadow:0 12px 40px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.2)}
#sheet .e img{border-radius:18px}
#found .e .em{font-size:76px;line-height:1}
#sheet .e .em{font-size:60px;line-height:1}
#found .n{font-size:23px;font-weight:900;margin-top:8px;letter-spacing:-.01em;
  text-shadow:0 3px 18px #08070e,0 0 34px #08070e}
#found .k{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--acc2);
  margin-top:8px;font-weight:800;text-shadow:0 2px 12px #08070e}
#mile{position:absolute;left:50%;top:44%;z-index:27;text-align:center;pointer-events:none;
  opacity:0;transform:translate(-50%,-50%)}
#mile.go{animation:foundIn 2.3s cubic-bezier(.2,.9,.2,1)}
#mile .t{font-size:clamp(30px,9vmin,52px);font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--acc2),#ff9ec4,var(--acc));
  -webkit-background-clip:text;background-clip:text;color:transparent}
#mile .s{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin-top:9px}

/* ── sheets and screens ──────────────────────────────────── */
.screen{position:absolute;inset:0;z-index:32;display:none;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:26px 20px;overflow-y:auto;
  background:radial-gradient(100% 74% at 50% 26%,rgba(48,37,90,.88),rgba(7,6,13,.995)),var(--bg)}
.screen.show{display:flex;animation:fade .3s ease-out}
@keyframes fade{from{opacity:0}}
.h1{font-size:clamp(38px,11vmin,72px);font-weight:900;letter-spacing:-.035em;line-height:.94}
.h1 i{font-style:normal;background:linear-gradient(90deg,var(--acc2),#ff9ec4);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.kick{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);margin-top:13px}
.lead{font-size:13px;color:var(--dim);line-height:1.72;max-width:33ch;margin-top:22px}
.big{margin-top:26px;background:linear-gradient(180deg,#a293ff,var(--acc));color:#fff;border:none;
  border-radius:100px;padding:15px 38px;font-size:13px;font-weight:900;letter-spacing:.16em;
  text-transform:uppercase;cursor:pointer;font-family:var(--sans);
  box-shadow:0 12px 34px rgba(139,123,255,.36);transition:transform .12s}
.big:active{transform:scale(.95)}
.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}
#ringWrap{position:relative;width:138px;height:138px;margin-top:22px}
#ringWrap svg{display:block;transform:rotate(-90deg)}
#ringWrap .cn{position:absolute;inset:0;display:grid;place-items:center;align-content:center;
  text-align:center}
#ringWrap .cn b{display:block;font-size:31px;font-weight:900;letter-spacing:-.03em;line-height:1}
#ringWrap .cn s{display:block;text-decoration:none;font-size:9px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--dim);margin-top:5px}

#logList{width:min(470px,94vw);margin-top:16px;display:flex;flex-direction:column;gap:5px;
  max-height:56vh;overflow-y:auto}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12.5px;text-align:left;
  animation:pit .3s cubic-bezier(.2,1.3,.4,1) backwards}
.lrow .ic{width:22px;height:22px}
.lrow .ic img{width:22px;height:22px;border-radius:6px}
.lrow .em{font-size:18px}
.lrow .nm{flex:1;font-weight:700}
.lrow .rec{font-size:10.5px;color:var(--dim)}

#sheet{position:absolute;left:0;right:0;bottom:0;z-index:34;transform:translateY(102%);
  transition:transform .3s cubic-bezier(.2,.9,.2,1);
  background:linear-gradient(0deg,#0e0c16,#1a1628);
  border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom));text-align:center}
#sheet.show{transform:translateY(0)}
#sheet .e{font-size:52px;line-height:1}
#sheet .n{font-size:20px;font-weight:900;margin-top:6px}
#sheet .meta{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:8px}
#sheet .made{font-size:13px;color:var(--dim);margin-top:14px;line-height:1.7}
#sheet .made b{color:var(--text)}
#sheet .lbl{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);
  margin-top:17px}
#sheet .makes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:9px;
  max-height:98px;overflow-y:auto;scrollbar-width:thin}
#sheet .acts{display:flex;gap:9px;justify-content:center;margin-top:17px}
#sheet .acts .big{margin-top:0;padding:13px 26px;font-size:12px}
#sheet .acts .ghost{background:rgba(255,255,255,.07);color:var(--text);
  box-shadow:none;border:1px solid var(--line)}
#found .rec{font-size:11.5px;letter-spacing:.05em;color:#b3a9cc;margin-top:6px;
  text-shadow:0 2px 12px #08070e}
</style>
</head>
<body>
<div id="board"><div id="aurora"></div><div id="grid"></div></div>
<canvas id="fx"></canvas>

<div id="top">
  <div class="brand">CRU<i>CIBLE</i></div>
  <div id="stats">—<div id="bar"><div id="barFill"></div></div></div>
  <button class="btn" id="bClear">tidy</button>
  <button class="btn" id="bLog">log</button>
  <button class="btn" id="bMenu" aria-label="more" aria-expanded="false">•••</button>
</div>
<div id="scrim"></div>
<div id="menu" role="menu">
  <button class="mi" id="bSound" role="menuitem"><span>♪</span>Sound<span class="k">on</span></button>
  <button class="mi" id="bPhoto" role="menuitem"><span>📷</span>Photographs<span class="k">on</span></button>
  <button class="mi" id="bSort" role="menuitem"><span>↕</span>Order<span class="k">simplest</span></button>
  <div class="msep"></div>
  <button class="mi" id="bHelp" role="menuitem"><span>◎</span>Progress &amp; rules</button>
  <button class="mi danger" id="bWipe" role="menuitem"><span>⟲</span>Wipe progress</button>
</div>
<div id="pair"></div>
<div id="streak"></div>

<div id="found"><div class="e"></div><div class="n"></div><div class="rec"></div><div class="k">new</div></div>
<div id="mile"><div class="t"></div><div class="s"></div></div>
<div id="toast"></div>

<div id="dock">
  <div id="recent"></div>
  <div id="tabs"></div>
  <div id="dockBar">
    <div id="searchWrap">
      <input id="search" placeholder="search what you have" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="bSearchX" aria-label="clear search">✕</button>
    </div>
    <button class="btn" id="bHint">hint</button>
    <button class="btn" id="bHide">hide</button>
  </div>
  <div id="pal"></div>
</div>

<div id="sheet">
  <div class="e"></div><div class="n"></div><div class="meta"></div><div class="made"></div>
  <div class="lbl" id="makesLbl" style="display:none">it goes into</div>
  <div class="makes" id="makes"></div>
  <div class="acts">
    <button class="big" id="bSheetPut">put on the table</button>
    <button class="big ghost" id="bSheetClose">close</button>
  </div>
</div>

<div class="screen show" id="scStart">
  <div class="h1">CRU<i>CIBLE</i></div>
  <div class="kick">combine everything</div>

/* ═══════════════════════════════════════════════════════════
   BUILD
   ═══════════════════════════════════════════════════════════ */
const EL={}, RECIPES={};
TABLE.trim().split("\n").forEach(line=>{
  const p=line.split("|");
  if(p.length<4) return;
  const tags=p[3].trim().split(/\s+/);
  EL[p[0]]={id:p[0],n:p[1],e:p[2],tags,mod:(p[4]||"").trim()||null,
    /* which kinds of noun this adjective is allowed on: c reature, a rtifact,
       p lace. A place modifying another place gives you "Earth Mountain". */
    on:(p[5]||"cap").trim(),
    noun:tags.includes("creature")||tags.includes("artifact")||tags.includes("place"),
    /* c creature · a artifact · b built place · p natural place */
    kind:tags.includes("creature")?"c":tags.includes("artifact")?"a":
         tags.includes("built")?"b":"p",
    depth:0,mods:[]};
});
/* the book uses a few shorthand ids that resolve to a real one; anything
   still unresolved after this is a typo and gets reported by verify() */
/* No aliases. Every recipe names real ids, so a duplicate pair is a real
   duplicate and the parser can shout about it. */
const ALIAS={};
const badRecipes=[], dupRecipes=[];
BOOK.trim().split("\n").forEach(line=>{
  const m=line.match(/^([a-z0-9]+)\+([a-z0-9]+)=([a-z0-9]+)$/);
  if(!m){ if(line.trim()) badRecipes.push(line); return; }
  const a=ALIAS[m[1]]||m[1], b=ALIAS[m[2]]||m[2], r=ALIAS[m[3]]||m[3];
  if(!EL[a]||!EL[b]||!EL[r]){ badRecipes.push(line+" (unknown id)"); return; }
  const key=[a,b].sort().join("+");
  /* A second recipe for the same pair silently replaced the first, which is
     how half the tree ended up unreachable. Collisions are now errors. */
  if(RECIPES[key]) dupRecipes.push(key+" = "+RECIPES[key]+" then "+r+"  ("+line+")");
  else if(a===r||b===r) badRecipes.push(line+" (makes one of its own ingredients)");
  else RECIPES[key]=r;
});

const MODS=Object.values(EL).filter(e=>e.mod);
const NOUNS=Object.values(EL).filter(e=>e.noun);
const MAX_DEPTH=2;

/* the compositional half: a modifier meets a noun */
function compoundOf(m,n){
  if(!m.mod||!n.noun) return null;
  if(!(m.on||"capb").includes(n.kind)) return null;
  if(n.depth>=MAX_DEPTH) return null;
  if(n.mods.includes(m.mod)) return null;      /* no Fire Fire Wolf */
  if(n.id===m.id) return null;
  const id="c:"+m.mod+":"+n.id;
  if(!EL[id]){
    EL[id]={id,n:m.mod+" "+n.n,e:n.e,tags:n.tags.slice(),mod:null,noun:true,
      on:"capb",kind:n.kind,depth:n.depth+1,mods:n.mods.concat([m.mod]),made:true};
  }
  return id;
}
function combine(a,b){
  const A=EL[a], B=EL[b];
  if(!A||!B) return null;
  const hit=RECIPES[[a,b].sort().join("+")];
  if(hit) return hit;
  return compoundOf(A,B)||compoundOf(B,A);
}

/* ═══════════════════════════════════════════════════════════
   HOW BIG IS IT, ACTUALLY
   Counts every unordered pair that yields something, rather than
   trusting the arithmetic. Reported on the title screen.
   ═══════════════════════════════════════════════════════════ */
function census(){
  const seeds=Object.keys(EL).filter(k=>!EL[k].made);
  let pairs=0;
  const results=new Set();
  for(let i=0;i<seeds.length;i++){
    for(let j=i;j<seeds.length;j++){
      const r=combine(seeds[i],seeds[j]);
      if(r){ pairs++; results.add(r); }
    }
  }
  /* one more layer: the depth-1 compounds can take a second modifier */
  let deep=0;
  const depth1=[...results].filter(r=>EL[r]&&EL[r].depth===1);
  for(const d of depth1) for(const m of MODS) if(compoundOf(m,EL[d])) deep++;
  return {base:seeds.length,pairs,deep,total:pairs+deep,
    reachable:results.size,recipes:Object.keys(RECIPES).length};
}
const CENSUS=census();

  {id:"all",    n:"All",    c:"#cfc6ee"},
  {id:"nature", n:"Nature", c:"#5ec8ff"},

  {id:"forged", n:"Forged", c:"#ffcf6b"},

function catOf(e){
  if(!e) return "nature";
  if(e.made) return "forged";
  const t=e.tags;
  if(t.includes("life")||t.includes("plant")||t.includes("creature")) return "life";
  if(t.includes("made")||t.includes("material")||t.includes("artifact")||t.includes("food")) return "craft";
  if(t.includes("abstract")&&!t.includes("nature")) return "mind";
  return "nature";
}

/* A photograph of an abstraction is always wrong, so those keep the emoji. */
function wikiTitle(id){
  const e=EL[id];
  if(!e||!photos) return null;
  if(e.made) return wikiTitle(id.split(":").pop());
  if(catOf(e)==="mind") return null;
  return WIKI[id]||e.n;
}
let imgSaveT=0;
function saveImg(){
  clearTimeout(imgSaveT);
  imgSaveT=setTimeout(()=>{
    try{ localStorage.setItem(IKEY,JSON.stringify(IMG)); }catch(e){}
  },400);
}
const wq=[], wseen={}; let winflight=0;
function needImg(id){
  if(!photos) return;
  const t=wikiTitle(id);
  if(!t||Object.prototype.hasOwnProperty.call(IMG,t)||wseen[t]) return;
  wseen[t]=1; wq.push(t); pumpImg();
}
function pumpImg(){
  while(photos&&winflight<3&&wq.length){
    const t=wq.shift(); winflight++;
    const done=u=>{ IMG[t]=u||""; saveImg(); if(u) paintIcons(t);
      winflight--; pumpImg(); };
    let settled=false;
    const finish=u=>{ if(settled) return; settled=true; done(u); };
    try{
      fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+
            encodeURIComponent(t.replace(/ /g,"_"))+"?redirect=true",
            {headers:{Accept:"application/json"}})
        .then(r=>r.ok?r.json():null)
        .then(j=>{
          let u="";
          if(j&&j.type!=="disambiguation"){
            const th=j.thumbnail&&j.thumbnail.source;
            /* the summary hands back a 320px crop; 240 is enough for the
               biggest place a picture appears and kinder on a phone */
            if(th) u=th.replace(/\/\d+px-/,"/240px-");
          }
          finish(u);
        })
        .catch(()=>finish(""));
      setTimeout(()=>finish(""),9000);          /* never leave a slot stuck */
    }catch(e){ finish(""); }
  }
}
const IMGTAG=u=>'<img src="'+u+'" alt="" loading="lazy" referrerpolicy="no-referrer"'+
  ' onerror="imgFail(this)">';
function iconHTML(id){
  const t=wikiTitle(id), u=t&&IMG[t];
  const inner=u?IMGTAG(u):'<span class="em">'+EL[id].e+'</span>';
  return '<span class="ic" data-em="'+EL[id].e+'"'+
         (t?' data-wt="'+t.replace(/"/g,"&quot;")+'"':"")+'>'+inner+'</span>';
}
/* a hotlink that 404s, or an image the browser refuses, drops back to the
   emoji everywhere at once and is never asked for again */
function imgFail(img){
  const ic=img.closest(".ic"); if(!ic) return;
  const t=ic.getAttribute("data-wt");
  if(t){ IMG[t]=""; saveImg(); }
  document.querySelectorAll(t?'[data-wt="'+t.replace(/"/g,'\\"')+'"]':".ic")
    .forEach(n=>{ if(t||n===ic) n.innerHTML='<span class="em">'+(n.getAttribute("data-em")||"")+'</span>'; });
}
function paintIcons(t){
  const u=IMG[t]; if(!u||!photos) return;
  const sel='[data-wt="'+t.replace(/"/g,'\\"')+'"]';
  document.querySelectorAll(sel).forEach(n=>{
    if(n.querySelector("img")) return;
    n.innerHTML=IMGTAG(u);
  });
}

/* ═══════════════════════════════════════════════════════════
   SOUND · synthesised, nothing loaded
   ═══════════════════════════════════════════════════════════ */
let AC=null, muted=false;
try{ muted=localStorage.getItem("crucible_mute")==="1"; }catch(e){}
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==="suspended") AC.resume();
  return AC;
}
function tone(freq,t0,dur,type,vol,slideTo){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine";
  o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
function sfx(kind){
  if(muted) return;
  const c=ac(); if(!c) return;
  const t=c.currentTime;
  if(kind==="merge"){
    tone(320,t,0.16,"triangle",0.16,620);
    tone(640,t+0.03,0.13,"sine",0.09);
  }else if(kind==="new"){
    /* a little rising third — the sound of finding something */
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*0.062,0.32,"triangle",0.13));
    tone(1568,t+0.19,0.4,"sine",0.05);
  }else if(kind==="mile"){
    [392,523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,t+i*0.075,0.55,"triangle",0.14));
  }else if(kind==="nope"){
    tone(150,t,0.14,"sawtooth",0.07,90);
  }else if(kind==="tick"){
    tone(880,t,0.05,"sine",0.05);
  }else if(kind==="pick"){
    tone(1200,t,0.045,"sine",0.045);
  }
}
function setMute(m){
  muted=m;
  try{ localStorage.setItem("crucible_mute",m?"1":"0"); }catch(e){}
  const b=$("bSound");
  b.firstElementChild.textContent=m?"♪̸":"♪";
  b.querySelector(".k").textContent=m?"off":"on";
}

   PARTICLES · one canvas over everything

const fxc=$("fx"), fg=fxc.getContext("2d");
let W=1,H=1,DPR=1;
/* n counts effects fired since load — a decaying value is impossible to
   assert on without racing it */
const FX={p:[],r:[],flash:0,flashCol:"255,255,255",shake:0,
  n:{burst:0,ring:0,flash:0,shake:0,confetti:0}};
function sizeFX(){
  W=innerWidth; H=innerHeight; DPR=Math.min(2.5,devicePixelRatio||1);
  fxc.width=Math.round(W*DPR); fxc.height=Math.round(H*DPR);
  fxc.style.width=W+"px"; fxc.style.height=H+"px";
  fg.setTransform(DPR,0,0,DPR,0,0);
}
sizeFX();
function burst(x,y,n,rgb,power,size){
  FX.n.burst++;
  for(let i=0;i<n;i++){
    const a=rnd(0,TAU), v=rnd(power*0.28,power);
    FX.p.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-rnd(0,power*0.3),
      r:rnd(size*0.4,size),life:1,max:rnd(0.5,1),col:rgb,g:rnd(340,720),spin:rnd(-9,9),rot:0});
  }
}
const LINK=[];
function spark(x,y,tx,ty,n,rgb){
  for(let i=0;i<n;i++){
    const a=Math.atan2(ty-y,tx-x)+rnd(-0.5,0.5), v=rnd(120,320);
    FX.p.push({x:x+rnd(-9,9),y:y+rnd(-9,9),vx:Math.cos(a)*v,vy:Math.sin(a)*v,
      r:rnd(1.6,3.4),life:1,max:rnd(0.24,0.44),col:rgb,g:0,spin:0,rot:0});
  }
}
function ring(x,y,rgb,r1,w,ms){
  FX.n.ring++;
  FX.r.push({x,y,r0:6,r1,life:1,max:(ms||0.5),col:rgb,w:w||3});
}
function confetti(n){
  FX.n.confetti++;
  for(let i=0;i<n;i++){
    const c=CATS[1+((Math.random()*5)|0)].c;
    const rgb=[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
    FX.p.push({x:rnd(0,W),y:rnd(-60,-6),vx:rnd(-60,60),vy:rnd(60,190),
      r:rnd(3,6.5),life:1,max:rnd(1.4,2.4),col:rgb,g:120,spin:rnd(-11,11),rot:0,flat:1});
  }
}
function flash(rgb,amt){ FX.n.flash++; FX.flash=Math.max(FX.flash,amt); FX.flashCol=rgb.join(","); }
function shake(a){ FX.n.shake++; if(!REDUCED) FX.shake=Math.max(FX.shake,a); }
function stepFX(dt){
  for(let i=FX.p.length-1;i>=0;i--){
    const p=FX.p[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.vx*=0.985;
    p.rot+=p.spin*dt; p.life-=dt/p.max;
    if(p.life<=0||p.y>H+80) FX.p.splice(i,1);
  }
  for(let i=FX.r.length-1;i>=0;i--){
    const r=FX.r[i]; r.life-=dt/r.max;
    if(r.life<=0) FX.r.splice(i,1);
  }
  FX.flash=Math.max(0,FX.flash-dt*1.5);
  FX.shake=Math.max(0,FX.shake-dt*46);
}
function drawFX(){
  fg.clearRect(0,0,W,H);
  const sx=FX.shake?rnd(-FX.shake,FX.shake):0, sy=FX.shake?rnd(-FX.shake,FX.shake):0;
  fg.save(); fg.translate(sx,sy);
  fg.globalCompositeOperation="lighter";
  for(const l of LINK){
    /* a filament of light drawn tight between the two as they close */
    const c="rgba("+l.col.join(",")+",", pull=0.35+l.k*0.65;
    fg.lineWidth=1.2+l.k*4.5;
    fg.strokeStyle=c+(0.20+l.k*0.55)+")";
    fg.beginPath(); fg.moveTo(l.ax,l.ay); fg.lineTo(l.bx,l.by); fg.stroke();
    const g=fg.createRadialGradient(l.mx,l.my,0,l.mx,l.my,10+l.k*44);
    g.addColorStop(0,"rgba(255,255,255,"+(0.5*pull)+")");
    g.addColorStop(.4,c+(0.34*pull)+")");
    g.addColorStop(1,c+"0)");
    fg.fillStyle=g; fg.beginPath(); fg.arc(l.mx,l.my,10+l.k*44,0,TAU); fg.fill();
  }
  for(const r of FX.r){
    const k=1-r.life, rad=lerp(r.r0,r.r1,k*(2-k));
    fg.strokeStyle="rgba("+r.col.join(",")+","+(r.life*0.85)+")";
    fg.lineWidth=r.w*r.life;
    fg.beginPath(); fg.arc(r.x,r.y,rad,0,TAU); fg.stroke();
  }
  for(const p of FX.p){
    const a=clamp(p.life,0,1);
    fg.save(); fg.translate(p.x,p.y); fg.rotate(p.rot);
    if(p.flat){
      fg.fillStyle="rgba("+p.col.join(",")+","+(a*0.95)+")";
      fg.fillRect(-p.r,-p.r*0.45,p.r*2,p.r*0.9);
    }else{
      const g=fg.createRadialGradient(0,0,0,0,0,p.r*a+0.6);
      g.addColorStop(0,"rgba(255,255,255,"+(a*0.95)+")");
      g.addColorStop(.45,"rgba("+p.col.join(",")+","+(a*0.9)+")");
      g.addColorStop(1,"rgba("+p.col.join(",")+",0)");
      fg.fillStyle=g;
      fg.beginPath(); fg.arc(0,0,p.r*a+0.6,0,TAU); fg.fill();
    }
    fg.restore();
  }
  fg.restore();
  if(FX.flash>0.002){
    fg.globalCompositeOperation="lighter";
    fg.fillStyle="rgba("+FX.flashCol+","+(FX.flash*0.30)+")";
    fg.fillRect(0,0,W,H);
  }
  fg.globalCompositeOperation="source-over";
}

/* ═══════════════════════════════════════════════════════════
   CHIPS
   ═══════════════════════════════════════════════════════════ */
const board=$("board");
let chips=[], drag=null, merges=[];

function dockTop(){ return $("dock").getBoundingClientRect().top; }
function chipAt(id,x,y){
  const el=document.createElement("div");
  const cat=catOf(EL[id]);
  el.className="chip"+(cat==="forged"?" forged":"");
  el.style.setProperty("--c",CATC[cat]);
  el.innerHTML=iconHTML(id)+'<span class="nm">'+EL[id].n+'</span>';
  needImg(id);
  board.appendChild(el);
  const c={id,x,y,el,sc:0.3,tsc:1,rot:0,ph:Math.random()*TAU,busy:false,
    vx:0,vy:0,w:0,h:0,fly:null};
  measure(c);
  chips.push(c);
  place(c,0);
  return c;
}
function measure(c){ c.w=c.el.offsetWidth||120; c.h=c.el.offsetHeight||40; }
/* nothing sits on top of anything else: overlapping chips ease apart along
   whichever axis they are least deeply overlapped on */
function separate(dt){
  if(chips.length<2||chips.length>72) return;
  const k=Math.min(1,dt*8), held=drag?drag.c:null;
  for(let i=0;i<chips.length;i++){
    const a=chips[i];
    if(a.busy||a===held||a.fly) continue;
    for(let j=i+1;j<chips.length;j++){
      const b=chips[j];
      if(b.busy||b===held||b.fly) continue;
      const dx=b.x-a.x, dy=b.y-a.y;
      const ox=(a.w+b.w)/2+7-Math.abs(dx), oy=(a.h+b.h)/2+7-Math.abs(dy);
      if(ox<=0||oy<=0) continue;
      if(ox<oy){
        const p=(dx<0?-1:1)*ox*0.5*k; a.x-=p; b.x+=p;
      }else{
        const p=(dy<0?-1:1)*oy*0.5*k; a.y-=p; b.y+=p;
      }
    }
  }
}
function place(c,bob){
  c.el.style.transform="translate("+(c.x-c.el.offsetWidth/2)+"px,"+
    (c.y-c.el.offsetHeight/2+(bob||0))+"px) scale("+c.sc.toFixed(3)+") rotate("+c.rot.toFixed(2)+"deg)";
}
function removeChip(c){
  const i=chips.indexOf(c);
  if(i>=0) chips.splice(i,1);
  c.el.remove();
}
function freeSpot(){
  const top=96, bot=dockTop()-34;
  for(let t=0;t<60;t++){
    const x=64+Math.random()*(W-128);
    const y=top+Math.random()*Math.max(50,bot-top);
    if(!chips.some(c=>Math.hypot(c.x-x,c.y-y)<86)) return {x,y};
  }
  return {x:W/2+rnd(-70,70),y:(top+bot)/2+rnd(-70,70)};
}
function landed(c){ ring(c.x,c.y,rgbOf(c.id),46,2,0.42); }
function spawn(id,at,from){
  const p=at||freeSpot();
  const c=chipAt(id,from?from.x:p.x,from?from.y:p.y);
  if(from&&!REDUCED){
    c.sc=0.24;
    c.fly={x0:from.x,y0:from.y,x1:p.x,y1:p.y,t:0,dur:0.34};
  }else{ c.x=p.x; c.y=p.y; landed(c); }
  sfx("pick");
  return c;
}
function pillFrom(el){
  const r=el.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2};
}

/* ── input ── */
let lastTapT=0, lastTapC=null;
board.addEventListener("pointerdown",e=>{
  ac();
  const el=e.target.closest(".chip");
  if(!el) return;
  const c=chips.find(x=>x.el===el);
  if(!c||c.busy) return;
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  c.vx=c.vy=0; c.fly=null;
  drag={c,dx:e.clientX-c.x,dy:e.clientY-c.y,moved:0,px:e.clientX,
        vx:0,vy:0,tLast:performance.now(),t:null};
  c.tsc=1.1; el.classList.add("dragging");
  const now=performance.now();
  if(lastTapC===c&&now-lastTapT<330){        /* double tap clones it */
    const d=spawn(c.id,{x:clamp(c.x+52,40,W-40),y:c.y});
    d.tsc=1; toast("Copied "+EL[c.id].n);
    lastTapC=null;
  }else{ lastTapT=now; lastTapC=c; }
});
addEventListener("pointermove",e=>{
  if(!drag) return;
  const c=drag.c;
  const nx=e.clientX-drag.dx, ny=e.clientY-drag.dy;
  drag.moved+=Math.abs(nx-c.x)+Math.abs(ny-c.y);
  const now=performance.now(), dtm=clamp(now-drag.tLast,8,120);
  drag.vx=lerp(drag.vx,(nx-c.x)/dtm*1000,0.5);
  drag.vy=lerp(drag.vy,(ny-c.y)/dtm*1000,0.5);
  drag.tLast=now;
  c.rot=clamp((e.clientX-drag.px)*0.55,-11,11);
  drag.px=e.clientX;
  c.x=clamp(nx,26,W-26);
  c.y=clamp(ny,66,H-26);
  const t=nearest(c);
  drag.t=t;
  chips.forEach(o=>o.el.classList.toggle("target",o===t));
  if(t) showPair(c,t); else hidePair();
  $("dock").classList.toggle("overtray",overTray(c)&&!t);
});
/* the pair you are about to fuse, named, so a drop is never a guess */
function showPair(a,b){
  const el=$("pair");
  const txt=EL[a.id].n+"  +  "+EL[b.id].n;
  if(el.textContent!==txt) el.textContent=txt;
  el.style.transform="translate("+((a.x+b.x)/2)+"px,"+(Math.min(a.y,b.y)-44)+
    "px) translate(-50%,-50%)";
  el.classList.add("show");
}
function hidePair(){ $("pair").classList.remove("show"); }
function overTray(c){ return c.y>dockTop()+8; }
function nearest(c){
  let best=null,bd=74;
  for(const o of chips){
    if(o===c||o.busy) continue;
    const d=Math.hypot(o.x-c.x,o.y-c.y);
    if(d<bd){ bd=d; best=o; }
  }
  return best;
}
function endDrag(){
  if(!drag) return;
  const c=drag.c;
  c.el.classList.remove("dragging");
  c.tsc=1;
  chips.forEach(o=>o.el.classList.remove("target"));
  hidePair(); $("dock").classList.remove("overtray");
  const t=nearest(c);
  if(t){ c.rot=0; startMerge(c,t); }
  else if(overTray(c)){
    ring(c.x,c.y,rgbOf(c.id),40,2,0.34); removeChip(c); sfx("tick"); buzz(8);
  }else{
    /* let go mid-sweep and it keeps going, then settles */
    c.vx=clamp(drag.vx,-1900,1900); c.vy=clamp(drag.vy,-1900,1900);
    if(Math.hypot(c.vx,c.vy)<70) c.vx=c.vy=0;
  }
  drag=null;
}
addEventListener("pointerup",endDrag);
addEventListener("pointercancel",endDrag);

/* ═══════════════════════════════════════════════════════════
   THE FUSION · the bit worth watching
   ═══════════════════════════════════════════════════════════ */
function startMerge(a,b){
  const res=combine(a.id,b.id);
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  if(!res){
    sfx("nope");
    [a,b].forEach(c=>{
      const dir=c===a?1:-1;
      c.el.animate([{filter:"none"},{filter:"brightness(1.7) saturate(.4)"},{filter:"none"}],
        {duration:260});
      c.kick={x:dir*46,y:0,t:0};
    });
    ring(mx,my,[190,80,90],54,2,0.3);
    return;
  }
  a.busy=b.busy=true;
  a.el.classList.add("busy"); b.el.classList.add("busy");
  a.vx=a.vy=b.vx=b.vy=0; a.fly=b.fly=null;
  merges.push({a,b,mx,my,t:0,dur:0.34,res,fresh:!S.found[res],
    ax:a.x,ay:a.y,bx:b.x,by:b.y});
  const rgb=rgbOf(res);
  spark(a.x,a.y,mx,my,8,rgb); spark(b.x,b.y,mx,my,8,rgb);
  ring(mx,my,rgb,40,2,0.34);
  buzz(6);
}
function stepMerges(dt){
  LINK.length=0;
  for(let i=merges.length-1;i>=0;i--){
    const m=merges[i];
    m.t+=dt;
    const k=clamp(m.t/m.dur,0,1);
    /* they hesitate, then snap together — an ease that pulls back first */
    const e=k<0.22?-0.12*Math.sin(k/0.22*Math.PI):(()=>{const u=(k-0.22)/0.78;return u*u*(3-2*u);})();
    m.a.x=lerp(m.ax,m.mx,e); m.a.y=lerp(m.ay,m.my,e);
    m.b.x=lerp(m.bx,m.mx,e); m.b.y=lerp(m.by,m.my,e);
    m.a.tsc=m.b.tsc=lerp(1,0.34,clamp(e,0,1));
    m.a.rot=e*26; m.b.rot=-e*26;
    LINK.push({ax:m.a.x,ay:m.a.y,bx:m.b.x,by:m.b.y,mx:m.mx,my:m.my,k,col:rgbOf(m.res)});
    if(k>0.5&&!m.spat){ m.spat=1; spark(m.mx,m.my,m.mx,m.my-40,10,rgbOf(m.res)); }
    if(k>=1){ merges.splice(i,1); finishMerge(m); }
  }
}
function finishMerge(m){
  const rgb=rgbOf(m.res);
  removeChip(m.a); removeChip(m.b);
  const fresh=m.fresh;
  burst(m.mx,m.my,fresh?42:20,rgb,fresh?470:280,fresh?5.5:4);
  ring(m.mx,m.my,rgb,fresh?190:112,fresh?4:3,fresh?0.80:0.52);
  if(fresh){
    ring(m.mx,m.my,[255,255,255],118,2,0.60);
    setTimeout(()=>ring(m.mx,m.my,rgb,250,2,0.9),110);
    flash(rgb,0.55); shake(7); buzz([14,44,20]);
  }else{ flash(rgb,0.14); buzz(10); }
  const c=chipAt(m.res,m.mx,m.my);
  c.sc=0.15; c.tsc=fresh?1.22:1.1;
  setTimeout(()=>{ c.tsc=1; },fresh?260:150);
  if(fresh){
    S.found[m.res]=1;
    S.log.push({r:m.res,a:m.a.id,b:m.b.id,t:Date.now()});
    S.fresh[m.res]=1;
    streak++; save(); sfx("new"); showFound(m.res,m.a.id,m.b.id); bumpStreak();
    checkMilestone();
    renderPal();
  }else{
    streak=0; hideStreak(); sfx("merge");
  }
  updateStats();
}

/* ═══════════════════════════════════════════════════════════
   THE LOOP
   ═══════════════════════════════════════════════════════════ */
let last=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(t-(last||t))/1000); last=t;
  if(innerWidth!==W||innerHeight!==H) sizeFX();
  stepMerges(dt);
  const floor=dockTop()-22;
  for(const c of chips){
    c.sc+=(c.tsc-c.sc)*Math.min(1,dt*17);
    if(!drag||drag.c!==c) c.rot+=(0-c.rot)*Math.min(1,dt*11);
    if(c.fly){
      c.fly.t+=dt;
      const k=clamp(c.fly.t/c.fly.dur,0,1), e=1-Math.pow(1-k,3);
      c.x=lerp(c.fly.x0,c.fly.x1,e);
      c.y=lerp(c.fly.y0,c.fly.y1,e)-Math.sin(k*Math.PI)*44;
      c.rot=(1-k)*(c.fly.x1>c.fly.x0?-15:15);
      if(k>=1){ c.fly=null; c.rot=0; landed(c); }
    }else if(c.vx||c.vy){
      /* a flicked chip coasts, bounces off the edges and settles */
      c.x+=c.vx*dt; c.y+=c.vy*dt;
      const d=Math.pow(0.0022,dt); c.vx*=d; c.vy*=d;
      if(c.x<26){ c.x=26; c.vx=Math.abs(c.vx)*0.52; }
      if(c.x>W-26){ c.x=W-26; c.vx=-Math.abs(c.vx)*0.52; }
      if(c.y<78){ c.y=78; c.vy=Math.abs(c.vy)*0.52; }
      if(c.y>floor){ c.y=floor; c.vy=-Math.abs(c.vy)*0.52; }
      c.rot=clamp(c.vx*0.012,-13,13);
      const sp=Math.hypot(c.vx,c.vy);
      if(sp<30){ c.vx=c.vy=0; }
      else if(sp>320&&!c.busy){
        const o=nearest(c);
        if(o&&!o.busy&&!o.fly){ c.vx=c.vy=0; startMerge(c,o); }
      }
    }
    if(c.kick){
      c.kick.t+=dt;
      const kk=Math.max(0,1-c.kick.t*6);
      c.x+=c.kick.x*dt*kk*6;
      if(c.kick.t>0.3) c.kick=null;
      c.x=clamp(c.x,26,W-26);
    }
    place(c,(c.busy||c.fly||REDUCED)?0:Math.sin(t/900+c.ph)*3);
  }
  separate(dt);
  stepFX(dt); drawFX();
}
requestAnimationFrame(frame);

   ANNOUNCEMENTS

let toastT=0;
function toast(m){

let streak=0, streakT=0;
function bumpStreak(){

const MILES=[10,25,50,100,175,250,315,450,600,800];
const MILE_NAME={10:"Apprentice",25:"Dabbler",50:"Adept",100:"Alchemist",
  175:"Master",250:"Archmage",315:"Completionist",450:"Obsessive",600:"Unwell",800:"Legend"};
function checkMilestone(){
  const n=Object.keys(S.found).length;
  /* fire the highest milestone reached but not yet celebrated, rather than
     demanding an exact count — a skipped tick used to lose one for good */
  let hit=0;
  for(const m of MILES) if(n>=m&&!S.miles[m]) hit=m;
  if(!hit) return;
  MILES.forEach(m=>{ if(n>=m) S.miles[m]=1; });
  save();
  const label=hit;
  const el=$("mile");
  el.querySelector(".t").textContent=MILE_NAME[label]||label;
  el.querySelector(".s").textContent=n+" elements found";
  el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
  confetti(90); flash([255,207,107],0.7); shake(11); sfx("mile");
}

function updateStats(){
  const n=Object.keys(S.found).length;
  $("stats").firstChild.textContent="";
  $("stats").innerHTML='<b>'+n+'</b> of '+CENSUS.base+' · <b>'+S.log.length+'</b> made'+
    '<div id="bar"><div id="barFill"></div></div>';

}

/* ═══════════════════════════════════════════════════════════
   PALETTE
   ═══════════════════════════════════════════════════════════ */
let dockOpen=true, curTab="all";
const ORDERS=[
  {k:"simplest",n:"simplest"},{k:"newest",n:"newest"},
  {k:"az",n:"a–z"},{k:"category",n:"by kind"}];
let order="simplest";
try{ const o=localStorage.getItem("crucible_order"); if(o&&ORDERS.some(x=>x.k===o)) order=o; }catch(e){}
function sortIds(ids){
  const E=id=>EL[id], byName=(a,b)=>E(a).n.localeCompare(E(b).n);
  if(order==="newest"){
    const seen={}; S.log.forEach((l,i)=>{ seen[l.r]=i; });
    return ids.sort((a,b)=>(seen[b]==null?-1:seen[b])-(seen[a]==null?-1:seen[a])||byName(a,b));
  }
  if(order==="az") return ids.sort(byName);
  if(order==="category") return ids.sort((a,b)=>
    catOf(E(a)).localeCompare(catOf(E(b)))||E(a).depth-E(b).depth||byName(a,b));
  return ids.sort((a,b)=>E(a).depth-E(b).depth||byName(a,b));
}
function ownedIds(){
  return Object.keys(S.found).filter(id=>EL[id]);
}
function renderTabs(){
  const own=ownedIds();
  const counts={all:own.length};
  own.forEach(id=>{ const k=catOf(EL[id]); counts[k]=(counts[k]||0)+1; });
  $("tabs").innerHTML=CATS.filter(c=>c.id==="all"||counts[c.id])
    .map(c=>'<button class="tab'+(curTab===c.id?" on":"")+'" data-t="'+c.id+'">'+
      c.n+'<b>'+(counts[c.id]||0)+'</b></button>').join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    curTab=b.dataset.t; renderTabs(); renderPal(); sfx("tick");
  });
}
function renderPal(){
  const q=$("search").value.trim().toLowerCase();
  let ids=sortIds(ownedIds());
  ids.slice(0,220).forEach(needImg);
  if(curTab!=="all") ids=ids.filter(id=>catOf(EL[id])===curTab);
  if(q) ids=ids.filter(id=>EL[id].n.toLowerCase().includes(q));
  $("pal").innerHTML=ids.length?ids.map((id,i)=>
    '<button class="pit'+(S.fresh[id]?" fresh":"")+'" data-id="'+id+'"'+
    ' style="--c:'+colOf(id)+';animation-delay:'+Math.min(i*10,320)+'ms">'+
    iconHTML(id)+EL[id].n+'</button>').join("")
    :'<div class="empty">'+(q?'Nothing you own matches “'+q.replace(/</g,"&lt;")+'”.'
        :'Nothing here yet. Try another tab.')+'</div>';
  $("pal").querySelectorAll(".pit").forEach(b=>{
    let hold=null, held=false;
    const id=b.dataset.id;
    b.addEventListener("pointerdown",()=>{
      held=false;
      hold=setTimeout(()=>{ held=true; openSheet(id); },430);
    });
    const cancel=()=>{ clearTimeout(hold); };
    b.addEventListener("pointerup",()=>{
      cancel();
      if(held) return;
      if(S.fresh[id]){ delete S.fresh[id]; save(); b.classList.remove("fresh"); }
      spawn(id,null,pillFrom(b));
    });
    b.addEventListener("pointerleave",cancel);
    b.addEventListener("pointercancel",cancel);
  });
  renderRecent();
  renderTabs();
}
function renderRecent(){
  const seen={}, out=[];
  for(let i=S.log.length-1;i>=0&&out.length<7;i--){
    const id=S.log[i].r;
    if(seen[id]||!EL[id]) continue;
    seen[id]=1; out.push(id);
  }
  $("recent").innerHTML=out.map(id=>
    '<button class="pit" data-id="'+id+'" style="--c:'+colOf(id)+'">'+
    iconHTML(id)+EL[id].n+'</button>').join("");
  $("recent").querySelectorAll(".pit").forEach(b=>b.onclick=()=>spawn(b.dataset.id,null,pillFrom(b)));
}

/* ── the inspector ── */
let sheetId=null;
function openSheet(id){
  const e=EL[id];
  const s=$("sheet");
  sheetId=id;
  s.querySelector(".e").innerHTML=iconHTML(id);
  needImg(id);
  s.querySelector(".n").textContent=e.n;
  s.querySelector(".meta").textContent=CATS.find(c=>c.id===catOf(e)).n+
    (e.made?" · forged":"")+" · depth "+e.depth;
  const rec=S.log.slice().reverse().find(l=>l.r===id);
  let howMade=rec&&EL[rec.a]&&EL[rec.b]
    ? "You made it from <b>"+EL[rec.a].n+"</b> and <b>"+EL[rec.b].n+"</b>."
    : "One of the four you started with.";
  let live=0;
  const own=ownedIds();
  for(const o of own) if(combine(id,o)) live++;
  howMade+="<br>It pairs with <b>"+live+"</b> of the "+own.length+" things you own.";
  if(e.mod) howMade+='<br>It is an adjective: it can go in front of things.';
  s.querySelector(".made").innerHTML=howMade;
  /* everything you have already made that this went into — the inspector is
     the only place the tree is browsable, so make it browsable */
  const into=[];
  for(const l of S.log) if((l.a===id||l.b===id)&&EL[l.r]&&!into.includes(l.r)) into.push(l.r);
  into.reverse();
  const shown=into.slice(0,24);
  $("makesLbl").style.display=shown.length?"":"none";
  $("makes").innerHTML=shown.map(r=>
    '<button class="pit" data-id="'+r+'" style="--c:'+colOf(r)+'">'+
    iconHTML(r)+EL[r].n+'</button>').join("")+
    (into.length>shown.length?'<div class="empty">and '+(into.length-shown.length)+' more</div>':"");
  $("makes").querySelectorAll(".pit").forEach(b=>b.onclick=()=>openSheet(b.dataset.id));
  s.classList.add("show");
  sfx("tick");
}
$("bSheetPut").onclick=()=>{
  if(!sheetId) return;
  const b=$("sheet").querySelector(".e");
  spawn(sheetId,null,pillFrom(b));
  $("sheet").classList.remove("show");
};
$("bSheetClose").onclick=()=>$("sheet").classList.remove("show");

/* ═══════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════ */
$("search").addEventListener("input",()=>{
  $("searchWrap").classList.toggle("has",!!$("search").value);
  renderPal();
});
$("bHide").onclick=()=>{
  dockOpen=!dockOpen;
  $("dock").classList.toggle("hid",!dockOpen);
  $("bHide").textContent=dockOpen?"hide":"show";
  sfx("tick");
};
function setMenu(o){
  $("menu").classList.toggle("show",o);
  $("scrim").classList.toggle("show",o);
  $("bMenu").setAttribute("aria-expanded",o?"true":"false");
}
$("bMenu").onclick=()=>{ setMenu(!$("menu").classList.contains("show")); sfx("tick"); };
$("scrim").onclick=()=>setMenu(false);
$("bSound").onclick=()=>{ setMute(!muted); if(!muted) sfx("tick"); };
$("bPhoto").onclick=()=>{ setPhotos(!photos); sfx("tick");
  toast(photos?"Photographs on":"Emoji only"); };
$("bSort").onclick=()=>{
  const i=ORDERS.findIndex(o=>o.k===order);
  order=ORDERS[(i+1)%ORDERS.length].k;
  try{ localStorage.setItem("crucible_order",order); }catch(e){}
  $("bSort").querySelector(".k").textContent=ORDERS.find(o=>o.k===order).n;
  renderPal(); sfx("tick");
};
$("bHelp").onclick=()=>{ setMenu(false); refreshStart(); $("scStart").classList.add("show"); };
$("bSearchX").onclick=()=>{
  $("search").value=""; $("searchWrap").classList.remove("has"); renderPal(); $("search").focus();
};
$("bClear").onclick=()=>{
  /* tidy: float everything into a neat grid instead of dumping it */
  if(!chips.length){ toast("Nothing on the table"); return; }
  const per=Math.max(1,Math.floor((W-56)/132));
  const rows=Math.ceil(chips.length/per);
  const top=112, avail=Math.max(90,dockTop()-24-top);
  /* squeeze the rows to fit rather than posting the tail under the dock */
  const rowH=clamp(avail/Math.max(1,rows),34,60);
  chips.forEach((c,i)=>{
    const r=Math.floor(i/per), col=i%per, inRow=Math.min(per,chips.length-r*per);
    c.x=clamp(W/2+(col-(inRow-1)/2)*132,60,W-60);
    c.y=top+r*rowH;
    c.tsc=1.12; setTimeout(()=>{ c.tsc=1; },150);
  });
  sfx("tick"); toast("Tidied");
};
$("bHint").onclick=()=>{
  const own=ownedIds();
  for(let t=0;t<6000;t++){
    const a=own[(Math.random()*own.length)|0], b=own[(Math.random()*own.length)|0];
    const r=combine(a,b);
    if(r&&!S.found[r]){
      toast(EL[a].n+" + "+EL[b].n+" → ?");
      /* put them both on the table so the hint is actionable */
      spawn(a,{x:W/2-72,y:H*0.34}); spawn(b,{x:W/2+72,y:H*0.34});
      return;
    }
  }
  toast("Nothing obvious left — try something stranger");
};
$("bLog").onclick=()=>{
  const rows=S.log.slice().reverse().slice(0,300);
  $("logSub").textContent=rows.length+" discoveries, newest first";
  $("logList").innerHTML=rows.map((e,i)=>{
    const R=EL[e.r],A=EL[e.a],B=EL[e.b];
    if(!R) return "";
    return '<div class="lrow" style="animation-delay:'+Math.min(i*14,420)+'ms">'+
      iconHTML(e.r)+'<span class="nm">'+R.n+'</span>'+
      '<span class="rec">'+(A?A.n:"?")+" + "+(B?B.n:"?")+'</span></div>';
  }).join("")||'<div class="lrow"><span class="nm">Nothing yet.</span></div>';
  $("scLog").classList.add("show");
  sfx("tick");
};
$("bLogBack").onclick=()=>$("scLog").classList.remove("show");
const RING_C=2*Math.PI*61;
function refreshStart(){
  const n=Object.keys(S.found).length;
  $("ringN").textContent=n;
  $("ringRank").textContent="of "+CENSUS.base;
  $("ringArc").style.transition="stroke-dashoffset .9s cubic-bezier(.2,.9,.2,1)";
  $("ringArc").style.strokeDashoffset=RING_C*(1-clamp(n/CENSUS.base,0,1));
  let rank=""; for(const m of MILES) if(S.miles[m]) rank=MILE_NAME[m]||"";
  $("bPlay").textContent=n>4?"continue":"begin";
  const last=[];
  for(let i=S.log.length-1;i>=0&&last.length<3;i--){
    const id=S.log[i].r; if(EL[id]&&!last.includes(EL[id].n)) last.push(EL[id].n);
  }
  $("startLead").textContent=last.length
    ? "Last out of the crucible: "+last.join(", ")+". "+(CENSUS.base-n)+
      " elements still hiding in there. Drag one thing onto another to fuse them."
    : "Four things to begin with. Drag one onto another and watch them fuse. "+
      "Every one of the "+CENSUS.base+" is reachable from these four — that part "+
      "is checked, not hoped.";
  $("startStat").innerHTML=(rank?rank.toUpperCase()+" · ":"")+
    CENSUS.base+" elements · "+CENSUS.recipes+" recipes<br>"+
    CENSUS.pairs.toLocaleString()+" combinations";
}
$("bPlay").onclick=()=>{
  ac(); $("scStart").classList.remove("show");
  if(!chips.length){
    ["water","fire","earth","air"].forEach((id,i)=>{
      setTimeout(()=>spawn(id,{x:W/2+(i-1.5)*Math.min(96,W/5),y:H*0.32}),i*90);
    });
    setTimeout(()=>toast("Drag one onto another"),900);
  }
};
let wipeArm=0;
$("bWipe").onclick=()=>{
  /* one tap arms it, a second inside four seconds does it */
  if(Date.now()-wipeArm>4000){
    wipeArm=Date.now();
    $("bWipe").innerHTML='<span>⟲</span>Really wipe it all?<span class="k">tap again</span>';
    setTimeout(()=>{ if(Date.now()-wipeArm>=4000)
      $("bWipe").innerHTML='<span>⟲</span>Wipe progress'; },4100);
    return;
  }
  wipeArm=0;
  $("bWipe").innerHTML='<span>⟲</span>Wipe progress';
  S.found={}; S.log=[]; S.fresh={}; S.miles={};
  try{ localStorage.removeItem(KEY); }catch(e){}
  load(); save(); renderPal(); updateStats(); refreshStart();
  chips.slice().forEach(removeChip);
  setMenu(false);
  toast("Back to four elements");
};
addEventListener("resize",()=>{
  sizeFX();
  chips.forEach(c=>{ measure(c); c.x=clamp(c.x,26,W-26); c.y=clamp(c.y,66,H-26); });
});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    setMenu(false);
    $("sheet").classList.remove("show");
    $("scLog").classList.remove("show");
  }
});
if(badRecipes.length||dupRecipes.length)
  console.warn("crucible: "+badRecipes.length+" bad, "+dupRecipes.length+" duplicate recipes");
setMute(muted);
$("bSort").querySelector(".k").textContent=ORDERS.find(o=>o.k===order).n;
renderPal(); updateStats(); refreshStart();
$("bPhoto").querySelector(".k").textContent=photos?"on":"off";
if(photos){ ownedIds().forEach(needImg); pumpImg(); }

window.CR={EL,RECIPES,MODS,NOUNS,combine,compoundOf,census,CENSUS,S,save,load,
  spawn,chips,renderPal,badRecipes,dupRecipes,ALIAS,BOOK,TABLE,
  IMG,WIKI,wikiTitle,needImg,pumpImg,iconHTML,paintIcons,setPhotos,imgFail,
  get photos(){return photos;}, get imgQueue(){return wq.length+winflight;},
  startMerge,merges,FX,LINK,catOf,colOf,CATS,openSheet,checkMilestone,burst,ring,confetti,
  separate,refreshStart,setMenu,sortIds,MILES,MILE_NAME,
  get order(){return order;},
  get found(){return Object.keys(S.found).length;},
  get streak(){return streak;}};
</script>
</body>
</html>
