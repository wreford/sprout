<style>
:root{color-scheme:light dark;--bg:#ffffff;--ink:#141414;--mut:#626262;--line:#e5e5e5;--soft:#f3f3f3;--bar:#3d3d3d;--hv:#e10600;--mark:#ffe4e2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141414;--ink:#f0f0f0;--mut:#a2a2a2;--line:#2f2f2f;--soft:#1d1d1d;--bar:#2a2a2a;--mark:#4a1210}}
:root[data-theme=dark]{--bg:#141414;--ink:#f0f0f0;--mut:#a2a2a2;--line:#2f2f2f;--soft:#1d1d1d;--bar:#2a2a2a;--mark:#4a1210}
*{box-sizing:border-box}
html{background:#2a2a2a;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px}
body{margin:0 auto;max-width:720px;min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.55 Barlow,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif;line-height:1.05;margin:0;text-wrap:balance}
a{color:inherit}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--bar);color:#fff;border-bottom:3px solid var(--hv);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.bar a{text-decoration:none;display:flex;align-items:center;gap:10px;font:800 22px "Barlow Condensed",sans-serif;letter-spacing:.5px}
.bar i{display:block;width:20px;height:18px;background:var(--hv);clip-path:polygon(50% 0,100% 100%,0 100%)}
@media (max-width:440px){.bar nav{gap:11px!important;font-size:14px!important;letter-spacing:.5px!important}.bar>a{font-size:19px!important;gap:7px!important}.bar i{width:16px!important;height:14px!important}}
.bar nav{margin-left:auto;display:flex;gap:16px;font:700 16px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px}
.bar nav a{font:inherit;opacity:.85}.bar nav a[aria-current]{opacity:1;box-shadow:inset 0 -2px 0 var(--hv)}
main{padding:22px 16px 40px}
.brand{display:block;font:800 12px "Barlow Condensed",sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--hv)}
.sec{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--ink);padding-bottom:6px;margin:34px 0 12px}
.chip{display:inline-block;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:2px 10px;font:600 12px Barlow,sans-serif;color:var(--mut)}
button.chip{cursor:pointer}button.chip[aria-pressed=true]{background:var(--hv);border-color:var(--hv);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:0;background:var(--hv);color:#fff;font:700 19px "Barlow Condensed",sans-serif;text-decoration:none;letter-spacing:.3px}
.btn.alt{background:var(--soft);color:var(--ink);border:2px solid var(--line)}
:focus-visible{outline:3px solid var(--hv);outline-offset:2px}
footer{padding:22px 16px 40px;color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style>
.lede h1{font-size:44px;margin:6px 0 10px}
.sbox{display:flex;gap:8px}.sbox input{flex:1;font:500 19px Barlow,sans-serif;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink)}.sbox input:focus{outline:none;border-color:var(--hv)}
.kinds{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.kinds button[aria-pressed=true]{background:var(--hv);border-color:var(--hv);color:#fff}
.count{color:var(--mut);font-size:14px;margin:6px 0}
.res{list-style:none;padding:0;margin:0}.res li{padding:10px 2px;border-bottom:1px solid var(--line)}.res a{text-decoration:none}.res b{display:block;font:700 19px/1.2 "Barlow Condensed",sans-serif}.res a:hover b{color:var(--hv)}
.res small{display:inline-block;font:800 11px "Barlow Condensed",sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--hv);margin-bottom:2px}.res p{margin:2px 0 0;color:var(--mut);font-size:15px}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
.hint{color:var(--mut);font-size:15px}
</style>
</head>
<body>
<header class="bar"><a href="/"><i aria-hidden="true"></i>TaskIAP</a><nav aria-label="Site"><a href="/#bootcamp">Bootcamp</a><a href="/all.html">Ideas</a><a href="/search.html" aria-current="page">Search</a></nav></header>
<main>
<section class="lede"><span class="brand">TaskIAP · Search</span><h1>Search everything</h1></section>
<form class="sbox" role="search" onsubmit="return false"><input id="q" type="search" placeholder="Try float, handoffs, risk, crane, earned value" autocomplete="off" aria-label="Search"></form>
<div class="kinds" id="kinds" role="group" aria-label="Show"></div>
<p class="count" id="count" aria-live="polite"></p>
<ul class="res" id="res"></ul>
<p class="hint" id="hint">Searches the 48 field notes, 26 Bootcamp primers, 363 Bootcamp questions and 91 Scope Creep lessons, right here in your browser.</p>
</main>
<footer>TaskIAP. Opinion and practice, not professional, legal or safety advice. <a href="/">Home</a></footer>
<script src="/search-index.js"></script>
<script>
var KINDS=['Field note','Bootcamp primer','Bootcamp question','Scope Creep lesson'],show=new Set(KINDS);
var q=document.getElementById('q'),res=document.getElementById('res'),count=document.getElementById('count'),kinds=document.getElementById('kinds');
function esc(t){return t.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function terms(s){return s.toLowerCase().split(/[^a-z0-9%+]+/).filter(function(w){return w.length>1})}
// every word must appear; titles count more than text, and fuller matches rank higher
function score(it,ws){var t=it.t.toLowerCase(),x=it.x.toLowerCase(),s=0;for(var i=0;i<ws.length;i++){var w=ws[i],inT=t.indexOf(w)>=0,inX=x.indexOf(w)>=0;if(!inT&&!inX)return 0;
  s+=(inT?6:0)+Math.min(4,x.split(w).length-1)+(new RegExp('\\b'+w.replace(/[.*+?^$()|[\]\\]/g,'\\$&')+'\\b').test(t+' '+x)?2:0)}
  return s+(it.k==='Field note'?1.5:it.k==='Bootcamp primer'?1:0)}
function mark(text,ws){var h=esc(text);ws.forEach(function(w){h=h.replace(new RegExp('('+w.replace(/[.*+?^$()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')});return h}
function snippet(x,ws){var lx=x.toLowerCase(),i=-1;for(var k=0;k<ws.length&&i<0;k++)i=lx.indexOf(ws[k]);var a=Math.max(0,i-70),s=x.slice(a,a+220);return (a>0?'…':'')+s+(a+220<x.length?'…':'')}
function run(){var ws=terms(q.value);history.replaceState(null,'',q.value?'?q='+encodeURIComponent(q.value):location.pathname);
  if(!ws.length){res.innerHTML='';count.textContent='';document.getElementById('hint').hidden=false;drawKinds({});return}
  document.getElementById('hint').hidden=true;
  var hits=window.SEARCH.map(function(it){return{it:it,s:score(it,ws)}}).filter(function(h){return h.s>0});var per={};hits.forEach(function(h){per[h.it.k]=(per[h.it.k]||0)+1});drawKinds(per);
  hits=hits.filter(function(h){return show.has(h.it.k)}).sort(function(a,b){return b.s-a.s}).slice(0,80);
  count.textContent=hits.length?hits.length+(hits.length===80?'+':'')+' results':'Nothing found. Try fewer or different words.';
  res.innerHTML=hits.map(function(h){return '<li><a href="'+h.it.u+'"><small>'+h.it.k+'</small><b>'+mark(h.it.t,ws)+'</b><p>'+mark(snippet(h.it.x,ws),ws)+'</p></a></li>'}).join('')}
function drawKinds(per){kinds.innerHTML=KINDS.map(function(k){return '<button class="chip" data-k="'+k+'" aria-pressed="'+show.has(k)+'">'+k+(per[k]!=null?' · '+per[k]:'')+'</button>'}).join('')}
kinds.addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(!b)return;var k=b.dataset.k;show.has(k)?show.delete(k):show.add(k);if(!show.size)KINDS.forEach(function(x){show.add(x)});run()});
q.addEventListener('input',run);var start=new URLSearchParams(location.search).get('q');if(start){q.value=start}run();q.focus();
</script>
</body>
</html>
