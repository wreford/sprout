<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8ecae6">
<meta name="description" content="Pony Grand Prix — show jumping with a very good horse. One tap. Big air. A cat judge who always scores 3.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238ecae6'/%3E%3Ccircle cx='16' cy='13' r='8' fill='%23e8536b'/%3E%3Ccircle cx='16' cy='13' r='4.5' fill='%23fff'/%3E%3Cpath d='M12 20 l-3 9 4-3 3 4 3-4 4 3-3-9z' fill='%23e8536b'/%3E%3C/svg%3E">
<title>Pony Grand Prix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#8ecae6; --grass:#7cb96b; --grassD:#5f9e51; --ink:#243044; --paper:#fff8ee;
  --rose:#e8536b; --sun:#f6c94a; --lav:#a78bfa;
  --disp:'Sora',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--sky);font-family:var(--disp);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#a8dcf5 0%,#8ecae6 42%,#cfe9de 56%,#bfe6c9 62%)}
.abs{position:absolute}
#sun{left:76%;top:6%;width:11vmin;aspect-ratio:1;border-radius:50%;background:var(--sun);box-shadow:0 0 8vmin rgba(246,201,74,.75)}
.cloud{background:#fff;border-radius:100px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:170%;left:12%;bottom:18%}
.cloud::after{width:42%;height:130%;right:14%;bottom:24%}
@keyframes drift{from{transform:translateX(110vw)}to{transform:translateX(-60vw)}}
.hill{bottom:30%;border-radius:50% 50% 0 0;background:#9ecf8a}
#crowdband{left:0;right:0;bottom:30%;height:11%;background:#d8ecd0;border-top:.4vmin solid #b9d8ab}
#rail{left:0;right:0;bottom:30%;height:3.4vmin;z-index:2;
  background:linear-gradient(180deg,#fff 0 26%,transparent 26% 58%,#fff 58% 84%,transparent 84%),
  repeating-linear-gradient(90deg,#f2ede2 0 1.4vmin,transparent 1.4vmin 9vmin);
  filter:drop-shadow(0 .3vmin 0 rgba(36,48,68,.18))}
.bunting{position:absolute;top:-.4vmin;width:3.2vmin;height:3.6vmin;clip-path:polygon(0 0,100% 0,50% 100%)}
.head{position:absolute;bottom:18%;width:3.4vmin;aspect-ratio:1;border-radius:50%;animation:bob 1.1s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-14%)}}
#track{left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,var(--grass) 0 55%,var(--grassD) 55% 100%)}
#track .lane{position:absolute;left:0;right:0;top:46%;height:.5vmin;background:rgba(255,255,255,.35)}
#horse{width:32vmin;will-change:transform;z-index:5}
.ob{will-change:transform;z-index:4}
.spark{position:absolute;border-radius:50%;pointer-events:none;z-index:6}
#hud{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:flex-start;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.pill{background:rgba(36,48,68,.82);color:var(--paper);border-radius:100px;padding:.5em .95em;font-family:var(--mono);font-weight:800;font-size:clamp(11px,2.6vmin,15px);letter-spacing:.06em;backdrop-filter:blur(4px)}
#hearts{letter-spacing:.15em}
#roundLbl{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:10}
#toast{
  position:fixed;left:50%;top:26%;transform:translateX(-50%) scale(0);z-index:12;pointer-events:none;
  font-family:var(--mono);font-weight:800;font-size:clamp(13px,3.4vmin,22px);letter-spacing:.1em;text-transform:uppercase;
  background:var(--paper);color:var(--ink);border:.45vmin solid var(--ink);border-radius:1.2vmin;padding:.5em 1em;
  box-shadow:.8vmin .8vmin 0 rgba(36,48,68,.25);white-space:nowrap;transition:transform .18s cubic-bezier(.2,1.6,.4,1)
}
#toast.on{transform:translateX(-50%) scale(1) rotate(-2deg)}
#judges{position:fixed;right:12px;top:22%;z-index:11;display:flex;gap:1vmin;opacity:0;transform:translateY(-10px);transition:all .25s}
#judges.on{opacity:1;transform:none}
.card{background:var(--paper);border:.4vmin solid var(--ink);border-radius:1vmin;width:7vmin;height:9vmin;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:3.6vmin;box-shadow:.5vmin .5vmin 0 rgba(36,48,68,.2)}
.card small{font-size:1.6vmin;font-family:var(--mono);font-weight:800;color:#24304488}
#banner{
  position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);z-index:14;pointer-events:none;text-align:center;
  transition:transform .25s cubic-bezier(.2,1.7,.4,1)
}
#banner.on{transform:translate(-50%,-50%) scale(1)}
#banner .big{font-weight:900;font-size:clamp(30px,9vmin,70px);text-transform:uppercase;letter-spacing:-.02em;color:var(--paper);-webkit-text-stroke:.35vmin var(--ink);text-shadow:.7vmin .7vmin 0 rgba(36,48,68,.3)}
#banner .sub{font-family:var(--mono);font-weight:800;font-size:clamp(11px,2.6vmin,16px);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--paper);border:.35vmin solid var(--ink);border-radius:.8vmin;display:inline-block;padding:.35em .8em;margin-top:1vmin;transform:rotate(-2deg)}
.ovl{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;background:rgba(24,34,52,.78);backdrop-filter:blur(8px);text-align:center;padding:24px}
.ovl.hide{display:none}
.ovl .k{font-family:var(--mono);font-size:clamp(10px,2.4vmin,13px);letter-spacing:.24em;color:var(--sun);font-weight:800;text-transform:uppercase}
.ovl h1{font-size:clamp(32px,9vmin,64px);font-weight:900;letter-spacing:-.02em;line-height:1;text-transform:uppercase;color:var(--paper)}
.ovl h1 .p{color:var(--rose)}
.ovl .big{
  padding:16px 34px;border-radius:14px;background:var(--rose);color:#fff;border:none;cursor:pointer;
  font-family:var(--disp);font-weight:900;font-size:clamp(15px,3vmin,17px);letter-spacing:.05em;text-transform:uppercase;min-height:56px;
  box-shadow:0 16px 36px -8px rgba(232,83,107,.6)
}
.ovl .sub{font-family:var(--mono);font-size:clamp(10px,2.3vmin,12px);letter-spacing:.14em;color:rgba(255,248,238,.65);font-weight:700;text-transform:uppercase;line-height:2}
#overHorse{width:min(46vmin,240px)}
#rosette{width:min(30vmin,170px);filter:drop-shadow(0 1vmin 2vmin rgba(0,0,0,.35))}
#wall{display:flex;gap:1.6vmin;flex-wrap:wrap;justify-content:center}
.wallchip{font-family:var(--mono);font-weight:800;font-size:clamp(10px,2.2vmin,12px);letter-spacing:.08em;color:var(--paper);background:rgba(255,248,238,.12);border:1px solid rgba(255,248,238,.3);border-radius:100px;padding:.5em 1em}
</style>
</head>
<body>
<div id="game">
  <div id="sun" class="abs"></div>
  <div class="abs cloud" style="left:0;top:10%;width:16vmin;height:5vmin;animation-duration:52s"></div>
  <div class="abs cloud" style="left:0;top:22%;width:11vmin;height:3.8vmin;animation-duration:74s;animation-delay:-30s"></div>
  <div class="abs cloud" style="left:0;top:5%;width:9vmin;height:3.2vmin;animation-duration:64s;animation-delay:-52s"></div>
  <div class="abs hill" style="left:-12%;width:56%;height:22%"></div>
  <div class="abs hill" style="left:34%;width:48%;height:17%;background:#93c67e"></div>
  <div class="abs hill" style="right:-14%;width:52%;height:20%"></div>
  <div id="crowdband" class="abs"></div>
  <div id="rail" class="abs"></div>
  <div id="track" class="abs"><div class="lane"></div></div>
  <div id="horse" class="abs"></div>
  <div id="obs"></div>
</div>

<div id="hud">
  <div style="display:flex;gap:8px;flex-direction:column;align-items:flex-start">
    <div class="pill" id="score">0</div>
    <div class="pill" id="hearts">♥♥♥</div>
  </div>
  <div style="display:flex;gap:8px;flex-direction:column;align-items:flex-end">
    <div class="pill" id="best">BEST 0</div>
    <div class="pill" id="carrots">🥕 0</div>
  </div>
</div>
<div class="pill" id="roundLbl">ROUND 1</div>
<div id="toast"></div>
<div id="judges"></div>
<div id="banner"><div class="big"></div><div class="sub"></div></div>

<div class="ovl" id="intro">
  <span class="k">The equestrian event of the century · for Liller</span>
  <h1>Pony<br>Grand <span class="p">Prix</span></h1>
  <div id="introHorse" style="width:min(50vmin,260px)"></div>
  <button class="big" id="startBtn">Take the reins</button>
  <span class="sub">Tap anywhere to jump · clear the fences · eat the carrots<br>Judge #4 is a cat. He scores 3. Always.</span>
</div>

<div class="ovl hide" id="over">
  <span class="k" id="overKick">THE JUDGES HAVE DELIBERATED</span>
  <h1 id="overTitle">Clear Round</h1>
  <div id="rosette"></div>
  <div class="sub" id="overStats" style="line-height:2.2"></div>
  <div id="wall"></div>
  <button class="big" id="againBtn">Ride again</button>
  <span class="sub" id="overJoke"></span>
</div>

<script>
'use strict';
/* ============================================================
   PONY GRAND PRIX · show jumping with a very good horse
   ============================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const $ = id => document.getElementById(id);

/* ---------- the articulated horse (from Lily's Horse Facts) ---------- */
function HORSE(f, o = {}){
  const gait = o.gait || 'gallop';
  const P = {
    gallop: { spd: 2.6, swing: 40, knee: 40, lift: 15, bob: 10, mane: 6 },
    trot:   { spd: 3.6, swing: 26, knee: 26, lift: 9,  bob: 6,  mane: 7 },
    jump:   { spd: 2.6, swing: 12, knee: 62, lift: 4,  bob: 0,  mane: 10 },
    idle:   { spd: 11,  swing: 4,  knee: 8,  lift: 1,  bob: 2,  mane: 11 },
  }[gait];
  const t = f / P.spd;
  const step = t * 2;
  const bob = Math.abs(Math.sin(step)) * P.bob;
  const sway = gait === 'gallop' ? Math.sin(step) * 2.2 : 0;
  const blink = Math.sin(f / 13) < -.92;
  const headDip = gait === 'jump' ? -10 : 0;
  const earFlick = Math.sin(f / 19) > .9 ? -15 : 0;
  const coat = '#b57c50', coatD = '#8c5c39', coatL = '#cf9a6d', maneC = '#5b3c25', hoof = '#2c241e', out = '#3a2e26';
  const U = 28, Lg = 30;
  const D2R = Math.PI / 180;
  function limb(hx, hy, ph, hind, shade){
    const th1 = (P.swing * Math.sin(ph)) * D2R;
    const lift = Math.max(0, Math.sin(ph + (hind ? 2.5 : 0.7)));
    const th2 = (hind ? 1 : -1) * (P.knee * lift) * D2R;
    const kx = hx + Math.sin(th1) * U, ky = hy + Math.cos(th1) * U;
    const fx = kx + Math.sin(th1 + th2) * Lg, fy = ky + Math.cos(th1 + th2) * Lg - lift * P.lift;
    const col = shade ? coatD : coat;
    const ang = (th1 + th2) / D2R;
    return `<path d="M${hx} ${hy} L${kx.toFixed(1)} ${ky.toFixed(1)} L${fx.toFixed(1)} ${fy.toFixed(1)}" fill="none" stroke="${out}" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M${hx} ${hy} L${kx.toFixed(1)} ${ky.toFixed(1)} L${fx.toFixed(1)} ${fy.toFixed(1)}" fill="none" stroke="${col}" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(${fx.toFixed(1)} ${fy.toFixed(1)}) rotate(${ang.toFixed(1)})"><rect x="-6.5" y="-1" width="13" height="12" rx="3.5" fill="${hoof}"/></g>`;
  }
  const off = {
    gallop: [0, 3.5, 1.0, 4.4], trot: [0, Math.PI, Math.PI, 0],
    jump: [2.2, 2.6, 5.2, 5.6], idle: [0, .5, .25, .7],
  }[gait];
  const legFar  = limb(98, 116, step + off[0], true, true) + limb(190, 113, step + off[1], false, true);
  const legNear = limb(110, 118, step + off[2], true, false) + limb(202, 115, step + off[3], false, false);
  let maneS = '';
  for (let i = 0; i < 8; i++){
    const u = i / 7, bx = 236 - 44 * u, by = 52 + 34 * u, w = Math.sin(t * 1.4 + i * .7) * P.mane;
    maneS += `<path d="M${bx.toFixed(1)} ${by.toFixed(1)} q${(-12 + w).toFixed(1)} 11 ${(-7 + w).toFixed(1)} 24" stroke="${maneC}" stroke-width="${(8 - u * 3).toFixed(1)}" fill="none" stroke-linecap="round"/>`;
  }
  let tailS = '';
  for (let i = 0; i < 7; i++){
    const w = Math.sin(t * 1.2 + i * .55) * (P.mane + 5);
    tailS += `<path d="M74 92 q${(-30 + w).toFixed(1)} ${18 + i * 2} ${(-22 + w).toFixed(1)} ${54 + i * 2}" stroke="${maneC}" stroke-width="${(10 - i).toFixed(1)}" fill="none" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 300 200" width="100%" style="overflow:visible">
    ${o.shadow === false ? '' : `<ellipse cx="150" cy="190" rx="${(84 - bob * 1.6).toFixed(1)}" ry="8" fill="rgba(58,46,38,.14)"/>`}
    <g transform="translate(0 ${(-bob).toFixed(1)}) rotate(${sway.toFixed(2)} 150 108)">
      ${tailS}
      ${legFar}
      <path d="M72 104 C64 78 104 68 150 70 C182 71 204 78 214 96 C222 110 218 128 200 134 C160 143 108 143 84 134 C70 129 68 116 72 104 Z"
        fill="${coat}" stroke="${out}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M78 96 C96 76 150 72 196 84 C176 78 120 78 88 96 Z" fill="${coatD}" opacity=".55"/>
      <path d="M92 134 C130 142 172 141 200 132 C176 138 120 139 92 134 Z" fill="${coatL}" opacity=".5"/>
      <g transform="rotate(${headDip} 198 92)">
        <path d="M182 96 C188 66 206 50 232 52 L250 62 C230 70 210 86 202 110 C196 118 182 116 178 106 Z"
          fill="${coat}" stroke="${out}" stroke-width="5" stroke-linejoin="round"/>
        <path d="M186 92 C194 68 210 54 232 54 L238 60 C214 66 198 82 190 104 Z" fill="${coatD}" opacity=".5"/>
        ${maneS}
        <path d="M228 50 C246 42 262 48 266 62 C269 74 264 88 251 94 L236 96 C226 88 222 64 228 50 Z"
          fill="${coat}" stroke="${out}" stroke-width="5" stroke-linejoin="round"/>
        <path d="M251 92 C262 88 267 78 266 66 C270 78 268 90 255 96 Z" fill="${coatL}" opacity=".55"/>
        <path d="M232 34 l3 -16 l11 12 z" fill="${coat}" stroke="${out}" stroke-width="4" stroke-linejoin="round" transform="rotate(${earFlick} 236 30)"/>
        <path d="M246 34 l11 -13 l4 15 z" fill="${coatD}" stroke="${out}" stroke-width="4" stroke-linejoin="round"/>
        <path d="M234 40 q4 -14 14 -18 q-3 12 1 16 q-8 4 -11 12 z" fill="${maneC}"/>
        <ellipse cx="258" cy="82" rx="10" ry="9" fill="${coatL}" stroke="${out}" stroke-width="3.5"/>
        <ellipse cx="260" cy="79" rx="2.6" ry="3.6" fill="${out}"/>
        <path d="M252 90 q7 3 12 0" stroke="${out}" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="242" cy="60" rx="5.2" ry="${blink ? .9 : 5.6}" fill="#1c1712"/>
        ${blink ? '' : '<circle cx="244" cy="58" r="1.7" fill="#fff" opacity=".85"/>'}
        ${o.acc === 'ribbon' ? `<circle cx="150" cy="70" r="11" fill="#e88ca6" stroke="${out}" stroke-width="3"/>` : ''}
      </g>
      ${legNear}
    </g>
  </svg>`;
}

/* ---------- obstacle art ---------- */
const OB_ART = {
  fence: () => `<svg viewBox="0 0 60 90" width="100%" style="overflow:visible">
    <rect x="4" y="6" width="8" height="84" rx="3" fill="#fff" stroke="#243044" stroke-width="3"/>
    <rect x="48" y="6" width="8" height="84" rx="3" fill="#fff" stroke="#243044" stroke-width="3"/>
    <rect x="0" y="14" width="60" height="10" rx="5" fill="#e8536b" stroke="#243044" stroke-width="3"/>
    <rect x="0" y="38" width="60" height="10" rx="5" fill="#fff" stroke="#243044" stroke-width="3"/>
    <rect x="0" y="62" width="60" height="10" rx="5" fill="#e8536b" stroke="#243044" stroke-width="3"/>
  </svg>`,
  double: () => `<svg viewBox="0 0 110 90" width="100%" style="overflow:visible">
    ${[0, 50].map(x => `<rect x="${x + 4}" y="6" width="8" height="84" rx="3" fill="#fff" stroke="#243044" stroke-width="3"/>
    <rect x="${x + 48}" y="6" width="8" height="84" rx="3" fill="#fff" stroke="#243044" stroke-width="3"/>
    <rect x="${x}" y="14" width="60" height="10" rx="5" fill="#a78bfa" stroke="#243044" stroke-width="3"/>
    <rect x="${x}" y="44" width="60" height="10" rx="5" fill="#fff" stroke="#243044" stroke-width="3"/>`).join('')}
  </svg>`,
  hay: () => `<svg viewBox="0 0 80 60" width="100%" style="overflow:visible">
    <rect x="2" y="4" width="76" height="54" rx="10" fill="#e9c46a" stroke="#243044" stroke-width="3.5"/>
    <path d="M10 20 h60 M10 32 h60 M10 44 h60" stroke="#c99b3f" stroke-width="3"/>
    <path d="M20 4 v54 M58 4 v54" stroke="#a5772c" stroke-width="4"/>
  </svg>`,
  water: () => `<svg viewBox="0 0 140 24" width="100%" style="overflow:visible">
    <ellipse cx="70" cy="12" rx="68" ry="11" fill="#5db8e8" stroke="#243044" stroke-width="3"/>
    <path d="M20 10 q8 -5 16 0 M60 14 q8 -5 16 0 M100 9 q8 -5 16 0" stroke="#cfeefc" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </svg>`,
  limo: () => `<svg viewBox="0 0 220 70" width="100%" style="overflow:visible">
    <rect x="4" y="26" width="212" height="28" rx="10" fill="#ffb3d0" stroke="#243044" stroke-width="4"/>
    <path d="M50 26 l12 -16 h74 l12 16" fill="#ffb3d0" stroke="#243044" stroke-width="4" stroke-linejoin="round"/>
    <rect x="70" y="14" width="20" height="10" rx="3" fill="#243044"/><rect x="102" y="14" width="20" height="10" rx="3" fill="#243044"/>
    <circle cx="42" cy="56" r="11" fill="#243044"/><circle cx="178" cy="56" r="11" fill="#243044"/>
    <circle cx="42" cy="56" r="4.5" fill="#8a8fa8"/><circle cx="178" cy="56" r="4.5" fill="#8a8fa8"/>
    <text x="110" y="47" text-anchor="middle" font-family="monospace" font-size="11" font-weight="800" fill="#243044">WHY IS THIS HERE</text>
  </svg>`,
  jackson: (f) => {
    const blink = Math.sin(f / 13) < -.9 ? .1 : 1;
    const tail = Math.sin(f / 9) * 10;
    return `<svg viewBox="0 0 120 130" width="100%" style="overflow:visible">
    <path d="M60 128 q-34 0-34-30 q0-22 16-30 l-6-26 14 12 q10-4 20 0 l14-12 -6 26 q16 8 16 30 q0 30-34 30" fill="#1c1c22" stroke="#0c0c10" stroke-width="3"/>
    <ellipse cx="47" cy="82" rx="6" ry="${7 * blink}" fill="#f6c94a"/>
    <ellipse cx="73" cy="82" rx="6" ry="${7 * blink}" fill="#f6c94a"/>
    <ellipse cx="47" cy="82" rx="2.4" ry="${5 * blink}" fill="#0c0c10"/>
    <ellipse cx="73" cy="82" rx="2.4" ry="${5 * blink}" fill="#0c0c10"/>
    <path d="M54 96 q6 5 12 0" stroke="#0c0c10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M30 92 l-16-4 M30 98 l-16 2 M90 92 l16-4 M90 98 l16 2" stroke="#3a3a44" stroke-width="2"/>
    <path d="M92 120 q ${18 + tail} -6 ${14 + tail * .6} -34" stroke="#1c1c22" stroke-width="11" fill="none" stroke-linecap="round"/>
  </svg>`;
  },
  carrot: () => `<svg viewBox="0 0 60 60" width="100%" style="overflow:visible">
    <g transform="rotate(-38 30 30)">
      <path d="M14 26 l38 8 l-34 10 z" fill="#f28c3b" stroke="#243044" stroke-width="3" stroke-linejoin="round"/>
      <path d="M51 32 l10 -6 M51 34 l11 0 M51 36 l10 6" stroke="#7fae5e" stroke-width="4" stroke-linecap="round"/>
    </g>
  </svg>`,
};
/* w,h in track units (tu = 1% of viewport width) · h = jump clearance needed */
const OB_DEF = {
  fence:   { w: 6,  h: 7,   round: 1, pts: 50 },
  hay:     { w: 8,  h: 5,   round: 1, pts: 40 },
  double:  { w: 11, h: 7,   round: 2, pts: 80 },
  water:   { w: 13, h: 2.6, round: 2, pts: 70 },
  jackson: { w: 5.5, h: 5,  round: 3, pts: 100 },
  limo:    { w: 17, h: 5,   round: 3, pts: 120 },
};

/* ---------- crowd + bunting ---------- */
(() => {
  const band = $('crowdband');
  const cols = ['#e8536b', '#f6c94a', '#a78bfa', '#5db8e8', '#7cb96b'];
  let html = '';
  for (let i = 0; i < 26; i++) html += `<div class="bunting" style="left:${i * 4}%;background:${cols[i % 5]}"></div>`;
  for (let i = 0; i < 34; i++){
    const skin = ['#e8b48a', '#c68d5e', '#8a5a38', '#f0c9a0'][i % 4];
    html += `<div class="head" style="left:${(i * 3.1 + (i % 3)) % 97}%;background:${skin};animation-delay:${(i % 7) * .13}s"></div>`;
  }
  band.innerHTML = html;
})();

/* ============================================================
   GAME STATE
   ============================================================ */
const G = {
  running: false, over: false,
  t: 0, frame: 0,
  speed: 26,               /* tu per second */
  y: 0, vy: 0,             /* horse height above ground in tu */
  grounded: true,
  score: 0, carrots: 0, faults: 0, round: 1,
  streak: 0,
  obs: [],                 /* {kind,x,w,h,el,cleared,fly} */
  nextSpawn: 1.2,
  roundT: 0,
  invuln: 0,
  best: 0,
};
const HORSE_X = 10;        /* left edge of horse box in tu */
const HORSE_W = 32;        /* rendered width in vmin — but track math uses tu */
/* horse hitbox inside its box, in tu: body from +7 to +24 of a 30tu-wide sprite */
let TU = innerWidth / 100;
let GROUND = 0;            /* px y of ground line */
function measure(){
  TU = innerWidth / 100;
  GROUND = innerHeight * .755;
}
measure();
addEventListener('resize', () => { measure(); });

const horseEl = $('horse');
const obsWrap = $('obs');
const JUMP_V = 78, GRAV = 120;

/* horse sprite spans ~30tu wide on screen; scale via vmin keeps it sane on desktop */
function horsePx(){ return { x: HORSE_X * TU, w: Math.min(34 * TU, innerHeight * .38) }; }

function setHorse(){
  const gait = G.grounded ? 'gallop' : 'jump';
  const tilt = G.grounded ? 0 : clamp(-G.vy * .28, -14, 12);
  horseEl.innerHTML = HORSE(G.frame, { gait, shadow: G.grounded });
  const hp = horsePx();
  horseEl.style.width = hp.w + 'px';
  const spriteH = hp.w * (200 / 300);
  horseEl.style.transform = `translate(${hp.x}px, ${GROUND - spriteH - G.y * TU}px) rotate(${tilt}deg)`;
}

/* ---------- toasts / judges / banner ---------- */
let toastT = null;
function toast(msg, ms = 1300){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
let judgeT = null;
function judges(margin){
  const j = $('judges');
  const base = margin < 2 ? [9, 10, 9] : margin < 6 ? [8, 9, 8] : [7, 8, 7];
  const s = base.map(b => clamp(b + (Math.random() < .4 ? 1 : 0), 6, 10));
  j.innerHTML = s.map(n => `<div class="card">${n}<small>JUDGE</small></div>`).join('')
    + `<div class="card" style="background:#f3e8f0">3<small>🐈 CAT</small></div>`;
  j.classList.add('on');
  clearTimeout(judgeT); judgeT = setTimeout(() => j.classList.remove('on'), 1400);
  return s.reduce((a, b) => a + b, 0) + 3;
}
let bannerT = null;
function banner(big, sub, ms = 1900){
  const b = $('banner');
  b.querySelector('.big').textContent = big;
  b.querySelector('.sub').textContent = sub;
  b.classList.add('on');
  clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove('on'), ms);
}

/* ---------- particles ---------- */
function burst(px, py, col, n = 10){
  for (let i = 0; i < n; i++){
    const s = document.createElement('div');
    s.className = 'spark';
    const sz = rand(4, 10);
    s.style.cssText = `left:${px}px;top:${py}px;width:${sz}px;height:${sz}px;background:${col};z-index:8`;
    document.getElementById('game').appendChild(s);
    const ang = rand(0, Math.PI * 2), sp = rand(40, 160);
    const vx = Math.cos(ang) * sp, vy0 = Math.sin(ang) * sp - 80;
    const t0 = performance.now();
    (function anim(now){
      const dt = (now - t0) / 1000;
      if (dt > .7){ s.remove(); return; }
      s.style.transform = `translate(${vx * dt}px, ${vy0 * dt + 220 * dt * dt}px)`;
      s.style.opacity = 1 - dt / .7;
      requestAnimationFrame(anim);
    })(t0);
  }
}

/* ---------- rounds ---------- */
const ROUNDS = [
  null,
  ['ROUND 1', 'GENTLE FENCES · FRIENDLY CROWD'],
  ['ROUND 2', 'THE FENCES HAVE OPINIONS NOW'],
  ['ROUND 3', 'A LIMOUSINE, FOR SOME REASON'],
  ['ROUND 4', 'FULLY UNHINGED · GODSPEED'],
];
const CLEAR_LINES = ['CLEAN!', 'TECHNICALLY FLYING', 'THE CROWD IS WEEPING', 'MAJESTIC AS HECK', 'ZERO PHYSICS VIOLATIONS', 'OLYMPIC? OLYMPIC.'];

/* ---------- spawning ---------- */
function spawn(){
  const pool = Object.entries(OB_DEF).filter(([, d]) => d.round <= Math.min(G.round, 4)).map(([k]) => k);
  const kind = pool[Math.floor(Math.random() * pool.length)];
  const d = OB_DEF[kind];
  const el = document.createElement('div');
  el.className = 'abs ob';
  obsWrap.appendChild(el);
  G.obs.push({ kind, x: 112, w: d.w, h: d.h, el, cleared: false, hit: false });
  /* carrot chance floating after the obstacle */
  if (Math.random() < .55){
    const c = document.createElement('div');
    c.className = 'abs ob';
    obsWrap.appendChild(c);
    G.obs.push({ kind: 'carrot', x: 112 + rand(14, 26), w: 4.5, h: 0, fly: rand(6, 15), el: c, cleared: false, hit: false });
  }
  /* time-constant gap: always leaves room for a full jump arc + reaction, at any speed */
  G.nextSpawn = rand(1.6, 2.4) + (kind === 'limo' ? .4 : 0);
}

function drawOb(o){
  const d = o.kind === 'carrot' ? null : OB_DEF[o.kind];
  const wpx = o.w * TU * (o.kind === 'carrot' ? 1.4 : 1.35);
  let hpx;
  if (o.kind === 'carrot') hpx = wpx;
  else if (o.kind === 'water') hpx = wpx * .17;
  else hpx = wpx * ({ fence: 1.5, double: .82, hay: .75, limo: .32, jackson: 1.08 }[o.kind]);
  o.el.innerHTML = OB_ART[o.kind](G.frame);
  o.el.style.width = wpx + 'px';
  const lift = o.kind === 'carrot' ? o.fly * TU : 0;
  o.el.style.transform = `translate(${o.x * TU}px, ${GROUND - hpx - lift + (o.kind === 'water' ? hpx * .55 : 0)}px)`;
}

/* ---------- collision ---------- */
function checkOb(o, dt){
  const hx0 = HORSE_X + 11, hx1 = HORSE_X + 21;   /* horse body span in tu (forgiving) */
  if (o.kind === 'carrot'){
    const cx = o.x + o.w / 2;
    if (cx > hx0 && cx < hx1 && Math.abs(G.y + 5 - o.fly) < 6 && !o.hit){
      o.hit = true; o.el.remove();
      G.carrots++; G.score += 25;
      $('carrots').textContent = '🥕 ' + G.carrots;
      SFX.crunch();
      const hp = horsePx();
      burst(hp.x + hp.w * .8, GROUND - (G.y + 8) * TU, '#f28c3b', 8);
      return true;
    }
    return false;
  }
  const overlap = o.x < hx1 && o.x + o.w > hx0;
  if (overlap && !o.hit && !o.cleared && G.invuln <= 0){
    if (G.y < o.h){          /* too low → fault */
      o.hit = true;
      fault(o);
      return false;
    }
  }
  if (!o.cleared && !o.hit && o.x + o.w < hx0){   /* fully passed, clean */
    o.cleared = true;
    const margin = G.yAtPass !== null ? G.yAtPass - o.h : 4;
    const jscore = judges(clamp(margin, 0, 12));
    const pts = OB_DEF[o.kind].pts + jscore;
    G.score += pts;
    G.streak++;
    if (o.kind === 'jackson') toast('JACKSON: UNBOTHERED · +' + pts);
    else if (o.kind === 'limo') toast('CLEARED THE LIMO?! +' + pts);
    else if (G.streak % 4 === 0) toast(CLEAR_LINES[Math.floor(Math.random() * CLEAR_LINES.length)] + ' · STREAK ' + G.streak);
    SFX.ding();
  }
  return false;
}
function fault(o){
  G.faults++; G.streak = 0; G.invuln = 1.6;
  $('hearts').textContent = '♥♥♥'.slice(0, 3 - G.faults) + '♡♡♡'.slice(0, G.faults);
  SFX.knock();
  const hp = horsePx();
  burst(hp.x + hp.w * .6, GROUND - 30, o.kind === 'water' ? '#5db8e8' : '#e8536b', 14);
  toast(o.kind === 'water' ? 'SPLOOSH. THE JUDGES SAW.'
      : o.kind === 'jackson' ? 'YOU DID NOT JUMP THE CAT?!'
      : 'RAIL DOWN. THE RAIL IS FINE. PRIDE ISN\'T.', 1500);
  if (G.faults >= 3) endGame();
}

/* ---------- rounds / difficulty ---------- */
function tickRound(dt){
  G.roundT += dt;
  if (G.roundT > 24 && G.round < 8){
    G.round++; G.roundT = 0;
    G.speed = 26 + (G.round - 1) * 4.5;
    const r = ROUNDS[Math.min(G.round, 4)];
    banner(r[0].replace(/\d+/, G.round), G.round <= 4 ? r[1] : 'THE COMMITTEE HAS LOST CONTROL');
    $('roundLbl').textContent = 'ROUND ' + G.round;
    SFX.fanfare();
  }
}

/* ---------- main loop ---------- */
let last = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if (!G.running) return;
  if (!last) last = ts;
  const dt = Math.min(.05, (ts - last) / 1000);
  last = ts;
  G.t += dt; G.frame += dt * 30;
  G.invuln = Math.max(0, G.invuln - dt);

  /* physics */
  if (!G.grounded){
    G.vy -= GRAV * dt;
    G.y += G.vy * dt;
    if (G.y <= 0){ G.y = 0; G.vy = 0; G.grounded = true; SFX.land(); }
  }

  /* track passing marker for judge margin */
  G.yAtPass = null;
  for (const o of G.obs){
    o.x -= G.speed * dt;
    const cx = o.x + o.w / 2;
    if (o.kind !== 'carrot' && Math.abs(cx - (HORSE_X + 15)) < G.speed * dt) G.yAtPass = G.y;
  }

  /* spawn + cull + draw */
  G.nextSpawn -= dt;
  if (G.nextSpawn <= 0) spawn();
  G.obs = G.obs.filter(o => {
    if (o.x < -30 || (o.hit && o.kind === 'carrot')){ o.el.remove(); return false; }
    checkOb(o, dt);
    drawOb(o);
    return true;
  });

  /* score ticks with distance */
  G.score += G.speed * dt * .5;
  $('score').textContent = Math.floor(G.score);
  tickRound(dt);

  horseEl.style.opacity = G.invuln > 0 ? (Math.sin(G.t * 30) > 0 ? .35 : 1) : 1;
  setHorse();
}
requestAnimationFrame(loop);

/* ---------- input ---------- */
function jump(){
  if (!G.running) return;
  if (G.grounded){
    G.grounded = false;
    G.vy = JUMP_V;
    SFX.jump();
    const hp = horsePx();
    burst(hp.x + hp.w * .3, GROUND - 8, '#c9b28a', 6);
  }
}
addEventListener('pointerdown', e => {
  if (e.target.closest('.ovl') || e.target.closest('button')) return;
  jump();
});
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); jump(); }
});

/* ---------- game over / ribbons ---------- */
const TIERS = [
  [3000, 'Grand Champion', '#5db8e8', 'THE CAT JUDGE BLINKED. THAT MEANS LOVE.'],
  [1800, 'Reserve Champion', '#e8536b', 'ONE JUDGE FAINTED. THE GOOD KIND OF FAINTED.'],
  [900,  'Clear-ish Round', '#f6c94a', 'THE HORSE WOULD LIKE TO THANK CARROTS.'],
  [0,    'Participant', '#7cb96b', 'STILL A VERY GOOD HORSE. ALWAYS WAS.'],
];
function rosette(col){
  return `<svg viewBox="0 0 100 130" width="100%">
    <path d="M38 74 l-12 44 l14 -11 l10 16 l10 -16 l14 11 l-12 -44 z" fill="${col}" stroke="#243044" stroke-width="3.5" stroke-linejoin="round"/>
    ${Array.from({ length: 12 }, (_, i) => `<ellipse cx="50" cy="14" rx="9" ry="16" fill="${col}" stroke="#243044" stroke-width="3" transform="rotate(${i * 30} 50 46)"/>`).join('')}
    <circle cx="50" cy="46" r="20" fill="#fff8ee" stroke="#243044" stroke-width="3.5"/>
    <text x="50" y="54" text-anchor="middle" font-family="Sora,sans-serif" font-size="22" font-weight="900" fill="#243044">L</text>
  </svg>`;
}
function loadStable(){
  try { return JSON.parse(localStorage.getItem('grandprix') || '{}'); } catch { return {}; }
}
function endGame(){
  G.running = false; G.over = true;
  Music.stop();
  SFX.womp();
  const score = Math.floor(G.score);
  const tier = TIERS.find(t => score >= t[0]);
  const st = loadStable();
  st.best = Math.max(st.best || 0, score);
  st.wall = st.wall || {};
  st.wall[tier[1]] = (st.wall[tier[1]] || 0) + 1;
  localStorage.setItem('grandprix', JSON.stringify(st));
  $('overTitle').textContent = tier[1];
  $('overKick').textContent = score >= (G.best || 0) && score > 0 ? '★ NEW STABLE RECORD ★' : 'THE JUDGES HAVE DELIBERATED';
  $('rosette').innerHTML = rosette(tier[2]);
  $('overStats').innerHTML = `SCORE ${score} · ROUND ${G.round} · 🥕 ${G.carrots}<br>BEST ${st.best}`;
  $('overJoke').textContent = tier[3];
  $('wall').innerHTML = Object.entries(st.wall).map(([k, v]) => `<span class="wallchip">${k} ×${v}</span>`).join('');
  G.best = st.best;
  $('over').classList.remove('hide');
}
function reset(){
  G.obs.forEach(o => o.el.remove());
  Object.assign(G, { running: true, over: false, t: 0, frame: 0, speed: 26, y: 0, vy: 0, grounded: true,
    score: 0, carrots: 0, faults: 0, round: 1, streak: 0, obs: [], nextSpawn: 1.3, roundT: 0, invuln: 0 });
  $('hearts').textContent = '♥♥♥';
  $('carrots').textContent = '🥕 0';
  $('roundLbl').textContent = 'ROUND 1';
  $('best').textContent = 'BEST ' + (G.best || 0);
  last = 0;
  Music.start();
  banner('AND THEY\'RE OFF!', 'TAP TO JUMP · THE CAT IS WATCHING', 1600);
}

/* ---------- audio ---------- */
let ACTX = null, AMASTER = null;
function audio(){
  if (ACTX) return ACTX;
  ACTX = new (window.AudioContext || window.webkitAudioContext)();
  AMASTER = ACTX.createGain(); AMASTER.gain.value = .16;
  const dc = ACTX.createDynamicsCompressor();
  AMASTER.connect(dc); dc.connect(ACTX.destination);
  return ACTX;
}
function tone(type, f0, f1, t, dur, vol){
  const ctx = audio();
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(AMASTER); o.start(t); o.stop(t + dur + .02);
}
function nz(t, dur, vol, hp){
  const ctx = audio();
  const len = Math.ceil(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(); src.buffer = buf;
  const flt = ctx.createBiquadFilter(); flt.type = 'highpass'; flt.frequency.value = hp;
  const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  src.connect(flt); flt.connect(g); g.connect(AMASTER); src.start(t);
}
const SFX = {
  jump(){ const t = audio().currentTime; tone('sine', 300, 640, t, .18, .3); },
  land(){ const t = audio().currentTime; nz(t, .06, .18, 300); },
  crunch(){ const t = audio().currentTime; nz(t, .05, .3, 2400); nz(t + .07, .05, .22, 2800); },
  ding(){ const t = audio().currentTime; tone('triangle', 880, null, t, .16, .22); tone('triangle', 1320, null, t + .07, .2, .16); },
  knock(){ const t = audio().currentTime; nz(t, .09, .4, 900); tone('square', 220, 120, t, .22, .25); },
  fanfare(){ const t = audio().currentTime; [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, null, t + i * .1, .22, .2)); },
  womp(){ const t = audio().currentTime; tone('sawtooth', 330, 190, t, .5, .2); tone('sawtooth', 165, 95, t + .05, .6, .18); },
};

/* music: 140 BPM gallop loop with clip-clop woodblocks */
const Music = (() => {
  let timer = null, step = 0, nextT = 0, enabled = true;
  const BPM = 140, SPB = 60 / BPM / 2;
  const N = (name) => {
    const m = /^([A-G]#?)(\d)$/.exec(name);
    const idx = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'].indexOf(m[1]);
    return 440 * Math.pow(2, (idx - 9) / 12 + (m[2] - 4));
  };
  const BASS = ['D2','','D2','D2','','D2','','A1','G1','','G1','G1','','G1','','A1'];
  const LEAD = [
    'D4','','F4','G4','A4','','A4','G4', 'F4','','D4','','C4','D4','F4','',
    'D4','','F4','G4','A4','','C5','A4', 'G4','','F4','G4','A4','','','',
  ];
  function schedule(i, t){
    const ctx = audio();
    const b = BASS[i % 16];
    if (b) tone('square', N(b), null, t, SPB * .85, .22);
    const l = LEAD[i % 32];
    if (l) tone('triangle', N(l), null, t, SPB * 1.6, .17);
    /* clip-clop: da-da-DUM gallop pattern on woodblock-ish hits */
    const g = i % 8;
    if (g === 0 || g === 3 || g === 5) tone('sine', g === 5 ? 520 : 760, 320, t, .05, .2);
    if (i % 8 === 4) nz(t, .08, .16, 1600);
    if (i % 2 === 0) nz(t, .025, .05, 7000);
  }
  function tick(){ const ctx = audio(); while (nextT < ctx.currentTime + .12){ schedule(step, nextT); step++; nextT += SPB; } }
  return {
    start(){ if (!enabled) return; const ctx = audio(); ctx.resume(); if (!timer){ nextT = ctx.currentTime + .05; timer = setInterval(tick, 25); } },
    stop(){ if (timer){ clearInterval(timer); timer = null; } },
  };
})();

/* ---------- boot ---------- */
const stable0 = loadStable();
G.best = stable0.best || 0;
$('best').textContent = 'BEST ' + G.best;
(function introAnim(){
  $('introHorse').innerHTML = HORSE(performance.now() / 33, { gait: 'trot' });
  if (!G.running) requestAnimationFrame(introAnim);
})();
$('startBtn').addEventListener('click', () => { $('intro').classList.add('hide'); reset(); });
$('againBtn').addEventListener('click', () => { $('over').classList.add('hide'); reset(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.running){ G.running = false; Music.stop(); $('roundLbl').textContent = 'PAUSED'; }
  else if (!document.hidden && !G.running && !G.over && G.t > 0
      && $('intro').classList.contains('hide') && $('over').classList.contains('hide')){
    G.running = true; last = 0; Music.start(); $('roundLbl').textContent = 'ROUND ' + G.round;
  }
});
setHorse();
window.GP = G;   /* test hook */
</script>
