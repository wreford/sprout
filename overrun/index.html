<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1c2e">
<title>Overrun</title>
<meta name="description" content="An auto-battler where the minions are everything that ever delayed a megaproject.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230e1c2e'/%3E%3Cpath d='M3 12 h10 M5 12 v-5 h6 v5 M8 7 v-3' stroke='%23e8c46a' stroke-width='1.4' fill='none'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{position:fixed;inset:0;overflow:hidden;background:#0e1c2e;
  touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;color:#dce8f2;
  font-family:-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px);
  background:
    linear-gradient(rgba(120,170,220,0.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,170,220,0.05) 1px,transparent 1px),
    linear-gradient(180deg,#10233a,#0b1826);
  background-size:24px 24px,24px 24px,100% 100%}
button{font:inherit;color:inherit;border:none;background:none}
.bar{display:flex;align-items:center;gap:6px;padding:4px 2px}
#roundLbl{font-weight:800;font-size:13px;color:#e8c46a}
#floatLbl{font-weight:800;font-size:13px;color:#8fe08a}
#goldLbl{font-weight:800;font-size:13px;color:#ffd95e;margin-left:auto}
#rivals{display:flex;gap:4px;padding:2px;overflow-x:auto;scrollbar-width:none}
#rivals::-webkit-scrollbar{display:none}
.rv{flex:0 0 auto;width:44px;text-align:center;font-size:9px;opacity:0.9;
  background:rgba(255,255,255,0.05);border-radius:8px;padding:3px 1px}
.rv b{display:block;font-size:13px}
.rv.dead{opacity:0.28;text-decoration:line-through}
.rv.next{outline:2px solid #e8c46a;background:rgba(232,196,106,0.12)}
.zone{position:relative;border:1.5px dashed rgba(150,190,230,0.25);border-radius:14px;
  margin:4px 0;padding:4px;display:flex;gap:4px;justify-content:center;align-items:stretch}
.zoneLbl{position:absolute;top:-8px;left:12px;font-size:9px;letter-spacing:0.12em;
  background:#0e1c2e;padding:0 6px;color:#7a9ac0;font-weight:700}
#shopRow{min-height:104px}
#boardRow{min-height:104px}
.card{width:64px;min-height:96px;border-radius:10px;position:relative;
  background:linear-gradient(180deg,#1b3350,#12253d);
  border:1.5px solid var(--tc,#4a6a8f);padding:16px 3px 16px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  transition:transform 0.12s}
.card:active{transform:scale(0.94)}
.card.gold{border-color:#ffd95e;box-shadow:0 0 12px rgba(255,217,94,0.35)}
.card.frozen{outline:2px solid #7ad8f0}
.card.sel{outline:2.5px solid #8fe08a;transform:translateY(-6px)}
.card .ico{font-size:24px;line-height:1;margin-top:2px;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5))}
.card .nm{font-size:8px;font-weight:700;text-align:center;line-height:1.15;margin-top:3px;
  color:#cfe0f0}
.card .kw{font-size:7px;color:#7a9ac0;text-align:center;margin-top:1px;line-height:1.2}
.card .cost{position:absolute;top:-7px;left:-7px;width:18px;height:18px;border-radius:50%;
  background:#ffd95e;color:#4a3608;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,0.4)}
.card .tier{position:absolute;top:-6px;right:-5px;width:15px;height:15px;border-radius:4px;
  transform:rotate(45deg);background:var(--tc,#4a6a8f);
  box-shadow:0 1px 4px rgba(0,0,0,0.4)}
.card .tier span{display:block;transform:rotate(-45deg);font-size:9px;font-weight:800;
  text-align:center;line-height:15px;color:#0e1c2e}
.card .atk,.card .hp{position:absolute;bottom:-7px;width:20px;height:20px;border-radius:50%;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.45);color:#fff}
.card .atk{left:-6px;background:#c9762e}
.card .hp{right:-6px;background:#c94a4a}
.slotEmpty{width:64px;min-height:96px;border-radius:10px;
  border:1.5px dashed rgba(150,190,230,0.18)}
#ctrl{display:flex;gap:6px;padding:4px 0}
.btn{flex:1;border-radius:12px;padding:10px 4px;font-size:12px;font-weight:800;
  background:#1b3350;border:1.5px solid #4a6a8f;text-align:center}
.btn:active{transform:scale(0.96)}
.btn.warn{background:#4a2a30;border-color:#c94a4a}
.btn.go{background:#274a2e;border-color:#8fe08a;color:#8fe08a}
.btn.off{opacity:0.4;pointer-events:none}
#log{font-size:10px;color:#7a9ac0;text-align:center;min-height:14px;padding:1px}
#unitSheet{position:fixed;left:0;right:0;bottom:0;background:#132a44;
  border-radius:18px 18px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);
  transform:translateY(110%);transition:transform 0.25s;z-index:40;
  border-top:2px solid #4a6a8f}
#unitSheet.open{transform:translateY(0)}
#unitSheet h3{font-size:15px;color:#e8c46a}
#unitSheet p{font-size:12px;color:#a8c0d8;margin:6px 0 10px}
#sheetBtns{display:flex;gap:8px}
#combat{position:fixed;inset:0;background:rgba(8,14,24,0.96);z-index:50;display:none;
  flex-direction:column;justify-content:center;gap:14px;
  padding:calc(env(safe-area-inset-top) + 10px) 8px calc(env(safe-area-inset-bottom) + 10px)}
#combat.on{display:flex}
#combat .cb{display:flex;gap:4px;justify-content:center;min-height:100px}
#cbTitle{text-align:center;font-size:13px;font-weight:800;color:#e8c46a}
#cbBanner{text-align:center;font-size:22px;font-weight:900;min-height:30px}
.dmgF{position:fixed;font-weight:900;font-size:18px;color:#ff6a5e;z-index:60;
  pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,0.7);
  animation:dmg 0.7s ease-out forwards}
@keyframes dmg{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-34px);opacity:0}}
.lunge{animation:lg 0.3s ease}
@keyframes lg{0%{transform:translate(0,0)}50%{transform:translate(var(--lx,0),var(--ly,-20px)) scale(1.12)}100%{transform:translate(0,0)}}
.dieAnim{animation:die 0.35s ease forwards}
@keyframes die{to{transform:scale(0.2) rotate(20deg);opacity:0}}
#overlay{position:fixed;inset:0;background:rgba(8,14,24,0.9);z-index:70;display:none;
  align-items:center;justify-content:center;padding:16px}
#overlay.on{display:flex}
#ovCard{background:#132a44;border:2px solid #e8c46a;border-radius:18px;
  padding:22px 18px;max-width:340px;width:100%;text-align:center;
  box-shadow:0 14px 50px rgba(0,0,0,0.6)}
#ovCard h2{color:#e8c46a;font-size:20px;margin-bottom:10px}
#ovCard p{font-size:12.5px;color:#a8c0d8;margin:5px 0}
.heroPick{display:flex;gap:8px;margin-top:12px}
.heroPick button{flex:1;background:#1b3350;border:1.5px solid #4a6a8f;border-radius:12px;
  padding:10px 6px;font-size:11px}
.heroPick button b{display:block;font-size:12px;color:#e8c46a;margin-bottom:4px}
.heroPick button:active{transform:scale(0.95)}
#ovGo{margin-top:14px;background:#274a2e;border:1.5px solid #8fe08a;color:#8fe08a;
  border-radius:999px;padding:11px 22px;font-weight:800;font-size:13px}
.tag{display:inline-block;font-size:8px;font-weight:800;padding:1px 5px;border-radius:999px;
  background:rgba(232,196,106,0.18);color:#e8c46a;margin-top:2px}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span id="roundLbl">R1</span>
    <span id="floatLbl">float 30</span>
    <span id="tierLbl" style="font-size:11px;color:#7ad8f0;font-weight:800"></span>
    <span id="goldLbl"></span>
  </div>
  <div id="rivals"></div>
  <div class="zone" id="shopRow"><span class="zoneLbl">THE MARKET</span></div>
  <div id="ctrl">
    <button class="btn" id="bReroll">🎲 reroll $1</button>
    <button class="btn" id="bFreeze">🧊 freeze</button>
    <button class="btn" id="bTier">⬆ phase $5</button>
  </div>
  <div class="zone" id="boardRow"><span class="zoneLbl">YOUR PROJECT</span></div>
  <div id="ctrl2" style="display:flex;gap:6px">
    <button class="btn go" id="bFight" style="flex:2">⚔ SUBMIT SCHEDULE</button>
  </div>
  <div id="log"></div>
</div>

<div id="unitSheet">
  <h3 id="shName"></h3>
  <p id="shDesc"></p>
  <div id="sheetBtns">
    <button class="btn" id="shLeft">◀ move</button>
    <button class="btn" id="shRight">move ▶</button>
    <button class="btn warn" id="shSell">sell $1</button>
    <button class="btn" id="shClose">close</button>
  </div>
</div>

<div id="combat">
  <div id="cbTitle"></div>
  <div class="cb" id="cbTheirs"></div>
  <div style="text-align:center;font-size:11px;color:#7a9ac0">— versus —</div>
  <div class="cb" id="cbOurs"></div>
  <div id="cbBanner"></div>
  <div style="text-align:center"><button class="btn" id="cbSkip" style="max-width:200px;margin:0 auto">fast forward ▸▸</button></div>
</div>

<div id="overlay"><div id="ovCard"></div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
const rnd=Math.random;
function pick(a){return a[(rnd()*a.length)|0];}
function sleep(ms){return new Promise(r=>setTimeout(r,ms/SPEED));}
let SPEED=1;

const TIERC=["","#8fa8c0","#7ad8f0","#b48ae8","#ffd95e"];
const UNITS=[
 {id:"rfi",n:"RFI",t:1,a:1,h:1,ico:"📄",kw:"Closeout: file 2 Follow-ups",tag:"paper",
  dr:(side,ix,ctx)=>{ctx.summon(side,ix,{id:"rfi2",n:"Follow-up RFI",t:1,a:1,h:1,ico:"📃"},2);}},
 {id:"punch",n:"Punch Item",t:1,a:2,h:1,ico:"🔨",kw:"Closeout: +2 atk to a friend",tag:"paper",
  dr:(side,ix,ctx)=>{const f=ctx.alive(side);if(f.length)f[(ctx.rng()*f.length)|0].a+=2;}},
 {id:"toolbox",n:"Toolbox Talk",t:1,a:1,h:3,ico:"🦺",kw:"Kickoff: adjacent +0/+2",tag:"field",
  bc:(board,ix)=>{[ix-1,ix+1].forEach(j=>{if(board[j])board[j].h+=2;});}},
 {id:"intern",n:"The Intern",t:1,a:2,h:2,ico:"🎓",kw:"+1/+1 whenever you buy",tag:"mgmt"},
 {id:"gravel",n:"Gravel Pile",t:1,a:2,h:4,ico:"🪨",kw:"",tag:"field"},
 {id:"safety",n:"Safety Meeting",t:1,a:0,h:4,ico:"🛑",kw:"Blocker",tag:"mgmt",taunt:1},
 {id:"creep",n:"Scope Creep",t:2,a:1,h:1,ico:"🐙",kw:"Every shop: +2/+2. Can't sell.",tag:"mgmt",nosell:1},
 {id:"weather",n:"Weather Window",t:2,a:2,h:7,ico:"🌧",kw:"Blocker. -0/-2 after each combat",tag:"field",taunt:1},
 {id:"vendor",n:"The Vendor",t:2,a:2,h:4,ico:"📦",kw:"Closeout: friends get +2 atk (fury)",tag:"paper",
  dr:(side,ix,ctx)=>{ctx.alive(side).forEach(u=>u.a+=2);}},
 {id:"consult",n:"Consultant",t:2,a:1,h:1,ico:"💼",kw:"+2/+2 for each other Consultant",tag:"mgmt"},
 {id:"pour",n:"Concrete Pour",t:2,a:3,h:5,ico:"🧱",kw:"Blocker",tag:"field",taunt:1},
 {id:"minutes",n:"Meeting Minutes",t:2,a:2,h:3,ico:"📝",kw:"Closeout: an Action Item appears",tag:"paper",
  dr:(side,ix,ctx)=>{ctx.summon(side,ix,{id:"action",n:"Action Item",t:1,a:2,h:2,ico:"☑️",
    dr:(s2,i2,c2)=>{c2.summon(s2,i2,{id:"unres",n:"Unresolved",t:1,a:1,h:1,ico:"❓"},1);}},1);}},
 {id:"change",n:"Change Order",t:3,a:4,h:3,ico:"✍️",kw:"Grows +2/+1 whenever it attacks",tag:"paper",onatk:(u)=>{u.a+=2;u.h+=1;}},
 {id:"auditor",n:"The Auditor",t:3,a:3,h:6,ico:"🔍",kw:"Kickoff: absorb the weakest friend",tag:"mgmt",
  bc:(board,ix)=>{let wi=-1,wv=1e9;
    board.forEach((u,j)=>{if(u&&j!==ix&&(u.a+u.h)<wv){wv=u.a+u.h;wi=j;}});
    if(wi>=0){board[ix].a+=board[wi].a;board[ix].h+=board[wi].h;board[wi]=null;}}},
 {id:"gantt",n:"Gantt Chart",t:3,a:2,h:9,ico:"📊",kw:"Blocker. Confidently wrong.",tag:"paper",taunt:1},
 {id:"night",n:"Night Shift",t:3,a:6,h:4,ico:"🌙",kw:"Always attacks first",tag:"field",first:1},
 {id:"crane",n:"The Crane",t:3,a:4,h:8,ico:"🏗",kw:"Blocker",tag:"field",taunt:1},
 {id:"steer",n:"Committee Member",t:3,a:3,h:4,ico:"🪑",kw:"Kickoff: +1 budget next round",tag:"mgmt",
  bc:()=>{P.bonusGold=Math.min(3,(P.bonusGold||0)+1);}},
 {id:"claim",n:"The Claim",t:4,a:7,h:5,ico:"⚖️",kw:"Closeout: hits a random enemy for 7",tag:"paper",
  dr:(side,ix,ctx)=>{const e=ctx.alive(1-side);if(e.length){const v=e[(ctx.rng()*e.length)|0];
    v.h-=7;ctx.checkDeath(1-side);}}},
 {id:"comteam",n:"Commissioning Team",t:4,a:5,h:8,ico:"✅",kw:"Kickoff: everyone +2/+2",tag:"field",
  bc:(board,ix)=>{board.forEach((u,j)=>{if(u&&j!==ix){u.a+=2;u.h+=2;}});}},
 {id:"force",n:"Force Majeure",t:4,a:6,h:6,ico:"🌪",kw:"Closeout: destroy its killer",tag:"field",
  dr:(side,ix,ctx)=>{if(ctx.lastAttacker&&ctx.lastAttacker.side===1-side){
    const u=ctx.lastAttacker.u;u.h=0;ctx.checkDeath(1-side);}}},
 {id:"mega",n:"The Megaproject",t:4,a:8,h:8,ico:"🏟",kw:"Every shop: +1/+1 per unit you own",tag:"mgmt"},
 {id:"p6",n:"P6 Server",t:4,a:3,h:11,ico:"🖥",kw:"Blocker. Closeout: friends +0/+3",tag:"paper",taunt:1,
  dr:(side,ix,ctx)=>{ctx.alive(side).forEach(u=>u.h+=3);}},
];
function proto(id){return UNITS.find(u=>u.id===id);}
function mk(u){return{id:u.id,n:u.n,t:u.t,a:u.a,h:u.h,ico:u.ico,kw:u.kw||"",
  tag:u.tag,taunt:u.taunt,first:u.first,nosell:u.nosell,gold:false};}

const HEROES=[
 {n:"The Superintendent",d:"Your Phase I units get +1/+1 when bought."},
 {n:"The Scheduler",d:"First reroll every round is free."},
 {n:"Claims Lawyer",d:"+1 budget after any combat where 2+ of your units died."},
 {n:"Consultant Partner",d:"Consultants arrive with +2/+2."},
 {n:"Bean Counter",d:"Budget cap raised to 12."},
 {n:"The Forecaster",d:"You always see exactly who you fight next."},
];

const RIVALS=[
 ["Big Dig Barb","field"],["Berlin Airport Bernd","paper"],["Olkiluoto Olli","field"],
 ["Crossrail Chris","mgmt"],["Site C Cindy","field"],["Stadium Stan","paper"],["Muskrat Marty","mgmt"],
];

let P={};
function newGame(hero){
  P={hero,round:1,gold:3,cap:hero.n==="Bean Counter"?12:10,float:30,tier:1,
    board:[null,null,null,null,null,null],shop:[],frozen:false,freeRe:false,
    owned:{},bonusGold:0,dead:false,place:8,rerolled:false};
  P.rivals=RIVALS.map(([n,arch],i)=>({n,arch,float:30,dead:false,board:[],power:0,seedBase:i*777}));
  rollShop();pickNext();render();
  log("Round 1. Sanction achieved. Good luck.");
}
function shopSize(){return Math.min(3+Math.floor(P.tier/1),6-1);}
function tierUpCost(){return Math.max(2,3+P.tier*2-(P.round-1));}
function rollShop(){
  const n=Math.min(3+P.tier,5);
  P.shop=[];
  for(let i=0;i<n;i++){
    const pool=UNITS.filter(u=>u.t<=P.tier);
    P.shop.push(mk(pick(pool)));
  }
}
function log(t){$("log").textContent=t;}

function applyBuyMods(u){
  if(P.hero.n==="The Superintendent"&&u.t===1){u.a+=1;u.h+=1;}
  if(P.hero.n==="Consultant Partner"&&u.id==="consult"){u.a+=2;u.h+=2;}
}
function tryTriple(id){
  const idxs=[];
  P.board.forEach((u,i)=>{if(u&&u.id===id&&!u.gold)idxs.push(i);});
  if(idxs.length>=3){
    const parts=idxs.slice(0,3).map(i=>P.board[i]);
    const base=proto(id);
    const gu=mk(base);gu.gold=true;
    gu.a=parts.reduce((s,u)=>s+u.a,0)-base.a;
    gu.h=parts.reduce((s,u)=>s+u.h,0)-base.h;
    gu.n="Golden "+gu.n;
    P.board[idxs[0]]=gu;
    P.board[idxs[1]]=null;P.board[idxs[2]]=null;
    P.gold=Math.min(P.cap,P.gold+2);
    log("LESSONS LEARNED — golden "+base.n+"! (+$2)");
  }
}
function buy(i){
  const u=P.shop[i];if(!u)return;
  if(P.gold<3){log("not enough budget");return;}
  const slot=P.board.indexOf(null);
  if(slot<0){log("project full — sell something");return;}
  P.gold-=3;
  const nu={...u};applyBuyMods(nu);
  P.board[slot]=nu;
  P.shop[i]=null;
  P.board.forEach(b=>{if(b&&b.id==="intern"){b.a+=1;b.h+=1;}});
  tryTriple(nu.id);
  render();
}
function sell(i){
  const u=P.board[i];if(!u)return;
  if(u.nosell){log("Scope Creep cannot be descoped. Obviously.");return;}
  P.gold=Math.min(P.cap,P.gold+1);
  P.board[i]=null;render();
}
function reroll(){
  const free=P.hero.n==="The Scheduler"&&!P.rerolled;
  if(!free&&P.gold<1){log("no budget");return;}
  if(!free)P.gold-=1;
  P.rerolled=true;P.frozen=false;
  rollShop();render();
}
function tierUp(){
  const c=tierUpCost();
  if(P.tier>=4){log("already commissioning");return;}
  if(P.gold<c){log("need $"+c);return;}
  P.gold-=c;P.tier++;
  log("PHASE "+["","I","II","III","IV"][P.tier]+" unlocked.");
  render();
}

function boardPower(b){return b.reduce((s,u)=>s+(u?u.a+u.h:0),0);}
function rivalBuild(r){
  const budget=3+P.round+(r.arch==="mgmt"?1:0);
  const maxT=P.round<3?1:P.round<5?2:P.round<7?3:4;
  let spend=budget;
  const rr=mulberry(r.seedBase+P.round*131);
  while(spend>=3){
    spend-=3;
    const pool=UNITS.filter(u=>u.t<=maxT&&(rr()<0.55?u.tag===r.arch:true));
    const u=mk(pool[(rr()*pool.length)|0]);
    u.a+=Math.floor(P.round/3);u.h+=Math.floor(P.round/3);
    if(r.board.length>=6){
      let wi=0,wv=1e9;
      r.board.forEach((x,j)=>{if(x.a+x.h<wv){wv=x.a+x.h;wi=j;}});
      if(u.a+u.h>wv)r.board[wi]=u;
    }else r.board.push(u);
  }
  r.board.forEach(u=>{if(u.id==="creep"){u.a+=2;u.h+=2;}});
  r.power=boardPower(r.board);
}
let nextFoe=null;
function pickNext(){
  const alive=P.rivals.filter(r=>!r.dead);
  nextFoe=alive.length?pick(alive):P.rivals[0];
}

function startOfShop(){
  P.round++;
  P.gold=Math.min(P.cap,3+P.round-1+(P.bonusGold||0));
  P.bonusGold=0;P.rerolled=false;
  P.board.forEach(u=>{
    if(!u)return;
    if(u.id==="creep"){u.a+=2;u.h+=2;}
    if(u.id==="mega"){const n=P.board.filter(x=>x).length-1;u.a+=n;u.h+=n;}
  });
  if(!P.frozen)rollShop();
  P.frozen=false;
  pickNext();
  render();
  log("Round "+P.round+". Budget replenished.");
}

function consultBuffed(b){
  const out=b.map(u=>u?{...u,side:undefined}:null);
  const nC=out.filter(u=>u&&u.id==="consult").length;
  out.forEach(u=>{if(u&&u.id==="consult"){u.a+=(nC-1)*2;u.h+=(nC-1)*2;}});
  return out;
}

function simCombat(myB,foeB,seed,animate){
  const rng=mulberry(seed);
  const sides=[consultBuffed(myB).filter(u=>u),consultBuffed(foeB).filter(u=>u)];
  sides.forEach((arr,si)=>arr.forEach(u=>{u.side=si;u.maxh=u.h;}));
  const events=[];
  const ctx={
    rng,lastAttacker:null,
    alive(s){return sides[s].filter(u=>u.h>0);},
    summon(s,ix,protoU,count){
      for(let c=0;c<count;c++){
        if(ctx.alive(s).length>=7)break;
        const nu=mk(protoU);nu.side=s;nu.maxh=nu.h;
        if(protoU.dr)nu.drFn=protoU.dr;
        sides[s].push(nu);
        events.push({t:"summon",s,u:{...nu}});
      }
    },
    checkDeath(s){
      sides[s].forEach(u=>{
        if(u.h<=0&&!u.deadDone){
          u.deadDone=true;
          events.push({t:"die",s,ico:u.ico,n:u.n});
          const p=proto(u.id);
          const drf=u.drFn||(p&&p.dr);
          if(drf)drf(s,0,ctx);
        }
      });
    },
  };
  let turn=sides[0].length>=sides[1].length?0:1;
  if(sides[0].length===sides[1].length)turn=rng()<0.5?0:1;
  const qi=[0,0];
  let swings=0;
  while(swings++<60){
    const A=ctx.alive(0),B=ctx.alive(1);
    if(!A.length||!B.length)break;
    const att=ctx.alive(turn);
    const firsts=att.filter(u=>u.first&&!u.hasAtk);
    let atk=firsts.length?firsts[0]:null;
    if(!atk){
      atk=att[qi[turn]%att.length];
      qi[turn]++;
    }else atk.hasAtk=true;
    const defs=ctx.alive(1-turn);
    const taunts=defs.filter(u=>u.taunt);
    const tgt=(taunts.length?taunts:defs)[(rng()*(taunts.length?taunts.length:defs.length))|0];
    ctx.lastAttacker={side:turn,u:atk};
    events.push({t:"atk",s:turn,ai:sides[turn].indexOf(atk),di:sides[1-turn].indexOf(tgt),
      an:atk.n,dn:tgt.n,ad:atk.a,dd:tgt.a});
    tgt.h-=atk.a;atk.h-=tgt.a;
    const p=proto(atk.id);
    if(p&&p.onatk&&atk.h>0)p.onatk(atk);
    ctx.checkDeath(0);ctx.checkDeath(1);
    turn=1-turn;
  }
  const mine=ctx.alive(0),theirs=ctx.alive(1);
  let result="tie",dmg=0;
  if(mine.length&&!theirs.length){result="win";
    dmg=P.tier+mine.reduce((s,u)=>s+u.t,0);}
  else if(theirs.length&&!mine.length){result="loss";
    dmg=(nextFoe?Math.min(4,1+Math.floor(P.round/3)):2)+theirs.reduce((s,u)=>s+u.t,0);}
  const myDeaths=sides[0].filter(u=>u.deadDone).length;
  return{result,dmg,events,myDeaths,
    finalMine:sides[0],finalTheirs:sides[1]};
}

function cardEl(u,small){
  const d=document.createElement("div");
  d.className="card"+(u.gold?" gold":"");
  d.style.setProperty("--tc",TIERC[u.t]);
  d.innerHTML=`<div class="cost">3</div>
    <div class="tier"><span>${u.t}</span></div>
    <div class="ico">${u.ico}</div>
    <div class="nm">${u.n}</div>
    <div class="kw">${u.kw||""}</div>
    <div class="atk">${u.a}</div><div class="hp">${u.h}</div>`;
  if(small)d.style.transform="scale(0.82)";
  return d;
}

let selBoard=-1;
function render(){
  $("roundLbl").textContent="R"+P.round;
  $("floatLbl").textContent="float "+P.float;
  $("tierLbl").textContent="PHASE "+["","I","II","III","IV"][P.tier];
  $("goldLbl").textContent="$"+P.gold+"/"+P.cap;
  const rv=$("rivals");rv.innerHTML="";
  P.rivals.forEach(r=>{
    const d=document.createElement("div");
    d.className="rv"+(r.dead?" dead":"")+((nextFoe===r&&(P.hero.n==="The Forecaster"))?" next":"");
    d.innerHTML=`<b>${r.n.split(" ")[0][0]}${(r.n.split(" ")[1]||" ")[0]||""}</b>${r.dead?"✕":r.float}`;
    d.title=r.n;
    rv.appendChild(d);
  });
  const sh=$("shopRow");
  sh.innerHTML='<span class="zoneLbl">THE MARKET'+(P.frozen?" · FROZEN":"")+'</span>';
  P.shop.forEach((u,i)=>{
    if(!u){const e=document.createElement("div");e.className="slotEmpty";sh.appendChild(e);return;}
    const el=cardEl(u);
    if(P.frozen)el.classList.add("frozen");
    el.onclick=()=>buy(i);
    sh.appendChild(el);
  });
  const bd=$("boardRow");
  bd.innerHTML='<span class="zoneLbl">YOUR PROJECT</span>';
  P.board.forEach((u,i)=>{
    if(!u){const e=document.createElement("div");e.className="slotEmpty";bd.appendChild(e);
      e.onclick=()=>{selBoard=-1;$("unitSheet").classList.remove("open");};return;}
    const el=cardEl(u);
    el.querySelector(".cost").remove();
    if(i===selBoard)el.classList.add("sel");
    el.onclick=()=>{selBoard=i;openSheet(u);renderBoardSel();};
    bd.appendChild(el);
  });
  $("bReroll").textContent="🎲 reroll "+((P.hero.n==="The Scheduler"&&!P.rerolled)?"free":"$1");
  $("bTier").textContent=P.tier>=4?"⬆ maxed":"⬆ phase $"+tierUpCost();
  $("bTier").classList.toggle("off",P.tier>=4);
}
function renderBoardSel(){
  [...$("boardRow").querySelectorAll(".card")].forEach((el,j)=>{
    el.classList.toggle("sel",false);
  });
  render();
}
function openSheet(u){
  $("shName").textContent=(u.gold?"⭐ ":"")+u.n+"  ("+u.a+"/"+u.h+")";
  $("shDesc").textContent=(u.kw||"A perfectly ordinary line item.")+
    "  · Phase "+u.t+" · "+(u.tag||"");
  $("unitSheet").classList.add("open");
}
$("shClose").onclick=()=>{selBoard=-1;$("unitSheet").classList.remove("open");render();};
$("shSell").onclick=()=>{if(selBoard>=0)sell(selBoard);selBoard=-1;$("unitSheet").classList.remove("open");};
$("shLeft").onclick=()=>{
  if(selBoard>0){const t=P.board[selBoard-1];P.board[selBoard-1]=P.board[selBoard];P.board[selBoard]=t;
    selBoard--;openSheet(P.board[selBoard]);render();}};
$("shRight").onclick=()=>{
  if(selBoard>=0&&selBoard<5){const t=P.board[selBoard+1];P.board[selBoard+1]=P.board[selBoard];P.board[selBoard]=t;
    selBoard++;openSheet(P.board[selBoard]);render();}};
$("bReroll").onclick=reroll;
$("bFreeze").onclick=()=>{P.frozen=!P.frozen;render();};
$("bTier").onclick=tierUp;

async function fight(){
  if(P.dead)return;
  $("unitSheet").classList.remove("open");selBoard=-1;
  P.rivals.filter(r=>!r.dead).forEach(rivalBuild);
  const foe=nextFoe;
  const seed=(P.round*7919+13)|0;
  const res=simCombat(P.board,foe.board.map(u=>({...u})),seed,true);
  $("combat").classList.add("on");
  $("cbTitle").textContent="ROUND "+P.round+" — vs "+foe.n+" ("+foe.arch+")";
  $("cbBanner").textContent="";
  SPEED=1;
  const mineStart=consultBuffed(P.board).filter(u=>u);
  const theirStart=consultBuffed(foe.board).filter(u=>u);
  const ourEls=[],theirEls=[];
  const co=$("cbOurs"),ct=$("cbTheirs");
  co.innerHTML="";ct.innerHTML="";
  mineStart.forEach(u=>{const e=cardEl(u,true);e.querySelector(".cost").remove();co.appendChild(e);ourEls.push(e);});
  theirStart.forEach(u=>{const e=cardEl(u,true);e.querySelector(".cost").remove();ct.appendChild(e);theirEls.push(e);});
  await sleep(600);
  for(const ev of res.events){
    if(ev.t==="atk"){
      const els=ev.s===0?ourEls:theirEls;
      const del=ev.s===0?theirEls:ourEls;
      const ae=els[ev.ai],de=del[ev.di];
      if(ae&&de){
        ae.style.setProperty("--ly",ev.s===0?"-30px":"30px");
        ae.classList.remove("lunge");void ae.offsetWidth;ae.classList.add("lunge");
        await sleep(240);
        [[de,ev.ad],[ae,ev.dd]].forEach(([el,dm])=>{
          if(!el||!dm)return;
          const r=el.getBoundingClientRect();
          const f=document.createElement("div");
          f.className="dmgF";f.textContent="-"+dm;
          f.style.left=(r.left+r.width/2-8)+"px";f.style.top=(r.top+4)+"px";
          document.body.appendChild(f);
          setTimeout(()=>f.remove(),750);
          const hpEl=el.querySelector(".hp");
          hpEl.textContent=Math.max(0,parseInt(hpEl.textContent)-dm);
        });
        await sleep(260);
      }
    }else if(ev.t==="die"){
      const els=ev.s===0?ourEls:theirEls;
      const el=els.find(e=>e&&!e.dataset.dead&&e.querySelector(".ico").textContent===ev.ico&&parseInt(e.querySelector(".hp").textContent)<=0);
      if(el){el.dataset.dead=1;el.classList.add("dieAnim");await sleep(200);}
    }else if(ev.t==="summon"){
      const cont=ev.s===0?co:ct;
      const arr=ev.s===0?ourEls:theirEls;
      const e=cardEl(ev.u,true);e.querySelector(".cost").remove();
      cont.appendChild(e);arr.push(e);
      await sleep(150);
    }
  }
  await sleep(400);
  let bannerTxt,bannerCol;
  if(res.result==="win"){
    foe.float-=res.dmg;
    bannerTxt="SCHEDULE HELD — "+foe.n.split(" ")[0]+" slips "+res.dmg;
    bannerCol="#8fe08a";
  }else if(res.result==="loss"){
    P.float-=res.dmg;
    bannerTxt="OVERRUN — you slip "+res.dmg+" float";
    bannerCol="#ff6a5e";
  }else{bannerTxt="STALEMATE — lawyers exchange letters";bannerCol="#ffd95e";}
  $("cbBanner").textContent=bannerTxt;
  $("cbBanner").style.color=bannerCol;
  if(P.hero.n==="Claims Lawyer"&&res.myDeaths>=2)P.bonusGold=(P.bonusGold||0)+1;
  simulateOthers(foe,res.result);
  await sleep(1400);
  $("combat").classList.remove("on");
  P.board.forEach(u=>{if(u&&u.id==="weather"){u.h-=2;}});
  P.board=P.board.map(u=>u&&u.h>0?u:null);
  checkElims();
  if(P.float<=0){P.dead=true;endGame();return;}
  const alive=P.rivals.filter(r=>!r.dead);
  if(!alive.length){endGame(true);return;}
  startOfShop();
}
function simulateOthers(foughtFoe,myResult){
  const others=P.rivals.filter(r=>!r.dead&&r!==foughtFoe);
  for(let i=0;i+1<others.length;i+=2){
    const a=others[i],b=others[i+1];
    const pa=a.power*(0.85+rnd()*0.3),pb=b.power*(0.85+rnd()*0.3);
    const loser=pa>pb?b:a;
    loser.float-=2+Math.floor(P.round/2);
  }
}
function checkElims(){
  P.rivals.forEach(r=>{
    if(!r.dead&&r.float<=0){r.dead=true;
      log(r.n+"'s project has been CANCELLED.");}
  });
}
function endGame(won){
  const aliveRivals=P.rivals.filter(r=>!r.dead).length;
  const place=won?1:aliveRivals+1;
  let best=99;
  try{best=parseInt(localStorage.getItem("ov-best")||"99",10)||99;}catch(e){}
  if(place<best){best=place;try{localStorage.setItem("ov-best",""+place);}catch(e){}}
  const ov=$("overlay"),c=$("ovCard");
  ov.classList.add("on");
  c.innerHTML=`<h2>${won?"🏆 PROJECT DELIVERED":"PROJECT CANCELLED"}</h2>
    <p>${won?"On time. Nobody believes you.":"The steering committee sends their regards."}</p>
    <p>You placed <b style="color:#e8c46a">#${place}</b> of 8 · round ${P.round}</p>
    <p style="opacity:0.7">best placement: #${Math.min(best,place)}</p>
    <button id="ovGo">BID ON ANOTHER MEGAPROJECT</button>`;
  $("ovGo").onclick=()=>{ov.classList.remove("on");showHeroPick();};
}
$("bFight").onclick=fight;
$("cbSkip").onclick=()=>{SPEED=5;};

function showHeroPick(){
  const ov=$("overlay"),c=$("ovCard");
  ov.classList.add("on");
  const picks=[...HEROES].sort(()=>rnd()-0.5).slice(0,3);
  c.innerHTML=`<h2>OVERRUN</h2>
    <p>Seven rival megaprojects. One schedule survives.</p>
    <p>Buy constraints. Build a board. The RFIs multiply on their own.</p>
    <p style="margin-top:10px;color:#e8c46a;font-weight:800;font-size:12px">CHOOSE YOUR PROJECT DIRECTOR</p>
    <div class="heroPick" id="hp"></div>`;
  const hp=c.querySelector("#hp");
  picks.forEach(h=>{
    const b=document.createElement("button");
    b.innerHTML=`<b>${h.n}</b>${h.d}`;
    b.onclick=()=>{ov.classList.remove("on");newGame(h);};
    hp.appendChild(b);
  });
}
showHeroPick();

window.OV={
  get P(){return P},get shop(){return P.shop},get board(){return P.board},
  get nextFoe(){return nextFoe},
  buy,sell,reroll,tierUp,
  pickHero(i){const ov=$("overlay");ov.classList.remove("on");newGame(HEROES[i%HEROES.length]);},
  async quickFight(){SPEED=50;await fight();SPEED=1;},
  simCombat,
};
</script>
