<style>

<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$("cv"), ctx=cv.getContext("2d");
const W=416, H=528, S=2, CELL=26, BY=44;
cv.width=W*S; cv.height=H*S; ctx.scale(S,S);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let P={wins:0,games:0,snd:true,mus:"calm",board:"classic",
  rules:{quick:false,spicy:false,gentle:false}};
try{ const s=JSON.parse(localStorage.getItem("sm1k")||"null"); if(s) P=Object.assign(P,s); }catch(e){}
if(!P.rules) P.rules={quick:false,spicy:false,gentle:false};
const saveP=()=>{ try{ localStorage.setItem("sm1k",JSON.stringify(P)); }catch(e){} };

let AC=null, noiseBuf=null;
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&!noiseBuf){
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  return AC;
}
function bp(f,d,when,vol,type){
  if(!P.snd) return;
  if(!ac()) return;
  try{
    const t=AC.currentTime+(when||0);
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||"square"; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol||.07,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
const sCard=()=>{ bp(500,.05,0,.06,"triangle"); bp(750,.07,.05,.05,"triangle"); };
const sHop=()=>bp(340,.04,0,.04,"triangle");
const sBump=()=>{ bp(200,.1,0,.09); bp(140,.14,.08,.09); };
const sSlide=()=>{ for(let i=0;i<5;i++) bp(400+i*80,.04,i*.04,.04,"triangle"); };
const sHome=()=>{ [523,659,784].forEach((f,i)=>bp(f,.12,i*.08,.07,"triangle")); };
const sMorey=()=>{ [740,620,880,740,1100].forEach((f,i)=>bp(f,.08,i*.06,.08)); };
const sWin=()=>{ [523,659,784,1047,784,1047,1319].forEach((f,i)=>bp(f,.15,i*.1,.08,"triangle")); };
const sNo=()=>bp(160,.18,0,.07);
const buzz=p=>{ if(navigator.vibrate) navigator.vibrate(p); };

let musNext=0, musStep=0, crackNext=0;
const CALM_CHORDS=[[196,247,294,392],[175,220,262,349],[147,196,247,294],[165,208,262,330]];
const CALM_PLUCK=[392,0,440,0,0,523,0,440,392,0,0,330,0,392,0,0,587,0,523,0,0,440,0,0,392,0,330,0,0,294,0,0];
const HYPE_BASS=[98,98,0,98,131,98,0,110,98,98,0,98,147,131,0,110];
const HYPE_ARP=[523,659,784,1047,784,659,523,659,494,587,740,988,740,587,494,587];
function padTone(f,t0,dur,vol){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type="sine"; o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+dur*.35);
  g.gain.linearRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur);
}
function crack(t0){
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  s.playbackRate.value=.6+Math.random()*1.4;
  const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1400+Math.random()*1800; f.Q.value=2.5;
  const g=AC.createGain();
  g.gain.setValueAtTime(.045+Math.random()*.04,t0);
  g.gain.exponentialRampToValueAtTime(.001,t0+.06+Math.random()*.08);
  s.connect(f); f.connect(g); g.connect(AC.destination);
  s.start(t0); s.stop(t0+.2);
}
function hat(t0,vol,dur){
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const f=AC.createBiquadFilter(); f.type="highpass"; f.frequency.value=6000;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  s.connect(f); f.connect(g); g.connect(AC.destination);
  s.start(t0); s.stop(t0+dur+.05);
}
function musicTick(){
  if(P.mus==="off"||!AC) return;
  try{
    if(P.mus==="calm"){
      const spb=60/64;
      while(musNext<AC.currentTime+0.4){
        const bar=Math.floor(musStep/4)%4;
        if(musStep%4===0) CALM_CHORDS[bar].forEach((f,vi)=>padTone(f,musNext,spb*4.2,vi===3?.014:.026));
        const pl=CALM_PLUCK[musStep%32];
        if(pl){ const o=AC.createOscillator(),g=AC.createGain();
          o.type="triangle"; o.frequency.value=pl;
          g.gain.setValueAtTime(.04,musNext); g.gain.exponentialRampToValueAtTime(.001,musNext+spb*.9);
          o.connect(g); g.connect(AC.destination); o.start(musNext); o.stop(musNext+spb); }
        musNext+=spb/2; musStep++;
      }
      while(crackNext<AC.currentTime+0.5){ crack(crackNext); crackNext+=.12+Math.random()*.4; }
    } else {
      const spb=60/140/4;
      while(musNext<AC.currentTime+0.25){
        const st=musStep%16;
        if(st%4===0){ const o=AC.createOscillator(),g=AC.createGain();
          o.type="sine"; o.frequency.setValueAtTime(150,musNext);
          o.frequency.exponentialRampToValueAtTime(42,musNext+.1);
          g.gain.setValueAtTime(.22,musNext); g.gain.exponentialRampToValueAtTime(.001,musNext+.13);
          o.connect(g); g.connect(AC.destination); o.start(musNext); o.stop(musNext+.15); }
        if(st%2===1) hat(musNext,.03,.03);
        const b=HYPE_BASS[st];
        if(b){ const o=AC.createOscillator(),g=AC.createGain();
          o.type="square"; o.frequency.value=b;
          g.gain.setValueAtTime(.05,musNext); g.gain.exponentialRampToValueAtTime(.001,musNext+spb*1.6);
          o.connect(g); g.connect(AC.destination); o.start(musNext); o.stop(musNext+spb*1.7); }
        const a=HYPE_ARP[st];
        { const o=AC.createOscillator(),g=AC.createGain();
          o.type="sawtooth"; o.frequency.value=a;
          g.gain.setValueAtTime(.028,musNext); g.gain.exponentialRampToValueAtTime(.001,musNext+spb*1.4);
          o.connect(g); g.connect(AC.destination); o.start(musNext); o.stop(musNext+spb*1.5); }
        musNext+=spb; musStep++;
      }
    }
  }catch(e){}
}

const FONT={"0":[7,5,5,5,7],"1":[2,6,2,2,7],"2":[7,1,7,4,7],"3":[7,1,7,1,7],"4":[5,5,7,1,1],
"5":[7,4,7,1,7],"6":[7,4,7,5,7],"7":[7,1,2,2,2],"8":[7,5,7,5,7],"9":[7,5,7,1,7],
A:[2,5,7,5,5],B:[6,5,6,5,6],C:[7,4,4,4,7],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],
G:[7,4,5,5,7],H:[5,5,7,5,5],I:[7,2,2,2,7],J:[1,1,1,5,7],K:[5,5,6,5,5],L:[4,4,4,4,7],
M:[5,7,7,5,5],N:[5,7,5,5,5],O:[7,5,5,5,7],P:[7,5,7,4,4],Q:[7,5,5,7,1],R:[6,5,6,5,5],
S:[7,4,7,1,7],T:[7,2,2,2,2],U:[5,5,5,5,7],V:[5,5,5,5,2],W:[5,5,7,7,5],X:[5,5,2,5,5],
Y:[5,5,2,2,2],Z:[7,1,2,4,7]," ":[0,0,0,0,0],".":[0,0,0,0,2],"!":[2,2,2,0,2],
"-":[0,0,7,0,0],"'":[2,2,0,0,0],"/":[1,1,2,4,4],":":[0,2,0,2,0]};
function txt(x,y,s,col,sc){
  sc=sc||2; ctx.fillStyle=col;
  const r=sc*.62;
  for(let i=0;i<s.length;i++){
    const g=FONT[s[i].toUpperCase()]||FONT[" "];
    for(let row=0;row<5;row++) for(let c=0;c<3;c++)
      if(g[row]>>(2-c)&1){
        ctx.beginPath();
        ctx.arc(x+i*4*sc+c*sc+sc/2,y+row*sc+sc/2,r,0,7);
        ctx.fill();
      }
  }
}
const tw=(s,sc)=>s.length*4*(sc||2);

function mulberry(seed){
  let a=seed>>>0;
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

const HOME=65, SAFE0=60;
const PL=[
{n:"MALLOW",c:"#ffffff",d:"#b8b8d8",human:true},
{n:"CHOCO",c:"#c98a4a",d:"#7a4e22",human:false},
{n:"GRAHAM",c:"#ffb52e",d:"#a87400",human:false},
{n:"EMBER",c:"#ff6a4e",d:"#a83828",human:false}];
const SAFEDIR=[[1,0],[0,1],[-1,0],[0,-1]];
const POOLS=[[[3,3],[4,3],[3,4],[4,4]],[[11,3],[12,3],[11,4],[12,4]],
  [[12,12],[11,12],[12,11],[11,11]],[[4,12],[3,12],[4,11],[3,11]]];
const BOARDS=[
{id:"classic",n:"CLASSIC CAMP",desc:"TWO RIVER SLIDES A SIDE",slides:[[2,3],[8,4]]},
{id:"white",n:"WHITEWATER",desc:"THREE SLIDES. CHAOS RIVER",slides:[[1,4],[6,3],[11,3]]},
{id:"still",n:"STILLWATER",desc:"NO SLIDES. PURE STRATEGY",slides:[]},
];
const RULEDEF=[
{k:"quick",n:"QUICK CAMP",desc:"START WITH A MALLOW OUT"},
{k:"spicy",n:"SPICY DECK",desc:"DOUBLE S'MOREY CARDS"},
{k:"gentle",n:"GENTLE MODE",desc:"FOURS GO FORWARD"},
];
let SLIDES=[];
function buildSlides(){
  SLIDES=[];
  const bd=BOARDS.find(b=>b.id===P.board)||BOARDS[0];
  for(let i=0;i<4;i++) bd.slides.forEach(([off,len])=>
    SLIDES.push({abs:(i*15+off)%60,len,owner:i}));
}
buildSlides();
function deckDef(){
  return [[1,5],[2,4],[3,4],[4,4],[5,4],[7,4],[8,4],[10,4],[11,4],[12,4],["S",P.rules.spicy?8:4]];
}

const absOf=(i,rel)=>(i*15+rel)%60;
function cellOfAbs(a){
  const s=Math.floor(a/15), t=a%15;
  if(s===0) return [t,0];
  if(s===1) return [15,t];
  if(s===2) return [15-t,15];
  return [0,15-t];
}
function cellOfPos(i,pos,pawnIdx){
  if(pos<0) return POOLS[i][pawnIdx];
  if(pos<=59) return cellOfAbs(absOf(i,pos));
  const br=cellOfAbs(absOf(i,59)), d=SAFEDIR[i];
  if(pos<HOME) return [br[0]+d[0]*(pos-59),br[1]+d[1]*(pos-59)];
  return [br[0]+d[0]*6,br[1]+d[1]*6];
}
const px=c=>[c[0]*CELL+CELL/2, BY+c[1]*CELL+CELL/2];

let rng=mulberry(Date.now()>>>0);
let mode="attract", turn=0, deck=[], discard=[], card=null, forced=null;
let phase="draw", legal=[], selPawn=-1, splitLeft=0, splitExclude=-1;
let cpuT=0, animQ=[], flashMsg="", flashT=0, msg="", winner=-1, T=0, passT=0, cardAnim=0;
const players=[];
const WU=17, F=520, DIST=400, PITCH=1.05, HZN=244;
let camU=0;
const camYaw=()=>0.10*Math.sin(T*0.13)+camU;
const worldOf=c=>[(c[0]-7.5)*WU,(7.5-c[1])*WU];
function proj(x,y,z){
  const yw=camYaw(), cyw=Math.cos(yw), syw=Math.sin(yw);
  const X=x*cyw-z*syw, Z=x*syw+z*cyw;
  const cp=Math.cos(PITCH), sp=Math.sin(PITCH);
  const Y2=y*cp+Z*sp;
  const Z2=Z*cp-y*sp+DIST;
  const sc=F/Z2;
  return [208+X*sc, HZN-Y2*sc, Z2, sc];
}
const parts=[], flies=[];
for(let i=0;i<9;i++) flies.push({x:Math.random()*220-110,z:Math.random()*220-110,y:8+Math.random()*22,a:Math.random()*7,ph:Math.random()*7});
function puff(wx,wz,n,cols,spread,up){
  for(let k=0;k<n;k++){
    const a=Math.random()*7, sp=(spread||36)*(0.3+Math.random()*.7)*.6;
    parts.push({x:wx,y:4,z:wz,vx:Math.cos(a)*sp,vz:Math.sin(a)*sp,vy:(up||24)*(.5+Math.random()*.8),
      life:.5+Math.random()*.6,age:0,c:cols[k%cols.length],r:1.5+Math.random()*2.5,g:-90});
  }
}
function ember(wx,wz){
  parts.push({x:wx+(Math.random()*6-3),y:6,z:wz+(Math.random()*6-3),
    vx:Math.random()*6-3,vz:Math.random()*6-3,vy:16+Math.random()*14,
    life:.9+Math.random()*.9,age:0,c:Math.random()<.5?"#ffb52e":"#ff7a3a",r:1+Math.random()*1.4,g:10});
}
function visKey(i,j){ return i*4+j; }
const vis=new Array(16).fill(null);
function visOf(i,j){
  const c=cellOfPos(i,players[i].pawns[j].pos,j), [tx,tz]=worldOf(c);
  let v=vis[visKey(i,j)];
  if(!v){ v={x:tx,z:tz}; vis[visKey(i,j)]=v; }
  return v;
}
function freshPlayers(){
  players.length=0;
  for(let i=0;i<4;i++) players.push({pawns:[{pos:-1},{pos:-1},{pos:-1},{pos:-1}]});
  if(P.rules.quick) for(let i=0;i<4;i++) players[i].pawns[0].pos=0;
  vis.fill(null);
}
freshPlayers();
function buildDeck(){
  deck=[]; discard=[];
  deckDef().forEach(([v,n])=>{ for(let k=0;k<n;k++) deck.push(v); });
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
}
function drawCard(){
  if(deck.length===0){ deck=discard; discard=[];
    for(let i=deck.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; } }
  const c=forced!==null?forced:deck.pop();
  if(forced!==null) forced=null; else discard.push(c);
  cardAnim=0.28;
  return c;
}
function showFlash(t){ flashMsg=t; flashT=1.6; }

function ownAt(i,pos){
  return players[i].pawns.some(p=>{
    if(pos<=59&&p.pos>=0&&p.pos<=59) return absOf(i,p.pos)===absOf(i,pos);
    return p.pos===pos&&pos<HOME&&pos>=SAFE0;
  });
}
function destOf(i,pos,steps){
  if(pos<0) return null;
  if(pos>=HOME) return null;
  let d=pos+steps;
  if(steps<0){ if(d<0){ if(pos>59) return null; d+=60; } }
  if(d>HOME) return null;
  if(d<0) return null;
  return d;
}
function movesFor(i,c){
  const out=[];
  const ps=players[i].pawns;
  const addMove=(pj,steps)=>{
    const d=destOf(i,ps[pj].pos,steps);
    if(d===null) return;
    if(d<HOME&&ownAt(i,d)&&!(d<=59&&absOf(i,d)===absOf(i,ps[pj].pos))) return;
    out.push({t:"move",pj,steps,dest:d});
  };
  const addStart=pj=>{
    if(ps[pj].pos!==-1) return;
    if(players[i].pawns.some(p=>p.pos===0)) return;
    out.push({t:"start",pj,dest:0});
  };
  if(c===1||c===2){ const pj=ps.findIndex(p=>p.pos===-1); if(pj>=0) addStart(pj);
    ps.forEach((p,pj)=>addMove(pj,c)); }
  else if(c===4){ ps.forEach((p,pj)=>addMove(pj,P.rules.gentle?4:-4)); }
  else if(c===10){ ps.forEach((p,pj)=>{ addMove(pj,10); addMove(pj,-1); }); }
  else if(c===11){
    ps.forEach((p,pj)=>{
      addMove(pj,11);
      if(p.pos>=0&&p.pos<=59){
        for(let oi=0;oi<4;oi++){ if(oi===i) continue;
          players[oi].pawns.forEach((op,oj)=>{
            if(op.pos>=0&&op.pos<=59) out.push({t:"swap",pj,oi,oj,dest:-2});
          });
        }
      }
    });
  }
  else if(c==="S"){
    const pj=ps.findIndex(p=>p.pos===-1);
    if(pj>=0){
      for(let oi=0;oi<4;oi++){ if(oi===i) continue;
        players[oi].pawns.forEach((op,oj)=>{
          if(op.pos>=0&&op.pos<=59) out.push({t:"smorey",pj,oi,oj,dest:-2});
        });
      }
    }
  }
  else if(c===7){
    for(let k=1;k<=7;k++){
      ps.forEach((p,pj)=>{
        const d=destOf(i,p.pos,k);
        if(d===null) return;
        if(d<HOME&&ownAt(i,d)) return;
        if(k===7){ out.push({t:"move",pj,steps:7,dest:d}); return; }
        const rem=7-k;
        const canRest=ps.some((q,qj)=>{
          if(qj===pj) return false;
          const dd=destOf(i,q.pos,rem);
          if(dd===null) return false;
          if(dd<HOME&&ownAt(i,dd)&&dd!==d) return false;
          return true;
        });
        if(canRest) out.push({t:"move",pj,steps:k,dest:d,split:true});
      });
    }
  }
  else { ps.forEach((p,pj)=>addMove(pj,c)); }
  const seen={};
  return out.filter(m=>{
    const k=m.t+m.pj+"_"+(m.steps||0)+"_"+(m.oi!==undefined?m.oi+"."+m.oj:"");
    if(seen[k]) return false; seen[k]=1; return true;
  });
}
function progress(i,pj){ const p=players[i].pawns[pj].pos; return p<0?0:p>=HOME?70:p+5; }
function bumpPawn(pi,pj){
  const c=cellOfPos(pi,players[pi].pawns[pj].pos,pj), [bx,bz]=worldOf(c);
  puff(bx,bz,14,["#ff7a3a","#ffb52e","#3a2a1a"],46,34);
  players[pi].pawns[pj].pos=-1;
  sBump(); buzz(30);
}
function pawnAtAbs2(a,exI,exJ){
  for(let i=0;i<4;i++) for(let j=0;j<4;j++){
    if(i===exI&&j===exJ) continue;
    const p=players[i].pawns[j];
    if(p.pos>=0&&p.pos<=59&&absOf(i,p.pos)===a) return {pi:i,pj:j};
  }
  return null;
}
function applyLanding(i,pj){
  const p=players[i].pawns[pj];
  if(p.pos<0||p.pos>59) return;
  let a=absOf(i,p.pos);
  const hit2=pawnAtAbs2(a,i,pj);
  if(hit2){ bumpPawn(hit2.pi,hit2.pj); showFlash("TOASTED! BACK TO THE TENT"); }
  const sl=SLIDES.find(s=>s.abs===a&&s.owner!==i);
  if(sl){

function execMove(i,m){

    ps[m.pj].pos=(a-i*15+60)%60;

    const mine=ps[m.pj], theirs=players[m.oi].pawns[m.oj];

    mine.pos=(thAbs-i*15+60)%60;
    theirs.pos=(myAbs-m.oi*15+60)%60;

function movesForSplit(i,rem,exclude){

    out.push({t:"move",pj,steps:rem,dest:d});

}

function humanPlay(mi){

function cpuScore(i,m){
  let s=0;
  if(m.t==="smorey") s=100+progress(m.oi,m.oj);
  else if(m.t==="swap") s=(progress(m.oi,m.oj)-progress(i,m.pj))*1.2;
  else if(m.t==="start") s=45;
  else {
    if(m.dest===HOME) s=95;
    else if(m.dest>=SAFE0) s=70+(m.dest-SAFE0);
    else s=10+(m.dest-players[i].pawns[m.pj].pos)*1.5;
    if(m.dest<=59){
      const a=absOf(i,m.dest);
      const v=pawnAtAbs2(a,i,m.pj);
      if(v&&v.pi!==i) s+=75;
      const sl=SLIDES.find(x=>x.abs===a&&x.owner!==i);
      if(sl) s+=sl.len*3;
    }
  }
  return s;
}
function cpuTurn(){
  card=drawCard(); sCard();
  legal=movesFor(turn,card);
  if(legal.length===0){ phase="pass"; passT=1.0; msg=PL[turn].n+" HAS NO MOVE"; return; }
  let best=0,bs=-1e9;
  legal.forEach((m,k)=>{ const s=cpuScore(turn,m); if(s>bs){ bs=s; best=k; } });
  const m=legal[best], c=card;
  execMove(turn,m);
  if(mode==="over") return;
  if(m.split){
    const rest=movesForSplit(turn,7-m.steps,m.pj);
    if(rest.length){
      let b2=0,s2=-1e9;
      rest.forEach((r,k)=>{ const s=cpuScore(turn,r); if(s>s2){ s2=s; b2=k; } });
      execMove(turn,rest[b2]);
      if(mode==="over") return;
    }
  }
  endTurn(c===2);
}

        const gp=proj(gwx,6,gwz);
        add(gp[2]-5,()=>{
          glow(gp[0],gp[1],15*gp[3],"rgba(255,216,74,A)",.3+.16*Math.sin(T*6));
          ctx.strokeStyle="rgba(255,216,74,"+(.6+.4*Math.sin(T*6))+")"; ctx.lineWidth=2.4;
          ctx.beginPath(); ctx.ellipse(gp[0],gp[1],9*gp[3],9*gp[3]*.5,0,0,7); ctx.stroke();
        });
      }
    });
    if(PL[turn].human) movable.forEach(pj=>{
      const v=visOf(turn,pj);
      const rp=proj(v.x,1,v.z);
      add(rp[2]-6,()=>{
        ctx.strokeStyle=selPawn===pj?"#6ee0ff":"#ffffff"; ctx.lineWidth=2.4;
        ctx.beginPath();
        ctx.ellipse(rp[0],rp[1],(11+Math.sin(T*6)*1.5)*rp[3],(11+Math.sin(T*6)*1.5)*rp[3]*.5,0,0,7);
        ctx.stroke();
        glow(rp[0],rp[1],16*rp[3],selPawn===pj?"rgba(110,224,255,A)":"rgba(255,255,255,A)",.2);
      });
    });
  }
  for(let i=0;i<4;i++) players[i].pawns.forEach((p,j)=>{
    if(p.pos===HOME) return;
    const c2=cellOfPos(i,p.pos,j), [twx,twz]=worldOf(c2);
    const v=visOf(i,j);
    const ddx=twx-v.x, ddz=twz-v.z, dist=Math.hypot(ddx,ddz);
    const k=1-Math.exp(-dt*9);
    v.x+=ddx*k; v.z+=ddz*k;
    const lift=dist>2?Math.abs(Math.sin(T*13))*Math.min(11,dist*.28):0;
    const pg=proj(v.x,1,v.z), pb2=proj(v.x,7+lift,v.z);
    add(pg[2]-8,()=>{
      ctx.fillStyle="rgba(0,0,0,.3)";
      ctx.beginPath();
      ctx.ellipse(pg[0],pg[1],7*pg[3]*(1-lift*.02),3.4*pg[3],0,0,7); ctx.fill();
      drawPawnHD(i,pb2[0],pb2[1],7*pb2[3],0,true);
      if(i===0&&p.pos>=0){
        ctx.fillStyle="rgba(200,138,58,"+(p.pos/64*.45)+")";
        ctx.beginPath(); ctx.arc(pb2[0],pb2[1],7*pb2[3],0,7); ctx.fill();
      }
    });
  });
  parts.forEach(q=>{
    const pp=proj(q.x,q.y,q.z);
    const a=1-q.age/q.life;
    add(pp[2]-6,()=>{
      ctx.fillStyle=q.c; ctx.globalAlpha=a;
      ctx.beginPath(); ctx.arc(pp[0],pp[1],q.r*pp[3]*(0.5+a*0.5),0,7); ctx.fill();
      ctx.globalAlpha=1;
    });
  });
  flies.forEach(f=>{
    const pulse=.4+.6*Math.abs(Math.sin(T*2.2+f.ph));
    const fp2=proj(f.x,f.y,f.z);
    add(fp2[2]-6,()=>{
      glow(fp2[0],fp2[1],6*fp2[3],"rgba(190,255,130,A)",.35*pulse);
      ctx.fillStyle="rgba(220,255,160,"+(.9*pulse)+")";
      ctx.beginPath(); ctx.arc(fp2[0],fp2[1],1.3*fp2[3],0,7); ctx.fill();
    });
  });
  D.sort((u,w)=>w.d-u.d);
  D.forEach(x=>x.fn());
  { const lp=proj(0,0,-24);
    txt(lp[0]-tw("SUPER CAMP",1)/2,lp[1]+30,"SUPER CAMP","rgba(140,180,120,.55)",1); }

  for(let i=0;i<4;i++){
    const hn=players[i].pawns.filter(p=>p.pos===HOME).length;
    const active=turn===i&&mode==="play";
    const x0=6+i*102;
    rr(x0,5,98,32,10,active?"rgba(60,84,140,.85)":"rgba(16,20,44,.8)");
    if(active){ ctx.strokeStyle="#ffd84a"; ctx.lineWidth=2;
      rr(x0,5,98,32,10,null); ctx.stroke(); }
    drawPawnHD(i,x0+15,22,7,0);
    txt(x0+28,10,PL[i].n.slice(0,6),active?"#ffd84a":"#9aa8c8",1);
    txt(x0+28,19,hn+"/4",active?"#ffffff":"#7a88a8",2);
  }
  ctx.fillStyle="#0b1024"; ctx.fillRect(0,BY+416,W,H-BY-416);
  ctx.fillStyle="rgba(110,224,255,.18)"; ctx.fillRect(0,BY+416,W,2);
  setupHits.length=0;
  function panelButton(label){
    const pl=.5+.5*Math.sin(T*5);
    glow(W/2,BY+449,90,"rgba(255,110,60,A)",.12+.08*pl);
    const g=ctx.createLinearGradient(0,BY+424,0,BY+474);
    g.addColorStop(0,"#e05a3a"); g.addColorStop(1,"#b03a24");
    rr(60,BY+424,W-120,50,16,null); ctx.fillStyle=g; ctx.fill();
    rr(64,BY+427,W-128,16,10,"rgba(255,255,255,.16)");
    ctx.strokeStyle="rgba(255,216,74,"+(0.35+0.45*pl)+")"; ctx.lineWidth=2.6;
    rr(60,BY+424,W-120,50,16,null); ctx.stroke();
    drawFireHD(86,BY+450,T,.75);
    txt(W/2-tw(label,3)/2+10,BY+441,label,"#ffffff",3);
  }
  if(mode==="attract"){
    rr(24,BY+40,W-48,340,20,"rgba(8,12,30,.86)");
    glow(W/2,BY+90,120,"rgba(255,216,74,A)",.1);
    txt(W/2-tw("S'MOREY 4",5)/2,BY+64,"S'MOREY 4","#ffd84a",5);
    txt(W/2-tw("1000 BITS. NOW IN 3D.",3)/2,BY+100,"1000 BITS. NOW IN 3D.","#6ee0ff",3);
    txt(W/2-tw("THE BOARD GAINED A DIMENSION",1)/2,BY+128,"THE BOARD GAINED A DIMENSION","#ff7ab0",1);
    txt(W/2-tw("DRAG THE CAMP TO LOOK AROUND",1)/2,BY+156,"DRAG THE CAMP TO LOOK AROUND","#c8d8b8",1);
    txt(W/2-tw("NO ENGINE. NO LIBRARIES. JUST MATH.",1)/2,BY+170,"NO ENGINE. NO LIBRARIES. JUST MATH.","#c8d8b8",1);
    txt(W/2-tw("SAME CAMP. NEW AXIS.",1)/2,BY+184,"SAME CAMP. NEW AXIS.","#c8d8b8",1);
    if(Math.floor(T*2)%2===0) txt(W/2-tw("TAP TO SET UP CAMP")/2,BY+218,"TAP TO SET UP CAMP","#ffffff");
    txt(W/2-tw("WINS "+P.wins+"/"+P.games)/2,BY+256,"WINS "+P.wins+"/"+P.games,"#ffd84a");
    txt(W/2-tw("NO SIXES. NO NINES. CAMP RULES.",1)/2,BY+300,"NO SIXES. NO NINES. CAMP RULES.","#ff7ab0",1);
    txt(W/2-tw("1000 BITS. 3 DIMENSIONS. 0 CHILL.",1)/2,BY+320,"1000 BITS. 3 DIMENSIONS. 0 CHILL.","#5a6888",1);
  }
  if(mode==="setup"){
    rr(14,BY+18,W-28,392,20,"rgba(8,12,30,.92)");
    txt(W/2-tw("SET UP CAMP",3)/2,BY+34,"SET UP CAMP","#ffd84a",3);
    txt(24,BY+66,"BOARD","#6ee0ff");
    BOARDS.forEach((b,k)=>{
      const y=BY+82+k*40, on=P.board===b.id;
      rr(24,y,W-48,34,10,on?"rgba(60,110,160,.6)":"rgba(26,36,64,.8)");
      if(on){ ctx.strokeStyle="#6ee0ff"; ctx.lineWidth=2; rr(24,y,W-48,34,10,null); ctx.stroke(); }
      txt(34,y+6,b.n,on?"#ffffff":"#9aa8c8");
      txt(34,y+21,b.desc,"#7a88a8",1);
      setupHits.push({x:24,y,w:W-48,h:34,act:()=>{ P.board=b.id; saveP(); buildSlides(); }});
    });
    txt(24,BY+210,"HOUSE RULES","#6ee0ff");
    RULEDEF.forEach((r,k)=>{
      const y=BY+226+k*40, on=P.rules[r.k];
      rr(24,y,W-48,34,10,on?"rgba(70,120,60,.55)":"rgba(26,36,64,.8)");
      if(on){ ctx.strokeStyle="#8ee08a"; ctx.lineWidth=2; rr(24,y,W-48,34,10,null); ctx.stroke(); }
      txt(34,y+6,r.n+(on?"  ON":"  OFF"),on?"#ffffff":"#9aa8c8");
      txt(34,y+21,r.desc,"#7a88a8",1);
      setupHits.push({x:24,y,w:W-48,h:34,act:()=>{ P.rules[r.k]=!P.rules[r.k]; saveP(); }});
    });
  }
  if(mode==="over"){
    rr(30,BY+90,W-60,200,20,"rgba(8,12,30,.9)");
    const wn=PL[winner].n;
    txt(W/2-tw(wn+" WINS CAMP",3)/2,BY+112,wn+" WINS CAMP",PL[winner].c,3);
    txt(W/2-tw(winner===0?"S'MORES FOR EVERYONE. MOSTLY YOU.":"THE "+wn+" DYNASTY BEGINS",1)/2,BY+150,
      winner===0?"S'MORES FOR EVERYONE. MOSTLY YOU.":"THE "+wn+" DYNASTY BEGINS","#c8d8b8",1);
    txt(W/2-tw("WINS "+P.wins+"/"+P.games)/2,BY+178,"WINS "+P.wins+"/"+P.games,"#ffd84a");
    if(Math.floor(T*2)%2===0) txt(W/2-tw("TAP FOR SETUP")/2,BY+230,"TAP FOR SETUP","#ffffff");
  }
  if(mode==="play"){
    if(phase==="draw"&&PL[turn].human){
      panelButton("DRAW A CARD");
    } else if(card!==null){
      const ca=cardAnim>0?1-cardAnim/0.28:1;
      ctx.save(); ctx.translate(37,BY+444); ctx.scale(ca,1); ctx.translate(-37,-(BY+444));
      rr(10,BY+422,54,44,10,"#f8f0d8");
      ctx.strokeStyle="#c9482e"; ctx.lineWidth=2;
      rr(13,BY+425,48,38,8,null); ctx.stroke();
      txt(card==="S"?25:(String(card).length>1?19:29),BY+430,String(card),"#c9482e",card==="S"?2:3);
      ctx.restore();
      const ct=splitLeft>0?"SPLIT! "+splitLeft+" LEFT":(CARDTXT[card]||"");
      txt(74,BY+428,ct,"#eef0ff");
      txt(74,BY+448,PL[turn].human?(phase==="choose"?"TAP A GLOWING MALLOW":""):PL[turn].n+" IS THINKING","#8a98b8",1);
    } else {
      txt(12,BY+432,PL[turn].n+"'S TURN","#eef0ff");
    }
    const bd=BOARDS.find(b=>b.id===P.board);
    if(msg) txt(12,BY+498,msg,"#ff7ab0",1);
    else txt(12,BY+498,bd.n+(P.rules.quick?" +QUICK":"")+(P.rules.spicy?" +SPICY":"")+(P.rules.gentle?" +GENTLE":""),"#5a6888",1);
    txt(W-tw("DECK "+deck.length,1)-10,BY+498,"DECK "+deck.length,"#7a88a8",1);
  }
  else if(mode==="setup") panelButton("START CAMP");
  else panelButton("SET UP CAMP");
  if(flashT>0){
    const a=clamp(flashT/0.3,0,1)*clamp((1.6-flashT)/0.25,0,1);
    const fw=tw(flashMsg)+24;
    ctx.globalAlpha=a;
    rr(W/2-fw/2,BY+364,fw,26,10,"rgba(8,14,26,.92)");
    ctx.strokeStyle="rgba(255,216,74,.5)"; ctx.lineWidth=1.6;
    rr(W/2-fw/2,BY+364,fw,26,10,null); ctx.stroke();
    txt(W/2-tw(flashMsg)/2,BY+372,flashMsg,"#ffd84a");
    ctx.globalAlpha=1;
  }
}

let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0); last=ts;
  update(dt); musicTick(); render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

let ptr={down:false,sx:0,sy:0,dragged:false,cam0:0};
function toLocal(e){
  const rc=cv.getBoundingClientRect();
  return [(e.clientX-rc.left)*W/rc.width,(e.clientY-rc.top)*H/rc.height];
}
function pickBoard(x,y){
  if(!PL[turn].human||phase!=="choose") return;
  let best=null, bd2=26;
  legal.forEach((m,k)=>{
    const pc=cellOfPos(turn,players[turn].pawns[m.pj].pos,m.pj);
    const [pwx,pwz]=worldOf(pc);
    const pp=proj(pwx,7,pwz);
    const d=Math.hypot(pp[0]-x,pp[1]-y);
    if(d<bd2){ bd2=d; best={type:"pawn",pj:m.pj}; }
  });
  legal.forEach((m,k)=>{
    if(selPawn!==-1&&m.pj!==selPawn) return;
    let c2;
    if(m.t==="swap"||m.t==="smorey") c2=cellOfAbs(absOf(m.oi,players[m.oi].pawns[m.oj].pos));
    else c2=cellOfPos(turn,m.dest,m.pj);
    const [dwx,dwz]=worldOf(c2);
    const dp=proj(dwx,6,dwz);
    const d=Math.hypot(dp[0]-x,dp[1]-y);
    if(d<bd2){ bd2=d; best={type:"dest",k}; }
  });
  if(!best) return;
  if(best.type==="pawn"&&selPawn!==best.pj){ selPawn=best.pj; sHop(); return; }
  if(best.type==="dest"){ sHop(); humanPlay(best.k); }
}
cv.addEventListener("pointerdown",e=>{
  ac();
  const [x,y]=toLocal(e);
  ptr={down:true,sx:x,sy:y,dragged:false,cam0:camU};
  if(y>BY+416){
    ptr.down=false;
    if(mode==="attract"||mode==="over"){ sHop(); openSetup(); return; }
    if(mode==="setup"){ sHop(); startGame(); return; }
    if(mode==="play"&&phase==="draw"&&PL[turn].human){ humanDraw(); return; }
    return;
  }
  if(mode==="setup"){
    ptr.down=false;
    const h=setupHits.find(h=>x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h);
    if(h){ sHop(); h.act(); }
    return;
  }
  if(mode==="attract"||mode==="over"){ ptr.down=false; openSetup(); return; }
});
cv.addEventListener("pointermove",e=>{
  if(!ptr.down) return;
  const [x,y]=toLocal(e);
  if(Math.abs(x-ptr.sx)>10) ptr.dragged=true;
  if(ptr.dragged) camU=clamp(ptr.cam0+(x-ptr.sx)*0.0045,-0.55,0.55);
});
cv.addEventListener("pointerup",e=>{
  if(!ptr.down) return;
  ptr.down=false;
  const [x,y]=toLocal(e);
  if(!ptr.dragged) pickBoard(x,y);
});
addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){
    ac();
    if(mode==="attract"||mode==="over") openSetup();
    else if(mode==="setup") startGame();
    else humanDraw();
  }
});
function musLabel(){ $("oMus").textContent="MUSIC "+P.mus.toUpperCase(); $("oMus").classList.toggle("on",P.mus!=="off"); }
$("oMus").onclick=()=>{
  P.mus=P.mus==="calm"?"hype":P.mus==="hype"?"off":"calm";
  saveP(); musLabel(); ac();
  musNext=AC?AC.currentTime:0; musStep=0; crackNext=musNext;
};
musLabel();
$("oSnd").onclick=()=>{ P.snd=!P.snd; saveP(); $("oSnd").classList.toggle("on",P.snd); };
$("oSnd").classList.toggle("on",P.snd);

window.SM1K={
  start:startGame, setup:openSetup, draw:humanDraw, play:humanPlay,
  seed(n){ rng=mulberry(n>>>0); },
  setCard(v){ forced=v; },
  setPawn(pi,pj,pos){ players[pi].pawns[pj].pos=pos; },
  setBoard(id){ P.board=id; saveP(); buildSlides(); },
  setRule(k,v){ P.rules[k]=v; saveP(); },
  cycleMusic(){ $("oMus").click(); },
  ff(sec){ let t=0; while(t<sec){ update(1/60); t+=1/60; } },
  moves(){ return legal.map(m=>Object.assign({},m)); },
  state(){ return { mode, turn, phase, card, deck:deck.length, winner,
    splitLeft, wins:P.wins, games:P.games, board:P.board, mus:P.mus,
    rules:Object.assign({},P.rules), slides:SLIDES.length, parts:parts.length,
    pawns: players.map(pl=>pl.pawns.map(p=>p.pos)) }; },
  BOARDS, RULEDEF, get SLIDES(){ return SLIDES; }, PL, get P(){ return P; },
};
</script>
