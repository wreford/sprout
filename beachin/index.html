<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10243e">
<meta name="description" content="Holiday Monday: Beachin'!! — the official operational briefing. Port Elgin or bust.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2310243e'/%3E%3Ccircle cx='22' cy='9' r='5' fill='%23f6c94a'/%3E%3Cpath d='M0 22 q8-6 16-1 t16-1 v12 H0z' fill='%234fc3f7'/%3E%3Cpath d='M6 20 l3-8 3 8z' fill='%23ff6b6b'/%3E%3C/svg%3E">
<title>Holiday Monday: Beachin'!!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#10243e; --paper:#f7f4ec; --ink:#12233a;
  --sun:#f6c94a; --sea:#4fc3f7; --coral:#ff6b6b; --palm:#57b06b; --sand:#eed9a4; --grape:#b26bff;
  --disp:'Sora',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--navy);color:var(--paper);font-family:var(--disp);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#comp{
  position:relative;overflow:hidden;background:var(--paper);color:var(--ink);flex-shrink:0;
  width:min(100vw, calc((100vh - 92px) * 16 / 9));aspect-ratio:16/9;
  border-radius:14px;box-shadow:0 40px 90px -30px rgba(0,0,0,.8)
}

@media (orientation: portrait){
  #comp{
    width:min(calc(100vh - 150px), calc(100vw * 16 / 9));
    transform:rotate(90deg)
  }
}
.el{position:absolute;will-change:transform,opacity}
.kick{font-family:var(--mono);font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.stamp{
  font-family:var(--mono);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  border:3px solid currentColor;border-radius:8px;padding:.35em .7em;background:var(--paper)
}
#bar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);
  display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(0deg,rgba(9,18,32,.92),transparent)
}
#scrub{position:relative;height:22px;cursor:pointer}
#scrub .track{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:rgba(247,244,236,.2)}
#scrub .fill{position:absolute;left:0;top:9px;height:4px;border-radius:4px;background:var(--sun);width:0}
#scrub .mark{position:absolute;top:7px;width:2px;height:8px;background:rgba(247,244,236,.5)}
#scrub .knob{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:var(--sun);box-shadow:0 2px 8px rgba(0,0,0,.5);margin-left:-8px}
#bar .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#bar .btns{display:flex;gap:8px}
#bar button{
  min-width:44px;height:40px;padding:0 16px;border-radius:100px;cursor:pointer;
  background:rgba(247,244,236,.1);border:1.5px solid rgba(247,244,236,.25);color:var(--paper);
  font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase
}
#bar button:hover{border-color:var(--sun);color:var(--sun)}
#bar button.play{background:var(--sun);color:var(--navy);border-color:transparent;min-width:84px}
#bar .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:rgba(247,244,236,.6);font-weight:700;text-transform:uppercase;text-align:right}
#tapstart{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:rgba(9,18,32,.85);backdrop-filter:blur(8px);cursor:pointer;text-align:center;padding:24px
}
#tapstart.hide{display:none}
#tapstart .k{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--sun);font-weight:800;text-transform:uppercase}
#tapstart h1{font-size:clamp(30px,7vw,54px);font-weight:900;letter-spacing:-.02em;line-height:1;text-transform:uppercase;color:var(--paper)}
#tapstart h1 .y{color:var(--sun)} #tapstart h1 .b{color:var(--sea)}
#tapstart .big{
  padding:18px 36px;border-radius:14px;background:var(--sun);color:var(--navy);border:none;cursor:pointer;
  font-family:var(--disp);font-weight:900;font-size:16px;letter-spacing:.05em;text-transform:uppercase;min-height:58px;
  box-shadow:0 18px 40px -10px rgba(246,201,74,.5)
}
#tapstart .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:rgba(247,244,236,.55);font-weight:700;text-transform:uppercase;line-height:2}
</style>
</head>
<body>
<div id="stage"><div id="comp"></div></div>

<div id="bar">
  <div id="scrub"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
  <div class="row">
    <div class="btns">
      <button id="bPrev">Prev</button>
      <button id="bPlay" class="play">Pause</button>
      <button id="bNext">Next</button>
      <button id="bMusic">Music: On</button>
      <button id="bFull" title="fullscreen">⛶ Full</button>
    </div>
    <div class="lbl" id="sceneLbl"></div>
  </div>
</div>

<div id="tapstart">
  <span class="k">An operational briefing · attendance legally binding</span>
  <h1>Holiday Monday:<br><span class="b">Beach</span><span class="y">in'!!</span></h1>
  <button class="big">Convene</button>
  <span class="sub">Primary mission: Port Elgin · 9 side quests · 1 memorial<br>works sideways AND upright · space pauses · arrows skip</span>
</div>

<script>
'use strict';

const FPS = 30;
const comp = document.getElementById('comp');

function sizeComp(){ comp.style.fontSize = (comp.clientWidth / 92) + 'px'; }
addEventListener('resize', () => { sizeComp(); render(); });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function interp(f, [f0, f1], [v0, v1], ease){
  const t = clamp((f - f0) / (f1 - f0), 0, 1);
  return v0 + (v1 - v0) * (ease ? ease(t) : t);
}
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
function spring(f, delay = 0, stiffness = .55){
  const t = clamp((f - delay) / (FPS * .9), 0, 1);
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  return 1 - Math.pow(1 - t, 2) * Math.cos(t * Math.PI * 2.2 * stiffness);
}
const pop = (f, d) => `scale(${spring(f, d)})`;
const slamY = (f, d, from = -300) => `translateY(${interp(spring(f, d), [0, 1], [from, 0])}px)`;
const slamX = (f, d, from = -600) => `translateX(${interp(spring(f, d), [0, 1], [from, 0])}px)`;
const fade = (f, a, b) => clamp(interp(f, [a, b], [0, 1]), 0, 1);
function el(html, style){ return `<div class="el" style="${style}">${html}</div>`; }
const S = (obj) => Object.entries(obj).map(([k, v]) => `${k}:${v}`).join(';');

const GULL = (c = '#12233a') => `<svg viewBox="0 0 60 30" width="100%"><path d="M2 18 Q14 4 30 16 Q46 4 58 18" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/></svg>`;
const CUP = `<svg viewBox="0 0 100 130" width="100%">
  <path d="M18 30 h64 l-9 92 a8 8 0 0 1-8 7 h-30 a8 8 0 0 1-8-7 z" fill="#fff" stroke="#12233a" stroke-width="5"/>
  <rect x="10" y="16" width="80" height="16" rx="6" fill="#12233a"/>
  <circle cx="50" cy="76" r="20" fill="#0a5c3c"/>
  <circle cx="50" cy="76" r="13" fill="none" stroke="#fff" stroke-width="3.5"/>
  <path d="M43 70 q7 12 14 0 q-7 16 -14 0" fill="#fff"/>
</svg>`;
function JACKSON(f){
  const blink = Math.sin(f / 13) < -.9 ? .1 : 1;
  const tail = Math.sin(f / 9) * 10;
  return `<svg viewBox="0 0 120 130" width="100%">
    <path d="M60 128 q-34 0-34-30 q0-22 16-30 l-6-26 14 12 q10-4 20 0 l14-12 -6 26 q16 8 16 30 q0 30-34 30" fill="#1c1c22" stroke="#0c0c10" stroke-width="3"/>
    <ellipse cx="47" cy="82" rx="6" ry="${7 * blink}" fill="#f6c94a"/>
    <ellipse cx="73" cy="82" rx="6" ry="${7 * blink}" fill="#f6c94a"/>
    <ellipse cx="47" cy="82" rx="2.4" ry="${5 * blink}" fill="#0c0c10"/>
    <ellipse cx="73" cy="82" rx="2.4" ry="${5 * blink}" fill="#0c0c10"/>
    <path d="M54 96 q6 5 12 0" stroke="#0c0c10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M30 92 l-16-4 M30 98 l-16 2 M90 92 l16-4 M90 98 l16 2" stroke="#3a3a44" stroke-width="2"/>
    <path d="M92 120 q ${18 + tail} -6 ${14 + tail * .6} -34" stroke="#1c1c22" stroke-width="11" fill="none" stroke-linecap="round"/>
  </svg>`;
}

function MINIHORSE(f){
  const bob = Math.abs(Math.sin(f / 9)) * 2;
  const blink = Math.sin(f / 13) < -.92;
  return `<svg viewBox="0 0 300 200" width="100%">
    <ellipse cx="150" cy="190" rx="82" ry="8" fill="rgba(18,35,58,.12)"/>
    <g transform="translate(0 ${-bob})">
      <path d="M74 92 q-26 16 -20 52 q0 -30 16 -38" fill="#5b3c25"/>
      <path d="M104 118 l-3 56 M126 120 l0 54 M186 116 l2 58 M206 114 l4 56" stroke="#8c5c39" stroke-width="13" stroke-linecap="round"/>
      <path d="M72 104 C64 78 104 68 150 70 C182 71 204 78 214 96 C222 110 218 128 200 134 C160 143 108 143 84 134 C70 129 68 116 72 104 Z" fill="#b57c50" stroke="#3a2e26" stroke-width="5" stroke-linejoin="round"/>
      <path d="M182 96 C188 66 206 50 232 52 L250 62 C230 70 210 86 202 110 C196 118 182 116 178 106 Z" fill="#b57c50" stroke="#3a2e26" stroke-width="5" stroke-linejoin="round"/>
      <path d="M228 50 C246 42 262 48 266 62 C269 74 264 88 251 94 L236 96 C226 88 222 64 228 50 Z" fill="#b57c50" stroke="#3a2e26" stroke-width="5" stroke-linejoin="round"/>
      <path d="M232 34 l3 -16 l11 12 z M246 34 l11 -13 l4 15 z" fill="#8c5c39" stroke="#3a2e26" stroke-width="4" stroke-linejoin="round"/>
      <ellipse cx="258" cy="82" rx="10" ry="9" fill="#cf9a6d" stroke="#3a2e26" stroke-width="3.5"/>
      <ellipse cx="242" cy="60" rx="5" ry="${blink ? .9 : 5.4}" fill="#1c1712"/>
      <path d="M236 44 q-30 4 -44 26" stroke="#5b3c25" stroke-width="9" fill="none" stroke-linecap="round"/>
    </g>
  </svg>`;
}
const CONF = Array.from({ length: 60 }, (_, i) => ({
  x: (i * 137.5) % 100, delay: (i * 7) % 40,
  hue: ['#f6c94a', '#4fc3f7', '#ff6b6b', '#57b06b', '#b26bff'][i % 5],
}));

function head(f, kick, kc, title, big = 4){
  return el(`<div class="kick" style="font-size:1.35em;color:${kc}">${kick}</div>`,
      S({ left: '7%', top: '9%', transform: slamX(f, 0) }))
  + el(`<div style="font-weight:900;font-size:${big}em;text-transform:uppercase;letter-spacing:-.02em;line-height:.97">${title}</div>`,
      S({ left: '7%', top: '15%', transform: slamY(f, 8, 300) }));
}
function copy(f, d, html, top = 46, w = 36){
  return el(`<div style="font-size:1.5em;font-weight:700;color:#12233a;max-width:${w}em;line-height:1.55">${html}</div>`,
      S({ left: '7%', top: top + '%', opacity: fade(f, d, d + 18) }));
}
function stamp(f, d, txt, c, rot = -7, pos = { right: '7%', bottom: '12%' }){
  return el(`<div class="stamp" style="font-size:1.3em;color:${c}">${txt}</div>`,
      S({ ...pos, transform: pop(f, d) + ` rotate(${rot}deg)`, opacity: f > d ? 1 : 0 }));
}

const SCENES = [

{ dur: 260, name: 'Title', render(f){
  const sun = interp(f, [0, 60], [110, 30], easeOut);
  const wave = Math.sin(f / 10) * 1.2;
  return el('', S({ inset: 0, background: 'linear-gradient(180deg,#ffd9a0 0 30%,#bfe6f7 30% 62%, #eed9a4 62% 100%)' }))
  + el('', S({ left: '70%', top: sun + '%', width: '14%', 'aspect-ratio': '1', 'border-radius': '50%', background: 'var(--sun)', 'box-shadow': '0 0 70px rgba(246,201,74,.9)' }))
  + el('', S({ left: '-2%', right: '-2%', top: (56 + wave) + '%', height: '8%', background: '#4fc3f7', 'border-radius': '50% 50% 0 0', opacity: .8 }))
  + el(GULL(), S({ left: interp(f, [10, 190], [-10, 106]) + '%', top: '12%', width: '5%' }))
  + el(GULL(), S({ left: interp(f, [40, 190], [-16, 100]) + '%', top: '19%', width: '3.5%' }))
  + el(`<div class="kick" style="font-size:1.5em;color:#0a5c3c">CIVIC HOLIDAY OPERATIONS · MANDATORY LEISURE</div>`,
      S({ left: '7%', top: '13%', opacity: fade(f, 4, 18), transform: slamX(f, 4, -400) }))
  + el(`<div style="font-weight:900;font-size:7em;line-height:.92;letter-spacing:-.03em;text-transform:uppercase">Holiday<br>Monday:<br><span style="color:#0b79bf">Beach</span><span style="color:#e0483e">in'!!</span></div>`,
      S({ left: '7%', top: '22%', transform: slamY(f, 14, 500) + ` rotate(${interp(spring(f, 14), [0, 1], [-5, 0])}deg)` }))
  + stamp(f, 60, 'LEGALLY A LONG WEEKEND', '#e0483e', 8, { right: '6%', top: '10%' })
  + el(`<div class="kick" style="font-size:1.05em;color:#12233a99;line-height:2">DEPLOYED: K-KID · L-KID · N-KID (NEW HIRE) · DAD (SUPER CHUD)<br>JACKSON: WORKING FROM HOME · SEE INCIDENT REPORT #7</div>`,
      S({ left: '7%', bottom: '8%', opacity: fade(f, 85, 105) }));
}},

{ dur: 300, name: 'Personnel', render(f){
  const crew = [
    ['K-KID', 'Chief Vibes Officer', 'DEPLOYED', '#0b79bf'],
    ['L-KID', 'VP of Snacks · horse plaintiff', 'DEPLOYED', '#e0483e'],
    ['N-KID', 'Intern · morale · Jackson liaison', 'DEPLOYED', '#57b06b'],
    ['DAD', 'Super Chud · driver · leaks oil (car does)', 'DEPLOYED', '#b26bff'],
  ];
  return head(f, 'PERSONNEL FILE · ALL HANDS', '#0b79bf', 'The crew<span style="color:#e0483e">.</span>')
  + crew.map((c, i) => el(
      `<div style="display:flex;align-items:baseline;gap:1.2em;border-bottom:2px solid #12233a22;padding-bottom:.5em">
        <span style="font-weight:900;font-size:2em;text-transform:uppercase;min-width:8em">${c[0]}</span>
        <span class="kick" style="font-size:.95em;color:#12233a88;flex:1">${c[1]}</span>
        <span class="kick" style="font-size:.9em;color:${c[3]}">${c[2]}</span>
      </div>`,
      S({ left: '7%', width: '54%', top: (28 + i * 11) + '%', transform: slamX(f, 16 + i * 11, 800), opacity: f > 16 + i * 11 ? 1 : 0 })))
    .join('')
  + el(JACKSON(f), S({ right: '9%', top: '24%', width: '15%', transform: pop(f, 62) }))
  + el(`<div class="kick" style="font-size:.95em;color:#e0483e;text-align:center">JACKSON · STAYS HOME<br><span style="color:#12233a88">HOMESCHOOLED · RECENT SHART INCIDENT (EVERYWHERE)</span></div>`,
      S({ right: '5.5%', top: '62%', width: '22%', opacity: fade(f, 80, 95), 'line-height': '1.8' }))
  + copy(f, 110, `Note from HR: yes he sharted <b>fucking everywhere</b>. Yes we still love him. Both things are true. That's family.`, 76, 34)
  + stamp(f, 150, 'STILL A GOOD BOY', '#57b06b', -5, { right: '5%', bottom: '5%' });
}},

{ dur: 280, name: 'Primary mission', render(f){
  const w1 = Math.sin(f / 8) * 1.4, w2 = Math.sin(f / 8 + 2) * 1.6;
  return el('', S({ inset: 0, background: 'linear-gradient(180deg,#f7f4ec 0 55%, #bfe6f7 55% 78%, #eed9a4 78% 100%)' }))
  + el('', S({ left: '-2%', right: '-2%', top: (60 + w1) + '%', height: '5%', background: '#4fc3f7', 'border-radius': '50% 50% 0 0', opacity: .55 }))
  + el('', S({ left: '-2%', right: '-2%', top: (66 + w2) + '%', height: '5%', background: '#0b79bf', 'border-radius': '50% 50% 0 0', opacity: .4 }))
  + head(f, 'PRIMARY MISSION · NON-NEGOTIABLE', '#0b79bf', 'Port Elgin<br>beach<span style="color:#0b79bf">.</span>', 4.6)
  + copy(f, 35, `Sand: confirmed. Waves: scheduled. Vibes: <b>mandatory.</b> Everything else on this deck is a side quest. This is the quest.`, 40)
  + el(GULL('#12233a'), S({ left: interp(f, [30, 210], [-8, 105]) + '%', top: '30%', width: '4.5%' }))
  + [0, 1, 2].map(i => el(`<div class="kick" style="font-size:1em;color:#0a5c3c">${['SAND ✓', 'WAVES ✓', 'VIBES ✓✓✓'][i]}</div>`,
      S({ left: (10 + i * 12) + '%', top: '84%', transform: pop(f, 90 + i * 16), opacity: f > 90 + i * 16 ? 1 : 0 }))).join('')
  + stamp(f, 140, 'CORE DELIVERABLE', '#0b79bf', 6, { right: '7%', top: '14%' });
}},

{ dur: 320, name: 'Side quests', render(f){
  const rows = [
    ['SQ1', 'Starbucks', 'safety expenditure'],
    ['SQ2', "Ralph's", 'ice cream · structural risk'],
    ['SQ3', 'Dollar Tree', 'IF IT IS OPEN (manifesting)'],
    ['SQ4', 'Circle K', "oil for the leaky fcker + slurpees"],
    ['SQ5', "Osmosis Jones' Schwarma", 'doritos style. yumm.'],
    ['SQ6', "McDonald's", '20-piece nugggggs'],
    ['SQ7', 'Rock hunt', 'geology · HR has concerns'],
    ['SQ8', 'Dog acquisition', 'appreciation event · see legal'],
    ['SQ9', "Jackson's gift", 'toy or snack · he earned it (debatable)'],
  ];
  return head(f, 'SIDE QUEST BOARD · OPTIONAL-ISH', '#e0483e', 'The quests<span style="color:#0b79bf">.</span>', 3.2)
  + rows.map((r, i) => el(
      `<div style="display:flex;align-items:baseline;gap:1.2em;border-bottom:2px solid #12233a1c;padding-bottom:.35em">
        <span class="kick" style="font-size:1.05em;color:#e0483e">${r[0]}</span>
        <span style="font-weight:900;font-size:1.5em;text-transform:uppercase">${r[1]}</span>
        <span class="kick" style="font-size:.85em;color:#12233a80;margin-left:auto">${r[2]}</span>
      </div>`,
      S({ left: '7%', right: '7%', top: (24 + i * 7.4) + '%', transform: slamX(f, 14 + i * 8, 900), opacity: f > 14 + i * 8 ? 1 : 0 })))
    .join('')
  + el(`<div class="kick" style="font-size:.9em;color:#12233a66">COMPLETION BONUS: NOTHING. THE QUESTS ARE THE BONUS.</div>`,
      S({ left: '7%', bottom: '5%', opacity: fade(f, 190, 205) }));
}},

{ dur: 250, name: 'SQ1 · Starbucks', render(f){
  return head(f, 'SIDE QUEST 1 · CAFFEINE SYNERGY', '#0a5c3c', 'We will get<br><span style="color:#0a5c3c">Starbucks.</span>')
  + copy(f, 30, `Longtime shareholders know the policy: nobody drives to a beach uncaffeinated. That's how mistakes happen. This remains a <b>safety expenditure</b> and the auditors can seethe.`, 44)
  + el(CUP, S({ right: '11%', top: '16%', width: '16%', transform: pop(f, 22) + ` rotate(${Math.sin(f / 9) * 3}deg)` }))
  + el(`<div class="kick" style="font-size:.95em;color:#12233a66">N-KID'S FIRST DEPLOYMENT COFFEE: IT'S HOT CHOCOLATE. DON'T TELL THE INTERN.<br>DAD'S ORDER IS NINE WORDS LONG AND ENDS IN AN APOLOGY.</div>`,
      S({ left: '7%', bottom: '9%', opacity: fade(f, 120, 138), 'line-height': '2' }))
  + stamp(f, 100, 'SAFETY EXPENDITURE', '#0a5c3c', -6);
}},

{ dur: 260, name: "SQ2 · Ralph's", render(f){
  const scoops = ['#ffb3c4', '#f6e2b8', '#8a5a30'];
  return head(f, 'SIDE QUEST 2 · FROZEN ASSETS', '#e0483e', `Ralph's<span style="color:#e0483e">.</span> Ice cream<span style="color:#0b79bf">.</span>`)
  + copy(f, 30, `Three scoops per operative. Yes it will lean. Yes someone's top scoop will attempt an escape. The seagulls know this too — <b>guard your cone like it owes you money.</b>`, 44)
  + el(`<svg viewBox="0 0 100 150" width="100%"><path d="M35 78 L50 145 L65 78 z" fill="#d8a05a" stroke="#12233a" stroke-width="4"/><path d="M36 90 l28 -8 M40 106 l22 -6 M44 122 l14 -4" stroke="#b57c3a" stroke-width="2.5"/></svg>`,
      S({ right: '15%', top: '30%', width: '10%' }))
  + scoops.map((c, i) => el(`<div style="width:100%;aspect-ratio:1;border-radius:50%;background:${c};border:.35em solid #12233a"></div>`,
      S({ right: (15.6 - i * .1) + '%', top: (34 - i * 9.5) + '%', width: (8.6 - i * .8) + '%',
        transform: slamY(f, 40 + i * 22, -300) + ` rotate(${i === 2 ? Math.sin(f / 6) * 8 : 0}deg)`, opacity: f > 40 + i * 22 ? 1 : 0 }))).join('')

  + el(`<div class="kick" style="font-size:1em;color:#12233a99;text-align:center;line-height:2.1">JACKSON: WE'RE BRINGING YOU SOMETHING GOOD. N-KID SAYS HI. AND LOVE.<br>ANNE: ALWAYS IN OUR HEARTS. NEVER NEAR OUR CHIPS.<br>SUNSCREEN IS NOT OPTIONAL · THIS DECK REMAINS LEGALLY BINDING</div>`,
      S({ left: '7%', right: '7%', bottom: '7%', opacity: fade(f, 140, 165) }));
}},
];

const TOTAL = SCENES.reduce((s, sc) => s + sc.dur, 0);
let frame = 0, playing = false, rafLast = 0;
function sceneAt(gf){
  let acc = 0;
  for (let i = 0; i < SCENES.length; i++){
    if (gf < acc + SCENES[i].dur) return { i, local: gf - acc, start: acc };
    acc += SCENES[i].dur;
  }
  return { i: SCENES.length - 1, local: SCENES[SCENES.length - 1].dur - 1, start: TOTAL - SCENES[SCENES.length - 1].dur };
}
function render(){
  const { i, local } = sceneAt(frame);
  comp.innerHTML = SCENES[i].render(local);
  document.getElementById('sceneLbl').textContent = `${i + 1} / ${SCENES.length} · ${SCENES[i].name}`;
  const p = frame / TOTAL;
  document.querySelector('#scrub .fill').style.width = (p * 100) + '%';
  document.querySelector('#scrub .knob').style.left = (p * 100) + '%';
}
function tick(ts){
  requestAnimationFrame(tick);
  if (!playing) return;
  if (!rafLast) rafLast = ts;
  const adv = (ts - rafLast) / (1000 / FPS);
  if (adv >= 1){
    frame = Math.min(TOTAL - 1, frame + Math.round(adv));
    rafLast = ts;
    if (frame >= TOTAL - 1){ playing = false; updatePlayBtn(); Music.stop(); }
    render();
  }
}
requestAnimationFrame(tick);
function updatePlayBtn(){ document.getElementById('bPlay').textContent = playing ? 'Pause' : (frame >= TOTAL - 1 ? 'Replay' : 'Play'); }
function playPause(){
  if (frame >= TOTAL - 1 && !playing) frame = 0;
  playing = !playing; rafLast = 0;
  updatePlayBtn();
  playing ? Music.start() : Music.stop();
}
document.getElementById('bPlay').addEventListener('click', playPause);
document.getElementById('bPrev').addEventListener('click', () => {
  const { i, start } = sceneAt(frame);
  frame = frame - start > FPS ? start : (i > 0 ? sceneAt(start - 1).start : 0);
  render();
});
document.getElementById('bNext').addEventListener('click', () => {
  const { i, start } = sceneAt(frame);
  frame = i < SCENES.length - 1 ? start + SCENES[i].dur : TOTAL - 1;
  render();
});
addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); playPause(); }
  if (e.code === 'ArrowLeft') document.getElementById('bPrev').click();
  if (e.code === 'ArrowRight') document.getElementById('bNext').click();
});
const scrub = document.getElementById('scrub');
let marks = '', acc = 0;
SCENES.slice(0, -1).forEach(sc => { acc += sc.dur; marks += `<div class="mark" style="left:${acc / TOTAL * 100}%"></div>`; });
scrub.insertAdjacentHTML('beforeend', marks);
function scrubTo(x){
  const r = scrub.getBoundingClientRect();
  frame = Math.round(clamp((x - r.left) / r.width, 0, 1) * (TOTAL - 1));
  render();
}
let scrubbing = false;
scrub.addEventListener('pointerdown', e => { scrubbing = true; playing = false; updatePlayBtn(); scrubTo(e.clientX); });
addEventListener('pointermove', e => { if (scrubbing) scrubTo(e.clientX); });
addEventListener('pointerup', () => scrubbing = false);

const Music = (() => {
  let ctx = null, master = null, leadBus = null, timer = null, step = 0, nextT = 0;
  let enabled = true;
  const BPM = 138, SPB = 60 / BPM / 2;
  const N = (name) => {
    const m = /^([A-G]#?)(\d)$/.exec(name);
    const idx = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'].indexOf(m[1]);
    return 440 * Math.pow(2, (idx - 9) / 12 + (m[2] - 4));
  };
  const BASS = [
    'E2','E2','E2','E2','E2','E2','G2','A2',  'E2','E2','E2','E2','D2','D2','B1','B1',
    'E2','E2','E2','E2','E2','E2','G2','A2',  'C3','C3','B2','B2','A2','A2','G2','A2',
    'E2','E2','E2','E2','E2','E2','G2','A2',  'E2','E2','E2','E2','D2','D2','B1','B1',
    'C3','C3','C3','C3','D3','D3','D3','D3',  'E3','E3','D3','B2','A2','G2','A2','B2',
  ];
  const LEAD = [
    '','','','','','','','',                  '','','','','','','','',
    'E4','','G4','E4','A4','','G4','E4',      'D4','','E4','','','','','',
    'E4','','G4','E4','A4','','B4','A4',      'G4','','E4','','D4','','E4','',
    'C5','','B4','A4','B4','','A4','G4',      'E4','','G4','','A4','','B4','',
  ];
  function drum(i){ const b = i % 8; return { kick: b === 0 || b === 4 || (i % 32 === 30), snare: b === 2 || b === 6, hat: true }; }
  function ensure(){
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = .14;
    const dc = ctx.createDynamicsCompressor();
    master.connect(dc); dc.connect(ctx.destination);
    
    leadBus = ctx.createGain();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2300; lp.Q.value = .6;
    leadBus.connect(lp); lp.connect(master);
    const delay = ctx.createDelay(.5);
    delay.delayTime.value = SPB * 1.5;
    const fb = ctx.createGain(); fb.gain.value = .22;
    const wet = ctx.createGain(); wet.gain.value = .15;
    lp.connect(delay); delay.connect(fb); fb.connect(delay);
    delay.connect(wet); wet.connect(master);
  }
  function osc(type, freq, t, dur, vol, detune = 0){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; o.detune.value = detune;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
  }
  function noise(t, dur, vol, hp){
    const len = Math.ceil(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const flt = ctx.createBiquadFilter(); flt.type = 'highpass'; flt.frequency.value = hp;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(master); src.start(t);
  }
  function scheduleStep(i, t){
    const b = BASS[i % 64]; if (b) osc('square', N(b), t, SPB * .9, .30);
    const l = LEAD[i % 64];
    if (l){
      const o1 = ctx.createOscillator(), g1 = ctx.createGain();
      o1.type = 'sawtooth'; o1.frequency.value = N(l);
      g1.gain.setValueAtTime(.17, t); g1.gain.exponentialRampToValueAtTime(.001, t + SPB * 1.7);
      o1.connect(g1); g1.connect(leadBus); o1.start(t); o1.stop(t + SPB * 1.75);
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.type = 'sawtooth'; o2.frequency.value = N(l); o2.detune.value = 9;
      g2.gain.setValueAtTime(.12, t); g2.gain.exponentialRampToValueAtTime(.001, t + SPB * 1.7);
      o2.connect(g2); g2.connect(leadBus); o2.start(t); o2.stop(t + SPB * 1.75);
    }
    if (i % 8 === 2 || i % 8 === 6) noise(t, .05, .045, 7000);   
    if (i % 32 === 30) noise(t, .16, .06, 5200);                 
    const dr = drum(i);
    if (dr.kick){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(38, t + .1);
      g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.001, t + .13);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + .15);
    }
    if (dr.snare) noise(t, .1, .3, 1400);
    if (dr.hat) noise(t, .03, i % 2 ? .07 : .11, 6000);
  }
  function tickSched(){ while (nextT < ctx.currentTime + .12){ scheduleStep(step, nextT); step++; nextT += SPB; } }
  return {
    start(){ if (!enabled) return; ensure(); ctx.resume(); if (!timer){ nextT = ctx.currentTime + .05; timer = setInterval(tickSched, 25); } },
    stop(){ if (timer){ clearInterval(timer); timer = null; } if (ctx) ctx.suspend(); },
    toggle(){
      enabled = !enabled;
      if (!enabled) this.stop(); else if (playing) this.start();
      document.getElementById('bMusic').textContent = 'Music: ' + (enabled ? 'On' : 'Off');
    },
  };
})();
document.getElementById('bMusic').addEventListener('click', () => Music.toggle());

(() => {
  const btn = document.getElementById('bFull');
  const root = document.documentElement;
  const canFS = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!canFS){ btn.style.display = 'none'; return; }
  const isFS = () => document.fullscreenElement || document.webkitFullscreenElement;
  btn.addEventListener('click', () => {
    if (isFS()){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    }
  });
  const onChange = () => {
    btn.textContent = isFS() ? '⛶ Exit' : '⛶ Full';
    sizeComp(); render();
  };
  document.addEventListener('fullscreenchange', onChange);
  document.addEventListener('webkitfullscreenchange', onChange);
})();

document.getElementById('tapstart').addEventListener('click', () => {
  document.getElementById('tapstart').classList.add('hide');
  frame = 0; playing = true; rafLast = 0; updatePlayBtn();
  Music.start();
});
comp.addEventListener('click', playPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) Music.stop(); else if (playing) Music.start(); });

sizeComp();
render();
</script>
