<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuclear Construction Tycoon</title>
<meta name="description" content="Nuclear Construction Tycoon. Build a twin-unit nuclear station from field coordinator to construction director. Four things need you every turn; you have attention for three.">
<meta name="theme-color" content="#008080">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231b2024%27/%3E%3Cpath d=%27M5 24h22M8 24a5 5 0 0 1 10 0M15 24a5 5 0 0 1 10 0%27 stroke=%27%23e0ad00%27 stroke-width=%272.5%27 fill=%27none%27/%3E%3Cpath d=%27M9 9l7 3 7-3-7 1z%27 fill=%27%23e0ad00%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: a site trailer board. Status strip and fog gauge on top; this turn's tags left, the open situation right; career and experience below. Stacks to one column on phones. */
:root{
  --bg:#e4e5df; --panel:#f5f5f0; --sunk:#ecede7; --ink:#1b2024; --muted:#5a6268; --line:#c8cbc2;
  --hivis:#e0ad00; --hivis-ink:#1b1909; --ok:#2c7a47; --warn:#a96400; --bad:#b0352b; --info:#2c5c88;
  --shadow:0 1px 0 rgba(27,32,36,.06),0 8px 24px -12px rgba(27,32,36,.25);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,15px);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(12px,env(safe-area-inset-top,0px)) max(48px,env(safe-area-inset-bottom,0px));margin:0}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(44px,9vw,92px);text-transform:uppercase;letter-spacing:-.005em}
h2{font-size:clamp(24px,3.4vw,30px);text-transform:uppercase}
h3{font-size:20px;text-transform:uppercase}
p{margin:0}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;padding:0 5px;border-radius:3px;background:var(--panel);color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:8px;background:var(--hivis);color:var(--hivis-ink);border:0;padding:11px 18px;font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:3px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.small{font-size:15px;padding:7px 12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--hivis) 0 12px,var(--ink) 12px 24px);background-size:34px 34px;border-radius:2px}
.title .stripe{animation:march 1.4s linear infinite}
@keyframes march{to{background-position:34px 0}}

/* Title */
.title{display:grid;gap:22px;padding:clamp(20px,4vw,40px);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.title .lede{max-width:60ch;font-size:clamp(16px,2vw,18px)}
.hero{display:grid;gap:20px;align-items:center}@media (min-width:1000px){.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.hero-art{width:100%;height:auto;border:1px solid var(--line);border-radius:4px;display:block}
.hero-art .kestrel{transform:translate(430px,46px);animation:hover 3.2s ease-in-out infinite}
@keyframes hover{50%{transform:translate(436px,40px)}}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.foot a{color:inherit}
.kicker{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kicker .pill{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:3px 8px;border-radius:2px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.rules div{border-top:3px solid var(--ink);padding-top:10px;display:grid;gap:4px}
.modes{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.modecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{text-align:left;background:var(--sunk);border:2px solid var(--line);padding:16px;border-radius:4px;display:grid;gap:6px;transition:border-color .15s,transform .1s}
.mode:hover{border-color:var(--ink)}
.mode:active{transform:translateY(1px)}
.mode h3{font-size:26px}
.mode.daily{border-color:var(--hivis)}
.mode.nm{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}.mode.hard.nm h3::after{content:" ▲▲"}
.mode.hard h3::after{content:" ▲";color:var(--bad);font-size:16px;vertical-align:middle}

/* Header + status */
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(34px,6vw,54px)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.strip>div{background:var(--panel);padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;transition:color .4s}
.flash-good{animation:fg 1.2s}.flash-bad{animation:fb 1.2s}
@keyframes fg{0%,40%{color:var(--ok)}}
@keyframes fb{0%,40%{color:var(--bad)}}

.gauge{background:var(--panel);border:1px solid var(--line);padding:14px 16px;display:grid;gap:10px}
.gtrack{position:relative;height:34px;border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(90deg,transparent 0 calc(8.333% - 1px),var(--line) calc(8.333% - 1px) 8.333%)}
.gband{position:absolute;top:6px;bottom:6px;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--info) 22%,transparent) 0 6px,color-mix(in srgb,var(--info) 34%,transparent) 6px 12px);border:2px solid var(--info);border-radius:2px;transition:left .7s cubic-bezier(.2,.7,.2,1),width .7s cubic-bezier(.2,.7,.2,1)}
.gtarget{position:absolute;top:-4px;bottom:-6px;width:3px;background:var(--hivis);left:50%;transform:translateX(-1px)}
.gtarget::after{content:"TARGET";position:absolute;top:100%;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted);padding-top:2px}
.gscale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px}
.grow{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.reps{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12px;padding:3px 8px;border:1px solid var(--line);background:var(--panel);border-radius:2px;white-space:nowrap}
.chip b{font-weight:600}
.chip.pos b{color:var(--ok)}.chip.neg b{color:var(--bad)}
.chip.pos{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}.chip.neg{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}

/* Board */
.board{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:840px){.board{grid-template-columns:1fr}}
@media (min-width:1100px){.board{grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px}.tags{position:sticky;top:14px}.panel#detail{min-height:520px}}
.side{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
@media (min-width:1380px){.wrap{max-width:1640px}.board{grid-template-columns:340px minmax(0,1fr) 330px}.side{grid-column:auto;grid-template-columns:1fr;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;padding-right:2px}.side .log ol{max-height:300px}}
@media (hover:none){.kbonly{display:none!important}}
.tag .kn{position:absolute;right:10px;bottom:10px;font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.iconbtn{background:transparent;border:2px solid var(--line);border-radius:3px;width:38px;height:38px;display:inline-grid;place-items:center;font-size:17px;color:var(--ink)}
.iconbtn:hover{border-color:var(--ink)}
.gl{text-decoration:underline dotted color-mix(in srgb,var(--ink) 55%,transparent);text-underline-offset:3px;cursor:help;position:relative}
.gl:hover::after,.gl:focus::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 4px);z-index:40;width:max-content;max-width:300px;background:var(--ink);color:var(--panel);padding:7px 9px;font:400 13px/1.4 var(--body);border-radius:3px;white-space:normal;text-transform:none;letter-spacing:0;box-shadow:var(--shadow);pointer-events:none}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 18px;max-height:280px;overflow:auto;border-top:1px solid var(--line);padding-top:10px;margin:0}.glist dt{font-weight:600}.glist dd{margin:0 0 6px;font-size:13px;color:var(--muted)}
.tut{position:fixed;left:20px;bottom:20px;z-index:70;max-width:360px;background:var(--ink);color:var(--panel);padding:14px 16px;border-radius:4px;display:grid;gap:8px;box-shadow:0 20px 40px -16px rgba(0,0,0,.5);animation:rise .3s both}
.tut .lbl{color:color-mix(in srgb,var(--panel) 70%,transparent)}.tut p{font-size:15px}.tut .btn.ghost{color:var(--panel);box-shadow:inset 0 0 0 2px var(--panel)}
.tut-hi{outline:3px solid var(--hivis);outline-offset:4px;border-radius:4px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{outline-color:color-mix(in srgb,var(--hivis) 35%,transparent)}}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center;margin:0}
.keys dt{display:flex;gap:4px}.keys dd{margin:0}
.opt:focus-visible{border-color:var(--ink);background:var(--panel)}
.tags{display:flex;flex-direction:column;gap:10px}
.tag{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);padding:12px 14px 12px 44px;display:grid;gap:3px;border-radius:4px;transition:transform .12s,border-color .15s,box-shadow .15s}
.tags.deal .tag{animation:dealin .35s both}
.tags.deal .tag:nth-of-type(2){animation-delay:.05s}.tags.deal .tag:nth-of-type(3){animation-delay:.1s}.tags.deal .tag:nth-of-type(4){animation-delay:.15s}
@keyframes dealin{from{opacity:.0;transform:translateX(-10px)}}
.tag:hover{border-color:var(--ink)}
.tag::before{content:"";position:absolute;left:16px;top:17px;width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);background:var(--bg)}
.tag::after{content:"";position:absolute;left:23px;top:0;width:1px;height:17px;background:var(--muted);opacity:.5}
.tag[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink),var(--shadow);transform:translateX(4px)}
.tag.done::before{background:var(--ok);border-color:var(--ok)}
.tag.done .tt{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.tag .tt{font-weight:600;line-height:1.3}
.tag .area{display:flex;justify-content:space-between;gap:8px}
.att{display:flex;gap:7px;align-items:center}
.att i{width:13px;height:13px;border:2px solid var(--ink);display:inline-block;transform:rotate(45deg);transition:background .25s}
.att i.on{background:var(--hivis);border-color:var(--hivis-ink)}

.panel{background:var(--panel);border:1px solid var(--line);padding:clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow);border-radius:4px}
.panel.enter{animation:rise .3s both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.scene{font-size:clamp(16px,1.9vw,18px);max-width:62ch;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;text-align:left;background:var(--sunk);border:1px solid var(--line);padding:12px 14px;border-radius:4px;transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--ink);background:var(--panel)}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.opt .k{font-family:var(--display);font-size:22px;font-weight:700;line-height:1;width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%}
.opt .odds{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:4px}
.opt .odds.hi{color:var(--ok)}.opt .odds.lo{color:var(--bad)}

.locked{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1px dashed var(--line);background:repeating-linear-gradient(-45deg,transparent 0 10px,color-mix(in srgb,var(--line) 35%,transparent) 10px 11px);padding:14px;border-radius:4px}
.locked svg{width:26px;height:26px;color:var(--muted)}
.locked .fake{margin-top:8px;height:42px;border:1px solid var(--line);border-radius:3px;background:var(--sunk);display:flex;align-items:center;padding:0 10px;color:var(--muted);font-size:13px;user-select:none}

.result{display:grid;gap:12px;border-left:4px solid var(--info);padding:4px 0 4px 16px}.result.fresh{animation:rise .35s both}.result:not(.fresh) .stamp{animation:none}
.result.g-best{border-color:var(--ok)}.result.g-good{border-color:var(--info)}.result.g-weak{border-color:var(--warn)}.result.g-wrong{border-color:var(--bad)}
.outhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stamp{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.08em;padding:2px 12px;border:3px solid currentColor;border-radius:3px;transform:rotate(-4deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:.15s}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(1.9)}}
.c-best{color:var(--ok)}.c-good{color:var(--info)}.c-weak{color:var(--warn)}.c-wrong{color:var(--bad)}
.lucky{font-family:var(--mono);font-size:12px;color:var(--muted)}
.fx{display:flex;flex-wrap:wrap;gap:6px}
.lesson{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.2;border-top:1px solid var(--line);padding-top:10px}
.empty{display:grid;gap:10px;place-items:start;padding:12px 0}
.empty svg{width:56px;height:56px;color:var(--line)}

/* Lower panels */
.lower{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.rung{display:grid;gap:4px}
.rung span{height:8px;background:var(--line);border-radius:1px}
.rung.on span{background:var(--hivis)}
.rung.now span{background:var(--ink)}
.rung small{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.2}
.rung.now small{color:var(--ink);font-weight:600}
.xp{display:grid;gap:8px;margin-top:8px}
.xprow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px}
.xpbar{height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:1px;position:relative;overflow:hidden}
.xpbar b{position:absolute;inset:0 auto 0 0;background:var(--info);transition:width .5s}
.xpbar b.full{background:var(--ok)}
.log ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px;max-height:280px;overflow:auto}
.log li{font-size:13.5px}
.log li::marker{font-family:var(--mono);color:var(--muted)}
svg.spark{width:100%;height:56px;display:block;margin-top:6px}

/* Modal */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border:1px solid var(--line);border-top:10px solid var(--hivis);max-width:620px;width:100%;max-height:100%;overflow:auto;padding:22px;display:grid;gap:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);border-radius:4px;animation:rise .3s both}
.modal ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.modal li{border-left:3px solid var(--bad);padding-left:12px;display:grid;gap:4px}
.modal li.okk{border-color:var(--ok)}
.delta{display:flex;gap:16px;flex-wrap:wrap}
.builds{display:grid;gap:8px}.btable{display:grid;border:1px solid var(--line);border-radius:3px;overflow:auto}
.bhead,.brow{display:grid;grid-template-columns:90px 70px 90px 110px 90px 60px 90px minmax(140px,1fr);gap:8px;padding:7px 10px;font-size:13px;align-items:center;min-width:760px}
.bhead{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.brow{border-top:1px solid var(--line);font-variant-numeric:tabular-nums}.brow.best{background:color-mix(in srgb,var(--hivis) 12%,var(--panel))}.brow.now{box-shadow:inset 4px 0 0 var(--ink)}
.review{display:grid;gap:10px}.rvtabs{display:flex;gap:6px;flex-wrap:wrap}.rvtabs .chip{cursor:pointer}.rvtabs .chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.review details{border-top:3px solid var(--ink);padding-top:8px}.review summary{display:flex;align-items:baseline;gap:12px;cursor:pointer;list-style:none}.review summary::-webkit-details-marker{display:none}.review summary h3::before{content:"▸ ";color:var(--muted)}.review details[open] summary h3::before{content:"▾ "}
.rvlist{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.rv{border:1px solid var(--line);border-left:4px solid var(--info);background:var(--sunk);padding:10px 12px;border-radius:3px;display:grid;gap:5px;font-size:14px}
.rv.g-best{border-left-color:var(--ok)}.rv.g-weak{border-left-color:var(--warn)}.rv.g-wrong{border-left-color:var(--bad)}.rv.idle{border-left-color:var(--muted);border-left-style:dashed}
.rvbest{border-top:1px dashed var(--line);padding-top:5px}.rvbest .lbl{display:block;color:var(--ok)}.rvL{font-family:var(--display);font-size:17px;font-weight:600}
.fan{width:100%;height:auto;display:block;margin-top:6px}.fan text{font:10px var(--mono);fill:var(--muted)}.fan .tg{fill:var(--ink);font-weight:600;letter-spacing:.08em}
.fu{color:var(--hivis-ink);background:var(--hivis);padding:0 5px;border-radius:2px;font-weight:600}
.perkpick{display:grid;gap:8px}
.medpop{position:fixed;right:20px;bottom:20px;z-index:80;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--hivis);padding:12px 16px;display:grid;gap:2px;box-shadow:var(--shadow);border-radius:4px;max-width:320px;animation:rise .3s both}
.medpop b{font-family:var(--display);font-size:22px;text-transform:uppercase}
.medals{display:grid;gap:8px}.medgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.med{border:1px dashed var(--line);padding:8px 10px;border-radius:3px;display:grid;gap:2px;opacity:.55}.med b{font-family:var(--display);font-size:17px;text-transform:uppercase}.med span{font-size:12px;color:var(--muted)}
.med.got{opacity:1;border-style:solid;border-color:var(--hivis);background:color-mix(in srgb,var(--hivis) 10%,var(--panel))}
.newsbox{background:var(--sunk);border:1px solid var(--line);border-left:4px solid var(--hivis);padding:10px 12px;display:grid;gap:6px;border-radius:3px}
.delta div{display:grid}
.delta .v{font-family:var(--display);font-size:28px;font-weight:700}

/* End */
.report{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.report>div{border-top:3px solid var(--ink);padding-top:10px;display:grid;gap:6px;align-content:start}

/* ===== Windows 3.1 layer. Three color schemes from the 3.1 Control Panel: Windows Default, Hot Dog Stand, Black Leather Jacket. ===== */

  --hi:#ffffff; --lo:#800000; --dk:#000000; --face:#ff0000; --face-ink:#ffffff; color-scheme:light;
}
:root[data-theme="leather"]{
  --bg:#000000; --panel:#1c1c1c; --sunk:#303030; --ink:#e8e8e8; --muted:#b0b0b0; --line:#606060;
  --hivis:#c0c0c0; --hivis-ink:#000000; --ok:#00c000; --warn:#c0c000; --bad:#ff5050; --info:#40a0ff;
  --wt:#000000; --wt-ink:#ffffff; --wt-off:#404040; --wt-off-ink:#c0c0c0; --sel:#808080; --sel-ink:#ffffff;
  --hi:#808080; --lo:#000000; --dk:#000000; --face:#404040; --face-ink:#ffffff; color-scheme:dark;

  .nophone,.hero-art{display:none}
  .mobtabs{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--sunk);border-top:2px solid var(--dk);padding:4px 4px max(4px,env(safe-area-inset-bottom,0px));gap:4px}
  .mobtabs button{background:var(--face);color:var(--face-ink);border:1px solid var(--dk);box-shadow:inset -2px -2px var(--lo),inset 2px 2px var(--hi);font:700 14px var(--body);padding:9px 4px}
  .mobtabs button.on{background:var(--sel);color:var(--sel-ink);box-shadow:inset 2px 2px var(--lo)}
  .mobtabs b{display:inline-block;min-width:18px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px}
  html:not([data-mt]) .overview,html[data-mt="work"] .overview,html[data-mt="work"] .side{display:none}
  html[data-mt="site"] .tags,html[data-mt="site"] #detail,html[data-mt="site"] .side .sec-me{display:none}
  html[data-mt="me"] .tags,html[data-mt="me"] #detail,html[data-mt="me"] .overview,html[data-mt="me"] .side .sec-site{display:none}
  .gauge .gscale span:nth-child(2n){visibility:hidden}.mapwin canvas{max-height:none}
  .medpop{left:8px;right:8px;bottom:66px;max-width:none;padding:6px 10px}.medpop .note{display:none}.medpop b{font-size:16px}
  #detail>h2{display:none}#detail>.grow{gap:2px 10px}
  .qtstat{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:2px;padding:2px}.qtstat>span{padding:3px 6px}.qtstat .lbl{font-size:9px}.qtstat b{font-size:15px}.qthat i{width:14px;height:9px}
  .qtq{font-size:17px}
  .picon{width:76px}.picons{gap:2px}
  .title h1{font-size:26px}.title .lede{font-size:14px;line-height:1.45}.title .rules{display:none}.title>.hero{gap:8px}
  .medgrid{grid-template-columns:1fr 1fr;gap:4px}.med{padding:4px 6px}.med b{font-size:13px}.med span{display:none}
  .btable{font-size:12px}
  .rules{grid-template-columns:1fr 1fr;gap:10px}.rules p{font-size:13px}
}

<div class="wwin main">
 <div class="wtitle"><span class="wctl" aria-hidden="true"><i></i></span><span class="wt" id="wtt">Program Manager</span><span class="wbtns" aria-hidden="true"><i>&#9660;</i><i>&#9650;</i></span></div>
 <nav class="wmenu" id="wmenu" aria-label="Menu"><button data-menu="file"><u>F</u>ile</button><button data-menu="game"><u>G</u>ame</button><button data-menu="options"><u>O</u>ptions</button><button data-menu="window"><u>W</u>indow</button><button data-menu="help"><u>H</u>elp</button></nav>
 <div class="wrap" id="app"></div>
</div>
<div class="wrap"><p class="foot"><span>Nuclear Construction Tycoon &middot; progress saves in this browser</span></p></div>

<script>
const ROLES=["Field coordinator","Package lead","Area manager","Construction director"];
const REP={f:"Field",b:"Boss",en:"Engineering",r:"Regulator",cm:"Comms"};
const S=[
// ----- Field coordinator -----
{id:"pour",r:0,a:"Concrete",t:"Night pour losing heat",x:"6 am, minus 24. The night pour on the shield wall is running long and the heaters are struggling to keep the enclosure warm.",o:[
{t:"Add four heaters and double the tarps (about $18k)",p:.85,g:"best",n:"Protecting a pour you have already started is cheap next to a cold joint in a containment wall.",ok:{x:"The enclosure holds above 10 °C. The pour finishes at 9:40 with good cylinders.",e:{f:1,c:.02}},no:{x:"One heater trips its breaker at 4 am and nobody notices for an hour. The top lift needs extra curing time, but the cylinders pass.",e:{c:.03,d:.5}}},
{t:"Stop at the planned construction joint and finish tomorrow",p:.8,g:"good",n:"A planned joint is a legitimate exit. You trade a day for certainty.",ok:{x:"The joint is prepared properly and the wall finishes the next night.",e:{d:.5}},no:{x:"The joint prep is rushed and engineering asks for extra roughening before the next lift.",e:{d:1,en:-1}}},
{t:"Keep going and hope the sun helps by mid-morning",p:.3,g:"wrong",n:"Hope is not a thermal control plan. The sun does little at minus 24.",ok:{x:"It squeaks through. The QC inspector logs the low temperatures anyway.",e:{}},no:{x:"A cold joint forms near the top. Engineering wants cores and a repair disposition.",e:{d:3,c:.4,en:-1,f:-1}}}],
idle:{x:"Nobody owned the heater problem. The crew kept pouring and the top lift came in cold.",e:{d:2,c:.2,f:-1}},L:"Protect what you have already committed to."},

{id:"certs",r:0,a:"Quality",t:"Rebar truck without certs",x:"A rebar delivery is stuck at the gate. The driver says the mill certs are \"in the office somewhere.\" The crew wants the steel this morning.",o:[
{t:"Turn it away until the paperwork arrives",p:.85,g:"good",n:"Safe, but it costs the delivery slot and annoys the supplier.",ok:{x:"The certs arrive the next day and the truck comes back. You lose a morning.",e:{d:.3}},no:{x:"The supplier can't rebook for a week. The crew idles.",e:{d:1.5,f:-1}}},
{t:"Unload into quarantine, red-tagged, until the certs arrive",p:.9,g:"best",n:"Material in hand, nothing used until it is proven. That is how quarantine is supposed to work.",ok:{x:"The certs arrive two days later and one heat number doesn't match. That bundle never gets near the wall. A nonconformance caught on paper, not in concrete.",e:{en:1,f:1,w:-1}},no:{x:"The certs arrive fine. Quarantine cost the crew an hour of handling.",e:{}}},
{t:"Unload normally, it's the usual supplier",p:.55,g:"wrong",n:"Familiarity is not traceability.",ok:{x:"The certs turn up and match. You got away with it.",e:{}},no:{x:"One bundle came from the wrong mill and is already tied into the wall. Engineering needs a disposition and maybe removal.",e:{d:3,c:.3,en:-2,r:-1}}}],
idle:{x:"The guard let the truck in. A bundle from the wrong mill got tied into the wall before anyone checked.",e:{d:2,c:.2,en:-1}},L:"A cert only proves the material it names."},

{id:"walk",r:0,a:"Quality",t:"Pour sign-off at 3 pm",x:"The superintendent wants your pour-readiness signature for tomorrow's wall by 3 pm. Priya, your apprentice, asks to shadow you this afternoon.",o:[
{t:"Walk the pour area with Priya before signing",p:.85,g:"best",n:"Go and look, and bring someone so they learn to look too.",ok:{x:"Priya spots a missing waterstop at the construction joint. Fixed in forty minutes. You sign at 2:50.",e:{f:1,en:1,w:-1}},no:{x:"Nothing wrong today, but Priya now knows what a real walk-down looks like.",e:{f:1}}},
{t:"Sign from the checklist at your desk",p:.45,g:"wrong",n:"A checklist says what someone claims is done. It is not evidence.",ok:{x:"The checklist was right this time.",e:{}},no:{x:"A waterstop was missing. It is found after the pour and needs injection grouting.",e:{d:2,c:.15,en:-2}}},
{t:"Send Priya alone and sign on her report",p:.6,g:"weak",n:"Stretching people is good. Signing on their word before you know their eye is not.",ok:{x:"Priya does a careful job. You sign.",e:{f:1}},no:{x:"Priya misses the waterstop. It comes out after the pour, and so does your signature.",e:{d:2,c:.15,en:-1,b:-1}}}],
idle:{x:"You signed from the checklist in a rush. A missing waterstop showed up after the pour.",e:{d:2,c:.15,en:-1}},L:"Go and look."},

{id:"storm",r:0,a:"Weather",t:"Ice storm in three days",x:"The forecast shows a serious ice storm in three days. Prepping now pulls two crews off production.",o:[
{t:"Start storm prep now",p:.85,g:"best",n:"Weather is a constraint with a known date. Cheap to plan for, expensive to meet unprepared.",ok:{x:"20 mm of ice. Your scaffolds are tied off, the crane weathervaned, curing double-blanketed. You are back working a day after the storm; the area next door takes five.",e:{f:1,b:1,d:-.5}},no:{x:"The storm tracks south and you lose a day and a half of output for nothing. Still the right call.",e:{d:.3,f:-1}}},
{t:"Wait a day for a firmer forecast",p:.5,g:"weak",n:"Waiting has value only if you can still act in time. Here the margin is thin.",ok:{x:"The forecast firms up and one day is just enough.",e:{}},no:{x:"The storm comes early. Scaffolds iced, a tarp collapses on fresh concrete.",e:{d:2,c:.2,s:-1}}},
{t:"Raise it with your area manager and let them decide",p:.7,g:"good",n:"Reasonable, but it is your area. Bring a recommendation, not just the problem.",ok:{x:"She approves prep the same afternoon.",e:{b:1}},no:{x:"She's in meetings until tomorrow. Prep starts late.",e:{d:1}}}],
idle:{x:"Nobody prepped. The ice storm shut your scaffolds for four days.",e:{d:2,c:.2,s:-1}},L:"Plan for the constraint you can see coming."},

{id:"rfi",r:0,a:"Engineering",t:"RFI unanswered for ten days",x:"An RFI on embed locations has sat for ten days. Your crew reaches that wall section in four days.",o:[
{t:"Phone the engineer, then ask for an email confirmation to close the RFI",p:.85,g:"best",n:"A phone call gets the answer fast. The email makes it count.",ok:{x:"Daniel never saw it; it was misrouted. He answers in ten minutes and emails confirmation. Document control finds eleven more RFIs in the wrong queue.",e:{en:2,w:-2}},no:{x:"Daniel's on leave. His backup answers by email the next day.",e:{en:1}}},
{t:"Escalate formally through document control with a needed-by date",p:.65,g:"good",n:"Correct process, slower path.",ok:{x:"The answer comes back in three days.",e:{en:1}},no:{x:"It sits again. The crew waits two days.",e:{d:1}}},
{t:"Have the crew skip that section and come back later",p:.5,g:"weak",n:"Working around a constraint hides it. Out-of-sequence work costs more later.",ok:{x:"The crew works around it.",e:{d:.5}},no:{x:"The skipped section blocks the next pour sequence. Two days of rework.",e:{d:2,f:-1}}}],
idle:{x:"The RFI sat. The crew reached the wall and stopped.",e:{d:2}},L:"Close the loop in writing."},

{id:"laydown",r:0,a:"Logistics",t:"Two crews, one laydown yard",x:"The piping crew and the electrical crew both booked the same laydown space and are arguing at the gate.",o:[
{t:"Split it in half",p:.5,g:"weak",n:"Fair is not the same as right. Nobody gets what they need.",ok:{x:"Both crews make do.",e:{}},no:{x:"Piping misses its tie-in by two days.",e:{d:1.5}}},
{t:"Check the schedule and give it to the critical-path crew",p:.85,g:"best",n:"Float tells you who can wait, as long as the float is real.",ok:{x:"Piping gets it and hits its tie-in. You find electrical a spot behind the warehouse.",e:{f:1,d:-.3}},no:{x:"Piping gets it. Then electrical learns its cable reels are three weeks late; their float was never real.",e:{w:1}}},
{t:"Kick it to the superintendent",p:.6,g:"weak",n:"He'll decide, but you just taught both foremen you won't.",ok:{x:"He picks piping.",e:{}},no:{x:"He's busy. The argument costs a morning.",e:{d:.5,f:-1}}}],
idle:{x:"The two crews fought over it all morning.",e:{d:.5,f:-1}},L:"Check whether the float is real."},

{id:"status",r:0,a:"Reporting",t:"End-of-day status",x:"Your boss wants a status by end of day. The truth: the RFI is fixed, storm prep is done, the shield wall is half a day behind, and you found misrouted RFIs.",o:[
{t:"Report it exactly as it is",p:.9,g:"good",n:"Accurate and clean.",ok:{x:"Karen replies: \"Thanks, keep pushing on the shield wall.\"",e:{b:1}},no:{x:"Karen asks for more detail on the half day.",e:{}}},
{t:"Round it to \"on track\", you'll catch up",p:.5,g:"wrong",n:"\"On track\" is a claim, not a fact.",ok:{x:"You catch up. Nobody knows.",e:{}},no:{x:"You don't catch up. Karen finds out from the scheduler.",e:{b:-2,w:1}}},
{t:"Report it as it is and flag the misrouted RFIs as a systemic risk",p:.85,g:"best",n:"A straight status gets you trusted. A systemic flag gets you noticed.",ok:{x:"Karen takes your list to the area managers. An audit finds 34 misrouted RFIs project-wide.",e:{b:2,en:1,w:-3}},no:{x:"Karen thanks you but it waits a week.",e:{b:1}}}],
idle:{x:"You missed the status. Karen heard about the half day from someone else.",e:{b:-1}},L:"Report the system, not just the symptom."},

{id:"talks",r:0,a:"Safety",t:"Skipped safety talks",x:"A young labourer tells you quietly that his foreman has been skipping pre-task safety talks to save time.",o:[
{t:"Talk to the foreman directly",p:.65,g:"good",n:"Direct, but he'll know someone talked.",ok:{x:"Rick admits it and starts running them.",e:{s:1}},no:{x:"Rick denies it and wonders who told you.",e:{f:-1}}},
{t:"Report it to safety",p:.7,g:"good",n:"By the book. Protects you, may not fix the cause.",ok:{x:"Safety audits the crew. The talks restart.",e:{s:1,f:-1}},no:{x:"The audit lands heavy and the crew blames the new kid.",e:{f:-2}}},
{t:"Show up unannounced at tomorrow's pre-task talk",p:.85,g:"best",n:"Seeing it yourself protects the person who told you, and finds the pressure behind it.",ok:{x:"There is no talk. You run one yourself. Afterwards Rick says, \"We're behind and the boss is on me.\" Now you know the real problem.",e:{s:2,f:1}},no:{x:"Rick happens to run one that day. You'll need to come back.",e:{}}}],
idle:{x:"Nothing was done. A week later a crew member is hurt on an icy ladder that a talk would have covered.",e:{s:-2,f:-1}},L:"When someone cuts a corner, look for the pressure that made it look reasonable."},

{id:"scaffold",r:0,a:"Safety",t:"Untagged scaffold",x:"The scaffold contractor says a platform is ready, but there's no inspection tag. Your crew is waiting and the pour is on the critical path.",o:[
{t:"Let them climb, the contractor says it's fine",p:.6,g:"wrong",n:"No tag means no inspection.",ok:{x:"Nothing happens.",e:{}},no:{x:"A loose toe board sends a bucket of tie wire down onto the deck. Nobody hit, but safety shuts the area.",e:{s:-2,d:1}}},
{t:"Stop and get it inspected, about two hours",p:.9,g:"good",n:"Correct. Costs time.",ok:{x:"Inspected and tagged. The pour starts two hours late.",e:{d:.2}},no:{x:"The inspector is tied up until afternoon.",e:{d:.5}}},
{t:"Inspect it yourself and sign the tag (you're qualified)",p:.85,g:"best",n:"Fast and legitimate, if you're qualified. Your name is now on it, so add a re-inspect rule for modifications.",ok:{x:"You find a loose toe board, get it fixed, sign the tag. Twenty minutes late, not two hours.",e:{f:1,s:1}},no:{x:"A week later someone moves a brace. The tag still says you inspected it.",e:{s:-1}}}],
idle:{x:"The crew climbed it untagged while you were busy.",e:{s:-1}},L:"A signature fixes today. A process fixes next week."},

{id:"water",r:0,a:"Concrete",t:"Water in the truck",x:"A crew wants to add water to a concrete truck because the slump is low. The ticket shows 80 minutes on site.",o:[
{t:"Allow it, the slump is too low to place",p:.35,g:"wrong",n:"Water raises the water-cement ratio and drops strength.",ok:{x:"Cylinders pass, barely.",e:{}},no:{x:"Low breaks at 28 days. Cores and a disposition.",e:{d:2,c:.2,en:-2}}},
{t:"Reject the truck",p:.85,g:"good",n:"Safe, if you already know the limits.",ok:{x:"The next truck places fine.",e:{}},no:{x:"The gap causes a cold joint risk; the crew scrambles.",e:{d:.3}}},
{t:"Check the mix design's allowable water and the batch time first",p:.9,g:"best",n:"The clock starts at batching, not arrival. It was 110 minutes old.",ok:{x:"Batched 30 minutes before arrival: 110 minutes, past the spec. Rejected with a reason on the ticket.",e:{en:1}},no:{x:"Within limits. One permitted addition, recorded on the ticket.",e:{}}}],
idle:{x:"The crew added water. Low breaks followed.",e:{d:1.5,c:.15,en:-1}},L:"The clock starts at batching."},

{id:"frozen",r:0,a:"Safety",t:"Scaffold on frozen ground",x:"A scaffold inspector red-tags a scaffold because its base plates sit on frozen ground. It's minus 15 and will stay frozen for months.",o:[
{t:"Accept it, frozen ground is solid",p:.5,g:"wrong",n:"Frozen ground isn't permanent ground. One heater or a sunny week softens it.",ok:{x:"Holds through winter.",e:{}},no:{x:"A heater enclosure thaws the ground under one leg. The scaffold settles and is shut.",e:{s:-2,d:1}}},
{t:"Add mud sills on cleared, level ground",p:.95,g:"best",n:"Spreads the load so a soft spot isn't a collapse. Add a spring-thaw check.",ok:{x:"Sills in by noon. Tag goes green.",e:{s:1}},no:{x:"Sills in, but placed on ice. The inspector makes you redo it.",e:{d:.2}}},
{t:"Move the scaffold",p:.7,g:"weak",n:"Moving it doesn't fix the cause.",ok:{x:"Rebuilt on the slab.",e:{d:.5}},no:{x:"Two days of rework for the same problem in a new spot.",e:{d:1.5}}}],
idle:{x:"The red tag sat, and the crew lost the scaffold for a week.",e:{d:1}},L:"Design for the thaw."},

{id:"wind",r:0,a:"Lifting",t:"Operator refuses a lift",x:"A crane operator refuses a lift, saying the wind feels too strong. The anemometer reads 30 km/h, under the 50 limit.",o:[
{t:"Tell him the reading is fine, proceed",p:.5,g:"wrong",n:"The operator has the final say on a lift.",ok:{x:"He lifts, unhappy. Fine.",e:{f:-2}},no:{x:"A gust swings the panel into a column. No one hurt; a stop-work follows.",e:{s:-3,d:2,f:-2}}},
{t:"Back his call and stop the lift, then debrief",p:.95,g:"best",n:"Backing him publicly makes the next operator speak up too.",ok:{x:"The engineer checks: that panel's sail area gives it a 35 km/h limit. He was right. The lift plan gets fixed.",e:{s:2,f:2}},no:{x:"The wind drops in an hour. You lose an hour.",e:{f:1,d:.2}}},
{t:"Check the load's sail area and gust readings, then decide",p:.75,g:"good",n:"Good engineering, but stop first and analyse second.",ok:{x:"Gusts are at 48. You stop.",e:{s:1}},no:{x:"While you're checking, the crew starts rigging anyway.",e:{s:-1}}}],
idle:{x:"Nobody answered the operator. He waited three hours.",e:{d:.5,f:-1}},L:"The person closest to the risk gets the stop call."},

{id:"thermal",r:0,a:"Concrete",t:"Mass pour temperature gap",x:"A two-metre slab's core is at 72 °C and its surface at 30. The thermal control plan limit is a 20 degree difference.",o:[
{t:"Add insulation blankets to the surface",p:.85,g:"best",n:"Close the gap by keeping the surface warm, never by cooling it.",ok:{x:"The gap closes to 17 within six hours.",e:{en:1}},no:{x:"Not enough on its own; you tent it with heaters too. Holds.",e:{c:.05}}},
{t:"Spray cold water on the surface",p:.15,g:"wrong",n:"Cooling the surface widens the gap and cracks it.",ok:{x:"Somehow no cracks. Engineering is furious anyway.",e:{en:-1}},no:{x:"Thermal cracking across the slab. Epoxy injection and a disposition.",e:{d:3,c:.4,en:-2}}},
{t:"Call the engineer of record and wait",p:.65,g:"good",n:"Right person, but act on the obvious step while you wait.",ok:{x:"The engineer says insulate.",e:{}},no:{x:"Two hours waiting. Minor surface cracking.",e:{d:.5,en:-1}}}],
idle:{x:"Nobody watched the thermocouples. The slab cracked.",e:{d:2,c:.3,en:-1}},L:"Control the gap, not the temperature."},

{id:"lockout",r:0,a:"Safety",t:"A lockout with no lock",x:"An electrician says the motor control centre is locked out and ready. You look at the breaker. There's a tag on it, but no lock, and the panel door doesn't latch.",o:[
{t:"Have him apply his own lock and do a try-start before anyone touches it",p:.9,g:"best",n:"A tag is a note. A personal lock and a test are proof.",ok:{x:"The try-start hums. The breaker was the wrong one; the labels were swapped in a retrofit. Nobody was in the cabinet yet.",e:{s:2,f:1}},no:{x:"Everything checks out. Fifteen minutes spent, and the crew sees what a real lockout looks like.",e:{s:1}}},
{t:"Trust him, he's been doing this twenty years",p:.5,g:"wrong",n:"Experience is not isolation.",ok:{x:"It was the right breaker. This time.",e:{}},no:{x:"A labourer gets a jolt from a mislabelled circuit. He's fine. The stand-down lasts three days.",e:{s:-3,d:1,r:-1}}},
{t:"Stop the job and call the electrical supervisor",p:.75,g:"good",n:"Safe, but you could have asked for the lock yourself.",ok:{x:"The supervisor finds the swapped labels.",e:{s:1,d:.2}},no:{x:"He's at the other unit. Two hours of waiting.",e:{d:.4}}}],
idle:{x:"Nobody checked the lock. A worker was shocked from a mislabelled breaker.",e:{s:-3,d:1}},L:"Your lock, your life."},

{id:"ties",r:0,a:"Concrete",t:"Form ties spaced wide",x:"The carpenters spaced the form ties at 900 mm instead of the 600 on the drawing. It saves half a day. The pour is tomorrow morning.",o:[
{t:"Have them add the missing ties before the pour",p:.85,g:"best",n:"Formwork is designed for a pressure. The drawing isn't a suggestion.",ok:{x:"Overtime tonight, pour on time. Nobody argues the next time the drawing says 600.",e:{c:.03,en:1}},no:{x:"The ties go in but the pour slips to the afternoon.",e:{d:.3}}},
{t:"Ask the formwork engineer if 900 is acceptable",p:.7,g:"good",n:"Reasonable, if you get an answer in writing before the trucks arrive.",ok:{x:"She runs the numbers: fine at a slower pour rate. You get it in writing.",e:{en:1}},no:{x:"No answer by morning. You pour slowly and nervously.",e:{d:.3}}},
{t:"Pour with extra bracing outside",p:.4,g:"wrong",n:"Outside bracing doesn't stop the panels bowing between ties.",ok:{x:"The wall comes out straight. Lucky.",e:{}},no:{x:"A panel bows 40 mm. The wall is out of tolerance and needs grinding and a disposition.",e:{d:2,c:.2,en:-1}}}],
idle:{x:"Nobody looked. The wall bulged between the ties.",e:{d:1.5,c:.15,en:-1}},L:"The drawing is the design."},

{id:"void",r:0,a:"Lifting",t:"A void under the crane pad",x:"Ground radar shows a possible void under where the mobile crane's outrigger will sit tomorrow. An old drawing shows a backfilled utility trench there in 1987.",o:[
{t:"Dig a test pit to see what's there before the crane arrives",p:.85,g:"best",n:"An hour with an excavator answers it.",ok:{x:"Loose, wet backfill a metre down. It's dug out and replaced with compacted gravel. The lift goes ahead in the afternoon.",e:{s:1,en:1,d:.2}},no:{x:"Solid ground. An hour spent, and you sleep tonight.",e:{d:.1}}},
{t:"Use bigger crane mats and go ahead",p:.6,g:"weak",n:"Bigger mats spread load. They don't bridge a hole.",ok:{x:"The mats hold.",e:{}},no:{x:"An outrigger settles 60 mm during setup. The operator stops before the lift. Lucky.",e:{s:-2,d:1}}},
{t:"Move the crane setup three metres",p:.75,g:"good",n:"Avoids the unknown, at the cost of a longer reach.",ok:{x:"The lift plan is re-run at the new radius. Fine.",e:{d:.3}},no:{x:"At the new radius the crane is near its chart limit. A bigger crane is ordered.",e:{d:1,c:.1}}}],
idle:{x:"Nobody looked into the radar result. An outrigger sank during setup.",e:{s:-2,d:1}},L:"Find out what's under you."},

{id:"survey",r:0,a:"Engineering",t:"Two surveys, 30 mm apart",x:"Two survey crews set out the anchor bolts for a pump foundation and disagree by 30 mm. The tolerance is 5.",o:[
{t:"Get an independent check from the primary control points",p:.9,g:"best",n:"When two measurements disagree, the answer is a third, from a known reference.",ok:{x:"Crew B used a control point that was bumped by a loader last month. The point is re-established and three other layouts are checked.",e:{en:2,w:-1}},no:{x:"Crew A was right. Half a day lost, but you know why.",e:{en:1,d:.2}}},
{t:"Split the difference",p:.1,g:"wrong",n:"An average of a right answer and a wrong one is wrong.",ok:{x:"It lands in tolerance by luck.",e:{}},no:{x:"The pump doesn't fit. Cored-out anchors and epoxy.",e:{d:2,c:.2,en:-2}}},
{t:"Go with the senior crew",p:.55,g:"weak",n:"Seniority is not a survey method.",ok:{x:"The senior crew was right.",e:{}},no:{x:"The senior crew was the one off the bumped point.",e:{d:2,c:.15,en:-1}}}],
idle:{x:"The disagreement sat. Someone picked a layout and the pump didn't fit.",e:{d:2,c:.15}},L:"Go back to the reference."},

{id:"hotwork",r:0,a:"Safety",t:"Welding with no fire watch",x:"A welder is about to strike an arc a metre from foam insulation. The fire watch went for a coffee. \"Two minutes of tacking,\" he says.",o:[
{t:"Stop him until the fire watch is back",p:.95,g:"best",n:"Two minutes is how long a foam fire takes to get away from you.",ok:{x:"Ten minutes later the fire watch is back with a coffee and an extinguisher. Tacking goes ahead.",e:{s:1,d:0}},no:{x:"The fire watch takes forty minutes. The welder sulks.",e:{f:-1,d:.1}}},
{t:"Let him, it's only tacking",p:.55,g:"wrong",n:"Sparks don't know it's only tacking.",ok:{x:"Nothing catches.",e:{}},no:{x:"The foam smoulders behind the board. Found an hour later by the smell. Evacuation and a fire report.",e:{s:-3,d:1,r:-1}}},
{t:"Stand fire watch yourself",p:.75,g:"good",n:"Works if you're trained and you stay for the 30 minutes after.",ok:{x:"You watch, you wait the half hour, you sign the permit.",e:{s:1,f:1}},no:{x:"You get called away at minute twenty.",e:{s:-1}}}],
idle:{x:"The welder went ahead alone. Foam smouldered behind a board for an hour.",e:{s:-2,d:.5}},L:"Fire watch covers the half hour after, too."},

{id:"pumpline",r:0,a:"Lifting",t:"Concrete pump near a power line",x:"The concrete pump truck has to set up closer to a 25 kV line than the plan showed. The operator thinks he can keep the boom clear.",o:[
{t:"Reposition and post a dedicated spotter with a marked limit of approach",p:.9,g:"best",n:"Distance first, then a person whose only job is watching it.",ok:{x:"The truck moves eight metres. Longer boom reach, slower pour, nobody near the line.",e:{s:2,d:.2}},no:{x:"The new spot needs a bigger pump. Half a day lost.",e:{d:.5,s:1}}},
{t:"Ask the utility to de-energize the line",p:.8,g:"good",n:"Safest, slowest.",ok:{x:"The utility shuts it down for Saturday. You pour then.",e:{d:1,s:1}},no:{x:"The utility needs three weeks' notice.",e:{d:2}}},
{t:"Trust the operator",p:.6,g:"wrong",n:"Booms swing, and electricity jumps the gap.",ok:{x:"He keeps it clear.",e:{}},no:{x:"A gust swings the boom within arcing distance. The line trips. Nobody hurt, by a metre.",e:{s:-4,d:1,r:-2}}}],
idle:{x:"No one decided. The pump set up close to the line and the boom swung near it.",e:{s:-3,d:.5}},L:"Distance is the only real protection."},

{id:"trench",r:0,a:"Geotech",t:"Trench walls after rain",x:"Overnight rain, and the walls of the cooling water trench are sloughing. The pipe crew wants to finish one tie-in down there this morning.",o:[
{t:"Have a competent person re-inspect, and drop in a trench box before anyone enters",p:.9,g:"best",n:"Rain changes the soil. The inspection has to happen again.",ok:{x:"The box goes in by ten. The tie-in is done by three.",e:{s:2,d:.2}},no:{x:"The box is on another job until tomorrow. A day lost.",e:{d:1,s:1}}},
{t:"Do the tie-in fast, with one man down and one watching",p:.35,g:"wrong",n:"A wall collapse takes seconds. Watching doesn't help.",ok:{x:"Done in an hour. Nothing moves.",e:{}},no:{x:"A section of wall slides in. He's waist-deep and dug out unhurt. Stop-work and a regulator visit.",e:{s:-4,r:-2,d:2}}},
{t:"Pump out the water and bench the walls back",p:.75,g:"good",n:"Benching works. It takes most of the day.",ok:{x:"Benched and dry by late afternoon.",e:{d:.6,s:1}},no:{x:"The benching undermines the road. More work.",e:{d:1.2}}}],
idle:{x:"The crew went in anyway. A wall slid.",e:{s:-3,d:1}},L:"Every rain resets the inspection."},

{id:"newhire",r:0,a:"People",t:"A first-week hire alone on nights",x:"The night shift schedule has a three-day hire as the only fire watch on the turbine deck. He's keen. He's never seen a hot work permit.",o:[
{t:"Pair him with an experienced watch for his first two weeks",p:.9,g:"best",n:"New people learn the job from someone who knows it, not from the first emergency.",ok:{x:"Second night, his partner shows him a smouldering rag behind a weld. He never forgets it.",e:{s:2,f:1,c:.02}},no:{x:"Two quiet weeks. He knows the job now.",e:{s:1,c:.02}}},
{t:"Keep the schedule, he passed the course",p:.45,g:"wrong",n:"A course teaches the words. A shift teaches the job.",ok:{x:"Quiet night.",e:{}},no:{x:"He doesn't recognise smouldering insulation until it flames. Put out, and reported.",e:{s:-3,r:-1}}},
{t:"Cancel hot work on nights until you have someone experienced",p:.85,g:"good",n:"Safe; costs the night shift's output.",ok:{x:"Night shift does cold work for a week.",e:{d:.5}},no:{x:"A night weld was on the critical path.",e:{d:1}}}],
idle:{x:"Nobody noticed the schedule. The new hire was alone the night something caught.",e:{s:-2}},L:"People learn the job from people."},

// ----- Strange days at Kestrel Point -----
{id:"rink",r:2,a:"Comms",t:"A hockey rink on the frozen cove",x:"Crews have flooded a rink on the frozen cove for the Kestrel Cup, site versus town. A national broadcaster wants to film it. Nobody has measured the ice.",o:[
{t:"Measure the ice, set a crowd limit, book the town arena as a backup, and let comms run the broadcast",p:.85,g:"best",n:"Say yes to the good story and engineer the risk out of it.",ok:{x:"34 cm of clear ice, a 200-person limit, marshals on the shoreline. Lorraine from the rebar crew scores the tying goal on live TV. The town asks for a rematch.",e:{f:2,cm:3,s:1}},no:{x:"A thaw the week before. The game moves to the town arena. Still sold out.",e:{f:1,cm:2}}},
{t:"Move it to the town arena from the start",p:1,g:"good",n:"Safe and fine, and a little less magic.",ok:{x:"A good night in a warm arena.",e:{f:1,cm:1}}},
{t:"Let them play on the cove, it's been cold for weeks",p:.5,g:"wrong",n:"Cold weeks don't measure ice. Inlets and currents keep it thin.",ok:{x:"It holds. Great footage.",e:{cm:2}},no:{x:"A defenceman goes through to the knee near the inlet. Pulled out laughing. The clip runs on the evening news.",e:{s:-2,cm:-2}}}],
idle:{x:"Nobody owned it. They played on the cove anyway, unmeasured.",e:{s:-1}},L:"Measure the ice before you sell the tickets."},

{id:"samurai",r:2,a:"Comms",t:"A crane ride in a samurai helmet",x:"A Japanese TV crew is filming a feature on the build. Their presenter wants to ride the tower crane hook wearing a samurai helmet over her hard hat.",o:[
{t:"No stunt. Offer filming of safe trades, with comms co-funding the segment for the right to fact-check it and pick the scenes",p:.85,g:"best",n:"Say yes to the story, no to the stunt, and get something for your money.",ok:{x:"The presenter learns to tie rebar in the helmet. The episode is a hit in Japan, and every fact in it is right.",e:{cm:3,s:1,c:.05}},no:{x:"One scene runs that comms didn't love, but the contract held on the facts.",e:{cm:1}}},
{t:"Decline the crew entirely",p:1,g:"good",n:"Safe, and a missed story.",ok:{x:"They film the lake instead.",e:{}}},
{t:"Let her ride the hook, she's signed a waiver",p:.6,g:"wrong",n:"A waiver doesn't change what happens if the load swings. Riding a hook is not a thing people do.",ok:{x:"Great footage. The safety department sees it on YouTube.",e:{s:-2,r:-1,cm:1}},no:{x:"The wind picks up mid-ride. She's lowered fast and shaken. Stop-work.",e:{s:-3,cm:-2,d:1}}}],
idle:{x:"The crew went to the contractor directly and got a slightly worse stunt.",e:{s:-1,cm:-1}},L:"Yes to the story, no to the stunt."},

{id:"ruby",r:3,a:"Culture",t:"A crayon letter from Ruby",x:"An eight-year-old named Ruby writes in crayon. Her grandpa built the old station in the 1970s. He's in hospice now and can't travel. She asks if he can see the new one.",o:[
{t:"Bring the inspection robots to him, with the family deciding everything: who comes, what's filmed, whether anyone hears about it",p:.9,g:"best",n:"Bring the site to him, and let the family own the moment.",ok:{x:"The crawler team runs a robot through a mock-up pipe on his bedside table. He asks sharp questions about weld prep. The crews name the crawler Grandpa Frank, with the family's blessing.",e:{f:3}},no:{x:"He's too tired that day. They come back the next week. It's quieter, and still lovely.",e:{f:2}}},
{t:"Send a signed photo book of the build",p:1,g:"good",n:"Kind, and it misses what she asked for.",ok:{x:"Ruby writes back to say thank you, in green crayon this time.",e:{f:1}}},
{t:"Pitch it to the press first, it's a great story",p:.5,g:"wrong",n:"It's their moment, not your headline. Family consent comes first.",ok:{x:"The story runs. The family is gracious about it.",e:{cm:1}},no:{x:"The family hears about it from a reporter.",e:{cm:-2,f:-2}}}],
idle:{x:"The letter sat in a pile on someone's desk for a month.",e:{f:-1}},L:"The family decides everything."},

{id:"chimes",r:2,a:"Environment",t:"Wind chimes on the intake",x:"A local artist wants to hang a hundred brass chimes on the cooling water intake structure, \"so the lake can hear the plant breathe.\"",o:[
{t:"Explain why nothing can hang on the intake, then work with her: chimes on the old pier, driven by live plant output",p:.8,g:"best",n:"Explain the no, then find the yes.",ok:{x:"The piece is called \"Load\". The chimes ring louder as the units ramp up. People drive out to hear the first synchronization.",e:{cm:3,r:1}},no:{x:"The pier needs repairs first. It takes a year, and it's worth it.",e:{cm:1,c:.1}}},
{t:"Decline politely",p:1,g:"good",n:"Correct, and nobody learns why.",ok:{x:"She hangs them on her own porch, facing the site.",e:{}}},
{t:"Approve it on the intake, it's only brass",p:.3,g:"wrong",n:"Anything on an intake can end up in the screens. Foreign material is foreign material.",ok:{x:"Lovely, until the regulator asks.",e:{r:-2}},no:{x:"An ice storm drops eleven chimes into the forebay.",e:{r:-3,d:1}}}],
idle:{x:"Nobody answered. She hung three on the fence anyway.",e:{cm:-1}},L:"Explain the no, then find the yes."},

{id:"capsule",r:3,a:"Culture",t:"A letter in the 1972 time capsule",x:"The old station's time capsule is opened at the admin building. Inside is a sealed letter marked \"for the construction manager only.\"",o:[
{t:"Read it privately first, then read it out at the all-hands, and check anything it warns about",p:.85,g:"best",n:"Respect the writer, then share it, and treat any warning as a constraint.",ok:{x:"The 1972 construction manager apologizes for a cracked drain line buried under the east lot. Excavation finds it, exactly where he said. Fixed before your foundations reach it.",e:{en:2,f:2,d:-.5}},no:{x:"It's a lovely letter about the crews. The room goes quiet. The drain line was fine.",e:{f:2}}},
{t:"Read it aloud, unopened, at the ceremony",p:.55,g:"weak",n:"Generous, and risky if it says something hard about someone's grandfather.",ok:{x:"It's charming.",e:{f:1}},no:{x:"It names a man's mistake, in front of his grandson.",e:{f:-1,cm:-1}}},
{t:"File it unread with the records",p:1,g:"wrong",n:"Someone wrote it for you for a reason.",ok:{x:"The drain line cracks under your new foundation in year nine.",e:{d:3,c:1}}}],
idle:{x:"The letter went into a records box.",e:{d:1}},L:"Old letters can carry real constraints."},

{id:"wolf",r:1,a:"Environment",t:"A wolf at the north gate",x:"A lone timber wolf has started crossing the site at dawn. The crews love it. Someone has started leaving it sandwiches.",o:[
{t:"Leave it alone: no feeding, food waste locked away, a biologist on call, and let comms run Wolf Watch",p:.85,g:"best",n:"Keep wild things wild, and make it a story you can be proud of.",ok:{x:"It keeps its distance and moves on in spring. The Wolf Watch sightings board is the most-read thing on the intranet.",e:{f:2,cm:2,s:1}},no:{x:"It lingers into the summer, but it never gets bold.",e:{f:1,cm:1}}},
{t:"Ask the ministry to relocate it",p:.6,g:"good",n:"Reasonable, and wolves don't relocate well.",ok:{x:"It's moved north without trouble.",e:{}},no:{x:"It comes back in a week.",e:{f:-1}}},
{t:"It's friendly, let the crews feed it",p:.4,g:"wrong",n:"A fed wolf is a habituated wolf, and that ends badly for the wolf.",ok:{x:"It stays shy, by luck.",e:{}},no:{x:"It gets bold around the lunch trailers. The ministry has to step in. Nobody is happy.",e:{f:-2,cm:-2,s:-1}}}],
idle:{x:"The sandwiches kept coming.",e:{s:-1}},L:"Keep wild things wild."},

{id:"telescope",r:2,a:"Culture",t:"A telescope on the turbine hall",x:"A retired astronaut who lives nearby wants to mount a public telescope on the turbine hall roof. \"Best dark sky on the lake.\"",o:[
{t:"Find a better site outside the protected area and help the town apply to be a dark sky preserve",p:.8,g:"best",n:"Find the yes outside the fence.",ok:{x:"The observatory goes on the old pier road. School groups come every Friday. The site switches to shielded lighting to help.",e:{cm:3,f:1,c:.2}},no:{x:"The preserve takes three years. The observatory opens anyway.",e:{cm:2,c:.2}}},
{t:"Decline, it's a security zone",p:1,g:"good",n:"Correct, and an easy chance missed.",ok:{x:"She writes a disappointed op-ed. Gently.",e:{cm:-1}}},
{t:"Approve the roof, she's an astronaut",p:.3,g:"wrong",n:"Public access to the nuclear island is not a favour you can grant.",ok:{x:"Security catches it at the planning stage.",e:{r:-1}},no:{x:"The first public night becomes a security incident report.",e:{r:-3,cm:-2}}}],
idle:{x:"Nobody answered her. She asked the newspaper why.",e:{cm:-1}},L:"Find the yes outside the fence."},

{id:"chef",r:1,a:"People",t:"The catering is terrible",x:"The site catering is so bad crews drive 20 minutes for lunch. A Montreal chef who grew up nearby offers a pop-up. The catering contract has two years left.",o:[
{t:"Use the contract's performance clause, then re-tender with a family-recipe night and a $5.50 shift plate",p:.8,g:"best",n:"Your contract already has the lever. Pull it, and design the fix with the crews.",ok:{x:"The new caterer runs a recipe night each month. Lunch breaks get shorter because nobody leaves site.",e:{f:3,d:-.3}},no:{x:"The tender takes four months, but the clause gets an immediate improvement.",e:{f:1}}},
{t:"Allow the pop-up alongside the contract",p:.6,g:"weak",n:"Popular, and probably a breach of the exclusivity clause.",ok:{x:"Crews love it.",e:{f:2}},no:{x:"The caterer files a claim.",e:{f:1,c:.2}}},
{t:"Lunch isn't your problem",p:1,g:"wrong",n:"Forty minutes of driving per lunch, times 2,000 people, is a schedule problem.",ok:{x:"The drive-thru line grows.",e:{f:-2,d:.5}}}],
idle:{x:"Nothing changed. The drive-thru line grew.",e:{f:-1,d:.3}},L:"Your contracts already have levers."},

{id:"ballast",r:1,a:"Security",t:"The VP and the security dog",x:"A visiting vice-president tripped over Ballast, the security dog, asleep in the lobby where he always sleeps. The VP wants the dog gone.",o:[
{t:"Back the handler: Ballast stays, and the VP is politely asked to watch where he walks",p:.75,g:"best",n:"Some trade-offs are worth making on purpose, as long as you know you're making them.",ok:{x:"The VP laughs it off the next visit and brings a dog treat. The crews notice who backed whom.",e:{f:2,b:-1}},no:{x:"The VP doesn't laugh it off. You knew that was possible.",e:{f:2,b:-2}}},
{t:"Move Ballast to the gatehouse",p:1,g:"good",n:"A sensible compromise.",ok:{x:"Ballast sulks for a week, then likes the gatehouse.",e:{}}},
{t:"Retire Ballast early",p:1,g:"wrong",n:"Punishing the dog for a person's trip tells everyone what matters here.",ok:{x:"The handler requests a transfer.",e:{f:-3}}}],
idle:{x:"The VP raised it with your boss instead.",e:{b:-1}},L:"Make the trade-off on purpose."},

{id:"borehole",r:2,a:"Geotech",t:"A free borehole under the dry storage pad",x:"University geologists want to drill a research borehole exactly where the spent fuel dry storage pad will go. Free data, if you want it.",o:[
{t:"Approve it, with nuclear-grade documentation from the first metre",p:.85,g:"best",n:"Free information is only free if you can use it later. Paperwork makes it usable.",ok:{x:"Soft clay at nine metres that the original survey missed. The pad design changes on paper, not in concrete.",e:{en:2,c:-1,d:-.5}},no:{x:"Clean rock all the way down. The documented log becomes part of the licence submission.",e:{en:1,r:1}}},
{t:"Decline, nobody drills on a nuclear pad",p:1,g:"weak",n:"Safe, and you just turned down information you needed.",ok:{x:"The clay is found during excavation instead.",e:{d:2,c:1}}},
{t:"Approve it informally, it's research",p:.5,g:"wrong",n:"Undocumented data can't support a safety case.",ok:{x:"Useful core, useless paperwork.",e:{en:-1}},no:{x:"The regulator asks why there's an unrecorded hole under the pad.",e:{r:-2,d:1}}}],
idle:{x:"The university drilled at the edge of the pad without a plan.",e:{r:-1}},L:"Free information still needs paperwork."},

{id:"origami",r:0,a:"Safety",t:"Paper cranes everywhere",x:"Folded paper cranes keep appearing around site: on desks, in lunchrooms, in the switchgear room. This morning one was sitting on a live bus bar.",o:[
{t:"Find out who's folding them and why, then allow them in lunchrooms and outside the protected area only",p:.85,g:"best",n:"Find out why before you ban it.",ok:{x:"It's Hiroshi, an electrician folding a thousand cranes for his late mother. He gets the lunchroom wall. Nothing goes near equipment again.",e:{f:3,s:1}},no:{x:"Nobody owns up, but the cranes move to the lunchrooms.",e:{f:1,s:1}}},
{t:"Ban them site-wide",p:1,g:"good",n:"Safe, and a little cold.",ok:{x:"The cranes stop. Someone is quietly sad about it.",e:{f:-1,s:1}}},
{t:"Leave them, they're only paper",p:.5,g:"wrong",n:"Paper on a bus bar is fuel next to an arc.",ok:{x:"Nothing happens.",e:{}},no:{x:"A crane scorches on a hot connection. Smoke, a trip and a fire report.",e:{s:-3,d:.5}}}],
idle:{x:"More cranes appeared in the switchgear room.",e:{s:-1}},L:"Find out why before you ban it."},

{id:"hum",r:3,a:"Comms",t:"The Kestrel Hum",x:"Residents say a low 40 Hz hum comes from the site on calm nights. Some can't sleep. A local group has a theory involving secret weapons.",o:[
{t:"Bring in acoustic specialists, pay to move the people it's hurting while you find it, and invite the theory group on the walk-down",p:.8,g:"best",n:"Find the source, look after the people, and let the doubters watch you look.",ok:{x:"Open roof ducts on the turbine hall were acting as organ pipes in the lake breeze. Baffles fix it. The group's leader joins the community panel.",e:{cm:3,c:.3,r:1}},no:{x:"It takes two months to find. The hotel bills add up, and nobody calls it a cover-up.",e:{cm:1,c:.5}}},
{t:"Commission a study and wait for the report",p:.8,g:"good",n:"Right method, slow comfort.",ok:{x:"The report finds the ducts in six weeks.",e:{cm:1}},no:{x:"Twelve weeks, and two angry town meetings.",e:{cm:-1}}},
{t:"Deny it. Nothing on site runs at 40 Hz.",p:.2,g:"wrong",n:"The people hearing it aren't imagining it. Denial makes every theory sound better.",ok:{x:"It stops on its own.",e:{}},no:{x:"\"Nuclear Site Denies Mystery Hum.\" The theory group triples.",e:{cm:-4}}}],
idle:{x:"Nobody answered the complaints. The hum got its own website.",e:{cm:-2}},L:"Let the doubters watch you look."},

{id:"schooner",r:1,a:"Heritage",cwa:"tb",t:"A schooner under the turbine hall",x:"Excavation for the turbine hall uncovers the timbers of the Margaret Ellis, a schooner lost in an 1880s storm. There may be human remains.",o:[
{t:"Stop that area, follow the heritage process to the letter, return any remains to the family, and put up a plaque",p:.85,g:"best",n:"Old things in the ground are constraints too. Treat them with the same care.",ok:{x:"Archaeologists finish in six weeks. The captain's great-great-granddaughter unveils the plaque.",e:{d:1.5,cm:3,r:1}},no:{x:"It takes ten weeks. Still the right call.",e:{d:2.5,cm:2,r:1}}},
{t:"Record it quickly and dig around the timbers",p:.5,g:"weak",n:"Faster, and it cuts corners on something you can't undo.",ok:{x:"Recorded, barely.",e:{d:.5}},no:{x:"A heritage officer finds the shortcut.",e:{r:-2,cm:-2,d:2}}},
{t:"Keep digging and don't tell anyone",p:.2,g:"wrong",n:"A crew of 40 saw it. Somebody will tell.",ok:{x:"Nobody talks.",e:{}},no:{x:"Somebody talks. Charges, headlines and a long stop.",e:{r:-4,cm:-4,d:6}}}],
idle:{x:"The excavator kept going until someone else stopped it.",e:{r:-2,cm:-2,d:2}},L:"Old things in the ground are constraints too."},

// ----- Field notes: everyday problems with a better way hiding in them -----
{id:"n_timesheet",r:0,a:"Reporting",t:"Nobody fills in the status form",x:"The daily status form is optional. Eleven of forty foremen filled it in last week. The schedule update is built on guesses.",o:[
{t:"Put one tap of status on the timesheet: done, partial or blocked, before the hours go in",p:.85,g:"best",n:"Attach the data you need to the one form nobody skips.",ok:{x:"Forty of forty by Friday. People make sure they get paid. The schedule updates overnight, and the blocked list is real.",e:{w:-2,en:1}},no:{x:"Two foremen complain the first week. By week three it's habit.",e:{w:-1,f:-1}}},
{t:"Remind the foremen at every toolbox talk",p:.6,g:"weak",n:"Reminders fade. The form still loses to a busy afternoon.",ok:{x:"Sixty percent for a month.",e:{w:-.5}},no:{x:"Back to eleven by spring.",e:{}}},
{t:"Make the form mandatory, with a write-up for skipping it",p:.4,g:"wrong",n:"Forced forms get filled in, not filled with the truth.",ok:{x:"Forms come in. Half are copied from yesterday.",e:{f:-1}},no:{x:"Forms come in, mostly fiction, and a grievance with them.",e:{f:-2,w:1}}}],
idle:{x:"The update ran on guesses again.",e:{w:1}},L:"Attach the data you need to something people already want to do."},

{id:"n_phones",r:0,a:"Logistics",t:"Typing up the day in the trailer",x:"Your field engineers walk paper to the trailer every evening and type it in after the crews go home. A rugged phone costs about the same as one crew-hour.",o:[
{t:"Buy rugged company phones that work with gloves on, with one screen on them: today's tasks",p:.85,g:"best",n:"A crew-hour costs more than a phone, and company devices already go through the gate.",ok:{x:"Data arrives the same afternoon. The engineers go home at five.",e:{c:.03,w:-1,f:1}},no:{x:"The first batch can't be used in gloves. The second batch works.",e:{c:.05}}},
{t:"Add a data clerk in the trailer",p:1,g:"weak",n:"Faster typing is still typing, a day late.",ok:{x:"The typing gets done sooner. It's still yesterday's news.",e:{c:.04}}},
{t:"No phones on site. That's the policy",p:1,g:"wrong",n:"The policy is about personal phones. Company devices were never the problem.",ok:{x:"Nothing changes. An hour a day goes into a keyboard.",e:{d:.3}}}],
idle:{x:"The typing went on, after hours.",e:{f:-1}},L:"A phone is cheaper than an hour of a crew."},

{id:"n_papercuts",r:0,a:"Safety",t:"Nicks and strains nobody records",x:"First aid hands out forty bandages a week. The injury log shows three. Recording one takes twenty minutes; the bandage takes thirty seconds.",o:[
{t:"Make recording a ten-second tap at the first-aid station, and look at the trend every week",p:.85,g:"best",n:"Quick to record or not recorded at all. Then the small stuff becomes a pattern you can fix.",ok:{x:"By week four, two thirds of the cuts come from one style of knife. A blade change halves them.",e:{s:2,f:1}},no:{x:"A month of noise, then a pattern: strains at the rebar laydown.",e:{s:1}}},
{t:"Remind everyone to report every injury",p:.6,g:"weak",n:"Twenty minutes of paperwork still loses to a bandage.",ok:{x:"A few more get logged.",e:{}},no:{x:"Nothing changes.",e:{}}},
{t:"They're papercuts. Focus on the serious stuff",p:1,g:"wrong",n:"Serious stuff comes first. Small hurts still happen twice for the same reason.",ok:{x:"The same cut happens three more times.",e:{s:-1}}}],
idle:{x:"The bandages kept going out unrecorded.",e:{s:-1}},L:"Small hurts are data, if recording them is quick."},

{id:"n_crew",r:0,a:"People",t:"Split the best crew?",x:"Your best concrete crew has poured together all season. The leveling plan splits them across three walls to smooth the labour histogram.",o:[
{t:"Keep them together and bring the work to them",p:.8,g:"best",n:"A crew that knows each other's hands is worth more than a smooth histogram.",ok:{x:"They pour the next three walls in the time the plan gave two.",e:{d:-.8,f:2}},no:{x:"The histogram has a lumpy month. The walls still come in early.",e:{d:-.3,f:1}}},
{t:"Split them, and make each one a crew lead",p:.6,g:"weak",n:"Sometimes it works. Usually the magic was the set.",ok:{x:"Two of three new crews come together.",e:{d:.3}},no:{x:"None of them gel in time.",e:{d:1,f:-1}}},
{t:"Follow the leveling plan. A finisher is a finisher",p:.5,g:"wrong",n:"The plan prices labour as a rate. The crew isn't a rate.",ok:{x:"It works out, slowly.",e:{}},no:{x:"Three slow crews instead of one fast one. Nobody knows why.",e:{d:1.5,f:-1}}}],
idle:{x:"The leveling plan ran on its own. The crew was split.",e:{d:1}},L:"Some people come in sets."},

{id:"n_spool",r:0,a:"Logistics",t:"Where is spool 4-118?",x:"The pipe crew is standing at the workface asking where spool 4-118 is. It takes three phone calls and forty minutes to learn it's in the yard, behind a stack of rebar.",o:[
{t:"Barcode every spool and scan it at every handoff, from the shop to the workface",p:.85,g:"best",n:"Couriers solved this decades ago. A scan at every handoff.",ok:{x:"Two weeks later the crew finds spools on their own phones. Forty minutes becomes forty seconds.",e:{c:.05,d:-.5,f:1}},no:{x:"The yard team forgets to scan for a week. Then it sticks.",e:{c:.05}}},
{t:"Give one yard hand the job of finding material for crews",p:.7,g:"good",n:"Faster, while she's on shift.",ok:{x:"Much faster, days only.",e:{c:.03,d:-.2}},no:{x:"She's off sick for a week. Back to phone calls.",e:{c:.03}}},
{t:"Tell the crew to look harder",p:1,g:"wrong",n:"A crew asking where something is, is telling you a step is missing.",ok:{x:"They do. It takes forty minutes, every time.",e:{d:.3,f:-1}}}],
idle:{x:"The crew kept phoning around.",e:{d:.3}},L:"If the crew has to ask where it is, a step is missing."},

{id:"n_video",r:0,a:"Reporting",t:"What did it look like on the 14th?",x:"The formwork sub says your crew damaged their panels on the 14th. Your crew says the panels arrived bent. There's $80,000 in the gap.",o:[
{t:"Start a 30-second phone walkthrough at every handoff, filed with the job. For this one, find any photos you can",p:.8,g:"best",n:"Thirty seconds of video settles an argument before it starts.",ok:{x:"A labourer's photo from the 14th shows the bend before your crew touched anything. The claim goes away, and the walkthroughs stick.",e:{c:-.08,en:1}},no:{x:"No photos this time. You split the cost. Next time there's video.",e:{c:.04}}},
{t:"Get written statements from both foremen",p:.5,g:"weak",n:"Two memories, two stories.",ok:{x:"The sub backs down.",e:{c:.02}},no:{x:"It goes to the claims team.",e:{c:.08}}},
{t:"Pay it to keep the peace",p:1,g:"wrong",n:"Paying teaches the next claim to come faster.",ok:{x:"Paid. The next claim arrives in a month.",e:{c:.08,f:-1}}}],
idle:{x:"The sub's claim went in unanswered.",e:{c:.06}},L:"The camera is already on site."},

{id:"n_welder",r:0,a:"People",t:"The only welder with the qual",x:"The plan shows two Class B welders all month. Thursday's job needs Dave, the only one qualified on that alloy. Dave is at his daughter's wedding until Tuesday.",o:[
{t:"Move the alloy welds to next Wednesday, and put everyone's one-of-a-kind quals and time off into the plan",p:.8,g:"best",n:"Plans count roles. Jobs need names, and weddings are known months ahead.",ok:{x:"The welds slide five days with no knock-on. Next March, two more weddings are in the plan before anyone books a crane.",e:{d:.2,w:-1}},no:{x:"The slide bumps the hydro test by two days.",e:{d:.8}}},
{t:"Borrow a qualified welder from another site",p:.6,g:"good",n:"Works if someone's free.",ok:{x:"He arrives Thursday afternoon.",e:{c:.04}},no:{x:"Nobody's free until Monday.",e:{d:.5,c:.04}}},
{t:"Ask Dave to come back early",p:.3,g:"wrong",n:"Some things the job doesn't get to have.",ok:{x:"He comes back. His daughter will remember.",e:{f:-2}},no:{x:"He doesn't. Nobody blames him.",e:{f:-1,d:.5}}}],
idle:{x:"Thursday came. Nobody could weld the alloy.",e:{d:1}},L:"Plans count roles. Jobs need names."},

{id:"n_story",r:0,a:"Reporting",t:"The same story, five times",x:"Last night's pour ran long and a pump was swapped at 03:10. This morning your foreman has to type it into the schedule update, his timesheet, an RFI, a QC record and a delay notice.",o:[
{t:"Have him tell it once, saying what it blocked, what fixed it, who owns it and when it runs out, and fill the other five from that",p:.8,g:"best",n:"Tell it once, in the right shape, and the rest are lookups.",ok:{x:"His paperwork takes ten minutes instead of seventy. A year later the claims team finds the pump swap in one search.",e:{f:2,en:1,w:-1}},no:{x:"The template takes a few weeks to settle. Then it saves an hour a day.",e:{f:1}}},
{t:"Get him a clerk to retype it",p:1,g:"weak",n:"Faster for him. Five versions still drift apart.",ok:{x:"The five versions disagree by Friday.",e:{c:.03}}},
{t:"That's the job",p:1,g:"wrong",n:"It's the job until he skips one.",ok:{x:"He skips the QC record. The audit finds the gap.",e:{f:-1,r:-1}}}],
idle:{x:"He typed it five times. Each one a little different.",e:{f:-1}},L:"Write the story once."},

{id:"n_tuesday",r:1,a:"Safety",t:"A year-long bar on the schedule",x:"The scaffold inspections are one bar on the schedule: every Tuesday for a year. Last Tuesday's got missed. A tag expires Thursday, and on Friday three crews will have no legal platform.",o:[
{t:"Break the bar into each Tuesday, each with an owner and an expiry, so a lapse shows up the day before",p:.85,g:"best",n:"A year-long bar can't be late. The Tuesday inside it can.",ok:{x:"Wednesday, the board flags a tag lapsing tomorrow. The inspector is there by seven. Nobody loses a platform again.",e:{s:2,d:-.3}},no:{x:"The expiries flag fine, but the inspector is booked. Half a day lost.",e:{s:1,d:.2}}},
{t:"Get this one inspected today and set a reminder",p:.75,g:"good",n:"Fixes the week, not the bar.",ok:{x:"Inspected by Thursday.",e:{s:1}},no:{x:"The reminder goes to someone on holiday.",e:{d:.3}}},
{t:"Let the crews work Friday. It's the same scaffold",p:.5,g:"wrong",n:"No tag, no inspection, no legal platform.",ok:{x:"Nobody notices.",e:{s:-1}},no:{x:"An inspector finds three expired tags. Stop-work.",e:{s:-3,r:-1,d:1}}}],
idle:{x:"Friday, three crews stood at the bottom of a scaffold.",e:{d:.6}},L:"A bar can't be late. The Tuesday can."},

{id:"n_february",r:1,a:"Weather",t:"Twelve pours in February",x:"The plan has twelve pours in February, based on an average February. Thirty years of weather records are free online, and so is the ten-day forecast.",o:[
{t:"Plan February on its real spread of pour days from the records, and feed the ten-day forecast into the pour and lift plans",p:.85,g:"best",n:"Plan the season's spread, not its average. The forecast is a free, live warning.",ok:{x:"The records say seven pour days in a bad February and eleven in a good one. You plan nine and stage heat for the rest. February comes in at ten.",e:{d:-1,w:-2}},no:{x:"It's the worst February in a decade. Your plan expected that.",e:{d:.3,w:-1}}},
{t:"Add two weeks of weather contingency",p:.6,g:"good",n:"Better than nothing, and blind to which weeks.",ok:{x:"It mostly covers it.",e:{w:-.5}},no:{x:"Not enough.",e:{d:1}}},
{t:"Keep twelve. February can't be that bad",p:.3,g:"wrong",n:"February has been exactly that bad, and it's on record.",ok:{x:"A mild one. Lucky.",e:{}},no:{x:"Five pour days. The rest slide to March and push the dome.",e:{d:3}}}],
idle:{x:"February ran on the average. February isn't average.",e:{d:2}},L:"Plan the spread, not the average."},

{id:"n_morning",r:1,a:"Engineering",t:"Which blocker first?",x:"Your blocker list has 140 lines, sorted by date raised. Every morning the meeting starts at line one.",o:[
{t:"Rank the list by how many crew-hours each blocker frees up, and start there every morning",p:.85,g:"best",n:"The question that moves the job: which blocker, cleared today, frees the most work?",ok:{x:"Line 87, a missing pipe support detail, was holding up four crews. It's cleared by noon.",e:{d:-1.5,f:1}},no:{x:"The ranking is rough at first. It still beats date order.",e:{d:-.5}}},
{t:"Ask the superintendent which ones matter",p:.7,g:"good",n:"He's usually right. Nobody else can see his list.",ok:{x:"He picks well most mornings.",e:{d:-.8}},no:{x:"He's off for a week. The meeting goes back to line one.",e:{}}},
{t:"Keep working top to bottom. It's fair",p:1,g:"wrong",n:"Fair to the list, not to the crews waiting on line 87.",ok:{x:"Oldest first. Four crews wait a month for line 87.",e:{d:1}}}],
idle:{x:"The meeting started at line one again.",e:{d:.6}},L:"Ask every morning what frees the most work."},

{id:"n_delegate",r:1,a:"Quality",t:"The signer is on a plane",x:"A hold point needs the QA manager's signature. She's on a flight to a conference. Nobody knows who else can sign.",o:[
{t:"Set up written delegations: from whom, to whom, for what, until when. Start with her deputy, until Friday",p:.8,g:"best",n:"Authority with a name, a scope and an end date. Holidays stop stopping work.",ok:{x:"Her deputy signs within the hour. Every manager's delegations are on file by month end.",e:{d:-.3,r:1}},no:{x:"Her deputy isn't qualified for that scope. One day lost, and now everyone knows the gaps.",e:{d:.3}}},
{t:"Call her when she lands",p:.6,g:"good",n:"Works this time.",ok:{x:"Signed by phone that evening.",e:{d:.4}},no:{x:"Her connection is delayed. A day and a half.",e:{d:1}}},
{t:"Have the field engineer initial it; she can countersign later",p:.4,g:"wrong",n:"Signing for someone isn't delegation.",ok:{x:"She countersigns. An auditor raises an eyebrow.",e:{r:-1}},no:{x:"The audit finds it.",e:{r:-3,d:2}}}],
idle:{x:"The hold point waited for the plane to land.",e:{d:.8}},L:"Authority needs a name and an end date."},

{id:"n_signatures",r:1,a:"Quality",t:"Signatures by the binder",x:"Every hold-point signature means a drive to the trailer, a binder and wet ink. Inspectors have started batching them at the end of the week.",o:[
{t:"Move hold-point sign-offs to a five-second phone signature with the inspector's identity attached for good",p:.8,g:"best",n:"Easy to give, heavy to mean.",ok:{x:"Signatures happen at the hold point, on time, each one traceable to a person forever.",e:{r:1,d:-.5,en:1}},no:{x:"The first month, two inspectors share a login. You stop that fast.",e:{r:-1}}},
{t:"Add a signing run at noon every day",p:.7,g:"good",n:"Less batching, same friction.",ok:{x:"Better.",e:{d:-.2}},no:{x:"The noon run gets skipped on busy days.",e:{}}},
{t:"Let them batch. The work's fine",p:.4,g:"wrong",n:"A signature after the fact is a story, not a check.",ok:{x:"Nothing goes wrong.",e:{}},no:{x:"A batch includes a hold point signed after the concrete covered it.",e:{r:-2,d:1}}}],
idle:{x:"The batching continued.",e:{r:-1}},L:"Easy to give, heavy to mean."},

{id:"n_assume",r:1,a:"Engineering",t:"\"The permit will renew\"",x:"The original business case assumed the discharge permit renews on time, the soil matches the borehole report, and the vendor's shop has room. Nobody has looked at those assumptions in two years.",o:[
