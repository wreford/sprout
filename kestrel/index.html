idle:{x:"The shortage hit the walls unannounced.",e:{d:4}},L:"Spend scarce material on the critical path."},

{id:"shift2",r:1,a:"People",t:"The second shift is slow",x:"Second shift installs about 40% less pipe per hour than days. Corporate wants to cut it.",o:[
{t:"Work a week of second shifts yourself and find out why",p:.85,g:"best",n:"Numbers say there's a gap. Only going there says why.",ok:{x:"Half the lighting towers are dead, the crane operator leaves at 9, and the material for nights is staged for days. Fixed in a week; nights hit 90% of days.",e:{f:2,d:-1.5,c:.2}},no:{x:"Lighting helps, but nights stay at 75%. Still worth keeping.",e:{f:1,d:-.5}}},
{t:"Cut the second shift",p:.8,g:"weak",n:"Cuts a cost and a lot of output.",ok:{x:"Payroll down. Progress down more.",e:{d:3,c:-1}},no:{x:"And the good night workers quit.",e:{d:4,c:-1,f:-2}}},
{t:"Tell the night foremen to hit the day numbers or else",p:.3,g:"wrong",n:"Pressure without a cause just finds shortcuts.",ok:{x:"Numbers rise. Rework rises faster.",e:{c:.5}},no:{x:"Two near-misses and a grievance.",e:{s:-2,f:-2}}}],
idle:{x:"Nothing changed. Corporate cut the shift anyway.",e:{d:3}},L:"Go see the shift."},

{id:"float",r:1,a:"Reporting",t:"Float that comes from nowhere",x:"Your schedule shows 30 days of float on the steam generator rooms. You dig in: someone typed a constraint date that hides the real logic.",o:[
{t:"Remove the constraint, rerun the logic and report the real float",p:.85,g:"best",n:"A schedule that hides its logic hides its risks.",ok:{x:"Real float is minus six days. Corporate is unhappy for an afternoon, then funds a recovery plan.",e:{b:1,w:-2,d:-1}},no:{x:"Corporate is unhappy for a week.",e:{b:-1,w:-2}}},
{t:"Report it as is, with a note",p:.6,g:"weak",n:"Footnotes don't get read.",ok:{x:"Nobody reads the note.",e:{}},no:{x:"The rooms go late. The note is found afterwards.",e:{b:-2,d:2}}},
{t:"Leave it, the scheduler knows what he's doing",p:.3,g:"wrong",n:"Typed-in dates are claims.",ok:{x:"The rooms happen to finish on time.",e:{}},no:{x:"The rooms are six weeks late with no warning.",e:{d:4,b:-2,w:2}}}],
idle:{x:"Nobody looked at the float.",e:{d:3,w:2}},L:"Float only counts if the logic is real."},

{id:"mockup",r:1,a:"Quality",t:"Build a mock-up?",x:"The first dome-to-wall rebar intersection is the most congested on the job. A full-scale mock-up costs $300k and three weeks.",o:[
{t:"Build the mock-up",p:.85,g:"best",n:"Practise the hard part where mistakes are cheap.",ok:{x:"The mock-up shows the couplers can't be tightened with the bars as drawn. Engineering adjusts. The real pour goes in clean.",e:{c:.3,d:-2,en:2}},no:{x:"Everything fits. Three weeks and $300k for confidence.",e:{c:.3,d:.5}}},
{t:"Skip it and work it out in place",p:.45,g:"weak",n:"In place, every mistake is permanent.",ok:{x:"The crew figures it out.",e:{}},no:{x:"The bars can't be placed as drawn. Three weeks of rework in place.",e:{d:3,c:1,en:-1}}},
{t:"Do a detailed 3D model review instead",p:.65,g:"good",n:"Catches clashes, not hands and wrenches.",ok:{x:"The model finds most of it.",e:{c:.05,en:1}},no:{x:"The model can't show the wrench swing.",e:{d:1.5}}}],
idle:{x:"No decision. The crew hit the congestion in the real wall.",e:{d:2.5,c:.8}},L:"Practise the hard part where mistakes are cheap."},

{id:"shelter",r:1,a:"People",t:"Minus 30 and no warm-up shelter",x:"The union steward says the warm-up shelters at the north end are too small and two have broken heaters. It's minus 30 with wind.",o:[
{t:"Fix it today: new heaters, two more shelters by Friday",p:.9,g:"best",n:"Cheap next to frostbite and a grievance.",ok:{x:"Shelters up by Thursday. The steward brings coffee to your next meeting.",e:{f:2,s:1,c:.15}},no:{x:"The heaters take a week to arrive. You rent temporary ones.",e:{f:1,c:.2}}},
{t:"Promise to look at it next budget cycle",p:.2,g:"wrong",n:"Cold is now. Budget is later.",ok:{x:"It warms up.",e:{f:-1}},no:{x:"Two frostbite cases and a work refusal.",e:{s:-2,f:-3,d:1}}},
{t:"Shorten work blocks to 45 minutes with more breaks",p:.75,g:"good",n:"Safe, but you lose a lot of output.",ok:{x:"Nobody gets cold. Progress slows.",e:{d:1,s:1}},no:{x:"Breaks in broken shelters don't help much.",e:{d:1,f:-1}}}],
idle:{x:"The steward filed a grievance.",e:{f:-2,s:-1}},L:"Look after the people doing the work."},

// ----- Area manager -----
{id:"greens",r:2,a:"Reporting",t:"All green, window eight months",x:"Your four leads report green, green, green, amber. The building's finish window is still eight months wide. Something doesn't add up.",o:[
{t:"Walk the building yourself this week",p:.7,g:"good",n:"Good instinct; it finds what you see, not the system's gaps.",ok:{x:"You find forty pipe spools waiting on supports that were never ordered.",e:{w:-4,f:1}},no:{x:"Everything you look at looks fine.",e:{}}},
{t:"Ask each lead to show what their green is based on",p:.85,g:"best",n:"A green that can't show its evidence is just a hope.",ok:{x:"Civil has evidence. Mechanical has a schedule. Electrical's green means \"no known blockers.\" The amber was right.",e:{w:-6,en:1}},no:{x:"Leads get defensive, but you learn enough.",e:{w:-3,f:-1}}},
{t:"Trust the reports and focus on the amber",p:.3,g:"wrong",n:"Reports are claims.",ok:{x:"The amber gets fixed.",e:{}},no:{x:"Three months later the greens turn red at once.",e:{d:8,w:4,b:-2}}}],
idle:{x:"Nobody questioned the greens. They turned red together three months later.",e:{d:6,w:3}},L:"Green only for verified constraints."},

{id:"trays",r:2,a:"Engineering",t:"One standard, a hundred clashes",x:"Jamal, your instrumentation lead, says the tray clashes aren't random. They all come from one routing standard applied to the whole building.",o:[
{t:"Take it to engineering yourself",p:.75,g:"good",n:"Works, but Jamal's work becomes your credit.",ok:{x:"Engineering revises the standard.",e:{en:1,w:-4}},no:{x:"Engineering wants Jamal's analysis anyway.",e:{w:-2}}},
{t:"Let Jamal take it to engineering, with your backing",p:.8,g:"best",n:"Bring the evidence and you get backed. Everyone watching learns that.",ok:{x:"The chief engineer says, \"He's right.\" One revision clears over a hundred clashes, including ones nobody found yet.",e:{en:2,f:1,w:-6}},no:{x:"Engineering pushes back for a month, then agrees.",e:{w:-3,d:1}}},
{t:"Fix the clashes one by one in the field",p:.5,g:"wrong",n:"Fixing symptoms forever.",ok:{x:"Forty fixed.",e:{c:1}},no:{x:"New clashes keep appearing.",e:{c:2,d:3}}}],
idle:{x:"Nobody took it forward. The clashes kept coming.",e:{c:1.5,d:2}},L:"When many problems look alike, look for the one cause."},

{id:"doug",r:2,a:"Safety",t:"Best numbers, three near-misses",x:"General foreman Doug's crews have the best production on the job and three near-misses this month. He says two were guys rushing crane hook-ups because the crane is booked tight.",o:[
{t:"Report the pattern to safety",p:.7,g:"good",n:"Correct, but it doesn't touch the crane pressure.",ok:{x:"An audit slows the hook-ups.",e:{s:1,f:-1}},no:{x:"The near-misses continue.",e:{s:-1}}},
{t:"Deal: a fixed crane window for real talks and no rushed hook-ups",p:.85,g:"best",n:"Fix the pressure behind the problem. You now own the promise.",ok:{x:"You find him two fixed hours and an hour of dead crane time for everyone. Zero near-misses for two months.",e:{s:2,f:2,d:-.5}},no:{x:"The window slips twice. Doug grumbles but holds.",e:{s:1}}},
{t:"Leave it, his numbers are good",p:.3,g:"wrong",n:"Production numbers that come with near-misses are borrowed.",ok:{x:"Nothing happens.",e:{}},no:{x:"A load drops near a crew.",e:{s:-3,d:2,r:-1}}}],
idle:{x:"Nobody acted. A fourth near-miss followed.",e:{s:-2}},L:"A deal makes you responsible for keeping it."},

{id:"falcons",r:2,a:"Environment",t:"Falcons on the tower crane",x:"Peregrine falcons, a protected species, nest on your main tower crane's counter-jib. Three eggs, eleven weeks to fledging. The crane is on the critical path.",o:[
{t:"Stop the crane for eleven weeks",p:1,g:"good",n:"Legally clean. Very expensive.",ok:{x:"Eleven weeks. The chicks fledge.",e:{d:8,c:3}}},
{t:"Run it slowly under a biologist's protocol, apply for a relocation permit, and bring comms in",p:.8,g:"best",n:"Legal, transparent, and a story you can tell.",ok:{x:"The permit is refused but your protocol becomes the model. A livestream gets 300,000 views. About nine days lost; all three chicks fledge.",e:{d:1.5,cm:3,r:1,f:1}},no:{x:"The female leaves for forty minutes in week two. You stop, she returns. Two extra weeks of stop-and-go.",e:{d:3,cm:2}}},
{t:"Quietly remove the nest",p:.3,g:"wrong",n:"A serious offence, and someone always has a phone.",ok:{x:"Nobody noticed. This time.",e:{}},no:{x:"A crane operator's video goes viral. Charges and headlines.",e:{cm:-4,r:-2,c:1}}}],
idle:{x:"No plan. The crane ran normally and the falcons abandoned the nest. The ministry opens a file.",e:{cm:-3,r:-1}},L:"Make the constraint public and it becomes an asset."},

{id:"mural",r:2,a:"Culture",t:"Overnight mural",x:"Someone painted a 60-metre mural on the pumphouse wall overnight, with real workers' faces. Unpermitted work at height. Everyone loves it. Safety is furious.",o:[
{t:"Investigate and find who did it",p:.6,g:"weak",n:"You'll find them, and the site will learn to hide things from you.",ok:{x:"Six people disciplined. The mural stays; the goodwill doesn't.",e:{f:-2,s:1}},no:{x:"Nobody talks.",e:{f:-2}}},
{t:"Amnesty if they explain how they did it, consent for every face, and a way to bring ideas first",p:.85,g:"best",n:"The amnesty gets the truth; the new idea process removes the reason to sneak.",ok:{x:"Six come forward. Proper rope access, a napkin rescue plan that's actually good. 21 of 22 workers consent; one face is repainted. Forty proposals arrive next year.",e:{f:3,cm:2,s:1}},no:{x:"They come forward. Their rigging was sketchier than hoped; you fix the process.",e:{f:2,s:-1}}},
{t:"Leave it and quietly tighten night security",p:.6,g:"weak",n:"Rewards the risk without learning anything.",ok:{x:"Nothing more happens.",e:{}},no:{x:"Next month someone paints the stair tower. At height. Alone.",e:{s:-2}}}],
idle:{x:"No response. The site took that as permission.",e:{s:-1}},L:"Give people a legitimate path and they stop sneaking."},

{id:"ghost",r:2,a:"Culture",t:"The fourth-floor ghost",x:"Night shift keeps seeing a man in old grey coveralls on the fourth floor at 3 am. Absenteeism is up 30%. Two crews refuse to work up there after midnight.",o:[
{t:"Write up anyone who refuses work without a safety reason",p:.3,g:"wrong",n:"Fear is a safety reason if people are scared at height.",ok:{x:"Grumbling stops.",e:{f:-2}},no:{x:"A grievance, and absenteeism climbs.",e:{f:-3,d:1}}},
{t:"Put cameras on the fourth floor and find out what's there",p:.9,g:"best",n:"Take it seriously and get evidence.",ok:{x:"It's Walter, a 64-year-old fire watch with nowhere to live, sleeping in the stair tower. You get him housing through the assistance program and argue to keep his job. Three more workers turn out to be living in trucks; a housing fund follows.",e:{f:3,cm:1,s:1}},no:{x:"Six quiet nights before you find him. Absenteeism keeps rising meanwhile.",e:{f:1,d:.5}}},
{t:"Hold a meeting and invite a chaplain to bless the building",p:.6,g:"weak",n:"Kind, but it doesn't find the person in the stair tower.",ok:{x:"Spirits lift for a while.",e:{f:1}},no:{x:"The sightings continue.",e:{d:.5}}}],
idle:{x:"Ignored. Night shift absenteeism kept climbing.",e:{d:1,f:-1}},L:"Behind a strange story there's usually a real person."},

{id:"frank",r:2,a:"Lifting",t:"A bully running the big lift",x:"Next week is the 300-tonne steam generator lift. Frank, your only superintendent who's done one this size, has been bullying an apprentice. The crew is afraid of him.",o:[
{t:"Protect the apprentice now, deal with Frank after the lift",p:.6,g:"weak",n:"Protects the person, not the lift. A scared crew hesitates when it matters.",ok:{x:"Clean lift. Investigation after; Frank retires.",e:{}},no:{x:"A rigger hesitates four seconds before calling stop. The load swings 30 cm toward containment. No contact.",e:{s:-2}}},
{t:"Pull Frank now and find another lead",p:.65,g:"good",n:"Removes the fear, adds inexperience.",ok:{x:"A lift specialist is brought in. Clean.",e:{c:.5,s:1}},no:{x:"The new lead is cautious; three days late.",e:{d:1,c:.5}}},
{t:"Keep Frank on rigging, bring in an independent lift director who owns the stop call, and tell the crew",p:.9,g:"best",n:"Keeps the experience and removes the fear from the one call that matters.",ok:{x:"The crew calls two stops without hesitation. Clean lift. The investigation runs after.",e:{s:2,f:2}},no:{x:"Frank bristles at sharing authority but the lift goes clean.",e:{s:1}}}],
idle:{x:"Nothing done. A rigger hesitated on a stop call during the lift.",e:{s:-2}},L:"A crew afraid of its leader hesitates at the worst moment."},

{id:"wrench",r:2,a:"Quality",t:"Maybe a wrench in the pipe",x:"2 am, days before filling the primary system. A contractor says he may have dropped a wrench into an open coolant pipe. His tool log shows nothing missing, but he didn't log every tool.",o:[
{t:"Stop and do a full foreign-material search",p:.95,g:"best",n:"Treat it as there until you prove otherwise.",ok:{x:"Four and a half days. On day three they find a 10 mm socket two metres further than any camera would reach.",e:{d:1,r:2,en:1}},no:{x:"Nothing found. Four days, and certainty.",e:{d:1,r:1}}},
{t:"Recount his toolbag against the log",p:.4,g:"wrong",n:"The log was incomplete, so a count against it proves nothing.",ok:{x:"Nothing was in there.",e:{}},no:{x:"A socket ends up in a pump impeller during flush.",e:{d:12,c:5,r:-3}}},
{t:"Quick camera look, close it if clear",p:.55,g:"weak",n:"A camera checks one pipe. Things travel.",ok:{x:"Clear, and truly clear.",e:{}},no:{x:"The camera misses a socket further down.",e:{d:10,c:4,r:-2}}}],
idle:{x:"The report sat until morning and the line was closed up.",e:{d:8,c:3,r:-2}},L:"If you can't open it later, prove it's clean now."},

{id:"turnover",r:2,a:"Operations",t:"Commissioning wants the rooms now",x:"Commissioning wants the auxiliary building handed over this month so they can start testing. Construction still has 2,100 open punch items in there.",o:[
{t:"Hand over system by system, with a joint walk-down and a signed punch list for each",p:.85,g:"best",n:"Turnover is a boundary. Draw it clearly, one system at a time.",ok:{x:"Eleven systems turned over in six weeks. Both teams know exactly who owns which valve.",e:{d:-2,en:1,f:1}},no:{x:"Slower than commissioning wanted, but clean.",e:{d:-.5,b:-1}}},
{t:"Hand over the whole building",p:.35,g:"wrong",n:"Two teams working the same equipment with no boundary is how things get energized with people inside.",ok:{x:"It goes surprisingly smoothly.",e:{d:-2}},no:{x:"Commissioning energizes a pump while a fitter is still working on it. A near-miss, and a three-week stand-down.",e:{s:-3,d:3,r:-1}}},
{t:"Refuse until construction is complete",p:.8,g:"weak",n:"Clean, and it wastes months of commissioning time.",ok:{x:"Construction finishes. Commissioning starts late.",e:{d:3}},no:{x:"The punch list grows instead of shrinking.",e:{d:4,b:-1}}}],
idle:{x:"Nobody decided. Commissioning started anyway, room by room, with no boundary.",e:{s:-2,d:1}},L:"Draw the boundary one system at a time."},

{id:"feud",r:2,a:"People",t:"Two leads who won't talk",x:"Your mechanical and electrical leads haven't spoken in a month. Their crews are now fighting over the same cable trays and hangers.",o:[
{t:"Walk the building with both of them every Monday until they're solving it themselves",p:.8,g:"best",n:"People who walk the same problem stop arguing about it.",ok:{x:"Week three, they start finishing each other's sentences about hanger loads. Week six, they walk it without you.",e:{f:2,d:-1}},no:{x:"It's slow, but the crews stop fighting.",e:{f:1}}},
{t:"Separate their work areas",p:.6,g:"weak",n:"Hides the problem until they meet again.",ok:{x:"Calm for a while.",e:{}},no:{x:"They meet again at the tray risers.",e:{d:1.5,f:-1}}},
{t:"Back the one with the stronger case",p:.4,g:"wrong",n:"You'll have one ally and one enemy.",ok:{x:"Mechanical wins. Electrical gets quiet.",e:{f:-1}},no:{x:"The electrical lead quits.",e:{f:-2,w:2}}}],
idle:{x:"The feud kept running through their crews.",e:{f:-2,d:1}},L:"Put people in front of the same problem."},

{id:"rework",r:2,a:"Quality",t:"Rework at 9 percent",x:"Rework hours have climbed from 3% to 9% in two months. Production is pushing to make up the time.",o:[
{t:"Sort the rework by cause and go after the top two",p:.85,g:"best",n:"Rework isn't evenly spread. Find where it piles up.",ok:{x:"62% comes from one drawing revision that never reached the field and one torque wrench out of calibration. Fixed in a week. Rework falls to 4%.",e:{c:-.5,d:-2,en:1}},no:{x:"The causes are scattered. It takes two months to come down.",e:{d:-.5}}},
{t:"Add more QC inspectors",p:.6,g:"good",n:"Catches more, fixes less.",ok:{x:"Rework is found sooner.",e:{c:.4}},no:{x:"More found, same made.",e:{c:.6,d:1}}},
{t:"Push harder on production to make up time",p:.3,g:"wrong",n:"Speeding up a process that makes defects makes more defects.",ok:{x:"Production rises a little.",e:{}},no:{x:"Rework hits 14%.",e:{d:3,c:1.5}}}],
idle:{x:"Nobody looked at the rework. It kept climbing.",e:{d:2,c:1}},L:"Find where the problems pile up."},

{id:"video",r:2,a:"Comms",t:"A near-miss on social media",x:"A labourer posts a phone video of a load swinging over a walkway. It has 40,000 views. Corporate comms wants him disciplined.",o:[
{t:"Thank him, use the video in a site-wide stand-down, and ask him to bring the next one to you first",p:.85,g:"best",n:"Punish the person who showed you the hazard and you won't see the next one.",ok:{x:"The stand-down changes the walkway rules. He brings you two more things that month. Comms comes round.",e:{s:2,f:2,cm:1}},no:{x:"The press picks it up anyway. You have a good answer.",e:{s:2,cm:-1}}},
{t:"Discipline him for posting",p:.6,g:"wrong",n:"The lesson everyone learns: hide it.",ok:{x:"The video comes down.",e:{f:-3}},no:{x:"\"Worker Punished For Exposing Safety Risk.\"",e:{f:-3,cm:-3}}},
{t:"Ask him to delete it, no discipline",p:.7,g:"weak",n:"Better, but you still haven't fixed the walkway.",ok:{x:"It comes down.",e:{}},no:{x:"Screenshots are forever.",e:{cm:-1}}}],
idle:{x:"Corporate disciplined him while you were busy.",e:{f:-2,cm:-1}},L:"Thank the person who shows you the hazard."},

{id:"fatigue",r:2,a:"Safety",t:"Twenty-one days straight",x:"Crews on the reactor building have worked 21 days in a row to recover schedule. The recovery plan says 14 more.",o:[
{t:"Rotate a mandatory day off every 7 days, and add a crew to keep the pace",p:.8,g:"best",n:"Tired crews make mistakes that cost more than the day off.",ok:{x:"Output per hour climbs 15% after the first rest day. The recovery holds.",e:{s:2,f:2,c:.6}},no:{x:"The new crew is slow to start. Two days lost.",e:{s:1,f:1,c:.6,d:.5}}},
{t:"Keep going, it's only two more weeks",p:.3,g:"wrong",n:"Week four of no days off is when the hand goes where it shouldn't.",ok:{x:"Done on schedule, everyone exhausted.",e:{f:-2}},no:{x:"A rigger catches his hand in a pinch point. Lost-time injury.",e:{s:-3,f:-2,d:2,r:-1}}},
{t:"Cap it at 14 days and accept the slip",p:.85,g:"good",n:"Safe, but you didn't solve the schedule.",ok:{x:"Rested crews, two weeks late.",e:{d:2,s:1}},no:{x:"Three weeks late.",e:{d:3}}}],
idle:{x:"The schedule ran on. Fatigue did what fatigue does.",e:{s:-2,f:-1}},L:"Rest is part of the schedule."},

{id:"vendor",r:2,a:"Engineering",t:"\"Everybody skips that step\"",x:"The pump vendor's rep says the hot alignment check in the procedure is unnecessary. \"Everybody skips it.\" It adds two days.",o:[
{t:"Follow the procedure unless the vendor gives a written, engineering-approved deviation",p:.9,g:"best",n:"If it's truly unnecessary, it can be written down and signed.",ok:{x:"The vendor won't put it in writing. The hot alignment finds the coupling 0.4 mm out. Fixed before it ever runs.",e:{en:2,r:1,d:.3}},no:{x:"Alignment is fine. Two days, and an accurate record.",e:{d:.3,en:1}}},
{t:"Skip it, the vendor knows the pump",p:.4,g:"wrong",n:"\"Everybody does it\" is how steps disappear.",ok:{x:"Pump runs fine.",e:{}},no:{x:"Bearing failure at 300 hours. Pump out for six weeks.",e:{d:5,c:1.5,r:-1}}},
{t:"Do a quick cold check instead",p:.6,g:"weak",n:"Cold isn't hot. That's why the step exists.",ok:{x:"Cold numbers look fine.",e:{}},no:{x:"It grows out of alignment at temperature.",e:{d:3,c:.8}}}],
idle:{x:"The rep did it his way.",e:{d:2,c:.5}},L:"If a step can be skipped, someone can sign for it."},

{id:"lessons",r:2,a:"Culture",t:"A lessons-learned database nobody reads",x:"There are 4,000 lessons learned in the database from the last three nuclear builds. Your supers have never opened it.",o:[
{t:"Pick one lesson for each day's pre-job brief, matched to that day's work",p:.85,g:"best",n:"A lesson lands when it arrives on the day you need it.",ok:{x:"Day 11's lesson is about rebar couplers left uncapped. That afternoon a foreman caps a whole row before concrete.",e:{en:1,f:1,s:1,w:-2}},no:{x:"Some days the match is loose. It still sticks.",e:{f:1}}},
{t:"Make reading it mandatory",p:.5,g:"weak",n:"Mandatory reading is skimmed reading.",ok:{x:"People click through.",e:{}},no:{x:"People resent it.",e:{f:-1}}},
{t:"Let it go, experience will do",p:.4,g:"wrong",n:"Experience you could have borrowed is the expensive kind.",ok:{x:"Nothing happens.",e:{}},no:{x:"You repeat a known mistake from the last build: dome bars left uncapped and full of concrete.",e:{d:2,c:.5}}}],
idle:{x:"The database stayed unread. An old mistake came back.",e:{d:1.5,c:.4}},L:"Deliver the lesson on the day it's needed."},

{id:"strike",r:2,a:"Procurement",t:"The concrete drivers may strike",x:"The batch plant's truck drivers may strike in two weeks. You have three critical pours in the next month.",o:[
{t:"Pull the critical pours forward and line up a mobile on-site batch plant as a backup",p:.8,g:"best",n:"Move what you can, and have a plan for what you can't.",ok:{x:"Two pours go in before the strike. The third is batched on site. The strike lasts nine days.",e:{c:.6,d:-1,b:1}},no:{x:"The strike is called off. The backup plant cost money for nothing. Still right.",e:{c:.6}}},
{t:"Wait and see",p:.4,g:"wrong",n:"A strike date is a known constraint.",ok:{x:"No strike.",e:{}},no:{x:"Nine days of no concrete on the critical path.",e:{d:3,c:.5}}},
{t:"Line up a second batch plant across the county",p:.65,g:"good",n:"Helps, if their trucks aren't the same union.",ok:{x:"They cover two of the three pours.",e:{c:.3,d:.5}},no:{x:"Same union. Same strike.",e:{d:2.5}}}],
idle:{x:"Nobody planned for the strike.",e:{d:3}},L:"A known date is a constraint, not a surprise."},

// ----- Construction director -----
{id:"fuelpr",r:3,a:"Comms",t:"Announce a fuel load date",x:"Corporate wants a public fuel load date next month. Your window is nine months wide.",o:[
{t:"Announce the early edge, corporate wants confidence",p:.15,g:"wrong",n:"A date you know is unlikely is a debt you pay in public.",ok:{x:"You hit it. Remarkable.",e:{b:3,cm:2}},no:{x:"A pump supplier fails qualification and the date's gone. Public slip, brutal press.",e:{cm:-4,b:-2,r:-1}}},
{t:"Announce a range, not a date",p:.75,g:"good",n:"Accurate, and harder to sell.",ok:{x:"Press calls it vague, then forgets.",e:{cm:1}},no:{x:"Headlines read the range as trouble.",e:{cm:-1}}},
{t:"Hold off until the window narrows, then announce a date you'd bet on",p:.85,g:"best",n:"Certainty earns the right to make promises.",ok:{x:"Four months later the window is ten weeks. You announce the late edge at 85% confidence and beat it by three days.",e:{b:2,cm:2,r:1}},no:{x:"Board members call it weakness for a while.",e:{b:-1}}}],
idle:{x:"Corporate announced the early edge without you.",e:{cm:-2}},L:"Make promises once the fog's gone."},

{id:"welder",r:3,a:"Regulator",t:"A backdated record",x:"Your only certified nuclear-class welder on shift admits he backdated an inspection record last month. The weld is fine. Fuel load is six weeks out.",o:[
{t:"Report it and lose him during the investigation",p:.8,g:"good",n:"By the book.",ok:{x:"Clean report. A replacement is found in five weeks.",e:{r:1,d:2}},no:{x:"No replacement. Six weeks lost.",e:{d:6,r:1}}},
{t:"Have him re-document it and keep it in-house",p:.4,g:"wrong",n:"Keeping a falsified nuclear record in-house is a cover-up.",ok:{x:"Nobody finds out.",e:{}},no:{x:"An audit finds it. Now it's two falsifications and a cover-up.",e:{r:-5,d:12,b:-3}}},
{t:"Report it and argue he stays on supervised work because he came forward",p:.85,g:"best",n:"Does everything the by-the-book option does and rewards coming forward.",ok:{x:"A 400-weld audit costs three weeks and finds nothing else. The regulator cites the self-disclosure. Two others come forward with small issues.",e:{r:2,f:2,d:3}},no:{x:"The regulator benches him anyway. You tried.",e:{r:1,d:4}}}],
idle:{x:"It surfaced in an audit before anyone reported it.",e:{r:-3,d:6}},L:"Coming forward costs schedule and buys a culture."},

{id:"karen",r:3,a:"Regulator",t:"Your mentor's old shortcut",x:"Karen, your mentor and retiring VP, approved a containment repair three years ago without the engineering disposition. The regulator inspects in two weeks. She asks you to let her fix it quietly.",o:[
{t:"Let her handle it quietly",p:.35,g:"wrong",n:"Quiet fixes of nuclear records are cover-ups.",ok:{x:"Disposition written; nobody asks.",e:{}},no:{x:"The inspector finds the date mismatch.",e:{r:-5,b:-2}}},
{t:"It goes in as a formal NCR now, and you stand beside her",p:.95,g:"best",n:"Loyal to her and to the record at the same time.",ok:{x:"She writes it herself. Engineering finds the repair sound. The inspector closes it citing safety culture. At her send-off she tells the story with your name in it.",e:{r:3,f:1,b:-1}},no:{x:"Two of her board allies never forgive you.",e:{r:2,b:-2}}},
{t:"Report it to QA yourself without telling her",p:.8,g:"weak",n:"Correct outcome, broken relationship.",ok:{x:"Filed. Karen hears from QA.",e:{r:2,f:-2}},no:{x:"Karen retires bitter.",e:{r:1,f:-2}}}],
idle:{x:"The inspector found it before anyone filed.",e:{r:-4}},L:"Stand beside people while the record gets fixed."},

{id:"press",r:3,a:"Comms",t:"Leaked emails, 9 pm",x:"A national reporter has emails from your predecessor's era showing schedule pressure overrode an engineer's weld concern. The story runs at 6 am. The CEO isn't answering.",o:[
{t:"\"No comment\" and let comms handle it",p:.6,g:"weak",n:"Leaves the headline unanswered.",ok:{x:"The story runs and fades.",e:{cm:-1}},no:{x:"The story runs for a week.",e:{cm:-3,r:-1}}},
{t:"Go on the record: confirm what's true and what's changed",p:.8,g:"best",n:"Owning the past is the only credible way to talk about the present.",ok:{x:"Your quote leads every follow-up. The engineer from the emails writes: \"Thank you for saying I was right.\" The CEO: \"Next time, call me until I answer.\"",e:{cm:3,r:1,b:-1}},no:{x:"The quote runs in paragraph nine. The CEO is angry for a month.",e:{cm:1,b:-2}}},
{t:"Have legal try to block it overnight",p:.1,g:"wrong",n:"Trying to suppress it becomes the story.",ok:{x:"Delayed a day.",e:{}},no:{x:"\"Nuclear Project Tries to Gag Paper.\"",e:{cm:-5,r:-1}}},
{t:"Find out who leaked",p:.3,g:"wrong",n:"Hunting the messenger tells every engineer on site to stay quiet.",ok:{x:"You find them. Morale drops.",e:{f:-3}},no:{x:"The hunt leaks too.",e:{cm:-3,f:-3}}}],
idle:{x:"The story ran with no response.",e:{cm:-3}},L:"Confirm what's true, then say what changed."},

{id:"maria",r:3,a:"Operations",t:"A gut feeling before fuel load",x:"11 pm, the night before fuel load. The minister arrives at 9. Maria, a senior operator with years of sharp calls, is uneasy about the valve lineup. Every sign-off is in place.",o:[
{t:"Thank her and proceed",p:.4,g:"wrong",n:"Experience noticing something is data.",ok:{x:"It goes clean.",e:{}},no:{x:"Two swapped valve tags on auxiliary feedwater. Found during startup. Event report.",e:{r:-4,d:4}}},
{t:"Delay 24 hours for a full independent walk-down",p:.95,g:"best",n:"You pay a day and a headline for certainty.",ok:{x:"Two valve tags were swapped during a repaint. Maria had noticed a handwheel was the wrong colour. Clean fuel load the next morning.",e:{r:3,cm:1,d:.2}},no:{x:"Nothing found. A day and a headline.",e:{cm:-1,d:.2}}},
{t:"Have her walk it tonight with a second operator",p:.75,g:"good",n:"Probably finds it, quietly.",ok:{x:"They find the swapped tags at 3 am.",e:{r:2}},no:{x:"They check the procedure, not the hardware.",e:{r:-2,d:2}}}],
idle:{x:"Nobody responded to Maria.",e:{r:-2}},L:"Listen to the person who has seen it a thousand times."},

{id:"escrow",r:3,a:"Commercial",t:"Contractor three weeks from insolvency",x:"Your electrical contractor's CFO says they're three weeks from insolvency. 600 workers on site don't know. Legal says withhold payments and line up a replacement.",o:[
{t:"Follow legal",p:.4,g:"weak",n:"Protects the contract, sinks the workforce.",ok:{x:"Replacement lined up. Three months of disruption.",e:{d:8,f:-3}},no:{x:"Collapse mid-terminations. 600 missed paycheques.",e:{d:16,f:-4,cm:-3}}},
{t:"Go to the CEO with a joint-payment escrow: money straight to payroll and subs",p:.85,g:"best",n:"Put the decision with the person who owns the risk, and bring a better option.",ok:{x:"The contract already allowed joint payments. The bonding company joins, the parent injects equity. Nobody misses a paycheque.",e:{f:3,b:2,d:0}},no:{x:"It takes five weeks to set up. A rough patch, but they survive.",e:{f:1,d:2}}},
{t:"Prepay invoices to keep them alive",p:.4,g:"weak",n:"Money with no control goes to their other job.",ok:{x:"They limp through.",e:{c:10}},no:{x:"They collapse anyway with your prepayment.",e:{c:25,d:12}}}],
idle:{x:"No decision. They collapsed during terminations.",e:{d:14,f:-3}},L:"Bring the decision to the person who owns the risk."},

{id:"tip",r:3,a:"Regulator",t:"An off-record tip",x:"A regulator inspector you've known for years tells you in the parking lot that a stop-work order is coming next week for your mechanical contractor. Nobody else knows.",o:[
{t:"Quietly resequence now",p:.4,g:"weak",n:"Defensible practically, risky for him and you if anyone reviews the timing.",ok:{x:"The order lands; you barely flinch. Nobody looks closer.",e:{d:-1}},no:{x:"An integrity review spots the timing. He's disciplined; inspections go cold.",e:{r:-4}}},
{t:"Decline it: \"Sorry, I can't take this.\" Don't report him; note it to file",p:.9,g:"best",n:"Protects your integrity and his career without pretending it didn't happen.",ok:{x:"The order lands normally. If asked, you can say you refused it.",e:{r:1}},no:{x:"The order costs a week, cleanly.",e:{d:1}}},
{t:"Report the contact to licensing",p:.9,g:"good",n:"By the book; ends a good relationship over one bad moment.",ok:{x:"Formal and clean. He's reassigned.",e:{r:1,f:-1}},no:{x:"Inspection staff go cold toward you.",e:{r:-1}}}],
idle:{x:"You said nothing and did nothing. That held.",e:{}},L:"Some information isn't yours to use."},

{id:"split",r:3,a:"Commercial",t:"A $200M award before an election",x:"Best qualified bidder for nuclear modules: out of province, 15% cheaper. A local shipyard in a swing riding: never built nuclear-class. The premier's office wants jobs local.",o:[
{t:"Award to the qualified bidder",p:.8,g:"good",n:"Technically right, politically costly.",ok:{x:"Clean award. The province cools on you.",e:{b:-1}},no:{x:"Funding reviews get slower.",e:{b:-2}}},
{t:"Split: safety-class modules to the qualified bidder, simple ones to the local yard with a path to qualify",p:.8,g:"best",n:"Politics never touched anything that matters for nuclear safety.",ok:{x:"The yard struggles, then qualifies by year nine. One late pipe rack costs $3M.",e:{c:3,b:2,cm:2}},no:{x:"The interface costs more than planned.",e:{c:6,d:2,b:1}}},
{t:"Award to the local shipyard with heavy oversight",p:.3,g:"wrong",n:"Oversight can't create experience.",ok:{x:"It works, expensively.",e:{c:15,b:2}},no:{x:"Rejected modules and a year lost.",e:{d:40,c:40,r:-2}}}],
idle:{x:"The award slipped past the election and the bidder repriced.",e:{c:10,d:4}},L:"Keep politics out of the safety-class scope."},

{id:"contingency",r:3,a:"Commercial",t:"The board wants the contingency back",x:"The board wants to release $150M of contingency to show savings this quarter. Your risk register says about $90M of it covers risks that haven't been retired yet.",o:[
{t:"Release only what's tied to retired risks, and show the board the model",p:.85,g:"best",n:"Contingency belongs to risks. Release it as they retire, not as quarters end.",ok:{x:"$60M released with a clear story. The board likes the discipline. Eight months later a retired-looking risk comes back and the reserve covers it.",e:{b:1,c:-2}},no:{x:"The board wanted the full amount. They grumble.",e:{b:-1}}},
{t:"Release the full $150M",p:.3,g:"wrong",n:"Money released early has to be asked for again later, with a much worse story.",ok:{x:"The risks don't land. Celebrations.",e:{b:2}},no:{x:"Two risks land in year eleven. You go back to the board for $70M.",e:{b:-3,c:8,cm:-1}}},
{t:"Refuse to release any",p:.7,g:"weak",n:"Prudent, and it ignores the $60M that really is free.",ok:{x:"The reserve sits.",e:{b:-1}},no:{x:"The board takes it anyway, without your input.",e:{b:-2}}}],
idle:{x:"The board released the full amount without you.",e:{b:-1,c:4}},L:"Release reserve as risk retires."},

{id:"fishing",r:3,a:"Environment",t:"Spawning season and the intake test",x:"Your cooling water intake trial is scheduled for May. The nearby First Nation tells you May is the whitefish spawning run, and asks you to move it.",o:[
{t:"Move the test, and design the fish monitoring with the community, publishing the data",p:.85,g:"best",n:"Their knowledge of the lake is older than your project. Treat it that way.",ok:{x:"Six weeks later, with community monitors on the boats. The data becomes the basis for the operating licence condition.",e:{d:1,r:2,cm:2}},no:{x:"The later window brings algae problems. More cost, still the right call.",e:{d:2,r:1,cm:1,c:.5}}},
{t:"Run it in May, the permit allows it",p:.5,g:"wrong",n:"Legal and wrong are different things.",ok:{x:"No measurable effect.",e:{cm:-1}},no:{x:"Fish kills at the intake screen. Protests, and a regulator review of your intake design.",e:{cm:-4,r:-2,d:3}}},
{t:"Move the test, no other changes",p:.85,g:"good",n:"Respectful. It misses a chance to build trust and better data.",ok:{x:"The test runs in July.",e:{d:1,cm:1}},no:{x:"The July results are messy.",e:{d:1.5}}}],
idle:{x:"No one answered the request. The test ran in May.",e:{cm:-2,r:-1}},L:"Respect the people who've known the place longest."},

{id:"usb",r:3,a:"Security",t:"A USB stick in the engineering workstation",x:"A contractor plugged a USB stick into a control-system engineering workstation to copy a drawing. Nobody noticed for two days.",o:[
{t:"Isolate the workstation, run a full forensic check, and report it",p:.9,g:"best",n:"An unknown device on a control network is an incident until proven otherwise.",ok:{x:"The stick was clean. The check finds two other workstations with USB ports enabled that shouldn't be. Locked down site-wide.",e:{r:2,en:1,d:.5}},no:{x:"The forensic check takes a week.",e:{r:1,d:1}}},
{t:"Ask him what was on it and move on",p:.4,g:"wrong",n:"He doesn't know what was on it either.",ok:{x:"Nothing happened.",e:{}},no:{x:"A regulator cyber inspection finds the gap. Formal finding.",e:{r:-3,d:2}}},
{t:"Scan the stick and the workstation with antivirus",p:.6,g:"weak",n:"Control-system threats aren't the ones antivirus looks for.",ok:{x:"Clean.",e:{}},no:{x:"Clean, but the inspector asks why that was considered enough.",e:{r:-1}}}],
idle:{x:"Nobody followed up. A cyber inspection found it later.",e:{r:-2}},L:"Unknown is an incident until proven otherwise."},

{id:"unit2",r:3,a:"Strategy",t:"Start Unit 2 now or pause?",x:"Unit 1's crews are rolling off. Corporate wants Unit 2 started immediately. Your team wants six months to fold Unit 1's lessons into Unit 2's plans.",o:[
{t:"Start in stages: keep the key crews, start the civil work now, hold the systems work for the lessons package",p:.8,g:"best",n:"Keep the people, use the lessons, don't lose the momentum.",ok:{x:"The core crews stay. Unit 2's containment goes in 22% faster than Unit 1's.",e:{d:-3,f:2,b:1}},no:{x:"The lessons package takes longer than planned. Still faster.",e:{d:-1,f:1}}},
{t:"Start everything now",p:.45,g:"weak",n:"Momentum, at the cost of repeating Unit 1's mistakes.",ok:{x:"Fast start.",e:{d:-1,b:1}},no:{x:"Unit 2 repeats three of Unit 1's worst problems.",e:{d:4,c:5}}},
{t:"Pause six months",p:.6,g:"weak",n:"You'll lose the crews you most want to keep.",ok:{x:"Great plans. Half the crews have gone elsewhere.",e:{f:-2,d:2}},no:{x:"Most of the experienced crews leave.",e:{f:-3,d:4,w:2}}}],
idle:{x:"No decision. Corporate started Unit 2 the old way.",e:{d:2,c:3}},L:"Keep the people who learned the lessons."},

{id:"successor",r:3,a:"People",t:"Who comes after you?",x:"The CEO asks who would take over if you left tomorrow. Plainly, nobody is ready.",o:[
{t:"Name two candidates and give each a real stretch role this year",p:.85,g:"best",n:"Successors are grown, not found.",ok:{x:"One of them runs the Unit 2 civil start and is ready a year later.",e:{b:2,f:2}},no:{x:"One leaves for a bigger job elsewhere. The other is ready.",e:{b:1,f:1}}},
{t:"Hire someone from outside as your deputy",p:.6,g:"good",n:"Fast, but your own people notice who wasn't chosen.",ok:{x:"A strong deputy arrives.",e:{b:1,c:.5}},no:{x:"Two of your best leads take it personally.",e:{f:-2,c:.5}}},
{t:"Tell the CEO you're not going anywhere",p:.3,g:"wrong",n:"That's not what was asked.",ok:{x:"The CEO lets it go.",e:{}},no:{x:"The board flags it as a key-person risk.",e:{b:-2}}}],
idle:{x:"No answer. The board flagged it as a key-person risk.",e:{b:-1}},L:"Grow the people who'll replace you."},

{id:"seismic",r:3,a:"Regulator",t:"A new seismic requirement mid-build",x:"After an earthquake overseas, the regulator issues a new seismic requirement. Some of your structures are already built.",o:[
{t:"Meet them early with an analysis: what already complies, what needs work, and a plan",p:.85,g:"best",n:"Answer a new requirement with evidence and a schedule, not a fight.",ok:{x:"Most structures already comply with margin. Four need anchors added. The regulator accepts the plan in a month.",e:{r:3,en:1,c:4,d:2}},no:{x:"Six structures need work. The plan holds.",e:{r:2,c:7,d:4}}},
{t:"Lobby to have the project grandfathered",p:.3,g:"wrong",n:"Arguing against safety after an earthquake is a fight you lose in public.",ok:{x:"Grandfathered, quietly.",e:{cm:-1}},no:{x:"The lobbying leaks.",e:{r:-3,cm:-3}}},
{t:"Apply the full requirement everywhere immediately",p:.7,g:"weak",n:"Safe, but you'll retrofit structures that already comply.",ok:{x:"Done, expensively.",e:{c:15,d:6,r:1}},no:{x:"Years of retrofits.",e:{c:25,d:10}}}],
idle:{x:"No response went in. The regulator set the plan for you.",e:{c:10,d:5,r:-1}},L:"Answer new rules with evidence and a plan."},

{id:"sister",r:3,a:"Culture",t:"A death at a sister site",x:"A worker died at a sister project overnight. A falling rebar cage. Your site has the same contractor and is setting the same kind of cage this week.",o:[
{t:"Stand down that work, walk the crews through what happened, and restart only after a joint review",p:.95,g:"best",n:"The same work with the same contractor carries the same risk until you know why it happened.",ok:{x:"The review finds the same missing guy-wire detail in your lift plan. Fixed before the cage goes up.",e:{s:3,f:2,d:1}},no:{x:"Your plan was already right. The crews remember you stopped.",e:{s:2,f:2,d:1}}},
{t:"Send a safety bulletin and keep going",p:.6,g:"good",n:"Something, but crews read bulletins on the way past.",ok:{x:"The foremen read it out.",e:{s:1}},no:{x:"A cage shifts in the wind. Nobody under it, this time.",e:{s:-2}}},
{t:"Keep it quiet, it wasn't our site",p:.3,g:"wrong",n:"Your crews already know. They're watching what you do.",ok:{x:"Nothing happens.",e:{f:-3}},no:{x:"A cage tips at your site.",e:{s:-4,f:-3,r:-2,d:3}}}],
idle:{x:"Nobody stopped the work. Crews set the cage that afternoon, uneasy.",e:{s:-2,f:-2}},L:"Stop the same work until you know why."},

{id:"grid",r:3,a:"Operations",t:"The grid asks you to wait",x:"A heat wave. The grid operator asks you to delay the planned generator synchronization test by ten days so a trip doesn't hit the grid at peak.",o:[
{t:"Agree, and use the ten days for an extra independent check of the protection settings",p:.9,g:"best",n:"Turn a forced wait into margin.",ok:{x:"The check finds a relay set to the wrong curve. Synchronization goes clean.",e:{r:2,en:1,d:1}},no:{x:"Nothing found. Ten days, and goodwill with the grid.",e:{d:1,b:-1}}},
{t:"Push to keep the date",p:.4,g:"wrong",n:"A trip during a heat wave makes the evening news.",ok:{x:"The test is clean.",e:{b:1}},no:{x:"The unit trips during the test. 400,000 homes see a flicker.",e:{cm:-4,r:-2,d:2}}},
{t:"Agree and wait",p:.95,g:"good",n:"Correct; the wait was free to use better.",ok:{x:"Ten days later, clean.",e:{d:1}},no:{x:"Fourteen days.",e:{d:1.5}}}],
idle:{x:"No reply to the grid operator. They escalated to the minister.",e:{cm:-1,d:1.5}},L:"Turn a forced wait into margin."},

{id:"watch",r:3,a:"Comms",t:"A watchmaker's offer",x:"A Swiss watchmaker wants 50 watches from clean liner plate offcuts at $40,000 each, 30% of profits to the project. Comms worries about \"luxury watches while over budget.\"",o:[

// Path of construction order. Each CWA has a footprint on the 20x20 site grid.
const CWAS=[
 {id:"u1",n:"Reactor Building 1",k:"reactor",x:4,y:3,w:4,h:4},
 {id:"u2",n:"Reactor Building 2",k:"reactor",x:10,y:3,w:4,h:4},
 {id:"aux",n:"Auxiliary Building",k:"aux",x:15,y:3,w:3,h:5},
 {id:"tb",n:"Turbine Hall",k:"turbine",x:4,y:9,w:10,h:3},
 {id:"intake",n:"Intake & Forebay",k:"intake",x:0,y:13,w:4,h:3},

 {id:"yard",n:"Laydown & Roads",k:"yard",x:8,y:14,w:6,h:4},
];
const CWA_BY={};CWAS.forEach(c=>CWA_BY[c.id]=c);
const AREA_CWA={Concrete:"u1",Lifting:"u2",Quality:"aux",Engineering:"aux",Geotech:"intake",Environment:"intake",Weather:"yard",Logistics:"yard",Procurement:"swy",Operations:"swy",Security:"swy",Comms:"swy",Reporting:"tb",People:"tb",Culture:"tb",Commercial:"tb",Strategy:"u2",Regulator:"u1"};
function cwaOf(sc){if(sc.cwa)return sc.cwa;if(AREA_CWA[sc.a])return AREA_CWA[sc.a];let h=0;for(const ch of sc.id)h=(h*31+ch.charCodeAt(0))>>>0;return ["u1","u2","tb"][h%3]}
function simInit(){if(!st.prog){st.prog={};st.cons={};CWAS.forEach(c=>{st.prog[c.id]=0;st.cons[c.id]=c.id==="yard"||c.id==="u1"?1:0})}}
const overall=()=>{if(!st||!st.prog)return 0;return CWAS.reduce((a,c)=>a+st.prog[c.id],0)/CWAS.length};
const GAIN={best:14,good:9,weak:4,wrong:-3};
function simChoose(sc,o,win){simInit();const c=cwaOf(sc);let dp=GAIN[o.g]+(win?0:-3),dc=0;
  if((o.g==="best"||o.g==="good")&&st.cons[c]>0){st.cons[c]--;dc=-1}
  if(o.g==="wrong"||(o.g==="weak"&&!win)){st.cons[c]++;dc=1}
  st.prog[c]=Math.max(0,Math.min(100,st.prog[c]+dp));return {c,dp,dc}}
function simIdle(sc){simInit();const c=cwaOf(sc);st.cons[c]++;return c}
// end of turn: constraint-free work packages get released and the crews build
function simTurn(){simInit();const rel=[];CWAS.forEach(c=>{if(st.cons[c.id]===0){st.prog[c.id]=Math.min(100,st.prog[c.id]+3);rel.push(c.id)}});return rel}
// PMI earned value, in $M against a $4.8B budget at completion
const BAC=4800;
function evm(){const plan=D().per===5?16:20,pv=BAC*.85*Math.min(1,(st.turn-1)/plan+.02),ev=BAC*overall()/100,ac=ev+Math.max(0,st.c)+(st.c<0?st.c:0);
  return {pv,ev,ac,spi:pv?ev/pv:1,cpi:ac>0?ev/ac:1}}
function awpHTML(){simInit();const E=evm();
  return `<div class="awp">${CWAS.map((c,i)=>{const p=st.prog[c.id],k=st.cons[c.id];return `<div class="awrow" data-cwa="${c.id}"><span class="awn"><b>${i+1}</b> ${esc(c.n)}</span><span class="xpbar"><b class="${p>=100?"full":""}" style="width:${p}%"></b></span><span class="lbl">${Math.round(p)}%</span><span class="awst ${k?"hold":"rel"}">${k?`${k} blocker${k===1?"":"s"}`:"crews working"}</span></div>`}).join("")}</div>
  <div class="evm"><span><b>Planned</b> $${Math.round(E.pv)}M</span><span><b>Built</b> $${Math.round(E.ev)}M</span><span><b>Spent</b> $${Math.round(E.ac)}M</span><span class="${E.spi<.9?"c-wrong":E.spi>=1?"c-best":""}"><b>Pace</b> ${E.spi.toFixed(2)}</span><span class="${E.cpi<.95?"c-wrong":E.cpi>=1?"c-best":""}"><b>Value</b> ${E.cpi.toFixed(2)}</span></div>
  <p class="note">Crews only work an area when nothing is blocking it. Good calls clear blockers. Bad calls, and anything left alone, add them.</p>`}

// ---------- The site map: 1995 isometric pixels ----------
const MAP={W:384,H:232,ox:192,oy:34,t:0,raf:0,hover:null};
const iso=(x,y)=>[MAP.ox+(x-y)*9,MAP.oy+(x+y)*4.5];
const PAL={grass:["#3a8a2c","#47a033"],dirt:["#8a5a2b","#a06a35"],water:["#1f5fbf","#2a74d6"],road:"#6b6b6b",line:"#d8d8d8",conc:["#b8b8b0","#9a9a92","#7c7c76"],steel:"#4a6a8a",dome:["#e8e8e0","#c8c8c0"],hall:["#c8b890","#a89870","#887850"],red:"#e01818",yellow:"#ffd800",smoke:"rgba(80,80,80,.6)"};
function mapTile(g,x,y,col){const [a,b]=iso(x,y);g.fillStyle=col;g.beginPath();g.moveTo(a,b);g.lineTo(a+9,b+4.5);g.lineTo(a,b+9);g.lineTo(a-9,b+4.5);g.closePath();g.fill()}
// an iso box from tile (x,y,w,h) rising z pixels
function mapBox(g,x,y,w,h,z,cols){const [ax,ay]=iso(x,y),[bx,by]=iso(x+w,y),[cx,cy]=iso(x+w,y+h),[dx,dy]=iso(x,y+h);
  g.fillStyle=cols[1];g.beginPath();g.moveTo(dx,dy+4.5);g.lineTo(cx,cy+4.5);g.lineTo(cx,cy+4.5-z);g.lineTo(dx,dy+4.5-z);g.fill();
  g.fillStyle=cols[2]||cols[1];g.beginPath();g.moveTo(cx,cy+4.5);g.lineTo(bx,by+4.5);g.lineTo(bx,by+4.5-z);g.lineTo(cx,cy+4.5-z);g.fill();
  g.fillStyle=cols[0];g.beginPath();g.moveTo(ax,ay+4.5-z);g.lineTo(bx,by+4.5-z);g.lineTo(cx,cy+4.5-z);g.lineTo(dx,dy+4.5-z);g.closePath();g.fill()}
function mapDraw(){const cv=document.getElementById("map");if(!cv||!st||!st.prog){MAP.raf=0;return}const g=cv.getContext("2d");g.imageSmoothingEnabled=false;MAP.t++;const T=MAP.t;
  g.fillStyle="#0a2a0a";g.fillRect(0,0,MAP.W,MAP.H);
  for(let y=0;y<20;y++)for(let x=0;x<20;x++){const water=y>=18||(x===0&&y>=16);mapTile(g,x,y,water?PAL.water[(x+y+(T>>4))&1]:PAL.grass[(x*7+y*3)&1])}
  // roads
  for(let x=0;x<20;x++)mapTile(g,x,8,PAL.road);for(let y=0;y<18;y++)mapTile(g,14,y,PAL.road);for(let x=3;x<14;x++)mapTile(g,x,13,PAL.road);
  for(let x=0;x<20;x+=2)mapTile(g,x+.4,8.4,"#9a9a9a");
  // CWAs back to front
  const order=CWAS.slice().sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  for(const c of order){const p=st.prog[c.id],k=st.cons[c.id];
    for(let y=c.y;y<c.y+c.h;y++)for(let x=c.x;x<c.x+c.w;x++)mapTile(g,x,y,p<12?PAL.dirt[(x+y)&1]:(c.k==="switch"||c.k==="yard")?"#8a8a7a":PAL.conc[1]);
    if(MAP.hover===c.id){for(let y=c.y;y<c.y+c.h;y++)for(let x=c.x;x<c.x+c.w;x++)mapTile(g,x,y,"rgba(255,255,0,.35)")}
    const st8=p<12?0:p<30?1:p<55?2:p<80?3:p<100?4:5;
    if(c.k==="reactor"){if(st8>=1)mapBox(g,c.x+.3,c.y+.3,c.w-.6,c.h-.6,4,PAL.conc);if(st8>=2)mapBox(g,c.x+.5,c.y+.5,c.w-1,c.h-1,Math.min(34,6+(p-30)*.9),PAL.conc);
      if(st8>=3){const [mx,my]=iso(c.x+c.w/2,c.y+c.h/2);const z=Math.min(34,6+(p-30)*.9),r=15;g.fillStyle=PAL.dome[1];g.beginPath();g.ellipse(mx,my+4.5-z,r,r*(st8>=4?.8:.35)*(p>=80?1:.6+.4*(p-55)/25),0,Math.PI,0);g.fill();g.fillStyle=PAL.dome[0];g.beginPath();g.ellipse(mx-3,my+2-z,r*.55,r*.3,0,Math.PI,0);g.fill()}}
    else if(c.k==="turbine"){if(st8>=1)mapBox(g,c.x+.2,c.y+.2,c.w-.4,c.h-.4,3,PAL.conc);if(st8>=2)mapBox(g,c.x+.3,c.y+.3,c.w-.6,c.h-.6,Math.min(22,4+(p-30)*.5),st8>=4?PAL.hall:PAL.conc)}
    else if(c.k==="aux"){if(st8>=1)mapBox(g,c.x+.3,c.y+.3,c.w-.6,c.h-.6,Math.min(30,3+p*.32),st8>=4?["#d0d0e0","#a0a0c0","#8080a0"]:PAL.conc)}
    else if(c.k==="intake"){if(st8>=1)mapBox(g,c.x+.2,c.y+.4,c.w-.4,c.h-.8,Math.min(10,2+p*.1),PAL.conc);if(st8>=3)for(let i=0;i<3;i++)mapTile(g,c.x+.5+i,c.y+c.h-.2,PAL.water[(T>>3)&1])}
    else if(c.k==="switch"){const n=Math.floor(p/20);for(let i=0;i<n;i++){const [tx,ty]=iso(c.x+.6+(i%3)*1.4,c.y+.6+Math.floor(i/3)*1.6);g.strokeStyle="#303030";g.lineWidth=1;g.beginPath();g.moveTo(tx-3,ty+4);g.lineTo(tx,ty-16);g.lineTo(tx+3,ty+4);g.moveTo(tx-5,ty-10);g.lineTo(tx+5,ty-10);g.stroke()}
      if(n>=3){g.strokeStyle="#202020";g.beginPath();const [a1,b1]=iso(c.x+.6,c.y+.6),[a2,b2]=iso(c.x+3.4,c.y+.6);g.moveTo(a1,b1-15);g.lineTo(a2,b2-15);g.stroke()}}
    else if(c.k==="yard"){const n=Math.floor(p/8)+2;for(let i=0;i<n;i++){const xx=c.x+.4+(i%5)*1.1,yy=c.y+.4+Math.floor(i/5)*1.2;mapBox(g,xx,yy,.8,.8,3+(i*5)%6,[["#c08040","#906030","#704820"],["#4a6a8a","#3a5a7a","#2a4a6a"],["#b0b0b0","#909090","#707070"]][i%3])}}
    // tower crane while the structure is going up
    if(c.k!=="yard"&&c.k!=="switch"&&p>=12&&p<96){const [cx,cy]=iso(c.x+.4,c.y+c.h-.4),hgt=58,a=(T/90+c.x)%(Math.PI*2),jx=Math.cos(a)*26,jy=Math.sin(a)*8;
      g.strokeStyle=PAL.yellow;g.lineWidth=2;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx,cy-hgt);g.stroke();g.lineWidth=1.5;g.beginPath();g.moveTo(cx-jx*.35,cy-hgt-jy*.35);g.lineTo(cx+jx,cy-hgt+jy);g.stroke();
      g.strokeStyle="#202020";g.lineWidth=1;g.beginPath();g.moveTo(cx+jx*.8,cy-hgt+jy*.8);g.lineTo(cx+jx*.8,cy-hgt+jy*.8+14+Math.sin(T/20)*4);g.stroke();g.fillStyle="#202020";g.fillRect(cx+jx*.8-2,cy-hgt+jy*.8+14+Math.sin(T/20)*4,4,3)}

// the forecast band, turn by turn: P10 to P90 shaded, midpoint drawn, target at zero
function fanHTML(final){const F=(st.fan||[]).slice();if(F.length<2&&final==null)return `<p class="note">Builds as turns pass.</p>`;
  const pts=F.length?F:[{d:st.d,w:st.w}];const W=320,H=150,P={l:34,r:8,t:10,b:20},n=pts.length;
  let lo=Math.min(0,...pts.map(p=>p.d-p.w/2)),hi=Math.max(0,...pts.map(p=>p.d+p.w/2));if(final!=null){lo=Math.min(lo,final);hi=Math.max(hi,final)}lo=Math.floor(lo/10)*10;hi=Math.ceil(hi/10)*10||10;
  const X=i=>P.l+(n<2?0:i/(n-1))*(W-P.l-P.r),Y=v=>P.t+(hi-v)/(hi-lo)*(H-P.t-P.b);
  const top=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.d+p.w/2).toFixed(1)}`),bot=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.d-p.w/2).toFixed(1)}`).reverse(),mid=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.d).toFixed(1)}`).join(" ");
  const ticks=[];for(let v=lo;v<=hi;v+=hi-lo>80?40:20)ticks.push(v);
  const last=pts[n-1];
  return `<svg class="fan" viewBox="0 0 ${W} ${H}" role="img" aria-label="Forecast band over ${n} turns, now ${Math.round(last.d)} weeks from target with a ${Math.round(last.w)} week window">
   ${ticks.map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-4}" y="${Y(v)+3}" text-anchor="end">${v>0?"+":""}${v}</text>`).join("")}
   <polygon points="${top.concat(bot).join(" ")}" fill="color-mix(in srgb,var(--info) 22%,transparent)" stroke="var(--info)" stroke-width="1"/>
   <polyline points="${mid}" fill="none" stroke="var(--info)" stroke-width="2"/>
   <line x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--hivis)" stroke-width="2"/><text x="${W-P.r}" y="${Y(0)-4}" text-anchor="end" class="tg">TARGET</text>
   ${final!=null?`<circle cx="${X(n-1)}" cy="${Y(final)}" r="5" fill="var(--ink)" stroke="var(--panel)" stroke-width="2"/><text x="${X(n-1)-8}" y="${Y(final)+4}" text-anchor="end" class="tg">ACTUAL</text>`:`<circle cx="${X(n-1)}" cy="${Y(last.d)}" r="3.5" fill="var(--info)"/>`}
   <text x="${P.l}" y="${H-4}">turn 1</text><text x="${W-P.r}" y="${H-4}" text-anchor="end">turn ${n}</text></svg>
   <div class="grow"><span class="lbl">weeks from target</span><span class="lbl">now ${Math.round(last.w)} wk wide</span></div>`}
function spark(h){
  const W=300,H=56,n=h.length;if(n<2)return `<p class="note">Builds as turns pass.</p>`;
  const mx=Math.max(...h,10),mn=0;
  const pts=h.map((v,i)=>[(i/(n-1))*(W-8)+4,H-6-((v-mn)/(mx-mn))*(H-14)]);
  const line=pts.map(p=>p.map(x=>x.toFixed(1)).join(",")).join(" ");
  const last=pts[n-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Window width went from ${Math.round(h[0])} to ${Math.round(h[n-1])} weeks"><polyline points="4,${H-6} ${line} ${last[0].toFixed(1)},${H-6}" fill="color-mix(in srgb,var(--info) 18%,transparent)" stroke="none"/><polyline points="${line}" fill="none" stroke="var(--info)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--info)"/></svg><div class="grow"><span class="lbl">${Math.round(h[0])} wk</span><span class="lbl">now ${Math.round(h[n-1])} wk</span></div>`;
}
function xpHTML(){
  const areas=Object.keys(st.xp).sort((a,b)=>st.xp[b]-st.xp[a]);
  if(!areas.length)return '<p class="note" style="margin-top:8px">Each decision builds experience in its area. Concrete experience won\'t help you on electrical.</p>';
  const T=ODDS_AT();
  return `<div class="xp">${areas.map(a=>{const v=st.xp[a],pc=Math.min(100,v/T*100);return `<div class="xprow"><span>${esc(a)}</span><span class="xpbar"><b class="${v>=T?"full":""}" style="width:${pc}%"></b></span><span class="lbl ${v>=T?"c-best":""}">${v>=T?"odds":v+"/"+T}</span></div>`}).join("")}</div>`;
}

let justChose=null;
function choose(i){
  const sc=byId(cur),w=st.week.find(x=>x.id===cur);if(!sc||st.att<=0||w.res)return;
  const o=sc.o[i]; if(!o) return;
  const c=chance(sc,o), win=rnd()<c, r=(win||!o.no)?o.ok:o.no;
  let luck="";
  if(!win&&o.no&&(o.g==="best"||o.g==="good")){luck="Good call, bad luck.";st.luck.bad++}
  else if(win&&o.no&&(o.g==="wrong"||o.g==="weak")&&c<.6){luck="You got away with it this time.";st.luck.good++}
  apply(r.e); st.xp[sc.a]=(st.xp[sc.a]||0)+(o.g==="best"?2:1); st.grades[o.g]++;
  const sim=simChoose(sc,o,win||!o.no);
  const fo=o.fo&&(win||!o.no?o.fo.ok:o.fo.no);if(fo&&!st.used.includes(fo)&&!(st.queue||[]).includes(fo))(st.queue=st.queue||[]).push(fo);
  w.status="done"; w.res={choice:o.t,out:r.x,e:r.e,g:o.g,n:o.n,L:sc.L,luck,sim};(st.dec=st.dec||[]).push({t:st.turn,id:sc.id,i,g:o.g,win:win||!o.no,role:st.role}); st.att--;
  st.log.push(`T${st.turn} · ${sc.t}: ${GNAME[o.g].toLowerCase()}.`);
  Snd.play("stamp");Snd.play(o.g);if(tutStep()===1)tutSet(2);justChose=cur;save(); render();justChose=null;medCheck();
}

function endTurn(){
  if(modal||st.ended) return;
  const missed=[];
  for(const w of st.week){ if(w.status!=="done"){const sc=byId(w.id);apply(sc.idle.e,1);simIdle(sc);w.status="missed";missed.push(sc);(st.dec=st.dec||[]).push({t:st.turn,id:sc.id,i:-1,g:"idle",role:st.role});st.log.push(`T${st.turn} · ${sc.t}: left alone.`)} }
  st.w=Math.max(2,+(st.w-(hasPerk("scheduler")?1:0)-D().narrow).toFixed(1));
  const released=simTurn();
  const news=rollNews();if(news)medCount("news")>=10&&medGive("news10");
  const sn=st.snap||{d:st.d,w:st.w,c:st.c,s:st.s};

      st.log.push(`T${st.turn} · Promoted to ${ROLES[st.role]}.`);st.offer=perkOffer();

  const headline=ending?"FUEL LOAD IN SIGHT AT KESTREL POINT":promo?`LOCAL BUILDER NAMED ${ROLES[st.role].toUpperCase()}`:worst?`${byId(worst.id).t.toUpperCase()}: QUESTIONS RAISED`:bestw?`${byId(bestw.id).t.toUpperCase()}: CREWS PRAISE CALL`:missed.length?`${missed[0].t.toUpperCase()} LEFT UNANSWERED`:"QUIET WEEK ON THE LAKESHORE";

    ${promo?`<p style="font-size:17px">${esc(promo)}</p>`:""}
    <div class="delta">
      <div><span class="lbl">Finish</span><span class="v num ${dd>0?"c-wrong":dd<0?"c-best":""}">${dd>0?"+":dd<0?"−":""}${Math.abs(dd)} wk</span></div>
      <div><span class="lbl">Window</span><span class="v num ${dw>0?"c-wrong":dw<0?"c-best":""}">${dw>0?"+":dw<0?"−":""}${Math.abs(dw)} wk</span></div>
      <div><span class="lbl">Cost</span><span class="v num ${dc>0?"c-wrong":dc<0?"c-best":""}">${dc>0?"+":dc<0?"−":""}$${Math.abs(dc)}M</span></div>
    </div>
    <div class="newsbox"><span class="lbl">Site progress</span><p>${Math.round(overall())}% complete. ${released.length?`Crews working in: ${released.map(id=>esc(CWA_BY[id].n)).join(", ")}.`:"No crews working: every area is blocked."}</p></div>
    ${news?`<div class="newsbox"><span class="lbl">Site news</span><p>${esc(news.t)}</p><div class="fx">${fxChips(news.e)}</div></div>`:""}
    ${handled.length?`<div><span class="lbl">You handled</span><ul>${handled.map(w=>`<li class="okk"><b>${esc(byId(w.id).t)}</b><span class="note">${GNAME[w.res.g]}</span></li>`).join("")}</ul></div>`:""}
    ${missed.length?`<div><span class="lbl">Left alone</span><ul>${missed.map(sc=>`<li><b>${esc(sc.t)}</b><span>${esc(sc.idle.x)}</span><div class="fx">${fxChips(sc.idle.e)}</div></li>`).join("")}</ul></div>`:`<p class="note">Nothing was left alone this turn.</p>`}
    ${quote?`<div class="opinion"><span class="lbl">From the superintendent's notebook</span><p>${esc(quote)}</p><p class="note">Gord, general superintendent</p></div>`:""}
    ${st.offer?`<div class="perkpick"><span class="lbl">Pick one for your new team</span>${st.offer.map((k,i)=>`<button class="opt" data-perk="${k}"><span class="k">${i+1}</span><span><b>${esc(PERKS[k].n)}</b><br><span class="note">${esc(PERKS[k].d)}</span></span><span></span></button>`).join("")}</div>`:`<div><button class="btn" id="nextturn">${ending?"See how it ended":"Start turn "+(st.turn+1)}</button></div>`}
  </div></div>`;

  st.turn++; drawWeek(); save(); render(); window.scrollTo({top:0,behavior:"smooth"});

window.addEventListener("resize",()=>{if(document.getElementById("tut"))tutPaint()});
document.addEventListener("keydown",e=>{
  if(setOpen){if(e.key==="Escape"){e.preventDefault();toggleSet(false)}return}
  if(helpOpen){if(e.key==="Escape"||e.key==="?"||e.key==="Enter"){e.preventDefault();toggleHelp(false)}return}
  if(e.key==="?"&&!e.metaKey&&!e.ctrlKey){e.preventDefault();toggleHelp(true);return}
  if(QT.on&&!e.metaKey&&!e.ctrlKey&&!e.altKey){qtKey(e);return}
  if(!st||st.over||e.metaKey||e.ctrlKey||e.altKey)return;
  if(modal){if(st.offer){if(/^[1-3]$/.test(e.key)){e.preventDefault();perkTake(st.offer[+e.key-1])}return}if(e.key==="Enter"||e.key==="Escape"){e.preventDefault();closeModal()}return}
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const k=e.key.toLowerCase(),ids=st.week.map(w=>w.id),i=ids.indexOf(cur);
  if(/^[1-4]$/.test(e.key)&&cur){choose(+e.key-1)}
  else if(k==="e"){endTurn()}
  else if("asdfg".includes(k)&&k.length===1&&ids["asdfg".indexOf(k)]){openTag(ids["asdfg".indexOf(k)],1)}
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();const n=i<0?0:(i+(e.key==="ArrowDown"?1:ids.length-1))%ids.length;openTag(ids[n],1)}
  else if(k==="n"){const nx=st.week.find(w=>w.status==="open"&&w.id!==cur);if(nx)openTag(nx.id,1)}
  else if(k==="t"){toggleTheme()}
  else if(k==="m"){Snd.toggle()}
  else if(k==="u"){Mus.toggle()}
});

function renderEnd(){
  setTimeout(musSync,0);
  setWinTitle("Nuclear Construction Tycoon - FINAL.RPT");
  if(st.final==null){const z=(rnd()+rnd()+rnd()-1.5)/1.5;st.short=Math.max(0,85-overall());st.final=+(st.d+z*st.w/2.6+st.short*.4).toFixed(1);save()}
  const fl=addWeeks(TARGET,st.final), late=Math.round(st.final);
  const g=st.grades, total=g.best+g.good+g.weak+g.wrong||1, sound=Math.round(100*(g.best+g.good)/total);
  const score=sound/10+st.s+repAvg()-Math.max(0,late)/8-Math.max(0,st.c)/15;
  if(!st.medalled){st.medalled=1;medGive("finish");if(st.mode!=="nightmare")medGive("hardfin");if(st.mode==="nightmare")medGive("nightfin");if(late<0)medGive("early");if(st.c<0)medGive("under");if(medCount("builds")>=3)medGive("builds3");if(score>=18)medGive("top");st.bid=Date.now();buildsAdd({id:st.bid,when:new Date().toLocaleDateString("en-CA",{month:"short",day:"numeric"}),mode:st.mode,fl:fmtMonth(fl),late,c:+st.c.toFixed(1),s:st.s,sound,rank:rankOf(score),score:+score.toFixed(2)});save()}
  const rank=rankOf(score);st.rankTxt=rank;if(st.mode==="daily")dailySet(st.day,{rank,score:+score.toFixed(2)});
  const seg=k=>`<span class="" style="width:${100*g[k]/total}%;background:var(--${k==="best"?"ok":k==="good"?"info":k==="weak"?"warn":"bad"})" title="${GNAME[k]} ${g[k]}"></span>`;
  app.innerHTML=`<section class="title" data-title="Final Report">
    <div class="kicker"><span class="pill">${st.mode==="daily"?"Daily build · "+st.day:MODE_N[st.mode]}</span><span class="pill">${st.turn} turns</span></div>
    <span class="lbl">Unit 1 fuel load</span><h1>${fmtMonth(fl)}</h1>
    <p class="lede">${late===0?"Right on the target.":Math.abs(late)+" weeks "+(late>0?"after":"ahead of")+" the "+fmtMonth(TARGET)+" target."} The build finished ${st.c>=0?"$"+st.c.toFixed(1)+"M over":"$"+Math.abs(st.c).toFixed(1)+"M under"} its baseline, with a safety culture of ${sgn(st.s)}. The site was ${Math.round(overall())}% complete at the last turn${st.short>0?`, and finishing the last ${Math.round(st.short)}% cost ${Math.round(st.short*.4)} more weeks`:""}.</p>
    <div><span class="lbl">Your rating</span><p class="rank">${rank}</p></div>
    <div class="report">
      <div><span class="lbl">Decision quality</span><p class="num">${sound}% sound calls</p><div class="gbar">${GRADES.map(seg).join("")}</div><p class="note num">Best ${g.best} · Sound ${g.good} · Weak ${g.weak} · Wrong ${g.wrong}</p></div>
      <div><span class="lbl">Luck</span><p>Good calls that went badly: <b class="num">${st.luck.bad}</b></p><p>Bad calls you got away with: <b class="num">${st.luck.good}</b></p><p class="note">Judge the call, not the outcome.</p></div>
      <div><span class="lbl">Reputation</span><div class="reps">${Object.keys(REP).map(k=>`<span class="chip ${st.rep[k]>0?"pos":st.rep[k]<0?"neg":""}">${REP[k]} <b>${sgn(st.rep[k])}</b></span>`).join("")}</div></div>
      <div><span class="lbl">How the fog cleared</span>${fanHTML(st.final)}</div>
      <div><span class="lbl">The site</span>${st.prog?`<p class="num">Pace ${evm().spi.toFixed(2)} &middot; value ${evm().cpi.toFixed(2)}</p><p class="note">$${Math.round(evm().ev)}M of a $${BAC.toLocaleString()}M job built.</p><canvas id="map" width="384" height="232" class="endmap"></canvas>`:""}</div>
    </div>
    ${reviewHTML()}
    ${buildsHTML(st.bid)}
    ${medalsHTML()}
    <div class="modes">${st.mode==="daily"?`<button class="btn" id="share">Copy result</button>`:""}<button class="btn ${st.mode==="daily"?"ghost":""}" id="again">Play again</button>${st.mode!=="nightmare"?`<button class="btn ghost" id="againhard">Try Nightmare</button>`:""}</div>
  </section>`;
  document.getElementById("again").onclick=()=>{clearSaved();start(st.mode==="nightmare"?"nightmare":"career")};
  mapStart();
  app.querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>{revFilter=b.dataset.rv;const y=window.scrollY;renderEnd();window.scrollTo(0,y)});
  const sh=document.getElementById("share");if(sh)sh.onclick=()=>{const t=shareText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{sh.textContent="Copied"},()=>{window.prompt("Copy your result",t)})};
  const ah=document.getElementById("againhard");if(ah)ah.onclick=()=>{clearSaved();start("nightmare")};
}

  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--panel)"/><stop offset="1" stop-color="var(--sunk)"/></linearGradient></defs>
  <rect width="520" height="300" fill="url(#sky)"/>

  <g stroke="color-mix(in srgb,var(--info) 35%,transparent)" stroke-width="1.5">${[248,260,272,286].map((y,i)=>`<line x1="${30+i*40}" x2="${150+i*60}" y1="${y}" y2="${y}"/><line x1="${300+i*20}" x2="${430+i*15}" y1="${y+4}" y2="${y+4}"/>`).join("")}</g>
  <g fill="var(--ink)">
    <rect x="70" y="170" width="380" height="66"/>

    <path d="M250 170a62 62 0 0 1 124 0z"/><rect x="250" y="164" width="124" height="8"/>
    <rect x="384" y="132" width="56" height="104"/><rect x="392" y="104" width="12" height="28"/>
  </g>
  <g fill="var(--hivis)">${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${86+i*44}" y="214" width="16" height="6"/>`).join("")}</g>
  <g stroke="var(--hivis)" stroke-width="4" fill="none" stroke-linecap="square">
    <path d="M60 236V58M60 66h150M60 66l-34 0M60 58l40 8M60 58l-26 8"/>
    <path d="M318 236V40M318 48h-130M318 48h40M318 40l-40 8M318 40l30 8"/>
  </g>
  <g stroke="var(--ink)" stroke-width="1.5"><line x1="180" y1="66" x2="180" y2="128"/><line x1="214" y1="48" x2="214" y2="110"/></g>
  <rect x="170" y="128" width="20" height="10" fill="var(--ink)"/><rect x="206" y="110" width="16" height="8" fill="var(--ink)"/>
  <g class="kestrel" fill="var(--ink)"><path d="M0 0l-22-7 10 9-14 3 26-2 26 2-14-3 10-9z"/><path d="M-3 1l3 9 3-9z"/></g>

function renderTitle(){
  setWinTitle("Program Manager");setTimeout(musSync,0);
  const saved=loadSaved(), canCont=saved&&!saved.over&&Array.isArray(saved.week)&&saved.week.length;
  const ic=(id,icon,label)=>`<button class="picon" id="${id}">${icon}<span>${label}</span></button>`;
  const dg=dailyGet()[todayKey()];
  app.innerHTML=`
  <section class="pm-group" data-title="Nuclear Construction Tycoon">
    <div class="picons">
      ${canCont?ic("cont",ICON.disk,`Continue<br><small>turn ${saved.turn}</small>`):""}
      ${ic("career",ICON.hat,"Career")}
      ${ic("daily",ICON.cal,`Daily Build${dg?`<br><small>${esc(dg.rank)}</small>`:""}`)}
      ${ic("nightmare",ICON.haz,"Nightmare")}
      ${ic("qtIcon",ICON.watch,`Quick Technical${qtScores()[0]?`<br><small>best ${qtScores()[0].score.toLocaleString()}</small>`:""}`)}
      ${ic("settings",ICON.ctl,"Control Panel")}
      ${ic("helpIcon",ICON.book,"Help")}
    </div>
  </section>
  <section class="title" data-title="README.TXT">
    <div class="hero"><div class="hero-txt"><h1>Nuclear Construction Tycoon</h1>
    <p class="lede">Kestrel Point Generating Station, Units 1 &amp; 2. You start as a field coordinator on a nuclear megaproject and work your way up to construction director. Every turn, four things need you and you only have attention for three. Outcomes carry real odds, so a good call can still go badly. Judge yourself by the call.</p>
    <p class="note">This is a hard job. A career build starts 16 weeks late with a boss who doesn't trust you yet. Nightmare starts 24 weeks late and deals five problems a turn. ${S.filter(x=>!x.follow).length} situations, ${S.filter(x=>x.follow).length} follow-ups.</p></div>${heroArt()}</div>
    <div class="rules">
      <div><span class="lbl">Triage</span><p>Whatever you don't open plays out on its own when the turn ends, and usually not well.</p></div>
      <div><span class="lbl">Fog</span><p>The fuel load window shows what nobody knows yet. It narrows slowly.</p></div>
      <div><span class="lbl">Experience</span><p>Each call builds experience in its area. Build enough and you can read the odds.</p></div>
      <div><span class="lbl">Reputation</span><p>Field, boss, engineering, regulator and comms each remember how you treated them.</p></div>
    </div>
  </section>
  ${buildsGet().length?`<section class="title" data-title="Hall of Records">${buildsHTML()}</section>`:""}
  <section class="title" data-title="Medals">${medalsHTML()}</section>`;
  const c=document.getElementById("cont"); if(c) c.onclick=()=>{st=saved;modal=null;prevStrip=null;if(st.ended)closeModal();else render()};
  document.getElementById("career").onclick=()=>start("career");
  document.getElementById("daily").onclick=()=>start("daily");
  document.getElementById("nightmare").onclick=()=>start("nightmare");
  document.getElementById("settings").onclick=()=>toggleSet(true);
  document.getElementById("helpIcon").onclick=()=>toggleHelp(true);
  document.getElementById("qtIcon").onclick=qtStart;
}
function start(mode){if(QT.on){QT.on=false;clearInterval(QT.timer)}st=fresh(mode);{const X=D();st.d=X.d;st.w=X.w;st.hist=[X.w];st.fan=[{d:X.d,w:X.w}];st.rep.b=X.b;st.rep.f=X.f}if(mode==="daily"){st.day=todayKey();st.rs=seedOf("kestrel"+st.day)}modal=null;prevStrip=null;drawWeek();save();render();window.scrollTo({top:0})}

render();
</script>
