{t:"Give each assumption an owner and a recheck date, sooner for the ones that change fast",p:.85,g:"best",n:"An assumption is a check nobody has done yet. Some go stale in weeks, some in years.",ok:{x:"The vendor's shop is full until spring. Found in March, not July. A second shop is lined up.",e:{d:-1,w:-1}},no:{x:"Everything still holds. Now somebody's watching.",e:{w:-1}}},
{t:"Review them all once",p:.6,g:"good",n:"True today, stale again next year.",ok:{x:"All fine, for now.",e:{w:-.5}},no:{x:"The vendor fills up three months later.",e:{d:.5}}},
{t:"They were approved at the start",p:1,g:"wrong",n:"Approved isn't checked.",ok:{x:"The vendor's shop is full. You find out in July.",e:{d:2}}}],
idle:{x:"Nobody reread them.",e:{d:1,w:1}},L:"An assumption is a check you haven't done yet."},

{id:"n_window",r:1,a:"Environment",t:"Forty days of float, one window",x:"The intake cofferdam has forty days of float. The in-water work window closes in forty-one days, when the fish come back.",o:[
{t:"Put the window on the board as a hard deadline and start now",p:.85,g:"best",n:"Forty days of float in front of a window that closes in forty-one is one day of float.",ok:{x:"In the water with three weeks to spare.",e:{d:-.5,r:1}},no:{x:"A barge breaks down. You make the window by four days.",e:{}}},
{t:"Keep the float, watch it weekly",p:.6,g:"weak",n:"Weekly is too slow for a cliff edge.",ok:{x:"It works out.",e:{}},no:{x:"A two-day slip costs a season.",e:{d:6}}},
{t:"Forty days of float is plenty",p:.4,g:"wrong",n:"Miss a window and late becomes a season.",ok:{x:"Made it, barely.",e:{}},no:{x:"Two days late. The work moves to next year.",e:{d:10,c:1}}}],
idle:{x:"Nobody watched the window.",e:{d:4}},L:"Float in front of a closing window isn't float."},

{id:"n_revision",r:1,a:"Quality",t:"Revision 5 in the gang box",x:"Revision 7 of the bolting procedure changed one torque value. Crews in three gang boxes are still working from revision 5 binders.",o:[
{t:"Run procedures as live steps on the crew's phone, so an approved change reaches every crew at once",p:.8,g:"best",n:"A procedure should change in one place, and every run should follow it.",ok:{x:"Revision 8 lands at 10:00 and every crew is on it by 10:05.",e:{en:2,r:1,c:.03}},no:{x:"One crew keeps a binder anyway. You find it.",e:{en:1}}},
{t:"Pull and replace every binder",p:1,g:"good",n:"Done by Friday. Revision 8 starts the hunt again.",ok:{x:"Done by Friday.",e:{}}},
{t:"Email everyone about the change",p:1,g:"wrong",n:"An email doesn't reach a gang box.",ok:{x:"Two crews torque to the old value. Rework.",e:{r:-1,d:.5}}}],
idle:{x:"Revision 5 stayed in the gang boxes.",e:{r:-1}},L:"Change it once, everywhere."},

{id:"n_firewall",r:2,a:"Regulator",t:"A hole in a two-hour wall",x:"An electrician core-drilled a tray through a wall. The wall is a two-hour fire barrier. Nothing on the wall said so, and nothing on his drawing did either.",o:[
{t:"Firestop it properly, then put every rated wall's requirement on the wall itself, traceable from code to drawing to whoever's drilling",p:.8,g:"best",n:"A requirement has to reach the person standing at the wall, not just the binder.",ok:{x:"Firestopped and inspected. Six months later a drill bit stops at a label.",e:{r:2,s:1,c:.2}},no:{x:"The labelling finds eleven more unsealed holes. All fixed.",e:{r:1,c:.4}}},
{t:"Firestop it and brief the electrical crews",p:.75,g:"good",n:"Fixes this hole. The next crew won't have heard.",ok:{x:"Sealed and inspected.",e:{r:1}},no:{x:"A new crew drills another one in May.",e:{r:-1}}},
{t:"Foam it and move on",p:.4,g:"wrong",n:"Foam isn't a rated firestop.",ok:{x:"Nobody looks.",e:{}},no:{x:"The fire inspection finds unrated foam in a rated wall.",e:{r:-3}}}],
idle:{x:"The hole stayed open behind a cable tray.",e:{r:-2,s:-1}},L:"The rule has to reach the person at the wall."},

{id:"n_whiteboard",r:2,a:"Reporting",t:"The whiteboard and the schedule",x:"The schedule has five thousand activities. Your crews run on a three-week whiteboard updated at 6 am. The two stopped matching months ago.",o:[
{t:"Make the whiteboard a close-up of the same plan, so marks on the board update the schedule",p:.8,g:"best",n:"Both are right. The contract needs memory, the crew needs Tuesday. Make them one plan at two zoom levels.",ok:{x:"Within a month the schedule describes the job actually being built.",e:{w:-3,en:1}},no:{x:"Clunky for a few weeks.",e:{w:-1}}},
{t:"Have the scheduler copy the whiteboard every Friday",p:.6,g:"good",n:"Better. Still a week behind.",ok:{x:"Closer.",e:{w:-1}},no:{x:"Fridays get busy.",e:{}}},
{t:"Tell the crews to work from the schedule",p:1,g:"wrong",n:"The wall always wins.",ok:{x:"They nod. They keep using the whiteboard.",e:{f:-2,w:1}}}],
idle:{x:"The two plans drifted further apart.",e:{w:1}},L:"Make the plan the crews use write back."},

{id:"n_greens",r:2,a:"Reporting",t:"Who turned this green?",x:"The weekly report is a wall of green cells. You ask who checked them. Nobody can say.",o:[
{t:"Every green needs a name on it from now on, like a weld stamp",p:.8,g:"best",n:"A free green drifts optimistic. A signed one means something.",ok:{x:"There are fewer greens. They're true. People read the report.",e:{b:1,w:-2,f:-1}},no:{x:"Some leads say it's slower. The greens are still real.",e:{w:-1,f:-1}}},
{t:"Spot-check five greens a week yourself",p:.6,g:"good",n:"You'll find some. You can't check them all.",ok:{x:"You catch two.",e:{w:-1}},no:{x:"The ones you didn't check were the bad ones.",e:{}}},
{t:"Green is green",p:1,g:"wrong",n:"Green is often the colour of nobody wanting the argument.",ok:{x:"Three greens turn red together in the spring.",e:{w:1}}}],
idle:{x:"The greens stayed green.",e:{w:1}},L:"Green should cost a name."},

{id:"n_roadmap",r:2,a:"Strategy",t:"The roadmap slide",x:"Corporate loves a roadmap slide: boxes, arrows, no dates, no owners. They want the project presented on one.",o:[
{t:"Draw the slide straight from the schedule and the owners, so it's a view of the real plan",p:.8,g:"best",n:"A picture that can't disagree with reality is decoration.",ok:{x:"It looks the same, but when a date moves, the slide moves too.",e:{b:1,w:-1}},no:{x:"It shows a late box. Corporate asks about it. Good.",e:{b:-1,w:-1}}},
{t:"Make the slide, and keep the real plan separate",p:1,g:"weak",n:"Now there are two sets of books.",ok:{x:"Two sets of books.",e:{}}},
{t:"Make the slide beautiful",p:1,g:"wrong",n:"It can't be wrong, so it can't help.",ok:{x:"Everyone loves it. It helps nobody.",e:{b:1,w:1}}}],
idle:{x:"Corporate drew its own.",e:{b:-1}},L:"Draw the picture from the plan."},

{id:"n_surprise",r:2,a:"Engineering",t:"No surprises this month",x:"For the first time, the team logged zero new problems this month. Your leads want to celebrate.",o:[
{t:"Check how much looking happened too: walkdowns, rechecks, questions asked",p:.8,g:"best",n:"A job that stops surprising you is either done learning or done looking. Count the looking.",ok:{x:"Walkdowns fell by two thirds. You restart them. Six problems turn up in a week.",e:{w:-2,en:1}},no:{x:"The looking held steady. The fog really is lifting.",e:{w:-1}}},
{t:"Celebrate, and keep an eye on it",p:.6,g:"weak",n:"The falling line looks the same either way.",ok:{x:"It was real.",e:{}},no:{x:"The surprises were saving themselves up.",e:{w:2}}},
{t:"Cut the walkdown team. Nothing's turning up",p:1,g:"wrong",n:"Nothing turns up when nobody looks.",ok:{x:"Next quarter, twenty surprises arrive at once.",e:{w:3,c:-.1}}}],
idle:{x:"Nobody asked why it went quiet.",e:{w:1}},L:"Count the looking, not just the finding."},

{id:"n_redline",r:2,a:"Engineering",t:"This month's critical path",x:"The critical path moved again. Last month it ran through the turbine hall, this month through the cable spreading room. Crews are being yanked back and forth.",o:[
{t:"Run the schedule a thousand times with real uncertainty, and protect the paths that come up critical most of the time",p:.8,g:"best",n:"The red line is one possible future. Some paths are critical most mornings.",ok:{x:"Two paths are critical in more than half the runs. They get your best crews every month.",e:{d:-1.5,f:1}},no:{x:"The results take a month to trust.",e:{d:-.5}}},
{t:"Protect this month's path and last month's",p:1,g:"good",n:"Safer, more expensive.",ok:{x:"Both get crews. Something else starves.",e:{c:.2}}},
{t:"Chase this month's red line",p:1,g:"wrong",n:"Chasing one printout whipsaws the crews.",ok:{x:"Next month it moves again.",e:{d:1,f:-1}}}],
idle:{x:"The crews were moved again.",e:{f:-1,d:.5}},L:"The red line is one draw."},

{id:"n_spine",r:2,a:"Commercial",t:"Four breakdowns, one meeting",x:"The estimate, the schedule, cost control and the work packages each have their own breakdown. A standing Thursday meeting reconciles them. Four people, all afternoon.",o:[
{t:"Keep one breakdown and make every other shape a view of it",p:.8,g:"best",n:"Copies drift. References don't. The meeting was rent on the copies.",ok:{x:"The Thursday meeting ends. The numbers stop arguing.",e:{c:-.3,w:-1,en:1}},no:{x:"The mapping takes a month. Then the meeting ends.",e:{c:-.1}}},
{t:"Hire a reconciliation analyst",p:1,g:"weak",n:"Pays the rent faster.",ok:{x:"The meeting gets shorter.",e:{c:.1}}},
{t:"Keep the meeting. It works",p:1,g:"wrong",n:"It works, every Thursday, forever.",ok:{x:"Every Thursday, forever.",e:{c:.2}}}],
idle:{x:"Thursday came round again.",e:{c:.1}},L:"One breakdown. Everything else is a view."},

{id:"n_corner",r:3,a:"Strategy",t:"Where do you stand?",x:"The risk register has 300 lines sorted by probability times impact. Near the bottom, a low-probability line: the reactor vessel lift has no backup crane plan.",o:[
{t:"Pull out the risks that are severe and can't be undone, and put a senior person physically at each of those moments",p:.8,g:"best",n:"Where severe meets irreversible, probability stops mattering. It says where someone has to be standing.",ok:{x:"You're at the vessel lift the morning a sling shows wear. It's swapped before the lift.",e:{s:2,r:1}},no:{x:"The lift goes clean. The point was being there.",e:{s:1}}},
{t:"Re-sort the register by severity",p:1,g:"good",n:"Closer. It still treats a slow bleed like a one-way door.",ok:{x:"The vessel lift moves up the list.",e:{s:1}}},
{t:"Work the register top to bottom",p:.6,g:"wrong",n:"The top lines are papercuts with high scores.",ok:{x:"The lift goes fine. You were lucky.",e:{}},no:{x:"A sling frays mid-lift. The vessel is set down, damaged. Six weeks.",e:{s:-3,d:6,r:-2}}}],
idle:{x:"The register stayed sorted the old way.",e:{s:-1}},L:"Find the one-way doors, and stand at them."},

{id:"n_seven",r:3,a:"Strategy",t:"Seven systems",x:"What stopped work this week: a missing spool, an unsigned permit, a crane booked elsewhere, high wind, a crowded room, a dose budget, and one logic tie. They live in seven systems with seven owners.",o:[
{t:"Put them all in one list asking the same four things: what it blocks, what clears it, who owns it, when it expires",p:.8,g:"best",n:"They're all the same kind of thing: a condition that has to be true before work can go ahead.",ok:{x:"For the first time, one list shows everything that's stopping work. The morning meeting gets shorter.",e:{w:-3,d:-1,en:1,c:.5}},no:{x:"Messy for a few months. Worth it by summer.",e:{w:-1,c:.5}}},
{t:"Hold a weekly meeting of the seven owners",p:1,g:"good",n:"A tax on the seven systems, paid weekly.",ok:{x:"Things get caught a week late.",e:{w:-1}}},
{t:"Each system has an owner. That's enough",p:1,g:"wrong",n:"Seven owners, and nobody owns the work stopping.",ok:{x:"Each system is right. The job still stops.",e:{w:1}}}],
idle:{x:"Seven systems, seven answers.",e:{w:1}},L:"Most of what stops work isn't on the schedule."},

{id:"n_baseline",r:3,a:"Reporting",t:"Measuring against day one",x:"Two winters and forty change orders since the start, every report still measures against the original baseline. Nobody believes it. Rebaselining feels like a confession.",o:[
{t:"Keep every forecast you make, score them against what actually happens, and treat the next baseline as just the next entry",p:.8,g:"best",n:"The baseline is a photo. Keep the whole album and grade the forecasters.",ok:{x:"Rebaselining stops being political. The board starts asking whose forecasts score best.",e:{b:1,w:-2}},no:{x:"The first scoring shows your team runs optimistic. Useful, and uncomfortable.",e:{b:-1,w:-2}}},
{t:"Rebaseline once, now",p:1,g:"good",n:"Fixes today. Rots again by next winter.",ok:{x:"A fresh baseline. A hard board meeting.",e:{b:-1,w:-1}}},
{t:"Keep the original baseline",p:1,g:"wrong",n:"Measuring the distance to a plan nobody believes.",ok:{x:"The variance grows until it means nothing.",e:{b:-1,w:1}}}],
idle:{x:"The reports kept measuring against day one.",e:{w:1}},L:"A baseline is a photo. The job keeps moving."},

{id:"n_fog",r:3,a:"Reporting",t:"Green, and getting later",x:"The quantities report is green every month. But the fuel load window hasn't narrowed in six months. The board only sees the green.",o:[
{t:"Report how fast the window is narrowing next to the quantities, and grade your own forecasts against what happens",p:.8,g:"best",n:"Quantities moving while the fog stays put is the corner to worry about. Measure the fog.",ok:{x:"The board starts asking about the window. A month that closed a big open question gets credit, even with low quantities.",e:{b:1,w:-3,r:1}},no:{x:"The board doesn't like the new number at first. It catches on.",e:{w:-2,b:-1}}},
{t:"Add a note about the window",p:1,g:"weak",n:"Notes don't get read.",ok:{x:"Nobody reads it.",e:{w:-1}}},
{t:"Green is green. The board is happy",p:1,g:"wrong",n:"Green and getting later is the worst place to be happy.",ok:{x:"The window stays wide while everyone celebrates.",e:{b:1,w:2}}}],
idle:{x:"The board kept seeing green.",e:{w:1}},L:"Measure the fog, not just the work."},

// ----- Day one: always the first thing on your desk -----
{id:"roof",r:0,first:1,cwa:"tb",a:"Safety",t:"The old turbine building roof",x:"Your first job. The old station's turbine building roof is being replaced before Unit 1's switchgear moves in underneath. It's flat, 30 metres up, with no parapet. The roofing crew starts Monday. How do you protect the edge?",o:[
{t:"Install permanent handrail around the roof edge",p:.85,g:"best",n:"Guardrail protects everyone without anyone having to do anything right, and it stays for every roofer and maintenance tech for the next forty years.",ok:{x:"The rail goes up in four days. The roofers barely notice it, which is the point. Maintenance thanks you for a decade.",e:{s:2,d:.4,c:.12,f:1,en:1}},no:{x:"The old roof edge won't take the rail bolts. Engineering designs clamp-on posts. A week late, still the right answer.",e:{s:2,d:1,c:.18}}},
{t:"Put up temporary handrail for the job",p:.85,g:"good",n:"Passive protection, and quick. It comes down when the roofers leave, and the next crew up there has nothing.",ok:{x:"Up in two days. A clean job.",e:{s:1,d:.2,c:.05}},no:{x:"A section is moved for a material hoist and not put back for an afternoon. Caught on a walk.",e:{s:-1,d:.2,c:.05}}},
{t:"Install tie-off anchors and have everyone harness up",p:.6,g:"weak",n:"Fall arrest only works if every person ties off every time, and somebody has to be able to get a hanging worker down fast.",ok:{x:"Anchors in, crews tied off. Slower work, no falls.",e:{s:1,d:.4,c:.06}},no:{x:"A roofer unclips to move a hose and steps backward. His partner grabs his vest. Nobody falls. Nobody talks for an hour.",e:{s:-2,d:.3,c:.06}}},
{t:"Run a bump line two metres back from the edge",p:.45,g:"wrong",n:"A warning line tells people where the edge is. It doesn't stop anyone going over it.",ok:{x:"Cheap and fast. Nobody crosses it. This time.",e:{c:.01}},no:{x:"A roofer backing up with a torch cart walks straight through the line and stops a metre from the edge. Stop-work, and a call from the regulator.",e:{s:-3,r:-1,d:1}}}],
idle:{x:"Nobody decided. The roofers strung a rope along the edge and got on with it.",e:{s:-2,d:.3}},L:"Protect the edge so nobody has to remember to."},

{id:"roof2",r:0,follow:1,cwa:"tb",a:"Safety",t:"Who gets him down?",x:"The roofers are tied off. Your safety lead asks what nobody has answered: if someone falls and hangs in his harness, who gets him down, and how fast? The nearest fire service is 25 minutes away.",o:[
{t:"Write a rescue plan, stage a rescue kit on the roof, and drill it with the crew this week",p:.9,g:"best",n:"Hanging in a harness, a person has minutes, not the time it takes the fire service to drive out.",ok:{x:"The drill takes eleven minutes the first time and four by Friday.",e:{s:2,f:1}},no:{x:"The kit arrives late. The drill happens the following week.",e:{s:1}}},
{t:"Switch to handrail instead",p:.85,g:"good",n:"Take away the fall and you take away the rescue.",ok:{x:"The rail goes up. The harnesses go back in the trailer.",e:{s:1,d:.4,c:.1}},no:{x:"The rail takes a week.",e:{d:1,c:.1}}},
{t:"Call the fire service if it happens",p:.5,g:"wrong",n:"Twenty-five minutes is far too long to hang in a harness.",ok:{x:"Nobody falls.",e:{}},no:{x:"An inspector asks to see the rescue plan. There isn't one.",e:{r:-2,s:-1}}}],
idle:{x:"The question went unanswered.",e:{s:-1}},L:"A fall arrest plan includes the rescue."},

// ----- Follow-ups: only appear when an earlier call sets them up -----
{id:"rick2",r:0,follow:1,a:"Safety",t:"The pressure behind Rick",x:"Rick told you the boss is on him to skip the talks. The boss is Dale, the superintendent. Dale's bonus is tied to metres of wall per week.",o:[
{t:"Take it to Dale with Rick's numbers: ten minutes of talk a day costs less than one stand-down",p:.75,g:"best",n:"Change the math the pressure comes from.",ok:{x:"Dale grumbles, then agrees. He asks the area manager to add a safety measure to the bonus. It gets added.",e:{s:2,b:1,f:1}},no:{x:"Dale says fine, then keeps leaning on Rick quietly. You'll have to watch it.",e:{s:1,f:-1}}},
{t:"Report Dale to safety",p:.6,g:"good",n:"Correct, and it may land on Rick.",ok:{x:"Safety talks to Dale. The talks run.",e:{s:1,b:-1}},no:{x:"Dale figures out who talked. Rick gets the worst jobs for a month.",e:{f:-2}}},
{t:"Let it go now the talks are back",p:.4,g:"wrong",n:"The pressure is still there. It will find another corner.",ok:{x:"It holds.",e:{}},no:{x:"Two months later Dale's crews stop doing ladder inspections.",e:{s:-2}}}],
idle:{x:"Nothing changed upstream. The talks quietly stopped again.",e:{s:-1}},L:"Fix the pressure, not just the symptom."},

{id:"walter2",r:2,follow:1,a:"People",t:"Three more people living in trucks",x:"After Walter, three more workers admit they're living in their trucks in the north lot. Rents in town have doubled since the project started.",o:[
{t:"Set up a housing fund with the union and the town, paid partly from the project",p:.8,g:"best",n:"The project made the housing problem. It can help fix it.",ok:{x:"Forty units of temporary housing by winter. Turnover on night shift drops by a third.",e:{f:3,cm:2,c:1.5,d:-.5}},no:{x:"The town drags its feet. Twelve units by winter. It's a start.",e:{f:2,c:1}}},
{t:"Quietly allow trucks in the north lot with a heated washroom",p:.7,g:"weak",n:"Kind, and it makes the project a campground.",ok:{x:"It works for the winter.",e:{f:1}},no:{x:"A reporter finds the lot.",e:{cm:-2}}},
{t:"It's not the project's problem",p:.5,g:"wrong",n:"It's your workforce's problem, so it's yours.",ok:{x:"They find rooms.",e:{f:-1}},no:{x:"Two of them quit. One was your best rigger.",e:{f:-2,w:1}}}],
idle:{x:"Nobody acted. Two of them quit before winter.",e:{f:-2}},L:"Your workforce's problems are your problems."},

{id:"falcons2",r:2,follow:1,a:"Comms",t:"A network wants a documentary",x:"The falcon livestream has a million views. A national network wants a documentary crew on site for six months.",o:[
{t:"Yes, with a site safety escort, no access to security areas, and your people's consent",p:.8,g:"best",n:"Let them in on terms that protect the work and the people.",ok:{x:"The documentary is mostly about the crews. Applications to the trades programme double.",e:{cm:3,f:2,c:.2}},no:{x:"One episode dwells on a cost overrun. Fair, but it stings.",e:{cm:1,b:-1}}},
{t:"No cameras on a nuclear site",p:.9,g:"good",n:"Safe, and a missed chance.",ok:{x:"They film the falcons from a boat.",e:{}},no:{x:"They film from a boat and speculate about what you're hiding.",e:{cm:-1}}},
{t:"Yes, full access",p:.4,g:"wrong",n:"Full access on a nuclear site is a security finding waiting to happen.",ok:{x:"Great footage.",e:{cm:2}},no:{x:"A camera operator wanders into a controlled area.",e:{r:-3,cm:-1}}}],
idle:{x:"The network gave up and made a film about a different project.",e:{}},L:"Let people in on terms that protect the work."},

{id:"wrench2",r:2,follow:1,a:"Regulator",t:"A socket in the impeller",x:"The flush pulled a 10 mm socket into a primary pump impeller. The pump needs to come apart. The regulator doesn't know yet.",o:[
{t:"Report it today, with the timeline and what you're changing in foreign-material control",p:.9,g:"best",n:"A bad day reported early is a bad day. Found later, it's a bad year.",ok:{x:"The regulator accepts the report and your new tool-tether rule. The pump is rebuilt in five weeks.",e:{r:1,d:1}},no:{x:"The regulator adds an inspection hold. Still better than the alternative.",e:{d:2}}},
{t:"Fix the pump first, report when it's back together",p:.4,g:"wrong",n:"Late reporting turns an equipment problem into an integrity problem.",ok:{x:"Reported late. A warning letter.",e:{r:-2}}, no:{x:"The regulator hears from a contractor first.",e:{r:-5,b:-2}}},
{t:"Ask the vendor to assess the impeller before deciding",p:.6,g:"weak",n:"The vendor's view doesn't change what you have to report.",ok:{x:"The vendor confirms the damage. You report a day late.",e:{r:-1}},no:{x:"A week of vendor back-and-forth, then a late report.",e:{r:-2,d:1}}}],
idle:{x:"Nobody owned the report. The regulator found out from a contractor.",e:{r:-4}},L:"Report the bad day early."},

{id:"ken2",r:1,follow:1,a:"People",t:"Ken's knowledge walks out the door",x:"Ken took the turbine job. His deputy is good, but Ken carried fifteen years of supplier history in his head.",o:[
{t:"Ask Ken for two afternoons to walk his deputy through the supplier files, paid as consulting",p:.85,g:"best",n:"People leave. Their knowledge doesn't have to.",ok:{x:"Ken says yes, and adds a third afternoon unpaid. The deputy fills a notebook.",e:{f:1,w:-1}},no:{x:"Ken's new boss says no. You get one phone call.",e:{w:1}}},
{t:"Let the deputy learn on the job",p:.6,g:"weak",n:"Learning on the job means learning from mistakes.",ok:{x:"She picks it up.",e:{}},no:{x:"A supplier problem Ken would have caught slips through.",e:{d:1.5,en:-1}}},
{t:"Hire an outside quality lead over the deputy",p:.5,g:"wrong",n:"New person, no history, and a deputy who now feels passed over.",ok:{x:"A good hire.",e:{c:.3}},no:{x:"The deputy quits too.",e:{f:-2,w:2}}}],
idle:{x:"Nothing was done. Ken's knowledge left with him.",e:{w:1,d:1}},L:"Write down what people know before they go."},

{id:"fuelpr2",r:3,follow:1,a:"Comms",t:"The public date has slipped",x:"The early date corporate announced is gone. The press wants a new date by Friday. Your window is still five months wide.",o:[
{t:"Announce a range, say plainly why the first date was wrong, and commit to a date when you'd bet on it",p:.8,g:"best",n:"Own the miss, then promise only what you know.",ok:{x:"A hard week of headlines, then the coverage turns to the plan. Credibility recovers.",e:{cm:2,b:-1,r:1}},no:{x:"The headlines last two weeks.",e:{cm:1,b:-1}}},
{t:"Announce the next-most-optimistic date",p:.25,g:"wrong",n:"Missing twice is a pattern.",ok:{x:"You make it. Barely.",e:{cm:1}},no:{x:"You miss again. The minister calls for a review.",e:{cm:-4,b:-3}}},
{t:"No new date until the window narrows",p:.6,g:"weak",n:"Silence after a miss reads as worse news.",ok:{x:"The press moves on.",e:{cm:-1}},no:{x:"\"Nuclear Project Won't Say When.\"",e:{cm:-3}}}],
idle:{x:"Corporate picked a new date without you.",e:{cm:-2,b:-1}},L:"Own the miss, then promise what you know."},

{id:"press2",r:3,follow:1,a:"Culture",t:"The engineer from the emails",x:"The engineer whose weld concern was overruled years ago writes to you. She'd like to speak at the all-hands about what happened.",o:[
{t:"Invite her, and stand on the stage while she speaks",p:.85,g:"best",n:"The site needs to see that being right and ignored is now safe to talk about.",ok:{x:"Six hundred people in the hall. She gets a standing ovation. Concerns raised through the system double the next quarter.",e:{f:3,r:2,en:2}},no:{x:"Some managers are uncomfortable. That was partly the point.",e:{f:2,b:-1}}},
{t:"Thank her and suggest a written statement instead",p:.6,g:"weak",n:"A statement is safer, and nobody reads it.",ok:{x:"It goes in the newsletter.",e:{}},no:{x:"She takes it as a no.",e:{en:-1}}},
{t:"Decline, it reopens old wounds",p:.4,g:"wrong",n:"The wounds are open whether you speak of them or not.",ok:{x:"Things stay quiet.",e:{f:-1}},no:{x:"She gives the talk to a newspaper instead.",e:{cm:-2,f:-2}}}],
idle:{x:"Her letter went unanswered.",e:{en:-1,f:-1}},L:"Make it safe to have been right."},

// ----- Package lead -----
{id:"dome",r:1,a:"Engineering",t:"Dome detail not issued",x:"Engineering hasn't settled how the dome rebar ties into the wall. The new detail may need couplers cast into the top four metres, which you pour in eleven days. The full detail is three weeks out.",o:[
{t:"Push engineering to issue just the coupler layout in ten days",p:.8,g:"best",n:"You don't need the whole answer, just the part that's about to become irreversible.",ok:{x:"The stamped coupler layout lands on day nine. Couplers cast in. The full detail later matches.",e:{en:1,w:-6}},no:{x:"It slips two days. You hold the top lift briefly.",e:{d:1,w:-3}}},
{t:"Hold the top four metres until the full detail is issued",p:.9,g:"good",n:"Safe, slow.",ok:{x:"Three weeks of hold, then pour.",e:{d:2,w:-3}},no:{x:"The detail slips again. Five weeks lost.",e:{d:4}}},
{t:"Pour as planned and deal with it later",p:.2,g:"wrong",n:"Erasers are cheaper than excavators.",ok:{x:"The detail ends up needing no couplers.",e:{}},no:{x:"Couplers needed. Drilling and epoxy into a containment wall, with the regulator watching.",e:{d:6,c:2,r:-2,en:-1}}}],
idle:{x:"Nobody chased it. The pour went ahead and couplers had to be drilled in afterwards.",e:{d:5,c:1.5,r:-1}},L:"Decide early, commit carefully."},

{id:"liner",r:1,a:"Procurement",t:"Liner plates stuck at the mill",x:"Your PO lets you inspect at the mill. Your inspector finds two thirds of the containment liner plates rolled and good. The last third is stuck behind the mill's own certification paperwork.",o:[
{t:"Send your quality lead to help untangle their certification",p:.8,g:"best",n:"Sometimes the fastest way through someone else's problem is to help them solve it.",ok:{x:"A third-party lab report sat in an inbox for a month. Ken gets it in two days. Plates arrive six weeks earlier than they would have.",e:{w:-6,d:-2}},no:{x:"Slower than hoped, but the plates ship.",e:{w:-2}}},
{t:"Find a second supplier for the last third",p:.4,g:"weak",n:"Qualifying a nuclear supplier takes longer than the problem.",ok:{x:"A backup qualifies in record time.",e:{c:1.5}},no:{x:"Qualification takes five months. You end up waiting for the original anyway.",e:{d:3,c:1}}},
{t:"Accept the later date and re-plan around it",p:.7,g:"weak",n:"Passive. Fine if nothing else can move it.",ok:{x:"The re-plan absorbs most of it.",e:{d:3}},no:{x:"The mill slips further.",e:{d:6}}}],
idle:{x:"Nobody chased the mill. The plates came eleven weeks late.",e:{d:8,w:2}},L:"Use the rights your contract already gives you."},

{id:"thaw",r:1,a:"Logistics",t:"Spring thaw on the laydown",x:"Two weeks to thaw. Last year trucks were stuck for three weeks. Gravel and matting would cost about $400,000.",o:[
{t:"Lay gravel and matting now",p:.85,g:"best",n:"Prevention looks expensive until you compare it with the cure.",ok:{x:"Heavy rain on snowmelt. Your yard holds; the next package loses two and a half weeks.",e:{c:.4,d:-1,b:1}},no:{x:"A mild spring. Money spent, nothing to show for it this year.",e:{c:.4}}},
{t:"Move critical material to paved areas, accept some mud",p:.6,g:"good",n:"Cheap partial fix.",ok:{x:"Works mostly.",e:{d:.5}},no:{x:"The pavement runs out. A week stuck.",e:{d:1.5}}},
{t:"Do nothing",p:.3,g:"wrong",n:"Weather you can predict is a choice, not bad luck.",ok:{x:"Dry spring. Lucky.",e:{}},no:{x:"Three weeks of trucks in mud.",e:{d:3,c:.6}}}],
idle:{x:"Nothing was done. The yard turned to soup for three weeks.",e:{d:3,c:.5}},L:"Price the cure before you call prevention expensive."},

{id:"ken",r:1,a:"People",t:"Your best lead has an offer",x:"Ken, your quality lead, has an offer from the turbine island, 20% more. Your salary cap has room for about 10%.",o:[
{t:"Match 10% and add a senior title",p:.75,g:"best",n:"People stay for trust and growth more than the last dollar.",ok:{x:"He stays. \"The title says you meant it.\"",e:{f:1}},no:{x:"He goes anyway, on good terms. His deputy steps up.",e:{w:1}}},
{t:"Let him go and promote from within",p:.6,g:"weak",n:"Sometimes right, but you lose a lot of knowledge cheaply.",ok:{x:"His deputy turns out to be strong.",e:{}},no:{x:"The deputy struggles for two months.",e:{w:2,d:1}}},
{t:"Give him 20% by squeezing another lead's raise",p:.6,g:"wrong",n:"Word gets out. Robbing one person to pay another costs you both.",ok:{x:"Ken stays. The other lead finds out.",e:{f:-2}},no:{x:"Ken stays, the other lead quits.",e:{f:-2,w:2}}}],
idle:{x:"You didn't respond. Ken took the offer.",e:{w:2,f:-1}},L:"Keep people with trust; keep what they know by writing it down."},

{id:"target",r:1,a:"Reporting",t:"Corporate wants it two months sooner",x:"Corporate announces the shield wall must finish two months earlier than your window says. Your Monte Carlo gives that about a 20% chance.",o:[
{t:"Accept it and push hard",p:.25,g:"wrong",n:"A target your own data says is unlikely just moves the cost around.",ok:{x:"Somehow you make it.",e:{b:2,c:3}},no:{x:"Fatigue, a dropped form panel, a stand-down, a cold joint. You miss by five weeks and spend $6M on overtime.",e:{c:6,s:-2,b:-1,d:1}}},
{t:"Push back with the data and an offer: a second formwork set for $2M",p:.8,g:"best",n:"Push back with data and an offer, not just a no.",ok:{x:"Corporate funds the formwork and moves the target to mid-window. You finish a week inside it.",e:{b:2,c:2,d:-3}},no:{x:"They fund it but keep the target. You miss by two weeks, no blowout.",e:{c:2,d:-1}}},
{t:"Accept it publicly, quietly plan for your own date",p:.5,g:"weak",n:"Two schedules is one lie.",ok:{x:"Nobody notices the gap until you finish on your own date.",e:{b:-1}},no:{x:"The controls group finds the second schedule.",e:{b:-3}}}],
idle:{x:"You said nothing, so the target stood. You missed it.",e:{b:-2}},L:"Bring the model."},

{id:"transformer",r:1,a:"Procurement",t:"Transformer order",x:"Needed in 14 months. Standard: $8M, 12-month lead. Upgraded: $11M, 14-month lead. The grid operator decides in 8 months, coin flip. Swapping later costs $9M plus six months (about $20M).",o:[
{t:"Order standard now",p:.5,g:"weak",n:"Expected cost about $22.5M.",ok:{x:"The upgrade isn't required.",e:{c:0}},no:{x:"The upgrade is required. $9M and six months.",e:{c:9,d:26}}},
{t:"Order upgraded now",p:1,g:"best",n:"Certain $11M beats an expected $22.5M.",ok:{x:"Arrives on time. Whatever the grid operator decides, you're covered.",e:{c:3}}},
{t:"Wait for the grid decision",p:0,g:"wrong",n:"The information arrives after the last responsible moment, so it's worth nothing.",ok:{x:"",e:{}},no:{x:"You order in month 8. It lands six to eight months late either way.",e:{d:28,c:2}}}],
idle:{x:"Nobody placed the order. It arrived months late.",e:{d:24,c:2}},L:"Information only has value if it arrives before you must commit."},

{id:"grout",r:1,a:"Geotech",t:"Grout the turbine foundation?",x:"30% chance the soil needs grouting. Grouting now: $10M. Skip and need it: $40M later. Boreholes: $1M plus a six-week delay worth $3M.",o:[
{t:"Grout now to be safe",p:1,g:"weak",n:"Certain $10M to avoid a risk information could clear for less.",ok:{x:"Grouted. Probably unnecessary.",e:{c:10}}},
{t:"Drill boreholes first",p:.7,g:"best",n:"About $7M expected. Value of information.",ok:{x:"Clean soil. No grouting needed.",e:{c:4,d:1.5}},no:{x:"Grouting needed, and now you know exactly where.",e:{c:13,d:1.5}}},
{t:"Skip it",p:.7,g:"wrong",n:"About $12M expected, with the worst tail.",ok:{x:"Lucky.",e:{}},no:{x:"Settlement under the pedestal. $40M fix.",e:{c:40,d:10}}}],
idle:{x:"No decision, so the foundation went in untested. The soil needed grouting.",e:{c:40,d:10}},L:"Sometimes the cheapest move is to find out."},

{id:"heat",r:1,a:"Quality",t:"Heat numbers don't match",x:"Anchor bolts arrive with certs that match the PO, but the heat numbers stamped on the bolts don't match the certs.",o:[
{t:"Accept them, the certs show the right grade",p:.4,g:"wrong",n:"A cert only proves the material it names.",ok:{x:"Turns out a clerical mix-up.",e:{}},no:{x:"The bolts are suspect items. Removal after installation.",e:{d:3,c:.5,r:-2}}},
{t:"Quarantine and raise an NCR",p:.95,g:"best",n:"Traceability broken means the bolts have none. Check other deliveries too.",ok:{x:"The supplier mixed lots. Replacements in a week. Two other deliveries checked.",e:{en:1,r:1}},no:{x:"The supplier fights it for three weeks.",e:{d:1}}},
{t:"Test a sample to confirm the material",p:.6,g:"weak",n:"Testing confirms chemistry, not traceability.",ok:{x:"Material is fine, but QA still won't accept it without an NCR.",e:{d:.5}},no:{x:"One sample fails.",e:{d:2}}}],
idle:{x:"The bolts were installed before anyone checked.",e:{d:3,c:.5,r:-1}},L:"Traceability is the evidence."},

{id:"wps",r:1,a:"Quality",t:"A weld procedure that doesn't cover it",x:"The piping sub wants to start welding the 60 mm thick headers. Their qualified procedure covers up to 38 mm. Qualifying a new one takes about three weeks.",o:[
{t:"Hold the thick joints, qualify the new procedure, keep welding everything in range",p:.85,g:"best",n:"Weld what's covered, qualify what isn't, and don't let the two blur.",ok:{x:"The new procedure is qualified in 19 days. The crew stayed busy on thinner joints the whole time.",e:{en:1,r:1,d:.5}},no:{x:"The first test coupon fails a bend test. Another ten days.",e:{d:1.5}}},
{t:"Let them start, it's the same process",p:.25,g:"wrong",n:"An unqualified procedure on a nuclear weld means every one of those welds is suspect.",ok:{x:"Nobody notices for now.",e:{}},no:{x:"The regulator's audit flags 40 welds made outside the qualified range. Cut out and redone.",e:{d:6,c:3,r:-3}}},
{t:"Ask engineering whether an evaluation can cover it",p:.6,g:"good",n:"Sometimes possible, but don't stake the schedule on it.",ok:{x:"Engineering confirms a supplementary qualification will be needed anyway, and starts it.",e:{en:1,d:.5}},no:{x:"Two weeks of debate, then the same answer.",e:{d:1.5}}}],
idle:{x:"Nobody stopped the sub. Welds outside the qualified range were found in an audit.",e:{d:4,c:2,r:-2}},L:"Qualification is the evidence."},

{id:"craneq",r:1,a:"Logistics",t:"Everyone wants the tower crane",x:"Four subs share one tower crane. Each says their picks are critical. The mechanical foreman threatened to walk off yesterday.",o:[
{t:"Run a 15-minute crane meeting every afternoon, ranked by critical path",p:.85,g:"best",n:"A shared resource needs a visible rule. The critical path is the rule.",ok:{x:"Within a week the arguing stops. Crane hours used rises from 61% to 83%.",e:{f:2,d:-1}},no:{x:"The meeting helps, but one sub keeps jumping the queue.",e:{f:1,d:-.3}}},
{t:"First come, first served",p:.4,g:"weak",n:"Fair to the subs, blind to the schedule.",ok:{x:"Works when the week is quiet.",e:{}},no:{x:"The critical steel waits two days behind a load of handrail.",e:{d:1.5}}},
{t:"Give the mechanical foreman what he wants to keep the peace",p:.4,g:"wrong",n:"Reward the loudest and you'll get more shouting.",ok:{x:"He calms down.",e:{f:-1}},no:{x:"Now three foremen threaten to walk.",e:{f:-3,d:1}}}],
idle:{x:"No rule was set. The crane went to whoever shouted.",e:{f:-2,d:1}},L:"Shared resources need a visible rule."},

{id:"co",r:1,a:"Commercial",t:"A $4.2M change order",x:"A design change moved a set of penetrations. The contractor's change order is $4.2M. Your estimator thinks $2.6M is fair.",o:[
{t:"Ask for an open-book breakdown and get an independent estimate",p:.8,g:"best",n:"Make the number visible on both sides, then argue about the parts, not the total.",ok:{x:"Their breakdown double-counts the crane. Settled at $2.9M in a week, and the relationship holds.",e:{c:2.9,b:1}},no:{x:"Three weeks of back and forth. Settled at $3.4M.",e:{c:3.4,d:.5}}},
{t:"Approve it to keep the job moving",p:1,g:"wrong",n:"Fast, and it teaches them every change is a payday.",ok:{x:"Approved. The next three change orders all come in high.",e:{c:6,b:-1}}},
{t:"Reject it and let them take it to dispute",p:.5,g:"weak",n:"Disputes cost more than the gap.",ok:{x:"They back down to $3M.",e:{c:3}},no:{x:"Dispute, slowdown, lawyers. $3.8M and two months of bad blood.",e:{c:4.5,d:2,f:-1}}}],
idle:{x:"The change order sat unanswered. The contractor slowed down while it did.",e:{c:3.8,d:1.5}},L:"Argue about the parts, not the total."},

{id:"embeds",r:1,a:"Procurement",t:"300 embed plates short",x:"The fabricator is 300 embed plates short. A local shop offers to make them in a week, but they've never supplied nuclear-grade material.",o:[
{t:"Pull the certified plates you have to critical areas and resequence the rest",p:.85,g:"best",n:"Spend scarce material on the critical path first.",ok:{x:"Critical walls keep moving. The certified fabricator catches up in five weeks.",e:{d:1,en:1}},no:{x:"Resequencing helps, but two walls still wait.",e:{d:2}}},
{t:"Use the local shop",p:.25,g:"wrong",n:"No quality program, no nuclear-grade plates.",ok:{x:"The plates are fine. QA never accepts them.",e:{d:2,c:.3}},no:{x:"The plates are cast into two walls. Regulator finding. Cored out.",e:{d:6,c:2,r:-3}}},
{t:"Wait for the certified fabricator",p:.9,g:"good",n:"Safe, slow.",ok:{x:"Five weeks of waiting on the affected walls.",e:{d:3}},no:{x:"Seven weeks.",e:{d:4}}}],
idle:{x:"The shortage hit the walls unannounced.",e:{d:4}},L:"Spend scarce material on the critical path."},

{id:"shift2",r:1,a:"People",t:"The second shift is slow",x:"Second shift installs about 40% less pipe per hour than days. Corporate wants to cut it.",o:[
{t:"Work a week of second shifts yourself and find out why",p:.85,g:"best",n:"Numbers say there's a gap. Only going there says why.",ok:{x:"Half the lighting towers are dead, the crane operator leaves at 9, and the material for nights is staged for days. Fixed in a week; nights hit 90% of days.",e:{f:2,d:-1.5,c:.2}},no:{x:"Lighting helps, but nights stay at 75%. Still worth keeping.",e:{f:1,d:-.5}}},
{t:"Cut the second shift",p:.8,g:"weak",n:"Cuts a cost and a lot of output.",ok:{x:"Payroll down. Progress down more.",e:{d:3,c:-1}},no:{x:"And the good night workers quit.",e:{d:4,c:-1,f:-2}}},
{t:"Tell the night foremen to hit the day numbers or else",p:.3,g:"wrong",n:"Pressure without a cause just finds shortcuts.",ok:{x:"Numbers rise. Rework rises faster.",e:{c:.5}},no:{x:"Two near-misses and a grievance.",e:{s:-2,f:-2}}}],
idle:{x:"Nothing changed. Corporate cut the shift anyway.",e:{d:3}},L:"Go see the shift."},

{id:"float",r:1,a:"Reporting",t:"Float that comes from nowhere",x:"Your schedule shows 30 days of float on the steam generator rooms. You dig in: someone typed a constraint date that hides the real logic.",o:[
{t:"Remove the constraint, rerun the logic and report the real float",p:.85,g:"best",n:"A schedule that hides its logic hides its risks.",ok:{x:"Real float is minus six days. Corporate is unhappy for an afternoon, then funds a recovery plan.",e:{b:1,w:-2,d:-1}},no:{x:"Corporate is unhappy for a week.",e:{b:-1,w:-2}}},
{t:"Report it as is, with a note",p:.6,g:"weak",n:"Footnotes don't get read.",ok:{x:"Nobody reads the note.",e:{}},no:{x:"The rooms go late. The note is found afterwards.",e:{b:-2,d:2}}},
{t:"Leave it, the scheduler knows what he's doing",p:.3,g:"wrong",n:"Typed-in dates are claims.",ok:{x:"The rooms happen to finish on time.",e:{}},no:{x:"The rooms are six weeks late with no warning.",e:{d:4,b:-2,w:2}}}],
idle:{x:"Nobody looked at the float.",e:{d:3,w:2}},L:"Float only counts if the logic is real."},

{id:"mockup",r:1,a:"Quality",t:"Build a mock-up?",x:"The first dome-to-wall rebar intersection is the most congested on the job. A full-scale mock-up costs $300k and three weeks.",o:[
{t:"Build the mock-up",p:.85,g:"best",n:"Practise the hard part where mistakes are cheap.",ok:{x:"The mock-up shows the couplers can't be tightened with the bars as drawn. Engineering adjusts. The real pour goes in clean.",e:{c:.3,d:-2,en:2}},no:{x:"Everything fits. Three weeks and $300k for confidence.",e:{c:.3,d:.5}}},
{t:"Skip it and work it out in place",p:.45,g:"weak",n:"In place, every mistake is permanent.",ok:{x:"The crew figures it out.",e:{}},no:{x:"The bars can't be placed as drawn. Three weeks of rework in place.",e:{d:3,c:1,en:-1}}},
{t:"Do a detailed 3D model review instead",p:.65,g:"good",n:"Catches clashes, not hands and wrenches.",ok:{x:"The model finds most of it.",e:{c:.05,en:1}},no:{x:"The model can't show the wrench swing.",e:{d:1.5}}}],
idle:{x:"No decision. The crew hit the congestion in the real wall.",e:{d:2.5,c:.8}},L:"Practise the hard part where mistakes are cheap."},

{id:"shelter",r:1,a:"People",t:"Minus 30 and no warm-up shelter",x:"The union steward says the warm-up shelters at the north end are too small and two have broken heaters. It's minus 30 with wind.",o:[
{t:"Fix it today: new heaters, two more shelters by Friday",p:.9,g:"best",n:"Cheap next to frostbite and a grievance.",ok:{x:"Shelters up by Thursday. The steward brings coffee to your next meeting.",e:{f:2,s:1,c:.15}},no:{x:"The heaters take a week to arrive. You rent temporary ones.",e:{f:1,c:.2}}},
{t:"Promise to look at it next budget cycle",p:.2,g:"wrong",n:"Cold is now. Budget is later.",ok:{x:"It warms up.",e:{f:-1}},no:{x:"Two frostbite cases and a work refusal.",e:{s:-2,f:-3,d:1}}},
{t:"Shorten work blocks to 45 minutes with more breaks",p:.75,g:"good",n:"Safe, but you lose a lot of output.",ok:{x:"Nobody gets cold. Progress slows.",e:{d:1,s:1}},no:{x:"Breaks in broken shelters don't help much.",e:{d:1,f:-1}}}],
idle:{x:"The steward filed a grievance.",e:{f:-2,s:-1}},L:"Look after the people doing the work."},

// ----- Area manager -----
{id:"greens",r:2,a:"Reporting",t:"All green, window eight months",x:"Your four leads report green, green, green, amber. The building's finish window is still eight months wide. Something doesn't add up.",o:[
{t:"Walk the building yourself this week",p:.7,g:"good",n:"Good instinct; it finds what you see, not the system's gaps.",ok:{x:"You find forty pipe spools waiting on supports that were never ordered.",e:{w:-4,f:1}},no:{x:"Everything you look at looks fine.",e:{}}},
{t:"Ask each lead to show what their green is based on",p:.85,g:"best",n:"A green that can't show its evidence is just a hope.",ok:{x:"Civil has evidence. Mechanical has a schedule. Electrical's green means \"no known blockers.\" The amber was right.",e:{w:-6,en:1}},no:{x:"Leads get defensive, but you learn enough.",e:{w:-3,f:-1}}},
{t:"Trust the reports and focus on the amber",p:.3,g:"wrong",n:"Reports are claims.",ok:{x:"The amber gets fixed.",e:{}},no:{x:"Three months later the greens turn red at once.",e:{d:8,w:4,b:-2}}}],
idle:{x:"Nobody questioned the greens. They turned red together three months later.",e:{d:6,w:3}},L:"Green only for verified constraints."},

{id:"trays",r:2,a:"Engineering",t:"One standard, a hundred clashes",x:"Jamal, your instrumentation lead, says the tray clashes aren't random. They all come from one routing standard applied to the whole building.",o:[
{t:"Take it to engineering yourself",p:.75,g:"good",n:"Works, but Jamal's work becomes your credit.",ok:{x:"Engineering revises the standard.",e:{en:1,w:-4}},no:{x:"Engineering wants Jamal's analysis anyway.",e:{w:-2}}},
{t:"Let Jamal take it to engineering, with your backing",p:.8,g:"best",n:"Bring the evidence and you get backed. Everyone watching learns that.",ok:{x:"The chief engineer says, \"He's right.\" One revision clears over a hundred clashes, including ones nobody found yet.",e:{en:2,f:1,w:-6}},no:{x:"Engineering pushes back for a month, then agrees.",e:{w:-3,d:1}}},
{t:"Fix the clashes one by one in the field",p:.5,g:"wrong",n:"Fixing symptoms forever.",ok:{x:"Forty fixed.",e:{c:1}},no:{x:"New clashes keep appearing.",e:{c:2,d:3}}}],
idle:{x:"Nobody took it forward. The clashes kept coming.",e:{c:1.5,d:2}},L:"When many problems look alike, look for the one cause."},

{id:"doug",r:2,a:"Safety",t:"Best numbers, three near-misses",x:"General foreman Doug's crews have the best production on the job and three near-misses this month. He says two were guys rushing crane hook-ups because the crane is booked tight.",o:[
{t:"Report the pattern to safety",p:.7,g:"good",n:"Correct, but it doesn't touch the crane pressure.",ok:{x:"An audit slows the hook-ups.",e:{s:1,f:-1}},no:{x:"The near-misses continue.",e:{s:-1}}},
{t:"Deal: a fixed crane window for real talks and no rushed hook-ups",p:.85,g:"best",n:"Fix the pressure behind the problem. You now own the promise.",ok:{x:"You find him two fixed hours and an hour of dead crane time for everyone. Zero near-misses for two months.",e:{s:2,f:2,d:-.5}},no:{x:"The window slips twice. Doug grumbles but holds.",e:{s:1}}},
{t:"Leave it, his numbers are good",p:.3,g:"wrong",n:"Production numbers that come with near-misses are borrowed.",ok:{x:"Nothing happens.",e:{}},no:{x:"A load drops near a crew.",e:{s:-3,d:2,r:-1}}}],
idle:{x:"Nobody acted. A fourth near-miss followed.",e:{s:-2}},L:"A deal makes you responsible for keeping it."},

{id:"falcons",r:2,a:"Environment",t:"Falcons on the tower crane",x:"Peregrine falcons, a protected species, nest on your main tower crane's counter-jib. Three eggs, eleven weeks to fledging. The crane is on the critical path.",o:[
{t:"Stop the crane for eleven weeks",p:1,g:"good",n:"Legally clean. Very expensive.",ok:{x:"Eleven weeks. The chicks fledge.",e:{d:8,c:3}}},
{t:"Run it slowly under a biologist's protocol, apply for a relocation permit, and bring comms in",p:.8,g:"best",n:"Legal, transparent, and a story you can tell.",ok:{x:"The permit is refused but your protocol becomes the model. A livestream gets 300,000 views. About nine days lost; all three chicks fledge.",e:{d:1.5,cm:3,r:1,f:1}},no:{x:"The female leaves for forty minutes in week two. You stop, she returns. Two extra weeks of stop-and-go.",e:{d:3,cm:2}}},
{t:"Quietly remove the nest",p:.3,g:"wrong",n:"A serious offence, and someone always has a phone.",ok:{x:"Nobody noticed. This time.",e:{}},no:{x:"A crane operator's video goes viral. Charges and headlines.",e:{cm:-4,r:-2,c:1}}}],
idle:{x:"No plan. The crane ran normally and the falcons abandoned the nest. The ministry opens a file.",e:{cm:-3,r:-1}},L:"Make the constraint public and it becomes an asset."},

{id:"mural",r:2,a:"Culture",t:"Overnight mural",x:"Someone painted a 60-metre mural on the pumphouse wall overnight, with real workers' faces. Unpermitted work at height. Everyone loves it. Safety is furious.",o:[
{t:"Investigate and find who did it",p:.6,g:"weak",n:"You'll find them, and the site will learn to hide things from you.",ok:{x:"Six people disciplined. The mural stays; the goodwill doesn't.",e:{f:-2,s:1}},no:{x:"Nobody talks.",e:{f:-2}}},
{t:"Amnesty if they explain how they did it, consent for every face, and a way to bring ideas first",p:.85,g:"best",n:"The amnesty gets the truth; the new idea process removes the reason to sneak.",ok:{x:"Six come forward. Proper rope access, a napkin rescue plan that's actually good. 21 of 22 workers consent; one face is repainted. Forty proposals arrive next year.",e:{f:3,cm:2,s:1}},no:{x:"They come forward. Their rigging was sketchier than hoped; you fix the process.",e:{f:2,s:-1}}},
{t:"Leave it and quietly tighten night security",p:.6,g:"weak",n:"Rewards the risk without learning anything.",ok:{x:"Nothing more happens.",e:{}},no:{x:"Next month someone paints the stair tower. At height. Alone.",e:{s:-2}}}],
idle:{x:"No response. The site took that as permission.",e:{s:-1}},L:"Give people a legitimate path and they stop sneaking."},

{id:"ghost",r:2,a:"Culture",t:"The fourth-floor ghost",x:"Night shift keeps seeing a man in old grey coveralls on the fourth floor at 3 am. Absenteeism is up 30%. Two crews refuse to work up there after midnight.",o:[
{t:"Write up anyone who refuses work without a safety reason",p:.3,g:"wrong",n:"Fear is a safety reason if people are scared at height.",ok:{x:"Grumbling stops.",e:{f:-2}},no:{x:"A grievance, and absenteeism climbs.",e:{f:-3,d:1}}},
{t:"Put cameras on the fourth floor and find out what's there",p:.9,g:"best",n:"Take it seriously and get evidence.",ok:{x:"It's Walter, a 64-year-old fire watch with nowhere to live, sleeping in the stair tower. You get him housing through the assistance program and argue to keep his job. Three more workers turn out to be living in trucks; a housing fund follows.",e:{f:3,cm:1,s:1}},no:{x:"Six quiet nights before you find him. Absenteeism keeps rising meanwhile.",e:{f:1,d:.5}}},
{t:"Hold a meeting and invite a chaplain to bless the building",p:.6,g:"weak",n:"Kind, but it doesn't find the person in the stair tower.",ok:{x:"Spirits lift for a while.",e:{f:1}},no:{x:"The sightings continue.",e:{d:.5}}}],
idle:{x:"Ignored. Night shift absenteeism kept climbing.",e:{d:1,f:-1}},L:"Behind a strange story there's usually a real person."},

{id:"frank",r:2,a:"Lifting",t:"A bully running the big lift",x:"Next week is the 300-tonne steam generator lift. Frank, your only superintendent who's done one this size, has been bullying an apprentice. The crew is afraid of him.",o:[
{t:"Protect the apprentice now, deal with Frank after the lift",p:.6,g:"weak",n:"Protects the person, not the lift. A scared crew hesitates when it matters.",ok:{x:"Clean lift. Investigation after; Frank retires.",e:{}},no:{x:"A rigger hesitates four seconds before calling stop. The load swings 30 cm toward containment. No contact.",e:{s:-2}}},
{t:"Pull Frank now and find another lead",p:.65,g:"good",n:"Removes the fear, adds inexperience.",ok:{x:"A lift specialist is brought in. Clean.",e:{c:.5,s:1}},no:{x:"The new lead is cautious; three days late.",e:{d:1,c:.5}}},
{t:"Keep Frank on rigging, bring in an independent lift director who owns the stop call, and tell the crew",p:.9,g:"best",n:"Keeps the experience and removes the fear from the one call that matters.",ok:{x:"The crew calls two stops without hesitation. Clean lift. The investigation runs after.",e:{s:2,f:2}},no:{x:"Frank bristles at sharing authority but the lift goes clean.",e:{s:1}}}],
idle:{x:"Nothing done. A rigger hesitated on a stop call during the lift.",e:{s:-2}},L:"A crew afraid of its leader hesitates at the worst moment."},

{id:"wrench",r:2,a:"Quality",t:"Maybe a wrench in the pipe",x:"2 am, days before filling the primary system. A contractor says he may have dropped a wrench into an open coolant pipe. His tool log shows nothing missing, but he didn't log every tool.",o:[
{t:"Stop and do a full foreign-material search",p:.95,g:"best",n:"Treat it as there until you prove otherwise.",ok:{x:"Four and a half days. On day three they find a 10 mm socket two metres further than any camera would reach.",e:{d:1,r:2,en:1}},no:{x:"Nothing found. Four days, and certainty.",e:{d:1,r:1}}},
{t:"Recount his toolbag against the log",p:.4,g:"wrong",n:"The log was incomplete, so a count against it proves nothing.",ok:{x:"Nothing was in there.",e:{}},no:{x:"A socket ends up in a pump impeller during flush.",e:{d:12,c:5,r:-3}}},
{t:"Quick camera look, close it if clear",p:.55,g:"weak",n:"A camera checks one pipe. Things travel.",ok:{x:"Clear, and truly clear.",e:{}},no:{x:"The camera misses a socket further down.",e:{d:10,c:4,r:-2}}}],
idle:{x:"The report sat until morning and the line was closed up.",e:{d:8,c:3,r:-2}},L:"If you can't open it later, prove it's clean now."},

{id:"turnover",r:2,a:"Operations",t:"Commissioning wants the rooms now",x:"Commissioning wants the auxiliary building handed over this month so they can start testing. Construction still has 2,100 open punch items in there.",o:[
{t:"Hand over system by system, with a joint walk-down and a signed punch list for each",p:.85,g:"best",n:"Turnover is a boundary. Draw it clearly, one system at a time.",ok:{x:"Eleven systems turned over in six weeks. Both teams know exactly who owns which valve.",e:{d:-2,en:1,f:1}},no:{x:"Slower than commissioning wanted, but clean.",e:{d:-.5,b:-1}}},
{t:"Hand over the whole building",p:.35,g:"wrong",n:"Two teams working the same equipment with no boundary is how things get energized with people inside.",ok:{x:"It goes surprisingly smoothly.",e:{d:-2}},no:{x:"Commissioning energizes a pump while a fitter is still working on it. A near-miss, and a three-week stand-down.",e:{s:-3,d:3,r:-1}}},
{t:"Refuse until construction is complete",p:.8,g:"weak",n:"Clean, and it wastes months of commissioning time.",ok:{x:"Construction finishes. Commissioning starts late.",e:{d:3}},no:{x:"The punch list grows instead of shrinking.",e:{d:4,b:-1}}}],
idle:{x:"Nobody decided. Commissioning started anyway, room by room, with no boundary.",e:{s:-2,d:1}},L:"Draw the boundary one system at a time."},

{id:"feud",r:2,a:"People",t:"Two leads who won't talk",x:"Your mechanical and electrical leads haven't spoken in a month. Their crews are now fighting over the same cable trays and hangers.",o:[
{t:"Walk the building with both of them every Monday until they're solving it themselves",p:.8,g:"best",n:"People who walk the same problem stop arguing about it.",ok:{x:"Week three, they start finishing each other's sentences about hanger loads. Week six, they walk it without you.",e:{f:2,d:-1}},no:{x:"It's slow, but the crews stop fighting.",e:{f:1}}},
{t:"Separate their work areas",p:.6,g:"weak",n:"Hides the problem until they meet again.",ok:{x:"Calm for a while.",e:{}},no:{x:"They meet again at the tray risers.",e:{d:1.5,f:-1}}},
{t:"Back the one with the stronger case",p:.4,g:"wrong",n:"You'll have one ally and one enemy.",ok:{x:"Mechanical wins. Electrical gets quiet.",e:{f:-1}},no:{x:"The electrical lead quits.",e:{f:-2,w:2}}}],
idle:{x:"The feud kept running through their crews.",e:{f:-2,d:1}},L:"Put people in front of the same problem."},

{id:"rework",r:2,a:"Quality",t:"Rework at 9 percent",x:"Rework hours have climbed from 3% to 9% in two months. Production is pushing to make up the time.",o:[
{t:"Sort the rework by cause and go after the top two",p:.85,g:"best",n:"Rework isn't evenly spread. Find where it piles up.",ok:{x:"62% comes from one drawing revision that never reached the field and one torque wrench out of calibration. Fixed in a week. Rework falls to 4%.",e:{c:-.5,d:-2,en:1}},no:{x:"The causes are scattered. It takes two months to come down.",e:{d:-.5}}},
{t:"Add more QC inspectors",p:.6,g:"good",n:"Catches more, fixes less.",ok:{x:"Rework is found sooner.",e:{c:.4}},no:{x:"More found, same made.",e:{c:.6,d:1}}},
{t:"Push harder on production to make up time",p:.3,g:"wrong",n:"Speeding up a process that makes defects makes more defects.",ok:{x:"Production rises a little.",e:{}},no:{x:"Rework hits 14%.",e:{d:3,c:1.5}}}],
idle:{x:"Nobody looked at the rework. It kept climbing.",e:{d:2,c:1}},L:"Find where the problems pile up."},

{id:"video",r:2,a:"Comms",t:"A near-miss on social media",x:"A labourer posts a phone video of a load swinging over a walkway. It has 40,000 views. Corporate comms wants him disciplined.",o:[
{t:"Thank him, use the video in a site-wide stand-down, and ask him to bring the next one to you first",p:.85,g:"best",n:"Punish the person who showed you the hazard and you won't see the next one.",ok:{x:"The stand-down changes the walkway rules. He brings you two more things that month. Comms comes round.",e:{s:2,f:2,cm:1}},no:{x:"The press picks it up anyway. You have a good answer.",e:{s:2,cm:-1}}},
{t:"Discipline him for posting",p:.6,g:"wrong",n:"The lesson everyone learns: hide it.",ok:{x:"The video comes down.",e:{f:-3}},no:{x:"\"Worker Punished For Exposing Safety Risk.\"",e:{f:-3,cm:-3}}},
{t:"Ask him to delete it, no discipline",p:.7,g:"weak",n:"Better, but you still haven't fixed the walkway.",ok:{x:"It comes down.",e:{}},no:{x:"Screenshots are forever.",e:{cm:-1}}}],
idle:{x:"Corporate disciplined him while you were busy.",e:{f:-2,cm:-1}},L:"Thank the person who shows you the hazard."},

{id:"fatigue",r:2,a:"Safety",t:"Twenty-one days straight",x:"Crews on the reactor building have worked 21 days in a row to recover schedule. The recovery plan says 14 more.",o:[
{t:"Rotate a mandatory day off every 7 days, and add a crew to keep the pace",p:.8,g:"best",n:"Tired crews make mistakes that cost more than the day off.",ok:{x:"Output per hour climbs 15% after the first rest day. The recovery holds.",e:{s:2,f:2,c:.6}},no:{x:"The new crew is slow to start. Two days lost.",e:{s:1,f:1,c:.6,d:.5}}},
{t:"Keep going, it's only two more weeks",p:.3,g:"wrong",n:"Week four of no days off is when the hand goes where it shouldn't.",ok:{x:"Done on schedule, everyone exhausted.",e:{f:-2}},no:{x:"A rigger catches his hand in a pinch point. Lost-time injury.",e:{s:-3,f:-2,d:2,r:-1}}},
{t:"Cap it at 14 days and accept the slip",p:.85,g:"good",n:"Safe, but you didn't solve the schedule.",ok:{x:"Rested crews, two weeks late.",e:{d:2,s:1}},no:{x:"Three weeks late.",e:{d:3}}}],
idle:{x:"The schedule ran on. Fatigue did what fatigue does.",e:{s:-2,f:-1}},L:"Rest is part of the schedule."},

{id:"vendor",r:2,a:"Engineering",t:"\"Everybody skips that step\"",x:"The pump vendor's rep says the hot alignment check in the procedure is unnecessary. \"Everybody skips it.\" It adds two days.",o:[
{t:"Follow the procedure unless the vendor gives a written, engineering-approved deviation",p:.9,g:"best",n:"If it's truly unnecessary, it can be written down and signed.",ok:{x:"The vendor won't put it in writing. The hot alignment finds the coupling 0.4 mm out. Fixed before it ever runs.",e:{en:2,r:1,d:.3}},no:{x:"Alignment is fine. Two days, and an accurate record.",e:{d:.3,en:1}}},
{t:"Skip it, the vendor knows the pump",p:.4,g:"wrong",n:"\"Everybody does it\" is how steps disappear.",ok:{x:"Pump runs fine.",e:{}},no:{x:"Bearing failure at 300 hours. Pump out for six weeks.",e:{d:5,c:1.5,r:-1}}},
{t:"Do a quick cold check instead",p:.6,g:"weak",n:"Cold isn't hot. That's why the step exists.",ok:{x:"Cold numbers look fine.",e:{}},no:{x:"It grows out of alignment at temperature.",e:{d:3,c:.8}}}],
idle:{x:"The rep did it his way.",e:{d:2,c:.5}},L:"If a step can be skipped, someone can sign for it."},

{id:"lessons",r:2,a:"Culture",t:"A lessons-learned database nobody reads",x:"There are 4,000 lessons learned in the database from the last three nuclear builds. Your supers have never opened it.",o:[
{t:"Pick one lesson for each day's pre-job brief, matched to that day's work",p:.85,g:"best",n:"A lesson lands when it arrives on the day you need it.",ok:{x:"Day 11's lesson is about rebar couplers left uncapped. That afternoon a foreman caps a whole row before concrete.",e:{en:1,f:1,s:1,w:-2}},no:{x:"Some days the match is loose. It still sticks.",e:{f:1}}},
{t:"Make reading it mandatory",p:.5,g:"weak",n:"Mandatory reading is skimmed reading.",ok:{x:"People click through.",e:{}},no:{x:"People resent it.",e:{f:-1}}},
{t:"Let it go, experience will do",p:.4,g:"wrong",n:"Experience you could have borrowed is the expensive kind.",ok:{x:"Nothing happens.",e:{}},no:{x:"You repeat a known mistake from the last build: dome bars left uncapped and full of concrete.",e:{d:2,c:.5}}}],
idle:{x:"The database stayed unread. An old mistake came back.",e:{d:1.5,c:.4}},L:"Deliver the lesson on the day it's needed."},

{id:"strike",r:2,a:"Procurement",t:"The concrete drivers may strike",x:"The batch plant's truck drivers may strike in two weeks. You have three critical pours in the next month.",o:[
{t:"Pull the critical pours forward and line up a mobile on-site batch plant as a backup",p:.8,g:"best",n:"Move what you can, and have a plan for what you can't.",ok:{x:"Two pours go in before the strike. The third is batched on site. The strike lasts nine days.",e:{c:.6,d:-1,b:1}},no:{x:"The strike is called off. The backup plant cost money for nothing. Still right.",e:{c:.6}}},
{t:"Wait and see",p:.4,g:"wrong",n:"A strike date is a known constraint.",ok:{x:"No strike.",e:{}},no:{x:"Nine days of no concrete on the critical path.",e:{d:3,c:.5}}},
{t:"Line up a second batch plant across the county",p:.65,g:"good",n:"Helps, if their trucks aren't the same union.",ok:{x:"They cover two of the three pours.",e:{c:.3,d:.5}},no:{x:"Same union. Same strike.",e:{d:2.5}}}],
idle:{x:"Nobody planned for the strike.",e:{d:3}},L:"A known date is a constraint, not a surprise."},

// ----- Construction director -----
{id:"fuelpr",r:3,a:"Comms",t:"Announce a fuel load date",x:"Corporate wants a public fuel load date next month. Your window is nine months wide.",o:[
{t:"Announce the early edge, corporate wants confidence",p:.15,g:"wrong",n:"A date you know is unlikely is a debt you pay in public.",ok:{x:"You hit it. Remarkable.",e:{b:3,cm:2}},no:{x:"A pump supplier fails qualification and the date's gone. Public slip, brutal press.",e:{cm:-4,b:-2,r:-1}}},
{t:"Announce a range, not a date",p:.75,g:"good",n:"Accurate, and harder to sell.",ok:{x:"Press calls it vague, then forgets.",e:{cm:1}},no:{x:"Headlines read the range as trouble.",e:{cm:-1}}},
{t:"Hold off until the window narrows, then announce a date you'd bet on",p:.85,g:"best",n:"Certainty earns the right to make promises.",ok:{x:"Four months later the window is ten weeks. You announce the late edge at 85% confidence and beat it by three days.",e:{b:2,cm:2,r:1}},no:{x:"Board members call it weakness for a while.",e:{b:-1}}}],
idle:{x:"Corporate announced the early edge without you.",e:{cm:-2}},L:"Make promises once the fog's gone."},

{id:"welder",r:3,a:"Regulator",t:"A backdated record",x:"Your only certified nuclear-class welder on shift admits he backdated an inspection record last month. The weld is fine. Fuel load is six weeks out.",o:[
{t:"Report it and lose him during the investigation",p:.8,g:"good",n:"By the book.",ok:{x:"Clean report. A replacement is found in five weeks.",e:{r:1,d:2}},no:{x:"No replacement. Six weeks lost.",e:{d:6,r:1}}},
{t:"Have him re-document it and keep it in-house",p:.4,g:"wrong",n:"Keeping a falsified nuclear record in-house is a cover-up.",ok:{x:"Nobody finds out.",e:{}},no:{x:"An audit finds it. Now it's two falsifications and a cover-up.",e:{r:-5,d:12,b:-3}}},
{t:"Report it and argue he stays on supervised work because he came forward",p:.85,g:"best",n:"Does everything the by-the-book option does and rewards coming forward.",ok:{x:"A 400-weld audit costs three weeks and finds nothing else. The regulator cites the self-disclosure. Two others come forward with small issues.",e:{r:2,f:2,d:3}},no:{x:"The regulator benches him anyway. You tried.",e:{r:1,d:4}}}],
idle:{x:"It surfaced in an audit before anyone reported it.",e:{r:-3,d:6}},L:"Coming forward costs schedule and buys a culture."},

{id:"karen",r:3,a:"Regulator",t:"Your mentor's old shortcut",x:"Karen, your mentor and retiring VP, approved a containment repair three years ago without the engineering disposition. The regulator inspects in two weeks. She asks you to let her fix it quietly.",o:[
{t:"Let her handle it quietly",p:.35,g:"wrong",n:"Quiet fixes of nuclear records are cover-ups.",ok:{x:"Disposition written; nobody asks.",e:{}},no:{x:"The inspector finds the date mismatch.",e:{r:-5,b:-2}}},
{t:"It goes in as a formal NCR now, and you stand beside her",p:.95,g:"best",n:"Loyal to her and to the record at the same time.",ok:{x:"She writes it herself. Engineering finds the repair sound. The inspector closes it citing safety culture. At her send-off she tells the story with your name in it.",e:{r:3,f:1,b:-1}},no:{x:"Two of her board allies never forgive you.",e:{r:2,b:-2}}},
{t:"Report it to QA yourself without telling her",p:.8,g:"weak",n:"Correct outcome, broken relationship.",ok:{x:"Filed. Karen hears from QA.",e:{r:2,f:-2}},no:{x:"Karen retires bitter.",e:{r:1,f:-2}}}],
idle:{x:"The inspector found it before anyone filed.",e:{r:-4}},L:"Stand beside people while the record gets fixed."},

{id:"press",r:3,a:"Comms",t:"Leaked emails, 9 pm",x:"A national reporter has emails from your predecessor's era showing schedule pressure overrode an engineer's weld concern. The story runs at 6 am. The CEO isn't answering.",o:[
{t:"\"No comment\" and let comms handle it",p:.6,g:"weak",n:"Leaves the headline unanswered.",ok:{x:"The story runs and fades.",e:{cm:-1}},no:{x:"The story runs for a week.",e:{cm:-3,r:-1}}},
{t:"Go on the record: confirm what's true and what's changed",p:.8,g:"best",n:"Owning the past is the only credible way to talk about the present.",ok:{x:"Your quote leads every follow-up. The engineer from the emails writes: \"Thank you for saying I was right.\" The CEO: \"Next time, call me until I answer.\"",e:{cm:3,r:1,b:-1}},no:{x:"The quote runs in paragraph nine. The CEO is angry for a month.",e:{cm:1,b:-2}}},
{t:"Have legal try to block it overnight",p:.1,g:"wrong",n:"Trying to suppress it becomes the story.",ok:{x:"Delayed a day.",e:{}},no:{x:"\"Nuclear Project Tries to Gag Paper.\"",e:{cm:-5,r:-1}}},
{t:"Find out who leaked",p:.3,g:"wrong",n:"Hunting the messenger tells every engineer on site to stay quiet.",ok:{x:"You find them. Morale drops.",e:{f:-3}},no:{x:"The hunt leaks too.",e:{cm:-3,f:-3}}}],
idle:{x:"The story ran with no response.",e:{cm:-3}},L:"Confirm what's true, then say what changed."},

{id:"maria",r:3,a:"Operations",t:"A gut feeling before fuel load",x:"11 pm, the night before fuel load. The minister arrives at 9. Maria, a senior operator with years of sharp calls, is uneasy about the valve lineup. Every sign-off is in place.",o:[
{t:"Thank her and proceed",p:.4,g:"wrong",n:"Experience noticing something is data.",ok:{x:"It goes clean.",e:{}},no:{x:"Two swapped valve tags on auxiliary feedwater. Found during startup. Event report.",e:{r:-4,d:4}}},
{t:"Delay 24 hours for a full independent walk-down",p:.95,g:"best",n:"You pay a day and a headline for certainty.",ok:{x:"Two valve tags were swapped during a repaint. Maria had noticed a handwheel was the wrong colour. Clean fuel load the next morning.",e:{r:3,cm:1,d:.2}},no:{x:"Nothing found. A day and a headline.",e:{cm:-1,d:.2}}},
{t:"Have her walk it tonight with a second operator",p:.75,g:"good",n:"Probably finds it, quietly.",ok:{x:"They find the swapped tags at 3 am.",e:{r:2}},no:{x:"They check the procedure, not the hardware.",e:{r:-2,d:2}}}],
idle:{x:"Nobody responded to Maria.",e:{r:-2}},L:"Listen to the person who has seen it a thousand times."},

{id:"escrow",r:3,a:"Commercial",t:"Contractor three weeks from insolvency",x:"Your electrical contractor's CFO says they're three weeks from insolvency. 600 workers on site don't know. Legal says withhold payments and line up a replacement.",o:[

function medState(){try{return JSON.parse(localStorage.getItem(MED_KEY))||{got:{},n:{}}}catch(e){return {got:{},n:{}}}}
function medSave(M){try{localStorage.setItem(MED_KEY,JSON.stringify(M))}catch(e){}}
let medQ=[];
function medGive(id){const M=medState();if(M.got[id])return;M.got[id]=Date.now();medSave(M);const m=MEDALS.find(x=>x.id===id);if(m){medQ.push(m);medShow()}}
function medCount(k,v){const M=medState();M.n[k]=(M.n[k]||0)+(v||1);medSave(M);return M.n[k]}
function medShow(){if(document.getElementById("medPop")||!medQ.length)return;const m=medQ.shift();document.body.insertAdjacentHTML("beforeend",`<div id="medPop" class="medpop" role="status"><span class="lbl">Medal</span><b>${esc(m.n)}</b><span class="note">${esc(m.d)}</span></div>`);Snd.play("promo");setTimeout(()=>{const e=document.getElementById("medPop");if(e)e.remove();medShow()},2600)}
function medCheck(){if(!st)return;const g=st.grades,T=ODDS_AT();
  if(g.best+g.good+g.weak+g.wrong>=1)medGive("first");
  if(g.best>=10)medGive("best10");if(g.best>=25)medGive("best25");
  if(st.role>=1)medGive("pkg");if(st.role>=3)medGive("dir");
  if(st.s>=8)medGive("safe8");if(Object.values(st.rep).every(v=>v>0))medGive("rep5");
  if(st.w<=12)medGive("fog");if(st.luck.bad>=5)medGive("unlucky");if(st.luck.good>=3)medGive("lucky");
  if(Object.values(st.xp).filter(v=>v>=T).length>=5)medGive("odds5");
  const res=st.week.filter(w=>w.res);if(res.length===3&&res.every(w=>w.res.g==="best"))medGive("clean");
  res.forEach(w=>{if(w.res.g!=="best")return;if(w.id==="falcons")medGive("falcons");if(w.id==="ghost")medGive("walter");if(w.id==="maria")medGive("maria")})}
function medalsHTML(){const M=medState(),n=MEDALS.filter(m=>M.got[m.id]).length;return `<div class="medals"><div class="grow"><span class="lbl">Medals · ${n} of ${MEDALS.length}</span></div><div class="medgrid">${MEDALS.map(m=>`<div class="med ${M.got[m.id]?"got":""}" title="${esc(m.d)}"><b>${esc(m.n)}</b><span>${esc(m.d)}</span></div>`).join("")}</div></div>`}

function perkOffer(){const own=st.perks||[],ks=Object.keys(PERKS).filter(k=>!own.includes(k));shuffle(ks);return ks.slice(0,3)}
function perkTake(k){if(!st.offer||!st.offer.includes(k))return;(st.perks=st.perks||[]).push(k);st.offer=null;
  if(k==="liaison")st.rep.r=Math.min(10,st.rep.r+2);if(k==="steward")st.rep.f=Math.min(10,st.rep.f+2);if(k==="comms")st.rep.cm=Math.min(10,st.rep.cm+2);if(k==="safetypro")st.s=Math.min(10,st.s+2);
  st.log.push(`T${st.turn} · New on your team: ${PERKS[k].n.toLowerCase()}.`);Snd.play("best");save();closeModal()}

// ---------- The review: every call, and the better one when you missed it ----------
let revFilter="all";
function reviewHTML(){const D=st.dec||[];if(!D.length)return "";
  const keep=d=>revFilter==="all"||(revFilter==="miss"&&d.g!=="best"&&d.g!=="idle")||(revFilter==="idle"&&d.g==="idle")||(revFilter==="best"&&d.g==="best");
  const cnt=f=>D.filter(d=>f==="all"||(f==="miss"&&d.g!=="best"&&d.g!=="idle")||(f==="idle"&&d.g==="idle")||(f==="best"&&d.g==="best")).length;
  const item=d=>{const sc=byId(d.id);if(!sc)return "";const best=sc.o.find(o=>o.g==="best");
    if(d.g==="idle")return `<li class="rv idle"><span class="lbl">Turn ${d.t} · ${esc(sc.a)} · left alone</span><b>${esc(sc.t)}</b><p class="note">${esc(sc.idle.x)}</p>${best?`<p class="rvbest"><span class="lbl">Best call</span>${esc(best.t)}</p>`:""}<p class="rvL">${esc(sc.L)}</p></li>`;
    const o=sc.o[d.i];return `<li class="rv g-${d.g}"><span class="lbl">Turn ${d.t} · ${esc(sc.a)} · <span class="c-${d.g}">${GNAME[d.g]}</span>${d.win===false?" · went badly":""}</span><b>${esc(sc.t)}</b><p>${esc(o.t)}</p>${d.g!=="best"&&best?`<p class="rvbest"><span class="lbl">Best call</span>${esc(best.t)}<span class="note"> ${esc(best.n)}</span></p>`:""}<p class="rvL">${esc(sc.L)}</p></li>`};
  return `<div class="review"><div class="grow"><span class="lbl">Look back at your calls, if you like</span><div class="rvtabs" role="tablist">${[["all","All"],["miss","Could do better"],["idle","Left alone"],["best","Best calls"]].map(([k,l])=>`<button class="chip ${revFilter===k?"on":""}" data-rv="${k}" role="tab" aria-selected="${revFilter===k}">${l} <b>${cnt(k)}</b></button>`).join("")}</div></div>
  ${ROLES.map((R,ri)=>{const L=D.filter(d=>d.role===ri&&keep(d));return L.length?`<details ${revFilter!=="all"?"open":""}><summary><h3>${esc(R)}</h3><span class="lbl">${L.length} call${L.length===1?"":"s"}</span></summary><ol class="rvlist">${L.map(item).join("")}</ol></details>`:""}).join("")}</div>`}

const HIST_KEY="kestrel-builds";
function buildsGet(){try{return JSON.parse(localStorage.getItem(HIST_KEY))||[]}catch(e){return []}}
function buildsAdd(b){const L=buildsGet();L.unshift(b);try{localStorage.setItem(HIST_KEY,JSON.stringify(L.slice(0,25)))}catch(e){}}
function buildsHTML(hiId){const L=buildsGet();if(!L.length)return "";const best=L.reduce((a,b)=>b.score>a.score?b:a,L[0]);
  return `<div class="builds"><span class="lbl">Your builds · best rating: ${esc(best.rank)}</span><div class="btable" role="table"><div class="bhead" role="row"><span>Date</span><span>Mode</span><span>Fuel load</span><span>Schedule</span><span>Cost</span><span>Safety</span><span>Sound calls</span><span>Rating</span></div>
  ${L.slice(0,10).map(b=>`<div class="brow ${b.id===best.id?"best":""} ${b.id===hiId?"now":""}" role="row"><span>${esc(b.when)}</span><span>${{daily:"Daily",nightmare:"Nightmare"}[b.mode]||"Career"}</span><span>${esc(b.fl)}</span><span class="${b.late>0?"c-wrong":"c-best"}">${b.late===0?"on target":Math.abs(b.late)+" wk "+(b.late>0?"late":"early")}</span><span class="${b.c>0?"c-wrong":"c-best"}">${b.c>=0?"+":"−"}$${Math.abs(b.c).toFixed(1)}M</span><span>${sgn(b.s)}</span><span>${b.sound}%</span><span><b>${esc(b.rank)}</b></span></div>`).join("")}</div></div>`}

function cwaOf(sc){if(sc.cwa)return sc.cwa;if(AREA_CWA[sc.a])return AREA_CWA[sc.a];let h=0;for(const ch of sc.id)h=(h*31+ch.charCodeAt(0))>>>0;return ["u1","u2","tb"][h%3]}
function simInit(){if(!st.prog){st.prog={};st.cons={};CWAS.forEach(c=>{st.prog[c.id]=0;st.cons[c.id]=c.id==="yard"||c.id==="u1"?1:0})}}
const overall=()=>{if(!st||!st.prog)return 0;return CWAS.reduce((a,c)=>a+st.prog[c.id],0)/CWAS.length};
const GAIN={best:14,good:9,weak:4,wrong:-3};
function simChoose(sc,o,win){simInit();const c=cwaOf(sc);let dp=GAIN[o.g]+(win?0:-3),dc=0;
  if((o.g==="best"||o.g==="good")&&st.cons[c]>0){st.cons[c]--;dc=-1}
  if(o.g==="wrong"||(o.g==="weak"&&!win)){st.cons[c]++;dc=1}
  st.prog[c]=Math.max(0,Math.min(100,st.prog[c]+dp));return {c,dp,dc}}
function simIdle(sc){simInit();const c=cwaOf(sc);st.cons[c]++;return c}

function simTurn(){simInit();const rel=[];CWAS.forEach(c=>{if(st.cons[c.id]===0){st.prog[c.id]=Math.min(100,st.prog[c.id]+3);rel.push(c.id)}});return rel}

  g.fillStyle=cols[2]||cols[1];g.beginPath();g.moveTo(cx,cy+4.5);g.lineTo(bx,by+4.5);g.lineTo(bx,by+4.5-z);g.lineTo(cx,cy+4.5-z);g.fill();
  g.fillStyle=cols[0];g.beginPath();g.moveTo(ax,ay+4.5-z);g.lineTo(bx,by+4.5-z);g.lineTo(cx,cy+4.5-z);g.lineTo(dx,dy+4.5-z);g.closePath();g.fill()}
function mapDraw(){const cv=document.getElementById("map");if(!cv||!st||!st.prog){MAP.raf=0;return}const g=cv.getContext("2d");g.imageSmoothingEnabled=false;MAP.t++;const T=MAP.t;
  g.fillStyle="#0a2a0a";g.fillRect(0,0,MAP.W,MAP.H);
  for(let y=0;y<20;y++)for(let x=0;x<20;x++){const water=y>=18||(x===0&&y>=16);mapTile(g,x,y,water?PAL.water[(x+y+(T>>4))&1]:PAL.grass[(x*7+y*3)&1])}
  // roads
  for(let x=0;x<20;x++)mapTile(g,x,8,PAL.road);for(let y=0;y<18;y++)mapTile(g,14,y,PAL.road);for(let x=3;x<14;x++)mapTile(g,x,13,PAL.road);
  for(let x=0;x<20;x+=2)mapTile(g,x+.4,8.4,"#9a9a9a");
  // CWAs back to front
  const order=CWAS.slice().sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  for(const c of order){const p=st.prog[c.id],k=st.cons[c.id];
    for(let y=c.y;y<c.y+c.h;y++)for(let x=c.x;x<c.x+c.w;x++)mapTile(g,x,y,p<12?PAL.dirt[(x+y)&1]:(c.k==="switch"||c.k==="yard")?"#8a8a7a":PAL.conc[1]);
    if(MAP.hover===c.id){for(let y=c.y;y<c.y+c.h;y++)for(let x=c.x;x<c.x+c.w;x++)mapTile(g,x,y,"rgba(255,255,0,.35)")}

    if(c.k==="reactor"){if(st8>=1)mapBox(g,c.x+.3,c.y+.3,c.w-.6,c.h-.6,4,PAL.conc);if(st8>=2)mapBox(g,c.x+.5,c.y+.5,c.w-1,c.h-1,Math.min(34,6+(p-30)*.9),PAL.conc);
      if(st8>=3){const [mx,my]=iso(c.x+c.w/2,c.y+c.h/2);const z=Math.min(34,6+(p-30)*.9),r=15;g.fillStyle=PAL.dome[1];g.beginPath();g.ellipse(mx,my+4.5-z,r,r*(st8>=4?.8:.35)*(p>=80?1:.6+.4*(p-55)/25),0,Math.PI,0);g.fill();g.fillStyle=PAL.dome[0];g.beginPath();g.ellipse(mx-3,my+2-z,r*.55,r*.3,0,Math.PI,0);g.fill()}}

    else if(c.k==="aux"){if(st8>=1)mapBox(g,c.x+.3,c.y+.3,c.w-.6,c.h-.6,Math.min(30,3+p*.32),st8>=4?["#d0d0e0","#a0a0c0","#8080a0"]:PAL.conc)}
    else if(c.k==="intake"){if(st8>=1)mapBox(g,c.x+.2,c.y+.4,c.w-.4,c.h-.8,Math.min(10,2+p*.1),PAL.conc);if(st8>=3)for(let i=0;i<3;i++)mapTile(g,c.x+.5+i,c.y+c.h-.2,PAL.water[(T>>3)&1])}
    else if(c.k==="switch"){const n=Math.floor(p/20);for(let i=0;i<n;i++){const [tx,ty]=iso(c.x+.6+(i%3)*1.4,c.y+.6+Math.floor(i/3)*1.6);g.strokeStyle="#303030";g.lineWidth=1;g.beginPath();g.moveTo(tx-3,ty+4);g.lineTo(tx,ty-16);g.lineTo(tx+3,ty+4);g.moveTo(tx-5,ty-10);g.lineTo(tx+5,ty-10);g.stroke()}
      if(n>=3){g.strokeStyle="#202020";g.beginPath();const [a1,b1]=iso(c.x+.6,c.y+.6),[a2,b2]=iso(c.x+3.4,c.y+.6);g.moveTo(a1,b1-15);g.lineTo(a2,b2-15);g.stroke()}}
    else if(c.k==="yard"){const n=Math.floor(p/8)+2;for(let i=0;i<n;i++){const xx=c.x+.4+(i%5)*1.1,yy=c.y+.4+Math.floor(i/5)*1.2;mapBox(g,xx,yy,.8,.8,3+(i*5)%6,[["#c08040","#906030","#704820"],["#4a6a8a","#3a5a7a","#2a4a6a"],["#b0b0b0","#909090","#707070"]][i%3])}}

      g.strokeStyle=PAL.yellow;g.lineWidth=2;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx,cy-hgt);g.stroke();g.lineWidth=1.5;g.beginPath();g.moveTo(cx-jx*.35,cy-hgt-jy*.35);g.lineTo(cx+jx,cy-hgt+jy);g.stroke();
      g.strokeStyle="#202020";g.lineWidth=1;g.beginPath();g.moveTo(cx+jx*.8,cy-hgt+jy*.8);g.lineTo(cx+jx*.8,cy-hgt+jy*.8+14+Math.sin(T/20)*4);g.stroke();g.fillStyle="#202020";g.fillRect(cx+jx*.8-2,cy-hgt+jy*.8+14+Math.sin(T/20)*4,4,3)}

    if(k>0){const [fx,fy]=iso(c.x+c.w-.5,c.y+.5);for(let i=0;i<Math.min(k,4);i++){const x0=fx-6+i*5;g.fillStyle="#202020";g.fillRect(x0,fy-16,1,14);g.fillStyle=PAL.red;g.fillRect(x0+1,fy-16+((T>>3)+i)%2,5,4)}

  for(let i=0;i<4;i++){const ph=((T*.012+i*.27)%1);const onX=i%2===0,x=onX?ph*19:14,y=onX?8:ph*17;const [tx,ty]=iso(x+.5,y+.5);g.fillStyle=["#ff0000","#ffd800","#ffffff","#2060ff"][i];g.fillRect(tx-3,ty-1,6,3);g.fillStyle="#202020";g.fillRect(tx-2,ty+2,1,1);g.fillRect(tx+2,ty+2,1,1)}

function expandMore(m){const fx=t=>{const e={};(t||"").trim().split(/\s+/).filter(Boolean).forEach(x=>{const k=x.match(/^[a-z]+/)[0];e[k]=+x.slice(k.length)});return e};
  const [id,r,a,t,x,L,ix,ie,...os]=m;
  return {id,r,a,t,x,L,idle:{x:ix,e:fx(ie)},o:os.map(([l,p,g,n,okx,oke,nox,noe])=>{const o={t:l,p,g,n,ok:{x:okx,e:fx(oke)}};if(p<1)o.no={x:nox||okx,e:fx(noe)};return o})}}
MORE.forEach(m=>S.push(expandMore(m)));
