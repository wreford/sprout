<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kestrel Point</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a site trailer board. Status strip and fog gauge on top; this turn's tags left, the open situation right; career and experience below. Stacks to one column on phones. */
:root{
  --bg:#e4e5df; --panel:#f5f5f0; --sunk:#ecede7; --ink:#1b2024; --muted:#5a6268; --line:#c8cbc2;
  --hivis:#e0ad00; --hivis-ink:#1b1909; --ok:#2c7a47; --warn:#a96400; --bad:#b0352b; --info:#2c5c88;
  --shadow:0 1px 0 rgba(27,32,36,.06),0 8px 24px -12px rgba(27,32,36,.25);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121518; --panel:#1b1f23; --sunk:#16191c; --ink:#e9e7df; --muted:#9aa1a7; --line:#31373c;
  --hivis:#f1c232; --hivis-ink:#17150a; --ok:#5db67a; --warn:#e29a3c; --bad:#e46a5f; --info:#7aaad6;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --panel:#1b1f23; --sunk:#16191c; --ink:#e9e7df; --muted:#9aa1a7; --line:#31373c;
  --hivis:#f1c232; --hivis-ink:#17150a; --ok:#5db67a; --warn:#e29a3c; --bad:#e46a5f; --info:#7aaad6;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(12px,env(safe-area-inset-top,0px)) max(48px,env(safe-area-inset-bottom,0px));margin:0}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(44px,9vw,92px);text-transform:uppercase;letter-spacing:-.005em}
h2{font-size:clamp(24px,3.4vw,30px);text-transform:uppercase}
h3{font-size:20px;text-transform:uppercase}
p{margin:0}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;padding:0 5px;border-radius:3px;background:var(--panel);color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:8px;background:var(--hivis);color:var(--hivis-ink);border:0;padding:11px 18px;font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:3px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.small{font-size:15px;padding:7px 12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--hivis) 0 12px,var(--ink) 12px 24px);background-size:34px 34px;border-radius:2px}
.title .stripe{animation:march 1.4s linear infinite}
@keyframes march{to{background-position:34px 0}}

/* Title */
.title{display:grid;gap:22px;padding:clamp(20px,4vw,40px);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.title .lede{max-width:60ch;font-size:clamp(16px,2vw,18px)}
.kicker{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kicker .pill{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:3px 8px;border-radius:2px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.rules div{border-top:3px solid var(--ink);padding-top:10px;display:grid;gap:4px}
.modes{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.modecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{text-align:left;background:var(--sunk);border:2px solid var(--line);padding:16px;border-radius:4px;display:grid;gap:6px;transition:border-color .15s,transform .1s}
.mode:hover{border-color:var(--ink)}
.mode:active{transform:translateY(1px)}
.mode h3{font-size:26px}
.mode.hard h3::after{content:" ▲";color:var(--bad);font-size:16px;vertical-align:middle}

/* Header + status */
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(34px,6vw,54px)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.strip>div{background:var(--panel);padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;transition:color .4s}
.flash-good{animation:fg 1.2s}.flash-bad{animation:fb 1.2s}
@keyframes fg{0%,40%{color:var(--ok)}}
@keyframes fb{0%,40%{color:var(--bad)}}

.gauge{background:var(--panel);border:1px solid var(--line);padding:14px 16px;display:grid;gap:10px}
.gtrack{position:relative;height:34px;border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(90deg,transparent 0 calc(8.333% - 1px),var(--line) calc(8.333% - 1px) 8.333%)}
.gband{position:absolute;top:6px;bottom:6px;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--info) 22%,transparent) 0 6px,color-mix(in srgb,var(--info) 34%,transparent) 6px 12px);border:2px solid var(--info);border-radius:2px;transition:left .7s cubic-bezier(.2,.7,.2,1),width .7s cubic-bezier(.2,.7,.2,1)}
.gtarget{position:absolute;top:-4px;bottom:-6px;width:3px;background:var(--hivis);left:50%;transform:translateX(-1px)}
.gtarget::after{content:"TARGET";position:absolute;top:100%;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted);padding-top:2px}
.gscale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px}
.grow{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.reps{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12px;padding:3px 8px;border:1px solid var(--line);background:var(--panel);border-radius:2px;white-space:nowrap}
.chip b{font-weight:600}
.chip.pos b{color:var(--ok)}.chip.neg b{color:var(--bad)}
.chip.pos{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}.chip.neg{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}

/* Board */
.board{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:840px){.board{grid-template-columns:1fr}}
@media (min-width:1100px){.board{grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px}.tags{position:sticky;top:14px}.panel#detail{min-height:520px}}
@media (hover:none){.kbonly{display:none!important}}
.tag .kn{position:absolute;right:10px;bottom:10px;font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.iconbtn{background:transparent;border:2px solid var(--line);border-radius:3px;width:38px;height:38px;display:inline-grid;place-items:center;font-size:17px;color:var(--ink)}
.iconbtn:hover{border-color:var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center;margin:0}
.keys dt{display:flex;gap:4px}.keys dd{margin:0}
.opt:focus-visible{border-color:var(--ink);background:var(--panel)}
.tags{display:flex;flex-direction:column;gap:10px}
.tag{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);padding:12px 14px 12px 44px;display:grid;gap:3px;border-radius:4px;transition:transform .12s,border-color .15s,box-shadow .15s}
.tags.deal .tag{animation:dealin .35s both}
.tags.deal .tag:nth-of-type(2){animation-delay:.05s}.tags.deal .tag:nth-of-type(3){animation-delay:.1s}.tags.deal .tag:nth-of-type(4){animation-delay:.15s}
@keyframes dealin{from{opacity:.0;transform:translateX(-10px)}}
.tag:hover{border-color:var(--ink)}
.tag::before{content:"";position:absolute;left:16px;top:17px;width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);background:var(--bg)}
.tag::after{content:"";position:absolute;left:23px;top:0;width:1px;height:17px;background:var(--muted);opacity:.5}
.tag[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink),var(--shadow);transform:translateX(4px)}
.tag.done::before{background:var(--ok);border-color:var(--ok)}
.tag.done .tt{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.tag .tt{font-weight:600;line-height:1.3}
.tag .area{display:flex;justify-content:space-between;gap:8px}
.att{display:flex;gap:7px;align-items:center}
.att i{width:13px;height:13px;border:2px solid var(--ink);display:inline-block;transform:rotate(45deg);transition:background .25s}
.att i.on{background:var(--hivis);border-color:var(--hivis-ink)}

.panel{background:var(--panel);border:1px solid var(--line);padding:clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow);border-radius:4px}
.panel.enter{animation:rise .3s both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.scene{font-size:clamp(16px,1.9vw,18px);max-width:62ch;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;text-align:left;background:var(--sunk);border:1px solid var(--line);padding:12px 14px;border-radius:4px;transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--ink);background:var(--panel)}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.opt .k{font-family:var(--display);font-size:22px;font-weight:700;line-height:1;width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%}
.opt .odds{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:4px}
.opt .odds.hi{color:var(--ok)}.opt .odds.lo{color:var(--bad)}

.locked{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1px dashed var(--line);background:repeating-linear-gradient(-45deg,transparent 0 10px,color-mix(in srgb,var(--line) 35%,transparent) 10px 11px);padding:14px;border-radius:4px}
.locked svg{width:26px;height:26px;color:var(--muted)}
.locked .fake{margin-top:8px;height:42px;border:1px solid var(--line);border-radius:3px;background:var(--sunk);display:flex;align-items:center;padding:0 10px;color:var(--muted);font-size:13px;user-select:none}

.result{display:grid;gap:12px;border-left:4px solid var(--info);padding:4px 0 4px 16px}.result.fresh{animation:rise .35s both}.result:not(.fresh) .stamp{animation:none}
.result.g-best{border-color:var(--ok)}.result.g-good{border-color:var(--info)}.result.g-weak{border-color:var(--warn)}.result.g-wrong{border-color:var(--bad)}
.outhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stamp{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.08em;padding:2px 12px;border:3px solid currentColor;border-radius:3px;transform:rotate(-4deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:.15s}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(1.9)}}
.c-best{color:var(--ok)}.c-good{color:var(--info)}.c-weak{color:var(--warn)}.c-wrong{color:var(--bad)}
.lucky{font-family:var(--mono);font-size:12px;color:var(--muted)}
.fx{display:flex;flex-wrap:wrap;gap:6px}
.lesson{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.2;border-top:1px solid var(--line);padding-top:10px}
.empty{display:grid;gap:10px;place-items:start;padding:12px 0}
.empty svg{width:56px;height:56px;color:var(--line)}

/* Lower panels */
.lower{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.rung{display:grid;gap:4px}
.rung span{height:8px;background:var(--line);border-radius:1px}
.rung.on span{background:var(--hivis)}
.rung.now span{background:var(--ink)}
.rung small{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.2}
.rung.now small{color:var(--ink);font-weight:600}
.xp{display:grid;gap:8px;margin-top:8px}
.xprow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px}
.xpbar{height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:1px;position:relative;overflow:hidden}
.xpbar b{position:absolute;inset:0 auto 0 0;background:var(--info);transition:width .5s}
.xpbar b.full{background:var(--ok)}
.log ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px;max-height:280px;overflow:auto}
.log li{font-size:13.5px}
.log li::marker{font-family:var(--mono);color:var(--muted)}
svg.spark{width:100%;height:56px;display:block;margin-top:6px}

/* Modal */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border:1px solid var(--line);border-top:10px solid var(--hivis);max-width:620px;width:100%;max-height:100%;overflow:auto;padding:22px;display:grid;gap:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);border-radius:4px;animation:rise .3s both}
.modal ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.modal li{border-left:3px solid var(--bad);padding-left:12px;display:grid;gap:4px}
.modal li.okk{border-color:var(--ok)}
.delta{display:flex;gap:16px;flex-wrap:wrap}
.medpop{position:fixed;right:20px;bottom:20px;z-index:80;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--hivis);padding:12px 16px;display:grid;gap:2px;box-shadow:var(--shadow);border-radius:4px;max-width:320px;animation:rise .3s both}
.medpop b{font-family:var(--display);font-size:22px;text-transform:uppercase}
.medals{display:grid;gap:8px}.medgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.med{border:1px dashed var(--line);padding:8px 10px;border-radius:3px;display:grid;gap:2px;opacity:.55}.med b{font-family:var(--display);font-size:17px;text-transform:uppercase}.med span{font-size:12px;color:var(--muted)}
.med.got{opacity:1;border-style:solid;border-color:var(--hivis);background:color-mix(in srgb,var(--hivis) 10%,var(--panel))}
.newsbox{background:var(--sunk);border:1px solid var(--line);border-left:4px solid var(--hivis);padding:10px 12px;display:grid;gap:6px;border-radius:3px}
.delta div{display:grid}
.delta .v{font-family:var(--display);font-size:28px;font-weight:700}

/* End */
.report{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.report>div{border-top:3px solid var(--ink);padding-top:10px;display:grid;gap:6px;align-content:start}
.gbar{display:flex;height:14px;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.gbar span{height:100%}
.rank{font-family:var(--display);font-size:clamp(28px,5vw,44px);font-weight:700;text-transform:uppercase;line-height:1}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const ROLES=["Field coordinator","Package lead","Area manager","Construction director"];
const REP={f:"Field",b:"Boss",en:"Engineering",r:"Regulator",cm:"Comms"};
const S=[
// ----- Field coordinator -----
{id:"pour",r:0,a:"Concrete",t:"Night pour losing heat",x:"6 am, minus 24. The night pour on the shield wall is running long and the heaters are struggling to keep the enclosure warm.",o:[
{t:"Add four heaters and double the tarps (about $18k)",p:.85,g:"best",n:"Protecting a pour you have already started is cheap next to a cold joint in a containment wall.",ok:{x:"The enclosure holds above 10 °C. The pour finishes at 9:40 with good cylinders.",e:{f:1,c:.02}},no:{x:"One heater trips its breaker at 4 am and nobody notices for an hour. The top lift needs extra curing time, but the cylinders pass.",e:{c:.03,d:.5}}},
{t:"Stop at the planned construction joint and finish tomorrow",p:.8,g:"good",n:"A planned joint is a legitimate exit. You trade a day for certainty.",ok:{x:"The joint is prepared properly and the wall finishes the next night.",e:{d:.5}},no:{x:"The joint prep is rushed and engineering asks for extra roughening before the next lift.",e:{d:1,en:-1}}},
{t:"Keep going and hope the sun helps by mid-morning",p:.3,g:"wrong",n:"Hope is not a thermal control plan. The sun does little at minus 24.",ok:{x:"It squeaks through. The QC inspector logs the low temperatures anyway.",e:{}},no:{x:"A cold joint forms near the top. Engineering wants cores and a repair disposition.",e:{d:3,c:.4,en:-1,f:-1}}}],
idle:{x:"Nobody owned the heater problem. The crew kept pouring and the top lift came in cold.",e:{d:2,c:.2,f:-1}},L:"Protect what you have already committed to."},

{id:"certs",r:0,a:"Quality",t:"Rebar truck without certs",x:"A rebar delivery is stuck at the gate. The driver says the mill certs are \"in the office somewhere.\" The crew wants the steel this morning.",o:[
{t:"Turn it away until the paperwork arrives",p:.85,g:"good",n:"Safe, but it costs the delivery slot and annoys the supplier.",ok:{x:"The certs arrive the next day and the truck comes back. You lose a morning.",e:{d:.3}},no:{x:"The supplier can't rebook for a week. The crew idles.",e:{d:1.5,f:-1}}},
{t:"Unload into quarantine, red-tagged, until the certs arrive",p:.9,g:"best",n:"Material in hand, nothing used until it is proven. That is how quarantine is supposed to work.",ok:{x:"The certs arrive two days later and one heat number doesn't match. That bundle never gets near the wall. A nonconformance caught on paper, not in concrete.",e:{en:1,f:1,w:-1}},no:{x:"The certs arrive fine. Quarantine cost the crew an hour of handling.",e:{}}},
{t:"Unload normally, it's the usual supplier",p:.55,g:"wrong",n:"Familiarity is not traceability.",ok:{x:"The certs turn up and match. You got away with it.",e:{}},no:{x:"One bundle came from the wrong mill and is already tied into the wall. Engineering needs a disposition and maybe removal.",e:{d:3,c:.3,en:-2,r:-1}}}],
idle:{x:"The guard let the truck in. A bundle from the wrong mill got tied into the wall before anyone checked.",e:{d:2,c:.2,en:-1}},L:"A cert only proves the material it names."},

{id:"walk",r:0,a:"Quality",t:"Pour sign-off at 3 pm",x:"The superintendent wants your pour-readiness signature for tomorrow's wall by 3 pm. Priya, your apprentice, asks to shadow you this afternoon.",o:[
{t:"Walk the pour area with Priya before signing",p:.85,g:"best",n:"Go and look, and bring someone so they learn to look too.",ok:{x:"Priya spots a missing waterstop at the construction joint. Fixed in forty minutes. You sign at 2:50.",e:{f:1,en:1,w:-1}},no:{x:"Nothing wrong today, but Priya now knows what a real walk-down looks like.",e:{f:1}}},
{t:"Sign from the checklist at your desk",p:.45,g:"wrong",n:"A checklist says what someone claims is done. It is not evidence.",ok:{x:"The checklist was right this time.",e:{}},no:{x:"A waterstop was missing. It is found after the pour and needs injection grouting.",e:{d:2,c:.15,en:-2}}},
{t:"Send Priya alone and sign on her report",p:.6,g:"weak",n:"Stretching people is good. Signing on their word before you know their eye is not.",ok:{x:"Priya does a careful job. You sign.",e:{f:1}},no:{x:"Priya misses the waterstop. It comes out after the pour, and so does your signature.",e:{d:2,c:.15,en:-1,b:-1}}}],
idle:{x:"You signed from the checklist in a rush. A missing waterstop showed up after the pour.",e:{d:2,c:.15,en:-1}},L:"Go and look."},

{id:"storm",r:0,a:"Weather",t:"Ice storm in three days",x:"The forecast shows a serious ice storm in three days. Prepping now pulls two crews off production.",o:[
{t:"Start storm prep now",p:.85,g:"best",n:"Weather is a constraint with a known date. Cheap to plan for, expensive to meet unprepared.",ok:{x:"20 mm of ice. Your scaffolds are tied off, the crane weathervaned, curing double-blanketed. You are back working a day after the storm; the area next door takes five.",e:{f:1,b:1,d:-.5}},no:{x:"The storm tracks south and you lose a day and a half of output for nothing. Still the right call.",e:{d:.3,f:-1}}},
{t:"Wait a day for a firmer forecast",p:.5,g:"weak",n:"Waiting has value only if you can still act in time. Here the margin is thin.",ok:{x:"The forecast firms up and one day is just enough.",e:{}},no:{x:"The storm comes early. Scaffolds iced, a tarp collapses on fresh concrete.",e:{d:2,c:.2,s:-1}}},
{t:"Raise it with your area manager and let them decide",p:.7,g:"good",n:"Reasonable, but it is your area. Bring a recommendation, not just the problem.",ok:{x:"She approves prep the same afternoon.",e:{b:1}},no:{x:"She's in meetings until tomorrow. Prep starts late.",e:{d:1}}}],
idle:{x:"Nobody prepped. The ice storm shut your scaffolds for four days.",e:{d:2,c:.2,s:-1}},L:"Plan for the constraint you can see coming."},

{id:"rfi",r:0,a:"Engineering",t:"RFI unanswered for ten days",x:"An RFI on embed locations has sat for ten days. Your crew reaches that wall section in four days.",o:[
{t:"Phone the engineer, then ask for an email confirmation to close the RFI",p:.85,g:"best",n:"A phone call gets the answer fast. The email makes it count.",ok:{x:"Daniel never saw it; it was misrouted. He answers in ten minutes and emails confirmation. Document control finds eleven more RFIs in the wrong queue.",e:{en:2,w:-2}},no:{x:"Daniel's on leave. His backup answers by email the next day.",e:{en:1}}},
{t:"Escalate formally through document control with a needed-by date",p:.65,g:"good",n:"Correct process, slower path.",ok:{x:"The answer comes back in three days.",e:{en:1}},no:{x:"It sits again. The crew waits two days.",e:{d:1}}},
{t:"Have the crew skip that section and come back later",p:.5,g:"weak",n:"Working around a constraint hides it. Out-of-sequence work costs more later.",ok:{x:"The crew works around it.",e:{d:.5}},no:{x:"The skipped section blocks the next pour sequence. Two days of rework.",e:{d:2,f:-1}}}],
idle:{x:"The RFI sat. The crew reached the wall and stopped.",e:{d:2}},L:"Close the loop in writing."},

{id:"laydown",r:0,a:"Logistics",t:"Two crews, one laydown yard",x:"The piping crew and the electrical crew both booked the same laydown space and are arguing at the gate.",o:[
{t:"Split it in half",p:.5,g:"weak",n:"Fair is not the same as right. Nobody gets what they need.",ok:{x:"Both crews make do.",e:{}},no:{x:"Piping misses its tie-in by two days.",e:{d:1.5}}},
{t:"Check the schedule and give it to the critical-path crew",p:.85,g:"best",n:"Float tells you who can wait, as long as the float is real.",ok:{x:"Piping gets it and hits its tie-in. You find electrical a spot behind the warehouse.",e:{f:1,d:-.3}},no:{x:"Piping gets it. Then electrical learns its cable reels are three weeks late; their float was never real.",e:{w:1}}},
{t:"Kick it to the superintendent",p:.6,g:"weak",n:"He'll decide, but you just taught both foremen you won't.",ok:{x:"He picks piping.",e:{}},no:{x:"He's busy. The argument costs a morning.",e:{d:.5,f:-1}}}],
idle:{x:"The two crews fought over it all morning.",e:{d:.5,f:-1}},L:"Check whether the float is real."},

{id:"status",r:0,a:"Reporting",t:"End-of-day status",x:"Your boss wants a status by end of day. The truth: the RFI is fixed, storm prep is done, the shield wall is half a day behind, and you found misrouted RFIs.",o:[
{t:"Report it exactly as it is",p:.9,g:"good",n:"Accurate and clean.",ok:{x:"Karen replies: \"Thanks, keep pushing on the shield wall.\"",e:{b:1}},no:{x:"Karen asks for more detail on the half day.",e:{}}},
{t:"Round it to \"on track\", you'll catch up",p:.5,g:"wrong",n:"\"On track\" is a claim, not a fact.",ok:{x:"You catch up. Nobody knows.",e:{}},no:{x:"You don't catch up. Karen finds out from the scheduler.",e:{b:-2,w:1}}},
{t:"Report it as it is and flag the misrouted RFIs as a systemic risk",p:.85,g:"best",n:"A straight status gets you trusted. A systemic flag gets you noticed.",ok:{x:"Karen takes your list to the area managers. An audit finds 34 misrouted RFIs project-wide.",e:{b:2,en:1,w:-3}},no:{x:"Karen thanks you but it waits a week.",e:{b:1}}}],
idle:{x:"You missed the status. Karen heard about the half day from someone else.",e:{b:-1}},L:"Report the system, not just the symptom."},

{id:"talks",r:0,a:"Safety",t:"Skipped safety talks",x:"A young labourer tells you quietly that his foreman has been skipping pre-task safety talks to save time.",o:[
{t:"Talk to the foreman directly",p:.65,g:"good",n:"Direct, but he'll know someone talked.",ok:{x:"Rick admits it and starts running them.",e:{s:1}},no:{x:"Rick denies it and wonders who told you.",e:{f:-1}}},
{t:"Report it to safety",p:.7,g:"good",n:"By the book. Protects you, may not fix the cause.",ok:{x:"Safety audits the crew. The talks restart.",e:{s:1,f:-1}},no:{x:"The audit lands heavy and the crew blames the new kid.",e:{f:-2}}},
{t:"Show up unannounced at tomorrow's pre-task talk",p:.85,g:"best",n:"Seeing it yourself protects the person who told you, and finds the pressure behind it.",ok:{x:"There is no talk. You run one yourself. Afterwards Rick says, \"We're behind and the boss is on me.\" Now you know the real problem.",e:{s:2,f:1}},no:{x:"Rick happens to run one that day. You'll need to come back.",e:{}}}],
idle:{x:"Nothing was done. A week later a crew member is hurt on an icy ladder that a talk would have covered.",e:{s:-2,f:-1}},L:"When someone cuts a corner, look for the pressure that made it look reasonable."},

{id:"scaffold",r:0,a:"Safety",t:"Untagged scaffold",x:"The scaffold contractor says a platform is ready, but there's no inspection tag. Your crew is waiting and the pour is on the critical path.",o:[
{t:"Let them climb, the contractor says it's fine",p:.6,g:"wrong",n:"No tag means no inspection.",ok:{x:"Nothing happens.",e:{}},no:{x:"A loose toe board sends a bucket of tie wire down onto the deck. Nobody hit, but safety shuts the area.",e:{s:-2,d:1}}},
{t:"Stop and get it inspected, about two hours",p:.9,g:"good",n:"Correct. Costs time.",ok:{x:"Inspected and tagged. The pour starts two hours late.",e:{d:.2}},no:{x:"The inspector is tied up until afternoon.",e:{d:.5}}},
{t:"Inspect it yourself and sign the tag (you're qualified)",p:.85,g:"best",n:"Fast and legitimate, if you're qualified. Your name is now on it, so add a re-inspect rule for modifications.",ok:{x:"You find a loose toe board, get it fixed, sign the tag. Twenty minutes late, not two hours.",e:{f:1,s:1}},no:{x:"A week later someone moves a brace. The tag still says you inspected it.",e:{s:-1}}}],
idle:{x:"The crew climbed it untagged while you were busy.",e:{s:-1}},L:"A signature fixes today. A process fixes next week."},

{id:"water",r:0,a:"Concrete",t:"Water in the truck",x:"A crew wants to add water to a concrete truck because the slump is low. The ticket shows 80 minutes on site.",o:[
{t:"Allow it, the slump is too low to place",p:.35,g:"wrong",n:"Water raises the water-cement ratio and drops strength.",ok:{x:"Cylinders pass, barely.",e:{}},no:{x:"Low breaks at 28 days. Cores and a disposition.",e:{d:2,c:.2,en:-2}}},
{t:"Reject the truck",p:.85,g:"good",n:"Safe, if you already know the limits.",ok:{x:"The next truck places fine.",e:{}},no:{x:"The gap causes a cold joint risk; the crew scrambles.",e:{d:.3}}},
{t:"Check the mix design's allowable water and the batch time first",p:.9,g:"best",n:"The clock starts at batching, not arrival. It was 110 minutes old.",ok:{x:"Batched 30 minutes before arrival: 110 minutes, past the spec. Rejected with a reason on the ticket.",e:{en:1}},no:{x:"Within limits. One permitted addition, recorded on the ticket.",e:{}}}],
idle:{x:"The crew added water. Low breaks followed.",e:{d:1.5,c:.15,en:-1}},L:"The clock starts at batching."},

{id:"frozen",r:0,a:"Safety",t:"Scaffold on frozen ground",x:"A scaffold inspector red-tags a scaffold because its base plates sit on frozen ground. It's minus 15 and will stay frozen for months.",o:[
{t:"Accept it, frozen ground is solid",p:.5,g:"wrong",n:"Frozen ground isn't permanent ground. One heater or a sunny week softens it.",ok:{x:"Holds through winter.",e:{}},no:{x:"A heater enclosure thaws the ground under one leg. The scaffold settles and is shut.",e:{s:-2,d:1}}},
{t:"Add mud sills on cleared, level ground",p:.95,g:"best",n:"Spreads the load so a soft spot isn't a collapse. Add a spring-thaw check.",ok:{x:"Sills in by noon. Tag goes green.",e:{s:1}},no:{x:"Sills in, but placed on ice. The inspector makes you redo it.",e:{d:.2}}},
{t:"Move the scaffold",p:.7,g:"weak",n:"Moving it doesn't fix the cause.",ok:{x:"Rebuilt on the slab.",e:{d:.5}},no:{x:"Two days of rework for the same problem in a new spot.",e:{d:1.5}}}],
idle:{x:"The red tag sat, and the crew lost the scaffold for a week.",e:{d:1}},L:"Design for the thaw."},

{id:"wind",r:0,a:"Lifting",t:"Operator refuses a lift",x:"A crane operator refuses a lift, saying the wind feels too strong. The anemometer reads 30 km/h, under the 50 limit.",o:[
{t:"Tell him the reading is fine, proceed",p:.5,g:"wrong",n:"The operator has the final say on a lift.",ok:{x:"He lifts, unhappy. Fine.",e:{f:-2}},no:{x:"A gust swings the panel into a column. No one hurt; a stop-work follows.",e:{s:-3,d:2,f:-2}}},
{t:"Back his call and stop the lift, then debrief",p:.95,g:"best",n:"Backing him publicly makes the next operator speak up too.",ok:{x:"The engineer checks: that panel's sail area gives it a 35 km/h limit. He was right. The lift plan gets fixed.",e:{s:2,f:2}},no:{x:"The wind drops in an hour. You lose an hour.",e:{f:1,d:.2}}},
{t:"Check the load's sail area and gust readings, then decide",p:.75,g:"good",n:"Good engineering, but stop first and analyse second.",ok:{x:"Gusts are at 48. You stop.",e:{s:1}},no:{x:"While you're checking, the crew starts rigging anyway.",e:{s:-1}}}],
idle:{x:"Nobody answered the operator. He waited three hours.",e:{d:.5,f:-1}},L:"The person closest to the risk gets the stop call."},

{id:"thermal",r:0,a:"Concrete",t:"Mass pour temperature gap",x:"A two-metre slab's core is at 72 °C and its surface at 30. The thermal control plan limit is a 20 degree difference.",o:[
{t:"Add insulation blankets to the surface",p:.85,g:"best",n:"Close the gap by keeping the surface warm, never by cooling it.",ok:{x:"The gap closes to 17 within six hours.",e:{en:1}},no:{x:"Not enough on its own; you tent it with heaters too. Holds.",e:{c:.05}}},
{t:"Spray cold water on the surface",p:.15,g:"wrong",n:"Cooling the surface widens the gap and cracks it.",ok:{x:"Somehow no cracks. Engineering is furious anyway.",e:{en:-1}},no:{x:"Thermal cracking across the slab. Epoxy injection and a disposition.",e:{d:3,c:.4,en:-2}}},
{t:"Call the engineer of record and wait",p:.65,g:"good",n:"Right person, but act on the obvious step while you wait.",ok:{x:"The engineer says insulate.",e:{}},no:{x:"Two hours waiting. Minor surface cracking.",e:{d:.5,en:-1}}}],
idle:{x:"Nobody watched the thermocouples. The slab cracked.",e:{d:2,c:.3,en:-1}},L:"Control the gap, not the temperature."},

{id:"lockout",r:0,a:"Safety",t:"A lockout with no lock",x:"An electrician says the motor control centre is locked out and ready. You look at the breaker. There's a tag on it, but no lock, and the panel door doesn't latch.",o:[
{t:"Have him apply his own lock and do a try-start before anyone touches it",p:.9,g:"best",n:"A tag is a note. A personal lock and a test are proof.",ok:{x:"The try-start hums. The breaker was the wrong one; the labels were swapped in a retrofit. Nobody was in the cabinet yet.",e:{s:2,f:1}},no:{x:"Everything checks out. Fifteen minutes spent, and the crew sees what a real lockout looks like.",e:{s:1}}},
{t:"Trust him, he's been doing this twenty years",p:.5,g:"wrong",n:"Experience is not isolation.",ok:{x:"It was the right breaker. This time.",e:{}},no:{x:"A labourer gets a jolt from a mislabelled circuit. He's fine. The stand-down lasts three days.",e:{s:-3,d:1,r:-1}}},
{t:"Stop the job and call the electrical supervisor",p:.75,g:"good",n:"Safe, but you could have asked for the lock yourself.",ok:{x:"The supervisor finds the swapped labels.",e:{s:1,d:.2}},no:{x:"He's at the other unit. Two hours of waiting.",e:{d:.4}}}],
idle:{x:"Nobody checked the lock. A worker was shocked from a mislabelled breaker.",e:{s:-3,d:1}},L:"Your lock, your life."},

{id:"ties",r:0,a:"Concrete",t:"Form ties spaced wide",x:"The carpenters spaced the form ties at 900 mm instead of the 600 on the drawing. It saves half a day. The pour is tomorrow morning.",o:[
{t:"Have them add the missing ties before the pour",p:.85,g:"best",n:"Formwork is designed for a pressure. The drawing isn't a suggestion.",ok:{x:"Overtime tonight, pour on time. Nobody argues the next time the drawing says 600.",e:{c:.03,en:1}},no:{x:"The ties go in but the pour slips to the afternoon.",e:{d:.3}}},
{t:"Ask the formwork engineer if 900 is acceptable",p:.7,g:"good",n:"Reasonable, if you get an answer in writing before the trucks arrive.",ok:{x:"She runs the numbers: fine at a slower pour rate. You get it in writing.",e:{en:1}},no:{x:"No answer by morning. You pour slowly and nervously.",e:{d:.3}}},
{t:"Pour with extra bracing outside",p:.4,g:"wrong",n:"Outside bracing doesn't stop the panels bowing between ties.",ok:{x:"The wall comes out straight. Lucky.",e:{}},no:{x:"A panel bows 40 mm. The wall is out of tolerance and needs grinding and a disposition.",e:{d:2,c:.2,en:-1}}}],
idle:{x:"Nobody looked. The wall bulged between the ties.",e:{d:1.5,c:.15,en:-1}},L:"The drawing is the design."},

{id:"void",r:0,a:"Lifting",t:"A void under the crane pad",x:"Ground radar shows a possible void under where the mobile crane's outrigger will sit tomorrow. An old drawing shows a backfilled utility trench there in 1987.",o:[
{t:"Dig a test pit to see what's there before the crane arrives",p:.85,g:"best",n:"An hour with an excavator answers it.",ok:{x:"Loose, wet backfill a metre down. It's dug out and replaced with compacted gravel. The lift goes ahead in the afternoon.",e:{s:1,en:1,d:.2}},no:{x:"Solid ground. An hour spent, and you sleep tonight.",e:{d:.1}}},
{t:"Use bigger crane mats and go ahead",p:.6,g:"weak",n:"Bigger mats spread load. They don't bridge a hole.",ok:{x:"The mats hold.",e:{}},no:{x:"An outrigger settles 60 mm during setup. The operator stops before the lift. Lucky.",e:{s:-2,d:1}}},
{t:"Move the crane setup three metres",p:.75,g:"good",n:"Avoids the unknown, at the cost of a longer reach.",ok:{x:"The lift plan is re-run at the new radius. Fine.",e:{d:.3}},no:{x:"At the new radius the crane is near its chart limit. A bigger crane is ordered.",e:{d:1,c:.1}}}],
idle:{x:"Nobody looked into the radar result. An outrigger sank during setup.",e:{s:-2,d:1}},L:"Find out what's under you."},

{id:"survey",r:0,a:"Engineering",t:"Two surveys, 30 mm apart",x:"Two survey crews set out the anchor bolts for a pump foundation and disagree by 30 mm. The tolerance is 5.",o:[
{t:"Get an independent check from the primary control points",p:.9,g:"best",n:"When two measurements disagree, the answer is a third, from a known reference.",ok:{x:"Crew B used a control point that was bumped by a loader last month. The point is re-established and three other layouts are checked.",e:{en:2,w:-1}},no:{x:"Crew A was right. Half a day lost, but you know why.",e:{en:1,d:.2}}},
{t:"Split the difference",p:.1,g:"wrong",n:"An average of a right answer and a wrong one is wrong.",ok:{x:"It lands in tolerance by luck.",e:{}},no:{x:"The pump doesn't fit. Cored-out anchors and epoxy.",e:{d:2,c:.2,en:-2}}},
{t:"Go with the senior crew",p:.55,g:"weak",n:"Seniority is not a survey method.",ok:{x:"The senior crew was right.",e:{}},no:{x:"The senior crew was the one off the bumped point.",e:{d:2,c:.15,en:-1}}}],
idle:{x:"The disagreement sat. Someone picked a layout and the pump didn't fit.",e:{d:2,c:.15}},L:"Go back to the reference."},

{id:"hotwork",r:0,a:"Safety",t:"Welding with no fire watch",x:"A welder is about to strike an arc a metre from foam insulation. The fire watch went for a coffee. \"Two minutes of tacking,\" he says.",o:[
{t:"Stop him until the fire watch is back",p:.95,g:"best",n:"Two minutes is how long a foam fire takes to get away from you.",ok:{x:"Ten minutes later the fire watch is back with a coffee and an extinguisher. Tacking goes ahead.",e:{s:1,d:0}},no:{x:"The fire watch takes forty minutes. The welder sulks.",e:{f:-1,d:.1}}},
{t:"Let him, it's only tacking",p:.55,g:"wrong",n:"Sparks don't know it's only tacking.",ok:{x:"Nothing catches.",e:{}},no:{x:"The foam smoulders behind the board. Found an hour later by the smell. Evacuation and a fire report.",e:{s:-3,d:1,r:-1}}},
{t:"Stand fire watch yourself",p:.75,g:"good",n:"Works if you're trained and you stay for the 30 minutes after.",ok:{x:"You watch, you wait the half hour, you sign the permit.",e:{s:1,f:1}},no:{x:"You get called away at minute twenty.",e:{s:-1}}}],
idle:{x:"The welder went ahead alone. Foam smouldered behind a board for an hour.",e:{s:-2,d:.5}},L:"Fire watch covers the half hour after, too."},

{id:"pumpline",r:0,a:"Lifting",t:"Concrete pump near a power line",x:"The concrete pump truck has to set up closer to a 25 kV line than the plan showed. The operator thinks he can keep the boom clear.",o:[
{t:"Reposition and post a dedicated spotter with a marked limit of approach",p:.9,g:"best",n:"Distance first, then a person whose only job is watching it.",ok:{x:"The truck moves eight metres. Longer boom reach, slower pour, nobody near the line.",e:{s:2,d:.2}},no:{x:"The new spot needs a bigger pump. Half a day lost.",e:{d:.5,s:1}}},
{t:"Ask the utility to de-energize the line",p:.8,g:"good",n:"Safest, slowest.",ok:{x:"The utility shuts it down for Saturday. You pour then.",e:{d:1,s:1}},no:{x:"The utility needs three weeks' notice.",e:{d:2}}},
{t:"Trust the operator",p:.6,g:"wrong",n:"Booms swing, and electricity jumps the gap.",ok:{x:"He keeps it clear.",e:{}},no:{x:"A gust swings the boom within arcing distance. The line trips. Nobody hurt, by a metre.",e:{s:-4,d:1,r:-2}}}],
idle:{x:"No one decided. The pump set up close to the line and the boom swung near it.",e:{s:-3,d:.5}},L:"Distance is the only real protection."},

{id:"trench",r:0,a:"Geotech",t:"Trench walls after rain",x:"Overnight rain, and the walls of the cooling water trench are sloughing. The pipe crew wants to finish one tie-in down there this morning.",o:[
{t:"Have a competent person re-inspect, and drop in a trench box before anyone enters",p:.9,g:"best",n:"Rain changes the soil. The inspection has to happen again.",ok:{x:"The box goes in by ten. The tie-in is done by three.",e:{s:2,d:.2}},no:{x:"The box is on another job until tomorrow. A day lost.",e:{d:1,s:1}}},
{t:"Do the tie-in fast, with one man down and one watching",p:.35,g:"wrong",n:"A wall collapse takes seconds. Watching doesn't help.",ok:{x:"Done in an hour. Nothing moves.",e:{}},no:{x:"A section of wall slides in. He's waist-deep and dug out unhurt. Stop-work and a regulator visit.",e:{s:-4,r:-2,d:2}}},
{t:"Pump out the water and bench the walls back",p:.75,g:"good",n:"Benching works. It takes most of the day.",ok:{x:"Benched and dry by late afternoon.",e:{d:.6,s:1}},no:{x:"The benching undermines the road. More work.",e:{d:1.2}}}],
idle:{x:"The crew went in anyway. A wall slid.",e:{s:-3,d:1}},L:"Every rain resets the inspection."},

{id:"newhire",r:0,a:"People",t:"A first-week hire alone on nights",x:"The night shift schedule has a three-day hire as the only fire watch on the turbine deck. He's keen. He's never seen a hot work permit.",o:[
{t:"Pair him with an experienced watch for his first two weeks",p:.9,g:"best",n:"New people learn the job from someone who knows it, not from the first emergency.",ok:{x:"Second night, his partner shows him a smouldering rag behind a weld. He never forgets it.",e:{s:2,f:1,c:.02}},no:{x:"Two quiet weeks. He knows the job now.",e:{s:1,c:.02}}},
{t:"Keep the schedule, he passed the course",p:.45,g:"wrong",n:"A course teaches the words. A shift teaches the job.",ok:{x:"Quiet night.",e:{}},no:{x:"He doesn't recognise smouldering insulation until it flames. Put out, and reported.",e:{s:-3,r:-1}}},
{t:"Cancel hot work on nights until you have someone experienced",p:.85,g:"good",n:"Safe; costs the night shift's output.",ok:{x:"Night shift does cold work for a week.",e:{d:.5}},no:{x:"A night weld was on the critical path.",e:{d:1}}}],
idle:{x:"Nobody noticed the schedule. The new hire was alone the night something caught.",e:{s:-2}},L:"People learn the job from people."},

// ----- Package lead -----
{id:"dome",r:1,a:"Engineering",t:"Dome detail not issued",x:"Engineering hasn't settled how the dome rebar ties into the wall. The new detail may need couplers cast into the top four metres, which you pour in eleven days. The full detail is three weeks out.",o:[
{t:"Push engineering to issue just the coupler layout in ten days",p:.8,g:"best",n:"You don't need the whole answer, just the part that's about to become irreversible.",ok:{x:"The stamped coupler layout lands on day nine. Couplers cast in. The full detail later matches.",e:{en:1,w:-6}},no:{x:"It slips two days. You hold the top lift briefly.",e:{d:1,w:-3}}},
{t:"Hold the top four metres until the full detail is issued",p:.9,g:"good",n:"Safe, slow.",ok:{x:"Three weeks of hold, then pour.",e:{d:2,w:-3}},no:{x:"The detail slips again. Five weeks lost.",e:{d:4}}},
{t:"Pour as planned and deal with it later",p:.2,g:"wrong",n:"Erasers are cheaper than excavators.",ok:{x:"The detail ends up needing no couplers.",e:{}},no:{x:"Couplers needed. Drilling and epoxy into a containment wall, with the regulator watching.",e:{d:6,c:2,r:-2,en:-1}}}],
idle:{x:"Nobody chased it. The pour went ahead and couplers had to be drilled in afterwards.",e:{d:5,c:1.5,r:-1}},L:"Decide early, commit carefully."},

{id:"liner",r:1,a:"Procurement",t:"Liner plates stuck at the mill",x:"Your PO lets you inspect at the mill. Your inspector finds two thirds of the containment liner plates rolled and good. The last third is stuck behind the mill's own certification paperwork.",o:[
{t:"Send your quality lead to help untangle their certification",p:.8,g:"best",n:"Sometimes the fastest way through someone else's problem is to help them solve it.",ok:{x:"A third-party lab report sat in an inbox for a month. Ken gets it in two days. Plates arrive six weeks earlier than they would have.",e:{w:-6,d:-2}},no:{x:"Slower than hoped, but the plates ship.",e:{w:-2}}},
{t:"Find a second supplier for the last third",p:.4,g:"weak",n:"Qualifying a nuclear supplier takes longer than the problem.",ok:{x:"A backup qualifies in record time.",e:{c:1.5}},no:{x:"Qualification takes five months. You end up waiting for the original anyway.",e:{d:3,c:1}}},
{t:"Accept the later date and re-plan around it",p:.7,g:"weak",n:"Passive. Fine if nothing else can move it.",ok:{x:"The re-plan absorbs most of it.",e:{d:3}},no:{x:"The mill slips further.",e:{d:6}}}],
idle:{x:"Nobody chased the mill. The plates came eleven weeks late.",e:{d:8,w:2}},L:"Use the rights your contract already gives you."},

{id:"thaw",r:1,a:"Logistics",t:"Spring thaw on the laydown",x:"Two weeks to thaw. Last year trucks were stuck for three weeks. Gravel and matting would cost about $400,000.",o:[
{t:"Lay gravel and matting now",p:.85,g:"best",n:"Prevention looks expensive until you compare it with the cure.",ok:{x:"Heavy rain on snowmelt. Your yard holds; the next package loses two and a half weeks.",e:{c:.4,d:-1,b:1}},no:{x:"A mild spring. Money spent, nothing to show for it this year.",e:{c:.4}}},
{t:"Move critical material to paved areas, accept some mud",p:.6,g:"good",n:"Cheap partial fix.",ok:{x:"Works mostly.",e:{d:.5}},no:{x:"The pavement runs out. A week stuck.",e:{d:1.5}}},
{t:"Do nothing",p:.3,g:"wrong",n:"Weather you can predict is a choice, not bad luck.",ok:{x:"Dry spring. Lucky.",e:{}},no:{x:"Three weeks of trucks in mud.",e:{d:3,c:.6}}}],
idle:{x:"Nothing was done. The yard turned to soup for three weeks.",e:{d:3,c:.5}},L:"Price the cure before you call prevention expensive."},

{id:"ken",r:1,a:"People",t:"Your best lead has an offer",x:"Ken, your quality lead, has an offer from the turbine island, 20% more. Your salary cap has room for about 10%.",o:[
{t:"Match 10% and add a senior title",p:.75,g:"best",n:"People stay for trust and growth more than the last dollar.",ok:{x:"He stays. \"The title says you meant it.\"",e:{f:1}},no:{x:"He goes anyway, on good terms. His deputy steps up.",e:{w:1}}},
{t:"Let him go and promote from within",p:.6,g:"weak",n:"Sometimes right, but you lose a lot of knowledge cheaply.",ok:{x:"His deputy turns out to be strong.",e:{}},no:{x:"The deputy struggles for two months.",e:{w:2,d:1}}},
{t:"Give him 20% by squeezing another lead's raise",p:.6,g:"wrong",n:"Word gets out. Robbing one person to pay another costs you both.",ok:{x:"Ken stays. The other lead finds out.",e:{f:-2}},no:{x:"Ken stays, the other lead quits.",e:{f:-2,w:2}}}],
idle:{x:"You didn't respond. Ken took the offer.",e:{w:2,f:-1}},L:"Keep people with trust; keep what they know by writing it down."},

{id:"target",r:1,a:"Reporting",t:"Corporate wants it two months sooner",x:"Corporate announces the shield wall must finish two months earlier than your window says. Your Monte Carlo gives that about a 20% chance.",o:[
{t:"Accept it and push hard",p:.25,g:"wrong",n:"A target your own data says is unlikely just moves the cost around.",ok:{x:"Somehow you make it.",e:{b:2,c:3}},no:{x:"Fatigue, a dropped form panel, a stand-down, a cold joint. You miss by five weeks and spend $6M on overtime.",e:{c:6,s:-2,b:-1,d:1}}},
{t:"Push back with the data and an offer: a second formwork set for $2M",p:.8,g:"best",n:"Push back with data and an offer, not just a no.",ok:{x:"Corporate funds the formwork and moves the target to mid-window. You finish a week inside it.",e:{b:2,c:2,d:-3}},no:{x:"They fund it but keep the target. You miss by two weeks, no blowout.",e:{c:2,d:-1}}},
{t:"Accept it publicly, quietly plan for your own date",p:.5,g:"weak",n:"Two schedules is one lie.",ok:{x:"Nobody notices the gap until you finish on your own date.",e:{b:-1}},no:{x:"The controls group finds the second schedule.",e:{b:-3}}}],
idle:{x:"You said nothing, so the target stood. You missed it.",e:{b:-2}},L:"Bring the model."},

{id:"transformer",r:1,a:"Procurement",t:"Transformer order",x:"Needed in 14 months. Standard: $8M, 12-month lead. Upgraded: $11M, 14-month lead. The grid operator decides in 8 months, coin flip. Swapping later costs $9M plus six months (about $20M).",o:[
{t:"Order standard now",p:.5,g:"weak",n:"Expected cost about $22.5M.",ok:{x:"The upgrade isn't required.",e:{c:0}},no:{x:"The upgrade is required. $9M and six months.",e:{c:9,d:26}}},
{t:"Order upgraded now",p:1,g:"best",n:"Certain $11M beats an expected $22.5M.",ok:{x:"Arrives on time. Whatever the grid operator decides, you're covered.",e:{c:3}}},
{t:"Wait for the grid decision",p:0,g:"wrong",n:"The information arrives after the last responsible moment, so it's worth nothing.",ok:{x:"",e:{}},no:{x:"You order in month 8. It lands six to eight months late either way.",e:{d:28,c:2}}}],
idle:{x:"Nobody placed the order. It arrived months late.",e:{d:24,c:2}},L:"Information only has value if it arrives before you must commit."},

{id:"grout",r:1,a:"Geotech",t:"Grout the turbine foundation?",x:"30% chance the soil needs grouting. Grouting now: $10M. Skip and need it: $40M later. Boreholes: $1M plus a six-week delay worth $3M.",o:[
{t:"Grout now to be safe",p:1,g:"weak",n:"Certain $10M to avoid a risk information could clear for less.",ok:{x:"Grouted. Probably unnecessary.",e:{c:10}}},
{t:"Drill boreholes first",p:.7,g:"best",n:"About $7M expected. Value of information.",ok:{x:"Clean soil. No grouting needed.",e:{c:4,d:1.5}},no:{x:"Grouting needed, and now you know exactly where.",e:{c:13,d:1.5}}},
{t:"Skip it",p:.7,g:"wrong",n:"About $12M expected, with the worst tail.",ok:{x:"Lucky.",e:{}},no:{x:"Settlement under the pedestal. $40M fix.",e:{c:40,d:10}}}],
idle:{x:"No decision, so the foundation went in untested. The soil needed grouting.",e:{c:40,d:10}},L:"Sometimes the cheapest move is to find out."},

{id:"heat",r:1,a:"Quality",t:"Heat numbers don't match",x:"Anchor bolts arrive with certs that match the PO, but the heat numbers stamped on the bolts don't match the certs.",o:[
{t:"Accept them, the certs show the right grade",p:.4,g:"wrong",n:"A cert only proves the material it names.",ok:{x:"Turns out a clerical mix-up.",e:{}},no:{x:"The bolts are suspect items. Removal after installation.",e:{d:3,c:.5,r:-2}}},
{t:"Quarantine and raise an NCR",p:.95,g:"best",n:"Traceability broken means the bolts have none. Check other deliveries too.",ok:{x:"The supplier mixed lots. Replacements in a week. Two other deliveries checked.",e:{en:1,r:1}},no:{x:"The supplier fights it for three weeks.",e:{d:1}}},
{t:"Test a sample to confirm the material",p:.6,g:"weak",n:"Testing confirms chemistry, not traceability.",ok:{x:"Material is fine, but QA still won't accept it without an NCR.",e:{d:.5}},no:{x:"One sample fails.",e:{d:2}}}],
idle:{x:"The bolts were installed before anyone checked.",e:{d:3,c:.5,r:-1}},L:"Traceability is the evidence."},

{id:"wps",r:1,a:"Quality",t:"A weld procedure that doesn't cover it",x:"The piping sub wants to start welding the 60 mm thick headers. Their qualified procedure covers up to 38 mm. Qualifying a new one takes about three weeks.",o:[
{t:"Hold the thick joints, qualify the new procedure, keep welding everything in range",p:.85,g:"best",n:"Weld what's covered, qualify what isn't, and don't let the two blur.",ok:{x:"The new procedure is qualified in 19 days. The crew stayed busy on thinner joints the whole time.",e:{en:1,r:1,d:.5}},no:{x:"The first test coupon fails a bend test. Another ten days.",e:{d:1.5}}},
{t:"Let them start, it's the same process",p:.25,g:"wrong",n:"An unqualified procedure on a nuclear weld means every one of those welds is suspect.",ok:{x:"Nobody notices for now.",e:{}},no:{x:"The regulator's audit flags 40 welds made outside the qualified range. Cut out and redone.",e:{d:6,c:3,r:-3}}},
{t:"Ask engineering whether an evaluation can cover it",p:.6,g:"good",n:"Sometimes possible, but don't stake the schedule on it.",ok:{x:"Engineering confirms a supplementary qualification will be needed anyway, and starts it.",e:{en:1,d:.5}},no:{x:"Two weeks of debate, then the same answer.",e:{d:1.5}}}],
idle:{x:"Nobody stopped the sub. Welds outside the qualified range were found in an audit.",e:{d:4,c:2,r:-2}},L:"Qualification is the evidence."},

{id:"craneq",r:1,a:"Logistics",t:"Everyone wants the tower crane",x:"Four subs share one tower crane. Each says their picks are critical. The mechanical foreman threatened to walk off yesterday.",o:[
{t:"Run a 15-minute crane meeting every afternoon, ranked by critical path",p:.85,g:"best",n:"A shared resource needs a visible rule. The critical path is the rule.",ok:{x:"Within a week the arguing stops. Crane hours used rises from 61% to 83%.",e:{f:2,d:-1}},no:{x:"The meeting helps, but one sub keeps jumping the queue.",e:{f:1,d:-.3}}},
{t:"First come, first served",p:.4,g:"weak",n:"Fair to the subs, blind to the schedule.",ok:{x:"Works when the week is quiet.",e:{}},no:{x:"The critical steel waits two days behind a load of handrail.",e:{d:1.5}}},
{t:"Give the mechanical foreman what he wants to keep the peace",p:.4,g:"wrong",n:"Reward the loudest and you'll get more shouting.",ok:{x:"He calms down.",e:{f:-1}},no:{x:"Now three foremen threaten to walk.",e:{f:-3,d:1}}}],
idle:{x:"No rule was set. The crane went to whoever shouted.",e:{f:-2,d:1}},L:"Shared resources need a visible rule."},

{id:"co",r:1,a:"Commercial",t:"A $4.2M change order",x:"A design change moved a set of penetrations. The contractor's change order is $4.2M. Your estimator thinks $2.6M is fair.",o:[
{t:"Ask for an open-book breakdown and get an independent estimate",p:.8,g:"best",n:"Make the number visible on both sides, then argue about the parts, not the total.",ok:{x:"Their breakdown double-counts the crane. Settled at $2.9M in a week, and the relationship holds.",e:{c:2.9,b:1}},no:{x:"Three weeks of back and forth. Settled at $3.4M.",e:{c:3.4,d:.5}}},
{t:"Approve it to keep the job moving",p:1,g:"wrong",n:"Fast, and it teaches them every change is a payday.",ok:{x:"Approved. The next three change orders all come in high.",e:{c:6,b:-1}}},
{t:"Reject it and let them take it to dispute",p:.5,g:"weak",n:"Disputes cost more than the gap.",ok:{x:"They back down to $3M.",e:{c:3}},no:{x:"Dispute, slowdown, lawyers. $3.8M and two months of bad blood.",e:{c:4.5,d:2,f:-1}}}],
idle:{x:"The change order sat unanswered. The contractor slowed down while it did.",e:{c:3.8,d:1.5}},L:"Argue about the parts, not the total."},

{id:"embeds",r:1,a:"Procurement",t:"300 embed plates short",x:"The fabricator is 300 embed plates short. A local shop offers to make them in a week, but they've never supplied nuclear-grade material.",o:[
{t:"Pull the certified plates you have to critical areas and resequence the rest",p:.85,g:"best",n:"Spend scarce material on the critical path first.",ok:{x:"Critical walls keep moving. The certified fabricator catches up in five weeks.",e:{d:1,en:1}},no:{x:"Resequencing helps, but two walls still wait.",e:{d:2}}},
{t:"Use the local shop",p:.25,g:"wrong",n:"No quality program, no nuclear-grade plates.",ok:{x:"The plates are fine. QA never accepts them.",e:{d:2,c:.3}},no:{x:"The plates are cast into two walls. Regulator finding. Cored out.",e:{d:6,c:2,r:-3}}},
{t:"Wait for the certified fabricator",p:.9,g:"good",n:"Safe, slow.",ok:{x:"Five weeks of waiting on the affected walls.",e:{d:3}},no:{x:"Seven weeks.",e:{d:4}}}],
idle:{x:"The shortage hit the walls unannounced.",e:{d:4}},L:"Spend scarce material on the critical path."},

{id:"shift2",r:1,a:"People",t:"The second shift is slow",x:"Second shift installs about 40% less pipe per hour than days. Corporate wants to cut it.",o:[
{t:"Work a week of second shifts yourself and find out why",p:.85,g:"best",n:"Numbers say there's a gap. Only going there says why.",ok:{x:"Half the lighting towers are dead, the crane operator leaves at 9, and the material for nights is staged for days. Fixed in a week; nights hit 90% of days.",e:{f:2,d:-1.5,c:.2}},no:{x:"Lighting helps, but nights stay at 75%. Still worth keeping.",e:{f:1,d:-.5}}},
{t:"Cut the second shift",p:.8,g:"weak",n:"Cuts a cost and a lot of output.",ok:{x:"Payroll down. Progress down more.",e:{d:3,c:-1}},no:{x:"And the good night workers quit.",e:{d:4,c:-1,f:-2}}},
{t:"Tell the night foremen to hit the day numbers or else",p:.3,g:"wrong",n:"Pressure without a cause just finds shortcuts.",ok:{x:"Numbers rise. Rework rises faster.",e:{c:.5}},no:{x:"Two near-misses and a grievance.",e:{s:-2,f:-2}}}],
idle:{x:"Nothing changed. Corporate cut the shift anyway.",e:{d:3}},L:"Go see the shift."},

{id:"float",r:1,a:"Reporting",t:"Float that comes from nowhere",x:"Your schedule shows 30 days of float on the steam generator rooms. You dig in: someone typed a constraint date that hides the real logic.",o:[
{t:"Remove the constraint, rerun the logic and report the real float",p:.85,g:"best",n:"A schedule that hides its logic hides its risks.",ok:{x:"Real float is minus six days. Corporate is unhappy for an afternoon, then funds a recovery plan.",e:{b:1,w:-2,d:-1}},no:{x:"Corporate is unhappy for a week.",e:{b:-1,w:-2}}},
{t:"Report it as is, with a note",p:.6,g:"weak",n:"Footnotes don't get read.",ok:{x:"Nobody reads the note.",e:{}},no:{x:"The rooms go late. The note is found afterwards.",e:{b:-2,d:2}}},
{t:"Leave it, the scheduler knows what he's doing",p:.3,g:"wrong",n:"Typed-in dates are claims.",ok:{x:"The rooms happen to finish on time.",e:{}},no:{x:"The rooms are six weeks late with no warning.",e:{d:4,b:-2,w:2}}}],
idle:{x:"Nobody looked at the float.",e:{d:3,w:2}},L:"Float only counts if the logic is real."},

{id:"mockup",r:1,a:"Quality",t:"Build a mock-up?",x:"The first dome-to-wall rebar intersection is the most congested on the job. A full-scale mock-up costs $300k and three weeks.",o:[
{t:"Build the mock-up",p:.85,g:"best",n:"Practise the hard part where mistakes are cheap.",ok:{x:"The mock-up shows the couplers can't be tightened with the bars as drawn. Engineering adjusts. The real pour goes in clean.",e:{c:.3,d:-2,en:2}},no:{x:"Everything fits. Three weeks and $300k for confidence.",e:{c:.3,d:.5}}},
{t:"Skip it and work it out in place",p:.45,g:"weak",n:"In place, every mistake is permanent.",ok:{x:"The crew figures it out.",e:{}},no:{x:"The bars can't be placed as drawn. Three weeks of rework in place.",e:{d:3,c:1,en:-1}}},
{t:"Do a detailed 3D model review instead",p:.65,g:"good",n:"Catches clashes, not hands and wrenches.",ok:{x:"The model finds most of it.",e:{c:.05,en:1}},no:{x:"The model can't show the wrench swing.",e:{d:1.5}}}],
idle:{x:"No decision. The crew hit the congestion in the real wall.",e:{d:2.5,c:.8}},L:"Practise the hard part where mistakes are cheap."},

{id:"shelter",r:1,a:"People",t:"Minus 30 and no warm-up shelter",x:"The union steward says the warm-up shelters at the north end are too small and two have broken heaters. It's minus 30 with wind.",o:[
{t:"Fix it today: new heaters, two more shelters by Friday",p:.9,g:"best",n:"Cheap next to frostbite and a grievance.",ok:{x:"Shelters up by Thursday. The steward brings coffee to your next meeting.",e:{f:2,s:1,c:.15}},no:{x:"The heaters take a week to arrive. You rent temporary ones.",e:{f:1,c:.2}}},
{t:"Promise to look at it next budget cycle",p:.2,g:"wrong",n:"Cold is now. Budget is later.",ok:{x:"It warms up.",e:{f:-1}},no:{x:"Two frostbite cases and a work refusal.",e:{s:-2,f:-3,d:1}}},
{t:"Shorten work blocks to 45 minutes with more breaks",p:.75,g:"good",n:"Safe, but you lose a lot of output.",ok:{x:"Nobody gets cold. Progress slows.",e:{d:1,s:1}},no:{x:"Breaks in broken shelters don't help much.",e:{d:1,f:-1}}}],
idle:{x:"The steward filed a grievance.",e:{f:-2,s:-1}},L:"Look after the people doing the work."},

// ----- Area manager -----
{id:"greens",r:2,a:"Reporting",t:"All green, window eight months",x:"Your four leads report green, green, green, amber. The building's finish window is still eight months wide. Something doesn't add up.",o:[
{t:"Walk the building yourself this week",p:.7,g:"good",n:"Good instinct; it finds what you see, not the system's gaps.",ok:{x:"You find forty pipe spools waiting on supports that were never ordered.",e:{w:-4,f:1}},no:{x:"Everything you look at looks fine.",e:{}}},
{t:"Ask each lead to show what their green is based on",p:.85,g:"best",n:"A green that can't show its evidence is just a hope.",ok:{x:"Civil has evidence. Mechanical has a schedule. Electrical's green means \"no known blockers.\" The amber was right.",e:{w:-6,en:1}},no:{x:"Leads get defensive, but you learn enough.",e:{w:-3,f:-1}}},
{t:"Trust the reports and focus on the amber",p:.3,g:"wrong",n:"Reports are claims.",ok:{x:"The amber gets fixed.",e:{}},no:{x:"Three months later the greens turn red at once.",e:{d:8,w:4,b:-2}}}],
idle:{x:"Nobody questioned the greens. They turned red together three months later.",e:{d:6,w:3}},L:"Green only for verified constraints."},

{id:"trays",r:2,a:"Engineering",t:"One standard, a hundred clashes",x:"Jamal, your instrumentation lead, says the tray clashes aren't random. They all come from one routing standard applied to the whole building.",o:[
{t:"Take it to engineering yourself",p:.75,g:"good",n:"Works, but Jamal's work becomes your credit.",ok:{x:"Engineering revises the standard.",e:{en:1,w:-4}},no:{x:"Engineering wants Jamal's analysis anyway.",e:{w:-2}}},
{t:"Let Jamal take it to engineering, with your backing",p:.8,g:"best",n:"Bring the evidence and you get backed. Everyone watching learns that.",ok:{x:"The chief engineer says, \"He's right.\" One revision clears over a hundred clashes, including ones nobody found yet.",e:{en:2,f:1,w:-6}},no:{x:"Engineering pushes back for a month, then agrees.",e:{w:-3,d:1}}},
{t:"Fix the clashes one by one in the field",p:.5,g:"wrong",n:"Fixing symptoms forever.",ok:{x:"Forty fixed.",e:{c:1}},no:{x:"New clashes keep appearing.",e:{c:2,d:3}}}],
idle:{x:"Nobody took it forward. The clashes kept coming.",e:{c:1.5,d:2}},L:"When many problems look alike, look for the one cause."},

{id:"doug",r:2,a:"Safety",t:"Best numbers, three near-misses",x:"General foreman Doug's crews have the best production on the job and three near-misses this month. He says two were guys rushing crane hook-ups because the crane is booked tight.",o:[
{t:"Report the pattern to safety",p:.7,g:"good",n:"Correct, but it doesn't touch the crane pressure.",ok:{x:"An audit slows the hook-ups.",e:{s:1,f:-1}},no:{x:"The near-misses continue.",e:{s:-1}}},
{t:"Deal: a fixed crane window for real talks and no rushed hook-ups",p:.85,g:"best",n:"Fix the pressure behind the problem. You now own the promise.",ok:{x:"You find him two fixed hours and an hour of dead crane time for everyone. Zero near-misses for two months.",e:{s:2,f:2,d:-.5}},no:{x:"The window slips twice. Doug grumbles but holds.",e:{s:1}}},
{t:"Leave it, his numbers are good",p:.3,g:"wrong",n:"Production numbers that come with near-misses are borrowed.",ok:{x:"Nothing happens.",e:{}},no:{x:"A load drops near a crew.",e:{s:-3,d:2,r:-1}}}],
idle:{x:"Nobody acted. A fourth near-miss followed.",e:{s:-2}},L:"A deal makes you responsible for keeping it."},

{id:"falcons",r:2,a:"Environment",t:"Falcons on the tower crane",x:"Peregrine falcons, a protected species, nest on your main tower crane's counter-jib. Three eggs, eleven weeks to fledging. The crane is on the critical path.",o:[
{t:"Stop the crane for eleven weeks",p:1,g:"good",n:"Legally clean. Very expensive.",ok:{x:"Eleven weeks. The chicks fledge.",e:{d:8,c:3}}},
{t:"Run it slowly under a biologist's protocol, apply for a relocation permit, and bring comms in",p:.8,g:"best",n:"Legal, transparent, and a story you can tell.",ok:{x:"The permit is refused but your protocol becomes the model. A livestream gets 300,000 views. About nine days lost; all three chicks fledge.",e:{d:1.5,cm:3,r:1,f:1}},no:{x:"The female leaves for forty minutes in week two. You stop, she returns. Two extra weeks of stop-and-go.",e:{d:3,cm:2}}},
{t:"Quietly remove the nest",p:.3,g:"wrong",n:"A serious offence, and someone always has a phone.",ok:{x:"Nobody noticed. This time.",e:{}},no:{x:"A crane operator's video goes viral. Charges and headlines.",e:{cm:-4,r:-2,c:1}}}],
idle:{x:"No plan. The crane ran normally and the falcons abandoned the nest. The ministry opens a file.",e:{cm:-3,r:-1}},L:"Make the constraint public and it becomes an asset."},

{id:"mural",r:2,a:"Culture",t:"Overnight mural",x:"Someone painted a 60-metre mural on the pumphouse wall overnight, with real workers' faces. Unpermitted work at height. Everyone loves it. Safety is furious.",o:[
{t:"Investigate and find who did it",p:.6,g:"weak",n:"You'll find them, and the site will learn to hide things from you.",ok:{x:"Six people disciplined. The mural stays; the goodwill doesn't.",e:{f:-2,s:1}},no:{x:"Nobody talks.",e:{f:-2}}},
{t:"Amnesty if they explain how they did it, consent for every face, and a way to bring ideas first",p:.85,g:"best",n:"The amnesty gets the truth; the new idea process removes the reason to sneak.",ok:{x:"Six come forward. Proper rope access, a napkin rescue plan that's actually good. 21 of 22 workers consent; one face is repainted. Forty proposals arrive next year.",e:{f:3,cm:2,s:1}},no:{x:"They come forward. Their rigging was sketchier than hoped; you fix the process.",e:{f:2,s:-1}}},
{t:"Leave it and quietly tighten night security",p:.6,g:"weak",n:"Rewards the risk without learning anything.",ok:{x:"Nothing more happens.",e:{}},no:{x:"Next month someone paints the stair tower. At height. Alone.",e:{s:-2}}}],
idle:{x:"No response. The site took that as permission.",e:{s:-1}},L:"Give people a legitimate path and they stop sneaking."},

{id:"ghost",r:2,a:"Culture",t:"The fourth-floor ghost",x:"Night shift keeps seeing a man in old grey coveralls on the fourth floor at 3 am. Absenteeism is up 30%. Two crews refuse to work up there after midnight.",o:[
{t:"Write up anyone who refuses work without a safety reason",p:.3,g:"wrong",n:"Fear is a safety reason if people are scared at height.",ok:{x:"Grumbling stops.",e:{f:-2}},no:{x:"A grievance, and absenteeism climbs.",e:{f:-3,d:1}}},
{t:"Put cameras on the fourth floor and find out what's there",p:.9,g:"best",n:"Take it seriously and get evidence.",ok:{x:"It's Walter, a 64-year-old fire watch with nowhere to live, sleeping in the stair tower. You get him housing through the assistance program and argue to keep his job. Three more workers turn out to be living in trucks; a housing fund follows.",e:{f:3,cm:1,s:1}},no:{x:"Six quiet nights before you find him. Absenteeism keeps rising meanwhile.",e:{f:1,d:.5}}},
{t:"Hold a meeting and invite a chaplain to bless the building",p:.6,g:"weak",n:"Kind, but it doesn't find the person in the stair tower.",ok:{x:"Spirits lift for a while.",e:{f:1}},no:{x:"The sightings continue.",e:{d:.5}}}],
idle:{x:"Ignored. Night shift absenteeism kept climbing.",e:{d:1,f:-1}},L:"Behind a strange story there's usually a real person."},

{id:"frank",r:2,a:"Lifting",t:"A bully running the big lift",x:"Next week is the 300-tonne steam generator lift. Frank, your only superintendent who's done one this size, has been bullying an apprentice. The crew is afraid of him.",o:[
{t:"Protect the apprentice now, deal with Frank after the lift",p:.6,g:"weak",n:"Protects the person, not the lift. A scared crew hesitates when it matters.",ok:{x:"Clean lift. Investigation after; Frank retires.",e:{}},no:{x:"A rigger hesitates four seconds before calling stop. The load swings 30 cm toward containment. No contact.",e:{s:-2}}},
{t:"Pull Frank now and find another lead",p:.65,g:"good",n:"Removes the fear, adds inexperience.",ok:{x:"A lift specialist is brought in. Clean.",e:{c:.5,s:1}},no:{x:"The new lead is cautious; three days late.",e:{d:1,c:.5}}},
{t:"Keep Frank on rigging, bring in an independent lift director who owns the stop call, and tell the crew",p:.9,g:"best",n:"Keeps the experience and removes the fear from the one call that matters.",ok:{x:"The crew calls two stops without hesitation. Clean lift. The investigation runs after.",e:{s:2,f:2}},no:{x:"Frank bristles at sharing authority but the lift goes clean.",e:{s:1}}}],
idle:{x:"Nothing done. A rigger hesitated on a stop call during the lift.",e:{s:-2}},L:"A crew afraid of its leader hesitates at the worst moment."},

{id:"wrench",r:2,a:"Quality",t:"Maybe a wrench in the pipe",x:"2 am, days before filling the primary system. A contractor says he may have dropped a wrench into an open coolant pipe. His tool log shows nothing missing, but he didn't log every tool.",o:[
{t:"Stop and do a full foreign-material search",p:.95,g:"best",n:"Treat it as there until you prove otherwise.",ok:{x:"Four and a half days. On day three they find a 10 mm socket two metres further than any camera would reach.",e:{d:1,r:2,en:1}},no:{x:"Nothing found. Four days, and certainty.",e:{d:1,r:1}}},
{t:"Recount his toolbag against the log",p:.4,g:"wrong",n:"The log was incomplete, so a count against it proves nothing.",ok:{x:"Nothing was in there.",e:{}},no:{x:"A socket ends up in a pump impeller during flush.",e:{d:12,c:5,r:-3}}},
{t:"Quick camera look, close it if clear",p:.55,g:"weak",n:"A camera checks one pipe. Things travel.",ok:{x:"Clear, and truly clear.",e:{}},no:{x:"The camera misses a socket further down.",e:{d:10,c:4,r:-2}}}],
idle:{x:"The report sat until morning and the line was closed up.",e:{d:8,c:3,r:-2}},L:"If you can't open it later, prove it's clean now."},

{id:"turnover",r:2,a:"Operations",t:"Commissioning wants the rooms now",x:"Commissioning wants the auxiliary building handed over this month so they can start testing. Construction still has 2,100 open punch items in there.",o:[
{t:"Hand over system by system, with a joint walk-down and a signed punch list for each",p:.85,g:"best",n:"Turnover is a boundary. Draw it clearly, one system at a time.",ok:{x:"Eleven systems turned over in six weeks. Both teams know exactly who owns which valve.",e:{d:-2,en:1,f:1}},no:{x:"Slower than commissioning wanted, but clean.",e:{d:-.5,b:-1}}},
{t:"Hand over the whole building",p:.35,g:"wrong",n:"Two teams working the same equipment with no boundary is how things get energized with people inside.",ok:{x:"It goes surprisingly smoothly.",e:{d:-2}},no:{x:"Commissioning energizes a pump while a fitter is still working on it. A near-miss, and a three-week stand-down.",e:{s:-3,d:3,r:-1}}},
{t:"Refuse until construction is complete",p:.8,g:"weak",n:"Clean, and it wastes months of commissioning time.",ok:{x:"Construction finishes. Commissioning starts late.",e:{d:3}},no:{x:"The punch list grows instead of shrinking.",e:{d:4,b:-1}}}],
idle:{x:"Nobody decided. Commissioning started anyway, room by room, with no boundary.",e:{s:-2,d:1}},L:"Draw the boundary one system at a time."},

{id:"feud",r:2,a:"People",t:"Two leads who won't talk",x:"Your mechanical and electrical leads haven't spoken in a month. Their crews are now fighting over the same cable trays and hangers.",o:[
{t:"Walk the building with both of them every Monday until they're solving it themselves",p:.8,g:"best",n:"People who walk the same problem stop arguing about it.",ok:{x:"Week three, they start finishing each other's sentences about hanger loads. Week six, they walk it without you.",e:{f:2,d:-1}},no:{x:"It's slow, but the crews stop fighting.",e:{f:1}}},
{t:"Separate their work areas",p:.6,g:"weak",n:"Hides the problem until they meet again.",ok:{x:"Calm for a while.",e:{}},no:{x:"They meet again at the tray risers.",e:{d:1.5,f:-1}}},
{t:"Back the one with the stronger case",p:.4,g:"wrong",n:"You'll have one ally and one enemy.",ok:{x:"Mechanical wins. Electrical gets quiet.",e:{f:-1}},no:{x:"The electrical lead quits.",e:{f:-2,w:2}}}],
idle:{x:"The feud kept running through their crews.",e:{f:-2,d:1}},L:"Put people in front of the same problem."},

{id:"rework",r:2,a:"Quality",t:"Rework at 9 percent",x:"Rework hours have climbed from 3% to 9% in two months. Production is pushing to make up the time.",o:[
{t:"Sort the rework by cause and go after the top two",p:.85,g:"best",n:"Rework isn't evenly spread. Find where it piles up.",ok:{x:"62% comes from one drawing revision that never reached the field and one torque wrench out of calibration. Fixed in a week. Rework falls to 4%.",e:{c:-.5,d:-2,en:1}},no:{x:"The causes are scattered. It takes two months to come down.",e:{d:-.5}}},
{t:"Add more QC inspectors",p:.6,g:"good",n:"Catches more, fixes less.",ok:{x:"Rework is found sooner.",e:{c:.4}},no:{x:"More found, same made.",e:{c:.6,d:1}}},
{t:"Push harder on production to make up time",p:.3,g:"wrong",n:"Speeding up a process that makes defects makes more defects.",ok:{x:"Production rises a little.",e:{}},no:{x:"Rework hits 14%.",e:{d:3,c:1.5}}}],
idle:{x:"Nobody looked at the rework. It kept climbing.",e:{d:2,c:1}},L:"Find where the problems pile up."},

{id:"video",r:2,a:"Comms",t:"A near-miss on social media",x:"A labourer posts a phone video of a load swinging over a walkway. It has 40,000 views. Corporate comms wants him disciplined.",o:[
{t:"Thank him, use the video in a site-wide stand-down, and ask him to bring the next one to you first",p:.85,g:"best",n:"Punish the person who showed you the hazard and you won't see the next one.",ok:{x:"The stand-down changes the walkway rules. He brings you two more things that month. Comms comes round.",e:{s:2,f:2,cm:1}},no:{x:"The press picks it up anyway. You have a good answer.",e:{s:2,cm:-1}}},
{t:"Discipline him for posting",p:.6,g:"wrong",n:"The lesson everyone learns: hide it.",ok:{x:"The video comes down.",e:{f:-3}},no:{x:"\"Worker Punished For Exposing Safety Risk.\"",e:{f:-3,cm:-3}}},
{t:"Ask him to delete it, no discipline",p:.7,g:"weak",n:"Better, but you still haven't fixed the walkway.",ok:{x:"It comes down.",e:{}},no:{x:"Screenshots are forever.",e:{cm:-1}}}],
idle:{x:"Corporate disciplined him while you were busy.",e:{f:-2,cm:-1}},L:"Thank the person who shows you the hazard."},

{id:"fatigue",r:2,a:"Safety",t:"Twenty-one days straight",x:"Crews on the reactor building have worked 21 days in a row to recover schedule. The recovery plan says 14 more.",o:[
{t:"Rotate a mandatory day off every 7 days, and add a crew to keep the pace",p:.8,g:"best",n:"Tired crews make mistakes that cost more than the day off.",ok:{x:"Output per hour climbs 15% after the first rest day. The recovery holds.",e:{s:2,f:2,c:.6}},no:{x:"The new crew is slow to start. Two days lost.",e:{s:1,f:1,c:.6,d:.5}}},
{t:"Keep going, it's only two more weeks",p:.3,g:"wrong",n:"Week four of no days off is when the hand goes where it shouldn't.",ok:{x:"Done on schedule, everyone exhausted.",e:{f:-2}},no:{x:"A rigger catches his hand in a pinch point. Lost-time injury.",e:{s:-3,f:-2,d:2,r:-1}}},
{t:"Cap it at 14 days and accept the slip",p:.85,g:"good",n:"Safe, but you didn't solve the schedule.",ok:{x:"Rested crews, two weeks late.",e:{d:2,s:1}},no:{x:"Three weeks late.",e:{d:3}}}],
idle:{x:"The schedule ran on. Fatigue did what fatigue does.",e:{s:-2,f:-1}},L:"Rest is part of the schedule."},

{id:"vendor",r:2,a:"Engineering",t:"\"Everybody skips that step\"",x:"The pump vendor's rep says the hot alignment check in the procedure is unnecessary. \"Everybody skips it.\" It adds two days.",o:[
{t:"Follow the procedure unless the vendor gives a written, engineering-approved deviation",p:.9,g:"best",n:"If it's truly unnecessary, it can be written down and signed.",ok:{x:"The vendor won't put it in writing. The hot alignment finds the coupling 0.4 mm out. Fixed before it ever runs.",e:{en:2,r:1,d:.3}},no:{x:"Alignment is fine. Two days, and an honest record.",e:{d:.3,en:1}}},
{t:"Skip it, the vendor knows the pump",p:.4,g:"wrong",n:"\"Everybody does it\" is how steps disappear.",ok:{x:"Pump runs fine.",e:{}},no:{x:"Bearing failure at 300 hours. Pump out for six weeks.",e:{d:5,c:1.5,r:-1}}},
{t:"Do a quick cold check instead",p:.6,g:"weak",n:"Cold isn't hot. That's why the step exists.",ok:{x:"Cold numbers look fine.",e:{}},no:{x:"It grows out of alignment at temperature.",e:{d:3,c:.8}}}],
idle:{x:"The rep did it his way.",e:{d:2,c:.5}},L:"If a step can be skipped, someone can sign for it."},

{id:"lessons",r:2,a:"Culture",t:"A lessons-learned database nobody reads",x:"There are 4,000 lessons learned in the database from the last three nuclear builds. Your supers have never opened it.",o:[
{t:"Pick one lesson for each day's pre-job brief, matched to that day's work",p:.85,g:"best",n:"A lesson lands when it arrives on the day you need it.",ok:{x:"Day 11's lesson is about rebar couplers left uncapped. That afternoon a foreman caps a whole row before concrete.",e:{en:1,f:1,s:1,w:-2}},no:{x:"Some days the match is loose. It still sticks.",e:{f:1}}},
{t:"Make reading it mandatory",p:.5,g:"weak",n:"Mandatory reading is skimmed reading.",ok:{x:"People click through.",e:{}},no:{x:"People resent it.",e:{f:-1}}},
{t:"Let it go, experience will do",p:.4,g:"wrong",n:"Experience you could have borrowed is the expensive kind.",ok:{x:"Nothing happens.",e:{}},no:{x:"You repeat a known mistake from the last build: dome bars left uncapped and full of concrete.",e:{d:2,c:.5}}}],
idle:{x:"The database stayed unread. An old mistake came back.",e:{d:1.5,c:.4}},L:"Deliver the lesson on the day it's needed."},

{id:"strike",r:2,a:"Procurement",t:"The concrete drivers may strike",x:"The batch plant's truck drivers may strike in two weeks. You have three critical pours in the next month.",o:[
{t:"Pull the critical pours forward and line up a mobile on-site batch plant as a backup",p:.8,g:"best",n:"Move what you can, and have a plan for what you can't.",ok:{x:"Two pours go in before the strike. The third is batched on site. The strike lasts nine days.",e:{c:.6,d:-1,b:1}},no:{x:"The strike is called off. The backup plant cost money for nothing. Still right.",e:{c:.6}}},
{t:"Wait and see",p:.4,g:"wrong",n:"A strike date is a known constraint.",ok:{x:"No strike.",e:{}},no:{x:"Nine days of no concrete on the critical path.",e:{d:3,c:.5}}},
{t:"Line up a second batch plant across the county",p:.65,g:"good",n:"Helps, if their trucks aren't the same union.",ok:{x:"They cover two of the three pours.",e:{c:.3,d:.5}},no:{x:"Same union. Same strike.",e:{d:2.5}}}],
idle:{x:"Nobody planned for the strike.",e:{d:3}},L:"A known date is a constraint, not a surprise."},

// ----- Construction director -----
{id:"fuelpr",r:3,a:"Comms",t:"Announce a fuel load date",x:"Corporate wants a public fuel load date next month. Your window is nine months wide.",o:[
{t:"Announce the early edge, corporate wants confidence",p:.15,g:"wrong",n:"A date you know is unlikely is a debt you pay in public.",ok:{x:"You hit it. Remarkable.",e:{b:3,cm:2}},no:{x:"A pump supplier fails qualification and the date's gone. Public slip, brutal press.",e:{cm:-4,b:-2,r:-1}}},
{t:"Announce a range, not a date",p:.75,g:"good",n:"Accurate, and harder to sell.",ok:{x:"Press calls it vague, then forgets.",e:{cm:1}},no:{x:"Headlines read the range as trouble.",e:{cm:-1}}},
{t:"Hold off until the window narrows, then announce a date you'd bet on",p:.85,g:"best",n:"Certainty earns the right to make promises.",ok:{x:"Four months later the window is ten weeks. You announce the late edge at 85% confidence and beat it by three days.",e:{b:2,cm:2,r:1}},no:{x:"Board members call it weakness for a while.",e:{b:-1}}}],
idle:{x:"Corporate announced the early edge without you.",e:{cm:-2}},L:"Make promises once the fog's gone."},

{id:"welder",r:3,a:"Regulator",t:"A backdated record",x:"Your only certified nuclear-class welder on shift admits he backdated an inspection record last month. The weld is fine. Fuel load is six weeks out.",o:[
{t:"Report it and lose him during the investigation",p:.8,g:"good",n:"By the book.",ok:{x:"Clean report. A replacement is found in five weeks.",e:{r:1,d:2}},no:{x:"No replacement. Six weeks lost.",e:{d:6,r:1}}},
{t:"Have him re-document it and keep it in-house",p:.4,g:"wrong",n:"Keeping a falsified nuclear record in-house is a cover-up.",ok:{x:"Nobody finds out.",e:{}},no:{x:"An audit finds it. Now it's two falsifications and a cover-up.",e:{r:-5,d:12,b:-3}}},
