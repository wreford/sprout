let AC=null;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();

function ding(){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),t0=AC.currentTime;
  o.type="sine";o.frequency.value=988;
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(0.05,t0+0.015);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.4);
  o.connect(v);v.connect(AC.destination);o.start(t0);o.stop(t0+0.45);
}
function buzz(){
  if(!AC)return;
  const o=AC.createOscillator(),v=AC.createGain(),t0=AC.currentTime;
  o.type="square";o.frequency.value=140;
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(0.03,t0+0.02);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);
  o.connect(v);v.connect(AC.destination);o.start(t0);o.stop(t0+0.33);
}
function whoosh(){
  if(!AC)return;
  const b=AC.createBuffer(1,6000,AC.sampleRate),d=b.getChannelData(0);
  for(let j=0;j<6000;j++)d[j]=(Math.random()*2-1)*(j/6000)*(1-j/6000)*2;

  const v=AC.createGain();v.gain.value=0.12;

}

/* ---------- state ---------- */
const COURSE=10;
let state="title",qIdx=0,score=0,cur=null,locked=false,deck=[];
function renderSegs(){
  const sb=$("segs");sb.innerHTML="";
  for(let i=1;i<=COURSE;i++){
    const d=document.createElement("div");
    if(i<qIdx)d.className="done";
    else if(i===qIdx)d.className="now";
    sb.appendChild(d);
  }
}
function startBinge(){
  audio();
  deck=shuffle(FACTS.slice()).slice(0,COURSE);
  qIdx=0;score=0;
  state="q";
  $("splash").classList.add("off");
  $("endOv").classList.remove("on");
  nextQ();
}
function nextQ(){
  if(qIdx>=COURSE){endBinge();return;}
  cur=deck[qIdx];
  qIdx++;locked=false;state="q";
  renderSegs();
  whoosh();
  $("bottom").classList.remove("ans");
  $("vidTitle").textContent=cur.title+pick(SUFF);
  $("views").textContent="👁 "+(ri(2,99)/10).toFixed(1)+(rnd()<0.5?"M":"K")+" views · "+ri(1,23)+"h ago";
  $("factTxt").innerHTML=cur.fact;
  $("qTxt").textContent=cur.q;
  $("lily").classList.remove("on");
  $("nextBtn").classList.remove("on");
  const box=$("choices");box.innerHTML="";
  shuffle(cur.ch.slice()).forEach(c=>{
    const b=document.createElement("button");
    b.textContent=c;
    b.onclick=()=>answer(b,c);
    box.appendChild(b);
  });
  $("comCt").textContent=ri(12,480);
}
function answer(btn,choice){
  if(locked||state!=="q")return;
  locked=true;state="answered";audio();
  $("bottom").classList.add("ans");
  const good=choice===cur.ans;
  [...$("choices").children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===cur.ans)b.classList.add("good");
    else if(b===btn&&!good)b.classList.add("bad");
  });
  if(good){
    score++;SV.brains++;save();
    $("brainCt").textContent=SV.brains;
    $("lilyTxt").textContent="Lily: "+pick(LILY.right)+"  "+cur.why;
    ding();
    try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
  }else{
    $("lilyTxt").textContent="Lily: "+pick(LILY.wrong)+"  "+cur.why;
    buzz();
    try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
  }
  $("lily").classList.add("on");
  $("nextBtn").classList.add("on");
}
$("nextBtn").onclick=()=>{audio();if(state==="answered")nextQ();};
let swipeY=null;
$("stage").addEventListener("pointerdown",e=>{swipeY=e.clientY;});
$("stage").addEventListener("pointerup",e=>{
  if(swipeY!==null&&swipeY-e.clientY>55&&state==="answered")nextQ();
  swipeY=null;
});
function endBinge(){
  state="end";
  SV.binges++;
  if(score>SV.best)SV.best=score;
  save();
  let em,ttl;
  if(score===10){em="🐐";ttl="CERTIFIED LAB GOAT";}
  else if(score>=8){em="🧠";ttl="BIG BRAIN ENERGY";}
  else if(score>=6){em="🥼";ttl="LAB ASSISTANT";}
  else{em="🧪";ttl="TEST SUBJECT";}
  $("endEm").textContent=em;
  $("endTitle").textContent=ttl;
  $("endScore").textContent=score+" / "+COURSE;
  $("endBrains").textContent="🧠 "+score;
  $("endBest").textContent=SV.best+" / "+COURSE;
  $("endQuip").textContent="Lily: "+pick(score===10?LILY.end10:score>=6?LILY.endMid:LILY.endLow);
  $("endOv").classList.add("on");
}
$("sGo").onclick=startBinge;
$("againBtn").onclick=startBinge;
function renderBarn(){
  $("sBarn").innerHTML="🧠 "+SV.brains+" facts nailed · "+SV.binges+" binges"+
    (SV.best?(" · best "+SV.best+"/10"):"");
  $("likeCt").textContent=SV.likes>=1000?(SV.likes/1000).toFixed(1)+"K":SV.likes;
  $("brainCt").textContent=SV.brains;
  if(SV.subbed){$("subBtn").textContent="SUBSCRIBED ✓";$("subBtn").classList.add("sub");}
}

/* ---------- the "gif" engine ---------- */
const cv=$("scene"),g=cv.getContext("2d");
let W=0,H=0;
function size(){
  const r=cv.getBoundingClientRect();
  const d=Math.min(devicePixelRatio||1,2);
  W=r.width;H=r.height;
  cv.width=W*d;cv.height=H*d;
  g.setTransform(d,0,0,d,0,0);
}
size();addEventListener("resize",size);
function T(x,y,txt,col,sz,bold){
  g.fillStyle=col||"#fff";
  g.font=(bold?"700 ":"500 ")+(sz||14)+"px Quicksand,sans-serif";
  g.textAlign="center";
  g.fillText(txt,x,y);
}

diamond(t){
  g.fillStyle="#3a5a9a";
  g.beginPath();g.arc(0,70,90,Math.PI,6.29);g.fill();
  g.fillStyle="rgba(122,216,240,0.2)";
  g.beginPath();g.arc(0,70,90,Math.PI,6.29);g.fill();
  for(let i=0;i<7;i++){
    const dy=((t*44+i*47)%150)-90;
    const dx=-80+i*27;
    g.save();g.translate(dx,dy);g.rotate(t+i);
    g.fillStyle="rgba(200,240,255,0.9)";
    g.beginPath();g.moveTo(0,-7);g.lineTo(6,0);g.lineTo(0,9);g.lineTo(-6,0);g.closePath();g.fill();
    g.strokeStyle="#fff";g.lineWidth=1;g.stroke();
    g.restore();
  }
  T(-60,-70,"✨",null,14);T(60,-50,"✨",null,12);
  T(0,100,"forecast: 100% chance of diamonds","#b9a8de",13,true);
},
bones(t){
  const ph=(t%LOOP)/LOOP;
  const n=Math.round(300-94*Math.min(1,ph*1.4));
  const gap=Math.max(0,14-ph*20);
  g.save();g.translate(-44,0);
  g.fillStyle="#f0ead8";
  [[0,-gap],[0,gap]].forEach(p=>{
    g.save();g.translate(p[0],p[1]);
    g.fillRect(-6,-16,12,32);
    g.beginPath();g.arc(-6,-16,6,0,6.29);g.arc(6,-16,6,0,6.29);
    g.arc(-6,16,6,0,6.29);g.arc(6,16,6,0,6.29);g.fill();
    g.restore();
  });
  g.restore();
  T(-44,66,gap<1?"fused!":"fusing…","#8fe08a",11,true);
  T(40,-30,"bones:","#b9a8de",13);
  T(40,8,String(n),"#ffd95e",40,true);
  T(40,34,"baby: 300 → adult: 206","#b9a8de",11);
  T(0,100,"you fused yourself together","#b9a8de",13,true);
},
mpemba(t){
  g.strokeStyle="#9ad8f0";g.lineWidth=3;
  g.strokeRect(-110,-60,220,120);
  T(0,-70,"FREEZER","#9ad8f0",11,true);
  const ph=(t%LOOP)/LOOP;
  [[-50,"#ff5a4a","HOT"],[50,"#5a9af0","COLD"]].forEach((c,i)=>{
    g.fillStyle=c[1];
    g.fillRect(c[0]-22,-10,44,40);
    g.fillStyle="rgba(255,255,255,0.25)";
    g.fillRect(c[0]-22,-10,44,8);
    T(c[0],46,c[2],"#b9a8de",11,true);
    if(i===0){
      if(ph<0.5){
        g.strokeStyle="rgba(255,255,255,0.6)";g.lineWidth=2;
        for(let s=0;s<3;s++){
          const sy=-14-s*8-Math.sin(t*4+s)*3;
          g.beginPath();g.moveTo(c[0]-10+s*10,sy+6);g.quadraticCurveTo(c[0]-6+s*10,sy,c[0]-10+s*10,sy-6);g.stroke();
        }
      }else{
        T(c[0],-20,"❄️",null,18);
        T(c[0]+26,-34,"?!","#ffd95e",16,true);
      }
    }
  });
  T(0,100,"hot can freeze first — Mpemba effect","#b9a8de",13,true);
},
goat(t){

eiffel(t){
  const grow=Math.abs(Math.sin(t*0.8))*14;
  g.fillStyle="#ffd95e";
  g.beginPath();g.arc(70,-66,16,0,6.29);g.fill();
  g.strokeStyle="rgba(255,217,94,0.5)";g.lineWidth=2;
  for(let i=0;i<8;i++){
    const a=t*0.4+i*0.785;
    g.beginPath();g.moveTo(70+Math.cos(a)*20,-66+Math.sin(a)*20);
    g.lineTo(70+Math.cos(a)*26,-66+Math.sin(a)*26);g.stroke();
  }
  g.save();g.translate(-20,60);
  g.scale(1,1+grow/120);
  g.strokeStyle="#8a7a6a";g.lineWidth=5;g.lineJoin="round";
  g.beginPath();
  g.moveTo(-44,0);g.quadraticCurveTo(-8,-66,0,-120);
  g.moveTo(44,0);g.quadraticCurveTo(8,-66,0,-120);
  g.stroke();
  g.lineWidth=3;
  g.beginPath();g.moveTo(-30,-30);g.lineTo(30,-30);g.stroke();
  g.beginPath();g.moveTo(-18,-66);g.lineTo(18,-66);g.stroke();
  g.restore();
  T(40,30,"+"+(grow).toFixed(1)+" cm","#8fe08a",13,true);
  T(0,100,"iron expands in the heat","#b9a8de",13,true);
},

  g.fillStyle="#e86a3a";

};
function draw(t){
  g.clearRect(0,0,W,H);
  g.fillStyle="#141418";
  g.fillRect(0,0,W,H);
  const cy=H*0.27;
  const grd=g.createRadialGradient(W/2,cy,30,W/2,cy,H*0.45);
  grd.addColorStop(0,"rgba(60,60,90,0.5)");
  grd.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=grd;
  g.fillRect(0,0,W,H);
  const key=state==="title"?"octo":(cur?cur.k:"octo");
  const fn=GIFS[key];
  g.save();
  g.translate(W/2,cy);
  const sc=Math.min(W/360,1.15);
  g.scale(sc,sc);
  try{fn(t);}catch(e){}
  g.restore();
  // GIF badge + loop bar
  const bx=W/2-150*sc,by=cy-125*sc;
  g.fillStyle="rgba(255,255,255,0.92)";
  g.beginPath();g.roundRect?g.roundRect(bx,by,38,20,5):g.rect(bx,by,38,20);g.fill();
  g.fillStyle="#141418";g.font="700 11px Quicksand,sans-serif";g.textAlign="center";
  g.fillText("GIF",bx+19,by+14);
  const lw=300*sc,lx=W/2-lw/2,ly=cy+132*sc;
  g.fillStyle="rgba(255,255,255,0.18)";
  g.fillRect(lx,ly,lw,3);
  g.fillStyle="rgba(255,255,255,0.75)";
  g.fillRect(lx,ly,lw*((t%LOOP)/LOOP),3);
}
let last=performance.now();
function loop(now){
  draw(now/1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function renderSegsInit(){renderSegs();}
renderSegsInit();
document.addEventListener("visibilitychange",()=>{
  try{if(!AC)return;document.hidden?AC.suspend():AC.resume();}catch(e){}
});

window.ST={
  get state(){return state;},get cur(){return cur;},get score(){return score;},
  get qIdx(){return qIdx;},get SV(){return SV;},get FACTS(){return FACTS;},
  get GIFS(){return GIFS;},
  startBinge,next(){if(state==="answered")nextQ();},
  setFact(k){cur=FACTS.find(f=>f.k===k)||cur;},
  answerRight(){const b=[...$("choices").children].find(x=>x.textContent===cur.ans);b.click();},
  answerWrong(){const b=[...$("choices").children].find(x=>x.textContent!==cur.ans);b.click();},
};
