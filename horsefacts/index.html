<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a1f18">
<meta name="description" content="Lily's Horse Facts — the only peer-reviewed horse presentation. The peer is a horse.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23fdf6e3'/%3E%3Cpath d='M8 24 q0 -10 8 -10 q4 0 5 -4 l2 -4 l4 3 l-3 5 q-1 3 -4 4 l0 6 z' fill='%23a9744f' stroke='%233a2e26' stroke-width='1.6'/%3E%3Ccircle cx='24' cy='11' r='1.2' fill='%233a2e26'/%3E%3C/svg%3E">
<title>Lily's Horse Facts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --barn:#2a1f18; --paper:#fdf6e3; --ink:#3a2e26;
  --red:#b3402e; --hay:#f2c14e; --sky:#7fb5d5; --grass:#7fae5e; --brown:#a9744f; --pink:#e88ca6;
  --disp:'Sora',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--barn);color:var(--paper);font-family:var(--disp);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0;bottom:92px;display:flex;align-items:center;justify-content:center}
#comp{
  position:relative;overflow:hidden;background:var(--paper);color:var(--ink);
  height:min(100%, calc(100vw * 16 / 9));aspect-ratio:9/16;
  border-radius:14px;box-shadow:0 40px 90px -30px rgba(0,0,0,.85)
}
.el{position:absolute;will-change:transform,opacity}
.kick{font-family:var(--mono);font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.stamp{
  font-family:var(--mono);font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  border:.3em solid currentColor;border-radius:.5em;padding:.35em .7em;background:var(--paper)
}

#photoLayer{position:absolute;left:0;right:0;top:27%;height:46%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.polaroid{
  background:#fff;padding:2.5em 2.5em 1em;border-radius:.8em;position:relative;
  box-shadow:0 2em 4em rgba(58,46,38,.35);transform:rotate(-2.5deg);
  animation:photoIn .6s cubic-bezier(.34,1.56,.64,1) both;max-width:82%
}
.polaroid::before,.polaroid::after{
  content:"";position:absolute;top:-1.4em;width:9em;height:3.4em;border-radius:.3em;
  background:rgba(242,193,78,.55);box-shadow:0 .2em .6em rgba(58,46,38,.15)
}
.polaroid::before{left:12%;transform:rotate(-8deg)}
.polaroid::after{right:12%;transform:rotate(6deg)}
.polaroid .imgwrap{overflow:hidden;border-radius:.4em;aspect-ratio:1/1;background:#f1e7cf;display:flex;align-items:center;justify-content:center}
.polaroid img{display:block;max-width:100%;max-height:100%;object-fit:contain;background:transparent;animation:kenburns 10s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.03)}}
.polaroid .cap{font-family:var(--mono);font-weight:700;font-size:2.1em;color:#6b5a4e;text-align:center;padding:.5em .2em .3em;letter-spacing:.06em}
@keyframes photoIn{0%{transform:rotate(-10deg) scale(.3) translateY(8em);opacity:0}100%{transform:rotate(-2.5deg) scale(1) translateY(0);opacity:1}}
@keyframes noPhotoIn{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.nophoto{
  display:flex;flex-direction:column;align-items:center;gap:1em;text-align:center;
  animation:noPhotoIn .4s ease both
}
.nophoto .k{font-family:var(--mono);font-weight:700;font-size:2.2em;color:#6b5a4e;max-width:26em;line-height:1.5}

#bar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;height:92px;
  padding:10px 16px calc(env(safe-area-inset-bottom) + 8px);
  display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(0deg,rgba(20,14,10,.96),rgba(20,14,10,.7))
}
#scrub{position:relative;height:22px;cursor:pointer}
#scrub .track{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:rgba(253,246,227,.2)}
#scrub .fill{position:absolute;left:0;top:9px;height:4px;border-radius:4px;background:var(--hay);width:0}
#scrub .mark{position:absolute;top:7px;width:2px;height:8px;background:rgba(253,246,227,.45)}
#scrub .knob{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:var(--hay);box-shadow:0 2px 8px rgba(0,0,0,.5);margin-left:-8px}
#bar .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#bar .btns{display:flex;gap:8px}
#bar button{
  min-width:44px;height:38px;padding:0 14px;border-radius:100px;cursor:pointer;
  background:rgba(253,246,227,.1);border:1.5px solid rgba(253,246,227,.25);color:var(--paper);
  font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase
}
#bar button.play{background:var(--hay);color:var(--barn);border-color:transparent;min-width:78px}
#bar .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:rgba(253,246,227,.6);font-weight:700;text-transform:uppercase;text-align:right}
#tapstart{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:rgba(20,14,10,.88);backdrop-filter:blur(8px);cursor:pointer;text-align:center;padding:24px
}
#tapstart.hide{display:none}
#tapstart .k{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--hay);font-weight:800;text-transform:uppercase}
#tapstart h1{font-size:clamp(34px,9vw,60px);font-weight:900;letter-spacing:-.02em;line-height:.95;text-transform:uppercase}
#tapstart h1 .h{color:var(--hay)} #tapstart h1 .r{color:#ff8d73}
#tapstart .big{
  padding:18px 36px;border-radius:14px;background:var(--hay);color:var(--barn);border:none;cursor:pointer;
  font-family:var(--disp);font-weight:900;font-size:16px;letter-spacing:.05em;text-transform:uppercase;min-height:58px;
  box-shadow:0 18px 40px -10px rgba(242,193,78,.5)
}
#tapstart .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:rgba(253,246,227,.55);font-weight:700;text-transform:uppercase;line-height:2}
</style>
</head>
<body>
<div id="stage"><div id="comp"><div id="photoLayer"></div></div></div>

<div id="bar">
  <div id="scrub"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
  <div class="row">
    <div class="btns">
      <button id="bPrev">Prev</button>
      <button id="bPlay" class="play">Pause</button>
      <button id="bNext">Next</button>
      <button id="bMusic">♫ On</button>
    </div>
    <div class="lbl" id="sceneLbl"></div>
  </div>
</div>

<div id="tapstart">
  <span class="k">A peer-reviewed presentation · the peer is a horse</span>
  <h1>Lily's<br><span class="h">Horse</span> <span class="r">Facts</span></h1>
  <button class="big">Start the facts</button>
  <span class="sub">28 slides · real wikipedia evidence · one (1) horse<br>space pauses · arrows skip</span>
</div>

<script>
'use strict';

const FPS = 30;
const comp = document.getElementById('comp');
const photoLayer = document.getElementById('photoLayer');

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function interp(f, [f0, f1], [v0, v1], ease){
  const t = clamp((f - f0) / (f1 - f0), 0, 1);
  return v0 + (v1 - v0) * (ease ? ease(t) : t);
}
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
function spring(f, delay = 0, stiffness = .55){
  const t = clamp((f - delay) / (FPS * .9), 0, 1);
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  return 1 - Math.pow(1 - t, 2) * Math.cos(t * Math.PI * 2.2 * stiffness);
}
const pop = (f, d) => `scale(${spring(f, d)})`;
const slamY = (f, d, from = -300) => `translateY(${interp(spring(f, d), [0, 1], [from, 0])}px)`;
const slamX = (f, d, from = -600) => `translateX(${interp(spring(f, d), [0, 1], [from, 0])}px)`;
const fade = (f, a, b) => clamp(interp(f, [a, b], [0, 1]), 0, 1);
function el(html, style){ return `<div class="el" style="${style}">${html}</div>`; }
const S = (obj) => Object.entries(obj).map(([k, v]) => `${k}:${v}`).join(';');

function sizeComp(){ comp.style.fontSize = (comp.clientWidth / 100) + 'px'; }
addEventListener('resize', sizeComp);

function HORSE(f, o = {}){
  const gait = o.gait || 'trot';
  const P = {
    gallop: { spd: 2.6, swing: 40, knee: 40, lift: 15, bob: 10, mane: 6 },
    trot:   { spd: 3.6, swing: 26, knee: 26, lift: 9,  bob: 6,  mane: 7 },
    prance: { spd: 4.4, swing: 15, knee: 54, lift: 12, bob: 6,  mane: 6 },
    idle:   { spd: 11,  swing: 4,  knee: 8,  lift: 1,  bob: 2,  mane: 11 },
    eat:    { spd: 11,  swing: 3,  knee: 6,  lift: 1,  bob: 1.5, mane: 11 },
  }[gait];
  const t = f / P.spd;
  const step = t * 2;
  const bob = Math.abs(Math.sin(step)) * P.bob;
  const sway = (gait === 'gallop' || gait === 'prance') ? Math.sin(step) * 2.2 : 0;
  const blink = Math.sin(f / 13) < -.92;
  const headDip = gait === 'eat' ? 24 + Math.sin(f / 6) * 5 : (gait === 'prance' ? -7 : 0);
  const earFlick = Math.sin(f / 19) > .9 ? -15 : 0;
  const coat = '#b57c50', coatD = '#8c5c39', coatL = '#cf9a6d', mane = '#59392320', maneC = '#5b3c25', hoof = '#2c241e', out = '#3a2e26';
  const U = 28, Lg = 30;
  const D2R = Math.PI / 180;
  
  function limb(hx, hy, ph, hind, shade){
    const th1 = (P.swing * Math.sin(ph)) * D2R;
    const lift = Math.max(0, Math.sin(ph + (hind ? 2.5 : 0.7)));
    const th2 = (hind ? 1 : -1) * (P.knee * lift) * D2R;
    const kx = hx + Math.sin(th1) * U, ky = hy + Math.cos(th1) * U;
    const fx = kx + Math.sin(th1 + th2) * Lg, fy = ky + Math.cos(th1 + th2) * Lg - lift * P.lift;
    const col = shade ? coatD : coat;
    const ang = (th1 + th2) / D2R;
    return `<path d="M${hx} ${hy} L${kx.toFixed(1)} ${ky.toFixed(1)} L${fx.toFixed(1)} ${fy.toFixed(1)}" fill="none" stroke="${out}" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M${hx} ${hy} L${kx.toFixed(1)} ${ky.toFixed(1)} L${fx.toFixed(1)} ${fy.toFixed(1)}" fill="none" stroke="${col}" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(${fx.toFixed(1)} ${fy.toFixed(1)}) rotate(${ang.toFixed(1)})"><rect x="-6.5" y="-1" width="13" height="12" rx="3.5" fill="${hoof}"/></g>`;
  }
  const off = {
    gallop: [0, 3.5, 1.0, 4.4], trot: [0, Math.PI, Math.PI, 0],
    prance: [0, Math.PI, Math.PI * .5, Math.PI * 1.5], idle: [0, .5, .25, .7], eat: [0, .3, .15, .45],
  }[gait];
  
  const legFar  = limb(98, 116, step + off[0], true, true) + limb(190, 113, step + off[1], false, true);
  const legNear = limb(110, 118, step + off[2], true, false) + limb(202, 115, step + off[3], false, false);
  
  let maneS = '';
  for (let i = 0; i < 8; i++){
    const u = i / 7, bx = 236 - 44 * u, by = 52 + 34 * u, w = Math.sin(t * 1.4 + i * .7) * P.mane;
    maneS += `<path d="M${bx.toFixed(1)} ${by.toFixed(1)} q${(-12 + w).toFixed(1)} 11 ${(-7 + w).toFixed(1)} 24" stroke="${maneC}" stroke-width="${(8 - u * 3).toFixed(1)}" fill="none" stroke-linecap="round"/>`;
  }
  
  let tailS = '';
  for (let i = 0; i < 7; i++){
    const w = Math.sin(t * 1.2 + i * .55) * (P.mane + 5);
    tailS += `<path d="M74 92 q${(-30 + w).toFixed(1)} ${18 + i * 2} ${(-22 + w).toFixed(1)} ${54 + i * 2}" stroke="${maneC}" stroke-width="${(10 - i).toFixed(1)}" fill="none" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 300 200" width="100%" style="overflow:visible">
    <ellipse cx="150" cy="190" rx="${(84 - bob * 1.6).toFixed(1)}" ry="8" fill="rgba(58,46,38,.14)"/>
    <g transform="translate(0 ${(-bob).toFixed(1)}) rotate(${sway.toFixed(2)} 150 108)">
      ${tailS}
      ${legFar}
      
      <path d="M72 104 C64 78 104 68 150 70 C182 71 204 78 214 96 C222 110 218 128 200 134 C160 143 108 143 84 134 C70 129 68 116 72 104 Z"
        fill="${coat}" stroke="${out}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M78 96 C96 76 150 72 196 84 C176 78 120 78 88 96 Z" fill="${coatD}" opacity=".55"/>
      <path d="M92 134 C130 142 172 141 200 132 C176 138 120 139 92 134 Z" fill="${coatL}" opacity=".5"/>
      
      <g transform="rotate(${headDip} 198 92)">
        <path d="M182 96 C188 66 206 50 232 52 L250 62 C230 70 210 86 202 110 C196 118 182 116 178 106 Z"
          fill="${coat}" stroke="${out}" stroke-width="5" stroke-linejoin="round"/>
        <path d="M186 92 C194 68 210 54 232 54 L238 60 C214 66 198 82 190 104 Z" fill="${coatD}" opacity=".5"/>
        ${maneS}
        
        <path d="M228 50 C246 42 262 48 266 62 C269 74 264 88 251 94 L236 96 C226 88 222 64 228 50 Z"
          fill="${coat}" stroke="${out}" stroke-width="5" stroke-linejoin="round"/>
        <path d="M251 92 C262 88 267 78 266 66 C270 78 268 90 255 96 Z" fill="${coatL}" opacity=".55"/>
        
        <path d="M232 34 l3 -16 l11 12 z" fill="${coat}" stroke="${out}" stroke-width="4" stroke-linejoin="round" transform="rotate(${earFlick} 236 30)"/>
        <path d="M246 34 l11 -13 l4 15 z" fill="${coatD}" stroke="${out}" stroke-width="4" stroke-linejoin="round"/>
        
        <path d="M234 40 q4 -14 14 -18 q-3 12 1 16 q-8 4 -11 12 z" fill="${maneC}"/>
        
        <ellipse cx="258" cy="82" rx="10" ry="9" fill="${coatL}" stroke="${out}" stroke-width="3.5"/>
        <ellipse cx="260" cy="79" rx="2.6" ry="3.6" fill="${out}"/>
        <path d="M252 90 q7 3 12 0" stroke="${out}" stroke-width="3" fill="none" stroke-linecap="round"/>
        
        <ellipse cx="242" cy="60" rx="5.2" ry="${blink ? .9 : 5.6}" fill="#1c1712"/>
        ${blink ? '' : '<circle cx="244" cy="58" r="1.7" fill="#fff" opacity=".85"/>'}
        ${o.acc === 'shades' ? `<rect x="230" y="52" width="26" height="12" rx="5" fill="#161616"/><path d="M243 58 h4" stroke="#161616" stroke-width="4"/><path d="M230 56 l-12 -3" stroke="#161616" stroke-width="4" stroke-linecap="round"/>` : ''}
        ${o.acc === 'crown' ? `<path d="M226 34 l4 -14 l8 9 l7 -14 l7 14 l8 -9 l4 14 z" fill="#f2c14e" stroke="${out}" stroke-width="3" stroke-linejoin="round"/><circle cx="240" cy="24" r="2.4" fill="#e88ca6"/>` : ''}
        ${o.acc === 'carrot' ? `<g transform="rotate(${(Math.sin(f / 4) * 6).toFixed(1)} 268 84)"><path d="M266 86 l30 8 l-26 8 z" fill="#f28c3b" stroke="${out}" stroke-width="3" stroke-linejoin="round"/><path d="M295 92 l12 -5 M295 94 l12 0 M295 96 l11 5" stroke="#7fae5e" stroke-width="3.5" stroke-linecap="round"/></g>` : ''}
      </g>
      ${o.acc === 'ribbon' ? `<circle cx="150" cy="70" r="11" fill="#e88ca6" stroke="${out}" stroke-width="3"/><path d="M143 77 l-7 13 M157 77 l7 13" stroke="#e88ca6" stroke-width="6" stroke-linecap="round"/><circle cx="150" cy="70" r="3.5" fill="#fff"/>` : ''}
      ${legNear}
    </g>
  </svg>`;
}

const WIKI = {};   // title -> {src, ok}
function wikiFetch(title){
  WIKI[title] = { ok: false, src: null };
  fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')))
    .then(r => r.json())
    .then(j => {
      const src = (j.thumbnail && j.thumbnail.source) || (j.originalimage && j.originalimage.source);
      if (src){
        const im = new Image();
        im.onload = () => { WIKI[title] = { ok: true, src }; if (curScene && curScene.photo === title) mountPhoto(curScene, true); };
        im.src = src;
      }
    })
    .catch(() => {});
}

let photoKey = null, curScene = null;
function mountPhoto(sc, force){
  const key = sc ? (sc.photo || null) : null;
  if (!force && key === photoKey) return;
  photoKey = key;
  if (!key){ photoLayer.innerHTML = ''; return; }
  const w = WIKI[key];
  const letter = String.fromCharCode(65 + (SCENES.filter(s => s.photo).findIndex(s => s.photo === key) % 26));
  if (w && w.ok){
    photoLayer.innerHTML = `<div class="polaroid">
      <div class="imgwrap"><img src="${w.src}" alt=""></div>
      <div class="cap">EXHIBIT ${letter} · "${key.toUpperCase()}" · STOLEN FROM WIKIPEDIA (LEGALLY)</div>
    </div>`;
  } else {
    photoLayer.innerHTML = `<div class="nophoto">
      <div style="width:60%">${HORSE(40, { gait: 'idle' })}</div>
      <div class="k">wikipedia is thinking. imagine "${key}".<br>you're doing great.</div>
    </div>`;
  }
}

const pad2 = n => String(n).padStart(2, '0');
const FACT_TOTAL = 21;
const HOOFNOTES = [
  'FACT-CHECKED BY A HORSE. HE NODDED.',
  'SOURCE: TRUST ME, AND ALSO WIKIPEDIA.',
  'RESULTS MAY VARY BY HORSE.',
  'DO NOT FEED THIS SLIDE TO YOUR HORSE.',
  'NO ZEBRAS WERE CONSULTED. ON PURPOSE.',
  "LEGAL SAYS I HAVE TO SAY 'ALLEGEDLY.' ALLEGEDLY.",
  'THE FACT COMMITTEE IS ONE (1) ELEVEN-YEAR-OLD.',
  'HOOF-NOTES: LIKE FOOTNOTES, BUT LOUDER.',
  'THIS SLIDE IS DEDICATED TO EVERY GOOD HORSE.',
  'GRAMPA DISPUTES THIS ONE. GRAMPA IS OUTVOTED.',
];
const ACCENTS = ['#b3402e', '#4a7ba6', '#7fae5e', '#e88ca6', '#f28c3b'];
function factSlide(o){
  const acc = o.c || ACCENTS[(o.n - 1) % ACCENTS.length];
  return { dur: o.dur || 265, name: `Fact ${pad2(o.n)}`, photo: o.page || null, render(f){
    const d = this.dur;
    let h = el('', S({ left: 0, right: 0, top: 0, height: '1.3em', background: acc }))
      + el(`<div class="kick" style="font-size:2.2em;color:${acc}">HORSE FACT № ${pad2(o.n)} · ${o.trust || 'TRUE'}</div>`,
        S({ left: '7%', top: '4.5%', transform: slamX(f, 0) }))
      + el(`<div style="font-weight:900;font-size:${o.big || '6.2'}em;line-height:1.02;letter-spacing:-.02em;text-transform:uppercase">${o.fact}</div>`,
        S({ left: '7%', right: '7%', top: '9%', transform: slamY(f, 8, 300) }))
      + el(`<div style="font-size:3.1em;font-weight:700;line-height:1.45;color:#5a4a3e">${o.quip}</div>`,
        S({ left: '7%', right: '7%', top: '76%', opacity: fade(f, d * .34, d * .45) }))
      + el(`<div class="kick" style="font-size:1.6em;color:#3a2e2666">${pad2(o.n)} / ${FACT_TOTAL} FACTS</div>`,
        S({ left: '7%', bottom: '2%', opacity: fade(f, 20, 32) }))
      + el(`<div class="kick" style="font-size:1.5em;color:#3a2e2655">${o.foot || HOOFNOTES[o.n % HOOFNOTES.length]}</div>`,
        S({ right: '7%', bottom: '2%', 'text-align': 'right', opacity: fade(f, d * .6, d * .7) }));
    if (o.stamp) h += el(`<div class="stamp" style="font-size:2.3em;color:${o.stampC || acc}">${o.stamp}</div>`,
        S({ right: '6%', top: '27%', transform: pop(f, d * .55) + ` rotate(${7 + Math.sin(f / 9) * 2}deg)`, opacity: f > d * .55 ? 1 : 0 }));
    if (o.cameo) h += el(HORSE(f, { gait: 'trot', acc: o.cameoAcc }),
        S({ left: interp(f, [d * .18, d], [-45, 110]) + '%', bottom: '-1%', width: '34%' }));
    return h;
  }};
}

const SCENES = [

{ dur: 290, name: 'Title', render(f){
  return el('', S({ inset: 0, background: 'linear-gradient(180deg,#bfe0f2 0 58%, #a8cf8a 58% 100%)' }))
  + el('', S({ left: '68%', top: '6%', width: '18%', 'aspect-ratio': '1', 'border-radius': '50%', background: '#f2c14e', 'box-shadow': '0 0 5em rgba(242,193,78,.8)' }))
  + el(`<div class="kick" style="font-size:2.2em;color:#3a2e26">A SERIOUS SCIENCE PRESENTATION · GRADE: PENDING</div>`,

const TOTAL = SCENES.reduce((s, sc) => s + sc.dur, 0);
let frame = 0, playing = false, rafLast = 0;
function sceneAt(gf){
  let acc = 0;
  for (let i = 0; i < SCENES.length; i++){
    if (gf < acc + SCENES[i].dur) return { i, local: gf - acc, start: acc };
    acc += SCENES[i].dur;
  }
  return { i: SCENES.length - 1, local: SCENES[SCENES.length - 1].dur - 1, start: TOTAL - SCENES[SCENES.length - 1].dur };
}
function render(){
  const { i, local } = sceneAt(frame);
  const sc = SCENES[i];
  curScene = sc;
  
  let layer = document.getElementById('sceneHtml');
  if (!layer){
    layer = document.createElement('div');
    layer.id = 'sceneHtml';
    layer.style.cssText = 'position:absolute;inset:0';
    comp.insertBefore(layer, photoLayer);
  }
  layer.innerHTML = sc.render.call(sc, local);
  mountPhoto(sc);
  document.getElementById('sceneLbl').textContent = `${i + 1} / ${SCENES.length} · ${sc.name}`;
  const p = frame / TOTAL;
  document.querySelector('#scrub .fill').style.width = (p * 100) + '%';
  document.querySelector('#scrub .knob').style.left = (p * 100) + '%';
}

const sceneStart = i => SCENES.slice(0, i).reduce((s, x) => s + x.dur, 0);
const EVENTS = [
  { g: sceneStart(0) + 24, s: 'whinny' },     
  { g: sceneStart(16) + 130, s: 'crunch' },   
  { g: sceneStart(27) + 110, s: 'whinny' },   
];
function tick(ts){
  requestAnimationFrame(tick);
  if (!playing) return;
  if (!rafLast) rafLast = ts;
  const adv = (ts - rafLast) / (1000 / FPS);
  if (adv >= 1){
    const prevF = frame, prevScene = sceneAt(frame).i;
    frame = Math.min(TOTAL - 1, frame + Math.round(adv));
    rafLast = ts;
    if (sceneAt(frame).i !== prevScene) Music.sfx('flip');
    for (const e of EVENTS) if (prevF < e.g && e.g <= frame) Music.sfx(e.s);
    if (frame >= TOTAL - 1){ playing = false; updatePlayBtn(); Music.stop(); }
    render();
  }
}
requestAnimationFrame(tick);

function updatePlayBtn(){ document.getElementById('bPlay').textContent = playing ? 'Pause' : (frame >= TOTAL - 1 ? 'Replay' : 'Play'); }
function playPause(){
  if (frame >= TOTAL - 1 && !playing) frame = 0;
  playing = !playing; rafLast = 0;
  updatePlayBtn();
  playing ? Music.start() : Music.stop();
}
document.getElementById('bPlay').addEventListener('click', playPause);
document.getElementById('bPrev').addEventListener('click', () => {
  const { i, start } = sceneAt(frame);
  frame = frame - start > FPS ? start : (i > 0 ? sceneAt(start - 1).start : 0);
  render();
});
document.getElementById('bNext').addEventListener('click', () => {
  const { i, start } = sceneAt(frame);
  frame = i < SCENES.length - 1 ? start + SCENES[i].dur : TOTAL - 1;
  render();
});
addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); playPause(); }
  if (e.code === 'ArrowLeft') document.getElementById('bPrev').click();
  if (e.code === 'ArrowRight') document.getElementById('bNext').click();
});

const scrub = document.getElementById('scrub');
let marks = '', acc = 0;
SCENES.slice(0, -1).forEach(sc => {
  acc += sc.dur;
  marks += `<div class="mark" style="left:${acc / TOTAL * 100}%"></div>`;
});
scrub.insertAdjacentHTML('beforeend', marks);
function scrubTo(x){
  const r = scrub.getBoundingClientRect();
  frame = Math.round(clamp((x - r.left) / r.width, 0, 1) * (TOTAL - 1));
  render();
}
let scrubbing = false;
scrub.addEventListener('pointerdown', e => { scrubbing = true; playing = false; updatePlayBtn(); scrubTo(e.clientX); });
addEventListener('pointermove', e => { if (scrubbing) scrubTo(e.clientX); });
addEventListener('pointerup', () => scrubbing = false);

const Music = (() => {
  let ctx = null, master = null, leadBus = null, timer = null, step = 0, nextT = 0;
  let enabled = true;
  const BPM = 132, SPB = 60 / BPM / 2;
  const N = (name) => {
    const m = /^([A-G]#?)(\d)$/.exec(name);
    const idx = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'].indexOf(m[1]);
    return 440 * Math.pow(2, (idx - 9) / 12 + (m[2] - 4));
  };
  const BASS = [
    'G2','','D2','','G2','','D2','',  'C3','','G2','','D2','','D2','',
    'G2','','D2','','G2','','D2','',  'C3','','D3','','G2','','G2','',
    'G2','','D2','','G2','','D2','',  'C3','','G2','','D2','','D2','',
    'E2','','A2','','C3','','D3','',  'G2','','D2','','G2','','','',
  ];
  const LEAD = [
    'G4','A4','B4','G4','D5','','B4','G4',  'C5','B4','A4','','D4','','A4','',
    'G4','A4','B4','G4','D5','','B4','D5',  'E5','D5','C5','B4','A4','','G4','',
    'B4','','D5','B4','G5','','D5','B4',    'C5','D5','E5','C5','A4','','F#4','',
    'G4','B4','D5','G5','E5','C5','A4','F#4','G4','','B4','','G4','','','',
  ];
  function ensure(){
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = .14;
    const dc = ctx.createDynamicsCompressor();
    master.connect(dc); dc.connect(ctx.destination);
    
    leadBus = ctx.createGain();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2100; lp.Q.value = .6;
    leadBus.connect(lp); lp.connect(master);
    const delay = ctx.createDelay(.5);
    delay.delayTime.value = SPB * 1.5;
    const fb = ctx.createGain(); fb.gain.value = .22;
    const wet = ctx.createGain(); wet.gain.value = .16;
    lp.connect(delay); delay.connect(fb); fb.connect(delay);
    delay.connect(wet); wet.connect(master);
  }
  function osc(type, freq, t, dur, vol, detune = 0, bus){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; o.detune.value = detune;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(bus || master);
    o.start(t); o.stop(t + dur + .02);
  }
  function noise(t, dur, vol, hp){
    const len = Math.ceil(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const flt = ctx.createBiquadFilter(); flt.type = hp > 2000 ? 'highpass' : 'lowpass'; flt.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(t);
  }
  function clop(t, hi){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(hi ? 1100 : 720, t);
    o.frequency.exponentialRampToValueAtTime(hi ? 700 : 460, t + .035);
    g.gain.setValueAtTime(.5, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .05);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + .07);
  }
  function scheduleStep(i, t){
    const b = BASS[i % 64];
    if (b) osc('triangle', N(b), t, SPB * 1.6, .36);
    const l = LEAD[i % 64];
    if (l){
      osc('square', N(l), t, SPB * .95, .12, 0, leadBus);
      osc('square', N(l), t, SPB * .95, .07, 9, leadBus);
    }
    const s8 = i % 8;
    if (s8 === 0 || s8 === 3 || s8 === 4 || s8 === 7) clop(t, s8 === 3 || s8 === 7);
    if (s8 === 2 || s8 === 6) noise(t, .05, .045, 7000);           
    if (i % 32 === 30) noise(t, .16, .06, 5200);                   
  }
  
  const SFXDEF = {
    whinny(t){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sawtooth';
      let f0 = 980;
      o.frequency.setValueAtTime(f0, t);
      for (let k = 1; k <= 7; k++){
        f0 = 980 - k * 90 + (k % 2 ? 120 : -40);
        o.frequency.linearRampToValueAtTime(Math.max(240, f0), t + k * .07);
      }
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.09, t + .04);
      g.gain.exponentialRampToValueAtTime(.001, t + .62);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + .68);
      noise(t + .05, .5, .03, 3400);
    },
    crunch(t){
      for (let k = 0; k < 3; k++) noise(t + k * .13, .07, .22, 1500);
    },
    flip(t){
      noise(t, .09, .07, 4200);
      osc('triangle', 620, t + .02, .06, .05);
    },
  };
  function sfx(name){
    if (!enabled || !ctx) return;
    const fn = SFXDEF[name];
    if (fn) fn(ctx.currentTime + .01);
  }
  function tickSched(){
    while (nextT < ctx.currentTime + .12){
      scheduleStep(step, nextT);
      step++; nextT += SPB;
    }
  }
  return {
    start(){
      if (!enabled) return;
      ensure(); ctx.resume();
      if (!timer){ nextT = ctx.currentTime + .05; timer = setInterval(tickSched, 25); }
    },
    stop(){ if (timer){ clearInterval(timer); timer = null; } if (ctx) ctx.suspend(); },
    toggle(){
      enabled = !enabled;
      if (!enabled) this.stop();
      else if (playing) this.start();
      document.getElementById('bMusic').textContent = enabled ? '♫ On' : '♫ Off';
    },
    sfx,
  };
})();
document.getElementById('bMusic').addEventListener('click', () => Music.toggle());

[...new Set(SCENES.map(s => s.photo).filter(Boolean))].forEach(wikiFetch);

document.getElementById('tapstart').addEventListener('click', () => {
  document.getElementById('tapstart').classList.add('hide');
  frame = 0; playing = true; rafLast = 0; updatePlayBtn();
  Music.start();
});
comp.addEventListener('click', playPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) Music.stop(); else if (playing) Music.start(); });

sizeComp();
render();
</script>
