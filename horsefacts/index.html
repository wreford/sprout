<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a1f18">
<meta name="description" content="Lily's Horse Facts — the only peer-reviewed horse presentation. The peer is a horse.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23fdf6e3'/%3E%3Cpath d='M8 24 q0 -10 8 -10 q4 0 5 -4 l2 -4 l4 3 l-3 5 q-1 3 -4 4 l0 6 z' fill='%23a9744f' stroke='%233a2e26' stroke-width='1.6'/%3E%3Ccircle cx='24' cy='11' r='1.2' fill='%233a2e26'/%3E%3C/svg%3E">
<title>Lily's Horse Facts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --barn:#2a1f18; --paper:#fdf6e3; --ink:#3a2e26;
  --red:#b3402e; --hay:#f2c14e; --sky:#7fb5d5; --grass:#7fae5e; --brown:#a9744f; --pink:#e88ca6;
  --disp:'Sora',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--barn);color:var(--paper);font-family:var(--disp);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0;bottom:92px;display:flex;align-items:center;justify-content:center}
#comp{
  position:relative;overflow:hidden;background:var(--paper);color:var(--ink);
  height:min(100%, calc(100vw * 16 / 9));aspect-ratio:9/16;
  border-radius:14px;box-shadow:0 40px 90px -30px rgba(0,0,0,.85)
}
.el{position:absolute;will-change:transform,opacity}
.kick{font-family:var(--mono);font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.stamp{
  font-family:var(--mono);font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  border:.3em solid currentColor;border-radius:.5em;padding:.35em .7em;background:var(--paper)
}
/* photo layer (updated per-scene, CSS-animated so wiki images never flicker) */
#photoLayer{position:absolute;left:0;right:0;top:27%;height:46%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.polaroid{
  background:#fff;padding:2.5em 2.5em 1em;border-radius:.8em;
  box-shadow:0 2em 4em rgba(58,46,38,.35);transform:rotate(-2.5deg);
  animation:photoIn .5s cubic-bezier(.34,1.56,.64,1) both;max-width:82%
}
.polaroid img{display:block;width:100%;height:30em;object-fit:cover;border-radius:.4em;background:#eee}
.polaroid .cap{font-family:var(--mono);font-weight:700;font-size:2.1em;color:#6b5a4e;text-align:center;padding:.5em .2em .3em;letter-spacing:.06em}
@keyframes photoIn{0%{transform:rotate(-10deg) scale(.3) translateY(8em);opacity:0}100%{transform:rotate(-2.5deg) scale(1) translateY(0);opacity:1}}
@keyframes noPhotoIn{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.nophoto{
  display:flex;flex-direction:column;align-items:center;gap:1em;text-align:center;
  animation:noPhotoIn .4s ease both
}
.nophoto .k{font-family:var(--mono);font-weight:700;font-size:2.2em;color:#6b5a4e;max-width:26em;line-height:1.5}
/* controls */
#bar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;height:92px;
  padding:10px 16px calc(env(safe-area-inset-bottom) + 8px);
  display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(0deg,rgba(20,14,10,.96),rgba(20,14,10,.7))
}
#scrub{position:relative;height:22px;cursor:pointer}
#scrub .track{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:rgba(253,246,227,.2)}
#scrub .fill{position:absolute;left:0;top:9px;height:4px;border-radius:4px;background:var(--hay);width:0}
#scrub .mark{position:absolute;top:7px;width:2px;height:8px;background:rgba(253,246,227,.45)}
#scrub .knob{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:var(--hay);box-shadow:0 2px 8px rgba(0,0,0,.5);margin-left:-8px}
#bar .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#bar .btns{display:flex;gap:8px}
#bar button{
  min-width:44px;height:38px;padding:0 14px;border-radius:100px;cursor:pointer;
  background:rgba(253,246,227,.1);border:1.5px solid rgba(253,246,227,.25);color:var(--paper);
  font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase
}
#bar button.play{background:var(--hay);color:var(--barn);border-color:transparent;min-width:78px}
#bar .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:rgba(253,246,227,.6);font-weight:700;text-transform:uppercase;text-align:right}
#tapstart{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:rgba(20,14,10,.88);backdrop-filter:blur(8px);cursor:pointer;text-align:center;padding:24px
}
#tapstart.hide{display:none}
#tapstart .k{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--hay);font-weight:800;text-transform:uppercase}
#tapstart h1{font-size:clamp(34px,9vw,60px);font-weight:900;letter-spacing:-.02em;line-height:.95;text-transform:uppercase}
#tapstart h1 .h{color:var(--hay)} #tapstart h1 .r{color:#ff8d73}
#tapstart .big{
  padding:18px 36px;border-radius:14px;background:var(--hay);color:var(--barn);border:none;cursor:pointer;
  font-family:var(--disp);font-weight:900;font-size:16px;letter-spacing:.05em;text-transform:uppercase;min-height:58px;
  box-shadow:0 18px 40px -10px rgba(242,193,78,.5)
}
#tapstart .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:rgba(253,246,227,.55);font-weight:700;text-transform:uppercase;line-height:2}
</style>
</head>
<body>
<div id="stage"><div id="comp"><div id="photoLayer"></div></div></div>

<div id="bar">
  <div id="scrub"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
  <div class="row">
    <div class="btns">
      <button id="bPrev">Prev</button>
      <button id="bPlay" class="play">Pause</button>
      <button id="bNext">Next</button>
      <button id="bMusic">♫ On</button>
    </div>
    <div class="lbl" id="sceneLbl"></div>
  </div>
</div>

<div id="tapstart">
  <span class="k">A peer-reviewed presentation · the peer is a horse</span>
  <h1>Lily's<br><span class="h">Horse</span> <span class="r">Facts</span></h1>
  <button class="big">Start the facts</button>
  <span class="sub">26 slides · real wikipedia evidence · one (1) horse<br>space pauses · arrows skip</span>
</div>

<script>
'use strict';
/* ============================================================
   Frame engine · portrait 9:16 edition of the beach deck.
   comp font-size = 1% of comp width → everything sized in em,
   so one deck fits phones, tablets and TVs identically.
   ============================================================ */
const FPS = 30;
const comp = document.getElementById('comp');
const photoLayer = document.getElementById('photoLayer');

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function interp(f, [f0, f1], [v0, v1], ease){
  const t = clamp((f - f0) / (f1 - f0), 0, 1);
  return v0 + (v1 - v0) * (ease ? ease(t) : t);
}
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
function spring(f, delay = 0, stiffness = .55){
  const t = clamp((f - delay) / (FPS * .9), 0, 1);
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  return 1 - Math.pow(1 - t, 2) * Math.cos(t * Math.PI * 2.2 * stiffness);
}
const pop = (f, d) => `scale(${spring(f, d)})`;
const slamY = (f, d, from = -300) => `translateY(${interp(spring(f, d), [0, 1], [from, 0])}px)`;
const slamX = (f, d, from = -600) => `translateX(${interp(spring(f, d), [0, 1], [from, 0])}px)`;
const fade = (f, a, b) => clamp(interp(f, [a, b], [0, 1]), 0, 1);
function el(html, style){ return `<div class="el" style="${style}">${html}</div>`; }
const S = (obj) => Object.entries(obj).map(([k, v]) => `${k}:${v}`).join(';');

function sizeComp(){ comp.style.fontSize = (comp.clientWidth / 100) + 'px'; }
addEventListener('resize', sizeComp);

/* ============================================================
   THE HORSE · one fully animated star, many gigs.
   gait: gallop | trot | idle | prance | eat
   acc:  none | shades | crown | carrot | ribbon
   ============================================================ */
function HORSE(f, o = {}){
  const gait = o.gait || 'trot';
  const spd = { gallop: 2.2, trot: 3.4, prance: 5, idle: 9, eat: 9 }[gait];
  const amp = { gallop: 30, trot: 18, prance: 26, idle: 2, eat: 2 }[gait];
  const L = i => Math.sin(f / spd + i * 1.7) * amp;
  const bob = Math.abs(Math.sin(f / spd)) * (gait === 'idle' || gait === 'eat' ? 2 : 7);
  const blink = Math.sin(f / 13) < -.92;
  const headDip = gait === 'eat' ? 26 + Math.sin(f / 6) * 6 : 0;
  const tailW = Math.sin(f / 5) * 14;
  const leg = (x, a, back) => `
    <g transform="translate(${x} 118) rotate(${a})">
      <rect x="-7" y="0" width="14" height="58" rx="7" fill="${back ? '#8f5f3e' : '#a9744f'}" stroke="#3a2e26" stroke-width="4"/>
      <rect x="-8" y="52" width="16" height="14" rx="5" fill="#3a2e26"/>
    </g>`;
  return `<svg viewBox="0 0 300 200" width="100%" style="overflow:visible">
    <g transform="translate(0 ${-bob})">
      <g transform="translate(52 88) rotate(${tailW})">
        <path d="M0 0 q-30 10 -26 48 q-2 -34 14 -40 q-14 16 -8 36 q2 -26 20 -32" fill="#6b4a30" stroke="#3a2e26" stroke-width="3" stroke-linejoin="round"/>
      </g>
      ${leg(95, L(0), true)}
      ${leg(120, L(2), true)}
      ${leg(185, L(1), false)}
      ${leg(208, L(3), false)}
      <ellipse cx="150" cy="100" rx="78" ry="44" fill="#a9744f" stroke="#3a2e26" stroke-width="5"/>
      <path d="M205 78 q18 -34 40 -44 l6 12 q6 -8 14 -8 l-4 26 q-2 18 -24 22 q-16 3 -24 -2 z" fill="#a9744f" stroke="#3a2e26" stroke-width="5" stroke-linejoin="round" transform="rotate(${headDip} 210 80)"/>
      <g transform="rotate(${headDip} 210 80)">
        <path d="M243 34 l6 -16 l8 14 z" fill="#a9744f" stroke="#3a2e26" stroke-width="4" stroke-linejoin="round"/>
        <path d="M256 36 l10 -12 l4 16 z" fill="#8f5f3e" stroke="#3a2e26" stroke-width="4" stroke-linejoin="round"/>
        <path d="M208 70 q14 -32 34 -40 q-4 14 2 16 q-10 8 -14 24 z" fill="#6b4a30"/>
        <ellipse cx="248" cy="52" rx="4.5" ry="${blink ? .8 : 5}" fill="#3a2e26"/>
        <circle cx="264" cy="70" r="2.6" fill="#3a2e26"/>
        <path d="M252 78 q7 3 12 -1" stroke="#3a2e26" stroke-width="3" fill="none" stroke-linecap="round"/>
        ${o.acc === 'shades' ? `<rect x="238" y="46" width="22" height="11" rx="4" fill="#3a2e26"/><path d="M238 50 h-14" stroke="#3a2e26" stroke-width="3"/>` : ''}
        ${o.acc === 'crown' ? `<path d="M232 24 l4 -12 l7 8 l6 -12 l6 12 l7 -8 l3 12 z" fill="#f2c14e" stroke="#3a2e26" stroke-width="3" stroke-linejoin="round"/>` : ''}
        ${o.acc === 'carrot' ? `<g transform="rotate(${Math.sin(f / 4) * 6} 268 82)"><path d="M268 82 l26 10 l-24 6 z" fill="#f28c3b" stroke="#3a2e26" stroke-width="3" stroke-linejoin="round"/><path d="M292 90 l10 -4 M292 92 l10 2" stroke="#7fae5e" stroke-width="3" stroke-linecap="round"/></g>` : ''}
      </g>
      <path d="M112 62 q20 -18 52 -14" stroke="#6b4a30" stroke-width="9" fill="none" stroke-linecap="round"/>
      ${o.acc === 'ribbon' ? `<circle cx="150" cy="64" r="10" fill="#e88ca6" stroke="#3a2e26" stroke-width="3"/><path d="M144 70 l-6 12 M156 70 l6 12" stroke="#e88ca6" stroke-width="5" stroke-linecap="round"/>` : ''}
    </g>
  </svg>`;
}

/* ============================================================
   WIKIPEDIA EVIDENCE · fetched once, shown per slide
   ============================================================ */
const WIKI = {};   // title -> {src, ok}
function wikiFetch(title){
  WIKI[title] = { ok: false, src: null };
  fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')))
    .then(r => r.json())
    .then(j => {
      const src = (j.thumbnail && j.thumbnail.source) || (j.originalimage && j.originalimage.source);
      if (src){
        const im = new Image();
        im.onload = () => { WIKI[title] = { ok: true, src }; if (curScene && curScene.photo === title) mountPhoto(curScene, true); };
        im.src = src;
      }
    })
    .catch(() => {});
}

let photoKey = null, curScene = null;
function mountPhoto(sc, force){
  const key = sc ? (sc.photo || null) : null;
  if (!force && key === photoKey) return;
  photoKey = key;
  if (!key){ photoLayer.innerHTML = ''; return; }
  const w = WIKI[key];
  const letter = String.fromCharCode(65 + (SCENES.filter(s => s.photo).findIndex(s => s.photo === key) % 26));
  if (w && w.ok){
    photoLayer.innerHTML = `<div class="polaroid">
      <img src="${w.src}" alt="">
      <div class="cap">EXHIBIT ${letter} · "${key.toUpperCase()}" · STOLEN FROM WIKIPEDIA (LEGALLY)</div>
    </div>`;
  } else {
    photoLayer.innerHTML = `<div class="nophoto">
      <div style="width:60%">${HORSE(40, { gait: 'idle' })}</div>
      <div class="k">wikipedia is thinking. imagine "${key}".<br>you're doing great.</div>
    </div>`;
  }
}

/* ============================================================
   SLIDE FACTORY · standard fact layout, portrait
   ============================================================ */
const pad2 = n => String(n).padStart(2, '0');
function factSlide(o){
  return { dur: o.dur || 200, name: `Fact ${pad2(o.n)}`, photo: o.page || null, render(f){
    let h = el(`<div class="kick" style="font-size:2.2em;color:${o.c || '#b3402e'}">HORSE FACT № ${pad2(o.n)} · ${o.trust || 'TRUE'}</div>`,
        S({ left: '7%', top: '4.5%', transform: slamX(f, 0) }))
      + el(`<div style="font-weight:900;font-size:${o.big || '6.2'}em;line-height:1.02;letter-spacing:-.02em;text-transform:uppercase">${o.fact}</div>`,
        S({ left: '7%', right: '7%', top: '9%', transform: slamY(f, 6, 300) }))
      + el(`<div style="font-size:3.1em;font-weight:700;line-height:1.45;color:#5a4a3e">${o.quip}</div>`,
        S({ left: '7%', right: '7%', top: '76%', opacity: fade(f, 55, 75) }));
    if (o.stamp) h += el(`<div class="stamp" style="font-size:2.3em;color:${o.stampC || '#b3402e'}">${o.stamp}</div>`,
        S({ right: '6%', top: '27%', transform: pop(f, 110) + ' rotate(7deg)', opacity: f > 110 ? 1 : 0 }));
    if (o.cameo) h += el(HORSE(f, { gait: 'trot', acc: o.cameoAcc }),
        S({ left: interp(f, [30, this.dur], [-45, 110]) + '%', bottom: '-2%', width: '34%' }));
    return h;
  }};
}

/* ============================================================
   SCENES · 26 slides of unassailable science
   ============================================================ */
const SCENES = [

/* 1 · TITLE */
{ dur: 200, name: 'Title', render(f){
  return el('', S({ inset: 0, background: 'linear-gradient(180deg,#bfe0f2 0 58%, #a8cf8a 58% 100%)' }))
  + el('', S({ left: '68%', top: '6%', width: '18%', 'aspect-ratio': '1', 'border-radius': '50%', background: '#f2c14e', 'box-shadow': '0 0 5em rgba(242,193,78,.8)' }))
  + el(`<div class="kick" style="font-size:2.2em;color:#3a2e26">A SERIOUS SCIENCE PRESENTATION · GRADE: PENDING</div>`,
      S({ left: '7%', top: '7%', opacity: fade(f, 5, 20), transform: slamX(f, 5, -400) }))
  + el(`<div style="font-weight:900;font-size:11em;line-height:.92;letter-spacing:-.03em;text-transform:uppercase">Lily's<br><span style="color:#b3402e">Horse</span><br><span style="color:#4a7ba6">Facts</span></div>`,
      S({ left: '7%', top: '13%', transform: slamY(f, 12, 500) + ` rotate(${interp(spring(f, 12), [0, 1], [-5, 0])}deg)` }))
  + el(`<div class="stamp" style="font-size:2.4em;color:#b3402e">PEER-REVIEWED*</div>`,
      S({ right: '7%', top: '46%', transform: pop(f, 55) + ' rotate(-8deg)', opacity: f > 55 ? 1 : 0 }))
  + el(`<div class="kick" style="font-size:1.8em;color:#3a2e26aa">*THE PEER IS A HORSE. HE SAID NEIGH. WE'RE COUNTING IT.</div>`,
      S({ right: '7%', top: '53%', 'text-align': 'right', opacity: fade(f, 70, 85) }))
  + el(HORSE(f, { gait: 'gallop' }), S({ left: interp(f, [20, 190], [-50, 115]) + '%', bottom: '4%', width: '52%' }))
  + el(`<div class="kick" style="font-size:2em;color:#3a2e26;line-height:1.9">PRESENTED BY: LILY · CEO OF HORSES<br>SELF-APPOINTED · RAN UNOPPOSED · LANDSLIDE</div>`,
      S({ left: '7%', bottom: '18%', opacity: fade(f, 100, 120) }));
}},

/* 2 · CREDENTIALS */
{ dur: 210, name: 'Credentials', render(f){
  const creds = [
    ['47', 'MODEL HORSES OWNED'],
    ['2', 'TIMES BITTEN (SURVIVED)'],
    ['∞', 'HOURS OF HORSE YOUTUBE'],
    ['1', 'DENIED PONY REQUEST (ONGOING)'],
  ];
  return el(`<div class="kick" style="font-size:2.2em;color:#4a7ba6">SLIDE 2 · AM I QUALIFIED?</div>`,
      S({ left: '7%', top: '4.5%', transform: slamX(f, 0) }))
  + el(`<div style="font-weight:900;font-size:7.5em;line-height:1;letter-spacing:-.02em;text-transform:uppercase">Extremely<span style="color:#b3402e">.</span></div>`,
      S({ left: '7%', top: '9%', transform: slamY(f, 6, 300) }))
  + creds.map((c, i) => el(
      `<div style="display:flex;align-items:center;gap:1em;background:#fff;border-radius:1em;padding:1.2em 1.6em;box-shadow:0 .6em 2em rgba(58,46,38,.14)">
        <span style="font-family:var(--mono);font-weight:800;font-size:6em;color:#b3402e;min-width:1.4em">${c[0]}</span>
        <span class="kick" style="font-size:2.2em;color:#3a2e26">${c[1]}</span>
      </div>`,
      S({ left: '7%', right: '7%', top: (22 + i * 12) + '%', transform: slamX(f, 20 + i * 12, 700), opacity: f > 20 + i * 12 ? 1 : 0 })))
    .join('')
  + el(`<div style="font-size:3.1em;font-weight:700;line-height:1.45;color:#5a4a3e">That's more field experience than most scientists. Sit down, scientists.</div>`,
      S({ left: '7%', right: '7%', top: '76%', opacity: fade(f, 90, 110) }))
  + el(HORSE(f, { gait: 'idle' }), S({ right: '-8%', bottom: '-3%', width: '36%', opacity: fade(f, 60, 80) }));
}},

factSlide({ n: 1, page: 'Horse', fact: 'Horses sleep standing up.', big: '6.6',
  quip: `Their legs LOCK. It's called the "stay apparatus," because scientists used all the good names on dinosaurs.`,
  stamp: 'LEGS: LOCKED', stampC: '#4a7ba6' }),

factSlide({ n: 2, page: 'Equine anatomy', fact: `Horses can't burp.`, big: '7',
  quip: `No burps. Ever. In their whole life. Imagine the pressure. This explains 100% of their attitude.`,
  stamp: 'ZERO BURPS', cameo: true }),

factSlide({ n: 3, page: 'Horse teeth', fact: 'You can tell a horse\'s age by its teeth.',
  quip: `You cannot, however, tell a horse ITS age. It gets weird about it. Just like grampa.` }),

factSlide({ n: 4, page: 'Thoroughbred', fact: 'Top recorded horse speed: 70.76 km/h.',
  quip: `That's faster than dad's van is legally allowed to go past the school. The horse has no licence. The horse does not care.`,
  stamp: 'NO LICENCE', trust: 'MEASURED' }),

factSlide({ n: 5, page: 'Foal', fact: 'A foal can RUN within hours of being born.',
  quip: `Human babies need a YEAR to walk. A year!! Do better, babies. The foals are lapping you.` }),

factSlide({ n: 6, page: 'Equine vision', fact: 'Horses have the biggest eyes of any land mammal.',
  quip: `They see almost all the way around themselves. They are still SHOCKED by a plastic bag. Every time. Oscar-worthy performances.`,
  stamp: 'BAG = DEMON', stampC: '#b3402e' }),

/* INTERMISSION 1 · DRESSAGE */
{ dur: 230, name: 'Intermission · dressage', render(f){
  const scores = [['🇨🇦', '10'], ['🇫🇷', '10'], ['🦓', '4']];
  return el('', S({ inset: 0, background: 'linear-gradient(180deg,#fdf6e3 0 70%, #e8d9b8 70% 100%)' }))
  + el(`<div class="kick" style="font-size:2.4em;color:#b3402e">INTERMISSION · THE HORSE DOES DRESSAGE NOW</div>`,
      S({ left: '50%', top: '5%', transform: 'translateX(-50%)', 'white-space': 'nowrap', opacity: fade(f, 4, 16) }))
  + el(`<div style="font-weight:900;font-size:6.4em;text-transform:uppercase;letter-spacing:-.02em;text-align:center;line-height:1">Fancy prancing<br><span style="color:#e88ca6">segment.</span></div>`,
      S({ left: '7%', right: '7%', top: '10%', transform: slamY(f, 8, 300) }))

/* ============================================================
   PLAYER
   ============================================================ */
const TOTAL = SCENES.reduce((s, sc) => s + sc.dur, 0);
let frame = 0, playing = false, rafLast = 0;
function sceneAt(gf){
  let acc = 0;
  for (let i = 0; i < SCENES.length; i++){
    if (gf < acc + SCENES[i].dur) return { i, local: gf - acc, start: acc };
    acc += SCENES[i].dur;
  }
  return { i: SCENES.length - 1, local: SCENES[SCENES.length - 1].dur - 1, start: TOTAL - SCENES[SCENES.length - 1].dur };
}
function render(){
  const { i, local } = sceneAt(frame);
  const sc = SCENES[i];
  curScene = sc;
  /* photo layer sits between bg and text; rebuild scene html around it */
  let layer = document.getElementById('sceneHtml');
  if (!layer){
    layer = document.createElement('div');
    layer.id = 'sceneHtml';
    layer.style.cssText = 'position:absolute;inset:0';
    comp.insertBefore(layer, photoLayer);
  }
  layer.innerHTML = sc.render.call(sc, local);
  mountPhoto(sc);
  document.getElementById('sceneLbl').textContent = `${i + 1} / ${SCENES.length} · ${sc.name}`;
  const p = frame / TOTAL;
  document.querySelector('#scrub .fill').style.width = (p * 100) + '%';
  document.querySelector('#scrub .knob').style.left = (p * 100) + '%';
}
function tick(ts){
  requestAnimationFrame(tick);
  if (!playing) return;
  if (!rafLast) rafLast = ts;
  const adv = (ts - rafLast) / (1000 / FPS);
  if (adv >= 1){
    frame = Math.min(TOTAL - 1, frame + Math.round(adv));
    rafLast = ts;
    if (frame >= TOTAL - 1){ playing = false; updatePlayBtn(); Music.stop(); }
    render();
  }
}
requestAnimationFrame(tick);

function updatePlayBtn(){ document.getElementById('bPlay').textContent = playing ? 'Pause' : (frame >= TOTAL - 1 ? 'Replay' : 'Play'); }
function playPause(){
  if (frame >= TOTAL - 1 && !playing) frame = 0;
  playing = !playing; rafLast = 0;
  updatePlayBtn();
  playing ? Music.start() : Music.stop();
}
document.getElementById('bPlay').addEventListener('click', playPause);
document.getElementById('bPrev').addEventListener('click', () => {
  const { i, start } = sceneAt(frame);
  frame = frame - start > FPS ? start : (i > 0 ? sceneAt(start - 1).start : 0);
  render();
});
document.getElementById('bNext').addEventListener('click', () => {
  const { i, start } = sceneAt(frame);
  frame = i < SCENES.length - 1 ? start + SCENES[i].dur : TOTAL - 1;
  render();
});
addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); playPause(); }
  if (e.code === 'ArrowLeft') document.getElementById('bPrev').click();
  if (e.code === 'ArrowRight') document.getElementById('bNext').click();
});

/* scrubber */
const scrub = document.getElementById('scrub');
let marks = '', acc = 0;
SCENES.slice(0, -1).forEach(sc => {
  acc += sc.dur;
  marks += `<div class="mark" style="left:${acc / TOTAL * 100}%"></div>`;
});
scrub.insertAdjacentHTML('beforeend', marks);
function scrubTo(x){
  const r = scrub.getBoundingClientRect();
  frame = Math.round(clamp((x - r.left) / r.width, 0, 1) * (TOTAL - 1));
  render();
}
let scrubbing = false;
scrub.addEventListener('pointerdown', e => { scrubbing = true; playing = false; updatePlayBtn(); scrubTo(e.clientX); });
addEventListener('pointermove', e => { if (scrubbing) scrubTo(e.clientX); });
addEventListener('pointerup', () => scrubbing = false);

/* ============================================================
   MUSIC · original clip-clop hoedown. G major, 140 BPM.
   Coconut-shell percussion + jaunty square lead.
   ============================================================ */
const Music = (() => {
  let ctx = null, master = null, timer = null, step = 0, nextT = 0;
  let enabled = true;
  const BPM = 140, SPB = 60 / BPM / 2;
  const N = (name) => {
    const m = /^([A-G]#?)(\d)$/.exec(name);
    const idx = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'].indexOf(m[1]);
    return 440 * Math.pow(2, (idx - 9) / 12 + (m[2] - 4));
  };
  const BASS = [
    'G2','','D2','','G2','','D2','',  'C3','','G2','','D2','','D2','',
    'G2','','D2','','G2','','D2','',  'C3','','D3','','G2','','G2','',
    'G2','','D2','','G2','','D2','',  'C3','','G2','','D2','','D2','',
    'E2','','A2','','C3','','D3','',  'G2','','D2','','G2','','','',
  ];
  const LEAD = [
    'G4','A4','B4','G4','D5','','B4','G4',  'C5','B4','A4','','D4','','A4','',
    'G4','A4','B4','G4','D5','','B4','D5',  'E5','D5','C5','B4','A4','','G4','',
    'B4','','D5','B4','G5','','D5','B4',    'C5','D5','E5','C5','A4','','F#4','',
    'G4','B4','D5','G5','E5','C5','A4','F#4','G4','','B4','','G4','','','',
  ];
  function ensure(){
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = .13;
    const dc = ctx.createDynamicsCompressor();
    master.connect(dc); dc.connect(ctx.destination);
  }
  function osc(type, freq, t, dur, vol, detune = 0){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; o.detune.value = detune;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + .02);
  }
  function clop(t, hi){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(hi ? 1100 : 720, t);
    o.frequency.exponentialRampToValueAtTime(hi ? 700 : 460, t + .035);
    g.gain.setValueAtTime(.5, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .05);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + .07);
  }
  function scheduleStep(i, t){
    const b = BASS[i % 64];
    if (b) osc('triangle', N(b), t, SPB * 1.6, .34);
    const l = LEAD[i % 64];
    if (l){
      osc('square', N(l), t, SPB * .95, .11);
      osc('square', N(l), t, SPB * .95, .07, 8);
    }
    const s8 = i % 8;
    if (s8 === 0 || s8 === 3 || s8 === 4 || s8 === 7) clop(t, s8 === 3 || s8 === 7);
  }
  function tickSched(){
    while (nextT < ctx.currentTime + .12){
      scheduleStep(step, nextT);
      step++; nextT += SPB;
    }
  }
  return {
    start(){
      if (!enabled) return;
      ensure(); ctx.resume();
      if (!timer){ nextT = ctx.currentTime + .05; timer = setInterval(tickSched, 25); }
    },
    stop(){ if (timer){ clearInterval(timer); timer = null; } if (ctx) ctx.suspend(); },
    toggle(){
      enabled = !enabled;
      if (!enabled) this.stop();
      else if (playing) this.start();
      document.getElementById('bMusic').textContent = enabled ? '♫ On' : '♫ Off';
    },
  };
})();
document.getElementById('bMusic').addEventListener('click', () => Music.toggle());

/* prefetch every exhibit */
[...new Set(SCENES.map(s => s.photo).filter(Boolean))].forEach(wikiFetch);

/* tap to start */
document.getElementById('tapstart').addEventListener('click', () => {
  document.getElementById('tapstart').classList.add('hide');
  frame = 0; playing = true; rafLast = 0; updatePlayBtn();
  Music.start();
});
comp.addEventListener('click', playPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) Music.stop(); else if (playing) Music.start(); });

sizeComp();
render();
</script>
