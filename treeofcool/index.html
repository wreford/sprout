<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1410">
<meta name="description" content="Tree of Cool — browse the entire tree of life, from Life itself down to a single lion. Real taxonomy, real photos, one coolness rating per creature.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a1410'/%3E%3Cpath d='M16 27 v-9' stroke='%238a6a4a' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='12' r='8' fill='%234ee39a'/%3E%3Ccircle cx='10' cy='15' r='4' fill='%233ecf88'/%3E%3Ccircle cx='22' cy='14' r='4.5' fill='%2360f0aa'/%3E%3C/svg%3E">
<title>Tree of Cool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800;9..144,900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1410; --bg2:#0f1d17; --panel:#132a20; --panel2:#193b2c; --line:#21402f;
  --ink:#eafff4; --dim:#9fc4b0; --dimmer:#6f9784;
  --glow:#4ee39a; --glow2:#60f0aa; --gold:#ffce54; --coral:#ff8a6b; --violet:#b79bff; --sky:#6fd0ff;
  --disp:'Fraunces',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
body{
  min-height:100dvh;overflow-x:hidden;
  background:
    radial-gradient(120vw 60vh at 50% -10%,rgba(78,227,154,.10),transparent 60%),
    radial-gradient(80vw 40vh at 90% 20%,rgba(111,208,255,.06),transparent 60%),
    var(--bg)
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(78,227,154,.3)}

.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom) + 40px)}

/* header */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 60%,rgba(10,20,16,.75));
  backdrop-filter:blur(10px);padding:14px 0 10px;margin-bottom:6px}
.top-in{max-width:640px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand .logo{width:34px;height:34px;flex-shrink:0}
.brand h1{font-family:var(--disp);font-weight:900;font-size:23px;letter-spacing:-.01em;line-height:1}
.brand h1 .c{color:var(--glow)}
.brand .tag{font-size:9px;letter-spacing:.24em;color:var(--dimmer);text-transform:uppercase;margin-top:3px}
.searchrow{display:flex;gap:8px}
.searchbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 12px;transition:border-color .16s}
.searchbox:focus-within{border-color:var(--glow)}
.searchbox input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-family:var(--mono);font-size:14px}
.searchbox input::placeholder{color:var(--dimmer)}
.searchbox .ic{color:var(--dim)}
.dice{width:44px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;font-size:19px;transition:transform .12s,border-color .16s}
.dice:active{transform:scale(.9)}
.dice:hover{border-color:var(--glow)}

/* breadcrumb */
.crumbs{display:flex;gap:5px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{flex-shrink:0;font-size:10.5px;letter-spacing:.04em;color:var(--dim);background:var(--panel);border:1px solid var(--line);
  padding:5px 10px;border-radius:8px;white-space:nowrap;transition:all .14s}
.crumb:hover{color:var(--ink);border-color:var(--dimmer)}
.crumb.here{color:var(--bg);background:var(--glow);border-color:var(--glow);font-weight:700}
.crumb .r{opacity:.6;font-size:9px}
.crumb-sep{flex-shrink:0;color:var(--dimmer);align-self:center;font-size:11px}

/* hero */
.hero{margin-top:12px;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
  border-radius:20px;overflow:hidden;position:relative;animation:rise .4s var(--e,ease) both}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
.hero .imgbox{position:relative;height:230px;background:var(--bg2);overflow:hidden}
.hero .imgbox img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.13) translateY(-2%)}}
.hero .imgbox::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,20,16,.92))}
.hero .noimg{height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dimmer);background:
  radial-gradient(60% 60% at 50% 40%,rgba(78,227,154,.12),transparent)}
.hero .noimg svg{width:70px;opacity:.6}
.hero .rankchip{position:absolute;top:12px;left:12px;z-index:2;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  font-weight:700;color:var(--bg);background:var(--rc,var(--glow));padding:4px 11px;border-radius:20px}
.hero .body{padding:4px 18px 20px;position:relative;z-index:2;margin-top:-46px}
.hero .common{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1.02;letter-spacing:-.02em;text-transform:capitalize}
.hero .sci{font-style:italic;font-family:var(--disp);font-weight:600;font-size:15px;color:var(--glow2);margin-top:3px}
.hero .blurb{font-size:12.5px;line-height:1.7;color:var(--dim);margin-top:12px}
.hero .wikilink{display:inline-block;margin-top:10px;font-size:10.5px;letter-spacing:.08em;color:var(--sky);text-decoration:none;border-bottom:1px solid transparent}
.hero .wikilink:hover{border-color:var(--sky)}

/* cool meter */
.cool{display:flex;align-items:center;gap:10px;margin-top:14px}
.cool .lbl{font-size:9px;letter-spacing:.2em;color:var(--dimmer);text-transform:uppercase}
.cool .bar{flex:1;height:9px;background:#0c1a13;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.cool .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--sky),var(--glow),var(--gold));width:0;transition:width .7s cubic-bezier(.16,1,.3,1)}
.cool .score{font-family:var(--disp);font-weight:900;font-size:19px;min-width:2.6em;text-align:right}
.cool .score b{color:var(--gold)}
.coolverdict{font-size:11px;color:var(--dim);margin-top:6px;font-style:italic}
.coolverdict b{color:var(--gold);font-style:normal}

/* branches */
.section-h{display:flex;align-items:baseline;gap:8px;margin:22px 4px 12px}
.section-h h2{font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:-.01em}
.section-h .n{font-size:10px;color:var(--dimmer)}
.section-h .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.branches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.branch{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:12px 13px;transition:transform .14s,border-color .16s,background .16s;overflow:hidden}
.branch::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bc,var(--glow));opacity:.7;transition:opacity .16s}
.branch:hover{transform:translateY(-2px);border-color:var(--bc,var(--glow));background:var(--panel2)}
.branch:hover::before{opacity:1}
.branch:active{transform:scale(.98)}
.branch .r{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bc,var(--glow));font-weight:700}
.branch .cn{font-family:var(--disp);font-weight:800;font-size:16px;line-height:1.1;margin-top:4px;text-transform:capitalize}
.branch .sc{font-style:italic;font-size:10.5px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.branch .go{position:absolute;right:10px;bottom:10px;font-size:13px;color:var(--dimmer)}
.branch.leaf .go{color:var(--gold)}

.msg{text-align:center;color:var(--dim);font-size:12px;padding:26px 16px;line-height:1.8}
.msg .spin{display:inline-block;font-size:26px;animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;
  animation:sk 1.1s infinite;border-radius:13px;height:66px}
@keyframes sk{to{background-position:-200% 0}}

/* search results dropdown */
#results{margin-top:8px;display:none;flex-direction:column;gap:6px}
#results.on{display:flex}
.res{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 13px;transition:border-color .14s,background .14s}
.res:hover{border-color:var(--glow);background:var(--panel2)}
.res .cn{font-family:var(--disp);font-weight:800;font-size:15px;text-transform:capitalize}
.res .sc{font-style:italic;font-size:11px;color:var(--dim)}
.res .r{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--glow);font-weight:700}

footer{text-align:center;font-size:10px;color:var(--dimmer);letter-spacing:.1em;margin-top:34px;line-height:2}
footer a{color:var(--dim);text-decoration:none}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40">
        <path d="M20 38 v-13" stroke="#8a6a4a" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M20 30 l-7 -5 M20 27 l8 -6" stroke="#8a6a4a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="20" cy="15" r="10" fill="#4ee39a"/>
        <circle cx="11" cy="19" r="5.5" fill="#3ecf88"/>
        <circle cx="29" cy="17" r="6.5" fill="#60f0aa"/>
        <circle cx="20" cy="9" r="5" fill="#7dffbf"/>
      </svg>
      <div>
        <h1>Tree of <span class="c">Cool</span></h1>
        <div class="tag">every living thing · ranked for cool</div>
      </div>
    </div>
    <div class="searchrow">
      <label class="searchbox">
        <span class="ic">⌕</span>
        <input id="search" placeholder="search any creature… (lion, oak, tardigrade)" autocomplete="off" enterkeyhint="search">
      </label>
      <button class="dice" id="dice" title="surprise me">🎲</button>
    </div>
    <div id="results"></div>
  </div>
</div>

<div class="wrap">
  <div class="crumbs" id="crumbs"></div>
  <div id="stage"></div>
  <footer>
    branches: <a href="https://gbif.org" target="_blank" rel="noopener">GBIF</a> taxonomic backbone ·
    photos + facts: <a href="https://wikipedia.org" target="_blank" rel="noopener">Wikipedia</a><br>
    coolness ratings are legally binding
  </footer>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const GBIF = 'https://api.gbif.org/v1';
const BACKBONE = 'd7dddbf4-2cf0-4f39-9b2a-bb099caae36c';

/* ── the root + kingdoms (real GBIF backbone keys) ── */
const LIFE = { key: 0, canonical: 'Life', vernacular: 'All living things', rank: 'LIFE' };
const KINGDOMS = [
  { key: 1, canonical: 'Animalia', vernacular: 'Animals', rank: 'KINGDOM' },
  { key: 6, canonical: 'Plantae', vernacular: 'Plants', rank: 'KINGDOM' },
  { key: 5, canonical: 'Fungi', vernacular: 'Fungi', rank: 'KINGDOM' },
  { key: 3, canonical: 'Bacteria', vernacular: 'Bacteria', rank: 'KINGDOM' },
  { key: 2, canonical: 'Archaea', vernacular: 'Archaea', rank: 'KINGDOM' },
  { key: 4, canonical: 'Chromista', vernacular: 'Chromists', rank: 'KINGDOM' },
  { key: 7, canonical: 'Protozoa', vernacular: 'Protozoans', rank: 'KINGDOM' },
];

/* ── offline fallback: one gloriously cool path, self-consistent ── */
const FALLBACK = {
  '1': [
    { key: 'fb-chordata', canonical: 'Chordata', vernacular: 'Vertebrates & kin', rank: 'PHYLUM' },
    { key: 'fb-arthropoda', canonical: 'Arthropoda', vernacular: 'Insects, spiders, crabs', rank: 'PHYLUM' },
    { key: 'fb-mollusca', canonical: 'Mollusca', vernacular: 'Molluscs', rank: 'PHYLUM' },
    { key: 'fb-cnidaria', canonical: 'Cnidaria', vernacular: 'Jellyfish & corals', rank: 'PHYLUM' },
  ],
  'fb-chordata': [
    { key: 'fb-mammalia', canonical: 'Mammalia', vernacular: 'Mammals', rank: 'CLASS' },
    { key: 'fb-aves', canonical: 'Aves', vernacular: 'Birds', rank: 'CLASS' },
    { key: 'fb-reptilia', canonical: 'Reptilia', vernacular: 'Reptiles', rank: 'CLASS' },
    { key: 'fb-actino', canonical: 'Actinopterygii', vernacular: 'Ray-finned fish', rank: 'CLASS' },
  ],
  'fb-mammalia': [
    { key: 'fb-carnivora', canonical: 'Carnivora', vernacular: 'Carnivores', rank: 'ORDER' },
    { key: 'fb-primates', canonical: 'Primates', vernacular: 'Primates', rank: 'ORDER' },
    { key: 'fb-cetacea', canonical: 'Cetacea', vernacular: 'Whales & dolphins', rank: 'ORDER' },
  ],
  'fb-carnivora': [
    { key: 'fb-felidae', canonical: 'Felidae', vernacular: 'Cats', rank: 'FAMILY' },
    { key: 'fb-canidae', canonical: 'Canidae', vernacular: 'Dogs & foxes', rank: 'FAMILY' },
    { key: 'fb-ursidae', canonical: 'Ursidae', vernacular: 'Bears', rank: 'FAMILY' },
  ],
  'fb-felidae': [
    { key: 'fb-panthera', canonical: 'Panthera', vernacular: 'Big cats', rank: 'GENUS' },
    { key: 'fb-felis', canonical: 'Felis', vernacular: 'Small cats', rank: 'GENUS' },
  ],
  'fb-panthera': [
    { key: 'fb-lion', canonical: 'Panthera leo', vernacular: 'Lion', rank: 'SPECIES' },
    { key: 'fb-tiger', canonical: 'Panthera tigris', vernacular: 'Tiger', rank: 'SPECIES' },
    { key: 'fb-leopard', canonical: 'Panthera pardus', vernacular: 'Leopard', rank: 'SPECIES' },
    { key: 'fb-jaguar', canonical: 'Panthera onca', vernacular: 'Jaguar', rank: 'SPECIES' },
  ],
};
const FB_SURPRISE = ['Lion', 'Tardigrade', 'Axolotl', 'Octopus', 'Platypus', 'Mantis shrimp', 'Pangolin', 'Narwhal'];

/* ── rank colours ── */
const RANK_C = {
  LIFE: '#7dffbf', KINGDOM: '#4ee39a', PHYLUM: '#6fd0ff', CLASS: '#b79bff',
  ORDER: '#ffce54', FAMILY: '#ff8a6b', GENUS: '#ff6ba8', SPECIES: '#ffce54',
  SUBSPECIES: '#ffce54', DEFAULT: '#9fc4b0',
};
const rankC = r => RANK_C[(r || '').toUpperCase()] || RANK_C.DEFAULT;
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

/* ── coolness · deterministic, biased upward (it's the tree of COOL) ── */
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0); }
function coolOf(node){
  const base = hashStr((node.canonical || '') + (node.vernacular || ''));
  let score = 6.0 + (base % 400) / 100;            /* 6.0 – 9.99 */
  const nm = ((node.vernacular || '') + ' ' + (node.canonical || '')).toLowerCase();
  if (/octopus|shrimp|tardigrade|axolotl|dragon|shark|wolf|tiger|lion|eagle|raven|mantis|narwhal|platypus|pangolin/.test(nm)) score = 9.4 + (base % 60) / 100;
  if (node.rank === 'SPECIES') score = Math.min(10, score + .4);
  return Math.round(Math.min(10, score) * 10) / 10;
}
const COOL_TIERS = [
  [9.6, 'Dangerously cool', 'Scientists gasped.'],
  [9.0, 'Extremely cool', 'Would put on a poster.'],
  [8.2, 'Very cool', 'Objectively excellent.'],
  [7.4, 'Pretty cool', 'Solid. Respectable.'],
  [0, 'Quietly cool', 'Underrated. We stan.'],
];
function coolVerdict(s){ for (const [t, label, note] of COOL_TIERS) if (s >= t) return { label, note }; }

/* ── state ── */
let path = [LIFE];
let reqToken = 0;

/* ── data fetch ── */
async function getChildren(node){
  const key = node.key;
  if (key === 0) return KINGDOMS.slice();
  if (typeof key === 'string' && key.startsWith('fb-')) return (FALLBACK[key] || []).slice();
  try {
    const r = await fetch(`${GBIF}/species/${key}/children?limit=100&offset=0`);
    if (!r.ok) throw 0;
    const j = await r.json();
    const seen = new Set();
    const kids = (j.results || [])
      .filter(x => x.rank && x.canonicalName && x.taxonomicStatus === 'ACCEPTED')
      .map(x => ({ key: x.key, canonical: x.canonicalName, vernacular: x.vernacularName || '', rank: x.rank }))
      .filter(x => { const k = x.canonical.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => a.canonical.localeCompare(b.canonical));
    return kids;
  } catch (e){
    return FALLBACK[String(key)] || null;   // null = truly offline w/ no fallback
  }
}
async function wikiEnrich(node){
  const cands = [];
  if (node.vernacular && !/^All living/.test(node.vernacular)) cands.push(node.vernacular);
  if (node.canonical) cands.push(node.canonical);
  for (const c of cands){
    try {
      const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(c.replace(/ /g, '_')));
      if (!r.ok) continue;
      const j = await r.json();
      if (j.type === 'disambiguation') continue;
      const img = (j.thumbnail && j.thumbnail.source) || (j.originalimage && j.originalimage.source);
      if (j.extract) return { img, extract: j.extract, url: j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page };
    } catch (e){}
  }
  return null;
}

/* ── render ── */
function renderCrumbs(){
  const c = $('crumbs');
  c.innerHTML = path.map((n, i) => {
    const here = i === path.length - 1;
    const label = i === 0 ? 'Life' : cap(n.vernacular || n.canonical);
    return `<button class="crumb ${here ? 'here' : ''}" data-i="${i}">${label}</button>`
      + (here ? '' : '<span class="crumb-sep">›</span>');
  }).join('');
  c.querySelectorAll('.crumb').forEach(b => b.addEventListener('click', () => { path = path.slice(0, +b.dataset.i + 1); go(); }));
  c.scrollLeft = c.scrollWidth;
}

function heroSkeleton(node){
  const rc = rankC(node.rank);
  const nm = cap(node.vernacular || node.canonical);
  return `<div class="hero" style="--rc:${rc}">
    <div class="noimg"><div class="spin">🌿</div></div>
    <div class="body">
      <div class="common">${nm}</div>
      <div class="sci">${node.canonical || ''}</div>
      <div class="blurb" style="opacity:.5">summoning facts from the archives…</div>
    </div>
  </div>`;
}

function renderHero(node, wiki){
  const rc = rankC(node.rank);
  const cool = coolOf(node);
  const v = coolVerdict(cool);
  const nm = cap(node.vernacular || node.canonical);
  const showSci = node.canonical && node.canonical.toLowerCase() !== (node.vernacular || '').toLowerCase();
  const imgHtml = wiki && wiki.img
    ? `<div class="imgbox"><img src="${wiki.img}" alt=""></div>`
    : `<div class="noimg"><svg viewBox="0 0 40 40"><circle cx="20" cy="16" r="11" fill="#193b2c"/><circle cx="11" cy="20" r="6" fill="#132a20"/><circle cx="29" cy="18" r="7" fill="#193b2c"/><path d="M20 38 v-12" stroke="#21402f" stroke-width="4" stroke-linecap="round"/></svg><div style="font-size:11px">no photo on file · picture it in your mind</div></div>`;
  const blurb = wiki && wiki.extract ? wiki.extract
    : (node.key === 0 ? 'Everything that has ever lived shares one ancestor. This is the whole family tree. Start scrolling down through the kingdoms.' : 'Tap a branch below to keep climbing down the tree.');
  return `<div class="hero" style="--rc:${rc}">
    <div class="rankchip">${node.rank || 'TAXON'}</div>
    ${imgHtml}
    <div class="body">
      <div class="common">${nm}</div>
      ${showSci ? `<div class="sci">${node.canonical}</div>` : ''}
      <div class="cool">
        <span class="lbl">Cool</span>
        <div class="bar"><div class="fill" id="coolFill"></div></div>
        <span class="score"><b>${cool}</b>/10</span>
      </div>
      <div class="coolverdict"><b>${v.label}.</b> ${v.note}</div>
      <div class="blurb">${blurb}</div>
      ${wiki && wiki.url ? `<a class="wikilink" href="${wiki.url}" target="_blank" rel="noopener">Read on Wikipedia ↗</a>` : ''}
    </div>
  </div>`;
}

function renderBranches(node, kids){
  const rankName = { LIFE: 'Kingdoms', KINGDOM: 'Phyla', PHYLUM: 'Classes', CLASS: 'Orders', ORDER: 'Families', FAMILY: 'Genera', GENUS: 'Species' }[node.rank] || 'Branches';
  if (kids === null){
    return `<div class="msg">🛰️ Couldn't reach the tree right now.<br>Check your connection, or try 🎲 for an offline creature.</div>`;
  }
  if (!kids.length){
    return `<div class="section-h"><h2>End of the line</h2><span class="rule"></span></div>
      <div class="msg">🍃 This is a tip of the tree — no branches below.<br>You made it all the way down. Iconic.</div>`;
  }
  return `<div class="section-h"><h2>${rankName}</h2><span class="n">${kids.length}</span><span class="rule"></span></div>
    <div class="branches">${kids.map((k, i) => {
      const bc = rankC(k.rank);
      const leaf = k.rank === 'SPECIES' || k.rank === 'SUBSPECIES';
      const nm = cap(k.vernacular || k.canonical);
      const showSci = k.canonical && k.canonical.toLowerCase() !== (k.vernacular || '').toLowerCase();
      return `<button class="branch ${leaf ? 'leaf' : ''}" data-k="${i}" style="--bc:${bc}">
        <div class="r">${k.rank}</div>
        <div class="cn">${nm}</div>
        ${showSci ? `<div class="sc">${k.canonical}</div>` : '<div class="sc" style="opacity:.4">—</div>'}
        <div class="go">${leaf ? '★' : '↓'}</div>
      </button>`;
    }).join('')}</div>`;
}

async function go(){
  const node = path[path.length - 1];
  const token = ++reqToken;
  renderCrumbs();
  $('stage').innerHTML = heroSkeleton(node) + `<div class="section-h"><h2>Branches</h2><span class="rule"></span></div>
    <div class="branches">${Array.from({ length: 6 }, () => '<div class="skel"></div>').join('')}</div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  const [wiki, kids] = await Promise.all([wikiEnrich(node), getChildren(node)]);
  if (token !== reqToken) return;   // superseded

  $('stage').innerHTML = renderHero(node, wiki) + renderBranches(node, kids);
  requestAnimationFrame(() => { const f = $('coolFill'); if (f) f.style.width = (coolOf(node) * 10) + '%'; });

  $('stage').querySelectorAll('.branch').forEach(b => b.addEventListener('click', () => {
    const k = (kids || [])[+b.dataset.k];
    if (k){ path.push(k); go(); }
  }));
}

/* ── search ── */
let searchTimer = null;
async function doSearch(q){
  const box = $('results');
  if (!q || q.length < 2){ box.classList.remove('on'); box.innerHTML = ''; return; }
  try {
    const r = await fetch(`${GBIF}/species/search?q=${encodeURIComponent(q)}&datasetKey=${BACKBONE}&status=ACCEPTED&limit=10&rank=SPECIES&rank=GENUS&rank=FAMILY&rank=ORDER&rank=CLASS&rank=PHYLUM&rank=KINGDOM`);
    const j = await r.json();
    const seen = new Set();
    const hits = (j.results || [])
      .filter(x => x.canonicalName && x.rank && x.key)
      .filter(x => { const k = x.canonicalName.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; })
      .slice(0, 8);
    if (!hits.length){ box.innerHTML = `<div class="res" style="cursor:default"><div class="sc">no matches — try a common name</div></div>`; box.classList.add('on'); return; }
    box.innerHTML = hits.map((x, i) => `<button class="res" data-i="${i}">
      <div class="r" style="color:${rankC(x.rank)}">${x.rank}</div>
      <div class="cn">${cap(x.vernacularName || x.canonicalName)}</div>
      <div class="sc">${x.canonicalName}</div>
    </button>`).join('');
    box.classList.add('on');
    box.querySelectorAll('.res').forEach((b, i) => b.dataset.i && b.addEventListener('click', () => jumpTo(hits[i])));
  } catch (e){
    box.innerHTML = `<div class="res" style="cursor:default"><div class="sc">search needs a connection · try 🎲</div></div>`;
    box.classList.add('on');
  }
}
async function jumpTo(hit){
  $('results').classList.remove('on');
  $('search').value = '';
  $('search').blur();
  const node = { key: hit.key, canonical: hit.canonicalName, vernacular: hit.vernacularName || '', rank: hit.rank };
  /* build ancestry from GBIF parents */
  let anc = [];
  try {
    const r = await fetch(`${GBIF}/species/${hit.key}/parents`);
    if (r.ok){
      const j = await r.json();
      anc = (j || []).map(x => ({ key: x.key, canonical: x.canonicalName, vernacular: x.vernacularName || '', rank: x.rank }));
    }
  } catch (e){}
  path = [LIFE, ...anc, node];
  go();
}

$('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  searchTimer = setTimeout(() => doSearch(q), 260);
});
document.addEventListener('click', e => {
  if (!e.target.closest('.searchrow') && !e.target.closest('#results')) $('results').classList.remove('on');
});

/* ── surprise me ── */
async function surprise(){
  $('dice').style.transform = 'rotate(360deg) scale(1.1)';
  setTimeout(() => $('dice').style.transform = '', 300);
  try {
    const r = await fetch(`${GBIF}/species/search?rank=SPECIES&status=ACCEPTED&datasetKey=${BACKBONE}&highertaxonKey=1&limit=1&offset=${(Math.random() * 4000) | 0}`);
    const j = await r.json();
    const x = (j.results || []).find(y => y.canonicalName && y.key);
    if (x){ jumpTo(x); return; }
    throw 0;
  } catch (e){
    /* offline: pick a beloved creature by name search of fallback favourites */
    const name = FB_SURPRISE[(Math.random() * FB_SURPRISE.length) | 0];
    doSearch(name);
    $('search').value = name;
    $('search').focus();
  }
}
$('dice').addEventListener('click', surprise);

go();
</script>
