<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05100b">
<meta name="description" content="Tree of Cool — a living graph of the tree of life. Orbit from Life itself down to a single lion, photo by photo, one coolness rating at a time.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2305100b'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%234ee39a'/%3E%3Ccircle cx='7' cy='11' r='3' fill='%2360f0aa'/%3E%3Ccircle cx='25' cy='12' r='3.4' fill='%236fd0ff'/%3E%3Ccircle cx='23' cy='24' r='3' fill='%23ffce54'/%3E%3Cpath d='M16 16 L7 11 M16 16 L25 12 M16 16 L23 24' stroke='%234ee39a' stroke-width='1.2' opacity='.5'/%3E%3C/svg%3E">
<title>Tree of Cool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800;9..144,900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05100b; --bg2:#081a12; --panel:#0f2519; --panel2:#16341f; --line:#1e3d2b;
  --ink:#eafff4; --dim:#9fc4b0; --dimmer:#6f9784;
  --glow:#4ee39a; --glow2:#60f0aa; --gold:#ffce54; --coral:#ff8a6b; --violet:#b79bff; --sky:#6fd0ff; --pink:#ff6ba8;
  --disp:'Fraunces',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(78,227,154,.3)}

/* deep-space bioluminescent backdrop */
#bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(90vw 60vh at 50% 8%,rgba(78,227,154,.14),transparent 60%),
  radial-gradient(70vw 50vh at 85% 90%,rgba(111,208,255,.09),transparent 60%),
  radial-gradient(60vw 40vh at 12% 70%,rgba(183,155,255,.07),transparent 60%),
  var(--bg)}
#bg::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(1.4px 1.4px at 20% 30%,rgba(255,255,255,.5),transparent),
    radial-gradient(1.2px 1.2px at 70% 60%,rgba(180,255,220,.5),transparent),
    radial-gradient(1px 1px at 45% 80%,rgba(255,255,255,.4),transparent),
    radial-gradient(1.3px 1.3px at 88% 22%,rgba(160,220,255,.5),transparent),
    radial-gradient(1px 1px at 30% 55%,rgba(255,255,255,.35),transparent);
  background-size:100% 100%}

#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column}

/* top */
.top{padding:calc(env(safe-area-inset-top) + 12px) 14px 8px;z-index:20}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.brand .lg{width:30px;height:30px;flex-shrink:0}
.brand h1{font-family:var(--disp);font-weight:900;font-size:20px;letter-spacing:-.01em;line-height:1}
.brand h1 .c{color:var(--glow)}
.brand .tag{font-size:8.5px;letter-spacing:.22em;color:var(--dimmer);text-transform:uppercase;margin-top:2px}
.searchrow{display:flex;gap:8px}
.searchbox{flex:1;display:flex;align-items:center;gap:8px;background:rgba(15,37,25,.7);border:1px solid var(--line);border-radius:12px;padding:9px 12px;backdrop-filter:blur(8px);transition:border-color .16s}
.searchbox:focus-within{border-color:var(--glow)}
.searchbox input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-family:var(--mono);font-size:14px}
.searchbox input::placeholder{color:var(--dimmer)}
.searchbox .ic{color:var(--dim)}
.dice{width:46px;flex-shrink:0;background:rgba(15,37,25,.7);border:1px solid var(--line);border-radius:12px;font-size:19px;backdrop-filter:blur(8px);transition:transform .3s,border-color .16s}
.dice:hover{border-color:var(--glow)}
.dice.spin{animation:diceSpin .6s linear infinite;border-color:var(--gold)}
@keyframes diceSpin{to{transform:rotate(360deg)}}
#results{margin-top:8px;display:none;flex-direction:column;gap:6px;max-height:44vh;overflow:auto}
#results.on{display:flex}
.res{text-align:left;background:rgba(15,37,25,.85);border:1px solid var(--line);border-radius:11px;padding:9px 12px;backdrop-filter:blur(8px);transition:border-color .14s}
.res:hover{border-color:var(--glow)}
.res .cn{font-family:var(--disp);font-weight:800;font-size:14px;text-transform:capitalize}
.res .sc{font-style:italic;font-size:10.5px;color:var(--dim)}
.res .r{font-size:8px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}

.crumbs{display:flex;gap:5px;overflow-x:auto;padding:0 14px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;z-index:20}
.crumbs::-webkit-scrollbar{display:none}
.crumb{flex-shrink:0;font-size:10px;letter-spacing:.02em;color:var(--dim);background:rgba(15,37,25,.7);border:1px solid var(--line);
  padding:4px 9px;border-radius:8px;white-space:nowrap;backdrop-filter:blur(6px)}
.crumb.here{color:var(--bg);background:var(--glow);border-color:var(--glow);font-weight:700}
.crumb-sep{flex-shrink:0;color:var(--dimmer);align-self:center;font-size:11px}

/* ══ graph stage ══ */
#stage{position:relative;flex:1;overflow:hidden;min-height:0;cursor:grab}
#stage.drag{cursor:grabbing}
#world{position:absolute;inset:0;will-change:transform}
#links{position:absolute;inset:0;overflow:visible;pointer-events:none}
#links path{fill:none;stroke-linecap:round;filter:drop-shadow(0 0 3px currentColor)}
#nodes{position:absolute;inset:0}

.node{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;transform:translate(-50%,-50%);
  transition:opacity .3s,filter .2s}
.node .disc{border-radius:50%;background-size:cover;background-position:center top;position:relative;
  border:2.5px solid var(--nc,var(--glow));box-shadow:0 0 0 4px rgba(0,0,0,.35),0 0 22px -2px var(--nc,var(--glow));
  display:flex;align-items:center;justify-content:center;overflow:hidden;transition:transform .16s}
.node .disc .fb{font-family:var(--disp);font-weight:900;color:#eafff4;opacity:.9}
.node:active .disc{transform:scale(.93)}
.node .lbl{font-family:var(--disp);font-weight:800;font-size:12px;line-height:1;text-align:center;max-width:15ch;text-transform:capitalize;
  text-shadow:0 2px 8px rgba(0,0,0,.8)}
.node .rk{font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--nc,var(--glow));font-weight:700}
.node.child{animation:nodeIn .5s cubic-bezier(.2,1.2,.4,1) both}
@keyframes nodeIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.node.center .disc{border-width:3px;box-shadow:0 0 0 5px rgba(0,0,0,.4),0 0 42px -4px var(--nc,var(--glow));animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 5px rgba(0,0,0,.4),0 0 42px -4px var(--nc)}50%{box-shadow:0 0 0 5px rgba(0,0,0,.4),0 0 60px 2px var(--nc)}}
.node.center .lbl{font-size:17px}
.node.zoomTo{transition:left .34s cubic-bezier(.4,0,.2,1),top .34s cubic-bezier(.4,0,.2,1),transform .34s;z-index:6}
.node.faded{opacity:0;pointer-events:none}
.node.more .disc{background:rgba(15,37,25,.85);border-style:dashed;border-color:var(--dim)}
.node.more .disc .fb{font-size:15px;opacity:.85}

.moreBadge{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(8,26,18,.9);border:1px solid var(--line);
  border-radius:20px;padding:4px 12px;font-size:9px;color:var(--dim);letter-spacing:.06em;white-space:nowrap;z-index:9;display:none;backdrop-filter:blur(6px)}
.moreBadge.on{display:block}

#hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:9.5px;letter-spacing:.16em;color:var(--dimmer);text-transform:uppercase;pointer-events:none;z-index:8}

.loading{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:var(--dim);font-size:12px}
.loading .o{font-size:34px;animation:spin 1.3s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:var(--dim);font-size:12px;line-height:1.9;width:80%}

/* ══ bottom sheet ══ */
#sheet{z-index:15;background:linear-gradient(180deg,rgba(8,26,18,.4),rgba(5,16,11,.94));backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
  transition:transform .3s}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h .rankchip{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--bg);background:var(--sc,var(--glow));padding:3px 9px;border-radius:12px}
.sheet-h .common{font-family:var(--disp);font-weight:900;font-size:20px;letter-spacing:-.01em;line-height:1;text-transform:capitalize;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h .sci{font-style:italic;font-family:var(--disp);font-weight:600;font-size:12px;color:var(--glow2)}
.cool{display:flex;align-items:center;gap:9px;margin-top:9px}
.cool .lbl{font-size:8.5px;letter-spacing:.18em;color:var(--dimmer);text-transform:uppercase}
.cool .bar{flex:1;height:8px;background:#0a1a11;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.cool .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--sky),var(--glow),var(--gold));width:0;transition:width .7s cubic-bezier(.16,1,.3,1)}
.cool .score{font-family:var(--disp);font-weight:900;font-size:17px;min-width:2.4em;text-align:right}
.cool .score b{color:var(--gold)}
.verdict{font-size:11px;color:var(--dim);margin-top:5px;font-style:italic}
.verdict b{color:var(--gold);font-style:normal}
.blurb{font-size:11.5px;line-height:1.6;color:var(--dim);margin-top:9px;max-height:5.4em;overflow:auto}
.wikilink{display:inline-block;margin-top:8px;font-size:10px;letter-spacing:.06em;color:var(--sky);text-decoration:none;border-bottom:1px solid transparent}
.wikilink:hover{border-color:var(--sky)}
</style>
</head>
<body>
<div id="bg"></div>

<div id="app">
  <div class="top">
    <div class="brand">
      <svg class="lg" viewBox="0 0 40 40">
        <path d="M20 20 L8 12 M20 20 L32 13 M20 20 L30 32 M20 20 L11 31" stroke="#4ee39a" stroke-width="1.6" opacity=".55"/>
        <circle cx="20" cy="20" r="9" fill="#4ee39a"/>
        <circle cx="8" cy="12" r="4" fill="#60f0aa"/>
        <circle cx="32" cy="13" r="4.5" fill="#6fd0ff"/>
        <circle cx="30" cy="32" r="4" fill="#ffce54"/>
        <circle cx="11" cy="31" r="3.4" fill="#b79bff"/>
      </svg>
      <div>
        <h1>Tree of <span class="c">Cool</span></h1>
        <div class="tag">a living graph of everything alive</div>
      </div>
    </div>
    <div class="searchrow">
      <label class="searchbox"><span class="ic">⌕</span>
        <input id="search" placeholder="find a creature… (lion, oak, tardigrade)" autocomplete="off" enterkeyhint="search"></label>
      <button class="dice" id="dice" title="surprise me (with a photo)">🎲</button>
    </div>
    <div id="results"></div>
  </div>
  <div class="crumbs" id="crumbs"></div>

  <div id="stage">
    <div id="world">
      <svg id="links"></svg>
      <div id="nodes"></div>
    </div>
    <div class="moreBadge" id="moreBadge"></div>
    <div id="hint">tap a node to dive · drag to roam</div>
  </div>

  <div id="sheet"></div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const GBIF = 'https://api.gbif.org/v1';
const BACKBONE = 'd7dddbf4-2cf0-4f39-9b2a-bb099caae36c';

const LIFE = { key: 0, canonical: 'Life', vernacular: 'All living things', rank: 'LIFE' };
const KINGDOMS = [
  { key: 1, canonical: 'Animalia', vernacular: 'Animals', rank: 'KINGDOM' },
  { key: 6, canonical: 'Plantae', vernacular: 'Plants', rank: 'KINGDOM' },
  { key: 5, canonical: 'Fungi', vernacular: 'Fungi', rank: 'KINGDOM' },
  { key: 3, canonical: 'Bacteria', vernacular: 'Bacteria', rank: 'KINGDOM' },
  { key: 2, canonical: 'Archaea', vernacular: 'Archaea', rank: 'KINGDOM' },
  { key: 4, canonical: 'Chromista', vernacular: 'Chromists', rank: 'KINGDOM' },
  { key: 7, canonical: 'Protozoa', vernacular: 'Protozoans', rank: 'KINGDOM' },
];
const FALLBACK = {
  '1': [
    { key: 'fb-chordata', canonical: 'Chordata', vernacular: 'Vertebrates & kin', rank: 'PHYLUM' },
    { key: 'fb-arthropoda', canonical: 'Arthropoda', vernacular: 'Insects, spiders, crabs', rank: 'PHYLUM' },
    { key: 'fb-mollusca', canonical: 'Mollusca', vernacular: 'Molluscs', rank: 'PHYLUM' },
    { key: 'fb-cnidaria', canonical: 'Cnidaria', vernacular: 'Jellyfish & corals', rank: 'PHYLUM' },
  ],
  'fb-chordata': [
    { key: 'fb-mammalia', canonical: 'Mammalia', vernacular: 'Mammals', rank: 'CLASS' },
    { key: 'fb-aves', canonical: 'Aves', vernacular: 'Birds', rank: 'CLASS' },
    { key: 'fb-reptilia', canonical: 'Reptilia', vernacular: 'Reptiles', rank: 'CLASS' },
    { key: 'fb-actino', canonical: 'Actinopterygii', vernacular: 'Ray-finned fish', rank: 'CLASS' },
  ],
  'fb-mammalia': [
    { key: 'fb-carnivora', canonical: 'Carnivora', vernacular: 'Carnivores', rank: 'ORDER' },
    { key: 'fb-primates', canonical: 'Primates', vernacular: 'Primates', rank: 'ORDER' },
    { key: 'fb-cetacea', canonical: 'Cetacea', vernacular: 'Whales & dolphins', rank: 'ORDER' },
  ],
  'fb-carnivora': [
    { key: 'fb-felidae', canonical: 'Felidae', vernacular: 'Cats', rank: 'FAMILY' },
    { key: 'fb-canidae', canonical: 'Canidae', vernacular: 'Dogs & foxes', rank: 'FAMILY' },
    { key: 'fb-ursidae', canonical: 'Ursidae', vernacular: 'Bears', rank: 'FAMILY' },
  ],
  'fb-felidae': [
    { key: 'fb-panthera', canonical: 'Panthera', vernacular: 'Big cats', rank: 'GENUS' },
    { key: 'fb-felis', canonical: 'Felis', vernacular: 'Small cats', rank: 'GENUS' },
  ],
  'fb-panthera': [
    { key: 'fb-lion', canonical: 'Panthera leo', vernacular: 'Lion', rank: 'SPECIES' },
    { key: 'fb-tiger', canonical: 'Panthera tigris', vernacular: 'Tiger', rank: 'SPECIES' },
    { key: 'fb-leopard', canonical: 'Panthera pardus', vernacular: 'Leopard', rank: 'SPECIES' },
    { key: 'fb-jaguar', canonical: 'Panthera onca', vernacular: 'Jaguar', rank: 'SPECIES' },
  ],
};

const RANK_C = { LIFE: '#7dffbf', KINGDOM: '#4ee39a', PHYLUM: '#6fd0ff', CLASS: '#b79bff', ORDER: '#ffce54', FAMILY: '#ff8a6b', GENUS: '#ff6ba8', SPECIES: '#ffce54', SUBSPECIES: '#ffce54', DEFAULT: '#9fc4b0' };
const rankC = r => RANK_C[(r || '').toUpperCase()] || RANK_C.DEFAULT;
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const nodeName = n => cap(n.vernacular && !/^All living/.test(n.vernacular) ? n.vernacular : n.canonical);
const initials = s => (s || '?').replace(/[^A-Za-z ]/g, '').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';

function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0); }
function coolOf(node){
  const base = hashStr((node.canonical || '') + (node.vernacular || ''));
  let score = 6.0 + (base % 400) / 100;
  const nm = ((node.vernacular || '') + ' ' + (node.canonical || '')).toLowerCase();
  if (/octopus|shrimp|tardigrade|axolotl|dragon|shark|wolf|tiger|lion|eagle|raven|mantis|narwhal|platypus|pangolin/.test(nm)) score = 9.4 + (base % 60) / 100;
  if (node.rank === 'SPECIES') score = Math.min(10, score + .4);
  return Math.round(Math.min(10, score) * 10) / 10;
}
const COOL_TIERS = [[9.6, 'Dangerously cool', 'Scientists gasped.'], [9.0, 'Extremely cool', 'Would put on a poster.'], [8.2, 'Very cool', 'Objectively excellent.'], [7.4, 'Pretty cool', 'Solid. Respectable.'], [0, 'Quietly cool', 'Underrated. We stan.']];
const coolVerdict = s => { for (const [t, label, note] of COOL_TIERS) if (s >= t) return { label, note }; };

/* ── image + data caches ── */
const thumbCache = {};   // title -> url | false
function fetchThumb(title){
  if (title in thumbCache) return Promise.resolve(thumbCache[title]);
  return fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')))
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      const src = j && ((j.thumbnail && j.thumbnail.source) || (j.originalimage && j.originalimage.source));
      thumbCache[title] = src || false;
      return thumbCache[title];
    }).catch(() => { thumbCache[title] = false; return false; });
}
async function nodeThumb(node){
  const cands = [node.canonical, node.vernacular].filter(x => x && !/^All living/.test(x));
  for (const c of cands){ const u = await fetchThumb(c); if (u) return u; }
  return false;
}
async function nodeData(node){   // full: image + blurb + url
  const cands = [];
  if (node.vernacular && !/^All living/.test(node.vernacular)) cands.push(node.vernacular);
  if (node.canonical) cands.push(node.canonical);
  for (const c of cands){
    try {
      const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(c.replace(/ /g, '_')));
      if (!r.ok) continue;
      const j = await r.json();
      if (j.type === 'disambiguation') continue;
      const img = (j.thumbnail && j.thumbnail.source) || (j.originalimage && j.originalimage.source);
      if (img) thumbCache[c] = img;
      if (j.extract) return { img, extract: j.extract, url: j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page };
    } catch (e){}
  }
  return null;
}
async function getChildren(node){
  const key = node.key;
  if (key === 0) return KINGDOMS.slice();
  if (typeof key === 'string' && key.startsWith('fb-')) return (FALLBACK[key] || []).slice();
  try {
    const r = await fetch(`${GBIF}/species/${key}/children?limit=100&offset=0`);
    if (!r.ok) throw 0;
    const j = await r.json();
    const seen = new Set();
    return (j.results || [])
      .filter(x => x.rank && x.canonicalName && x.taxonomicStatus === 'ACCEPTED')
      .map(x => ({ key: x.key, canonical: x.canonicalName, vernacular: x.vernacularName || '', rank: x.rank }))
      .filter(x => { const k = x.canonical.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => a.canonical.localeCompare(b.canonical));
  } catch (e){ return FALLBACK[String(key)] || null; }
}

/* ── state ── */
let path = [LIFE];
let reqToken = 0;
let curKids = null, page = 0;
const PER = 12;
let SW = 0, SH = 0, panX = 0, panY = 0;

function sizeStage(){ const r = $('stage').getBoundingClientRect(); SW = r.width; SH = r.height; }
addEventListener('resize', () => { sizeStage(); if (curKids !== undefined) layoutGraph(); });

/* ── crumbs ── */
function renderCrumbs(){
  const c = $('crumbs');
  c.innerHTML = path.map((n, i) => {
    const here = i === path.length - 1;
    const label = i === 0 ? 'Life' : nodeName(n);
    return `<button class="crumb ${here ? 'here' : ''}" data-i="${i}">${label}</button>` + (here ? '' : '<span class="crumb-sep">›</span>');
  }).join('');
  c.querySelectorAll('.crumb').forEach(b => b.addEventListener('click', () => { path = path.slice(0, +b.dataset.i + 1); go(); }));
  c.scrollLeft = c.scrollWidth;
}

/* ── graph render ── */
function discStyle(node, src){
  const nc = rankC(node.rank);
  return src ? `background-image:url('${src}')` : `background:radial-gradient(circle at 40% 35%,${nc}44,${nc}18 70%,#0a1a11)`;
}
function makeNode(node, cls, size, src){
  const nc = rankC(node.rank);
  const el = document.createElement('button');
  el.className = 'node ' + cls;
  el.style.setProperty('--nc', nc);
  const showRk = cls !== 'center';
  el.innerHTML = `<div class="disc" style="width:${size}px;height:${size}px;${discStyle(node, src)}">${src ? '' : `<span class="fb" style="font-size:${size * .34}px">${initials(nodeName(node))}</span>`}</div>
    ${cls === 'center' ? '' : `<div class="rk">${node.rank}</div>`}
    <div class="lbl" style="${cls === 'center' ? '' : 'font-size:11px'}">${nodeName(node)}</div>`;
  el.dataset.title = (node.canonical || '') + '|' + (node.vernacular || '');
  return el;
}
function loadThumbInto(el, node){
  nodeThumb(node).then(src => {
    if (!src) return;
    const disc = el.querySelector('.disc');
    if (!disc) return;
    disc.style.backgroundImage = `url('${src}')`;
    const fb = disc.querySelector('.fb'); if (fb) fb.remove();
  });
}

let nodeEls = [];
function layoutGraph(){
  const nodes = $('nodes'), links = $('links');
  nodes.innerHTML = ''; links.innerHTML = '';
  nodeEls = [];
  const cx = SW / 2, cy = SH / 2;
  const node = path[path.length - 1];

  /* center */
  const cSize = Math.min(126, Math.max(90, Math.min(SW, SH) * .3));
  const center = makeNode(node, 'center', cSize, thumbCache[node.canonical] || thumbCache[node.vernacular] || null);
  center.style.left = cx + 'px'; center.style.top = cy + 'px';
  nodes.appendChild(center);
  loadThumbInto(center, node);

  if (curKids === null){
    $('moreBadge').classList.remove('on');
    nodes.insertAdjacentHTML('beforeend', `<div class="errbox">🛰️ Couldn't reach the tree.<br>Check your connection, or hit 🎲 for a creature.</div>`);
    return;
  }
  if (!curKids.length){
    $('moreBadge').classList.remove('on');
    nodes.insertAdjacentHTML('beforeend', `<div class="node" style="left:${cx}px;top:${cy + cSize / 2 + 40}px"><div class="lbl" style="color:var(--gold)">🍃 tip of the tree</div><div class="rk">nothing below · you made it</div></div>`);
    return;
  }

  const pages = Math.ceil(curKids.length / PER);
  page = Math.min(page, pages - 1);
  const slice = curKids.slice(page * PER, page * PER + PER);
  const hasMore = pages > 1;
  const ringCount = slice.length + (hasMore ? 1 : 0);
  const R = Math.min(SW, SH) * .5 - Math.min(SW, SH) * .13;
  const childSize = Math.max(46, Math.min(74, R * 2 / ringCount * 1.15, 74));

  const items = slice.map((k, i) => ({ k, more: false }));
  if (hasMore) items.push({ more: true });

  items.forEach((it, i) => {
    const ang = -Math.PI / 2 + (i / ringCount) * Math.PI * 2;
    const x = cx + Math.cos(ang) * R, y = cy + Math.sin(ang) * R;
    /* link */
    const nc = it.more ? '#9fc4b0' : rankC(it.k.rank);
    const mx = cx + Math.cos(ang) * (R * .5), my = cy + Math.sin(ang) * (R * .5) + Math.sin(i) * 12;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M${cx} ${cy} Q${mx} ${my} ${x} ${y}`);
    p.setAttribute('stroke', nc);
    p.setAttribute('stroke-width', it.more ? 1.3 : 2.2);
    p.setAttribute('opacity', it.more ? .3 : .55);
    p.style.color = nc;
    links.appendChild(p);
    /* node */
    let el;
    if (it.more){
      el = document.createElement('button');
      el.className = 'node child more';
      el.innerHTML = `<div class="disc" style="width:${childSize}px;height:${childSize}px"><span class="fb">•••</span></div><div class="lbl" style="font-size:10px;color:var(--dim)">${curKids.length - PER * (page + 1) + (page + 1 < pages ? 0 : 0)} more</div>`;
      el.querySelector('.lbl').textContent = `+${curKids.length - PER} more`;
      el.addEventListener('click', () => { page = (page + 1) % pages; layoutGraph(); });
    } else {
      el = makeNode(it.k, 'child', childSize, thumbCache[it.k.canonical] || thumbCache[it.k.vernacular] || null);
      loadThumbInto(el, it.k);
      el.addEventListener('click', () => diveTo(it.k, el, x, y));
    }
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.animationDelay = (i * 32) + 'ms';
    nodes.appendChild(el);
    nodeEls.push(el);
  });

  $('moreBadge').classList.toggle('on', hasMore);
  $('hint').style.display = hasMore ? 'none' : '';
  if (hasMore) $('moreBadge').textContent = `page ${page + 1} / ${pages} · ${curKids.length} branches · tap ••• for more`;
}

/* dive: zoom the tapped child toward center, then re-root */
function diveTo(k, el, x, y){
  const cx = SW / 2, cy = SH / 2;
  nodeEls.forEach(n => { if (n !== el) n.classList.add('faded'); });
  $('links').style.transition = 'opacity .3s'; $('links').style.opacity = 0;
  el.classList.add('zoomTo');
  el.style.left = cx + 'px'; el.style.top = cy + 'px';
  el.querySelector('.disc').style.transform = 'scale(1.25)';
  setTimeout(() => { $('links').style.opacity = ''; path.push(k); go(); }, 320);
}

/* ── sheet ── */
function renderSheet(node, data){
  const sc = rankC(node.rank);
  const cool = coolOf(node), v = coolVerdict(cool);
  const showSci = node.canonical && node.canonical.toLowerCase() !== (node.vernacular || '').toLowerCase();
  const blurb = data && data.extract ? data.extract
    : (node.key === 0 ? 'Every living thing shares one ancestor. This is the whole family tree — start diving into the kingdoms.' : 'Dive into a branch to keep climbing down the tree of life.');
  $('sheet').innerHTML = `
    <div class="sheet-h" style="--sc:${sc}">
      <span class="rankchip">${node.rank || 'TAXON'}</span>
      <div style="flex:1;min-width:0">
        <div class="common">${nodeName(node)}</div>
        ${showSci ? `<div class="sci">${node.canonical}</div>` : ''}
      </div>
    </div>
    <div class="cool">
      <span class="lbl">Cool</span>
      <div class="bar"><div class="fill" id="coolFill"></div></div>
      <span class="score"><b>${cool}</b>/10</span>
    </div>
    <div class="verdict"><b>${v.label}.</b> ${v.note}</div>
    <div class="blurb">${blurb}</div>
    ${data && data.url ? `<a class="wikilink" href="${data.url}" target="_blank" rel="noopener">Read on Wikipedia ↗</a>` : ''}`;
  requestAnimationFrame(() => { const f = $('coolFill'); if (f) f.style.width = (cool * 10) + '%'; });
}

/* ── main navigate ── */
async function go(){
  const node = path[path.length - 1];
  const token = ++reqToken;
  panX = 0; panY = 0; $('world').style.transform = '';
  sizeStage();
  renderCrumbs();
  curKids = undefined;
  $('nodes').innerHTML = `<div class="loading"><div class="o">🌿</div><br>growing branches…</div>`;
  $('links').innerHTML = '';
  renderSheet(node, null);

  const [data, kids] = await Promise.all([nodeData(node), getChildren(node)]);
  if (token !== reqToken) return;
  curKids = kids; page = 0;
  layoutGraph();
  renderSheet(node, data);
}

/* ── drag to roam ── */
(() => {
  const stage = $('stage'), world = $('world');
  let down = false, sx = 0, sy = 0, ox = 0, oy = 0, moved = false;
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('.node')) return;
    down = true; moved = false; sx = e.clientX; sy = e.clientY; ox = panX; oy = panY;
    stage.classList.add('drag');
  });
  addEventListener('pointermove', e => {
    if (!down) return;
    panX = ox + (e.clientX - sx); panY = oy + (e.clientY - sy);
    if (Math.hypot(e.clientX - sx, e.clientY - sy) > 4) moved = true;
    world.style.transform = `translate(${panX}px,${panY}px)`;
  });
  addEventListener('pointerup', () => { down = false; $('stage').classList.remove('drag'); });
})();

/* ── search ── */
let searchTimer = null;
async function doSearch(q){
  const box = $('results');
  if (!q || q.length < 2){ box.classList.remove('on'); box.innerHTML = ''; return; }
  try {
    const r = await fetch(`${GBIF}/species/search?q=${encodeURIComponent(q)}&datasetKey=${BACKBONE}&status=ACCEPTED&limit=10&rank=SPECIES&rank=GENUS&rank=FAMILY&rank=ORDER&rank=CLASS&rank=PHYLUM&rank=KINGDOM`);
    const j = await r.json();
    const seen = new Set();
    const hits = (j.results || []).filter(x => x.canonicalName && x.rank && x.key)
      .filter(x => { const k = x.canonicalName.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 8);
    if (!hits.length){ box.innerHTML = `<div class="res" style="cursor:default"><div class="sc">no matches — try a common name</div></div>`; box.classList.add('on'); return; }
    box.innerHTML = hits.map((x, i) => `<button class="res" data-i="${i}">
      <div class="r" style="color:${rankC(x.rank)}">${x.rank}</div>
      <div class="cn">${cap(x.vernacularName || x.canonicalName)}</div>
      <div class="sc">${x.canonicalName}</div></button>`).join('');
    box.classList.add('on');
    box.querySelectorAll('.res[data-i]').forEach((b, i) => b.addEventListener('click', () => jumpTo(hits[i])));
  } catch (e){ box.innerHTML = `<div class="res" style="cursor:default"><div class="sc">search needs a connection · try 🎲</div></div>`; box.classList.add('on'); }
}
async function jumpTo(hit){
  $('results').classList.remove('on'); $('search').value = ''; $('search').blur();
  const node = { key: hit.key, canonical: hit.canonicalName, vernacular: hit.vernacularName || '', rank: hit.rank };
  let anc = [];
  try {
    const r = await fetch(`${GBIF}/species/${hit.key}/parents`);
    if (r.ok){ const j = await r.json(); anc = (j || []).map(x => ({ key: x.key, canonical: x.canonicalName, vernacular: x.vernacularName || '', rank: x.rank })); }
  } catch (e){}
  path = [LIFE, ...anc, node];
  go();
}
$('search').addEventListener('input', e => { clearTimeout(searchTimer); const q = e.target.value.trim(); searchTimer = setTimeout(() => doSearch(q), 260); });
document.addEventListener('click', e => { if (!e.target.closest('.searchrow') && !e.target.closest('#results')) $('results').classList.remove('on'); });

/* ── surprise · ONLY lands on a species that has a photo ── */
async function surprise(){
  const d = $('dice'); d.classList.add('spin');
  try {
    for (let batch = 0; batch < 3; batch++){
      const off = (Math.random() * 4000) | 0;
      const r = await fetch(`${GBIF}/species/search?rank=SPECIES&status=ACCEPTED&datasetKey=${BACKBONE}&highertaxonKey=1&limit=20&offset=${off}`);
      const j = await r.json();
      const cands = (j.results || []).filter(x => x.canonicalName && x.key).sort(() => Math.random() - .5);
      for (const x of cands){
        const title = x.vernacularName || x.canonicalName;
        const img = await nodeThumb({ canonical: x.canonicalName, vernacular: x.vernacularName || '' });
        if (img){ d.classList.remove('spin'); jumpTo(x); return; }   // photo confirmed → dive
      }
    }
    throw 0;
  } catch (e){
    /* offline: walk the fallback straight to the lion (always has an identity) */
    d.classList.remove('spin');
    path = [LIFE, KINGDOMS[0], FALLBACK['1'][0], FALLBACK['fb-chordata'][0], FALLBACK['fb-mammalia'][0], FALLBACK['fb-carnivora'][0], FALLBACK['fb-felidae'][0], FALLBACK['fb-panthera'][0]];
    go();
  }
}
$('dice').addEventListener('click', surprise);

sizeStage();
go();
</script>
