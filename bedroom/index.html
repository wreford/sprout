<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="mobile-web-app-capable" content="yes">

<title>Lily's Bedroom Designer</title>
<meta name="description" content="Swipe dream bedrooms. Remix every one.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff9ac4'/%3E%3Cstop offset='1' stop-color='%238a7af0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='16' height='16' rx='4' fill='url(%23g)'/%3E%3Cpath d='M3 12 v-4 l2-2 h6 l2 2 v4 z' fill='%23fff' opacity='0.9'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{position:fixed;inset:0;overflow:hidden;background:#1a1030;
  touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  font-family:-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif}
canvas{display:block;width:100vw;height:100dvh}
#ui{position:fixed;inset:0;pointer-events:none;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#brand{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;
  text-align:center;font-size:14px;font-weight:800;letter-spacing:0.06em;
  background:linear-gradient(90deg,#ffb3d1,#c9b8ff,#a8e6ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 24px rgba(255,180,220,0.25)}
#rail{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 120px);
  display:flex;flex-direction:column;gap:14px;pointer-events:auto}
#rail button{
  width:52px;height:52px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.14);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:#fff;font-size:22px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  box-shadow:0 4px 18px rgba(20,10,40,0.35)}
#rail button span{font-size:10px;font-weight:700;margin-top:-2px}
#likeIco{font-size:22px;margin-top:0}
#rail button:active{transform:scale(0.88)}
#bLike.liked{background:rgba(255,90,140,0.85)}
#cap{position:absolute;left:14px;right:84px;
  bottom:calc(env(safe-area-inset-bottom) + 118px);color:#fff;pointer-events:none}
#vibe{font-size:22px;font-weight:800;text-shadow:0 2px 14px rgba(20,10,40,0.6)}
#sub{font-size:12.5px;opacity:0.85;margin-top:4px;text-shadow:0 1px 8px rgba(20,10,40,0.6)}
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 86px);
  text-align:center;color:rgba(255,255,255,0.75);font-size:11.5px;
  animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#sheet{position:absolute;left:0;right:0;bottom:0;
  background:rgba(26,16,48,0.86);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-radius:22px 22px 0 0;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);
  transform:translateY(105%);transition:transform 0.32s cubic-bezier(.2,.9,.25,1);
  pointer-events:auto;color:#fff}
#sheet.open{transform:translateY(0)}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;
  touch-action:pan-x;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:0 0 auto;border:none;border-radius:999px;padding:7px 13px;
  font-size:12px;font-weight:800;color:rgba(255,255,255,0.75);
  background:rgba(255,255,255,0.1)}
#tabs button.on{color:#fff;
  background:linear-gradient(90deg,#ff7ab0,#8a7af0)}
#sheetBody{max-height:34dvh;overflow-y:auto;touch-action:pan-y}
.grp{margin:8px 0 4px;font-size:10.5px;font-weight:800;letter-spacing:0.1em;
  text-transform:uppercase;opacity:0.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chips button{border:none;border-radius:10px;padding:7px 11px;
  font-size:12px;font-weight:700;color:rgba(255,255,255,0.8);
  background:rgba(255,255,255,0.1)}
.chips button.on{color:#3a2050;background:#fff;
  box-shadow:0 2px 10px rgba(255,255,255,0.25)}
.row{display:flex;align-items:center;gap:12px;margin:9px 0}
.row label{width:64px;font-size:12.5px;font-weight:700;opacity:0.9}
.row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
  background:linear-gradient(90deg,#ff9ac4,#8a7af0,#7ad8f0)}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 2px 10px rgba(20,10,40,0.5)}
#gal{position:absolute;inset:0;background:rgba(18,10,36,0.94);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;flex-direction:column;pointer-events:auto;color:#fff;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
#gal.open{display:flex}
#gal h2{font-size:17px;font-weight:800;text-align:center;margin-bottom:14px}
#thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;overflow-y:auto;
  touch-action:pan-y}
#thumbs canvas{width:100%;height:auto;border-radius:14px;
  box-shadow:0 4px 16px rgba(0,0,0,0.4)}
#thumbs .empty{grid-column:1/3;text-align:center;opacity:0.7;font-size:13.5px;margin-top:40px}
#galClose{margin-top:12px;border:none;border-radius:999px;padding:12px;
  font-size:14px;font-weight:800;color:#fff;
  background:linear-gradient(90deg,#ff7ab0,#8a7af0)}
#toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);
  background:rgba(255,255,255,0.92);color:#4a2a6a;font-weight:800;font-size:14px;
  padding:10px 20px;border-radius:999px;opacity:0;transition:opacity 0.25s;
  box-shadow:0 6px 24px rgba(20,10,40,0.4)}
#bigHeart{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(0);
  font-size:110px;pointer-events:none;filter:drop-shadow(0 6px 24px rgba(255,90,140,0.6))}
#bigHeart.pop{animation:hp 0.8s ease forwards}
@keyframes hp{0%{transform:translate(-50%,-50%) scale(0)}
  35%{transform:translate(-50%,-50%) scale(1.25)}
  55%{transform:translate(-50%,-50%) scale(1)}
  100%{transform:translate(-50%,-50%) scale(0.9);opacity:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="brand">✿ LILY'S BEDROOM DESIGNER ✿</div>
  <div id="rail">
    <button id="bLike"><span id="likeIco">♡</span><span id="likeN"></span></button>
    <button id="bShuffle">🎲</button>
    <button id="bEdit">🎚</button>
    <button id="bGal">🖼</button>
  </div>
  <div id="cap"><div id="vibe"></div><div id="sub"></div></div>
  <div id="hint">swipe up for the next room ↑</div>
  <div id="sheet">
    <div id="tabs"></div>
    <div id="sheetBody"></div>
  </div>
  <div id="gal">
    <h2>your saved rooms</h2>
    <div id="thumbs"></div>
    <button id="galClose">back to the feed</button>
  </div>
  <div id="toast"></div>
  <div id="bigHeart">💖</div>
</div>
<script>
"use strict";
const cv=document.getElementById("c"),g=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);}
resize();addEventListener("resize",resize);
addEventListener("gesturestart",e=>e.preventDefault());

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
function lerp(a,b,u){return a+(b-a)*u;}

const VIBES=[
  ["cloud core","soft and floaty. 10/10 would nap"],
  ["strawberry era","pink but make it study"],
  ["ocean dream","the window is basically a screensaver"],
  ["lavender night","for main character journaling"],
  ["mint retro","your grandma's couch but cool now"],
  ["peach cream","warm like toast. the good kind"],
  ["forest fairy","the plants have opinions"],
  ["butter sunday","this room smells like pancakes, trust"],
  ["cherry cola","a little dramatic. as it should be"],
  ["moon milk","shhh. the stars are on"],
];
const EXTRAS=["desk","mirror","bean","cat","books","vinyl","disco","canopy","photos","slippers"];
function makeLook(seed){
  const r=mulberry(seed*2654435761+7);
  const hue=Math.floor(r()*360);
  const mood=r()<0.42?20+r()*25:62+r()*34;
  const look={seed,hue,
    mood:Math.round(mood),
    cozy:Math.round(35+r()*60),
    plants:1+Math.floor(r()*3.4),
    stuff:Math.round(30+r()*65),
    wallStyle:Math.floor(r()*6),floor:Math.floor(r()*4),
    bedHead:Math.floor(r()*5),duvet:Math.floor(r()*6),pillows:1+Math.floor(r()*3),
    rugShape:Math.floor(r()*4),rugPat:Math.floor(r()*3),
    winStyle:Math.floor(r()*4),curt:Math.floor(r()*4),sky:0,
    fairyStyle:Math.floor(r()*3),lampStyle:Math.floor(r()*4),
    plantType:Math.floor(r()*4),
    artStyle:Math.floor(r()*6),artN:1+Math.floor(r()*3),
    extras:{},
  };
  EXTRAS.forEach(k=>{look.extras[k]=r()<0.26;});
  if(r()<0.5)look.extras.cat=true;
  const vi=Math.floor((hue/360)*VIBES.length)%VIBES.length;
  look.vibe=VIBES[(vi+(mood<50?5:0))%VIBES.length];
  return look;
}

function px(x,y,z){
  const cx=W/2,hw=lerp(W*0.78,W*0.30,z);
  const fy=lerp(H*0.90,H*0.615,z),cy2=lerp(H*0.02,H*0.28,z);
  return[cx+x*hw,lerp(fy,cy2,y)];
}
function poly(pts,fill){g.beginPath();
  pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));
  g.closePath();if(fill){g.fillStyle=fill;g.fill();}}

function renderRoom(g,W,H,L,t){
  const day=L.mood/100;
  const wallL=lerp(30,74,day),wallS=lerp(30,42,day);
  const wl=(dl,ds)=>`hsl(${L.hue} ${wallS+(ds||0)}% ${wallL+dl}%)`;
  const acc=(L.hue+165)%360;
  const accCol=(l)=>`hsl(${acc} 65% ${l}%)`;
  const wood=`hsl(28 42% ${lerp(26,60,day)}%)`;
  const EX=L.extras||{};
  function P(x,y,z){
    const cx=W/2,hw=lerp(W*0.78,W*0.30,z);
    const fy=lerp(H*0.90,H*0.615,z),cy2=lerp(H*0.02,H*0.28,z);
    return[cx+x*hw,lerp(fy,cy2,y)];
  }
  function poly(pts,fill){g.beginPath();
    pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));
    g.closePath();if(fill){g.fillStyle=fill;g.fill();}}

  const sky=g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,wl(6));sky.addColorStop(1,wl(-4));
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  const ceil=g.createLinearGradient(0,P(0,1,0)[1],0,P(0,1,1)[1]);
  ceil.addColorStop(0,wl(10));ceil.addColorStop(1,wl(2));
  poly([P(-1,1,0),P(1,1,0),P(1,1,1),P(-1,1,1)],null);g.fillStyle=ceil;g.fill();
  const bwg=g.createLinearGradient(0,P(0,1,1)[1],0,P(0,0,1)[1]);
  const solid=L.wallStyle===1;
  bwg.addColorStop(0,wl(solid?0:4));bwg.addColorStop(1,wl(solid?0:-6));
  poly([P(-1,0,1),P(1,0,1),P(1,1,1),P(-1,1,1)],null);g.fillStyle=bwg;g.fill();
  const bwTop=P(0,1,1)[1],bwBot=P(0,0,1)[1];
  if(L.wallStyle===2){
    g.fillStyle="rgba(255,255,255,0.14)";
    for(let x=-1;x<1;x+=0.25){
      const a=P(x,0,1),b=P(x+0.125,0,1);
      g.fillRect(a[0],bwTop,b[0]-a[0],bwBot-bwTop);}
  }else if(L.wallStyle===3){
    g.fillStyle="rgba(255,255,255,0.22)";
    for(let x=-0.9;x<1;x+=0.2)for(let y=0.15;y<1;y+=0.2){
      const p2=P(x,y,1);
      g.beginPath();g.arc(p2[0],p2[1],4,0,6.29);g.fill();}
  }else if(L.wallStyle===4){
    g.fillStyle="rgba(255,255,255,0.16)";
    const rail=P(0,0.36,1)[1];
    g.fillRect(P(-1,0,1)[0],rail,P(1,0,1)[0]-P(-1,0,1)[0],bwBot-rail);
    g.fillStyle=wl(12);
    g.fillRect(P(-1,0,1)[0],rail-3,P(1,0,1)[0]-P(-1,0,1)[0],4);
  }else if(L.wallStyle===5){
    const a0=P(0.34,0,1),a1=P(0.96,0,1);
    const atop=P(0.65,0.92,1);
    g.fillStyle=accCol(lerp(30,64,day));g.globalAlpha=0.5;
    g.beginPath();g.moveTo(a0[0],a0[1]);
    g.lineTo(a0[0],atop[1]+40);
    g.quadraticCurveTo(a0[0],atop[1],(a0[0]+a1[0])/2,atop[1]);
    g.quadraticCurveTo(a1[0],atop[1],a1[0],atop[1]+40);
    g.lineTo(a1[0],a1[1]);g.closePath();g.fill();g.globalAlpha=1;
  }
  const lwg=g.createLinearGradient(P(-1,0,0)[0],0,P(-1,0,1)[0],0);
  lwg.addColorStop(0,wl(-10));lwg.addColorStop(1,wl(-2));
  poly([P(-1,0,0),P(-1,1,0),P(-1,1,1),P(-1,0,1)],null);g.fillStyle=lwg;g.fill();
  const rwg=g.createLinearGradient(P(1,0,0)[0],0,P(1,0,1)[0],0);
  rwg.addColorStop(0,wl(-14));rwg.addColorStop(1,wl(-4));
  poly([P(1,0,0),P(1,1,0),P(1,1,1),P(1,0,1)],null);g.fillStyle=rwg;g.fill();

  if(L.floor===1){
    poly([P(-1,0,0),P(1,0,0),P(1,0,1),P(-1,0,1)],`hsl(${L.hue} 20% ${lerp(30,72,day)}%)`);
    for(let i=0;i<8;i++)for(let j=0;j<6;j++){
      if((i+j)%2)continue;
      const x0=-1+i*0.25,z0=j/6,x1=x0+0.25,z1=z0+1/6;
      poly([P(x0,0,z0),P(x1,0,z0),P(x1,0,z1),P(x0,0,z1)],
        `hsl(${L.hue} 24% ${lerp(22,60,day)}%)`);}
  }else if(L.floor===2){
    poly([P(-1,0,0),P(1,0,0),P(1,0,1),P(-1,0,1)],accCol(lerp(34,72,day)));
    const rs0=mulberry(L.seed+3);
    g.fillStyle="rgba(255,255,255,0.12)";
    for(let i=0;i<40;i++){
      const p2=P(-1+rs0()*2,0,rs0());
      g.beginPath();g.arc(p2[0],p2[1],1.6,0,6.29);g.fill();}
  }else if(L.floor===3){
    poly([P(-1,0,0),P(1,0,0),P(1,0,1),P(-1,0,1)],wood);
    poly([P(-1,0,0.5),P(1,0,0.5),P(1,0,1),P(-1,0,1)],accCol(lerp(28,60,day)));
    g.strokeStyle="rgba(255,255,255,0.4)";g.lineWidth=2;
    g.beginPath();g.moveTo(...P(-1,0,0.5));g.lineTo(...P(1,0,0.5));g.stroke();
  }else{
    const fgr=g.createLinearGradient(0,P(0,0,1)[1],0,P(0,0,0)[1]);
    fgr.addColorStop(0,wood);fgr.addColorStop(1,`hsl(24 40% ${lerp(16,48,day)}%)`);
    poly([P(-1,0,0),P(1,0,0),P(1,0,1),P(-1,0,1)],null);g.fillStyle=fgr;g.fill();
    g.strokeStyle="rgba(0,0,0,0.08)";g.lineWidth=1;
    for(let i=1;i<7;i++){const x=-1+i*2/7;
      g.beginPath();g.moveTo(...P(x,0,0));g.lineTo(...P(x,0,1));g.stroke();}
  }

  const wx0=-0.62,wx1=0.12,wy0=0.32,wy1=0.86;
  const w00=P(wx0,wy0,1),w11=P(wx1,wy1,1);
  const winW=w11[0]-w00[0],winH=w00[1]-w11[1];
  const wcx=w00[0]+winW/2;
  function winPath(){
    g.beginPath();
    if(L.winStyle===1){
      g.moveTo(w00[0],w00[1]);g.lineTo(w00[0],w11[1]+winH*0.32);
      g.quadraticCurveTo(w00[0],w11[1],wcx,w11[1]);
      g.quadraticCurveTo(w11[0],w11[1],w11[0],w11[1]+winH*0.32);
      g.lineTo(w11[0],w00[1]);g.closePath();
    }else if(L.winStyle===2){
      g.arc(wcx,w11[1]+winH/2,Math.min(winW,winH)/2,0,6.29);
    }else if(L.winStyle===3){
      g.rect(w00[0],w11[1],winW*0.44,winH);
      g.rect(w00[0]+winW*0.56,w11[1],winW*0.44,winH);
    }else g.rect(w00[0],w11[1],winW,winH);
  }
  let skyMode=L.sky|0;
  if(skyMode===0)skyMode=day>0.5?1:3;
  g.save();winPath();g.clip();
  const skyg=g.createLinearGradient(0,w11[1],0,w00[1]);
  if(skyMode===1){skyg.addColorStop(0,"hsl(205 78% 68%)");skyg.addColorStop(1,"hsl(45 90% 80%)");}
  else if(skyMode===2){skyg.addColorStop(0,"hsl(255 50% 38%)");skyg.addColorStop(0.5,"hsl(15 85% 60%)");skyg.addColorStop(1,"hsl(38 95% 68%)");}
  else if(skyMode===3){skyg.addColorStop(0,"hsl(248 45% 16%)");skyg.addColorStop(1,"hsl(268 40% 30%)");}
  else if(skyMode===4){skyg.addColorStop(0,"hsl(215 22% 42%)");skyg.addColorStop(1,"hsl(215 25% 60%)");}
  else if(skyMode===5){skyg.addColorStop(0,"hsl(210 28% 62%)");skyg.addColorStop(1,"hsl(210 30% 80%)");}
  else{skyg.addColorStop(0,"hsl(240 55% 10%)");skyg.addColorStop(1,"hsl(260 45% 20%)");}
  g.fillStyle=skyg;g.fillRect(w00[0]-4,w11[1]-4,winW+8,winH+8);
  if(skyMode===1){
    const sun=g.createRadialGradient(w00[0]+winW*0.7,w11[1]+winH*0.32,2,w00[0]+winW*0.7,w11[1]+winH*0.32,winW*0.3);
    sun.addColorStop(0,"rgba(255,240,200,0.95)");sun.addColorStop(1,"rgba(255,240,200,0)");
    g.fillStyle=sun;g.fillRect(w00[0],w11[1],winW,winH);
    g.fillStyle="rgba(255,255,255,0.85)";
    [[0.25,0.3,16],[0.42,0.24,11]].forEach(([fx,fy2,r2])=>{
      g.beginPath();g.arc(w00[0]+winW*fx,w11[1]+winH*fy2,r2*0.6,0,6.29);
      g.arc(w00[0]+winW*fx+10,w11[1]+winH*fy2-3,r2*0.45,0,6.29);
      g.arc(w00[0]+winW*fx+19,w11[1]+winH*fy2+1,r2*0.5,0,6.29);g.fill();});
  }else if(skyMode===2){
    g.fillStyle="#ffdf9a";
    g.beginPath();g.arc(wcx,w11[1]+winH*0.62,winW*0.13,0,6.29);g.fill();
    g.fillStyle="rgba(255,170,120,0.5)";
    g.fillRect(w00[0],w11[1]+winH*0.6,winW,2.5);
    g.fillRect(w00[0],w11[1]+winH*0.7,winW,1.5);
  }else if(skyMode===3||skyMode===6){
    g.fillStyle="#f4ecd8";
    g.beginPath();g.arc(w00[0]+winW*0.68,w11[1]+winH*0.3,winW*0.09,0,6.29);g.fill();
    g.fillStyle=skyMode===6?"hsl(250 55% 12%)":"hsl(258 45% 22%)";
    g.beginPath();g.arc(w00[0]+winW*0.72,w11[1]+winH*0.28,winW*0.075,0,6.29);g.fill();
    const rs=mulberry(L.seed+9);

      for(let b2=0;b2<5;b2++){
        const ang=-1.9+b2*0.65+Math.sin(t*1.2+i+b2)*0.05;
        const lx=base[0]+Math.cos(ang)*24*sc2,ly=base[1]-22*sc2+Math.sin(ang)*32*sc2;
        g.beginPath();g.ellipse(lx,ly,7*sc2,16*sc2,ang+1.5708,0,6.29);g.fill();
      }
    }
  }

  if(EX.desk){
    const d0=P(-0.94,0,0.2),d1=P(-0.6,0,0.2),dt2=P(-0.77,0.3,0.2);
    g.fillStyle=wood;
    g.beginPath();g.roundRect(d0[0],dt2[1],d1[0]-d0[0],7,3);g.fill();
    g.fillRect(d0[0]+4,dt2[1]+7,4,d0[1]-dt2[1]-7);
    g.fillRect(d1[0]-8,dt2[1]+7,4,d0[1]-dt2[1]-7);
    g.fillStyle="#e8e4f0";
    g.beginPath();g.roundRect((d0[0]+d1[0])/2-11,dt2[1]-14,22,14,2);g.fill();
    g.fillStyle=accCol(45);
    g.beginPath();g.roundRect((d0[0]+d1[0])/2-11,dt2[1]-2,22,3,1);g.fill();
    g.fillStyle=accCol(lerp(45,72,day));
    const ch=P(-0.77,0,0.34);
    g.beginPath();g.arc(ch[0],ch[1]-16,10,0,6.29);g.fill();
    g.strokeStyle=wl(-24);g.lineWidth=2.4;
    g.beginPath();g.moveTo(ch[0],ch[1]-6);g.lineTo(ch[0],ch[1]);g.stroke();
  }
  if(EX.mirror){
    const mp=P(0.16,0,0.55);
    const mh=86,mw=30;
    g.strokeStyle=`hsl(40 50% ${lerp(48,70,day)}%)`;g.lineWidth=4;
    g.beginPath();g.moveTo(mp[0]-mw/2,mp[1]);g.lineTo(mp[0]-mw/2,mp[1]-mh+mw/2);
    g.arc(mp[0],mp[1]-mh+mw/2,mw/2,3.14,0);
    g.lineTo(mp[0]+mw/2,mp[1]);g.closePath();
    const mg=g.createLinearGradient(mp[0]-mw/2,0,mp[0]+mw/2,0);
    mg.addColorStop(0,"rgba(210,230,245,0.9)");mg.addColorStop(0.5,"rgba(245,252,255,0.95)");
    mg.addColorStop(1,"rgba(190,210,230,0.85)");
    g.fillStyle=mg;g.fill();g.stroke();
    g.strokeStyle="rgba(255,255,255,0.8)";g.lineWidth=2;
    g.beginPath();g.moveTo(mp[0]-6,mp[1]-mh+18);g.lineTo(mp[0]+4,mp[1]-24);g.stroke();
  }
  if(EX.bean){
    const bp=P(-0.32,0,0.62);
    g.fillStyle=accCol(lerp(42,70,day));
    g.beginPath();g.ellipse(bp[0],bp[1]-8,26,18,0,0,6.29);g.fill();
    g.beginPath();g.ellipse(bp[0],bp[1]-22,20,12,0,0,6.29);g.fill();
    g.fillStyle="rgba(0,0,0,0.08)";
    g.beginPath();g.ellipse(bp[0],bp[1]-2,26,7,0,0,6.29);g.fill();
  }
  if(EX.books){
    const bp2=P(0.06,0,0.3);
    ["#d87a9a","#7a9ad8","#e0c05f"].forEach((col,i)=>{
      g.fillStyle=col;
      g.beginPath();g.roundRect(bp2[0]-16+i*2,bp2[1]-8-i*7,30-i*4,7,2);g.fill();});
  }
  if(EX.vinyl){
    for(let i=0;i<4;i++){
      const vp=P(-0.98,0.72,0.35+i*0.16);
      g.fillStyle="#241f2e";
      g.beginPath();g.ellipse(vp[0]+6,vp[1],9,11,0,0,6.29);g.fill();
      g.fillStyle=`hsl(${(L.hue+i*70)%360} 60% 60%)`;
      g.beginPath();g.ellipse(vp[0]+6,vp[1],3.4,4.2,0,0,6.29);g.fill();}
  }
  if(EX.disco){
    const dp=P(0.05,1,0.55);
    g.strokeStyle="rgba(255,255,255,0.5)";g.lineWidth=1.5;
    g.beginPath();g.moveTo(dp[0],dp[1]);g.lineTo(dp[0],dp[1]+22);g.stroke();
    const br=14;
    const dg=g.createRadialGradient(dp[0]-4,dp[1]+22+br-4,2,dp[0],dp[1]+22+br,br);
    dg.addColorStop(0,"#f4f8fc");dg.addColorStop(1,"#9aa8c0");
    g.fillStyle=dg;
    g.beginPath();g.arc(dp[0],dp[1]+22+br,br,0,6.29);g.fill();
    g.strokeStyle="rgba(255,255,255,0.55)";g.lineWidth=0.8;
    for(let a2=-2;a2<=2;a2++){
      g.beginPath();g.ellipse(dp[0],dp[1]+22+br,Math.abs(br*Math.cos(a2*0.5)),br,0,0,6.29);g.stroke();}
    if(day<0.55){
      for(let i=0;i<6;i++){
        const a2=t*0.9+i*1.047;
        g.fillStyle=`hsla(${(i*60+t*80)%360} 85% 70% / 0.5)`;
        g.beginPath();g.arc(dp[0]+Math.cos(a2)*60,dp[1]+22+br+Math.sin(a2)*44,4,0,6.29);g.fill();}
    }
  }
  if(EX.photos){
    const p0=P(0.3,0.88,1),p1=P(1,0.8,0.6);
    g.strokeStyle="rgba(255,255,255,0.4)";g.lineWidth=1.4;
    g.beginPath();g.moveTo(p0[0],p0[1]);g.quadraticCurveTo((p0[0]+p1[0])/2,p0[1]+16,p1[0],p1[1]);g.stroke();
    for(let i=1;i<4;i++){
      const u=i/4,qx=lerp(p0[0],p1[0],u),qy=lerp(p0[1],p1[1],u)+Math.sin(u*3.14)*14;
      g.fillStyle="#fbf8f2";
      g.fillRect(qx-8,qy,16,19);
      g.fillStyle=`hsl(${(L.hue+i*80)%360} 55% ${lerp(55,75,day)}%)`;
      g.fillRect(qx-6,qy+2,12,11);}
  }

  const stuff=L.stuff/100;
  if(stuff>0.15){
    const shY=0.62,sh0=P(-1,shY,0.55),sh1=P(-1,shY,0.9);
    g.strokeStyle=wood;g.lineWidth=6;g.lineCap="round";
    g.beginPath();g.moveTo(sh0[0]+4,sh0[1]);g.lineTo(sh1[0]+4,sh1[1]);g.stroke();
    const nb=Math.round(2+stuff*5);
    for(let i=0;i<nb;i++){
      const u=i/(nb)+0.05,bx2=lerp(sh0[0],sh1[0],u)+4,by2=lerp(sh0[1],sh1[1],u);
      g.fillStyle=`hsl(${(L.hue+i*47)%360} 55% ${lerp(45,68,day)}%)`;
      g.fillRect(bx2,by2-20-(i%3)*3,7,20+(i%3)*3);
    }
  }
  const artY=0.76;
  for(let i=0;i<(L.artN|0);i++){
    const ax=0.3+i*0.24,ap=P(ax,artY,1);
    g.fillStyle=`hsl(${(acc+i*40)%360} 50% ${lerp(50,78,day)}%)`;
    const st3=L.artStyle;
    if(st3===0){g.beginPath();g.arc(ap[0]+20,ap[1],20,0,6.29);g.fill();}
    else if(st3===1){
      g.beginPath();g.moveTo(ap[0],ap[1]+18);
      g.arc(ap[0]+18,ap[1]+2,18,3.14,6.29);g.lineTo(ap[0]+36,ap[1]+18);g.closePath();g.fill();}
    else if(st3===2){g.fillStyle="#fbf8f2";
      g.beginPath();g.roundRect(ap[0],ap[1]-16,34,42,4);g.fill();
      g.fillStyle=`hsl(${(acc+i*40)%360} 50% ${lerp(50,78,day)}%)`;
      g.fillRect(ap[0]+4,ap[1]-12,26,26);}
    else if(st3===3){
      if(i===0){
        const f0=P(0.24,0.86,1),f1=P(0.98,0.86,1);
        g.strokeStyle="rgba(255,255,255,0.4)";g.lineWidth=1.4;
        g.beginPath();g.moveTo(f0[0],f0[1]);
        g.quadraticCurveTo((f0[0]+f1[0])/2,f0[1]+18,f1[0],f1[1]);g.stroke();
        for(let fl=0;fl<6;fl++){
          const u=(fl+0.5)/6,qx=lerp(f0[0],f1[0],u),qy=lerp(f0[1],f1[1],u)+Math.sin(u*3.14)*16;
          g.fillStyle=`hsl(${(L.hue+fl*55)%360} 70% ${lerp(52,72,day)}%)`;
          g.beginPath();g.moveTo(qx-8,qy);g.lineTo(qx+8,qy);g.lineTo(qx,qy+15);g.closePath();g.fill();}
      }
    }
    else if(st3===4){
      if(i===0){
        g.save();
        g.strokeStyle=`hsl(${acc} 95% 68%)`;g.lineWidth=3.4;g.lineCap="round";
        g.shadowColor=`hsl(${acc} 95% 62%)`;g.shadowBlur=14;
        const nx2=P(0.62,0.78,1);
        g.beginPath();g.moveTo(nx2[0]-34,nx2[1]);
        g.bezierCurveTo(nx2[0]-14,nx2[1]-22,nx2[0]-4,nx2[1]+16,nx2[0]+12,nx2[1]-6);
        g.quadraticCurveTo(nx2[0]+26,nx2[1]-20,nx2[0]+36,nx2[1]-2);
        g.stroke();g.restore();}
    }
    else{
      const sp=P(ax,artY,1);
      g.strokeStyle=wood;g.lineWidth=4;g.lineCap="round";
      g.beginPath();g.moveTo(sp[0]-2,sp[1]+16);g.lineTo(sp[0]+38,sp[1]+16);g.stroke();
      g.fillStyle=`hsl(${(L.hue+i*90)%360} 55% ${lerp(50,72,day)}%)`;
      g.beginPath();g.arc(sp[0]+8,sp[1]+9,6,0,6.29);g.fill();
      g.fillStyle="#f2d99a";
      g.save();g.translate(sp[0]+26,sp[1]+8);
      for(let a2=0;a2<5;a2++){g.rotate(1.257);g.fillRect(-1.4,-7,2.8,7);}
      g.restore();}
  }

  const fairy=L.cozy/100;
  if(fairy>0.18&&L.fairyStyle!==3){
    const fn=Math.round(9+fairy*13);
    const f0=P(-0.98,0.95,1),f1=P(0.98,0.95,1);
    for(let i=0;i<=fn;i++){
      const u=i/fn;
      const sag=L.fairyStyle===1?6:34;
      const fx=lerp(f0[0],f1[0],u),fy2=f0[1]+Math.sin(u*3.14)*sag;
      if(i<fn){g.strokeStyle="rgba(255,255,255,0.25)";g.lineWidth=1;
        const u2=(i+1)/fn;
        g.beginPath();g.moveTo(fx,fy2);
        g.lineTo(lerp(f0[0],f1[0],u2),f0[1]+Math.sin(u2*3.14)*sag);g.stroke();}
      const glow=(0.55+0.45*Math.sin(t*2.2+i*1.3))*lerp(1,0.5,day);
      const fg2=g.createRadialGradient(fx,fy2,0.5,fx,fy2,10);
      const fc=`hsla(${(L.hue+i*24)%360} 90% 78% /`;
      fg2.addColorStop(0,fc+(0.9*glow)+")");fg2.addColorStop(1,fc+"0)");
      g.fillStyle=fg2;g.fillRect(fx-11,fy2-11,22,22);
      if(L.fairyStyle===2){
        g.fillStyle=`hsla(50 100% 88% / ${0.5+glow*0.5})`;
        g.save();g.translate(fx,fy2);
        for(let a2=0;a2<4;a2++){g.rotate(1.5708);g.fillRect(-1,-5,2,5);}
        g.restore();
      }else{
        g.fillStyle=`hsla(50 100% 92% / ${0.5+glow*0.5})`;
        g.beginPath();g.arc(fx,fy2,1.8,0,6.29);g.fill();
      }
    }
  }

  if(day>0.5){
    g.fillStyle=`rgba(255,236,190,${(day-0.5)*0.18})`;
    poly([[w00[0],w00[1]],[w11[0],w11[1]+winH*0.2],
      P(0.4,0,0.2),P(-0.7,0,0.1)],g.fillStyle);
  }else{
    g.fillStyle=`rgba(24,14,52,${(0.5-day)*0.5})`;
    g.fillRect(0,0,W,H);
    const moonGlow=g.createRadialGradient(W/2,H*0.44,10,W/2,H*0.44,W*0.7);
    moonGlow.addColorStop(0,"rgba(180,160,255,0.10)");
    moonGlow.addColorStop(1,"rgba(180,160,255,0)");
    g.fillStyle=moonGlow;g.fillRect(0,0,W,H);
  }
  const rs2=mulberry(L.seed+77);
  g.fillStyle="rgba(255,255,255,0.5)";
  for(let i=0;i<10;i++){
    const mx=rs2()*W,my=rs2()*H*0.8;
    const dr=Math.sin(t*0.6+i*2.1)*8;
    g.globalAlpha=0.12+0.12*Math.sin(t*1.1+i);
    g.beginPath();g.arc(mx+dr,my+dr*0.6,1.6,0,6.29);g.fill();
  }
  g.globalAlpha=1;
  const vg=g.createRadialGradient(W/2,H*0.45,H*0.3,W/2,H*0.45,H*0.85);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(10,5,25,0.32)");
  g.fillStyle=vg;g.fillRect(0,0,W,H);
}

let cur=0,prev=0,looks={},trans=0,transDir=0,liked={},saved=[];
try{saved=JSON.parse(localStorage.getItem("lbd-saved")||"[]");}catch(e){}
function look(i){if(!looks[i])looks[i]=makeLook(i+1);return looks[i];}

const $=id=>document.getElementById(id);
const SPEC={
  vibe:{sliders:[["hue","walls",0,360],["mood","night↔day",0,100],
    ["cozy","cozy",0,100],["stuff","stuff",0,100]]},
  walls:{groups:[
    ["paint","wallStyle",["wash","solid","stripes","dots","panel","arch"]],
    ["floor","floor",["wood","checker","carpet","two-tone"]]]},
  bed:{groups:[
    ["headboard","bedHead",["arch","classic","rattan","bows","clouds"]],
    ["duvet","duvet",["solid","stripes","checker","hearts","stars","gingham"]],
    ["pillows","pillows",["one","two","three"],1]]},
  window:{groups:[
    ["window","winStyle",["grid","arch","round","double"]],
    ["curtains","curt",["drapes","sheer","beads","none"]],
    ["sky","sky",["auto","day","sunset","night","rain","snow","aurora"]]]},
  lights:{groups:[
    ["fairy lights","fairyStyle",["sagging","straight","stars","none"]],
    ["lamp","lampStyle",["cone","mushroom","lava","moon"]]]},
  plants:{groups:[
    ["type","plantType",["leafy","hanging","cactus","bamboo"]],
    ["how many","plants",["none","one","two","three","four"],0]]},
  decor:{groups:[
    ["style","artStyle",["circles","arches","photos","banner","neon","shelf"]],
    ["how much","artN",["none","one","two","three"],0]]},
  extras:{toggles:[["desk","desk"],["mirror","mirror"],["beanbag","bean"],
    ["cat!!","cat"],["book pile","books"],["vinyl wall","vinyl"],
    ["disco ball","disco"],["canopy","canopy"],["photo string","photos"],
    ["slippers","slippers"]]},
};
let tab="vibe";
function markRemix(){
  const L=look(cur);L.custom=true;
  $("vibe").textContent=L.vibe[0]+(L.mood<50?" 🌙":" ☀️")+" (your remix)";
}
function renderSheet(){
  const tabsEl=$("tabs");
  tabsEl.innerHTML="";
  Object.keys(SPEC).forEach(k=>{
    const b=document.createElement("button");
    b.textContent=k;b.className=k===tab?"on":"";
    b.onclick=()=>{tab=k;renderSheet();};
    tabsEl.appendChild(b);
  });
  const body=$("sheetBody");body.innerHTML="";
  const L=look(cur),spec=SPEC[tab];
  if(spec.sliders){
    spec.sliders.forEach(([k,label,min,max])=>{
      const row=document.createElement("div");row.className="row";
      const lab=document.createElement("label");lab.textContent=label;
      const inp=document.createElement("input");
      inp.type="range";inp.min=min;inp.max=max;inp.value=L[k];
      inp.addEventListener("input",()=>{L[k]=+inp.value;markRemix();});
      row.appendChild(lab);row.appendChild(inp);body.appendChild(row);
    });
  }
  if(spec.groups){
    spec.groups.forEach(([label,k,opts,base])=>{
      const h=document.createElement("div");h.className="grp";h.textContent=label;
      body.appendChild(h);
      const wrap=document.createElement("div");wrap.className="chips";
      opts.forEach((name,i)=>{
        const v=(base===undefined?0:base)+i;
        const b=document.createElement("button");
        b.textContent=name;
        b.className=(L[k]|0)===v?"on":"";
        b.onclick=()=>{L[k]=v;markRemix();renderSheet();};
        wrap.appendChild(b);
      });
      body.appendChild(wrap);
    });
  }
  if(spec.toggles){
    const wrap=document.createElement("div");wrap.className="chips";
    if(!L.extras)L.extras={};
    spec.toggles.forEach(([name,k])=>{
      const b=document.createElement("button");
      b.textContent=name;
      b.className=L.extras[k]?"on":"";
      b.onclick=()=>{L.extras[k]=!L.extras[k];markRemix();renderSheet();};
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
  }
}
function caption(){
  const L=look(cur);
  $("vibe").textContent=L.vibe[0]+(L.mood<50?" 🌙":" ☀️")+(L.custom?" (your remix)":"");
  $("sub").textContent="@lily.designs · "+L.vibe[1];
  $("likeIco").textContent=liked[cur]?"❤":"♡";
  $("bLike").classList.toggle("liked",!!liked[cur]);
  $("likeN").textContent=saved.length||"";
  renderSheet();
}
function toast(txt){const t2=$("toast");t2.textContent=txt;t2.style.opacity=1;
  clearTimeout(t2._h);t2._h=setTimeout(()=>t2.style.opacity=0,1400);}

let ty0=null,tx0=null,moved=false,lastTap=0;
addEventListener("pointerdown",e=>{
  if(e.target.closest("#rail,#sheet,#gal"))return;
  ty0=e.clientY;tx0=e.clientX;moved=false;
});
addEventListener("pointermove",e=>{
  if(ty0===null)return;
  if(Math.abs(e.clientY-ty0)>12)moved=true;
});
addEventListener("pointerup",e=>{
  if(ty0===null)return;
  const dy=e.clientY-ty0;
  if($("sheet").classList.contains("open")&&!e.target.closest("#sheet")){
    $("sheet").classList.remove("open");
    $("cap").style.opacity=1;$("hint").style.opacity=1;ty0=null;return;}
  if(moved&&Math.abs(dy)>55){
    go(dy<0?1:-1);
  }else if(!moved){
    const now=Date.now();
    if(now-lastTap<320){doLike(true);}
    lastTap=now;
  }
  ty0=null;
});
function go(dir){
  if(trans>0)return;
  if(cur+dir<0)return;
  prev=cur;cur+=dir;transDir=dir;trans=1;
  caption();$("hint").style.display="none";
}
function doLike(fromTap){
  const L=look(cur);
  if(!liked[cur]){
    liked[cur]=true;
    saved.push({...L});
    try{localStorage.setItem("lbd-saved",JSON.stringify(saved.slice(-24)));}catch(e){}
    const bh=$("bigHeart");bh.classList.remove("pop");void bh.offsetWidth;bh.classList.add("pop");
    toast("saved to your rooms 💖");
  }else if(!fromTap){
    liked[cur]=false;
    saved=saved.filter(s2=>s2.seed!==L.seed);
    try{localStorage.setItem("lbd-saved",JSON.stringify(saved));}catch(e){}
    toast("unsaved 🥲");
  }
  caption();
}
$("bLike").onclick=()=>doLike(false);
$("bShuffle").onclick=()=>{
  looks[cur]=makeLook((Math.random()*99999)|0);caption();toast("rerolled 🎲");};
$("bEdit").onclick=()=>{
  const open=$("sheet").classList.toggle("open");
  $("cap").style.opacity=open?0:1;$("hint").style.opacity=open?0:1;
};
$("bGal").onclick=()=>{renderGallery();$("gal").classList.add("open");};
$("galClose").onclick=()=>$("gal").classList.remove("open");
function renderGallery(){
  const th=$("thumbs");th.innerHTML="";
  if(!saved.length){
    th.innerHTML='<div class="empty">no rooms saved yet!<br>double-tap a room you love 💗</div>';
    return;}
  saved.slice().reverse().forEach(sv0=>{
    const sv={...makeLook(sv0.seed||1),...sv0};
    const c2=document.createElement("canvas");
    c2.width=300;c2.height=430;
    renderRoom(c2.getContext("2d"),300,430,sv,1);
    c2.onclick=()=>{looks[cur]={...makeLook(sv.seed||1),...sv,custom:true};caption();
      $("gal").classList.remove("open");toast("loaded 💫");};
    th.appendChild(c2);
  });
}

let lt=0;
function frame(ts){
  const t=ts/1000,dt=Math.min(0.05,(t-lt)||0.016);lt=t;
  if(trans>0){
    trans=Math.max(0,trans-dt*3);
    const u=1-trans;
    const ease=1-Math.pow(1-u,3);
    g.save();g.translate(0,-transDir*ease*H);
    renderRoom(g,W,H,look(prev),t);
    g.restore();
    g.save();g.translate(0,transDir*(1-ease)*H);
    renderRoom(g,W,H,look(cur),t);
    g.restore();
  }else{
    renderRoom(g,W,H,look(cur),t);
  }
  requestAnimationFrame(frame);
}
caption();
requestAnimationFrame(frame);

window.LB={
  get cur(){return cur},get trans(){return trans},
  look(){return look(cur)},go,doLike,
  set(k,v){const L=look(cur);L[k]=v;L.custom=true;},
  get saved(){return saved},
};
</script>
</body>
