<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1030">
<title>Lily's Bedroom Designer</title>
<meta name="description" content="Swipe dream bedrooms. Remix every one.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff9ac4'/%3E%3Cstop offset='1' stop-color='%238a7af0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='16' height='16' rx='4' fill='url(%23g)'/%3E%3Cpath d='M3 12 v-4 l2-2 h6 l2 2 v4 z' fill='%23fff' opacity='0.9'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{position:fixed;inset:0;overflow:hidden;background:#1a1030;
  touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  font-family:-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif}
canvas{display:block;width:100vw;height:100dvh}
#ui{position:fixed;inset:0;pointer-events:none;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#brand{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;
  text-align:center;font-size:14px;font-weight:800;letter-spacing:0.06em;
  background:linear-gradient(90deg,#ffb3d1,#c9b8ff,#a8e6ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 24px rgba(255,180,220,0.25)}
#rail{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 120px);
  display:flex;flex-direction:column;gap:14px;pointer-events:auto}
#rail button{
  width:52px;height:52px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.14);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:#fff;font-size:22px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  box-shadow:0 4px 18px rgba(20,10,40,0.35)}
#rail button span{font-size:10px;font-weight:700;margin-top:-2px}
#likeIco{font-size:22px;margin-top:0}
#rail button:active{transform:scale(0.88)}
#bLike.liked{background:rgba(255,90,140,0.85)}
#cap{position:absolute;left:14px;right:84px;
  bottom:calc(env(safe-area-inset-bottom) + 118px);color:#fff;pointer-events:none}
#vibe{font-size:22px;font-weight:800;text-shadow:0 2px 14px rgba(20,10,40,0.6)}
#sub{font-size:12.5px;opacity:0.85;margin-top:4px;text-shadow:0 1px 8px rgba(20,10,40,0.6)}
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 86px);
  text-align:center;color:rgba(255,255,255,0.75);font-size:11.5px;
  animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#sheet{position:absolute;left:0;right:0;bottom:0;
  background:rgba(26,16,48,0.82);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-radius:22px 22px 0 0;padding:16px 20px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(105%);transition:transform 0.32s cubic-bezier(.2,.9,.25,1);
  pointer-events:auto;color:#fff}
#sheet.open{transform:translateY(0)}
#sheet h3{font-size:13px;font-weight:800;letter-spacing:0.08em;
  text-transform:uppercase;opacity:0.8;margin-bottom:10px;text-align:center}
.row{display:flex;align-items:center;gap:12px;margin:9px 0}
.row label{width:64px;font-size:12.5px;font-weight:700;opacity:0.9}
.row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
  background:linear-gradient(90deg,#ff9ac4,#8a7af0,#7ad8f0)}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 2px 10px rgba(20,10,40,0.5)}
#gal{position:absolute;inset:0;background:rgba(18,10,36,0.94);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;flex-direction:column;pointer-events:auto;color:#fff;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
#gal.open{display:flex}
#gal h2{font-size:17px;font-weight:800;text-align:center;margin-bottom:14px}
#thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;overflow-y:auto;
  touch-action:pan-y}
#thumbs canvas{width:100%;height:auto;border-radius:14px;
  box-shadow:0 4px 16px rgba(0,0,0,0.4)}
#thumbs .empty{grid-column:1/3;text-align:center;opacity:0.7;font-size:13.5px;margin-top:40px}
#galClose{margin-top:12px;border:none;border-radius:999px;padding:12px;
  font-size:14px;font-weight:800;color:#fff;
  background:linear-gradient(90deg,#ff7ab0,#8a7af0)}
#toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);
  background:rgba(255,255,255,0.92);color:#4a2a6a;font-weight:800;font-size:14px;
  padding:10px 20px;border-radius:999px;opacity:0;transition:opacity 0.25s;
  box-shadow:0 6px 24px rgba(20,10,40,0.4)}
#bigHeart{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(0);
  font-size:110px;pointer-events:none;filter:drop-shadow(0 6px 24px rgba(255,90,140,0.6))}
#bigHeart.pop{animation:hp 0.8s ease forwards}
@keyframes hp{0%{transform:translate(-50%,-50%) scale(0)}
  35%{transform:translate(-50%,-50%) scale(1.25)}
  55%{transform:translate(-50%,-50%) scale(1)}
  100%{transform:translate(-50%,-50%) scale(0.9);opacity:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="brand">✿ LILY'S BEDROOM DESIGNER ✿</div>
  <div id="rail">
    <button id="bLike"><span id="likeIco">♡</span><span id="likeN"></span></button>
    <button id="bShuffle">🎲</button>
    <button id="bEdit">🎚</button>
    <button id="bGal">🖼</button>
  </div>
  <div id="cap"><div id="vibe"></div><div id="sub"></div></div>
  <div id="hint">swipe up for the next room ↑</div>
  <div id="sheet">
    <h3>remix this room</h3>
    <div class="row"><label>walls</label><input type="range" id="sHue" min="0" max="360"></div>
    <div class="row"><label>night</label><input type="range" id="sMood" min="0" max="100"></div>
    <div class="row"><label>cozy</label><input type="range" id="sCozy" min="0" max="100"></div>
    <div class="row"><label>plants</label><input type="range" id="sPlant" min="0" max="4" step="1"></div>
    <div class="row"><label>stuff</label><input type="range" id="sStuff" min="0" max="100"></div>
  </div>
  <div id="gal">
    <h2>your saved rooms</h2>
    <div id="thumbs"></div>
    <button id="galClose">back to the feed</button>
  </div>
  <div id="toast"></div>
  <div id="bigHeart">💖</div>
</div>
<script>
"use strict";
const cv=document.getElementById("c"),g=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);}
resize();addEventListener("resize",resize);
addEventListener("gesturestart",e=>e.preventDefault());

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
function lerp(a,b,u){return a+(b-a)*u;}

const VIBES=[
  ["cloud core","soft and floaty. 10/10 would nap"],
  ["strawberry era","pink but make it study"],
  ["ocean dream","the window is basically a screensaver"],
  ["lavender night","for main character journaling"],
  ["mint retro","your grandma's couch but cool now"],
  ["peach cream","warm like toast. the good kind"],
  ["forest fairy","the plants have opinions"],
  ["butter sunday","this room smells like pancakes, trust"],
  ["cherry cola","a little dramatic. as it should be"],
  ["moon milk","shhh. the stars are on"],
];
function makeLook(seed){
  const r=mulberry(seed*2654435761+7);
  const hue=Math.floor(r()*360);
  const mood=r()<0.42?20+r()*25:62+r()*34;
  const look={seed,hue,
    mood:Math.round(mood),
    cozy:Math.round(35+r()*60),
    plants:1+Math.floor(r()*3.4),
    stuff:Math.round(30+r()*65),
    bed:Math.floor(r()*3),rug:Math.floor(r()*3),
    art:Math.floor(r()*3),
  };
  const vi=Math.floor((hue/360)*VIBES.length)%VIBES.length;
  look.vibe=VIBES[(vi+(mood<50?5:0))%VIBES.length];
  return look;
}

function px(x,y,z){
  const cx=W/2,hw=lerp(W*0.78,W*0.30,z);
  const fy=lerp(H*0.90,H*0.615,z),cy2=lerp(H*0.02,H*0.28,z);
  return[cx+x*hw,lerp(fy,cy2,y)];
}
function poly(pts,fill){g.beginPath();
  pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));
  g.closePath();if(fill){g.fillStyle=fill;g.fill();}}

function renderRoom(g,W,H,L,t){
  const day=L.mood/100;
  const night=1-day;
  const wallL=lerp(30,74,day),wallS=lerp(30,42,day);
  const wl=(dl,ds)=>`hsl(${L.hue} ${wallS+(ds||0)}% ${wallL+dl}%)`;
  const acc=(L.hue+165)%360;
  const accCol=(l)=>`hsl(${acc} 65% ${l}%)`;
  const wood=`hsl(28 42% ${lerp(26,60,day)}%)`;
  function P(x,y,z){
    const cx=W/2,hw=lerp(W*0.78,W*0.30,z);
    const fy=lerp(H*0.90,H*0.615,z),cy2=lerp(H*0.02,H*0.28,z);
    return[cx+x*hw,lerp(fy,cy2,y)];
  }
  const sky=g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,wl(6));sky.addColorStop(1,wl(-4));
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  const ceil=g.createLinearGradient(0,P(0,1,0)[1],0,P(0,1,1)[1]);
  ceil.addColorStop(0,wl(10));ceil.addColorStop(1,wl(2));
  poly([P(-1,1,0),P(1,1,0),P(1,1,1),P(-1,1,1)],null);g.fillStyle=ceil;g.fill();
  const bw=g.createLinearGradient(0,P(0,1,1)[1],0,P(0,0,1)[1]);
  bw.addColorStop(0,wl(4));bw.addColorStop(1,wl(-6));
  poly([P(-1,0,1),P(1,0,1),P(1,1,1),P(-1,1,1)],null);g.fillStyle=bw;g.fill();
  const lwg=g.createLinearGradient(P(-1,0,0)[0],0,P(-1,0,1)[0],0);
  lwg.addColorStop(0,wl(-10));lwg.addColorStop(1,wl(-2));
  poly([P(-1,0,0),P(-1,1,0),P(-1,1,1),P(-1,0,1)],null);g.fillStyle=lwg;g.fill();
  const rwg=g.createLinearGradient(P(1,0,0)[0],0,P(1,0,1)[0],0);
  rwg.addColorStop(0,wl(-14));rwg.addColorStop(1,wl(-4));
  poly([P(1,0,0),P(1,1,0),P(1,1,1),P(1,0,1)],null);g.fillStyle=rwg;g.fill();
  const fg=g.createLinearGradient(0,P(0,0,1)[1],0,P(0,0,0)[1]);
  fg.addColorStop(0,wood);fg.addColorStop(1,`hsl(24 40% ${lerp(16,48,day)}%)`);
  poly([P(-1,0,0),P(1,0,0),P(1,0,1),P(-1,0,1)],null);g.fillStyle=fg;g.fill();
  g.strokeStyle="rgba(0,0,0,0.08)";g.lineWidth=1;
  for(let i=1;i<7;i++){const x=-1+i*2/7;
    g.beginPath();g.moveTo(...P(x,0,0));g.lineTo(...P(x,0,1));g.stroke();}

  const wx0=-0.62,wx1=0.12,wy0=0.32,wy1=0.86;
  const w00=P(wx0,wy0,1),w11=P(wx1,wy1,1);
  const winW=w11[0]-w00[0],winH=w00[1]-w11[1];
  const skyg=g.createLinearGradient(0,w11[1],0,w00[1]);
  if(day>0.5){skyg.addColorStop(0,`hsl(${lerp(210,200,day)} 80% ${lerp(60,74,day)}%)`);
    skyg.addColorStop(1,`hsl(${lerp(30,45,day)} 90% ${lerp(70,82,day)}%)`);}
  else{skyg.addColorStop(0,"hsl(248 45% 16%)");skyg.addColorStop(1,"hsl(268 40% 30%)");}
  g.fillStyle=skyg;g.fillRect(w00[0],w11[1],winW,winH);
  if(day>0.5){
    const sun=g.createRadialGradient(w00[0]+winW*0.7,w11[1]+winH*0.32,2,
      w00[0]+winW*0.7,w11[1]+winH*0.32,winW*0.3);
    sun.addColorStop(0,"rgba(255,240,200,0.95)");sun.addColorStop(1,"rgba(255,240,200,0)");
    g.fillStyle=sun;g.fillRect(w00[0],w11[1],winW,winH);
    g.fillStyle="rgba(255,255,255,0.85)";
    [[0.25,0.3,16],[0.42,0.26,11]].forEach(([fx,fy2,r2])=>{
      g.beginPath();g.arc(w00[0]+winW*fx,w11[1]+winH*fy2,r2*0.6,0,6.29);
      g.arc(w00[0]+winW*fx+10,w11[1]+winH*fy2-3,r2*0.45,0,6.29);
      g.arc(w00[0]+winW*fx+19,w11[1]+winH*fy2+1,r2*0.5,0,6.29);g.fill();});
  }else{
    g.fillStyle="#f4ecd8";
    g.beginPath();g.arc(w00[0]+winW*0.68,w11[1]+winH*0.3,winW*0.09,0,6.29);g.fill();
    g.fillStyle="hsl(258 45% 22%)";
    g.beginPath();g.arc(w00[0]+winW*0.72,w11[1]+winH*0.28,winW*0.075,0,6.29);g.fill();
    const rs=mulberry(L.seed+9);
    g.fillStyle="rgba(255,255,255,0.9)";
    for(let i=0;i<14;i++){
      const sx2=w00[0]+rs()*winW,sy2=w11[1]+rs()*winH*0.8;
      const tw=0.5+Math.sin(t*2+i*1.7)*0.5;
      g.globalAlpha=0.3+tw*0.7;
      g.fillRect(sx2,sy2,2,2);g.globalAlpha=1;}
  }
  g.strokeStyle=wl(14);g.lineWidth=6;
  g.strokeRect(w00[0]-3,w11[1]-3,winW+6,winH+6);
  g.lineWidth=2.5;
  g.beginPath();g.moveTo(w00[0]+winW/2,w11[1]);g.lineTo(w00[0]+winW/2,w00[1]);
  g.moveTo(w00[0],w11[1]+winH/2);g.lineTo(w11[0],w11[1]+winH/2);g.stroke();
  const cg=g.createLinearGradient(0,w11[1]-10,0,w00[1]+20);
  cg.addColorStop(0,accCol(lerp(38,72,day)));cg.addColorStop(1,accCol(lerp(30,62,day)));
  g.fillStyle=cg;
  [[w00[0]-30,w00[0]-4],[w11[0]+4,w11[0]+30]].forEach(([a,b])=>{
    g.beginPath();g.moveTo(a,w11[1]-12);g.lineTo(b,w11[1]-12);
    g.lineTo(b+3,w00[1]+16);
    g.quadraticCurveTo((a+b)/2,w00[1]+26,a-3,w00[1]+16);g.closePath();g.fill();});

  const rugZ=0.4,rugCX=-0.22;
  const rc=P(rugCX,0,rugZ);
  const rw2=lerp(W*0.78,W*0.30,rugZ)*(L.rug===2?0.62:0.5),rh2=rw2*0.32;
  const rug=g.createRadialGradient(rc[0],rc[1],4,rc[0],rc[1],rw2);
  rug.addColorStop(0,accCol(lerp(55,84,day)));
  rug.addColorStop(0.7,accCol(lerp(45,74,day)));
  rug.addColorStop(1,accCol(lerp(38,66,day)));
  g.fillStyle=rug;
  g.beginPath();
  if(L.rug===1)g.roundRect(rc[0]-rw2*0.9,rc[1]-rh2,rw2*1.8,rh2*2,18);
  else g.ellipse(rc[0],rc[1],rw2,rh2,0,0,6.29);
  g.fill();
  g.strokeStyle="rgba(255,255,255,0.35)";g.lineWidth=2;
  g.beginPath();
  if(L.rug===1)g.roundRect(rc[0]-rw2*0.72,rc[1]-rh2*0.72,rw2*1.44,rh2*1.44,14);
  else g.ellipse(rc[0],rc[1],rw2*0.7,rh2*0.7,0,0,6.29);
  g.stroke();

  const bx0=L.bed===1?0.26:0.34,bx1=0.97;
  const bz0=0.52,bz1=0.95,bh=0.30;
  const bA=P(bx0,0,bz0),bB=P(bx1,0,bz0),bC=P(bx1,0,bz1),bD=P(bx0,0,bz1);
  const tA=P(bx0,bh*0.6,bz0),tB=P(bx1,bh*0.6,bz0),tC=P(bx1,bh*0.6,bz1),tD=P(bx0,bh*0.6,bz1);
  g.fillStyle="rgba(10,5,25,0.22)";
  g.beginPath();g.ellipse((bA[0]+bC[0])/2,bA[1]+6,(bB[0]-bA[0])*0.62,16,0,0,6.29);g.fill();
  const hb0=P(bx0,0,bz1),hb1=P(bx1,0,bz1);
  const hbTop=P((bx0+bx1)/2,bh*1.7,bz1);
  const hbg=g.createLinearGradient(0,hbTop[1],0,hb0[1]);
  hbg.addColorStop(0,accCol(lerp(30,64,day)));hbg.addColorStop(1,accCol(lerp(22,52,day)));
  g.fillStyle=hbg;
  if(L.bed===2){
    g.beginPath();g.moveTo(hb0[0],hb0[1]);
    g.lineTo(hb0[0],hbTop[1]+26);
    g.quadraticCurveTo(hb0[0],hbTop[1]-10,(hb0[0]+hb1[0])/2,hbTop[1]-10);
    g.quadraticCurveTo(hb1[0],hbTop[1]-10,hb1[0],hbTop[1]+26);
    g.lineTo(hb1[0],hb1[1]);g.closePath();g.fill();
  }else{
    g.beginPath();g.roundRect(hb0[0],hbTop[1],hb1[0]-hb0[0],hb0[1]-hbTop[1],10);g.fill();
  }
  const bedBase=g.createLinearGradient(0,tA[1],0,bA[1]);
  bedBase.addColorStop(0,wl(2));bedBase.addColorStop(1,wl(-14));
  poly([bA,bB,tB,tA],null);g.fillStyle=bedBase;g.fill();
  poly([bD,bA,tA,tD],null);g.fillStyle=wl(-18);g.fill();
  const duvet=g.createLinearGradient(tD[0],tD[1]-6,tA[0],tA[1]);
  duvet.addColorStop(0,accCol(lerp(52,90,day)));
  duvet.addColorStop(1,accCol(lerp(38,74,day)));
  poly([tA,tB,tC,tD],null);g.fillStyle=duvet;g.fill();
  g.strokeStyle="rgba(255,255,255,0.4)";g.lineWidth=2.5;
  g.beginPath();
  const fz=lerp(bz0,bz1,0.42);
  g.moveTo(...P(bx0,bh*0.6,fz));g.lineTo(...P(bx1,bh*0.6,fz));g.stroke();
  for(const off of[0.08,0.5]){
    const pc=P(lerp(bx0,bx1,off+0.2),bh*0.82,lerp(bz0,bz1,0.82));
    g.fillStyle=`hsl(${L.hue} 32% ${lerp(74,97,day)}%)`;
    g.beginPath();g.ellipse(pc[0],pc[1],26,13,-0.06,0,6.29);g.fill();
    g.strokeStyle="rgba(0,0,0,0.07)";g.lineWidth=1.5;g.stroke();
  }

  const nz=0.78,nx=-0.62;
  const n0=P(nx-0.16,0,nz),n1=P(nx+0.16,0,nz),nt=P(nx,0.22,nz);
  g.fillStyle=wood;
  g.beginPath();g.roundRect(n0[0],nt[1],n1[0]-n0[0],n0[1]-nt[1],6);g.fill();
  g.fillStyle="rgba(255,255,255,0.14)";
  g.fillRect(n0[0]+5,nt[1]+8,n1[0]-n0[0]-10,3);
  const lampX=(n0[0]+n1[0])/2,lampY=nt[1];
  g.strokeStyle=wl(-24);g.lineWidth=3;
  g.beginPath();g.moveTo(lampX,lampY-2);g.lineTo(lampX,lampY-22);g.stroke();
  g.fillStyle=accCol(70);
  g.beginPath();g.moveTo(lampX-14,lampY-22);g.lineTo(lampX+14,lampY-22);
  g.lineTo(lampX+9,lampY-40);g.lineTo(lampX-9,lampY-40);g.closePath();g.fill();
  const lampGlow=lerp(0.5,0.12,day)*(L.cozy/100+0.4);
  const lg2=g.createRadialGradient(lampX,lampY-30,2,lampX,lampY-30,90);
  lg2.addColorStop(0,`rgba(255,214,140,${lampGlow})`);lg2.addColorStop(1,"rgba(255,214,140,0)");
  g.fillStyle=lg2;g.fillRect(lampX-95,lampY-125,190,190);

  const rp=mulberry(L.seed+31);
  for(let i=0;i<L.plants;i++){
    const pxr=-0.86+i*0.17,pz=0.3+rp()*0.3;
    const base=P(pxr,0,pz);
    const sc2=lerp(1.15,0.8,pz);
    g.fillStyle=`hsl(20 45% ${lerp(28,58,day)}%)`;
    g.beginPath();g.moveTo(base[0]-13*sc2,base[1]-24*sc2);
    g.lineTo(base[0]+13*sc2,base[1]-24*sc2);
    g.lineTo(base[0]+9*sc2,base[1]);g.lineTo(base[0]-9*sc2,base[1]);g.closePath();g.fill();
    const lf=`hsl(${140+rp()*30} 45% ${lerp(26,44,day)}%)`;
    g.fillStyle=lf;
    for(let b2=0;b2<5;b2++){
      const ang=-1.9+b2*0.65+Math.sin(t*1.2+i+b2)*0.05;
      const lx=base[0]+Math.cos(ang)*26*sc2,ly=base[1]-24*sc2+Math.sin(ang)*34*sc2;
      g.beginPath();g.ellipse(lx,ly,7*sc2,17*sc2,ang+1.5708,0,6.29);g.fill();
    }
  }

  const stuff=L.stuff/100;
  if(stuff>0.15){
    const shY=0.62,sh0=P(-1,shY,0.55),sh1=P(-1,shY,0.9);
    g.strokeStyle=wood;g.lineWidth=6;g.lineCap="round";
    g.beginPath();g.moveTo(sh0[0]+4,sh0[1]);g.lineTo(sh1[0]+4,sh1[1]);g.stroke();
    const nb=Math.round(2+stuff*5);
    for(let i=0;i<nb;i++){
      const u=i/(nb)+0.05,bx2=lerp(sh0[0],sh1[0],u)+4,by2=lerp(sh0[1],sh1[1],u);
      g.fillStyle=`hsl(${(L.hue+i*47)%360} 55% ${lerp(45,68,day)}%)`;
      g.fillRect(bx2,by2-20-(i%3)*3,7,20+(i%3)*3);
    }
  }
  const artN=Math.round(stuff*3);
  const artY=0.76;
  for(let i=0;i<artN;i++){
    const ax=0.3+i*0.24,ap=P(ax,artY,1);
    g.fillStyle=`hsl(${(acc+i*40)%360} 50% ${lerp(50,78,day)}%)`;
    if((L.art+i)%3===0){g.beginPath();g.arc(ap[0]+20,ap[1],20,0,6.29);g.fill();}
    else if((L.art+i)%3===1){
      g.beginPath();g.moveTo(ap[0],ap[1]+18);
      g.arc(ap[0]+18,ap[1]+2,18,3.14,6.29);g.lineTo(ap[0]+36,ap[1]+18);g.closePath();g.fill();}
    else{g.beginPath();g.roundRect(ap[0],ap[1]-16,34,42,6);g.fill();
      g.fillStyle="rgba(255,255,255,0.4)";
      g.beginPath();g.arc(ap[0]+17,ap[1]+4,9,0,6.29);g.fill();}
  }

  const fairy=L.cozy/100;
  if(fairy>0.18){
    const fn=Math.round(9+fairy*13);
    const f0=P(-0.98,0.95,1),f1=P(0.98,0.95,1);
    for(let i=0;i<=fn;i++){
      const u=i/fn;
      const fx=lerp(f0[0],f1[0],u),fy2=f0[1]+Math.sin(u*3.14)*34;
      if(i<fn){g.strokeStyle="rgba(255,255,255,0.25)";g.lineWidth=1;
        const u2=(i+1)/fn;
        g.beginPath();g.moveTo(fx,fy2);
        g.lineTo(lerp(f0[0],f1[0],u2),f0[1]+Math.sin(u2*3.14)*34);g.stroke();}
      const glow=(0.55+0.45*Math.sin(t*2.2+i*1.3))*lerp(1,0.5,day);
      const fg2=g.createRadialGradient(fx,fy2,0.5,fx,fy2,10);
      const fc=`hsla(${(L.hue+i*24)%360} 90% 78% /`;
      fg2.addColorStop(0,fc+(0.9*glow)+")");fg2.addColorStop(1,fc+"0)");
      g.fillStyle=fg2;g.fillRect(fx-11,fy2-11,22,22);
      g.fillStyle=`hsla(50 100% 92% / ${0.5+glow*0.5})`;
      g.beginPath();g.arc(fx,fy2,1.8,0,6.29);g.fill();
    }
  }

  if(day>0.5){
    g.fillStyle=`rgba(255,236,190,${(day-0.5)*0.18})`;
    poly([[w00[0],w00[1]],[w11[0],w11[1]+winH*0.2],
      P(0.4,0,0.2),P(-0.7,0,0.1)],g.fillStyle);
  }else{
    g.fillStyle=`rgba(24,14,52,${(0.5-day)*0.5})`;
    g.fillRect(0,0,W,H);
    const moonGlow=g.createRadialGradient(W/2,H*0.44,10,W/2,H*0.44,W*0.7);
    moonGlow.addColorStop(0,"rgba(180,160,255,0.10)");
    moonGlow.addColorStop(1,"rgba(180,160,255,0)");
    g.fillStyle=moonGlow;g.fillRect(0,0,W,H);
  }
  const rs2=mulberry(L.seed+77);
  g.fillStyle="rgba(255,255,255,0.5)";
  for(let i=0;i<10;i++){
    const mx=rs2()*W,my=rs2()*H*0.8;
    const dr=Math.sin(t*0.6+i*2.1)*8;
    g.globalAlpha=0.12+0.12*Math.sin(t*1.1+i);
    g.beginPath();g.arc(mx+dr,my+dr*0.6,1.6,0,6.29);g.fill();
  }
  g.globalAlpha=1;
  const vg=g.createRadialGradient(W/2,H*0.45,H*0.3,W/2,H*0.45,H*0.85);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(10,5,25,0.32)");
  g.fillStyle=vg;g.fillRect(0,0,W,H);
}

let cur=0,prev=0,looks={},trans=0,transDir=0,liked={},saved=[];
try{saved=JSON.parse(localStorage.getItem("lbd-saved")||"[]");}catch(e){}
function look(i){if(!looks[i])looks[i]=makeLook(i+1);return looks[i];}

const $=id=>document.getElementById(id);
function caption(){
  const L=look(cur);
  $("vibe").textContent=L.vibe[0]+(L.mood<50?" 🌙":" ☀️")+(L.custom?" (your remix)":"");
  $("sub").textContent="@lily.designs · "+L.vibe[1];
  $("likeIco").textContent=liked[cur]?"❤":"♡";
  $("bLike").classList.toggle("liked",!!liked[cur]);
  $("likeN").textContent=saved.length||"";
  const l=look(cur);
  $("sHue").value=l.hue;$("sMood").value=l.mood;$("sCozy").value=l.cozy;
  $("sPlant").value=l.plants;$("sStuff").value=l.stuff;
}
function toast(txt){const t2=$("toast");t2.textContent=txt;t2.style.opacity=1;
  clearTimeout(t2._h);t2._h=setTimeout(()=>t2.style.opacity=0,1400);}

let ty0=null,tx0=null,moved=false,lastTap=0;
addEventListener("pointerdown",e=>{
  if(e.target.closest("#rail,#sheet,#gal"))return;
  ty0=e.clientY;tx0=e.clientX;moved=false;
});
addEventListener("pointermove",e=>{
  if(ty0===null)return;
  if(Math.abs(e.clientY-ty0)>12)moved=true;
});
addEventListener("pointerup",e=>{
  if(ty0===null)return;
  const dy=e.clientY-ty0;
  if($("sheet").classList.contains("open")&&!e.target.closest("#sheet")){
    $("sheet").classList.remove("open");
    $("cap").style.opacity=1;$("hint").style.opacity=1;ty0=null;return;}
  if(moved&&Math.abs(dy)>55){
    go(dy<0?1:-1);
  }else if(!moved){
    const now=Date.now();
    if(now-lastTap<320){doLike(true);}
    lastTap=now;
  }
  ty0=null;
});
function go(dir){
  if(trans>0)return;
  if(cur+dir<0)return;
  prev=cur;cur+=dir;transDir=dir;trans=1;
  caption();$("hint").style.display="none";
}
function doLike(fromTap){
  const L=look(cur);
  if(!liked[cur]){
    liked[cur]=true;
    saved.push({...L});
    try{localStorage.setItem("lbd-saved",JSON.stringify(saved.slice(-24)));}catch(e){}
    const bh=$("bigHeart");bh.classList.remove("pop");void bh.offsetWidth;bh.classList.add("pop");
    toast("saved to your rooms 💖");
  }else if(!fromTap){
    liked[cur]=false;
    saved=saved.filter(s2=>s2.seed!==L.seed);
    try{localStorage.setItem("lbd-saved",JSON.stringify(saved));}catch(e){}
    toast("unsaved 🥲");
  }
  caption();
}
$("bLike").onclick=()=>doLike(false);
$("bShuffle").onclick=()=>{
  looks[cur]=makeLook((Math.random()*99999)|0);caption();toast("rerolled 🎲");};
$("bEdit").onclick=()=>{
  const open=$("sheet").classList.toggle("open");
  $("cap").style.opacity=open?0:1;$("hint").style.opacity=open?0:1;
};
$("bGal").onclick=()=>{renderGallery();$("gal").classList.add("open");};
$("galClose").onclick=()=>$("gal").classList.remove("open");
[["sHue","hue"],["sMood","mood"],["sCozy","cozy"],["sPlant","plants"],["sStuff","stuff"]]
.forEach(([id,k])=>{
  $(id).addEventListener("input",()=>{
    const L=look(cur);L[k]=+$(id).value;L.custom=true;
    $("vibe").textContent=L.vibe[0]+(L.mood<50?" 🌙":" ☀️")+" (your remix)";
  });
});
function renderGallery(){
  const th=$("thumbs");th.innerHTML="";
  if(!saved.length){
    th.innerHTML='<div class="empty">no rooms saved yet!<br>double-tap a room you love 💗</div>';
    return;}
  saved.slice().reverse().forEach(sv=>{
    const c2=document.createElement("canvas");
    c2.width=300;c2.height=430;
    renderRoom(c2.getContext("2d"),300,430,sv,1);
    c2.onclick=()=>{looks[cur]={...sv,custom:true};caption();
      $("gal").classList.remove("open");toast("loaded 💫");};
    th.appendChild(c2);
  });
}

let lt=0;
function frame(ts){
  const t=ts/1000,dt=Math.min(0.05,(t-lt)||0.016);lt=t;
  if(trans>0){
    trans=Math.max(0,trans-dt*3);
    const u=1-trans;
    const ease=1-Math.pow(1-u,3);
    g.save();g.translate(0,-transDir*ease*H);
    renderRoom(g,W,H,look(prev),t);
    g.restore();
    g.save();g.translate(0,transDir*(1-ease)*H);
    renderRoom(g,W,H,look(cur),t);
    g.restore();
  }else{
    renderRoom(g,W,H,look(cur),t);
  }
  requestAnimationFrame(frame);
}
caption();
requestAnimationFrame(frame);

window.LB={
  get cur(){return cur},get trans(){return trans},
  look(){return look(cur)},go,doLike,
  set(k,v){const L=look(cur);L[k]=v;L.custom=true;},
  get saved(){return saved},
};
</script>
</body>
