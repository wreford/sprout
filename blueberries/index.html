<script>
"use strict";
const cv=document.getElementById("c"),g=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);}
resize();addEventListener("resize",resize);

const SKY_TOP="#8fd4f2",SKY_BOT="#dff4fb",GRASS="#8fce6a",GRASS_D="#6fb350";
const BERRY="#4a5fb5",BERRY_D="#37478f",BERRY_HI="#aab8ef",GOLD="#f2b234",GOLD_HI="#ffe08a";
const SKIN="#ffe3c8",BLUSH="rgba(255,140,140,0.5)",INK="#3a3230";
const KDRESS="#5a8fd6",KDRESS_D="#3f6fb3",LDRESS="#e07a9b",LDRESS_D="#c25c7f";
const KHAIR="#f5d76e",KHAIR_D="#e0b93f",LHAIR="#7a4e2d",LHAIR_D="#5f3a1e";

let AC=null,muted=false;
function beep(f,d,type,vol,slide){
  if(muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime;
    o.type=type||"sine";o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    v.gain.setValueAtTime(vol||0.12,t);
    v.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(v).connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
function popSfx(combo){beep(420+Math.min(combo,12)*55,0.14,"sine",0.14,760+combo*40);}
function goldSfx(){beep(880,0.09,"triangle",0.14,1320);setTimeout(()=>beep(1320,0.12,"triangle",0.12,1760),70);}
function missSfx(){beep(300,0.3,"sawtooth",0.06,120);}
function overSfx(){beep(340,0.4,"triangle",0.1,160);setTimeout(()=>beep(220,0.6,"triangle",0.1,110),240);}
function midi(n){return 440*Math.pow(2,(n-69)/12);}
const TUNE={bpm:138,bass:[48,53,57,55],
  mel:[72,76,79,76,84,79,76,79,
       74,77,81,77,86,81,77,74,
       76,79,81,79,88,84,79,76,
       74,79,77,74,72,null,67,71]};
let mTimer=null,mStep=0,mNext=0;
function schedNote(fr,t0,d,type,vol){
  const o=AC.createOscillator(),v=AC.createGain();
  o.type=type;o.frequency.value=fr;
  v.gain.setValueAtTime(0.0001,t0);
  v.gain.linearRampToValueAtTime(vol,t0+0.02);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(v).connect(AC.destination);o.start(t0);o.stop(t0+d+0.05);
}
function musicTick(){
  if(!AC)return;
  if(muted||state!=="play"){mNext=AC.currentTime+0.12;return;}
  const stepDur=60/TUNE.bpm/2;
  if(mNext<AC.currentTime)mNext=AC.currentTime+0.05;
  while(mNext<AC.currentTime+0.4){
    const st=mStep%32;
    if(st%8===0)schedNote(midi(TUNE.bass[(st/8)|0]),mNext,stepDur*6,"triangle",0.028);
    const m=TUNE.mel[st];
    if(m!==null&&(st%2===0||frenzyT>0))schedNote(midi(m),mNext,stepDur*1.6,"sine",0.018);
    mNext+=stepDur;mStep++;
  }
}
function ensureMusic(){
  if(mTimer)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();}catch(e){return;}
  if(!AC)return;
  mNext=AC.currentTime+0.15;
  mTimer=setInterval(musicTick,110);
}
document.addEventListener("visibilitychange",()=>{
  if(!AC)return;
  if(document.hidden)AC.suspend();else if(!muted)AC.resume();
});

const LINES={
  start:["Kenzie. The berries. They are FALLING.",
    "Today's forecast: 100% blueberries.",
    "Stretch first. The berries show no mercy.",
    "Remember your training. There was no training."],
  catch3:["Three! The berries whisper your name.",
    "Okay, warm-up's over, show-off.",
    "Catch level: little bit famous."],
  catch10:["TEN in a row. Are your hands magnets?",
    "The blueberry council fears you.",
    "I've never been prouder. Don't tell Mom."],
  catch20:["TWENTY?! I'm calling the newspaper.",
    "You are the chosen one. Of fruit.",
    "This is the greatest thing I've ever narrated."],
  gold:["SHINY ONE! Eat it! No wait — sell it!",
    "A golden berry. We're rich. Ish.",
    "That one tasted like homework being cancelled."],
  miss:["That one had a family!",
    "It's fine. It's compost now.",
    "I saw that. The berry saw that.",
    "We do not speak of that berry.",
    "The ground says thank you, I guess."],
  lastHeart:["Careful!! I can't watch. I'm watching.",
    "One heart left. No pressure. SO much pressure."],
  fifty:["FIFTY! That's basically a pie.",
    "Fifty berries! We could open a tiny store."],
  hundred:["ONE HUNDRED. You're a legend and I'm your witness.",
    "A hundred berries. My arms hurt from pointing."],
  acorn:["That was an acorn. A classic.",
    "Crunchy. Not a berry. Bold choice.",
    "The acorn union thanks you for your donation.",
    "An acorn. In THIS economy."],
  heartb:["A heart berry! Medically questionable. Emotionally correct.",
    "Refund from the universe!",
    "Aw. The sky apologized."],
  rainbow:["RAINBOW BERRY! Everything is berries now!",
    "Taste the weather, Kenzie!",
    "The sky is showing off. Catch it all!"],
  frenzyEnd:["Okay. Breathe. The sky ran out.",
    "That was the most berries I have ever narrated.",
    "I need to sit down. I am sitting down."],
  goldMiss:["THAT ONE WAS GOLD. We don't talk about it.",
    "A golden berry, gone. My college fund.",
    "I'm not crying. It's berry juice."],
  bunny:["That rabbit pays no taxes.",
    "Ignore the bunny. He's a berry spy.",
    "The bunny again. He never buys anything."],
  wave:["New wave! The berries are organizing.",
    "They're sending their best now.",
    "The berry council has escalated things."],
  idle:["The berries fall whether we're ready or not. Deep.",
    "I'd help, but someone has to do the commentary.",
    "Blueberries are just tiny round Mondays.",
    "I'm not saying berries are plotting. But look at them."],
  over:["We'll tell the berries you tried.",
    "A moment of silence for the fallen. Then rematch.",
    "The good news: infinite berries. The bad news: also that."],
};
let lastLine="";
function pick(k){
  const a=LINES[k];let s=a[(Math.random()*a.length)|0],n=0;
  while(s===lastLine&&n++<5)s=a[(Math.random()*a.length)|0];
  lastLine=s;return s;
}

let state="menu",score=0,best=0,hearts=3,combo=0,bestCombo=0;
try{best=parseInt(localStorage.getItem("bb-best")||"0",10)||0;}catch(e){}
let kx=0,kvx=0,targetX=null,squash=0,lean=0;
let berries=[],parts=[],pops=[],clouds=[];
let spawnT=0,elapsed=0,idleT=0,shakeT=0;
let bubble=null,lilyMood="normal",lilyMoodT=0;
let frenzyT=0,stunT=0,wave=0,banner=null,bunny=null,bunnyT=14,butterflies=[];
for(let i=0;i<2;i++)butterflies.push({x:Math.random(),y:0.3+Math.random()*0.25,ph:Math.random()*6,hue:[330,45][i],dir:i?1:-1});
function say(k,mood){
  bubble={txt:pick(k),t:3.1};
  if(mood){lilyMood=mood;lilyMoodT=1.6;}
}
for(let i=0;i<5;i++)clouds.push({x:Math.random(),y:0.08+Math.random()*0.24,s:0.6+Math.random()*0.8,v:6+Math.random()*8});

function groundY(){return H-Math.min(110,H*0.16);}
function kenzieY(){return groundY()+14;}
function lilyPos(){return{x:46,y:kenzieY()+8};}
function laneMin(){return 118;}

function reset(){
  score=0;hearts=3;combo=0;bestCombo=0;berries=[];parts=[];pops=[];
  spawnT=0.4;elapsed=0;idleT=0;kx=Math.max(laneMin(),W/2);targetX=null;
  frenzyT=0;stunT=0;wave=0;banner=null;bunny=null;bunnyT=10;
}
function start(){reset();state="play";say("start","laugh");}

function spawnBerry(){
  let kind="norm";
  const r=Math.random();
  if(frenzyT>0)kind="norm";
  else if(hearts<3&&r<0.035)kind="heart";
  else if(r<0.062)kind="rainbow";
  else if(r<0.145)kind="gold";
  else if(score>=10&&r<0.145+0.1)kind="acorn";
  let v=110+Math.min(elapsed*4.5,260)+Math.random()*40;
  if(frenzyT>0)v*=0.62;
  berries.push({x:laneMin()+14+Math.random()*(W-laneMin()-52),y:-24,v,
    sway:Math.random()*6.28,r:kind==="gold"?12:13,kind,rot:Math.random()*6.28});
}
function sparkle(x,y,col,n){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*130;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,t:0.5+Math.random()*0.3,col,r:2+Math.random()*2.5});}
}
function splat(x,y){
  for(let i=0;i<9;i++){const a=-Math.random()*3.14,s=30+Math.random()*90;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0.5+Math.random()*0.3,col:BERRY_D,r:2+Math.random()*3,gr:1});}
}

function doCatch(b){
  if(b.kind==="acorn"){
    stunT=1.1;combo=0;squash=1;
    beep(150,0.22,"square",0.09,80);
    sparkle(b.x,b.y,"#8a6238",8);
    pops.push({x:b.x,y:b.y-10,txt:"ow",t:0.9,col:"#7a5230"});
    say("acorn","laugh");return;
  }
  combo++;bestCombo=Math.max(bestCombo,combo);
  let pts=1;
  if(b.kind==="gold")pts=5;
  score+=pts;squash=1;
  const col=b.kind==="gold"?GOLD_HI:b.kind==="heart"?"#ffc2d4":BERRY_HI;
  sparkle(b.x,b.y,col,b.kind==="norm"?9:16);
  pops.push({x:b.x,y:b.y-10,txt:b.kind==="heart"?"+♥":"+"+pts,t:0.8,col:b.kind==="gold"?GOLD:b.kind==="heart"?"#ef6f96":BERRY_D});
  if(b.kind==="gold"){goldSfx();say("gold","laugh");}
  else if(b.kind==="heart"){hearts=Math.min(3,hearts+1);
    beep(660,0.1,"triangle",0.1,990);setTimeout(()=>beep(990,0.14,"triangle",0.1,1320),80);
    say("heartb","laugh");}
  else if(b.kind==="rainbow"){frenzyT=4.6;
    [660,830,990,1320].forEach((fq,i)=>setTimeout(()=>beep(fq,0.12,"triangle",0.1),i*70));
    say("rainbow","laugh");}
  else popSfx(combo);
  if(score===50)say("fifty","laugh");
  else if(score===100)say("hundred","laugh");
  else if(combo===10)say("catch10","laugh");
  else if(combo===20)say("catch20","laugh");
  else if(combo===3&&score<20)say("catch3","normal");
  const nw=Math.floor(score/25);
  if(nw>wave){wave=nw;banner={txt:"wave "+(wave+1),t:2};
    if(Math.random()<0.7)say("wave","normal");}
}
function confetti(){
  for(let i=0;i<60;i++){
    const a=Math.random()*6.28,sp=80+Math.random()*260;
    parts.push({x:W/2,y:H*0.3,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,
      t:1+Math.random()*0.8,col:`hsl(${Math.random()*360} 85% 62%)`,r:2.5+Math.random()*3,gr:1});
  }
}
function doMiss(b){
  if(b.kind==="acorn"){
    sparkle(b.x,groundY(),"#8a6238",4);return;
  }
  if(b.kind==="heart"||b.kind==="rainbow"){
    sparkle(b.x,groundY(),b.kind==="heart"?"#ffc2d4":"#c9a6ef",7);
    return;
  }
  splat(b.x,groundY()+4);
  hearts--;combo=0;shakeT=0.3;missSfx();
  if(hearts<=0){
    state="over";overSfx();say("over","shock");
    if(score>best&&best>0)confetti();
    if(score>best){best=score;try{localStorage.setItem("bb-best",""+best);}catch(e){}}
  }else if(b.kind==="gold")say("goldMiss","shock");
  else say(hearts===1?"lastHeart":"miss","shock");
}

function px(e){const r=cv.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;return t.clientX-r.left;}
addEventListener("pointerdown",e=>{
  ensureMusic();
  if(state==="menu"||state==="over"){start();return;}
  const x=px(e),y=e.clientY;
  if(x>W-56&&y<56){muted=!muted;return;}
  targetX=x;
});
addEventListener("pointermove",e=>{if(state==="play"&&e.buttons)targetX=px(e);});
addEventListener("touchmove",e=>{if(state==="play")targetX=px(e);e.preventDefault();},{passive:false});
const keys={};
addEventListener("keydown",e=>{
  keys[e.key]=1;
  if((state==="menu"||state==="over")&&(e.key===" "||e.key==="Enter"))start();
});
addEventListener("keyup",e=>{keys[e.key]=0;});
addEventListener("blur",()=>{if(state==="play")state="pause";});
addEventListener("pointerdown",()=>{if(state==="pause")state="play";});

function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

function drawBerry(x,y,r,kind,rot){
  if(kind===true)kind="gold";if(!kind||kind===false)kind="norm";
  g.save();g.translate(x,y);
  if(kind==="acorn"){
    g.fillStyle="#b5875a";
    g.beginPath();g.ellipse(0,r*0.18,r*0.72,r*0.85,0,0,6.29);g.fill();
    g.fillStyle="#7a5230";
    g.beginPath();g.ellipse(0,-r*0.45,r*0.82,r*0.42,0,3.14,6.29);g.fill();
    g.fillRect(-r*0.82,-r*0.5,r*1.64,r*0.22);
    g.strokeStyle="#5f3f24";g.lineWidth=2;g.lineCap="round";
    g.beginPath();g.moveTo(0,-r*0.85);g.lineTo(0,-r*1.2);g.stroke();
    g.fillStyle=INK;
    g.beginPath();g.arc(-r*0.26,r*0.1,1.7,0,6.29);g.fill();
    g.beginPath();g.arc(r*0.26,r*0.1,1.7,0,6.29);g.fill();
    g.beginPath();g.ellipse(0,r*0.42,1.9,2.6,0,0,6.29);g.fill();
    g.restore();return;
  }
  if(kind==="heart"){
    g.fillStyle="#ef6f96";
    g.beginPath();
    g.moveTo(0,r*0.85);
    g.bezierCurveTo(-r*1.35,-r*0.15,-r*0.55,-r*1.1,0,-r*0.3);
    g.bezierCurveTo(r*0.55,-r*1.1,r*1.35,-r*0.15,0,r*0.85);
    g.fill();
    g.fillStyle="#ffc2d4";
    g.beginPath();g.arc(-r*0.4,-r*0.32,r*0.24,0,6.29);g.fill();
  }else{
    const body=kind==="gold"?GOLD:kind==="rainbow"?`hsl(${(rot*140)%360} 75% 62%)`:BERRY;
    g.fillStyle=body;
    g.beginPath();g.arc(0,0,r,0,6.29);g.fill();
    g.fillStyle=kind==="gold"?GOLD_HI:"rgba(255,255,255,0.55)";
    g.beginPath();g.arc(-r*0.35,-r*0.35,r*0.32,0,6.29);g.fill();
    g.strokeStyle="#3c7a3c";g.lineWidth=2.4;g.lineCap="round";
    g.beginPath();g.moveTo(0,-r);g.quadraticCurveTo(r*0.4,-r*1.5,r*0.7,-r*1.35);g.stroke();
    g.fillStyle="#57a557";
    g.beginPath();g.ellipse(r*0.8,-r*1.32,r*0.42,r*0.2,-0.5,0,6.29);g.fill();
  }
  if(r>=9){
    const blink=((rot*3)%4)<0.25;
    g.fillStyle=INK;g.strokeStyle=INK;g.lineWidth=1.6;g.lineCap="round";
    if(kind==="gold"){
      g.beginPath();g.arc(-r*0.28,-r*0.05,r*0.16,3.3,6.1);g.stroke();
      g.beginPath();g.arc(r*0.28,-r*0.05,r*0.16,3.3,6.1);g.stroke();
    }else if(blink){
      g.beginPath();g.moveTo(-r*0.42,-r*0.02);g.lineTo(-r*0.14,-r*0.02);
      g.moveTo(r*0.14,-r*0.02);g.lineTo(r*0.42,-r*0.02);g.stroke();
    }else{
      g.beginPath();g.arc(-r*0.28,-r*0.05,r*0.13,0,6.29);g.fill();
      g.beginPath();g.arc(r*0.28,-r*0.05,r*0.13,0,6.29);g.fill();
      g.fillStyle="#fff";
      g.beginPath();g.arc(-r*0.33,-r*0.11,r*0.05,0,6.29);g.fill();
      g.beginPath();g.arc(r*0.23,-r*0.11,r*0.05,0,6.29);g.fill();
      g.fillStyle=INK;
    }
    g.beginPath();g.arc(0,r*0.22,r*0.24,0.4,2.74);g.stroke();
    g.fillStyle="rgba(255,150,160,0.55)";
    g.beginPath();g.ellipse(-r*0.52,r*0.2,r*0.14,r*0.09,0,0,6.29);g.fill();
    g.beginPath();g.ellipse(r*0.52,r*0.2,r*0.14,r*0.09,0,0,6.29);g.fill();
  }
  g.restore();
}

function face(x,y,s,mood,blink){
  g.fillStyle=INK;
  if(blink){
    g.lineWidth=2*s;g.strokeStyle=INK;g.lineCap="round";
    g.beginPath();g.moveTo(x-7*s,y);g.lineTo(x-3*s,y);
    g.moveTo(x+3*s,y);g.lineTo(x+7*s,y);g.stroke();
  }else if(mood==="laugh"){
    g.lineWidth=2*s;g.strokeStyle=INK;g.lineCap="round";
    g.beginPath();g.arc(x-5*s,y+1*s,3*s,3.4,5.9);g.stroke();
    g.beginPath();g.arc(x+5*s,y+1*s,3*s,3.4,5.9);g.stroke();
  }else if(mood==="shock"){
    g.beginPath();g.arc(x-5*s,y,2.6*s,0,6.29);g.fill();
    g.beginPath();g.arc(x+5*s,y,2.6*s,0,6.29);g.fill();
    g.fillStyle="#fff";
    g.beginPath();g.arc(x-5.8*s,y-0.8*s,0.9*s,0,6.29);g.fill();
    g.beginPath();g.arc(x+4.2*s,y-0.8*s,0.9*s,0,6.29);g.fill();
  }else{
    g.beginPath();g.arc(x-5*s,y,2.2*s,0,6.29);g.fill();
    g.beginPath();g.arc(x+5*s,y,2.2*s,0,6.29);g.fill();
    g.fillStyle="#fff";
    g.beginPath();g.arc(x-5.7*s,y-0.7*s,0.8*s,0,6.29);g.fill();
    g.beginPath();g.arc(x+4.3*s,y-0.7*s,0.8*s,0,6.29);g.fill();
  }
  g.fillStyle=BLUSH;
  g.beginPath();g.ellipse(x-8.5*s,y+4*s,2.6*s,1.6*s,0,0,6.29);g.fill();
  g.beginPath();g.ellipse(x+8.5*s,y+4*s,2.6*s,1.6*s,0,0,6.29);g.fill();
  g.strokeStyle=INK;g.lineWidth=1.8*s;g.lineCap="round";
  if(mood==="shock"){g.fillStyle=INK;
    g.beginPath();g.ellipse(x,y+6.5*s,2.2*s,3*s,0,0,6.29);g.fill();
  }else if(mood==="laugh"){g.fillStyle=INK;
    g.beginPath();g.arc(x,y+5.5*s,3.4*s,0.15,3.0);g.fill();
    g.fillStyle="#e8827f";
    g.beginPath();g.arc(x,y+7*s,1.8*s,3.3,6.1);g.fill();
  }else{
    g.beginPath();g.arc(x,y+4*s,3.2*s,0.5,2.6);g.stroke();
  }
}

function drawKenzie(t){
  const y=kenzieY(),sq=1-squash*0.18,st=1+squash*0.22;
  const bob=Math.sin(t*3)*2;
  g.save();g.translate(kx,y+bob);g.rotate(lean*0.06);g.scale(st,sq);
  g.fillStyle="rgba(60,50,40,0.15)";
  g.beginPath();g.ellipse(0,4,34,7,0,0,6.29);g.fill();
  g.fillStyle=SKIN;
  g.beginPath();g.ellipse(-9,-6,4.5,7,0.2,0,6.29);g.fill();
  g.beginPath();g.ellipse(9,-6,4.5,7,-0.2,0,6.29);g.fill();
  g.fillStyle=KDRESS;
  g.beginPath();g.moveTo(-13,-38);g.quadraticCurveTo(-26,-6,-20,-2);
  g.quadraticCurveTo(0,6,20,-2);g.quadraticCurveTo(26,-6,13,-38);g.closePath();g.fill();
  g.strokeStyle=KDRESS_D;g.lineWidth=2;
  g.beginPath();g.moveTo(-16,-14);g.quadraticCurveTo(0,-8,16,-14);g.stroke();
  g.fillStyle=SKIN;
  g.beginPath();g.ellipse(-20,-24,5,6,0.5,0,6.29);g.fill();
  g.beginPath();g.ellipse(20,-24,5,6,-0.5,0,6.29);g.fill();
  const hb=Math.sin(t*3+1)*1.5;
  g.strokeStyle="#a97432";g.lineWidth=3;g.lineCap="round";
  g.beginPath();g.moveTo(-22,-22+hb);g.quadraticCurveTo(0,-14+hb,22,-22+hb);g.stroke();
  g.fillStyle="#c98d47";
  g.beginPath();g.ellipse(0,-16+hb,24,10,0,0,3.14);g.fill();
  g.strokeStyle="#a97432";g.lineWidth=1.4;
  for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*9,-16+hb);g.lineTo(i*7,-8+hb);g.stroke();}
  for(let i=0;i<3;i++)drawBerry(-10+i*10,-19+hb-(i%2)*3,5.5,false,i*2.1);
  g.fillStyle=SKIN;
  g.beginPath();g.arc(0,-52,20,0,6.29);g.fill();
  g.fillStyle=KHAIR;
  g.beginPath();g.arc(0,-56,21,3.1,6.29);g.fill();
  g.beginPath();g.ellipse(0,-62,21,12,0,3.14,6.29);g.fill();
  g.beginPath();g.ellipse(-19,-42,7,12,0.35,0,6.29);g.fill();
  g.beginPath();g.ellipse(19,-42,7,12,-0.35,0,6.29);g.fill();
  g.fillStyle=KHAIR_D;
  g.beginPath();g.ellipse(-19,-36,4,7,0.35,0,6.29);g.fill();
  g.beginPath();g.ellipse(19,-36,4,7,-0.35,0,6.29);g.fill();
  g.fillStyle="#e2668c";
  g.beginPath();g.arc(-14,-66,4,0,6.29);g.fill();
  g.beginPath();g.arc(14,-66,4,0,6.29);g.fill();
  const blink=(t%3.4)<0.12;
  face(0,-52,1,lilyMoodT>0&&state==="over"?"shock":(squash>0.4?"laugh":"normal"),blink);
  g.restore();
}

function drawLily(t){
  const p=lilyPos(),bob=Math.sin(t*2.2+1)*1.6;
  g.fillStyle=GRASS_D;
  g.beginPath();g.ellipse(p.x,p.y+8,52,20,0,3.14,6.29);g.fill();
  g.fillStyle=GRASS;
  g.beginPath();g.ellipse(p.x,p.y+12,52,20,0,3.14,6.29);g.fill();
  g.save();g.translate(p.x,p.y+bob);
  g.fillStyle="rgba(60,50,40,0.15)";
  g.beginPath();g.ellipse(0,4,26,6,0,0,6.29);g.fill();
  g.fillStyle=LDRESS;
  g.beginPath();g.moveTo(-11,-34);g.quadraticCurveTo(-20,-4,-16,-1);
  g.quadraticCurveTo(0,5,16,-1);g.quadraticCurveTo(20,-4,11,-34);g.closePath();g.fill();
  g.strokeStyle=LDRESS_D;g.lineWidth=2;
  g.beginPath();g.moveTo(-13,-12);g.quadraticCurveTo(0,-7,13,-12);g.stroke();
  g.fillStyle=SKIN;
  const wave=lilyMood==="laugh"?Math.sin(t*10)*4:0;
  g.beginPath();g.ellipse(-16,-24,4.5,6,0.5,0,6.29);g.fill();
  g.beginPath();g.ellipse(17,-32-wave,4.5,6,-0.9,0,6.29);g.fill();
  g.beginPath();g.arc(0,-46,17,0,6.29);g.fill();
  g.fillStyle=LHAIR;
  g.beginPath();g.arc(0,-50,18,3.1,6.29);g.fill();
  g.beginPath();g.ellipse(0,-55,18,10,0,3.14,6.29);g.fill();
  g.beginPath();g.ellipse(14,-38,6,11,-0.5,0,6.29);g.fill();
  g.fillStyle=LHAIR_D;
  g.beginPath();g.ellipse(16,-32,3.5,7,-0.5,0,6.29);g.fill();
  g.fillStyle="#f2b234";
  g.beginPath();g.arc(11,-58,3.5,0,6.29);g.fill();
  const blink=((t+1.3)%3.1)<0.12;
  face(0,-46,0.86,lilyMood,blink);
  g.restore();
}

function drawBubble(t){
  if(!bubble)return;
  const p=lilyPos();
  g.font="15px 'Patrick Hand',cursive";
  const words=bubble.txt.split(" "),lines=[];let cur="";
  const maxW=Math.min(215,W-p.x-40);
  for(const w of words){const test=cur?cur+" "+w:w;
    if(g.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;}
  if(cur)lines.push(cur);
  const bw=Math.max(...lines.map(l=>g.measureText(l).width))+22;
  const bh=lines.length*19+14;
  const bx=p.x+8,by=p.y-96-bh;
  const a=Math.min(1,bubble.t*4,(3.1-bubble.t)*3);
  g.save();g.globalAlpha=Math.max(0,a);
  g.fillStyle="#fffdf6";g.strokeStyle=INK;g.lineWidth=2;
  rr(bx,by,bw,bh,10);g.fill();g.stroke();
  g.beginPath();g.moveTo(bx+16,by+bh);g.lineTo(bx+8,by+bh+12);g.lineTo(bx+28,by+bh);g.closePath();
  g.fillStyle="#fffdf6";g.fill();g.strokeStyle=INK;
  g.beginPath();g.moveTo(bx+16,by+bh);g.lineTo(bx+8,by+bh+12);g.lineTo(bx+28,by+bh);g.stroke();
  g.fillStyle="#fffdf6";g.fillRect(bx+17,by+bh-2,10,4);
  g.fillStyle=INK;g.textAlign="left";
  lines.forEach((l,i)=>g.fillText(l,bx+11,by+20+i*19));
  g.restore();
}

function drawBG(t){
  const sky=g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,SKY_TOP);sky.addColorStop(1,SKY_BOT);
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  const sx=W-70,sy=64;
  g.fillStyle="#ffd95e";
  g.beginPath();g.arc(sx,sy,30,0,6.29);g.fill();
  g.strokeStyle="#ffd95e";g.lineWidth=4;g.lineCap="round";
  for(let i=0;i<8;i++){const a=i*0.785+t*0.15;
    g.beginPath();g.moveTo(sx+Math.cos(a)*38,sy+Math.sin(a)*38);
    g.lineTo(sx+Math.cos(a)*46,sy+Math.sin(a)*46);g.stroke();}
  g.fillStyle=INK;
  g.beginPath();g.arc(sx-9,sy-3,2.4,0,6.29);g.fill();
  g.beginPath();g.arc(sx+9,sy-3,2.4,0,6.29);g.fill();
  g.strokeStyle=INK;g.lineWidth=2;
  g.beginPath();g.arc(sx,sy+4,7,0.4,2.7);g.stroke();
  g.fillStyle="rgba(255,255,255,0.92)";
  for(const c of clouds){
    const x=(c.x*W+t*c.v)%(W+160)-80,y=c.y*H;
    g.beginPath();
    g.arc(x,y,20*c.s,0,6.29);g.arc(x+22*c.s,y-8*c.s,16*c.s,0,6.29);
    g.arc(x+44*c.s,y,18*c.s,0,6.29);g.arc(x+22*c.s,y+7*c.s,17*c.s,0,6.29);
    g.fill();
  }
  const gy=groundY();
  g.fillStyle="#a8dd8c";
  g.beginPath();g.moveTo(0,gy+8);
  g.quadraticCurveTo(W*0.25,gy-34,W*0.5,gy);
  g.quadraticCurveTo(W*0.75,gy+24,W,gy-16);
  g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();
  g.fillStyle=GRASS;
  g.beginPath();g.moveTo(0,gy+22);
  g.quadraticCurveTo(W*0.3,gy+2,W*0.62,gy+20);
  g.quadraticCurveTo(W*0.85,gy+32,W,gy+16);
  g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();
  g.strokeStyle=GRASS_D;g.lineWidth=2;g.lineCap="round";
  for(let i=0;i<14;i++){const x=(i*97+40)%W,y=gy+30+(i*53%40);
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+2,y-8,x+5,y-9);
    g.moveTo(x+4,y);g.quadraticCurveTo(x+5,y-6,x+9,y-8);g.stroke();}
  for(let i=0;i<5;i++){const x=(i*173+90)%W,y=gy+40+(i*67%34);
    g.fillStyle=["#ffffff","#ffd6e4","#fff3b0"][i%3];
    for(let p2=0;p2<5;p2++){const a=p2*1.257;
      g.beginPath();g.ellipse(x+Math.cos(a)*4,y+Math.sin(a)*4,3,2,a,0,6.29);g.fill();}
    g.fillStyle="#f2b234";g.beginPath();g.arc(x,y,2.5,0,6.29);g.fill();}
}

function drawHUD(){
  g.textAlign="left";g.font="22px 'Patrick Hand',cursive";
  for(let i=0;i<3;i++){
    const x=22+i*30,y=30,on=i<hearts;
    g.fillStyle=on?"#e8536b":"rgba(0,0,0,0.13)";
    g.beginPath();
    g.moveTo(x,y+7);g.bezierCurveTo(x-12,y-4,x-6,y-12,x,y-4);
    g.bezierCurveTo(x+6,y-12,x+12,y-4,x,y+7);g.fill();
  }
  g.fillStyle=INK;g.textAlign="center";g.font="30px 'Patrick Hand',cursive";
  g.fillText(score,W/2,40);
  if(combo>=3){g.font="17px 'Patrick Hand',cursive";g.fillStyle="#b4502b";
    g.fillText("combo ×"+combo,W/2,62);}
  g.font="19px 'Patrick Hand',cursive";g.textAlign="right";g.fillStyle=muted?"rgba(0,0,0,0.3)":INK;
  g.fillText(muted?"🔇":"🔊",W-20,34);
}

let lt=0;
function frame(ts){
  const t=ts/1000,dt=Math.min(0.05,t-lt||0.016);lt=t;
  if(state==="play"){
    elapsed+=dt;idleT+=dt;
    if(stunT>0){stunT-=dt;kvx=0;}
    else{
      if(keys.ArrowLeft||keys.a)targetX=null,kvx=-380;
      else if(keys.ArrowRight||keys.d)targetX=null,kvx=380;
      else if(targetX===null)kvx*=0.8;
      if(targetX!==null){const d=targetX-kx;kvx=d*10;}
      kvx=Math.max(-560,Math.min(560,kvx));
      kx+=kvx*dt;
    }
    kx=Math.max(laneMin(),Math.min(W-34,kx));
    lean=lean*0.85+Math.max(-1,Math.min(1,kvx/420))*0.15;
    squash=Math.max(0,squash-dt*4);
    if(frenzyT>0){frenzyT-=dt;
      if(frenzyT<=0)say("frenzyEnd","laugh");}
    spawnT-=dt;
    if(spawnT<=0){spawnBerry();
      spawnT=frenzyT>0?0.13:Math.max(0.34,1.05-elapsed*0.012)+Math.random()*0.25;}
    bunnyT-=dt;
    if(bunnyT<=0&&!bunny){bunny={x:W+30,hop:0};bunnyT=16+Math.random()*22;
      if(Math.random()<0.35)say("bunny","normal");}
    if(bunny){bunny.x-=95*dt;bunny.hop+=dt*9;
      if(bunny.x<-40)bunny=null;}
    for(let i=berries.length-1;i>=0;i--){
      const b=berries[i];
      b.y+=b.v*dt;b.x+=Math.sin(b.sway+=dt*3)*0.5;b.rot+=dt;
      const catchY=kenzieY()-22;
      if(b.y>catchY-14&&b.y<catchY+16&&Math.abs(b.x-kx)<34){
        doCatch(b);berries.splice(i,1);idleT=0;continue;}
      if(b.y>groundY()+6){doMiss(b);berries.splice(i,1);idleT=0;
        if(state!=="play")break;}
    }
    if(idleT>9&&!bubble){say("idle","normal");idleT=0;}
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.gr?500:260)*dt;
    if(p.t<=0)parts.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];
    p.t-=dt;p.y-=40*dt;if(p.t<=0)pops.splice(i,1);}
  if(bubble){bubble.t-=dt;if(bubble.t<=0)bubble=null;}
  if(lilyMoodT>0){lilyMoodT-=dt;if(lilyMoodT<=0)lilyMood="normal";}
  shakeT=Math.max(0,shakeT-dt);

  g.save();
  if(shakeT>0)g.translate((Math.random()-0.5)*7*shakeT*3,(Math.random()-0.5)*7*shakeT*3);
  drawBG(t);
  if(frenzyT>0){
    const rg=g.createLinearGradient(0,0,W,0);
    for(let i=0;i<=6;i++)rg.addColorStop(i/6,`hsla(${i*60} 85% 65% / 0.12)`);
    g.fillStyle=rg;g.fillRect(0,0,W,groundY());
  }
  for(const bf of butterflies){
    bf.ph+=0.016*4;
    const bx2=((bf.x*W+t*bf.dir*26)%(W+60)+W+60)%(W+60)-30;
    const by2=bf.y*H+Math.sin(bf.ph*0.7)*26;
    const flap=Math.abs(Math.sin(bf.ph*3));
    g.fillStyle=`hsl(${bf.hue} 80% 72%)`;
    g.beginPath();g.ellipse(bx2-4,by2,6*flap+1.5,5,0.5,0,6.29);g.fill();
    g.beginPath();g.ellipse(bx2+4,by2,6*flap+1.5,5,-0.5,0,6.29);g.fill();
    g.strokeStyle=INK;g.lineWidth=1.6;g.lineCap="round";
    g.beginPath();g.moveTo(bx2,by2-4);g.lineTo(bx2,by2+4);g.stroke();
  }
  if(bunny){
    const by2=groundY()+26-Math.abs(Math.sin(bunny.hop))*16;
    g.fillStyle="#fff";
    g.beginPath();g.ellipse(bunny.x,by2,13,10,0,0,6.29);g.fill();
    g.beginPath();g.arc(bunny.x-12,by2-8,8,0,6.29);g.fill();
    g.beginPath();g.ellipse(bunny.x-15,by2-20,3,8,0.2,0,6.29);g.fill();
    g.beginPath();g.ellipse(bunny.x-9,by2-20,3,8,-0.1,0,6.29);g.fill();
    g.fillStyle="#ffd6e4";
    g.beginPath();g.arc(bunny.x+12,by2-2,4,0,6.29);g.fill();
    g.fillStyle=INK;
    g.beginPath();g.arc(bunny.x-15,by2-9,1.4,0,6.29);g.fill();
  }
  for(const b of berries)drawBerry(b.x,b.y,b.r,b.kind,b.rot);
  drawLily(t);
  drawKenzie(t);
  if(stunT>0){
    for(let i=0;i<3;i++){const a=t*7+i*2.09;
      g.fillStyle=["#f2b234","#ef6f96","#8bb8d8"][i];
      g.beginPath();g.arc(kx+Math.cos(a)*26,kenzieY()-84+Math.sin(a)*8,3.4,0,6.29);g.fill();}
  }
  if(frenzyT>0){
    g.font="26px 'Patrick Hand',cursive";g.textAlign="center";
    g.fillStyle=`hsl(${(t*300)%360} 80% 45%)`;
    g.save();g.translate(W/2,86);g.rotate(Math.sin(t*9)*0.06);
    g.fillText("BERRY FRENZY!",0,0);g.restore();
  }
  if(banner){banner.t-=0.016;
    if(banner.t<=0)banner=null;
    else{g.font="22px 'Patrick Hand',cursive";g.textAlign="center";
      g.globalAlpha=Math.min(1,banner.t*2);
      g.fillStyle=INK;g.fillText(banner.txt,W/2,110);g.globalAlpha=1;}
  }
  for(const p of parts){g.globalAlpha=Math.max(0,p.t*2);g.fillStyle=p.col;
    g.beginPath();g.arc(p.x,p.y,p.r,0,6.29);g.fill();g.globalAlpha=1;}
  g.font="18px 'Patrick Hand',cursive";g.textAlign="center";
  for(const p of pops){g.globalAlpha=Math.max(0,p.t);g.fillStyle=p.col;
    g.fillText(p.txt,p.x,p.y);g.globalAlpha=1;}
  drawBubble(t);
  if(state==="play"||state==="pause")drawHUD();

  if(state==="menu"||state==="over"){
    g.fillStyle="rgba(255,253,246,0.82)";
    const pw=Math.min(330,W-40),ph=state==="over"?230:210,px2=(W-pw)/2,py=H*0.2;
    rr(px2,py,pw,ph,18);g.fill();
    g.strokeStyle=INK;g.lineWidth=2.5;rr(px2,py,pw,ph,18);g.stroke();
    g.fillStyle=INK;g.textAlign="center";
    g.font="34px 'Patrick Hand',cursive";
    g.fillText(state==="over"?"Oh no!":"Blueberry Rain",W/2,py+48);
    g.font="19px 'Patrick Hand',cursive";
    if(state==="over"){
      g.fillText("Kenzie caught "+score+(score===1?" berry":" berries"),W/2,py+86);
      g.fillText("best combo ×"+bestCombo,W/2,py+112);
      g.fillStyle="#b4502b";
      g.fillText(score>=best&&score>0?"NEW BEST!":"best: "+best,W/2,py+140);
      g.fillStyle=INK;g.font="21px 'Patrick Hand',cursive";
      g.fillText("tap to try again",W/2,py+185);
    }else{
      g.fillText("Catch berries. Dodge acorns.",W/2,py+84);
      g.fillText("Slide Kenzie to catch them all.",W/2,py+110);
      if(best>0){g.fillStyle="#b4502b";g.fillText("best: "+best,W/2,py+138);g.fillStyle=INK;}
      g.font="21px 'Patrick Hand',cursive";
      g.fillText("tap to start",W/2,py+172);
    }
    drawBerry(px2+34,py+40,13,false,t);
    drawBerry(px2+pw-34,py+40,13,true,t*1.3);
  }
  if(state==="pause"){
    g.fillStyle="rgba(255,253,246,0.7)";g.fillRect(0,0,W,H);
    g.fillStyle=INK;g.font="26px 'Patrick Hand',cursive";g.textAlign="center";
    g.fillText("paused — tap to keep catching",W/2,H/2);
  }
  g.restore();
  requestAnimationFrame(frame);
}
kx=W/2;
requestAnimationFrame(frame);

window.BB={
  get state(){return state},get score(){return score},get hearts(){return hearts},
  get berries(){return berries},start,
  drop(x,kind){berries.push({x:x??kx,y:kenzieY()-60,v:200,sway:0,r:13,kind:kind||"norm",rot:0});},
  get stun(){return stunT},get frenzy(){return frenzyT},get combo(){return combo},
  moveTo(x){targetX=x;},
};
</script>
</body>
</html>
