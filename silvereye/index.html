<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="SilverEye: sneak through an underground lab with proximity mines and turrets you program in Sprout, in 3D.">
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SilverEye">
<title>SilverEye</title>
<link rel="apple-touch-icon" href="/icons/silvereye-180.png">
<link rel="manifest" href="/silvereye/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/silvereye-64.png">
<!-- the game is written in Sprout and runs on Sprout 3's runtime, models and sounds, which live in /sprout3/ -->
<base href="/sprout3/">
<style>
:root{--bg:#0d0f13;--fg:#f4f1ea;--fg2:#9aa3b5;--line:#ffffff1f;--panel:#14171dee;--accent:#9be7ff;--bad:#ff6b5b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
#stage{position:fixed;left:0;top:0;touch-action:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bar{position:fixed;top:max(8px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none;z-index:2}
#bar>*{pointer-events:auto}
.b{appearance:none;border:1px solid var(--line);background:#0d0f13b3;color:var(--fg);font:600 12px/1 inherit;font-family:inherit;padding:8px 11px;border-radius:999px;white-space:nowrap;cursor:pointer;text-decoration:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.b:hover{border-color:#ffffff55}
.b.on{color:var(--accent);border-color:#9be7ff66}
.short{display:none}
@media (max-width:480px){#title{display:none}.b{padding:7px 10px;font-size:11px}.long{display:none}.short{display:inline}#bar{top:auto;bottom:max(10px,env(safe-area-inset-bottom));left:10px;right:auto;justify-content:flex-start}}
#title{font-weight:700;letter-spacing:.14em;font-size:11px;color:var(--fg2);align-self:center;padding:0 6px}
#panel{position:fixed;z-index:3;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
#panel.open{transform:none}
@media (max-width:640px){#panel{top:auto;height:58%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(100%)}}
#panel h2{margin:0 0 4px;font-size:15px}
#panel p{margin:0 0 10px;color:var(--fg2);font-size:13px}
#src{flex:1;min-height:0;width:100%;resize:none;background:#0a0c10;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-user-select:text;user-select:text;tab-size:2}
#src:focus{outline:none;border-color:#9be7ff66}
#status{margin:8px 0 0;font-size:12px;color:var(--fg2);min-height:1.4em}
#status.bad{color:var(--bad)}
#panel .row{display:flex;gap:6px;margin-top:8px}
#wait{position:fixed;inset:0;display:grid;place-items:center;color:var(--fg2);font-size:13px;letter-spacing:.08em;pointer-events:none}
</style></head><body>
<div id="stage"><canvas id="tv"></canvas><canvas id="cv"></canvas></div>
<div id="wait">LOADING SILVEREYE…</div>
<div id="bar">
  <span id="title">SILVEREYE</span>
  <button class="b" id="bProg" title="Change how the turrets think"><span class="long">Turret program</span><span class="short">Program</span></button>
  <button class="b" id="bSound" title="Sound on or off">Sound</button>
  <a class="b" href="play.html#ex=silvereye" title="Open the whole game in the Sprout editor"><span class="long">All the code</span><span class="short">Code</span></a>
</div>
<div id="panel" aria-label="Turret program">
  <h2>turret-program</h2>
  <p>Every turret runs this Sprout cell each frame. It sees <b>aim</b>, <b>cool</b>, <b>sees</b>, <b>dx</b>, <b>dy</b>, <b>far</b> and <b>count</b>, and answers <b>turn</b> (-1 to 1) and <b>fire</b>. Change it and the turrets you've set down think the new way at once.</p>
  <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
  <div id="status"></div>
  <div class="row"><button class="b" id="bReset">Put the first one back</button><button class="b" id="bClose">Close</button></div>
</div>
<script src="sprout3.js?v=20261121q"></script>
<script src="words.js?v=20261121q"></script>
<script src="kernels.js?v=20261121q"></script>
<script src="live3.js?v=20261121q"></script>
<script type="module">
// SilverEye on its own page: the Sprout game examples/silvereye.sp, full screen, with only its turret program to edit.
import { makeView } from "./three-view.js?v=20261121q";
const S = window.Sprout3, L = window.Sprout3Live, $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

// ---- the game's size follows the screen's shape: 480 high, as wide as the screen allows
const GH = 480, GW = Math.round(Math.max(300, Math.min(1000, GH * innerWidth / Math.max(1, innerHeight))));
const cv = $("cv"), g = cv.getContext("2d"), stage = $("stage");
let SW = 0, SH = 0;
function fit() {
  const k = Math.min(innerWidth / GW, innerHeight / GH); SW = Math.round(GW * k); SH = Math.round(GH * k);
  Object.assign(stage.style, { width: SW + "px", height: SH + "px", left: Math.round((innerWidth - SW) / 2) + "px", top: Math.round((innerHeight - SH) / 2) + "px" });
  const r = Math.min(2, devicePixelRatio || 1); cv.width = Math.round(SW * r); cv.height = Math.round(SH * r);
}
addEventListener("resize", fit); fit();

// ---- sound
let AC = null, muted = store.get("silvereye.mute", false);
const audio = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === "suspended") AC.resume(); };
function beep(f, d) { if (muted || !AC) return; try { const o = AC.createOscillator(), v = AC.createGain(), t = AC.currentTime; d = +d || .1; o.type = "square"; o.frequency.value = +f || 440; v.gain.setValueAtTime(.08, t); v.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(v).connect(AC.destination); o.start(t); o.stop(t + d + .02); } catch (e) {} }
const SOUNDS = new Map();
function playSound(name) {
  if (muted) return; audio(); if (!AC) return;
  const play = buf => { try { const n = AC.createBufferSource(); n.buffer = buf; n.connect(AC.destination); n.start(); } catch (e) {} };
  let s = SOUNDS.get(name);
  if (!s) { s = {}; SOUNDS.set(name, s); fetch("vendor/sfx/" + name + ".ogg").then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); }).then(b => AC.decodeAudioData(b)).then(buf => { s.buf = buf; play(buf); }, () => { s.failed = true; beep(440, .06); }); return; }
  if (s.buf) play(s.buf); else if (s.failed) beep(440, .06);
}
let shakeAmt = 0;
const onEffect = ([name, a]) => { if (name === "beep") beep(a[0], a[1]); else if (name === "shake") shakeAmt = Math.max(shakeAmt, +a[0] || 0); else if (name === "sound") playSound(S.format(a[0])); };
const soundUI = () => { $("bSound").textContent = muted ? "Sound off" : "Sound on"; $("bSound").classList.toggle("on", !muted); };
$("bSound").onclick = () => { muted = !muted; store.set("silvereye.mute", muted); audio(); soundUI(); }; soundUI();

// ---- the program: the whole game, with the turret-program cell cut out so it can be changed on its own
const full = await (await fetch("examples/silvereye.sp?v=20261121q")).text();
const begin = full.indexOf("turret-program : [t |"), end = full.indexOf("\n]\n", begin) + 2;
const before = full.slice(0, begin), original = full.slice(begin, end), after = full.slice(end);
const withProgram = p => before + p.replace(/\s+$/, "") + after;
let program = store.get("silvereye.program", original);
let game, good = original;
try { game = L.makeGame(withProgram(program), { W: GW, H: GH, onEffect }); good = program; }
catch (e) { program = original; game = L.makeGame(full, { W: GW, H: GH, onEffect }); }
const view = makeView($("tv"), "");
$("wait").remove();

const ta = $("src"), status = $("status");
// Sprout's warnings (a word it doesn't know, say) are shown here when they come from the turret program
const firstLine = before.split("\n").length;
S.setLog(m => {
  const n = +((m.match(/\(line (\d+)\)/) || [])[1] || 0);
  if (n >= firstLine && n < firstLine + ta.value.split("\n").length) say(m.replace(/ \(line (\d+)\)/, (_, l) => " (line " + (l - firstLine + 1) + ")").replace(/ \(and more; not shown again\)/, ""), true);
  else console.log("sprout: " + m);
});
ta.value = program;
const say = (t, bad) => { status.textContent = t; status.classList.toggle("bad", !!bad); };
say("Running. Set down a turret (SENTRY, or T) and watch it think.");
let editT = 0;
function apply() {
  const p = ta.value;
  try { game.swap(withProgram(p)); game.draw(); good = p; store.set("silvereye.program", p); say("Running your program."); }
  catch (e) { say("Not yet: " + (e && e.message || e) + " · the turrets keep the last one that worked.", true); }
}
ta.addEventListener("input", () => { clearTimeout(editT); editT = setTimeout(apply, 300); });
ta.addEventListener("keydown", e => { if (e.key === "Tab") { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText("  ", s, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); } e.stopPropagation(); });
const panel = $("panel");
const openPanel = on => { panel.classList.toggle("open", on); $("bProg").classList.toggle("on", on); if (on) setTimeout(() => ta.focus({ preventScroll: true }), 230); else ta.blur(); };
$("bProg").onclick = () => openPanel(!panel.classList.contains("open"));
$("bClose").onclick = () => openPanel(false);
$("bReset").onclick = () => { ta.value = original; apply(); };

// ---- input: touches and the mouse as events, keys held with each tick
const KEYS = new Set(); let heldKey = "", heldC = null;
const held = () => { const k = [...KEYS].sort().join(","); if (k !== heldKey || !heldC) { heldKey = k; heldC = S.valueCellOf([], new Map([...KEYS].map(x => [x, true]))); } return heldC; };
const at = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * GW, (e.clientY - r.top) / r.height * GH]; };
let down = false;
const safely = f => { try { f(); } catch (e) {} };
cv.addEventListener("pointerdown", e => { audio(); if (panel.classList.contains("open") && innerWidth <= 640) openPanel(false); cv.setPointerCapture(e.pointerId); down = true; const [x, y] = at(e); safely(() => game.down(x, y)); });
cv.addEventListener("pointermove", e => { if (!down) return; const [x, y] = at(e); safely(() => game.move(x, y)); });
const up = () => { if (!down) return; down = false; safely(() => game.up()); };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
const KEYNAME = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", " ": "space", Enter: "enter" };
addEventListener("keydown", e => {
  if (e.target === ta) return;
  if (e.key === "Escape") { openPanel(false); return; }
  audio(); const k = KEYNAME[e.key] || e.key.toLowerCase();
  if (!KEYS.has(k) && (k === "space" || k === "enter")) safely(() => game.down(GW / 2, GH / 2));
  KEYS.add(k); if (e.key.startsWith("Arrow") || e.key === " ") e.preventDefault();
});
addEventListener("keyup", e => { const k = KEYNAME[e.key] || e.key.toLowerCase(); KEYS.delete(k); if (k === "space" || k === "enter") safely(() => game.up()); });
addEventListener("blur", () => KEYS.clear());

// ---- drawing: three.js draws the 3D words underneath, the 2D words go on top
const col = c => typeof c === "string" ? c : S.format(c);
function text(a) { g.fillStyle = col(a[4]); g.font = "600 " + (+a[3] || 16) + 'px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif'; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(S.format(a[0]), a[1], a[2]); }
function paint(list) {
  for (const [name, a] of list) {
    if (name === "rect") { g.fillStyle = col(a[4]); g.fillRect(a[0], a[1], a[2], a[3]); }
    else if (name === "circle") { if (a[2] > 0) { g.fillStyle = col(a[3]); g.beginPath(); g.arc(a[0], a[1], a[2], 0, Math.PI * 2); g.fill(); } }
    else if (name === "line") { g.strokeStyle = col(a[4]); g.lineWidth = 2; g.lineCap = "round"; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(a[2], a[3]); g.stroke(); }
    else if (name === "text") text(a);
    else if (name === "clear") { g.fillStyle = col(a[0]); g.fillRect(0, 0, GW, GH); }
  }
}
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  try { game.tick(dt, held()); }
  catch (e) {
    // a program that type-checked can still fail while running: go back to the last one that worked
    say("That stopped the game: " + (e && e.message || e) + " · back to the last program that worked.", true);
    try { game.swap(withProgram(good)); } catch (_) {}
    return;
  }
  const list = game.draw();
  let sx = 0, sy = 0;
  if (shakeAmt > .3) { sx = (Math.random() - .5) * shakeAmt; sy = (Math.random() - .5) * shakeAmt; shakeAmt *= Math.pow(.004, dt); } else shakeAmt = 0;
  try { view.render(list, SW, SH, sx, sy); } catch (e) {}
  const k = cv.width / GW; g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, GW, GH);
  paint(list);
}
requestAnimationFrame(frame);
</script>
</body></html>
