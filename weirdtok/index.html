<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WeirdTok</title>
<meta name="description" content="An infinite feed of the weirdest animations the taskiap universe can produce. Swipe up. Regret nothing.">
<meta name="apple-mobile-web-app-title" content="WeirdTok">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{ --disp:'Baloo 2',system-ui,sans-serif; --mono:'JetBrains Mono',monospace; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
body{margin:0;background:#000;font-family:var(--disp);color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:absolute;inset:0;touch-action:none;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;gap:22px;align-items:center;
  padding-top:calc(12px + env(safe-area-inset-top));z-index:8;pointer-events:none;
  text-shadow:0 1px 6px rgba(0,0,0,.6);font-weight:700;font-size:15px}
.topbar span{pointer-events:auto;cursor:pointer;opacity:.6}
.topbar span.on{opacity:1;border-bottom:2.5px solid #fff;padding-bottom:2px}
#bMute{position:absolute;top:calc(46px + env(safe-area-inset-top));right:12px;z-index:9;
  background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border:none;border-radius:100px;
  padding:7px 12px;color:#fff;font-family:var(--disp);font-weight:700;font-size:12px;cursor:pointer}
#clipNo{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:8;
  font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.1em;opacity:.55}
.rail{position:absolute;right:8px;bottom:calc(120px + env(safe-area-inset-bottom));z-index:8;
  display:flex;flex-direction:column;gap:18px;align-items:center}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))}
.rb svg{width:34px;height:34px}
.rb .n{font-family:var(--mono);font-weight:800;font-size:11px}
#vinyl{width:44px;height:44px;border-radius:50%;background:conic-gradient(#333,#111,#333,#111,#333);
  border:9px solid #1a1a1a;animation:spin 3.2s linear infinite;box-shadow:0 2px 10px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.meta{position:absolute;left:12px;right:76px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:8;
  text-shadow:0 1px 6px rgba(0,0,0,.65)}
.meta .user{font-weight:800;font-size:16px;margin-bottom:3px}
.meta .cap{font-weight:600;font-size:14px;line-height:1.25;margin-bottom:7px}
.meta .song{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;opacity:.95;overflow:hidden}
.meta .song .tick{white-space:nowrap;overflow:hidden;max-width:220px;display:block}
.meta .song .tick i{display:inline-block;font-style:normal;padding-right:44px;animation:mq 7s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
#hintUp{position:absolute;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));text-align:center;z-index:7;
  font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.14em;opacity:.85;
  text-shadow:0 1px 6px rgba(0,0,0,.6);animation:bob 1.4s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(-7px)}}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:20;background:rgba(0,0,0,.72);
  border-radius:100px;padding:9px 18px;font-weight:700;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
#comments{position:absolute;left:0;right:0;bottom:0;height:58%;background:#141418;z-index:15;
  border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.25,1);
  display:flex;flex-direction:column;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
#comments.open{transform:translateY(0)}
#comments .chead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin-bottom:10px}
#comments .cx{cursor:pointer;font-size:20px;opacity:.7;padding:0 6px}
#clist{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:13px}
.cmt .cu{font-weight:800;font-size:12.5px;color:#9ad}
.cmt .ct{font-weight:600;font-size:13.5px;line-height:1.3}
.cmt .cl{font-family:var(--mono);font-weight:800;font-size:10px;opacity:.5;margin-top:2px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div class="topbar">
    <span id="tabFollow">Following</span>
    <span class="on">For You</span>
  </div>
  <button id="bMute">🔇 tap for sound</button>
  <div id="clipNo" class="mono">CLIP 1</div>

  <div class="rail">
    <div class="rb" id="bLike">
      <svg viewBox="0 0 24 24" id="heartIcon"><path d="M12 21s-7.5-4.6-10-9.3C.6 8.6 2.3 5 5.7 5c2 0 3.3 1 4.3 2.5C11 6 12.3 5 14.3 5c3.4 0 5.1 3.6 3.7 6.7C15.5 16.4 12 21 12 21z" fill="#fff"/></svg>
      <div class="n" id="likeN">0</div>
    </div>
    <div class="rb" id="bCmt">
      <svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.8 1.6 5.3 4 6.9L5 22l4.6-2.1c.8.2 1.6.3 2.4.3 5.5 0 10-3.9 10-8.5S17.5 3 12 3z" fill="#fff"/></svg>
      <div class="n" id="cmtN">0</div>
    </div>
    <div class="rb" id="bShare">
      <svg viewBox="0 0 24 24"><path d="M14 5l7 6.5-7 6.5v-4C7 14 4 16.5 2.5 19.5 2.5 12 7 8.5 14 8.5V5z" fill="#fff"/></svg>
      <div class="n">Share</div>
    </div>
    <div id="vinyl">🎵</div>
  </div>

  <div class="meta">
    <div class="user" id="mUser">@loading</div>
    <div class="cap" id="mCap">…</div>
    <div class="song"><span>🎜</span><span class="tick"><i id="mSong">…</i></span></div>
  </div>

  <div id="hintUp">SWIPE UP · IT GETS WEIRDER</div>
  <div id="toast"></div>

  <div id="comments">
    <div class="chead"><span id="cHead">Comments</span><span class="cx" id="cClose">✕</span></div>
    <div id="clist"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (a,b,c) => Math.max(b,Math.min(c,a));
const TAU = Math.PI*2;

/* ============================================================
   SEEDED RANDOM · every clip is its own little universe,
   reproducible from its index alone
   ============================================================ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pick = (rng,a) => a[Math.floor(rng()*a.length)];
const rr = (rng,a,b) => a + rng()*(b-a);

/* ============================================================
   THE CAST · everyone we have ever made, redrawn small.
   Each draws centred on (0,0), roughly `s` tall, at time t.
   ============================================================ */
const INK='#20242e';
function outline(ctx,w){ ctx.strokeStyle=INK; ctx.lineWidth=w; ctx.stroke(); }

function dLily(ctx,s,t){
  const hr=s*.30, hy=-s*.16;
  ctx.fillStyle='#2fa8a0'; ctx.beginPath(); ctx.roundRect(-s*.14,-s*.02,s*.28,s*.2,s*.06); ctx.fill(); outline(ctx,s*.02);
  ctx.fillStyle='#3a5aa8'; ctx.fillRect(-s*.12,s*.16,s*.1,s*.12); ctx.fillRect(s*.02,s*.16,s*.1,s*.12);
  ctx.fillStyle='#e8554a'; ctx.beginPath(); ctx.ellipse(-s*.07,s*.29,s*.06,s*.035,0,0,TAU); ctx.ellipse(s*.07,s*.29,s*.06,s*.035,0,0,TAU); ctx.fill();
  [-1,1].forEach(d=>{ ctx.fillStyle='#a9793f'; ctx.beginPath(); ctx.ellipse(d*hr*1.15,hy-hr*.4,hr*.32,hr*.28,d*.4,0,TAU); ctx.fill(); outline(ctx,s*.015); });
  ctx.fillStyle='#f6d2b0'; ctx.beginPath(); ctx.arc(0,hy,hr,0,TAU); ctx.fill(); outline(ctx,s*.02);
  ctx.save(); ctx.beginPath(); ctx.arc(0,hy,hr,0,TAU); ctx.clip();
  ctx.fillStyle='#a9793f'; ctx.beginPath(); ctx.ellipse(0,hy-hr*.62,hr*1.1,hr*.55,0,0,TAU); ctx.fill(); ctx.restore();
  const blink = Math.sin(t/300)>.97?0.2:1;
  ctx.fillStyle='#3a2c22';
  [-1,1].forEach(d=>{ ctx.beginPath(); ctx.ellipse(d*hr*.36,hy+hr*.08,hr*.1,hr*.14*blink,0,0,TAU); ctx.fill(); });
  ctx.fillStyle='#ff9aa8'; ctx.globalAlpha=.55;
  [-1,1].forEach(d=>{ ctx.beginPath(); ctx.ellipse(d*hr*.62,hy+hr*.3,hr*.14,hr*.08,0,0,TAU); ctx.fill(); });
  ctx.globalAlpha=1;
  ctx.strokeStyle=INK; ctx.lineWidth=s*.016; ctx.beginPath(); ctx.arc(0,hy+hr*.34,hr*.16,.3,Math.PI-.3); ctx.stroke();
}
function dJackson(ctx,s,t){
  ctx.fillStyle='#1c1c22';
  ctx.beginPath(); ctx.ellipse(0,s*.1,s*.34,s*.26,0,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-s*.18,s*.24,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s*.2,-s*.3); ctx.lineTo(-s*.26,-s*.5); ctx.lineTo(-s*.08,-s*.38); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s*.2,-s*.3); ctx.lineTo(s*.26,-s*.5); ctx.lineTo(s*.08,-s*.38); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#1c1c22'; ctx.lineWidth=s*.09; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(s*.3,s*.14);
  ctx.quadraticCurveTo(s*.55,s*.05+Math.sin(t/300)*s*.12, s*.5,-s*.25+Math.sin(t/300)*s*.08); ctx.stroke();
  ctx.fillStyle='#f6c94a';
  [-1,1].forEach(d=>{ ctx.beginPath(); ctx.ellipse(d*s*.1,-s*.2,s*.05,s*.07,0,0,TAU); ctx.fill();
    ctx.fillStyle='#f6c94a'; });
  ctx.fillStyle='#1c1c22';
  [-1,1].forEach(d=>{ ctx.beginPath(); ctx.ellipse(d*s*.1,-s*.2,s*.018,s*.05,0,0,TAU); ctx.fill(); });
  ctx.fillStyle='#e8a0a8'; ctx.beginPath(); ctx.arc(0,-s*.12,s*.03,0,TAU); ctx.fill();
}
function dZebra(ctx,s,t){
  ctx.fillStyle='#f2f2f2'; ctx.beginPath(); ctx.ellipse(0,s*.06,s*.4,s*.24,0,0,TAU); ctx.fill(); outline(ctx,s*.02);
  ctx.save(); ctx.beginPath(); ctx.ellipse(0,s*.06,s*.4,s*.24,0,0,TAU); ctx.clip();
  ctx.fillStyle='#20242e';
  for(let i=-3;i<=3;i++){ ctx.save(); ctx.translate(i*s*.11,0); ctx.rotate(.15);
    ctx.fillRect(-s*.03,-s*.3,s*.06,s*.6); ctx.restore(); }
  ctx.restore();
  const bob=Math.sin(t/260)*s*.02;
  ctx.fillStyle='#f2f2f2'; ctx.beginPath(); ctx.ellipse(s*.34,-s*.18+bob,s*.16,s*.13,-.4,0,TAU); ctx.fill(); outline(ctx,s*.018);
  ctx.fillStyle='#c9909a'; ctx.beginPath(); ctx.ellipse(s*.44,-s*.13+bob,s*.06,s*.05,-.4,0,TAU); ctx.fill();
  ctx.fillStyle='#20242e'; ctx.beginPath(); ctx.arc(s*.33,-s*.22+bob,s*.02,0,TAU); ctx.fill();
  ctx.fillStyle='#20242e';
  for(let i=0;i<4;i++){ ctx.save(); ctx.translate(s*(.2-i*.05),-s*.3+bob); ctx.rotate(-.5); ctx.fillRect(0,0,s*.028,s*.09); ctx.restore(); }
  ctx.strokeStyle='#20242e'; ctx.lineWidth=s*.05; ctx.lineCap='round';
  [[-.24,1],[-.08,-1],[.1,1],[.26,-1]].forEach(([x,ph])=>{
    const k=Math.sin(t/130+ph)* s*.05;
    ctx.beginPath(); ctx.moveTo(x*s,s*.22); ctx.lineTo(x*s+k,s*.44); ctx.stroke();
  });
}
function dGraboid(ctx,s,t){
  const open=.5+.5*Math.sin(t/400);
  ctx.fillStyle='#4a3a24'; ctx.beginPath(); ctx.ellipse(0,s*.34,s*.4,s*.13,0,0,TAU); ctx.fill();
  ctx.fillStyle='#84512f'; ctx.beginPath(); ctx.ellipse(0,s*.05,s*.26,s*.36,0,0,TAU); ctx.fill(); outline(ctx,s*.02);
  ctx.fillStyle='#5a1524'; ctx.beginPath(); ctx.arc(0,-s*.16,s*.16*(.4+open*.6),0,TAU); ctx.fill();
  ctx.strokeStyle='#e0798a'; ctx.lineWidth=s*.03; ctx.lineCap='round';
  for(let i=0;i<3;i++){ const a=-1.9+i*1.2+Math.sin(t/120+i)*.5;
    ctx.beginPath(); ctx.moveTo(0,-s*.16);
    ctx.lineTo(Math.cos(a)*s*.16*open, -s*.16+Math.sin(a)*s*.16*open); ctx.stroke(); }
  for(let i=0;i<3;i++){ const a=-Math.PI/2+i*(TAU/3);
    ctx.save(); ctx.translate(0,-s*.16); ctx.rotate(a+Math.PI/2); ctx.rotate(-open*1.1);
    ctx.fillStyle='#84512f'; ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(-s*.11,s*.05); ctx.lineTo(-s*.07,s*.24); ctx.lineTo(s*.07,s*.24); ctx.lineTo(s*.11,s*.05);
    ctx.closePath(); ctx.fill(); outline(ctx,s*.014);
    ctx.fillStyle='#f2e6cf';
    for(let k=-1;k<=1;k++){ ctx.beginPath(); ctx.moveTo(k*s*.055-s*.02,s*.23); ctx.lineTo(k*s*.055,s*.15); ctx.lineTo(k*s*.055+s*.02,s*.23); ctx.closePath(); ctx.fill(); }
    ctx.restore(); }
}
function dHeli(ctx,s,t){
  ctx.fillStyle='#3f6ea8'; ctx.beginPath(); ctx.ellipse(0,0,s*.3,s*.17,0,0,TAU); ctx.fill(); outline(ctx,s*.025);
  ctx.fillStyle='#8fd6ff'; ctx.beginPath(); ctx.ellipse(s*.16,-s*.02,s*.1,s*.09,0,0,TAU); ctx.fill();
  ctx.fillStyle=INK; ctx.fillRect(-s*.52,-s*.025,s*.3,s*.05);
  ctx.strokeStyle='#20242e88'; ctx.lineWidth=s*.05;
  for(let i=0;i<3;i++){ const a=t/26+i*2.09;
    ctx.beginPath(); ctx.moveTo(0,-s*.14); ctx.lineTo(Math.cos(a)*s*.5,-s*.14+Math.sin(a)*s*.16); ctx.stroke(); }
  ctx.fillStyle='#e8554a'; ctx.beginPath(); ctx.arc(0,s*.14,s*.035*(Math.sin(t/160)>0?1.3:.7),0,TAU); ctx.fill();
}
function dTruck(ctx,s,t){
  ctx.fillStyle='#e0483e'; ctx.beginPath(); ctx.roundRect(-s*.45,-s*.26,s*.62,s*.4,s*.05); ctx.fill(); outline(ctx,s*.022);
  ctx.fillStyle='#f4f8ff'; ctx.beginPath(); ctx.roundRect(s*.19,-s*.18,s*.26,s*.32,s*.05); ctx.fill(); outline(ctx,s*.022);
  ctx.fillStyle='#8fd6ff'; ctx.fillRect(s*.24,-s*.13,s*.14,s*.12);
  ctx.fillStyle=INK;
  [-s*.28,s*.02,s*.3].forEach(x=>{ ctx.beginPath(); ctx.arc(x,s*.16,s*.09,0,TAU); ctx.fill();
    ctx.fillStyle='#666'; ctx.beginPath(); ctx.arc(x,s*.16,s*.045,0,TAU); ctx.fill(); ctx.fillStyle=INK; });
  ctx.fillStyle='#ffdf7a'; ctx.beginPath(); ctx.arc(s*.44,s*.02,s*.035,0,TAU); ctx.fill();
}
function dHorse(ctx,s,t){
  ctx.fillStyle='#8a5c34'; ctx.beginPath(); ctx.ellipse(0,s*.12,s*.3,s*.26,0,0,TAU); ctx.fill(); outline(ctx,s*.02);
  ctx.beginPath(); ctx.ellipse(0,-s*.22,s*.15,s*.22,0,0,TAU); ctx.fill(); outline(ctx,s*.02);
  ctx.fillStyle='#5c3a1e'; ctx.beginPath(); ctx.ellipse(0,-s*.4,s*.1,s*.08,0,0,TAU); ctx.fill();
  [-1,1].forEach(d=>{ ctx.fillStyle='#8a5c34'; ctx.beginPath();
    ctx.moveTo(d*s*.1,-s*.4); ctx.lineTo(d*s*.16,-s*.52); ctx.lineTo(d*s*.03,-s*.44); ctx.closePath(); ctx.fill(); });
  ctx.fillStyle='#c9a27a'; ctx.beginPath(); ctx.ellipse(0,-s*.12,s*.09,s*.08,0,0,TAU); ctx.fill();
  ctx.fillStyle=INK;
  [-1,1].forEach(d=>{ ctx.beginPath(); ctx.arc(d*s*.055,-s*.26,s*.022,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(d*s*.03,-s*.1,s*.014,0,TAU); ctx.fill(); });
}
function dVulture(ctx,s,t){
  const peck=Math.max(0,Math.sin(t/300))*.8;
  ctx.fillStyle='#2f2b35'; ctx.beginPath(); ctx.ellipse(0,s*.05,s*.24,s*.3,0,0,TAU); ctx.fill();
  ctx.fillStyle='#4a4450'; ctx.beginPath(); ctx.ellipse(0,-s*.12,s*.2,s*.09,0,0,TAU); ctx.fill();
  ctx.save(); ctx.translate(s*.05,-s*.2); ctx.rotate(peck);
  ctx.fillStyle='#e2a9a2'; ctx.beginPath(); ctx.arc(0,0,s*.1,0,TAU); ctx.fill();
  ctx.fillStyle='#f0d27a'; ctx.beginPath(); ctx.moveTo(s*.04,0); ctx.lineTo(s*.22,s*.05); ctx.lineTo(s*.04,s*.1); ctx.closePath(); ctx.fill();
  ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(s*.01,-s*.02,s*.022,0,TAU); ctx.fill();
  ctx.restore();
  ctx.strokeStyle='#c9a24a'; ctx.lineWidth=s*.035;
  [-1,1].forEach(d=>{ ctx.beginPath(); ctx.moveTo(d*s*.08,s*.32); ctx.lineTo(d*s*.08,s*.42); ctx.stroke(); });
}
function dWorm(ctx,s,t){
  ctx.strokeStyle='#e79fa8'; ctx.lineWidth=s*.16; ctx.lineCap='round';
  ctx.beginPath();
  for(let k=0;k<=10;k++){ const u=k/10;
    const x=(u-.5)*s*.8, y=Math.sin(u*4+t/150)*s*.12;
    k?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.stroke();
  ctx.fillStyle=INK;
  const hy=Math.sin(4+t/150)*s*.12;
  ctx.beginPath(); ctx.arc(s*.4,hy-s*.03,s*.025,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(s*.4,hy+s*.05,s*.025,0,TAU); ctx.fill();
}
function dMarmoset(ctx,s,t){
  ctx.fillStyle='#c9975a'; ctx.beginPath(); ctx.ellipse(0,s*.14,s*.2,s*.22,0,0,TAU); ctx.fill(); outline(ctx,s*.018);
  ctx.strokeStyle='#c9975a'; ctx.lineWidth=s*.07; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(s*.14,s*.2);
  ctx.quadraticCurveTo(s*.4,s*.1,s*.34,-s*.2+Math.sin(t/250)*s*.06); ctx.stroke();
  ctx.fillStyle='#c9975a'; ctx.beginPath(); ctx.arc(0,-s*.16,s*.2,0,TAU); ctx.fill(); outline(ctx,s*.018);
  [-1,1].forEach(d=>{ ctx.fillStyle='#f4e8d8'; ctx.beginPath(); ctx.ellipse(d*s*.19,-s*.16,s*.09,s*.12,d*.3,0,TAU); ctx.fill(); });
  ctx.fillStyle='#f4e8d8'; ctx.beginPath(); ctx.ellipse(0,-s*.12,s*.13,s*.11,0,0,TAU); ctx.fill();
  ctx.fillStyle=INK;
  [-1,1].forEach(d=>{ ctx.beginPath(); ctx.arc(d*s*.07,-s*.18,s*.045,0,TAU); ctx.fill(); });
  ctx.fillStyle='#fff';
  [-1,1].forEach(d=>{ ctx.beginPath(); ctx.arc(d*s*.07-s*.015,-s*.195,s*.015,0,TAU); ctx.fill(); });
  ctx.fillStyle='#8a5c34'; ctx.beginPath(); ctx.arc(0,-s*.1,s*.02,0,TAU); ctx.fill();
}
function dBee(ctx,s,t){
  const wob=Math.sin(t/60)*.6;
  [-1,1].forEach(d=>{ ctx.save(); ctx.translate(d*s*.1,-s*.16); ctx.rotate(d*wob);
    ctx.fillStyle='rgba(255,255,255,.75)'; ctx.beginPath(); ctx.ellipse(0,-s*.08,s*.09,s*.16,d*.3,0,TAU); ctx.fill(); ctx.restore(); });
  ctx.fillStyle='#ffd75e'; ctx.beginPath(); ctx.ellipse(0,0,s*.26,s*.2,0,0,TAU); ctx.fill(); outline(ctx,s*.02);
  ctx.save(); ctx.beginPath(); ctx.ellipse(0,0,s*.26,s*.2,0,0,TAU); ctx.clip();
  ctx.fillStyle=INK; ctx.fillRect(-s*.08,-s*.22,s*.09,s*.44); ctx.fillRect(s*.08,-s*.22,s*.09,s*.44); ctx.restore();
  ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(-s*.2,-s*.05,s*.035,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s*.24,0); ctx.lineTo(s*.36,s*.02); ctx.lineTo(s*.24,s*.05); ctx.closePath(); ctx.fill();
}
function dMatcha(ctx,s,t){
  ctx.fillStyle='#fff'; ctx.beginPath();
  ctx.moveTo(-s*.26,-s*.18); ctx.lineTo(s*.26,-s*.18); ctx.lineTo(s*.2,s*.3); ctx.lineTo(-s*.2,s*.3);
  ctx.closePath(); ctx.fill(); outline(ctx,s*.02);
  ctx.fillStyle='#7ba05b'; ctx.beginPath(); ctx.ellipse(0,-s*.18,s*.26,s*.08,0,0,TAU); ctx.fill();
  ctx.fillStyle='#94bd72';

const clipCache = new Map();
function getClip(idx){
  if (clipCache.has(idx)) return clipCache.get(idx);
  const rng = mulberry32(idx*2654435761 + 1013904223);
  const bit = pick(rng,BITS);
  const bg = pick(rng,BGS);
  const a = pick(rng,CAST);
  let b = pick(rng,CAST); if (b===a) b = CAST[(CAST.indexOf(a)+3)%CAST.length];
  const n = bit.min + Math.floor(rng()*(bit.max-bit.min+1));
  const list = Array.from({length:n},(_,i)=> inst(rng, (bit.id==='stack'&&i===n-1)||(rng()<.28) ? b : a));
  const C = { s:0, list, center:a, dyn:null };
  const fx = [ pick(rng,FX) ];
  if (rng()<.4) fx.push(pick(rng,FX));
  const stamp = rng()<.55 ? pick(rng,STAMPS) : null;
  const verb = pick(rng,VERBS);
  const cap = pick(rng,CAPS)(a.name.replace(/_/g,' '), b.name.replace(/_/g,' '), verb);
  const clip = {
    idx, rng, bg, bit, C, fx, stamp,
    user:'@'+a.name+pick(rng,HANDLE_SUFFIX),
    cap, song:pick(rng,SONGS),
    likes: Math.floor(rr(rng,200,999000)),
    liked:false,
    ncmt: Math.floor(rr(rng,12,4800)),
    audio:{ bpm:Math.floor(rr(rng,92,168)), scale:pick(rng,[[0,3,5,7,10],[0,2,4,7,9],[0,1,5,7,8]]),
      root:rr(rng,110,220), wave:pick(rng,['square','sawtooth','triangle']), speak:rng()<.4,
      pitch:rr(rng,.25,1.9), rate:rr(rng,.7,1.25) },
    t0:null,
  };
  clip.draw = (ctx,w,h,now) => {
    if (clip.t0===null) clip.t0=now;
    const t = now - clip.t0;
    C.s = Math.min(w,h)*.17;
    bg(ctx,w,h,t);
    bit.run(ctx,w,h,t,C);
    fx.forEach(f=>f(ctx,w,h,t,clip.rng));
    if (stamp){
      const cyc=(t%3400);
      if (cyc<700){
        const k=cyc/700;
        ctx.save(); ctx.translate(w/2,h*.3); ctx.rotate(-.1+k*.06);
        ctx.scale(1+k*.15,1+k*.15);
        ctx.font=`800 ${Math.min(w*.13,52)}px 'Baloo 2'`;
        ctx.textAlign='center';
        ctx.lineWidth=7; ctx.strokeStyle='#20242e'; ctx.strokeText(stamp,0,0);
        ctx.fillStyle='#f6c94a'; ctx.fillText(stamp,0,0);
        ctx.restore();
      }
    }
  };
  clipCache.set(idx,clip);
  if (clipCache.size>24){ const first=clipCache.keys().next().value; clipCache.delete(first); }
  return clip;
}

let AC=null, masterG=null, muted=true, schedTimer=null, nextT=0, step=0;
function ensureAC(){
  if (AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  masterG = AC.createGain(); masterG.gain.value = 0; masterG.connect(AC.destination);
  nextT = AC.currentTime+.06;
  schedTimer = setInterval(scheduler, 40);
}
function setMuted(v){
  muted=v;
  $('bMute').textContent = muted ? '🔇 tap for sound' : '🔊 sound on';
  if (AC) masterG.gain.setTargetAtTime(muted?0:.7, AC.currentTime,.1);
  if (muted) try{ speechSynthesis.cancel(); }catch(e){}
}
function scheduler(){
  if (!AC) return;
  const clip = getClip(feed.cur);
  const spb = 60/clip.audio.bpm/4;
  while (nextT < AC.currentTime + .14){
    scheduleStep(clip, step, nextT);
    nextT += spb; step = (step+1)%16;
  }
}
function scheduleStep(clip, st, at){
  if (muted) return;
  const A = clip.audio;
  if (st%4===0){
    const o=AC.createOscillator(), g=AC.createGain();
    o.frequency.setValueAtTime(120,at); o.frequency.exponentialRampToValueAtTime(38,at+.1);
    g.gain.setValueAtTime(.5,at); g.gain.exponentialRampToValueAtTime(.001,at+.14);
    o.connect(g); g.connect(masterG); o.start(at); o.stop(at+.16);
  }
  if (st%4===2){
    const buf=AC.createBuffer(1,1200,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<1200;i++) d[i]=(Math.random()*2-1)*(1-i/1200);
    const src=AC.createBufferSource(); src.buffer=buf;
    const g=AC.createGain(); g.gain.value=.12;
    src.connect(g); g.connect(masterG); src.start(at);
  }
  if (Math.random()<.62){
    const deg=A.scale[Math.floor(Math.random()*A.scale.length)];
    const oct=Math.random()<.22?2:1;
    const f=A.root*Math.pow(2,deg/12)*oct*2;
    const o=AC.createOscillator(); o.type=A.wave; o.frequency.value=f;
    const g=AC.createGain(); g.gain.setValueAtTime(.09,at);
    g.gain.exponentialRampToValueAtTime(.001,at+.16);
    o.connect(g); g.connect(masterG); o.start(at); o.stop(at+.18);
  }
  if (st===0 && Math.random()<.3){
    const o=AC.createOscillator(); o.type='sine';
    const g=AC.createGain(); g.gain.value=0;
    o.connect(g); g.connect(masterG);
    o.frequency.setValueAtTime(700,at);
    o.frequency.exponentialRampToValueAtTime(280,at+.4);
    g.gain.linearRampToValueAtTime(.12,at+.05);
    g.gain.exponentialRampToValueAtTime(.001,at+.45);
    o.start(at); o.stop(at+.5);
  }
}
function whoosh(){
  if (!AC||muted) return;
  const buf=AC.createBuffer(1,AC.sampleRate*.25,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.sin(i/d.length*Math.PI);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900;
  const g=AC.createGain(); g.gain.value=.25;
  src.connect(f); f.connect(g); g.connect(masterG); src.start();
}
function popSfx(){
  if (!AC||muted) return;
  const o=AC.createOscillator(); o.type='sine';
  const g=AC.createGain(); const t0=AC.currentTime;
  o.frequency.setValueAtTime(400,t0); o.frequency.exponentialRampToValueAtTime(900,t0+.08);
  g.gain.setValueAtTime(.2,t0); g.gain.exponentialRampToValueAtTime(.001,t0+.12);
  o.connect(g); g.connect(masterG); o.start(t0); o.stop(t0+.13);
}
function maybeSpeak(clip){
  if (muted || !clip.audio.speak || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clip.cap);
    u.pitch=clip.audio.pitch; u.rate=clip.audio.rate; u.volume=.85;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============================================================
   FEED
   ============================================================ */
const cv=$('cv'), ctx=cv.getContext('2d');
let W,H,DPR;
function sizeCanvas(){
  W=innerWidth; H=innerHeight;
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
const feed={ cur:0, off:0, target:0, anim:false, seen:1 };
function fmtN(n){ return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':''+n; }
function syncUI(){
  const c=getClip(feed.cur);
  $('mUser').textContent=c.user;
  $('mCap').textContent=c.cap;
  $('mSong').textContent=c.song+' · '+c.song;
  $('likeN').textContent=fmtN(c.likes+(c.liked?1:0));
  $('cmtN').textContent=fmtN(c.ncmt);
  $('clipNo').textContent='CLIP '+(feed.cur+1);
  $('heartIcon').firstElementChild.setAttribute('fill', c.liked?'#ff2d55':'#fff');
}
function go(dir){
  if (feed.anim) return;
  if (feed.cur+dir<0){ toast('this is the top. it only gets weirder down.'); return; }
  feed.anim=true; whoosh();
  try{ speechSynthesis.cancel(); }catch(e){}
  const from=0, to=-dir*H, start=performance.now();
  const next=getClip(feed.cur+dir); next.t0=null;
  function stepA(now){
    const u=clamp((now-start)/260,0,1);
    const e=1-Math.pow(1-u,3);
    feed.off=from+(to-from)*e; feed.next=feed.cur+dir;
    if (u<1) requestAnimationFrame(stepA);
    else{
      feed.cur+=dir; feed.off=0; feed.next=null; feed.anim=false;
      feed.seen=Math.max(feed.seen,feed.cur+1);
      step=0; syncUI(); maybeSpeak(getClip(feed.cur));
      if (feed.cur>0) $('hintUp').style.display='none';
    }
  }
  requestAnimationFrame(stepA);
}

/* hearts burst */
let hearts=[];
function burstHearts(x,y){
  for(let i=0;i<9;i++) hearts.push({x,y,vx:(Math.random()-.5)*3,vy:-2-Math.random()*3,t:0,r:Math.random()*.6-.3,s:14+Math.random()*16});
}
function drawHearts(dt){
  hearts.forEach(hh=>{ hh.t+=dt/1000; hh.x+=hh.vx; hh.y+=hh.vy; hh.vy+=.08; });
  hearts=hearts.filter(hh=>hh.t<1.1);
  hearts.forEach(hh=>{
    ctx.save(); ctx.translate(hh.x,hh.y); ctx.rotate(hh.r);
    ctx.globalAlpha=clamp(1.2-hh.t,0,1);
    ctx.font=hh.s+'px serif'; ctx.textAlign='center';
    ctx.fillText('❤️',0,0); ctx.restore();
  });
  ctx.globalAlpha=1;
}

let lastFrame=0;
function render(now){
  const dt=now-(lastFrame||now); lastFrame=now;
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(0,feed.off);
  getClip(feed.cur).draw(ctx,W,H,now);
  ctx.restore();
  if (feed.next!=null && feed.next!==feed.cur){
    ctx.save(); ctx.translate(0,feed.off+(feed.next>feed.cur?H:-H));
    getClip(feed.next).draw(ctx,W,H,now);
    ctx.restore();
  }
  drawHearts(dt);
  requestAnimationFrame(render);
}

/* ============================================================
   INPUT
   ============================================================ */
let touchY=null, lastTap=0;
cv.addEventListener('pointerdown',e=>{ ensureAC(); touchY=e.clientY; });
cv.addEventListener('pointerup',e=>{
  if (touchY===null) return;
  const dy=e.clientY-touchY; touchY=null;
  if (Math.abs(dy)>60){ go(dy<0?1:-1); return; }
  const now=performance.now();
  if (now-lastTap<320){ likeCurrent(true); burstHearts(e.clientX,e.clientY); lastTap=0; }
  else lastTap=now;
});
let wheelAcc=0, wheelLock=0;
addEventListener('wheel',e=>{
  ensureAC();
  const now=performance.now();
  if (now<wheelLock) return;
  wheelAcc+=e.deltaY;
  if (Math.abs(wheelAcc)>90){ go(wheelAcc>0?1:-1); wheelAcc=0; wheelLock=now+380; }
},{passive:true});
addEventListener('keydown',e=>{
  if (e.key==='ArrowDown'||e.key===' '){ e.preventDefault(); ensureAC(); go(1); }
  if (e.key==='ArrowUp'){ e.preventDefault(); ensureAC(); go(-1); }
  if (e.key==='m') setMuted(!muted);
});
function likeCurrent(force){
  const c=getClip(feed.cur);
  if (c.liked && !force) c.liked=false;
  else if (!c.liked){ c.liked=true; popSfx(); }
  syncUI();
}
$('bLike').addEventListener('click',()=>{ ensureAC(); likeCurrent(); });
$('bShare').addEventListener('click',()=>{
  const url=location.origin+location.pathname+'#clip'+(feed.cur+1);
  try{ navigator.clipboard.writeText(url); }catch(e){}
  toast('link copied. inflict it on someone.');
});
$('tabFollow').addEventListener('click',()=>toast('you follow no one. free yourself.'));
$('bMute').addEventListener('click',()=>{ ensureAC(); setMuted(!muted); if(!muted) maybeSpeak(getClip(feed.cur)); });

/* comments */
function openComments(){
  const c=getClip(feed.cur);
  const rng=mulberry32(c.idx*77777+13);
  const n=4+Math.floor(rng()*5);
  const others=CAST.filter(m=>m.name!==c.user.slice(1).split('_official')[0]);
  let html='';
  for(let i=0;i<n;i++){
    const who=pick(rng,others), tmpl=pick(rng,COMMENTS);
    html+=`<div class="cmt"><div class="cu">@${who.name}${pick(rng,HANDLE_SUFFIX)}</div>
      <div class="ct">${tmpl(pick(rng,CAST).name.replace(/_/g,' '))}</div>
      <div class="cl">${fmtN(Math.floor(rng()*4000))} likes · reply</div></div>`;
  }
  $('cHead').textContent=fmtN(c.ncmt)+' comments';
  $('clist').innerHTML=html;
  $('comments').classList.add('open');
}
$('bCmt').addEventListener('click',openComments);
$('cClose').addEventListener('click',()=>$('comments').classList.remove('open'));

function toast(msg){
  const el=$('toast'); el.textContent=msg; el.style.opacity=1;
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.opacity=0,1600);
}

/* ============================================================
   BOOT
   ============================================================ */
addEventListener('resize',sizeCanvas);
sizeCanvas();
syncUI();
requestAnimationFrame(render);

window.WT = { feed, go, getClip, likeCurrent, openComments, get muted(){return muted;}, setMuted,
  CAST, BITS, BGS, get hearts(){return hearts;} };
</script>
</body>
