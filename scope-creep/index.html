<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scope Creep</title>
<meta name="description" content="An idle project management game: grow a lemonade stand into a galactic empire.">
<meta name="theme-color" content="#3d3d3d">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Scope Creep">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same family as the Bootcamp (greyscale, Barlow, the phone frame on a dark grid), with a colour per era. */
:root{color-scheme:light dark;--bg:#ffffff;--ink:#141414;--mut:#626262;--line:#e5e5e5;--soft:#f3f3f3;--card:#ffffff;--bar:#3d3d3d;--hv:#e10600;--era:#f5c400;--era-ink:#141414}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--ink:#f0f0f0;--mut:#a2a2a2;--line:#2f2f2f;--soft:#1d1d1d;--card:#1b1b1b;--bar:#2a2a2a}}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#2a2a2a;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:16px/1.35 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif;line-height:1.05;margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--hv);outline-offset:2px}
#phone{position:relative;max-width:440px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.5)}
/* top bar */
.hud{flex:none;background:var(--bar);color:#fff;border-bottom:4px solid var(--era);padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;transition:border-color .6s}
.hud .era{display:flex;align-items:center;gap:6px;font:800 13px "Barlow Condensed",sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--era)}
.hud .era i{width:10px;height:10px;border-radius:50%;background:var(--era)}
.hud .cash{font:800 30px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.hud .ips{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.hud .right{grid-row:1/4;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.morale{display:flex;align-items:center;gap:5px;font-size:12px}.morale .mb{width:64px;height:8px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}.morale .mb i{display:block;height:100%;background:#ff5d8f;transition:width .3s}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);display:grid;place-items:center;padding:0}
.goal{grid-column:1/3;display:flex;align-items:center;gap:8px;font-size:12px;margin-top:4px;background:none;border:0;padding:0;color:#fff;text-align:left}
.goal .gb{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}.goal .gb i{display:block;height:100%;background:var(--era);transition:width .3s}
.goal b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
/* the scene */
#scene{position:relative;flex:none;height:210px;overflow:hidden;background:var(--sky,linear-gradient(#8fd3ff,#e8f7ff));transition:background .8s}
#scene svg.land{position:absolute;left:0;right:0;bottom:0;width:100%;height:120px}
.tap{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff8 0 18%,transparent 19%),var(--era);color:var(--era-ink);box-shadow:0 8px 0 rgba(0,0,0,.28),0 12px 24px rgba(0,0,0,.25);font:800 21px "Barlow Condensed",sans-serif;letter-spacing:.5px;text-transform:uppercase;transition:transform .06s,background .6s;z-index:3}
.tap small{display:block;font:700 12px Barlow,sans-serif;letter-spacing:0;text-transform:none;opacity:.8}
.tap:active,.tap.hit{transform:translate(-50%,-47%) scale(.94);box-shadow:0 3px 0 rgba(0,0,0,.28),0 6px 14px rgba(0,0,0,.25)}
.combo{position:absolute;left:50%;top:44%;width:142px;height:142px;transform:translate(-50%,-50%);z-index:2;pointer-events:none}
.combo circle{fill:none;stroke-width:7}.combo .bg{stroke:rgba(255,255,255,.35)}.combo .fg{stroke:var(--hv);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .15s}
.tap.nudge{animation:nudge 1.4s ease-in-out infinite}@keyframes nudge{50%{box-shadow:0 8px 0 rgba(0,0,0,.28),0 0 0 10px color-mix(in srgb,var(--era) 45%,transparent)}}
.combotxt{position:absolute;left:50%;top:calc(44% + 76px);transform:translateX(-50%);z-index:3;font:800 15px "Barlow Condensed",sans-serif;color:#fff;text-shadow:0 1px 3px #0009;letter-spacing:1px}
.float{position:absolute;z-index:5;pointer-events:none;font:800 20px "Barlow Condensed",sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4),0 0 8px rgba(0,0,0,.35);animation:rise .9s ease-out forwards}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}
.coin{position:absolute;z-index:4;width:10px;height:10px;border-radius:50%;background:var(--era);border:2px solid #0003;pointer-events:none;animation:fly .7s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.buff{position:absolute;top:8px;left:8px;right:8px;z-index:6;display:none;align-items:center;gap:8px;background:#111c;color:#fff;border-left:5px solid var(--hv);border-radius:10px;padding:6px 10px;font-size:13px}
.buff.on{display:flex;animation:pop .3s}.buff b{font:800 18px "Barlow Condensed",sans-serif;color:#ffd84d}
.opp{position:absolute;z-index:7;width:74px;height:74px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#ffd84d 13% 60%,#f5a300);box-shadow:0 0 0 6px #ffd84d55,0 6px 14px #0006;font:800 13px/1.05 "Barlow Condensed",sans-serif;color:#3b2a00;padding:6px;animation:bob 1.1s ease-in-out infinite;text-transform:uppercase}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.lunch{position:absolute;right:10px;bottom:10px;z-index:6;border:0;border-radius:12px;padding:7px 11px;background:#ff5d8f;color:#fff;font:800 15px "Barlow Condensed",sans-serif;box-shadow:0 4px 0 #0003;animation:pop .3s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
/* tabs */
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);background:var(--bg)}
.tabs button{border:0;background:none;padding:10px 4px;font:800 15px "Barlow Condensed",sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--mut);position:relative}
.tabs button[aria-selected=true]{color:var(--ink)}.tabs button[aria-selected=true]::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;background:var(--era);border-radius:3px}
.tabs .dot{position:absolute;top:7px;right:16%;width:8px;height:8px;border-radius:50%;background:var(--hv)}
#panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 10px 24px}
.sec{font:800 13px "Barlow Condensed",sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:14px 2px 6px}
.qty{display:flex;gap:6px;margin-bottom:8px}.qty button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:5px 0;font:800 15px "Barlow Condensed",sans-serif}.qty button[aria-pressed=true]{border-color:var(--era);background:var(--era);color:var(--era-ink)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px;margin-bottom:7px;position:relative;overflow:hidden;transition:transform .08s,border-color .2s}
.row:active{transform:scale(.98)}.row.can{border-color:var(--era)}.row:disabled{opacity:.55;cursor:default}
.row .ico{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--era) 22%,transparent)}
.row .nm{display:block;font:700 18px/1.1 "Barlow Condensed",sans-serif;padding-right:18px}.row .sub{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.row .px{text-align:right;font:800 17px "Barlow Condensed",sans-serif;white-space:nowrap}.row .px small{display:block;font:600 11px Barlow,sans-serif;color:var(--mut)}
.row .own{position:absolute;right:10px;top:4px;font:800 11px "Barlow Condensed",sans-serif;color:var(--mut)}
.row .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--era);opacity:.7}
.row.flash{animation:flash .5s}@keyframes flash{30%{background:color-mix(in srgb,var(--era) 40%,var(--card))}}
.boost{position:absolute;right:52px;top:50%;transform:translateY(-50%);font:800 22px "Barlow Condensed",sans-serif;color:var(--hv);animation:boost 1.2s ease-out forwards;pointer-events:none}
@keyframes boost{from{transform:translateY(-50%) scale(.5)}20%{transform:translateY(-50%) scale(1.3)}to{transform:translateY(-120%);opacity:0}}
.tech .ico{background:color-mix(in srgb,var(--hv) 18%,transparent)}
.cap{border:3px solid var(--era);border-radius:16px;padding:14px;background:color-mix(in srgb,var(--era) 10%,var(--card));text-align:center}
.cap h2{font-size:30px;margin:4px 0}.cap p{margin:4px 0;color:var(--mut)}
.capbar{height:16px;border-radius:9px;background:var(--soft);overflow:hidden;margin:10px 0}.capbar i{display:block;height:100%;background:var(--era);transition:width .3s}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:12px;border:0;background:var(--hv);color:#fff;font:800 20px "Barlow Condensed",sans-serif;letter-spacing:.5px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:disabled{background:var(--line);color:var(--mut);box-shadow:none}.btn.alt{background:var(--soft);color:var(--ink);border:2px solid var(--line);box-shadow:none}.btn.wide{width:100%}
.timeline{display:flex;gap:4px;margin:14px 0 4px}.timeline i{flex:1;height:10px;border-radius:5px;background:var(--line)}.timeline i.done{background:var(--mut)}.timeline i.now{background:var(--era)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stats div{border:1px solid var(--line);border-radius:10px;padding:8px}.stats small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.8px}.stats b{font:800 20px "Barlow Condensed",sans-serif}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.ach div{border:1px dashed var(--line);border-radius:10px;padding:7px 9px;font-size:13px;color:var(--mut)}.ach div.on{border:2px solid var(--era);color:var(--ink)}.ach b{display:block;font:800 16px "Barlow Condensed",sans-serif}
.small{font-size:12px;color:var(--mut)}
/* event card and dialogs */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:5px solid var(--hv);border-radius:18px 18px 0 0;padding:14px 14px max(14px,env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.35);animation:up .3s ease-out;max-height:80%;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}}
.sheet small.k{font:800 12px "Barlow Condensed",sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--hv)}
.sheet h2{font-size:28px;margin:4px 0 4px}.sheet p{margin:0 0 10px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:7px;font-size:15px}
.opt b{display:inline-block;width:22px;color:var(--hv);font-family:"Barlow Condensed",sans-serif}
.opt.good{border-color:#27c26a;background:color-mix(in srgb,#27c26a 15%,var(--bg))}.opt.bad{border-color:var(--hv);background:color-mix(in srgb,var(--hv) 12%,var(--bg))}
.timer{height:6px;border-radius:4px;background:var(--soft);overflow:hidden;margin-bottom:10px}.timer i{display:block;height:100%;background:var(--hv)}
.overlay{position:absolute;inset:0;z-index:30;background:color-mix(in srgb,var(--era) 85%,#000);color:var(--era-ink);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;animation:fade .4s}
@keyframes fade{from{opacity:0}}
.overlay small{font:800 13px "Barlow Condensed",sans-serif;letter-spacing:3px;text-transform:uppercase}
.overlay h1{font-size:46px;margin:6px 0 12px}.overlay p{font-size:17px;max-width:340px;margin:0 0 18px}
.overlay .btn{background:#141414}
.toast{position:absolute;left:10px;right:10px;bottom:max(12px,env(safe-area-inset-bottom));z-index:25;background:#141414;color:#fff;border-left:6px solid var(--era);border-radius:12px;padding:10px 12px;font-size:14px;animation:pop .25s;box-shadow:0 6px 20px #0006}
.toast b{display:block;font:800 17px "Barlow Condensed",sans-serif}
.conf{position:absolute;z-index:40;width:8px;height:12px;top:-10px;pointer-events:none;animation:conf 1.8s ease-in forwards}
@keyframes conf{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ticker{flex:none;overflow:hidden;white-space:nowrap;background:#141414;color:#fff;font:600 12px Barlow,sans-serif;padding:5px 0;border-bottom:2px solid var(--era)}
.ticker span{display:inline-block;padding-left:100%;animation:tick 38s linear infinite}@keyframes tick{to{transform:translateX(-100%)}}
.tabs{grid-template-columns:repeat(5,1fr)}.tabs button{font-size:13.5px;letter-spacing:.3px;padding:10px 2px}.tabs .dot{right:4%;top:5px}
.tap.fever{background:conic-gradient(from var(--spin,0deg),#ff3b3b,#ffb000,#27c26a,#2f80ed,#d63af9,#ff3b3b);color:#fff;text-shadow:0 2px 4px #0008;animation:spin 1s linear infinite}
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}@keyframes spin{to{--spin:360deg}}
.fevertxt{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;font:800 26px "Barlow Condensed",sans-serif;color:#fff;letter-spacing:2px;text-shadow:0 0 12px #ff3b3b,0 2px 0 #0006;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.12)}}
.lesson{border-left:4px solid var(--era);background:var(--soft);border-radius:0 10px 10px 0;padding:8px 10px;margin:6px 0 10px;font-size:15px}
.staff{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px;margin-bottom:8px}
.staff.hired{border-color:var(--era)}.staff.locked{opacity:.55}
.staff .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--era) 25%,transparent);font:800 20px "Barlow Condensed",sans-serif}
.staff b{font:700 18px/1.1 "Barlow Condensed",sans-serif}.staff .pips{color:var(--era);letter-spacing:2px;font-size:14px}.staff .does{font-size:13px}.staff .why{font-size:12px;color:var(--mut);font-style:italic;margin-top:3px}
.staff .btn{min-height:44px;padding:6px 10px;font-size:16px;white-space:nowrap;flex-direction:column;gap:0;line-height:1.05}.staff .btn small{display:block;font:600 11px Barlow,sans-serif}
.job{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.job.ready{border-color:var(--era);animation:glow 1s ease-in-out infinite alternate}@keyframes glow{to{box-shadow:0 0 0 4px color-mix(in srgb,var(--era) 35%,transparent)}}
.job b{font:700 18px "Barlow Condensed",sans-serif}.job .jb{height:6px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}.job .jb i{display:block;height:100%;background:var(--era)}
.job .btn{min-height:40px;padding:6px 14px;font-size:17px}
.adv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.adv div{border:2px solid var(--line);border-radius:12px;padding:8px;font-size:12px;color:var(--mut)}.adv div.on{border-color:var(--era);color:var(--ink);background:color-mix(in srgb,var(--era) 8%,var(--card))}.adv b{display:block;font:800 16px "Barlow Condensed",sans-serif;color:var(--ink)}
.manual details{border-bottom:1px solid var(--line);padding:6px 2px}.manual summary{cursor:pointer;font:700 16px "Barlow Condensed",sans-serif}.manual p{margin:4px 0 6px;font-size:14px}
.calcq{font:800 24px "Barlow Condensed",sans-serif;margin:4px 0 8px}
textarea.code{width:100%;font:12px ui-monospace,monospace;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<div id="phone">
<header class="hud">
  <div class="era" id="eraName"><i></i><span></span></div>
  <div class="cash" id="cash" aria-live="off">$0</div>
  <div class="ips" id="ips">$0 / sec</div>
  <div class="right"><button class="iconbtn" id="sound" aria-label="Sound on" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
    <div class="morale" title="Crew morale"><span aria-hidden="true">♥</span><span class="mb"><i id="moraleBar"></i></span></div></div>
  <button class="goal" id="goalStrip" aria-label="Era goal"><b id="goalName"></b><span class="gb"><i id="goalBar"></i></span><span id="goalPct">0%</span></button>
</header>
<section id="scene" aria-label="Your business">
  <svg class="land" id="land" viewBox="0 0 360 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
  <svg class="combo" viewBox="0 0 142 142" aria-hidden="true"><circle class="bg" cx="71" cy="71" r="64"/><circle class="fg" id="comboRing" cx="71" cy="71" r="64" stroke-dasharray="0 402"/></svg>
  <button class="tap" id="tap"><span id="tapVerb">Squeeze</span><small id="tapValue">+$1</small></button>
  <div class="combotxt" id="comboTxt"></div>
  <div class="buff" id="buff"><b id="buffMult">×5</b><span id="buffName"></span><span style="margin-left:auto" id="buffTime"></span></div>
</section>
<div class="ticker" aria-hidden="true"><span id="tickerText"></span></div>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="build" aria-selected="true">Build</button>
  <button role="tab" data-tab="tech" aria-selected="false">Upgrades<span class="dot" id="techDot" hidden></span></button>
  <button role="tab" data-tab="jobs" aria-selected="false">Team<span class="dot" id="jobDot" hidden></span></button>
  <button role="tab" data-tab="goal" aria-selected="false">Goal<span class="dot" id="goalDot" hidden></span></button>
  <button role="tab" data-tab="more" aria-selected="false">More</button>
</nav>
<main id="panel" role="tabpanel"></main>
</div>
<script>
// The game's economy: data and pure rules, shared by the page and the balancing simulation.
const ERAS=[
 {name:'Lemonade Stand',colour:'#f5c400',verb:'Squeeze',unit:'cup',
  producers:['Squeeze-o-matic kid','Second stand','Sugar supplier deal','Street-corner franchise'],capstone:'Open the corner store',
  techs:[['To-do list','click','Write it down and stop forgetting the ice.'],['Shopping list','era','Buy lemons before you run out. Procurement!'],['Check the weather','events','Rain is a risk. Risks can be planned for.']]},
 {name:'Food Truck',colour:'#ff6b2c',verb:'Flip',unit:'taco',
  producers:['Food truck','Taco fleet','Commissary kitchen','Festival circuit'],capstone:'Buy the restaurant group',
  techs:[['Gantt chart','era','Bars on a chart. Suddenly everyone knows Tuesday.'],['Kanban board','click','Limit work in progress. Finish tacos before starting new ones.'],['Food safety plan','morale','Nobody gets sick. Crew sleeps better.']]},
 {name:'Café Chain',colour:'#b5651d',verb:'Pour',unit:'latte',
  producers:['Espresso bar','Bakery','Roastery','Drive-thru network'],capstone:'Build your own head office',
  techs:[['Standard work','era','Same great latte, every store.'],['Customer survey','events','Stakeholders tell you things. Listen.'],['Loyalty program','all','Regulars are a business model.']]},
 {name:'Construction Co.',colour:'#ff9500',verb:'Pour',unit:'m³',
  producers:['Reno crew','Framing crew','Concrete plant','Crane fleet'],capstone:'Win the stadium bid',
  techs:[['Critical path method','era','Find the longest chain. Protect it.'],['Safety program','morale','Everyone goes home. Every day.'],['Change control','events','Scope changes go through the board, not the hallway.']]},
 {name:'Megaprojects',colour:'#2f80ed',verb:'Bore',unit:'metre',
  producers:['Bridge division','Tower division','Tunnel boring machine','High-speed rail'],capstone:'License a nuclear plant',
  techs:[['Earned value','all','Know where you are, in dollars.'],['Advanced work packaging','era','Crews only get work that is ready to build.'],['BIM model','click','Clash it in the model, not in the field.']]},

'Advanced work packaging':['AWP plans backwards from the crews: a crew only gets a work package once every constraint (drawings, materials, scaffold, permits) is cleared.','A work package is missing its scaffold. What do you do?','Hold it and release one that is ready','Start anyway and sort out the scaffold later','Split the crew between this package and another'],
'BIM model':['Building information modelling is a shared 3D model with data. Clashes are found on screen, not in the field.','Where is the cheapest place to find a pipe hitting a beam?','In the model, before construction','On site, when the pipefitter arrives','At handover, during the final walkdown'],
'Nuclear QA program':['Nuclear QA means everything important to safety is controlled and recorded. Every weld, every test, every signature is traceable.','A gauge was out of calibration. What about work measured with it?','Treat it as suspect and re-check it','It is fine, the gauge was only slightly off','Recalibrate the gauge and carry on'],
'Human performance tools':['Self-checking (stop, think, act, review), peer checks and three-way communication catch human slips before they matter.','What is three-way communication?','Say it, the listener repeats it, you confirm','Say the instruction three times, a little louder each time, so nobody misses it','Send it by radio, email and text'],
'Peer review':['Peer reviews bring experienced people from other sites to find what you have stopped seeing. In nuclear, WANO and INPO run them.','What is a peer review for?','Finding problems you have stopped seeing','Handing out fines to the site for every mistake the visiting team can find','Approving the project budget'],
'Systems engineering':['The V-model: requirements go down the left side to design, and tests come back up the right side to prove each requirement is met.','Verification asks "did we build it right?" What does validation ask?','Did we build the right thing?','Did we build it on time and to the schedule we promised the owner?','Did we build it under budget?'],
'Launch readiness review':['A readiness review is a go or no-go decision based on data, made before the point of no return.','When should a readiness review happen?','Before the point of no return','Right after something goes wrong','Only if the schedule has slipped'],
'Digital twin':['A digital twin is a live model linked to real data from the asset, so you can test changes safely.','What makes a model a digital twin?','It is linked to live data from the real thing','It is in 3D, looks realistic and was rendered by a professional studio','It was built by the same designers'],
'Last Planner system':['The people doing the work plan the next week and promise only what they can deliver. Track how many promises were kept.','Who makes the weekly work plan in Last Planner?','The people who will do the work','The scheduler, alone, in the office','The client, at the monthly meeting'],
'Modular construction':['Build modules in a factory where conditions are controlled, then assemble on site. Less weather, better quality.','What is the main advantage of building modules off site?','Controlled conditions and less site work','Modules never need to be inspected','Transport is always cheaper than materials'],
'Reference class forecasting':['Estimate by looking at how similar past projects actually turned out, not just at your own plan.','How do you use reference class forecasting?','Look at how similar past projects turned out','Ask the team for their most optimistic guess and add a little for luck','Take last year\'s budget and add 10%'],
'Portfolio management':['A portfolio is all the projects an organization chooses to do. Pick the ones that best fit the strategy, and stop the rest.','Twelve projects, money for six. What does portfolio management do?','Rank them by strategic value and fund the best','Fund all twelve at half the budget each','Fund the ones with the loudest sponsors'],
'Program governance':['Governance is how decisions get made: who decides, on what, and when. Good governance decides fast and writes it down.','What is the main job of a program board?','Make the big decisions and own them','Approve every small purchase on every project, however small it is','Write the weekly status reports'],
'Morale officer':['Teams go through forming, storming, norming and performing. Leaders adjust their style to the stage.','A new team argues about how to work. Which stage is it?','Storming','Performing','Adjourning'],
'AI scheduler':['Tools can re-plan fast, but a schedule is only as good as its logic and its data. Garbage in, garbage out, at the speed of light.','An AI schedule says a task takes zero days. What do you do?','Check the data and the logic','Trust it, the AI is smarter','Delete the task from the schedule'],
'Self-replicating crews':['Developing people is part of the job. Coaching and cross-training make the team stronger than any one person.','Your only welder for an alloy is going on leave. What should have happened earlier?','Cross-train a second welder','Ask the welder to cancel the leave','Change the alloy on the drawings'],
'Monte Carlo everything':['Monte Carlo simulation runs the schedule thousands of times with random variation, giving a range of finish dates and their odds.','What does a Monte Carlo schedule give you?','A range of finish dates with probabilities','One exact finish date that everyone can plan around with full confidence','A list of who to blame if it slips'],
'Galactic PMO':['A project management office sets standards, collects status and helps projects succeed. The good ones make reporting lighter, not heavier.','What should a good PMO do to reporting?','Make it lighter and generated from the plan','Double the number of reports so nothing could possibly be missed','Ask for a new template every month'],

function migrate(rec){const s=Object.assign(DEFAULTS(),rec);const from=rec.v||1;
  if(from<2){// version 1 had no advisors or field manual: hand out what was already earned
    s.advisors=[...Array(s.done?E.ERAS.length:s.era).keys()];

async function recover(){try{const db=await idb();const got=await new Promise(ok=>{const r=db.transaction('kv').objectStore('kv').get(SAVE_KEY);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)});db.close();

  function tone(type,f,t,d,peak,to){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}

const pick=a=>a[Math.floor(Math.random()*a.length)],R5=n=>Math.round(n/5)*5;

const CALCS=[
 {key:'Communication channels',min:0,make(){const n=pick([4,5,6,7,8,10,12]),a=n*(n-1)/2;return{q:'A crew of '+n+' people. How many communication channels?',a:String(a),opts:spread(a,String,()=>pick([n*n,n*(n-1),2*n,a+n,a-n+1,n*(n+1)/2])),explain:'Channels = n(n − 1) ÷ 2 = '+n+' × '+(n-1)+' ÷ 2 = '+a+'. Every person you add adds a channel to everyone else.'}}},
 {key:'Float',min:0,make(){const es=pick([2,3,4,5,6,8]),ls=es+pick([0,2,3,4,5,7]),a=ls-es;return{q:'A task can start on day '+es+' at the earliest and day '+ls+' at the latest. How much float?',a:a+' days',opts:spread(a,v=>v+' days',()=>pick([es,ls,es+ls,a+1,a+2,Math.max(0,a-1)])),explain:'Float = latest start − earliest start = '+ls+' − '+es+' = '+a+'.'+(a===0?' Zero float: it\'s on the critical path.':' It can slip that long without delaying the finish.')}}},
 {key:'Expected monetary value',min:0,make(){const p=pick([10,20,25,30,40,50]),imp=pick([1000,2000,4000,5000,8000,10000]),a=p/100*imp;return{q:'A '+p+'% chance of a $'+imp.toLocaleString()+' loss. What is the EMV?',a:'−$'+a.toLocaleString(),opts:spread(a,v=>'−$'+v.toLocaleString(),()=>pick([imp,imp*(1-p/100),a*2,a/2,p*10,imp-a])),explain:'EMV = probability × impact = '+p+'% × $'+imp.toLocaleString()+' = $'+a.toLocaleString()+'. Spend less than that to remove the risk and it\'s worth it.'}}},
 {key:'Cost performance index',min:2,make(){const ac=pick([80,100,120,125,150,160,200]),ev=pick([60,80,90,100,120,150,180].filter(v=>v!==ac)),a=ev/ac;return{q:'Earned value $'+ev+'k, actual cost $'+ac+'k. What is CPI?',a:fmt2(a),opts:spread(a,fmt2,()=>pick([ac/ev,(ev-ac)/ac,a+.1,a-.1,a+.2,ev/(ac+ev)])),explain:'CPI = EV ÷ AC = '+ev+' ÷ '+ac+' = '+fmt2(a)+'. '+(a<1?'Under 1: each dollar spent is buying less than a dollar of work.':'Over 1: you\'re getting more work than you\'re paying for.')}}},
 {key:'Schedule performance index',min:2,make(){const pv=pick([80,100,120,150,200]),ev=pick([60,75,90,100,120,180].filter(v=>v!==pv)),a=ev/pv;return{q:'Earned value $'+ev+'k, planned value $'+pv+'k. What is SPI?',a:fmt2(a),opts:spread(a,fmt2,()=>pick([pv/ev,a+.1,a-.1,a+.25,(pv-ev)/pv])),explain:'SPI = EV ÷ PV = '+ev+' ÷ '+pv+' = '+fmt2(a)+'. '+(a<1?'Under 1: behind schedule.':'Over 1: ahead of schedule.')}}},
 {key:'Cost variance',min:2,make(){const ev=pick([100,120,150,200,250]),ac=ev+pick([-40,-20,-10,10,20,30,50]),a=ev-ac;const f=v=>(v<0?'−$':'$')+Math.abs(v)+'k';return{q:'EV is $'+ev+'k and AC is $'+ac+'k. What is the cost variance?',a:f(a),opts:spread(a,f,()=>pick([-a,ac-ev,a*2,ev+ac,a+10,a-10])),explain:'CV = EV − AC = '+ev+' − '+ac+' = '+f(a)+'. '+(a<0?'Negative: over budget.':'Positive: under budget.')}}},
 {key:'Three-point (PERT) estimate',min:3,make(){const o=pick([2,3,4,6]),m=o+pick([2,3,4]),p=m+pick([4,6,8,10]),a=(o+4*m+p)/6;return{q:'Optimistic '+o+' days, most likely '+m+', pessimistic '+p+'. What is the PERT estimate?',a:fmt2(a)+' days',opts:spread(a,v=>fmt2(v)+' days',()=>pick([(o+m+p)/3,m,(o+p)/2,a+1,a-1,p-o])),explain:'PERT = (O + 4M + P) ÷ 6 = ('+o+' + '+4*m+' + '+p+') ÷ 6 = '+fmt2(a)+'. The most likely value counts four times.'}}},
 {key:'Estimate at completion',min:4,make(){const bac=pick([400,500,600,800,1000]),cpi=pick([.8,.9,1.25,.75,1.1]),a=bac/cpi;const f=v=>'$'+Math.round(v)+'k';return{q:'Budget $'+bac+'k, CPI '+cpi+'. If the trend continues, what is the EAC?',a:f(a),opts:spread(a,f,()=>pick([bac*cpi,bac,bac+bac*(1-cpi),a+50,a-50])),explain:'EAC = BAC ÷ CPI = '+bac+' ÷ '+cpi+' = '+f(a)+'.'}}}];

  const close=()=>{sh.remove();eventOpen=false;scheduleCalc()};
  sh.querySelectorAll('.opt').forEach(b=>b.onclick=()=>finish(b.dataset.v));
  const tm=setInterval(()=>{if(!sh.isConnected||done){clearInterval(tm);return}const left=1-(S.t-t0)/25;$('cTimer').style.width=Math.max(0,left*100)+'%';if(left<=0)finish(null)},100)}

/* ---------- jobs: three side jobs at a time ---------- */
function newJob(exclude){const pool=CONTENT.JOBS.filter(j=>!exclude.includes(j[0]));const j=pick(pool);return{kind:j[0],target:j[1](S),progress:0,secs:j[3]}}
function fillJobs(){while(S.jobs.length<3)S.jobs.push(newJob(S.jobs.map(j=>j.kind)))}
function jobProgress(kind,n){let changed=false;for(const j of S.jobs)if(j.kind===kind&&j.progress<j.target){j.progress=Math.min(j.target,j.progress+n);changed=true;if(j.progress>=j.target){SFX.opp();toast('Job ready','“'+jobText(j)+'” is done. Collect it on the Jobs tab.')}}
  if(changed&&tabNow==='jobs')render()}
const jobText=j=>CONTENT.JOBS.find(x=>x[0]===j.kind)[2](j.target);
function claimJob(i,byStaff){const j=S.jobs[i];if(!j||j.progress<j.target)return;const co=E.staffLevel(S,'coordinator'),r=E.bonus(S,j.secs)*(co>=3?1.5:co>=2?1.25:1);S.cash+=r;S.earned+=r;S.jobsDone++;S.jobs.splice(i,1);fillJobs();SFX.milestone();if(!byStaff)confettiSmall();toast(byStaff?'Theo collected a job':'Job paid',money(r)+'. A new job is on the board.');if(tabNow==='jobs')render();hud();checkAch()}

/* ---------- staff: they take the busywork off your hands ---------- */
const pips=n=>'●'.repeat(n)+'○'.repeat(3-n);
function staffHTML(){return '<div class="sec">Your staff</div><p class="small" style="margin:0 2px 8px">Hire people to handle the busywork. Each has three levels.</p>'+E.STAFF.map(st=>{const [id,name,title,era,does,why]=st,lvl=E.staffLevel(S,id);
  if(S.era<era)return '<div class="staff locked"><span class="av">?</span><span><b>'+esc(title)+'</b><div class="does">Joins in era '+(era+1)+', '+esc(E.ERAS[era].name)+'.</div></span><span></span></div>';
  const c=lvl<3?E.staffCost(S,id,lvl):0;
  return '<div class="staff'+(lvl?' hired':'')+'"><span class="av" aria-hidden="true">'+esc(name[0])+'</span><span><b>'+esc(name)+' · '+esc(title)+'</b> <span class="pips" aria-label="level '+lvl+' of 3">'+pips(lvl)+'</span>'+
    '<div class="does">'+(lvl?'Now: '+esc(does[lvl-1]):esc(does[0]))+(lvl&&lvl<3?'<br>Next: '+esc(does[lvl]):'')+'</div><div class="why">'+esc(why)+'</div></span>'+
    (lvl<3?'<button class="btn" data-hire="'+id+'"'+(S.cash<c?' disabled':'')+'>'+(lvl?'Promote':'Hire')+'<small>'+money(c)+'</small></button>':'<span class="small">Top level</span>')+'</div>'}).join('')}
function hire(id,btn){const before=E.staffLevel(S,id);if(!E.hireStaff(S,id))return nope(btn);const st=E.STAFF.find(x=>x[0]===id);SFX.milestone();confettiSmall();
  if(!S.manual.includes('S:'+id))S.manual.push('S:'+id);
  toast(before?st[1]+' promoted':st[1]+' joins the team',st[4][before]);render();hud();checkAch()}
let staffClock=0,buyerClock=0;
function staffTick(dt){staffClock+=dt;buyerClock+=dt;if(staffClock<1)return;staffClock=0;
  // the cook buys lunch before morale gets low
  const cook=E.staffLevel(S,'cook');if(cook&&S.morale<[50,60,70][cook-1]&&E.lunch(S)){SFX.lunch();jobProgress('lunch',1)}
  // the coordinator collects finished jobs
  if(E.staffLevel(S,'coordinator')){const i=S.jobs.findIndex(j=>j.progress>=j.target);if(i>=0)claimJob(i,true)}
  // the buyer picks the best-value business that is cheap next to your cash
  const buyer=E.staffLevel(S,'buyer');if(buyer&&buyerClock>=[20,10,5][buyer-1]){buyerClock=0;let best=null;
    for(let e=0;e<=S.era;e++)for(let i=0;i<4;i++){const c=E.cost(e,i,S.owned[e][i]);if(c>S.cash*.1)continue;const gain=E.baseIncome(e,i)*E.eraMult(S,e)*E.milestoneMult(S.owned[e][i]+1);const v=gain/c;if(!best||v>best.v)best={e,i,v}}
    if(best&&E.buy(S,best.e,best.i)){if(best.e===S.era)jobProgress('buyCurrent',1);drawLand();if(tabNow==='build')render()}}}
// the scout and the risk manager step in when you don't
const scoutCatches=()=>{const l=E.staffLevel(S,'scout');return l>=2||(l===1&&Math.random()<.5)};
const riskPick=ev=>{const l=E.staffLevel(S,'risk');if(!l)return null;const want=l>=2?'2':'1';const i=ev[2].findIndex(o=>o[1]===want);return i>=0?i:null};

/* ---------- advisors ---------- */
const advisorCard=i=>{const a=E.ADVISORS[i];return a?'<p style="background:#0002;border-radius:12px;padding:10px 12px;font-size:15px"><b style="font:800 18px Barlow Condensed,sans-serif">New advisor: '+esc(a[0])+'</b><br>'+esc(a[3])+'</p>':''};

/* ---------- fever ---------- */
let feverWas=false;function feverFx(){const on=E.feverOn(S);$('tap').classList.toggle('fever',on);let t=$('feverTxt');
  if(on&&!t){t=document.createElement('div');t.className='fevertxt';t.id='feverTxt';$('scene').appendChild(t)}if(t)t.textContent=on?'FEVER · income ×3 · '+Math.ceil(S.feverUntil-S.t):'';if(!on&&t)t.remove();
  if(on&&!feverWas){SFX.era();jobProgress('fever',1);checkAch()}feverWas=on}

/* ---------- news ticker ---------- */
function ticker(){const lines=CONTENT.NEWS[S.era].concat(CONTENT.TIPS.slice().sort(()=>Math.random()-.5).slice(0,3));$('tickerText').textContent=lines.join('   ·   ')}
function confettiSmall(){const cols=['#f5c400','#27c26a','#2f80ed','#d63af9','#e10600'];for(let i=0;i<18;i++){const c=document.createElement('i');c.className='conf';c.style.left=(30+Math.random()*40)+'%';c.style.background=cols[i%cols.length];c.style.setProperty('--dx',(Math.random()*120-60)+'px');PH.appendChild(c);setTimeout(()=>c.remove(),1900)}}

/* ---------- toasts and achievements ---------- */
let toastTimer=0;function toast(title,text){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');PH.appendChild(t)}
  t.innerHTML=`<b>${esc(title)}</b>${esc(text)}`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),3200)}
const ACH=[['first','Open for business','Buy your first anything',()=>S.owned.flat().some(n=>n>0)],['tap1k','Busy hands','Tap 500 times',()=>S.clicks>=500],['tap10k','Hustler','Tap 3,000 times',()=>S.clicks>=3000],
  ['risk5','Risk aware','Handle 5 risks well',()=>S.events.good>=5],['risk25','Risk manager','Handle 25 risks well',()=>S.events.good>=25],['hundred','Economies of scale','Own 100 of one business',()=>S.owned.flat().some(n=>n>=100)],
  ['tech','Method in the madness','Buy 10 techniques',()=>Object.keys(S.techs).length>=10],['era4','Hard hat era','Reach construction',()=>S.era>=3],['era6','Split the atom','Reach nuclear power',()=>S.era>=5],['era8','Moonwalker','Reach the Moon',()=>S.era>=7],['era10','Star harvester','Reach the Dyson swarm',()=>S.era>=9],['win','Galactic PM','Unite the galaxy',()=>S.done],
  ['fever','Fever pitch','Hit fever mode 10 times',()=>(S.feverCount||0)>=10],['quiz','Teacher\'s pet','Get 10 lesson quizzes right',()=>S.quizzes.right>=10],['calc','Human calculator','Get 10 site math questions right',()=>S.calcs.right>=10],['jobs','Gig economy','Finish 15 side jobs',()=>S.jobsDone>=15],['manual','Read the manual','Fill half the Field Manual',()=>S.manual.length>=21],['advisors','Board of advisors','Meet 6 advisors',()=>(S.advisors||[]).length>=6],['legacy','Serial entrepreneur','Win and start again',()=>(S.legacy||0)>=1],['staff1','Hiring manager','Hire your first staff member',()=>Object.values(S.staff||{}).some(v=>v>0)],['staff6','Full crew','Hire all six staff',()=>E.STAFF.every(st=>E.staffLevel(S,st[0])>0)],['staff18','Dream team','Promote all six to the top level',()=>E.STAFF.every(st=>E.staffLevel(S,st[0])>=3)]];
function checkAch(){for(const a of ACH)if(!S.achievements.includes(a[0])&&a[3]()){S.achievements.push(a[0]);SFX.milestone();toast('Achievement: '+a[1],a[2])}}

/* ---------- save codes ---------- */
function dialog(html){const sh=document.createElement('div');sh.className='sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');sh.style.borderTopColor='var(--era)';sh.innerHTML=html;PH.appendChild(sh);return sh}
function exportSave(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const sh=dialog(`<h2>Your save code</h2><p class="small">Paste it into Load a save code on any device.</p><textarea class="code" rows="5" readonly>${code}</textarea><button class="btn wide" id="cpy">Copy</button> <button class="btn alt wide" id="cls" style="margin-top:6px">Close</button>`);
  const ta=sh.querySelector('textarea');ta.focus();ta.select();sh.querySelector('#cpy').onclick=async()=>{try{await navigator.clipboard.writeText(code);toast('Copied','Keep it somewhere safe.')}catch(e){ta.select()}};sh.querySelector('#cls').onclick=()=>sh.remove()}
function importSave(){const sh=dialog(`<h2>Load a save code</h2><p class="small">This replaces the game on this device.</p><textarea class="code" rows="5" placeholder="Paste the code here"></textarea><button class="btn wide" id="ld">Load it</button> <button class="btn alt wide" id="cls" style="margin-top:6px">Cancel</button>`);
  sh.querySelector('#cls').onclick=()=>sh.remove();sh.querySelector('#ld').onclick=()=>{try{const rec=JSON.parse(decodeURIComponent(escape(atob(sh.querySelector('textarea').value.trim()))));if(!rec.owned)throw 0;S=migrate(rec);save();sh.remove();renderAll();toast('Loaded','Welcome back to era '+(S.era+1)+'.')}catch(e){toast('That code didn\'t work','Nothing was changed.')}}}
function resetGame(skipAsk){const go=()=>{const keep={sound:S.sound};S=Object.assign(DEFAULTS(),keep,{v:SAVE_VERSION});save();document.querySelectorAll('.overlay,.sheet').forEach(x=>x.remove());renderAll();intro()};
  if(skipAsk===true)return go();const sh=dialog(`<h2>Start over?</h2><p>Everything goes back to one lemonade stand. Achievements too.</p><button class="btn wide" id="yes">Start over</button> <button class="btn alt wide" id="no" style="margin-top:6px">Keep playing</button>`);
  sh.querySelector('#no').onclick=()=>sh.remove();sh.querySelector('#yes').onclick=()=>{sh.remove();go()}}

/* ---------- sound toggle ---------- */
function soundBtn(){$('sound').setAttribute('aria-pressed',S.sound);$('sound').setAttribute('aria-label','Sound '+(S.sound?'on':'off'));$('sound').style.opacity=S.sound?1:.45}
$('sound').onclick=()=>{S.sound=!S.sound;soundBtn();save()};

/* ---------- the loop ---------- */
let last=performance.now(),renderClock=0;
function frame(now){const dt=Math.min(1,(now-last)/1000);last=now;
  if(!S.done){E.tick(S,dt);if(!nextEvent)scheduleEvent();if(!nextOpp)scheduleOpp();if(S.t>=nextEvent&&!document.querySelector('.overlay'))showEvent();if(S.t>=nextOpp&&!document.querySelector('.overlay'))showOpp();if(!nextCalc)scheduleCalc();if(S.t>=nextCalc&&!document.querySelector('.overlay'))showCalc()}
  feverFx();if(!S.done)staffTick(dt);renderClock+=dt;if(renderClock>.2){renderClock=0;hud();if(tabNow==='build'||tabNow==='goal'||tabNow==='tech')refreshRows();checkAch()}
  requestAnimationFrame(frame)}
// time away earns a quarter of the idle rate, up to two hours
function welcomeBack(){const away=(Date.now()-(S.savedAt||Date.now()))/1000;if(away<60||S.done)return;const secs=Math.min(away,E.offlineHours(S)*3600),gain=E.baseIps(S)*secs*.25;if(gain<=0)return;
  S.cash+=gain;S.earned+=gain;S.savedAt=Date.now();toast('While you were away','The crew earned '+money(gain)+' in '+clock(secs)+'. They work better when you are here.')}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){welcomeBack();last=performance.now()}else save()});
function intro(){if(S.t>0)return;const o=document.createElement('div');o.className='overlay';o.setAttribute('role','dialog');
  o.innerHTML=`<small>An idle project management game</small><h1>Scope Creep</h1><p>${esc(STORY[0])}</p><p style="font-size:15px">Tap a few times to fill the hustle meter: a full meter doubles everything, and filling it starts fever. Buy things that earn for you. Answer risk cards and site math. Eleven eras from here to the galaxy.</p><button class="btn" id="start">Open the stand →</button>`;
  PH.appendChild(o);$('start').focus();$('start').onclick=()=>{o.remove();SFX.buy()}}
function renderAll(){fillJobs();applyEraColours();drawLand();hud();render();soundBtn();ticker()}
renderAll();welcomeBack();intro();recover();requestAnimationFrame(frame);
window.__game={hire,staffTick,get S(){return S},E,tap,finishCapstone,showEvent,showOpp,showCalc,migrate,claimJob,lessonQuiz};
}
</script>
</body>
</html>
