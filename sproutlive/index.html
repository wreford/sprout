<script type="text/plain" id="steps">
### An empty world
A Sprout game has two blocks. update runs every frame to move things, and draw paints the screen. Lines starting with -- are notes for people. For now draw just fills the sky.
---
-- Sprout: catch the rain, dodge the bugs

update : [dt |
]

draw : [
  clear "#9fd8ff"
]
### Sun and soil
Words like circle and rect take their values one after another: circle x y size colour. Each new line is a new step, painted back to front. W and H are the screen's width and height.
---
-- Sprout: catch the rain, dodge the bugs

update : [dt |
]

draw : [
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"
]
### Plant a sprout
name : value makes a field, and it keeps its value even while you change the code around it. Watch the grey notes in the code: they show each field's value right now.
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2         -- where the sprout stands
height : 40       -- how tall it is

update : [dt |
]

draw : [
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"

  top : H - 40 - height
  rect (x - 3) top 6 height "#3c9d3c"
  circle (x - 9) top 9 "#5cc85c"
  circle (x + 9) top 9 "#5cc85c"
]
### Make it move
:= changes a field. touching [ ... ] runs its block only while your finger is down, and toward slides x part of the way to your finger each frame. Drag on the game, or use the arrow keys.
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2         -- where the sprout stands
height : 40       -- how tall it is

update : [dt |
  touching [x := toward x touch-x 0.2]
  key "left" [x := x - 5]
  key "right" [x := x + 5]
  x := clamp x 20 (W - 20)
]

draw : [
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"

  top : H - 40 - height
  rect (x - 3) top 6 height "#3c9d3c"
  circle (x - 9) top 9 "#5cc85c"
  circle (x + 9) top 9 "#5cc85c"
]
### Make it rain
every 0.6 [ ... ] runs a block on a beat. Each drop is a record, {x : 140, y : -10}, so d.y is how far down it is. Every frame each drop falls, and keep holds on to the ones still in the sky.
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2         -- where the sprout stands
height : 40       -- how tall it is
drops : []        -- falling rain

update : [dt |
  touching [x := toward x touch-x 0.2]
  key "left" [x := x - 5]
  key "right" [x := x + 5]
  x := clamp x 20 (W - 20)

  every 0.6 [
    drops := drops append {x : rand 20 (W - 20), y : -10}
  ]

  speed : 160 * dt
  drops each [d | d.y := d.y + speed]
  drops := keep drops [_.y < H]
]

draw : [
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"

  top : H - 40 - height
  rect (x - 3) top 6 height "#3c9d3c"
  circle (x - 9) top 9 "#5cc85c"
  circle (x + 9) top 9 "#5cc85c"

  drops each [circle _.x _.y 6 "#2f7fe0"]
]
### Catch to grow
dist measures how far a drop is from the tip of the sprout. Close enough and it's caught: the sprout grows, the score goes up and it beeps. "{score} drops" puts the score into the words. Try catching a few!
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2         -- where the sprout stands
height : 40       -- how tall it is
drops : []        -- falling rain
score : 0

update : [dt |
  touching [x := toward x touch-x 0.2]
  key "left" [x := x - 5]
  key "right" [x := x + 5]
  x := clamp x 20 (W - 20)

  every 0.6 [
    drops := drops append {x : rand 20 (W - 20), y : -10}
  ]

  speed : 160 * dt
  top : H - 40 - height
  drops each [d |
    d.y := d.y + speed
    (dist d.x d.y x top) < 24 [(
      d.y := H + 99
      height := clamp (height + 8) 0 (H - 140)
      score := score + 1
      beep 880 0.06
    )]
  ]
  drops := keep drops [_.y < H]
]

draw : [
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"

  top : H - 40 - height
  rect (x - 3) top 6 height "#3c9d3c"
  circle (x - 9) top 9 "#5cc85c"
  circle (x + 9) top 9 "#5cc85c"

  drops each [circle _.x _.y 6 "#2f7fe0"]
  text "{score} drops" (W / 2) 30 22 "#1b3a5c"
]
### Watch out for bugs
Ladybirds fall too. and needs both sides true: a bug near the stem and below the tip makes the sprout shorter and shakes the screen. Growing tall is good, but a tall stem is easier to hit.
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2         -- where the sprout stands
height : 40       -- how tall it is
drops : []        -- falling rain
bugs : []         -- falling ladybirds
score : 0

update : [dt |
  touching [x := toward x touch-x 0.2]
  key "left" [x := x - 5]
  key "right" [x := x + 5]
  x := clamp x 20 (W - 20)

  every 0.6 [
    drops := drops append {x : rand 20 (W - 20), y : -10}
    random < 0.3 [bugs := bugs append {x : rand 20 (W - 20), y : -10}]
  ]

  speed : 160 * dt
  top : H - 40 - height
  drops each [d |
    d.y := d.y + speed
    (dist d.x d.y x top) < 24 [(
      d.y := H + 99
      height := clamp (height + 8) 0 (H - 140)
      score := score + 1
      beep 880 0.06
    )]
  ]
  drops := keep drops [_.y < H]

  bugs each [b |
    b.y := b.y + (speed * 0.8)
    near : (b.x - x) abs < 14
    near and (b.y > top) [(
      b.y := H + 99
      height := height - 30
      shake 12
      beep 110 0.25
    )]
  ]
  bugs := keep bugs [_.y < H]
]

draw : [
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"

  top : H - 40 - height
  rect (x - 3) top 6 height "#3c9d3c"
  circle (x - 9) top 9 "#5cc85c"
  circle (x + 9) top 9 "#5cc85c"

  drops each [circle _.x _.y 6 "#2f7fe0"]
  bugs each [b |
    circle b.x b.y 10 "#d62828"
    circle b.x (b.y - 8) 5 "#222222"
  ]
  text "{score} drops" (W / 2) 30 22 "#1b3a5c"
]
### Wilt and try again
When the sprout gets too short it wilts. pace turns to 0 so everything stops falling, and once it's over and you tap, restart starts again.
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2         -- where the sprout stands
height : 40       -- how tall it is
drops : []        -- falling rain
bugs : []         -- falling ladybirds
score : 0
over : false

update : [dt |
  restart (over and tapped)
  pace : over [0, 1]

  touching [x := toward x touch-x 0.2]
  key "left" [x := x - 5]
  key "right" [x := x + 5]
  x := clamp x 20 (W - 20)

  every 0.6 [
    drops := drops append {x : rand 20 (W - 20), y : -10}
    random < 0.3 [bugs := bugs append {x : rand 20 (W - 20), y : -10}]
  ]

  speed : 160 * dt * pace
  top : H - 40 - height
  drops each [d |
    d.y := d.y + speed
    (dist d.x d.y x top) < 24 [(
      d.y := H + 99
      height := clamp (height + 8) 0 (H - 140)
      score := score + 1
      beep 880 0.06
    )]
  ]
  drops := keep drops [_.y < H]

  bugs each [b |
    b.y := b.y + (speed * 0.8)
    near : (b.x - x) abs < 14
    near and (b.y > top) [(
      b.y := H + 99
      height := height - 30
      shake 12
      beep 110 0.25
    )]
  ]
  bugs := keep bugs [_.y < H]
  over := height < 20
]

draw : [
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"

  top : H - 40 - height
  rect (x - 3) top 6 height "#3c9d3c"
  circle (x - 9) top 9 "#5cc85c"
  circle (x + 9) top 9 "#5cc85c"

  drops each [circle _.x _.y 6 "#2f7fe0"]
  bugs each [b |
    circle b.x b.y 10 "#d62828"
    circle b.x (b.y - 8) 5 "#222222"
  ]
  text "{score} drops" (W / 2) 30 22 "#1b3a5c"

  over [(
    rect 0 0 W H "rgba(0,0,0,0.5)"
    text "Your sprout wilted" (W / 2) (H / 2 - 20) 28 "#ffffff"
    text "Tap to grow again" (W / 2) (H / 2 + 20) 18 "#ffe066"
  )]
]
### Make it feel alive
The rain speeds up as your score climbs, caught drops burst into sparkles, a while loop grows leaves up the stem, clouds drift by on the clock, and wave makes the sun breathe.
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2         -- where the sprout stands
height : 40       -- how tall it is
drops : []        -- falling rain
bugs : []         -- falling ladybirds
sparks : []
score : 0
over : false

update : [dt |
  restart (over and tapped)
  pace : over [0, 1]

  touching [x := toward x touch-x 0.2]
  key "left" [x := x - 5]
  key "right" [x := x + 5]
  x := clamp x 20 (W - 20)

  every 0.6 [
    drops := drops append {x : rand 20 (W - 20), y : -10}
    random < 0.3 [bugs := bugs append {x : rand 20 (W - 20), y : -10}]
  ]

  speed : 160 + (score * 4) * dt * pace
  top : H - 40 - height

<script type="text/plain" id="templates">
### Bounce|🏓
Keep the ball in the air with a paddle.
---
-- Bounce: keep the ball up

paddle : W / 2
ball : {x : W / 2, y : 100, vx : 150, vy : 220}
score : 0
best : 0

update : [dt |
  touching [paddle := toward paddle touch-x 0.4]
  key "left" [paddle := paddle - (400 * dt)]
  key "right" [paddle := paddle + (400 * dt)]
  paddle := clamp paddle 50 (W - 50)

  ball.x := ball.x + (ball.vx * dt)
  ball.y := ball.y + (ball.vy * dt)
  ball.x < 10 [ball.vx := ball.vx abs]
  ball.x > (W - 10) [ball.vx := 0 - (ball.vx abs)]
  ball.y < 10 [ball.vy := ball.vy abs]

  near : (ball.x - paddle) abs < 50
  low : ball.y > (H - 50)
  (ball.vy > 0) and near and low [(
    ball.vy := 0 - (ball.vy * 1.05)
    ball.vx := ball.vx + ((ball.x - paddle) * 3)
    score := score + 1
    beep 660 0.05
  )]

  ball.y > (H + 20) [(
    best := score > best [score, best]
    beep 140 0.3
    ball := {x : W / 2, y : 100, vx : 150, vy : 220}
    score := 0
    shake 10
  )]
]

draw : [
  clear "#1d1b3a"
  rect (paddle - 50) (H - 40) 100 12 "#ffcc33"
  circle ball.x ball.y 10 "#ff5d8f"
  text score (W / 2) 60 48 "#ffffff"
  text "best {best}" (W / 2) 95 16 "#9a94c8"
]
### Blank canvas|✏️
A dot you can drag. Start your own game from here.
---
-- Your game! Change anything and watch it update.

dot : {x : W / 2, y : H / 2}

update : [dt |
  touching [(
    dot.x := touch-x
    dot.y := touch-y
  )]
]

draw : [
  clear "#223344"
  circle dot.x dot.y 30 "#ffaa00"
  text "Drag me!" (W / 2) 40 24 "#ffffff"
]
</script>

const SER={},BARS="▁▂▃▄▅▆▇█";
function spark(a){if(a.length<3)return"";let lo=Infinity,hi=-Infinity;for(const v of a){if(v<lo)lo=v;if(v>hi)hi=v}if(hi-lo<1e-6)return"";
 return a.map(v=>BARS[Math.round((v-lo)/(hi-lo)*7)]).join("")}
function readGhosts(){const o={};if(!cur)return o;let v;try{v=cur.get()}catch(e){return o}
 for(const k in v){const x=v[k],t=ghostText(x);if(t===null)continue;
  const n=typeof x==="number"?x:(Array.isArray(x)||ArrayBuffer.isView(x))?x.length-1:null;
  if(n!==null&&!paused){const a=SER[k]||(SER[k]=[]);a.push(n);if(a.length>24)a.shift()}
  o[k]=[t,n!==null&&SER[k]?spark(SER[k]):""]}
 return o}
const FIELD=/^([A-Za-z_][\w-]*)\s*:(?!=)/;
const ghostLabel=(k,lit)=>{const t=ghosts[k];return t===undefined||(t[0]===lit&&!t[1])?"":"   → "+esc(t[0])+(t[1]?"<b>"+t[1]+"</b>":"")};
function withGhosts(html,src){const hs=html.split("\n"),ls=src.split("\n");
 for(let i=0;i<ls.length&&i<hs.length;i++){const m=ls[i].match(FIELD);if(!m)continue;const k=SL.mangle(m[1]),lit=ls[i].replace(/--.*$/,"").slice(m[0].length).trim();
  hs[i]+='<i class="gh" data-g="'+k+'" data-lit="'+esc(lit).replace(/"/g,"&quot;")+'">'+ghostLabel(k,lit)+"</i>"}
 return hs.join("\n")}
// refresh the values in place, so nothing under your finger gets rebuilt
setInterval(()=>{const gh=readGhosts(),sg=JSON.stringify(gh);if(sg===ghostSig)return;ghosts=gh;ghostSig=sg;
 document.querySelectorAll(".gh[data-g]").forEach(el=>{const t=ghostLabel(el.dataset.g,el.dataset.lit);if(el.innerHTML!==t)el.innerHTML=t})},200);
function render(){renderHL();if(TAB==="tweak")renderTweak()}
function renderHL(){const src=code;let h;
 if(caretAt>=0&&caretAt<=src.length)h=hlHTML(src.slice(0,caretAt))+'<span class="caret"></span>'+hlHTML(src.slice(caretAt));else h=hlHTML(src);
 hl.innerHTML=withGhosts(h,src)+"\n ";const n=src.split("\n").length;let gs="";for(let i=1;i<=n;i++)gs+=i+"\n";gut.textContent=gs;sync()}
function sync(){hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;gut.style.transform="translateY("+(-ta.scrollTop)+"px)";marks()}
ta.addEventListener("scroll",sync);
function markAt(el,line,count){if(!line){el.classList.remove("on");return}el.classList.add("on");el.style.top=(PAD+(line-1)*LH()-ta.scrollTop)+"px";el.style.height=(count||1)*LH()+"px"}
function marks(){markAt($("errl"),err&&!quiet&&TAB!=="watch"?err.line:0)}
function setCode(s,opt={}){if(s!==code)ghostSig="";code=s;caretAt=opt.caret==null?-1:opt.caret;if(ta.value!==s)ta.value=s;render();if(!opt.nosave)queueSave()}
function queueSave(){clearTimeout(saveT);saveT=setTimeout(()=>LS.set("sproutlive.sp2",{code,step:D.step,dirty:D.dirty}),400)}
function goLine(n){const lines=code.split("\n");let p=0;for(let i=0;i<n-1&&i<lines.length;i++)p+=lines[i].length+1;ta.focus();ta.setSelectionRange(p,p);scrollToLine(n,true)}
function scrollToLine(n,center){const y=PAD+(n-1)*LH(),h=ta.clientHeight;if(center||y<ta.scrollTop+LH()||y>ta.scrollTop+h-3*LH())ta.scrollTop=Math.max(0,y-h*.45);sync()}
ta.addEventListener("input",()=>{code=ta.value;caretAt=-1;D.dirty=true;render();queueSave();clearTimeout(compT);compT=setTimeout(()=>compile(code),300)});
function insertText(t){ta.focus();if(!document.execCommand||!document.execCommand("insertText",false,t)){const s=ta.selectionStart,e=ta.selectionEnd;ta.setRangeText(t,s,e,"end");ta.dispatchEvent(new Event("input"))}}
ta.addEventListener("keydown",e=>{
 if(e.key==="Tab"){e.preventDefault();insertText("  ")}
 else if(e.key==="Enter"&&!e.isComposing){const s=ta.selectionStart,before=ta.value.slice(0,s),line=before.slice(before.lastIndexOf("\n")+1);let ind=line.match(/^\s*/)[0];if(/[[(|]\s*$/.test(line.replace(/--.*$/,"")))ind+="  ";e.preventDefault();insertText("\n"+ind)}});
ta.addEventListener("focus",()=>setTimeout(vv,300));ta.addEventListener("blur",()=>setTimeout(vv,300));
const KEYBAR=[":=",":","[","]","(",")","{","}",".","_","|",'"',",","+","-","*","/","<",">","--","⇥"];
$("keys").innerHTML=KEYBAR.map(k=>'<button data-k="'+esc(k)+'">'+esc(k)+"</button>").join("");
$("keys").addEventListener("pointerdown",e=>{const b=e.target.closest("button");if(!b)return;e.preventDefault();const k=b.dataset.k;insertText(k==="⇥"?"  ":k===":="||k===":"?" "+k+" ":k)});

// ---------- tweak view: drag numbers, tap colours
function tweakHTML(src){return lex(src).map(t=>{
 if(t.t==="num")return'<i class="n tn" data-i="'+t.i+'" data-v="'+t.s+'">'+t.s+"</i>";
 if(t.t==="str"&&/^"#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?"$/.test(t.s)){const c=t.s.slice(1,-1);return'<i class="s tc" data-i="'+t.i+'" data-v="'+esc(t.s)+'" style="--c:'+c+'"><u></u>'+esc(t.s)+"</i>"}
 return tokHTML(t)}).join("")}
function renderTweak(){if(drag)return;const st=tw.scrollTop;tw.innerHTML=withGhosts(tweakHTML(code),code)+"\n";tw.scrollTop=st}
let drag=null;
tw.addEventListener("pointerdown",e=>{const el=e.target.closest(".tn");if(!el)return;e.preventDefault();audio();
 const txt=el.dataset.v,dec=(txt.split(".")[1]||"").length;drag={el,i:+el.dataset.i,len:txt.length,v0:parseFloat(txt),dec,x0:e.clientX,moved:false,id:e.pointerId};
 try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add("drag")});
tw.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x0;if(Math.abs(dx)>3)drag.moved=true;if(!drag.moved)return;
 const step=drag.dec?Math.pow(10,-drag.dec):(Math.abs(drag.v0)>=100?2:1);const v=drag.v0+Math.round(dx/5)*step;const s=drag.dec?v.toFixed(drag.dec):String(Math.round(v));
 if(s===drag.el.textContent)return;code=code.slice(0,drag.i)+s+code.slice(drag.i+drag.len);drag.len=s.length;drag.el.textContent=s;ta.value=code;D.dirty=true;compile(code)});
const endDrag=()=>{if(!drag)return;const d=drag;drag=null;d.el.classList.remove("drag");if(!d.moved)toast("Drag left or right to change it");setCode(code)};
tw.addEventListener("pointerup",endDrag);tw.addEventListener("pointercancel",endDrag);
let picking=null;
tw.addEventListener("click",e=>{const el=e.target.closest(".tc");if(!el)return;let c=el.dataset.v.slice(1,-1);if(c.length===4)c="#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
 picking={i:+el.dataset.i,len:el.dataset.v.length};const pk=$("pick");pk.value=c.toLowerCase();pk.click()});
$("pick").addEventListener("input",e=>{if(!picking)return;const s='"'+e.target.value+'"';code=code.slice(0,picking.i)+s+code.slice(picking.i+picking.len);picking.len=s.length;D.dirty=true;setCode(code);compile(code)});

// ---------- tabs
let TAB="watch";
function tab(t){if(TAB===t)return;if(t!=="watch"&&D.playing)demoStop();TAB=t;document.body.className="t-"+t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 ta.readOnly=t!=="code";if(t!=="code")ta.blur();caretAt=-1;render();quiet=false;setErr(err);
 if(t==="code"&&!code.trim())toast("Type some Sprout, or pick a game from Games");vv()}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.t));

// ---------- the demo: types each step as a line diff from whatever is on screen now
const D={step:-1,playing:false,speed:1,token:0,dirty:false};
function diffLines(a,b){const n=a.length,m=b.length,L=[];for(let i=0;i<=n;i++)L.push(new Uint16Array(m+1));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 const ops=[];let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ops.push(["=",a[i]]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){ops.push(["-",a[i]]);i++}else{ops.push(["+",b[j]]);j++}}
 while(i<n)ops.push(["-",a[i++]]);while(j<m)ops.push(["+",b[j++]]);return ops}
const posOf=(lines,li,col)=>{let p=0;for(let i=0;i<li;i++)p+=lines[i].length+1;return p+col};
async function typeTo(target,tok){
 const ops=diffLines(code.replace(/\n$/,"").split("\n"),target.replace(/\n$/,"").split("\n"));const lines=code.replace(/\n$/,"").split("\n");if(lines.length===1&&lines[0]==="")lines.length=0;let p=0;
 const alive=()=>tok===D.token;const wait=ms=>sleep(ms/D.speed);
 for(let k=0;k<ops.length;k++){if(!alive())return false;const [op,line]=ops[k];
  if(op==="="){p++;continue}
  if(op==="-"){let m=k;while(m<ops.length&&ops[m][0]==="-")m++;const cnt=m-k;scrollToLine(p+1);markAt($("flash"),p+1,cnt);await wait(380);if(!alive()){markAt($("flash"),0);return false}
   lines.splice(p,cnt);markAt($("flash"),0);setCode(lines.join("\n")+"\n",{caret:posOf(lines,Math.min(p,lines.length),0)});k=m-1;continue}
  const ind=line.match(/^\s*/)[0];lines.splice(p,0,ind);scrollToLine(p+1);markAt($("cur"),p+1);
  for(let c=ind.length;c<=line.length;c++){if(!alive())return false;lines[p]=line.slice(0,c);setCode(lines.join("\n")+"\n",{caret:posOf(lines,p,c),nosave:true});markAt($("cur"),p+1);
   const ch=line[c-1]||"";await wait(ch===" "?14:/[\]\[()]/.test(ch)?70:22+Math.random()*26)}
  p++;{const src=lines.join("\n")+"\n";if(!SL.bracketLine(src))compile(src,true)}await wait(90)}
 markAt($("cur"),0);setCode(target);return true}
const INTRO="Press play to watch a little game get written in Sprout, one line at a time. It runs the whole time, so you can see what each line does.";
function capUI(){const n=STEPS.length;const st=STEPS[Math.max(0,Math.min(n-1,D.playing?D.step+1:Math.max(D.step,0)))];
 if(D.step<0&&!D.playing){$("capn").textContent="Demo";$("capt").textContent="Sprout, from nothing";$("capx").textContent=INTRO}
 else{$("capn").textContent="Step "+Math.min(n,D.playing?D.step+2:D.step+1)+" of "+n;$("capt").textContent=st.title;$("capx").textContent=st.say}
 $("dots").innerHTML=STEPS.map((_,i)=>'<i class="'+(i<=D.step?"done":"")+(D.playing&&i===D.step+1?" now":"")+'"></i>').join("");
 $("dPlay").textContent=D.playing?"⏸ Pause":D.step>=n-1?"↺ Watch again":D.step<0?"▶ Play":"▶ Keep going";$("dSpd").textContent=D.speed+"×";
 $("hello").classList.toggle("off",!!code.trim()||D.playing)}
function demoStop(){D.token++;D.playing=false;quiet=false;markAt($("cur"),0);markAt($("flash"),0);caretAt=-1;render();setErr(err);capUI()}
async function demoPlay(){
 if(D.step>=STEPS.length-1){demoReset()}
 if(D.dirty&&code.trim()){if(!confirm("The demo will type over your changes. Keep going?"))return;LS.set("sproutlive.backup",code)}
 D.dirty=false;tab("watch");D.playing=true;quiet=true;setErr(null);const tok=++D.token;capUI();
 while(D.step<STEPS.length-1){const next=D.step+1;capUI();const ok=await typeTo(STEPS[next].code,tok);if(!ok||tok!==D.token)return;
  D.step=next;compile(code,true);queueSave();capUI();if(D.step<STEPS.length-1){await sleep(1800/D.speed);if(tok!==D.token)return}}
 D.playing=false;quiet=false;caretAt=-1;render();compile(code);capUI();toast("Done! Try the Tweak tab next")}
function demoReset(){histClear();D.token++;D.playing=false;D.step=-1;cur=null;good=null;setErr(null);setCode("");capUI()}
function demoJump(i){const was=D.playing;D.token++;D.playing=false;quiet=false;D.dirty=false;markAt($("cur"),0);markAt($("flash"),0);
 if(i<0){demoReset();return}D.step=i;setCode(STEPS[i].code);cur=null;compile(code);capUI();if(was)demoPlay()}
$("dPlay").onclick=()=>{audio();D.playing?demoStop():demoPlay()};
$("dSkip").onclick=()=>{if(D.step<STEPS.length-1)demoJump(D.step+1)};
$("dBack").onclick=()=>demoJump(D.playing?D.step:D.step-1);
$("dSpd").onclick=()=>{D.speed=D.speed===1?2:D.speed===2?4:1;capUI()};
$("bHello").onclick=()=>{audio();demoPlay()};

// ---------- games, help, share
function sheet(html){$("sbox").innerHTML=html;$("sheet").classList.add("on")}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet"||e.target.closest("[data-close]"))$("sheet").classList.remove("on")});
function loadGame(src,msg){histClear();if(D.playing)demoStop();if(code.trim()&&D.dirty)LS.set("sproutlive.backup",code);D.step=-2;D.dirty=false;cur=null;good=null;setCode(src);compile(src);capUI();$("sheet").classList.remove("on");if(TAB==="watch")tab("tweak");toast(msg)}
$("bGames").onclick=()=>{const bk=LS.get("sproutlive.backup",null);
 sheet('<h2>Games to remix</h2><button class="gm" data-g="demo"><span class="e">🌱</span><span><b>Watch Sprout grow</b><small>The demo: a game written live in Sprout, step by step.</small></span></button>'+
 '<button class="gm" data-g="sprout"><span class="e">🌧️</span><span><b>Sprout, finished</b><small>The demo game, ready to change.</small></span></button>'+
 TEMPL.map((t,i)=>'<button class="gm" data-g="'+i+'"><span class="e">'+t.icon+"</span><span><b>"+esc(t.title)+"</b><small>"+esc(t.say)+"</small></span></button>").join("")+
 (bk?'<button class="gm" data-g="backup"><span class="e">↩️</span><span><b>Bring back my last code</b><small>What you had before you last switched games.</small></span></button>':"")+'<button class="hb" data-close style="width:100%">Close</button>');
 $("sbox").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const k=b.dataset.g;
  if(k==="demo"){$("sheet").classList.remove("on");if(code.trim()&&D.dirty)LS.set("sproutlive.backup",code);D.dirty=false;demoReset();demoPlay()}
  else if(k==="sprout")loadGame(STEPS[STEPS.length-1].code,"Sprout is yours to change");
  else if(k==="backup")loadGame(bk,"Your code is back");
  else loadGame(TEMPL[+k].code,TEMPL[+k].title+" loaded")})};
const REF_LANG=[["x : 10","makes a field called x. It keeps its value while you edit the rest of the code; change the 10 itself and the new value takes over."],["x := x + 1","changes x."],["2 + 3 * 4","is 20. Sprout reads maths left to right, with no precedence. Use ( ) to group."],
 ["a > b [yes, no]","true picks the first, false picks the second. Wrap several lines in ( ) to run them together."],["touching [ ... ]","with just one block, it runs only when the test is true."],
 ["(a > 1) and (b < 2)","both must be true. Also or, and x not flips true and false."],["[a, b | a + b]","a block with inputs a and b."],["[ ... ]","a block. Each new line is a new step."],["[1, 2, 3]","a list. Commas separate list items."],
 ["p : {x : 1, y : 2}","a record. p.x reads a field and p.x := 5 changes it. In each, _.x is the item's x."],
 ["xs 2","the second item of a list. xs 2 := 9 changes it."],["xs append {x : 4}","a new list with one more item on the end."],["xs each [ ... ]","runs for every item. _ is the item."],
 ["5 times [ ... ]","runs 5 times. _ counts 1 to 5."],["xs each [d | ... ]","you can also name the item."],["while [test] [ ... ]","keeps going while the test is true."],["\"{score} drops\"","puts a value into words. Any code can go inside { }."],["\"Hi \" ++ name","joins words. n str turns a number into words."],["-- a note","is for people, Sprout skips it."]];
const REF_GAME=[["update : [dt | ... ]","runs every frame. dt is the seconds since the last one."],["draw : [| ... ]","paints the screen every frame."],["W, H","the screen's width (360) and height (480)."],["every 0.5 [ ... ]","runs the block every half second."],["clock","seconds since the game started."],
 ["clear colour","fills the screen."],["rect x y w h colour","a box from its top-left corner."],["circle x y r colour","a circle around x, y."],["line x1 y1 x2 y2 colour","a line."],["text words x y size colour","words centred on x, y."],
 ["touch-x, touch-y","where your finger or mouse is."],["touching, tapped","true while pressed, and on the frame you tap."],["key \"left\"","true while held. Also \"right\", \"up\", \"down\", \"space\" or a letter."],
 ["rand 1 10, random","a random number between 1 and 10, or between 0 and 1."],["dist x1 y1 x2 y2","how far apart two points are."],["clamp v lo hi","keeps v between lo and hi."],["keep xs [test]","only the items that pass the test."],
 ["wave 2","glides from -1 to 1 and back every 2 seconds. Great for bobbing and pulsing."],["toward x goal 0.2","moves x a fifth of the way to goal. Use it every frame for smooth following."],
 ["mix \"#ff0000\" \"#0000ff\" 0.5","a colour part way between two others."],["shake 8","shakes the screen. Bigger numbers shake harder."],
 ["beep pitch seconds","a short sound. 440 is a middle note."],["restart yes","starts the game over when yes is true."],["x print","shows x at the top of the game."]];
const refList=l=>"<dl>"+l.map(([a,b])=>"<dt><code>"+esc(a)+"</code></dt><dd>"+esc(b)+"</dd>").join("")+"</dl>";
$("bHelp").onclick=()=>sheet('<h2>Sprout, for games</h2><div class="ref"><p>This is Sprout 2.0. Your code runs while you write it: change something and the game updates right away, keeping the score and positions it already has.</p><h3>The language</h3>'+refList(REF_LANG)+'<h3>Game words</h3>'+refList(REF_GAME)+'<p>Grey notes after a field show its value right now, with a little graph of the last few seconds.</p><p>Press ⏸ to pause, then drag the rewind bar to go back up to 10 seconds. Change the code while paused and press ▶: the game plays on from that moment with your new code.</p><p>If something breaks, the last version that worked keeps running and the red bar shows the line to fix. Tap it to jump there.</p></div><button class="hb" data-close style="width:100%">Got it</button>');
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))));
$("bShare").onclick=async()=>{if(!code.trim()){toast("Nothing to share yet");return}const url=location.origin+location.pathname+"#sp="+b64e(code);
 if(navigator.share){try{await navigator.share({title:"My Sprout game",url});return}catch(e){if(e&&e.name==="AbortError")return}}
 try{await navigator.clipboard.writeText(url);toast("Link copied. Anyone who opens it gets your code.")}catch(e){prompt("Copy this link:",url)}};

// ---------- start
(function boot(){let loaded=false;
 const m=location.hash.match(/^#sp=([\w-]+)/);
 if(m){try{const src=b64d(m[1]);history.replaceState(null,"",location.pathname);setCode(src);compile(src);D.step=-2;tab("code");toast("Someone shared this game with you");loaded=true}catch(e){}}
 if(!loaded){const sv=LS.get("sproutlive.sp2",null);
  if(sv&&sv.code&&sv.code.trim()){D.step=typeof sv.step==="number"?sv.step:-2;D.dirty=!!sv.dirty;setCode(sv.code,{nosave:true});compile(sv.code);if(D.step<0||D.dirty)tab("tweak")}
  else setCode("",{nosave:true})}
 $("capx").textContent=INTRO;capUI();fit()})();
</script>
