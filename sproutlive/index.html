<script type="text/plain" id="steps">
### An empty world
A Sprout game has two blocks. update runs every frame to move things, and draw paints the screen. Lines starting with -- are notes for people. For now draw just fills the sky.
---
-- Sprout: catch the rain, dodge the bugs

update : [dt |
]

draw : [|
  clear "#9fd8ff"
]
### Sun and soil
Words like circle and rect take their values one after another: circle x y size colour. Things are painted in order, back to front. W and H are the width and height of the screen.
---
-- Sprout: catch the rain, dodge the bugs

update : [dt |
]

draw : [|
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"
]
### Plant a sprout
name : value makes a field. x is where the sprout stands and height is how tall it is. Sprout reads maths left to right with no precedence, so H - 40 - height is worked out in order, and ( ) groups things.
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2        -- where the sprout stands
height : 40      -- how tall it is

update : [dt |
]

draw : [|
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"

  top : H - 40 - height
  rect (x - 3) top 6 height "#3c9d3c"
  circle (x - 9) top 9 "#5cc85c"
  circle (x + 9) top 9 "#5cc85c"
]
### Make it move
:= changes a field. A true or false picks from a pair: touching [this, that] runs the first one while your finger is down. Drag on the game, or use the arrow keys.
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2        -- where the sprout stands
height : 40      -- how tall it is

update : [dt |
  touching [x := x + ((touch-x - x) * 0.2), 0]
  key "left" [x := x - 5, 0]
  key "right" [x := x + 5, 0]
  x := clamp x 20 (W - 20)
]

draw : [|
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"

  top : H - 40 - height
  rect (x - 3) top 6 height "#3c9d3c"
  circle (x - 9) top 9 "#5cc85c"
  circle (x + 9) top 9 "#5cc85c"
]
### Make it rain
drops is a list, and each drop is a little list [x, y], so _ 2 is a drop's y. Every frame each drop falls, and keep holds on to only the drops still above the ground.
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2        -- where the sprout stands
height : 40      -- how tall it is
drops : []       -- falling rain, each one [x, y]
timer : 0

update : [dt |
  touching [x := x + ((touch-x - x) * 0.2), 0]
  key "left" [x := x - 5, 0]
  key "right" [x := x + 5, 0]
  x := clamp x 20 (W - 20)

  timer := timer - dt
  timer < 0 [(
    timer := 0.6
    drops := drops append [rand 20 (W - 20), -10]
  ), 0]

  speed : 160 * dt
  drops each [_ 2 := (_ 2) + speed]
  drops := keep drops [(_ 2) < H]
]

draw : [|
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"

  top : H - 40 - height
  rect (x - 3) top 6 height "#3c9d3c"
  circle (x - 9) top 9 "#5cc85c"
  circle (x + 9) top 9 "#5cc85c"

  drops each [circle (_ 1) (_ 2) 6 "#2f7fe0"]
]
### Catch to grow
dist measures how far a drop is from the tip of the sprout. Close enough and it's caught: the sprout grows, the score goes up and it beeps. Try catching a few!
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2        -- where the sprout stands
height : 40      -- how tall it is
drops : []       -- falling rain, each one [x, y]
timer : 0
score : 0

update : [dt |
  touching [x := x + ((touch-x - x) * 0.2), 0]
  key "left" [x := x - 5, 0]
  key "right" [x := x + 5, 0]
  x := clamp x 20 (W - 20)

  timer := timer - dt
  timer < 0 [(
    timer := 0.6
    drops := drops append [rand 20 (W - 20), -10]
  ), 0]

  speed : 160 * dt
  top : H - 40 - height
  drops each [
    _ 2 := (_ 2) + speed
    (dist (_ 1) (_ 2) x top) < 24 [(
      _ 2 := H + 99
      height := clamp (height + 8) 0 (H - 140)
      score := score + 1
      beep 880 0.06
    ), 0]
  ]
  drops := keep drops [(_ 2) < H]
]

draw : [|
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"

  top : H - 40 - height
  rect (x - 3) top 6 height "#3c9d3c"
  circle (x - 9) top 9 "#5cc85c"
  circle (x + 9) top 9 "#5cc85c"

  drops each [circle (_ 1) (_ 2) 6 "#2f7fe0"]
  text ((score str) ++ " drops") (W / 2) 30 22 "#1b3a5c"
]
### Watch out for bugs
Ladybirds fall too. If one is near the stem and below the tip, the sprout gets shorter. Growing tall is good, but a tall stem is easier to hit.
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2        -- where the sprout stands
height : 40      -- how tall it is
drops : []       -- falling rain, each one [x, y]
bugs : []        -- falling ladybirds, [x, y]
timer : 0
score : 0

update : [dt |
  touching [x := x + ((touch-x - x) * 0.2), 0]
  key "left" [x := x - 5, 0]
  key "right" [x := x + 5, 0]
  x := clamp x 20 (W - 20)

  timer := timer - dt
  timer < 0 [(
    timer := 0.6
    drops := drops append [rand 20 (W - 20), -10]
    random < 0.3 [bugs := bugs append [rand 20 (W - 20), -10], 0]
  ), 0]

  speed : 160 * dt
  top : H - 40 - height
  drops each [
    _ 2 := (_ 2) + speed
    (dist (_ 1) (_ 2) x top) < 24 [(
      _ 2 := H + 99
      height := clamp (height + 8) 0 (H - 140)
      score := score + 1
      beep 880 0.06
    ), 0]
  ]
  drops := keep drops [(_ 2) < H]

  bugs each [
    _ 2 := (_ 2) + (speed * 0.8)
    near : ((_ 1) - x) abs < 14
    near [(_ 2) > top [(
      _ 2 := H + 99
      height := height - 30
      beep 110 0.25
    ), 0], 0]
  ]
  bugs := keep bugs [(_ 2) < H]
]

draw : [|
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"

  top : H - 40 - height
  rect (x - 3) top 6 height "#3c9d3c"
  circle (x - 9) top 9 "#5cc85c"
  circle (x + 9) top 9 "#5cc85c"

  drops each [circle (_ 1) (_ 2) 6 "#2f7fe0"]
  bugs each [
    circle (_ 1) (_ 2) 10 "#d62828"
    circle (_ 1) ((_ 2) - 8) 5 "#222222"
  ]
  text ((score str) ++ " drops") (W / 2) 30 22 "#1b3a5c"
]
### Wilt and try again
When the sprout gets too short it wilts. pace turns to 0 so everything stops falling, and restart starts the game again when you tap.
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2        -- where the sprout stands
height : 40      -- how tall it is
drops : []       -- falling rain, each one [x, y]
bugs : []        -- falling ladybirds, [x, y]
timer : 0
score : 0
over : false

update : [dt |
  restart (over [tapped, false])
  pace : over [0, 1]

  touching [x := x + ((touch-x - x) * 0.2), 0]
  key "left" [x := x - 5, 0]
  key "right" [x := x + 5, 0]
  x := clamp x 20 (W - 20)

  timer := timer - dt
  timer < 0 [(
    timer := 0.6
    drops := drops append [rand 20 (W - 20), -10]
    random < 0.3 [bugs := bugs append [rand 20 (W - 20), -10], 0]
  ), 0]

  speed : 160 * dt * pace
  top : H - 40 - height
  drops each [
    _ 2 := (_ 2) + speed
    (dist (_ 1) (_ 2) x top) < 24 [(
      _ 2 := H + 99
      height := clamp (height + 8) 0 (H - 140)
      score := score + 1
      beep 880 0.06
    ), 0]
  ]
  drops := keep drops [(_ 2) < H]

  bugs each [
    _ 2 := (_ 2) + (speed * 0.8)
    near : ((_ 1) - x) abs < 14
    near [(_ 2) > top [(
      _ 2 := H + 99
      height := height - 30
      beep 110 0.25
    ), 0], 0]
  ]
  bugs := keep bugs [(_ 2) < H]
  over := height < 20
]

draw : [|
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"

  top : H - 40 - height
  rect (x - 3) top 6 height "#3c9d3c"
  circle (x - 9) top 9 "#5cc85c"
  circle (x + 9) top 9 "#5cc85c"

  drops each [circle (_ 1) (_ 2) 6 "#2f7fe0"]
  bugs each [
    circle (_ 1) (_ 2) 10 "#d62828"
    circle (_ 1) ((_ 2) - 8) 5 "#222222"
  ]
  text ((score str) ++ " drops") (W / 2) 30 22 "#1b3a5c"

  over [(
    rect 0 0 W H "rgba(0,0,0,0.5)"
    text "Your sprout wilted" (W / 2) (H / 2 - 20) 28 "#ffffff"
    text "Tap to grow again" (W / 2) (H / 2 + 20) 18 "#ffe066"
  ), 0]
]
### Make it feel alive
Last touches: the rain speeds up as your score climbs, caught drops burst into sparkles, and a while loop grows leaves up the stem. Now it's your turn: open Tweak and drag the numbers.
---
-- Sprout: catch the rain, dodge the bugs

x : W / 2        -- where the sprout stands
height : 40      -- how tall it is
drops : []       -- falling rain, each one [x, y]
bugs : []        -- falling ladybirds, [x, y]
sparks : []      -- [x, y, speed-x, speed-y, life]
timer : 0
score : 0
over : false

update : [dt |
  restart (over [tapped, false])
  pace : over [0, 1]

  touching [x := x + ((touch-x - x) * 0.2), 0]
  key "left" [x := x - 5, 0]
  key "right" [x := x + 5, 0]
  x := clamp x 20 (W - 20)

  timer := timer - dt
  timer < 0 [(
    timer := 0.6
    drops := drops append [rand 20 (W - 20), -10]
    random < 0.3 [bugs := bugs append [rand 20 (W - 20), -10], 0]
  ), 0]

  speed : 160 + (score * 4) * dt * pace
  top : H - 40 - height
  drops each [
    _ 2 := (_ 2) + speed
    (dist (_ 1) (_ 2) x top) < 24 [(
      px : _ 1
      py : _ 2
      3 times [sparks := sparks append [px, py, rand -80 80, rand -120 0, 0.5]]
      _ 2 := H + 99
      height := clamp (height + 8) 0 (H - 140)
      score := score + 1
      beep 880 0.06
    ), 0]
  ]
  drops := keep drops [(_ 2) < H]

  bugs each [
    _ 2 := (_ 2) + (speed * 0.8)
    near : ((_ 1) - x) abs < 14
    near [(_ 2) > top [(
      _ 2 := H + 99
      height := height - 30
      beep 110 0.25
    ), 0], 0]
  ]
  bugs := keep bugs [(_ 2) < H]
  over := height < 20

  sparks each [
    _ 1 := (_ 1) + ((_ 3) * dt)
    _ 2 := (_ 2) + ((_ 4) * dt)
    _ 5 := (_ 5) - dt
  ]
  sparks := keep sparks [(_ 5) > 0]
]

draw : [|
  clear "#9fd8ff"
  circle 300 70 34 "#ffe066"
  rect 0 (H - 40) W 40 "#7a4b2a"

  top : H - 40 - height
  rect (x - 3) top 6 height "#3c9d3c"
  leaf : H - 60
  side : 1
  while [leaf > (top + 20)] [
    circle (x + (side * 8)) leaf 6 "#4fb04f"

  ]
  circle (x - 9) top 9 "#5cc85c"

  over [(

<script type="text/plain" id="templates">
### Bounce|🏓
Keep the ball in the air with a paddle.
---
-- Bounce: keep the ball up

px : W / 2       -- paddle position
bx : W / 2       -- ball position
by : 100
vx : 150         -- ball speed
vy : 220
score : 0
best : 0

update : [dt |
  touching [px := touch-x, 0]
  key "left" [px := px - (400 * dt), 0]
  key "right" [px := px + (400 * dt), 0]
  px := clamp px 50 (W - 50)

  bx := bx + (vx * dt)
  by := by + (vy * dt)
  bx < 10 [vx := vx abs, 0]
  bx > (W - 10) [vx := 0 - (vx abs), 0]
  by < 10 [vy := vy abs, 0]

  near : ((bx - px) abs) < 50
  low : by > (H - 50)
  vy > 0 [near [low [(
    vy := 0 - (vy * 1.05)
    vx := vx + ((bx - px) * 3)
    score := score + 1
    beep 660 0.05
  ), 0], 0], 0]

  by > (H + 20) [(
    best := score > best [score, best]
    beep 140 0.3
    bx := W / 2
    by := 100
    vx := 150
    vy := 220
    score := 0
  ), 0]
]

draw : [|
  clear "#1d1b3a"
  rect (px - 50) (H - 40) 100 12 "#ffcc33"
  circle bx by 10 "#ff5d8f"
  text score (W / 2) 60 48 "#ffffff"
  text ("best " ++ (best str)) (W / 2) 95 16 "#9a94c8"
]
### Blank canvas|✏️
A dot you can drag. Start your own game from here.
---
-- Your game! Change anything and watch it update.

x : W / 2
y : H / 2

update : [dt |
  touching [(
    x := touch-x
    y := touch-y
  ), 0]
]

draw : [|
  clear "#223344"
  circle x y 30 "#ffaa00"
  text "Drag me!" (W / 2) 40 24 "#ffffff"
]
</script>

function capUI(){const n=STEPS.length;const st=STEPS[Math.max(0,Math.min(n-1,D.playing?D.step+1:Math.max(D.step,0)))];
 if(D.step<0&&!D.playing){$("capn").textContent="Demo";$("capt").textContent="Sprout, from nothing";$("capx").textContent=INTRO}
 else{$("capn").textContent="Step "+Math.min(n,D.playing?D.step+2:D.step+1)+" of "+n;$("capt").textContent=st.title;$("capx").textContent=st.say}
 $("dots").innerHTML=STEPS.map((_,i)=>'<i class="'+(i<=D.step?"done":"")+(D.playing&&i===D.step+1?" now":"")+'"></i>').join("");
 $("dPlay").textContent=D.playing?"⏸ Pause":D.step>=n-1?"↺ Watch again":D.step<0?"▶ Play":"▶ Keep going";$("dSpd").textContent=D.speed+"×";
 $("hello").classList.toggle("off",!!code.trim()||D.playing)}
function demoStop(){D.token++;D.playing=false;quiet=false;markAt($("cur"),0);markAt($("flash"),0);caretAt=-1;render();setErr(err);capUI()}
async function demoPlay(){
 if(D.step>=STEPS.length-1){demoReset()}
 if(D.dirty&&code.trim()){if(!confirm("The demo will type over your changes. Keep going?"))return;LS.set("sproutlive.backup",code)}
 D.dirty=false;tab("watch");D.playing=true;quiet=true;setErr(null);const tok=++D.token;capUI();
 while(D.step<STEPS.length-1){const next=D.step+1;capUI();const ok=await typeTo(STEPS[next].code,tok);if(!ok||tok!==D.token)return;
  D.step=next;compile(code,true);queueSave();capUI();if(D.step<STEPS.length-1){await sleep(1800/D.speed);if(tok!==D.token)return}}
 D.playing=false;quiet=false;caretAt=-1;render();compile(code);capUI();toast("Done! Try the Tweak tab next")}
function demoReset(){D.token++;D.playing=false;D.step=-1;cur=null;good=null;setErr(null);setCode("");capUI()}
function demoJump(i){const was=D.playing;D.token++;D.playing=false;quiet=false;D.dirty=false;markAt($("cur"),0);markAt($("flash"),0);
 if(i<0){demoReset();return}D.step=i;setCode(STEPS[i].code);cur=null;compile(code);capUI();if(was)demoPlay()}
$("dPlay").onclick=()=>{audio();D.playing?demoStop():demoPlay()};
$("dSkip").onclick=()=>{if(D.step<STEPS.length-1)demoJump(D.step+1)};
$("dBack").onclick=()=>demoJump(D.playing?D.step:D.step-1);
$("dSpd").onclick=()=>{D.speed=D.speed===1?2:D.speed===2?4:1;capUI()};
$("bHello").onclick=()=>{audio();demoPlay()};

// ---------- games, help, share
function sheet(html){$("sbox").innerHTML=html;$("sheet").classList.add("on")}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet"||e.target.closest("[data-close]"))$("sheet").classList.remove("on")});
function loadGame(src,msg){if(D.playing)demoStop();if(code.trim()&&D.dirty)LS.set("sproutlive.backup",code);D.step=-2;D.dirty=false;cur=null;good=null;setCode(src);compile(src);capUI();$("sheet").classList.remove("on");if(TAB==="watch")tab("tweak");toast(msg)}
$("bGames").onclick=()=>{const bk=LS.get("sproutlive.backup",null);
 sheet('<h2>Games to remix</h2><button class="gm" data-g="demo"><span class="e">🌱</span><span><b>Watch Sprout grow</b><small>The demo: a game written live in Sprout, step by step.</small></span></button>'+
 '<button class="gm" data-g="sprout"><span class="e">🌧️</span><span><b>Sprout, finished</b><small>The demo game, ready to change.</small></span></button>'+
 TEMPL.map((t,i)=>'<button class="gm" data-g="'+i+'"><span class="e">'+t.icon+"</span><span><b>"+esc(t.title)+"</b><small>"+esc(t.say)+"</small></span></button>").join("")+
 (bk?'<button class="gm" data-g="backup"><span class="e">↩️</span><span><b>Bring back my last code</b><small>What you had before you last switched games.</small></span></button>':"")+'<button class="hb" data-close style="width:100%">Close</button>');
 $("sbox").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const k=b.dataset.g;
  if(k==="demo"){$("sheet").classList.remove("on");if(code.trim()&&D.dirty)LS.set("sproutlive.backup",code);D.dirty=false;demoReset();demoPlay()}
  else if(k==="sprout")loadGame(STEPS[STEPS.length-1].code,"Sprout is yours to change");
  else if(k==="backup")loadGame(bk,"Your code is back");
  else loadGame(TEMPL[+k].code,TEMPL[+k].title+" loaded")})};
const REF_LANG=[["x : 10","makes a field called x."],["x := x + 1","changes x."],["2 + 3 * 4","is 20. Sprout reads maths left to right, with no precedence. Use ( ) to group."],
 ["a > b [yes, no]","true picks the first, false picks the second. Wrap several lines in ( ) to run them together."],["[a, b | a + b]","a block with inputs a and b."],["[| ... ]","a block with no inputs."],
 ["xs : [1, 2, 3]","a list. xs 2 is its second item, and xs 2 := 9 changes it."],["xs append [4, 5]","a new list with one more item, here the pair [4, 5]."],["xs each [ ... ]","runs for every item. _ is the item."],
 ["5 times [ ... ]","runs 5 times. _ counts 1 to 5."],["while [test] [ ... ]","keeps going while the test is true."],["\"Hi \" ++ (n str)","joins words. str turns a number into words."],["-- a note","is for people, Sprout skips it."]];
const REF_GAME=[["update : [dt | ... ]","runs every frame. dt is the seconds since the last one."],["draw : [| ... ]","paints the screen every frame."],["W, H","the screen's width (360) and height (480)."],
 ["clear colour","fills the screen."],["rect x y w h colour","a box from its top-left corner."],["circle x y r colour","a circle around x, y."],["line x1 y1 x2 y2 colour","a line."],["text words x y size colour","words centred on x, y."],
 ["touch-x, touch-y","where your finger or mouse is."],["touching, tapped","true while pressed, and on the frame you tap."],["key \"left\"","true while held. Also \"right\", \"up\", \"down\", \"space\" or a letter."],
 ["rand 1 10, random","a random number between 1 and 10, or between 0 and 1."],["dist x1 y1 x2 y2","how far apart two points are."],["clamp v lo hi","keeps v between lo and hi."],["keep xs [test]","only the items that pass the test."],
 ["beep pitch seconds","a short sound. 440 is a middle note."],["restart yes","starts the game over when yes is true."],["x print","shows x at the top of the game."]];
const refList=l=>"<dl>"+l.map(([a,b])=>"<dt><code>"+esc(a)+"</code></dt><dd>"+esc(b)+"</dd>").join("")+"</dl>";
$("bHelp").onclick=()=>sheet('<h2>Sprout, for games</h2><div class="ref"><p>This is Sprout 2.0. Your code runs while you write it: change something and the game updates right away, keeping the score and positions it already has.</p><h3>The language</h3>'+refList(REF_LANG)+'<h3>Game words</h3>'+refList(REF_GAME)+'<p>If something breaks, the last version that worked keeps running and the red bar shows the line to fix. Tap it to jump there.</p></div><button class="hb" data-close style="width:100%">Got it</button>');
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))));
$("bShare").onclick=async()=>{if(!code.trim()){toast("Nothing to share yet");return}const url=location.origin+location.pathname+"#sp="+b64e(code);
 if(navigator.share){try{await navigator.share({title:"My Sprout game",url});return}catch(e){if(e&&e.name==="AbortError")return}}
 try{await navigator.clipboard.writeText(url);toast("Link copied. Anyone who opens it gets your code.")}catch(e){prompt("Copy this link:",url)}};

// ---------- start
(function boot(){let loaded=false;
 const m=location.hash.match(/^#sp=([\w-]+)/);
 if(m){try{const src=b64d(m[1]);history.replaceState(null,"",location.pathname);setCode(src);compile(src);D.step=-2;tab("code");toast("Someone shared this game with you");loaded=true}catch(e){}}
 if(!loaded){const sv=LS.get("sproutlive.sp1",null);
  if(sv&&sv.code&&sv.code.trim()){D.step=typeof sv.step==="number"?sv.step:-2;D.dirty=!!sv.dirty;setCode(sv.code,{nosave:true});compile(sv.code);if(D.step<0||D.dirty)tab("tweak")}
  else setCode("",{nosave:true})}
 $("capx").textContent=INTRO;capUI();fit()})();
</script>
</body></html>
