<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Who Would Win NBA">
<meta name="theme-color" content="#181425">
<title>Who Would Win: NBA Edition</title>
<meta name="description" content="Twenty points. Five players. Jordan costs ten. Then a three-minute game plays out, play by play.">
<link rel="apple-touch-icon" href="/icons/hoops-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23181425'/%3E%3Ctext x='8' y='12.5' font-size='10' text-anchor='middle'%3E%F0%9F%8F%80%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
button{touch-action:manipulation;font-family:inherit;cursor:pointer}
:root{
  --bg:#181425;--panel:#262b44;--panel2:#3a4466;--line:#5a6988;--ink:#0d0a14;
  --tx:#ead4aa;--mut:#8b9bb4;--red:#e43b44;--gold:#feae34;--green:#63c74d;--blue:#2ce8f5;--wood:#b86f50;--wood2:#c28569;--orange:#f77622;
}
html,body{position:fixed;inset:0;overflow:hidden;background:var(--bg);
  touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  font-family:"VT323","Courier New",monospace;color:var(--tx);font-size:19px;line-height:1.1}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px);
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% -10%, rgba(247,118,34,0.22), transparent 55%),var(--bg)}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.hidden{display:none!important}
.mk{font-family:"Press Start 2P","VT323",monospace;line-height:1.25}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
header{text-align:center;padding:6px 0 8px}
h1{font-size:19px;color:var(--gold);text-shadow:3px 3px 0 var(--ink)}
h1 span{display:block;font-size:12px;color:var(--orange);margin-top:8px}
.sub{font-size:16px;color:var(--mut);margin-top:8px;letter-spacing:.04em;text-transform:uppercase}
#enemyCard{background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--ink);padding:8px 10px;margin-top:4px;display:flex;align-items:center;gap:10px}
#enemyCard .lbl{font-size:8px;color:var(--red);font-family:"Press Start 2P",monospace;margin-bottom:6px}
#enemyCard .tname{font-size:11px;color:var(--tx);line-height:1.3}
.talkline{font-size:16px;color:var(--mut);line-height:1.1;margin-top:4px}
#enemyCard .troster{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px 3px;max-width:44%;align-items:flex-end}
#budget{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 8px;font-size:18px;color:var(--mut)}
#budget b{color:var(--gold);font-size:16px;font-family:"Press Start 2P",monospace}
#budget .cnt b{color:var(--tx);font-size:12px}
#mass{font-size:15px;color:var(--mut);text-align:center}
#mass b{color:var(--tx);font-size:15px;font-family:"VT323",monospace}
#pool{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;padding:6px 4px 10px 0;align-content:start}
.card{background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--ink);padding:10px 4px 6px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:transform .06s,box-shadow .06s}
.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.card.sel{border-color:var(--gold);background:#2f3250}
.card .em{height:64px;display:flex;align-items:flex-end}
.card .nm{font-size:17px;text-align:center;line-height:1;color:#fff;margin-top:4px}
.card .pos{font-size:14px;color:var(--gold);line-height:1}
.card .bl{font-size:14px;color:var(--mut);text-align:center;line-height:1;min-height:28px}
.card .cost{position:absolute;top:-8px;right:-6px;background:var(--gold);color:var(--ink);font-family:"Press Start 2P",monospace;font-size:10px;min-width:22px;height:22px;line-height:22px;padding:0 5px;text-align:center;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.card:disabled{opacity:.35}
.card .n{position:absolute;top:-8px;left:-6px;background:var(--green);color:var(--ink);font-family:"Press Start 2P",monospace;font-size:8px;min-width:22px;height:22px;line-height:22px;text-align:center;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
#teamBar{display:flex;gap:10px;align-items:center;padding-top:10px;border-top:3px solid var(--line)}
#team{flex:1;display:flex;flex-wrap:wrap;gap:5px;min-height:44px;align-items:center}
#team .empty{font-size:17px;color:var(--mut);line-height:1}
.chip{background:var(--panel2);border:2px solid var(--line);padding:2px 4px 2px 3px;color:var(--tx);display:flex;align-items:center;gap:3px;box-shadow:2px 2px 0 var(--ink)}
.chip small{font-size:8px;color:var(--gold);font-family:"Press Start 2P",monospace}
#fightBtn{background:var(--orange);color:#fff;border:3px solid var(--ink);padding:0 14px;height:54px;font-size:14px;box-shadow:4px 4px 0 var(--ink);font-family:"Press Start 2P",monospace;text-shadow:2px 2px 0 var(--ink)}
#fightBtn:disabled{opacity:.35;box-shadow:none}
#fightBtn:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.foot{text-align:center;font-size:16px;color:var(--mut);padding-top:10px}
.lnk{background:none;border:0;color:var(--blue);font-size:16px;text-decoration:underline;padding:4px}

/* ---------- game ---------- */
#score{display:flex;align-items:center;gap:8px;padding:4px 0 8px}
#score .side{flex:1;min-width:0}
#score .side.r{text-align:right}
#score .nm{font-size:8px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
#score .side.r .nm{color:var(--red)}
#score .pts{font-size:26px;color:#fff;text-shadow:3px 3px 0 var(--ink);line-height:1}
#score .clock{font-size:14px;color:var(--gold);background:var(--ink);border:2px solid var(--line);padding:8px 10px;min-width:92px;text-align:center}
#score .clock.hot{color:var(--red)}
#court{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#floor{position:relative;height:100%;aspect-ratio:1/1.85;max-width:100%;background:
  repeating-linear-gradient(0deg,var(--wood) 0 6px,var(--wood2) 6px 12px);border:4px solid #3e2731;box-shadow:4px 4px 0 var(--ink);overflow:visible}
.mkl{position:absolute;left:0;right:0;top:50%;height:3px;background:#ead4aa;opacity:.5;margin-top:-1px}
.mkc{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:3px solid #ead4aa;border-radius:50%;transform:translate(-50%,-50%);opacity:.5}
.mkk{position:absolute;left:50%;width:62%;height:30%;border:3px solid #ead4aa;opacity:.5;transform:translateX(-50%)}
.mkk.t{top:-3px;border-top:0;border-radius:0 0 50% 50%/0 0 100% 100%}
.mkk.b{bottom:-3px;border-bottom:0;border-radius:50% 50% 0 0/100% 100% 0 0}
.hoop{position:absolute;left:50%;width:10px;height:10px;border:3px solid var(--orange);border-radius:50%;transform:translateX(-50%);background:rgba(0,0,0,.2);z-index:2}
.hoop.l{bottom:12px}.hoop.r{top:12px}
.hoop::after{content:"";position:absolute;left:-8px;right:-8px;height:3px;background:#ead4aa;bottom:-9px}
.hoop.r::after{bottom:auto;top:-9px}
.pl{position:absolute;width:0;height:0;z-index:3;transition:left .6s steps(6),top .6s steps(6)}
.pl .em{position:absolute;left:0;top:0;transform:translate(-50%,-85%);filter:drop-shadow(2px 2px 0 rgba(0,0,0,.5))}
.pl.R .em img{transform:scaleX(-1)}
.pl .tag{position:absolute;left:0;top:4px;transform:translateX(-50%);font-size:12px;color:#fff;text-shadow:1px 1px 0 var(--ink);white-space:nowrap;opacity:0}
.pl.ball .tag{opacity:1}
.pl.ball .em::after{content:"";position:absolute;right:-5px;bottom:4px;width:7px;height:7px;background:var(--orange);border:1px solid var(--ink);border-radius:50%}
#ballfly{position:absolute;width:9px;height:9px;background:var(--orange);border:1px solid var(--ink);border-radius:50%;z-index:5;display:none;transform:translate(-50%,-50%)}
#shotTxt{position:absolute;z-index:6;font-family:"Press Start 2P",monospace;font-size:11px;color:#fff;text-shadow:2px 2px 0 var(--ink);transform:translate(-50%,-50%);pointer-events:none;opacity:0;white-space:nowrap}
#shotTxt.on{animation:fl .9s steps(6) forwards}
#shotTxt.good{color:var(--green)}#shotTxt.bad{color:var(--red)}
@keyframes fl{0%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-30px}}
#announce{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-size:24px;line-height:1.3;padding:0 10px;color:var(--gold);text-shadow:4px 4px 0 var(--ink);opacity:0;transform:scale(.6);z-index:7}
#announce.on{animation:pop .22s steps(3) forwards}
#announce.red{color:var(--red)}
@keyframes pop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
#court.shake{animation:shk .22s steps(4)}
@keyframes shk{0%{transform:translate(0)}25%{transform:translate(-5px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,-2px)}100%{transform:translate(0)}}
#court.flash::after{content:"";position:absolute;inset:0;background:#fff;z-index:6;pointer-events:none;animation:fo .16s steps(2) forwards}
@keyframes fo{0%{opacity:.5}100%{opacity:0}}
#pbp{height:64px;font-size:17px;color:var(--mut);line-height:1.15;overflow:hidden;padding:6px 6px 0;text-align:center}
#pbp b{color:#fff;font-weight:400}#pbp i{color:var(--gold);font-style:normal}
#ctrl{display:flex;gap:10px;justify-content:center;padding-top:8px}
#ctrl button{background:var(--panel);border:2px solid var(--line);color:var(--tx);padding:8px 14px;font-size:17px;box-shadow:3px 3px 0 var(--ink)}
#ctrl button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#intro,#result{position:absolute;inset:0;z-index:10;background:#0f0b17;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center}
#intro .row{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
#intro .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
#intro .who{font-size:8px;color:var(--gold);line-height:1.4}
#intro .col.r .who{color:var(--red)}
#intro .big{height:120px;display:flex;align-items:flex-end;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.6))}
#intro .col.r .big img{transform:scaleX(-1)}
#intro .nm{font-size:19px;color:#fff;line-height:1}
#intro .kg{font-size:16px;color:var(--mut);line-height:1}
#intro .vs{font-size:22px;color:#fff;text-shadow:3px 3px 0 var(--ink)}
#intro .talk{font-size:18px;color:var(--tx);max-width:340px;line-height:1.2;margin-top:8px}
#intro .talk b{color:var(--red);font-weight:400}
#resTitle{font-size:28px;line-height:1.3;color:var(--gold);text-shadow:4px 4px 0 var(--ink);animation:pop .3s steps(3)}
#resTitle.lose{color:var(--red)}
#resScore{font-size:30px;color:#fff;text-shadow:3px 3px 0 var(--ink);margin-top:4px}
#resSub{font-size:18px;color:var(--tx);line-height:1.3;max-width:380px}
#resSub b{color:#fff;font-weight:400}
#box{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:16px;line-height:1.15;margin:6px 0;width:100%}
#box .h{font-size:8px;font-family:"Press Start 2P",monospace;color:var(--gold);margin-bottom:4px}
#box .r .h{color:var(--red)}
#box .ln{display:flex;justify-content:space-between;gap:6px;color:var(--tx);white-space:nowrap}
#box .ln span:last-child{color:var(--mut)}
#resRec{font-size:16px;color:var(--mut);margin-bottom:12px}
#resBtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#resBtns button{border:3px solid var(--ink);padding:12px 14px;font-size:11px;font-family:"Press Start 2P",monospace;color:#fff;background:var(--panel2);box-shadow:4px 4px 0 var(--ink);text-shadow:2px 2px 0 var(--ink)}
#resBtns button.pri{background:var(--orange)}
#resBtns button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
</style>
</head>
<body>
<div id="app">
<div id="draft" class="screen">
  <header>
    <h1 class="mk">WHO WOULD WIN<span>NBA EDITION</span></h1>
    <div class="sub" id="dateLine"></div>
  </header>
  <div id="enemyCard">
    <div>
      <div class="lbl">BAD GUYS OF THE DAY</div>
      <div class="tname mk" id="enemyName"></div>
      <div class="talkline" id="enemyTalk"></div>
    </div>
    <div class="troster" id="enemyRoster"></div>
  </div>
  <div id="budget">
    <span><b id="ptsLeft">20</b> pts left</span>
    <span id="mass"></span>
    <span class="cnt"><b id="cnt">0</b>/5 starters</span>
  </div>
  <div id="pool"></div>
  <div id="teamBar">
    <div id="team"><span class="empty">Pick five starters. Twenty points. Jordan is ten of them.</span></div>
    <button id="fightBtn" disabled>TIP OFF</button>
  </div>
  <div class="foot"><button class="lnk" id="randomBtn">random pool instead</button> · <button class="lnk" id="sndBtn">♪ sound on</button> · <span id="record"></span></div>
</div>

<div id="arena" class="screen hidden">
  <div id="score">
    <div class="side"><div class="nm mk">YOUR TEAM</div><div class="pts mk" id="ptsL">0</div></div>
    <div class="clock mk" id="clock">3:00</div>
    <div class="side r"><div class="nm mk" id="hudEnemy">THEM</div><div class="pts mk" id="ptsR">0</div></div>
  </div>
  <div id="court">
    <div id="floor"><i class="mkl"></i><i class="mkc"></i><i class="mkk t"></i><i class="mkk b"></i><div class="hoop l"></div><div class="hoop r"></div><div id="ballfly"></div><div id="shotTxt" class="mk"></div></div>
    <div id="announce" class="mk"></div>
    <div id="intro" class="hidden">
      <div class="row">
        <div class="col"><div class="who mk">YOUR TEAM</div><div class="big" id="inL"></div><div class="nm" id="inLn"></div><div class="kg" id="kgL"></div></div>
        <div class="vs mk">VS</div>
        <div class="col r"><div class="who mk" id="inName"></div><div class="big" id="inR"></div><div class="nm" id="inRn"></div><div class="kg" id="kgR"></div></div>
      </div>
      <div class="talk" id="inTalk"></div>
    </div>
    <div id="result" class="hidden">
      <div id="resTitle" class="mk"></div>
      <div id="resScore" class="mk"></div>
      <div id="resSub"></div>
      <div id="box"></div>
      <div id="resRec"></div>
      <div id="resBtns"><button id="rematch" class="pri">REMATCH</button><button id="redraft">REDRAFT</button><button id="share">SHARE</button></div>
    </div>
  </div>
  <div id="pbp"></div>
  <div id="ctrl"><button id="speedBtn">1× speed</button><button id="skipBtn">skip to final</button><button id="sndBtn2">♪</button></div>
</div>
</div>
<script>
// ---------- roster ----------
// id, name, pos, cm, power, ins, mid, thr, pas, reb, def, spd, usg, skin(0-4), hair, blurb
const RAW=[
['mj','Michael Jordan','SG',198,100,95,92,80,80,70,92,92,30,3,'bald','Six for six. Took it personally.'],
['lebron','LeBron James','SF',206,100,96,80,78,95,85,85,90,30,3,'short','A point guard the size of a truck.'],
['kareem','Kareem Abdul-Jabbar','C',218,95,97,80,20,70,92,88,70,26,4,'short','The skyhook. Unblockable by law.'],
['magic','Magic Johnson','PG',206,92,85,75,60,99,85,70,80,22,3,'short','No-look passes. Full-time smile.'],

['wilt','Wilt Chamberlain','C',216,95,97,60,0,70,99,90,80,30,4,'short','Scored 100 in a game. Once.'],

['hakeem','Hakeem Olajuwon','C',213,92,94,80,15,70,90,97,78,28,4,'short','The Dream Shake. Nobody is ready.'],
['giannis','Giannis Antetokounmpo','PF',211,92,98,55,30,78,90,88,92,30,4,'short','Two dribbles from half court. Dunk.'],
['jokic','Nikola Jokic','C',211,93,92,88,80,99,95,70,55,28,0,'short','Looks slow. Triple-double anyway.'],
['luka','Luka Doncic','PG',201,90,88,85,85,95,75,55,70,34,0,'short','Step-back three. Complains to ref.'],
['kd','Kevin Durant','SF',208,92,90,97,90,80,70,78,80,30,3,'short','Seven feet of jump shot.'],

['kawhi','Kawhi Leonard','SF',201,88,88,95,85,70,75,95,75,28,4,'braids','Giant hands. No emotions. Fun guy.'],
['klay','Klay Thompson','SG',198,78,70,85,97,55,45,75,70,22,2,'short','37 in a quarter. Eleven dribbles.'],

['muggsy','Muggsy Bogues','PG',160,35,50,55,40,90,25,60,99,12,4,'short','5-foot-3. Steals your lunch money.'],
['scal','Brian Scalabrine','PF',206,20,45,50,50,45,50,45,40,8,0,'short','The White Mamba. Legend. Somehow.'],
['boban','Boban Marjanovic','C',224,45,85,40,0,40,85,50,25,18,0,'short','Biggest hands in history. Slowest feet.'],
['pistol','Pete Maravich','PG',196,82,85,88,80,95,45,45,88,34,0,'long','Behind-the-back everything. Floppy socks.'],
['isiah','Isiah Thomas','PG',185,85,85,85,70,95,40,70,92,28,4,'short','Bad Boy. 25 in a quarter on one ankle.'],
['dwight','Dwight Howard','C',211,80,90,30,5,40,95,92,70,20,4,'short','Superman cape. Allergic to free throws.'],

// ---------- pool & pricing ----------
const BUDGET=20, TEAM=5;
let state=null;
function buildPool(rnd){
  const heavy=ROSTER.filter(r=>r.power>=88), light=ROSTER.filter(r=>r.power<=55), mid=ROSTER.filter(r=>r.power>55&&r.power<88);
  const h=shuffle(heavy,rnd), l=shuffle(light,rnd), m=shuffle(mid,rnd);
  let pool=[h[0],h[1],l[0],l[1],l[2],l[3],m[0],m[1],m[2],m[3],m[4],m[5]];
  const top=Math.max(...pool.map(r=>r.power)), floor=15;
  const costs={};pool.forEach(r=>costs[r.id]=Math.min(10,Math.max(1,Math.round(10*Math.pow((r.power-floor)/(top-floor),1.3)))));
  // a legal five must always fit with a little room to spare
  for(let g=0;g<40;g++){const five=pool.slice().sort((a,b)=>costs[a.id]-costs[b.id]).slice(0,TEAM);if(five.reduce((s,r)=>s+costs[r.id],0)<=BUDGET-3)break;const x=five[TEAM-1];costs[x.id]=Math.max(1,costs[x.id]-1)}
  pool.sort((a,b)=>costs[b.id]-costs[a.id]||b.power-a.power);
  return {pool,costs};
}
function draftEnemy(pool,costs,rnd){
  // exactly 5 distinct players within budget
  for(let tries=0;tries<200;tries++){
    const style=['big','value','value','mix'][Math.floor(rnd()*4)];
    let p=shuffle(pool,rnd);
    if(style==='big')p.sort((a,b)=>costs[b.id]-costs[a.id]||rnd()-.5);
    if(style==='value')p.sort((a,b)=>(b.power/(costs[b.id]+2))-(a.power/(costs[a.id]+2)));
    const team=[];let pts=BUDGET;
    for(const r of p){if(team.length>=TEAM)break;const need=TEAM-team.length-1;if(costs[r.id]<=pts-need){team.push(r.id);pts-=costs[r.id]}}
    if(team.length===TEAM)return team;
  }
  return pool.slice(-5).map(r=>r.id);
}
function newGame(daily){
  const seed=daily?dayKey:(Date.now()^Math.floor(Math.random()*1e9));
  const rnd=mulberry(seed*2654435761%4294967296);
  const {pool,costs}=buildPool(rnd);
  const enemy=draftEnemy(pool,costs,rnd);
  const enemyName=daily?`The ${DAYS[today.getDay()]} ${NOUNS[Math.floor(rnd()*NOUNS.length)]}`:`The Random ${NOUNS[Math.floor(rnd()*NOUNS.length)]}`;
  const talk=TALK[Math.floor(rnd()*TALK.length)];
  state={seed,daily,pool,costs,enemy,enemyName,team:[],talk};
  Snd.scene('draft');
  renderDraft();
}

// one possession: compute everything, return the script of beats to animate
function simPossession(){
  const off=G.poss, defS=off==='L'?'R':'L', O=G[off], D=G[defS];
  const beats=[]; // {at:0..1, kind, ...}
  let secs=Math.min(G.clock, rnd(6,13));
  const rushed=G.clock<=4;
  const defAvg=D.reduce((s,u)=>s+u.r.def,0)/5;
  let handler=wpick(O,u=>u.r.usg+u.r.pas*.3);
  beats.push({at:0,kind:'bring',who:handler});
  // turnover?
  const pTo=0.045+(82-handler.r.pas)*0.0022+(defAvg-72)*0.0015;
  if(Math.random()<pTo){
    const thief=wpick(D,u=>u.r.def+u.r.spd*.3);
    const steal=Math.random()<.6;
    if(steal)thief.stl++;
    beats.push({at:.5,kind:'to',who:handler,thief:steal?thief:null,text:steal?`<b>${last(thief.r)}</b> picks <b>${last(handler.r)}</b> clean.`:`<b>${last(handler.r)}</b> throws it away.`});
    return {secs:Math.min(secs,rnd(4,8)),beats,keep:false};
  }
  // pass or create
  let shooter=handler, passer=null;
  if(Math.random()<0.55+(handler.r.pas-75)*0.004){const others=O.filter(u=>u!==handler);shooter=wpick(others,u=>u.r.usg+Math.max(u.r.ins,u.r.mid,u.r.thr)*.4);passer=handler;beats.push({at:.35,kind:'pass',from:handler,to:shooter})}
  // shot type
  const r=shooter.r;
  const w3=r.thr<25?0:Math.pow(r.thr,2)*0.85, wm=Math.pow(r.mid,2)*0.55, wr=Math.pow(r.ins,2)*(1+(r.spd-70)/120);
  const type=wpick(['three','mid','rim'],t=>t==='three'?w3:t==='mid'?wm:wr);
  const defender=type==='rim'?wpick(D,u=>u.r.def*(u.r.cm-170)):wpick(D,u=>u.r.def+u.r.spd*.4);
  const rating=type==='three'?r.thr:type==='mid'?r.mid:r.ins;
  let p=(type==='three'?.37:type==='mid'?.44:.58)+(rating-75)*0.0095-(defender.r.def-75)*0.006;
  if(type==='rim')p-=(defender.r.cm-200)*0.003;
  if(rushed)p-=.12; if(shooter.streak>=2)p+=.04;
  p=Math.min(type==='rim'?.78:.7,Math.max(.1,p));
  shooter.fga++;
  const dist=type==='three'?(r.thr>=95&&Math.random()<.3?'logo':'three'):type;
  // block?
  let blocked=false;
  if(type!=='three'){const pb=0.03+(defender.r.def-70)*0.003+(defender.r.cm-205)*0.004;if(Math.random()<Math.max(0,pb)){blocked=true}}
  const at=rushed?.8:.68;
  beats.push({at,kind:'shot',who:shooter,type:dist,defender});
  const buzzer=G.clock-secs<=0.5;
  if(blocked){
    defender.blk++;shooter.streak=0;
    beats.push({at:at+.15,kind:'block',who:defender,shooter,text:`<b>${last(defender.r)}</b> swats <b>${last(shooter.r)}</b> into the third row.`});
    const reb=rebound(O,D,.25);
    beats.push({at:at+.27,kind:'reb',who:reb,text:`<b>${last(reb.r)}</b> comes up with it.`});
    return {secs,beats,keep:reb.side===off};
  }
  if(Math.random()<p){
    const pts=type==='three'?3:2; shooter.pts+=pts;shooter.fgm++;if(type==='three')shooter.tpm++;shooter.streak++;
    if(passer){passer.ast++}
    G[off==='L'?'sL':'sR']+=pts;
    let text=type==='three'?(dist==='logo'?`<b>${last(shooter.r)}</b> from the LOGO. Bang.`:`<b>${last(shooter.r)}</b> for three. Wet.`):type==='mid'?`<b>${last(shooter.r)}</b> pulls up. Pure.`:`<b>${last(shooter.r)}</b> finishes at the rim.`;
    let special=null;
    if(type==='rim'&&shooter.r.cm<defender.r.cm-5&&defender.r.def>=80&&Math.random()<.5){special='POSTER';text=`<b>${last(shooter.r)}</b> POSTERIZES <b>${last(defender.r)}</b>!`}
    else if(dist==='logo')special='FROM THE LOGO';
    if(buzzer)special='BUZZER BEATER';
    if(shooter.streak===3)special=special||'HEAT CHECK';
    if(passer)text+=` ${last(passer.r)} with the dime.`;
    beats.push({at:at+.17,kind:'make',who:shooter,pts,text,special});
    // and one
    if(type==='rim'&&!buzzer&&Math.random()<.10){
      const ft=Math.random()<.45+(shooter.r.mid)*.004;
      if(ft){shooter.pts++;G[off==='L'?'sL':'sR']++}
      beats.push({at:at+.3,kind:'ft',who:shooter,made:ft,text:ft?`And one. <b>${last(shooter.r)}</b> sinks the free throw.`:`And one. <b>${last(shooter.r)}</b> bricks the freebie.`,special:'AND ONE'});
    }
    return {secs,beats,keep:false};
  }
  shooter.streak=0;
  const reb=rebound(O,D,type==='three'?.22:.28);
  beats.push({at:at+.17,kind:'miss',who:shooter,type,text:`<b>${last(shooter.r)}</b> ${type==='three'?'from deep':type==='mid'?'from the elbow':'at the rim'}... off the iron.`});
  beats.push({at:at+.3,kind:'reb',who:reb,text:reb.side===off?`<b>${last(reb.r)}</b> tips it back out. Offensive board.`:`<b>${last(reb.r)}</b> cleans the glass.`});
  return {secs,beats,keep:reb.side===off};
}
function rebound(O,D,offBase){
  const oR=O.reduce((s,u)=>s+u.r.reb*(u.r.cm-150),0), dR=D.reduce((s,u)=>s+u.r.reb*(u.r.cm-150),0);

  const u=wpick(team,x=>x.r.reb*(x.r.cm-150)); u.reb++; return u;
}
function nextPossession(){

}

function applyBeats(P,silent){
  const off=G.poss;

  P.beats.forEach(b=>{
    const run=()=>{
      const stamp=`<i>${clockStr(Math.ceil(G.clock))}</i> `;
      if(b.kind==='bring'){holder(b.who);if(!silent)Snd.sfx('dribble')}
      else if(b.kind==='pass'){holder(b.to)}
      else if(b.kind==='shot'){
        if(silent)return; holder(null);
        const [hx,hy]=hoopXY(off), bf=$('ballfly');
        bf.style.transition='none';setPos(bf,b.who.x,b.who.y);bf.style.display='block';void bf.offsetWidth;
        bf.style.transition=`left ${.45/speed}s steps(8), top ${.45/speed}s steps(8)`;setPos(bf,hx,hy);
        b.who.el.style.left=(b.who.y-4)+'%';later(()=>{b.who.el.style.left=b.who.y+'%'},250/speed);
      }
      else if(b.kind==='make'){
        score(); pbp(stamp+b.text); G.lastScore=b.who;
        if(silent)return; shotTxt(off,b.pts===3?'SPLASH':'SWISH','good'); Snd.sfx('swish'); if(off==='L'){hapt(25)} if(b.special){announce(b.special,b.special==='POSTER',700);Snd.sfx('crowd');shake();if(b.special==='POSTER'||b.special==='BUZZER BEATER')flash()}
        if(off==='L'&&Math.random()<.25)Snd.sfx('crowd');
      }
      else if(b.kind==='miss'){pbp(stamp+b.text);if(silent)return;shotTxt(off,'CLANK','bad');Snd.sfx('clank')}
      else if(b.kind==='block'){pbp(stamp+b.text);if(silent)return;shotTxt(off,'BLOCKED','bad');Snd.sfx('block');announce('SWAT',true,500);shake();holder(b.who)}
      else if(b.kind==='reb'){pbp(stamp+b.text);if(!silent){$('ballfly').style.display='none';holder(b.who)}}
      else if(b.kind==='to'){pbp(stamp+b.text);if(!silent){Snd.sfx('whistle');holder(b.thief)}}
      else if(b.kind==='ft'){score();pbp(stamp+b.text);if(!silent){announce('AND ONE',false,600);Snd.sfx(b.made?'swish':'clank')}}
    };
    if(silent)run(); else later(run,beatMs(b));
  });
}
function shotTxt(off,txt,cls){const [hx,hy]=hoopXY(off);const s=$('shotTxt');s.className='mk '+cls;s.textContent=txt;setPos(s,off==='L'?hx-9:hx+9,hy);void s.offsetWidth;s.classList.add('on')}
let shkT=null;
function shake(){const c=$('court');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');clearTimeout(shkT);shkT=setTimeout(()=>c.classList.remove('shake'),240)}
function flash(){const c=$('court');c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),180)}
let annT=null;
function announce(txt,red,dur,then){
  const a=$('announce');clearTimeout(annT);a.classList.remove('on');a.classList.toggle('red',!!red);a.textContent=txt;void a.offsetWidth;a.classList.add('on');
  annT=setTimeout(()=>{a.classList.remove('on');if(then)then()},dur/Math.max(1,speed*0.75));
}
function endPeriod(){
  if(G.sL===G.sR){
    G.ot++; G.clock=OT_SECS;
    pbp(`<i>0:00</i> Tied at ${G.sL}. <b>OVERTIME.</b>`);
    if(G.silent){nextPossession();return}
    Snd.sfx('buzzer'); announce('OVERTIME',true,1100,()=>{G.poss=Math.random()<.5?'L':'R';nextPossession()});
    return;
  }
  finish();
}
function finish(){
  G.done=true; clearAll(); $('ballfly').style.display='none'; $('clock').textContent=G.ot?'FINAL/OT':'FINAL';
  const win=G.sL>G.sR;
  const s=load(); const d=s.days[dayKey]||(s.days[dayKey]={w:0,l:0});
  if(win){s.w++;if(state.daily)d.w++}else{s.l++;if(state.daily)d.l++}
  if(win&&state.daily&&s.lastWin!==dayKey){const y=new Date(today);y.setDate(y.getDate()-1);const yk=y.getFullYear()*10000+(y.getMonth()+1)*100+y.getDate();s.streak=(s.lastWin===yk)?(s.streak||0)+1:1;s.lastWin=dayKey;s.best=Math.max(s.best||0,s.streak)}
  save(s);
  const margin=Math.abs(G.sL-G.sR);
  const t=$('resTitle');t.className='mk'+(win?'':' lose');
  t.textContent=win?(margin>=15?'BLOWOUT':margin<=2?'SURVIVED':'VICTORY'):(margin>=15?'HUMILIATED':margin<=2?'HEARTBREAKER':'DEFEAT');
  $('resScore').textContent=`${G.sL} – ${G.sR}${G.ot?' (OT)':''}`;
  const mvp=G.L.slice().sort((a,b)=>(b.pts+b.reb+b.ast)-(a.pts+a.reb+a.ast))[0];
  const star=G.L.concat(G.R).slice().sort((a,b)=>b.pts-a.pts)[0];
  $('resSub').innerHTML=`${win?'Your team beat':'Your team lost to'} <b>${state.enemyName}</b>. ${star.side==='L'?'Your':'Their'} <b>${star.r.name}</b> led all scorers with ${star.pts}.${mvp?` MVP: <b>${last(mvp.r)}</b>, ${mvp.pts} pts, ${mvp.reb} reb, ${mvp.ast} ast.`:''}`;
  const col=(team,cls)=>`<div class="${cls}"><div class="h">${cls==='r'?state.enemyName.replace(/^The /,'').toUpperCase():'YOUR TEAM'}</div>${team.slice().sort((a,b)=>b.pts-a.pts).map(u=>`<div class="ln"><span>${last(u.r)}</span><span>${u.pts}p ${u.reb}r ${u.ast}a${u.blk?` ${u.blk}b`:''}${u.stl?` ${u.stl}s`:''}</span></div>`).join('')}</div>`;
  $('box').innerHTML=col(G.L,'l')+col(G.R,'r');
  $('resRec').textContent=recordLine();
  const show=()=>{$('result').classList.remove('hidden');Snd.jingle(win?(margin>=15?'flawless':'victory'):'defeat','draft')};
  if(G.silent){show();return}
  Snd.sfx('buzzer'); shake(); flash(); hapt(win?[60,40,60,40,120]:[200]);
  announce('FINAL',!win,1000); later(show,1100/speed);
}
$('speedBtn').addEventListener('click',()=>{speed=speed===1?2:speed===2?4:1;$('speedBtn').textContent=speed+'× speed'});
$('skipBtn').addEventListener('click',()=>{if(!G||G.done)return;G.silent=true;clearAll();clearTimeout(annT);$('announce').classList.remove('on');$('intro').classList.add('hidden');let n=0;while(!G.done&&n++<2000)nextPossession();if(!G.done)finish()});
$('rematch').addEventListener('click',()=>startGame());
$('redraft').addEventListener('click',()=>{clearAll();$('arena').classList.add('hidden');$('draft').classList.remove('hidden');Snd.scene('draft');renderDraft()});
$('share').addEventListener('click',async()=>{
  const win=G.sL>G.sR; const names=ids=>ids.map(i=>last(BY[i])).join(', ');
  const mvp=G.L.slice().sort((a,b)=>b.pts-a.pts)[0];
  const txt=`Who Would Win NBA · ${MONTHS[today.getMonth()]} ${today.getDate()}\n${names(state.team)} ${win?'beat':'lost to'} ${state.enemyName} ${G.sL}–${G.sR}${G.ot?' in OT':''}\n${mvp?`${mvp.r.name} dropped ${mvp.pts}.`:''} ${win?'Run it back.':'Avenge me.'} taskiap.com/hoops/`;
  try{if(navigator.share){await navigator.share({text:txt})}else{await navigator.clipboard.writeText(txt);$('share').textContent='COPIED';setTimeout(()=>$('share').textContent='SHARE',1200)}}catch(e){}
});
newGame(true);
</script>
