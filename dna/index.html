<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>DNA Battles · party-based evolution deckbuilder</title>
<meta name="theme-color" content="#04120a">
<style>
:root{ --bg:#04120a; --pan:#0a1f12; --g:#3dff7c; --m:#ff3db0; --w:#eafff2; --dim:#9adfb4;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--w);font-family:var(--mono);overflow-x:hidden;
  background-image:radial-gradient(#3dff7c0a 1px,transparent 1px);background-size:22px 22px}
#app{max-width:640px;margin:0 auto;min-height:100dvh;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px)}
.page{display:flex;flex-direction:column;gap:12px;min-height:calc(100dvh - 40px);animation:pgIn .3s ease}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.kick{font-weight:700;font-size:10px;letter-spacing:.22em;color:var(--g);text-transform:uppercase}
.kick.m{color:var(--m)}
h1{font-size:clamp(30px,9vw,52px);line-height:1;letter-spacing:.02em;text-transform:uppercase;font-weight:700}
h1 .z{color:var(--g)} h1 .x{color:var(--m)}
.big{font-size:clamp(21px,6vw,30px);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.big .z{color:var(--g)}
.sub{font-size:12px;line-height:1.65;color:var(--dim)}
.helix{height:14px;background:repeating-linear-gradient(90deg,var(--g) 0 8px,transparent 8px 16px,var(--m) 16px 24px,transparent 24px 32px);opacity:.5;border-radius:2px}
.btn{display:block;width:100%;padding:14px 18px;border:2px solid var(--g);background:var(--g);color:#03170b;
  font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:52px}
.btn:active{transform:translate(1px,2px)}
.btn.mag{background:var(--m);border-color:var(--m);color:#1b0311}
.btn.ghost{background:none;color:var(--g)}
.btn.ghost.mag{color:var(--m)}
.btn:disabled{opacity:.35}
.btn.slim{min-height:38px;padding:7px 10px;font-size:11px}
.chip{border:1.5px solid #3dff7c55;padding:.3em .6em;font-size:10px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.chip.hot{border-color:var(--m);color:var(--m)}
.pill{border:1.5px solid #3dff7c66;padding:.35em .7em;font-weight:700;font-size:11px;white-space:nowrap}
.pill b{color:var(--g)}
#hud{display:flex;gap:6px;flex-wrap:wrap}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px;margin:0 auto}
.mbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:8px;font-size:12px;line-height:1.1}
.mbtn small{font-size:8px;letter-spacing:.12em;opacity:.6;text-transform:uppercase}
.mbtn.claimable{border-color:var(--m);animation:clPulse 1.6s ease-in-out infinite}
@keyframes clPulse{0%,100%{box-shadow:0 0 0 0 #ff3db000}50%{box-shadow:0 0 0 4px #ff3db066}}
/* cells & sprites */
.cell{border:1.5px solid #3dff7c44;background:var(--pan);padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.cell.ko{filter:grayscale(1) brightness(.5)}
.cell.target{border-color:var(--m);box-shadow:0 0 0 2px #ff3db066}
.cell .nm{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.cell .hpw{width:100%;height:7px;background:#03170b;border:1px solid #3dff7c44;position:relative}
.cell .hpw i{position:absolute;inset:0;background:var(--g);transform-origin:left}
.cell .hpw.foe i{background:var(--m)}
.cell .evw{width:100%;height:4px;background:#03170b;border:1px solid #ff3db044}
.cell .evw i{display:block;height:100%;background:var(--m)}
.cell .intent{font-size:8.5px;color:var(--m);font-weight:700;letter-spacing:.04em;text-align:center;min-height:11px}
.sprite{position:relative}
.sprite svg{display:block;image-rendering:pixelated}
#foeRow,#meRow{display:grid;gap:8px}
#foeRow{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
#meRow{grid-template-columns:repeat(3,1fr)}
.quip{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--w);color:#03170b;
  font-size:8.5px;font-weight:700;padding:3px 7px;white-space:nowrap;z-index:5;animation:qIn .25s ease;border-radius:2px}
.quip::after{content:'';position:absolute;bottom:-4px;left:50%;border:4px solid transparent;border-top-color:var(--w);border-bottom:0}
@keyframes qIn{from{opacity:0;transform:translateX(-50%) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}
/* cards */
#hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{border:1.5px solid #3dff7c66;background:var(--pan);padding:7px 8px;cursor:pointer;position:relative;min-height:86px;animation:cdIn .25s ease both}
.card:active{transform:scale(.96)}
@keyframes cdIn{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.card .cost{position:absolute;top:-1px;left:-1px;background:var(--g);color:#03170b;font-weight:700;font-size:11px;padding:2px 6px}
.card .tag{position:absolute;top:-1px;right:-1px;background:#3dff7c22;color:var(--g);font-size:7.5px;font-weight:700;padding:2px 5px;letter-spacing:.08em}
.card.spl .tag{background:#ff3db022;color:var(--m)}
.card .nm{font-weight:700;font-size:10.5px;text-transform:uppercase;margin-top:14px;letter-spacing:.03em;line-height:1.2}
.card .fx{font-size:9px;color:var(--dim);margin-top:4px;line-height:1.5}
.card .fx b{color:var(--g)} .card .fx b.hot{color:var(--m)}
.card.dis{opacity:.4}
.card.sel{border-color:var(--m);box-shadow:0 0 0 2px #ff3db066}
.card.spl{border-color:#ff3db088}
/* doors */
.door{border:2px solid #3dff7c55;background:var(--pan);padding:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.door:active{transform:scale(.98)}
.door.hot{border-color:var(--m)}
.door .dn{font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.door.hot .dn{color:var(--m)}
.door .dd{font-size:10px;color:var(--dim);margin-top:3px}
.door .ic{font-size:20px}
/* overlays */
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%) translateY(-90px);background:var(--g);color:#03170b;
  font-weight:700;font-size:10.5px;letter-spacing:.05em;padding:9px 14px;z-index:80;transition:transform .3s cubic-bezier(.2,1.4,.4,1);max-width:92vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
.stamp{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-7deg) scale(3);opacity:0;z-index:70;
  border:4px solid var(--m);color:var(--m);background:#04120aee;font-weight:700;font-size:30px;letter-spacing:.1em;padding:8px 22px;text-transform:uppercase;pointer-events:none}
.stamp.on{animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stampIn{to{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1)}}
.ovl{position:fixed;inset:0;background:#04120af5;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center;overflow-y:auto}
.tutScrim{position:fixed;inset:0;background:#04120acc;z-index:75;display:flex;align-items:flex-end;justify-content:center;padding:20px}
.tutBox{background:var(--pan);border:2px solid var(--g);padding:16px;max-width:420px;width:100%}
.tutBox .tk{color:var(--g);font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.tutBox .tb{font-size:12px;line-height:1.65;color:var(--w);margin:8px 0 4px}
.tutBox .tb b{color:var(--m)}
.row{border:1.5px solid #3dff7c44;background:var(--pan);padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.row .an{font-weight:700;font-size:12px;text-transform:uppercase}
.row .ap{font-size:9.5px;color:var(--dim);margin-top:2px;line-height:1.5}
.row .tick{font-weight:700;color:var(--m);font-size:11px;white-space:nowrap}
.row.pow{border-color:var(--m);cursor:pointer;animation:cdIn .3s ease both}
.floatN{position:fixed;font-weight:700;font-size:20px;color:var(--m);z-index:66;pointer-events:none;animation:fl 1s ease forwards}
@keyframes fl{to{transform:translateY(-46px);opacity:0}}
#btm{display:flex;gap:8px;align-items:stretch;position:sticky;bottom:8px}
#energy{border:2px solid var(--g);min-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--pan)}
#energy b{font-size:22px;color:var(--g)} #energy span{font-size:7.5px;letter-spacing:.16em;color:var(--dim)}
.pulse{animation:puls 1.1s ease-in-out infinite}
@keyframes puls{0%,100%{box-shadow:0 0 0 0 #3dff7c00}50%{box-shadow:0 0 0 5px #3dff7c55}}
.evOvl{position:fixed;inset:0;z-index:72;background:#04120af8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.evOvl .arrow{color:var(--m);font-size:26px;animation:puls 1s infinite}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ============ DNA BATTLES · party-based evolution deckbuilder ============ */
const $ = s => document.querySelector(s);
const el = h => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const app = $('#app');
let toastT = null;
function toast(msg, ms = 1600){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
function stampFx(txt){
  const s = el(`<div class="stamp">${txt}</div>`);
  document.body.appendChild(s);
  requestAnimationFrame(() => s.classList.add('on'));
  setTimeout(() => s.remove(), 1300);
}
function floatN(x, y, txt){
  const f = el(`<div class="floatN" style="left:${x}px;top:${y}px">${txt}</div>`);
  document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
}
function hapt(p){ try { navigator.vibrate && navigator.vibrate(p); } catch {} }

/* ---------- sound · wet lab bleeps ---------- */
let ACTX = null, AMASTER = null;
function audio(){
  if (ACTX) return ACTX;
  ACTX = new (window.AudioContext || window.webkitAudioContext)();
  AMASTER = ACTX.createGain(); AMASTER.gain.value = .5;
  const comp = ACTX.createDynamicsCompressor();
  AMASTER.connect(comp); comp.connect(ACTX.destination);
  return ACTX;
}
function tone(f, dur, vol = .2, type = 'square', delay = 0, slide = 0){
  try {
    audio();
    const t = ACTX.currentTime + delay;
    const o = ACTX.createOscillator(), g = ACTX.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AMASTER); o.start(t); o.stop(t + dur + .05);
  } catch {}
}
const SFX = {
  click(){ tone(660, .06, .1); },
  play(){ tone(440, .09, .16, 'square', 0, 220); },
  hit(){ tone(160, .14, .22, 'sawtooth', 0, -80); tone(90, .12, .18, 'square', .02); },
  aoe(){ [220, 180, 140].forEach((f, i) => tone(f, .12, .16, 'sawtooth', i * .05, -60)); },
  shield(){ tone(300, .1, .14, 'triangle', 0, 80); },
  heal(){ [520, 660, 780].forEach((f, i) => tone(f, .1, .1, 'sine', i * .06)); },
  hurt(){ tone(120, .16, .22, 'sawtooth', 0, -60); },
  ko(){ tone(200, .3, .2, 'sawtooth', 0, -160); },
  win(){ [392, 523, 659, 784].forEach((f, i) => tone(f, .14, .16, 'square', i * .09)); },
  evolve(){ [330, 415, 523, 659, 830, 1046].forEach((f, i) => tone(f, .16, .14, 'square', i * .08)); },
  splice(){ tone(200, .3, .15, 'sawtooth', 0, 300); tone(300, .3, .12, 'square', .1, 400); },
  helix(){ tone(880, .07, .12, 'square'); tone(1174, .09, .1, 'square', .06); },
  death(){ [300, 220, 160, 90].forEach((f, i) => tone(f, .22, .2, 'sawtooth', i * .12, -40)); },
  mut(){ tone(587, .1, .13, 'square'); tone(880, .12, .11, 'square', .08); },
};
/* tiny lab loop · 8-bit petri groove */
const Music = (() => {
  let on = false, timer = null, step = 0;
  const bass = [65, 65, 78, 65, 87, 65, 78, 73];
  const arp = [523, 659, 784, 659, 880, 784, 659, 523];
  let battle = false;
  function tick(){
    const b = bass[step % 8];
    tone(b, .16, .12, 'triangle');
    if (step % 2 === 0) tone(arp[(step / 2) % 8 | 0] * (battle ? 1.5 : 1), .08, battle ? .06 : .04, 'square');
    if (battle && step % 4 === 2) tone(45, .1, .18, 'sine');
    step++;
  }
  return {
    start(){ if (on) return; on = true; audio(); timer = setInterval(tick, 180); },
    stop(){ on = false; clearInterval(timer); },
    toggle(){ on ? this.stop() : this.start(); return on; },
    on: () => on,
    setBattle(v){ battle = v; },
  };
})();
document.addEventListener('pointerdown', function boot(){ audio(); document.removeEventListener('pointerdown', boot); }, { once: true });

/* ============ GENES · the cards ============ */
const CAPS = { dmg: 999, aoe: 400, shield: 999, heal: 80, draw: 5, energy: 4, str: 9, weak: 3, multi: 8, cost: [0, 4] };
const GENES = [
  { id: 'fang', name: 'Fang Gene', cost: 1, dmg: 6, early: 1 },
  { id: 'claw', name: 'Claw Gene', cost: 0, dmg: 3, early: 1 },
  { id: 'pounce', name: 'Pounce Reflex', cost: 2, dmg: 9, early: 1 },
  { id: 'venom', name: 'Venom Sac', cost: 1, dmg: 4, weak: 1, early: 1 },
  { id: 'swarm', name: 'Swarm Logic', cost: 1, dmg: 2, multi: 3, early: 1 },
  { id: 'apex', name: 'Apex Instinct', cost: 3, dmg: 14 },
  { id: 'membrane', name: 'Membrane', cost: 1, shield: 6, early: 1 },
  { id: 'carapace', name: 'Carapace', cost: 2, shield: 11, early: 1 },
  { id: 'camo', name: 'Camouflage', cost: 1, shield: 4, draw: 1, early: 1 },
  { id: 'mitosis', name: 'Mitosis', cost: 1, heal: 7, early: 1 },
  { id: 'photo', name: 'Photosynthesis', cost: 0, heal: 3, early: 1 },
  { id: 'synapse', name: 'Synapse Fire', cost: 1, draw: 2, early: 1 },
  { id: 'atp', name: 'ATP Surge', cost: 0, energy: 2, early: 1 },
  { id: 'helixloop', name: 'Helix Loop', cost: 0, draw: 1, energy: 1 },
  { id: 'adrenal', name: 'Adrenal Gland', cost: 1, str: 2, type: 'pow', early: 1 },
  { id: 'spore', name: 'Spore Cloud', cost: 1, aoe: 4, early: 1 },
  { id: 'acid', name: 'Acid Rain', cost: 2, aoe: 7 },
  { id: 'pheromone', name: 'Pheromones', cost: 0, weak: 2, early: 1 },
  { id: 'ooze', name: 'Primordial Ooze', cost: 1, aoe: 3, shield: 3 },
  { id: 'tail', name: 'Detachable Tail', cost: 0, shield: 3, early: 1 },
  { id: 'gills', name: 'Vestigial Gills', cost: 1, heal: 4, draw: 1 },
  { id: 'thumbs', name: 'Opposable Thumbs', cost: 1, dmg: 5, draw: 1 },
  { id: 'fossil', name: 'Fossil', cost: 0, desc: 'Does nothing. It remembers when this was all ocean.' },
  { id: 'junk', name: 'Junk DNA', cost: 0, draw: 1, desc0: '98% of the genome. Probably fine.' },
  /* species signature genes (added when that species is in your party) */
  { id: 'sig-blob', name: 'Split in Two', cost: 1, heal: 5, shield: 5, sig: 'blob' },
  { id: 'sig-spike', name: 'Quill Volley', cost: 1, aoe: 5, sig: 'spike' },
  { id: 'sig-worm', name: 'Regenerate', cost: 1, heal: 11, sig: 'worm' },
  { id: 'sig-crab', name: 'Carcinize', cost: 1, dmg: 7, shield: 4, sig: 'crab' },
  { id: 'sig-zap', name: 'Bioelectric Bolt', cost: 2, dmg: 11, sig: 'zap' },
  { id: 'sig-eye', name: 'The Gaze', cost: 0, weak: 2, draw: 1, sig: 'eye' },
  { id: 'sig-fungus', name: 'Mycelium Network', cost: 1, aoe: 4, heal: 4, sig: 'fungus' },
  { id: 'sig-tardi', name: 'Cryptobiosis', cost: 2, shield: 13, heal: 6, sig: 'tardi' },
];
function mkGene(id){
  const g = GENES.find(x => x.id === id);
  const c = { ...g, uid: Math.random().toString(36).slice(2) };
  genDesc(c);
  return c;
}
function genDesc(c){
  const bits = [];
  if (c.dmg) bits.push(`Deal <b>${c.dmg}</b>${c.multi ? ` × <b>${c.multi}</b>` : ''}.`);
  else if (c.multi) bits.push(`Hit × <b>${c.multi}</b>.`);
  if (c.aoe) bits.push(`<b class="hot">${c.aoe} to ALL</b> foes.`);
  if (c.shield) bits.push(`Shield <b>${c.shield}</b>.`);
  if (c.heal) bits.push(`Heal <b>${c.heal}</b> (weakest).`);
  if (c.draw) bits.push(`Draw ${c.draw}.`);
  if (c.energy) bits.push(`+<b>${c.energy}</b> ⚡.`);
  if (c.str) bits.push(`<b>Trait:</b> +${c.str} dmg all battle.`);
  if (c.weak) bits.push(`Target −2 atk, ${c.weak} turn${c.weak > 1 ? 's' : ''}.`);
  c.desc = bits.join(' ') || c.desc || c.desc0 || 'A gene of mystery.';
  c.type = c.type || (c.dmg || c.aoe || c.multi ? 'atk' : 'skl');
  return c;
}
GENES.forEach(genDesc);
/* SPLICE · fuse two genes forever (the blender lives on in a centrifuge) */
function spliceName(a, b){
  const A = a.replace(/ (Gene|Sac|Cloud|Rain|Logic|Fire|Surge|Gland|Loop|Reflex|Volley|Network|Bolt)$/i, '');
  const half = s => s.slice(0, Math.ceil(s.length / 2));
  const tail = s => s.slice(Math.floor(s.length / 2));
  let n = (half(A) + tail(b)).replace(/[^A-Za-z?!\-' ]/g, '').trim();
  if (n.length < 3 || n.length > 18) n = 'Chimera';
  return n[0].toUpperCase() + n.slice(1);
}
function spliceGenes(a, b){
  const num = (k, f = 1) => {
    const v = Math.round(((a[k] || 0) + (b[k] || 0)) * f);
    return v > 0 ? Math.min(v, CAPS[k] || 999) : undefined;
  };
  const c = {
    uid: Math.random().toString(36).slice(2),
    id: 'splice', name: spliceName(a.name, b.name), spliced: true,
    cost: clamp(Math.round(((a.cost || 0) + (b.cost || 0)) / 2), CAPS.cost[0], CAPS.cost[1]),
    dmg: num('dmg', .85), aoe: num('aoe', .85), shield: num('shield', .85),
    heal: num('heal'), draw: num('draw'), energy: num('energy'),
    str: num('str'), weak: num('weak'),
  };
  const am = a.multi || 0, bm = b.multi || 0;
  if (am || bm) c.multi = Math.min(CAPS.multi, Math.max(am, bm) + (am && bm ? 1 : 0));
  if (a.type === 'pow' || b.type === 'pow') c.type = 'pow';
  genDesc(c);
  return c;
}
function cardHtml(c, dim){
  return `<div class="card ${c.spliced ? 'spl' : ''} ${dim ? 'dis' : ''}" data-uid="${c.uid || ''}">
    <span class="cost">${c.cost}</span><span class="tag">${c.spliced ? 'SPLICED' : c.type === 'pow' ? 'TRAIT' : c.type === 'atk' ? 'ATK' : 'GENE'}</span>
    <div class="nm">${c.name}</div><div class="fx">${c.desc}</div></div>`;
}

/* ============ SPECIES · your tiny pixel monsters ============ */
/* pixel grids: B=body D=dark L=light W=white K=black A=accent .=empty */
function pixSvg(rows, pal, f = 0, o = {}){
  const blink = Math.sin(f / 11) < -.86;
  const bob = Math.round(Math.sin(f / 7 + (o.ph || 0)) * 1.2);
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  let cells = '';
  rows.forEach((row, y) => {
    const wig = o.wiggle ? Math.round(Math.sin(f / 5 + y * .7) * .8) : 0;
    [...row].forEach((ch, x) => {
      if (ch === '.') return;
      let col = pal[ch] || pal.B;
      if (ch === 'K' && blink) col = pal.B;
      cells += `<rect x="${x + wig}" y="${y}" width="1" height="1" fill="${col}"/>`;
    });
  });
  return `<svg viewBox="-1 -1 ${w + 2} ${h + 2}" width="100%" height="100%" shape-rendering="crispEdges" style="position:absolute;inset:0">
    <g transform="translate(0 ${bob * .5})">${cells}</g></svg>`;
}

function scaleFoe(base, floor, mult = 1){
  const s = 1 + floor * .12;
  return { ...base, mhp: Math.round(base.hp * s * mult), hp: Math.round(base.hp * s * mult),
    atk: Math.round(base.atk * (1 + floor * .08) * mult), str: 0, pi: 0, weak: 0 };
}
function makeParty(floor, kind){
  if (kind === 'boss'){
    const b = BOSSES[(Math.floor(floor / 5) - 1) % BOSSES.length];
    const cycles = Math.floor((Math.floor(floor / 5) - 1) / BOSSES.length);
    return [scaleFoe(b, floor, 1 + cycles * .6)];
  }
  const n = clamp(1 + Math.floor(floor / 3) + (kind === 'elite' ? 1 : 0), 1, floor < 2 ? 1 : 3);
  const pool = FOES.slice(0, clamp(3 + Math.floor(floor / 2), 3, FOES.length));
  const party = [];
  for (let i = 0; i < n; i++) party.push(scaleFoe(pick(pool), floor, (kind === 'elite' ? 1.2 : 1) / (n > 1 ? 1.25 : 1)));
  return party;
}
function foeSvg(foe, f, ph = 0){
  const src = BOSSES.find(b => b.id === foe.id) || FOES.find(x => x.id === foe.id);
  return pixSvg(src.g, src.pal || FPAL, f, { ph });
}

/* ============ MUTATIONS · powerup drops ============ */
const MUTATIONS = [
  () => ({ name: 'Denser Keratin', ic: '⌬', desc: '+1 damage on all attacks', str: 1 }),
  () => ({ name: 'Redundant Organs', ic: '♥', desc: '+5 max HP, every creature', hp: 5 }),
  () => ({ name: 'Chitin Layer', ic: '⛨', desc: '+1 shield every turn', autoShield: 1 }),
  () => ({ name: 'Rapid Mitosis', ic: '♻', desc: 'Heal 3 (whole party) after each battle', healAfter: 3 }),
  () => ({ name: 'Bioluminescence', ic: '◆', desc: '+10% helix from battles', goldMul: .1 }),
  () => ({ name: 'Ambush Instinct', ic: '☄', desc: 'First attack each battle +3', firstHit: 3 }),
  () => ({ name: 'Stem Cells', ic: '♥', desc: 'Heal every creature 8, right now', now: r => r.party.forEach(c => c.hp = Math.min(c.mhp, c.hp + 8)) }),
  () => ({ name: 'Gene Patent', ic: '◆', desc: `Helix, right now`, now: r => { const g = 20 + r.floor * 2; r.helix += g; toast('🧬 +' + g + ' HELIX', 1200); } }),
];
function rollMutations(n = 2){
  const out = [];
  while (out.length < Math.min(n, MUTATIONS.length)){
    const m = pick(MUTATIONS)();
    if (!out.some(x => x.name === m.name)) out.push(m);
  }
  return out;
}
function applyMutation(m){
  if (m.now){ m.now(R); }
  else {
    R.muts.push({ name: m.name, desc: m.desc,
      ...['str', 'hp', 'autoShield', 'healAfter', 'goldMul', 'firstHit'].reduce((o, k) => (m[k] != null && (o[k] = m[k]), o), {}) });
    if (m.hp) R.party.forEach(c => { c.mhp += m.hp; c.hp += m.hp; });
  }
  SFX.mut();
  saveRun();
}
function mutSum(k){ return R.muts.reduce((s, m) => s + (m[k] || 0), 0); }

/* ============ META ============ */
function defaultMeta(){
  return { helix: 0, species: ['blob', 'spike', 'worm'], party: ['blob', 'spike', 'worm'],
    stats: { kills: 0, floors: 0, runs: 0, evolutions: 0, splices: 0, bosses: 0 },
    ladder: 0, bonusHp: 0, bonusHelix: 0, startMut: 0, tips: {}, sound: true };
}
let META = defaultMeta();
function loadMeta(){
  try { META = { ...defaultMeta(), ...JSON.parse(localStorage.getItem('dna-meta') || '{}') }; } catch {}
  META.stats = { ...defaultMeta().stats, ...(META.stats || {}) };
  META.species = META.species && META.species.length ? META.species : ['blob', 'spike', 'worm'];
  META.party = (META.party || []).filter(s => META.species.includes(s));
  while (META.party.length < 3) META.party.push(META.species[META.party.length % META.species.length]);
}
function saveMeta(){ localStorage.setItem('dna-meta', JSON.stringify(META)); }
/* infinite ladder of germline upgrades */
function ladderDef(n){
  const kinds = [
    i => ({ name: `Hardier Germline ${i}`, desc: `+${2 + i} max HP for every creature`, apply: m => m.bonusHp += 2 + i }),
    i => ({ name: `Gene Patents ${i}`, desc: `+${4 * i} helix after every battle`, apply: m => m.bonusHelix += 4 * i }),
    i => ({ name: `Primordial Gift ${i}`, desc: `Start each run with a bonus mutation`, apply: m => m.startMut += 1 }),
  ];
  const i = Math.floor(n / kinds.length) + 1;
  return { cost: Math.round(30 * Math.pow(1.5, n)), ...kinds[n % kinds.length](i) };
}

/* ============ RUN ============ */
let R = null;
function newRun(){
  const party = META.party.slice(0, 3).map((sp, i) => {
    const s = SPECIES[sp];
    const hp = s.hp + META.bonusHp;
    return { sp, hp, mhp: hp, evo: 0, stage: 0, slot: i };
  });
  R = {
    floor: 0, party, helix: 0, muts: [], best: META.stats.floors,
    genome: ['fang', 'fang', 'claw', 'membrane', 'membrane', 'mitosis', 'synapse', 'spore', 'atp']
      .map(mkGene),
  };
  /* every party member contributes its signature gene — build your genome from your zoo */
  party.forEach(c => { const sig = GENES.find(g => g.sig === c.sp); if (sig) R.genome.push(mkGene(sig.id)); });
  for (let i = 0; i < META.startMut; i++) applyMutation(rollMutations(1)[0]);
  META.stats.runs++; saveMeta();
  saveRun();
}
function saveRun(){ localStorage.setItem('dna-run', R ? JSON.stringify(R) : ''); }
function loadRun(){
  try { const r = JSON.parse(localStorage.getItem('dna-run') || 'null'); if (r && r.party && r.party.some(c => c.hp > 0)) R = r; } catch {}
}
function alive(){ return R.party.filter(c => c.hp > 0); }

/* ============ tutorial coach marks ============ */
function tut(id, kick, body, cb){
  META.tips = META.tips || {};
  if (META.tips[id]){ cb && cb(); return; }
  if (document.querySelector('.tutScrim')){ cb && cb(); return; }
  const scrim = el(`<div class="tutScrim"><div class="tutBox">
    <div class="tk">${kick}</div><div class="tb">${body}</div>
    <button class="btn mag">Understood</button></div></div>`);
  document.body.appendChild(scrim);
  scrim.querySelector('button').onclick = e => {
    e.stopPropagation();
    META.tips[id] = 1; saveMeta(); scrim.remove(); cb && cb();
  };
}

/* ============ BATTLE ============ */
let B = null;
function startBattle(kind){
  B = { foes: makeParty(R.floor, kind), kind, hand: [], drawPile: shuffle(R.genome.map(g => ({ ...g }))), discard: [],
    energy: 3, maxEnergy: 3, shield: 0, str: mutSum('str'), autoShield: mutSum('autoShield'),
    firstHit: mutSum('firstHit'), target: 0, turn: 1, over: false, busy: false };
  B.shield = B.autoShield;
  drawGenes(5);
  Music.setBattle(true); Music.start();
  renderBattle();
  setTimeout(() => tut('battle', 'PARTY v PARTY',
    'Each foe shows its <b>INTENT</b>. Attacks hit a random living creature — <b>SHIELD</b> protects everyone. Tap a foe to <b>target</b> it, tap genes to play them. A creature at 0 HP is <b>KO\'d</b> until the battle ends. Lose all three and the branch dies.'), 400);
}
function drawGenes(n){
  for (let i = 0; i < n; i++){
    if (!B.drawPile.length){ B.drawPile = shuffle(B.discard); B.discard = []; if (!B.drawPile.length) return; }
    if (B.hand.length < 10) B.hand.push(B.drawPile.pop());
    else B.discard.push(B.drawPile.pop());
  }
}
function foeIntent(f){
  const kind = f.pat[f.pi % f.pat.length];
  if (kind === 'atk') return `⚔ ATK ${Math.max(1, f.atk + f.str - (f.weak ? 2 : 0))}`;
  return '📈 ANGRIER';
}
function renderBattle(){
  app.innerHTML = '';
  const p = el(`<div class="page">
    ${hudHtml()}
    <span class="kick m">${B.kind === 'boss' ? '☠ APEX PREDATOR' : B.kind === 'elite' ? '🩸 INVASIVE SPECIES' : 'NATURAL SELECTION'} · TURN ${B.turn}</span>
    <div id="foeRow">${B.foes.map((f, i) => `<div class="cell ${f.hp <= 0 ? 'ko' : ''} ${i === B.target ? 'target' : ''}" data-foe="${i}">
      <div class="sprite" data-live="foe" data-foe-i="${i}" data-ph="${i}" style="width:${f.boss ? 74 : 50}px;height:${f.boss ? 74 : 50}px;position:relative"></div>
      <div class="nm">${f.name}</div>
      <div class="hpw foe"><i style="transform:scaleX(${clamp(f.hp / f.mhp, 0, 1)})"></i></div>
      <div style="font-size:8px;color:var(--dim)">${Math.max(0, f.hp)}/${f.mhp}${f.weak ? ' · 💫' : ''}${f.str ? ' · ⚔+' + f.str : ''}</div>
      <div class="intent">${f.hp > 0 ? foeIntent(f) : 'DECOMPOSING'}</div>
    </div>`).join('')}</div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <span class="chip">⛨ SHIELD ${B.shield}</span>
      ${B.str ? `<span class="chip hot">⚔ +${B.str}</span>` : ''}
      ${B.firstHit ? `<span class="chip hot">☄ FIRST +${B.firstHit}</span>` : ''}
    </div>
    <div id="meRow">${partyCells(true)}</div>
    <div id="hand"></div>
    <div id="btm">
      <div id="energy"><b>${B.energy}</b><span>ENERGY</span></div>
      <div style="display:flex;flex-direction:column;justify-content:center;font-size:9px;color:var(--dim);min-width:56px">DRAW ${B.drawPile.length}<br>DISC ${B.discard.length}</div>
      <button class="btn mag" id="bEnd" style="flex:1">End turn</button>
    </div>
  </div>`);
  app.appendChild(p);
  const hand = $('#hand');
  B.hand.forEach((c, i) => {
    const cd = el(cardHtml(c, B.energy < c.cost));
    if (c.dmg && (B.str || B.firstHit)){
      cd.querySelector('.fx').innerHTML = cd.querySelector('.fx').innerHTML
        .replace(`<b>${c.dmg}</b>`, `<b class="hot">${c.dmg + B.str + (B.firstHit || 0)}</b>`);
    }
    cd.onclick = () => playGene(i, cd);
    hand.appendChild(cd);
  });
  p.querySelectorAll('[data-foe]').forEach(fc => fc.onclick = () => {
    const i = +fc.dataset.foe;
    if (B.foes[i].hp <= 0) return;
    B.target = i; SFX.click(); renderBattle();
  });
  $('#bEnd').onclick = endTurn;
  if (!B.hand.some(c => c.cost <= B.energy)) $('#bEnd').classList.add('pulse');
}
function targetFoe(){
  if (B.foes[B.target] && B.foes[B.target].hp > 0) return B.foes[B.target];
  const i = B.foes.findIndex(f => f.hp > 0);
  B.target = Math.max(0, i);
  return B.foes[B.target];
}
function hitFoe(f, n){
  f.hp -= n;
  SFX.hit(); hapt(12);
  const elF = document.querySelector(`[data-foe="${B.foes.indexOf(f)}"]`);
  if (elF){ const r = elF.getBoundingClientRect(); floatN(r.left + r.width / 2, r.top + 10, '-' + n); }
  if (f.hp <= 0){ SFX.ko(); }
}
function playGene(i, cd){
  if (B.over || B.busy) return;
  const c = B.hand[i];
  if (c.cost > B.energy){ toast('NOT ENOUGH ⚡ ENERGY'); return; }
  B.energy -= c.cost;
  B.hand.splice(i, 1);
  if (c.type !== 'pow') B.discard.push(c);
  SFX.play();
  const bonus = B.str + (B.firstHit || 0);
  if (c.dmg){
    const times = c.multi || 1;
    for (let t = 0; t < times; t++){
      const f = targetFoe();
      if (!f) break;
      hitFoe(f, c.dmg + bonus);
    }
    if (B.firstHit) B.firstHit = 0;
  }
  if (c.aoe){
    B.foes.forEach(f => { if (f.hp > 0) f.hp -= c.aoe + B.str; });
    SFX.aoe(); hapt([10, 20, 10]);
    if (B.firstHit) B.firstHit = 0;
  }
  if (c.shield){ B.shield += c.shield; SFX.shield(); }
  if (c.heal){
    const weakest = alive().sort((x, y) => (x.hp / x.mhp) - (y.hp / y.mhp))[0];
    if (weakest){ weakest.hp = Math.min(weakest.mhp, weakest.hp + c.heal); SFX.heal(); }
  }
  if (c.draw) drawGenes(c.draw);
  if (c.energy) B.energy += c.energy;
  if (c.str){ B.str += c.str; }
  if (c.weak){ const f = targetFoe(); if (f) f.weak = Math.max(f.weak, c.weak); }
  if (B.foes.every(f => f.hp <= 0)){ winBattle(); return; }
  renderBattle();
}
function endTurn(){
  if (B.over || B.busy) return;
  B.busy = true;
  let delay = 200;
  B.foes.forEach(f => {
    if (f.hp <= 0) return;
    setTimeout(() => {
      if (B.over) return;
      const kind = f.pat[f.pi % f.pat.length];
      f.pi++;
      if (kind === 'atk'){
        const n = Math.max(1, f.atk + f.str - (f.weak ? 2 : 0));
        if (f.weak) f.weak--;
        const absorbed = Math.min(B.shield, n);
        B.shield -= absorbed;
        const through = n - absorbed;
        if (through > 0){
          const victim = pick(alive());
          if (victim){
            victim.hp -= through;
            SFX.hurt(); hapt(20);
            const cell = document.querySelector(`[data-me="${victim.slot}"]`);
            if (cell){ const r = cell.getBoundingClientRect(); floatN(r.left + r.width / 2, r.top + 8, '-' + through); }
            if (victim.hp <= 0){ SFX.ko(); toast(SPECIES[victim.sp].evo[victim.stage].toUpperCase() + ' IS DOWN. EVOLUTION IS CRUEL.', 1600); }
          }
        } else SFX.shield();
      } else f.str += 1 + Math.floor(R.floor / 8);
      renderBattle();
      if (!alive().length){ loseRun(); return; }
    }, delay);
    delay += 550;
  });
  setTimeout(() => {
    if (B.over || !alive().length) return;
    B.turn++;
    B.discard.push(...B.hand.filter(c => c.type !== 'pow'));
    B.hand = [];
    B.shield = B.autoShield;
    B.energy = B.maxEnergy;
    drawGenes(5);
    saveRun();
    renderBattle();
    B.busy = false;
  }, delay + 250);
}
function winBattle(){
  if (B.over) return;
  B.over = true;
  Music.setBattle(false);
  META.stats.kills += B.foes.length;
  if (B.kind === 'boss') META.stats.bosses++;
  const base = (B.kind === 'boss' ? 45 : B.kind === 'elite' ? 26 : 15) + Math.floor(R.floor * 2);
  const gold = Math.round(base * (1 + mutSum('goldMul'))) + META.bonusHelix;
  R.helix += gold;
  META.helix += Math.floor(gold / 2);
  const heal = mutSum('healAfter');
  if (heal) R.party.forEach(c => { if (c.hp > 0) c.hp = Math.min(c.mhp, c.hp + heal); });
  /* KO'd creatures crawl back at 30% — extinction is for closers */
  R.party.forEach(c => { if (c.hp <= 0) c.hp = Math.max(1, Math.round(c.mhp * .3)); });
  /* EVO: survivors grow */
  const evolved = [];
  R.party.forEach(c => {
    c.evo++;
    const next = EVO_AT[c.stage];
    if (next && c.evo >= next){
      c.stage++;
      c.evo = 0;
      const gain = 8 + c.stage * 4;
      c.mhp += gain; c.hp = Math.min(c.mhp, c.hp + Math.round(c.mhp * .5));
      META.stats.evolutions++;
      evolved.push(c);
    }
  });
  saveMeta(); saveRun();
  stampFx(B.kind === 'boss' ? 'APEX DOWN' : 'SELECTED FOR');
  SFX.win();
  if (evolved.length){
    setTimeout(() => evolutionCeremony(evolved, () => screenReward(gold)), 900);
  } else setTimeout(() => screenReward(gold), 950);
}
function evolutionCeremony(list, cb){
  const c = list.shift();
  if (!c){ cb(); return; }
  const sp = SPECIES[c.sp];
  SFX.evolve(); hapt([30, 40, 60]);
  const o = el(`<div class="evOvl">

      <div class="arrow">➤</div>

    </div>
    <div class="big">${sp.evo[c.stage - 1]} → <span class="z">${sp.evo[c.stage]}</span></div>
    <div class="sub">+${8 + c.stage * 4} max HP · wounds knitted · new pixels grown<br>(${sp.ep})</div>

function screenReward(gold){
  const pool = GENES.filter(g => !g.sig && g.id !== 'fossil' && (R.floor >= 5 || g.early));
  const picks = [];
  while (picks.length < 3){
    const g = pick(pool);
    if (!picks.some(p => p.id === g.id) || Math.random() < .2) picks.push(mkGene(g.id));
  }
  if (R.floor >= 8 && Math.random() < .35) picks[2] = spliceGenes(mkGene(pick(GENES.filter(g => !g.sig)).id), mkGene(pick(GENES.filter(g => !g.sig)).id));
  const muts = (B.kind !== 'fight' || Math.random() < .85) ? rollMutations(2) : null;
  app.innerHTML = '';
  const p = el(`<div class="page">
    ${hudHtml()}
    <div class="helix"></div>
    <span class="kick">SELECTED FOR · +${gold} 🧬 HELIX${muts ? ' · MUTATION EVENT' : ''}</span>
    ${muts ? `<div id="mutRow">${muts.map((m, i) => `<div class="row pow" data-m="${i}">
      <div><div class="an" style="color:var(--m)">${m.ic} ${m.name}</div><div class="ap">${m.desc}</div></div><div class="tick">MUTATE ▸</div></div>`).join('')}</div>` : ''}
    <div class="big">Sequence a <span class="z">gene</span></div>
    <div id="hand">${picks.map((c, i) => `<div data-i="${i}">${cardHtml(c)}</div>`).join('')}</div>
    <button class="btn ghost" id="bSkip">Skip — lean genome</button>
  </div>`);
  app.appendChild(p);
  let mutTaken = !muts;
  const takeMut = m => {
    if (mutTaken) return;
    mutTaken = true;
    applyMutation(m);
    toast('⌬ ' + m.name.toUpperCase() + ' · EXPRESSED', 1500);
    const row = $('#mutRow'); if (row) row.remove();
  };
  if (muts) p.querySelectorAll('.pow').forEach(dv => dv.onclick = () => takeMut(muts[+dv.dataset.m]));
  const autoMut = () => { if (!mutTaken){ const m = pick(muts); takeMut(m); } };
  p.querySelectorAll('#hand > [data-i]').forEach(dv => dv.onclick = () => {
    autoMut();
    const c = picks[+dv.dataset.i];
    R.genome.push(c);
    saveRun();
    toast('+ ' + c.name.toUpperCase() + ' · GENOME ' + R.genome.length, 1300);
    screenMap();
  });
  $('#bSkip').onclick = () => { autoMut(); saveRun(); screenMap(); };
  tut('reward', 'INHERITANCE', 'Grab a <b>mutation</b> when one appears — they stack for the whole run. Then sequence <b>one gene</b> into the genome, or skip: <b>lean genomes</b> draw their best genes more often.');
}

  }
  $('#bC').onclick = e => buy(cardCost, () => { R.genome.push(card); toast('+ ' + card.name.toUpperCase()); }, e.target);
  $('#bM').onclick = e => buy(mutCost, () => { applyMutation(mut); toast('⌬ ' + mut.name.toUpperCase()); }, e.target);
  $('#bH').onclick = e => buy(healCost, () => { R.party.forEach(c => c.hp = Math.min(c.mhp, c.hp + 15)); SFX.heal(); }, e.target);
  $('#bGo').onclick = screenMap;
  refreshHud();
}
function loseRun(){
  if (B) B.over = true;
  Music.setBattle(false);
  SFX.death(); hapt([60, 40, 120]);
  const byAsteroid = !!(B && B.foes.some(f => f.id === 'asteroid'));
  const floor = R.floor;
  const newBest = floor >= (R.best || 0) && floor > 0;
  const earned = 12 + floor * 5;
  META.helix += earned;
  saveMeta();
  R = null; saveRun();
  stampFx(byAsteroid ? 'EXTINCT' : 'DESELECTED');
  app.innerHTML = '';
  const p = el(`<div class="page" style="justify-content:center;text-align:center;gap:14px">
    <span class="kick m">${byAsteroid ? 'THE ASTEROID SENDS ITS REGARDS' : newBest ? '★ DEEPEST BRANCH YET ★' : 'SURVIVAL OF THE FITTER, APPARENTLY'}</span>
    <div class="big">Lineage <span class="z">ended</span></div>
    <div class="helix"></div>
    <div class="sub">The branch died on floor ${floor}.<br>+${earned} 🧬 helix fossilized into the germline</div>
    <div class="sub">${pick(['Evolution keeps the receipts.', 'The soup will try again.', '99.9% of all species are extinct. You\'re in excellent company.', 'Somewhere, a crab survives. It is always the crab.'])}</div>
    <button class="btn mag" id="bAgain">Speciate again</button>
    <button class="btn ${META.helix >= ladderDef(META.ladder).cost ? 'claimable' : ''}" id="bLad">🧬 Germline · spend ${META.helix}</button>
    <button class="btn ghost" id="bTitle">Title</button>
  </div>`);
  app.appendChild(p);
  $('#bAgain').onclick = () => { newRun(); screenMap(); };
  $('#bLad').onclick = screenLadder;
  $('#bTitle').onclick = screenTitle;
}
/* ---------- meta screens ---------- */
function screenZoo(){
  app.innerHTML = '';
  const p = el(`<div class="page">
    <span class="kick">THE ZOO · UNLOCK SPECIES · PICK YOUR PARTY OF 3</span>
    <div class="big">The <span class="z">Zoo</span></div>
    <div class="sub">🧬 ${META.helix} banked. Party members bring their <b style="color:var(--m)">signature gene</b> into every genome.</div>
    <div class="helix"></div>
    ${Object.entries(SPECIES).map(([id, s]) => {
      const owned = META.species.includes(id);
      const inParty = META.party.includes(id);
      const sig = GENES.find(g => g.sig === id);
      return `<div class="row" style="gap:10px">
        <div class="sprite" data-live="sp" data-sp="${id}" data-st="${owned ? 1 : 0}" style="width:52px;height:52px;position:relative;flex-shrink:0;${owned ? '' : 'filter:grayscale(1) brightness(.5)'}"></div>
        <div style="flex:1"><div class="an">${s.name}${inParty ? ' <span style="color:var(--m)">· IN PARTY</span>' : ''}</div>
        <div class="ap">(${s.ep}) HP ${s.hp} · sig: ${sig ? sig.name : '—'}</div></div>
        <button class="btn slim ${owned && !inParty ? 'mag' : ''}" style="width:auto" data-id="${id}"
          ${(!owned && META.helix < s.cost) ? 'disabled' : ''}>${owned ? (inParty ? 'OUT' : 'IN') : '🧬 ' + s.cost}</button>
      </div>`;
    }).join('')}
    <div class="sub" style="text-align:center">party: ${META.party.map(s => SPECIES[s].name).join(' · ')}</div>
    <button class="btn ghost" id="bBack">Back</button>
  </div>`);
  app.appendChild(p);
  p.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
    const id = b.dataset.id, s = SPECIES[id];
    if (!META.species.includes(id)){
      if (META.helix < s.cost) return;
      META.helix -= s.cost;
      META.species.push(id);
      if (META.party.length >= 3) META.party.shift();
      META.party.push(id);
      toast('🧬 ' + s.name.toUpperCase() + ' JOINS THE GENE POOL — AND THE PARTY', 1800);
      SFX.evolve();
    } else if (META.party.includes(id)){
      if (META.party.length <= 1){ toast('THE PARTY NEEDS AT LEAST ONE ORGANISM.'); return; }
      META.party = META.party.filter(x => x !== id);
    } else {
      if (META.party.length >= 3) META.party.shift();
      META.party.push(id);
      SFX.click();
    }
    saveMeta(); screenZoo();
  });
  $('#bBack').onclick = screenTitle;
}
function screenLadder(){
  app.innerHTML = '';
  const n = META.ladder;
  const items = [ladderDef(n), ladderDef(n + 1), ladderDef(n + 2)];
  const p = el(`<div class="page">
    <span class="kick">GERMLINE ENGINEERING · HERITABLE · INFINITE</span>
    <div class="big">Germ<span class="z">line</span></div>
    <div class="sub">🧬 ${META.helix} banked · ${n} upgrades expressed. These pass to every future lineage.</div>
    <div class="helix"></div>
    ${items.map((u, i) => `<div class="row"><div><div class="an">${u.name}</div><div class="ap">${u.desc}</div></div>
      <button class="btn slim ${i === 0 ? 'mag' : ''}" style="width:auto" data-i="${i}" ${i > 0 || META.helix < u.cost ? 'disabled' : ''}>🧬 ${u.cost}</button></div>`).join('')}
    <div class="sub">claim in order · the ladder is infinite · so is biology</div>
    <button class="btn ghost" id="bBack">Back</button>
  </div>`);
  app.appendChild(p);
  p.querySelector('[data-i="0"]').onclick = () => {
    const u = ladderDef(META.ladder);
    if (META.helix < u.cost) return;
    META.helix -= u.cost;
    u.apply(META);
    META.ladder++;
    saveMeta(); SFX.evolve();
    toast('GERMLINE EDIT: ' + u.name.toUpperCase(), 1600);
    screenLadder();
  };
  $('#bBack').onclick = screenTitle;
}
function screenStats(){
  app.innerHTML = '';
  const s = META.stats;
  const row = (k, v) => `<div class="row"><div class="an">${k}</div><div class="tick">${v}</div></div>`;
  const p = el(`<div class="page">
    <span class="kick">THE FOSSIL RECORD · IT REMEMBERS EVERYTHING</span>
    <div class="big">Fossil <span class="z">Record</span></div>
    <div class="helix"></div>
    ${row('Lineages started', s.runs)}
    ${row('Deepest floor', s.floors)}
    ${row('Rivals outcompeted', s.kills)}
    ${row('Apex predators toppled', s.bosses)}
    ${row('Evolutions witnessed', s.evolutions)}
    ${row('Genes spliced', s.splices)}
    ${row('🧬 helix banked', META.helix)}
    ${row('Germline upgrades', META.ladder)}
    ${row('Species in the zoo', META.species.length + '/' + Object.keys(SPECIES).length)}
    <button class="btn ghost" id="bBack">Back</button>
  </div>`);
  app.appendChild(p);
  $('#bBack').onclick = screenTitle;
}

/* ---------- live sprite ticker + quips ---------- */
let TICK_F = 0;
setInterval(() => {
  TICK_F++;
  document.querySelectorAll('[data-live="sp"]').forEach(d => {
    d.innerHTML = pixSvg(SPECIES[d.dataset.sp].g[+d.dataset.st], SPECIES[d.dataset.sp].pal, TICK_F,
      { wiggle: SPECIES[d.dataset.sp].wiggle, ph: +(d.dataset.ph || 0) });
  });
  document.querySelectorAll('[data-live="foe"]').forEach(d => {
    if (!B) return;
    const f = B.foes[+d.dataset.foeI];
    if (f) d.innerHTML = foeSvg(f, TICK_F, +(d.dataset.ph || 0));
  });
}, 120);
setInterval(() => {
  if (!B || B.over) return;
  const living = B.foes.filter(f => f.hp > 0 && QUIPS[f.id]);
  if (!living.length || Math.random() > .4) return;
  const f = pick(living);
  const cell = document.querySelector(`[data-foe="${B.foes.indexOf(f)}"]`);
  if (!cell || cell.querySelector('.quip')) return;
  const q = el(`<div class="quip">${pick(QUIPS[f.id])}</div>`);
  cell.appendChild(q);
  setTimeout(() => q.remove(), 2100);
}, 3600);

/* ---------- boot ---------- */
loadMeta();
loadRun();
screenTitle();
window.DB = { META, R: () => R, B: () => B, newRun, startBattle, playGene, endTurn, spliceGenes, mkGene,
  screenMap, screenTitle, screenReward, screenZoo, screenLadder, screenStats, screenPond, screenSplice, screenMarket,
  SPECIES, GENES, FOES, BOSSES, MUTATIONS, rollMutations, applyMutation, mutSum, ladderDef, pixSvg, makeParty, alive, EVO_AT };   /* test hook */
</script>
