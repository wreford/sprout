<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>DNA Battles · party-based evolution deckbuilder</title>
<meta name="theme-color" content="#04120a">
<style>
:root{ --bg:#0e100f; --pan:#1a1d1b; --g:#57e694; --m:#f272b6; --w:#e9ece9; --dim:#8b928d;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--w);font-family:var(--mono);overflow-x:hidden;
  background-image:radial-gradient(ellipse at 50% -10%,#1c201d 0%,transparent 60%)}
#app{max-width:640px;margin:0 auto;min-height:100dvh;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px)}
.page{display:flex;flex-direction:column;gap:12px;min-height:calc(100dvh - 40px);animation:pgIn .3s ease}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.kick{font-weight:700;font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;opacity:.9}
.kick.m{color:var(--m)}
h1{font-size:clamp(30px,9vw,52px);line-height:1;letter-spacing:.02em;text-transform:uppercase;font-weight:700}
h1 .z{color:var(--g)} h1 .x{color:var(--m)}
.big{font-size:clamp(21px,6vw,30px);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.big .z{color:var(--g)}
.sub{font-size:12px;line-height:1.65;color:var(--dim)}
.helix{height:8px;background:repeating-linear-gradient(90deg,var(--g) 0 8px,transparent 8px 20px,var(--m) 20px 28px,transparent 28px 40px);opacity:.25;border-radius:4px}
.btn{display:block;width:100%;padding:14px 18px;border:none;border-radius:12px;background:#e9ece9;color:#141614;
  font-family:var(--mono);font-weight:700;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;min-height:52px}
.btn:active{transform:scale(.98)}
.btn.mag{background:var(--g);color:#0b2416}
.btn.ghost{background:#ffffff0c;color:var(--w)}
.btn.ghost.mag{background:#f272b614;color:var(--m)}
.btn:disabled{opacity:.35}
.btn.slim{min-height:38px;padding:7px 12px;font-size:11px}
.chip{background:#ffffff0e;border-radius:20px;padding:.35em .8em;font-size:9.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;color:var(--dim)}
.chip.hot{background:#f272b61c;color:var(--m)}
.pill{background:#ffffff0a;border-radius:20px;padding:.4em .85em;font-weight:700;font-size:10.5px;white-space:nowrap;color:var(--dim)}
.pill b{color:var(--w)}
#hud{display:flex;gap:6px;flex-wrap:wrap}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px;margin:0 auto}
.mbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:8px;font-size:12px;line-height:1.1}
.mbtn small{font-size:8px;letter-spacing:.12em;opacity:.6;text-transform:uppercase}
.mbtn.claimable{border-color:var(--m);animation:clPulse 1.6s ease-in-out infinite}
@keyframes clPulse{0%,100%{box-shadow:0 0 0 0 #ff3db000}50%{box-shadow:0 0 0 4px #ff3db066}}

.cell{border-radius:14px;background:var(--pan);padding:9px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.cell.ko{filter:grayscale(1) brightness(.5)}
.cell.target{box-shadow:0 0 0 2px var(--m)}
.cell .nm{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:center;color:var(--dim)}
.cell .hpw{width:100%;height:6px;background:#04110a;border-radius:4px;position:relative;overflow:hidden}
.cell .hpw i{position:absolute;inset:0;background:var(--g);transform-origin:left;border-radius:4px;transition:transform .3s}
.cell .hpw.foe i{background:var(--m)}
.cell .evw{width:60%;height:3px;background:#04110a;border-radius:3px;overflow:hidden}
.cell .evw i{display:block;height:100%;background:var(--m);border-radius:3px;transition:width .4s}
.cell .intent{font-size:9px;color:var(--m);font-weight:700;text-align:center;min-height:11px}
.sprite{position:relative}
.sprite svg{display:block;image-rendering:pixelated}
#foeRow,#meRow{display:grid;gap:6px}
#foeRow{grid-template-columns:repeat(auto-fill,minmax(62px,1fr))}
#meRow{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
.cell.bossCell{grid-column:span 2}
.quip{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--w);color:#03170b;
  font-size:8.5px;font-weight:700;padding:3px 7px;white-space:nowrap;z-index:5;animation:qIn .25s ease;border-radius:2px}
.quip::after{content:'';position:absolute;bottom:-4px;left:50%;border:4px solid transparent;border-top-color:var(--w);border-bottom:0}
@keyframes qIn{from{opacity:0;transform:translateX(-50%) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}

#hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{border-radius:12px;background:var(--pan);padding:8px 9px;cursor:pointer;position:relative;min-height:82px;animation:cdIn .25s ease both}
.card:active{transform:scale(.96)}
@keyframes cdIn{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.card .cost{position:absolute;top:6px;left:8px;background:var(--g);color:#062b16;font-weight:700;font-size:10.5px;padding:1px 7px;border-radius:10px}
.card .tag{position:absolute;top:7px;right:8px;color:#57e69466;font-size:7px;font-weight:700;letter-spacing:.08em}
.card.spl .tag{color:#f272b688}
.card .nm{font-weight:700;font-size:10.5px;text-transform:uppercase;margin-top:20px;letter-spacing:.02em;line-height:1.25}
.card .fx{font-size:9px;color:var(--dim);margin-top:4px;line-height:1.55}
.card .fx b{color:var(--g)} .card .fx b.hot{color:var(--m)}
.card.dis{opacity:.4}
.card.sel{box-shadow:0 0 0 2px var(--m)}
.card.spl{background:#2b1322}

.door{border-radius:14px;background:var(--pan);padding:15px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.door:active{transform:scale(.98)}
.door.hot{background:#2b1322}
.door .dn{font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.03em}
.door.hot .dn{color:var(--m)}
.door .dd{font-size:10px;color:var(--dim);margin-top:3px}
.door .ic{font-size:19px;opacity:.8}

#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%) translateY(-90px);background:var(--g);color:#03170b;
  font-weight:700;font-size:10.5px;letter-spacing:.05em;padding:9px 14px;z-index:80;transition:transform .3s cubic-bezier(.2,1.4,.4,1);max-width:92vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
.stamp{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-7deg) scale(3);opacity:0;z-index:70;
  border:4px solid var(--m);color:var(--m);background:#04120aee;font-weight:700;font-size:30px;letter-spacing:.1em;padding:8px 22px;text-transform:uppercase;pointer-events:none}
.stamp.on{animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stampIn{to{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1)}}
.ovl{position:fixed;inset:0;background:#04120af5;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center;overflow-y:auto}
.tutScrim{position:fixed;inset:0;background:#04120acc;z-index:75;display:flex;align-items:flex-end;justify-content:center;padding:20px}
.tutBox{background:var(--pan);border-radius:16px;padding:18px;max-width:420px;width:100%}
.tutBox .tk{color:var(--g);font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.tutBox .tb{font-size:12px;line-height:1.65;color:var(--w);margin:8px 0 4px}
.tutBox .tb b{color:var(--m)}
.row{border-radius:12px;background:var(--pan);padding:11px 13px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.row .an{font-weight:700;font-size:12px;text-transform:uppercase}
.row .ap{font-size:9.5px;color:var(--dim);margin-top:2px;line-height:1.5}
.row .tick{font-weight:700;color:var(--m);font-size:11px;white-space:nowrap}
.row.pow{background:#2b1322;cursor:pointer;animation:cdIn .3s ease both}
.floatN{position:fixed;font-weight:700;font-size:20px;color:var(--m);z-index:66;pointer-events:none;animation:fl 1s ease forwards}
@keyframes fl{to{transform:translateY(-46px);opacity:0}}
#btm{display:flex;gap:8px;align-items:stretch;position:sticky;bottom:8px}
#energy{border-radius:12px;min-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--pan)}
#energy b{font-size:22px;color:var(--g)} #energy span{font-size:7.5px;letter-spacing:.14em;color:var(--dim)}
.pulse{animation:puls 1.1s ease-in-out infinite}
@keyframes puls{0%,100%{box-shadow:0 0 0 0 #3dff7c00}50%{box-shadow:0 0 0 5px #3dff7c55}}
.evOvl{position:fixed;inset:0;z-index:72;background:#04120af8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.evOvl .arrow{color:var(--m);font-size:26px;animation:puls 1s infinite}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>

const $ = s => document.querySelector(s);
const el = h => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const app = $('#app');
let toastT = null;
function toast(msg, ms = 1600){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
function stampFx(txt){
  const s = el(`<div class="stamp">${txt}</div>`);
  document.body.appendChild(s);
  requestAnimationFrame(() => s.classList.add('on'));
  setTimeout(() => s.remove(), 1300);
}
function floatN(x, y, txt){
  const f = el(`<div class="floatN" style="left:${x}px;top:${y}px">${txt}</div>`);
  document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
}
function hapt(p){ try { navigator.vibrate && navigator.vibrate(p); } catch {} }

let ACTX = null, AMASTER = null;
function audio(){
  if (ACTX) return ACTX;
  ACTX = new (window.AudioContext || window.webkitAudioContext)();
  AMASTER = ACTX.createGain(); AMASTER.gain.value = .55;
  const lp = ACTX.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6800; lp.Q.value = .3;
  const comp = ACTX.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 5;
  
  const dly = ACTX.createDelay(1); dly.delayTime.value = .27;
  const fb = ACTX.createGain(); fb.gain.value = .4;
  const damp = ACTX.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 2400;
  const wet = ACTX.createGain(); wet.gain.value = .32;
  AMASTER.connect(lp); lp.connect(comp); comp.connect(ACTX.destination);
  AMASTER.connect(dly); dly.connect(damp); damp.connect(fb); fb.connect(dly); damp.connect(wet); wet.connect(lp);
  return ACTX;
}
function tone(f, dur = .5, vol = .12, type = 'sine', delay = 0, det = 0, atk = .03){
  try {
    audio();
    const t = ACTX.currentTime + delay;
    const o = ACTX.createOscillator(), g = ACTX.createGain();
    o.type = type; o.frequency.value = f;
    if (det) o.detune.value = det;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + atk);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AMASTER); o.start(t); o.stop(t + dur + .1);
  } catch {}
}

function bell(f, dur = 1.1, vol = .11, delay = 0){
  tone(f, dur, vol, 'sine', delay, 0, .008);
  tone(f * 2, dur * .6, vol * .32, 'sine', delay, 4, .008);
  tone(f * 2.99, dur * .32, vol * .12, 'sine', delay, -6, .008);
}

function glide(f0, f1, dur = .5, vol = .12, delay = 0, type = 'sine'){
  try {
    audio();
    const t = ACTX.currentTime + delay;
    const o = ACTX.createOscillator(), g = ACTX.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur * .8);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .04);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AMASTER); o.start(t); o.stop(t + dur + .1);
  } catch {}
}
const PENTA = [392, 440, 523, 587, 659, 784, 880, 1046, 1174, 1318];
const SFX = {
  click(){ bell(1046, .35, .05); },
  play(){ bell(659, .5, .08); bell(880, .45, .05, .05); },
  hit(){ glide(170, 82, .3, .16); bell(392, .3, .04, .02); },
  aoe(){ [150, 128, 108].forEach((f, i) => glide(f * 1.4, f * .7, .3, .12, i * .07)); bell(330, .5, .05, .1); },
  shield(){ tone(233, .7, .1, 'triangle', 0, 0, .06); bell(466, .6, .045, .04); },
  heal(){ [523, 659, 784].forEach((f, i) => bell(f, .9, .07, i * .09)); },
  hurt(){ glide(233, 116, .35, .13); },
  ko(){ glide(330, 82, .8, .12); bell(165, 1, .07, .15); },
  win(){ [523, 659, 784, 1046].forEach((f, i) => bell(f, 1, .09, i * .11)); },
  evolve(){ [392, 440, 523, 587, 659, 784, 880, 1046].forEach((f, i) => bell(f, 1.2, .07, i * .07)); },
  splice(){ glide(392, 523, .7, .1); glide(700, 523, .7, .1, .05); bell(523, 1.4, .1, .6); bell(1046, 1, .05, .68); },
  helix(){ bell(1318, .5, .05); bell(1568, .6, .045, .07); },
  death(){ [392, 330, 262, 196].forEach((f, i) => bell(f, 1.6, .09, i * .33)); },
  mut(){ bell(587, .6, .07); bell(880, .7, .055, .1); },
};

const Music = (() => {
  let on = false, timer = null, step = 0, battle = false;
  const CHORDS = [
    [131, 196, 262, 330],   
    [110, 165, 262, 330],   
    [147, 220, 294, 349],   
    [98, 147, 247, 294],    
  ];
  function bar(){
    const ch = CHORDS[step % CHORDS.length];
    ch.forEach(f => {
      tone(f, 3.6, battle ? .028 : .035, 'sine', 0, 0, .9);
      tone(f, 3.6, .018, 'triangle', 0, 7, 1.1);
    });
    
    const drops = battle ? 3 : 2;
    for (let i = 0; i < drops; i++){
      if (Math.random() < .85) bell(pick(PENTA) * (battle ? 1 : .5), 1.6, battle ? .04 : .032, .3 + Math.random() * 2.6);
    }
    if (battle) [0, 1.7].forEach(d => tone(65, .5, .07, 'sine', d, 0, .05));
    step++;
  }
  return {
    start(){ if (on) return; on = true; audio(); bar(); timer = setInterval(bar, 3400); },
    stop(){ on = false; clearInterval(timer); },
    toggle(){ on ? this.stop() : this.start(); META.sound = on; saveMeta(); return on; },
    on: () => on,
    setBattle(v){ battle = v; },
  };
})();
document.addEventListener('pointerdown', function boot(){
  audio();
  if (META.sound !== false) Music.start();
  document.removeEventListener('pointerdown', boot);
}, { once: true });

const CAPS = { dmg: 999, aoe: 400, shield: 999, heal: 80, draw: 5, energy: 4, str: 9, weak: 3, multi: 8, cost: [0, 4] };
const GENES = [
  { id: 'fang', name: 'Fang Gene', cost: 1, dmg: 6, early: 1 },
  { id: 'claw', name: 'Claw Gene', cost: 0, dmg: 3, early: 1 },
  { id: 'pounce', name: 'Pounce Reflex', cost: 2, dmg: 9, early: 1 },
  { id: 'venom', name: 'Venom Sac', cost: 1, dmg: 4, weak: 1, early: 1 },
  { id: 'swarm', name: 'Swarm Logic', cost: 1, dmg: 2, multi: 3, early: 1 },
  { id: 'apex', name: 'Apex Instinct', cost: 3, dmg: 14 },
  { id: 'membrane', name: 'Membrane', cost: 1, shield: 6, early: 1 },
  { id: 'carapace', name: 'Carapace', cost: 2, shield: 11, early: 1 },
  { id: 'camo', name: 'Camouflage', cost: 1, shield: 4, draw: 1, early: 1 },
  { id: 'mitosis', name: 'Mitosis', cost: 1, heal: 7, early: 1 },
  { id: 'photo', name: 'Photosynthesis', cost: 0, heal: 3, early: 1 },
  { id: 'synapse', name: 'Synapse Fire', cost: 1, draw: 2, early: 1 },
  { id: 'atp', name: 'ATP Surge', cost: 0, energy: 2, early: 1 },
  { id: 'helixloop', name: 'Helix Loop', cost: 0, draw: 1, energy: 1 },
  { id: 'adrenal', name: 'Adrenal Gland', cost: 1, str: 2, type: 'pow', early: 1 },
  { id: 'spore', name: 'Spore Cloud', cost: 1, aoe: 4, early: 1 },
  { id: 'acid', name: 'Acid Rain', cost: 2, aoe: 7 },
  { id: 'pheromone', name: 'Pheromones', cost: 0, weak: 2, early: 1 },
  { id: 'ooze', name: 'Primordial Ooze', cost: 1, aoe: 3, shield: 3 },
  { id: 'tail', name: 'Detachable Tail', cost: 0, shield: 3, early: 1 },
  { id: 'gills', name: 'Vestigial Gills', cost: 1, heal: 4, draw: 1 },
  { id: 'thumbs', name: 'Opposable Thumbs', cost: 1, dmg: 5, draw: 1 },
  { id: 'fossil', name: 'Fossil', cost: 0, desc: 'Does nothing. It remembers when this was all ocean.' },
  { id: 'junk', name: 'Junk DNA', cost: 0, draw: 1, desc0: '98% of the genome. Probably fine.' },
  
  { id: 'sig-blob', name: 'Split in Two', cost: 1, heal: 5, shield: 5, sig: 'blob' },
  { id: 'sig-spike', name: 'Quill Volley', cost: 1, aoe: 5, sig: 'spike' },
  { id: 'sig-worm', name: 'Regenerate', cost: 1, heal: 11, sig: 'worm' },
  { id: 'sig-crab', name: 'Carcinize', cost: 1, dmg: 7, shield: 4, sig: 'crab' },
  { id: 'sig-zap', name: 'Bioelectric Bolt', cost: 2, dmg: 11, sig: 'zap' },
  { id: 'sig-eye', name: 'The Gaze', cost: 0, weak: 2, draw: 1, sig: 'eye' },
  { id: 'sig-fungus', name: 'Mycelium Network', cost: 1, aoe: 4, heal: 4, sig: 'fungus' },
  { id: 'sig-tardi', name: 'Cryptobiosis', cost: 2, shield: 13, heal: 6, sig: 'tardi' },
];
function mkGene(id){
  const g = GENES.find(x => x.id === id);
  const c = { ...g, uid: Math.random().toString(36).slice(2) };
  genDesc(c);
  return c;
}
function genDesc(c){
  const bits = [];
  if (c.dmg) bits.push(`Deal <b>${c.dmg}</b>${c.multi ? ` × <b>${c.multi}</b>` : ''}.`);
  else if (c.multi) bits.push(`Hit × <b>${c.multi}</b>.`);
  if (c.aoe) bits.push(`<b class="hot">${c.aoe} to ALL</b> foes.`);
  if (c.shield) bits.push(`Shield <b>${c.shield}</b>.`);
  if (c.heal) bits.push(`Heal <b>${c.heal}</b> (weakest).`);
  if (c.draw) bits.push(`Draw ${c.draw}.`);
  if (c.energy) bits.push(`+<b>${c.energy}</b> ⚡.`);
  if (c.str) bits.push(`<b>Trait:</b> +${c.str} dmg all battle.`);
  if (c.weak) bits.push(`Target −2 atk, ${c.weak} turn${c.weak > 1 ? 's' : ''}.`);
  c.desc = bits.join(' ') || c.desc || c.desc0 || 'A gene of mystery.';
  c.type = c.type || (c.dmg || c.aoe || c.multi ? 'atk' : 'skl');
  return c;
}
GENES.forEach(genDesc);

function spliceName(a, b){
  const A = a.replace(/ (Gene|Sac|Cloud|Rain|Logic|Fire|Surge|Gland|Loop|Reflex|Volley|Network|Bolt)$/i, '');
  const half = s => s.slice(0, Math.ceil(s.length / 2));
  const tail = s => s.slice(Math.floor(s.length / 2));
  let n = (half(A) + tail(b)).replace(/[^A-Za-z?!\-' ]/g, '').trim();
  if (n.length < 3 || n.length > 18) n = 'Chimera';
  return n[0].toUpperCase() + n.slice(1);
}
function spliceGenes(a, b){
  const num = (k, f = 1) => {
    const v = Math.round(((a[k] || 0) + (b[k] || 0)) * f);
    return v > 0 ? Math.min(v, CAPS[k] || 999) : undefined;
  };
  const c = {
    uid: Math.random().toString(36).slice(2),
    id: 'splice', name: spliceName(a.name, b.name), spliced: true,
    cost: clamp(Math.round(((a.cost || 0) + (b.cost || 0)) / 2), CAPS.cost[0], CAPS.cost[1]),
    dmg: num('dmg', .85), aoe: num('aoe', .85), shield: num('shield', .85),
    heal: num('heal'), draw: num('draw'), energy: num('energy'),
    str: num('str'), weak: num('weak'),
  };
  const am = a.multi || 0, bm = b.multi || 0;
  if (am || bm) c.multi = Math.min(CAPS.multi, Math.max(am, bm) + (am && bm ? 1 : 0));
  if (a.type === 'pow' || b.type === 'pow') c.type = 'pow';

function pixSvg(rows, pal, f = 0, o = {}){
  const blink = Math.sin(f / 11) < -.86;
  const bob = Math.round(Math.sin(f / 7 + (o.ph || 0)) * 1.2);
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  let cells = '';
  rows.forEach((row, y) => {
    const wig = o.wiggle ? Math.round(Math.sin(f / 5 + y * .7) * .8) : 0;
    [...row].forEach((ch, x) => {
      if (ch === '.') return;
      let col = pal[ch] || pal.B;
      if (ch === 'K' && blink) col = pal.B;
      cells += `<rect x="${x + wig}" y="${y}" width="1" height="1" fill="${col}"/>`;
    });
  });
  return `<svg viewBox="-1 -1 ${w + 2} ${h + 2}" width="100%" height="100%" shape-rendering="crispEdges" style="position:absolute;inset:0">
    <g transform="translate(0 ${bob * .5})">${cells}</g></svg>`;
}

function scaleFoe(base, floor, mult = 1){
  const s = 1 + floor * .12;
  return { ...base, mhp: Math.round(base.hp * s * mult), hp: Math.round(base.hp * s * mult),
    atk: Math.round(base.atk * (1 + floor * .08) * mult), str: 0, pi: 0, weak: 0 };
}
function makeParty(floor, kind){
  if (kind === 'boss'){
    const b = BOSSES[(Math.floor(floor / 5) - 1) % BOSSES.length];
    const cycles = Math.floor((Math.floor(floor / 5) - 1) / BOSSES.length);
    const out = [scaleFoe(b, floor, 1 + cycles * .6)];
    
    const minions = clamp(Math.floor(floor / 5) - 1, 0, 4);
    const pool = FOES.slice(0, clamp(3 + Math.floor(floor / 2), 3, FOES.length));
    for (let i = 0; i < minions; i++) out.push(scaleFoe(pick(pool), floor, .35));
    return out;
  }
  
  const n = clamp(2 + Math.floor(floor * .8) + (kind === 'elite' ? 1 : 0), 2, PARTY_N);
  const pool = FOES.slice(0, clamp(3 + Math.floor(floor / 2), 3, FOES.length));
  const dil = 1 / (1 + (n - 1) * .16);
  const party = [];
  for (let i = 0; i < n; i++) party.push(scaleFoe(pick(pool), floor, (kind === 'elite' ? 1.25 : 1) * dil));
  return party;
}

  () => ({ name: 'Denser Keratin', ic: '⌬', desc: '+1 damage on all attacks', str: 1 }),
  () => ({ name: 'Redundant Organs', ic: '♥', desc: '+5 max HP, every creature', hp: 5 }),

  () => ({ name: 'Bioluminescence', ic: '◆', desc: '+10% helix from battles', goldMul: .1 }),

  () => ({ name: 'Stem Cells', ic: '♥', desc: 'Heal every creature 8, right now', now: r => r.party.forEach(c => c.hp = Math.min(c.mhp, c.hp + 8)) }),

function rollMutations(n = 2){
  const out = [];
  while (out.length < Math.min(n, MUTATIONS.length)){
    const m = pick(MUTATIONS)();
    if (!out.some(x => x.name === m.name)) out.push(m);
  }
  return out;
}
function applyMutation(m){
  if (m.now){ m.now(R); }
  else {
    R.muts.push({ name: m.name, desc: m.desc,
      ...['str', 'hp', 'autoShield', 'healAfter', 'goldMul', 'firstHit'].reduce((o, k) => (m[k] != null && (o[k] = m[k]), o), {}) });
    if (m.hp) R.party.forEach(c => { c.mhp += m.hp; c.hp += m.hp; });
  }
  SFX.mut();
  saveRun();
}
function mutSum(k){ return R.muts.reduce((s, m) => s + (m[k] || 0), 0); }

function ladderDef(n){
  const kinds = [

    i => ({ name: `Primordial Gift ${i}`, desc: `Start each run with a bonus mutation`, apply: m => m.startMut += 1 }),
  ];
  const i = Math.floor(n / kinds.length) + 1;
  return { cost: Math.round(30 * Math.pow(1.5, n)), ...kinds[n % kinds.length](i) };
}

let B = null;
function startBattle(kind){

function drawGenes(n){

    if (B.hand.length < 10) B.hand.push(B.drawPile.pop());

function foeIntent(f){

function renderBattle(){

function targetFoe(){
  if (B.foes[B.target] && B.foes[B.target].hp > 0) return B.foes[B.target];
  const i = B.foes.findIndex(f => f.hp > 0);
  B.target = Math.max(0, i);
  return B.foes[B.target];
}
function hitFoe(f, n){
  f.hp -= n;
  SFX.hit(); hapt(12);
  const elF = document.querySelector(`[data-foe="${B.foes.indexOf(f)}"]`);
  if (elF){ const r = elF.getBoundingClientRect(); floatN(r.left + r.width / 2, r.top + 10, '-' + n); }
  if (f.hp <= 0){ SFX.ko(); }
}
function playGene(i, cd){
  if (B.over || B.busy) return;
  const c = B.hand[i];
  if (c.cost > B.energy){ toast('NOT ENOUGH ⚡ ENERGY'); return; }
  B.energy -= c.cost;
  B.hand.splice(i, 1);
  if (c.type !== 'pow') B.discard.push(c);
  SFX.play();
  const bonus = B.str + (B.firstHit || 0);
  if (c.dmg){
    const times = c.multi || 1;
    for (let t = 0; t < times; t++){
      const f = targetFoe();
      if (!f) break;
      hitFoe(f, c.dmg + bonus);
    }
    if (B.firstHit) B.firstHit = 0;
  }
  if (c.aoe){
    B.foes.forEach(f => { if (f.hp > 0) f.hp -= c.aoe + B.str; });
    SFX.aoe(); hapt([10, 20, 10]);
    if (B.firstHit) B.firstHit = 0;
  }
  if (c.shield){ B.shield += c.shield; SFX.shield(); }
  if (c.heal){
    const weakest = alive().sort((x, y) => (x.hp / x.mhp) - (y.hp / y.mhp))[0];
    if (weakest){ weakest.hp = Math.min(weakest.mhp, weakest.hp + c.heal); SFX.heal(); }
  }
  if (c.draw) drawGenes(c.draw);
  if (c.energy) B.energy += c.energy;
  if (c.str){ B.str += c.str; }
  if (c.weak){ const f = targetFoe(); if (f) f.weak = Math.max(f.weak, c.weak); }
  if (B.foes.every(f => f.hp <= 0)){ winBattle(); return; }
  renderBattle();
}
function endTurn(){
  if (B.over || B.busy) return;
  B.busy = true;
  let delay = 200;
  B.foes.forEach(f => {
    if (f.hp <= 0) return;
    setTimeout(() => {
      if (B.over) return;
      const kind = f.pat[f.pi % f.pat.length];
      f.pi++;
      if (kind === 'atk'){
        const n = Math.max(1, f.atk + f.str - (f.weak ? 2 : 0));
        if (f.weak) f.weak--;
        const absorbed = Math.min(B.shield, n);
        B.shield -= absorbed;
        const through = n - absorbed;
        if (through > 0){
          const victim = pick(alive());
          if (victim){
            victim.hp -= through;
            SFX.hurt(); hapt(20);
            const cell = document.querySelector(`[data-me="${victim.slot}"]`);
            if (cell){ const r = cell.getBoundingClientRect(); floatN(r.left + r.width / 2, r.top + 8, '-' + through); }
            if (victim.hp <= 0){ SFX.ko(); toast(SPECIES[victim.sp].evo[victim.stage].toUpperCase() + ' IS DOWN. EVOLUTION IS CRUEL.', 1600); }
          }
        } else SFX.shield();
      } else f.str += 1 + Math.floor(R.floor / 8);
      renderBattle();
      if (!alive().length){ loseRun(); return; }
    }, delay);
    delay += B.foes.length > 4 ? 170 : 480;   
  });
  setTimeout(() => {
    if (B.over || !alive().length) return;
    B.turn++;
    B.discard.push(...B.hand.filter(c => c.type !== 'pow'));
    B.hand = [];
    B.shield = B.autoShield;
    B.energy = B.maxEnergy;
    drawGenes(5);
    saveRun();
    renderBattle();
    B.busy = false;
  }, delay + 250);
}
function winBattle(){
  if (B.over) return;
  B.over = true;
  Music.setBattle(false);
  META.stats.kills += B.foes.length;
  if (B.kind === 'boss') META.stats.bosses++;
  const base = (B.kind === 'boss' ? 45 : B.kind === 'elite' ? 26 : 15) + Math.floor(R.floor * 2);
  const gold = Math.round(base * (1 + mutSum('goldMul'))) + META.bonusHelix;
  R.helix += gold;
  META.helix += Math.floor(gold / 2);
  const heal = mutSum('healAfter');
  if (heal) R.party.forEach(c => { if (c.hp > 0) c.hp = Math.min(c.mhp, c.hp + heal); });
  
  R.party.forEach(c => { if (c.hp <= 0) c.hp = Math.max(1, Math.round(c.mhp * .3)); });
  
  const evolved = [];
  R.party.forEach(c => {
    c.evo++;
    const next = EVO_AT[c.stage];
    if (next && c.evo >= next){
      c.stage++;
      c.evo = 0;
      const gain = 8 + c.stage * 4;
      c.mhp += gain; c.hp = Math.min(c.mhp, c.hp + Math.round(c.mhp * .5));
      META.stats.evolutions++;
      evolved.push(c);
    }
  });

  stampFx(B.kind === 'boss' ? 'APEX DOWN' : 'SELECTED FOR');

    setTimeout(() => evolutionCeremony(evolved, () => screenReward(gold)), 900);
  } else setTimeout(() => screenReward(gold), 950);
}

function screenReward(gold){

function screenMarket(){
  app.innerHTML = '';
  const card = mkGene(pick(GENES.filter(g => !g.sig && g.id !== 'fossil' && (R.floor >= 5 || g.early))).id);
  const cardCost = 16 + R.floor * 2;
  const mut = rollMutations(1)[0];
  const mutCost = 35 + R.floor * 2;
  const healCost = 14 + R.floor;
  const p = el(`<div class="page">
    ${hudHtml()}
    <div class="helix"></div>
    <div class="big">The <span class="z">Sequencer</span></div>
    <div class="sub">A vending machine full of genetic material. OSHA has questions. It has genes.</div>
    <div style="max-width:150px">${cardHtml(card)}</div>
    <button class="btn" id="bC">Sequence this gene · 🧬 ${cardCost}</button>
    <button class="btn" id="bM">${mut.ic} ${mut.name} (${mut.desc}) · 🧬 ${mutCost}</button>
    <button class="btn" id="bH">Patch the party · heal 15 each · 🧬 ${healCost}</button>
    <button class="btn mag" id="bGo">Leave</button>
  </div>`);
  app.appendChild(p);
  const buy = (cost, fn, btn) => {
    if (R.helix < cost){ toast('NOT ENOUGH HELIX. THE MACHINE HUMS DISMISSIVELY.'); return; }
    R.helix -= cost; fn(); saveRun(); SFX.helix();
    btn.disabled = true; btn.textContent = 'DISPENSED';
    refreshHud();
  };
  function refreshHud(){
    const w = document.createElement('div'); w.innerHTML = hudHtml();
    const cur = $('#hud'); if (cur) cur.replaceWith(w.firstElementChild);
    [['#bC', cardCost], ['#bM', mutCost], ['#bH', healCost]].forEach(([s, c2]) => {
      const b = $(s); if (b && !b.disabled && R.helix < c2){ b.disabled = true; }
    });
  }
  $('#bC').onclick = e => buy(cardCost, () => { R.genome.push(card); toast('+ ' + card.name.toUpperCase()); }, e.target);
  $('#bM').onclick = e => buy(mutCost, () => { applyMutation(mut); toast('⌬ ' + mut.name.toUpperCase()); }, e.target);
  $('#bH').onclick = e => buy(healCost, () => { R.party.forEach(c => c.hp = Math.min(c.mhp, c.hp + 15)); SFX.heal(); }, e.target);
  $('#bGo').onclick = screenMap;
  refreshHud();
}
function loseRun(){
  if (B) B.over = true;
  Music.setBattle(false);
  SFX.death(); hapt([60, 40, 120]);
  const byAsteroid = !!(B && B.foes.some(f => f.id === 'asteroid'));
  const floor = R.floor;
  const newBest = floor >= (R.best || 0) && floor > 0;
  const earned = 12 + floor * 5;
  META.helix += earned;
  saveMeta();
  R = null; saveRun();
  stampFx(byAsteroid ? 'EXTINCT' : 'DESELECTED');
  app.innerHTML = '';
  const p = el(`<div class="page" style="justify-content:center;text-align:center;gap:14px">
    <span class="kick m">${byAsteroid ? 'THE ASTEROID SENDS ITS REGARDS' : newBest ? '★ DEEPEST BRANCH YET ★' : 'SURVIVAL OF THE FITTER, APPARENTLY'}</span>
    <div class="big">Lineage <span class="z">ended</span></div>
    <div class="helix"></div>
    <div class="sub">The branch died on floor ${floor}.<br>+${earned} 🧬 helix fossilized into the germline</div>
    <div class="sub">${pick(['Evolution keeps the receipts.', 'The soup will try again.', '99.9% of all species are extinct. You\'re in excellent company.', 'Somewhere, a crab survives. It is always the crab.'])}</div>
    <button class="btn mag" id="bAgain">Speciate again</button>
    <button class="btn ${META.helix >= ladderDef(META.ladder).cost ? 'claimable' : ''}" id="bLad">🧬 Germline · spend ${META.helix}</button>
    <button class="btn ghost" id="bTitle">Title</button>
  </div>`);
  app.appendChild(p);
  $('#bAgain').onclick = () => { newRun(); screenMap(); };
  $('#bLad').onclick = screenLadder;
  $('#bTitle').onclick = screenTitle;
}

function screenZoo(){
  app.innerHTML = '';
  const count = id => META.party.filter(x => x === id).length;
  const total = META.party.length;
  const p = el(`<div class="page">
    <span class="kick">THE ZOO · COMPOSE YOUR NINE</span>
    <div class="big">The <span class="z">Zoo</span></div>
    <div class="sub">🧬 ${META.helix} banked · party <b style="color:var(--w)">${total}/${PARTY_N}</b>. Each species brings its <b style="color:var(--m)">signature gene</b> once.</div>
    <div class="helix"></div>
    ${Object.entries(SPECIES).map(([id, s]) => {
      const owned = META.species.includes(id);
      const n = count(id);
      const sig = GENES.find(g => g.sig === id);
      return `<div class="row" style="gap:10px">
        <div class="sprite" data-live="sp" data-sp="${id}" data-st="${owned ? 1 : 0}" style="width:48px;height:48px;position:relative;flex-shrink:0;${owned ? '' : 'filter:grayscale(1) brightness(.5)'}"></div>
        <div style="flex:1"><div class="an">${s.name}${n ? ` <span style="color:var(--m)">×${n}</span>` : ''}</div>
        <div class="ap">(${s.ep}) sig: ${sig ? sig.name : '—'}</div></div>
        ${owned
          ? `<div style="display:flex;gap:5px;align-items:center">
              <button class="btn slim ghost" style="width:40px" data-sub="${id}" ${n === 0 || total <= 1 ? 'disabled' : ''}>−</button>
              <button class="btn slim mag" style="width:40px" data-add="${id}" ${total >= PARTY_N ? 'disabled' : ''}>+</button></div>`
          : `<button class="btn slim" style="width:auto" data-id="${id}" ${META.helix < s.cost ? 'disabled' : ''}>🧬 ${s.cost}</button>`}
      </div>`;
    }).join('')}
    <button class="btn ghost" id="bBack">Back</button>
  </div>`);
  app.appendChild(p);
  p.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
    const id = b.dataset.id, s = SPECIES[id];
    if (META.helix < s.cost) return;
    META.helix -= s.cost;
    META.species.push(id);
    if (META.party.length >= PARTY_N) META.party.shift();
    META.party.push(id);
    toast('🧬 ' + s.name.toUpperCase() + ' JOINS THE GENE POOL — AND THE PARTY', 1800);
    SFX.evolve();
    saveMeta(); screenZoo();
  });
  p.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    if (META.party.length >= PARTY_N) return;
    META.party.push(b.dataset.add);
    SFX.click(); saveMeta(); screenZoo();
  });
  p.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => {
    const i = META.party.indexOf(b.dataset.sub);
    if (i < 0 || META.party.length <= 1) return;
    META.party.splice(i, 1);
    SFX.click(); saveMeta(); screenZoo();
  });
  $('#bBack').onclick = screenTitle;
}
function screenLadder(){
  app.innerHTML = '';
  const n = META.ladder;
  const items = [ladderDef(n), ladderDef(n + 1), ladderDef(n + 2)];
  const p = el(`<div class="page">
    <span class="kick">GERMLINE ENGINEERING · HERITABLE · INFINITE</span>
    <div class="big">Germ<span class="z">line</span></div>
    <div class="sub">🧬 ${META.helix} banked · ${n} upgrades expressed. These pass to every future lineage.</div>
    <div class="helix"></div>
    ${items.map((u, i) => `<div class="row"><div><div class="an">${u.name}</div><div class="ap">${u.desc}</div></div>
      <button class="btn slim ${i === 0 ? 'mag' : ''}" style="width:auto" data-i="${i}" ${i > 0 || META.helix < u.cost ? 'disabled' : ''}>🧬 ${u.cost}</button></div>`).join('')}
    <div class="sub">claim in order · the ladder is infinite · so is biology</div>
    <button class="btn ghost" id="bBack">Back</button>
  </div>`);
  app.appendChild(p);
  p.querySelector('[data-i="0"]').onclick = () => {
    const u = ladderDef(META.ladder);
    if (META.helix < u.cost) return;
    META.helix -= u.cost;
    u.apply(META);
    META.ladder++;
    saveMeta(); SFX.evolve();
    toast('GERMLINE EDIT: ' + u.name.toUpperCase(), 1600);
    screenLadder();
  };
  $('#bBack').onclick = screenTitle;
}
function screenStats(){
  app.innerHTML = '';
  const s = META.stats;
  const row = (k, v) => `<div class="row"><div class="an">${k}</div><div class="tick">${v}</div></div>`;
  const p = el(`<div class="page">
    <span class="kick">THE FOSSIL RECORD · IT REMEMBERS EVERYTHING</span>
    <div class="big">Fossil <span class="z">Record</span></div>
    <div class="helix"></div>
    ${row('Lineages started', s.runs)}
    ${row('Deepest floor', s.floors)}
    ${row('Rivals outcompeted', s.kills)}
    ${row('Apex predators toppled', s.bosses)}
    ${row('Evolutions witnessed', s.evolutions)}
    ${row('Genes spliced', s.splices)}
    ${row('🧬 helix banked', META.helix)}
    ${row('Germline upgrades', META.ladder)}
    ${row('Species in the zoo', META.species.length + '/' + Object.keys(SPECIES).length)}
    <button class="btn ghost" id="bBack">Back</button>
  </div>`);
  app.appendChild(p);
  $('#bBack').onclick = screenTitle;
}

let TICK_F = 0;
setInterval(() => {
  TICK_F++;
  document.querySelectorAll('[data-live="sp"]').forEach(d => {
    d.innerHTML = pixSvg(SPECIES[d.dataset.sp].g[+d.dataset.st], SPECIES[d.dataset.sp].pal, TICK_F,
      { wiggle: SPECIES[d.dataset.sp].wiggle, ph: +(d.dataset.ph || 0) });
  });
  document.querySelectorAll('[data-live="foe"]').forEach(d => {
    if (!B) return;
    const f = B.foes[+d.dataset.foeI];
    if (f) d.innerHTML = foeSvg(f, TICK_F, +(d.dataset.ph || 0));
  });
}, 120);
setInterval(() => {
  if (!B || B.over) return;
  const living = B.foes.filter(f => f.hp > 0 && QUIPS[f.id]);
  if (!living.length || Math.random() > .4) return;
  const f = pick(living);
  const cell = document.querySelector(`[data-foe="${B.foes.indexOf(f)}"]`);
  if (!cell || cell.querySelector('.quip')) return;
  const q = el(`<div class="quip">${pick(QUIPS[f.id])}</div>`);
  cell.appendChild(q);
  setTimeout(() => q.remove(), 2100);
}, 3600);

loadMeta();
loadRun();
screenTitle();
window.DB = { META, R: () => R, B: () => B, newRun, startBattle, playGene, endTurn, spliceGenes, mkGene,
  screenMap, screenTitle, screenReward, screenZoo, screenLadder, screenStats, screenPond, screenSplice, screenMarket,
  SPECIES, GENES, FOES, BOSSES, MUTATIONS, rollMutations, applyMutation, mutSum, ladderDef, pixSvg, makeParty, alive, EVO_AT };   
</script>
</body>
