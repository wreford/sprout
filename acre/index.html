.bar2{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;min-width:60px}.bar2 i{display:block;height:100%;background:var(--good)}
.mini{width:28px;height:28px;image-rendering:pixelated;vertical-align:middle}

#intro p{font:500 14px/1.45 system-ui;color:#e8dcc0}#intro ol{text-align:left;font:500 13.5px/1.5 system-ui;color:#e8dcc0;padding-left:20px}

const up=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(drag&&!drag.moved&&!(paint&&tool!=="look")){const t=tileAt(...worldAt(e.clientX,e.clientY));if(t){hov=t;applyTool(t,false)}}if(ptr.size===0)drag=null;dirty=1};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,clamp(cam.z*(e.deltaY<0?1.12:.89),.35,2.5))},{passive:false});
function zoomAt(cx,cy,z){const [wx,wy]=worldAt(cx,cy);cam.z=z;const r=cv.getBoundingClientRect();cam.x=wx-(cx-r.left)/z;cam.y=wy-(cy-r.top)/z;clampCam();dirty=1}
$("zin").onclick=()=>{const r=cv.getBoundingClientRect();zoomAt(r.left+VW/2,r.top+VH/2,clamp(cam.z*1.25,.35,2.5))};$("zout").onclick=()=>{const r=cv.getBoundingClientRect();zoomAt(r.left+VW/2,r.top+VH/2,clamp(cam.z/1.25,.35,2.5))};
$("paintB").onclick=()=>{paint=!paint;const b=$("paintB");b.textContent=paint?"🖌 Paint":"✋ Pan";b.classList.toggle("on",paint);hint(paint?"Drag across hexes to apply the tool to all of them.":"Drag to move around. Tap a hex to use the tool.")};
document.querySelectorAll("#spd [data-s]").forEach(b=>b.onclick=()=>{speed=+b.dataset.s;updateSpd()});
$("snd").onclick=()=>{mute=!mute;$("snd").classList.toggle("on",!mute);if(MUS)MUS.muted=mute};
addEventListener("keydown",e=>{if(e.key===" "&&$("intro").hidden){speed=speed?0:1;updateSpd();e.preventDefault()}});
// ================================================================ sound and music (from Wesnoth)
let AC=null;const BUF={};function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}music()}
function sfx(n,v){if(mute||!AC)return;const b=BUF[n];if(b===undefined){BUF[n]=null;fetch(AU+n+".mp3").then(r=>r.arrayBuffer()).then(a=>AC.decodeAudioData(a)).then(d=>{BUF[n]=d}).catch(()=>{});return}if(!b)return;try{const s=AC.createBufferSource(),gn=AC.createGain();s.buffer=b;gn.gain.value=v||.5;s.connect(gn);gn.connect(AC.destination);s.start()}catch(e){}}
let MUS=null;const TRACKS=["traveling_minstrels","wanderer","knolls","silvan_sanctuary","journeys_end","elvish-theme"];function music(){if(MUS)return;MUS=new Audio();MUS.volume=.35;MUS.muted=mute;let i=Math.floor(rnd()*TRACKS.length);const nx=()=>{MUS.src=AU+"m-"+TRACKS[i++%TRACKS.length]+".mp3";MUS.play().catch(()=>{})};MUS.onended=nx;nx()}
// ================================================================ save, intro, loop
function save(){try{localStorage.setItem("acre.save2",JSON.stringify({...G,jobs:G.jobs.map(j=>({...j,w:null})),workers:G.workers.map(w=>({...w,job:null,m:null})),mach:G.mach.map(m=>({...m,busy:0})),tornado:null,wolf:null}))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem("acre.save2")||"null");if(!o||!o.map||o.v!==2)return false;G=o;for(const t of G.map)t.job=null;for(const j of G.jobs){T(j.c,j.r).job=j}return true}catch(e){return false}}
addEventListener("visibilitychange",()=>{if(document.hidden&&G&&!G.over)save()});
let pickR="river",pickD="normal";
function intro(newFarm,force){const el=$("intro");el.hidden=false;speed=0;updateSpd();
 const setup=newFarm?`<div class="pre" style="margin-top:10px">CHOOSE YOUR LAND</div><div class="opts">${Object.entries(REGIONS).map(([k,R])=>`<button class="opt ${pickR===k?"on":""}" data-r="${k}"><b>${R.n}</b><small>${R.d}</small></button>`).join("")}</div><div class="opts">${Object.entries(DIFF).map(([k,D])=>`<button class="opt ${pickD===k?"on":""}" data-d="${k}"><b>${D.n}</b><small>${D.d}</small></button>`).join("")}</div>`:"";
 el.innerHTML=`<div><img class="hero" src="${P.mill(0)}" alt=""><div class="pre">A FARM SIMULATION WITH WESNOTH ART</div><h1>Plowshare Acres</h1><p>Start with a farmhouse and some land. Grow it into the finest farm in the land, and watch the town next door grow with you.</p>
 <ol><li><b>Plow</b> meadows into fields and <b>Plant</b> crops in their months (the <b>Almanac</b> has a calendar). Frost kills all but wheat.</li><li><b>Plan</b> fields to run themselves: your hands plow, sow, harvest and replant each season.</li><li>Keep the soil healthy: rotate crops, grow soybeans or hay, and <b>Care</b> for fields with fertilizer and sprays.</li><li>Fence <b>Pasture</b> for cows and sheep, build pig pens and hen houses, and keep hay for winter.</li><li>Build a <b>Machine Shed</b> and buy tractors and combines. Sell at the <b>Market</b>, fill <b>Town</b> orders, and watch out for droughts, floods, fires and twisters.</li></ol>${setup}<button class="big" id="go">${newFarm?"Found the farm":"Back to the farm"}</button></div>`;
 el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{pickR=b.dataset.r;intro(newFarm,force)});el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{pickD=b.dataset.d;intro(newFarm,force)});
 $("go").onclick=()=>{el.hidden=true;audioInit();if(newFarm){$("news").innerHTML="";newGame(pickR,pickD);fit();save()}tool="look";buildBar();buildSub();hint(TOOLS[0].h);updateHud();speed=1;updateSpd()}}
let last=0,acc=0;function loop(now){const dt=Math.min(100,now-(last||now));last=now;if(G&&!G.over&&speed>0&&$("intro").hidden){acc+=dt*speed/1000;let steps=0;while(acc>=.05&&steps<200){tick(.05);if(G.tornado)tornadoStep(.05);acc-=.05;steps++;G.frac+=.05;if(G.frac>=1){G.frac-=1;newDay();if(G.over)break;updateHud()}}dirty=1}
 for(const f of FLOATS)f.life+=dt;while(FLOATS.length&&FLOATS[0].life>1800)FLOATS.shift();
 if(G&&(dirty||speed>0||FLOATS.length)){draw(now);dirty=0}requestAnimationFrame(loop)}
addEventListener("resize",()=>{if(!G)return;resize();clampCam();updateHud()});
const had=load();if(had){resize();fit();buildBar();updateHud();updateSpd();hint(TOOLS[0].h);news(`Welcome back to the farm. ${MON[G.month]}, Year ${G.year}.`,"good")}else{newGame("river","normal");resize();fit();buildBar();updateHud();intro(true)}
$("snd").classList.add("on");requestAnimationFrame(loop);
window.__acre={get G(){return G},tick,newDay,applyTool:(c,r)=>applyTool(T(c,r)),setTool,T,sub:subSel,randomEvent,tornado,wildfire,flood,save};
</script>
