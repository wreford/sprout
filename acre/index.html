<style>
:root{--face:#dcd9d2;--hi:#fff;--lt:#f3f1ec;--sh:#9b978e;--dk:#45423b;--ink:#17150f;--mute:#5a564d;--gold:#7a5800;--good:#1d7424;--bad:#b0241a;--sel:#0c3b8f;--line:#9b978e;--fld:#fff;
 --rz:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt);
 --sk:inset 1px 1px var(--sh),inset -1px -1px var(--hi),inset 2px 2px var(--dk),inset -2px -2px var(--lt);
 --chk:repeating-conic-gradient(#fff 0 25%,#ebe9e3 0 50%) 0 0/2px 2px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--face);color:var(--ink);font:12.5px/1.35 Tahoma,"Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
/* title bars: the Win95 gradient, a little softer */
.tbar{display:flex;align-items:center;gap:6px;height:24px;padding:0 3px 0 7px;background:linear-gradient(90deg,#0b3786,#3f7fd0);color:#fff;font:700 12.5px Tahoma,"Segoe UI",system-ui;flex:0 0 auto;touch-action:none}
.tbar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .x{width:20px;height:18px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--face);box-shadow:var(--rz);border:0;color:#000;font:900 13px/1 system-ui;cursor:pointer}
.tbar .x:active{box-shadow:var(--sk)}
/* menu bar */
#menu{display:flex;align-items:stretch;height:26px;background:var(--face);border-bottom:1px solid var(--sh);flex:0 0 auto;z-index:8;position:relative}
#menu .mi{border:0;background:none;padding:0 10px;cursor:pointer;font-size:13px}#menu .mi:hover,#menu .mi.open{background:var(--sel);color:#fff}
#menu .brand{margin-left:auto;align-self:center;padding:0 10px;font:700 12px Georgia,serif;color:var(--mute);white-space:nowrap}
.dd{position:fixed;z-index:20;min-width:190px;background:var(--face);box-shadow:var(--rz),3px 3px 0 rgba(0,0,0,.18);padding:3px}
.dd button{display:flex;width:100%;align-items:center;gap:4px;border:0;background:none;text-align:left;padding:6px 18px 6px 4px;cursor:pointer;font-size:13px;white-space:nowrap}
.dd button i{width:18px;font-style:normal;text-align:center}.dd button:hover{background:var(--sel);color:#fff}.dd hr{border:0;border-top:1px solid var(--sh);border-bottom:1px solid #fff;margin:3px 2px}
/* status row: funds, date, weather, speed */
#top{display:flex;align-items:center;gap:6px;padding:4px 6px;background:var(--face);border-bottom:1px solid var(--sh);flex:0 0 auto;z-index:3}
.fld{display:flex;align-items:center;gap:5px;white-space:nowrap}.fld label{font-weight:700;color:var(--mute);font-size:11.5px}
.chip{display:inline-block;padding:3px 7px;background:var(--fld);box-shadow:var(--sk);font:700 13px ui-monospace,Consolas,"Courier New",monospace;min-width:70px;text-align:right}
#cash{color:#0d4d12}#cash.neg{color:var(--bad)}#date{text-align:left}#wx{text-align:left;font-family:inherit;font-weight:700}
#spd{display:flex;gap:0;margin-left:auto}
.ib{background:var(--face);box-shadow:var(--rz);border:0;padding:4px 10px;min-height:26px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.ib:active,.ib.on{box-shadow:var(--sk)}.ib.on{background:var(--chk);font-weight:700}
.ib:disabled{color:var(--sh);text-shadow:1px 1px #fff;cursor:default;box-shadow:var(--rz)}
#spd .ib{min-width:34px;padding:3px 6px}
/* toolbar of tools, beveled icon buttons */
#bar{display:flex;gap:2px;padding:4px 4px max(4px,env(safe-area-inset-bottom));overflow-x:auto;background:var(--face);border-top:1px solid #fff;flex:0 0 auto;scrollbar-width:none}#bar::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:56px;height:54px;border:0;background:var(--face);box-shadow:var(--rz);font-size:10.5px;cursor:pointer;padding:2px}
.tb img{width:32px;height:32px;image-rendering:pixelated;object-fit:contain}.tb:active{box-shadow:var(--sk)}.tb.on{box-shadow:var(--sk);background:var(--chk);font-weight:700}
.tb.sep{margin-left:8px}
#sub{display:none;gap:2px;padding:4px;overflow-x:auto;background:var(--face);border-top:1px solid var(--sh);flex:0 0 auto;scrollbar-width:none}#sub::-webkit-scrollbar{display:none}#sub.on{display:flex}
.sb{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:6px;min-width:120px;padding:4px 8px 4px 4px;border:0;background:var(--face);box-shadow:var(--rz);cursor:pointer;text-align:left}
.sb>span{display:flex;flex-direction:column}
.sb.on{box-shadow:var(--sk);background:var(--chk)}.sb.off{color:var(--sh);text-shadow:1px 1px #fff}.sb.off img{opacity:.45}
.sb img{width:32px;height:32px;image-rendering:pixelated;grid-row:span 2}.sb b{font-size:12px}.sb small{font-size:10.5px;color:var(--mute);white-space:nowrap}
/* the farm window */
#vwin{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin:0 3px;box-shadow:var(--rz);padding:3px;background:var(--face)}
#view{position:relative;flex:1 1 auto;min-height:0;touch-action:none;box-shadow:var(--sk);padding:2px;background:#000}
#cv{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);display:block;cursor:crosshair;image-rendering:pixelated}
#news{position:absolute;left:10px;top:10px;right:60px;display:flex;flex-direction:column;gap:5px;pointer-events:none;z-index:2;align-items:flex-start}
.nw{max-width:100%;padding:5px 9px;background:#ffffe1;color:#000;border:1px solid #000;box-shadow:2px 2px 0 rgba(0,0,0,.3);font-size:12.5px;animation:nwIn .25s ease-out,nwOut .5s ease 5.5s forwards}
.nw b{color:#000}.nw.bad{border-left:5px solid #c8281a}.nw.good{border-left:5px solid #2a8a2a}.nw.staff{border-left:5px solid #1c5ac0}
.nw.chill{background:#fff3a0;border:2px solid #000;font-weight:700;font-size:13.5px}
@keyframes nwIn{from{opacity:0;transform:translateY(-6px)}}@keyframes nwOut{to{opacity:0}}
#hint{position:absolute;left:6px;bottom:6px;right:96px;padding:4px 8px;background:var(--face);box-shadow:var(--rz);font-size:12px;pointer-events:none;z-index:2}#hint:empty{display:none}
#paintB{position:absolute;right:6px;bottom:6px;z-index:2;min-width:80px}
#zoomB{position:absolute;right:6px;top:6px;z-index:2;display:flex;flex-direction:column;gap:2px}#zoomB .ib{width:30px;padding:0;font-weight:700;font-size:15px}
/* windows (panels) */
#panel{position:absolute;left:6px;right:6px;bottom:6px;z-index:4;max-height:80%;flex-direction:column;background:var(--face);box-shadow:var(--rz),4px 4px 0 rgba(0,0,0,.25);padding:3px;display:none}
#panel.on{display:flex;animation:pIn .18s ease-out}@keyframes pIn{from{opacity:0;transform:scale(.97)}}
#panel .wbody{overflow:auto;padding:8px 10px 10px;min-height:0}
@media (min-width:760px){#panel{left:auto;right:12px;top:12px;bottom:auto;width:560px;max-height:calc(100% - 24px)}}
#panel h2{font:700 15px Tahoma,system-ui;margin:2px 0 6px}
#panel h3{font:700 12px Tahoma,system-ui;color:var(--sel);margin:12px 0 4px;padding-bottom:2px;border-bottom:1px solid var(--sh);box-shadow:0 1px 0 #fff}
#panel p{margin:4px 0;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;box-shadow:var(--sk)}td,th{padding:4px 6px;border-bottom:1px solid #eceae4;text-align:left;vertical-align:middle}
th{background:var(--face);box-shadow:inset -1px -1px var(--sh),inset 1px 1px #fff;font-weight:400;font-size:11.5px;color:#000}td.n,th.n{text-align:right}
td:first-child,th:first-child{padding-left:8px}
.up{color:var(--good)}.dn{color:var(--bad)}.bad{color:var(--bad)}
.row{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tabs{display:flex;gap:0;margin:2px 0 8px;flex-wrap:wrap;border-bottom:1px solid var(--sh)}
.tabs .ib{box-shadow:inset 1px 1px #fff,inset -1px 0 var(--dk),inset -2px 0 var(--sh);border-radius:3px 3px 0 0;margin-right:1px}.tabs .ib.on{background:var(--face);box-shadow:inset 1px 1px #fff,inset -1px 0 var(--dk),inset -2px 0 var(--sh);transform:translateY(1px);padding-bottom:6px}
.big{font-weight:700;font-size:13.5px;border:1px solid #000;padding:7px 24px;background:var(--face);box-shadow:var(--rz);cursor:pointer}.big:active{box-shadow:var(--sk)}.big.alt{border-color:transparent;font-weight:400}
.spark{display:inline-block;vertical-align:middle}
.cal{font-size:10px}.cal td{padding:2px;text-align:center;font-size:10px}.cal td.s{background:#7ccf5a}.cal td.now{outline:2px solid var(--sel);outline-offset:-2px}.cal td:first-child{text-align:left;font-size:12px;white-space:nowrap}
.bar2{height:12px;background:#fff;box-shadow:var(--sk);padding:2px;min-width:60px}.bar2 i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--sel) 0 7px,transparent 7px 9px)!important}
.mini{width:32px;height:32px;image-rendering:pixelated;vertical-align:middle}
td canvas{image-rendering:pixelated}
/* dialogs */
#intro{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-start;justify-content:center;background:#2d6b78 radial-gradient(circle at 50% 35%,#3d8a96,#1f4f5a);padding:16px;overflow:auto}#intro[hidden]{display:none!important}
.win{max-width:520px;width:100%;margin:auto;background:var(--face);box-shadow:var(--rz),5px 5px 0 rgba(0,0,0,.3);padding:3px}
.win .wbody{padding:12px 16px 16px;text-align:center}
#intro h1{font:700 30px Georgia,serif;margin:2px 0 4px;color:#1a3a10;text-shadow:2px 2px 0 #fff}
#intro .pre{font:700 11px Tahoma,system-ui;letter-spacing:.12em;color:var(--mute)}
#intro p{font-size:13px;line-height:1.45}#intro ol{text-align:left;font-size:12.5px;line-height:1.5;padding:8px 10px 8px 28px;margin:8px 0;background:#fff;box-shadow:var(--sk)}
#intro img.hero{width:144px;height:144px;image-rendering:pixelated}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px;margin:6px 0}.opt{padding:7px 8px;border:0;background:var(--face);box-shadow:var(--rz);cursor:pointer;text-align:left}
.opt.on{box-shadow:var(--sk);background:#fff;outline:1px dotted #000;outline-offset:-5px}.opt b{display:block;font-size:13px}.opt small{font-size:11.5px;color:var(--mute)}
.rank{font-weight:700;color:var(--good)}
td:last-child{white-space:nowrap}
@media (max-width:480px){#panel td,#panel th{padding:3px 4px;font-size:12px}#panel td .ib{padding:2px 7px;min-height:26px}.nw{font-size:11.5px;padding:3px 7px}#hint{font-size:11px}}
@media (max-width:760px){#vtitle,#menu .brand{display:none}#vwin{margin:0;padding:0;box-shadow:none}}
@media (max-width:480px){#top{gap:4px;padding:3px 4px}.fld label{display:none}.chip{min-width:0;font-size:12px;padding:3px 5px}#spd .ib{min-width:28px;padding:2px 4px;font-size:11px}#menu .mi{padding:0 8px}}
@media (min-width:1700px){body{font-size:14px}#menu{height:30px}#menu .mi,.dd button{font-size:15px}.chip{font-size:15px}.fld label{font-size:13px}#spd .ib{min-width:42px;font-size:14px;min-height:30px}
 .tb{width:68px;height:66px;font-size:12px}.tb img{width:40px;height:40px}.sb{min-width:150px}.sb img{width:40px;height:40px}.sb b{font-size:13.5px}.sb small{font-size:12px}
 .tbar{height:28px;font-size:14px}.tbar .x{width:24px;height:22px}#panel{width:700px}#panel p,table{font-size:14px}#panel h3{font-size:13.5px}#hint,.nw{font-size:14px}.ib{font-size:14px;min-height:30px}#zoomB .ib{width:36px}}
@media (min-width:760px){#bar{order:2;border-top:0;border-bottom:1px solid var(--sh);padding-bottom:4px}#sub{order:3;border-top:0;border-bottom:1px solid var(--sh)}#vwin{order:4;margin:3px}#menu{order:0}#top{order:1}}
body.photo #menu,body.photo #top,body.photo #bar,body.photo #sub,body.photo #vtitle,body.photo #hint,body.photo #zoomB,body.photo #paintB,body.photo #news,body.photo #panel{display:none!important}
#photoX{display:none;position:fixed;right:10px;bottom:10px;z-index:9}body.photo #photoX{display:block}
#cmap{position:absolute;right:6px;bottom:40px;z-index:2;width:192px;height:128px;border:2px solid #000;box-shadow:var(--rz);background:#000;cursor:pointer;image-rendering:pixelated}body.photo #cmap{display:none}@media (max-width:480px){#cmap{width:120px;height:80px;bottom:44px}}
#tut{position:absolute;left:10px;bottom:40px;z-index:2;background:#ffffe1;border:1px solid #000;box-shadow:2px 2px 0 rgba(0,0,0,.3);padding:6px 10px;font-size:12px;max-width:250px}#tut:empty{display:none}#tut b{display:block;margin-bottom:3px}#tut .x{float:right;cursor:pointer;border:0;background:none;font-weight:700}
body.photo #tut{display:none}
body.bigui{font-size:15px}body.bigui .tb{width:70px;height:68px;font-size:12.5px}body.bigui .tb img{width:40px;height:40px}body.bigui .ib{font-size:15px;min-height:32px}body.bigui #menu{height:32px}body.bigui #menu .mi,body.bigui .dd button{font-size:16px}body.bigui .chip{font-size:15px}body.bigui #panel p,body.bigui table{font-size:15px}body.bigui .sb img{width:40px;height:40px}
</style>

 forestS:LO+"terrain/forest/deciduous-summer-tile.png",forestF:LO+"terrain/forest/deciduous-fall-tile.png",forestW:LO+"terrain/forest/deciduous-winter-tile.png",pine:LO+"terrain/forest/pine-tile.png",pineW:LO+"terrain/forest/snow-forest-tile.png",
 hills:MK+"terrain/hills/regular.png",hillsF:MK+"terrain/hills/dry.png",hillsW:MK+"terrain/hills/snow.png",water:MK+"terrain/water/coast-tile.png",dirt:MK+"terrain/flat/dirt.png",plow:LO+"terrain/flat/dirt-dark.png",road:LO+"terrain/flat/road.png",
 rocks:[MK+"terrain/embellishments/rocks.png",MK+"terrain/embellishments/rocks2.png",MK+"terrain/embellishments/rocks3.png",MK+"terrain/embellishments/rocks4.png"],flowers:[MK+"terrain/embellishments/flowers-mixed.png",MK+"terrain/embellishments/flowers-mixed2.png",MK+"terrain/embellishments/flower-purple.png"],

 city:LO+"terrain/village/human-city.png",cityW:LO+"terrain/village/human-city-snow.png",vil:[LO+"terrain/village/human-tile.png",LO+"terrain/village/dwarven-tile.png",LO+"terrain/village/elven-tile.png",LO+"terrain/village/human-tile.png",MK+"terrain/village/coast.png"],keep:MK+"terrain/castle/keep-tile.png",
 farmer:LO+"units/human-peasants/peasant.png",farmerW:LO+"units/human-peasants/peasant-attack.png",wood:LO+"units/human-peasants/woodsman.png",herd:LO+"units/human-peasants/ruffian.png",wolf:MK+"units/monsters/wolf.png",

 river:{n:"River Valley",d:"Mild and well watered, with a broad river. A good first farm.",rain:{spring:1.05,summer:.72,autumn:.9,winter:.95},win:[11,0,1],river:2,fire:.6},
