<style>
:root{--ink:#f3ead2;--mute:#bfb294;--gold:#ffd34a;--panel:#1d160c;--line:#6a5228;--good:#7ad05a;--bad:#ff7a6a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.nw b{color:var(--gold)}.nw.bad{border-color:#c8462c}.nw.good{border-color:#5a9a3a}
@keyframes nwIn{from{opacity:0;transform:translateY(-8px)}}@keyframes nwOut{to{opacity:0;transform:translateY(-6px)}}

#paintB{position:absolute;right:8px;bottom:8px;z-index:2}

#sub{display:none;gap:6px;padding:6px 8px;overflow-x:auto;background:#1a1309;border-top:1px solid var(--line);flex:0 0 auto;scrollbar-width:none}#sub::-webkit-scrollbar{display:none}
#sub.on{display:flex}
.sb{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:82px;padding:4px 6px;border-radius:10px;border:2px solid var(--line);background:linear-gradient(#2a2014,#17110a);color:var(--ink);font:inherit;cursor:pointer}
.sb.on{border-color:var(--gold);box-shadow:0 0 10px rgba(255,211,74,.4)}.sb.off{opacity:.45}
.sb img,.sb canvas{width:36px;height:36px;image-rendering:pixelated}.sb b{font:800 11.5px system-ui}.sb small{font:600 10px system-ui;color:var(--mute)}
#bar{display:flex;gap:4px;padding:6px 6px max(6px,env(safe-area-inset-bottom));overflow-x:auto;background:linear-gradient(#21180c,#120d06);border-top:2px solid var(--line);flex:0 0 auto;scrollbar-width:none}#bar::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:60px;height:56px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(#33281a,#1f170c);color:var(--ink);font:700 10.5px system-ui;cursor:pointer;padding:2px}
.tb img{width:30px;height:30px;image-rendering:pixelated;object-fit:contain}.tb.on{border-color:var(--gold);background:linear-gradient(#6a4e18,#3a2a08);box-shadow:0 0 10px rgba(255,211,74,.35)}
#panel{position:absolute;left:8px;right:8px;bottom:8px;z-index:4;max-height:70%;overflow:auto;border-radius:14px;background:linear-gradient(#2a1f10,#170f06);border:2px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.6);padding:12px;display:none}
#panel.on{display:block;animation:pIn .3s cubic-bezier(.2,1.3,.4,1)}@keyframes pIn{from{opacity:0;transform:translateY(12px)}}
#panel h2{font:900 20px Georgia,serif;color:#ffe9a8;margin:0 0 6px}#panel .x{position:absolute;right:8px;top:8px}
#panel p{margin:4px 0;font:500 13.5px/1.4 system-ui;color:#e8dcc0}
table{width:100%;border-collapse:collapse;font:600 13px system-ui}td,th{padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}th{color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase}td.n{text-align:right}
.up{color:var(--good)}.dn{color:var(--bad)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.big{font:900 16px system-ui;color:#fff;border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(#c8462c,#8e2414);box-shadow:0 3px 0 #5e170c;cursor:pointer}.big.alt{background:linear-gradient(#3a2d18,#241a0c);border:1px solid var(--line);box-shadow:none}
.good{color:var(--good)}.bad{color:var(--bad)}
.spark{display:inline-block;vertical-align:middle}
#intro[hidden]{display:none!important}#intro{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(40,30,10,.92),rgba(8,6,2,.96));padding:16px}
#intro>div{max-width:440px;text-align:center;padding:18px;border-radius:16px;border:2px solid var(--line);background:linear-gradient(#2a1f10,#140e06)}
#intro h1{font:900 34px Georgia,serif;color:#ffe9a8;margin:4px 0;text-shadow:0 3px 0 #3a2008}
#intro .pre{font:800 11px system-ui;letter-spacing:.16em;color:#c8b070}
#intro p{font:500 14px/1.45 system-ui;color:#e8dcc0}#intro ol{text-align:left;font:500 13.5px/1.5 system-ui;color:#e8dcc0;padding-left:20px}
#intro img.hero{width:84px;height:96px;image-rendering:pixelated}
.rank{font:800 12px system-ui;color:#c8e0a0}
@media (max-width:480px){#top h1{display:none}#top{gap:4px;padding-left:6px;padding-right:6px}.chip{font-size:11.5px;padding:3px 5px}#spd .ib{padding:4px 6px;min-height:30px;font-size:11px}}

 <div id="top"><h1>Plowshare Acres</h1><span class="chip" id="cash">$0</span><span class="chip" id="date">Mar, Year 1</span><span class="chip" id="wx"></span><div id="spd"><button class="ib" data-s="0" aria-label="Pause">❚❚</button><button class="ib" data-s="1">▶</button><button class="ib" data-s="3">▶▶</button><button class="ib" data-s="8">▶▶▶</button><button class="ib" id="snd" aria-label="Sound">♫</button></div></div>

<script>
"use strict";
// ================================================================ assets
const MK="../mercenary/img/",LO="img/",AU="../mercenary/audio/";
const IM={};function img(p){if(IM[p])return IM[p];const i=new Image();i.src=p;i.onload=()=>{dirty=1};IM[p]=i;return i}
const ok=i=>i&&i.complete&&i.naturalWidth>0;
const P={grass:[MK+"terrain/grass/green.png",LO+"terrain/grass/green2.png",LO+"terrain/grass/green3.png"],dry:MK+"terrain/grass/semi-dry.png",snow:[MK+"terrain/frozen/snow.png",LO+"terrain/frozen/snow2.png"],
 forestS:LO+"terrain/forest/deciduous-summer-tile.png",forestF:LO+"terrain/forest/deciduous-fall-tile.png",forestW:LO+"terrain/forest/deciduous-winter-tile.png",pine:LO+"terrain/forest/pine-tile.png",pineW:LO+"terrain/forest/snow-forest-tile.png",
 hills:MK+"terrain/hills/regular.png",hillsF:MK+"terrain/hills/dry.png",hillsW:MK+"terrain/hills/snow.png",water:MK+"terrain/water/coast-tile.png",dirt:MK+"terrain/flat/dirt.png",plow:LO+"terrain/flat/dirt-dark.png",road:LO+"terrain/flat/road.png",
 rocks:[MK+"terrain/embellishments/rocks.png",MK+"terrain/embellishments/rocks2.png",MK+"terrain/embellishments/rocks3.png",MK+"terrain/embellishments/rocks4.png"],flowers:[MK+"terrain/embellishments/flowers-mixed.png",MK+"terrain/embellishments/flowers-mixed2.png",MK+"terrain/embellishments/flower-purple.png"],
 veg:[LO+"terrain/embellishments/farm-veg-spring.png",LO+"terrain/embellishments/farm-veg-spring2.png",LO+"terrain/embellishments/farm-veg-spring3.png"],fence:[LO+"terrain/embellishments/fence-se-nw-01.png",LO+"terrain/embellishments/fence-sw-ne-01.png"],
 house:MK+"terrain/village/human.png",houseW:MK+"terrain/village/human-snow.png",barn:LO+"terrain/village/human-hills.png",tent:LO+"terrain/castle/encampment/tent.png",mill:i=>LO+"terrain/misc/windmill-A"+String(i+1).padStart(2,"0")+".png",
 farmer:LO+"units/human-peasants/peasant.png",farmerW:LO+"units/human-peasants/peasant-attack.png",wood:LO+"units/human-peasants/woodsman.png",pig:MK+"units/monsters/boar/woodland.png",wolf:MK+"units/monsters/wolf.png",
 sheaf:LO+"items/grain-sheaf.png",bale:LO+"items/straw-bale1.png",bale2:LO+"items/straw-bale2.png",barrel:LO+"items/barrel.png",box:LO+"items/box.png",hammer:LO+"items/hammer.png",coins:LO+"items/gold-coins-medium.png",
 axe:MK+"attacks/axe.png",apple:MK+"icons/potion_red_medium.png",scroll:MK+"icons/scroll_red.png",bag:MK+"icons/bag.png",chest:MK+"items/chest-plain-closed.png",cabbage:LO+"terrain/embellishments/farm-veg-spring2.png"};
// ================================================================ game data
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const seasonOf=m=>m===11||m<=1?"winter":m<=4?"spring":m<=7?"summer":"autumn";
const CROPS={
 wheat:{n:"Wheat",plant:[2,3,8,9],grow:110,yield:42,seed:45,water:1,hardy:1,col:"#e8c060",icon:P.sheaf,d:"Hardy. Sow in spring or autumn; autumn wheat survives the winter."},
 corn:{n:"Corn",plant:[3,4],grow:115,yield:55,seed:60,water:3,col:"#f0d040",icon:P.bale,d:"Thirsty but rich. Also feeds pigs."},
 potatoes:{n:"Potatoes",plant:[2,3,4],grow:95,yield:75,seed:55,water:2,col:"#b08a50",icon:P.box,d:"Big, steady yields."},
 cabbage:{n:"Cabbage",plant:[2,3,6,7],grow:70,yield:50,seed:35,water:2,col:"#9ad070",icon:P.cabbage,d:"Quick. Two plantings a year."},
 pumpkins:{n:"Pumpkins",plant:[4,5],grow:110,yield:30,seed:60,water:3,col:"#f08a2a",icon:P.chest,d:"Pricey in autumn."},
 hay:{n:"Hay",plant:[2,3,4,5,6,7],grow:55,yield:35,seed:20,water:1,col:"#a8c870",icon:P.bale2,d:"Cheap feed. Restores the soil."}};
const GOODS={wheat:{n:"Wheat",base:6,low:[6,7,8]},corn:{n:"Corn",base:5,low:[8,9]},potatoes:{n:"Potatoes",base:3.4,low:[7,8,9]},cabbage:{n:"Cabbage",base:4.2,low:[5,6,9]},pumpkins:{n:"Pumpkins",base:8.5,low:[]},hay:{n:"Hay",base:2.6,low:[5,6]},flour:{n:"Flour",base:10.5,low:[]},apples:{n:"Apples",base:6.5,low:[8,9]},wood:{n:"Lumber",base:9,low:[]}};
const BLD={
 barn:{n:"Barn",cost:1500,up:15,d:"Stores 600 more of every good.",img:P.barn,work:5},
 mill:{n:"Windmill",cost:3000,up:25,d:"Grinds 12 wheat a day into flour, worth almost twice as much.",img:P.mill(0),work:7},
 market:{n:"Market Stall",cost:2000,up:20,d:"Your goods sell for 10% more.",img:P.tent,work:4},
 barrel:{n:"Water Tower",cost:450,up:5,d:"Irrigates fields within two hexes, rain or no rain.",img:P.barrel,work:2},
 pen:{n:"Pig Pen",cost:700,up:8,d:"Holds 4 pigs. Pigs eat corn, potatoes or hay and fetch a good price.",img:P.pig,work:3},
 orchard:{n:"Apple Orchard",cost:350,up:3,d:"Bears apples every autumn from its second year. Lives for decades.",img:P.forestS,work:2}};
const LANDP={grass:160,forest:110,hills:80,rocks:90,water:60};
const RANKS=[[0,"Sharecropper"],[25000,"Smallholder"],[50000,"Yeoman Farmer"],[100000,"Squire of the Furrows"],[200000,"Landed Gentry"],[400000,"Baron of the Fields"],[800000,"Grain Lord of Wesnoth"]];
const COLS=20,ROWS=14,WW=(COLS-1)*54+72,WH=ROWS*72+36;
// ================================================================ state
let G=null,dirty=1,tool="look",paint=false,speed=1,mute=false;
const rnd=()=>Math.random(),pick=a=>a[Math.floor(rnd()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const key=(c,r)=>c+","+r,cen=(c,r)=>[c*54+36,r*72+(c%2?36:0)+36];
function nbs(c,r){const o=[[c,r-1],[c,r+1]];for(const dc of [-1,1]){if(c%2===0)o.push([c+dc,r-1],[c+dc,r]);else o.push([c+dc,r],[c+dc,r+1])}return o.filter(([a,b])=>a>=0&&a<COLS&&b>=0&&b<ROWS)}
function hexDist(a,b,c,d){const ax=a,az=b-(a-(a&1))/2,bx=c,bz=d-(c-(c&1))/2;const ay=-ax-az,by=-bx-bz;return Math.max(Math.abs(ax-bx),Math.abs(ay-by),Math.abs(az-bz))}
const T=(c,r)=>G.map[r*COLS+c];
function newGame(){const map=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)map.push({c,r,t:"grass",v:Math.floor(rnd()*3),own:0,fert:.85+rnd()*.3,last:null});
 G={map,cash:12000,loan:0,day:0,month:2,year:1,inv:{},workers:[],jobs:[],pigs:[],prices:{},hist:{},rain:1,drought:0,news:[],ledger:[],month$:{inc:0,exp:0},events:{},rank:0,uid:1,best:0,stats:{harvests:0,earned:0}};
 // a river from top to bottom
 let c=Math.floor(COLS*.7+rnd()*3);for(let r=0;r<ROWS;r++){T(clamp(c,0,COLS-1),r).t="water";if(rnd()<.45){c+=rnd()<.5?-1:1;c=clamp(c,2,COLS-2);T(c,r).t="water"}}
 // woods, hills, stones
 for(let k=0;k<7;k++){let x=Math.floor(rnd()*COLS),y=Math.floor(rnd()*ROWS);const pine=rnd()<.4;for(let i=0;i<9;i++){const t=T(x,y);if(t.t==="grass"){t.t="forest";t.pine=pine}const n=pick(nbs(x,y));x=n[0];y=n[1]}}
 for(let k=0;k<3;k++){let x=Math.floor(rnd()*COLS),y=Math.floor(rnd()*ROWS);for(let i=0;i<6;i++){const t=T(x,y);if(t.t==="grass")t.t="hills";const n=pick(nbs(x,y));x=n[0];y=n[1]}}
 for(let k=0;k<14;k++){const t=T(Math.floor(rnd()*COLS),Math.floor(rnd()*ROWS));if(t.t==="grass")t.t="rocks"}
 for(const t of G.map)if(t.t==="grass"&&rnd()<.12)t.fl=1;
 // the farmhouse and the land around it
 const hc=Math.floor(COLS*.35),hr=Math.floor(ROWS/2);for(const t of G.map){if(hexDist(t.c,t.r,hc,hr)<=3)t.own=1}const h=T(hc,hr);h.t="bld";h.b="house";
 for(const [a,b] of nbs(hc,hr)){const t=T(a,b);if(t.t!=="water")t.t="grass"}
 G.home=[hc,hr];G.workers.push(mkWorker("farmer"));for(const g in GOODS){G.prices[g]=GOODS[g].base*(.9+rnd()*.2);G.hist[g]=[G.prices[g]];G.inv[g]=0}
 news(`Welcome to <b>Plowshare Acres</b>. Plow a few fields near the farmhouse, then plant.`,"good")}
function mkWorker(kind){const [x,y]=cen(...G.home);return {id:G.uid++,kind,x,y,job:null,st:"idle",dir:1,t:0}}
// ================================================================ helpers
const fmt=n=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
function news(t,cls){G&&G.news.unshift({t,m:G.month,y:G.year});const el=document.getElementById("news");if(!el)return;const d=document.createElement("div");d.className="nw "+(cls||"");d.innerHTML=t;el.appendChild(d);while(el.children.length>3)el.firstChild.remove();setTimeout(()=>d.remove(),6200)}
function cap(){let c=300;for(const t of G.map)if(t.b==="barn")c+=600;return c}
function stored(){let s=0;for(const g in G.inv)s+=G.inv[g];return s}
function irrigated(t){if(nbs(t.c,t.r).some(([a,b])=>T(a,b).t==="water"))return true;for(const u of G.map)if(u.b==="barrel"&&!u.build&&hexDist(u.c,u.r,t.c,t.r)<=2)return true;return false}
function priceOf(g){return G.prices[g]*(G.map.some(t=>t.b==="market"&&!t.build)?1.1:1)*(G.events.premium===g?1.3:1)}
function spend(n,what){if(G.cash-n<-5000-G.loan*0){}G.cash-=n;G.month$.exp+=n;return true}
function earn(n){G.cash+=n;G.month$.inc+=n;G.stats.earned+=n}
function canAfford(n){if(G.cash>=n)return true;news(`Not enough money. Visit the bank in <b>Books</b> for a loan.`,"bad");return false}
function landValue(t){return t.t==="bld"?LANDP.grass:t.t==="field"||t.t==="orch"?LANDP.grass*1.2:LANDP[t.t]||LANDP.grass}
function netWorth(){let w=G.cash-G.loan;for(const t of G.map)if(t.own){w+=landValue(t);if(t.b&&BLD[t.b])w+=BLD[t.b].cost*.7}for(const g in G.inv)w+=G.inv[g]*G.prices[g]*.9;w+=G.pigs.reduce((s,p)=>s+pigValue(p),0);return w}
const pigValue=p=>Math.round(60+p.w*1.6);
// ================================================================ jobs and workers
const JOBW={clearF:3,clearR:2.5,plow:1,plant:.6,harvest:1.1,pick:1.2};
function addJob(t,k,extra){if(t.job)return false;const j={k,c:t.c,r:t.r,work:extra&&extra.work||JOBW[k]||1,done:0,...extra};G.jobs.push(j);t.job=j;dirty=1;return true}
function tick(dt){// dt in game days
 for(const w of G.workers){
  if(!w.job){let best=null,bd=1e9;for(const j of G.jobs){if(j.w)continue;const [x,y]=cen(j.c,j.r);let d=Math.hypot(x-w.x,y-w.y);if(w.kind==="wood"&&(j.k==="clearF"))d*=.3;if(d<bd){bd=d;best=j}}if(best){best.w=w.id;w.job=best;w.st="walk"}else{w.st="idle";const [hx,hy]=cen(...G.home);const d=Math.hypot(hx-w.x,hy-w.y);if(d>30){w.x+=(hx-w.x)/d*Math.min(d,140*dt);w.y+=(hy-w.y)/d*Math.min(d,140*dt)}continue}}
  const j=w.job,[tx,ty]=cen(j.c,j.r);const dx=tx-w.x,dy=ty-w.y+8,d=Math.hypot(dx,dy);
  if(d>4){w.st="walk";const s=Math.min(d,150*dt);w.x+=dx/d*s;w.y+=dy/d*s;if(Math.abs(dx)>1)w.dir=dx>0?1:-1}
  else{w.st="work";const rate=(w.kind==="wood"&&j.k==="clearF"?2.2:1)*(G.upg&&G.upg.tools?1.4:1);j.done+=dt*rate;w.t+=dt;if(j.done>=j.work){finishJob(j);w.job=null;w.st="idle"}}}
 // crops, orchards, pigs, windmill
 const m=G.month,win=seasonOf(m)==="winter";
 for(const t of G.map){
  if(t.crop){const C=CROPS[t.crop.id],k=t.crop;if(k.dead)continue;
   if(win&&!C.hardy&&!k.ripe){k.dead=1;k.why="frost";continue}
   const wtr=irrigated(t)?1.05:G.rain;const need=C.water/3;
   if(!k.ripe){k.d+=dt*(.55+.45*Math.min(1,wtr/Math.max(.35,need)))*(win?.35:1);if(wtr<need*.75)k.hp=Math.max(0,k.hp-dt*.012*(need*.75-wtr)/(need*.75)*3);if(k.d>=C.grow){k.ripe=1;k.rd=0}}
   else{k.rd+=dt;if(k.rd>30)k.hp=Math.max(0,k.hp-dt*.03);if(k.hp<=0){k.dead=1;k.why="rot"}}}

 <div class="row"><button class="ib" id="help">How to farm</button><button class="ib" id="newg">Start a new farm</button></div>`);
 document.getElementById("bor").onclick=()=>{G.loan+=2500;G.cash+=2500;sfx("gold",.5);panelBooks();updateHud()};document.getElementById("rep").onclick=()=>{G.loan-=2500;G.cash-=2500;panelBooks();updateHud()};
 document.getElementById("help").onclick=()=>intro(false);document.getElementById("newg").onclick=()=>{if(confirm("Sell up and start a new farm?")){newGame();fit();closePanel();updateHud();save()}}}
function gameOver(){speed=0;updateSpd();const el=document.getElementById("intro");el.hidden=false;el.innerHTML=`<div><div class="pre">THE BANK HAS TAKEN THE FARM</div><h1>Foreclosed</h1><p>You farmed for ${G.year-1} years and ${G.month} months. Your best net worth was ${fmt(G.best)}, and you rose to <b>${RANKS[G.rank][1]}</b>.</p><button class="big" id="again">Start a new farm</button></div>`;
 document.getElementById("again").onclick=()=>{el.hidden=true;newGame();fit();updateHud();speed=1;updateSpd();save()};localStorage.removeItem("acre.save")}
// ================================================================ HUD
function updateHud(){const c=document.getElementById("cash");c.textContent=fmt(G.cash);c.classList.toggle("neg",G.cash<0);document.getElementById("date").textContent=`${MON[G.month]} ${G.day+1} · Y${G.year}`;
 const s=seasonOf(G.month),w=document.getElementById("wx");const wl=(G.drought>0?"☀ Drought":G.rain>1.15?"🌧 Wet":G.rain<.45?"☀ Dry":s==="winter"?"❄ Cold":"⛅ Fair")+" · "+s[0].toUpperCase()+s.slice(1);w.title=wl;w.textContent=innerWidth<480?wl.split(" ")[0]:wl;if(tool==="plant"||tool==="build")buildSub()}
function updateSpd(){document.querySelectorAll("#spd [data-s]").forEach(b=>b.classList.toggle("on",+b.dataset.s===speed))}
// ================================================================ drawing
const cv=document.getElementById("cv"),g=cv.getContext("2d");let cam={x:0,y:0,z:1},DPR=1,VW=0,VH=0;
function resize(){const v=document.getElementById("view");VW=v.clientWidth;VH=v.clientHeight;DPR=Math.min(2.5,devicePixelRatio||1);cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);dirty=1}
function fit(){resize();cam.z=clamp(Math.min(VW/(54*7.5),VH/(72*6)),.6,1.6);const [hx,hy]=cen(...G.home);cam.x=hx-VW/2/cam.z;cam.y=hy-VH/2/cam.z;clampCam()}
function clampCam(){const mx=WW-VW/cam.z,my=WH-VH/cam.z;cam.x=mx<0?mx/2:clamp(cam.x,0,mx);cam.y=my<0?my/2:clamp(cam.y,0,my)}
function hexPath(x,y){g.beginPath();g.moveTo(x+18,y);g.lineTo(x+54,y);g.lineTo(x+72,y+36);g.lineTo(x+54,y+72);g.lineTo(x+18,y+72);g.lineTo(x,y+36);g.closePath()}
function draw(now){g.setTransform(DPR,0,0,DPR,0,0);g.fillStyle="#1a2a10";g.fillRect(0,0,VW,VH);g.setTransform(DPR*cam.z,0,0,DPR*cam.z,-cam.x*cam.z*DPR,-cam.y*cam.z*DPR);g.imageSmoothingEnabled=cam.z<1;
 const s=seasonOf(G.month),win=s==="winter",aut=s==="autumn";const c0=Math.max(0,Math.floor(cam.x/54)-1),c1=Math.min(COLS-1,Math.ceil((cam.x+VW/cam.z)/54)),r0=Math.max(0,Math.floor(cam.y/72)-1),r1=Math.min(ROWS-1,Math.ceil((cam.y+VH/cam.z)/72));
 const later=[];
 for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const t=T(c,r),x=c*54,y=r*72+(c%2?36:0);
  const base=win&&t.t!=="water"&&t.t!=="field"?P.snow[t.v%2]:aut&&(t.t==="grass"||t.t==="bld"||t.t==="rocks")?P.dry:P.grass[t.v];draw1(base,x,y);
  if(t.t==="water")draw1(P.water,x,y);else if(t.t==="forest")draw1(t.pine?(win?P.pineW:P.pine):win?P.forestW:aut?P.forestF:P.forestS,x,y);else if(t.t==="hills")draw1(win?P.hillsW:aut?P.hillsF:P.hills,x,y);else if(t.t==="rocks")draw1(P.rocks[t.v%4],x,y);
  else if(t.t==="field")drawField(t,x,y,now,win);else if(t.t==="orch")drawOrch(t,x,y,win,aut);else if(t.t==="grass"&&t.fl&&!win)draw1(P.flowers[t.v],x,y);
  if(t.t==="bld")later.push([t,x,y]);
  if(!t.own){g.fillStyle="rgba(0,0,0,.38)";hexPath(x,y);g.fill()}}
 // borders of your land
 g.strokeStyle="rgba(255,226,140,.55)";g.lineWidth=2;for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const t=T(c,r);if(!t.own)continue;const x=c*54,y=r*72+(c%2?36:0);const E=[[x+18,y,x+54,y,[c,r-1]],[x+54,y+72,x+18,y+72,[c,r+1]]];const ne=c%2?[c+1,r]:[c+1,r-1],se=c%2?[c+1,r+1]:[c+1,r],nw=c%2?[c-1,r]:[c-1,r-1],sw=c%2?[c-1,r+1]:[c-1,r];E.push([x+54,y,x+72,y+36,ne],[x+72,y+36,x+54,y+72,se],[x+18,y,x,y+36,nw],[x,y+36,x+18,y+72,sw]);for(const [a,b,d,e,[nc,nr]] of E){const n=nc>=0&&nc<COLS&&nr>=0&&nr<ROWS?T(nc,nr):null;if(!n||!n.own){g.beginPath();g.moveTo(a,b);g.lineTo(d,e);g.stroke()}}}
 for(const [t,x,y] of later)drawBld(t,x,y,now,win);
 // jobs
 for(const j of G.jobs){const [x,y]=cen(j.c,j.r);g.globalAlpha=.9;const ic={clearF:P.axe,clearR:P.axe,plow:P.plow,plant:CROPS[j.crop]?CROPS[j.crop].icon:P.sheaf,harvest:P.bale,pick:P.bale,build:P.hammer}[j.k];const im=img(ic);if(ok(im))g.drawImage(im,x-11,y-30,22,22);g.globalAlpha=1;if(j.done>0){g.fillStyle="rgba(0,0,0,.6)";g.fillRect(x-16,y+24,32,5);g.fillStyle="#7ad05a";g.fillRect(x-15,y+25,30*Math.min(1,j.done/j.work),3)}}
 // pigs
 const pens=G.map.filter(t=>t.b==="pen"&&!t.build);G.pigs.forEach((p,i)=>{const t=pens[i%Math.max(1,pens.length)];if(!t)return;const [x,y]=cen(t.c,t.r);const a=(p.id*2.4+(p.ph||0)*.6),rx=Math.cos(a)*14,ry=Math.sin(a*1.3)*8;const im=img(P.pig),sz=26+p.w*.12;if(ok(im)){g.save();g.translate(x+rx,y+ry+4);if(Math.sin(a)<0)g.scale(-1,1);g.drawImage(im,-sz/2,-sz/2,sz,sz);g.restore()}});
 // workers
 const ws=G.workers.slice().sort((a,b)=>a.y-b.y);for(const w of ws){const work=w.st==="work"&&Math.floor(now/250)%2;const im=img(w.kind==="wood"?P.wood:work?P.farmerW:P.farmer);const bob=w.st==="walk"?Math.abs(Math.sin(now/120+w.id))*3:0;if(ok(im)){g.fillStyle="rgba(0,0,0,.3)";g.beginPath();g.ellipse(w.x,w.y+16,12,4,0,0,7);g.fill();g.save();g.translate(w.x,w.y-bob);if(w.dir<0)g.scale(-1,1);g.drawImage(im,-30,-38,60,60);g.restore()}}
 // weather
 if(win){g.fillStyle="rgba(255,255,255,.85)";for(let i=0;i<70;i++){const sx=(i*137+now*.02*(1+i%3))%WW,sy=(i*311+now*.04*(1+i%2))%WH;g.fillRect(sx,sy,2,2)}}
 else if(G.rain>1.15){g.strokeStyle="rgba(160,190,255,.45)";g.lineWidth=1;g.beginPath();for(let i=0;i<120;i++){const sx=(i*97+now*.15)%WW,sy=(i*233+now*.5)%WH;g.moveTo(sx,sy);g.lineTo(sx-3,sy+10)}g.stroke()}
 if(G.drought>0){g.fillStyle="rgba(255,170,60,.10)";g.fillRect(0,0,WW,WH)}
 for(const f of FLOATS){g.globalAlpha=Math.max(0,1-f.life/1800);g.font="900 15px system-ui";g.textAlign="center";g.lineWidth=3;g.strokeStyle="#000";g.strokeText(f.t,f.x,f.y-f.life/40);g.fillStyle=f.col;g.fillText(f.t,f.x,f.y-f.life/40);g.globalAlpha=1}
 if(hov){const [x,y]=[hov.c*54,hov.r*72+(hov.c%2?36:0)];g.strokeStyle="rgba(255,211,74,.95)";g.lineWidth=2.5;hexPath(x,y);g.stroke()}
 g.setTransform(DPR,0,0,DPR,0,0);const vg=g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.45,VW/2,VH/2,Math.max(VW,VH)*.75);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.35)");g.fillStyle=vg;g.fillRect(0,0,VW,VH)}
function draw1(p,x,y,w,h){const im=img(p);if(ok(im))g.drawImage(im,x+(72-(w||72))/2,y+(72-(h||72)),w||72,h||72)}
function drawField(t,x,y,now,win){draw1(P.plow,x,y);const k=t.crop;if(!k)return;g.save();hexPath(x,y);g.clip();const C=CROPS[k.id],f=Math.min(1,k.d/C.grow);
 if(k.dead){g.strokeStyle="#6a5232";g.lineWidth=2;for(let i=0;i<6;i++){g.beginPath();g.moveTo(x+8+i*11,y+60);g.lineTo(x+14+i*11,y+50);g.stroke()}g.restore();return}
 if((k.id==="potatoes"||k.id==="cabbage")&&f>.55){g.globalAlpha=Math.min(1,(f-.55)*3);draw1(P.veg[k.id==="cabbage"?1:0],x,y);g.globalAlpha=1}
 const rows=6,h=4+f*16,col=k.ripe?C.col:f<.5?"#7ac050":"#5aa040";
 for(let rI=0;rI<rows;rI++){const yy=y+10+rI*10;for(let i=0;i<7;i++){const xx=x+6+i*10+(rI%2)*5,sway=Math.sin(now/600+i+rI)*f*1.5;
   if(k.id==="pumpkins"&&f>.5){g.fillStyle="#5aa040";g.fillRect(xx,yy+6,6,2);if(f>.7){g.fillStyle=k.ripe?C.col:"#c8b040";g.beginPath();g.arc(xx+3,yy+5,2+f*2.2,0,7);g.fill()}continue}
   if((k.id==="potatoes"||k.id==="cabbage")&&f>.55)continue;
   g.strokeStyle=col;g.lineWidth=k.id==="corn"?2.2:1.4;g.beginPath();g.moveTo(xx,yy+8);g.lineTo(xx+sway,yy+8-h*.55);g.stroke();
   if(k.id==="wheat"&&f>.6){g.fillStyle=k.ripe?"#f0c850":"#c8c070";g.fillRect(xx+sway-1,yy+8-h*.55-3,2.4,4)}if(k.id==="corn"&&f>.65){g.fillStyle=k.ripe?"#f0d040":"#c8d070";g.fillRect(xx+sway+1,yy+4-h*.3,2,4)}}}
 if(k.ripe){g.strokeStyle=`rgba(255,226,120,${.5+.4*Math.sin(now/300)})`;g.lineWidth=3;hexPath(x,y);g.stroke()}g.restore();if(k.hp<.6){g.fillStyle="rgba(120,80,30,.25)";hexPath(x,y);g.fill()}}
function drawOrch(t,x,y,win,aut){draw1(win?P.forestW:aut?P.forestF:P.forestS,x,y);if(t.age<300){g.fillStyle="rgba(26,42,16,.35)";hexPath(x,y);g.fill()}if(t.apples){g.fillStyle="#e83030";for(let i=0;i<14;i++){g.beginPath();g.arc(x+14+(i*37)%46,y+12+(i*23)%42,2.4,0,7);g.fill()}}}
function drawBld(t,x,y,now,win){const b=t.b;g.save();if(t.build)g.globalAlpha=.55;
 if(b==="house")draw1(win?P.houseW:P.house,x,y,72,b==="house"?96:72);
 else if(b==="barn")draw1(P.barn,x,y);else if(b==="market")draw1(P.tent,x,y);else if(b==="barrel"){draw1(P.barrel,x,y,44,44);g.fillStyle="rgba(120,180,255,.15)";g.beginPath();g.arc(x+36,y+36,36*2.2,0,7);g.fill()}
 else if(b==="mill"){const fr=t.build?0:Math.floor(now/80)%18;const im=img(P.mill(fr));if(ok(im))g.drawImage(im,x+36-42,y+72-96,84,96)}
 else if(b==="pen"){g.strokeStyle="#7a5a32";g.lineWidth=2.5;const q=[[x+22,y+12],[x+50,y+12],[x+64,y+36],[x+50,y+62],[x+22,y+62],[x+8,y+36]];for(const yo of [0,6]){g.beginPath();q.forEach(([a,b2],i)=>i?g.lineTo(a,b2+yo-6):g.moveTo(a,b2+yo-6));g.closePath();g.stroke()}g.fillStyle="#5a4024";q.forEach(([a,b2])=>g.fillRect(a-2,b2-10,4,12))}
 else if(b==="orchard"){draw1(P.forestS,x,y)}
 if(t.build){g.globalAlpha=1;const im=img(P.hammer);if(ok(im))g.drawImage(im,x+24,y+20,24,24)}g.restore()}
// ================================================================ input: tap to act, drag to pan (or paint), pinch or wheel to zoom
let hov=null;const ptr=new Map();let drag=null,pinch=null;
function worldAt(cx,cy){const r=cv.getBoundingClientRect();return [(cx-r.left)/cam.z+cam.x,(cy-r.top)/cam.z+cam.y]}
function tileAt(wx,wy){let best=null,bd=1e9;const c0=clamp(Math.floor(wx/54)-1,0,COLS-1),c1=clamp(Math.floor(wx/54)+1,0,COLS-1);for(let c=c0;c<=c1;c++)for(let r=clamp(Math.floor(wy/72)-1,0,ROWS-1);r<=clamp(Math.floor(wy/72)+1,0,ROWS-1);r++){const [x,y]=cen(c,r);const d=Math.hypot(x-wx,y-wy);if(d<bd){bd=d;best=T(c,r)}}return bd<44?best:null}
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});audioInit();
 if(ptr.size===2){const [a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};drag=null;return}
 drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false,painted:new Set()};if(paint&&tool!=="look"){const t=tileAt(...worldAt(e.clientX,e.clientY));if(t){drag.painted.add(t);applyTool(t,true)}}});
cv.addEventListener("pointermove",e=>{if(ptr.has(e.pointerId))ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptr.size===2){const [a,b]=[...ptr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(pinch.mx,pinch.my,clamp(pinch.z*d/pinch.d,.35,2.5));return}
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)drag.moved=true;
  if(paint&&tool!=="look"){const t=tileAt(...worldAt(e.clientX,e.clientY));if(t&&!drag.painted.has(t)){drag.painted.add(t);applyTool(t,true)}hov=t;dirty=1}
  else if(drag.moved){cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;clampCam();dirty=1}}
 else if(e.pointerType==="mouse"){hov=tileAt(...worldAt(e.clientX,e.clientY));dirty=1}});
const up=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(drag&&!drag.moved&&!(paint&&tool!=="look")){const t=tileAt(...worldAt(e.clientX,e.clientY));if(t){hov=t;applyTool(t,false)}}if(ptr.size===0)drag=null;dirty=1};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,clamp(cam.z*(e.deltaY<0?1.12:.89),.35,2.5))},{passive:false});
function zoomAt(cx,cy,z){const [wx,wy]=worldAt(cx,cy);cam.z=z;const r=cv.getBoundingClientRect();cam.x=wx-(cx-r.left)/z;cam.y=wy-(cy-r.top)/z;clampCam();dirty=1}
document.getElementById("zin").onclick=()=>{const r=cv.getBoundingClientRect();zoomAt(r.left+VW/2,r.top+VH/2,clamp(cam.z*1.25,.35,2.5))};document.getElementById("zout").onclick=()=>{const r=cv.getBoundingClientRect();zoomAt(r.left+VW/2,r.top+VH/2,clamp(cam.z/1.25,.35,2.5))};
document.getElementById("paintB").onclick=()=>{paint=!paint;const b=document.getElementById("paintB");b.textContent=paint?"🖌 Paint":"✋ Pan";b.classList.toggle("on",paint);hint(paint?"Drag across hexes to apply the tool to all of them.":"Drag to move around. Tap a hex to use the tool.")};
document.querySelectorAll("#spd [data-s]").forEach(b=>b.onclick=()=>{speed=+b.dataset.s;updateSpd()});
document.getElementById("snd").onclick=()=>{mute=!mute;document.getElementById("snd").classList.toggle("on",!mute);if(MUS)MUS.muted=mute};
// ================================================================ sound and music (from Wesnoth)
let AC=null;const BUF={};function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}music()}
function sfx(n,v){if(mute||!AC)return;const b=BUF[n];if(b===undefined){BUF[n]=null;fetch(AU+n+".mp3").then(r=>r.arrayBuffer()).then(a=>AC.decodeAudioData(a)).then(d=>{BUF[n]=d}).catch(()=>{});return}if(!b)return;try{const s=AC.createBufferSource(),gn=AC.createGain();s.buffer=b;gn.gain.value=v||.5;s.connect(gn);gn.connect(AC.destination);s.start()}catch(e){}}
let MUS=null;const TRACKS=["traveling_minstrels","wanderer","knolls","silvan_sanctuary","journeys_end","elvish-theme"];function music(){if(MUS)return;MUS=new Audio();MUS.volume=.35;MUS.muted=mute;let i=Math.floor(rnd()*TRACKS.length);const nx=()=>{MUS.src=AU+"m-"+TRACKS[i++%TRACKS.length]+".mp3";MUS.play().catch(()=>{})};MUS.onended=nx;nx()}
// ================================================================ save, intro, loop
function save(){try{localStorage.setItem("acre.save",JSON.stringify({...G,jobs:G.jobs.map(j=>({...j,w:null}))}))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem("acre.save")||"null");if(!o||!o.map)return false;G=o;G.workers.forEach(w=>{w.job=null;w.st="idle"});for(const t of G.map)t.job=null;for(const j of G.jobs){const t=T(j.c,j.r);t.job=j}return true}catch(e){return false}}
addEventListener("visibilitychange",()=>{if(document.hidden&&G)save()});
function intro(first){const el=document.getElementById("intro");el.hidden=false;el.innerHTML=`<div><img class="hero" src="${P.mill(0)}" alt=""><div class="pre">A FARM SIMULATION WITH WESNOTH ART</div><h1>Plowshare Acres</h1><p>You have $12,000, a farmhouse, and some land by the river. Grow it into the finest farm in the land.</p>
 <ol><li><b>Plow</b> meadows near the farmhouse into fields.</li><li><b>Plant</b> the right crop in the right month. Wheat survives winter; frost kills the rest.</li><li><b>Harvest</b> when fields glow gold, then <b>sell</b> at the Market when prices are good.</li><li>Hire <b>hands</b>, buy more <b>land</b>, build barns, a windmill, water towers and pig pens.</li><li>Watch the weather. Fields by the river or a water tower survive droughts.</li></ol><p><small>Drag to move, pinch or scroll to zoom. Turn on 🖌 Paint to drag a tool across many hexes.</small></p><button class="big" id="go">${first?"Start farming":"Back to the farm"}</button></div>`;
 document.getElementById("go").onclick=()=>{el.hidden=true;audioInit();speed=1;updateSpd()}}
let last=0,acc=0;function loop(now){const dt=Math.min(100,now-(last||now));last=now;if(G&&speed>0&&document.getElementById("intro").hidden){acc+=dt*speed/1000;let steps=0;while(acc>=.05&&steps<200){tick(.05);acc-=.05;steps++;G.frac=(G.frac||0)+.05;if(G.frac>=1){G.frac-=1;newDay();updateHud()}}dirty=1}
 for(const f of FLOATS)f.life+=dt;while(FLOATS.length&&FLOATS[0].life>1800)FLOATS.shift();if(FLOATS.length||G.workers.some(w=>w.st!=="idle"))dirty=1;
 if(G&&(dirty||speed>0||seasonOf(G.month)==="winter"||G.map.some(t=>t.b==="mill"))){draw(now);dirty=0}requestAnimationFrame(loop)}
addEventListener("resize",()=>{resize();clampCam()});
// boot
const had=load();if(!had)newGame();resize();fit();buildBar();updateHud();updateSpd();hint(TOOLS[0].h);document.getElementById("snd").classList.add("on");
if(!had){speed=0;updateSpd();intro(true)}else{news(`Welcome back to the farm. ${MON[G.month]}, Year ${G.year}.`,"good")}
requestAnimationFrame(loop);
window.__acre={get G(){return G},tick,newDay,applyTool:(c,r)=>applyTool(T(c,r)),setTool,T};
