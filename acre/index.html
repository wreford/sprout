.mini{width:32px;height:32px;image-rendering:pixelated;vertical-align:middle}
td canvas{image-rendering:pixelated}

.win{max-width:520px;width:100%;margin:auto;background:var(--face);box-shadow:var(--rz),5px 5px 0 rgba(0,0,0,.3);padding:3px}
.win .wbody{padding:12px 16px 16px;text-align:center}
#intro h1{font:700 30px Georgia,serif;margin:2px 0 4px;color:#1a3a10;text-shadow:2px 2px 0 #fff}
#intro .pre{font:700 11px Tahoma,system-ui;letter-spacing:.12em;color:var(--mute)}
#intro p{font-size:13px;line-height:1.45}#intro ol{text-align:left;font-size:12.5px;line-height:1.5;padding:8px 10px 8px 28px;margin:8px 0;background:#fff;box-shadow:var(--sk)}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px;margin:6px 0}.opt{padding:7px 8px;border:0;background:var(--face);box-shadow:var(--rz);cursor:pointer;text-align:left}
.opt.on{box-shadow:var(--sk);background:#fff;outline:1px dotted #000;outline-offset:-5px}.opt b{display:block;font-size:13px}.opt small{font-size:11.5px;color:var(--mute)}
.rank{font-weight:700;color:var(--good)}
@media (max-width:760px){#vtitle,#menu .brand{display:none}#vwin{margin:0;padding:0;box-shadow:none}}
@media (max-width:480px){#top{gap:4px;padding:3px 4px}.fld label{display:none}.chip{min-width:0;font-size:12px;padding:3px 5px}#spd .ib{min-width:28px;padding:2px 4px;font-size:11px}#menu .mi{padding:0 8px}}

</style>

function subHint(){if(tool==="plant"){const C=CROPS[subSel.plant];return `${C.n}: $${C.seed} seed. Sow in ${C.plant.map(m=>MON[m]).join(", ")}. ${C.d}`}if(tool==="build"){const B=BLD[subSel.build];return `${B.n}: ${fmt(B.cost)}. ${B.d}`}if(tool==="care"){const C=CARE[subSel.care];return `${C.n}: $${C.cost} a hex. ${C.d}.`}
 if(tool==="plan")return subSel.plan==="none"?"Tap planned hexes to clear their plan.":`Plan ${CROPS[subSel.plan].n}: your hands plow, sow in season, harvest and replant on their own.`;return ""}
function hint(t){$("hint").textContent=t||""}
function buildBar(){const b=$("bar");b.innerHTML=TOOLS.map(t=>`<button class="tb ${tool===t.id?"on":""} ${t.sep?"sep":""}" data-t="${t.id}"><img src="${t.i}" alt="">${t.n}</button>`).join("");b.querySelectorAll(".tb").forEach(x=>x.onclick=()=>{sfx("gold",.15);setTool(x.dataset.t)})}
function buildSub(){const s=$("sub");
 if(tool==="plant"||tool==="plan"){const list=Object.entries(CROPS).map(([id,C])=>{const can=C.plant.includes(G.month);return `<button class="sb ${subSel[tool]===id?"on":""} ${tool==="plant"&&!can?"off":""}" data-k="${id}"><img src="${C.icon}" alt=""><b>${C.n}</b><small>$${C.seed} · ${can?"sow now":C.plant.map(m=>MON[m]).join(" ")}</small></button>`});if(tool==="plan")list.unshift(`<button class="sb ${subSel.plan==="none"?"on":""}" data-k="none"><img src="${P.dirt}" alt=""><b>No plan</b><small>clear it</small></button>`);s.innerHTML=list.join("")}
 else if(tool==="build"){s.innerHTML=Object.entries(BLD).map(([id,B])=>{const lock=B.town&&G.town.lv<B.town;return `<button class="sb ${subSel.build===id?"on":""} ${G.cash<B.cost||lock?"off":""}" data-k="${id}"><img src="${B.img}" alt=""><b>${B.n}</b><small>${lock?"needs a "+TOWNLV[B.town][1]:fmt(B.cost)}</small></button>`}).join("")}
 else if(tool==="care"){s.innerHTML=Object.entries(CARE).map(([id,C])=>`<button class="sb ${subSel.care===id?"on":""}" data-k="${id}"><img src="${C.i}" alt=""><b>${C.n}</b><small>$${C.cost} · ${C.d}</small></button>`).join("")}
 else{s.classList.remove("on");s.innerHTML="";return}
 s.classList.add("on");s.querySelectorAll(".sb").forEach(x=>x.onclick=()=>{subSel[tool]=x.dataset.k;buildSub();hint(subHint());sfx("gold",.15)})}
function applyTool(t,quiet){if(!t)return;const own=t.own;
 if(tool==="look")return panelTile(t);
 if(tool==="buy"){if(own)return quiet||news("You already own that.");if(t.t==="town")return quiet||news("That's the town.");if(!nbs(t.c,t.r).some(([a,b])=>T(a,b).own))return quiet||news("You can only buy land next to yours.","bad");const p=landValue(t);if(!canAfford(p))return;spend(p);t.own=1;floatTxt(t.c,t.r,"-"+fmt(p),"#ffd34a");sfx("gold",.4);return after()}
 if(!own)return quiet||news("That isn't your land. Use <b>Land</b> to buy it.","bad");
 if(tool==="plan"){const k=key(t.c,t.r);if(subSel.plan==="none"){delete G.auto[k];return after()}if(!(t.t==="grass"||t.t==="field"))return quiet||news("Plan fields on meadow or plowed land.");if(CROPS[subSel.plan].wet&&!irrigated(t))return quiet||news("Rice needs an irrigated field.","bad");G.auto[k]=subSel.plan;autoPlant(t);return after()}
 if(t.job)return quiet||news("Someone is already on it.");
 if(tool==="clear"){if(t.t==="forest"){if(!canAfford(30))return;spend(30);addJob(t,"clearF")}else if(t.t==="rocks"){if(!canAfford(45))return;spend(45);addJob(t,"clearR")}else return quiet||news("Nothing to clear there.");return after()}
 if(tool==="plow"){if(t.t!=="grass")return quiet||news(t.t==="field"?"Already plowed.":"Clear it first, then plow.");if(!canAfford(15))return;spend(15);addJob(t,"plow");return after()}
 if(tool==="plant"){const C=CROPS[subSel.plant];if(t.t!=="field"||t.crop)return quiet||news(t.crop?"Something is already growing there.":"Plow it first.");if(!C.plant.includes(G.month))return quiet||news(`${C.n} can't be sown in ${MON[G.month]}. Sow in ${C.plant.map(m=>MON[m]).join(", ")}.`,"bad");if(C.wet&&!irrigated(t))return quiet||news("Rice needs an irrigated field: by water or a water tower.","bad");if(!canAfford(C.seed))return;spend(C.seed);addJob(t,"plant",{crop:subSel.plant});return after()}
 if(tool==="care"){const C=CARE[subSel.care];if(t.t!=="field")return quiet||news("Use it on fields.");if(subSel.care==="herb"&&t.weeds<.05||subSel.care==="pest"&&t.pests<.05)return quiet||news("Nothing to spray there.");if(!canAfford(C.cost))return;spend(C.cost);addJob(t,subSel.care);return after()}
 if(tool==="harvest"){if(t.crop){addJob(t,jobKind(t));return after()}if((t.t==="orch"||t.t==="vine")&&t.fruit){addJob(t,"pick");return after()}return quiet||news("Nothing ready to harvest there.")}
 if(tool==="fence"){if(t.t!=="grass")return quiet||news("Fence a meadow.");if(!canAfford(60))return;spend(60);addJob(t,"fence");return after()}
 if(tool==="build"){const B=BLD[subSel.build];if(B.town&&G.town.lv<B.town)return news(`The town must grow into a ${TOWNLV[B.town][1]} first.`,"bad");if(t.t!=="grass")return quiet||news("Build on cleared grass.");if(!canAfford(B.cost))return;spend(B.cost);t.b=subSel.build;t.t="bld";t.build=1;addJob(t,"build",{work:B.work});buildSub();return after()}
 if(tool==="raze"){if(t.b==="house")return news("You can't tear down your own farmhouse.");delete G.auto[key(t.c,t.r)];if(t.b){t.b=null;t.t="grass";delete t.build;sfx("club",.4);return after()}if(["orch","vine","past"].includes(t.t)){t.t="grass";t.age=0;t.fruit=0;return after()}if(t.crop){t.crop=null;return after()}if(t.t==="field"){t.t="grass";return after()}}}
function after(){dirty=1;updateHud()}

const $=id=>document.getElementById(id);
function closePanel(){$("panel").classList.remove("on")}
let winPos=null;
function panel(h){const p=$("panel");let t="Plowshare Acres";const m=h.match(/<h2>([\s\S]*?)<\/h2>/);if(m){t=m[1].replace(/<[^>]+>/g,"");h=h.replace(m[0],"")}
 p.innerHTML=`<div class="tbar"><span>${t}</span><button class="x" onclick="closePanel()" aria-label="Close">✕</button></div><div class="wbody">${h}</div>`;p.classList.add("on");p.querySelector(".wbody").scrollTop=0;
 if(winPos&&innerWidth>=760){p.style.left=winPos[0]+"px";p.style.top=winPos[1]+"px";p.style.right="auto"}
 const tb=p.querySelector(".tbar");tb.onpointerdown=e=>{if(innerWidth<760||e.target.closest(".x"))return;const v=$("view").getBoundingClientRect(),r=p.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;tb.setPointerCapture(e.pointerId);
  tb.onpointermove=ev=>{winPos=[clamp(ev.clientX-v.left-ox,0,v.width-r.width),clamp(ev.clientY-v.top-oy,0,v.height-40)];p.style.left=winPos[0]+"px";p.style.top=winPos[1]+"px";p.style.right="auto"};tb.onpointerup=()=>{tb.onpointermove=null}}}
const INK={"#7ad05a":"#1d8a2a","#ff7a6a":"#c0281c","#ffd34a":"#a87800","#9fd0ff":"#1c5ac0","#c8a040":"#8a6410"};
function spark(a,w,h,col){col=INK[col]||col;if(!a||a.length<2)return "";const mn=Math.min(...a),mx=Math.max(...a);const pts=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-(v-mn)/((mx-mn)||1)*h).toFixed(1)}`).join(" ");return `<svg class="spark" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${col||(a[a.length-1]>=a[a.length-2]?"#1d8a2a":"#c0281c")}" stroke-width="1.6"/></svg>`}
function chart(a,w,h,col,zero){col=INK[col]||col;if(!a||a.length<2)return "<p><small>Not enough history yet.</small></p>";const mn=Math.min(...a,zero?0:Infinity),mx=Math.max(...a);const y=v=>(h-4-(v-mn)/((mx-mn)||1)*(h-8)).toFixed(1);const pts=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${y(v)}`).join(" ");
 return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="background:#fff;box-shadow:var(--sk)">${zero&&mn<0?`<line x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(0,0,0,.3)" stroke-dasharray="4 4"/>`:""}<polyline points="0,${h} ${pts} ${w},${h}" fill="${col}22" stroke="none"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2"/><text x="4" y="12" fill="#555" font-size="10">${Math.round(mx).toLocaleString()}</text><text x="4" y="${h-4}" fill="#555" font-size="10">${Math.round(mn).toLocaleString()}</text></svg>`}
function soilRow(n,v,max,col,txt){return `<tr><td>${n}</td><td style="width:50%"><div class="bar2"><i style="width:${clamp(v/max*100,0,100)}%;background:${col}"></i></div></td><td class="n">${txt}</td></tr>`}
function panelTile(t){const own=t.t==="town"?"Part of the town":t.own?"Yours":"For sale: "+fmt(landValue(t));let h=`<h2>${tileName(t)}</h2><p>${own}${t.t!=="water"&&t.t!=="town"?` · ${irrigated(t)?"irrigated":"rain-fed"}`:""}</p>`;
 if(t.t==="field"||t.crop)h+=`<h3>Soil test</h3><table>${soilRow("Nitrogen",t.nit,100,t.nit<20?"#ff7a6a":t.nit<35?"#ffd34a":"#7ad05a",Math.round(t.nit))}${soilRow("Soil health",t.fert,1.3,"#7ad05a",Math.round(t.fert*100)+"%")}${soilRow("Weeds",t.weeds,1,"#c8a040",Math.round(t.weeds*100)+"%")}${soilRow("Pests",t.pests,1,"#ff7a6a",Math.round(t.pests*100)+"%")}</table>${t.last?`<p><small>Last crop: ${CROPS[t.last].n}. The same crop twice in a row wears the soil out.</small></p>`:""}`;
 if(t.crop){const k=t.crop,C=CROPS[k.id];h+=`<h3>${C.n}</h3><p>${k.dead?(k.why==="frost"?"Killed by frost.":"Rotted in the field."):k.ripe?"<b>Ripe! Harvest it.</b>":Math.round(k.d/C.grow*100)+"% grown"} · health ${Math.round(k.hp*100)}% · expected ${Math.round(C.yield*k.hp*t.fert*(1-t.weeds*.45)*(1-t.pests*.55))} ${C.n}</p>`}
 const plan=G.auto[key(t.c,t.r)];if(plan)h+=`<p>Planned for <b>${CROPS[plan].n}</b>: plowed, sown and harvested on its own.</p>`;
 if(t.t==="orch"||t.t==="vine")h+=`<p>${t.t==="orch"?"Apple trees":"Grapevines"}, ${Math.floor((t.age||0)/360)} years old. ${t.age>300?(t.fruit?"<b>Fruit is ready!</b>":"Fruit comes in "+(t.t==="orch"?"Sep and Oct.":"Sep.")):"First fruit in the second year."}</p>`;
 if(t.t==="past")h+=`<p>Pasture, grass ${Math.round((t.graze??1)*100)}%. Cows and sheep graze here from spring to autumn.</p>`;
 if(t.b&&BLD[t.b])h+=`<p>${BLD[t.b].d}${t.build?" <b>Under construction.</b>":""}</p>`;if(t.b==="house")h+=`<p>Your farmhouse. Stores 400 grain and 300 produce, and your hands live here.</p>`;
 if(t.t==="town")h+=`<p>${TOWNLV[G.town.lv][1]} of ${G.town.pop.toLocaleString()} people. Your trade makes it grow.</p>`;
 if(t.burn)h+=`<p class="bad"><b>On fire!</b></p>`;if(t.job)h+=`<p>Work under way: ${Math.round(t.job.done/t.job.work*100)}%.</p>`;panel(h)}
function tileName(t){if(t.b)return t.b==="house"?"Farmhouse":BLD[t.b].n;if(t.pond)return "Farm Pond";return {grass:"Meadow",forest:t.pine?"Pine Woods":"Woods",hills:"Hills",water:"River",rocks:"Stony Ground",field:"Plowed Field",orch:"Apple Orchard",vine:"Vineyard",past:"Pasture",town:"Town",road:"Road"}[t.t]||"Land"}

 panel(`<h2>Farmhands</h2><p>Hands walk the farm doing the work you order. With machines in the shed they work much faster. ${G.jobs.length} jobs waiting.</p>
 <table><tr><th></th><th>Hand</th><th>Wage</th><th class="n">Hired</th><th></th></tr>${[["farmer","Farmhand","Does any job",110,200],["wood","Woodsman","Clears woods twice as fast",130,250],["herd","Herdsman","Any job; animals hold out longer without feed",120,220]].map(([k,n,d,w,h])=>`<tr><td><img class="mini" src="${P[k]}"></td><td>${n}<br><small>${d}</small></td><td>$${w}/mo</td><td class="n">${c(k)}</td><td class="n"><button class="ib" data-h="${k}" data-c="${h}">Hire · $${h}</button></td></tr>`).join("")}</table>

 document.querySelectorAll("#panel [data-st]").forEach(b=>b.onclick=()=>{const k=b.dataset.st;G.staff=G.staff||{};if(G.staff[k]){G.staff[k]=0;news(`${STAFF[k].n} let go.`)}else{if(!canAfford(STAFF[k].pay))return;spend(STAFF[k].pay);G.staff[k]=1;news(`You hired a <b>${STAFF[k].n}</b>.`,"good");sfx("fanfare-short",.4)}panelHire();updateHud()});const qs=$("quietSt");if(qs)qs.onchange=()=>{G.quietStaff=qs.checked?1:0};$("seed").onclick=()=>{if(!canAfford(3500))return;spend(3500);G.upg=G.upg||{};G.upg.seed=1;sfx("fanfare-short",.5);panelHire()}}

cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});audioInit();
 if(ptr.size===2){const [a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};drag=null;return}
 drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false,painted:new Set(),touch:e.pointerType!=="mouse",t0:performance.now()};if(paint&&tool!=="look"){const t=tileAt(...worldAt(e.clientX,e.clientY));if(t){drag.painted.add(t);applyTool(t,true)}}});
cv.addEventListener("pointermove",e=>{if(ptr.has(e.pointerId))ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptr.size===2){const [a,b]=[...ptr.values()];zoomAt(pinch.mx,pinch.my,clamp(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,.35,2.5));return}
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>(drag.touch?14:6))drag.moved=true;
  if(paint&&tool!=="look"){const t=tileAt(...worldAt(e.clientX,e.clientY));if(t&&!drag.painted.has(t)){drag.painted.add(t);applyTool(t,true)}hov=t;dirty=1}
  else if(drag.moved){cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;clampCam();dirty=1}}
 else if(e.pointerType==="mouse"){hov=tileAt(...worldAt(e.clientX,e.clientY));dirty=1}});
const up=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(drag&&!drag.moved&&!(paint&&tool!=="look")){const t=tileAt(...worldAt(drag.x,drag.y));if(t){hov=t;tapFx(t);applyTool(t,false)}}if(ptr.size===0)drag=null;dirty=1};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,clamp(cam.z*(e.deltaY<0?1.12:.89),.35,2.5))},{passive:false});
function zoomAt(cx,cy,z){const [wx,wy]=worldAt(cx,cy);cam.z=z;const r=cv.getBoundingClientRect();cam.x=wx-(cx-r.left)/z;cam.y=wy-(cy-r.top)/z;clampCam();dirty=1}
$("zin").onclick=()=>{const r=cv.getBoundingClientRect();zoomAt(r.left+VW/2,r.top+VH/2,clamp(cam.z*1.25,.35,2.5))};$("zout").onclick=()=>{const r=cv.getBoundingClientRect();zoomAt(r.left+VW/2,r.top+VH/2,clamp(cam.z/1.25,.35,2.5))};
$("paintB").onclick=()=>{paint=!paint;const b=$("paintB");b.textContent=paint?"🖌 Paint":"✋ Pan";b.classList.toggle("on",paint);hint(paint?"Drag across hexes to apply the tool to all of them.":"Drag to move around. Tap a hex to use the tool.")};
const CHILL=["Whoa there. Just relax and chill, bro.","Just relax and chill, bro. The wheat isn't going anywhere.","Easy, partner. Just relax and chill, bro.","Slow down and smell the hay, bro. Just relax and chill.","Bro. Just relax and chill. Farming is a vibe."];
function setSpeed(s2){if(s2>speed&&s2>=3){news(`⚠️ ${pick(CHILL)}`,"chill");sfx("horn-signals-horn-2",.25)}speed=s2;updateSpd()}
document.querySelectorAll("#spd [data-s]").forEach(b=>b.onclick=()=>setSpeed(+b.dataset.s));
// ================================================================ menu bar
const MENUS={
 File:()=>[["New Farm…",()=>intro(true,"menu")],["Save Farm",()=>{save();news("Farm saved.","good")}],["How to Play",()=>intro(false)],0,["Sound",()=>$("snd").click(),!mute]],
 Options:()=>[["Paint Mode",()=>$("paintB").click(),paint],0,["Zoom In",()=>$("zin").click()],["Zoom Out",()=>$("zout").click()],["Center on Farmhouse",()=>{fit();dirty=1}]],
 Speed:()=>[["Pause",()=>setSpeed(0),speed===0],["Slow",()=>setSpeed(1),speed===1],["Medium",()=>setSpeed(3),speed===3],["Fast",()=>setSpeed(8),speed===8]],
 Windows:()=>TOOLS.filter(t=>t.panel).map(t=>[t.n,()=>setTool(t.id)]),
 Disasters:()=>[["Tornado",()=>tornado()],["Wildfire",()=>wildfire()],["Flood",()=>{flood();dirty=1}],["Early Frost",()=>earlyFrost()],0,["No Random Disasters",()=>{G.calm=!G.calm;news(G.calm?"Random disasters are off. The weather still does what it likes.":"Random disasters are back on.")},!!G.calm]]};
function buildMenu(){const m=$("menu");m.innerHTML=Object.keys(MENUS).map(k=>`<button class="mi" data-m="${k}">${k}</button>`).join("")+`<span class="brand">Plowshare Acres</span>`;
 m.querySelectorAll(".mi").forEach(b=>{b.onclick=e=>{e.stopPropagation();openMenu(b.classList.contains("open")?null:b)};b.onpointerenter=e=>{if(e.pointerType==="mouse"&&document.querySelector(".dd"))openMenu(b)}})}
function openMenu(b){document.querySelectorAll(".dd").forEach(d=>d.remove());document.querySelectorAll("#menu .mi").forEach(x=>x.classList.remove("open"));if(!b)return;b.classList.add("open");sfx("gold",.1);
 const d=document.createElement("div");d.className="dd";const items=MENUS[b.dataset.m]();d.innerHTML=items.map((it,i)=>it?`<button data-i="${i}"><i>${it[2]?"✓":""}</i>${it[0]}</button>`:"<hr>").join("");
 const r=b.getBoundingClientRect();d.style.left=Math.max(0,Math.min(r.left,innerWidth-200))+"px";d.style.top=r.bottom+"px";document.body.appendChild(d);
 d.querySelectorAll("button").forEach(x=>x.onclick=e=>{e.stopPropagation();openMenu(null);audioInit();items[+x.dataset.i][1]()})}
addEventListener("pointerdown",e=>{if(!e.target.closest(".dd,#menu"))openMenu(null)});
buildMenu();
$("snd").onclick=()=>{mute=!mute;$("snd").classList.toggle("on",!mute);if(MUS)MUS.muted=mute};
addEventListener("keydown",e=>{if(e.key===" "&&$("intro").hidden){speed=speed?0:1;updateSpd();e.preventDefault()}});
// ================================================================ sound and music (from Wesnoth)
let AC=null;const BUF={};function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}music()}
function sfx(n,v){if(mute||!AC)return;const b=BUF[n];if(b===undefined){BUF[n]=null;fetch(AU+n+".mp3").then(r=>r.arrayBuffer()).then(a=>AC.decodeAudioData(a)).then(d=>{BUF[n]=d}).catch(()=>{});return}if(!b)return;try{const s=AC.createBufferSource(),gn=AC.createGain();s.buffer=b;gn.gain.value=v||.5;s.connect(gn);gn.connect(AC.destination);s.start()}catch(e){}}
let MUS=null;const TRACKS=["traveling_minstrels","wanderer","knolls","silvan_sanctuary","journeys_end","elvish-theme"];function music(){if(MUS)return;MUS=new Audio();MUS.volume=.35;MUS.muted=mute;let i=Math.floor(rnd()*TRACKS.length);const nx=()=>{MUS.src=AU+"m-"+TRACKS[i++%TRACKS.length]+".mp3";MUS.play().catch(()=>{})};MUS.onended=nx;nx()}
// ================================================================ save, intro, loop
function save(){try{localStorage.setItem("acre.save2",JSON.stringify({...G,jobs:G.jobs.map(j=>({...j,w:null})),workers:G.workers.map(w=>({...w,job:null,m:null})),mach:G.mach.map(m=>({...m,busy:0})),tornado:null,wolf:null}))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem("acre.save2")||"null");if(!o||!o.map||o.v!==2)return false;G=o;for(const t of G.map)t.job=null;for(const j of G.jobs){T(j.c,j.r).job=j}return true}catch(e){return false}}
addEventListener("visibilitychange",()=>{if(document.hidden&&G&&!G.over)save()});
let pickR="river",pickD="normal";
function intro(newFarm,force){const el=$("intro");el.hidden=false;speed=0;updateSpd();
 const setup=newFarm?`<div class="pre" style="margin-top:10px">CHOOSE YOUR LAND</div><div class="opts">${Object.entries(REGIONS).map(([k,R])=>`<button class="opt ${pickR===k?"on":""}" data-r="${k}"><b>${R.n}</b><small>${R.d}</small></button>`).join("")}</div><div class="opts">${Object.entries(DIFF).map(([k,D])=>`<button class="opt ${pickD===k?"on":""}" data-d="${k}"><b>${D.n}</b><small>${D.d}</small></button>`).join("")}</div>`:"";
 el.innerHTML=`<div class="win"><div class="tbar"><span>${newFarm?"New Farm":"How to Play"}</span></div><div class="wbody"><img class="hero" src="${P.mill(0)}" alt=""><div class="pre">A FARM SIMULATION</div><h1>Plowshare Acres</h1><p>Start with a farmhouse and some land. Grow it into the finest farm in the land, and watch the town next door grow with you.</p>
 <ol><li><b>Plow</b> meadows into fields and <b>Plant</b> crops in their months (the <b>Almanac</b> has a calendar). Frost kills all but wheat.</li><li><b>Plan</b> fields to run themselves: your hands plow, sow, harvest and replant each season.</li><li>Keep the soil healthy: rotate crops, grow soybeans or hay, and <b>Care</b> for fields with fertilizer and sprays.</li><li>Fence <b>Pasture</b> for cows and sheep, build pig pens and hen houses, and keep hay for winter.</li><li>Build a <b>Machine Shed</b> and buy tractors and combines. Sell at the <b>Market</b>, fill <b>Town</b> orders, and watch out for droughts, floods, fires and twisters.</li></ol>${setup}<div class="row" style="justify-content:center">${force==="menu"?'<button class="big alt" id="cancel">Cancel</button>':""}<button class="big" id="go">${newFarm?"Found the farm":"Back to the farm"}</button></div></div></div>`;
 el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{pickR=b.dataset.r;intro(newFarm,force)});el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{pickD=b.dataset.d;intro(newFarm,force)});
 if($("cancel"))$("cancel").onclick=()=>{el.hidden=true;speed=1;updateSpd()};
 $("go").onclick=()=>{el.hidden=true;audioInit();if(newFarm){$("news").innerHTML="";newGame(pickR,pickD);fit();save()}tool="look";buildBar();buildSub();hint(TOOLS[0].h);updateHud();speed=1;updateSpd()}}
let last=0,acc=0;function loop(now){const dt=Math.min(100,now-(last||now));last=now;if(G&&!G.over&&speed>0&&$("intro").hidden){acc+=dt*speed/1000;let steps=0;while(acc>=.05&&steps<200){tick(.05);if(G.tornado)tornadoStep(.05);acc-=.05;steps++;G.frac+=.05;if(G.frac>=1){G.frac-=1;newDay();if(G.over)break;updateHud()}}dirty=1}
 for(const f of FLOATS)f.life+=dt;while(FLOATS.length&&FLOATS[0].life>1800)FLOATS.shift();for(const tp of TAPS)tp.life+=dt;while(TAPS.length&&TAPS[0].life>400)TAPS.shift();if(TAPS.length)dirty=1;
 if(G&&(dirty||speed>0||FLOATS.length)){draw(now);dirty=0}requestAnimationFrame(loop)}
addEventListener("resize",()=>{if(!G)return;resize();clampCam();updateHud()});
if(window.ResizeObserver)new ResizeObserver(()=>{if(!G)return;const ox=cam.x+VW/2/cam.z,oy=cam.y+VH/2/cam.z;resize();cam.x=ox-VW/2/cam.z;cam.y=oy-VH/2/cam.z;clampCam();draw(performance.now())}).observe($("view"));
const had=load();if(had){resize();fit();buildBar();updateHud();updateSpd();hint(TOOLS[0].h);news(`Welcome back to the farm. ${MON[G.month]}, Year ${G.year}.`,"good")}else{newGame("river","normal");resize();fit();buildBar();updateHud();intro(true)}
$("snd").classList.add("on");requestAnimationFrame(loop);
window.__acre={get G(){return G},tick,newDay,applyTool:(c,r)=>applyTool(T(c,r)),setTool,T,sub:subSel,randomEvent,tornado,wildfire,flood,save};
