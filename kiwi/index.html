<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3de">
<meta name="description" content="Kiwi's Breakfast Machine — a contraption puzzle. Place bubble gum, a cactus, and a wax candle to send one gumball through ramps, ropes, weights, and catapults, so a small flightless bird gets breakfast without lifting a feather. From day nine, Lily and her horse join the machine.">
<title>Kiwi's Breakfast Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23fff3de'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='17'%3E🥝%3C/text%3E%3C/svg%3E">
<style>
:root{ --bg:#fff3de; --bg2:#ffe6c2; --ink:#4a3524; --ink2:#7a5f45; --wood:#c98b58; --wood2:#8a5a33;
  --teal:#1fae9b; --red:#e8503f; --pink:#ff7fb0; --gold:#f5a623; --panel:#fffaf0;
  --disp:'Baloo 2',system-ui,sans-serif; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);
  font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#hdr{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;flex-wrap:wrap;
  padding-top:calc(10px + env(safe-area-inset-top))}
#hdr h1{font-family:var(--disp);font-weight:800;font-size:clamp(17px,3.4vw,24px);
  letter-spacing:-.01em;color:var(--ink);line-height:1.1}
#hdr h1 span{color:var(--teal)}
#days{display:flex;gap:5px;margin-left:auto}
.day{width:30px;height:30px;border-radius:10px;border:2px solid var(--wood);background:var(--panel);
  font-family:var(--disp);font-weight:800;font-size:13px;color:var(--ink2);cursor:pointer}
.day.on{background:var(--teal);border-color:var(--teal);color:#fff}
.day.done{background:var(--gold);border-color:var(--gold);color:#fff}
.day:disabled{opacity:.35;cursor:default}
#snd{width:30px;height:30px;border-radius:10px;border:2px solid var(--wood);background:var(--panel);
  cursor:pointer;font-size:14px}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  padding:4px 10px;min-height:0}
#cv{background:#fffdf6;border:4px solid var(--wood2);border-radius:16px;max-width:100%;
  max-height:100%;aspect-ratio:16/9;box-shadow:0 10px 30px rgba(122,77,33,.25);touch-action:none}
#cap{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(58,40,22,.88);
  color:#ffedd2;font-family:var(--disp);font-weight:700;font-size:clamp(12px,2.2vw,15px);
  border-radius:99px;padding:7px 18px;pointer-events:none;opacity:0;transition:opacity .25s;
  max-width:88%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cap.on{opacity:1}
#tray{display:flex;gap:8px;align-items:center;justify-content:center;padding:8px 12px
  calc(12px + env(safe-area-inset-bottom));flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:2.5px solid var(--wood);
  border-radius:14px;padding:9px 14px;font-family:var(--disp);font-weight:800;font-size:14px;
  color:var(--ink);cursor:pointer;transition:.12s}
.chip .ct{background:var(--wood);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px}
.chip.sel{border-color:var(--teal);background:#e2f7f3;transform:translateY(-2px)}
.chip:disabled{opacity:.4;cursor:default;transform:none}
.chip.act{border-color:var(--red);background:var(--red);color:#fff}
.chip.act2{border-color:var(--ink2)}
#ovl{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
  background:rgba(74,53,36,.45);padding:18px}
#ovl.on{display:flex}
#ovl .box{background:var(--panel);border:4px solid var(--wood2);border-radius:22px;max-width:520px;
  width:100%;padding:26px;text-align:center;box-shadow:0 16px 44px rgba(74,53,36,.4);
  max-height:86vh;overflow-y:auto}
#ovl .big{font-size:54px;line-height:1.1}
#ovl h2{font-family:var(--disp);font-weight:800;font-size:clamp(21px,4.6vw,30px);margin:6px 0 8px;
  letter-spacing:-.01em}
#ovl h2 i{color:var(--teal);font-style:normal}
#ovl p{color:var(--ink2);font-size:14.5px;line-height:1.6;margin-bottom:10px}
#ovl .fact{background:#f3ead9;border-radius:14px;padding:12px 14px;font-size:13.5px;
  color:var(--ink);margin:10px 0 16px;line-height:1.55}
#ovl .fact b{color:var(--teal)}
#ovl button{background:var(--teal);color:#fff;border:0;border-radius:14px;padding:14px 30px;
  font-family:var(--disp);font-weight:800;font-size:16px;cursor:pointer;
  box-shadow:0 5px 0 #157f71}
#ovl button:active{transform:translateY(3px);box-shadow:0 2px 0 #157f71}
#ovl .howto{text-align:left;margin:0 0 14px;padding:0}
#ovl .howto li{list-style:none;display:flex;gap:10px;align-items:flex-start;margin-bottom:9px;
  font-size:14px;color:var(--ink);line-height:1.45}
#ovl .howto li .em{font-size:20px;line-height:1.2}
</style>
</head>
<body>
<div id="hdr">
  <h1>🥝 Kiwi's <span>Breakfast</span> Machine</h1>
  <div id="days"></div>
  <button id="snd">🔊</button>
</div>
<div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="cap"></div>
  <div id="ovl"><div class="box" id="ovlBox"></div></div>
</div>
<div id="tray"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$("cv"), ctx=cv.getContext("2d");
const W=960,H=540,G=1400,DT=1/120;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let P={day:1,done:{},snd:true};
try{ const s=JSON.parse(localStorage.getItem("kbm")||"null"); if(s) P=Object.assign(P,s); }catch(e){}
const saveP=()=>{ try{ localStorage.setItem("kbm",JSON.stringify(P)); }catch(e){} };

let AC=null;
function tone(f,d,type,vol,when){
  if(!P.snd) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+(when||0);
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol||.15,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
const sBoing=()=>{ tone(180,.18,"triangle",.14); tone(330,.14,"triangle",.1,.05); };
const sPop=()=>tone(640,.09,"square",.12);
const sBubble=()=>{ tone(300,.12,"sine",.12); tone(440,.14,"sine",.1,.08); };
const sBurn=()=>{ for(let i=0;i<5;i++) tone(120+i*37,.05,"sawtooth",.05,i*.09); };
const sThud=()=>tone(90,.22,"triangle",.2);
const sLaunch=()=>{ tone(220,.1,"square",.12); tone(440,.12,"square",.1,.07); tone(660,.14,"square",.1,.14); };
const sWin=()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.14,i*.12)); };
const sFail=()=>{ tone(220,.25,"sawtooth",.09); tone(160,.3,"sawtooth",.09,.18); };
const sNeigh=()=>{ tone(740,.1,"triangle",.11); tone(560,.12,"triangle",.1,.07); tone(420,.16,"triangle",.1,.15); };
const buzz=p=>{ if(navigator.vibrate) navigator.vibrate(p); };

const BOWL={x:842,y:430,w:112,h:78};
const BOWLSEGS=[[848,452,848,506,.1],[848,506,936,506,.1]];
const BOUNDS=[[8,8,952,8],[8,0,8,540],[952,0,952,540]];
const START={x:60,y:28};

const LEVELS=[
{ inv:{gum:1},
  segs:[[30,110,300,150],[8,500,500,500],[500,380,500,500]],
  spikes:[[845,30]],
  hint:"Gum turns the ball into a bubble. Bubbles float up, and the fan drifts them right. Tap GUM, then tap the ball's path on the top plank.",
  win:"Day 1 — The machine works. Kiwi remains unimpressed. Fed, but unimpressed.",
  fact:"A kiwi's egg can be up to 20% of its body weight. Imagine laying a bowling ball." },
{ inv:{cactus:1},
  segs:[[30,100,140,130]],
  fgums:[[130,112]],
  hint:"There's already gum down there. Something spiky needs to wait up on the rail — right above the bowl.",
  win:"Day 2 — Kiwi briefly made eye contact. Progress.",
  fact:"Kiwi are the only birds with nostrils at the TIP of the beak. Elite sniffing." },
{ inv:{wax:1},
  segs:[[30,100,200,140],[220,240,404,292],[402,326,546,314,.12],[406,322,406,296,.12],[544,322,544,282,.12],[610,352,670,352]],
  ropes:[{x:640,y1:40,y2:250}],
  saws:[{pan:[408,272,60,52],wz:[605,306,70,54],lv:[355,-774],arm:[470,321]}],
  hint:"The candle burns any rope above it. Tap WAX, then tap the little shelf under the hanging weight. The catapult does the rest.",
  win:"Day 3 — The weight was overkill. The cereal was excellent.",
  fact:"Kiwi can't fly, but they can outrun a human over rough ground." },
{ inv:{gum:1,cactus:1},
  segs:[[30,120,240,160],[150,460,500,468],[500,340,500,470]],
  hint:"Gum in the pit. Cactus up high, over the bowl. The machine handles the middle.",
  win:"Day 4 — Four moving parts to pour one bowl. Efficiency is a myth.",
  fact:"Kiwi feathers feel like hair. They are basically potato-shaped cats." },
{ inv:{gum:1,wax:1},
  segs:[[30,110,210,138],[330,140,560,168],[640,120,640,176],[730,352,790,352],[520,440,850,498]],
  doors:[{seg:[560,170,640,170],wz:[716,296,88,64]}],
  spikes:[[340,30]],
  ropes:[{x:760,y1:40,y2:240}],
  waits:[[552,118,92,58]],
  hint:"Gum gets the ball across the gap. Then wax under the far rope — the falling weight smashes the trapdoor button.",
  win:"Day 5 — Kiwi has started sleeping in. The machine does not judge.",
  fact:"Kiwi are nocturnal, so technically this machine serves midnight breakfast." },
{ inv:{cactus:1,wax:1},
  segs:[[30,100,140,130],[402,326,546,314,.12],[404,322,404,286,.12],[546,322,546,286,.12],[610,352,670,352]],
  fgums:[[130,112]],
  ropes:[{x:640,y1:20,y2:250}],
  saws:[{pan:[408,274,60,52],wz:[605,306,70,54],lv:[355,-774],arm:[470,321]}],
  hint:"Pop the bubble right over the cup, so the ball drops in. Then burn the rope and let the catapult sing.",
  win:"Day 6 — Pop, drop, launch. Kiwi calls it 'adequate'.",
  fact:"A kiwi eats worms, berries, and bugs. Cereal is a stretch. Kiwi adapts." },
{ inv:{gum:2,cactus:1},
  segs:[[30,110,200,138],[330,200,560,244],[500,430,700,462],[700,300,700,462]],
  spikes:[[400,30]],
  hint:"Two bubbles this time. Ride the ceiling, get popped, roll, then bubble up again. You choose where the last pop happens.",
  win:"Day 7 — Two bubbles. One cereal. Zero effort from Kiwi.",
  fact:"Kiwi pairs can stay together for more than 20 years. Committed to the bit." },
{ inv:{gum:1,cactus:1,wax:1},
  segs:[[30,100,180,128],[212,328,352,318,.12],[214,326,214,286,.12],[350,326,350,286,.12],[400,352,460,352],[500,248,760,218],[720,452,820,464],[820,210,820,470],[700,120,952,30]],
  ropes:[{x:430,y1:20,y2:250}],
  saws:[{pan:[216,276,60,52],wz:[396,308,68,52],lv:[380,-700],arm:[282,325]}],
  hint:"Everything you know. Burn the rope, launch the ball, let it bounce into the pit, bubble up, and pop it over the bowl.",
  win:"Day 8 — The full symphony. Kiwi ate, then asked about lunch.",
  fact:"New Zealanders are called Kiwis after the bird — the bird came first." },
{ inv:{gum:1},
  segs:[[30,110,300,150],[8,500,460,500],[460,380,460,500],[560,360,760,360],[612,316,708,316,.2]],
  spikes:[[620,30]],
  horse:{x:660,y:360,zone:[610,275,85,50],lv:[300,-402]},
  hint:"Bubble the ball to the ceiling — gum goes in the pit. The hanging cactus pops it right over the horse, and the horse handles delivery.",
  win:"Day 9 — Lily's horse kicked breakfast across the room. Lily is so proud.",
  flabel:"Real horse fact",
  fact:"Horses can sleep standing up — a locking joint in their legs holds them upright while they doze." },
{ inv:{gum:1,cactus:1,wax:1},
  segs:[[30,100,140,130],[60,460,380,472],[380,380,380,472],[402,326,546,314,.12],[404,322,404,286,.12],[546,322,546,286,.12],[610,352,670,352],[700,360,820,360],[744,312,812,312,.2],[830,170,830,470]],
  ropes:[{x:640,y1:20,y2:250}],
  saws:[{pan:[408,274,60,52],wz:[605,306,70,54],lv:[355,-774],arm:[470,321]}],
  horse:{x:778,y:360,zone:[762,252,75,58],lv:[170,-740]},
  hint:"The whole family: gum on the first slope, cactus over the cup, wax under the rope. The catapult throws the ball to the horse. Trust the horse.",
  win:"Day 10 — Gum, fire, catapult, horse. Lily says the horse did most of the work.",
  flabel:"Real horse fact",
  fact:"A galloping horse's heart can pump around 250 litres of blood a minute. Breakfast delivery is light work." },
];

let lvl=0, L=null, mode="edit", T=0;
let inv={}, placements=[], ropes=[], weights=[], doors=[], saws=[], fgums=[], waitZones=[];
let ball=null, horseS=null, stallT=0, capT=0, graceT=0, cereal=[], confetti=[], kiwiEat=0, popFx=[], trace=[];

function cap(t){ $("cap").textContent=t; $("cap").classList.add("on"); capT=2.4; }

function inRect(x,y,r){ return x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3]; }

function loadLevel(i){
  lvl=i; L=LEVELS[i];
  inv=Object.assign({gum:0,cactus:0,wax:0},L.inv);
  placements=[];
  buildRun();
  mode="edit";
  paintDays(); paintTray();
  cap("Day "+(i+1)+" — build the machine, then press GO.");
}
function buildRun(){
  T=0; stallT=0; cereal=[]; confetti=[]; popFx=[]; kiwiEat=0; trace=[];
  ball={x:START.x,y:START.y,vx:0,vy:0,r:12,bubble:false};
  ropes=(L.ropes||[]).map(r=>({x:r.x,y1:r.y1,y2:r.y2,lit:false,bt:0.9,burned:false}));
  weights=(L.ropes||[]).map(r=>({x:r.x,y:r.y2,vx:0,vy:0,r:13,dyn:false,rest:false,restT:0}));
  doors=(L.doors||[]).map(d=>({seg:d.seg.slice(),wz:d.wz,open:false,anim:0}));
  saws=(L.saws||[]).map(s=>({pan:s.pan,wz:s.wz,lv:s.lv,arm:s.arm,weightOn:false,fired:false,ft:0}));
  fgums=(L.fgums||[]).map(g=>({x:g[0],y:g[1],used:false}));
  placements.forEach(p=>{ p.used=false; if(p.t==="wax") p.lit=false; });
  horseS=L.horse?{cool:0,anim:0}:null;
  waitZones=[...(L.waits||[]),...saws.map(s=>s.pan)];
}
function activeSegs(){
  const out=[...BOUNDS,...BOWLSEGS,...L.segs];
  doors.forEach(d=>{ if(!d.open) out.push(d.seg); });
  return out;
}
function collSeg(b,r,s,dt,isBubble){
  const dx=s[2]-s[0], dy=s[3]-s[1], L2=dx*dx+dy*dy||1;
  let t=((b.x-s[0])*dx+(b.y-s[1])*dy)/L2; t=clamp(t,0,1);
  const px=s[0]+t*dx, py=s[1]+t*dy;
  let nx=b.x-px, ny=b.y-py;
  const d=Math.hypot(nx,ny);
  if(d>=r||d===0) return false;
  nx/=d; ny/=d;
  b.x=px+nx*r; b.y=py+ny*r;
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){
    const rest=isBubble?0.08:(s[4]!==undefined?s[4]:0.5);
    b.vx-=(1+rest)*vn*nx; b.vy-=(1+rest)*vn*ny;
    const tx=-ny,ty=nx;
    const vt=b.vx*tx+b.vy*ty, vn2=b.vx*nx+b.vy*ny;
    b.vx=tx*vt*0.996+nx*vn2;
    b.vy=ty*vt*0.996+ny*vn2;
  }
  if(isBubble){
    const Ln=Math.sqrt(L2);
    let ux=dx/Ln, uy=dy/Ln;
    if(uy>0){ ux=-ux; uy=-uy; }
    if(uy<-0.03){ b.vx+=ux*260*dt; b.vy+=uy*260*dt; }
  }
  return true;
}
function circHit(b,r,cx,cy,cr){ return Math.hypot(b.x-cx,b.y-cy)<r+cr; }
function popBubble(){
  ball.bubble=false; graceT=0.6;
  popFx.push({x:ball.x,y:ball.y,t:0.4});
  sPop(); buzz(20); cap(pick(["Pop.","POP. Gravity resumes.","The bubble had a good run."]));
}
const pick=a=>a[Math.floor(Math.random()*a.length)];

function step(dt){
  T+=dt;
  if(graceT>0) graceT-=dt;
  if(capT>0){ capT-=dt; if(capT<=0) $("cap").classList.remove("on"); }
  ropes.forEach((r,i)=>{
    if(r.lit&&!r.burned){
      r.bt-=dt;
      if(r.bt<=0){ r.burned=true; weights[i].dyn=true; sThud(); cap(pick(["The rope gives up.","Snap. The rope resigns.","Rope: defeated."])); }
    }
  });
  const segs=activeSegs();
  weights.forEach(w=>{
    if(!w.dyn||w.rest) return;
    w.vy+=G*dt; w.vy=clamp(w.vy,-1500,1500);
    w.x+=w.vx*dt; w.y+=w.vy*dt;
    let touched=false;
    segs.forEach(s=>{ if(collSeg(w,w.r,s,dt,false)) touched=true; });
    doors.forEach(d=>{
      if(!d.open&&inRect(w.x,w.y,d.wz)){
        d.open=true; sBoing(); cap("The trapdoor button: smashed.");
      }
    });
    if(touched&&Math.hypot(w.vx,w.vy)<32){ w.restT+=dt; if(w.restT>0.14){ w.rest=true; saws.forEach(s=>{ if(inRect(w.x,w.y,s.wz)) s.weightOn=true; }); } }
    else w.restT=0;
    if(w.y>H+80) w.rest=true;
  });
  if(mode!=="run") return;
  if(ball.bubble){
    ball.vy+=(-92-ball.vy)*3.2*dt;
    ball.vx+=45*dt;
    ball.vx*=1-0.1*dt;
    ball.vx=clamp(ball.vx,-160,160);
  } else {
    ball.vy+=G*dt;
  }
  ball.vy=clamp(ball.vy,-1500,1500);
  ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
  const r=ball.bubble?24:ball.r;
  segs.forEach(s=>collSeg(ball,r,s,dt,ball.bubble));
  (L.spikes||[]).forEach(sp=>{
    if(ball.bubble&&circHit(ball,24,sp[0],sp[1],16)) popBubble();
    else if(!ball.bubble&&graceT<=0&&circHit(ball,ball.r,sp[0],sp[1],12)){
      const dx=ball.x-sp[0],dy=ball.y-sp[1],d=Math.hypot(dx,dy)||1;
      ball.x=sp[0]+dx/d*(ball.r+12); ball.y=sp[1]+dy/d*(ball.r+12);
      const vn=(ball.vx*dx+ball.vy*dy)/d;
      if(vn<0){ ball.vx-=1.4*vn*dx/d; ball.vy-=1.4*vn*dy/d; }
    }
  });
  placements.forEach(p=>{
    if(p.t==="cactus"){
      if(ball.bubble&&circHit(ball,24,p.x,p.y,16)) popBubble();
      else if(!ball.bubble&&graceT<=0&&circHit(ball,ball.r,p.x,p.y,12)){
        const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy)||1;
        ball.x=p.x+dx/d*(ball.r+12); ball.y=p.y+dy/d*(ball.r+12);
        const vn=(ball.vx*dx+ball.vy*dy)/d;
        if(vn<0){ ball.vx-=1.4*vn*dx/d; ball.vy-=1.4*vn*dy/d; }
      }
    }
    if(p.t==="gum"&&!p.used&&!ball.bubble&&circHit(ball,ball.r,p.x,p.y,18)){
      p.used=true; ball.bubble=true; sBubble(); buzz(15);
      cap(pick(["Gum activated. Dignity compromised.","Bubble mode. The fan approves.","The gum accepts its destiny."]));
    }
  });
  fgums.forEach(g=>{
    if(!g.used&&!ball.bubble&&circHit(ball,ball.r,g.x,g.y,18)){
      g.used=true; ball.bubble=true; sBubble(); buzz(15);
      cap("Bubble mode. Up we go.");
    }
  });
  saws.forEach(s=>{
    if(s.fired){ s.ft+=dt; return; }
    if(s.weightOn&&!ball.bubble&&Math.hypot(ball.vx,ball.vy)<45&&inRect(ball.x,ball.y,s.pan)){
      s.fired=true; s.ft=0; s.fx=Math.round(ball.x); s.fy=Math.round(ball.y); s.ftime=+T.toFixed(2);
      ball.vx=s.lv[0]; ball.vy=s.lv[1];
      sLaunch(); buzz([20,40,20]); cap(pick(["LAUNCH.","The catapult has opinions.","Breakfast, airborne."]));
    }
  });
  if(L.horse&&horseS){
    if(horseS.cool>0) horseS.cool-=dt;
    if(horseS.anim>0) horseS.anim-=dt;
    if(horseS.cool<=0&&!ball.bubble&&ball.vy>40&&inRect(ball.x,ball.y,L.horse.zone)){
      horseS.cool=1.2; horseS.anim=0.5;
      ball.vx=L.horse.lv[0]; ball.vy=L.horse.lv[1];
      sNeigh(); buzz([25,40,25]);
      cap(pick(["The horse declines to explain.","Lily's horse: consulted. Breakfast: launched.","The horse says yes. Emphatically."]));
    }
  }
  if(inRect(ball.x,ball.y,[BOWL.x,BOWL.y,BOWL.w,BOWL.h])){ winRun(); return; }
  if(ball.y>H+70){ failRun("The breakfast has left the building."); return; }
  const sp=Math.hypot(ball.vx,ball.vy);
  const waiting=waitZones.some(z=>inRect(ball.x,ball.y,z));
  if(sp<10&&!waiting) stallT+=dt; else stallT=0;
  if(stallT>2.2){ failRun(pick(["The machine has stalled. Happens to the best.","Physics has questions. Try again.","The machine is on a break. RESET."])); return; }
  if(T>32){ failRun("The machine is… thinking. Too hard. Try again."); }
}

function go(){
  if(mode!=="edit") return;
  mode="run";
  placements.forEach(p=>{
    if(p.t==="wax"){
      p.lit=true;
      ropes.forEach(r=>{
        if(Math.abs(r.x-p.x)<28&&r.y2>p.y-190&&r.y2<p.y+6){ r.lit=true; sBurn(); }
      });
    }
  });
  if(ropes.some(r=>r.lit)) cap("The candle meets the rope. Nature takes its course.");
  else cap("The machine is running. Believe.");
  paintTray();
}
function resetRun(){ buildRun(); mode="edit"; paintTray(); cap("Reset. The gum forgives you."); }
function winRun(){
  if(mode==="won") return;
  mode="won";
  P.done[lvl]=1;
  if(lvl+1<LEVELS.length) P.day=Math.max(P.day,lvl+2);
  saveP();
  sWin(); buzz([40,60,40,60,80]);
  ball.vx=0; ball.vy=0; ball.y=BOWL.y+46; ball.x=clamp(ball.x,858,928);
  for(let i=0;i<26;i++) cereal.push({x:880+((i*37)%50)-25,y:330-(i*13)%90,vy:60+(i*17)%120,r:4+(i%3)*1.5,c:i%4});
  for(let i=0;i<40;i++) confetti.push({x:(i*211)%W,y:-((i*67)%220),vy:120+(i*31)%160,c:i%5,s:4+(i%4)});
  setTimeout(()=>showWin(),1400);
  paintDays(); paintTray();
}
function failRun(t){
  if(mode!=="run") return;
  mode="failed";
  sFail(); buzz(80);
  cap(t+"  ·  press RESET");
  paintTray();
}
function showWin(){
  const last=lvl===LEVELS.length-1;
  const allDone=Object.keys(P.done).length>=LEVELS.length;
  $("ovlBox").innerHTML=`
    <div class="big">🥣🥝${last?"👑":""}</div>
    <h2>${last?"ALL "+LEVELS.length+" MORNINGS <i>COMPLETE</i>":"Kiwi is <i>fed</i>"}</h2>
    <p>${L.win}</p>
    <div class="fact"><b>${L.flabel||"Real kiwi fact"}:</b> ${L.fact}</div>
    ${last?`<p>${allDone?"Kiwi is full. The machine rests. You are now, legally, a breakfast engineer.":""}</p>
      <button id="ovlNext">Play again from Day 1</button>`
    :`<button id="ovlNext">Day ${lvl+2} →</button>`}`;
  $("ovl").classList.add("on");
  $("ovlNext").onclick=()=>{ $("ovl").classList.remove("on"); loadLevel(last?0:lvl+1); };
}
function showIntro(){
  $("ovlBox").innerHTML=`
    <div class="big">🥝</div>
    <h2>Kiwi's <i>Breakfast</i> Machine</h2>
    <p>Every morning, Kiwi the kiwi wants breakfast. Kiwi cannot be bothered.
    You have a gumball, some spare parts, and a dream.</p>
    <ul class="howto">
      <li><span class="em">🍬</span><span><b>BUBBLE GUM</b> wraps the ball in a bubble. Bubbles float up, and the fan drifts them along.</span></li>
      <li><span class="em">🌵</span><span><b>CACTUS</b> pops bubbles. Placement is everything.</span></li>
      <li><span class="em">🕯️</span><span><b>WAX</b> candles burn any rope above them. Falling weights make things happen.</span></li>
      <li><span class="em">🥣</span><span>Get the ball to the bowl. The bowl tips, cereal pours, Kiwi eats. (Kiwi eats the cereal, not the gumball. Kiwi has standards.)</span></li>
      <li><span class="em">🐴</span><span>From Day 9, Lily and her horse join the machine. Land the ball on the saddle and the horse kicks it onward. The horse is very reliable about this.</span></li>
    </ul>
    <button id="ovlStart">Build the machine</button>`;
  $("ovl").classList.add("on");
  $("ovlStart").onclick=()=>{ $("ovl").classList.remove("on"); if(AC===null) tone(1,.01,"sine",.001); };
}

function paintDays(){
  $("days").innerHTML=LEVELS.map((_,i)=>{
    const cls=i===lvl?"on":(P.done[i]?"done":"");
    const lock=i+1>P.day;
    return `<button class="day ${cls}" data-d="${i}" ${lock?"disabled":""}>${i+1}</button>`;
  }).join("");
  $("days").querySelectorAll(".day").forEach(b=>b.onclick=()=>loadLevel(+b.dataset.d));
}
let selTool=null;
function paintTray(){
  const items=[["gum","🍬","GUM"],["cactus","🌵","CACTUS"],["wax","🕯️","WAX"]].filter(x=>(L.inv[x[0]]||0)>0);
  $("tray").innerHTML=items.map(([t,e,n])=>
    `<button class="chip ${selTool===t?"sel":""}" data-t="${t}" ${inv[t]<=0||mode!=="edit"?"disabled":""}>
      ${e} ${n} <span class="ct">×${inv[t]}</span></button>`).join("")+
    `<button class="chip act" id="bGo" ${mode!=="edit"?"disabled":""}>▶ GO</button>
     <button class="chip act2" id="bReset">↺ RESET</button>
     <button class="chip" id="bHint">💡</button>`;
  $("tray").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    selTool=selTool===b.dataset.t?null:b.dataset.t; paintTray();
  });
  $("bGo").onclick=go;
  $("bReset").onclick=resetRun;
  $("bHint").onclick=()=>cap(L.hint);
}
$("snd").onclick=()=>{ P.snd=!P.snd; saveP(); $("snd").textContent=P.snd?"🔊":"🔇"; };
$("snd").textContent=P.snd?"🔊":"🔇";

cv.addEventListener("pointerdown",e=>{
  if(mode!=="edit") return;
  const rc=cv.getBoundingClientRect();
  const x=(e.clientX-rc.left)*W/rc.width, y=(e.clientY-rc.top)*H/rc.height;
  for(let i=placements.length-1;i>=0;i--){
    const p=placements[i];
    if(Math.hypot(p.x-x,p.y-y)<26){
      inv[p.t]++; placements.splice(i,1); paintTray(); tone(300,.06,"sine",.08);
      return;
    }
  }
  if(selTool&&inv[selTool]>0){
    place(selTool,x,y);
    tone(520,.07,"sine",.1);
    if(inv[selTool]<=0) selTool=null;
    paintTray();
  }
});
function place(t,x,y){
  if(inv[t]<=0) return false;
  inv[t]--;
  placements.push({t,x:clamp(x,20,940),y:clamp(y,16,524),used:false,lit:false});
  return true;
}

function wood(s,wd,col){
  ctx.strokeStyle=col||"#c98b58"; ctx.lineWidth=wd||11; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(s[0],s[1]); ctx.lineTo(s[2],s[3]); ctx.stroke();
  ctx.strokeStyle="rgba(90,55,25,.35)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(s[0],s[1]+3); ctx.lineTo(s[2],s[3]+3); ctx.stroke();
}
function emoji(e,x,y,size,rot){
  ctx.save(); ctx.translate(x,y); if(rot) ctx.rotate(rot);
  ctx.font=size+"px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(e,0,2); ctx.restore();
}
function drawKiwi(t){
  const kx=916,ky=474+Math.sin(t*2.1)*2;
  ctx.save();
  const eat=kiwiEat>0;
  ctx.fillStyle="#7a5b3a";
  ctx.beginPath(); ctx.ellipse(kx,ky,24,19,0,0,7); ctx.fill();
  ctx.strokeStyle="rgba(58,40,22,.5)"; ctx.lineWidth=1;
  for(let i=0;i<7;i++){ ctx.beginPath(); ctx.moveTo(kx-16+i*5,ky-12); ctx.lineTo(kx-19+i*5,ky+2); ctx.stroke(); }
  const hy=eat?ky+2:ky-20, hx=kx-14;
  ctx.fillStyle="#6d5033";
  ctx.beginPath(); ctx.arc(hx,hy,10,0,7); ctx.fill();
  ctx.strokeStyle="#d8a15c"; ctx.lineWidth=3.5; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(hx-4,hy+2);
  ctx.lineTo(hx-36,eat?hy+16:hy+8); ctx.stroke();
  ctx.fillStyle="#2c1f12";
  ctx.beginPath(); ctx.arc(hx-3,hy-3,1.8,0,7); ctx.fill();
  ctx.strokeStyle="#c98f4f"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(kx-8,ky+17); ctx.lineTo(kx-8,ky+29); ctx.moveTo(kx+6,ky+17); ctx.lineTo(kx+6,ky+29); ctx.stroke();
  if(eat){ emoji("💛",kx+16,ky-30+Math.sin(t*6)*3,14); }
  ctx.restore();
}
function render(){
  const t=performance.now()/1000;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#fffdf6"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(201,139,88,.16)";
  for(let x=30;x<W;x+=46) for(let y=30;y<H;y+=46){ ctx.beginPath(); ctx.arc(x,y,2.5,0,7); ctx.fill(); }
  ctx.save(); ctx.translate(26,286); ctx.rotate(t*4);
  ctx.fillStyle="#9db8c9";
  for(let i=0;i<3;i++){ ctx.rotate(2.094); ctx.beginPath(); ctx.ellipse(0,-11,5,12,0,0,7); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle="#5d7787"; ctx.beginPath(); ctx.arc(26,286,4,0,7); ctx.fill();
  wood([8,8,952,8],10,"#a8764b"); wood([8,0,8,540],10,"#a8764b"); wood([952,0,952,540],10,"#a8764b");
  ctx.fillStyle="#8a9aa5";
  ctx.fillRect(START.x-16,4,32,20);
  ctx.fillStyle="#5d7787"; ctx.fillRect(START.x-16,20,32,5);
  L.segs.forEach(s=>wood(s));
  doors.forEach(d=>{
    if(d.open){
      d.anim=Math.min(1,d.anim+0.08);
      ctx.save(); ctx.translate(d.seg[0],d.seg[1]); ctx.rotate(d.anim*1.35);
      wood([0,0,d.seg[2]-d.seg[0],d.seg[3]-d.seg[1]],9,"#e0a86e"); ctx.restore();
    } else wood(d.seg,9,"#e0a86e");
    ctx.fillStyle="#5d7787"; ctx.beginPath(); ctx.arc(d.seg[0],d.seg[1],4,0,7); ctx.fill();
  });
  (L.spikes||[]).forEach(sp=>{
    ctx.strokeStyle="#8a5a33"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(sp[0],10); ctx.lineTo(sp[0],sp[1]-14); ctx.stroke();
    emoji("🌵",sp[0],sp[1],26,Math.PI);
  });
  ropes.forEach((r,i)=>{
    const w=weights[i];
    if(!r.burned){
      ctx.strokeStyle="#b08a54"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(r.x,r.y1); ctx.lineTo(r.x,r.y2-10); ctx.stroke();
      if(r.lit){
        const p=1-r.bt/0.9;
        emoji("🔥",r.x,r.y2-12-(r.y2-r.y1-20)*0+Math.sin(t*20)*1.5,13+p*6);
      }
    }
    ctx.fillStyle="#4d5560";
    ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,7); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="700 8px Inter"; ctx.textAlign="center";
    ctx.fillText("1T",w.x,w.y+3);
  });
  saws.forEach(s=>{
    if(s.arm){
      ctx.strokeStyle="#8a5a33"; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(s.arm[0],s.arm[1]); ctx.lineTo(s.wz[0]+s.wz[2]/2,s.wz[1]+s.wz[3]); ctx.stroke();
      ctx.setLineDash([]);
    }
  });
  fgums.forEach(g=>{ if(!g.used) drawGum(g.x,g.y); });
  placements.forEach(p=>{
    if(p.t==="gum"&&!p.used) drawGum(p.x,p.y);
    if(p.t==="cactus") emoji("🌵",p.x,p.y,28);
    if(p.t==="wax"){
      ctx.fillStyle="#f6f0e4"; ctx.fillRect(p.x-5,p.y-10,10,22);
      ctx.strokeStyle="#d8ceba"; ctx.lineWidth=1; ctx.strokeRect(p.x-5,p.y-10,10,22);
      if(p.lit){ emoji("🔥",p.x,p.y-17+Math.sin(t*18)*1.2,14);
        ctx.fillStyle="rgba(245,166,35,.15)"; ctx.beginPath(); ctx.arc(p.x,p.y-16,22,0,7); ctx.fill(); }
      else{ ctx.strokeStyle="#4a3524"; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(p.x,p.y-10); ctx.lineTo(p.x,p.y-15); ctx.stroke(); }
    }
  });
  ctx.fillStyle="#e8503f";
  ctx.beginPath(); ctx.moveTo(846,452); ctx.lineTo(938,452); ctx.lineTo(926,508); ctx.lineTo(858,508); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#c73e2f"; ctx.fillRect(846,452,92,7);
  cereal.forEach(c=>{
    ctx.strokeStyle=["#f5a623","#e8863f","#d9b64e","#c9762f"][c.c]; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,7); ctx.stroke();
  });
  if(L.horse) drawHorse(t);
  drawKiwi(t);
  popFx.forEach(p=>{
    ctx.strokeStyle="rgba(255,127,176,"+(p.t/0.4)+")"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(p.x,p.y,28+(0.4-p.t)*90,0,7); ctx.stroke();
  });
  if(ball){
    if(ball.bubble){
      ctx.fillStyle="rgba(255,127,176,.25)";
      ctx.beginPath(); ctx.arc(ball.x,ball.y,24,0,7); ctx.fill();
      ctx.strokeStyle="rgba(255,127,176,.8)"; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(ball.x,ball.y,24,0,7); ctx.stroke();
      ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(ball.x-7,ball.y-7,10,3.4,4.6); ctx.stroke();
    }
    ctx.fillStyle="#e8503f";
    ctx.beginPath(); ctx.arc(ball.x,ball.y,12,0,7); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.75)";
    ctx.beginPath(); ctx.arc(ball.x-4,ball.y-4,3.6,0,7); ctx.fill();
  }
  confetti.forEach(c=>{
    ctx.fillStyle=["#1fae9b","#f5a623","#ff7fb0","#e8503f","#7fb0ff"][c.c];
    ctx.fillRect(c.x,c.y,c.s,c.s);
  });
  if(mode==="edit"&&selTool){
    ctx.fillStyle="rgba(31,174,155,.85)";
    ctx.font="700 13px 'Baloo 2'"; ctx.textAlign="center";
    ctx.fillText("tap anywhere to place "+(selTool==="gum"?"🍬":selTool==="cactus"?"🌵":"🕯️"),480,528);
  }
}
function drawHorse(t){
  const hx=L.horse.x, hy=L.horse.y;
  const a=horseS&&horseS.anim>0?Math.sin((0.5-horseS.anim)/0.5*Math.PI)*0.34:0;
  const lx=hx-58, hop=(horseS&&horseS.anim>0.15)||mode==="won"?Math.abs(Math.sin(t*8))*7:0;
  ctx.save();
  ctx.strokeStyle="#5a3a20"; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(lx+8,hy-38-hop); ctx.lineTo(hx-46,hy-70); ctx.stroke();
  ctx.strokeStyle="#8a5a33"; ctx.lineWidth=3; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(lx-4,hy-22+ (hop?-hop:0)); ctx.lineTo(lx-4,hy); ctx.moveTo(lx+4,hy-22+(hop?-hop:0)); ctx.lineTo(lx+4,hy); ctx.stroke();
  ctx.fillStyle="#b48ae0";
  ctx.beginPath(); ctx.moveTo(lx,hy-42-hop); ctx.lineTo(lx-11,hy-20-hop); ctx.lineTo(lx+11,hy-20-hop); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#f0c8a0";
  ctx.beginPath(); ctx.arc(lx,hy-49-hop,8,0,7); ctx.fill();
  ctx.strokeStyle="#6d4520"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(lx-8,hy-52-hop,6,1.2,3.6); ctx.stroke();
  ctx.fillStyle="#2c1f12";
  ctx.beginPath(); ctx.arc(lx+3,hy-50-hop,1.3,0,7); ctx.fill();
  ctx.translate(hx-24,hy); ctx.rotate(-a); ctx.translate(-(hx-24),-hy);
  ctx.strokeStyle="#7a4a26"; ctx.lineWidth=5; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(hx-24,hy-32); ctx.lineTo(hx-24,hy);
  ctx.moveTo(hx-13,hy-32); ctx.lineTo(hx-13,hy); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(hx+18,hy-32); ctx.lineTo(hx+18+(a>0.05?15:0),hy-(a>0.05?16:0));
  ctx.moveTo(hx+27,hy-32); ctx.lineTo(hx+27+(a>0.05?17:0),hy-(a>0.05?12:0)); ctx.stroke();
  ctx.fillStyle="#a5683c";
  ctx.beginPath(); ctx.ellipse(hx,hy-42,35,17,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx-24,hy-52); ctx.lineTo(hx-44,hy-76); ctx.lineTo(hx-30,hy-42); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hx-48,hy-77,11,7,-0.45,0,7); ctx.fill();
  ctx.fillStyle="#8a5227";
  ctx.beginPath(); ctx.moveTo(hx-50,hy-84); ctx.lineTo(hx-46,hy-92); ctx.lineTo(hx-43,hy-83); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="#6d3f1c"; ctx.lineWidth=3;
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(hx-30+i*5,hy-56+i*2); ctx.lineTo(hx-36+i*5,hy-46+i*2); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(hx+33,hy-46);
  ctx.quadraticCurveTo(hx+48,hy-40,hx+44,hy-16); ctx.stroke();
  ctx.fillStyle="#2c1f12";
  ctx.beginPath(); ctx.arc(hx-50,hy-79,1.6,0,7); ctx.fill();
  ctx.fillStyle="#e8503f";
  ctx.beginPath(); ctx.roundRect?ctx.roundRect(hx-10,hy-58,22,9,3):ctx.rect(hx-10,hy-58,22,9); ctx.fill();
  ctx.restore();
}
function drawGum(x,y){
  ctx.fillStyle="#ff7fb0";
  ctx.beginPath(); ctx.arc(x,y,17,0,7); ctx.fill();
  ctx.fillStyle="#ff9cc3";
  ctx.beginPath(); ctx.arc(x-4,y-4,7,0,7); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.8)";
  ctx.beginPath(); ctx.arc(x-6,y-7,2.6,0,7); ctx.fill();
}

let last=0, acc=0;
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0); last=ts;
  if(mode==="run"){ acc+=dt; let n=0; while(acc>=DT&&n<8){ step(DT); acc-=DT; n++; } }
  cereal.forEach(c=>{ c.y+=c.vy*dt; if(c.y>492) c.y=492; });
  confetti.forEach(c=>{ c.y+=c.vy*dt; c.x+=Math.sin(c.y/30)*1.2; });
  confetti=confetti.filter(c=>c.y<H+20);
  popFx.forEach(p=>p.t-=dt); popFx=popFx.filter(p=>p.t>0);
  if(mode==="won") kiwiEat=1;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

loadLevel(Math.min(P.day-1,LEVELS.length-1));
if(!P.done[0]) showIntro();

window.KBM={
  LEVELS, load:loadLevel, place, go, reset:resetRun,
  ff(sec){ let tt=0; while(tt<sec&&mode==="run"){ step(DT); tt+=DT;
    if(trace.length===0||tt-trace[trace.length-1].t>0.25) trace.push({t:+tt.toFixed(2),x:Math.round(ball.x),y:Math.round(ball.y),b:ball.bubble?1:0}); } },
  state(){ return {lvl,mode,x:Math.round(ball.x),y:Math.round(ball.y),bubble:ball.bubble,T:+T.toFixed(2)}; },
  get trace(){ return trace; }, get P(){ return P; }, get inv(){ return inv; },
  probe(){ const s=saws[0];
    return { ball:{x:ball.x,y:ball.y,vx:+ball.vx.toFixed(1),vy:+ball.vy.toFixed(1),
      sp:+Math.hypot(ball.vx,ball.vy).toFixed(1),bubble:ball.bubble},
      weightOn:s&&s.weightOn, fired:s&&s.fired, fx:s&&s.fx, fy:s&&s.fy, ftime:s&&s.ftime,
      inPan:s&&inRect(ball.x,ball.y,s.pan), pan:s&&s.pan, mode }; },
  dbg(){ return { ropes:ropes.map(r=>({lit:r.lit,burned:r.burned,bt:+r.bt.toFixed(2)})),
    weights:weights.map(w=>({x:Math.round(w.x),y:Math.round(w.y),dyn:w.dyn,rest:w.rest})),
    saws:saws.map(s=>({weightOn:s.weightOn,fired:s.fired})),
    doors:doors.map(d=>({open:d.open})) }; }
};
