<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskIAP</title>
<meta name="description" content="Small apps.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23F6EFDF'/%3E%3Crect x='1.5' y='1.5' width='13' height='13' rx='2' fill='none' stroke='%23B4502B' stroke-width='1.2'/%3E%3Ctext x='8' y='12' font-family='Georgia,serif' font-size='10' font-weight='bold' text-anchor='middle' fill='%23B4502B'%3ET%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/journal.css?v=4">
<style>
.app-list{margin:0;padding:0;list-style:none}
.app-list li{padding:1.1rem 0;border-bottom:1px solid var(--rule)}
.app-name{
  font-family:var(--hand-head);
  font-variant:small-caps;
  letter-spacing:0.03em;
  font-size:1.3rem;
  font-weight:700;
  margin:0 0 0.15rem;
}
.app-name a{color:var(--ink);text-decoration:none}
.app-name a:hover{color:var(--accent);text-decoration:underline wavy 1px}
.app-blurb{margin:0;color:var(--ink-2);font-size:0.95rem}
</style>
</head>
<body>
<div class="page">

<header class="site-head">
  <h1 class="site-name"><a href="/">TaskIAP</a></h1>
  <p class="site-sub">Small Apps</p>
</header>

<main>
  <ul class="app-list">
    <li>
      <h2 class="app-name"><a href="blueberries/">Blueberry Rain</a></h2>
      <p class="app-blurb">Help Kenzie catch every falling blueberry. Lily narrates.</p>
    </li>
  </ul>
</main>

<footer class="site-foot">
  TaskIAP · 2026 · <a href="all.html">field notes</a>
</footer>

</div>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (rs) {
    rs.forEach(function (r) { r.unregister(); });
  });
}
if ("caches" in window) {
  caches.keys().then(function (ks) {
    ks.forEach(function (k) { caches.delete(k); });
  });
}
</script>
</body>
</html>
