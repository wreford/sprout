<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#181410">
<title>Idea Forge</title>
<style>
:root{--bg:#181410;--panel:#26201a;--edge:#443826;--ink:#faf2e6;--dim:#b8a78e;--acc:#ffb054;--mint:#8fe0b0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-y}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:10px;overflow-y:auto}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:1.1rem;color:var(--acc)}
#counts{font-size:.68rem;color:var(--dim);text-align:right}
#tabs{display:flex;gap:6px}
#tabs button{flex:1;background:var(--panel);border:1px solid var(--edge);color:var(--dim);
  border-radius:999px;padding:7px;font-weight:700;font-size:.8rem;cursor:pointer}
#tabs button.on{color:var(--acc);border-color:var(--acc)}
#idea{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px 14px;
  font-size:1.06rem;line-height:1.55;min-height:110px}
#idea .w{color:var(--acc);font-weight:700;border-bottom:2px dotted var(--edge);cursor:pointer;padding:0 1px}
#idea .w.lk{color:var(--mint);border-bottom:2px solid var(--mint)}
.row{display:flex;gap:6px}
.row button{flex:1;background:var(--acc);color:#3a2408;border:none;border-radius:11px;
  padding:11px;font-weight:800;font-size:.92rem;cursor:pointer}
.row button.alt{background:var(--panel);border:1px solid var(--edge);color:var(--dim)}
.hint{color:var(--dim);font-size:.74rem;text-align:center}
#favs,#premades{display:flex;flex-direction:column;gap:6px}
.fv{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:9px 11px;
  font-size:.86rem;line-height:1.4;display:flex;gap:8px;align-items:flex-start}
.fv span:first-child{flex:1}
.fv .x{color:var(--dim);cursor:pointer;font-weight:700}
#msg{color:var(--dim);font-size:.76rem;text-align:center;min-height:1em}
</style>
</head>
<body>
<div id="app">
  <header><h1>🔨 Idea Forge</h1><div id="counts"></div></header>
  <div id="tabs">
    <button data-t="forge" class="on">forge</button>
    <button data-t="premade">100+ ready</button>
    <button data-t="favs">saved</button>
  </div>
  <div id="forgeView">
    <div id="idea"></div>
    <p class="hint">tap a <span style="color:var(--acc)">word</span> to lock it, then forge around it</p>
    <div class="row" style="margin-top:6px">
      <button id="genBtn">⚒️ forge</button>
      <button id="saveBtn" class="alt">☆ save</button>
      <button id="shareBtn" class="alt">📤</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button id="wikiBtn" class="alt">🌐 wild nouns from Wikipedia</button>
    </div>
  </div>
  <div id="premadeView" style="display:none">
    <div class="row" style="margin-bottom:6px"><button id="shuffleBtn" class="alt">🔀 shuffle</button></div>
    <div id="premades"></div>
  </div>
  <div id="favsView" style="display:none"><div id="favs"></div></div>
  <p id="msg"></p>
</div>

let wildNouns=["the Antikythera mechanism","a Saturn V gantry","the Uffington White Horse"];
let seed=Date.now()>>>0;
function rng(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const pick=a=>a[Math.floor(rng()*a.length)];
let cur={tpl:null,slots:[]},locks={};
function forge(){
  let tpl=cur.tpl&&Object.keys(locks).length?cur.tpl:pick(TEMPLATES);
  if(tpl.includes("{wiki}")&&!wildNouns.length)tpl=TEMPLATES[0];
  const slots=[];let si=0;
  const html=tpl.replace(/\{(\w+)\}/g,(m,cat)=>{
    const idx=si++;
    let word;
    if(locks[idx]&&cur.slots[idx]&&cur.slots[idx].cat===cat)word=cur.slots[idx].word;
    else word=cat==="wiki"?pick(wildNouns):pick(BANK[cat]);
    slots.push({cat,word});
    return `<span class="w ${locks[idx]?'lk':''}" data-i="${idx}">${word}</span>`;
  });
  cur={tpl,slots};
  html=html.replace(/\ba(\s+<span[^>]*>)([aeiouAEIOU])/g,"an$1$2");
  $('idea').innerHTML=html;
  document.querySelectorAll('#idea .w').forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i;
    locks[i]=!locks[i];
    el.classList.toggle('lk',!!locks[i]);
    say(locks[i]?"locked — forge keeps “"+cur.slots[i].word+"”":"unlocked");
  });
  return ideaText();
}
function ideaText(){
  let si=0;
  return cur.tpl.replace(/\{(\w+)\}/g,()=>cur.slots[si++].word)
    .replace(/\ba\s+([aeiouAEIOU])/g,"an $1");
}
function say(t){$('msg').textContent=t;}
let F={favs:[]};
try{const s=JSON.parse(localStorage.getItem("ideaforge")||"null");if(s&&Array.isArray(s.favs))F=s;}catch(e){}
const save=()=>{try{localStorage.setItem("ideaforge",JSON.stringify(F));}catch(e){}};
function paintFavs(){
  $('favs').innerHTML=F.favs.map((t,i)=>`<div class="fv"><span>${t}</span>
    <span class="x" data-i="${i}">✕</span></div>`).join("")||
    '<p class="hint">forge something worth keeping, then ☆ save it</p>';
  document.querySelectorAll('#favs .x').forEach(el=>el.onclick=()=>{
    F.favs.splice(+el.dataset.i,1);save();paintFavs();
  });
}
let premOrder=PREMADE.map((_,i)=>i);
function paintPremade(){
  $('premades').innerHTML=premOrder.slice(0,40).map(i=>
    `<div class="fv"><span>${PREMADE[i]}</span><span class="x" data-p="${i}" title="save">☆</span></div>`).join("");
  document.querySelectorAll('#premades .x').forEach(el=>el.onclick=()=>{
    F.favs.unshift(PREMADE[+el.dataset.p]);save();say("saved to your list ✓");
  });
}
$('shuffleBtn').onclick=()=>{
  premOrder.sort(()=>Math.random()-0.5);paintPremade();
};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('forgeView').style.display=b.dataset.t==='forge'?"":"none";
  $('premadeView').style.display=b.dataset.t==='premade'?"":"none";
  $('favsView').style.display=b.dataset.t==='favs'?"":"none";
  if(b.dataset.t==='favs')paintFavs();
  if(b.dataset.t==='premade')paintPremade();
});
$('genBtn').onclick=()=>{forge();};
$('saveBtn').onclick=()=>{
  if(!cur.tpl)return;
  F.favs.unshift(ideaText());save();say("saved ✓ ("+F.favs.length+" kept)");
};
$('shareBtn').onclick=async()=>{
  if(!cur.tpl)return;
  const t=ideaText()+" — forged at taskiap.com/ideas/";
  if(navigator.share){try{await navigator.share({text:t});}catch(e){}}
  else{try{await navigator.clipboard.writeText(t);say("copied ✓");}catch(e){say(t);}}
};
$('wikiBtn').onclick=async()=>{
  say("raiding Wikipedia…");
  try{
    const r=await fetch("https://en.wikipedia.org/w/api.php?action=query&list=random&rnnamespace=0&rnlimit=10&format=json&origin=*");
    const j=await r.json();
    const got=j.query.random.map(x=>x.title).filter(t=>t.length<40);
    wildNouns=wildNouns.concat(got).slice(-60);
    say("+"+got.length+" wild nouns in the pool ("+wildNouns.length+" total) — forge a wiki-wild");
  }catch(e){say("Wikipedia unreachable — the local pool still works");}
};
function counts(){
  const base=Object.values(BANK).reduce((a,c)=>a+c.length,0);
  const phrases=BANK.material.length*BANK.structure.length+BANK.quality.length*BANK.structure.length
    +BANK.pmverb.length*BANK.pmnoun.length+BANK.verb.length*BANK.material.length;
  let combos=0;
  TEMPLATES.forEach(t=>{
    let c=1;t.replace(/\{(\w+)\}/g,(m,cat)=>{c*=(BANK[cat]||wildNouns).length;return m;});
    combos+=c;
  });
  return{base,phrases,combos,premade:PREMADE.length,templates:TEMPLATES.length};
}
(function(){
  const c=counts();
  $('counts').innerHTML=c.base+" terms · "+c.phrases.toLocaleString()+"+ pairings<br>"+
    (c.combos/1e6).toFixed(1)+"M prompts · "+c.premade+" ready-made";
})();
forge();say("tap forge until something itches");
window.IG={
  forge,seed:n=>{seed=n>>>0;},
  counts,ideaText,
  lock(i){locks[i]=true;},
  clearLocks(){locks={};},
  premade:i=>PREMADE[i],
  PREMADE,TEMPLATES,BANK,
  favs:()=>F.favs.slice(),
  saveFav(){F.favs.unshift(ideaText());save();},
  clear(){F={favs:[]};save();paintFavs();},
  addWild(w){wildNouns.push(w);},
  state(){return{premade:PREMADE.length,templates:TEMPLATES.length,base:counts().base,
    favs:F.favs.length,wild:wildNouns.length};}
};
</script>
