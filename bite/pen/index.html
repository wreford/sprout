<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BITE BITE BITE — THE PEN</title>
<meta name="description" content="A journal you keep. Thirty nights, one pen, three ways for the morning to find you.">
<meta name="apple-mobile-web-app-title" content="The Pen">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0a11">
<style>
  :root{
    --room:#0d0a11;        /* the dark of the room */
    --page:#141019;        /* journal page, barely lighter */
    --ink:#d8c9a8;         /* lamp-lit ink */
    --dim:#6d6672;         /* ash gray, UI chrome */
    --g:#9b7fd4;           /* G's violet, the margins */
    --red:#b3202a;         /* used once. the title. */
    --line:#241c2e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--room);
    color:var(--ink);
    font-family:"Courier New",Courier,monospace;
    font-size:16px;line-height:1.75;
    display:flex;justify-content:center;
  }
  /* the lamp: one soft pool of light behind the page */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 60% 45% at 50% 38%, rgba(216,201,168,.05), transparent 70%);
  }
  #app{width:min(34rem,92vw);padding:3.5rem 0 6rem}
  header{
    display:flex;justify-content:space-between;align-items:baseline;gap:1.2rem;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:.6rem;margin-bottom:2.2rem;
    font-size:.72rem;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;
  }
  #clock{font-variant-numeric:tabular-nums}
  #title{
    text-align:center;margin:14vh 0 3rem;
  }
  #title h1{
    font-size:2rem;font-weight:700;letter-spacing:.34em;color:var(--red);
    text-transform:uppercase;
  }
  #title .sub{margin-top:1rem;color:var(--dim);font-size:.85rem;letter-spacing:.18em}
  #title .doctor{margin-top:3rem;font-style:italic;color:var(--ink);opacity:.85}
  .dayline{
    color:var(--dim);font-size:.8rem;letter-spacing:.28em;text-transform:uppercase;
    margin-bottom:1.6rem;
  }
  .entry p{margin-bottom:1.15rem;white-space:pre-wrap}
  .entry .paren{color:var(--dim);font-style:italic}
  .entry .gmargin{
    color:var(--g);font-style:italic;border-left:2px solid var(--g);
    padding-left:.9rem;margin:1.15rem 0;opacity:0;transition:opacity 2.5s;
  }
  .entry .gmargin.show{opacity:.92}
  .choices{margin-top:2.4rem;display:flex;flex-direction:column;gap:.7rem}
  button{
    font-family:inherit;font-size:.95rem;color:var(--ink);
    background:transparent;border:1px solid var(--line);
    padding:.85rem 1.1rem;text-align:left;cursor:pointer;
    transition:border-color .3s,color .3s,opacity .3s;
  }
  button:hover,button:focus-visible{border-color:var(--ink);outline:none}
  button:focus-visible{box-shadow:0 0 0 1px var(--ink)}
  button.pill::before{content:"○ ";color:var(--dim)}
  button.signoff{
    margin-top:1.6rem;text-align:center;letter-spacing:.14em;
    border-color:var(--line);color:var(--dim);
  }
  button.signoff:hover,button.signoff:focus-visible{color:var(--ink);border-color:var(--ink)}
  button.ghost{ /* the delayed template-day choice */
    opacity:0;pointer-events:none;color:var(--g);border-color:transparent;
    font-style:italic;transition:opacity 3s;
  }
  button.ghost.on{opacity:.85;pointer-events:auto}
  #pills{
    position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%);
    display:flex;gap:.45rem;
  }
  #pills span{width:7px;height:7px;border-radius:50%;border:1px solid var(--dim)}
  #pills span.took{background:var(--dim)}
  #pills span.palmed{background:var(--g);border-color:var(--g)}
  .fade{animation:fadein 1.4s ease both}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .end-title{
    text-align:center;letter-spacing:.3em;text-transform:uppercase;
    color:var(--dim);font-size:.8rem;margin:3rem 0 1rem;
  }
  .credit{
    margin-top:4rem;text-align:center;color:var(--dim);font-size:.75rem;
    letter-spacing:.2em;line-height:2.2;
  }
  .credit b{color:var(--red);letter-spacing:.3em}
  /* paragraphs surface one at a time, like ink drying */
  .entry p.stag{opacity:0;animation:fadein 1.1s ease both}
  #humBtn{
    background:none;border:none;color:var(--dim);font:inherit;font-size:.72rem;
    letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:0;
  }
  #humBtn:hover,#humBtn:focus-visible{color:var(--ink);outline:none}
  .endlog{
    margin-top:2.2rem;color:var(--dim);font-size:.72rem;letter-spacing:.22em;
    text-transform:uppercase;text-align:center;line-height:2;
  }
  .endlog .found{color:var(--g)}
  .contnote{color:var(--dim);font-size:.8rem;text-align:center;margin-top:.8rem;font-style:italic}
  @media (prefers-reduced-motion:reduce){
    .fade{animation:none}
    .entry p.stag{animation:none;opacity:1}
    .entry .gmargin{transition:none}
    button.ghost{transition:opacity .5s}
  }
</style>
</head>
<body>
<div id="app">
  <header hidden id="hud">
    <span id="nightlabel"></span>
    <span><button id="humBtn" aria-label="toggle room sound">room: quiet</button>&nbsp;&nbsp;<span id="clock">9:12 PM</span></span>
  </header>
  <main id="stage" aria-live="polite"></main>
  <div id="pills" hidden></div>
</div>

<script>
/* ============================================================
   BITE BITE BITE — THE PEN — a journal you keep
   State: bleed (how much of the night survives the morning)
   ============================================================ */
const S = { night:0, bleed:0, keptNote:false, askedCoin:false, checked:false, pills:[] };
/* -------- the house remembers -------- */
const SAVE_KEY='bitepen_v1';
let SAVED={ endings:[], mid:null, hum:false };
try{ SAVED=Object.assign(SAVED, JSON.parse(localStorage.getItem(SAVE_KEY))||{}); }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(SAVED)); }catch(e){} }
function saveMid(){ SAVED.mid={ night:S.night, S:{...S, pills:[...S.pills]} }; persist(); }
function clearMid(){ SAVED.mid=null; persist(); }

/* -------- the room: a lamp hum, a clock tick, a pen -------- */
let AC=null, humG=null, humOn=false;
function ensureAC(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const len=AC.sampleRate*2, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<len;i++){ last=(last+(Math.random()*2-1)*.02)*.985; d[i]=last*8; }
  const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=110;
  humG=AC.createGain(); humG.gain.value=0;
  src.connect(f); f.connect(humG); humG.connect(AC.destination); src.start();
  setInterval(()=>{ /* the hall clock, held very far away */
    if(!humOn) return;
    const t0=AC.currentTime;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(.012,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.04);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+.05);
  },1000);
}
function setHum(v){
  humOn=v; SAVED.hum=v; persist();
  document.getElementById('humBtn').textContent=v?'room: humming':'room: quiet';
  if(v){ ensureAC(); if(AC.state==='suspended')AC.resume(); humG.gain.setTargetAtTime(.5,AC.currentTime,.8); }
  else if(humG) humG.gain.setTargetAtTime(0,AC.currentTime,.4);
}
function penScratch(){
  if(!humOn||!AC) return;
  const t0=AC.currentTime;
  const n=Math.floor(AC.sampleRate*.12), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n)*(.4+.6*Math.sin(i/40));
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=.8;
  const g=AC.createGain(); g.gain.value=.05;
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t0);
}
const stage = document.getElementById('stage');
const hud = document.getElementById('hud');
const nightlabel = document.getElementById('nightlabel');
const pillsEl = document.getElementById('pills');

const NIGHTS = [
{ day:1, text:[
`The doctor I saw when I was eleven said I should keep a journal. Anchor yourself in the day, she said. So. Anchoring.`,
`(A thing I notice and don't examine: I never wake up feeling like I got up. I wake up feeling like I sat down. Like the bed says take a seat and I do.)`,
`At 7:03 I found a note on the kitchen table. Not in Grandma's hand. Not in any hand I recognize. Just: sleep again we'll have to talk.`,
`I showed it to Grandma. She read it once. Didn't ask where it came from. Just said: "Burn it."`],
 choice:{q:null,opts:[
  {t:`Burn it in the sink, the way she watches you do it.`,fx:s=>{}},
  {t:`Fold it small. Keep it in your shoe.`,fx:s=>{s.keptNote=true;s.bleed++}}]}},

{ day:2, text:[
`The note came back. Same handwriting. Same message.`,
`Different paper, though. This time it was warm.`,
`I held it a long time. Paper doesn't stay warm. Paper has never once stayed warm. I checked the toaster like an idiot. The toaster had nothing to say for itself.`],
 choice:{q:null,opts:[
  {t:`Press it to your cheek before it cools.`,fx:s=>{s.bleed++}},
  {t:`Drop it. Wash your hands twice.`,fx:s=>{}}]}},

{ day:3, text:[
`3:33 this morning the clock in the hall was humming. Not ticking. Humming, like it was holding a note it couldn't put down.`,
`I got up to look. The mirror at the end of the hall got there first.`,
`(The mirror swears I never left. The mirror is very confident for something that only knows one room.)`],
 choice:{q:null,opts:[
  {t:`Count your teeth in the mirror. Write down the number.`,fx:s=>{s.bleed++}},
  {t:`Go back to bed. File it under sleep is weird.`,fx:s=>{}}]}},

{ day:4, key:'template', text:[
`Today I tried to account for a full day. Hour by hour. Like an audit.`,
`6 AM to 8 AM: tea, Grandma, the sticking cabinet. 8 to 3: school, which is beige. 3 to 9: homework, dinner, this.`,
`9 PM to 6 AM: sleep.`,
`Except the audit doesn't balance. There's a draft coming from 2 AM to 4 AM. Two hours with no furniture in them. I knocked and nobody answered.`],
 choice:{q:null,opts:[
  {t:`Write it down and underline it: WHERE WAS I.`,fx:s=>{s.bleed++}},
  {t:`Balance the books. Sleep is sleep. Audits are for banks.`,fx:s=>{}}]}},

{ day:7, text:[
`I told the goldfish a secret today. Not an important one. A test secret.`,
`He took it the way he takes everything, going in circles, keeping his face very still.`,
`At dinner Grandma said, apropos of nothing, "Don't tell that fish your business." I laughed. She didn't.`],
 choice:{q:null,opts:[
  {t:`Ask her what the fish told her.`,fx:s=>{s.bleed++}},
  {t:`Laugh again, softer, and let it be a joke.`,fx:s=>{}}]}},

{ day:9, text:[
`My shoes were by the door this morning. I line them up at night, toes to the wall. Everyone does. It's how shoes sleep.`,
`This morning the toes faced OUT. Toward the door. Like they'd come home and not been put away properly.`,
`The left lace was wet. It hasn't rained in nine days. I know, because I anchor now. I have receipts for the sky.`],
 choice:{q:null,opts:[
  {t:`Smell the lace. Know what kind of wet.`,fx:s=>{s.bleed++}},
  {t:`Turn them toes-to-wall and stop looking at them.`,fx:s=>{}}]}},

{ day:11, text:[
`My birthday. Fifteen.`,
`Grandma did the coin trick at breakfast, the one from when I turned eleven, the coin from behind my ear. Her hands aren't fast anymore. I saw the coin the whole time.`,
`It was already behind my ear. She didn't put it there. She took it OUT.`,
`She saw me see it. Neither of us said anything for one whole cup of tea.`],
 choice:{q:null,opts:[
  {t:`"Grandma. How long has it been back there?"`,fx:s=>{s.askedCoin=true;s.bleed++}},
  {t:`Clap. Say "do it again." Give her the ordinary morning.`,fx:s=>{}}]}},

{ day:4, key:'repeat', text:[
`Today I tried to account for a full day. Hour by hour. Like an audit.`,
`6 AM to 8 AM: tea, Grandma, the sticking cabinet. 8 to 3: school, which is beige. 3 to 9: homework, dinner, this.`,
`9 PM to 6 AM: sleep.`,
`Except the audit doesn't balance. There's a draft coming from 2 AM to 4 AM. Two hours with no furniture in them. I knocked and nobody answered.`],
 choice:{q:null,opts:[
  {t:`Write it down and underline it: WHERE WAS I.`,fx:s=>{s.bleed++}},
  {t:`Balance the books. Sleep is sleep. Audits are for banks.`,fx:s=>{}}],
  ghost:{t:`…I have written this before. Word for word. Check the date.`,fx:s=>{s.checked=true;s.bleed+=2}}}},

{ day:19, text:[
`Grandma's hands get steadier the more she drinks. I used to file that under Performance. I'm moving the file.`,
`Tonight she folded my napkin into smaller and smaller squares until it couldn't fold anymore, and put it in her cardigan pocket, and said:`,
`"Some things need pockets."`,
`I asked what that meant. She said pockets are where you keep a thing you're not done carrying.`],
 choice:{q:null,opts:[
  {t:`Ask her what she's not done carrying.`,fx:s=>{s.bleed++}},
  {t:`Nod. Fold your own napkin. Start a pocket of your own.`,fx:s=>{s.keptNote=true}}]}},

{ day:23, text:[
`At school today the light did the thing. Everything went beige, then beige-er, then for one frame, and I mean one frame, the wall behind the teacher didn't have a wall behind it.`,
`Nobody looked up. Twenty-six people did not look up. I get the feeling school is a rendering. Like someone drew it and filled it in with beige, and I'm just the moving part they forgot to erase.`],
 choice:{q:null,opts:[
  {t:`Look directly at the flicker. Hold your eyes open.`,fx:s=>{s.bleed++}},
  {t:`Keep your eyes on the desk. Moving parts get erased.`,fx:s=>{}}]}},
];

/* -------- rendering -------- */
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
document.addEventListener('click',e=>{ if(e.target.tagName==='BUTTON') penScratch(); },true);
function clear(){stage.innerHTML=''}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}

function titleScreen(){
  clear();hud.hidden=true;pillsEl.hidden=true;
  const t=el('div','fade');t.id='title';
  t.append(
    el('h1',null,'Bite Bite Bite'),
    el('div','sub','THE PEN &nbsp;·&nbsp; a journal you keep'),
    el('div','doctor','"The doctor I saw when I was eleven said I should keep a journal.<br>Anchor yourself in the day, she said."'),
  );
  const c=el('div','choices');
  if(SAVED.mid && SAVED.mid.night>0){
    const r=el('button',null,`Pick the pen back up. (Night ${SAVED.mid.night+1})`);
    r.onclick=()=>{ Object.assign(S,SAVED.mid.S); drawPills(); startNight(SAVED.mid.night); };
    c.append(r);
    const b=el('button',null,'Start a fresh page. From the first night.');
    b.onclick=()=>{ clearMid(); resetS(); startNight(0); };
    c.append(b);
  } else {
    const b=el('button',null,'So. Anchoring.');
    b.onclick=()=>{ resetS(); startNight(0); };
    c.append(b);
  }
  t.append(c);
  /* the three ways a morning can find you */
  const ends=['THE ANCHOR','THE SPLIT','THE WAKE'];
  const log=el('div','endlog',
    'mornings found: '+ends.map(e2=>SAVED.endings.includes(e2)
      ?`<span class="found">✒ ${e2}</span>`:'✒ —').join(' &nbsp;·&nbsp; '));
  t.append(log);
  stage.append(t);
}
function resetS(){ Object.assign(S,{night:0,bleed:0,keptNote:false,askedCoin:false,checked:false,pills:[]}); mIdx=0; drawPills(); }

function startNight(i){
  S.night=i;
  const n=NIGHTS[i];
  clear();scrollTop();
  hud.hidden=false;pillsEl.hidden=false;
  nightlabel.textContent=`Night ${i+1} — Day ${n.day}`;
  const wrap=el('div','fade');
  wrap.append(el('div','dayline',`Day ${n.day}.`));
  const entry=el('div','entry');
  n.text.forEach((p,pi)=>{
    const cls=(p.startsWith('(')?'paren ':'')+'stag';
    const pe=el('p',cls,p);
    pe.style.animationDelay=(0.15+pi*0.45)+'s';
    entry.append(pe);
  });
  saveMid();
  /* G's margin appears when the night is bleeding through */
  if(S.bleed>=4 && !n.key){
    const g=el('p','gmargin',marginLine());
    entry.append(g);
    requestAnimationFrame(()=>setTimeout(()=>g.classList.add('show'),900));
  }
  wrap.append(entry);
  const c=el('div','choices');
  n.choice.opts.forEach(o=>{
    const b=el('button',null,o.t);
    b.onclick=()=>{o.fx(S);pillStep(i,wrap,c)};
    c.append(b);
  });
  if(n.choice.ghost){
    const g=el('button','ghost',n.choice.ghost.t);
    g.onclick=()=>{n.choice.ghost.fx(S);pillStep(i,wrap,c)};
    c.append(g);
    setTimeout(()=>g.classList.add('on'),3200);
  }
  wrap.append(c);stage.append(wrap);
}

const MARGINS=[
`you fold the note smaller every night. i unfold it.`,
`the wet lace was mine. sorry. i ran the last block.`,
`two soft, one firm on the wall means i can hear you.`,
`the hours aren't missing. they're mine. i give them back as tired.`,
`don't ask her about the coin again. she cries after you sleep.`];
let mIdx=0;
function marginLine(){const l=MARGINS[mIdx%MARGINS.length];mIdx++;return l}

function pillStep(i,wrap,oldChoices){
  oldChoices.remove();
  const c=el('div','choices fade');
  c.append(el('p','paren','(The pill sits by the water glass. It has sat there every night of my life. It is very patient.)'));
  const take=el('button','pill','Take the pill. Anchor. Morning will be clean.');
  const palm=el('button','pill','Palm it. Whatever the night is, meet it.');
  take.onclick=()=>{S.pills.push('took');signoff(i,wrap,c)};
  palm.onclick=()=>{S.bleed++;S.pills.push('palmed');signoff(i,wrap,c)};
  c.append(take,palm);wrap.append(c);drawPills();
}

function drawPills(){
  pillsEl.innerHTML='';
  S.pills.forEach(p=>{const d=el('span',p);pillsEl.append(d)});
}

function signoff(i,wrap,oldChoices){
  oldChoices.remove();drawPills();
  const c=el('div','choices fade');
  const b=el('button','signoff','Goodnight, again.');
  b.onclick=()=>{ i+1<NIGHTS.length ? startNight(i+1) : finale(); };
  c.append(b);wrap.append(c);
}

/* -------- endings -------- */
function finale(){
  clear();scrollTop();
  nightlabel.textContent=`Night ${NIGHTS.length+1} — Day 30`;
  const wrap=el('div','fade');
  wrap.append(el('div','dayline','Day 30.'));
  const entry=el('div','entry');
  const ending = S.bleed>=7 ? 'wake' : S.bleed>=3 ? 'split' : 'anchor';

  if(ending==='anchor'){
    entry.append(
      el('p',null,`Thirty days of anchoring. The doctor would be proud. The entries are getting shorter, which she'd say means the anchor is holding.`),
      el('p',null,`Nothing happened today. Nothing happened yesterday. I checked.`),
      el('p','paren',`(I used to file things. I don't seem to have the folders anymore. That's probably what better feels like.)`),
      el('p',null,`Tea with Grandma. Her hands were steady all day. Or I only looked at them once. One of those.`),
    );
    wrap.append(entry);
    const c=el('div','choices');
    const b=el('button','signoff','Goodnight.');
    b.onclick=()=>credits('THE ANCHOR',
      `no again.`,
      `Thirty mornings from now she will find a note in her own handwriting and burn it without reading it, the way you're supposed to. The house will approve. The house has always approved of her.`);
    c.append(b);wrap.append(c);
  }

  if(ending==='split'){
    entry.append(
      el('p',null,`I came down at 6:12 and tonight's note was already on the table. That's not the strange part anymore.`),
      el('p',null,`The strange part: the pen was still warm, and the pen is mine, and the note said the thing it always says, and for the first time I read it the way you read a letter instead of a threat.`),
      el('p',null,`sleep again. we'll have to talk.`),
      el('p','paren',`(We. Have to. Talk. It was never an order. It was an invitation with nowhere to put the stamp.)`),
    );
    wrap.append(entry);
    const c=el('div','choices');
    const b=el('button','signoff','Goodnight, again.');
    b.onclick=()=>{
      c.remove();
      const c2=el('div','choices fade');
      const g=el('button','signoff',''); g.style.color='var(--g)';g.style.borderColor='var(--g)';
      g.textContent='…again.';
      const note=el('p','gmargin show','— her handwriting. Not yours. The first reply.');
      wrap.append(note);
      g.onclick=()=>credits('THE SPLIT',
        `Two hands. One pen.`,
        `Somewhere a second journal is keeping these same thirty days. You have not read it yet. It has read you every night.`);
      c2.append(g);wrap.append(c2);
    };
    c.append(b);wrap.append(c);
  }

  if(ending==='wake'){
    entry.append(
      el('p',null,`I didn't take it. Ten nights now. The draft between 2 and 4 AM has furniture in it after all. It has a corridor, and a room that hums like the hall clock, and work.`),
      el('p',null,`I remember the work. I remember whose shoes come home wet.`),
      S.checked ? el('p',null,`And I remember Day 4, both times they gave it to me. The audit balances now. Every hour is accounted for and one of the accountants is me.`)
                : el('p',null,`The audit balances now. Every hour is accounted for and one of the accountants is me.`),
      el('p','paren',`(Every fear was just a scheme. The scream was mine, so the chef was too.)`),
    );
    wrap.append(entry);
    const c=el('div','choices');
    const b=el('button','signoff','Good morning, again.');
    b.onclick=()=>credits('THE WAKE',
      `Time to wake up.`,
      `The pill sits by the water glass, very patient, and can go on being patient forever. Tonight the note will be addressed to someone, and the handwriting will match, and the handwriting will be yours, both of you.`);
    c.append(b);wrap.append(c);
  }

  stage.append(wrap);
}

function credits(name,line,epilogue){
  if(!SAVED.endings.includes(name)) SAVED.endings.push(name);
  clearMid(); persist();
  clear();scrollTop();hud.hidden=true;pillsEl.hidden=true;
  const w=el('div','fade');
  w.append(
    el('div','end-title',`ending: ${name}`),
    el('div','entry',`<p style="text-align:center">${line}</p><p class="paren" style="margin-top:2rem">${epilogue}</p>`),
  );
  const extra=[];
  if(S.checked) extra.push('YOU CHECKED THE DATE');
  if(S.keptNote) extra.push('SOME THINGS NEED POCKETS');
  if(S.askedCoin) extra.push('YOU ASKED ABOUT THE COIN');
  const cred=el('div','credit',
    (extra.length?extra.join(' &nbsp;·&nbsp; ')+'<br><br>':'')+
    `<b>BITE BITE BITE</b><br>THE PEN — 200 episodes, one per night<br>her journal posts at 9:12`);
  w.append(cred);
  const c=el('div','choices');
  const r=el('button','signoff','Sleep again. (Restart)');
  r.onclick=()=>{resetS();titleScreen()};
  c.append(r);w.append(c);
  stage.append(w);
}

/* live clock: always 9:12-something. the ritual minute. */
setInterval(()=>{
  const clock=document.getElementById('clock');
  /* once the night starts bleeding through, the clock forgets itself */
  if(S.bleed>=3 && Math.random()<.05){
    clock.textContent='3:33:33 AM';
    return;
  }
  const s=new Date().getSeconds().toString().padStart(2,'0');
  clock.textContent=`9:12:${s} PM`;
},1000);

document.getElementById('humBtn').addEventListener('click',()=>setHum(!humOn));

titleScreen();
if(SAVED.hum) document.addEventListener('click',function once(){ setHum(true); document.removeEventListener('click',once); },{once:true});

window.PEN={ S, NIGHTS, startNight, finale, credits, titleScreen, resetS,
  get SAVED(){return SAVED;}, saveMid, clearMid, setHum, get humOn(){return humOn;} };
</script>
</body>
