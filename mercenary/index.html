<style>
:root{--bg:#efe4cc;--paper:#fbf5e6;--ink:#2a2116;--mute:#7a6a50;--line:rgba(60,44,20,.22);--gold:#b8892a;--gold2:#e8c56a;--red:#a8321f;--blue:#2f5fb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:-apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
body{position:fixed;inset:0;background:var(--bg) url(img/story/landscape-castle.webp) center top/cover no-repeat}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(239,228,204,.80),rgba(239,228,204,.93) 40%,rgba(239,228,204,.97));pointer-events:none}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 4px) calc(env(safe-area-inset-right) + 6px) calc(env(safe-area-inset-bottom) + 6px) calc(env(safe-area-inset-left) + 6px);gap:4px;max-width:1120px;margin:0 auto}
.frame{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 1px 0 rgba(60,44,20,.12)}
#top{display:flex;align-items:center;gap:5px}
#me{position:relative;width:46px;height:46px;flex:0 0 auto}
#me img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.25);background:#3a2e1e}
.badge{position:absolute;font:800 11px system-ui;color:#fff;border-radius:9px;padding:1px 5px;box-shadow:0 1px 2px rgba(0,0,0,.35)}
#hpB{left:-4px;bottom:-3px;background:var(--red)}
#arB{right:-6px;bottom:-3px;background:#5b6b7e;display:flex;align-items:center;gap:1px}
#arB img{width:12px;height:12px}
.chip{display:flex;align-items:center;gap:4px;padding:3px 8px;font:800 14px system-ui;white-space:nowrap;height:34px}
.chip img{width:22px;height:22px;border-radius:5px}
#goldC{color:#7a5a08}
#todC img{height:24px;width:44px;object-fit:cover;border-radius:5px}
@media (max-width:480px){#todC span{display:none}.chip{padding:3px 6px}}
#todC span{font-size:12px}
#top .sp{flex:1}
.ib{font:700 13px system-ui;color:var(--ink);background:linear-gradient(#fffaf0,#efe2c4);border:1px solid #b9a37a;border-radius:9px;padding:5px 9px;box-shadow:0 2px 0 #b9a37a;cursor:pointer}
.ib:active{transform:translateY(1px);box-shadow:0 1px 0 #b9a37a}
.ib[disabled]{opacity:.5}
#iconBtns{display:flex;gap:4px}
#iconBtns .ib{width:34px;height:34px;padding:0;font-size:15px}
#opps{display:flex;gap:3px}
.opp{position:relative;flex:1;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#3a2e1e;min-width:0}
.opp img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;opacity:.95}
.opp span{position:absolute;right:2px;bottom:1px;font:800 11px system-ui;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
.opp.next{outline:2px solid var(--red);outline-offset:-2px}
.opp.me{outline:2px solid var(--gold);outline-offset:-2px}
.opp.dead img{filter:grayscale(1) brightness(.5)}
.opp.dead span{color:#ddd}
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
#fieldwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;border-radius:12px;border:3px solid #6b5228;box-shadow:0 0 0 1px var(--gold2),0 8px 22px rgba(0,0,0,.28);touch-action:none;background:#2a2116}
#speed{position:absolute;top:8px;right:8px;display:none;z-index:3}
.fighting #speed{display:block}
#panel{display:flex;flex-direction:column;gap:4px}
.fighting #panel{opacity:.45;pointer-events:none}
#campRow{display:flex;gap:4px;align-items:stretch}
#campRow .lbl{font:800 10px system-ui;color:var(--mute);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;letter-spacing:.08em}
.camp{flex:1;height:48px;border-radius:8px;border:1px dashed #b9a37a;background:rgba(255,250,236,.7);display:flex;align-items:center;justify-content:center;position:relative;padding:0;overflow:hidden}
.camp img{width:52px;height:52px;margin-top:-6px}
.camp.sel{border:2px solid var(--gold);background:#fff3cf}
.camp small{position:absolute;bottom:0;left:0;right:0;text-align:center;font:800 9px system-ui;color:#fff;background:rgba(30,22,10,.6)}
#syn{display:flex;gap:3px;flex-wrap:wrap;min-height:18px}
.syn{font:800 10.5px system-ui;border-radius:6px;padding:2px 6px;color:#fff;opacity:.5}
.syn.on{opacity:1;box-shadow:0 0 0 1px rgba(255,255,255,.6) inset}
#ctrl{display:flex;gap:4px}
#ctrl .ib{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;gap:4px;line-height:1.05;padding:3px 5px;font-size:12.5px}
.cost{display:inline-flex;align-items:center;gap:1px;color:#7a5a08;font-weight:900}
.cost img{width:14px;height:14px}
#holdB.on{background:linear-gradient(#e2f0ff,#c6dcf6);border-color:#6f93c4;box-shadow:0 2px 0 #6f93c4}
#shop{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.card{position:relative;border-radius:9px;overflow:hidden;border:2px solid #888;background:#2a2116;padding:0;height:104px;font:inherit;color:#fff;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.card .pt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(10,6,2,.92) 78%)}
.card .tx{position:absolute;left:0;right:0;bottom:2px;z-index:2;padding:0 2px}
.card .nm{font:800 10px/1.05 system-ui;text-shadow:0 1px 2px #000;display:block;max-height:22px;overflow:hidden}
.card .st{font:800 11px system-ui;display:flex;justify-content:center;gap:5px;margin-top:2px}
.card .st b{color:#ffd76a}.card .st i{font-style:normal;color:#ff9a8a}
.card .ab{display:block;font:700 8.5px system-ui;color:#d6c8ff;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tier{position:absolute;top:2px;left:3px;z-index:2;font:900 10px system-ui;color:#ffd34a;text-shadow:0 1px 2px #000}
.card .wp{position:absolute;top:2px;right:2px;z-index:2;width:20px;height:20px;border-radius:5px;background:rgba(0,0,0,.45)}
.card .pair{position:absolute;top:24px;right:2px;z-index:2;font:900 9px system-ui;background:var(--gold);color:#2a2116;border-radius:5px;padding:0 3px}
.card.held{box-shadow:0 0 0 2px #6fb6ff,0 2px 0 rgba(0,0,0,.25)}
.card.poor{filter:saturate(.55) brightness(.8)}
.card.item{background:radial-gradient(circle at 50% 35%,#5a4a2a,#2a2116)}
.card.item .ic{position:absolute;left:50%;top:8px;width:50px;height:50px;transform:translateX(-50%)}
.card.empty{background:rgba(255,250,236,.4);border:1px dashed #b9a37a;color:var(--mute);font-size:11px;display:flex;align-items:center;justify-content:center}
.card.empty:after{display:none}
#fight{min-height:48px;font:900 18px Georgia,serif;letter-spacing:.04em;border:none;border-radius:12px;color:#fff;background:linear-gradient(#c8462c,#8e2414);box-shadow:0 3px 0 #5e170c,inset 0 1px 0 rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;gap:8px}
#fight img{width:28px;height:28px;filter:drop-shadow(0 1px 1px #000)}
#fight:active{transform:translateY(2px);box-shadow:0 1px 0 #5e170c}
#info{position:absolute;left:6px;right:6px;bottom:6px;z-index:4;display:none;padding:8px 10px;font-size:13px;background:rgba(251,245,230,.98)}
#info .row{display:flex;gap:9px;align-items:flex-start}
#info .pt{width:84px;height:84px;border-radius:9px;object-fit:cover;object-position:50% 18%;border:2px solid var(--gold);flex:0 0 auto;background:#2a2116}
#info h3{margin:0;font:800 16px Georgia,serif}
#info .meta{color:var(--mute);font-size:11.5px;margin:1px 0 4px}
#info .stats{display:flex;gap:10px;align-items:center;font-weight:800}
#info .stats img{width:20px;height:20px;vertical-align:-5px}
#info .abl{margin:3px 0 0;font-size:12px;line-height:1.3}
#info .btns{display:flex;gap:6px;margin-top:6px}
#info .btns button{flex:1}
#hint{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:rgba(30,22,10,.85);color:#ffe9a8;font:800 12px system-ui;padding:5px 10px;border-radius:10px;z-index:3;display:none;white-space:nowrap}
#banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.96);background:linear-gradient(rgba(42,30,14,.94),rgba(24,16,6,.94));border:1px solid var(--gold2);color:#fff;padding:10px 20px;border-radius:12px;font:900 18px Georgia,serif;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap;z-index:5}
#banner small{display:block;font:700 12px system-ui;opacity:.88;margin-top:3px}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#vs{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(14,10,4,.62);pointer-events:none}
#vs.on{display:flex}
#vs .side{display:flex;flex-direction:column;align-items:center;gap:6px;width:40%;max-width:220px}
#vs img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 20%;border-radius:14px;border:3px solid var(--gold2);box-shadow:0 10px 30px rgba(0,0,0,.6)}
#vs b{color:#fff;font:900 16px Georgia,serif;text-shadow:0 2px 4px #000;text-align:center}
#vs .mid{color:var(--gold2);font:900 30px Georgia,serif;margin:0 10px;text-shadow:0 2px 6px #000}
#vs .info{position:absolute;bottom:18%;left:0;right:0;text-align:center;color:#fff;font:700 13px system-ui;text-shadow:0 1px 3px #000}
#vs .L{animation:inL .45s ease-out both}#vs .R{animation:inR .45s ease-out both}
@keyframes inL{from{transform:translateX(-60vw)}to{transform:none}}@keyframes inR{from{transform:translateX(60vw)}to{transform:none}}
#modal{position:fixed;inset:0;background:rgba(20,14,6,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:9}
#modal.on{display:flex}
#mcard{max-width:520px;width:100%;max-height:94dvh;overflow:auto;padding:16px;background:var(--paper);border-radius:14px;border:1px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.45)}
#mcard.title{background:linear-gradient(rgba(251,245,230,.85),rgba(251,245,230,.97) 55%),url(img/story/landscape-castle.webp) center top/cover}
#mcard h1{margin:0;font:900 30px Georgia,serif;color:#5e2a10;text-align:center;letter-spacing:.02em}
#mcard h2{margin:0 0 6px;font:800 21px Georgia,serif}
#mcard p{margin:0 0 10px;line-height:1.42;font-size:14px}
#mcard .sub{text-align:center;color:var(--mute);font-style:italic;margin:4px 0 10px}
.leaders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.leader{background:#fff;border:2px solid var(--line);border-radius:12px;padding:0 0 8px;text-align:center;font:inherit;color:inherit;overflow:hidden}
.leader img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 20%;display:block}
.leader b{display:block;font:800 13px Georgia,serif;margin-top:5px}
.leader span{display:block;font-size:11px;color:var(--mute);margin:3px 5px 0;line-height:1.3}
.leader em{display:block;font-style:normal;font-size:11px;color:#5b6b7e;margin-top:3px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.picks .card{height:150px}
.big{width:100%;min-height:46px;font:800 15px system-ui;border:none;border-radius:11px;background:linear-gradient(#c8462c,#8e2414);color:#fff;margin-top:6px;box-shadow:0 3px 0 #5e170c}
.alt{background:linear-gradient(#fffaf0,#efe2c4);color:var(--ink);border:1px solid #b9a37a;box-shadow:0 2px 0 #b9a37a}
#mcard small{color:var(--mute);font-size:12px;line-height:1.4;display:block}
.toggles{display:flex;gap:6px;margin-top:6px}.toggles .big{margin-top:0}
@media (min-width:820px){#main{flex-direction:row}#fieldwrap{flex:1.35}#panel{flex:1;justify-content:flex-end}#shop{grid-template-columns:repeat(4,1fr)}.card{height:128px}.card .nm{font-size:12px}.card .st{font-size:13px}.card .ab{font-size:10px}}
@media (orientation:landscape) and (max-height:520px){#main{flex-direction:row}#panel{width:50%}.card{height:84px}#opps{display:none}}
</style>
</head>

const uName=u=>u.promo?UD[u.id].pn:UD[u.id].n,uImg=u=>u.promo?UD[u.id].pimg:UD[u.id].img,uPt=u=>u.promo?UD[u.id].ppt:UD[u.id].pt;

let S=null;
function newGame(leader){
 RNG=Math.random;UID=1;const pool={};UL.forEach(a=>pool[a[0]]=COPIES[a[2]]);
 const others=shuffle(LEADERS.filter(l=>l.id!==leader.id)).concat(shuffle([...LEADERS])).slice(0,7);const facs=shuffle(Object.keys(FAC));
 const mk=(l,isMe,i)=>({me:isMe,name:isMe?"You":l.n,leader:l.id,hp:30,armor:l.armor,board:new Array(SLOTS).fill(null),camp:new Array(CAMP).fill(null),keep:1,keepCd:0,gold:0,alive:1,place:0,fav:facs[i%6]});

 startRound()}
const me=()=>S.players[0];
const goldFor=r=>Math.min(10,2+r);
function keepCost(p){if(p.keep>=5)return 0;let c=KEEPCOST[p.keep+1]-p.keepCd;if(p.leader==="dlord")c--;return Math.max(0,c)}
function startRound(){
 S.tod=(S.round-1)%6;S.terrain=pick(Object.keys(TERR));
 for(const p of S.players){if(!p.alive)continue;p.gold=goldFor(S.round)+(p.me?S.bonusGold:0);if(S.round>1&&p.keep<5)p.keepCd++}
 S.bonusGold=0;S.freeRoll=me().leader==="lady";
 if(!S.held){rollShop();rollItem()}S.held=false;
 S.players.forEach((p,i)=>{if(i&&p.alive)aiTurn(p)});
 const alive=S.players.map((p,i)=>i).filter(i=>i&&S.players[i].alive);let opts=alive.filter(i=>!S.lastOpp.slice(-Math.min(3,alive.length-1)).includes(i));if(!opts.length)opts=alive;S.nextOpp=pick(opts);
 S.phase="shop";save();render();playMusic("shop")}
function shopFor(p){const n=SHOPN[p.keep];const bag=[];for(const id in S.pool){if(UD[id].t<=p.keep)for(let i=0;i<S.pool[id];i++)bag.push(id)}const out=[];for(let i=0;i<n&&bag.length;i++){const j=ri(bag.length);out.push(bag[j]);bag.splice(j,1)}return out}
function rollShop(){S.shop.forEach(id=>{if(id)S.pool[id]++});S.shop=shopFor(me());S.shop.forEach(id=>S.pool[id]--)}
function rollItem(){S.item=RNG()<.85?pick(ITEMS).id:null}
function returnShop(){S.shop.forEach(id=>{if(id)S.pool[id]++});S.shop=[]}
const allUnits=p=>p.board.concat(p.camp||[]).filter(Boolean);
function countOwned(p,id){return allUnits(p).filter(u=>u.id===id&&!u.promo).length}
function freeBoard(p,id){const r=UD[id].k==="r";return (r?[4,5,6,0,1,2,3]:[0,1,2,3,4,5,6]).find(i=>!p.board[i])}
function freeCamp(p){return p.camp?p.camp.findIndex(x=>!x):-1}
function deploy(p,u){if(u.dep)return;u.dep=1;for(let k=0;k<reps(u);k++){
 if(has(u,"rally")){const al=p.board.filter(x=>x&&x!==u);if(al.length){const a=pick(al);a.bd++;if(p.me)pop(a,"+1",`${uName(a)} rallies: +1 damage`)}}
 if(has(u,"recnorth"))p.board.forEach(x=>{if(x&&x!==u&&UD[x.id].f==="north"){x.bh+=2;if(p.me)pop(x,"+2")}});
 if(has(u,"recrebel"))p.board.forEach(x=>{if(x&&x!==u&&UD[x.id].f==="rebel"){x.bd+=1;if(p.me)pop(x,"+1")}});
 if(has(u,"recknal")){const n=p.board.filter(x=>x&&x!==u&&UD[x.id].f==="knalgan").length;u.bd+=n;if(p.me&&n)pop(u,"+"+n)}}}
function buy(p,id){
 if(p.gold<3)return false;const merge=countOwned(p,id)===2;const bs=freeBoard(p,id),cs=freeCamp(p);if(bs===undefined&&cs<0&&!merge)return false;
 p.gold-=3;
 if(merge){let where=null,bd=0,bh=0,give=[];for(const arr of [p.board,p.camp||[]])arr.forEach((u,i)=>{if(u&&u.id===id&&!u.promo){bd=Math.max(bd,u.bd);bh=Math.max(bh,u.bh);(u.give||[]).forEach(gv=>give=addOnce(give,gv));if(!where)where=[arr,i];arr[i]=null}});
  const u=mkUnit(id,1);u.bd=bd;u.bh=bh;u.give=give;
  if(!where)where=bs!==undefined?[p.board,bs]:[p.camp,cs];where[0][where[1]]=u;if(where[0]===p.board)deploy(p,u);p.gold+=2;
  if(p.me){S.flash={uid:u.uid,t:70};sfx("chest");setTimeout(()=>sfx("fanfare"),250);toast(`${UD[id].n} promoted to ${UD[id].pn}!`,"+2 gold, and a veteran's pick");S.picks++}
  else aiPick(p);return true}
 const u=mkUnit(id);if(bs!==undefined){p.board[bs]=u;deploy(p,u)}else p.camp[cs]=u;return true}
function sellValue(p,u){return 1+(has(u,"cheap")?1:0)+(has(u,"fence")?reps(u):0)+(p.leader==="highway"?1:0)}
function sellAt(p,arr,i){const u=arr[i];if(!u)return;arr[i]=null;S.pool[u.id]+=u.promo?3:1;p.gold+=sellValue(p,u)}
function endShopTurn(p){const b=p.board.filter(Boolean);
 b.forEach(u=>{for(let k=0;k<reps(u);k++){
  if(has(u,"eotgrow")){u.bh+=2;if(p.me)pop(u,"+2")}
  if(has(u,"eotrebel")){const r=b.filter(x=>x!==u&&UD[x.id].f==="rebel");if(r.length){const x=pick(r);x.bh+=2;if(p.me)pop(x,"+2")}}
  if(has(u,"eotranged")){const r=b.filter(x=>x!==u&&UD[x.id].k==="r");if(r.length){const x=pick(r);x.bd+=1;if(p.me)pop(x,"+1")}}
  if(has(u,"eotgold")&&p.me)S.bonusGold++;
  if(has(u,"forge"))b.forEach(x=>{if(UD[x.id].f==="knalgan")x.bh+=2})}})}
function pickOptions(p){const t=Math.min(5,p.keep+1);const ids=UL.filter(a=>a[2]===t&&S.pool[a[0]]>0).map(a=>a[0]);return shuffle(ids).slice(0,3)}
function aiPick(p){const o=pickOptions(p);if(!o.length)return;const id=o.sort((a,b)=>(UD[b].f===p.fav)-(UD[a].f===p.fav))[0];S.pool[id]--;const u=mkUnit(id);const i=freeBoard(p,id);
 if(i!==undefined){p.board[i]=u;deploy(p,u)}else{const w=p.board.map((x,j)=>[x,j]).sort((a,b)=>uTier(a[0])-uTier(b[0]))[0];if(uTier(w[0])<uTier(u)){sellAt(p,p.board,w[1]);p.board[w[1]]=u;deploy(p,u)}else S.pool[id]++}}

// ================================================================ the rivals
function aiTurn(p){
 const r=S.round;const kc=keepCost(p);if(p.keep<5&&p.gold>=kc&&r>=p.keep*2-1&&(kc<=p.gold-3||r>=p.keep*2+1)){p.gold-=kc;p.keep++;p.keepCd=0}
 const score=id=>UD[id].t*10+(UD[id].f===p.fav?7:0)+(countOwned(p,id)===2?14:countOwned(p,id)===1?5:0)+RNG()*4;
 const uscore=u=>uTier(u)*10+(UD[u.id].f===p.fav?7:0)+(uDmg(u)*u.str+uHp(u))/6;
 let rolls=0;
 for(let guard=0;guard<20&&p.gold>=3;guard++){
  const shop=shopFor(p);shop.forEach(id=>S.pool[id]--);const left=[...shop];let bought=false;
  for(const id of shop.slice().sort((a,b)=>score(b)-score(a))){if(p.gold<3)break;const full=p.board.every(Boolean)&&countOwned(p,id)<2;
   if(full){const w=p.board.map((u,i)=>[u,i]).sort((a,b)=>uscore(a[0])-uscore(b[0]))[0];if(score(id)>uscore(w[0])+6)sellAt(p,p.board,w[1]);else continue}
   const camp=p.camp;p.camp=[];const ok=buy(p,id);p.camp=camp;if(ok){left.splice(left.indexOf(id),1);bought=true}}
  left.forEach(id=>S.pool[id]++);
  if(!bought){if(p.gold>=4&&rolls<2){p.gold--;rolls++;continue}break}}

function pickTrack(k){const L=MUS[k];let t=pick(L);if(L.length>1)while(t===lastTrack[k])t=pick(L);lastTrack[k]=t;return t}
function playMusic(k,next){if(k===curM&&!next)return;curM=k;for(const n in MEL)if(!MEL[n].paused)fadeTo(MEL[n],0,600,1);if(!mOn||!k||!AC)return;

 if(!a){a=new Audio("audio/m-"+t+".mp3");a.preload="auto";MEL[t]=a;a.addEventListener("ended",()=>{if(curM===k)playMusic(k,1)})}
 a.loop=MUS[k].length===1;if(k==="fight"||next)try{a.currentTime=0}catch(e){}a.volume=0;a.play().then(()=>fadeTo(a,k==="fight"?.42:.36,900)).catch(()=>{})}

 if(u.promo){g.fillStyle="#ffd34a";g.strokeStyle="#6b4a10";g.lineWidth=.8;g.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.5708,b=a+.628;g.lineTo(x+58+Math.cos(a)*6,y+20+Math.sin(a)*6);g.lineTo(x+58+Math.cos(b)*2.5,y+20+Math.sin(b)*2.5)}g.closePath();g.fill();g.stroke()}

const FX=[];
function pop(u,txt,toastMsg){if(!S)return;const P=me();const s=P.board.indexOf(u);if(s>=0)FX.push({s,txt,t:0});if(toastMsg)toast(toastMsg);kickFx()}

function tick(now){if(!anim)return;const dt=Math.min(60,now-(lastT||now))*speed;lastT=now;const A=anim;

 g.textAlign="center";g.font="bold 14px system-ui";

 $("shop").innerHTML=h;$("shop").querySelectorAll(".card[data-i]").forEach(b=>bindCard(b,+b.dataset.i));if($("itemC"))$("itemC").onclick=buyItem;
 draw()}
function bindCard(b,i){let t=null,long=false;b.onpointerdown=()=>{long=false;t=setTimeout(()=>{long=true;showShopInfo(i)},430)};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>clearTimeout(t);b.onclick=()=>{if(long)return;buyShop(i)};b.oncontextmenu=e=>{e.preventDefault();showShopInfo(i)}}
function showShopInfo(i){const id=S.shop[i];if(!id)return;const u=mkUnit(id);UID--;showInfoUnit(u,null,null,true)}
function buyShop(i){audioInit();const P=me(),id=S.shop[i];if(!id||S.phase!=="shop")return;
 if(P.gold<3){toast("Not enough gold");return}
 if(freeBoard(P,id)===undefined&&freeCamp(P)<0&&countOwned(P,id)<2){toast("No room","Sell a unit or clear a camp spot");return}
 S.shop[i]=null;if(!buy(P,id))S.shop[i]=id;else sfx("gold",.6);
 save();render();if(S.picks)vetPick()}
function vetPick(){const P=me();const o=pickOptions(P);if(!o.length){S.picks=0;return}o.forEach(id=>S.pool[id]--);
 modal(`<h2>A veteran's pick</h2><p>Your promotion caught the eye of the mercenary guild. Choose one recruit, free.</p><div class="picks">${o.map((id,i)=>cardHTML(id,i)).join("")}</div>`);
 $("mcard").querySelectorAll(".card").forEach(b=>b.onclick=()=>{const id=o[+b.dataset.i];o.forEach(x=>{if(x!==id)S.pool[x]++});const u=mkUnit(id);const bs=freeBoard(P,id),cs=freeCamp(P);if(bs!==undefined){P.board[bs]=u;deploy(P,u)}else if(cs>=0)P.camp[cs]=u;else{S.pool[id]++;P.gold+=3;toast("No room","You get 3 gold instead")}
  S.picks--;closeModal();sfx("gold");save();render();if(S.picks>0)vetPick()})}
function buyItem(){audioInit();const P=me();const it=ITEMS.find(x=>x.id===S.item);if(!it||S.phase!=="shop")return;if(P.gold<it.cost){toast("Not enough gold");return}
 if(it.all){P.gold-=it.cost;S.item=null;allUnits(P).forEach(u=>{u.bh+=2;pop(u,"+2")});sfx("potion");save();render();return}
 if(!allUnits(P).length){toast("No one to give it to");return}
 setMode({item:it,hint:`Tap a unit to give the ${it.n}`});closeInfo()}
function applyTo(u){const P=me();if(mode.item){const it=mode.item;P.gold-=it.cost;it.apply(u);S.item=null;sfx("potion");pop(u,it.fx)}
 else if(mode.power){const L=mode.power;P.gold-=L.cost;if(L.id==="lieut"){u.bd++;pop(u,"+1")}if(L.id==="warlord"){u.bd++;u.bh+=3;pop(u,"+1/+3")}if(L.id==="flame"){u.bh+=5;pop(u,"+5")}sfx("heal",.5)}
 setMode(null);save();render()}
function reroll(){audioInit();const P=me();if(S.phase!=="shop")return;if(!S.freeRoll){if(P.gold<1){toast("Not enough gold");return}P.gold--}S.freeRoll=false;S.held=false;rollShop();rollItem();sfx("gold",.4);save();render()}
function upgradeKeep(){audioInit();const P=me();if(P.keep>=5||S.phase!=="shop")return;const c=keepCost(P);if(P.gold<c){toast("Not enough gold");return}P.gold-=c;P.keep++;P.keepCd=0;sfx("fanfare");toast(`Keep level ${P.keep}`,`Recruits up to ${"★".repeat(P.keep)} can now appear`);returnShop();S.shop=shopFor(P);S.shop.forEach(id=>S.pool[id]--);save();render()}
function usePower(){audioInit();const P=me(),L=LEADERS.find(l=>l.id===P.leader);if(L.passive||S.phase!=="shop")return;if(P.gold<L.cost){toast("Not enough gold");return}if(!allUnits(P).length){toast("Recruit someone first");return}setMode({power:L,hint:`Tap a unit for ${L.p}`});closeInfo()}
function fieldPos(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*FW,(e.clientY-r.top)/r.height*FH]}
function slotAt(side,x,y){for(let s=0;s<SLOTS;s++){const [hx,hy]=hexXY(side,s);if(Math.hypot(x-(hx+36),y-(hy+36))<32)return s}return null}
cv.addEventListener("pointerdown",e=>{audioInit();if(!S||S.phase!=="shop")return;const [x,y]=fieldPos(e);const s=slotAt(0,x,y);const P=me();
 if(s===null){const es=slotAt(1,x,y);const O=S.players[S.nextOpp];if(es!==null&&O&&O.board[es]){showInfoUnit(O.board[es],null,null,false,true);sel=null;draw();return}sel=null;closeInfo();if(mode)setMode(null);render();return}
 if(mode){if(P.board[s])applyTo(P.board[s]);return}
 if(sel){if(sel.w==="b"&&sel.i!==s){const a=P.board[sel.i];P.board[sel.i]=P.board[s];P.board[s]=a;sel=null}
  else if(sel.w==="c"){const u=P.camp[sel.i];const there=P.board[s];P.board[s]=u;P.camp[sel.i]=there;if(u)deploy(P,u);sel=null;sfx("gold",.3)}
  else sel=null;closeInfo();save();render();return}
 if(P.board[s]){sel={w:"b",i:s};showInfoUnit(P.board[s],P.board,s)}else closeInfo();render()});
function tapCamp(i){audioInit();const P=me();if(S.phase!=="shop")return;
 if(mode){if(P.camp[i])applyTo(P.camp[i]);return}
 if(sel){if(sel.w==="b"){const u=P.board[sel.i];P.board[sel.i]=P.camp[i];P.camp[i]=u;if(P.board[sel.i])deploy(P,P.board[sel.i]);sel=null}
  else if(sel.w==="c"&&sel.i!==i){const a=P.camp[sel.i];P.camp[sel.i]=P.camp[i];P.camp[i]=a;sel=null}else sel=null;closeInfo();save();render();return}
 if(P.camp[i]){sel={w:"c",i};showInfoUnit(P.camp[i],P.camp,i)}render()}
function showInfoUnit(u,arr,i,shop,rival){const d=UD[u.id];const mine=!!arr;const ab=abl(u);
 $("info").innerHTML=`<div class="row"><img class="pt" src="${IMG(uPt(u))}" alt="" decoding="async"><div style="flex:1;min-width:0"><h3>${uName(u)}${u.promo?" ★":""}</h3><div class="meta">${FAC[d.f].n} · ${"★".repeat(uTier(u))} · ${align(u)==="L"?"Lawful":align(u)==="C"?"Chaotic":"Neutral"}${mine&&arr===me().board?` · ${i<FRONT?"front line":"back line"}`:mine?" · in camp":""}${rival?" · rival":""}</div>
 <div class="stats"><span><img src="${IMG(d.wp)}" alt=""> ${uDmg(u)}×${u.str} ${d.k==="r"?"ranged":"melee"}</span><span style="color:var(--red)">♥ ${uHp(u)}</span>${u.bd||u.bh?`<span style="color:#3a8a44;font-size:11px">+${u.bd} / +${u.bh}</span>`:""}</div>
 ${ab.map(a=>`<div class="abl">${ABIL[a]}</div>`).join("")}<div class="abl" style="color:var(--mute)">${d.k==="r"?"Only ranged units shoot back at it.":"Only melee units hit back at it."}${!u.promo&&!rival?` ${shop?"Three":"Recruit "+(3-countOwned(me(),u.id))+" more"} to promote it to ${d.pn}.`:""}</div></div></div>
 ${mine?`<div class="btns"><button class="ib" id="sellB">Sell for ${sellValue(me(),u)} gold</button><button class="ib" id="closeB">Done</button></div><div style="font-size:11px;color:var(--mute);margin-top:4px">Tap a hex or a camp spot to move it there.</div>`:`<div class="btns"><button class="ib" id="closeB">Close</button></div>`}`;
 $("info").style.display="block";
 if($("sellB"))$("sellB").onclick=()=>{sellAt(me(),arr,i);sel=null;closeInfo();sfx("gold",.6);save();render()};$("closeB").onclick=()=>{sel=null;closeInfo();render()}}
function closeInfo(){$("info").style.display="none"}
$("rollB").onclick=reroll;$("keepB").onclick=upgradeKeep;$("holdB").onclick=()=>{if(S.phase!=="shop")return;S.held=!S.held;save();render()};$("powB").onclick=usePower;$("fight").onclick=()=>{audioInit();fight()};
$("speed").onclick=()=>{speed=speed===1?2:speed===2?4:1;ls.set("mk.speed",speed);$("speed").textContent="x"+speed};$("speed").textContent="x"+speed;
$("sndB").onclick=()=>{audioInit();const on=mOn||sOn;mOn=sOn=!on;ls.set("mk.music",mOn);ls.set("mk.sfx",sOn);$("sndB").style.opacity=mOn?1:.45;if(!mOn){for(const n in MEL)MEL[n].pause();curM=null}else playMusic(S&&S.phase==="fight"?"fight":S?"shop":"title")};$("sndB").style.opacity=mOn||sOn?1:.45;
$("menuB").onclick=()=>{audioInit();const st=ls.get("mk.stats",{});modal(`<h2>Mercenary Keep</h2>
 <p>Recruit Wesnoth units for 3 gold, place them on your hexes, and send them against one of seven rival leaders each round. Last leader standing wins.</p>
 <p><b>Front line</b> hexes take the first blows. The <b>back line</b> is safe until the front falls, unless the enemy has skirmishers. A <b>shield wall</b> must be attacked first. Melee is only answered by melee, ranged by ranged.</p>
 <p><b>Time of day</b>: Lawful units hit harder in daylight, Chaotic ones at night. <b>Terrain</b> changes how often each race dodges.</p>
 <p><b>Three of a unit</b> promote it, with gold and a free <b>veteran's pick</b>. Three of a faction give a bonus, five a bigger one. Your <b>camp</b> holds five units off the field. <b>Supplies</b> buff a unit for good. Upgrade your <b>keep</b> to see stronger recruits. Hold a card to read it.</p>
 <small>Games ${st.games||0} · Wins ${st.wins||0} · Top four ${st.tops||0}${st.best?` · Best place ${st.best}`:""}</small>
 <div class="toggles"><button class="big alt" id="mB">Music ${mOn?"on":"off"}</button><button class="big alt" id="sB">Sounds ${sOn?"on":"off"}</button></div>
 <button class="big alt" id="credB">Credits and licence</button><button class="big alt" id="newB">Start a new game</button><button class="big" id="closeM">Back to the keep</button>`);
 $("closeM").onclick=closeModal;$("newB").onclick=()=>{ls.del("mk.save2");chooseLeader()};$("credB").onclick=credits;
 $("mB").onclick=()=>{mOn=!mOn;ls.set("mk.music",mOn);if(!mOn){for(const n in MEL)MEL[n].pause();curM=null}else playMusic(S&&S.phase==="fight"?"fight":"shop");$("mB").textContent="Music "+(mOn?"on":"off")};
 $("sB").onclick=()=>{sOn=!sOn;ls.set("mk.sfx",sOn);$("sB").textContent="Sounds "+(sOn?"on":"off")}};

function chooseLeader(){S=null;closeInfo();const opts=shuffle([...LEADERS]).slice(0,3);
 modal(`<h1>Mercenary Keep</h1><p class="sub">Seven rival leaders. One market of mercenaries. Pick who leads yours.</p><div class="leaders">${opts.map((l,i)=>`<button class="leader" data-i="${i}"><img src="${IMG(l.pt)}" alt=""><b>${l.n}</b><span><b style="display:inline;font:inherit;font-weight:800">${l.p}.</b> ${l.d}</span><em>Armour ${l.armor}</em></button>`).join("")}</div><small style="text-align:center">Art, music and sounds from Battle for Wesnoth, under the GPL. Menu, Credits for more.</small>`,"title");
 $("mcard").querySelectorAll(".leader").forEach(b=>b.onclick=()=>{audioInit();closeModal();newGame(opts[+b.dataset.i]);toast("Round 1","Recruit, then fight",1600)});
 playMusic("title")}
addEventListener("pointerdown",()=>audioInit(),{once:true,capture:true});
preload();size();
if(load()){render();toast("Welcome back","Round "+S.round);playMusic("shop")}else chooseLeader();
window.__mk={get S(){return S},battle,buy,fight,me,UD,UL,LEADERS,ITEMS,get anim(){return anim},setSpeed(v){speed=v},newGame,aiTurn,render,deploy,endShopTurn,applyTo,setMode,get mode(){return mode},vetPick,tapCamp,tc};
