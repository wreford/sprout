<style>
:root{--bg:#f2ead8;--ink:#2b2418;--mute:#7c6f5a;--card:#fffaf0;--line:rgba(43,36,24,.16);--gold:#c99a2e;--red:#b83a2c;--blue:#2f63a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{position:fixed;inset:0}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 4px) calc(env(safe-area-inset-right) + 6px) calc(env(safe-area-inset-bottom) + 6px) calc(env(safe-area-inset-left) + 6px);gap:5px;max-width:1100px;margin:0 auto}
#top{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.pill{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 7px;white-space:nowrap}
.pill img{width:22px;height:22px;object-fit:contain}
img:not([src]){visibility:hidden}
#hp{color:var(--red)} #gold{color:#8a6a10}
#tod img{height:24px;width:auto;border-radius:4px}
#top .sp{flex:1}
.ib{border:1px solid var(--line);background:var(--card);border-radius:8px;font:700 13px system-ui;padding:5px 9px;color:var(--ink)}
#opps{display:flex;gap:3px}
.opp{flex:1;display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:1px 3px;font:700 11px system-ui;min-width:0}
.opp img{width:24px;height:24px;object-fit:cover;object-position:50% 30%;flex:0 0 auto}
.opp.next{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.opp.dead{opacity:.35;filter:grayscale(1)}
.opp.me{background:#fff3c8}
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
#fieldwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;border-radius:10px;box-shadow:0 0 0 2px #3a2e1e,0 6px 18px rgba(0,0,0,.2);touch-action:none}
#syn{display:flex;gap:4px;flex-wrap:wrap;min-height:20px}
.syn{font:700 11px system-ui;border-radius:6px;padding:2px 6px;color:#fff;opacity:.45}
.syn.on{opacity:1}
#panel{display:flex;flex-direction:column;gap:5px}
#ctrl{display:flex;gap:5px;align-items:center}
#ctrl .ib{flex:1;min-height:38px}
#keepB b{color:#8a6a10}
#shop{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.card{position:relative;display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-left:5px solid #888;border-radius:9px;padding:2px 4px 2px 2px;min-height:62px;text-align:left;font:inherit;color:inherit}
.card img{width:56px;height:56px;object-fit:contain;flex:0 0 auto;margin:-4px -4px -4px -6px}
.card .nm{font:700 12px/1.1 system-ui}
.card .st{font:600 11px system-ui;color:var(--mute);margin-top:2px}
.card .ab{font:600 10px system-ui;color:#5a4a8a;margin-top:1px}
.card .tier{position:absolute;top:2px;right:4px;font:800 10px system-ui;color:#a08030}
.card.held{box-shadow:0 0 0 2px #4aa0e0}
.card.poor{opacity:.55}
.card.empty{border-style:dashed;border-left-width:1px;justify-content:center;color:var(--mute);font-size:12px}
#fight{min-height:46px;font:800 17px system-ui;border:none;border-radius:11px;background:var(--red);color:#fff;box-shadow:0 3px 0 #7a2318}
#fight:active{transform:translateY(2px);box-shadow:0 1px 0 #7a2318}
#info{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(255,250,240,.97);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;font-size:13px}
#info .row{display:flex;gap:8px;align-items:flex-start}
#info img{width:72px;height:72px;object-fit:contain;flex:0 0 auto}
#info h3{margin:0;font-size:15px}
#info .meta{color:var(--mute);font-size:12px;margin:1px 0 4px}
#info .abl{margin:2px 0;font-size:12.5px}
#info .btns{display:flex;gap:6px;margin-top:6px}
#info .btns button{flex:1}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(30,24,16,.86);color:#fff;padding:10px 18px;border-radius:12px;font:800 17px system-ui;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#banner small{display:block;font:600 12px system-ui;opacity:.85;margin-top:2px}
#banner.on{opacity:1}
#speed{position:absolute;top:6px;right:6px;display:none}
.fighting #speed{display:block}
.fighting #panel{opacity:.5;pointer-events:none}
#modal{position:fixed;inset:0;background:rgba(30,24,16,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#modal.on{display:flex}
#mcard{background:var(--card);border-radius:14px;max-width:460px;width:100%;max-height:94dvh;overflow:auto;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#mcard h2{margin:0 0 6px;font:800 20px Georgia,serif}
#mcard p{margin:0 0 10px;line-height:1.42;font-size:14px}
.leaders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.leader{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font:inherit;color:inherit}
.leader img{width:72px;height:72px;object-fit:contain}
.leader b{display:block;font-size:13px}
.leader span{display:block;font-size:11.5px;color:var(--mute);margin-top:3px;line-height:1.3}
.big{width:100%;min-height:44px;font:800 15px system-ui;border:none;border-radius:10px;background:var(--red);color:#fff;margin-top:6px}
.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
#mcard small{color:var(--mute);font-size:12px;line-height:1.4;display:block}
@media (min-width:820px){
 #main{flex-direction:row}
 #fieldwrap{flex:1.4}
 #panel{flex:1;justify-content:flex-end}
 #shop{grid-template-columns:repeat(2,1fr)}
}
@media (orientation:landscape) and (max-height:520px){
 #main{flex-direction:row}#panel{width:46%}#shop{grid-template-columns:repeat(3,1fr)}.card{min-height:52px}.card img{width:44px;height:44px}#opps .opp img{width:18px;height:18px}
}
</style>
</head>

// ================================================================ round flow
function fight(){

 const results=[];while(others.length>=2){const a=others.pop(),b=others.pop();results.push([a,b,battle(S.players[a],S.players[b],S.tod,S.terrain,false)])}

function drawUnit(u,side,slot,o){o=o||{};const [x,y]=o.xy||hexXY(side,slot);if(!o.xy){hexPath(x,y);g.fillStyle=side?"rgba(200,40,30,.22)":"rgba(40,90,200,.18)";g.fill()}const im=img(o.img||uImg(u));const fc=FAC[UD[u.id].f].c;
 g.save();if(o.alpha!==undefined)g.globalAlpha=o.alpha;else if(o.ghost)g.globalAlpha=.7;
 g.fillStyle=fc;g.globalAlpha*=.55;g.beginPath();g.ellipse(x+36,y+56,20,7,0,0,7);g.fill();g.globalAlpha=o.alpha!==undefined?o.alpha:o.ghost?.7:1;
 if(im.complete&&im.naturalWidth){if(side===1){g.translate(x+72,y);g.scale(-1,1);g.drawImage(im,0,o.bob||0,72,72);g.setTransform(K,0,0,K,0,0)}else g.drawImage(im,x,y+(o.bob||0),72,72)}
 if(o.flashC){g.globalCompositeOperation="source-atop";g.fillStyle=o.flashC;g.fillRect(x,y,72,72);g.globalCompositeOperation="source-over"}
 g.restore();
 // hp bar, Wesnoth style
 const max=o.max||uHp(u),cur=o.cur!==undefined?o.cur:max;const bh=34,f=clamp(cur/max,0,1);g.fillStyle="rgba(0,0,0,.6)";g.fillRect(x+13,y+18,4,bh);g.fillStyle=f>.66?"#3cc63c":f>.33?"#e0c030":"#e04030";g.fillRect(x+14,y+18+bh*(1-f),2,bh*f);
 // stats
 g.font="bold 9px system-ui";g.textAlign="center";const txt=`${o.dmg||uDmg(u)}×${u.str}  ${Math.max(0,Math.ceil(cur))}`;const tw=g.measureText(txt).width+6;g.fillStyle="rgba(20,16,10,.78)";g.fillRect(x+36-tw/2,y+60,tw,11);g.fillStyle="#fff";g.fillText(txt,x+36,y+69);
 if(u.promo){g.fillStyle="#ffd34a";g.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.5708,b=a+.628;g.lineTo(x+58+Math.cos(a)*5,y+20+Math.sin(a)*5);g.lineTo(x+58+Math.cos(b)*2,y+20+Math.sin(b)*2)}g.fill()}
 if(o.sel){hexPath(x,y);g.lineWidth=2.5;g.strokeStyle="#ffd34a";g.stroke()}
 if(S.flash&&S.flash.uid===u.uid&&S.flash.t>0){g.strokeStyle=`rgba(255,215,80,${S.flash.t/60})`;g.lineWidth=4;hexPath(x,y);g.stroke()}}

// ================================================================ battle animation
let speed=ls.get("mk.speed",1);
function initAnim(P,O,res){
 const units={};
 [P,O].forEach((p,side)=>{const syn=synCounts(p.board);p.board.forEach((u,s)=>{if(!u)return;let max=uHp(u);if(UD[u.id].f==="loyal")max+=synLevel(syn.loyal||0)*3;units[u.uid]={u,side,slot:s,cur:max,max,img:uImg(u),alpha:1,dx:0,dy:0,flash:0}})});
 anim={units,ev:res.ev,i:0,t:0,dur:0,pops:[],res,done:false};nextEv();tick()}
function nextEv(){const A=anim;if(A.i>=A.ev.length){A.done=true;A.endT=performance.now();return}A.cur=A.ev[A.i++];A.t=0;const e=A.cur;
 A.dur={attack:160,strike:300,end:60,die:340,heal:280,poison:280,spawn:420,scorch:420}[e.t]||100;
 const U=A.units;
 if(e.t==="spawn"){U[e.u]={u:{id:e.id,promo:0,str:e.str,dmg:e.dmg,bd:0,bh:0,uid:e.u},side:e.side,slot:e.slot,cur:e.hp,max:e.hp,img:e.img,alpha:0,dx:0,dy:0,flash:0,spawn:1};A.pops.push({uid:e.u,txt:e.raise?"Raised!":"Plague!",c:"#c9a3ff",t:0})}
 if(e.t==="strike"){const a=U[e.a],d=U[e.d];if(a)a.lunge=1;if(d){if(e.hit){d.cur=e.hp;d.flash=1;A.pops.push({uid:e.d,txt:"-"+e.n,c:"#ff5a40",t:0})}else A.pops.push({uid:e.d,txt:"miss",c:"#fff",t:0})}if(a&&e.ahp!==undefined)a.cur=e.ahp}
 if(e.t==="heal"||e.t==="poison"){const u=U[e.u];if(u){u.cur=e.hp;A.pops.push({uid:e.u,txt:(e.t==="heal"?"+":"-")+e.n,c:e.t==="heal"?"#5ae05a":"#b060e0",t:0})}}
 if(e.t==="scorch"){const d=U[e.d];if(d){d.cur=e.hp;d.flash=1;A.pops.push({uid:e.d,txt:"-"+e.n+" fire",c:"#ff9a30",t:0})}}
 if(e.t==="attack"){A.att=e.a;A.def=e.d}
 if(e.t==="end"){A.att=null;A.def=null}}
let lastT=0;
function tick(now){if(!anim)return;now=now||performance.now();const dt=Math.min(60,now-(lastT||now))*speed;lastT=now;const A=anim;
 if(!A.done){A.t+=dt;if(A.t>=A.dur)nextEv()}
 A.pops.forEach(p=>p.t+=dt);A.pops=A.pops.filter(p=>p.t<900);
 for(const k in A.units){const u=A.units[k];if(u.flash>0)u.flash=Math.max(0,u.flash-dt/220);if(u.spawn&&u.alpha<1)u.alpha=Math.min(1,u.alpha+dt/300)}
 if(A.cur&&A.cur.t==="die"&&A.units[A.cur.u])A.units[A.cur.u].alpha=Math.max(0,1-A.t/A.dur);
 if(A.cur&&A.cur.t==="die"&&A.t+dt>=A.dur&&A.units[A.cur.u])A.units[A.cur.u].gone=1;
 draw();
 if(A.done&&now-A.endT>500&&!A.finished){A.finished=1;afterFight();return}
 requestAnimationFrame(tick)}
function drawAnim(){const A=anim;const order=Object.values(A.units).filter(u=>!u.gone).sort((a,b)=>hexXY(a.side,a.slot)[1]-hexXY(b.side,b.slot)[1]);
 for(const u of order){let [x,y]=hexXY(u.side,u.slot);
  if(A.att===u.u.uid&&A.def&&A.units[A.def]&&A.cur&&(A.cur.t==="strike"||A.cur.t==="attack")){const d=A.units[A.def];const [dx,dy]=hexXY(d.side,d.slot);const melee=UD[u.u.id].k==="m";const f=melee?.42:.12;const ph=A.cur.t==="strike"&&A.cur.a===u.u.uid?Math.sin(Math.min(1,A.t/A.dur)*Math.PI):A.cur.t==="attack"?A.t/A.dur*.3:0;x+=(dx-x)*f*ph;y+=(dy-y)*f*ph}
  if(A.def===u.u.uid&&A.cur&&A.cur.t==="strike"&&A.cur.a===u.u.uid&&A.att&&A.units[A.att]){const d=A.units[A.att];const [dx,dy]=hexXY(d.side,d.slot);const melee=UD[u.u.id].k==="m";const ph=Math.sin(Math.min(1,A.t/A.dur)*Math.PI);x+=(dx-x)*(melee?.3:.08)*ph;y+=(dy-y)*(melee?.3:.08)*ph}
  drawUnit(u.u,u.side,u.slot,{xy:[x,y],cur:u.cur,max:u.max,alpha:u.alpha,img:u.img,flashC:u.flash>0?`rgba(255,255,255,${u.flash*.8})`:null})}
 // projectile for ranged strikes
 if(A.cur&&A.cur.t==="strike"){const a=A.units[A.cur.a],d=A.units[A.cur.d];if(a&&d&&UD[a.u.id].k==="r"){const [ax,ay]=hexXY(a.side,a.slot),[dx,dy]=hexXY(d.side,d.slot);const f=Math.min(1,A.t/(A.dur*.6));const px=ax+36+(dx-ax)*f,py=ay+30+(dy-ay)*f-Math.sin(f*Math.PI)*16;const mg=UD[a.u.id].ab.includes("magic");g.fillStyle=mg?"#c9a3ff":"#fff";g.beginPath();g.arc(px,py,mg?4:2.5,0,7);g.fill();if(mg){g.fillStyle="rgba(201,163,255,.35)";g.beginPath();g.arc(px,py,8,0,7);g.fill()}}}
 if(A.cur&&A.cur.t==="scorch"){const a=A.units[A.cur.a],d=A.units[A.cur.d];if(a&&d){const [ax,ay]=hexXY(a.side,a.slot),[dx,dy]=hexXY(d.side,d.slot);const f=Math.min(1,A.t/(A.dur*.7));for(let i=0;i<6;i++){const ff=Math.max(0,f-i*.05);g.fillStyle=`rgba(255,${120+i*20},40,${.8-i*.1})`;g.beginPath();g.arc(ax+36+(dx-ax)*ff,ay+30+(dy-ay)*ff,6-i*.6,0,7);g.fill()}}}
 // pops
 g.textAlign="center";g.font="bold 13px system-ui";
 for(const p of A.pops){const u=A.units[p.uid];if(!u)continue;const [x,y]=hexXY(u.side,u.slot);const yy=y+16-p.t/30;g.globalAlpha=Math.max(0,1-p.t/900);g.fillStyle="rgba(0,0,0,.6)";g.fillText(p.txt,x+37,yy+1);g.fillStyle=p.c;g.fillText(p.txt,x+36,yy);g.globalAlpha=1}}

// ================================================================ UI
function toast(t,sub,ms){const b=$("banner");b.innerHTML=t+(sub?`<small>${sub}</small>`:"");b.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>b.classList.remove("on"),ms||1500)}
function modal(h){$("mcard").innerHTML=h;$("modal").classList.add("on")}
function closeModal(){$("modal").classList.remove("on")}
function render(){if(!S)return;const P=me();
 $("lImg").src=IMG(LEADERS.find(l=>l.id===P.leader).img);$("hp").textContent=P.hp;$("gold").textContent=P.gold+" gold";$("roundP").textContent="Round "+S.round;
 $("todImg").src=IMG(TODS[S.tod].img);$("todN").textContent=TODS[S.tod].n;
 $("opps").innerHTML=S.players.map((p,i)=>`<div class="opp ${p.me?"me":""} ${i===S.nextOpp?"next":""} ${p.alive?"":"dead"}" title="${p.name}"><img src="${IMG(LEADERS.find(l=>l.id===p.leader).img)}" alt=""><span>${p.alive?p.hp:p.place}</span></div>`).join("");
 const kc=keepCost(P);$("keepB").innerHTML=P.keep>=5?"Keep 5 (max)":`Keep ${P.keep} → ${P.keep+1} <b>${kc}</b>`;
 $("rollB").innerHTML=`New recruits <b>${S.freeRoll?"free":"1"}</b>`;$("holdB").textContent=S.held?"Held":"Hold";$("holdB").style.background=S.held?"#d8ecff":"";
 const L=LEADERS.find(l=>l.id===P.leader);$("powB").innerHTML=L.passive?L.p:`${L.p} <b>${L.cost}</b>`;$("powB").disabled=!!L.passive;$("powB").style.opacity=L.passive?.6:1;
 const sc=synCounts(P.board);$("syn").innerHTML=Object.keys(FAC).filter(f=>sc[f]).map(f=>{const lv=synLevel(sc[f]);return `<span class="syn ${lv?"on":""}" style="background:${FAC[f].c}" title="${lv?SYN[f][lv-1]:"3 for a bonus"}">${FAC[f].n} ${sc[f]}${lv?": "+SYN[f][lv-1]:"/3"}</span>`}).join("")||`<span style="font-size:12px;color:var(--mute)">Recruit three of a faction for a bonus. Three of a unit promote it.</span>`;
 const n=SHOPN[P.keep];let h="";for(let i=0;i<Math.max(n,3);i++){const id=S.shop[i];if(!id){h+=`<div class="card empty">${i<n?"Sold":""}</div>`;continue}const d=UD[id];const pair=countOn(P,id);
  h+=`<button class="card ${S.held?"held":""} ${P.gold<3?"poor":""}" data-i="${i}" style="border-left-color:${FAC[d.f].c}"><img src="${IMG(d.img)}" alt=""><div><div class="nm">${d.n}</div><div class="st">${d.d}×${d.s} ${d.k==="r"?"ranged":"melee"} · ${d.hp} HP</div><div class="ab">${d.ab.map(a=>ABS[a]).join(", ")||FAC[d.f].n}${pair?` · ${pair}/3`:""}</div></div><span class="tier">${"★".repeat(d.t)}</span></button>`}
 $("shop").innerHTML=h;$("shop").querySelectorAll(".card[data-i]").forEach(b=>b.onclick=()=>buyShop(+b.dataset.i));
 draw()}
function buyShop(i){const P=me(),id=S.shop[i];if(!id||S.phase!=="shop")return;
 if(P.gold<3){toast("Not enough gold");return}
 if(placeSlot(P,id)===undefined&&countOn(P,id)<2){toast("Your keep is full","Sell a unit first");return}
 S.shop[i]=null;if(buy(P,id)){}else{S.shop[i]=id}
 save();render()}
function reroll(){const P=me();if(S.phase!=="shop")return;if(!S.freeRoll){if(P.gold<1){toast("Not enough gold");return}P.gold--}S.freeRoll=false;S.held=false;rollShop();save();render()}
function upgradeKeep(){const P=me();if(P.keep>=5||S.phase!=="shop")return;const c=keepCost(P);if(P.gold<c){toast("Not enough gold");return}P.gold-=c;P.keep++;P.keepCd=0;toast(`Keep level ${P.keep}`,`Recruits up to ${"★".repeat(P.keep)} can now appear`);returnShop();S.shop=[];rollShopKeep();save();render()}
function rollShopKeep(){S.shop=shopFor(me());S.shop.forEach(id=>S.pool[id]--)}
function usePower(){const P=me(),L=LEADERS.find(l=>l.id===P.leader);if(L.passive||S.phase!=="shop")return;if(P.gold<L.cost){toast("Not enough gold");return}if(sel===null||!P.board[sel]){toast("Tap one of your units first","Then use "+L.p);return}
 P.gold-=L.cost;const u=P.board[sel];if(L.id==="lieut")u.bd++;if(L.id==="warlord"){u.bd++;u.bh+=3}if(L.id==="flame")u.bh+=5;toast(`${L.p}: ${uName(u)}`,L.id==="flame"?"+5 HP":L.id==="lieut"?"+1 damage":"+1 damage, +3 HP");showInfo(sel);save();render()}
// field taps: select, move, swap
function fieldPos(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*FW,(e.clientY-r.top)/r.height*FH]}
function slotAt(x,y){for(let s=0;s<SLOTS;s++){const [hx,hy]=hexXY(0,s);if(Math.hypot(x-(hx+36),y-(hy+36))<32)return s}return null}
function enemyAt(x,y){for(let s=0;s<SLOTS;s++){const [hx,hy]=hexXY(1,s);if(Math.hypot(x-(hx+36),y-(hy+36))<32)return s}return null}
cv.addEventListener("pointerdown",e=>{if(!S||S.phase!=="shop")return;const [x,y]=fieldPos(e);const s=slotAt(x,y);const P=me();
 if(s===null){const es=enemyAt(x,y);const O=S.players[S.nextOpp];if(es!==null&&O&&O.board[es]){showInfo(es,O);sel=null;draw();return}sel=null;closeInfo();draw();return}
 if(sel!==null&&sel!==s){const a=P.board[sel];P.board[sel]=P.board[s];P.board[s]=a;sel=P.board[s]?s:null;if(sel!==null)showInfo(sel);else closeInfo();save();render();return}
 if(P.board[s]){sel=s;showInfo(s);draw()}else{sel=null;closeInfo();draw()}});
function showInfo(s,owner){const P=owner||me(),u=P.board[s];if(!u)return closeInfo();const d=UD[u.id];const mine=!owner;
 $("info").innerHTML=`<div class="row"><img src="${IMG(uImg(u))}" alt=""><div style="flex:1"><h3>${uName(u)}${u.promo?" ★":""}</h3><div class="meta">${FAC[d.f].n} · ${"★".repeat(uTier(u))} · ${align(u)==="L"?"Lawful":align(u)==="C"?"Chaotic":"Neutral"} · ${s<FRONT?"front line":"back line"}</div>
 <div><b>${uDmg(u)}×${u.str}</b> ${d.k==="r"?"ranged":"melee"} · <b>${uHp(u)}</b> HP${u.bd||u.bh?` <span style="color:#3a8a44">(+${u.bd} dmg, +${u.bh} HP)</span>`:""}</div>
 ${d.ab.map(a=>`<div class="abl">${ABIL[a]}</div>`).join("")}<div class="abl" style="color:var(--mute)">${d.k==="r"?"Ranged: only ranged units hit back.":"Melee: only melee units hit back."}${!u.promo&&mine?` Recruit ${3-countOn(me(),u.id)} more to promote to ${d.pn}.`:""}</div></div></div>
 ${mine?`<div class="btns"><button class="ib" id="sellB">Sell for ${(d.ab.includes("cheap")?2:1)+(me().leader==="highway"?1:0)}</button><button class="ib" id="closeB">Done</button></div><div style="font-size:11.5px;color:var(--mute);margin-top:4px">Tap another hex to move it there.</div>`:`<div class="btns"><button class="ib" id="closeB">Close</button></div>`}`;
 $("info").style.display="block";if($("sellB"))$("sellB").onclick=()=>{sell(me(),s);sel=null;closeInfo();save();render()};$("closeB").onclick=()=>{sel=null;closeInfo();draw()}}
function closeInfo(){$("info").style.display="none"}
$("rollB").onclick=reroll;$("keepB").onclick=upgradeKeep;$("holdB").onclick=()=>{if(S.phase!=="shop")return;S.held=!S.held;save();render()};$("powB").onclick=usePower;$("fight").onclick=fight;
$("speed").onclick=()=>{speed=speed===1?2:speed===2?4:1;ls.set("mk.speed",speed);$("speed").textContent="Speed x"+speed};$("speed").textContent="Speed x"+speed;
$("menuB").onclick=()=>{const st=ls.get("mk.stats",{});modal(`<h2>Mercenary Keep</h2>
 <p>Recruit Wesnoth units from the market for 3 gold each, place them on your hexes, and send them to fight one of seven rival leaders every round. The last leader standing wins.</p>
 <p><b>Front line</b> hexes get hit first. <b>Back line</b> hexes stay safe until the front falls, unless the enemy has skirmishers. Melee units only get hit back by melee, ranged only by ranged.</p>
 <p><b>Time of day</b> matters: Lawful units hit harder in daylight and weaker at night, Chaotic the other way round. <b>Terrain</b> changes how often each race dodges.</p>
 <p><b>Three of a unit</b> promote it to its veteran form, with a gold bounty. Three of a faction give a bonus, five a bigger one. Upgrade your keep to see stronger recruits.</p>
 <small>Games ${st.games||0} · Wins ${st.wins||0} · Top four ${st.tops||0}${st.best?` · Best place ${st.best}`:""}</small>
 <button class="big alt" id="credB">Credits and licence</button><button class="big alt" id="newB">Start a new game</button><button class="big" id="closeM">Back to the keep</button>`);
 $("closeM").onclick=closeModal;$("newB").onclick=()=>{ls.del("mk.save");chooseLeader()};$("credB").onclick=credits};

 <p>Wesnoth is free and open source. Find it at <a href="https://www.wesnoth.org" target="_blank" rel="noopener">wesnoth.org</a> and the art's history at <a href="https://github.com/wesnoth/wesnoth" target="_blank" rel="noopener">github.com/wesnoth/wesnoth</a>.</p>
 <p>The game itself is also free software under the GPL v2 or later. See <a href="COPYING" target="_blank">COPYING</a> and <a href="CREDITS.txt" target="_blank">CREDITS.txt</a> in this folder.</p><button class="big" id="closeM">Back</button>`);$("closeM").onclick=closeModal}
function chooseLeader(){S=null;const opts=shuffle([...LEADERS]).slice(0,3);
 modal(`<h2>Choose your leader</h2><p>Seven rival leaders want the same mercenaries. Pick who leads yours.</p><div class="leaders">${opts.map((l,i)=>`<button class="leader" data-i="${i}"><img src="${IMG(l.img)}" alt=""><b>${l.n}</b><span><b style="display:inline">${l.p}.</b> ${l.d}</span></button>`).join("")}</div><small>Art from Battle for Wesnoth, used under the GPL. See Menu, Credits.</small>`);
 $("mcard").querySelectorAll(".leader").forEach(b=>b.onclick=()=>{closeModal();newGame(opts[+b.dataset.i]);toast("Round 1","Recruit, then fight",1600)})}
preload();size();
if(load()){render();toast("Welcome back","Round "+S.round)}else chooseLeader();
window.__mk={get S(){return S},battle,buy,fight,me,UD,UL,LEADERS,get anim(){return anim},setSpeed(v){speed=v},newGame,aiTurn,render};
