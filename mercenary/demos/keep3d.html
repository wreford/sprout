// Siege of Gravenhold: a first-person raycaster. You are a sellsword clearing a warlord's keep, floor by floor.
const {$,IMG,unit,sfx,ls,toast,grid}=MK;

const RW=320,RH=180,TEX=64;

// ---------- textures, drawn once in code (no wall art in the asset pack, so we make our own)
function tex(draw){const c=document.createElement("canvas");c.width=c.height=TEX;const q=c.getContext("2d");draw(q,MK.rng(draw.length*977+TEX));return c}

 q.fillStyle="rgba(255,255,255,.08)";q.fillRect(x+1,y+1,30,2);q.fillStyle="rgba(0,0,0,.25)";q.fillRect(x+1,y+13,30,2)}}noise(q,R,.5,["#000","#fff",base])}
const TX={};
function buildTextures(){

 TX.W=tex((q,R)=>{for(let x=0;x<64;x+=8){q.fillStyle=R.pick(["#6b4626","#7a5230","#5f3d20","#73502c"]);q.fillRect(x,0,8,64);q.fillStyle="rgba(0,0,0,.4)";q.fillRect(x,0,1,64);for(let k=0;k<5;k++){q.fillStyle="rgba(40,20,5,.35)";q.fillRect(x+R.int(2,5),R.int(0,60),1,R.int(6,18))}}
  q.fillStyle="#3b2a1a";q.fillRect(0,10,64,4);q.fillRect(0,50,64,4);noise(q,R,.3,["#000","#a07040"])});

  q.fillStyle="#d8b04a";q.fillRect(18,4,28,3);q.beginPath();q.arc(32,26,8,0,7);q.fill();q.fillStyle="#9c1f1f";q.beginPath();q.arc(32,26,5,0,7);q.fill();q.fillStyle="#d8b04a";q.fillRect(31,18,2,16);q.fillRect(26,25,12,2)});
 TX.D=tex((q,R)=>{q.fillStyle="#4a3320";q.fillRect(0,0,64,64);for(let x=0;x<64;x+=10){q.fillStyle=R.pick(["#6b4626","#5f3d20","#73502c"]);q.fillRect(x+1,0,9,64)}
  q.fillStyle="#3c3c44";q.fillRect(0,12,64,6);q.fillRect(0,46,64,6);q.fillStyle="#8a8a96";for(let x=4;x<64;x+=12){q.fillRect(x,14,2,2);q.fillRect(x,48,2,2)}q.fillStyle="#b8a060";q.fillRect(52,30,6,4)});
 TX.L=tex((q,R)=>{q.fillStyle="#5a4a20";q.fillRect(0,0,64,64);for(let x=0;x<64;x+=10){q.fillStyle=R.pick(["#8a6d2a","#7a6024","#94782e"]);q.fillRect(x+1,0,9,64)}q.fillStyle="#d8b04a";q.fillRect(0,12,64,5);q.fillRect(0,47,64,5);
  q.fillStyle="#2a2010";q.beginPath();q.arc(32,30,6,0,7);q.fill();q.fillRect(30,30,4,12)});
 TX.X=tex((q,R)=>{bricks(q,R,"#556","#16161c",["#3c3c4a","#44445a","#383848"]);const gr=q.createRadialGradient(32,32,2,32,32,26);gr.addColorStop(0,"rgba(140,220,255,.95)");gr.addColorStop(.5,"rgba(60,140,255,.5)");gr.addColorStop(1,"rgba(0,0,0,0)");q.fillStyle=gr;q.fillRect(0,0,64,64);
  q.strokeStyle="#bfefff";q.lineWidth=2;q.beginPath();q.arc(32,32,14,0,7);q.stroke();q.beginPath();q.moveTo(32,18);q.lineTo(32,46);q.moveTo(20,26);q.lineTo(44,38);q.moveTo(44,26);q.lineTo(20,38);q.stroke()});

buildTextures();
// ---------- enemies and things
const FOES={g:{id:"gob",hp:25,dmg:[3,7],spd:1.7,pts:100},o:{id:"grunt",hp:45,dmg:[6,11],spd:1.45,pts:200},s:{id:"skel",hp:55,dmg:[6,10],spd:1.25,pts:250},w:{id:"wolf2",hp:30,dmg:[5,9],spd:2.7,pts:150},
 a:{id:"oarch",hp:35,dmg:[4,8],ranged:true,spd:1.3,pts:300},m:{id:"adept",hp:30,dmg:[7,13],ranged:true,spd:1.2,pts:400},t:{id:"twar",hp:150,dmg:[11,18],spd:1.1,pts:1200},
 Z:{id:"warlord",hp:520,dmg:[12,22],spd:1.35,pts:5000,boss:true,ranged:true}};
const ITEMS={h:{i:"icons/potion_red_medium.png",s:.42},c:{i:"icons/coins_copper.png",s:.4},T:{i:"items/chest-plain-closed.png",s:.6},b:{i:"icons/bag.png",s:.42},k:{i:"items/stone-tablet.png",s:.42},
 F:{i:"attacks/fireball.png",s:.5},n:{i:"icons/jewelry_ring_prismatic.png",s:.36},r:{i:"items/brazier.png",s:.8,block:true},x:{i:"items/bones.png",s:.55},u:{i:"items/dragonstatue.png",s:1.05,block:true}};
const WEAPONS=[{n:"Sword",i:"attacks/sword-human.png",cd:.42,melee:true,dmg:[22,36],snd:"sword-1"},{n:"Crossbow",i:"attacks/crossbow-human.png",cd:.55,ammo:"bolts",dmg:[18,30],snd:"bow"},{n:"Fire staff",i:"attacks/fireball.png",cd:.7,ammo:"mana",dmg:[40,60],splash:1.6,snd:"flame-big"}];
// ---------- levels: the first is hand-built, the rest are laid out fresh each run
const L1=["#####################","#S..#.......#.....c.#","#...D...g...D...o...#","#.h.#.......#.......#","##D###B###B####D#####","#.....#.....#.......#","#..g..D..r..D...s...#","#.....#.....#.......#",
 "#c....###D###...h...#","#######.....######L##","#.....#..o..#k..#...#","#.bT..P.....D...#.c.#","#..c..#..g..#...#...#","##################X##"];
const NAMES=["The Gatehouse","The Old Crypts","The Barracks","The Warlord's Hall"];
function genLevel(n,R){const C=4,Rr=3,MW=C*7+1,MH=Rr*6+1,m=Array.from({length:MH},()=>Array(MW).fill("#")),obj=[];
 const theme=n===1?"M":n===2?"W":"#";for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)m[y][x]=theme==="W"&&R()<.5?"#":theme;
 const rooms=[];for(let j=0;j<Rr;j++)for(let i=0;i<C;i++){rooms.push({i,j,adj:[]});for(let y=j*6+1;y<=j*6+5;y++)for(let x=i*7+1;x<=i*7+6;x++)m[y][x]="."}
 const R_=(i,j)=>rooms.find(r=>r.i===i&&r.j===j);const doorPos=(a,b)=>a.i!==b.i?[Math.max(a.i,b.i)*7,a.j*6+3]:[a.i*7+4,Math.max(a.j,b.j)*6];
 // random depth-first tree of rooms
 const seen=new Set(),stack=[rooms[0]],edges=[];seen.add(rooms[0]);while(stack.length){const r=stack[stack.length-1];const nb=R.shuffle([[1,0],[-1,0],[0,1],[0,-1]]).map(([a,b])=>R_(r.i+a,r.j+b)).filter(o=>o&&!seen.has(o));
  if(!nb.length){stack.pop();continue}const o=nb[0];seen.add(o);edges.push([r,o]);r.adj.push(o);o.adj.push(r);o.parent=r;o.depth=(r.depth||0)+1;stack.push(o)}
 const start=rooms[0];start.depth=0;const leaves=rooms.filter(r=>r!==start&&r.adj.length===1).sort((a,b)=>b.depth-a.depth);const exit=leaves[0];
 edges.forEach(([a,b])=>{const [x,y]=doorPos(a,b);const lock=(a===exit||b===exit);if(!lock&&R()<.3){if(a.i!==b.i)for(let d=-1;d<=1;d++)m[y+d][x]=".";else for(let d=-1;d<=1;d++)m[y][x+d]="."}else m[y][x]=lock?"L":"D"});
 // a couple of extra doors make loops, away from the exit
 for(let k=0;k<3;k++){const a=R.pick(rooms),h=R()<.5,b=R_(a.i+(h?1:0),a.j+(h?0:1));if(!b||a===b||a===exit||b===exit||a.adj.includes(b))continue;const [x,y]=doorPos(a,b);m[y][x]="D";a.adj.push(b);b.adj.push(a)}
 // exit rune on the exit room's far wall
 const ed=doorPos(exit,exit.parent),cand=[[exit.i*7+1,exit.j*6+3],[exit.i*7+6,exit.j*6+3],[exit.i*7+3,exit.j*6+1],[exit.i*7+3,exit.j*6+5]].sort((a,b)=>Math.hypot(b[0]-ed[0],b[1]-ed[1])-Math.hypot(a[0]-ed[0],a[1]-ed[1]));m[cand[0][1]][cand[0][0]]="X";
 // a secret closet behind a push-wall in a right-edge room
 const sr=rooms.find(r=>r.i===C-1&&r!==exit&&r!==start&&!r.adj.some(o=>o.j===r.j&&o.i>r.i));let secrets=0;
 if(sr){const cx=sr.i*7+5;for(let y=sr.j*6+1;y<=sr.j*6+5;y++){m[y][cx]=theme;if(y===sr.j*6+1||y===sr.j*6+5)m[y][cx+1]=theme}m[sr.j*6+3][cx]="P";secrets=1;obj.push(["T",cx+1,sr.j*6+3],["c",cx+1,sr.j*6+2],["n",cx+1,sr.j*6+4])}
 // banners on some walls
 for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){const ch=m[y][x];if((ch==="#"||ch==="M"||ch==="W")&&R()<.07&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>m[y+b][x+a]==="."))m[y][x]="B"}
 const cell=(r,avoid,inner)=>{const e=inner?1:0;for(let t=0;t<60;t++){const x=R.int(r.i*7+1+e,r.i*7+(r===sr?4:6)-e),y=R.int(r.j*6+1+e,r.j*6+5-e);if(m[y][x]==="."&&!obj.some(o=>o[1]===x&&o[2]===y)&&!(avoid&&Math.abs(x-avoid[0])+Math.abs(y-avoid[1])<3))return [x,y]}return null};
 const sp=[start.i*7+2,start.j*6+3];obj.push(["S",...sp]);
 const pool=[["g","w","o","a"],["s","s","m","g","o","w"],["o","a","m","s","t","w"]][n-1];
 rooms.forEach(r=>{if(r===start)return;const k=1+R.int(0,1)+(n>=2?R.int(0,1):0);for(let i=0;i<k;i++){const p=cell(r,sp);if(p)obj.push([R.pick(pool),...p])}
  if(R()<.55){const p=cell(r);if(p)obj.push([R.pick(["h","c","b","b","c",n>=2?"b":"h"]),...p])}if(R()<.35){const p=cell(r,null,true);if(p)obj.push(["r",...p])}if(R()<.3){const p=cell(r);if(p)obj.push(["x",...p])}});
 const kr=rooms.filter(r=>r!==exit&&r!==start).sort((a,b)=>b.depth-a.depth)[0];
 if(n===3){const p=[exit.parent.i*7+3,exit.parent.j*6+3];obj.push(["Z",...p]);obj.push(["u",p[0]-2,p[1]-2],["u",p[0]+2,p[1]-2])}else{const p=cell(kr)||[kr.i*7+3,kr.j*6+3];obj.push(["k",...p])}
 if(n===1){const p=cell(kr)||cell(start);if(p)obj.push(["F",...p])}
 return {m,obj,secrets}}
function parse(rows){const m=rows.map(r=>[...r]),obj=[];m.forEach((row,y)=>row.forEach((ch,x)=>{if(/[A-Za-z]/.test(ch)&&!"#MWBDLXP".includes(ch)){obj.push([ch,x,y]);row[x]="."}}));return {m,obj,secrets:rows.join("").split("P").length-1}}
// ---------- run state
let G=null,run=null;
function newRun(){run={lvl:0,score:0,lives:3,hp:100,bolts:12,mana:0,staff:false,w:1};startLevel()}
function startLevel(){const n=run.lvl,L=n===0?parse(L1):genLevel(n,MK.rng((Math.random()*1e9)|0));
 G={m:L.m,W:L.m[0].length,H:L.m.length,doors:{},push:{},things:[],foes:[],x:0,y:0,a:0,key:false,secrets:L.secrets,found:0,kills:0,foesTotal:0,treasure:0,treasureTotal:0,t:0,cd:0,swing:0,hurt:0,flash:0,bob:0,map:false,over:false,msgT:0};
 L.obj.forEach(([ch,x,y])=>{if(ch==="S"){G.x=x+.5;G.y=y+.5;return}
  if(FOES[ch]){const f=FOES[ch];G.foes.push({k:ch,id:f.id,x:x+.5,y:y+.5,hp:f.hp*(1+n*.12),max:f.hp*(1+n*.12),st:"idle",cd:0,hurt:0,path:null,pt:0,lunge:0,boss:f.boss});G.foesTotal++;return}
  if(ITEMS[ch]){G.things.push({k:ch,x:x+.5,y:y+.5});if(ch==="T"||ch==="c"||ch==="n")G.treasureTotal++}});
 // face the most open direction
 let best=0,bd=0;for(let i=0;i<4;i++){const a=i*Math.PI/2;let d=0;while(d<12&&!solid(G.x+Math.cos(a)*d,G.y+Math.sin(a)*d))d+=.5;if(d>bd){bd=d;best=a}}G.a=best;
 layout();MK.playMusic(n===3?"the_dangerous_symphony":n===1?"underground":"frantic",.32);msg(`Floor ${n+1}: ${NAMES[n]}`)}
// ---------- map queries
const cellAt=(x,y)=>{x=Math.floor(x);y=Math.floor(y);return x<0||y<0||x>=G.W||y>=G.H?"#":G.m[y][x]};
const isDoor=c=>c==="D"||c==="L";
function solid(x,y){const c=cellAt(x,y);if(c===".")return false;if(isDoor(c))return (G.doors[Math.floor(x)+","+Math.floor(y)]||0)<.92;return true}
function blockedThing(x,y,self){for(const t of G.things)if(ITEMS[t.k].block&&Math.abs(t.x-x)<.45&&Math.abs(t.y-y)<.45)return true;for(const f of G.foes)if(f!==self&&f.st!=="dead"&&Math.hypot(f.x-x,f.y-y)<.5)return true;return false}
function tryMove(o,dx,dy,r,self){const nx=o.x+dx,ny=o.y+dy;if(!solid(nx+Math.sign(dx)*r,o.y)&&!solid(nx+Math.sign(dx)*r,o.y+r*.7)&&!solid(nx+Math.sign(dx)*r,o.y-r*.7)&&!blockedThing(nx,o.y,self))o.x=nx;
 if(!solid(o.x,ny+Math.sign(dy)*r)&&!solid(o.x+r*.7,ny+Math.sign(dy)*r)&&!solid(o.x-r*.7,ny+Math.sign(dy)*r)&&!blockedThing(o.x,ny,self))o.y=ny}
function los(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d*4);for(let i=1;i<n;i++){const x=ax+(bx-ax)*i/n,y=ay+(by-ay)*i/n;if(solid(x,y))return false}return true}
// ---------- the ray caster
const zbuf=new Float32Array(RW);
function castColumn(sx){const cam=2*sx/RW-1,dx=Math.cos(G.a),dy=Math.sin(G.a),px=-dy*.66,py=dx*.66,rx=dx+px*cam,ry=dy+py*cam;
 let mx=Math.floor(G.x),my=Math.floor(G.y);const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry),stx=rx<0?-1:1,sty=ry<0?-1:1;let sdx=rx<0?(G.x-mx)*ddx:(mx+1-G.x)*ddx,sdy=ry<0?(G.y-my)*ddy:(my+1-G.y)*ddy,side=0;
 for(let i=0;i<64;i++){if(sdx<sdy){sdx+=ddx;mx+=stx;side=0}else{sdy+=ddy;my+=sty;side=1}const c=cellAt(mx,my);if(c===".")continue;
  if(isDoor(c)){const open=G.doors[mx+","+my]||0;let d,wx;if(side===0){d=(mx+.5-G.x)/rx;const hy=G.y+d*ry;if(Math.floor(hy)!==my)continue;wx=hy-my}else{d=(my+.5-G.y)/ry;const hx=G.x+d*rx;if(Math.floor(hx)!==mx)continue;wx=hx-mx}
   if(wx<open)continue;return {d,tx:Math.floor((wx-open)*TEX)&63,c,side}}
  let d=side===0?(mx-G.x+(1-stx)/2)/rx:(my-G.y+(1-sty)/2)/ry;const pk=G.push[mx+","+my];if(pk){d+=pk*(side===0?Math.abs(ddx):Math.abs(ddy))}
  let wx=side===0?G.y+d*ry:G.x+d*rx;wx-=Math.floor(wx);let tx=Math.floor(wx*TEX);if((side===0&&rx>0)||(side===1&&ry<0))tx=63-tx;

  const nb=side===0?cellAt(mx-stx,my):cellAt(mx,my-sty);return {d,tx,c:isDoor(nb)?"W":c,side}}
 return {d:30,tx:0,c:"#",side:0}}
function render(){const hz=RH/2;const cg=g.createLinearGradient(0,0,0,hz);cg.addColorStop(0,"#1a1a22");cg.addColorStop(1,"#3a3a44");g.fillStyle=cg;g.fillRect(0,0,RW,hz);
 const fg=g.createLinearGradient(0,hz,0,RH);fg.addColorStop(0,"#2a2420");fg.addColorStop(1,"#5a4c3c");g.fillStyle=fg;g.fillRect(0,hz,RW,hz);
 for(let x=0;x<RW;x++){const h=castColumn(x);zbuf[x]=h.d;const lh=RH/Math.max(.05,h.d),y0=hz-lh/2;g.drawImage(TX[h.c]||TX["#"],h.tx,0,1,TEX,x,y0,1,lh);
  const shade=(h.side?.28:0)+Math.min(.7,h.d/14);if(shade>0.02){g.fillStyle=`rgba(0,0,0,${shade})`;g.fillRect(x,y0,1,lh)}}
 // sprites, far to near
 const dx=Math.cos(G.a),dy=Math.sin(G.a),plx=-dy*.66,ply=dx*.66,inv=1/(plx*dy-dx*ply);
 const list=[...G.things.map(t=>({o:t,img:MK.img(ITEMS[t.k].i),s:ITEMS[t.k].s,item:true})),...G.foes.map(f=>({o:f,img:f.st==="dead"?MK.img("items/bones.png"):(f.hurt>0?redTint(f.id):MK.tc(unit(f.id).spr,1)),s:f.st==="dead"?.5:(f.boss?1.35:1)*(1+f.lunge*.12),foe:f.st!=="dead"}))];
