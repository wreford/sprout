<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QA Tester · Mercenary Keep</title><link rel="stylesheet" href="mk.css">
<style>
#app{max-width:860px;margin:0 auto;padding:12px}
.intro{padding:14px 16px;margin-bottom:12px}.intro p{margin:4px 0;color:var(--mute)}
.who{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.who input{background:#0b0f18;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 10px;font:15px system-ui;min-width:0;flex:1}
.g{display:flex;flex-direction:column;gap:10px}
.d{display:grid;grid-template-columns:44px 64px 1fr;gap:12px;padding:12px;align-items:start}
.rk{display:flex;flex-direction:column;align-items:center;gap:4px}.rk b{font:900 26px Georgia,serif;color:var(--gold2)}.rk button{width:34px;height:26px;padding:0;font-size:14px}
.d>img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;background:#0b0f18;border-radius:8px;border:1px solid var(--line)}
.d h3{margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.d h3 small{font:600 12px system-ui;color:var(--mute)}.d h3 a{font:700 12px system-ui;color:var(--gold2)}
.sc{display:grid;grid-template-columns:repeat(3,auto);gap:4px 14px;margin:6px 0;font-size:13px;color:var(--mute);justify-content:start}.sc>span{display:flex;align-items:center;gap:6px}.sc>span>i{font-style:normal;width:42px}
.st{display:flex;gap:2px}.st button{background:none;border:0;padding:0 1px;font-size:20px;color:#3a3a4a;line-height:1}.st button.on{color:var(--gold2)}
.d textarea{width:100%;min-height:54px;background:#0b0f18;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px;font:14px system-ui;resize:vertical}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}.tags button{font:600 12px system-ui;padding:3px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--mute)}.tags button.on{background:#3a2e18;color:var(--gold2);border-color:var(--gold)}
.send{position:sticky;bottom:0;padding:12px;margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#0d111b}
.send .sum{flex:1;font-size:13px;color:var(--mute);min-width:200px}
textarea#over{width:100%;min-height:60px;background:#0b0f18;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px;font:14px system-ui}
@media (max-width:560px){.d{grid-template-columns:40px 1fr}.d>img{display:none}.sc{grid-template-columns:1fr}}
</style></head><body>
<div id="app"></div>
<script src="roster.js"></script><script src="mk.js"></script><script src="engine.js"></script>
<script>
"use strict";
const {$,IMG,ls,toast}=MK;
MK.topbar("qa");
const GAMES=[["td","Hold the Keep","Tower defense","../index.html","units/human-loyalists/lieutenant.png"],["classic","Classic","Auto-battler","../index.html","units/human-loyalists/general.png"],
 ["deck","The Gauntlet","Deckbuilder","deck.html","icons/book2.png"],["jrpg","Ballad of the Keep","JRPG","jrpg.html","units/human-magi/white-mage.png"],["quest","Hollow Woods","Action adventure","quest.html","units/elves-wood/fighter/fighter.png"],
 ["tactics","Ford of Ashes","Grid tactics","tactics.html","units/human-loyalists/spearman.png"],["idle","The Ledger","Idle","idle.html","items/gold-coins-large.png"],["march","March of Banners","Squad campaign","march.html","misc/flag-red.png"]];
const TAGS=["fun","confusing","too hard","too easy","buggy","pretty","want more","slow"];
let Q=ls.get("mk.qa",null)||{order:GAMES.map(g=>g[0]),r:{},name:"",to:"",over:""};
GAMES.forEach(g=>{if(!Q.order.includes(g[0]))Q.order.push(g[0]);Q.r[g[0]]=Q.r[g[0]]||{fun:0,look:0,clear:0,tags:[],note:""}});Q.order=Q.order.filter(k=>GAMES.some(g=>g[0]===k));
const save=()=>ls.set("mk.qa",Q);
const stars=(k,f)=>`<span class="st">${[1,2,3,4,5].map(n=>`<button class="${Q.r[k][f]>=n?"on":""}" data-s="${k}|${f}|${n}" aria-label="${n} stars">★</button>`).join("")}</span>`;
function render(){const G=k=>GAMES.find(g=>g[0]===k);
 $("app").innerHTML=`<div class="intro frame"><h2 style="margin:0">QA tester</h2><p>Play each game, then rank them best to worst with the arrows, rate them, and add notes. When you're done, text the report.</p>
  <div class="who"><input id="nm" placeholder="Your name" value="${Q.name.replace(/"/g,"&quot;")}"><input id="to" placeholder="Text it to (phone number)" inputmode="tel" value="${Q.to.replace(/"/g,"&quot;")}"></div></div>
 <div class="g">${Q.order.map((k,i)=>{const g=G(k),R=Q.r[k];return `<div class="d frame"><div class="rk"><button class="mini" data-up="${i}" ${i?"":"disabled"}>▲</button><b>${i+1}</b><button class="mini" data-dn="${i}" ${i<Q.order.length-1?"":"disabled"}>▼</button></div><img src="${IMG(g[4])}" alt="">
  <div><h3>${g[1]} <small>${g[2]}</small> <a href="${g[3]}" target="_blank">play ↗</a></h3><div class="sc"><span><i>Fun</i>${stars(k,"fun")}</span><span><i>Looks</i>${stars(k,"look")}</span><span><i>Clear</i>${stars(k,"clear")}</span></div>
  <div class="tags">${TAGS.map(t=>`<button class="${R.tags.includes(t)?"on":""}" data-t="${k}|${t}">${t}</button>`).join("")}</div><textarea data-n="${k}" placeholder="What worked? What broke? What would you change?">${R.note}</textarea></div></div>`}).join("")}</div>
 <div class="frame" style="padding:12px;margin-top:10px"><b>Overall</b><textarea id="over" placeholder="Anything else: which one should be the main game?">${Q.over}</textarea></div>
 <div class="send frame"><span class="sum">${summaryLine()}</span><button class="btn" id="sms">Text the report</button><button class="btn alt" id="cp">Copy</button><button class="btn alt" id="clr">Clear</button></div>`;
 document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[Q.order[i-1],Q.order[i]]=[Q.order[i],Q.order[i-1]];save();render()});
 document.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;[Q.order[i+1],Q.order[i]]=[Q.order[i],Q.order[i+1]];save();render()});
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const [k,f,n]=b.dataset.s.split("|");Q.r[k][f]=Q.r[k][f]===+n?0:+n;save();render()});
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const [k,t]=b.dataset.t.split("|"),T=Q.r[k].tags;Q.r[k].tags=T.includes(t)?T.filter(x=>x!==t):T.concat(t);save();render()});
 document.querySelectorAll("[data-n]").forEach(t=>t.oninput=()=>{Q.r[t.dataset.n].note=t.value;save()});
 $("over").oninput=e=>{Q.over=e.target.value;save()};$("nm").oninput=e=>{Q.name=e.target.value;save()};$("to").oninput=e=>{Q.to=e.target.value.replace(/[^\d+]/g,"");save()};
 $("sms").onclick=()=>{const body=report();location.href=`sms:${Q.to||""}${/iPhone|iPad|Mac/.test(navigator.userAgent)?"&":"?"}body=${encodeURIComponent(body)}`};
 $("cp").onclick=()=>{const t=report();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Copied")).catch(()=>{prompt("Copy this:",t)})};
 $("clr").onclick=()=>{if(confirm("Clear all rankings and notes?")){ls.set("mk.qa",null);location.reload()}}}
function summaryLine(){const done=GAMES.filter(g=>{const R=Q.r[g[0]];return R.fun||R.note}).length;return `${done} of ${GAMES.length} rated · #1 is ${GAMES.find(g=>g[0]===Q.order[0])[1]}`}
function report(){const G=k=>GAMES.find(g=>g[0]===k),s=n=>n?"★".repeat(n)+"☆".repeat(5-n):"-";
 return `Mercenary Keep QA${Q.name?" from "+Q.name:""}\n\n`+Q.order.map((k,i)=>{const g=G(k),R=Q.r[k];return `${i+1}. ${g[1]} (${g[2]})\n   fun ${s(R.fun)} looks ${s(R.look)} clear ${s(R.clear)}${R.tags.length?"\n   tags: "+R.tags.join(", "):""}${R.note?"\n   "+R.note.trim():""}`}).join("\n")+(Q.over?`\n\nOverall: ${Q.over.trim()}`:"")}
render();
</script></body></html>
