 drake:{g:[1,30],f:[1,40],h:[1,40],m:[1,40],w:[1,20],s:[1,20],v:[1,40],c:[1,40],k:[1,40],r:[1,30],S:[1,30]}};
const MT=id=>{const r=unit(id);if(["horse","cav","wolf","wolf2","boar","m_gwolf","m_dwolf"].includes(id))return "mounted";if(["gryph","gryphon2","glider","sky","ghost","m_falcon","m_efalcon","m_roc","m_wisp"].includes(id))return "fly";

// ---------- units, built from the shared roster
let UID=1;
function mkUnit(id,side,o){o=o||{};const r=unit(id),mt=MT(id),tier=r.tier,magic=r.ab.includes("magic");const lv=o.lv||(tier>=4?3:tier>=3?2:1);
 const u={uid:UID++,id,side,lv,promo:lv>=2&&tier<3,mt,align:id==="thief"?"chaotic":ALIGN[r.fac]||"neutral",traits:[],heals:r.ab.includes("heals"),leader:!!o.leader,xp:0,moved:0,attacked:false,c:0,r:0,resting:true,
  max:Math.round(r.hp*1.5+6+(tier>=3?6:0)),mv:mt==="mounted"?8:mt==="dwarf"?4:mt==="fly"?6:id==="corpse"?4:5,atk:[]};
 const plus=tier>=3?2:0;
 if(r.t==="m")u.atk.push({n:"melee",rng:"melee",dmg:r.dmg+3+plus,str:r.str,first:r.ab.includes("first"),charge:r.ab.includes("charge"),snd:r.wp});
 else{u.atk.push({n:"melee",rng:"melee",dmg:magic?4:Math.min(r.dmg+1,Math.round(r.dmg*.5)+3),str:magic?1:2,snd:"sword-human"});u.atk.push({n:"ranged",rng:"ranged",dmg:r.dmg+3+plus,str:r.str,magic,snd:r.wp})}
 if(side!==0||o.traits!==false){const pool=Object.keys(TRAITS).filter(t=>t!=="dextrous"||r.t==="r");if(r.fac!=="undead")u.traits=shuffle(pool).slice(0,2)}
 u.traits.forEach(t=>{if(t==="strong"){u.max+=1;u.atk.forEach(a=>{if(a.rng==="melee")a.dmg++})}if(t==="quick"){u.mv++;u.max=Math.round(u.max*.95)}if(t==="resilient")u.max+=4;if(t==="dextrous")u.atk.forEach(a=>{if(a.rng==="ranged")a.dmg++})});
 if(lv>=2&&tier<3){u.max=Math.round(u.max*1.3);u.atk.forEach(a=>a.dmg=Math.round(a.dmg*1.3))}if(lv>=3){u.max=Math.round(u.max*1.2);u.atk.forEach(a=>a.dmg+=2)}
 if(o.leader){u.max+=8}u.hp=u.max;u.maxxp=Math.round(34*lv*(u.traits.includes("intelligent")?.8:1));u.cost=10+tier*5+(mt==="mounted"?3:0);return u}
const uname=u=>u.promo&&unit(u.id).n2?unit(u.id).n2:unit(u.id).n;
const uspr=u=>u.promo&&unit(u.id).spr2?unit(u.id).spr2:unit(u.id).spr;
function levelUp(u){u.xp-=u.maxxp;if(u.lv===1&&unit(u.id).n2){u.lv=2;u.promo=true;u.max=Math.round(u.max*1.3);u.atk.forEach(a=>a.dmg=Math.round(a.dmg*1.3));u.maxxp=Math.round(u.maxxp*1.6)}else{u.max+=3;u.lv=Math.max(u.lv,2)}u.hp=u.max;sfx("fanfare-short",.45);floatAt(u.c,u.r,"LEVEL UP","#b6a6ff")}
// ---------- the campaign
const RECRUITS=[["spear","bow","horse","mage","hvy","fencer","thunder","efight"],["spear","bow","horse","mage","hvy","fencer","thunder","efight","earch","dfight","white","gryph"]];
const SCEN=[{n:"Border Village",d:"Orc raiders have taken the border villages. Kill their chieftain.",enemy:"north",pool:["gob","grunt","wolf","oarch","grunt","whelp"],leader:"grunt",ll:2,gold:[100,70],inc:[0,0],turns:18,map:"m1",tod:0,music:"northerners"},
 {n:"The Drowned Fen",d:"Something walks in the fen at night. Find the necromancer and end it.",enemy:"undead",pool:["skel","corpse","ghoul","adept","skel","ghost"],leader:"adept",ll:2,gold:[0,80],inc:[0,1],turns:20,map:"fen",tod:3,music:"underground"},
 {n:"Ashpeak Pass",d:"Drakes hold the only pass through the Ashpeaks. Break their flight-leader.",enemy:"drake",pool:["saur","augur","burner","clash","glider"],leader:"flare",ll:2,gold:[0,95],inc:[0,2],turns:20,map:"pass",tod:1,music:"breaking_the_chains"},
 {n:"Hold the Bridge",d:"The warlord's army is coming over the river. Hold until the 12th turn, or kill their captain.",enemy:"north",pool:["grunt","oarch","wolf","assn","twar","gob","grunt"],leader:"slayer",ll:2,gold:[0,120],inc:[0,4],turns:12,survive:true,map:"bridge",tod:4,music:"frantic"},
 {n:"Ashvale Keep",d:"The warlord himself, and a lich he pays in souls. Bring down the warlord.",enemy:"north",pool:["grunt","twar","oarch","assn","wolf"],leader:"warlord",ll:3,gold:[0,110],inc:[0,3],turns:24,map:"keep",tod:0,ally:{fac:"undead",pool:["skel","ghoul","adept","blade"],leader:"lich",gold:50},music:"the_dangerous_symphony"}];
let CAMP=null,B=null;
// ---------- maps: one hand-built, the rest grown from a seed (same seed, same map)
const M1=["fhgggcggfmm","ffggckcggfm","fgvgcgcgvgh","ggggrrrgggf","hgfgrgffghh","gvgfrggvgfh","ggggrgsswww","fffgrrsswwg","gvhgggrgvgg","ggggfgrgggf","hfggvfrgfgh","gggfggrggvg","fgvgccrcggf","ffgcgkcgfgh","mfgggcggghm"];
function genMap(style,seed){const R=MK.rng(seed),W=11,H=15;for(let t=0;t<60;t++){const m=Array.from({length:H},()=>Array(W).fill("g"));
 const blob=(ch,n,cMin,cMax,rMin,rMax)=>{let c=R.int(cMin,cMax),r=R.int(rMin,rMax);for(let i=0;i<n;i++){if(m[r]&&m[r][c]!==undefined)m[r][c]=ch;const nb=hex.nb(c,r).filter(([a,b])=>a>=0&&b>=0&&a<W&&b<H);[c,r]=R.pick(nb)}};
 const A={fen:{S:6,w:3,f:3,h:1,m:0},pass:{m:6,h:6,f:2,S:0,w:0},bridge:{f:4,h:3,m:1,S:1,w:0},keep:{f:3,h:4,m:2,S:1,w:0}}[style];
 for(let i=0;i<A.f;i++)blob("f",R.int(3,6),0,10,2,12);for(let i=0;i<A.h;i++)blob("h",R.int(3,5),0,10,2,12);for(let i=0;i<A.m;i++)blob("m",R.int(2,4),0,10,3,11);for(let i=0;i<A.S;i++)blob("S",R.int(3,6),0,10,3,11);for(let i=0;i<A.w;i++)blob("w",R.int(2,4),0,10,4,10);
 if(style==="bridge"){for(let c=0;c<W;c++){m[7][c]="w";m[6][c]=R()<.5?"w":m[6][c]}m[7][2]="s";m[7][8]="s";m[6][5]="r";m[7][5]="r";m[8][5]="r";m[6][2]="s";m[6][8]="s"}
 if(style==="pass"){for(let r=4;r<11;r++){const c=R.int(3,7);m[r][c]=R()<.5?"h":"g";m[r][c+1]="g"}}
 // keeps and castles at both ends (and a side keep for allies)
 const stamp=(kc,kr)=>{m[kr][kc]="k";hex.nb(kc,kr).slice(0,4).forEach(([c,r])=>{if(m[r]&&m[r][c]!==undefined)m[r][c]="c"})};stamp(5,13);stamp(5,1);if(style==="keep")stamp(9,4);
 // villages, spread out
 let v=0;for(let k=0;k<200&&v<10;k++){const c=R.int(0,W-1),r=R.int(1,H-2);if("gfhS".includes(m[r][c])&&!hasNear(m,c,r,"v",2)&&!hasNear(m,c,r,"k",1)){m[r][c]="v";v++}}
 // roads from keep to keep
 if(style!=="fen"){let c=5,r=12;while(r>2){r--;if(m[r][c]!=="w"&&m[r][c]!=="v"&&m[r][c]!=="c"&&m[r][c]!=="k")m[r][c]=style==="bridge"&&r===7?"r":"r";if(R()<.3)c=Math.max(2,Math.min(8,c+R.pick([-1,1])))}}
 const ok=hex.reach(5,13,99,(c,r)=>c<0||r<0||c>=W||r>=H?Infinity:MOVE.foot[m[r][c]][0]>=99?Infinity:MOVE.foot[m[r][c]][0]).cost.has("5,1");if(ok)return m.map(r=>r.join(""))}
 return M1}
function hasNear(m,c,r,ch,d){for(let rr=r-d;rr<=r+d;rr++)for(let cc=c-d;cc<=c+d;cc++)if(m[rr]&&m[rr][cc]===ch&&hex.dist([c,r],[cc,rr])<=d)return true;return false}
// ---------- battle setup
function startScenario(i){CAMP._snap=JSON.stringify({...CAMP,_snap:undefined});const sc=SCEN[i];const rows=sc.map==="m1"?M1:genMap(sc.map,1000+i*77);const map=rows.map(r=>[...r]),H=map.length,W=map[0].length;
 B={sci:i,sc,map,W,H,units:[],vill:{},gold:[CAMP.gold+sc.gold[0],sc.gold[1],sc.ally?sc.ally.gold:0],turn:1,side:0,sel:null,reach:null,undo:null,fx:[],over:false,sides:sc.ally?3:2,ai:[1,2],fast:ls.get("mk.ashFast",false)};
 const keeps=[];map.forEach((row,r)=>row.forEach((ch,c)=>{if(ch==="k")keeps.push([c,r])}));
 const pk=keeps.find(([c,r])=>r>H/2),ek=keeps.find(([c,r])=>r<3),ak=keeps.find(([c,r])=>r>=3&&r<=H/2);
 let lead=CAMP.roster.find(u=>u.leader&&u.hp>0);if(!lead){lead=mkUnit("lieut",0,{leader:true});CAMP.roster=CAMP.roster.filter(u=>!u.leader);CAMP.roster.unshift(lead)}lead.hp=lead.max;place(lead,...pk);
 const el=mkUnit(sc.leader,1,{leader:true,lv:sc.ll});place(el,...ek);
 if(sc.ally&&ak){const al=mkUnit(sc.ally.leader,2,{leader:true,lv:3});place(al,...ak)}
 // the enemy starts with a few units already out
 for(let k=0;k<1+Math.floor(i/2);k++){const u=mkUnit(pick(sc.pool),1);const spot=freeNear(ek,3);if(spot)place(u,...spot)}
 B.units.forEach(u=>{u.moved=0;u.attacked=false});
 layout();cam.fit();centerOn(lead.c,lead.r);MK.playMusic(sc.music,.3);buildTerrain();newTurnFX();
 MK.modal(`<h2>${sc.n}</h2><p>${sc.d}</p><p style="color:var(--mute);font-size:13px">${sc.survive?"Survive":"Turn limit"}: ${sc.turns} turns · starting gold ${B.gold[0]}</p><button class="btn" id="ok">To arms</button>`);$("ok").onclick=()=>{MK.closeModal();save()}}
function place(u,c,r){u.c=c;u.r=r;if(!B.units.includes(u))B.units.push(u)}
function freeNear(p,d){const opts=[];for(let r=0;r<B.H;r++)for(let c=0;c<B.W;c++){if(hex.dist(p,[c,r])<=d&&!unitAt(c,r)&&cost("foot",c,r)<99)opts.push([c,r])}return opts.length?pick(opts):null}
const inb=(c,r)=>c>=0&&r>=0&&c<B.W&&r<B.H;
const ter=(c,r)=>B.map[r][c];
const unitAt=(c,r)=>B.units.find(u=>u.hp>0&&u.c===c&&u.r===r);
const cost=(mt,c,r)=>inb(c,r)?MOVE[mt][ter(c,r)][0]:99;
const defOf=(u,c,r)=>MOVE[u.mt][ter(c??u.c,r??u.r)][1];
const enemies=(a,b)=>(a.side===0)!==(b.side===0);
const tod=()=>TOD[(B.turn-1+B.sc.tod)%6];
function todMult(u){const t=tod()[2];return u.align==="lawful"?1+t/100:u.align==="chaotic"?1-t/100:1}
// zones of control: a hex next to an enemy (level 1+) ends your move
const zoc=(u,c,r)=>u.mt!=="fly"&&hex.nb(c,r).some(([a,b])=>{const o=unitAt(a,b);return o&&enemies(o,u)&&o.lv>0});
function reachOf(u){const budget=u.mv-u.moved;return hex.reach(u.c,u.r,budget,(c,r)=>{if(!inb(c,r))return Infinity;const o=unitAt(c,r);if(o&&enemies(o,u))return Infinity;const k=cost(u.mt,c,r);return k>=99?Infinity:k},(c,r)=>zoc(u,c,r))}
// ---------- combat maths (exact odds for the forecast)
function hitP(w,t,c,r){return w.magic?70:Math.max(10,100-defOf(t,c,r))}
function dmgOf(a,w,t,isAtk,charging){let d=w.dmg*todMult(a);if(charging)d*=2;return Math.max(1,Math.round(d))}
function counterWpn(d,aw){const ws=d.atk.filter(w=>w.rng===aw.rng);return ws.sort((x,y)=>y.dmg*y.str-x.dmg*x.str)[0]||null}
function strikeOrder(aw,dw){const seq=[];let na=aw.str,nd=dw?dw.str:0;const df=dw&&dw.first&&!aw.first;while(na||nd){if(df){if(nd){seq.push(1);nd--}if(na){seq.push(0);na--}}else{if(na){seq.push(0);na--}if(nd){seq.push(1);nd--}}}return seq}
function forecast(a,aw,d,from){const dw=counterWpn(d,aw),ch=aw.charge,pa=hitP(aw,d,d.c,d.r),pd=dw?hitP(dw,a,from[0],from[1]):0,da=dmgOf(a,aw,d,true,ch),dd=dw?dmgOf(d,dw,a,false,ch):0;
 let dist=new Map([[a.hp*1000+d.hp,1]]);const add=(m,k,p)=>m.set(k,(m.get(k)||0)+p);
 for(const s of strikeOrder(aw,dw)){const nx=new Map();for(const [k,p] of dist){const ha=Math.floor(k/1000),hd=k%1000;if(ha<=0||hd<=0){add(nx,k,p);continue}
  if(s===0){add(nx,ha*1000+Math.max(0,hd-da),p*pa/100);add(nx,k,p*(1-pa/100))}else{add(nx,Math.max(0,ha-dd)*1000+hd,p*pd/100);add(nx,k,p*(1-pd/100))}}dist=nx}
 let kill=0,die=0,ea=0,ed=0;for(const [k,p] of dist){const ha=Math.floor(k/1000),hd=k%1000;if(hd<=0)kill+=p;if(ha<=0)die+=p;ea+=ha*p;ed+=hd*p}
 return {dw,pa,pd,da,dd,kill,die,ea,ed}}
// ---------- turn flow
function newTurnFX(){banner(`Turn ${B.turn} · ${tod()[1]} ${tod()[0]}`);hudDraw()}
function startSideTurn(side){B.side=side;B.units.filter(u=>u.side===side&&u.hp>0).forEach(u=>{let h=0;const t=ter(u.c,u.r);if(t==="v")h=8;
  const healer=B.units.find(o=>o.hp>0&&o.heals&&!enemies(o,u)&&o!==u&&hex.dist([o.c,o.r],[u.c,u.r])===1);if(healer)h=Math.max(h,healer.lv>=2?8:4);if(u.resting)h+=2;

 else{const ready=B.units.filter(x=>x.side===0&&!x.attacked&&x.moved<x.mv).length;top=`<div style="padding:6px 2px;color:var(--mute);font-size:13px">${B.side===0?`${ready} unit${ready===1?"":"s"} can still act. Tap one to command it.`:"The enemy is moving…"}</div>`}
 const onKeep=lead&&ter(lead.c,lead.r)==="k";
 el.innerHTML=top+`<div class="btns"><button class="btn alt" id="rcB" ${B.side===0&&!B.busy?"":"disabled"}>${onKeep?"Recruit":"Recruit…"}</button><button class="btn alt" id="unB" ${B.undo?"":"disabled"}>Undo</button><button class="btn alt" id="nxB">Next</button><button class="btn" id="etB" ${B.side===0&&!B.busy?"":"disabled"}>End turn</button></div>`;
 $("rcB").onclick=recruitMenu;$("unB").onclick=undoMove;$("etB").onclick=()=>{const ready=B.units.filter(x=>x.side===0&&!x.attacked&&x.moved===0).length;if(ready>=3&&!confirm(`${ready} units haven't moved. End the turn anyway?`))return;endTurn()};
 $("nxB").onclick=()=>{const list=B.units.filter(x=>x.side===0&&!x.attacked&&x.moved<x.mv);if(!list.length){toast("Everyone has acted");return}const i=(list.indexOf(B.sel)+1)%list.length;B.sel=list[i];B.reach=reachOf(B.sel);centerOn(B.sel.c,B.sel.r);sheet()}}
function banner(t){const b=$("banner");if(!b)return;b.textContent=t;b.classList.add("on");clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove("on"),1300)}
function floatAt(c,r,t,col){if(B)B.fx.push({c,r,t,col,l:1.2})}
// ---------- camera and gestures (drag to pan, pinch to zoom, tap to act)
const cv=document.createElement("canvas");cv.id="cv";const g=cv.getContext("2d");let DPR=1;
const cam={x:0,y:0,z:1,fit(){const w=cv.clientWidth||360;cam.z=Math.max(.6,Math.min(1.5,w/(S*SQ3*8.2)))}};
function resize(){DPR=Math.min(2,devicePixelRatio||1);const r=cv.getBoundingClientRect();cv.width=Math.max(1,r.width*DPR);cv.height=Math.max(1,r.height*DPR)}
addEventListener("resize",()=>{if(B)resize()});
function centerOn(c,r){const [x,y]=hex.center(c,r,S);cam.x=x-cv.clientWidth/2/cam.z;cam.y=y-cv.clientHeight/2/cam.z;clampCam()}
function clampCam(){if(!B)return;const ww=S*SQ3*(B.W+.5),wh=S*1.5*B.H+S/2,vw=cv.clientWidth/cam.z,vh=cv.clientHeight/cam.z;const m=12/cam.z;cam.x=ww<=vw?(ww-vw)/2:Math.max(-m,Math.min(ww-vw+m,cam.x));cam.y=wh<=vh?(wh-vh)/2:Math.max(-m,Math.min(wh-vh+m,cam.y))}
function zoomBy(f,px,py){const w=cv.clientWidth,h=cv.clientHeight;px=px??w/2;py=py??h/2;const wx=cam.x+px/cam.z,wy=cam.y+py/cam.z;cam.z=Math.max(.5,Math.min(2.4,cam.z*f));cam.x=wx-px/cam.z;cam.y=wy-py/cam.z;clampCam()}
const P=new Map();let drag=null,pinch=null;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});if(P.size===1)drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};
 if(P.size===2){const [a,b]=[...P.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z};drag=null}});
cv.addEventListener("pointermove",e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&P.size===2){const [a,b]=[...P.values()],r=cv.getBoundingClientRect();const d=Math.hypot(a.x-b.x,a.y-b.y);zoomBy((pinch.z*d/pinch.d)/cam.z,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return}
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)drag.moved=true;if(drag.moved){cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;clampCam()}}
 else if(e.pointerType==="mouse"&&B){const r=cv.getBoundingClientRect();B.hover=hex.at(cam.x+(e.clientX-r.left)/cam.z,cam.y+(e.clientY-r.top)/cam.z,S)}});
const up=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);if(pinch){if(P.size<2)pinch=null;drag=null;return}
 if(drag&&!drag.moved){const r=cv.getBoundingClientRect();const [c,rr]=hex.at(cam.x+(e.clientX-r.left)/cam.z,cam.y+(e.clientY-r.top)/cam.z,S);tap(c,rr)}drag=null};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",e=>{P.delete(e.pointerId);drag=null;pinch=null});
cv.addEventListener("wheel",e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomBy(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});
// ---------- terrain art, drawn once per battle into an offscreen canvas (our own look, all in code)
let TERC=null;
const BASE={g:["#6a9a3e","#5f8f38"],f:["#4f7a30","#466e2a"],h:["#8a8a4a","#7c7c40"],m:["#7a7468","#6c665c"],w:["#2a5a8a","#244e7a"],s:["#5a8aa6","#4e7e9a"],v:["#6a9a3e","#5f8f38"],c:["#8a8478","#7c766a"],k:["#8a8478","#7c766a"],r:["#b09a6a","#a08a5c"],S:["#4e6a40","#455e38"]};
function buildTerrain(){const ww=Math.ceil(S*SQ3*(B.W+.5))+2,wh=Math.ceil(S*1.5*B.H+S/2)+2;TERC=document.createElement("canvas");TERC.width=ww*2;TERC.height=wh*2;const q=TERC.getContext("2d");q.scale(2,2);const R=MK.rng(B.sci*99+7);
 for(let r=0;r<B.H;r++)for(let c=0;c<B.W;c++){const t=ter(c,r),[x,y]=hex.center(c,r,S),pts=hex.corners(x,y,S+.6);q.save();q.beginPath();pts.forEach(([a,b],i)=>i?q.lineTo(a,b):q.moveTo(a,b));q.closePath();
  const gr=q.createLinearGradient(x,y-S,x,y+S);gr.addColorStop(0,BASE[t][0]);gr.addColorStop(1,BASE[t][1]);q.fillStyle=gr;q.fill();q.clip();
  for(let i=0;i<22;i++){q.fillStyle=R()<.5?"rgba(255,255,255,.06)":"rgba(0,0,0,.08)";q.fillRect(x-S+R()*S*2,y-S+R()*S*2,R()*4+1,R()*3+1)}
  if(t==="f")for(let i=0;i<4;i++){const tx=x+(i%2?10:-10)+(R()-.5)*6,ty=y+(i<2?-6:10)+(R()-.5)*4;q.fillStyle="#3a2a18";q.fillRect(tx-1.5,ty+2,3,6);q.fillStyle=R()<.5?"#2e5a26":"#356a2c";q.beginPath();q.moveTo(tx,ty-16);q.lineTo(tx-9,ty+4);q.lineTo(tx+9,ty+4);q.fill();q.fillStyle="rgba(255,255,255,.12)";q.beginPath();q.moveTo(tx,ty-16);q.lineTo(tx-3,ty-4);q.lineTo(tx+2,ty-6);q.fill()}
  if(t==="h")for(let i=0;i<2;i++){const hx=x+(i?10:-9),hy=y+(i?8:-2);q.fillStyle="#9a9a5a";q.beginPath();q.ellipse(hx,hy,16,10,0,Math.PI,0);q.fill();q.fillStyle="rgba(0,0,0,.18)";q.beginPath();q.ellipse(hx+4,hy,12,8,0,Math.PI*1.5,0);q.fill()}
  if(t==="m"){q.fillStyle="#5c564c";q.beginPath();q.moveTo(x-22,y+14);q.lineTo(x-4,y-20);q.lineTo(x+14,y+14);q.fill();q.fillStyle="#6e685c";q.beginPath();q.moveTo(x-2,y+16);q.lineTo(x+12,y-10);q.lineTo(x+24,y+16);q.fill();q.fillStyle="#eef";q.beginPath();q.moveTo(x-4,y-20);q.lineTo(x-10,y-8);q.lineTo(x+1,y-10);q.fill()}
  if(t==="w"||t==="s"){q.strokeStyle="rgba(200,230,255,.35)";for(let i=0;i<4;i++){const wy=y-12+i*8;q.beginPath();q.moveTo(x-14+(i%2)*6,wy);q.quadraticCurveTo(x-4,wy-4,x+6+(i%2)*4,wy);q.stroke()}if(t==="s"){q.fillStyle="#8a8070";for(let i=0;i<5;i++){q.beginPath();q.ellipse(x+(R()-.5)*30,y+(R()-.5)*24,4,2.5,0,0,7);q.fill()}}}
  if(t==="S"){q.strokeStyle="#7a8a4a";for(let i=0;i<8;i++){const sx=x+(R()-.5)*34,sy=y+(R()-.5)*26;q.beginPath();q.moveTo(sx,sy);q.lineTo(sx+(R()-.5)*4,sy-9);q.stroke()}q.fillStyle="rgba(40,70,60,.4)";q.beginPath();q.ellipse(x,y+6,14,6,0,0,7);q.fill()}
  if(t==="r"){q.fillStyle="rgba(120,100,60,.35)";for(let i=0;i<8;i++){q.beginPath();q.arc(x+(R()-.5)*30,y+(R()-.5)*26,1.5,0,7);q.fill()}}
  if(t==="c"||t==="k"){q.strokeStyle="rgba(0,0,0,.25)";for(let yy=y-S;yy<y+S;yy+=8){q.beginPath();q.moveTo(x-S,yy);q.lineTo(x+S,yy);q.stroke();for(let xx=x-S+((yy/8)%2?6:0);xx<x+S;xx+=12){q.beginPath();q.moveTo(xx,yy);q.lineTo(xx,yy+8);q.stroke()}}
   if(t==="k"){q.fillStyle="#6a645a";q.beginPath();q.arc(x,y+2,15,0,7);q.fill();q.fillStyle="#7c766a";q.beginPath();q.arc(x,y,13,0,7);q.fill();for(let i=0;i<8;i++){const a=i/8*Math.PI*2;q.fillStyle="#8e887a";q.fillRect(x+Math.cos(a)*13-2.5,y+Math.sin(a)*13-2.5,5,5)}}}
  if(t==="v"){for(let i=0;i<2;i++){const hx=x+(i?9:-8),hy=y+(i?7:-4);q.fillStyle="#d8c8a0";q.fillRect(hx-7,hy-4,14,10);q.fillStyle="#8a4a2a";q.beginPath();q.moveTo(hx-9,hy-4);q.lineTo(hx,hy-12);q.lineTo(hx+9,hy-4);q.fill();q.fillStyle="#3a2a18";q.fillRect(hx-2,hy+1,4,5)}}
  q.restore();q.strokeStyle="rgba(0,0,0,.18)";q.beginPath();hex.corners(x,y,S).forEach(([a,b],i)=>i?q.lineTo(a,b):q.moveTo(a,b));q.closePath();q.stroke()}}
function hexPath(c,r,inset){const [x,y]=hex.center(c,r,S);g.beginPath();hex.corners(x,y,S-(inset||0)).forEach(([a,b],i)=>i?g.lineTo(a,b):g.moveTo(a,b));g.closePath()}
function draw(){if(!B||!cv.isConnected||!TERC)return;if(cv.width!==Math.round(cv.getBoundingClientRect().width*DPR))resize();
 g.setTransform(1,0,0,1,0,0);g.fillStyle="#0b0e14";g.fillRect(0,0,cv.width,cv.height);g.setTransform(DPR*cam.z,0,0,DPR*cam.z,-cam.x*DPR*cam.z,-cam.y*DPR*cam.z);g.imageSmoothingEnabled=true;
 g.drawImage(TERC,0,0,TERC.width/2,TERC.height/2);
 // night tint
 const tl=tod()[2];if(tl<0){g.fillStyle="rgba(20,30,80,.28)";g.fillRect(0,0,TERC.width/2,TERC.height/2)}else if(tod()[0]==="Dusk"||tod()[0]==="Dawn"){g.fillStyle="rgba(120,60,20,.12)";g.fillRect(0,0,TERC.width/2,TERC.height/2)}
 // village flags
 for(const k in B.vill){const [c,r]=k.split(",").map(Number),[x,y]=hex.center(c,r,S);g.fillStyle="#3a2a18";g.fillRect(x+13,y-22,2,16);g.fillStyle=SIDES[B.vill[k]].c;g.fillRect(x+15,y-22,10,7)}
 // move range, attack targets, castle spots
 if(B.reach&&B.sel){for(const [k] of B.reach.cost){const [c,r]=k.split(",").map(Number);if(c===B.sel.c&&r===B.sel.r)continue;hexPath(c,r,2);g.fillStyle="rgba(90,150,255,.28)";g.fill()}}
 if(B.sel&&!B.sel.attacked){B.units.forEach(o=>{if(o.side===0)return;const can=hex.dist([o.c,o.r],[B.sel.c,B.sel.r])===1||hex.nb(o.c,o.r).some(([a,b])=>B.reach&&B.reach.cost.has(a+","+b)&&!unitAt(a,b));if(can){hexPath(o.c,o.r,3);g.strokeStyle="#ff5a3a";g.lineWidth=3;g.stroke();g.lineWidth=1}})}
 if(B.place){B.place.cells.forEach(([c,r])=>{hexPath(c,r,3);g.fillStyle="rgba(236,198,110,.35)";g.fill();g.strokeStyle="#ecc66e";g.lineWidth=2;g.stroke();g.lineWidth=1})}
 if(B.fc){hexPath(B.fc.from[0],B.fc.from[1],3);g.strokeStyle="#ecc66e";g.lineWidth=3;g.stroke();hexPath(B.fc.d.c,B.fc.d.r,3);g.strokeStyle="#ff5a3a";g.stroke();g.lineWidth=1}
 if(B.sel){hexPath(B.sel.c,B.sel.r,2);g.strokeStyle="#fff";g.lineWidth=2.5;g.stroke();g.lineWidth=1}
 if(B.hover&&inb(...B.hover)){hexPath(B.hover[0],B.hover[1],1);g.strokeStyle="rgba(255,255,255,.4)";g.stroke()}
 // units
 B.units.slice().sort((a,b)=>a.r-b.r).forEach(u=>{let [x,y]=hex.center(u.c,u.r,S);if(u.lunge){const [tx,ty]=hex.center(u.lunge.to[0],u.lunge.to[1],S);const k=Math.sin(u.lunge.t*Math.PI)*.3;x+=(tx-x)*k;y+=(ty-y)*k;u.lunge.t-=.08;if(u.lunge.t<=0)u.lunge=null}
  const side=u.side,col=SIDES[side].c;g.fillStyle="rgba(0,0,0,.3)";g.beginPath();g.ellipse(x,y+14,16,5,0,0,7);g.fill();
  const can=side===0&&B.side===0&&!u.attacked&&u.moved<u.mv;g.strokeStyle=can?(u.moved?"#e0c040":"#6fdf5a"):col;g.lineWidth=2.5;g.beginPath();g.ellipse(x,y+14,15,5,0,0,7);g.stroke();g.lineWidth=1;
  MK.sprite(g,uspr(u),side===2?2:side,x,y+19,u.lv>=3?.82:.74,side!==0,u.dying?.5:1);
  if(u.flash){g.globalAlpha=u.flash*.5;g.fillStyle="#fff";g.beginPath();g.arc(x,y,14,0,7);g.fill();g.globalAlpha=1;u.flash=Math.max(0,u.flash-.08)}
  const bw=26,hf=u.hp/u.max;g.fillStyle="#000";g.fillRect(x-bw/2-1,y+19,bw+2,5);g.fillStyle=hf>.5?"#5fbf4a":hf>.25?"#e0b030":"#e2584a";g.fillRect(x-bw/2,y+20,bw*hf,3);
  g.fillStyle="#8c7ae6";g.fillRect(x-bw/2,y+23,bw*Math.min(1,u.xp/u.maxxp),1.5);
  if(u.leader){g.fillStyle="#ecc66e";g.beginPath();g.moveTo(x-7,y-26);g.lineTo(x-7,y-20);g.lineTo(x+7,y-20);g.lineTo(x+7,y-26);g.lineTo(x+3.5,y-22);g.lineTo(x,y-27);g.lineTo(x-3.5,y-22);g.closePath();g.fill()}
  if(u.lv>=2&&!u.leader){g.fillStyle="#ecc66e";g.font="900 9px system-ui";g.textAlign="left";g.fillText("★".repeat(u.lv-1),x+9,y-16)}});
 B.fx=B.fx.filter(f=>f.l>0);B.fx.forEach(f=>{f.l-=.018;const [x,y]=hex.center(f.c,f.r,S);g.font="900 14px system-ui";g.textAlign="center";g.fillStyle="#000";g.fillText(f.t,x+1,y-20-(1.2-f.l)*22+1);g.fillStyle=f.col;g.fillText(f.t,x,y-20-(1.2-f.l)*22)})}
MK.loop(null,draw);
MK.preload(["lieut","spear","bow","horse","mage","hvy","fencer","thunder","efight","grunt","gob","wolf","oarch","skel","adept"].map(id=>unit(id).spr));
title();
</script></body></html>
