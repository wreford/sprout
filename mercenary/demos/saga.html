<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mercenary Saga · Mercenary Keep</title><link rel="stylesheet" href="mk.css?v=202611152047">
<style>
#app{max-width:1120px;margin:0 auto;padding:10px}
.hud{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 12px;margin-bottom:10px}.hud b{color:var(--gold2)}.hud .rel{display:flex;gap:4px}.hud .rel img{width:26px;height:26px;image-rendering:pixelated;background:#0b0f18;border-radius:5px;border:1px solid var(--line)}
.party{display:flex;gap:6px;flex-wrap:wrap}
.mc{display:grid;grid-template-columns:48px 1fr;gap:6px;align-items:center;padding:5px 8px 5px 4px;border-radius:8px;background:var(--card);border:1px solid var(--line);min-width:150px;font-size:12px}
.mc img{width:48px;height:48px;object-fit:contain}.mc b{font-size:13px;color:var(--ink)}.mc small{color:var(--mute)}.mc .hpb{margin-top:3px}.mc.cap{border-color:var(--gold)}
.xpb{height:4px;background:#1a1a2a;border-radius:3px;overflow:hidden;margin-top:2px}.xpb i{display:block;height:100%;background:#8c7ae6}
/* run map */
.map{padding:14px 8px 22px;display:flex;flex-direction:column-reverse;gap:26px}
.row{display:flex;justify-content:center;gap:clamp(10px,4vw,40px);align-items:center}.row .fl{width:50px;flex:none;font:700 11px system-ui;color:var(--mute);text-align:right}
.nd{width:64px;height:64px;border-radius:50%;border:2px solid #3a3a4a;background:#121826;display:flex;align-items:center;justify-content:center;position:relative;padding:0;opacity:.45}
.nd img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated}.nd.done{opacity:.25}.nd.at{opacity:1;border-color:var(--gold2)}
.nd.can{opacity:1;border-color:var(--gold);box-shadow:0 0 12px rgba(236,198,110,.45);animation:pul 1.4s infinite}@keyframes pul{50%{box-shadow:0 0 22px rgba(236,198,110,.75)}}
.nd small{position:absolute;bottom:-15px;font:700 10px system-ui;color:var(--mute);white-space:nowrap}
.legend{font-size:12px;color:var(--mute);text-align:center;margin-top:8px}
/* battle */
.bt{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
#cv{width:100%;display:block;border-radius:8px;border:1px solid var(--line);touch-action:manipulation;cursor:pointer}
.panel{padding:10px 12px}.panel h3{margin:0 0 6px;font-size:16px}.tip{font-size:13px;color:var(--mute);line-height:1.4}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fc{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 8px;font-size:13px;text-align:center;margin:6px 0}.fc b{color:var(--gold2)}
.ch{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.pick{width:170px;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.pick img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}.pick b{font-size:14px;color:var(--gold2)}.pick:hover:not(:disabled){border-color:var(--gold2)}.pick:disabled{opacity:.4}
.title{text-align:center;padding:24px 16px}.title img{height:120px;image-rendering:pixelated}
.title ul{text-align:left;display:inline-block;color:var(--mute);font-size:14px;line-height:1.6;margin:8px 0 16px}
@media (max-width:820px){.bt{grid-template-columns:1fr}.mc{min-width:0;flex:1 1 140px}}
@media (max-width:560px){.nd{width:54px;height:54px}.nd img{width:34px;height:34px}.row .fl{width:40px;font-size:10px}.row .fl:last-child{display:none}.mc{grid-template-columns:36px 1fr;font-size:11px}.mc img{width:36px;height:36px}}
</style></head><body>
<div id="app"></div>
<script src="roster.js?v=202611152047"></script><script src="mk.js?v=202611152047"></script><script src="engine.js?v=202611152047"></script>
<script>
"use strict";
// Mercenary Saga: the best of each demo in one run.
// Gauntlet's branching run map and relics, the Ballad's levelling party, Ford of Ashes' grid battles,
// the Ledger's holdings that pay out while you march, March of Banners' company roster, and the dragon at the end.
const {$,IMG,unit,pick,ri,shuffle,sfx,ls,toast,modal,closeModal,sprImg,grid}=MK;
MK.topbar("saga");
const W=10,H=8,T=56,FLOORS=9;
// ---- mercenaries: stats come straight from the shared roster
const FAST=new Set(["horse","cav","wolf","wolf2","gryph","gryphon2","glider","sky","m_gwolf","m_dwolf","boar","m_falcon","m_efalcon","m_roc"]);
function mkMerc(id,lv,side){const r=unit(id),magic=r.ab.includes("magic"),m={uid:Math.random().toString(36).slice(2,8),id,lv:1,xp:0,side:side||0,promo:false,
 max:Math.round(12+r.hp*1.1+r.tier*2),atk:Math.round(r.dmg*1.6+r.str+r.tier*1.5),def:Math.floor(r.tier/2)+(r.ab.includes("phalanx")?1:0),
 mov:FAST.has(id)?5:4,rng:r.t==="r"?(magic?[1,2]:[2,2]):[1,1],magic,heal:r.ab.includes("heals")};m.hp=m.max;for(let i=1;i<(lv||1);i++)lvUp(m,true);return m}
const nm=m=>m.promo&&unit(m.id).n2?unit(m.id).n2:unit(m.id).n;
const spr=m=>m.promo&&unit(m.id).spr2?unit(m.id).spr2:unit(m.id).spr;
function lvUp(m,quiet){m.lv++;m.max+=3;m.hp+=3;m.atk+=1;if(m.lv%3===0)m.def++;if(m.lv===4&&!m.promo&&unit(m.id).n2){m.promo=true;m.max+=6;m.hp+=6;m.atk+=2;m.def++;return "promoted to "+unit(m.id).n2}return quiet?"":"reached level "+m.lv}
const xpNeed=m=>MK.combat.xpToLevel(m.lv);
// ---- relics (the Gauntlet's), each a small rule change
const RELICS={whet:{n:"Whetstone",i:"icons/crossed_sword_and_hammer.png",d:"+2 attack for the whole company."},boots:{n:"Road Boots",i:"icons/boots_elven.png",d:"+1 move for everyone."},
 kit:{n:"Surgeon's Kit",i:"icons/herb-bag.png",d:"Everyone heals 4 at the start of your turn."},banner:{n:"War Banner",i:"misc/flag-red.png",d:"+10 to hit."},
 ledger:{n:"Ledger of Debts",i:"icons/scroll_red.png",d:"+40% gold from battles and holdings."},phoenix:{n:"Phoenix Ring",i:"icons/ring_gold.png",d:"The first merc to fall in each battle stands back up with 1 HP."},
 rations:{n:"Iron Rations",i:"icons/letter_and_ale.png",d:"Camp heals everyone fully."},contract:{n:"Sealed Contract",i:"icons/book2.png",d:"Hiring costs a third less."},
 tower:{n:"Tower Shield",i:"icons/shield_tower.png",d:"+1 defence for everyone."},ankh:{n:"Ankh of Ages",i:"icons/ankh_necklace.png",d:"+50% XP."}};
const has=k=>S.relics.includes(k);
// ---- foes by floor
const FOES=[["gob","wolf2","rat","corpse","skel","spider"],["grunt","oarch","skel","adept","wolf","whelp","thief"],["assn","twar","ghoul","choco","bear","burner","clash","slayer"],["twar","blade","dfighter","flare","gryphon2","shade","m_ogre","lobber"]];
const BOSSES=["warlord","lich","m_ogre","inferno","yeti","m_croc"];
// ---- run state
let S=null;
const fresh=()=>({floor:-1,col:1,gold:60,party:[Object.assign(mkMerc("lieut",2),{cap:true}),mkMerc("spear"),mkMerc("bow"),mkMerc("white")],relics:[],hold:0,map:mkMap(),seed:Math.random()*1e9|0,kills:0,lost:[]});
function mkMap(){const T=["fight","fight","fight","camp","market","chest","event","elite"];const m=[];for(let f=0;f<FLOORS;f++){
 if(f===FLOORS-1){m.push([null,"boss",null]);continue}
 let row=[0,1,2].map(()=>pick(f<1?["fight"]:f===4?["market","camp"]:T));if(f===FLOORS-2)row=["camp","market","camp"];if(f>=2&&!row.includes("elite")&&Math.random()<.5)row[ri(0,2)]="elite";m.push(row)}return m}
const save=()=>ls.set("mk.saga",S);
const ICO={fight:["units/human-loyalists/spearman.png","Battle"],elite:[unit("warlord").spr,"Elite"],camp:["items/brazier.png","Camp"],market:["items/gold-coins-large.png","Market"],chest:["items/chest-plain-closed.png","Cache"],event:["items/altar.png","Event"],boss:[unit("m_fdragon").spr,"Dragon"]};
// ---- screens
function hud(){return `<div class="hud frame"><span>Floor <b>${Math.max(1,S.floor+1)}</b>/${FLOORS}</span><span>Gold <b>${S.gold}</b></span>${S.hold?`<span title="Holdings pay out every march">Holdings <b>${S.hold}</b> (+${income()}/march)</span>`:""}<span class="rel">${S.relics.map(k=>`<img src="${IMG(RELICS[k].i)}" title="${RELICS[k].n}: ${RELICS[k].d}" alt="">`).join("")}</span></div>`}
const income=()=>Math.round(S.hold*8*(has("ledger")?1.4:1));
function partyHTML(){return `<div class="party">${S.party.map(m=>`<div class="mc ${m.cap?"cap":""}">${sprImg(spr(m),0)}<div><b>${nm(m)}</b> <small>Lv ${m.lv}${m.cap?" · captain":""}</small><div class="hpb ally"><i style="width:${100*m.hp/m.max}%"></i></div><small>${m.hp}/${m.max} HP · ${m.atk} atk · ${m.def} def</small><div class="xpb"><i style="width:${100*m.xp/xpNeed(m)}%"></i></div></div></div>`).join("")}</div>`}
function title(){const sv=ls.get("mk.saga",null),best=ls.get("mk.sagaBest",{wins:0,floor:0});MK.playMusic("heroes_rite",.3);
 $("app").innerHTML=`<div class="title frame"><img src="${IMG(unit("m_fdragon").spr)}" alt=""><h1>Mercenary Saga</h1><p style="color:var(--mute)">Lead a company up nine floors of the old road to the dragon at the top.</p>
 <ul><li>Pick your path on the <b>run map</b>: battles, camps, markets, caches and strange shrines.</li><li>Fight on a <b>grid</b>: forests and hills shelter you, villages heal.</li><li>Your mercs <b>level up</b> and keep their wounds between fights. Fallen mercs are gone for good.</li><li>Win elite fights to take <b>holdings</b> that pay gold every march, and collect <b>relics</b>.</li><li>If your captain falls, the saga ends.</li></ul><br>
 ${sv&&sv.floor>=0?`<button class="btn" id="cont">Continue (floor ${sv.floor+1})</button> `:""}<button class="btn ${sv&&sv.floor>=0?"alt":""}" id="new">New saga</button><p style="color:var(--mute);font-size:13px;margin-top:12px">Wins ${best.wins} · best floor ${best.floor}</p></div>`;
 $("new").onclick=()=>{S=fresh();save();showMap()};if($("cont"))$("cont").onclick=()=>{S=sv;showMap()}}
function canGo(f,c){if(f!==S.floor+1)return false;if(!S.map[f][c])return false;return S.floor<0||Math.abs(c-S.col)<=1||S.map[f].filter(Boolean).length===1}
function showMap(){MK.playMusic("wanderer",.3);save();
 $("app").innerHTML=hud()+`<div class="frame" style="padding:10px;margin-bottom:10px">${partyHTML()}</div><div class="map frame">${S.map.map((row,f)=>`<div class="row"><span class="fl">${f===FLOORS-1?"Summit":"Floor "+(f+1)}</span>${row.map((t,c)=>t?`<button class="nd ${f<=S.floor?(f===S.floor&&c===S.col?"at":"done"):canGo(f,c)?"can":""}" data-f="${f}" data-c="${c}" ${canGo(f,c)?"":"disabled"}><img src="${IMG(ICO[t][0])}" alt=""><small>${ICO[t][1]}</small></button>`:`<span style="width:64px"></span>`).join("")}<span class="fl"></span></div>`).join("")}</div><div class="legend">Tap a glowing node. You can step to the node above or either side of it.</div>`;
 document.querySelectorAll(".nd.can").forEach(b=>b.onclick=()=>enter(+b.dataset.f,+b.dataset.c));
 const can=document.querySelector(".nd.can");if(can)can.scrollIntoView({block:"center",behavior:"smooth"})}
function enter(f,c){S.floor=f;S.col=c;if(S.hold){const g=income();S.gold+=g;toast(`Holdings pay ${g} gold`);sfx("gold",.4)}save();const t=S.map[f][c];
 if(t==="fight"||t==="elite"||t==="boss")battle(t);else if(t==="camp")camp();else if(t==="market")market();else if(t==="chest")cache();else event()}
// ---- non-battle nodes
function camp(){MK.playMusic("silvan_sanctuary",.3);const full=has("rations");
 modal(`<img src="${IMG("items/brazier.png")}" alt="" style="height:70px;image-rendering:pixelated"><h2>Camp</h2><p>The company makes camp. Choose one.</p><div class="ch">
 <button class="pick" id="cr"><img src="${IMG("icons/potion_red_medium.png")}" alt=""><b>Rest</b>Everyone heals ${full?"fully":"half their HP"}.</button>
 <button class="pick" id="cd"><img src="${IMG("icons/book2.png")}" alt=""><b>Drill</b>Everyone gains 12 XP.</button></div>`);
 $("cr").onclick=()=>{S.party.forEach(m=>m.hp=full?m.max:Math.min(m.max,m.hp+Math.ceil(m.max/2)));sfx("heal",.5);closeModal();showMap()};
 $("cd").onclick=()=>{const ups=[];S.party.forEach(m=>gainXP(m,12,ups));closeModal();ups.length?levelNote(ups,showMap):showMap()}}
function gainXP(m,n,ups){m.xp+=Math.round(n*(has("ankh")?1.5:1));while(m.xp>=xpNeed(m)){m.xp-=xpNeed(m);const t=lvUp(m);ups.push(nm(m)+" "+t)}}
function levelNote(ups,next){sfx("fanfare-short",.5);modal(`<h2>Level up!</h2><p>${ups.join("<br>")}</p><button class="btn" id="ok">On we go</button>`);$("ok").onclick=()=>{closeModal();next()}}
const hireCost=id=>Math.round((25+unit(id).tier*18)*(has("contract")?.67:1));
function market(){MK.playMusic("traveling_minstrels",.3);const pool=shuffle(ROSTER.filter(r=>["loyal","rebel","knalgan"].includes(r.fac)&&r.tier<=Math.min(4,2+Math.floor(S.floor/3))&&r.id!=="lieut")).slice(0,3);
 const rel=pick(Object.keys(RELICS).filter(k=>!has(k)));const relCost=80+S.floor*5;let bought={};
 const draw=()=>{modal(`<h2>Market</h2><p>Gold: <b style="color:var(--gold2)">${S.gold}</b> · company ${S.party.length}/6</p><div class="ch">${pool.map(r=>`<button class="pick" data-h="${r.id}" ${bought[r.id]||S.gold<hireCost(r.id)||S.party.length>=6?"disabled":""}>${sprImg(r.spr,0)}<b>${r.n}</b>${r.t==="r"?"Ranged":"Melee"} · tier ${r.tier}<br>${bought[r.id]?"Hired":hireCost(r.id)+" gold"}</button>`).join("")}</div>
  <div class="ch">${rel?`<button class="pick" id="br" ${bought.rel||S.gold<relCost?"disabled":""}><img src="${IMG(RELICS[rel].i)}" alt=""><b>${RELICS[rel].n}</b>${RELICS[rel].d}<br>${bought.rel?"Bought":relCost+" gold"}</button>`:""}
  <button class="pick" id="bh" ${bought.heal||S.gold<25?"disabled":""}><img src="${IMG("icons/potion_red_medium.png")}" alt=""><b>Healer's tent</b>Heal everyone fully.<br>${bought.heal?"Done":"25 gold"}</button></div><button class="btn" id="lv">Leave</button>`);
  document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{const id=b.dataset.h;S.gold-=hireCost(id);S.party.push(mkMerc(id,Math.max(1,S.floor)));bought[id]=1;sfx("gold",.5);draw()});
  if($("br"))$("br").onclick=()=>{S.gold-=relCost;S.relics.push(rel);bought.rel=1;sfx("gold",.5);draw()};
  $("bh").onclick=()=>{S.gold-=25;S.party.forEach(m=>m.hp=m.max);bought.heal=1;sfx("heal",.5);draw()};$("lv").onclick=()=>{closeModal();showMap()}};draw()}
function relicPick(next,n){const opts=shuffle(Object.keys(RELICS).filter(k=>!has(k))).slice(0,n||3);if(!opts.length){next();return}
 modal(`<h2>Choose a relic</h2><div class="ch">${opts.map(k=>`<button class="pick" data-r="${k}"><img src="${IMG(RELICS[k].i)}" alt=""><b>${RELICS[k].n}</b>${RELICS[k].d}</button>`).join("")}</div>`);
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.relics.push(b.dataset.r);sfx("open-chest",.5);closeModal();next()})}
function cache(){sfx("open-chest",.6);const g=ri(30,55)+S.floor*4;S.gold+=g;modal(`<img src="${IMG("items/chest-plain-open.png")}" alt="" style="height:70px;image-rendering:pixelated"><h2>A forgotten cache</h2><p>${g} gold, and something else inside.</p><button class="btn" id="ok">Look</button>`);$("ok").onclick=()=>{closeModal();relicPick(showMap,2)}}
function event(){const E=[
 ["A wandering bard","She offers to sing of your deeds, for a price.",[["Pay 30 gold: +20 XP to all",()=>S.gold>=30,()=>{S.gold-=30;const u=[];S.party.forEach(m=>gainXP(m,20,u));return u}],["Send her off",()=>true,()=>[]]]],
 ["A shrine to old gods","Blood on the altar buys favour.",[["Captain loses 10 HP: gain a relic",()=>true,()=>{const c=S.party.find(m=>m.cap);c.hp=Math.max(1,c.hp-10);return "relic"}],["Pray quietly (+8 HP all)",()=>true,()=>{S.party.forEach(m=>m.hp=Math.min(m.max,m.hp+8));return []}]]],
 ["Deserters on the road","Three soldiers want to join a winning side.",[["Take one on (free)",()=>S.party.length<6,()=>{S.party.push(mkMerc(pick(["fencer","hvy","thunder","efight","earch"]),Math.max(1,S.floor)));return []}],["Rob them (+40 gold)",()=>true,()=>{S.gold+=40;return []}]]],
 ["A merchant's wagon, overturned","Nobody is around.",[["Take the gold (+60)",()=>true,()=>{S.gold+=60;return []}],["Right the wagon and wait (+1 holding)",()=>true,()=>{S.hold++;return []}]]]];
 const e=pick(E);modal(`<img src="${IMG("items/altar.png")}" alt="" style="height:70px;image-rendering:pixelated"><h2>${e[0]}</h2><p>${e[1]}</p><div class="ch">${e[2].map((o,i)=>`<button class="btn ${i?"alt":""}" data-o="${i}" ${o[1]()?"":"disabled"}>${o[0]}</button>`).join("")}</div>`);
 document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const r=e[2][+b.dataset.o][2]();closeModal();if(r==="relic")relicPick(showMap,3);else if(r.length)levelNote(r,showMap);else showMap()})}
// ---- grid battles
const TER={g:{n:"Grass",i:"terrain/grass/green.png",mv:1,av:0,df:0},f:{n:"Forest",i:"terrain/grass/green.png",o:"terrain/forest/pine.png",mv:2,av:20,df:0},h:{n:"Hills",i:"terrain/hills/regular.png",mv:2,av:15,df:1},
 v:{n:"Village",i:"terrain/grass/green.png",o:"terrain/village/human.png",mv:1,av:10,df:1,heal:6},w:{n:"Water",mv:Infinity,av:0,df:0},d:{n:"Dry grass",i:"terrain/grass/dry.png",mv:1,av:0,df:0}};
let G=null;const cv=document.createElement("canvas"),g=MK.canvas(cv,W*T,H*T);
function genMap(seed){const R=MK.rng(seed);for(let tries=0;tries<40;tries++){const m=[];for(let y=0;y<H;y++){m.push([]);for(let x=0;x<W;x++)m[y].push(R()<.25?"d":"g")}
 const blob=(ch,n,x0,x1)=>{let x=R.int(x0,x1),y=R.int(1,H-2);for(let i=0;i<n;i++){m[y][x]=ch;x=Math.max(x0,Math.min(x1,x+R.int(-1,1)));y=Math.max(0,Math.min(H-1,y+R.int(-1,1)))}};
 for(let i=0;i<4;i++)blob("f",R.int(2,5),1,8);for(let i=0;i<2;i++)blob("h",R.int(2,4),2,7);blob("w",R.int(2,5),3,6);if(R()<.5)blob("w",R.int(2,3),3,6);
 for(let i=0;i<2;i++){const x=R.int(3,6),y=R.int(0,H-1);m[y][x]="v"}
 for(let y=1;y<H-1;y++){m[y][0]=m[y][0]==="w"?"g":m[y][0];m[y][1]=m[y][1]==="w"?"g":m[y][1];m[y][W-1]=m[y][W-1]==="w"?"g":m[y][W-1];m[y][W-2]=m[y][W-2]==="w"?"g":m[y][W-2]}
 const cost=(x,y)=>grid.inb(W,H,x,y)?TER[m[y][x]].mv:Infinity;if(grid.path(0,3,W-1,4,cost).length&&grid.path(1,1,W-2,6,cost).length)return m}
 return Array.from({length:H},()=>Array(W).fill("g"))}
const ter=(x,y)=>TER[G.map[y][x]];
const at=(x,y)=>G.units.find(u=>u.hp>0&&u.x===x&&u.y===y);
const inb=(x,y)=>grid.inb(W,H,x,y);
const st=u=>({atk:u.atk+(u.side===0&&has("whet")?2:0),def:u.def+(u.side===0&&has("tower")?1:0),mov:u.mov+(u.side===0&&has("boots")?1:0)});
const stepCost=u=>(x,y)=>{if(!inb(x,y))return Infinity;const o=at(x,y);if(o&&o.side!==u.side)return Infinity;return ter(x,y).mv};
function reach(u){const R=grid.reach(u.x,u.y,st(u).mov,stepCost(u));for(const k of [...R.keys()]){const [x,y]=grid.unkey(k),o=at(x,y);if(o&&o!==u)R.delete(k)}return R}
const inRange=(a,from,b)=>{const d=Math.abs(from.x-b.x)+Math.abs(from.y-b.y);return d>=a.rng[0]&&d<=a.rng[1]};
function hitP(a,d){return a.magic?75:MK.combat.hit(85+(a.side===0&&has("banner")?10:0),ter(d.x,d.y).av)}
function dmgOf(a,d){return Math.max(1,st(a).atk-st(d).def-ter(d.x,d.y).df)}
function forecast(a,from,d){const ca=inRange(d,from,a);return{ad:dmgOf(a,d),ah:hitP(a,d),bd:ca?dmgOf(d,a):0,bh:ca?hitP(d,a):0,counter:ca}}
function battle(kind){const f=S.floor,pool=FOES[Math.min(3,Math.floor(f/2))],n=Math.min(7,3+Math.floor(f/2.5)+(kind==="elite"?1:0)),lv=1+Math.floor(f*.6);
 G={kind,map:genMap(S.seed+f*977+S.col),units:[],turn:1,phase:"player",sel:null,reach:null,mode:null,pend:null,fx:[],busy:false,over:false,phoenix:has("phoenix"),kills:{}};
 const spots=[[1,3],[1,4],[0,2],[0,5],[1,2],[1,5],[0,3],[0,4],[1,1],[1,6]];
 S.party.forEach((m,i)=>{const [x,y]=spots[i];m.x=x;m.y=y;m.acted=false;m.ox=0;m.oy=0;G.units.push(m)});
 const es=[[8,3],[8,4],[9,2],[9,5],[8,2],[8,5],[9,3],[9,4],[8,1],[8,6]];
 const foes=[];for(let i=0;i<n;i++)foes.push(mkMerc(pick(pool),lv,1));
 if(kind==="elite")foes[0]=Object.assign(mkMerc(pick(BOSSES),lv+1,1),{elite:true});
 if(kind==="boss"){foes.length=0;foes.push(Object.assign(mkMerc("m_fdragon",lv+2,1),{boss:true}));["burner","clash","dfighter","flare","glider"].forEach(id=>foes.push(mkMerc(id,lv,1)));const d=foes[0];d.max=d.hp=d.max*2+40;d.atk+=4;d.rng=[1,2]}
 foes.forEach((e,i)=>{const [x,y]=es[i];e.x=x;e.y=y;e.ox=0;e.oy=0;if(G.map[y][x]==="w")G.map[y][x]="g";e.ai=e.boss||e.elite?"hold":"go";G.units.push(e)});
 G.units.forEach(u=>{if(G.map[u.y][u.x]==="w")G.map[u.y][u.x]="g"});
 MK.playMusic(kind==="boss"?"the_dangerous_symphony":kind==="elite"?"battle-epic":"battle",.32);
 $("app").innerHTML=hud()+`<div class="bt"><div id="cvw"></div><div id="side"><div class="panel frame" id="info"></div><div class="panel frame" id="act"></div><div class="panel frame"><h3>Turn <span id="tn">1</span></h3><div class="tip">Tap a blue merc, then a blue tile to move. Tap a red enemy to see the odds, tap again to strike. Forests and hills protect, villages heal. Defeat every foe${kind==="boss"?" (or just the dragon)":""}. Keep your captain alive.</div><div class="acts"><button class="btn" id="endB">End turn</button><button class="btn alt" id="flee">Retreat</button></div></div></div></div>`;
 $("cvw").appendChild(cv);cv.id="cv";$("endB").onclick=()=>{if(G.phase==="player"&&!G.busy)endTurn()};
 $("flee").onclick=()=>{if(G.busy||G.over)return;if(kind==="boss"){toast("There is no retreat from the dragon");return}if(confirm("Retreat? Everyone escapes but the party loses 30% HP and you gain nothing.")){S.party.forEach(m=>m.hp=Math.max(1,Math.round(m.hp*.7)));G.over=true;showMap()}};
 startPlayerTurn();info();acts();scrollTo(0,0)}
function startPlayerTurn(){G.phase="player";G.units.forEach(u=>{if(u.side===0&&u.hp>0){u.acted=false;let h=0;if(ter(u.x,u.y).heal)h+=ter(u.x,u.y).heal;if(has("kit"))h+=4;
  if(G.units.some(o=>o.side===0&&o.hp>0&&o.heal&&o!==u&&grid.md(o,u)===1))h+=8;if(h&&u.hp<u.max&&G.turn>1){const v=Math.min(h,u.max-u.hp);u.hp+=v;G.fx.push({x:u.x,y:u.y,t:"+"+v,c:"#8be08b",l:1.2})}}})}
// ---- input
cv.addEventListener("pointermove",e=>{if(!G)return;const r=cv.getBoundingClientRect();G.hover=[Math.floor((e.clientX-r.left)/r.width*W),Math.floor((e.clientY-r.top)/r.height*H)]});
cv.addEventListener("click",e=>{if(!G||G.busy||G.over||G.phase!=="player")return;const r=cv.getBoundingClientRect();click(Math.floor((e.clientX-r.left)/r.width*W),Math.floor((e.clientY-r.top)/r.height*H))});
async function click(x,y){const o=at(x,y),S_=G.sel;
 if(G.mode==="act"){if(o&&o.side===1&&inRange(S_,S_,o)){if(G.pend===o){await attack(S_,o);done(S_)}else{G.pend=o;info(o)}return}
  if(o&&o.side===0&&S_.heal&&o!==S_&&grid.md(S_,o)===1&&o.hp<o.max){const v=Math.min(10+S_.lv,o.max-o.hp);o.hp+=v;G.fx.push({x:o.x,y:o.y,t:"+"+v,c:"#8be08b",l:1.2});sfx("heal",.5);gainXP(S_,4,G.ups||(G.ups=[]));done(S_);return}
  if(o===S_){done(S_);return}return}
 if(o&&o.side===0&&!o.acted){G.sel=o;G.reach=reach(o);G.mode="move";G.pend=null;sfx("sword-1",.08);info(o);acts();return}
 if(S_&&G.mode==="move"){
  if(o&&o.side===1){const k=[...G.reach.keys()].map(grid.unkey).filter(([rx,ry])=>{const d=Math.abs(rx-x)+Math.abs(ry-y);return d>=S_.rng[0]&&d<=S_.rng[1]&&(!at(rx,ry)||at(rx,ry)===S_)});
   if(!k.length){info(o);return}k.sort((a,b)=>ter(b[0],b[1]).av-ter(a[0],a[1]).av||(G.reach.get(grid.key(...a))-G.reach.get(grid.key(...b))));
   if(G.pend===o){await moveTo(S_,k[0][0],k[0][1]);await attack(S_,o);done(S_)}else{G.pend=o;info(o,{x:k[0][0],y:k[0][1]})}return}
  if(G.reach.has(grid.key(x,y))&&!o){G.pend=null;await moveTo(S_,x,y);G.mode="act";G.reach=null;G.from=null;const any=G.units.some(u=>u.hp>0&&u.side===1&&inRange(S_,S_,u))||(S_.heal&&G.units.some(u=>u.side===0&&u.hp>0&&u!==S_&&grid.md(u,S_)===1&&u.hp<u.max));if(!any)done(S_);else{info(S_);acts()}return}}
 G.sel=null;G.reach=null;G.mode=null;G.pend=null;info();acts()}
async function moveTo(u,x,y){const p=grid.path(u.x,u.y,x,y,stepCost(u),null,st(u).mov+.5);G.busy=true;for(const [px,py] of p){u.x=px;u.y=py;await MK.wait(65)}G.busy=false}
function done(u){u.acted=true;G.sel=null;G.reach=null;G.mode=null;G.pend=null;info();acts();if(!G.over&&!G.units.some(v=>v.side===0&&v.hp>0&&!v.acted))setTimeout(()=>{if(!G.over&&G.phase==="player")endTurn()},350)}
async function attack(a,d){G.busy=true;const seq=[[a,d]];if(inRange(d,d,a)||inRange(d,{x:d.x,y:d.y},a))seq.push([d,a]);
 for(const [s,t] of seq){if(s.hp<=0||t.hp<=0)break;const p=hitP(s,t),hit=MK.combat.roll(p),crit=hit&&Math.random()<.06;
  s.ox=Math.sign(t.x-s.x)*.25;s.oy=Math.sign(t.y-s.y)*.25;sfx(MK.atkSnd(unit(s.id)),.45);await MK.wait(140);s.ox=s.oy=0;
  if(hit){const dm=dmgOf(s,t)*(crit?2:1);t.hp=Math.max(0,t.hp-dm);G.fx.push({x:t.x,y:t.y,t:(crit?"CRIT ":"")+dm,c:crit?"#ffd47a":"#ff8a6a",l:1.2});sfx(MK.hitSnd(unit(t.id)),.4)}else{G.fx.push({x:t.x,y:t.y,t:"miss",c:"#cfd8e8",l:1});sfx("miss-1",.3)}
  await MK.wait(320);if(t.hp<=0)await fall(t,s)}
 G.busy=false;checkEnd()}
async function fall(t,by){if(t.side===0&&G.phoenix){G.phoenix=false;t.hp=1;G.fx.push({x:t.x,y:t.y,t:"Phoenix!",c:"#ffb347",l:1.6});sfx("magic-holy-1",.5);return}
 sfx(MK.dieSnd(unit(t.id)),.5);G.fx.push({x:t.x,y:t.y,t:t.side===0?"fallen":"defeated",c:"#ffd47a",l:1.4});
 if(by&&by.side===0){G.kills[by.uid]=(G.kills[by.uid]||0)+1;S.kills++;gainXP(by,8+unit(t.id).tier*4+(t.elite||t.boss?15:0),G.ups||(G.ups=[]))}await MK.wait(250)}
function checkEnd(){if(G.over)return;const cap=S.party.find(m=>m.cap);if(!cap||cap.hp<=0){G.over=true;setTimeout(lose,700);return}
 const foes=G.units.filter(u=>u.side===1&&u.hp>0);if(!foes.length||(G.kind==="boss"&&!foes.some(f=>f.boss))){G.over=true;setTimeout(winBattle,700)}}
async function endTurn(){G.phase="enemy";G.sel=null;G.reach=null;G.mode=null;acts();info();await MK.wait(250);
 for(const e of G.units.filter(u=>u.side===1&&u.hp>0)){if(G.over)return;await aiAct(e)}
 if(G.over)return;G.turn++;$("tn").textContent=G.turn;startPlayerTurn();acts();info()}
// the enemy plan: best strike it can reach (kills first), otherwise close in on the nearest merc
async function aiAct(e){const R=reach(e),foes=G.units.filter(u=>u.side!==e.side&&u.hp>0);let best=null;
 for(const [k] of R){const [x,y]=grid.unkey(k);if(at(x,y)&&at(x,y)!==e)continue;const from={x,y};for(const t of foes){if(!inRange(e,from,t))continue;const fc=forecast(e,from,t);
  const v=fc.ad*fc.ah/100+(fc.ad>=t.hp?40:0)+(t.cap?6:0)-fc.bd*fc.bh/200+ter(x,y).av/10;if(!best||v>best.v)best={v,x,y,t}}}
 if(e.ai==="hold"&&!best){if(foes.some(f=>grid.md(f,e)<=5))e.ai="go";else return}
 if(best){await moveTo(e,best.x,best.y);await attack(e,best.t);return}
 let tgt=null,bd=1e9;for(const t of foes){const d=grid.md(t,e);if(d<bd){bd=d;tgt=t}}if(!tgt)return;
 const p=grid.path(e.x,e.y,tgt.x,tgt.y,(x,y)=>{if(!inb(x,y))return Infinity;const o=at(x,y);if(o&&o.side!==e.side&&o!==tgt)return Infinity;return ter(x,y).mv},null,60);
 let dest=null;for(const [x,y] of p){if(!R.has(grid.key(x,y)))break;if(!at(x,y))dest=[x,y]}if(dest)await moveTo(e,dest[0],dest[1])}
function winBattle(){const f=S.floor,base=G.kind==="boss"?0:Math.round((22+f*6+(G.kind==="elite"?30:0))*(has("ledger")?1.4:1));S.gold+=base;
 S.party=S.party.filter(m=>m.hp>0);S.party.forEach(m=>m.hp=Math.min(m.max,m.hp+Math.ceil(m.max*.25)));const ups=G.ups||[];S.party.forEach(m=>gainXP(m,5,ups));if(G.kind==="elite")S.hold++;
 if(G.kind==="boss"){const b=ls.get("mk.sagaBest",{wins:0,floor:0});b.wins++;b.floor=FLOORS;ls.set("mk.sagaBest",b);ls.set("mk.saga",null);
  MK.ending({img:IMG(unit("m_fdragon").spr),title:"The dragon is slain",text:`Your company of ${S.party.length} stands on the summit. ${S.kills} foes fell on the road${S.lost.length?`, and ${S.lost.join(", ")} did not come home`:""}. Sagas won: ${b.wins}.`,music:"victory",buttons:[["New saga",()=>{S=fresh();save();showMap()}],["Title",title]]});return}
 sfx("fanfare-short",.5);MK.playMusic("victory");
 modal(`<h2>${G.kind==="elite"?"Elite routed":"Victory"}</h2><p>+${base} gold, everyone patches up 25% HP${G.kind==="elite"?" and a new holding (pays every march)":""}.</p>${ups.length?`<p style="color:var(--gold2)">${ups.join("<br>")}</p>`:""}${partyHTML()}<br><button class="btn" id="ok">Continue</button>`);
 $("ok").onclick=()=>{closeModal();G.kind==="elite"?relicPick(showMap,3):showMap()}}
function lose(){const b=ls.get("mk.sagaBest",{wins:0,floor:0});b.floor=Math.max(b.floor,S.floor+1);ls.set("mk.sagaBest",b);ls.set("mk.saga",null);
 MK.ending({title:"The captain has fallen",text:`The company scatters on floor ${S.floor+1}. ${S.kills} foes fell before the end. Best floor: ${b.floor}.`,music:"defeat",buttons:[["New saga",()=>{S=fresh();save();showMap()}],["Title",title]]})}
// G.units still hold fallen mercs: drop them from the party the moment they fall so saves never resurrect them
setInterval(()=>{if(G&&!G.over&&S){const dead=S.party.filter(m=>m.hp<=0&&!m.cap);if(dead.length){dead.forEach(m=>S.lost.push(nm(m)));S.party=S.party.filter(m=>m.hp>0||m.cap)}}},300);
// ---- side panels
function info(t,from){const el=$("info");if(!el)return;const S_=G.sel;
 if(t&&S_&&t.side===1){const fc=forecast(S_,from||S_,t);el.innerHTML=`<h3>Forecast</h3><div class="fc"><b>${nm(S_)}</b><span></span><b>${nm(t)}</b><span>${fc.ad} dmg</span><small>damage</small><span>${fc.counter?fc.bd+" dmg":"no counter"}</span><span>${fc.ah}%</span><small>hit</small><span>${fc.counter?fc.bh+"%":"-"}</span><span>${S_.hp} HP</span><small>now</small><span>${t.hp} HP</span></div><div class="tip">Tap ${nm(t)} again to strike.</div>`;return}
 const u=t||S_||(G.hover&&at(...G.hover));if(!u){const tt=G.hover&&inb(...G.hover)?ter(...G.hover):null;el.innerHTML=tt?`<h3>${tt.n}</h3><div class="tip">Move cost ${tt.mv===Infinity?"impassable":tt.mv} · dodge +${tt.av}% · armour +${tt.df}${tt.heal?" · heals "+tt.heal:""}</div>`:`<h3>${G.kind==="boss"?"The summit":G.kind==="elite"?"Elite fight":"Battle"}</h3><div class="tip">Your company: ${G.units.filter(u=>u.side===0&&u.hp>0).length}. Foes: ${G.units.filter(u=>u.side===1&&u.hp>0).length}.</div>`;return}
 const s=st(u);el.innerHTML=`<div style="display:flex;gap:8px;align-items:center">${sprImg(spr(u),u.side,"")}<div><h3>${nm(u)}${u.cap?" (captain)":""}${u.boss?" (boss)":u.elite?" (elite)":""}</h3><small style="color:var(--mute)">Lv ${u.lv} · ${u.rng[1]>1?(u.rng[0]>1?"ranged":"melee + ranged"):"melee"}${u.heal?" · heals":""}${u.magic?" · magic 75%":""}</small></div></div><div class="hpb ${u.side===0?"ally":""}" style="margin:6px 0"><i style="width:${100*u.hp/u.max}%"></i></div><div class="tip">${u.hp}/${u.max} HP · ${s.atk} atk · ${s.def} def · ${s.mov} move${u.side===0?` · ${u.xp}/${xpNeed(u)} XP`:""}</div>`}
function acts(){const el=$("act");if(!el)return;const S_=G.sel;
 if(G.phase!=="player"){el.innerHTML=`<h3>Enemy turn</h3><div class="tip">Hold steady.</div>`;return}
 if(!S_){const left=G.units.filter(u=>u.side===0&&u.hp>0&&!u.acted).length;el.innerHTML=`<h3>Your turn</h3><div class="tip">${left} merc${left===1?"":"s"} ready to act.</div>`;return}
 el.innerHTML=`<h3>${nm(S_)}</h3><div class="tip">${G.mode==="move"?"Tap a blue tile to move, or a red foe to move and strike.":"Tap a foe in range to strike"+(S_.heal?", or a wounded ally next to you to heal":"")+"."}</div><div class="acts"><button class="btn alt" id="wB">Wait</button></div>`;
 $("wB").onclick=()=>{if(!G.busy)done(S_)}}
// ---- drawing
function drawTile(x,y){const ch=G.map[y][x],px=x*T,py=y*T;if(ch==="w"){const gr=g.createLinearGradient(px,py,px,py+T);gr.addColorStop(0,"#2b5c86");gr.addColorStop(1,"#1f4668");g.fillStyle=gr;g.fillRect(px,py,T,T);
  g.strokeStyle="rgba(170,210,240,.35)";g.lineWidth=1.5;const ph=(performance.now()/900+x*.7+y*1.3)%1;for(let k=0;k<3;k++){const yy=py+((k+ph)/3)*T;g.beginPath();g.moveTo(px+6+k*5,yy);g.quadraticCurveTo(px+T/2,yy-4,px+T-8,yy);g.stroke()}g.lineWidth=1;return}
 const t=TER[ch],im=MK.img(t.i);if(MK.ok(im)){const s=Math.min(im.naturalWidth,im.naturalHeight)*.62,ox=(im.naturalWidth-s)/2,oy=(im.naturalHeight-s)/2;g.drawImage(im,ox,oy,s,s,px,py,T,T)}else{g.fillStyle="#3e6a2e";g.fillRect(px,py,T,T)}
 if(t.o){const o=MK.img(t.o);if(MK.ok(o))g.drawImage(o,px-T*.15,py-T*.2,T*1.3,T*1.3)}}
function draw(){if(!G||!cv.isConnected)return;g.clearRect(0,0,cv.width,cv.height);for(let y=0;y<H;y++)for(let x=0;x<W;x++)drawTile(x,y);
 g.strokeStyle="rgba(0,0,0,.16)";for(let x=0;x<=W;x++){g.beginPath();g.moveTo(x*T,0);g.lineTo(x*T,H*T);g.stroke()}for(let y=0;y<=H;y++){g.beginPath();g.moveTo(0,y*T);g.lineTo(W*T,y*T);g.stroke()}
 const S_=G.sel;if(S_&&G.reach){for(const [k] of G.reach){const [x,y]=grid.unkey(k);g.fillStyle="rgba(79,134,224,.38)";g.fillRect(x*T+1,y*T+1,T-2,T-2)}
  G.units.forEach(u=>{if(u.hp<=0||u.side===S_.side)return;for(const [k] of G.reach){const [x,y]=grid.unkey(k);if((!at(x,y)||at(x,y)===S_)&&inRange(S_,{x,y},u)){g.strokeStyle="#ff6a4a";g.lineWidth=3;g.strokeRect(u.x*T+2,u.y*T+2,T-4,T-4);g.lineWidth=1;break}}})}
 if(S_&&G.mode==="act"){G.units.forEach(u=>{if(u.hp>0&&u.side!==S_.side&&inRange(S_,S_,u)){g.fillStyle="rgba(210,74,51,.3)";g.fillRect(u.x*T+1,u.y*T+1,T-2,T-2);g.strokeStyle="#ff6a4a";g.lineWidth=3;g.strokeRect(u.x*T+2,u.y*T+2,T-4,T-4)}
  if(S_.heal&&u.hp>0&&u.side===S_.side&&u!==S_&&grid.md(S_,u)===1&&u.hp<u.max){g.strokeStyle="#7ed957";g.lineWidth=3;g.strokeRect(u.x*T+2,u.y*T+2,T-4,T-4)}});g.lineWidth=1}
 if(G.pend){g.strokeStyle="#ffd47a";g.lineWidth=4;g.strokeRect(G.pend.x*T+2,G.pend.y*T+2,T-4,T-4);g.lineWidth=1}
 if(G.hover&&inb(...G.hover)){g.strokeStyle="rgba(236,198,110,.8)";g.lineWidth=2;g.strokeRect(G.hover[0]*T+1,G.hover[1]*T+1,T-2,T-2);g.lineWidth=1}
 G.units.filter(u=>u.hp>0).sort((a,b)=>a.y-b.y).forEach(u=>{const cx=(u.x+.5+(u.ox||0))*T,cy=(u.y+(u.oy||0))*T;
  if(u===S_){g.fillStyle="rgba(236,198,110,.35)";g.beginPath();g.ellipse(cx,cy+T*.82,T*.36,T*.12,0,0,7);g.fill()}
  if(u.cap||u.boss||u.elite){g.fillStyle=u.side===0?"#ecc66e":"#ff6a4a";g.beginPath();g.ellipse(cx,cy+T*.84,T*.32,T*.1,0,0,7);g.globalAlpha=.5;g.fill();g.globalAlpha=1}
  const sc=u.boss?1.3:1.05;MK.sprite(g,spr(u),u.side,cx,cy+T*(u.boss?.95:.86),sc,u.side===1,u.side===0&&u.acted&&G.phase==="player"?.5:1);
  MK.bar(g,u.x*T+(u.ox||0)*T+6,u.y*T+(u.oy||0)*T+T-7,T-12,u.hp/u.max,u.side===0)});
 G.fx=G.fx.filter(f=>f.l>0);G.fx.forEach(f=>{f.l-=.02;g.font="900 18px system-ui";g.textAlign="center";g.fillStyle="#000";g.fillText(f.t,(f.x+.5)*T+1,f.y*T+12-(1.2-f.l)*24+1);g.fillStyle=f.c;g.fillText(f.t,(f.x+.5)*T,f.y*T+12-(1.2-f.l)*24)});
 if(G.phase==="enemy"){g.fillStyle="rgba(120,20,20,.18)";g.fillRect(0,0,cv.width,4)}}
MK.loop(null,draw);
let lastHover="";setInterval(()=>{if(G&&!G.busy&&!G.sel&&G.hover&&cv.isConnected){const k=G.hover+"";if(k!==lastHover){lastHover=k;info()}}},150);
MK.preload(["terrain/grass/green.png","terrain/grass/dry.png","terrain/hills/regular.png","terrain/forest/pine.png","terrain/village/human.png",...["lieut","spear","bow","white"].map(id=>unit(id).spr),unit("m_fdragon").spr]);
title();
</script></body></html>
