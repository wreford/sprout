<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contract Night · Mercenary Keep</title><link rel="stylesheet" href="mk.css?v=202611152047">
<style>
#app{max-width:760px;margin:0 auto;padding:10px}
.top{display:flex;gap:12px;align-items:center;padding:8px 12px;margin-bottom:10px;font-size:13px;color:var(--mute);flex-wrap:wrap}.top b{color:var(--gold2)}.top .sp{flex:1}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cd{position:relative;padding:0;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line);color:var(--ink);text-align:left;font:inherit}
.cd img{width:100%;aspect-ratio:1;object-fit:cover;object-position:top;display:block;background:#0b0f18}
.cd .tx{padding:6px 8px}.cd b{font:800 15px Georgia,serif;color:var(--gold2)}.cd small{display:block;color:var(--mute);font-size:11px}
.cd:hover:not(:disabled){border-color:var(--gold2)}.cd:disabled{opacity:.45}.cd.gone{filter:grayscale(1);opacity:.35}
.hearts{font-size:13px;letter-spacing:1px;color:#e2584a}.hearts i{font-style:normal;color:#3a2a30}
.tag{position:absolute;top:6px;left:6px;font:800 10px system-ui;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:8px;color:var(--gold2)}
.talk{display:grid;grid-template-columns:140px 1fr;gap:12px;text-align:left;align-items:start}.talk img{width:100%;border-radius:8px}
.talk .q{font:italic 17px Georgia,serif;line-height:1.4;margin:0 0 10px}.ans{display:flex;flex-direction:column;gap:6px}
.ans button{text-align:left;padding:10px 12px;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--ink);font:14px system-ui}.ans button:hover{border-color:var(--gold2)}
.gifts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.gifts button{padding:6px 9px}
.react{font:italic 16px Georgia,serif;margin:6px 0 10px;line-height:1.4}.dlt{font:800 14px system-ui}
.ttl{text-align:center;padding:20px 16px}.ttl p{color:var(--mute)}
@media (max-width:560px){.talk{grid-template-columns:90px 1fr}.cands{grid-template-columns:repeat(2,1fr)}.talk .q{font-size:15px}}
</style></head><body>
<div id="app"></div>
<script src="roster.js?v=202611152047"></script><script src="mk.js?v=202611152047"></script><script src="engine.js?v=202611152047"></script>
<script>
"use strict";
// Contract Night: the best sellswords in the land are drinking at the Split Barrel tonight. Charm them into signing with you.
const {$,IMG,unit,pick,shuffle,sfx,ls,toast}=MK;
MK.topbar("contract");
const GIFTS={ale:{n:"Ale",i:"🍺",c:3},cake:{n:"Honey cake",i:"🍯",c:4},flowers:{n:"Wildflowers",i:"💐",c:4},book:{n:"Old book",i:"📕",c:6},whet:{n:"Whetstone",i:"🪨",c:5},dice:{n:"Bone dice",i:"🎲",c:3}};
const C=[
 {id:"spear",n:"Brannoc",role:"Spearman",likes:["loyalty","family","honesty"],hates:["greed","cruelty"],love:"ale",hate:"book",
  say:{love:["Ha! Now that's a captain talking.","My sister would like you. Don't tell her I said that."],like:["Fair answer.","I can respect that."],meh:["Hm. Maybe.","If you say so."],bad:["That's not how I do things.","My father would spit."]},sign:"Brannoc writes home to his sister about you. The letter is mostly about the food."},
 {id:"white",n:"Ysolde",role:"White Mage",likes:["kindness","knowledge","caution"],hates:["cruelty","glory"],love:"book",hate:"dice",
  say:{love:["Oh. That's... rather lovely.","You've thought about this. Good."],like:["That's sensible.","Kind of you to say."],meh:["I see.","Mm."],bad:["I've buried too many people who talked like that.","No. Just no."]},sign:"Ysolde patches up the whole company before the first battle and scolds you for not stretching."},
 {id:"grunt",n:"Grask",role:"Orcish Grunt",likes:["glory","honesty","humor"],hates:["caution","mystery"],love:"whet",hate:"flowers",
  say:{love:["HAHA! Yes! You get it!","Grask likes you. Grask likes very few."],like:["Good. Strong answer.","Heh."],meh:["Boring, but fine.","Grask has heard worse."],bad:["Coward talk.","Riddles. Grask hates riddles."]},sign:"Grask carves your name into his axe handle. It is spelled wrong, lovingly."},
 {id:"sorc",n:"Thessaly",role:"Elvish Sorceress",likes:["mystery","nature","knowledge"],hates:["greed","humor"],love:"flowers",hate:"ale",
  say:{love:["You hear the forest too, don't you?","Interesting. You are more than you seem."],like:["Perhaps.","A thoughtful answer, for a human."],meh:["How ordinary.","Hm."],bad:["Gold. Always gold, with your kind.","That isn't funny."]},sign:"Thessaly signs in ink that changes colour in moonlight. Nobody asks."},
 {id:"thief",n:"Kip",role:"Thief",likes:["gold","humor","mystery"],hates:["loyalty","honesty"],love:"dice",hate:"whet",
  say:{love:["Oh, I like you. That's dangerous for both of us.","Ha! A captain with a pulse!"],like:["Not bad.","Smooth."],meh:["Sure, sure.","Yawn, but sure."],bad:["Oaths are just chains with nicer words.","Ugh. A boy scout."]},sign:"Kip signs, then quietly returns the purse they lifted off you earlier. Mostly full."},
 {id:"dfight",n:"Durra",role:"Dwarvish Fighter",likes:["craft","honesty","family"],hates:["humor","greed"],love:"whet",hate:"flowers",
  say:{love:["Aye. That's the answer of someone who makes things.","Hah. You'd do well under the mountain."],like:["Solid.","Good enough."],meh:["Hmph.","Talk's cheap."],bad:["Don't joke about that.","Coin-grubber."]},sign:"Durra re-forges every buckle in the company. They are better buckles now."}];
const Q=[["Why do you lead a company?",[["For the people who depend on me.",["loyalty","family","kindness"]],["For the gold, obviously.",["gold","greed"]],["So the songs get written about us.",["glory"]]]],
 ["What would you do with a captured enemy?",[["Feed them, then let them go.",["kindness"]],["Ransom them. Everyone has a price.",["gold"]],["Make an example of them.",["cruelty","glory"]]]],
 ["How do you spend a rest day?",[["Reading old maps nobody else can follow.",["knowledge","mystery"]],["Dice and ale until somebody sings.",["humor","gold"]],["Sharpening every blade I own.",["craft","caution"]]]],
 ["A storm hits the march. What now?",[["Make camp. Nobody dies for a schedule.",["caution","kindness"]],["March through. They won't expect us.",["glory"]],["Find a cave. Caves have secrets.",["mystery","nature"]]]],
 ["Someone in your company lies to you. Then what?",[["I tell them straight, once.",["honesty"]],["Laugh, and dock their pay.",["humor","gold"]],["They're gone by sunrise.",["loyalty","cruelty"]]]],
 ["What's in your pack you'd never sell?",[["My father's hammer.",["family","craft"]],["A letter I never sent.",["mystery"]],["Nothing. Everything has a price.",["gold","greed"]]]],
 ["Forest or city?",[["Forest. Trees don't haggle.",["nature"]],["City. More taverns, more trouble.",["humor"]],["Wherever the work is.",["craft","caution"]]]],
 ["How do you want to be remembered?",[["As someone who kept their word.",["honesty","loyalty"]],["As the one who won.",["glory"]],["Not at all. Better that way.",["mystery"]]]],
 ["What makes a good blade?",[["Patience at the forge.",["craft","caution"]],["Whoever's holding it.",["glory","humor"]],["The story behind it.",["knowledge","family"]]]],
 ["Would you break a contract?",[["Never. A contract is a promise.",["honesty","loyalty"]],["For triple pay? Let's talk.",["gold","humor"]],["Only to save a life.",["kindness"]]]]];
let G=null;
function title(){G=null;const b=ls.get("mk.contract",{best:0});MK.playMusic("traveling_minstrels",.32);
 $("app").innerHTML=`<div class="frame ttl"><h1>Contract Night</h1><p>Six of the finest sellswords in the land are drinking at the Split Barrel. You have three nights, a thin purse and a blank contract. A rival recruiter is working the room too.</p>
 <p>Sit with someone and they'll size you up. Answer the way <i>they</i> would like. Gifts help, if you guess right.</p><button class="btn" id="go">Walk in</button><p style="font-size:13px;margin-top:12px">Best company signed: ${b.best}</p></div>`;$("go").onclick=start}
function start(){G={night:1,turns:4,gold:14,c:C.map(c=>({...c,aff:1,gone:false,asked:[],gifted:false,talked:0}))};MK.playMusic("knolls",.28);render()}
const hearts=a=>{a=Math.max(0,Math.min(10,a));return `<span class="hearts">${"♥".repeat(a)}<i>${"♥".repeat(10-a)}</i></span>`};
const mood=a=>a>=8?"smitten":a>=6?"ready to sign":a>=4?"warming up":a>=2?"wary":"cold";
function render(){$("app").innerHTML=`<div class="top frame"><span>Night <b>${G.night}</b>/3</span><span>Drinks left tonight <b>${G.turns}</b></span><span class="sp"></span><span>Purse <b>${G.gold}</b> silver</span></div>
 <div class="cands">${G.c.map((c,i)=>`<button class="cd ${c.gone?"gone":""}" data-c="${i}" ${c.gone||G.turns<=0?"disabled":""}><img src="${MK.portrait(unit(c.id))}" alt="">${c.gone?`<span class="tag">left with the rival</span>`:c.aff>=6?`<span class="tag">ready to sign</span>`:""}<div class="tx"><b>${c.n}</b><small>${c.role} · ${mood(c.aff)}</small>${hearts(c.aff)}</div></button>`).join("")}</div>
 <p style="text-align:center;color:var(--mute);font-size:13px;margin-top:10px">${G.turns>0?"Tap someone to buy them a drink and talk.":"The barkeep is stacking chairs."}</p>${G.turns<=0?`<div style="text-align:center"><button class="btn" id="end">${G.night<3?"Call it a night":"Bring out the contracts"}</button></div>`:""}`;
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>talk(G.c[+b.dataset.c]));if($("end"))$("end").onclick=endNight}
function talk(c){const pool=Q.filter((q,i)=>!c.asked.includes(i));const qi=Q.indexOf(pick(pool.length?pool:Q));c.asked.push(qi);const [q,ans]=Q[qi];G.turns--;c.talked++;sfx("potion",.25);
 MK.modal(`<div class="talk"><img src="${MK.portrait(unit(c.id))}" alt=""><div><b style="color:var(--gold2);font:800 18px Georgia,serif">${c.n}</b> ${hearts(c.aff)}<p class="q">“${q}”</p><div class="ans">${shuffle(ans.map((a,i)=>[a,i])).map(([a,i])=>`<button data-a="${i}">${a[0]}</button>`).join("")}</div></div></div>`);
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(c,ans[+b.dataset.a][1]))}
function answer(c,tags){let d=0;tags.forEach(t=>{if(c.likes.includes(t))d+=2;if(c.hates.includes(t))d-=2});d=Math.max(-3,Math.min(3,d));if(d===0)d=0;c.aff=Math.max(0,Math.min(10,c.aff+d));
 const line=pick(d>=3?c.say.love:d>0?c.say.like:d===0?c.say.meh:c.say.bad);sfx(d>0?"magic-holy-1":d<0?"club-miss":"potion",.3);reactScreen(c,line,d)}
function reactScreen(c,line,d){MK.modal(`<div class="talk"><img src="${MK.portrait(unit(c.id))}" alt=""><div><b style="color:var(--gold2);font:800 18px Georgia,serif">${c.n}</b> ${hearts(c.aff)}
 <p class="react">“${line}”</p>${d!=null?`<div class="dlt" style="color:${d>0?"#8be08b":d<0?"#ff8a6a":"var(--mute)"}">${d>0?"+":""}${d} ♥</div>`:""}
 ${c.gifted?`<p style="color:var(--mute);font-size:13px">You've already given ${c.n} a gift tonight.</p>`:`<p style="font-size:13px;color:var(--mute);margin:10px 0 0">Give a gift? (once a night)</p><div class="gifts">${Object.entries(GIFTS).map(([k,g])=>`<button class="mini" data-g="${k}" ${G.gold<g.c?"disabled":""}>${g.i} ${g.n} · ${g.c}</button>`).join("")}</div>`}
 <br><button class="btn" id="bk">Back to the room</button></div></div>`);
 document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>gift(c,b.dataset.g));$("bk").onclick=()=>{MK.closeModal();render()}}
function gift(c,k){G.gold-=GIFTS[k].c;c.gifted=true;let d=1,line="Thanks. That's thoughtful.";if(k===c.love){d=3;line=pick(["How did you know?","Oh, now you're just showing off.","You've been asking about me."])}else if(k===c.hate){d=-2;line=pick(["...Really?","I'll, uh, find a use for this.","Did someone tell you I liked this? They lied."])}
 c.aff=Math.max(0,Math.min(10,c.aff+d));sfx(d>0?"gold":"club-miss",.4);reactScreen(c,line,d)}
function endNight(){const leaving=G.c.filter(c=>!c.gone&&c.aff<3&&c.talked>0&&Math.random()<.5).concat(G.c.filter(c=>!c.gone&&c.talked===0&&G.night>=2&&Math.random()<.6));
 [...new Set(leaving)].forEach(c=>c.gone=true);
 if(G.night>=3){contracts();return}const L=[...new Set(leaving)];
 MK.modal(`<h2>Closing time</h2>${L.length?`<p>The rival recruiter slips out with <b>${L.map(c=>c.n).join(" and ")}</b>. Ouch.</p>`:"<p>Nobody left with the rival tonight. Good.</p>"}<p>You count your purse: +6 silver from a card game you mostly didn't lose.</p><button class="btn" id="ok">Night ${G.night+1}</button>`);
 $("ok").onclick=()=>{MK.closeModal();G.night++;G.turns=4;G.gold+=6;G.c.forEach(c=>c.gifted=false);render()}}
function contracts(){const signed=G.c.filter(c=>!c.gone&&(c.aff>=6||(c.aff>=5&&Math.random()<.5)));const b=ls.get("mk.contract",{best:0});b.best=Math.max(b.best,signed.length);ls.set("mk.contract",b);
 MK.playMusic(signed.length>=3?"victory":"wanderer");
 MK.modal(`<h2>${signed.length>=4?"The company of the year":signed.length>=2?"A company, of sorts":signed.length?"A company of one":"Nobody signs"}</h2>${signed.length?signed.map(c=>`<div style="display:flex;gap:10px;align-items:center;text-align:left;margin:8px 0"><img src="${MK.portrait(unit(c.id))}" alt="" style="width:56px;height:56px;object-fit:cover;object-position:top;border-radius:8px"><div><b style="color:var(--gold2)">${c.n}</b> signs.<br><small style="color:var(--mute)">${c.sign}</small></div></div>`).join(""):"<p>You drink alone. The barkeep pats your shoulder.</p>"}
 <p style="color:var(--mute)">${G.c.filter(c=>!signed.includes(c)).map(c=>c.n).join(", ")||"Nobody"} ${signed.length===G.c.length?"":"walked away."}</p><button class="btn" id="ok">Again</button> <button class="btn alt" id="tt">Title</button>`);
 $("ok").onclick=()=>{MK.closeModal();start()};$("tt").onclick=()=>{MK.closeModal();title()}}
title();
</script></body></html>
