<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Gatekeeper · Mercenary Keep</title><link rel="stylesheet" href="mk.css">
<style>
#app{max-width:720px;margin:0 auto;padding:10px}
.top{display:flex;gap:12px;align-items:center;padding:8px 12px;margin-bottom:8px;font-size:13px;color:var(--mute)}.top b{color:var(--gold2)}.top .sp{flex:1}
.tm{height:6px;background:#1a1a2a;border-radius:4px;overflow:hidden;margin-bottom:8px}.tm i{display:block;height:100%;background:linear-gradient(90deg,#c9a24a,#e2584a);transition:width .3s linear}
.desk{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start}
.who{padding:8px;text-align:center}.who img.pt{width:100%;aspect-ratio:1;object-fit:cover;object-position:top;border-radius:6px;background:#0b0f18}.who img.sp{width:72px;height:72px;image-rendering:pixelated;margin-top:4px}
.say{font-size:13px;font-style:italic;color:var(--ink);margin-top:6px;line-height:1.35}
.docs{display:flex;flex-direction:column;gap:8px}
.writ{position:relative;padding:12px 14px;background:linear-gradient(#efe2bf,#e2d0a2);color:#3a2a14;border-radius:4px;box-shadow:0 3px 8px #0008;font:14px Georgia,serif}
.writ h4{margin:0 0 6px;font:900 15px Georgia,serif;letter-spacing:.06em;text-transform:uppercase;color:#5a2a10;border-bottom:1px solid #a88a50;padding-bottom:4px}
.writ table{width:100%;border-collapse:collapse}.writ td{padding:3px 4px;border-bottom:1px dotted #b8a070;vertical-align:top}.writ td:first-child{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7a5a30;width:38%}
.seal{position:absolute;right:10px;top:8px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:3px double #0006;box-shadow:inset 0 0 6px #0006}
.lic{background:linear-gradient(#d8e2f0,#bccbe2);color:#1a2a44}.lic h4{color:#1a3060;border-color:#7a90b8}
.stamp{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-14deg);font:900 34px Georgia,serif;padding:4px 14px;border:4px solid;border-radius:6px;opacity:.85;pointer-events:none;animation:stp .25s ease-out}
@keyframes stp{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2.2);opacity:0}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.acts .btn{font-size:20px;padding:16px}.acts .ok{background:linear-gradient(#2e5a24,#1e3c18);border-color:#6fcf5a;color:#d8f5c8}.acts .no{background:linear-gradient(#6a2018,#401410);border-color:#e2584a;color:#ffd8d0}
.rules{padding:10px 12px;margin-top:10px;font-size:13px}.rules ol{margin:6px 0 0;padding-left:20px;line-height:1.55}.rules li.new{color:var(--gold2);font-weight:700}
.ttl{text-align:center;padding:20px 16px}.ttl p{color:var(--mute)}
@media (max-width:560px){.desk{grid-template-columns:110px 1fr}.writ{font-size:13px;padding:10px}.writ td:first-child{font-size:10px}}
</style></head><body>
<div id="app"></div>
<script src="roster.js"></script><script src="mk.js"></script><script src="engine.js"></script>
<script>
"use strict";
// The Gatekeeper: everyone wants into the keep. Read their papers, look at their faces, and stamp.
const {$,IMG,unit,pick,ri,sfx,ls,toast}=MK;
MK.topbar("gate");
const REG={loyal:{n:"Westmarch",s:"🦁",c:"#3a5fb0"},rebel:{n:"Elvenwood",s:"🍃",c:"#3c8a3c"},north:{n:"Northreach",s:"💀",c:"#a02a20"},knalgan:{n:"Irondeep",s:"🔨",c:"#6a6a72"},drake:{n:"Ashpeaks",s:"🔥",c:"#d0702a"}};
const FIRST="Aldo Bren Cass Dorn Edda Fenn Garr Hild Ilse Jory Kell Lio Mira Nesh Orla Pell Quin Rusk Saba Tamm Ulric Vey Wren Yara Zek".split(" "),LAST="Ashby Blackthorn Crane Dunmore Ember Fallow Grimm Holt Ivers Kettle Lark Marsh Nettle Oakes Pike Quarry Rook Sallow Thorne Vane Wick".split(" ");
const MAGIC=new Set(ROSTER.filter(r=>r.ab.includes("magic")).map(r=>r.id));
const RULES=[{d:1,t:"The writ must not be expired.",k:"exp"},{d:1,t:"The trade on the writ must match who is standing there. Look at them.",k:"trade"},{d:2,t:"The seal must match the home region.",k:"seal"},
 {d:3,t:"No undead. Not even polite ones.",k:"undead"},{d:4,t:"Spellcasters must also show a Mage's Licence with the same name.",k:"lic"},{d:5,t:"By order of the Lord: nobody from Northreach today.",k:"north"}];
const LINES={ok:["Long road. Can I come in?","I hear the pay is fair.","My cousin vouches for me.","I fight for coin, not causes.","Just here for the work.","Is the tavern still open?"],
 sly:["Everything's in order. Trust me.","Don't look too closely, friend.","It's a recent portrait.","The ink was wet when I left.","That seal is... from my uncle."],undead:["...","*rattles*","I am... very much alive.","Let me in. I'm cold."]};
let G=null;
function title(){G=null;const b=ls.get("mk.gate",{best:0});MK.playMusic("traveling_minstrels",.3);
 $("app").innerHTML=`<div class="frame ttl"><img src="${IMG("portraits/humans/lieutenant.webp")}" alt="" style="height:120px;border-radius:8px"><h1>The Gatekeeper</h1><p>The keep is hiring, and every sellsword in the land is at your gate. Your job: read their papers, look them in the face, and stamp.</p>
 <p>Five days. More rules every morning. You're paid per correct call and fined for mistakes.</p><button class="btn" id="go">Take the post</button><p style="font-size:13px;margin-top:12px">Best purse ${b.best} silver</p></div>`;$("go").onclick=()=>{G={day:0,purse:0,cites:0,total:0,right:0};nextDay()}}
function nextDay(){G.day++;G.q=8+G.day;G.n=0;G.time=100+G.day*6;G.dayPay=0;G.dayFines=0;G.rules=RULES.filter(r=>r.d<=G.day);
 MK.modal(`<h2>Day ${G.day}</h2><p>New orders from the Lord:</p><ol style="text-align:left">${RULES.filter(r=>r.d===G.day).map(r=>`<li>${r.t}</li>`).join("")}</ol><button class="btn" id="ok">Open the gate</button>`);$("ok").onclick=()=>{MK.closeModal();MK.playMusic("knolls",.25);next()}}
function makeApplicant(){const day=G.day;const facs=["loyal","rebel","north","knalgan","drake"];let fac=pick(facs);let pool=ROSTER.filter(r=>r.fac===fac&&r.tier<=3);
 let r=pick(pool),region=fac;const A={name:pick(FIRST)+" "+pick(LAST),u:r,claimTrade:r.n,region,seal:fac,exp:day+ri(1,6),lic:MAGIC.has(r.id)?{name:null}:null,flaw:null};A.lic&&(A.lic.name=A.name);
 // about half carry something wrong, using only rules already in force
 const keys=G.rules.map(x=>x.k);if(Math.random()<.5){const f=pick(keys);A.flaw=f;
  if(f==="exp")A.exp=day-ri(1,4);
  else if(f==="trade"){const other=pick(ROSTER.filter(x=>x.fac===fac&&x.id!==r.id&&x.tier<=3));if(other)A.claimTrade=other.n;else A.flaw=null}
  else if(f==="seal")A.seal=pick(facs.filter(x=>x!==fac));
  else if(f==="undead"){const un=pick(ROSTER.filter(x=>x.fac==="undead"&&x.tier<=3));A.u=un;A.claimTrade=Math.random()<.5?un.n:pick(ROSTER.filter(x=>x.fac===fac&&x.tier<=2)).n;A.undead=true}
  else if(f==="lic"){const m=pick(ROSTER.filter(x=>MAGIC.has(x.id)&&x.fac!=="undead"&&x.fac!=="beast"));A.u=m;A.claimTrade=m.n;A.region=A.seal=m.fac in REG?m.fac:"loyal";A.lic=Math.random()<.5?null:{name:pick(FIRST)+" "+A.name.split(" ")[1]}}
  else if(f==="north"){A.region=A.seal="north";A.u=pick(ROSTER.filter(x=>x.fac==="north"&&x.tier<=3));A.claimTrade=A.u.n}}
 if(!A.flaw&&keys.includes("north")&&A.region==="north"){A.flaw="north"}
 if(!A.flaw&&keys.includes("lic")&&MAGIC.has(A.u.id)&&(!A.lic||A.lic.name!==A.name))A.flaw="lic";
 A.line=A.undead?pick(LINES.undead):A.flaw?pick(LINES.sly.concat(LINES.ok)):pick(LINES.ok);return A}
const WHY={exp:"The writ had expired.",trade:"The writ named a different trade from the person in front of you.",seal:"The seal didn't match the home region.",undead:"That was one of the walking dead.",lic:"A spellcaster without a matching Mage's Licence.",north:"Northreach folk were barred today."};
function next(){if(G.n>=G.q||G.time<=0){endDay();return}G.n++;G.cur=makeApplicant();G.stamped=false;render();sfx("club-miss",.2)}
function render(){const A=G.cur,R=REG[A.seal]||REG.loyal;const portrait=A.u.pt?MK.portrait(A.u):IMG(A.u.spr);
 $("app").innerHTML=`<div class="top frame"><span>Day <b>${G.day}</b>/5</span><span>Applicant <b>${G.n}</b>/${G.q}</span><span class="sp"></span><span>Purse <b>${G.purse+G.dayPay-G.dayFines}</b> silver</span></div><div class="tm"><i id="tm" style="width:${100*G.time/(100+G.day*6)}%"></i></div>
 <div class="desk"><div class="who frame"><img class="pt" src="${portrait}" alt="" onerror="this.src='${IMG(A.u.spr)}'">${MK.sprImg(A.u.spr,0,"sp")}<div class="say">“${A.line}”</div><button class="mini" id="gb" style="margin-top:8px;width:100%">📖 Guild book</button></div>
 <div class="docs"><div class="writ" id="writ"><div class="seal" style="background:${R.c}">${R.s}</div><h4>Writ of Passage</h4><table><tr><td>Name</td><td>${A.name}</td></tr><tr><td>Home</td><td>${(REG[A.region]||REG.loyal).n}</td></tr><tr><td>Trade</td><td>${A.claimTrade}</td></tr><tr><td>Valid until</td><td>Day ${A.exp}</td></tr></table></div>
 ${A.lic?`<div class="writ lic"><h4>Mage's Licence</h4><table><tr><td>Bearer</td><td>${A.lic.name}</td></tr><tr><td>Discipline</td><td>${A.u.n}</td></tr></table></div>`:""}</div></div>
 <div class="acts"><button class="btn ok" id="ap">APPROVE</button><button class="btn no" id="dn">DENY</button></div>
 <div class="rules frame"><b>Standing orders</b> <small style="color:var(--mute)">(today is day ${G.day}; seals: ${Object.values(REG).map(r=>r.s+" "+r.n).join(", ")})</small><ol>${G.rules.map(r=>`<li class="${r.d===G.day?"new":""}">${r.t}</li>`).join("")}</ol></div>`;
 $("gb").onclick=()=>book(A.region);$("ap").onclick=()=>decide(true);$("dn").onclick=()=>decide(false)}
// the guild book: every trade from a region, with a picture, so you can compare faces to papers
function book(reg){const show=k=>{MK.modal(`<h2>Guild book</h2><div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:8px">${Object.entries(REG).map(([id,R])=>`<button class="mini" data-r="${id}" style="${id===k?"border-color:var(--gold2)":""}">${R.s} ${R.n}</button>`).join("")}</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px">${ROSTER.filter(u=>u.fac===k&&u.tier<=3).map(u=>`<div style="background:var(--card);border-radius:6px;padding:4px;font-size:11px">${MK.sprImg(u.spr,0,"")}<br>${u.n}</div>`).join("")}</div><br><button class="btn" id="bk">Close</button>`);
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>show(b.dataset.r));$("bk").onclick=MK.closeModal};show(reg in REG?reg:"loyal")}
function decide(ok){if(G.stamped)return;G.stamped=true;const A=G.cur,right=ok===!A.flaw;G.total++;
 $("writ").insertAdjacentHTML("beforeend",`<div class="stamp" style="color:${ok?"#2e7a24":"#b02a20"};border-color:${ok?"#2e7a24":"#b02a20"}">${ok?"ENTER":"DENIED"}</div>`);sfx(ok?"mace":"club",.5);
 if(right){G.right++;G.dayPay+=5;setTimeout(next,650)}else{G.dayFines+=8;G.cites++;sfx("lightning-miss",.3);
  setTimeout(()=>{MK.modal(`<h2 style="color:#e2584a">Citation</h2><p>${ok?WHY[A.flaw]:"Their papers were in order. You turned away a good sellsword."}</p><p style="color:var(--mute)">−8 silver</p><button class="btn" id="ok">Back to work</button>`);$("ok").onclick=()=>{MK.closeModal();next()}},500)}}
function endDay(){const net=G.dayPay-G.dayFines,rent=6+G.day*2;G.purse+=net-rent;
 const last=G.day>=5;MK.modal(`<h2>End of day ${G.day}</h2><table style="margin:0 auto;text-align:left;line-height:1.8"><tr><td>Wages</td><td style="text-align:right">+${G.dayPay}</td></tr><tr><td>Fines</td><td style="text-align:right">−${G.dayFines}</td></tr><tr><td>Bunk and board</td><td style="text-align:right">−${rent}</td></tr><tr><td><b>Purse</b></td><td style="text-align:right"><b>${G.purse}</b></td></tr></table>
  ${last?`<p>${G.purse>=60?"The Lord is pleased. You keep the post, and a key to the wine cellar.":G.purse>=0?"You kept the post. Barely.":"You owe the keep money. The Lord gives your post to a goat."}</p><p>${G.right}/${G.total} correct calls.</p>`:""}
  <button class="btn" id="ok">${last?"Title":"Sleep"}</button>`);
 $("ok").onclick=()=>{MK.closeModal();if(last){const b=ls.get("mk.gate",{best:0});b.best=Math.max(b.best,G.purse);ls.set("mk.gate",b);title()}else nextDay()}}
setInterval(()=>{if(!G||!G.cur||$("mkModal")&&$("mkModal").classList.contains("on"))return;G.time-=1;const t=$("tm");if(t)t.style.width=Math.max(0,100*G.time/(100+G.day*6))+"%";if(G.time<=0&&!G.stamped){G.stamped=true;endDay()}},1000);
title();
</script></body></html>
